[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesian-phystwin"
version = "0.4.0"
description = "Reliability-aware Bayesian estimation utilities for PhysTwin-style deformable digital twins."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Florian Pfaff" },
]
dependencies = [
    "numpy>=1.23",
]

[project.urls]
Repository = "https://github.com/FlorianPfaff/Bayesian-PhysTwin"
Documentation = "https://github.com/FlorianPfaff/Bayesian-PhysTwin/tree/main/docs"
Issues = "https://github.com/FlorianPfaff/Bayesian-PhysTwin/issues"

[project.scripts]
bpt = "bayesian_phystwin.cli.main:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]
data = [
    "remotezip>=0.12.3",
]
graph = [
    "scipy>=1.10",
]
vision = [
    "opencv-python-headless>=4.8",
]
pyrecest = [
    "pyrecest==2.4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_unused_ignores = true
