bpt-overlay-phystwin-external-backbone = "bayesian_phystwin.cli.phystwin_external_backbone:main"
bpt-gate-phystwin-backbone-family = "bayesian_phystwin.cli.phystwin_backbone_family_gate:main"
bpt-open-phystwin-backbone-family-future = "bayesian_phystwin.cli.phystwin_backbone_family_future:main"
bpt-report-matphys-loo-sota = "bayesian_phystwin.cli.matphys_loo_sota_report:main"
bpt-gate-matphys-part-family = "bayesian_phystwin.cli.matphys_part_family_gate:main"
bpt-open-matphys-part-family-future = "bayesian_phystwin.cli.matphys_part_family_future:main"
bpt-gate-phystwin-shared-nonlinear-residual = "bayesian_phystwin.cli.phystwin_shared_nonlinear_residual:main"
bpt-gate-phystwin-canonical-triplane-residual = "bayesian_phystwin.cli.phystwin_canonical_triplane_residual:main"
bpt-build-phystwin-spring-overlay = "bayesian_phystwin.cli.phystwin_spring_overlay:main"
bpt-gate-phystwin-part-pair-source = "bayesian_phystwin.cli.phystwin_part_pair_source_gate:main"
bpt-build-phystwin-piecewise-topology = "bayesian_phystwin.cli.phystwin_piecewise_topology:main"
bpt-gate-phystwin-sparse-topology-source = "bayesian_phystwin.cli.phystwin_sparse_topology_source_gate:main"
bpt-search-phystwin-topology-field = "bayesian_phystwin.cli.phystwin_zero_order_topology:main"
bpt-gate-phystwin-zero-order-source = "bayesian_phystwin.cli.phystwin_zero_order_source_gate:main"
bpt-diagnose-phystwin-bias = "bayesian_phystwin.cli.phystwin_bias_diagnostic:main"
bpt-evaluate-deform360-online-belief = "bayesian_phystwin.cli.deform360_online_belief:main"
bpt-audit-deform360-official-parity = "bayesian_phystwin.cli.deform360_official_parity:main"
