[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesian-phystwin"
version = "0.1.0"
description = "Reliability-aware Bayesian estimation utilities for PhysTwin-style deformable digital twins."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
]

[project.scripts]
bpt-build-phystwin-cues = "bayesian_phystwin.cli.phystwin_cues:main"
bpt-calibrate-phystwin-discrepancy = "bayesian_phystwin.cli.phystwin_discrepancy:main"
bpt-export-phystwin-residuals = "bayesian_phystwin.cli.phystwin_export:main"
bpt-phystwin-refit = "bayesian_phystwin.cli.phystwin_refit:main"
bpt-evaluate-phystwin-official = "bayesian_phystwin.cli.phystwin_official_evaluation:main"
bpt-evaluate-phystwin-priors = "bayesian_phystwin.cli.phystwin_prior_evaluation:main"
bpt-combine-phystwin-profiles = "bayesian_phystwin.cli.phystwin_joint_profile:main"
bpt-confirm-phystwin-residual = "bayesian_phystwin.cli.phystwin_confirmatory:main"
bpt-confirm-phystwin-residual-baselines = "bayesian_phystwin.cli.phystwin_baseline_confirmation:main"
bpt-confirm-phystwin-bayesian-anchor = "bayesian_phystwin.cli.phystwin_bayesian_confirmation:main"
bpt-confirm-phystwin-additional-anchor = "bayesian_phystwin.cli.phystwin_additional_confirmation:main"
bpt-confirm-phystwin-additional-bayesian = "bayesian_phystwin.cli.phystwin_additional_bayesian_confirmation:main"
bpt-compare-phystwin-additional-controls = "bayesian_phystwin.cli.phystwin_additional_control_comparison:main"
bpt-analyze-phystwin-horizon = "bayesian_phystwin.cli.phystwin_horizon_analysis:main"
bpt-analyze-phystwin-spatial-modes = "bayesian_phystwin.cli.phystwin_spatial_mode_analysis:main"
bpt-compare-phystwin-graph-anchors = "bayesian_phystwin.cli.phystwin_graph_anchor_comparison:main"
bpt-evaluate-phystwin-state-injection = "bayesian_phystwin.cli.phystwin_state_injection:main"
bpt-fit-phystwin-residual-dynamics = "bayesian_phystwin.cli.phystwin_residual_dynamics:main"
bpt-fit-phystwin-residual-baselines = "bayesian_phystwin.cli.phystwin_residual_baselines:main"
bpt-build-phystwin-raw-cues = "bayesian_phystwin.cli.phystwin_raw_cues:main"
bpt-fit-phystwin-bayesian-anchor = "bayesian_phystwin.cli.phystwin_bayesian_anchor:main"
bpt-compare-phystwin-trajectories = "bayesian_phystwin.cli.phystwin_comparison:main"
bpt-diagnose-phystwin-bias = "bayesian_phystwin.cli.phystwin_bias_diagnostic:main"
bpt-fetch-phystwin-eval-data = "bayesian_phystwin.cli.phystwin_data:main"
bpt-replay-residuals = "bayesian_phystwin.cli.residual_replay:main"
bpt-synthetic-benchmark = "bayesian_phystwin.cli.synthetic_benchmark:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
data = [
    "remotezip>=0.12.3",
]
graph = [
    "scipy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
