[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesian-phystwin"
version = "0.4.1.dev0"
description = "Reliability-aware Bayesian estimation utilities for PhysTwin-style deformable digital twins."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "Florian Pfaff" },
]
keywords = [
    "bayesian-estimation",
    "deformable-objects",
    "digital-twins",
    "robotics",
    "uncertainty-quantification",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.23",
]

[project.urls]
Repository = "https://github.com/IPS-Stuttgart/BayesianPhysTwin"
Documentation = "https://github.com/IPS-Stuttgart/BayesianPhysTwin/tree/main/docs"
Issues = "https://github.com/IPS-Stuttgart/BayesianPhysTwin/issues"
Changelog = "https://github.com/IPS-Stuttgart/BayesianPhysTwin/blob/main/CHANGELOG.md"
Citation = "https://github.com/IPS-Stuttgart/BayesianPhysTwin/blob/main/CITATION.cff"
License = "https://github.com/IPS-Stuttgart/BayesianPhysTwin/blob/main/LICENSE"
Support = "https://github.com/IPS-Stuttgart/BayesianPhysTwin/blob/main/SUPPORT.md"

[project.scripts]
bpt = "bayesian_phystwin.cli.main:main"

[project.optional-dependencies]
dev = [
    "h5py>=3.10",
    "mypy>=1.11",
    "numpy>=1.23,<2.3; python_version < '3.14'",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "PyYAML>=6.0",
    "ruff>=0.6",
]
data = [
    "remotezip>=0.12.3",
]
graph = [
    "scipy>=1.10",
]
mpm = [
    "newton==1.5.0",
]
mujoco-flex = [
    "mujoco==3.9.0",
]
vision = [
    "h5py>=3.10",
    "opencv-python-headless>=4.8",
]
pyrecest = [
    "pyrecest==2.4.1",
]

[tool.setuptools.packages.find]
where = ["src"]
exclude = [
    "bayesian_phystwin.experiments",
    "bayesian_phystwin.experiments.*",
    "bayesian_phystwin_experiments",
    "bayesian_phystwin_experiments.*",
]

[tool.setuptools.package-data]
bayesian_phystwin = [
    "py.typed",
    "contract_data/backend_support_v1/*.json",
    "contract_data/ecosystem_compatibility_v1/*.json",
    "contract_data/evidence_decision_v1/*.json",
    "contract_data/evidence_decision_v2/*.json",
    "contract_data/observation_belief_v1/*.json",
    "contract_data/observation_belief_v1/vectors/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_unused_ignores = true

# Mypy's aggregate `strict` switch is not reliably scoped per module. Enumerate
# the per-module-capable strict options for the supported artifact and
# cross-repository integration boundary. The changed-source ratchet additionally
# invokes `mypy --strict` on the same files, covering global-only strict flags.
[[tool.mypy.overrides]]
module = [
    "bayesian_phystwin.backend_support_v1",
    "bayesian_phystwin.run_manifest",
    "bayesian_phystwin.repository_provenance",
    "bayesian_phystwin.run_manifest_v2",
    "bayesian_phystwin.claim_bundle_v1",
    "bayesian_phystwin.evidence_decision_v1",
    "bayesian_phystwin.evidence_decision_v2",
    "bayesian_phystwin.evidence_decision",
    "bayesian_phystwin.physical_cause_selection_v1",
    "bayesian_phystwin.physical_cause_selection_v2",
    "bayesian_phystwin.physical_query_v1",
    "bayesian_phystwin.material_backend_evidence_v1",
    "bayesian_phystwin.simulator_competence_v1",
    "bayesian_phystwin.fourddress_competence_protocol_v1",
    "bayesian_phystwin.hood_source_qualification_v1",
    "bayesian_phystwin.v1",
    "bayesian_phystwin.causal4d_provider_v1",
    "bayesian_phystwin.causal4d_belief_provider_v3",
    "bayesian_phystwin.prob4d_causal_lineage",
    "bayesian_phystwin.query_covariance_crossfit",
    "bayesian_phystwin._query_covariance_crossfit_common",
    "bayesian_phystwin._query_covariance_crossfit_selection",
    "bayesian_phystwin._query_covariance_crossfit_scoring",
]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
extra_checks = true
no_implicit_reexport = true
strict_equality = true
warn_return_any = true
warn_unused_ignores = true
