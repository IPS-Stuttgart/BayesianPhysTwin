bpt-predict-deform360-crossview-guard = "bayesian_phystwin.cli.deform360_crossview_guard:main"
bpt-diagnose-deform360-raw-pairwise = "bayesian_phystwin.cli.deform360_raw_pairwise_correspondence_diagnostic:main"
bpt-download-deform360-selective-virtual-sensing = "bayesian_phystwin.cli.deform360_selective_virtual_sensing_download:main"
bpt-benchmark-bias-aware-belief = "bayesian_phystwin.cli.bias_aware_belief_benchmark:main"
bpt-develop-deform360-bias-aware-belief = "bayesian_phystwin.cli.deform360_bias_aware_belief_development:main"
bpt-deform360-bias-aware-prospective = "bayesian_phystwin.cli.deform360_bias_aware_prospective:main"
bpt-deform360-bias-aware-result = "bayesian_phystwin.cli.deform360_bias_aware_prospective_result:main"
bpt-fetch-phystwin-eval-data = "bayesian_phystwin.cli.phystwin_data:main"
bpt-replay-residuals = "bayesian_phystwin.cli.residual_replay:main"
bpt-synthetic-benchmark = "bayesian_phystwin.cli.synthetic_benchmark:main"
bpt-structural-recovery-benchmark = "bayesian_phystwin.cli.structural_benchmark:main"
bpt-diagnose-phystwin-structure = "bayesian_phystwin.cli.phystwin_structural_diagnostic:main"
bpt-aggregate-phystwin-structure = "bayesian_phystwin.cli.structural_diagnostic_aggregate:main"
bpt-audit-phystwin-state-decay = "bayesian_phystwin.cli.phystwin_state_decay:main"
bpt-audit-phystwin-state-modes = "bayesian_phystwin.cli.phystwin_state_modes:main"
bpt-aggregate-phystwin-state-modes = "bayesian_phystwin.cli.phystwin_state_mode_aggregate:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
data = [
    "remotezip>=0.12.3",
]
graph = [
    "scipy>=1.10",
]
pyrecest = [
    "pyrecest==2.4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
