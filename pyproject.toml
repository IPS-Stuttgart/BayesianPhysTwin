[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesian-phystwin"
version = "0.3.0"
description = "Reliability-aware Bayesian estimation utilities for PhysTwin-style deformable digital twins."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
]

[project.scripts]
bpt-build-phystwin-cues = "bayesian_phystwin.cli.phystwin_cues:main"
bpt-calibrate-phystwin-discrepancy = "bayesian_phystwin.cli.phystwin_discrepancy:main"
bpt-export-phystwin-residuals = "bayesian_phystwin.cli.phystwin_export:main"
bpt-phystwin-refit = "bayesian_phystwin.cli.phystwin_refit:main"
bpt-evaluate-phystwin-official = "bayesian_phystwin.cli.phystwin_official_evaluation:main"
bpt-evaluate-phystwin-priors = "bayesian_phystwin.cli.phystwin_prior_evaluation:main"
bpt-combine-phystwin-profiles = "bayesian_phystwin.cli.phystwin_joint_profile:main"
bpt-confirm-phystwin-residual = "bayesian_phystwin.cli.phystwin_confirmatory:main"
bpt-confirm-phystwin-residual-baselines = "bayesian_phystwin.cli.phystwin_baseline_confirmation:main"
bpt-confirm-phystwin-bayesian-anchor = "bayesian_phystwin.cli.phystwin_bayesian_confirmation:main"
bpt-audit-phystwin-calibration = "bayesian_phystwin.cli.phystwin_calibration:main"
bpt-confirm-phystwin-combined = "bayesian_phystwin.cli.phystwin_combined_confirmation:main"
bpt-confirm-phystwin-additional-anchor = "bayesian_phystwin.cli.phystwin_additional_confirmation:main"
bpt-confirm-phystwin-additional-bayesian = "bayesian_phystwin.cli.phystwin_additional_bayesian_confirmation:main"
bpt-compare-phystwin-additional-controls = "bayesian_phystwin.cli.phystwin_additional_control_comparison:main"
bpt-analyze-phystwin-horizon = "bayesian_phystwin.cli.phystwin_horizon_analysis:main"
bpt-analyze-phystwin-controller-sensitivity = "bayesian_phystwin.cli.phystwin_controller_sensitivity:main"
bpt-infer-phystwin-controller-bias = "bayesian_phystwin.cli.phystwin_controller_inference:main"
bpt-analyze-phystwin-spatial-modes = "bayesian_phystwin.cli.phystwin_spatial_mode_analysis:main"
bpt-compare-phystwin-graph-anchors = "bayesian_phystwin.cli.phystwin_graph_anchor_comparison:main"
bpt-evaluate-phystwin-state-injection = "bayesian_phystwin.cli.phystwin_state_injection:main"
bpt-fit-phystwin-residual-dynamics = "bayesian_phystwin.cli.phystwin_residual_dynamics:main"
bpt-fit-phystwin-hierarchical-residual = "bayesian_phystwin.cli.phystwin_residual_shrinkage:main"
bpt-compare-phystwin-residual-scales = "bayesian_phystwin.cli.phystwin_residual_scale_comparison:main"
bpt-fit-phystwin-residual-baselines = "bayesian_phystwin.cli.phystwin_residual_baselines:main"
bpt-build-phystwin-raw-cues = "bayesian_phystwin.cli.phystwin_raw_cues:main"
bpt-build-phystwin-cotracker3-cues = "bayesian_phystwin.cli.phystwin_cotracker3_cues:main"
bpt-evaluate-phystwin-perception-cues = "bayesian_phystwin.cli.phystwin_perception_evaluation:main"
bpt-associate-phystwin-motioncrafter = "bayesian_phystwin.cli.phystwin_motioncrafter_association:main"
bpt-assimilate-phystwin-motioncrafter = "bayesian_phystwin.cli.phystwin_motioncrafter_assimilation:main"
bpt-evaluate-phystwin-motioncrafter-assimilation = "bayesian_phystwin.cli.phystwin_motioncrafter_assimilation_evaluation:main"
bpt-select-phystwin-motioncrafter-view = "bayesian_phystwin.cli.phystwin_motioncrafter_selection:main"
bpt-fit-phystwin-bayesian-anchor = "bayesian_phystwin.cli.phystwin_bayesian_anchor:main"
bpt-compare-phystwin-trajectories = "bayesian_phystwin.cli.phystwin_comparison:main"
bpt-diagnose-phystwin-bias = "bayesian_phystwin.cli.phystwin_bias_diagnostic:main"
bpt-fetch-phystwin-eval-data = "bayesian_phystwin.cli.phystwin_data:main"
bpt-replay-residuals = "bayesian_phystwin.cli.residual_replay:main"
bpt-synthetic-benchmark = "bayesian_phystwin.cli.synthetic_benchmark:main"
causal4d-counterfactual-benchmark = "causal4d.cli.counterfactual_benchmark:main"
causal4d-latent-contact-benchmark = "causal4d.cli.latent_contact_benchmark:main"
causal4d-phystwin-rollout-bank = "causal4d.cli.phystwin_rollout_bank:main"
causal4d-export-bpt-belief = "causal4d.cli.export_bpt_belief:main"
causal4d-abduct-phystwin-intervention = "causal4d.cli.abduct_phystwin_intervention:main"
causal4d-counterfactual-phystwin = "causal4d.cli.counterfactual_phystwin:main"
causal4d-evaluate-physical-counterfactual = "causal4d.cli.evaluate_physical_counterfactual:main"
causal4d-build-molmo-task-posterior = "causal4d.cli.molmo_task_posterior:main"
causal4d-fit-semantic-trust = "causal4d.cli.fit_semantic_trust:main"
causal4d-adaptive-molmo-task-posterior = "causal4d.cli.adaptive_molmo_task_posterior:main"
causal4d-molmo-phystwin-forecast = "causal4d.cli.molmo_phystwin_forecast:main"
causal4d-evaluate-phystwin-molmo = "causal4d.cli.evaluate_phystwin_molmo:main"
causal4d-audit-real-oracle-gap = "causal4d.cli.audit_real_oracle_gap:main"
causal4d-real-protocol = "causal4d.cli.real_protocol:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
data = [
    "remotezip>=0.12.3",
]
graph = [
    "scipy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
