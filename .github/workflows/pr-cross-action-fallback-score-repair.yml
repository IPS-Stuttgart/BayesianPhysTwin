# workflow-lifecycle: temporary
# workflow-owner: IPS-Stuttgart maintainers
name: Cross-action fallback score repair one-shot

on:
  push:
    branches:
      - fix/cross-action-placebo-fallback-scores-v1

permissions:
  contents: write

concurrency:
  group: cross-action-fallback-score-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.ref_name == 'fix/cross-action-placebo-fallback-scores-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/cross-action-placebo-fallback-scores-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply fail-closed score-contract repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          module = "src/bayesian_phystwin_experiments/cross_action_placebo_v1.py"
          tests = "tests/test_cross_action_placebo_v1.py"
          docs = "docs/cross_action_placebo_v1.md"

          replace_once(
              module,
              "CROSS_ACTION_PLACEBO_VERSION: Final = 1\nCROSS_ACTION_PLACEBO_CLAIM_BOUNDARY: Final = (",
              "CROSS_ACTION_PLACEBO_VERSION: Final = 1\nCROSS_ACTION_PLACEBO_SCORE_ORIENTATION: Final = \"lower_is_better\"\nCROSS_ACTION_PLACEBO_CLAIM_BOUNDARY: Final = (",
          )
          replace_once(
              module,
              "    minimum_placebo_contrast: float\n    method_frozen_before_target: bool = True",
              "    minimum_placebo_contrast: float\n    score_orientation: str = CROSS_ACTION_PLACEBO_SCORE_ORIENTATION\n    method_frozen_before_target: bool = True",
          )
          replace_once(
              module,
              "        object.__setattr__(\n"
              "            self,\n"
              "            \"minimum_placebo_contrast\",\n"
              "            _finite(\n"
              "                self.minimum_placebo_contrast,\n"
              "                name=\"minimum_placebo_contrast\",\n"
              "                minimum=0.0,\n"
              "            ),\n"
              "        )\n"
              "        for name in (\n",
              "        object.__setattr__(\n"
              "            self,\n"
              "            \"minimum_placebo_contrast\",\n"
              "            _finite(\n"
              "                self.minimum_placebo_contrast,\n"
              "                name=\"minimum_placebo_contrast\",\n"
              "                minimum=0.0,\n"
              "            ),\n"
              "        )\n"
              "        orientation = _label(self.score_orientation, name=\"score_orientation\")\n"
              "        if orientation != CROSS_ACTION_PLACEBO_SCORE_ORIENTATION:\n"
              "            raise ValueError(\"score_orientation must be 'lower_is_better'\")\n"
              "        object.__setattr__(self, \"score_orientation\", orientation)\n"
              "        for name in (\n",
          )
          replace_once(
              module,
              "            \"minimum_placebo_contrast\": self.minimum_placebo_contrast,\n            \"method_frozen_before_target\": self.method_frozen_before_target,",
              "            \"minimum_placebo_contrast\": self.minimum_placebo_contrast,\n            \"score_orientation\": self.score_orientation,\n            \"method_frozen_before_target\": self.method_frozen_before_target,",
          )
          replace_once(
              module,
              "                if (\n"
              "                    fallback\n"
              "                    and len(\n"
              "                        {\n"
              "                            prediction.prediction_artifact_id\n"
              "                            for prediction in predictions\n"
              "                        }\n"
              "                    )\n"
              "                    != 1\n"
              "                ):\n"
              "                    raise ValueError(\n"
              "                        \"exact fallback must select one identical prediction artifact\"\n"
              "                    )\n",
              "                if fallback:\n"
              "                    if (\n"
              "                        len(\n"
              "                            {\n"
              "                                prediction.prediction_artifact_id\n"
              "                                for prediction in predictions\n"
              "                            }\n"
              "                        )\n"
              "                        != 1\n"
              "                    ):\n"
              "                        raise ValueError(\n"
              "                            \"exact fallback must select one identical prediction artifact\"\n"
              "                        )\n"
              "                    if len({row.proper_score for row in pair_rows}) != 1:\n"
              "                        raise ValueError(\n"
              "                            \"exact fallback must produce one identical proper score\"\n"
              "                        )\n",
          )
          replace_once(
              module,
              "    \"CROSS_ACTION_PLACEBO_CLAIM_BOUNDARY\",\n    \"CROSS_ACTION_PLACEBO_SCHEMA\",",
              "    \"CROSS_ACTION_PLACEBO_CLAIM_BOUNDARY\",\n    \"CROSS_ACTION_PLACEBO_SCHEMA\",\n    \"CROSS_ACTION_PLACEBO_SCORE_ORIENTATION\",",
          )

          replace_once(
              tests,
              "                        proper_score=(\n"
              "                            physical_score\n"
              "                            if arm == protocol.physical_arm_label\n"
              "                            else scores[arm]\n"
              "                        ),\n",
              "                        proper_score=(\n"
              "                            physical_score\n"
              "                            if not physical_selected\n"
              "                            or arm == protocol.physical_arm_label\n"
              "                            else scores[arm]\n"
              "                        ),\n",
          )
          replace_once(
              tests,
              "        CrossActionPlaceboResultV1(\n"
              "            protocol,\n"
              "            [rows[0], replace(rows[1], prediction=changed), *rows[2:]],\n"
              "        )\n"
              "\n"
              "\n"
              "def test_result_identity_is_invariant_to_score_row_order() -> None:\n",
              "        CrossActionPlaceboResultV1(\n"
              "            protocol,\n"
              "            [rows[0], replace(rows[1], prediction=changed), *rows[2:]],\n"
              "        )\n"
              "\n"
              "    changed_score = replace(rows[1], proper_score=rows[1].proper_score + 1.0)\n"
              "    with pytest.raises(ValueError, match=\"identical proper score\"):\n"
              "        CrossActionPlaceboResultV1(\n"
              "            protocol,\n"
              "            [rows[0], changed_score, *rows[2:]],\n"
              "        )\n"
              "\n"
              "\n"
              "def test_result_identity_is_invariant_to_score_row_order() -> None:\n",
          )
          replace_once(
              tests,
              "    with pytest.raises(ValueError, match=\"duplicates\"):\n"
              "        replace(protocol, action_ids=(\"same\", \"same\"))\n"
              "    with pytest.raises(ValueError, match=\"exactly every registered arm\"):\n",
              "    with pytest.raises(ValueError, match=\"duplicates\"):\n"
              "        replace(protocol, action_ids=(\"same\", \"same\"))\n"
              "    with pytest.raises(ValueError, match=\"score_orientation\"):\n"
              "        replace(protocol, score_orientation=\"higher_is_better\")\n"
              "    with pytest.raises(ValueError, match=\"exactly every registered arm\"):\n",
          )

          replace_once(
              docs,
              "one frozen scorer, and the proper score. Target-side method or threshold\nselection is rejected.\n",
              "one frozen scorer, and the proper score. The protocol content-binds the\n`lower_is_better` orientation used by the contrast; other orientations are\nrejected rather than silently reversing the decision. Target-side method or\nthreshold selection is rejected.\n",
          )
          replace_once(
              docs,
              "- an exact-fallback pair selects one byte-identical prediction artifact for all\n  controls; and\n",
              "- an exact-fallback pair selects one byte-identical prediction artifact and one\n  identical proper score for all controls; and\n",
          )

          Path(".github/workflows/pr-cross-action-fallback-score-repair.yml").unlink()
          PY

          python -m pip install --disable-pip-version-check -e '.[dev]'
          python -m ruff format \
            src/bayesian_phystwin_experiments/cross_action_placebo_v1.py \
            tests/test_cross_action_placebo_v1.py
          python -m ruff check \
            src/bayesian_phystwin_experiments/cross_action_placebo_v1.py \
            tests/test_cross_action_placebo_v1.py
          python -m pytest -q tests/test_cross_action_placebo_v1.py
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden cross-action fallback score contract"
          git push origin HEAD:fix/cross-action-placebo-fallback-scores-v1
