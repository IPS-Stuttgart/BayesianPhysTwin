name: Fix registered residual-history typing once

on:
  push:
    branches:
      - fix/registered-residual-history-donor-fallback-v1

permissions:
  contents: write

concurrency:
  group: fix-registered-residual-history-typing-once
  cancel-in-progress: false

jobs:
  fix:
    if: github.repository == 'IPS-Stuttgart/BayesianPhysTwin'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/registered-residual-history-donor-fallback-v1
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply explicit NumPy typing and validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: Path, old: str, new: str, *, count: int = 1) -> None:
              text = path.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(
                      f"{path}: expected {count} occurrences of {old!r}, found {actual}"
                  )
              path.write_text(text.replace(old, new), encoding="utf-8")

          root = Path(
              "src/bayesian_phystwin/"
              "deform360_registered_residual_history_v1"
          )
          common = root / "_common.py"
          replace_exact(
              common,
              "from typing import Any, Final\n",
              "from typing import Any, Final, cast\n",
          )
          replace_exact(
              common,
              "import numpy as np\n",
              "import numpy as np\nfrom numpy.typing import NDArray\n",
          )
          replace_exact(
              common,
              ")\n\nREGISTERED_REFERENCE_PREDICTOR_ID: Final",
              ")\n\n"
              "_Array = NDArray[Any]\n"
              "_FloatArray = NDArray[np.float64]\n"
              "_BoolArray = NDArray[np.bool_]\n"
              "_IntArray = NDArray[np.int64]\n\n"
              "REGISTERED_REFERENCE_PREDICTOR_ID: Final",
          )
          replace_exact(
              common,
              "    return literal_lower_hex(value, name=name, lengths={length})\n",
              "    return cast(\n"
              "        str,\n"
              "        literal_lower_hex(value, name=name, lengths={length}),\n"
              "    )\n",
          )
          replacements = {
              "def _array_sha256(value: np.ndarray) -> str:":
                  "def _array_sha256(value: _Array) -> str:",
              ") -> np.ndarray:\n    if not isinstance(value, np.ndarray):\n":
                  ") -> _FloatArray:\n    if not isinstance(value, np.ndarray):\n",
              "def _boolean_array(value: object, *, name: str) -> np.ndarray:":
                  "def _boolean_array(value: object, *, name: str) -> _BoolArray:",
              "def _canonical_horizon_bins(future_count: int) -> np.ndarray:":
                  "def _canonical_horizon_bins(future_count: int) -> _IntArray:",
              "    bins = np.empty(count, dtype=np.int64)\n":
                  "    bins: _IntArray = np.empty(count, dtype=np.int64)\n",
              "    positions = np.arange(count, dtype=np.int64)\n":
                  "    positions: _IntArray = np.arange(count, dtype=np.int64)\n",
              "def _future_horizon_steps(future_count: int) -> np.ndarray:":
                  "def _future_horizon_steps(future_count: int) -> _IntArray:",
              "    steps = np.arange(1, future_count + 1, dtype=np.int64)\n":
                  "    steps: _IntArray = np.arange(\n"
                  "        1, future_count + 1, dtype=np.int64\n"
                  "    )\n",
              "def _scale_schedule(*, bins: np.ndarray, track_count: int) -> np.ndarray:":
                  "def _scale_schedule(\n"
                  "    *, bins: _IntArray, track_count: int\n"
                  ") -> _FloatArray:",
              "    scale_values = np.asarray(REGISTERED_COVARIANCE_SCALES, dtype=np.float64)\n":
                  "    scale_values = cast(\n"
                  "        _FloatArray,\n"
                  "        np.asarray(REGISTERED_COVARIANCE_SCALES, dtype=np.float64),\n"
                  "    )\n",
              "    schedule = np.broadcast_to(\n":
                  "    schedule = cast(\n"
                  "        _FloatArray,\n"
                  "        np.broadcast_to(\n",
              "    ).copy(order=\"C\")\n    schedule.setflags(write=False)\n":
                  "        ).copy(order=\"C\"),\n"
                  "    )\n"
                  "    schedule.setflags(write=False)\n",
          }
          text = common.read_text(encoding="utf-8")
          for old, new in replacements.items():
              actual = text.count(old)
              if actual != 1:
                  raise SystemExit(
                      f"{common}: expected one occurrence of {old!r}, found {actual}"
                  )
              text = text.replace(old, new)
          text = text.replace(
              "    return value\n\n\ndef _boolean_array",
              "    return cast(_FloatArray, value)\n\n\ndef _boolean_array",
              1,
          )
          text = text.replace(
              "    return value\n\n\ndef _canonical_horizon_bins",
              "    return cast(_BoolArray, value)\n\n\ndef _canonical_horizon_bins",
              1,
          )
          old_config = (
              "def _frozen_endpoint_config_id() -> str:\n"
              "    return content_id(\n"
              "        _endpoint_config_descriptor("
              "DEFAULT_MODEL_AVERAGED_ENDPOINT_CONFIG_V1)\n"
              "    )\n"
          )
          new_config = (
              "def _frozen_endpoint_config_id() -> str:\n"
              "    return cast(\n"
              "        str,\n"
              "        content_id(\n"
              "            _endpoint_config_descriptor(\n"
              "                DEFAULT_MODEL_AVERAGED_ENDPOINT_CONFIG_V1\n"
              "            )\n"
              "        ),\n"
              "    )\n"
          )
          if text.count(old_config) != 1:
              raise SystemExit("frozen endpoint config helper changed unexpectedly")
          common.write_text(text.replace(old_config, new_config), encoding="utf-8")

          decision = root / "_decision.py"
          replace_exact(
              decision,
              "    _float64_array,\n",
              "    _FloatArray,\n    _float64_array,\n",
          )
          replace_exact(
              decision,
              "        assignments = {\n",
              "        assignments: dict[str, object] = {\n",
          )
          text = decision.read_text(encoding="utf-8")
          if text.count("np.ndarray") != 2:
              raise SystemExit(
                  f"{decision}: expected two ndarray fields, found "
                  f"{text.count('np.ndarray')}"
              )
          decision.write_text(
              text.replace("np.ndarray", "_FloatArray"),
              encoding="utf-8",
          )

          execution = root / "_execution.py"
          replace_exact(
              execution,
              "from typing import Any\n",
              "from typing import Any, cast\n",
          )
          replace_exact(
              execution,
              "    _array_sha256,\n",
              "    _Array,\n    _array_sha256,\n",
          )
          text = execution.read_text(encoding="utf-8")
          ndarray_count = text.count("np.ndarray")
          if ndarray_count != 40:
              raise SystemExit(
                  f"{execution}: expected 40 ndarray annotations, found {ndarray_count}"
              )
          text = text.replace("np.ndarray", "_Array")
          text = text.replace(
              "    residual = np.zeros_like(physical_prefix)\n",
              "    residual = cast(_Array, np.zeros_like(physical_prefix))\n",
              1,
          )
          text = text.replace(
              "    last = np.zeros((residual.shape[1], 3), dtype=np.float64)\n",
              "    last = cast(\n"
              "        _Array,\n"
              "        np.zeros((residual.shape[1], 3), dtype=np.float64),\n"
              "    )\n",
              1,
          )
          text = text.replace(
              "    return np.asarray(physical_future + last[None, :, :], dtype=np.float64, order=\"C\")\n",
              "    return cast(\n"
              "        _Array,\n"
              "        np.asarray(\n"
              "            physical_future + last[None, :, :],\n"
              "            dtype=np.float64,\n"
              "            order=\"C\",\n"
              "        ),\n"
              "    )\n",
              1,
          )
          text = text.replace(
              "    covariance = np.stack(\n",
              "    covariance = cast(\n"
              "        _Array,\n"
              "        np.stack(\n",
              1,
          )
          text = text.replace(
              "        axis=0,\n    )\n    covariance.setflags(write=False)\n",
              "            axis=0,\n"
              "        ),\n"
              "    )\n"
              "    covariance.setflags(write=False)\n",
              1,
          )
          execution.write_text(text, encoding="utf-8")
          PY

          python -m pip install -e '.[dev]'

          files=(
            src/bayesian_phystwin/deform360_registered_residual_history_v1/__init__.py
            src/bayesian_phystwin/deform360_registered_residual_history_v1/_common.py
            src/bayesian_phystwin/deform360_registered_residual_history_v1/_provenance.py
            src/bayesian_phystwin/deform360_registered_residual_history_v1/_decision.py
            src/bayesian_phystwin/deform360_registered_residual_history_v1/_execution.py
            tests/test_portable_contracts_deform360_registered_residual_history_v1.py
            tests/test_portable_contracts_deform360_registered_residual_history_v1_validation.py
            tests/test_portable_contracts_deform360_registered_residual_history_edges_v1.py
          )

          python -m ruff check --fix "${files[@]}"
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy --strict \
            src/bayesian_phystwin/deform360_registered_residual_history_v1
          python -m pytest -q -p no:cacheprovider \
            tests/test_portable_contracts_deform360_registered_residual_history_v1.py \
            tests/test_portable_contracts_deform360_registered_residual_history_v1_validation.py \
            tests/test_portable_contracts_deform360_registered_residual_history_edges_v1.py
          git diff --check

      - name: Commit the correction and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-registered-residual-history-quality-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add explicit NumPy types to residual-history contracts'
          git push origin HEAD:fix/registered-residual-history-donor-fallback-v1
