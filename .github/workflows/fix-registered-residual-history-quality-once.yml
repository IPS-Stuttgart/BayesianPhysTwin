name: Fix registered residual-history quality once

on:
  push:
    branches:
      - fix/registered-residual-history-donor-fallback-v1

permissions:
  contents: write

concurrency:
  group: fix-registered-residual-history-quality-once
  cancel-in-progress: false

jobs:
  fix:
    if: github.repository == 'IPS-Stuttgart/BayesianPhysTwin'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/registered-residual-history-donor-fallback-v1
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply the bounded typing and formatting correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "src/bayesian_phystwin/"
              "deform360_registered_residual_history_v1/_decision.py"
          )
          text = path.read_text(encoding="utf-8")
          old = "        assignments = {\n"
          new = "        assignments: dict[str, object] = {\n"
          if text.count(old) != 1:
              raise SystemExit(
                  f"expected one mixed-assignment mapping, found {text.count(old)}"
              )
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

          python -m pip install -e '.[dev]'

          files=(
            src/bayesian_phystwin/deform360_registered_residual_history_v1/__init__.py
            src/bayesian_phystwin/deform360_registered_residual_history_v1/_common.py
            src/bayesian_phystwin/deform360_registered_residual_history_v1/_provenance.py
            src/bayesian_phystwin/deform360_registered_residual_history_v1/_decision.py
            src/bayesian_phystwin/deform360_registered_residual_history_v1/_execution.py
            tests/test_portable_contracts_deform360_registered_residual_history_v1.py
            tests/test_portable_contracts_deform360_registered_residual_history_v1_validation.py
            tests/test_portable_contracts_deform360_registered_residual_history_edges_v1.py
          )

          python -m ruff check --fix "${files[@]}"
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy --strict \
            src/bayesian_phystwin/deform360_registered_residual_history_v1
          python -m pytest -q -p no:cacheprovider \
            tests/test_portable_contracts_deform360_registered_residual_history_v1.py \
            tests/test_portable_contracts_deform360_registered_residual_history_v1_validation.py \
            tests/test_portable_contracts_deform360_registered_residual_history_edges_v1.py
          git diff --check

      - name: Commit the correction and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-registered-residual-history-quality-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply registered residual-history quality fixes'
          git push origin HEAD:fix/registered-residual-history-donor-fallback-v1
