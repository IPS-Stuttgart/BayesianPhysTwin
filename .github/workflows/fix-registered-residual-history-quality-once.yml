name: Fix registered residual-history quality once

on:
  push:
    branches:
      - agent/registered-residual-history-single-path-v1

permissions:
  contents: write

concurrency:
  group: fix-registered-residual-history-quality-once
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'IPS-Stuttgart/BayesianPhysTwin'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/registered-residual-history-single-path-v1
          fetch-depth: 1
          persist-credentials: true

      - name: Apply the exact lint repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/bayesian_phystwin/deform360_registered_residual_history_v1.py)" = \
            ff9b216265b9c9b3fa99a573a58451dd2c0f3319
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "src/bayesian_phystwin/deform360_registered_residual_history_v1.py"
          )
          text = path.read_text(encoding="utf-8")
          old = "from collections.abc import Mapping, Sequence\n"
          new = "from collections.abc import Mapping\n"
          if text.count(old) != 1:
              raise SystemExit(
                  f"expected one unused Sequence import, found {text.count(old)}"
              )
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Validate and format the permanent files
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m ruff format \
            src/bayesian_phystwin/deform360_registered_residual_history_v1.py \
            tests/test_deform360_registered_residual_history_v1.py
          python -m ruff check \
            src/bayesian_phystwin/deform360_registered_residual_history_v1.py \
            tests/test_deform360_registered_residual_history_v1.py
          python -m mypy \
            src/bayesian_phystwin/deform360_registered_residual_history_v1.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_deform360_registered_residual_history_v1.py
          python -m compileall -q \
            src/bayesian_phystwin/deform360_registered_residual_history_v1.py \
            tests/test_deform360_registered_residual_history_v1.py
          git diff --check

      - name: Commit permanent repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-registered-residual-history-quality-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Format and validate the registered residual-history path'
          git push origin HEAD:agent/registered-residual-history-single-path-v1
