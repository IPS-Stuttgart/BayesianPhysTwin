name: Materialize repaired domain covariance calibration

on:
  push:
    branches:
      - agent/domain-covariance-calibration-v1-final

permissions:
  actions: read
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore the exact reviewed release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/bpt443-artifact /tmp/bpt443-source
          mkdir -p /tmp/bpt443-artifact /tmp/bpt443-source
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/9077633006/zip" \
            --output /tmp/bpt443-artifact.zip
          unzip -q /tmp/bpt443-artifact.zip -d /tmp/bpt443-artifact
          tar -xzf \
            /tmp/bpt443-artifact/dist/bayesian_phystwin-0.4.0.tar.gz \
            -C /tmp/bpt443-source \
            --strip-components=1

          install -D -m 0644 \
            /tmp/bpt443-source/docs/calibration_domain_guard_v1.md \
            docs/calibration_domain_guard_v1.md
          install -D -m 0644 \
            /tmp/bpt443-source/docs/domain_covariance_calibration_v1.md \
            docs/domain_covariance_calibration_v1.md
          install -D -m 0644 \
            /tmp/bpt443-source/src/bayesian_phystwin/domain_covariance_calibration.py \
            src/bayesian_phystwin/domain_covariance_calibration.py
          install -D -m 0644 \
            /tmp/bpt443-source/tests/test_source_competence_domain_covariance_calibration.py \
            tests/test_source_competence_domain_covariance_calibration.py
          install -D -m 0644 \
            /tmp/bpt443-source/tests/test_source_competence_domain_covariance_calibration_edges.py \
            tests/test_source_competence_domain_covariance_calibration_edges.py

          python - <<'PY'
          from pathlib import Path

          manifest = Path("MANIFEST.in")
          text = manifest.read_text(encoding="utf-8")
          anchor = "include docs/calibration_domain_guard_v1.md\n"
          addition = "include docs/domain_covariance_calibration_v1.md\n"
          if addition not in text:
              if anchor not in text:
                  raise SystemExit("MANIFEST calibration-domain anchor missing")
              text = text.replace(anchor, anchor + addition, 1)
          manifest.write_text(text, encoding="utf-8")
          PY

          git apply -p1 .github/patches/domain-covariance-calibration-fix.patch

      - name: Format and verify the repaired contracts
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            'numpy>=1.24' 'pytest>=8' 'ruff==0.16.2'
          python -m ruff format \
            src/bayesian_phystwin/domain_covariance_calibration.py \
            tests/test_source_competence_domain_covariance_calibration.py \
            tests/test_source_competence_domain_covariance_calibration_edges.py
          python -m ruff check \
            src/bayesian_phystwin/domain_covariance_calibration.py \
            tests/test_source_competence_domain_covariance_calibration.py \
            tests/test_source_competence_domain_covariance_calibration_edges.py
          PYTHONPATH=src python -m pytest -q \
            tests/test_source_competence_domain_covariance_calibration.py \
            tests/test_source_competence_domain_covariance_calibration_edges.py
          python -m compileall -q \
            src/bayesian_phystwin/domain_covariance_calibration.py

      - name: Publish the repaired branch head
        run: |
          set -euo pipefail
          rm -f \
            .github/patches/domain-covariance-calibration-fix.patch \
            .github/workflows/materialize-domain-covariance-calibration.yml
          rmdir .github/patches 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Add hardened domain covariance calibration'
          git push origin "HEAD:${GITHUB_REF_NAME}"
