name: Synchronize full-22 PR with current main

on:
  push:
    branches:
      - agent/full22-discrepancy-tournament-v1

permissions:
  contents: write

concurrency:
  group: sync-full22-current-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synchronize:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.ref == 'refs/heads/agent/full22-discrepancy-tournament-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/full22-discrepancy-tournament-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Merge current main and preserve both manifest surfaces
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          git merge --no-commit --no-ff -X ours origin/main

          python - <<'PY'
          import subprocess
          from pathlib import Path

          main_lines = set(
              subprocess.check_output(
                  ["git", "show", "origin/main:MANIFEST.in"],
                  text=True,
              ).splitlines()
          )
          branch_lines = set(Path("MANIFEST.in").read_text(encoding="utf-8").splitlines())
          missing = sorted(main_lines - branch_lines)
          if missing:
              raise SystemExit(
                  "MANIFEST.in lost current-main entries:\n" + "\n".join(missing)
              )
          required = {
              "include docs/full22_discrepancy_candidate_tournament_v1.md",
              "include protocols/full22_discrepancy_candidate_tournament_v1.json",
              "include scripts/science/run_full22_discrepancy_candidate_tournament_v1.py",
          }
          absent = sorted(required - branch_lines)
          if absent:
              raise SystemExit(
                  "MANIFEST.in lost full-22 entries:\n" + "\n".join(absent)
              )
          PY

          rm .github/workflows/sync-full22-current-main.yml
          git add -A
          git diff --cached --check
          git commit -m "Merge current main into full-22 tournament"
          git push origin HEAD:agent/full22-discrepancy-tournament-v1
