name: Temporary format PR 351

on:
  push:
    branches:
      - agent/bounded-atomic-observation-io-v2
    paths:
      - ".github/workflows/_temporary_format_pr351.yml"

permissions:
  contents: write

concurrency:
  group: temporary-format-pr351
  cancel-in-progress: false

jobs:
  format:
    if: github.repository == 'IPS-Stuttgart/BayesianPhysTwin'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Verify branch tip and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git fetch --no-tags origin agent/bounded-atomic-observation-io-v2
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Format, validate, and remove the formatter
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          target=tests/test_portable_contracts_observation_belief_io_v2_adversarial.py
          python -m ruff format "$target"
          python -m ruff format --check "$target"
          python -m ruff check "$target"
          python -m pytest -q \
            tests/test_portable_contracts_observation_belief_io_v2.py \
            "$target" \
            tests/test_grouped_likelihood_dense_oracles.py
          rm .github/workflows/_temporary_format_pr351.yml
          git diff --check
          actual="$(git status --porcelain --untracked-files=all \
            | sed -E 's/^...//' | sort)"
          expected="$(cat <<'EOF'
          .github/workflows/_temporary_format_pr351.yml
          tests/test_portable_contracts_observation_belief_io_v2_adversarial.py
          EOF
          )"
          test "$actual" = "$expected"

      - name: Publish the exact formatted product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format bounded observation I/O coverage"
          git fetch --no-tags origin agent/bounded-atomic-observation-io-v2
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/agent/bounded-atomic-observation-io-v2
