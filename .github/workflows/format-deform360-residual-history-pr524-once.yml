name: Format Deform360 residual-history PR 524 once

on:
  push:
    branches: [agent/deform360-covariance-residual-history-dry-run-v1]

permissions:
  contents: write

concurrency:
  group: format-deform360-residual-history-pr524-once
  cancel-in-progress: true

jobs:
  format:
    if: >-
      github.ref ==
      'refs/heads/agent/deform360-covariance-residual-history-dry-run-v1' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/deform360-covariance-residual-history-dry-run-v1
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Format and validate the exact product files
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1"
          python -m pip install -e ".[dev]"
          python -m pip check

          files=(
            scripts/science/run_deform360_covariance_residual_history_dry_run_v1.py
            src/bayesian_phystwin/_deform360_covariance_residual_history_adapter_v1.py
            src/bayesian_phystwin/_deform360_covariance_residual_history_common_v1.py
            src/bayesian_phystwin/_deform360_covariance_residual_history_decision_v1.py
            src/bayesian_phystwin/deform360_covariance_residual_history_v1.py
            tests/test_deform360_covariance_residual_history_real_camera_roster_v1.py
            tests/test_deform360_covariance_residual_history_v1.py
          )
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy \
            src/bayesian_phystwin/_deform360_covariance_residual_history_adapter_v1.py \
            src/bayesian_phystwin/_deform360_covariance_residual_history_common_v1.py \
            src/bayesian_phystwin/_deform360_covariance_residual_history_decision_v1.py \
            src/bayesian_phystwin/deform360_covariance_residual_history_v1.py \
            scripts/science/run_deform360_covariance_residual_history_dry_run_v1.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_deform360_covariance_residual_history_real_camera_roster_v1.py \
            tests/test_deform360_covariance_residual_history_v1.py \
            tests/test_test_suite_manifest.py \
            tests/test_pull_request_workflow_integrity.py

      - name: Commit only the canonical formatting
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/format-deform360-residual-history-pr524-once.yml
          rm -- "${workflow}"
          git diff --check

          allowed="$(printf '%s\n' \
            "${workflow}" \
            scripts/science/run_deform360_covariance_residual_history_dry_run_v1.py \
            src/bayesian_phystwin/_deform360_covariance_residual_history_adapter_v1.py \
            src/bayesian_phystwin/_deform360_covariance_residual_history_common_v1.py \
            src/bayesian_phystwin/_deform360_covariance_residual_history_decision_v1.py \
            src/bayesian_phystwin/deform360_covariance_residual_history_v1.py \
            tests/test_deform360_covariance_residual_history_real_camera_roster_v1.py \
            tests/test_deform360_covariance_residual_history_v1.py \
            | LC_ALL=C sort)"
          actual="$(git status --short | awk '{print $2}' | LC_ALL=C sort)"
          unexpected="$(comm -13 <(printf '%s\n' "${allowed}") <(printf '%s\n' "${actual}"))"
          test -z "${unexpected}"
          test "$(git status --short -- "${workflow}" | awk '{print $1}')" = "D"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- \
            "${workflow}" \
            scripts/science/run_deform360_covariance_residual_history_dry_run_v1.py \
            src/bayesian_phystwin/_deform360_covariance_residual_history_adapter_v1.py \
            src/bayesian_phystwin/_deform360_covariance_residual_history_common_v1.py \
            src/bayesian_phystwin/_deform360_covariance_residual_history_decision_v1.py \
            src/bayesian_phystwin/deform360_covariance_residual_history_v1.py \
            tests/test_deform360_covariance_residual_history_real_camera_roster_v1.py \
            tests/test_deform360_covariance_residual_history_v1.py
          git commit -m "Format residual-history dry-run contracts"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" push \
            origin HEAD:refs/heads/agent/deform360-covariance-residual-history-dry-run-v1
