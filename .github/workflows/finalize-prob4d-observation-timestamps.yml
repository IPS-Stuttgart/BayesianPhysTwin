name: Finalize Prob4D observation timestamp consumer

on:
  push:
    branches: [agent/prob4d-observation-timestamp-consumer-v1]

permissions:
  contents: write

concurrency:
  group: finalize-prob4d-observation-timestamps
  cancel-in-progress: true

env:
  PROB4D_TIMESTAMP_PRODUCER_REVISION: 34b74302383ecf91c46c4d7a32e2bd22260ad7ed
  CAUSAL4D_CLOCK_PRIOR_REVISION: 183045f4a1085bd37221eb2294181f43ca629de0
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/prob4d-observation-timestamp-consumer-v1
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Check out immutable Prob4D producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/Prob4D
          ref: ${{ env.PROB4D_TIMESTAMP_PRODUCER_REVISION }}
          path: _external/prob4d
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Check out immutable Causal4D producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/Causal4D
          ref: ${{ env.CAUSAL4D_CLOCK_PRIOR_REVISION }}
          path: _external/causal4d
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply reviewed full-record hardening
        shell: bash
        run: |
          set -euo pipefail
          python tools/temporary_harden_timestamp_consumer.py
          grep -q "def shared_clock_prior_from_causal4d_record" \
            src/bayesian_phystwin/prob4d_observation_timestamps.py
          grep -q "compact Causal4D clock-prior payloads are not claim-bearing" \
            src/bayesian_phystwin/prob4d_observation_timestamps.py

      - name: Create isolated producer-consumer environment
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/finalize-prob4d-observation-timestamps-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python -m venv "${root}/venv"
          echo "${root}/venv/bin" >> "${GITHUB_PATH}"
          "${root}/venv/bin/python" -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1"
          "${root}/venv/bin/python" -m pip install -e ".[dev]"
          "${root}/venv/bin/python" -m pip install -e ./_external/prob4d
          "${root}/venv/bin/python" -m pip install \
            -e ./_external/causal4d --no-deps
          "${root}/venv/bin/python" -m pip check

      - name: Format permanent source and tests
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/bayesian_phystwin/causal4d_observation_clock_prior.py
            src/bayesian_phystwin/prob4d_observation_timestamps.py
            src/bayesian_phystwin/prob4d_observation_timestamp_admission.py
            tests/test_prob4d_observation_timestamps.py
            tests/test_prob4d_observation_timestamp_admission.py
            tests/test_prob4d_observation_timestamps_crossrepo.py
            tests/test_prob4d_observation_timestamps_causal4d.py
          )
          python -m ruff check --fix "${files[@]}"
          python -m ruff format "${files[@]}"

      - name: Validate permanent source and producer parity
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/bayesian_phystwin/causal4d_observation_clock_prior.py
            src/bayesian_phystwin/prob4d_observation_timestamps.py
            src/bayesian_phystwin/prob4d_observation_timestamp_admission.py
            tests/test_prob4d_observation_timestamps.py
            tests/test_prob4d_observation_timestamp_admission.py
            tests/test_prob4d_observation_timestamps_crossrepo.py
            tests/test_prob4d_observation_timestamps_causal4d.py
          )
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy \
            src/bayesian_phystwin/causal4d_observation_clock_prior.py \
            src/bayesian_phystwin/prob4d_observation_timestamps.py \
            src/bayesian_phystwin/prob4d_observation_timestamp_admission.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_prob4d_observation_timestamps.py \
            tests/test_prob4d_observation_timestamp_admission.py \
            tests/test_prob4d_observation_timestamps_crossrepo.py \
            tests/test_prob4d_observation_timestamps_causal4d.py \
            tests/test_observation_timing_nuisance.py \
            tests/test_observation_timing_interchange.py \
            tests/test_observation_belief.py
          python -m py_compile "${files[@]}"

      - name: Verify immutable upstream identities and clean checkouts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _external/prob4d rev-parse HEAD)" = \
            "${PROB4D_TIMESTAMP_PRODUCER_REVISION}"
          test "$(git -C _external/causal4d rev-parse HEAD)" = \
            "${CAUSAL4D_CLOCK_PRIOR_REVISION}"
          test -z "$(git -C _external/prob4d status --porcelain=v1)"
          test -z "$(git -C _external/causal4d status --porcelain=v1)"

      - name: Publish only permanent validated files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _external
          rm -f \
            .github/workflows/temporary-format-prob4d-observation-timestamps.yml \
            .github/workflows/temporary-macos-format-prob4d-observation-timestamps.yml \
            .github/workflows/finalize-prob4d-observation-timestamps.yml \
            tools/temporary_harden_timestamp_consumer.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No publication changes were required"
            exit 0
          fi
          git commit -m "Finalize Prob4D observation timestamp consumer"
          git push origin HEAD:agent/prob4d-observation-timestamp-consumer-v1
