name: Format same-mean mixture source

on:
  push:
    branches:
      - agent/same-mean-query-mixture-v1
    paths:
      - .agent-format/READY

permissions:
  contents: write

concurrency:
  group: agent-format-same-mean-mixture
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/same-mean-query-mixture-v1
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Format and validate the exact changed source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff format -- \
            src/bayesian_phystwin/predictive_query_mixture.py \
            src/bayesian_phystwin/query_density_calibration.py \
            tests/test_covariance_only_hybrid_mixture_v1.py \
            tests/test_query_calibration_mixture_density_v1.py
          python -m ruff check -- \
            src/bayesian_phystwin/predictive_query_mixture.py \
            src/bayesian_phystwin/query_density_calibration.py \
            tests/test_covariance_only_hybrid_mixture_v1.py \
            tests/test_query_calibration_mixture_density_v1.py
          PYTHONPATH=src python -m pytest -q \
            tests/test_covariance_only_hybrid_mixture_v1.py \
            tests/test_query_calibration_mixture_density_v1.py
          python -m compileall -q \
            src/bayesian_phystwin/predictive_query_mixture.py \
            src/bayesian_phystwin/query_density_calibration.py \
            tests/test_covariance_only_hybrid_mixture_v1.py \
            tests/test_query_calibration_mixture_density_v1.py
          git diff --check

      - name: Publish formatted source and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayesian_phystwin/predictive_query_mixture.py \
            src/bayesian_phystwin/query_density_calibration.py \
            tests/test_covariance_only_hybrid_mixture_v1.py \
            tests/test_query_calibration_mixture_density_v1.py
          git rm .agent-format/READY
          git rm .github/workflows/agent-format-same-mean-mixture.yml
          git commit -m "Format same-mean predictive query mixture"
          git push origin HEAD:agent/same-mean-query-mixture-v1
