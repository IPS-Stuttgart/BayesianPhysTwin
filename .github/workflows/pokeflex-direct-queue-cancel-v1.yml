name: Cancel unopened pre-PokeFlex queue entries v1

on:
  push:
    branches:
      - ops/pokeflex-gpuserver6000-access-recovery-v2
    paths:
      - triggers/pokeflex-direct-queue-cancel-v1.json

permissions:
  contents: read
  actions: write

jobs:
  cancel:
    name: Reverify and cancel three unopened lower-priority runs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact cancellation revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          clean: true

      - name: Require one add-only cancellation request
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/ops/pokeflex-gpuserver6000-access-recovery-v2
          test "$PUSH_FORCED" = false
          test "$BEFORE_SHA" != 0000000000000000000000000000000000000000
          mapfile -t changed < <(git diff --name-status "$BEFORE_SHA" "$GITHUB_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = $'A\ttriggers/pokeflex-direct-queue-cancel-v1.json'
          python3 - <<'PY'
          import json
          from pathlib import Path

          request = json.loads(Path("triggers/pokeflex-direct-queue-cancel-v1.json").read_text())
          expected = {
              "schema": "bayesian-phystwin/pokeflex-direct-queue-cancel-request-v1",
              "request_id": "pokeflex-direct-queue-cancel-20260901-v1",
              "preserve_run_ids": [33361441865, 33475220422],
              "cancel": [
                  {
                      "run_id": 33363572071,
                      "job_id": 99658993621,
                      "purpose": "older read-only Deform360 diagnostic",
                      "target_payload_opened": False,
                  },
                  {
                      "run_id": 33474012734,
                      "job_id": 99749476050,
                      "purpose": "older read-only Tracking Cloth pilot",
                      "target_payload_opened": False,
                  },
                  {
                      "run_id": 33474698964,
                      "job_id": 99751544803,
                      "purpose": "older Tracking Cloth query-quotient evaluation",
                      "target_payload_opened": False,
                  },
              ],
              "require_runner_id_zero": True,
              "require_zero_executed_steps": True,
              "scientific_protocol_change": False,
              "delete_existing_evidence": False,
          }
          if request != expected:
              raise SystemExit(f"cancellation request changed: {request!r}")
          PY

      - name: Cancel only after live unopened-state verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pokeflex-direct-queue-cancel-v1"
          mkdir -p "$evidence"
          echo "EVIDENCE_ROOT=$evidence" >> "$GITHUB_ENV"
          python3 - "$evidence/result.json" <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          output = Path(__import__("sys").argv[1])
          repository = os.environ["GITHUB_REPOSITORY"]
          api = os.environ["GITHUB_API_URL"]
          token = os.environ["GH_TOKEN"]
          targets = [
              (33363572071, 99658993621, "older read-only Deform360 diagnostic"),
              (33474012734, 99749476050, "older read-only Tracking Cloth pilot"),
              (33474698964, 99751544803, "older Tracking Cloth query-quotient evaluation"),
          ]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request_json(url: str, *, method: str = "GET") -> object | None:
              request = urllib.request.Request(url, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      if response.status == 204 or not response.length:
                          return None
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  payload = error.read().decode("utf-8", errors="replace")
                  raise SystemExit(
                      f"GitHub API {method} {url} failed with {error.code}: {payload}"
                  ) from error

          pre = []
          for run_id, job_id, purpose in targets:
              run = request_json(f"{api}/repos/{repository}/actions/runs/{run_id}")
              jobs = request_json(
                  f"{api}/repos/{repository}/actions/runs/{run_id}/jobs?per_page=100"
              )
              assert isinstance(run, dict) and isinstance(jobs, dict)
              matches = [job for job in jobs["jobs"] if int(job["id"]) == job_id]
              if len(matches) != 1:
                  raise SystemExit(f"expected one job {job_id} in run {run_id}")
              job = matches[0]
              row = {
                  "run_id": run_id,
                  "job_id": job_id,
                  "purpose": purpose,
                  "run_status": run["status"],
                  "run_conclusion": run["conclusion"],
                  "job_status": job["status"],
                  "job_conclusion": job["conclusion"],
                  "runner_id": int(job.get("runner_id") or 0),
                  "runner_name": job.get("runner_name") or "",
                  "step_count": len(job.get("steps") or []),
                  "labels": list(job.get("labels") or []),
                  "target_payload_opened": False,
              }
              if row["run_status"] != "queued" or row["job_status"] != "queued":
                  raise SystemExit(f"refusing to cancel a run that changed state: {row}")
              if row["run_conclusion"] is not None or row["job_conclusion"] is not None:
                  raise SystemExit(f"refusing to cancel a concluded run: {row}")
              if row["runner_id"] != 0 or row["runner_name"] or row["step_count"] != 0:
                  raise SystemExit(f"refusing to cancel a job that opened execution: {row}")
              if "gpuserver4090" not in row["labels"]:
                  raise SystemExit(f"refusing to cancel a retargeted job: {row}")
              pre.append(row)

          dlo = request_json(f"{api}/repos/{repository}/actions/runs/33361441865")
          pokeflex = request_json(f"{api}/repos/{repository}/actions/runs/33475220422")
          assert isinstance(dlo, dict) and isinstance(pokeflex, dict)
          if dlo["status"] != "in_progress":
              raise SystemExit("protected DLO run changed state before cancellation")
          if pokeflex["status"] != "queued":
              raise SystemExit("frozen PokeFlex run changed state before cancellation")

          for run_id, _job_id, _purpose in targets:
              request_json(
                  f"{api}/repos/{repository}/actions/runs/{run_id}/cancel",
                  method="POST",
              )

          post = []
          deadline = time.monotonic() + 90.0
          remaining = {run_id for run_id, _job_id, _purpose in targets}
          last = {}
          while remaining and time.monotonic() < deadline:
              for run_id in tuple(remaining):
                  run = request_json(f"{api}/repos/{repository}/actions/runs/{run_id}")
                  assert isinstance(run, dict)
                  last[run_id] = {
                      "run_id": run_id,
                      "status": run["status"],
                      "conclusion": run["conclusion"],
                  }
                  if run["status"] == "completed" and run["conclusion"] == "cancelled":
                      remaining.remove(run_id)
              if remaining:
                  time.sleep(2.0)
          if remaining:
              raise SystemExit(f"cancellation did not settle: {last}")
          post = [last[run_id] for run_id, _job_id, _purpose in targets]

          dlo_after = request_json(f"{api}/repos/{repository}/actions/runs/33361441865")
          pokeflex_after = request_json(
              f"{api}/repos/{repository}/actions/runs/33475220422"
          )
          assert isinstance(dlo_after, dict) and isinstance(pokeflex_after, dict)
          if dlo_after["status"] != "in_progress":
              raise SystemExit("protected DLO run was not preserved")
          if pokeflex_after["status"] != "queued":
              raise SystemExit("frozen PokeFlex run was not preserved")

          result = {
              "schema": "bayesian-phystwin/pokeflex-direct-queue-cancel-result-v1",
              "pre_cancel": pre,
              "post_cancel": post,
              "preserved": {
                  "dlo_run_id": 33361441865,
                  "dlo_status": dlo_after["status"],
                  "pokeflex_run_id": 33475220422,
                  "pokeflex_status": pokeflex_after["status"],
              },
              "cancelled_run_count": len(post),
              "scientific_protocol_change": False,
              "existing_evidence_deleted": False,
          }
          output.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Upload cancellation audit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pokeflex-direct-queue-cancel-v1-${{ github.run_id }}
          path: ${{ env.EVIDENCE_ROOT }}/result.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish queue outcome
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          value = json.loads((Path(os.environ["EVIDENCE_ROOT"]) / "result.json").read_text())
          print("### Audited gpuserver4090 queue cancellation")
          print()
          print(f"- Unopened lower-priority runs cancelled: `{value['cancelled_run_count']}`")
          print(f"- Protected DLO run: `{value['preserved']['dlo_status']}`")
          print(f"- Frozen PokeFlex run: `{value['preserved']['pokeflex_status']}`")
          print("- Scientific protocol changed: `false`")
          print("- Existing evidence deleted: `false`")
          PY
