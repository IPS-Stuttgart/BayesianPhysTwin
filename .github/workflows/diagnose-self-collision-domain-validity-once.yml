# workflow-lifecycle: temporary
# workflow-owner: IPS-Stuttgart maintainers
name: Diagnose self-collision source domain validity once

on:
  push:
    branches:
      - diagnostic/self-collision-domain-validity-v1
    paths:
      - ".github/workflows/diagnose-self-collision-domain-validity-once.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 120
    env:
      DATASET_ROOT: /home/github-runner/.cache/datasets/tracking-cloth-deformation-v1-zenodo-14644526
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Evaluate triangle-contact source variants
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/self-collision-triangle-contact-$GITHUB_RUN_ID"
          python -m experiments.tracking_cloth_self_collision_selective_twin_v1.source_triangle_contact_diagnostic \
            --dataset-root "$DATASET_ROOT" \
            --output "$out"
          echo "SC_DIAGNOSTIC=$out" >> "$GITHUB_ENV"
      - name: Upload source-only diagnostic
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: self-collision-triangle-contact-${{ github.run_id }}
          path: ${{ env.SC_DIAGNOSTIC }}
          retention-days: 30
