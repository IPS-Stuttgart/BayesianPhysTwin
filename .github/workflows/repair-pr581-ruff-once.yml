name: Repair PR 581 Ruff issues once

on:
  push:
    branches:
      - fix/registered-residual-history-donor-fallback-v1
    paths:
      - .github/workflows/repair-pr581-ruff-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v7
        with:
          ref: fix/registered-residual-history-donor-fallback-v1
          fetch-depth: 0

      - name: Apply Ruff safe fixes and formatting
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install ruff
          files=(
            src/bayesian_phystwin/deform360_registered_residual_history_v1/__init__.py
            src/bayesian_phystwin/deform360_registered_residual_history_v1/_common.py
            src/bayesian_phystwin/deform360_registered_residual_history_v1/_decision.py
            src/bayesian_phystwin/deform360_registered_residual_history_v1/_execution.py
            src/bayesian_phystwin/deform360_registered_residual_history_v1/_provenance.py
            tests/test_portable_contracts_deform360_registered_residual_history_edges_v1.py
            tests/test_portable_contracts_deform360_registered_residual_history_v1.py
            tests/test_portable_contracts_deform360_registered_residual_history_v1_validation.py
          )
          python -m ruff check --fix "${files[@]}"
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"

      - name: Commit repair and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-pr581-ruff-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/bayesian_phystwin/deform360_registered_residual_history_v1 \
            tests/test_portable_contracts_deform360_registered_residual_history_edges_v1.py \
            tests/test_portable_contracts_deform360_registered_residual_history_v1.py \
            tests/test_portable_contracts_deform360_registered_residual_history_v1_validation.py \
            .github/workflows/repair-pr581-ruff-once.yml
          git commit -m 'Format residual-history hardening changes'
          git push origin HEAD:fix/registered-residual-history-donor-fallback-v1
