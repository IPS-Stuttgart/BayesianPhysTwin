name: Export source for local validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Create source archive
        run: git archive --format=tar.gz --output=bayesian-phystwin-source.tar.gz HEAD
      - uses: actions/upload-artifact@v7
        with:
          name: bayesian-phystwin-source
          path: bayesian-phystwin-source.tar.gz
          if-no-files-found: error
          retention-days: 1
