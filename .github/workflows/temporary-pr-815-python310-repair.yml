name: Temporary PR 815 Python 3.10 repair

on:
  push:
    branches:
      - science/deform360-gpuserver4090-real-eval-v1

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: science/deform360-gpuserver4090-real-eval-v1
          fetch-depth: 0
          persist-credentials: true
      - name: Repair Python 3.10-incompatible f-string
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/science/run_deform360_action_conditioned_tactile_v2.py')
          text = path.read_text(encoding='utf-8')
          old = '''        raise EvaluationError(
              f"episode {episode.descriptor.episode_id} has no windows for horizon {
                  horizon
              }"
          )'''
          new = '''        raise EvaluationError(
              f"episode {episode.descriptor.episode_id} has no windows for horizon {horizon}"
          )'''
          if old not in text:
              raise SystemExit('expected PR 815 f-string block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile scripts/science/run_deform360_action_conditioned_tactile_v2.py
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/science/run_deform360_action_conditioned_tactile_v2.py
          git commit -m 'Fix Python 3.10-compatible Deform360 evaluation error'
          git push origin HEAD:science/deform360-gpuserver4090-real-eval-v1
