name: One-shot Deform360 Stage-0 lock

on:
  push:
    branches:
      - agent/deform360-official-hub-visuotactile-v1

permissions:
  contents: write

concurrency:
  group: one-shot-deform360-stage0-lock
  cancel-in-progress: true

env:
  BPT_HEAD_SHA: ${{ github.sha }}
  BPT_HEAD_REF: agent/deform360-official-hub-visuotactile-v1
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  validate-and-lock:
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 60
    steps:
      - name: Check out exact trusted head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.BPT_HEAD_SHA }}
          persist-credentials: true
          fetch-depth: 0

      - name: Create isolated Python environment
        shell: bash
        run: |
          set -euo pipefail
          environment="${RUNNER_TEMP}/bpt-deform360-stage0-one-shot-venv"
          rm -rf "${environment}"
          python3 -m venv "${environment}"
          echo "VIRTUAL_ENV=${environment}" >> "${GITHUB_ENV}"
          echo "${environment}/bin" >> "${GITHUB_PATH}"

      - name: Install metadata-only dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "huggingface_hub>=0.30,<2"
          python -m pip check

      - name: Revalidate the target-blind implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check \
            src/bayesian_phystwin/deform360_contact_anchor.py \
            scripts/science/build_deform360_hub_selection.py \
            tests/test_deform360_contact_anchor.py \
            tests/test_deform360_hub_selection.py
          python -m ruff format --check \
            src/bayesian_phystwin/deform360_contact_anchor.py \
            scripts/science/build_deform360_hub_selection.py \
            tests/test_deform360_contact_anchor.py \
            tests/test_deform360_hub_selection.py
          python -m pytest -q \
            tests/test_deform360_contact_anchor.py \
            tests/test_deform360_hub_selection.py
          python -m compileall -q \
            src/bayesian_phystwin/deform360_contact_anchor.py \
            scripts/science/build_deform360_hub_selection.py

      - name: Resolve names and selected metadata only
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/deform360-official-hub-stage0-one-shot"
          rm -rf "${evidence}"
          mkdir -p "${evidence}"
          echo "EVIDENCE_DIR=${evidence}" >> "${GITHUB_ENV}"
          python scripts/science/build_deform360_hub_selection.py \
            --repository . \
            --protocol protocols/deform360_official_hub_visuotactile_v1.json \
            --implementation-revision "${BPT_HEAD_SHA}" \
            --output "${evidence}/selection.json" \
            | tee "${evidence}/selection.log"

      - name: Verify information boundary and publish the exact lock
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              (Path(os.environ["EVIDENCE_DIR"]) / "selection.json").read_text(
                  encoding="utf-8"
              )
          )
          if payload["implementation_revision"] != os.environ["BPT_HEAD_SHA"]:
              raise SystemExit("selection is not bound to the exact workflow head")
          boundary = payload["information_boundary"]
          forbidden = (
              "camera_media_opened",
              "tactile_arrays_opened",
              "robot_arrays_opened",
              "geometry_annotations_opened",
              "target_outcomes_opened",
          )
          if any(boundary[name] is not False for name in forbidden):
              raise SystemExit("Stage-0 information boundary was exceeded")
          PY
          git diff --exit-code
          lock="protocols/locks/deform360_official_hub_visuotactile_v1_selection.json"
          mkdir -p "$(dirname "${lock}")"
          cp "${EVIDENCE_DIR}/selection.json" "${lock}"
          git rm .github/workflows/one-shot-deform360-stage0-lock.yml
          git add "${lock}"
          git diff --cached --check
          git config --local core.hooksPath /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -c core.hooksPath=/dev/null commit \
            -m "Lock official Deform360 Stage-0 cohort"
          git -c core.hooksPath=/dev/null push \
            origin "HEAD:${BPT_HEAD_REF}"
