name: Diagnose Deform360 hardening source

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/temporary-diagnose-deform360-hardening.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diagnose-deform360-hardening
  cancel-in-progress: true

jobs:
  diagnose:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 30
    steps:
      - name: Check out the hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/deform360-provenance-cadence-hardening-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Execute the exact embedded build with generated-escape repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path(
              ".github/workflows/temporary-build-deform360-hardening.yml"
          )
          lines = workflow.read_text(encoding="utf-8").splitlines()
          marker = "      - name: Build, validate, and publish ordinary source"
          marker_index = lines.index(marker)
          run_index = next(
              index
              for index in range(marker_index + 1, len(lines))
              if lines[index] == "        run: |"
          )
          body = []
          for line in lines[run_index + 1 :]:
              if line and not line.startswith("          "):
                  break
              body.append(line[10:] if line.startswith("          ") else "")
          if not body:
              raise SystemExit("embedded build body is empty")
          body_text = "\n".join(body)
          insertion_point = (
              "python /tmp/harden_pr120.py\n\n"
              "python -m pip install --upgrade pip"
          )
          repair = r'''python /tmp/harden_pr120.py

python - <<'PY'
from pathlib import Path

text_paths = (
    Path("scripts/science/run_deform360_normalized_evidence_external.py"),
    Path("tests/test_deform360_normalized_evidence_external.py"),
    Path(".github/workflows/deform360-normalized-evidence-external.yml"),
    Path("docs/deform360_normalized_evidence_external_v1.md"),
)
for path in text_paths:
    raw = path.read_bytes()
    if b"\x00" in raw:
        path.write_bytes(raw.replace(b"\x00", b"\\0"))

source = text_paths[0]
lines = source.read_text(encoding="utf-8").splitlines()
repair_count = 0
index = 0
while index + 1 < len(lines):
    if lines[index].strip() == '"' and lines[index + 1].lstrip().startswith('".join('):
        indentation = lines[index][: len(lines[index]) - len(lines[index].lstrip())]
        lines[index] = indentation + '"\\n' + lines[index + 1].lstrip()
        del lines[index + 1]
        repair_count += 1
        continue
    index += 1
if repair_count < 1:
    raise SystemExit("generated newline-escape defect was not found")
source.write_text("\n".join(lines) + "\n", encoding="utf-8")
print(f"normalized_generated_escape_count={repair_count}")
PY

PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/pycache" \
  python -m py_compile \
    scripts/science/run_deform360_normalized_evidence_external.py

python -m pip install --upgrade pip'''
          if body_text.count(insertion_point) != 1:
              raise SystemExit(
                  "embedded generator execution point changed: "
                  f"{body_text.count(insertion_point)}"
              )
          body_text = body_text.replace(insertion_point, repair, 1)
          cleanup = (
              "rm -f .github/workflows/"
              "temporary-build-deform360-hardening.yml"
          )
          cleanup_replacement = (
              cleanup
              + "\nrm -f .github/workflows/"
              "temporary-diagnose-deform360-hardening.yml"
          )
          if body_text.count(cleanup) != 1:
              raise SystemExit("temporary-workflow cleanup point changed")
          body_text = body_text.replace(cleanup, cleanup_replacement, 1)

          destination = Path("/tmp/exact-deform360-hardening-build.sh")
          destination.write_text(
              "set -Eeuo pipefail\n"
              "trap 'status=$?; echo SOURCE_DIAGNOSTIC >&2; "
              "if [[ -f scripts/science/"
              "run_deform360_normalized_evidence_external.py ]]; then "
              "nl -ba scripts/science/"
              "run_deform360_normalized_evidence_external.py "
              "| sed -n \"285,355p\" >&2; fi; exit ${status}' ERR\n"
              + body_text
              + "\n",
              encoding="utf-8",
          )
          print(destination)
          PY
          bash /tmp/exact-deform360-hardening-build.sh
