# workflow-lifecycle: temporary-one-shot
# workflow-owner: IPS-Stuttgart maintainers
name: DEFORM DLO4/DLO5 staged timeout recovery v3

on:
  push:
    branches:
      - science/deform-dlo45-time-budget-recovery-v3
    paths:
      - .github/requests/deform-dlo45-time-budget-recovery-v3.json

permissions:
  contents: read

concurrency:
  group: deform-dlo45-time-budget-recovery-v3
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  CUBLAS_WORKSPACE_CONFIG: ":4096:8"
  DATASET_ROOT: /mnt/seagate10tb/florianpfaff/datasets/deform/data_set
  UPSTREAM_ROOT: /home/florianpfaff/source-only/DEFORM-b73b8b8
  FROZEN_PYTHON: /home/florianpfaff/source-only/deform-bayesian-v1/venv/bin/python
  PROTOCOL: experiments/deform_dlo45_frozen_v1/protocol.json
  REQUEST_PATH: .github/requests/deform-dlo45-time-budget-recovery-v3.json
  RECOVERY_ROOT: /home/github-runner/.cache/workflows/deform-dlo45-time-budget-recovery-v3
  PRIOR_RUN_ROOT: /home/github-runner/.cache/workflows/deform-dlo45/runs/33335970581-1
  PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/scripts/remote:${{ github.workspace }}

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install contract dependencies
        run: python -m pip install -e . pytest ruff
      - name: Validate unchanged frozen evaluator
        run: |
          python -m pytest -q tests/test_deform_dlo45_frozen_v1.py
          python -m ruff check experiments/deform_dlo45_frozen_v1 tests/test_deform_dlo45_frozen_v1.py
          python -m ruff format --check experiments/deform_dlo45_frozen_v1 tests/test_deform_dlo45_frozen_v1.py

  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Authorize exactly one add-only timeout-recovery request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/science/deform-dlo45-time-budget-recovery-v3
          test "$PUSH_FORCED" = false
          test "$BEFORE_SHA" != 0000000000000000000000000000000000000000
          mapfile -t changed < <(git diff --name-status "$BEFORE_SHA" "$GITHUB_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = $'A\t.github/requests/deform-dlo45-time-budget-recovery-v3.json'
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          path = Path(".github/requests/deform-dlo45-time-budget-recovery-v3.json")
          request = json.loads(path.read_text(encoding="utf-8"))
          expected = {
              "schema": "deform-dlo45-evaluation-request-v1",
              "request_id": "deform-dlo45-time-budget-recovery-20260831-v3",
              "mode": "evaluate",
              "dataset_root": "/mnt/seagate10tb/florianpfaff/datasets/deform/data_set",
              "upstream_root": "/home/florianpfaff/source-only/DEFORM-b73b8b8",
              "runner_label": "gpuserver4090",
              "devices": ["cuda:0", "cuda:1"],
              "authorize_target_scoring": True,
              "evidence_class": (
                  "fresh frozen-procedure DLO4/DLO5 replication; "
                  "joint prediction seal before scoring; no retry"
              ),
              "paper_claim_authorized": False,
              "prior_failed_run_id": 33335970581,
              "prior_failure_stage": "source-fit-job-timeout-480-minutes",
              "prior_target_access": False,
              "prior_dlo4_completed_updates": 3250,
              "prior_dlo5_completed_updates": 3150,
              "source_timeout_minutes": 1200,
              "target_timeout_minutes": 1440,
              "retry_class": "pre-target-time-budget-correction",
              "frozen_method_revision": "e9e0a8c66dd928402037efc13e46fefb5b50150c",
          }
          for key, value in expected.items():
              if request.get(key) != value:
                  raise SystemExit(f"Invalid {key}: {request.get(key)!r}")
          if set(request) != set(expected) | {"expected_source_revision"}:
              raise SystemExit("Recovery request fields differ")
          parent = subprocess.check_output(
              ["git", "rev-parse", f"{os.environ['GITHUB_SHA']}^"], text=True
          ).strip()
          if request["expected_source_revision"] != parent:
              raise SystemExit("expected_source_revision is not the trigger parent")
          PY

  source:
    needs: [contracts, authorize]
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 1200
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bind exact data, runtime, prior failure, and fresh custody root
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DATASET_ROOT/DLO4/train" && test -d "$DATASET_ROOT/DLO4/eval"
          test -d "$DATASET_ROOT/DLO5/train" && test -d "$DATASET_ROOT/DLO5/eval"
          test -d "$UPSTREAM_ROOT/.git" && test -x "$FROZEN_PYTHON"
          test "$(nvidia-smi --query-gpu=name --format=csv,noheader | wc -l)" -ge 2
          safe_git_config="$RUNNER_TEMP/deform-dlo45-v3-gitconfig-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          : > "$safe_git_config"
          git config --file "$safe_git_config" --add safe.directory "$UPSTREAM_ROOT"
          export GIT_CONFIG_GLOBAL="$safe_git_config"
          test "$(git -C "$UPSTREAM_ROOT" rev-parse HEAD)" = b73b8b8ecc033caefa693fab7898741d4e6dbeff
          echo "GIT_CONFIG_GLOBAL=$safe_git_config" >> "$GITHUB_ENV"
          echo "DLO45_GIT_CONFIG=$safe_git_config" >> "$GITHUB_ENV"
          "$FROZEN_PYTHON" - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["PRIOR_RUN_ROOT"])
          expected = {"dlo4": 3250, "dlo5": 3150}
          for dlo, updates in expected.items():
              path = root / f"{dlo}-source" / "physical" / "progress.json"
              record = json.loads(path.read_text(encoding="utf-8"))
              if record.get("completed_updates") != updates:
                  raise SystemExit(f"Unexpected prior {dlo} progress: {record}")
              if record.get("requested_updates") != 6400:
                  raise SystemExit(f"Unexpected prior {dlo} update budget")
              if record.get("target_eval_read") is not False:
                  raise SystemExit(f"Prior {dlo} progress indicates target access")
          forbidden = [
              root / "joint" / "target_authorization.json",
              root / "joint" / "joint_prediction_seal.json",
              root / "dlo4-target",
              root / "dlo5-target",
              root / "score" / "result.json",
          ]
          if any(path.exists() for path in forbidden):
              raise SystemExit("Prior timeout run crossed the target boundary")
          PY
          out="$RECOVERY_ROOT/runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          request_sha="$($FROZEN_PYTHON -c 'import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest())' "$REQUEST_PATH")"
          claim="$RECOVERY_ROOT/claims/$request_sha"
          mkdir -p "$RECOVERY_ROOT/runs" "$RECOVERY_ROOT/claims"
          mkdir "$claim"
          printf '%s\n' "$GITHUB_SHA" > "$claim/github_sha"
          mkdir "$out" "$out/logs"
          echo "DLO45_OUT=$out" >> "$GITHUB_ENV"
          echo "DLO45_CLAIM=$claim" >> "$GITHUB_ENV"
      - name: Qualify DLO4 and DLO5 sources in parallel
        shell: bash
        run: |
          set -euo pipefail
          "$FROZEN_PYTHON" -m experiments.deform_dlo45_frozen_v1.run source \
            --protocol "$PROTOCOL" --dataset-root "$DATASET_ROOT" --upstream-root "$UPSTREAM_ROOT" \
            --output-root "$DLO45_OUT/dlo4-source" --dlo DLO4 --device cuda:0 \
            >"$DLO45_OUT/logs/dlo4-source.log" 2>&1 & p4=$!
          "$FROZEN_PYTHON" -m experiments.deform_dlo45_frozen_v1.run source \
            --protocol "$PROTOCOL" --dataset-root "$DATASET_ROOT" --upstream-root "$UPSTREAM_ROOT" \
            --output-root "$DLO45_OUT/dlo5-source" --dlo DLO5 --device cuda:1 \
            >"$DLO45_OUT/logs/dlo5-source.log" 2>&1 & p5=$!
          while kill -0 "$p4" 2>/dev/null || kill -0 "$p5" 2>/dev/null; do
            sleep 900
            for log in "$DLO45_OUT/logs/dlo4-source.log" "$DLO45_OUT/logs/dlo5-source.log"; do
              test -s "$log" && tail -n 1 "$log" || true
            done
          done
          s4=0; s5=0
          wait "$p4" || s4=$?
          wait "$p5" || s5=$?
          test "$s4" -eq 0 && test "$s5" -eq 0
      - name: Upload source qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: deform-dlo45-v3-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.DLO45_OUT }}/dlo4-source/source_result.json
            ${{ env.DLO45_OUT }}/dlo5-source/source_result.json
            ${{ env.DLO45_OUT }}/dlo4-source/physical/progress.json
            ${{ env.DLO45_OUT }}/dlo5-source/physical/progress.json
            ${{ env.DLO45_OUT }}/**/failure_receipt.json
            ${{ env.DLO45_OUT }}/logs
            ${{ env.PROTOCOL }}
            ${{ env.REQUEST_PATH }}
          retention-days: 90
          if-no-files-found: warn
      - name: Preserve source outputs privately and remove temporary trust
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -z "${DLO45_OUT:-}" || chmod -R u+rwX,go-rwx "$DLO45_OUT"
          test -z "${DLO45_GIT_CONFIG:-}" || rm -f "$DLO45_GIT_CONFIG"

  target:
    needs: source
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rebind source evidence and exact runtime
        shell: bash
        run: |
          set -euo pipefail
          out="$RECOVERY_ROOT/runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          request_sha="$($FROZEN_PYTHON -c 'import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest())' "$REQUEST_PATH")"
          claim="$RECOVERY_ROOT/claims/$request_sha"
          test -d "$out" && test -f "$out/dlo4-source/source_result.json" && test -f "$out/dlo5-source/source_result.json"
          test "$(cat "$claim/github_sha")" = "$GITHUB_SHA"
          safe_git_config="$RUNNER_TEMP/deform-dlo45-v3-target-gitconfig-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          : > "$safe_git_config"
          git config --file "$safe_git_config" --add safe.directory "$UPSTREAM_ROOT"
          export GIT_CONFIG_GLOBAL="$safe_git_config"
          test "$(git -C "$UPSTREAM_ROOT" rev-parse HEAD)" = b73b8b8ecc033caefa693fab7898741d4e6dbeff
          echo "GIT_CONFIG_GLOBAL=$safe_git_config" >> "$GITHUB_ENV"
          echo "DLO45_GIT_CONFIG=$safe_git_config" >> "$GITHUB_ENV"
          echo "DLO45_OUT=$out" >> "$GITHUB_ENV"
      - name: Authorize targets only after both source gates pass
        shell: bash
        run: |
          set -euo pipefail
          "$FROZEN_PYTHON" -m experiments.deform_dlo45_frozen_v1.run authorize \
            --protocol "$PROTOCOL" --dataset-root "$DATASET_ROOT" --upstream-root "$UPSTREAM_ROOT" \
            --output-root "$DLO45_OUT/joint" --request "$REQUEST_PATH" \
            --source-result-dlo4 "$DLO45_OUT/dlo4-source/source_result.json" \
            --source-result-dlo5 "$DLO45_OUT/dlo5-source/source_result.json"
      - name: Refit and predict both fresh DLOs in parallel
        shell: bash
        run: |
          set -euo pipefail
          auth="$DLO45_OUT/joint/target_authorization.json"
          "$FROZEN_PYTHON" -m experiments.deform_dlo45_frozen_v1.run predict \
            --protocol "$PROTOCOL" --dataset-root "$DATASET_ROOT" --upstream-root "$UPSTREAM_ROOT" \
            --output-root "$DLO45_OUT/dlo4-target" --dlo DLO4 --device cuda:0 \
            --source-result "$DLO45_OUT/dlo4-source/source_result.json" --authorization "$auth" \
            >"$DLO45_OUT/logs/dlo4-target.log" 2>&1 & p4=$!
          "$FROZEN_PYTHON" -m experiments.deform_dlo45_frozen_v1.run predict \
            --protocol "$PROTOCOL" --dataset-root "$DATASET_ROOT" --upstream-root "$UPSTREAM_ROOT" \
            --output-root "$DLO45_OUT/dlo5-target" --dlo DLO5 --device cuda:1 \
            --source-result "$DLO45_OUT/dlo5-source/source_result.json" --authorization "$auth" \
            >"$DLO45_OUT/logs/dlo5-target.log" 2>&1 & p5=$!
          while kill -0 "$p4" 2>/dev/null || kill -0 "$p5" 2>/dev/null; do
            sleep 900
            for log in "$DLO45_OUT/logs/dlo4-target.log" "$DLO45_OUT/logs/dlo5-target.log"; do
              test -s "$log" && tail -n 1 "$log" || true
            done
          done
          s4=0; s5=0
          wait "$p4" || s4=$?
          wait "$p5" || s5=$?
          test "$s4" -eq 0 && test "$s5" -eq 0
          "$FROZEN_PYTHON" -m experiments.deform_dlo45_frozen_v1.run seal \
            --protocol "$PROTOCOL" --dataset-root "$DATASET_ROOT" --upstream-root "$UPSTREAM_ROOT" \
            --output-root "$DLO45_OUT/joint" \
            --prediction-seal-dlo4 "$DLO45_OUT/dlo4-target/prediction_seal.json" \
            --prediction-seal-dlo5 "$DLO45_OUT/dlo5-target/prediction_seal.json"
      - name: Publish joint prediction seal before scoring
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: deform-dlo45-v3-joint-seal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.DLO45_OUT }}/joint/target_authorization.json
            ${{ env.DLO45_OUT }}/joint/joint_prediction_seal.json
            ${{ env.DLO45_OUT }}/dlo4-target/prediction_seal.json
            ${{ env.DLO45_OUT }}/dlo5-target/prediction_seal.json
          retention-days: 90
      - name: Upload target-stage compact evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: deform-dlo45-v3-target-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.DLO45_OUT }}/joint/target_authorization.json
            ${{ env.DLO45_OUT }}/joint/joint_prediction_seal.json
            ${{ env.DLO45_OUT }}/dlo4-target/method_seal.json
            ${{ env.DLO45_OUT }}/dlo4-target/eval_manifest.json
            ${{ env.DLO45_OUT }}/dlo4-target/prediction_seal.json
            ${{ env.DLO45_OUT }}/dlo5-target/method_seal.json
            ${{ env.DLO45_OUT }}/dlo5-target/eval_manifest.json
            ${{ env.DLO45_OUT }}/dlo5-target/prediction_seal.json
            ${{ env.DLO45_OUT }}/dlo4-target/alltrain/progress.json
            ${{ env.DLO45_OUT }}/dlo5-target/alltrain/progress.json
            ${{ env.DLO45_OUT }}/**/failure_receipt.json
            ${{ env.DLO45_OUT }}/logs
          retention-days: 90
          if-no-files-found: warn
      - name: Preserve target outputs privately and remove temporary trust
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -z "${DLO45_OUT:-}" || chmod -R u+rwX,go-rwx "$DLO45_OUT"
          test -z "${DLO45_GIT_CONFIG:-}" || rm -f "$DLO45_GIT_CONFIG"

  score:
    needs: target
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bind sealed predictions
        shell: bash
        run: |
          set -euo pipefail
          out="$RECOVERY_ROOT/runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test -f "$out/joint/joint_prediction_seal.json"
          echo "DLO45_OUT=$out" >> "$GITHUB_ENV"
      - name: Score both jointly sealed target sets once
        shell: bash
        run: |
          set -euo pipefail
          "$FROZEN_PYTHON" -m experiments.deform_dlo45_frozen_v1.run score \
            --protocol "$PROTOCOL" --dataset-root "$DATASET_ROOT" --upstream-root "$UPSTREAM_ROOT" \
            --output-root "$DLO45_OUT/score" --joint-seal "$DLO45_OUT/joint/joint_prediction_seal.json" \
            | tee "$DLO45_OUT/logs/score.log"
      - name: Upload final compact evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: deform-dlo45-v3-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.DLO45_OUT }}/score/result.json
            ${{ env.DLO45_OUT }}/logs/score.log
            ${{ env.DLO45_OUT }}/**/failure_receipt.json
            ${{ env.PROTOCOL }}
            ${{ env.REQUEST_PATH }}
          retention-days: 90
          if-no-files-found: warn
      - name: Lock retained run bytes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -z "${DLO45_OUT:-}" || chmod -R u+rwX,go-rwx "$DLO45_OUT"
