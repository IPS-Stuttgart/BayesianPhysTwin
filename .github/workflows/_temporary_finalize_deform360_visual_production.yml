name: Temporary finalize Deform360 visual production

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/_temporary_finalize_deform360_visual_production.yml"

permissions:
  contents: write

concurrency:
  group: temporary-finalize-deform360-visual-production-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  finalize:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.event.pull_request.number == 280 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref ==
        'agent/deform360-calibration-visual-production-v1' &&
      github.event.pull_request.user.login == 'FlorianPfaff'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PARENT_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PARENT_SHA }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply focused workflow and coverage repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path(
              ".github/workflows/deform360-calibration-visual-production.yml"
          )
          source = workflow.read_text(encoding="utf-8")
          install = '          python -m pip install -e ".[dev,graph]"\n'
          replacement = (
              install
              + '          python -m pip install "build>=1.2"\n'
          )
          if 'python -m pip install "build>=1.2"' not in source:
              if source.count(install) != 1:
                  raise SystemExit("dedicated build-install anchor changed")
              source = source.replace(install, replacement)
          workflow.write_text(source, encoding="utf-8")

          tests = Path("tests/test_deform360_calibration_visual_production.py")
          source = tests.read_text(encoding="utf-8")
          module_import = (
              "import bayesian_phystwin.deform360_calibration_visual_production "
              "as production_api\n"
          )
          if module_import not in source:
              anchor = "import pytest\n\n"
              if source.count(anchor) != 1:
                  raise SystemExit("test import anchor changed")
              source = source.replace(anchor, anchor + module_import + "\n")
          test_name = "test_validation_primitives_reject_malformed_metadata"
          if test_name not in source:
              source += f'''\n\ndef {test_name}() -> None:\n    with pytest.raises(ValueError, match="nonempty literal string"):\n        production_api._string("", name="value")\n    with pytest.raises(ValueError, match="integer >= 0"):\n        production_api._integer(False, name="value")\n    with pytest.raises(ValueError, match="JSON object"):\n        production_api._file_record([], name="file")\n    with pytest.raises(ValueError, match="JSON object"):\n        validate_deform360_motioncrafter_model_set_binding(\n            [], expected_model_set_id="0" * 64\n        )\n'''
          tests.write_text(source, encoding="utf-8")
          PY

      - name: Validate quality, contracts, coverage, and distribution
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev,graph]"
          python -m pip install "build>=1.2" "coverage==7.13.3"
          files=(
            src/bayesian_phystwin/deform360_calibration_visual_production.py
            scripts/science/execute_deform360_calibration_visual_production.py
            tests/test_deform360_calibration_visual_production.py
            tests/test_deform360_calibration_visual_production_workflow.py
          )
          python -m ruff check --fix "${files[@]}"
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy \
            src/bayesian_phystwin/deform360_calibration_visual_production.py \
            scripts/science/execute_deform360_calibration_visual_production.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_deform360_calibration_visual_production.py \
            tests/test_deform360_calibration_visual_production_workflow.py \
            tests/test_deform360_calibration_visual_execution_admission.py \
            tests/test_deform360_calibration_visual_execution_admission_edges.py

          module="bayesian_phystwin.deform360_calibration_visual_production"
          python -m coverage erase
          python -m coverage run --branch --source="${module}" -m pytest -q \
            tests/test_deform360_calibration_visual_production.py
          python -m coverage json -o focused-coverage.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("focused-coverage.json").read_text(encoding="utf-8"))
          matches = [
              value
              for name, value in report["files"].items()
              if name.endswith(
                  "deform360_calibration_visual_production.py"
              )
          ]
          if len(matches) != 1:
              raise SystemExit("focused coverage did not identify exactly one module")
          summary = matches[0]["summary"]
          lines = 100.0 * summary["covered_lines"] / summary["num_statements"]
          branches = 100.0 * (
              summary["covered_branches"] / summary["num_branches"]
          )
          print(f"focused lines={lines:.2f}% branches={branches:.2f}%")
          if lines < 90.0 or branches < 80.0:
              raise SystemExit("focused coverage remains below repository floors")
          PY

          rm -rf build dist ./*.egg-info src/*.egg-info
          python -m build --sdist
          archive="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "${archive}"
          listing="$(tar -tzf "${archive}")"
          grep -Fq '/docs/deform360_calibration_visual_production.md' <<<"${listing}"
          grep -Fq '/scripts/science/execute_deform360_calibration_visual_production.py' <<<"${listing}"
          grep -Fq '/src/bayesian_phystwin/deform360_calibration_visual_production.py' <<<"${listing}"
          rm -rf build dist ./*.egg-info src/*.egg-info

      - name: Publish validated blobs and receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RECEIPT: ${{ runner.temp }}/deform360-visual-production-finalization.json
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          repository = os.environ["GITHUB_REPOSITORY"]
          api = os.environ["GITHUB_API_URL"]
          token = os.environ["GITHUB_TOKEN"]
          parent = os.environ["PARENT_SHA"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          def request(method: str, path: str, payload: object | None = None) -> object:
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  f"{api}/repos/{repository}{path}",
                  data=data,
                  headers=headers,
                  method=method,
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          parent_commit = request("GET", f"/git/commits/{parent}")
          paths = (
              ".github/workflows/deform360-calibration-visual-production.yml",
              "tests/test_deform360_calibration_visual_production.py",
          )
          blobs = {}
          for path in paths:
              blob = request(
                  "POST",
                  "/git/blobs",
                  {
                      "content": base64.b64encode(Path(path).read_bytes()).decode("ascii"),
                      "encoding": "base64",
                  },
              )
              blobs[path] = str(blob["sha"])
          receipt = {
              "parent_sha": parent,
              "base_tree_sha": str(parent_commit["tree"]["sha"]),
              "blobs": blobs,
              "delete": [
                  ".github/workflows/_temporary_finalize_deform360_visual_production.yml"
              ],
          }
          Path(os.environ["RECEIPT"]).write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: deform360-visual-production-finalization-${{ env.PARENT_SHA }}
          path: |
            focused-coverage.json
            ${{ runner.temp }}/deform360-visual-production-finalization.json
          if-no-files-found: error
          retention-days: 2
