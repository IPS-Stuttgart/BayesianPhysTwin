name: Capability atlas branch materialization

on:
  push:
    branches: [feature/decision-capability-atlas-v1]

permissions:
  contents: write

concurrency:
  group: capability-atlas-materialization-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/decision-capability-atlas-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize reviewed capability-atlas sources
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/capability-atlas.tar.gz"
          printf '%s' '' | base64 --decode > "$payload"
          echo '2d15b079749c4020857240d1e3073c6263495faba922235282e1656c27f0f056  '"$payload" | sha256sum --check --strict
          tar -xzf "$payload" -C .
          rm -- .github/workflows/capability-atlas-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Add exact decision capability atlas'
          git push origin HEAD:feature/decision-capability-atlas-v1