name: Temporary PR 690 CI autofix

on:
  push:
    branches:
      - agent/backend-portfolio-budget-v1

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/backend-portfolio-budget-v1
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Format changed Python files
        run: |
          python -m pip install "ruff==0.16.3"
          python -m ruff format \
            src/bayesian_phystwin/backend_portfolio_v1.py \
            tests/test_portable_contracts_backend_portfolio_v1.py
          python -m ruff check \
            src/bayesian_phystwin/backend_portfolio_v1.py \
            tests/test_portable_contracts_backend_portfolio_v1.py
      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-pr690-ci-autofix.yml
          git add src/bayesian_phystwin/backend_portfolio_v1.py tests/test_portable_contracts_backend_portfolio_v1.py
          git commit -m "Fix PR 690 CI formatting"
          git push origin HEAD:agent/backend-portfolio-budget-v1
