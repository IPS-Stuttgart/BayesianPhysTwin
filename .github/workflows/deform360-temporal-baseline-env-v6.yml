# workflow-lifecycle: temporary-one-shot
# workflow-owner: IPS-Stuttgart maintainers
name: Deform360 temporal baseline runtime audit v6

on:
  push:
    branches: [science/deform360-temporal-baseline-v6]
    paths:
      - ".github/requests/deform360-temporal-baseline-env-v6.json"

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit numerical runtimes
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/deform360-temporal-env-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$out"
          echo "OUTPUT_ROOT=$out" >> "$GITHUB_ENV"
          {
            echo "runner=$RUNNER_NAME"
            uname -a
            nvidia-smi || true
            echo "PATH=$PATH"
            command -v python3 || true
            command -v python || true
            command -v conda || true
            command -v mamba || true
            command -v micromamba || true
            command -v uv || true
            echo "--- candidate interpreters ---"
            candidates=(
              "$(command -v python3 || true)"
              "$(command -v python || true)"
              /opt/conda/bin/python
              /opt/miniconda3/bin/python
              /home/github-runner/miniconda3/bin/python
              /home/github-runner/anaconda3/bin/python
              /home/florianpfaff/miniconda3/bin/python
              /home/florianpfaff/anaconda3/bin/python
            )
            declare -A seen=()
            for candidate in "${candidates[@]}"; do
              [[ -n "$candidate" && -x "$candidate" ]] || continue
              [[ -z "${seen[$candidate]:-}" ]] || continue
              seen[$candidate]=1
              echo "### $candidate"
              "$candidate" --version || true
              "$candidate" - <<'PY' || true
          import importlib.util
          for name in ("numpy", "torch", "sklearn"):
              print(f"{name}={importlib.util.find_spec(name)}")
          try:
              import numpy
              print("numpy_version=" + numpy.__version__)
          except Exception as exc:
              print("numpy_error=" + repr(exc))
          try:
              import torch
              print("torch_version=" + torch.__version__)
              print("cuda_available=" + str(torch.cuda.is_available()))
              print("cuda_version=" + str(torch.version.cuda))
              if torch.cuda.is_available():
                  print("cuda_device=" + torch.cuda.get_device_name(0))
          except Exception as exc:
              print("torch_error=" + repr(exc))
          PY
            done
          } | tee "$out/environment.txt"
      - name: Upload runtime audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deform360-temporal-baseline-env-v6-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_ROOT }}
          if-no-files-found: warn
          retention-days: 7
