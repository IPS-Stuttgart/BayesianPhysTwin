# workflow-lifecycle: temporary
# workflow-owner: IPS-Stuttgart maintainers
# workflow-issue: https://github.com/IPS-Stuttgart/BayesianPhysTwin/pull/878
# workflow-expiry: 2026-09-03
name: Format capability atlas once

on:
  push:
    branches: [feature/decision-capability-atlas-v1]
    paths:
      - ".github/workflows/format-capability-atlas.yml"

permissions:
  contents: write

concurrency:
  group: format-capability-atlas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Apply exact Ruff formatting and remove launcher
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/decision-capability-atlas-v1
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Format, verify, and commit
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "ruff==0.16.5"
          files=(
            src/bayesian_phystwin/decision_capability_task_uncertainty_v1.py
            tests/test_deform_dlo45_decision_capability_task_uncertainty_v1.py
          )
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          git rm .github/workflows/format-capability-atlas.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format objective-robust capability atlas"
          git push origin HEAD:feature/decision-capability-atlas-v1
