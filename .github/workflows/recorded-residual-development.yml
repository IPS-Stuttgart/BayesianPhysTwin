# workflow-lifecycle: permanent
# workflow-owner: IPS-Stuttgart maintainers
name: Recorded residual development
on:
  workflow_dispatch:
  push:
    branches: ["run/recorded-residual-*"]
    paths: [".github/requests/recorded-residual-development.json"]
permissions:
  contents: read
concurrency:
  group: recorded-residual-development-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  DEFORM_PYTHON: /home/florianpfaff/source-only/deform-bayesian-v1/venv/bin/python
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.request.outputs.mode }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Validate request
        id: request
        run: |
          python3 - <<'PY'
          import json, os
          req=json.load(open('.github/requests/recorded-residual-development.json'))
          assert req['issue']==951 and req['dataset']=='DLO1/train'
          assert req['official_eval_authorized'] is False
          assert req['mode'] in ('export','contracts')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('mode='+req['mode']+'\n')
          PY
      - name: Set up isolated Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Test model implementation
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0 pytest==8.4.2
          python -m pytest -q experiments/recorded_residual_regimes_v1/test_model.py
          python -m compileall -q experiments/recorded_residual_regimes_v1
      - name: Bundle exact source for portable recorded-data scoring
        run: |
          mkdir -p "$RUNNER_TEMP/recorded-residual-source"
          git rev-parse HEAD > "$RUNNER_TEMP/recorded-residual-source/revision.txt"
          tar -czf "$RUNNER_TEMP/recorded-residual-source/source.tar.gz" src experiments/recorded_residual_regimes_v1 .github/requests/recorded-residual-development.json
          sha256sum "$RUNNER_TEMP/recorded-residual-source/source.tar.gz" > "$RUNNER_TEMP/recorded-residual-source/sha256.txt"
      - name: Retain exact source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recorded-residual-source-${{ github.run_id }}
          path: ${{ runner.temp }}/recorded-residual-source
          retention-days: 30
          if-no-files-found: error
  development:
    needs: contracts
    if: github.repository == 'IPS-Stuttgart/BayesianPhysTwin' && needs.contracts.outputs.mode == 'export'
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Validate production environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/recorded-residual-$GITHUB_RUN_ID"
          echo "RUN_ROOT=$RUNNER_TEMP/recorded-residual-$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          "$DEFORM_PYTHON" - <<'PY'
          import json, os, pathlib, sys
          sys.path[:0]=['src','scripts/remote']
          import run_deform_dlo_source as source
          shim=source._install_dense_import_shim()
          import torch, numpy, theseus
          inventory={'python':sys.executable,'torch':torch.__version__,'numpy':numpy.__version__,'dense_shim':shim}
          dest=pathlib.Path(os.environ['RUNNER_TEMP'])/('recorded-residual-'+os.environ['GITHUB_RUN_ID'])
          (dest/'inventory.json').write_text(json.dumps(inventory,indent=2)+'\n')
          print(json.dumps(inventory,indent=2),flush=True)
          PY
      - name: Choose available GPU and replay source-only recordings
        shell: bash
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /home/florianpfaff/source-only/deform-bayesian-v1/DEFORM-b73b8b8
        run: |
          set -euo pipefail
          GPU=$(nvidia-smi --query-gpu=index,memory.free --format=csv,noheader,nounits | sort -t, -k2 -nr | head -1 | cut -d, -f1 | tr -d ' ')
          export CUDA_VISIBLE_DEVICES="$GPU"
          export CUBLAS_WORKSPACE_CONFIG=:4096:8
          "$DEFORM_PYTHON" experiments/recorded_residual_regimes_v1/export_dlo1.py --output "$RUN_ROOT/export" 2>&1 | tee "$RUN_ROOT/export.log"
      - name: Retain development artifacts, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recorded-residual-development-${{ github.run_id }}
          path: ${{ runner.temp }}/recorded-residual-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
