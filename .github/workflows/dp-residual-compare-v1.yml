# workflow-lifecycle: temporary
# workflow-owner: IPS-Stuttgart maintainers
name: DP versus finite residual experts DLO1 v1
on:
  push:
    branches: [science/dp-residual-development-v1-20260907]
    paths:
      - .github/workflows/dp-residual-compare-v1.yml
      - experiments/dp_residual_development_v1/model.py
      - experiments/dp_residual_development_v1/run.py
      - experiments/dp_residual_development_v1/test_model.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dp-residual-dlo1-comparison-v1
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      SOURCE_ARTIFACT_ID: '9995078685'
      SOURCE_ARTIFACT_SHA256: '083eaca1233d6373e515790f567a831a1d9d6092069ff2cd244e10955ae45c60'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install isolated CPU experiment runtime
        run: python -m pip install -e . 'numpy==2.2.6' 'scipy==1.15.3' 'scikit-learn==1.8.0' 'pytest==8.3.5'
      - name: Test matched experts and future-truth isolation
        run: python -m pytest -q experiments/dp_residual_development_v1/test_model.py
      - name: Fetch exact prepared development bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/IPS-Stuttgart/BayesianPhysTwin/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" > "$RUNNER_TEMP/development.zip"
          echo "${SOURCE_ARTIFACT_SHA256}  $RUNNER_TEMP/development.zip" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/dp-data"
          unzip -q "$RUNNER_TEMP/development.zip" -d "$RUNNER_TEMP/dp-data"
      - name: Select inside fit data, freeze forecasts, score old validation trajectories
        shell: bash
        run: |
          set -euo pipefail
          python experiments/dp_residual_development_v1/run.py \
            --bundle "$RUNNER_TEMP/dp-data/development.npz" \
            --preparation "$RUNNER_TEMP/dp-data/preparation.json" \
            --output "$RUNNER_TEMP/dp-result" | tee "$RUNNER_TEMP/dp-comparison.log"
          cat "$RUNNER_TEMP/dp-result/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve implementation for local replay
        if: always()
        run: tar -czf "$RUNNER_TEMP/dp-implementation.tar.gz" experiments/dp_residual_development_v1 src pyproject.toml
      - name: Retain scores, predictions, complete selection bank and exact code
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dp-dlo1-comparison-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/dp-result
            ${{ runner.temp }}/dp-comparison.log
            ${{ runner.temp }}/dp-implementation.tar.gz
          retention-days: 90
          if-no-files-found: error
