name: Full-22 tempered model-average replication

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/full22-tempered-model-average-self-hosted.yml"
      - "protocols/full22_tempered_model_average_experiment_v1.json"
      - "scripts/science/run_full22_tempered_model_average_experiment.py"
      - "scripts/science/run_full22_endpoint_model_average_diagnostic.py"
      - "tests/test_full22_tempered_model_average_experiment.py"
      - "src/bayesian_phystwin/endpoint_model_average.py"
  workflow_dispatch:
    inputs:
      runner:
        description: Runner type
        required: true
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - self-hosted
      workers:
        description: Independent PhysTwin cases evaluated concurrently
        required: false
        default: "2"
        type: string

permissions:
  contents: read

concurrency:
  group: full22-tempered-model-average-self-hosted-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  experiment:
    name: Source-tuned replication
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: >-
      ${{
        inputs.runner == 'self-hosted' &&
        fromJSON('["self-hosted","Linux","X64","nvidia-smi"]') ||
        'ubuntu-latest'
      }}
    timeout-minutes: 360
    steps:
      - name: Check out BayesianPhysTwin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Restore public PhysTwin trajectory subset
        if: ${{ inputs.runner != 'self-hosted' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bayesian-phystwin/trajectory-evaluation-v1
          key: >-
            bpt-trajectory-evaluation-v1-${{ runner.os }}-${{
            hashFiles('src/bayesian_phystwin/phystwin_data.py') }}-${{
            github.sha }}
          restore-keys: |
            bpt-trajectory-evaluation-v1-${{ runner.os }}-${{ hashFiles('src/bayesian_phystwin/phystwin_data.py') }}-
            bpt-trajectory-evaluation-v1-${{ runner.os }}-

      - name: Resolve cache, output, and worker settings
        shell: bash
        env:
          CONFIGURED_CACHE: >-
            ${{ inputs.runner == 'self-hosted' &&
            vars.PHYSTWIN_EVALUATION_CACHE || '' }}
          REQUESTED_WORKERS: ${{ inputs.workers || '2' }}
        run: |
          set -euo pipefail
          if [[ -n "${CONFIGURED_CACHE}" ]]; then
            data_root="${CONFIGURED_CACHE}/trajectory-evaluation-v1"
          else
            data_root="${HOME}/.cache/bayesian-phystwin/trajectory-evaluation-v1"
          fi
          if ! [[ "${REQUESTED_WORKERS}" =~ ^[1-9][0-9]*$ ]]; then
            echo "workers must be a positive integer" >&2
            exit 1
          fi
          output_root="${RUNNER_TEMP}/bpt-full22-tempered-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${data_root}" "${output_root}"
          echo "DATA_ROOT=${data_root}" >> "${GITHUB_ENV}"
          echo "OUTPUT_ROOT=${output_root}" >> "${GITHUB_ENV}"
          echo "CASE_WORKERS=${REQUESTED_WORKERS}" >> "${GITHUB_ENV}"

      - name: Record runner and source identity
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "revision=${GITHUB_SHA}"
            echo "case_workers=${CASE_WORKERS}"
            uname -a
            lscpu
          } | tee "${OUTPUT_ROOT}/runner.txt"
          if command -v nvidia-smi >/dev/null 2>&1; then
            nvidia-smi -L | tee "${OUTPUT_ROOT}/nvidia-smi-L.txt"
            nvidia-smi \
              --query-gpu=index,name,uuid,driver_version,memory.total \
              --format=csv,noheader \
              | tee "${OUTPUT_ROOT}/nvidia-smi.csv"
          else
            echo "nvidia-smi is unavailable on this CPU runner" \
              | tee "${OUTPUT_ROOT}/nvidia-smi.txt"
          fi

      - name: Install the locked evaluation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,data,graph]"
          python -m pip check
          python -m pip freeze --all > "${OUTPUT_ROOT}/pip-freeze.txt"

      - name: Validate implementation and protocol before target evaluation
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check \
            scripts/science/run_full22_tempered_model_average_experiment.py \
            tests/test_full22_tempered_model_average_experiment.py
          python -m ruff format --check \
            scripts/science/run_full22_tempered_model_average_experiment.py \
            tests/test_full22_tempered_model_average_experiment.py
          python -m pytest -q \
            tests/test_full22_tempered_model_average_experiment.py \
            tests/test_endpoint_model_average.py
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          payload = json.loads(
              Path(
                  "protocols/full22_tempered_model_average_experiment_v1.json"
              ).read_text(encoding="utf-8")
          )
          digest = hashlib.sha256(
              json.dumps(
                  payload,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              ).encode("utf-8")
          ).hexdigest()
          expected = "a351cf37ba19130feca4dcfb87b1e7ab9a2e601d22edeed3a39a00c904ecbbe3"
          if digest != expected:
              raise SystemExit(
                  f"protocol digest changed: expected {expected}, received {digest}"
              )
          print(f"locked protocol: {digest}")
          PY

      - name: Run locked source selection and confirmation diagnosis
        shell: bash
        run: |
          set -euo pipefail
          python scripts/science/run_full22_tempered_model_average_experiment.py \
            "${DATA_ROOT}" \
            "${OUTPUT_ROOT}/result" \
            --protocol \
              protocols/full22_tempered_model_average_experiment_v1.json \
            --workers "${CASE_WORKERS}" \
            --repository-revision "${GITHUB_SHA}" \
            --force \
            | tee "${OUTPUT_ROOT}/experiment-console.json"
          cp "${DATA_ROOT}/trajectory_evaluation_manifest.json" \
            "${OUTPUT_ROOT}/result/data_manifest.json"

      - name: Verify result integrity and source-only selection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["OUTPUT_ROOT"]) / "result"
          manifest = json.loads(
              (root / "artifact_manifest.json").read_text(encoding="utf-8")
          )
          for name, key in (
              ("selection.json", "selection_sha256"),
              ("summary.json", "summary_sha256"),
              ("readout.json", "readout_sha256"),
              ("per_case.csv", "per_case_csv_sha256"),
          ):
              actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
              if actual != manifest[key]:
                  raise SystemExit(f"{name} digest disagrees with manifest")
          summary = json.loads((root / "summary.json").read_text(encoding="utf-8"))
          selection = json.loads(
              (root / "selection.json").read_text(encoding="utf-8")
          )
          if summary["aggregate"]["confirmation_19"]["case_count"] != 19:
              raise SystemExit("confirmation partition no longer has 19 cases")
          if not summary["selection"]["locked_before_confirmation"]:
              raise SystemExit("selection was not locked before confirmation")
          if selection["confirmation_outcomes_opened"] is not False:
              raise SystemExit("selection artifact crossed the outcome boundary")
          print(json.dumps(summary["selection"], indent=2, sort_keys=True))
          PY
          git diff --exit-code
          git status --porcelain=v1 | tee "${OUTPUT_ROOT}/git-status.txt"
          test ! -s "${OUTPUT_ROOT}/git-status.txt"

      - name: Upload compact replication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bpt-full22-tempered-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bpt-full22-tempered-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
