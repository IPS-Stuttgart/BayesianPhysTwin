name: One-shot Deform360 NPZ header inventory

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/full22-tempered-model-average-self-hosted.yml"

permissions:
  contents: read

concurrency:
  group: one-shot-deform360-group-held-out-${{ github.ref }}
  cancel-in-progress: true

env:
  DEFORM360_ROOT: /home/github-runner/.cache/datasets/deform360
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  inventory:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 60
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/deform360-group-tempered-experiment
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Inventory NPZ headers without reading array payloads
        shell: bash
        run: |
          set -euo pipefail
          test -d "${DEFORM360_ROOT}"
          mkdir -p deform360-npz-inventory
          python - <<'PY'
          import ast
          import hashlib
          import json
          import os
          import re
          import struct
          import zipfile
          from collections import Counter
          from pathlib import Path

          root = Path(os.environ["DEFORM360_ROOT"]).resolve()
          object_pattern = re.compile(r"^\d{3}-.+")
          trajectory_hints = (
              "positions_world_m",
              "points_world_m",
              "positions_m",
              "control_points",
              "particle_tracks",
              "particles",
              "tracks",
              "trajectory",
              "positions",
              "points",
          )

          def npy_header(stream):
              if stream.read(6) != b"\x93NUMPY":
                  raise ValueError("not an NPY member")
              major, minor = stream.read(2)
              if (major, minor) == (1, 0):
                  size = struct.unpack("<H", stream.read(2))[0]
              elif major in {2, 3}:
                  size = struct.unpack("<I", stream.read(4))[0]
              else:
                  raise ValueError(f"unsupported NPY version {(major, minor)}")
              header = ast.literal_eval(stream.read(size).decode("latin1").strip())
              return {
                  "shape": list(header["shape"]),
                  "dtype": str(header["descr"]),
                  "fortran_order": bool(header["fortran_order"]),
              }

          records = []
          failures = []
          top_level_npz = Counter()
          top_level_compatible = Counter()
          for directory, names, files in os.walk(root):
              names[:] = sorted(
                  name
                  for name in names
                  if name not in {".git", "__pycache__", "node_modules"}
              )
              for name in sorted(files):
                  if not name.lower().endswith(".npz"):
                      continue
                  path = Path(directory) / name
                  relative = path.relative_to(root).as_posix()
                  top_level = relative.split("/", 1)[0]
                  top_level_npz[top_level] += 1
                  try:
                      arrays = {}
                      with zipfile.ZipFile(path) as archive:
                          for member in sorted(archive.namelist()):
                              if not member.endswith(".npy"):
                                  continue
                              key = member[:-4]
                              with archive.open(member) as stream:
                                  arrays[key] = npy_header(stream)
                      trajectory = []
                      for key, metadata in arrays.items():
                          lowered = key.lower()
                          shape = metadata["shape"]
                          if (
                              any(hint in lowered for hint in trajectory_hints)
                              and len(shape) == 3
                              and shape[-1] == 3
                              and shape[0] >= 4
                          ):
                              trajectory.append(key)
                      packed = {
                          "frame_indices",
                          "point_offsets",
                          "points_world_m",
                      }.issubset(arrays)
                      compatible = bool(trajectory or packed)
                      if compatible:
                          top_level_compatible[top_level] += 1
                      parts = relative.split("/")
                      object_id = next(
                          (part for part in parts if object_pattern.match(part)),
                          None,
                      )
                      records.append(
                          {
                              "path": relative,
                              "size_bytes": path.stat().st_size,
                              "top_level": top_level,
                              "object_id": object_id,
                              "arrays": arrays,
                              "trajectory_keys": trajectory,
                              "packed_visual_hull_contract": packed,
                              "compatible_sequence_contract": compatible,
                          }
                      )
                  except Exception as error:
                      failures.append(
                          {
                              "path": relative,
                              "error_type": type(error).__name__,
                              "error": str(error),
                          }
                      )

          payload = {
              "schema": "bayesian-phystwin/deform360-npz-header-inventory-v1",
              "schema_version": 1,
              "repository_revision": os.environ["GITHUB_SHA"],
              "dataset_root": str(root),
              "information_boundary": {
                  "array_payload_values_read": False,
                  "npy_headers_read": True,
                  "target_outcomes_opened": False,
              },
              "npz_count": len(records),
              "failure_count": len(failures),
              "compatible_sequence_count": sum(
                  record["compatible_sequence_contract"] for record in records
              ),
              "top_level_npz_counts": dict(sorted(top_level_npz.items())),
              "top_level_compatible_counts": dict(
                  sorted(top_level_compatible.items())
              ),
              "records": records,
              "failures": failures,
          }
          canonical = json.dumps(
              payload,
              sort_keys=True,
              separators=(",", ":"),
              allow_nan=False,
          ).encode("utf-8")
          payload["inventory_sha256"] = hashlib.sha256(canonical).hexdigest()
          destination = Path("deform360-npz-inventory/inventory.json")
          destination.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          readout = {
              "npz_count": payload["npz_count"],
              "failure_count": payload["failure_count"],
              "compatible_sequence_count": payload[
                  "compatible_sequence_count"
              ],
              "top_level_compatible_counts": payload[
                  "top_level_compatible_counts"
              ],
              "inventory_sha256": payload["inventory_sha256"],
          }
          Path("deform360-npz-inventory/readout.json").write_text(
              json.dumps(readout, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(readout, indent=2, sort_keys=True))
          PY

      - name: Upload header-only inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deform360-npz-header-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: deform360-npz-inventory
          if-no-files-found: error
          retention-days: 30
