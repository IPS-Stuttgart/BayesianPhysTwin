name: One-shot verified legacy payload propagation

on:
  push:
    branches: [fix/legacy-pickle-snapshot-toctou]
    paths:
      - ".github/workflows/_one_shot_extend_legacy_snapshot.yml"
      - "scripts/_one_shot_extend_legacy_snapshot.py"

permissions:
  contents: write

concurrency:
  group: one-shot-legacy-pickle-snapshot-toctou
  cancel-in-progress: true

jobs:
  propagate:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.ref == 'refs/heads/fix/legacy-pickle-snapshot-toctou'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Provision Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply exact source transformations
        run: |
          set -euo pipefail
          python scripts/_one_shot_extend_legacy_snapshot.py

      - name: Install focused validation environment
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev,graph]"
          python -m pip check

      - name: Format and validate changed source
        run: |
          set -euo pipefail
          files=(
            src/bayesian_phystwin/legacy_artifacts.py
            src/bayesian_phystwin/phystwin_raw_cues.py
            src/bayesian_phystwin/causal4d_artifacts_v1.py
            src/bayesian_phystwin/causal4d_artifacts_v2.py
            tests/conftest.py
            tests/test_legacy_artifacts.py
            tests/test_legacy_artifacts_snapshot.py
            tests/test_causal4d_artifacts_v2.py
            tests/test_phystwin_raw_cues.py
          )
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy \
            src/bayesian_phystwin/legacy_artifacts.py \
            src/bayesian_phystwin/phystwin_raw_cues.py \
            src/bayesian_phystwin/causal4d_artifacts_v1.py \
            src/bayesian_phystwin/causal4d_artifacts_v2.py

      - name: Run focused and adjacent contracts
        run: |
          set -euo pipefail
          python -m pytest -q -p no:cacheprovider \
            tests/test_legacy_artifacts.py \
            tests/test_legacy_artifacts_snapshot.py \
            tests/test_causal4d_artifacts_v2.py \
            tests/test_phystwin_raw_cues.py
          python -m py_compile \
            src/bayesian_phystwin/legacy_artifacts.py \
            src/bayesian_phystwin/phystwin_raw_cues.py \
            src/bayesian_phystwin/causal4d_artifacts_v1.py \
            src/bayesian_phystwin/causal4d_artifacts_v2.py

      - name: Remove one-shot transport and verify scope
        run: |
          set -euo pipefail
          rm -- \
            .github/workflows/_one_shot_extend_legacy_snapshot.yml \
            scripts/_one_shot_extend_legacy_snapshot.py
          git diff --check
          actual="$(git diff --name-only | sort)"
          printf 'Final working-tree paths:\n%s\n' "${actual}"
          while IFS= read -r path; do
            case "${path}" in
              .github/workflows/_one_shot_extend_legacy_snapshot.yml|\
              scripts/_one_shot_extend_legacy_snapshot.py|\
              src/bayesian_phystwin/legacy_artifacts.py|\
              src/bayesian_phystwin/phystwin_raw_cues.py|\
              src/bayesian_phystwin/causal4d_artifacts_v1.py|\
              src/bayesian_phystwin/causal4d_artifacts_v2.py|\
              tests/conftest.py|\
              tests/test_legacy_artifacts.py|\
              tests/test_legacy_artifacts_snapshot.py|\
              tests/test_causal4d_artifacts_v2.py|\
              tests/test_phystwin_raw_cues.py)
                ;;
              *)
                echo "unexpected final-scope path: ${path}" >&2
                exit 1
                ;;
            esac
          done <<<"${actual}"

      - name: Commit validated final source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            .github/workflows/_one_shot_extend_legacy_snapshot.yml \
            scripts/_one_shot_extend_legacy_snapshot.py \
            src/bayesian_phystwin/legacy_artifacts.py \
            src/bayesian_phystwin/phystwin_raw_cues.py \
            src/bayesian_phystwin/causal4d_artifacts_v1.py \
            src/bayesian_phystwin/causal4d_artifacts_v2.py \
            tests/conftest.py \
            tests/test_legacy_artifacts.py \
            tests/test_legacy_artifacts_snapshot.py \
            tests/test_causal4d_artifacts_v2.py \
            tests/test_phystwin_raw_cues.py
          git commit -m 'Propagate verified legacy mappings downstream'
          git push origin HEAD:fix/legacy-pickle-snapshot-toctou
