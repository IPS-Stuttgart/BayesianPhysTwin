name: Temporary formatter for full-22 PR 118

on:
  push:
    branches:
      - agent/portable-full22-anchor-reproduction
    paths:
      - .github/workflows/temporary-format-full22-pr118.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temporary-format-full22-pr118.yml

permissions:
  contents: write

jobs:
  format:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/portable-full22-anchor-reproduction
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply formatter-only repair
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "ruff==0.16.1"
          python -m ruff format \
            reproductions/full22_anchor_v1/reproduce.py \
            tests/test_full22_reproduction_capsule.py
          python -m ruff check \
            reproductions/full22_anchor_v1/reproduce.py \
            tests/test_full22_reproduction_capsule.py
          python -m ruff format --check \
            reproductions/full22_anchor_v1/reproduce.py \
            tests/test_full22_reproduction_capsule.py
          rm .github/workflows/temporary-format-full22-pr118.yml

      - name: Commit and publish formatter repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            reproductions/full22_anchor_v1/reproduce.py \
            tests/test_full22_reproduction_capsule.py \
            .github/workflows/temporary-format-full22-pr118.yml
          git diff --cached --check
          git commit -m "Format portable full-22 capsule"
          git push origin HEAD:agent/portable-full22-anchor-reproduction
