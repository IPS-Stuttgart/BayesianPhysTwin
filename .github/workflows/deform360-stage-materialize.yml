name: Materialize Deform360 stage authorization

on:
  push:
    branches:
      - agent/deform360-stage-authorization
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: deform360-stage-materialize-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

env:
  TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}

jobs:
  materialize:
    name: Materialize and validate exact source
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 30
    steps:
      - name: Check out exact transport commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Verify and extract exact source bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/deform360-stage-files.tar.gz"
          cat .agent/deform360-stage-files.b64.* | base64 --decode > "${bundle}"
          printf '%s  %s\n' \
            'ee2fe46a9f776039ff9f5b10fb02e179a18139e28e70fc4cf8c55831eb852e05' \
            "${bundle}" | sha256sum -c -
          tar -xzf "${bundle}"
          rm -rf .agent
          rm -f .github/workflows/deform360-stage-materialize.yml

      - name: Install validation environment
        run: |
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Validate exact staged source
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/bayesian_phystwin/__init__.py
            src/bayesian_phystwin/deform360_stage_authorization.py
            src/bayesian_phystwin/deform360_visual_provider_lock.py
            src/bayesian_phystwin/cli/_command_inventory.py
            src/bayesian_phystwin/cli/deform360_stage_authorization.py
            src/bayesian_phystwin/cli/experiments.py
            tests/test_command_registry.py
            tests/test_deform360_visual_provider_lock.py
          )
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy \
            src/bayesian_phystwin/deform360_stage_authorization.py \
            src/bayesian_phystwin/deform360_visual_provider_lock.py \
            src/bayesian_phystwin/cli/deform360_stage_authorization.py
          python -m pytest -q \
            tests/test_deform360_visual_provider_lock.py \
            tests/test_deform360_calibration_bundle.py \
            tests/test_evidence_use_ledger.py \
            tests/test_command_registry.py \
            tests/test_cli_main.py \
            tests/test_release_metadata.py
          bpt commands describe authorize-deform360-stage --json >/dev/null
          bpt experiment run authorize-deform360-stage --help >/dev/null
          python -m compileall -q src
          git diff --check

      - name: Publish one clean validated commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git reset --soft origin/main
          git add -A
          git commit -m 'Add fail-closed Deform360 stage authorization'
          git push --force-with-lease origin "HEAD:${TARGET_BRANCH}"
