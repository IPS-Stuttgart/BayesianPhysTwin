name: Temporary export tempered V2 source

on:
  push:
    branches:
      - agent/tempered-endpoint-belief-v2
    paths:
      - .github/workflows/temporary-export-tempered-v2-source.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temporary-export-tempered-v2-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact source tree
        run: git archive --format=tar.gz --output=bayesian-phystwin-source.tar.gz HEAD
      - name: Upload source tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tempered-v2-source-${{ github.sha }}
          path: bayesian-phystwin-source.tar.gz
          if-no-files-found: error
          retention-days: 1
