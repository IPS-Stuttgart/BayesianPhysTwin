name: Temporary repair of Deform360 source retry

on:
  push:
    branches:
      - science/deform360-explicit-mount-source-v1
    paths:
      - .github/workflows/tmp-repair-deform360-source-retry1.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: science/deform360-explicit-mount-source-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Move runner path initialization into its own step
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(
              ".github/workflows/"
              "deform360-source-pilot-materialization-v1-retry1.yml"
          )
          text = path.read_text(encoding="utf-8")
          invalid_env = '''    env:
                EVIDENCE_ROOT: ${{ runner.temp }}/deform360-source-pilot-retry1-${{ github.run_id }}-${{ github.run_attempt }}
                RUNTIME_ROOT: ${{ runner.temp }}/deform360-source-pilot-venv-retry1-${{ github.run_id }}-${{ github.run_attempt }}
                RUNTIME_PYTHON: ${{ runner.temp }}/deform360-source-pilot-venv-retry1-${{ github.run_id }}-${{ github.run_attempt }}/bin/python
          '''
          invalid_env = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in invalid_env.splitlines()
          ) + "\n"
          if text.count(invalid_env) != 1:
              raise SystemExit("unexpected job-level runner.temp block")
          text = text.replace(invalid_env, "", 1)

          anchor = '''      - name: Authorize one newly added retry request
          '''
          if text.count(anchor) != 1:
              raise SystemExit("authorization anchor changed")
          initializer = '''      - name: Initialize isolated runner paths
                shell: bash
                run: |
                  set -euo pipefail
                  evidence="${RUNNER_TEMP}/deform360-source-pilot-retry1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
                  runtime="${RUNNER_TEMP}/deform360-source-pilot-venv-retry1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
                  test ! -e "${evidence}"
                  test ! -e "${runtime}"
                  mkdir -p "${evidence}"
                  {
                    echo "EVIDENCE_ROOT=${evidence}"
                    echo "RUNTIME_ROOT=${runtime}"
                    echo "RUNTIME_PYTHON=${runtime}/bin/python"
                  } >> "${GITHUB_ENV}"

          '''
          initializer = "\n".join(
              line[6:] if line.startswith("      ") else line
              for line in initializer.splitlines()
          ) + "\n"
          text = text.replace(anchor, initializer + anchor, 1)

          added_only = '          test "${changed[0]}" = $\'A\\t\'"${REQUEST_PATH}"'
          modified_only = '          test "${changed[0]}" = $\'M\\t\'"${REQUEST_PATH}"'
          if text.count(added_only) != 1:
              raise SystemExit("request change-mode guard changed")
          text = text.replace(added_only, modified_only, 1)
          path.write_text(text, encoding="utf-8")
          PY
          python -m pip install --disable-pip-version-check pyyaml==6.0.3
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path(
              ".github/workflows/"
              "deform360-source-pilot-materialization-v1-retry1.yml"
          )
          value = yaml.safe_load(path.read_text(encoding="utf-8"))
          if not isinstance(value, dict) or "jobs" not in value:
              raise SystemExit("repaired workflow did not parse")
          PY
          git diff --check

      - name: Commit workflow repair
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/deform360-source-pilot-materialization-v1-retry1.yml
          git commit -m "Fix runner path initialization in Deform360 retry"
          git push origin HEAD:science/deform360-explicit-mount-source-v1
          echo "revision=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Rebind and modify the retry request
        shell: bash
        env:
          REPAIRED_REVISION: ${{ steps.repair.outputs.revision }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(
              ".github/requests/"
              "deform360-source-pilot-materialization-v1-retry1.json"
          )
          value = json.loads(path.read_text(encoding="utf-8"))
          value["expected_source_revision"] = os.environ["REPAIRED_REVISION"]
          value["request_id"] = (
              "deform360-source-pilot-materialization-v1-retry1-fixed1-20260831"
          )
          path.write_text(
              json.dumps(value, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          git add .github/requests/deform360-source-pilot-materialization-v1-retry1.json
          git commit -m "Retrigger corrected Deform360 source materialization"
          git push origin HEAD:science/deform360-explicit-mount-source-v1
