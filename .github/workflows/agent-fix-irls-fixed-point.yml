name: Apply IRLS fixed-point convergence fix

on:
  push:
    branches:
      - agent/fix-irls-fixed-point-convergence

permissions:
  contents: write

jobs:
  patch-test-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/fix-irls-fixed-point-convergence

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply focused estimator and regression-test patch
        shell: bash
        run: |
          python - <<'PY'
          
          from pathlib import Path
          
          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")
          
          replace_once(
              "src/bayesian_phystwin/_gauge_aware_solver.py",
              """        previous = solution.copy()
                  normal, right = posterior_system()
          """,
              """        previous = solution.copy()
                  previous_robust = robust.copy()
                  previous_anchor_robust = anchor_robust.copy()
                  normal, right = posterior_system()
          """,
          )
          replace_once(
              "src/bayesian_phystwin/_gauge_aware_solver.py",
              """        if np.linalg.norm(solution - previous) <= cfg.convergence_tolerance:
                      break
          """,
              """        solution_delta = float(np.linalg.norm(solution - previous))
                  robust_weight_delta = max(
                      float(np.max(np.abs(robust - previous_robust), initial=0.0)),
                      float(
                          np.max(
                              np.abs(anchor_robust - previous_anchor_robust),
                              initial=0.0,
                          )
                      ),
                  )
                  if (
                      solution_delta <= cfg.convergence_tolerance
                      and robust_weight_delta <= cfg.convergence_tolerance
                  ):
                      break
          """,
          )
          
          replace_once(
              "src/bayesian_phystwin/bias_aware_belief_v2.py",
              """        previous = solution.copy()
                  normal, right = posterior_system()
          """,
              """        previous = solution.copy()
                  previous_camera_robust = camera_robust.copy()
                  previous_anchor_robust = anchor_robust.copy()
                  normal, right = posterior_system()
          """,
          )
          replace_once(
              "src/bayesian_phystwin/bias_aware_belief_v2.py",
              """        if np.linalg.norm(solution - previous) <= cfg.convergence_tolerance:
                      break
          """,
              """        solution_delta = float(np.linalg.norm(solution - previous))
                  robust_weight_delta = max(
                      float(
                          np.max(
                              np.abs(camera_robust - previous_camera_robust),
                              initial=0.0,
                          )
                      ),
                      float(
                          np.max(
                              np.abs(anchor_robust - previous_anchor_robust),
                              initial=0.0,
                          )
                      ),
                  )
                  if (
                      solution_delta <= cfg.convergence_tolerance
                      and robust_weight_delta <= cfg.convergence_tolerance
                  ):
                      break
          """,
          )
          
          replace_once(
              "src/bayesian_phystwin/propagated_state_belief.py",
              """        previous = solution.copy()
                  normal, right = posterior_system(robust)
          """,
              """        previous = solution.copy()
                  previous_robust = robust.copy()
                  normal, right = posterior_system(robust)
          """,
          )
          replace_once(
              "src/bayesian_phystwin/propagated_state_belief.py",
              """        if (
                      np.max(np.abs(solution - previous), initial=0.0)
                      <= cfg.convergence_tolerance
                  ):
                      break
          """,
              """        solution_delta = float(
                      np.max(np.abs(solution - previous), initial=0.0)
                  )
                  robust_weight_delta = float(
                      np.max(np.abs(robust - previous_robust), initial=0.0)
                  )
                  if (
                      solution_delta <= cfg.convergence_tolerance
                      and robust_weight_delta <= cfg.convergence_tolerance
                  ):
                      break
          """,
          )
          
          def append_test(path: str, marker: str, test_source: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              if marker in text:
                  raise RuntimeError(f"{path}: test marker already exists")
              file_path.write_text(text.rstrip() + "\n\n\n" + test_source.strip() + "\n", encoding="utf-8")
          
          append_test(
              "tests/test_gauge_aware_belief.py",
              "test_gauge_aware_irls_waits_for_robust_weight_fixed_point",
              r"""
          def test_gauge_aware_irls_waits_for_robust_weight_fixed_point() -> None:
              mode = np.asarray([1.0, 2.0])
              batch = _batch(mode, np.asarray([0.02, -0.01]))
          
              result = update_gauge_aware_belief(
                  batch,
                  config=GaugeAwareBeliefConfig(
                      effective_samples_per_correlation_group=2.0,
                      maximum_iterations=8,
                      convergence_tolerance=1e-12,
                  ),
              )
          
              assert result.inference_admissible
              assert result.diagnostics["iterations"] >= 4
              assert result.state_coefficients[0] == pytest.approx(
                  -0.004875500609437576,
                  abs=1e-12,
              )
              np.testing.assert_allclose(
                  result.robust_weights,
                  np.asarray([0.02, 1.0]),
                  atol=1e-12,
                  rtol=0.0,
              )
          """,
          )
          
          append_test(
              "tests/test_bias_aware_belief_v2.py",
              "test_v2_irls_waits_for_robust_weight_fixed_point",
              r"""
          def test_v2_irls_waits_for_robust_weight_fixed_point() -> None:
              innovation = np.zeros((1, 1, 3), dtype=np.float64)
              available = np.zeros((1, 1), dtype=bool)
              anchor_innovation = np.asarray(
                  [[0.02, 0.0, 0.0], [-0.01, 0.0, 0.0]],
                  dtype=np.float64,
              )
          
              result = update_bias_aware_state_v2(
                  innovation,
                  available,
                  np.ones((1, 1), dtype=np.float64),
                  np.zeros((1, 0), dtype=np.float64),
                  anchor_innovation_m=anchor_innovation,
                  anchor_state_basis=np.asarray([[1.0], [2.0]], dtype=np.float64),
                  anchor_variance_m2=np.full(2, 1e-6, dtype=np.float64),
                  config=_v2_config(
                      state_prior_std_m=0.1,
                      maximum_iterations=8,
                      convergence_tolerance=1e-12,
                  ),
              )
          
              assert result.accepted
              assert result.diagnostics["iterations"] >= 4
              assert result.state_coefficients_m[0, 0] == pytest.approx(
                  -0.004875500609437576,
                  abs=1e-12,
              )
              np.testing.assert_allclose(
                  result.anchor_robust_weights,
                  np.asarray([0.02, 1.0]),
                  atol=1e-12,
                  rtol=0.0,
              )
          """,
          )
          
          append_test(
              "tests/test_propagated_state_belief.py",
              "test_propagated_irls_waits_for_robust_weight_fixed_point",
              r"""
          def test_propagated_irls_waits_for_robust_weight_fixed_point() -> None:
              innovation = np.zeros((1, 2, 3), dtype=np.float64)
              innovation[0, :, 0] = np.asarray([0.02, -0.01])
              response = np.zeros((1, 2, 3, 1), dtype=np.float64)
              response[0, :, 0, 0] = np.asarray([1.0, 2.0])
          
              result = infer_propagated_state_belief(
                  innovation,
                  np.ones((1, 2), dtype=bool),
                  response,
                  np.zeros((2, 0), dtype=np.float64),
                  observation_variance_m2=np.full((1, 2), 1e-6, dtype=np.float64),
                  config=PropagatedStateBeliefConfig(
                      state_weight_prior_std=0.1,
                      maximum_iterations=8,
                      convergence_tolerance=1e-12,
                  ),
              )
          
              assert result.accepted
              assert result.diagnostics["iterations"] >= 4
              np.testing.assert_allclose(
                  result.state_weights,
                  np.asarray([-0.004875500609437576]),
                  atol=1e-12,
                  rtol=0.0,
              )
              np.testing.assert_allclose(
                  result.robust_weights[0],
                  np.asarray([0.02, 1.0]),
                  atol=1e-12,
                  rtol=0.0,
              )
          """,
          )
          PY

      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run focused lint and regression tests
        run: |
          python -m ruff check \
            src/bayesian_phystwin/_gauge_aware_solver.py \
            src/bayesian_phystwin/bias_aware_belief_v2.py \
            src/bayesian_phystwin/propagated_state_belief.py \
            tests/test_gauge_aware_belief.py \
            tests/test_bias_aware_belief_v2.py \
            tests/test_propagated_state_belief.py
          python -m pytest -q \
            tests/test_gauge_aware_belief.py \
            tests/test_bias_aware_belief_v2.py \
            tests/test_propagated_state_belief.py
          git diff --check

      - name: Commit the verified patch
        shell: bash
        run: |
          rm .github/workflows/agent-fix-irls-fixed-point.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayesian_phystwin/_gauge_aware_solver.py \
            src/bayesian_phystwin/bias_aware_belief_v2.py \
            src/bayesian_phystwin/propagated_state_belief.py \
            tests/test_gauge_aware_belief.py \
            tests/test_bias_aware_belief_v2.py \
            tests/test_propagated_state_belief.py \
            .github/workflows/agent-fix-irls-fixed-point.yml
          git commit -m "Fix robust IRLS fixed-point convergence"
          git push origin HEAD:agent/fix-irls-fixed-point-convergence
