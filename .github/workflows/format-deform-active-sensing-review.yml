name: Format DEFORM active-sensing review files

on:
  push:
    branches:
      - science/deform-dlo45-decision-directed-sensing-v2
    paths:
      - .github/workflows/format-deform-active-sensing-review.yml

permissions:
  contents: write

concurrency:
  group: format-deform-active-sensing-review
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: true
          persist-credentials: true

      - name: Apply repository formatter and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'ruff==0.16.5'
          python -m ruff format \
            experiments/deform_dlo45_conformal_active_sensing_v1/analyze.py \
            experiments/deform_dlo45_decision_directed_sensing_v3/evaluate.py \
            experiments/deform_dlo45_decision_directed_sensing_v3/execute.py \
            tests/test_deform_dlo45_decision_directed_sensing_v3.py
          python -m ruff format --check \
            experiments/deform_dlo45_conformal_active_sensing_v1/analyze.py \
            experiments/deform_dlo45_decision_directed_sensing_v3/evaluate.py \
            experiments/deform_dlo45_decision_directed_sensing_v3/execute.py \
            tests/test_deform_dlo45_decision_directed_sensing_v3.py
          python -m py_compile \
            experiments/deform_dlo45_conformal_active_sensing_v1/analyze.py \
            experiments/deform_dlo45_decision_directed_sensing_v3/evaluate.py \
            experiments/deform_dlo45_decision_directed_sensing_v3/execute.py \
            tests/test_deform_dlo45_decision_directed_sensing_v3.py
          rm .github/workflows/format-deform-active-sensing-review.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Format DEFORM active-sensing review files'
          git push origin "HEAD:${GITHUB_REF_NAME}"
