name: Remove unavailable new-data experiment integration

on:
  push:
    branches:
      - revert/remove-unavailable-new-data-experiment

permissions:
  contents: write

jobs:
  revert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: revert/remove-unavailable-new-data-experiment
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Revert the future-acquisition integrations exactly
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git revert --no-edit 7189a1184346ac618fc39df1089943737176cb72
          git revert --no-edit b5f07d649ac2cd7dc6ca1aceb4004ff4803bddc8
      - name: Validate the remaining existing codebase
        shell: bash
        run: |
          python -m pip install -e ".[dev]"
          python -m ruff check -- src tests
          mapfile -t tests_to_run < <(find tests -maxdepth 1 -type f -name 'test_cross_action*.py' ! -name '*v2*' -print | sort)
          if [ "${#tests_to_run[@]}" -gt 0 ]; then
            python -m pytest -q "${tests_to_run[@]}"
          fi
          if git grep -n -E "cross_action_(transport|placebo)_v2|chronological cross-action transport v2|broken-mechanism physicality" -- . ':!.github/workflows/revert-remove-unavailable-new-data-experiment.yml'; then
            echo "stale new-data experiment references remain" >&2
            exit 1
          fi
          git diff --check
      - name: Remove one-shot workflow and publish
        shell: bash
        run: |
          rm .github/workflows/revert-remove-unavailable-new-data-experiment.yml
          git add -A
          git commit -m "Remove unavailable new-data experiment integration"
          git push origin HEAD:revert/remove-unavailable-new-data-experiment
