name: Run random-walk bias hardening on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Extract and apply the validated patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip

          workflow = Path(
              ".github/workflows/apply-random-walk-bias-hardening.yml"
          ).read_text(encoding="utf-8")
          encoded = workflow.split('encoded = """', 1)[1].split('"""', 1)[0]
          Path("/tmp/drift-bias.patch").write_bytes(
              gzip.decompress(base64.b64decode(encoded))
          )

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          bullet = (
              "- Random-walk drift-bias inference now preserves typed track "
              "identities, rejects serialized ID collisions, malformed "
              "probabilities, non-finite timestamps and numerical updates, and "
              "returns defensively owned immutable result/evidence artifacts.\n"
          )
          marker = "### Changed\n\n"
          if bullet not in text:
              if marker not in text:
                  raise RuntimeError("changelog Changed section is missing")
              changelog.write_text(
                  text.replace(marker, marker + bullet, 1),
                  encoding="utf-8",
              )
          PY
          git apply --check /tmp/drift-bias.patch
          git apply /tmp/drift-bias.patch

      - name: Install development tools
        run: python -m pip install -e ".[dev]"

      - name: Format and validate the focused patch
        run: |
          python -m ruff format \
            src/bayesian_phystwin/drift_bias.py \
            tests/test_drift_bias.py
          python -m ruff check \
            src/bayesian_phystwin/drift_bias.py \
            tests/test_drift_bias.py
          python -m pytest -q -W error \
            tests/test_drift_bias.py \
            tests/test_phystwin_bias_diagnostic.py \
            tests/test_synthetic_benchmark.py

      - name: Commit the validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayesian_phystwin/drift_bias.py \
            tests/test_drift_bias.py \
            CHANGELOG.md
          git diff --cached --check
          git commit -m "Harden random-walk bias contracts"
          git push origin HEAD:${{ github.head_ref }}
