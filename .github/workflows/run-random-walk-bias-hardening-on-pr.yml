name: Clean up random-walk bias hardening workflows

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development tools
        run: python -m pip install -e ".[dev]"

      - name: Revalidate the retained patch
        run: |
          python -m ruff check \
            src/bayesian_phystwin/drift_bias.py \
            tests/test_drift_bias.py
          python -m ruff format --check \
            src/bayesian_phystwin/drift_bias.py \
            tests/test_drift_bias.py
          python -m pytest -q -W error \
            tests/test_drift_bias.py \
            tests/test_phystwin_bias_diagnostic.py \
            tests/test_synthetic_benchmark.py

      - name: Remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/apply-random-walk-bias-hardening.yml \
            .github/workflows/run-random-walk-bias-hardening-on-pr.yml
          git commit -m "Remove temporary drift-bias workflows"
          git push origin HEAD:${{ github.head_ref }}
