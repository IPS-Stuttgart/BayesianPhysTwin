name: Execute ecosystem compatibility coverage registration

on:
  pull_request:
    branches:
      - agent/ecosystem-compatibility-table-v1
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  execute:
    if: >-
      github.event.pull_request.head.ref ==
      'agent/fix-ecosystem-compatibility-coverage'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact target branch
        uses: actions/checkout@v7
        with:
          ref: agent/ecosystem-compatibility-table-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Register and validate stable-core coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('.github/quality/test-suites.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          suite = payload['suites']['stable-core-coverage']
          test = 'tests/test_ecosystem_compatibility_v1.py'
          if test in suite:
              raise SystemExit('compatibility test is already registered')
          anchor = 'tests/test_versioned_api_v1.py'
          index = suite.index(anchor)
          suite.insert(index + 1, test)
          path.write_text(
              json.dumps(payload, indent=2, sort_keys=False) + '\n',
              encoding='utf-8',
          )
          PY
          python -m pip install -e ".[dev]" coverage
          python -m pytest -q \
            tests/test_ecosystem_compatibility_v1.py \
            tests/test_test_suite_manifest.py
          coverage run --branch -m pytest -q \
            tests/test_ecosystem_compatibility_v1.py
          coverage report -m \
            --include=src/bayesian_phystwin/ecosystem_compatibility_v1.py \
            --fail-under=90
          git diff --check

      - name: Publish only the validated manifest registration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/quality/test-suites.json
          git diff --cached --check
          test "$(git diff --cached --name-only)" = ".github/quality/test-suites.json"
          git commit -m "Register ecosystem compatibility stable coverage"
          git push origin HEAD:agent/ecosystem-compatibility-table-v1
