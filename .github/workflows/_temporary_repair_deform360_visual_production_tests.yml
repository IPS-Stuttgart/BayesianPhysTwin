name: Temporary repair Deform360 visual-production tests

on:
  push:
    branches: [agent/deform360-calibration-visual-production-v1]
    paths:
      - ".github/workflows/_temporary_repair_deform360_visual_production_tests.yml"

permissions:
  contents: write

concurrency:
  group: temporary-repair-deform360-visual-production-tests
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Repair and validate exact files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          tests = Path("tests/test_deform360_calibration_visual_production.py")
          text = tests.read_text(encoding="utf-8")
          text = text.replace("from pathlib import Path\n\n", "")
          text = text.replace(
              "    validate_deform360_calibration_visual_technical_failure,\n",
              "",
          )
          text = text.replace("import json\nimport pytest\n", "import json\n\nimport pytest\n")
          tests.write_text(text, encoding="utf-8")

          workflow_tests = Path(
              "tests/test_deform360_calibration_visual_production_workflow.py"
          )
          text = workflow_tests.read_text(encoding="utf-8")
          text = text.replace(
              "from pathlib import Path\n\n\nWORKFLOW",
              "from pathlib import Path\n\nWORKFLOW",
          )
          workflow_tests.write_text(text, encoding="utf-8")
          PY
          python -m pip install -e ".[dev,graph]"
          files=(
            src/bayesian_phystwin/deform360_calibration_visual_production.py
            scripts/science/execute_deform360_calibration_visual_production.py
            tests/test_deform360_calibration_visual_production.py
            tests/test_deform360_calibration_visual_production_workflow.py
          )
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy \
            src/bayesian_phystwin/deform360_calibration_visual_production.py \
            scripts/science/execute_deform360_calibration_visual_production.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_deform360_calibration_visual_production.py \
            tests/test_deform360_calibration_visual_production_workflow.py \
            tests/test_deform360_calibration_visual_execution_admission.py \
            tests/test_deform360_calibration_visual_execution_admission_edges.py
      - name: Publish repaired blobs and receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RECEIPT: ${{ runner.temp }}/deform360-visual-production-test-repair.json
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          repository = os.environ["GITHUB_REPOSITORY"]
          api = os.environ["GITHUB_API_URL"]
          token = os.environ["GITHUB_TOKEN"]
          parent = os.environ["GITHUB_SHA"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          def request(method: str, path: str, payload: object | None = None) -> object:
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  f"{api}/repos/{repository}{path}",
                  data=data,
                  headers=headers,
                  method=method,
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          parent_commit = request("GET", f"/git/commits/{parent}")
          paths = (
              "tests/test_deform360_calibration_visual_production.py",
              "tests/test_deform360_calibration_visual_production_workflow.py",
          )
          blobs = {}
          for path in paths:
              blob = request(
                  "POST",
                  "/git/blobs",
                  {
                      "content": base64.b64encode(Path(path).read_bytes()).decode("ascii"),
                      "encoding": "base64",
                  },
              )
              blobs[path] = str(blob["sha"])
          receipt = {
              "parent_sha": parent,
              "base_tree_sha": str(parent_commit["tree"]["sha"]),
              "blobs": blobs,
              "delete": [
                  ".github/workflows/_temporary_repair_deform360_visual_production_tests.yml"
              ],
          }
          Path(os.environ["RECEIPT"]).write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: deform360-visual-production-test-repair-${{ github.sha }}
          path: ${{ runner.temp }}/deform360-visual-production-test-repair.json
          if-no-files-found: error
          retention-days: 2
