name: Apply estimator bug fixes on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply source fixes
        run: python scripts/agent_apply_estimator_bugfixes.py

      - name: Install validation dependencies
        run: python -m pip install -e '.[dev,graph]'

      - name: Validate focused fixes
        run: |
          python -m ruff check \
            src/bayesian_phystwin/mask_distance.py \
            src/bayesian_phystwin/phystwin_raw_cues.py \
            src/bayesian_phystwin/phystwin_cotracker3_cues.py \
            src/bayesian_phystwin/phystwin_alltracker_cues.py \
            src/bayesian_phystwin/phystwin_motioncrafter_assimilation.py \
            tests/test_mask_distance_and_multiview_geometry_regressions.py
          python -m ruff format --check \
            src/bayesian_phystwin/mask_distance.py \
            src/bayesian_phystwin/phystwin_raw_cues.py \
            src/bayesian_phystwin/phystwin_cotracker3_cues.py \
            src/bayesian_phystwin/phystwin_alltracker_cues.py \
            src/bayesian_phystwin/phystwin_motioncrafter_assimilation.py \
            tests/test_mask_distance_and_multiview_geometry_regressions.py
          python -m pytest -q \
            tests/test_mask_distance_and_multiview_geometry_regressions.py \
            tests/test_phystwin_cotracker3_cues.py \
            tests/test_phystwin_motioncrafter_assimilation.py \
            tests/test_phystwin_raw_cues.py \
            tests/test_phystwin_alltracker_cues.py

      - name: Publish validated source commit
        shell: bash
        run: |
          rm \
            .github/workflows/agent_apply_estimator_bugfixes.yml \
            .github/workflows/agent_pr_apply_estimator_bugfixes.yml \
            scripts/agent_apply_estimator_bugfixes.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix multiview geometry and boundary reliability"
          git push origin HEAD:${{ github.head_ref }}
