name: Temporary export persistent-bias hardening source

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/_temporary_export_persistent_bias_fix_source.yml"
      - "src/bayesian_phystwin/persistent_prob4d_visual_bias.py"
      - "tests/test_persistent_prob4d_visual_bias.py"
      - "docs/persistent_prob4d_visual_bias_solver.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Create immutable source archive
        run: git archive --format=tar.gz --output=bayesian-phystwin-source.tar.gz HEAD
      - name: Upload source archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: persistent-bias-hardening-source
          path: bayesian-phystwin-source.tar.gz
          if-no-files-found: error
          retention-days: 1
