name: Register estimator bugfix coverage suites

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  register:
    if: github.head_ref == 'agent/fix-multiview-boundary-bugs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Register changed-module regression suites
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/tests.yml')
          text = path.read_text(encoding='utf-8')
          old = '''            tests/test_causal4d_artifacts_v2.py \\
            tests/test_phystwin_raw_cues.py \\
            tests/test_gauge_aware_belief.py \\
'''
          new = '''            tests/test_causal4d_artifacts_v2.py \\
            tests/test_phystwin_raw_cues.py \\
            tests/test_mask_distance_and_multiview_geometry_regressions.py \\
            tests/test_phystwin_cotracker3_cues.py \\
            tests/test_phystwin_motioncrafter_assimilation.py \\
            tests/test_phystwin_alltracker_cues.py \\
            tests/test_gauge_aware_belief.py \\
'''
          if text.count(old) != 1:
              raise SystemExit('stable-core coverage insertion anchor changed')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check

      - name: Publish coverage registration
        shell: bash
        run: |
          rm .github/workflows/agent_register_bugfix_coverage.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Collect estimator bugfix regressions in coverage CI"
          git push origin HEAD:${{ github.head_ref }}
