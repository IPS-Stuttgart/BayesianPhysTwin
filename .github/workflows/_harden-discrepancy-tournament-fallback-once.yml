name: Harden discrepancy tournament fallback once

on:
  push:
    branches:
      - agent/discrepancy-candidate-tournament-v1
    paths:
      - .github/workflows/_harden-discrepancy-tournament-fallback-once.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/_harden-discrepancy-tournament-fallback-once.yml

permissions:
  contents: write

concurrency:
  group: harden-discrepancy-tournament-fallback-once
  cancel-in-progress: false

jobs:
  harden:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      ((github.event_name == 'push' &&
        github.ref == 'refs/heads/agent/discrepancy-candidate-tournament-v1') ||
       (github.event_name == 'pull_request' &&
        github.head_ref == 'agent/discrepancy-candidate-tournament-v1'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/discrepancy-candidate-tournament-v1
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply exact interval-fallback hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected one replacement marker, found {count}"
                  )
              target.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "src/bayesian_phystwin/_discrepancy_tournament_contracts.py",
              '''        _require(
              fallback_record.proper_score == fallback_record.fallback_proper_score,
              f"{unit_id} fallback raw proper score changed",
          )

      evaluation = _parse_evaluation(payload["evaluation"])
          ''',
              '''        _require(
              fallback_record.proper_score == fallback_record.fallback_proper_score,
              f"{unit_id} fallback raw proper score changed",
          )
          for record in unit_records:
              if record.accepted:
                  continue
              _require(
                  record.interval_covered == fallback_record.interval_covered,
                  f"{unit_id} rejected interval coverage differs from exact fallback",
              )
              _require(
                  record.interval_width == fallback_record.interval_width,
                  f"{unit_id} rejected interval width differs from exact fallback",
              )

      evaluation = _parse_evaluation(payload["evaluation"])
          ''',
          )

          replace_once(
              "tests/test_horizon_conditioned_discrepancy_tournament.py",
              '''def test_information_boundary_and_interval_coverage_fail_closed() -> None:
          ''',
              '''@pytest.mark.parametrize(
          ("field", "value", "message"),
          [
              (
                  "interval_covered",
                  False,
                  "rejected interval coverage differs from exact fallback",
              ),
              (
                  "interval_width",
                  1.0,
                  "rejected interval width differs from exact fallback",
              ),
          ],
      )
      def test_rejected_candidate_must_retain_exact_fallback_interval(
          field: str,
          value: object,
          message: str,
      ) -> None:
          payload = _payload()
          records = payload["records"]
          assert isinstance(records, list)
          row = next(
              record
              for record in records
              if record["candidate_id"] == "structured"
              and record["group_id"] == "group-0"
          )
          row["accepted"] = False
          row["deployed_point_loss"] = row["fallback_point_loss"]
          row["deployed_proper_score"] = row["fallback_proper_score"]
          row[field] = value

          with pytest.raises(ValueError, match=message):
              parse_discrepancy_candidate_tournament(payload)


      def test_information_boundary_and_interval_coverage_fail_closed() -> None:
          ''',
          )

          replace_once(
              "docs/discrepancy_candidate_tournament_v1.md",
              '''A rejected candidate must deploy the exact physical-fallback values. The
      registered physical-fallback candidate must itself be rejected and reproduce its
      raw fallback values exactly.''',
              '''A rejected candidate must deploy the exact physical-fallback point loss,
      proper score, interval coverage decision, and complete interval width. The
      registered physical-fallback candidate must itself be rejected and reproduce its
      raw fallback values exactly.''',
          )
          PY

      - name: Install development environment
        run: |
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Validate hardening
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/bayesian_phystwin/_discrepancy_tournament_contracts.py
            tests/test_horizon_conditioned_discrepancy_tournament.py
          )
          python -m ruff check --fix -- "${files[@]}"
          python -m ruff format -- "${files[@]}"
          python -m ruff check -- "${files[@]}"
          python -m ruff format --check -- "${files[@]}"
          python -m mypy \
            src/bayesian_phystwin/_discrepancy_tournament_contracts.py
          python -m pytest -q \
            tests/test_horizon_conditioned_discrepancy_tournament.py \
            tests/test_horizon_conditioned_discrepancy_tournament_cli.py \
            tests/test_command_registry.py \
            tests/test_cli_main.py
          python -m compileall -q src tests
          git diff --check

      - name: Remove one-use workflow and publish
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_harden-discrepancy-tournament-fallback-once.yml
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Require exact interval fallback in discrepancy tournament"
          git push origin HEAD:agent/discrepancy-candidate-tournament-v1
