name: Harden discrepancy tournament fallback once

on:
  push:
    branches:
      - agent/discrepancy-candidate-tournament-v1
    paths:
      - .github/workflows/_harden-discrepancy-tournament-fallback-once.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/_harden-discrepancy-tournament-fallback-once.yml

permissions:
  contents: write

concurrency:
  group: harden-discrepancy-tournament-fallback-once
  cancel-in-progress: false

jobs:
  harden:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      ((github.event_name == 'push' &&
        github.ref == 'refs/heads/agent/discrepancy-candidate-tournament-v1') ||
       (github.event_name == 'pull_request' &&
        github.head_ref == 'agent/discrepancy-candidate-tournament-v1'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/discrepancy-candidate-tournament-v1
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply fail-closed hardening
        run: python tools/one_shot/harden_discrepancy_tournament_v1.py

      - name: Install development environment
        run: |
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Validate hardening
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/bayesian_phystwin/_discrepancy_tournament_contracts.py
            src/bayesian_phystwin/_discrepancy_tournament_analysis.py
            tests/test_horizon_conditioned_discrepancy_tournament.py
          )
          python -m ruff check --fix -- "${files[@]}"
          python -m ruff format -- "${files[@]}"
          python -m ruff check -- "${files[@]}"
          python -m ruff format --check -- "${files[@]}"
          python -m mypy \
            src/bayesian_phystwin/_discrepancy_tournament_contracts.py \
            src/bayesian_phystwin/_discrepancy_tournament_analysis.py
          python -m pytest -q \
            tests/test_horizon_conditioned_discrepancy_tournament.py \
            tests/test_horizon_conditioned_discrepancy_tournament_cli.py \
            tests/test_command_registry.py \
            tests/test_cli_main.py
          python -m compileall -q src tests
          git diff --check

      - name: Remove one-use files and publish
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_harden-discrepancy-tournament-fallback-once.yml
          rm tools/one_shot/harden_discrepancy_tournament_v1.py
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden source-only discrepancy tournament"
          git push origin HEAD:agent/discrepancy-candidate-tournament-v1
