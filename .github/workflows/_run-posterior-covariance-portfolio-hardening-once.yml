name: Run posterior covariance portfolio hardening once

on:
  pull_request:
    branches: [main]
    paths:
      - .github/scripts/harden_posterior_covariance_portfolio_once.py
      - .github/workflows/_run-posterior-covariance-portfolio-hardening-once.yml

permissions:
  contents: write

jobs:
  harden:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref ==
      'agent/posterior-query-covariance-portfolio-v1-current'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out named exact head
        uses: actions/checkout@v7
        with:
          ref: agent/posterior-query-covariance-portfolio-v1-current
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Verify exact event head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = \
            "${{ github.event.pull_request.head.sha }}"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply reviewed patch
        run: |
          set -euo pipefail
          python .github/scripts/harden_posterior_covariance_portfolio_once.py

      - name: Validate focused changes
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m ruff format \
            src/bayesian_phystwin/posterior_covariance_portfolio.py \
            tests/test_observed_information_covariance_portfolio.py
          python -m ruff check \
            src/bayesian_phystwin/posterior_covariance_portfolio.py \
            tests/test_observed_information_covariance_portfolio.py
          python -m compileall -q \
            src/bayesian_phystwin/posterior_covariance_portfolio.py \
            tests/test_observed_information_covariance_portfolio.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_observed_information_covariance_portfolio.py \
            tests/test_observed_information_covariance.py \
            tests/test_group_sandwich_covariance.py
          git diff --check

      - name: Publish hardened branch
        run: |
          set -euo pipefail
          rm \
            .github/scripts/harden_posterior_covariance_portfolio_once.py \
            .github/workflows/_harden-posterior-covariance-portfolio-once.yml \
            .github/workflows/_trigger-harden-posterior-covariance-portfolio-once.yml \
            .github/workflows/_run-posterior-covariance-portfolio-hardening-once.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Harden posterior covariance portfolio integrity"
          git push origin \
            HEAD:agent/posterior-query-covariance-portfolio-v1-current
