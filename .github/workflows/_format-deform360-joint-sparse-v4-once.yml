name: Format Deform360 joint-sparse v4 once

on:
  push:
    branches:
      - agent/deform360-joint-sparse-observability-v4
    paths:
      - .github/workflows/_format-deform360-joint-sparse-v4-once.yml

permissions:
  contents: write

concurrency:
  group: format-deform360-joint-sparse-v4-once
  cancel-in-progress: false

jobs:
  format:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.ref == 'refs/heads/agent/deform360-joint-sparse-observability-v4'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/deform360-joint-sparse-observability-v4
          fetch-depth: 0
          persist-credentials: true
          clean: true
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Format source, remove helper, and publish
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "IPS-Stuttgart/BayesianPhysTwin"
          test "$(git branch --show-current)" = \
            "agent/deform360-joint-sparse-observability-v4"
          python -m pip install "ruff==0.16.2"
          python -m ruff format \
            src/bayesian_phystwin/deform360_joint_sparse_observability_v4.py \
            tests/test_deform360_joint_sparse_observability_v4.py
          python -m ruff check --fix \
            src/bayesian_phystwin/deform360_joint_sparse_observability_v4.py \
            tests/test_deform360_joint_sparse_observability_v4.py
          git rm .github/workflows/_format-deform360-joint-sparse-v4-once.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayesian_phystwin/deform360_joint_sparse_observability_v4.py \
            tests/test_deform360_joint_sparse_observability_v4.py
          git commit -m "Format Deform360 joint-sparse observability v4"
          git push origin HEAD:agent/deform360-joint-sparse-observability-v4
