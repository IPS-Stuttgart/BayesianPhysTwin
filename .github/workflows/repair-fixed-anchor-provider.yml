name: Repair fixed-anchor provider formatting

on:
  push:
    branches: [agent/fixed-anchor-provider-v1]
    paths:
      - ".github/workflows/repair-fixed-anchor-provider.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/fixed-anchor-provider-v1
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Add the two exposed local annotations
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("src/bayesian_phystwin/phystwin/geometry.py"): (
                  "    lifted = np.zeros((len(tracked), state_count, 3), dtype=float)\n",
                  "    lifted: np.ndarray = np.zeros(\n"
                  "        (len(tracked), state_count, 3), dtype=float\n"
                  "    )\n",
              ),
              Path("src/bayesian_phystwin/phystwin/replay.py"): (
                  "        if isinstance(request, InitialReplayRequestV1):\n",
                  "        frame_ids: np.ndarray\n"
                  "        if isinstance(request, InitialReplayRequestV1):\n",
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"unexpected replacement count in {path}")
              path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Apply Ruff formatting
        run: |
          python -m pip install -e ".[dev]"
          python -m ruff check --fix \
            src/bayesian_phystwin/causal4d_belief_provider_v1.py \
            src/bayesian_phystwin/contracts/__init__.py \
            src/bayesian_phystwin/contracts/fixed_anchor.py \
            src/bayesian_phystwin/phystwin/geometry.py \
            src/bayesian_phystwin/phystwin/replay.py \
            tests/test_causal4d_provider_v1.py
          python -m ruff format \
            src/bayesian_phystwin/causal4d_belief_provider_v1.py \
            src/bayesian_phystwin/contracts/__init__.py \
            src/bayesian_phystwin/contracts/fixed_anchor.py \
            src/bayesian_phystwin/phystwin/geometry.py \
            src/bayesian_phystwin/phystwin/replay.py \
            tests/test_causal4d_provider_v1.py
          rm .github/workflows/repair-fixed-anchor-provider.yml
      - name: Commit the repaired product files and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayesian_phystwin/causal4d_belief_provider_v1.py \
            src/bayesian_phystwin/contracts/__init__.py \
            src/bayesian_phystwin/contracts/fixed_anchor.py \
            src/bayesian_phystwin/phystwin/geometry.py \
            src/bayesian_phystwin/phystwin/replay.py \
            tests/test_causal4d_provider_v1.py \
            .github/workflows/repair-fixed-anchor-provider.yml
          git diff --cached --check
          git commit -m "Format and type the fixed-anchor provider"
          git push origin HEAD:agent/fixed-anchor-provider-v1
