# workflow-lifecycle: temporary-one-shot
# workflow-owner: IPS-Stuttgart maintainers
name: Anytime-valid simulator admission v1

on:
  push:
    branches: [science/anytime-valid-simulator-admission-v1]
    paths:
      - ".github/workflows/anytime-valid-simulator-admission-v1.yml"

permissions:
  contents: write

concurrency:
  group: anytime-valid-simulator-admission-v1
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'IPS-Stuttgart/BayesianPhysTwin'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: science/anytime-valid-simulator-admission-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install focused validation environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e . pytest==9.0.2 ruff==0.16.5

      - name: Repair retained replay use of the record-returning API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/remote/run_anytime_valid_dlo_replay_v1.py')
          source = path.read_text(encoding='utf-8')
          old = 'e_values.append(process.update(float(score)))'
          new = 'e_values.append(process.update(float(score)).e_value)'
          if old not in source and new not in source:
              raise SystemExit('expected retained replay update call not found')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY

      - name: Format and validate every anytime-admission Python source
        shell: bash
        run: |
          set -euo pipefail
          files=(
            scripts/remote/run_anytime_joint_admission_v2.py
            scripts/remote/run_anytime_valid_admission_v1.py
            scripts/remote/run_anytime_valid_dlo_replay_v1.py
            scripts/remote/run_anytime_valid_dlo_shift_replay_v1.py
            scripts/remote/run_anytime_valid_dlo_shift_replay_v2.py
            scripts/remote/run_anytime_valid_loss_replay_v1.py
            scripts/remote/run_anytime_valid_loss_replay_v2.py
            scripts/remote/run_anytime_valid_simulator_admission_v1.py
            scripts/science/run_anytime_recursive_admission_v1.py
            src/bayesian_phystwin/anytime_admission_v1.py
            src/bayesian_phystwin/anytime_joint_admission_v2.py
            src/bayesian_phystwin_experiments/anytime_recursive_admission_v1.py
            src/bayesian_phystwin_experiments/anytime_valid_admission_v1.py
            src/bayesian_phystwin_experiments/anytime_joint_admission_v2.py
            tests/test_anytime_admission_v1.py
            tests/test_anytime_joint_admission_study_v2.py
            tests/test_anytime_joint_admission_v2.py
            tests/test_anytime_recursive_admission_v1.py
            tests/test_anytime_valid_admission_v1.py
            tests/test_anytime_valid_dlo_replay_v1.py
            tests/test_anytime_valid_replay_v2.py
          )
          ruff check --fix --unsafe-fixes "${files[@]}"
          ruff format "${files[@]}"
          ruff check "${files[@]}"
          ruff format --check "${files[@]}"
          python -m py_compile "${files[@]}"

      - name: Run focused contract and replay tests
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_anytime_admission_v1.py \
            tests/test_anytime_joint_admission_study_v2.py \
            tests/test_anytime_joint_admission_v2.py \
            tests/test_anytime_recursive_admission_v1.py \
            tests/test_anytime_valid_admission_v1.py \
            tests/test_anytime_valid_dlo_replay_v1.py \
            tests/test_anytime_valid_replay_v2.py

      - name: Execute frozen controlled studies
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          v1=results/science/anytime_valid_simulator_admission_v1
          v2=results/science/anytime_joint_admission_v2
          rm -rf "$v1" "$v2"
          python scripts/remote/run_anytime_valid_admission_v1.py \
            --protocol protocols/anytime_valid_simulator_admission_v1.json \
            --output-root "$v1"
          python scripts/remote/run_anytime_joint_admission_v2.py \
            --protocol protocols/anytime_joint_admission_v2.json \
            --output-root "$v2"
          python - <<'PY'
          import json
          from pathlib import Path

          v1 = json.loads(Path(
              'results/science/anytime_valid_simulator_admission_v1/result.json'
          ).read_text(encoding='utf-8'))
          v2 = json.loads(Path(
              'results/science/anytime_joint_admission_v2/result.json'
          ).read_text(encoding='utf-8'))
          if v1['decision'] != 'controlled-mechanism-pass':
              raise SystemExit(f"v1 controlled mechanism failed: {v1['gates']}")
          if v1['exact_fallback_identity_violations'] != 0:
              raise SystemExit('v1 exact fallback identity violation')
          if v2['decision'] != 'shared-alpha-iut-efficiency-supported':
              raise SystemExit(
                  f"v2 shared-IUT mechanism failed: {v2['mechanism_gate']}"
              )
          print(json.dumps({
              'v1_decision': v1['decision'],
              'v2_decision': v2['decision'],
              'v2_derived_comparison': v2['derived_comparison'],
          }, indent=2, sort_keys=True))
          PY

      - name: Commit formatted implementation and controlled evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/anytime_joint_admission_v2.md \
            protocols/anytime_joint_admission_v2.json \
            scripts/remote/run_anytime_joint_admission_v2.py \
            scripts/remote/run_anytime_valid_admission_v1.py \
            scripts/remote/run_anytime_valid_dlo_replay_v1.py \
            scripts/remote/run_anytime_valid_dlo_shift_replay_v1.py \
            scripts/remote/run_anytime_valid_dlo_shift_replay_v2.py \
            scripts/remote/run_anytime_valid_loss_replay_v1.py \
            scripts/remote/run_anytime_valid_loss_replay_v2.py \
            scripts/remote/run_anytime_valid_simulator_admission_v1.py \
            scripts/science/run_anytime_recursive_admission_v1.py \
            src/bayesian_phystwin/anytime_admission_v1.py \
            src/bayesian_phystwin/anytime_joint_admission_v2.py \
            src/bayesian_phystwin_experiments/anytime_recursive_admission_v1.py \
            src/bayesian_phystwin_experiments/anytime_valid_admission_v1.py \
            src/bayesian_phystwin_experiments/anytime_joint_admission_v2.py \
            tests/test_anytime_admission_v1.py \
            tests/test_anytime_joint_admission_study_v2.py \
            tests/test_anytime_joint_admission_v2.py \
            tests/test_anytime_recursive_admission_v1.py \
            tests/test_anytime_valid_admission_v1.py \
            tests/test_anytime_valid_dlo_replay_v1.py \
            tests/test_anytime_valid_replay_v2.py \
            results/science/anytime_valid_simulator_admission_v1 \
            results/science/anytime_joint_admission_v2
          rm .github/workflows/anytime-valid-simulator-admission-v1.yml
          git add .github/workflows/anytime-valid-simulator-admission-v1.yml
          git diff --cached --check
          git commit -m 'Validate stronger anytime-valid admission contract'
          git push origin HEAD:science/anytime-valid-simulator-admission-v1
