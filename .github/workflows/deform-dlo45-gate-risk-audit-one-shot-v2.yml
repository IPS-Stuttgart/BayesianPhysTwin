# workflow-lifecycle: temporary
# workflow-owner: IPS-Stuttgart maintainers
# workflow-expiry: 2026-09-15
name: DEFORM DLO4/DLO5 gate and support audit v2

on:
  push:
    paths:
      - ".github/workflows/deform-dlo45-gate-risk-audit-one-shot-v2.yml"
      - ".github/requests/deform-dlo45-decision-gate-audit-v1.json"
      - "experiments/deform_dlo45_decision_identifiability_v1/gate_audit.py"
      - "experiments/deform_dlo45_decision_identifiability_v1/gate_audit_protocol.json"
      - "tests/test_deform_dlo45_decision_gate_audit_v1.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: deform-dlo45-gate-risk-audit-v2-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PARENT_PROTOCOL: experiments/deform_dlo45_decision_identifiability_v1/protocol.json
  AUDIT_PROTOCOL: experiments/deform_dlo45_decision_identifiability_v1/gate_audit_protocol.json
  REQUEST: .github/requests/deform-dlo45-decision-gate-audit-v1.json
  PARENT_RUN_ID: "33473378340"
  DEFORM_REPOSITORY: roahmlab/DEFORM
  DEFORM_COMMIT: b73b8b8ecc033caefa693fab7898741d4e6dbeff
  NUMPY_VERSION: "2.2.6"

jobs:
  audit:
    name: Source-frozen gate comparison and held support audit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out exact audit revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          clean: true

      - name: Set up pinned Python 3.12 runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install and verify audit implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1" \
            "numpy==${NUMPY_VERSION}"
          python -m pip install -e ".[dev]"
          python -m pip check
          files=(
            experiments/deform_dlo45_decision_identifiability_v1/gate_audit.py
            tests/test_deform_dlo45_decision_gate_audit_v1.py
          )
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m pytest -q -p no:cacheprovider \
            tests/test_deform_dlo45_decision_gate_audit_v1.py \
            tests/test_deform_dlo45_decision_identifiability_v1.py \
            tests/test_query_quotient_belief_v1.py

      - name: Download exact parent source and target artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ env.PARENT_RUN_ID }}
          github-token: ${{ github.token }}
          repository: IPS-Stuttgart/BayesianPhysTwin
          path: ${{ runner.temp }}/parent-artifacts

      - name: Check out source-only DEFORM partitions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.DEFORM_REPOSITORY }}
          ref: ${{ env.DEFORM_COMMIT }}
          path: upstream-DEFORM-source
          fetch-depth: 1
          persist-credentials: false
          clean: true
          sparse-checkout: |
            data_set/DLO4/train
            data_set/DLO5/train
          sparse-checkout-cone-mode: false

      - name: Freeze heuristic thresholds using source data only
        shell: bash
        run: |
          set -euo pipefail
          source_root="${GITHUB_WORKSPACE}/upstream-DEFORM-source/data_set"
          for dlo in DLO4 DLO5; do
            test "$(find "${source_root}/${dlo}/train" -maxdepth 1 -type f -name '*.pkl' | wc -l)" -eq 56
            test ! -e "${source_root}/${dlo}/eval"
          done
          parent_source="${RUNNER_TEMP}/parent-artifacts/dlo45-decision-source-${PARENT_RUN_ID}"
          source_out="${RUNNER_TEMP}/gate-audit-source"
          mkdir -p "${source_out}"
          python -m experiments.deform_dlo45_decision_identifiability_v1.gate_audit \
            source \
            --protocol "${PARENT_PROTOCOL}" \
            --audit-protocol "${AUDIT_PROTOCOL}" \
            --request "${REQUEST}" \
            --dataset-root "${source_root}" \
            --output-root "${source_out}" \
            --parent-source-model "${parent_source}/source_model.npz" \
            --parent-source-result "${parent_source}/source_result.json" \
            --parent-source-seal "${parent_source}/source_seal.json"
          test -s "${source_out}/thresholds.json"
          test -s "${source_out}/source_seal.json"
          rm -rf upstream-DEFORM-source
          test ! -e upstream-DEFORM-source

      - name: Check out held DEFORM partitions only after source sealing
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.DEFORM_REPOSITORY }}
          ref: ${{ env.DEFORM_COMMIT }}
          path: upstream-DEFORM-target
          fetch-depth: 1
          persist-credentials: false
          clean: true
          sparse-checkout: |
            data_set/DLO4/eval
            data_set/DLO5/eval
          sparse-checkout-cone-mode: false

      - name: Apply frozen gates and audit registered support
        shell: bash
        run: |
          set -euo pipefail
          target_root="${GITHUB_WORKSPACE}/upstream-DEFORM-target/data_set"
          for dlo in DLO4 DLO5; do
            test "$(find "${target_root}/${dlo}/eval" -maxdepth 1 -type f -name '*.pkl' | wc -l)" -eq 14
            test ! -e "${target_root}/${dlo}/train"
          done
          parent_source="${RUNNER_TEMP}/parent-artifacts/dlo45-decision-source-${PARENT_RUN_ID}"
          parent_target="${RUNNER_TEMP}/parent-artifacts/dlo45-decision-result-${PARENT_RUN_ID}"
          source_out="${RUNNER_TEMP}/gate-audit-source"
          target_out="${RUNNER_TEMP}/gate-audit-target"
          mkdir -p "${target_out}"
          python -m experiments.deform_dlo45_decision_identifiability_v1.gate_audit \
            target \
            --protocol "${PARENT_PROTOCOL}" \
            --audit-protocol "${AUDIT_PROTOCOL}" \
            --request "${REQUEST}" \
            --dataset-root "${target_root}" \
            --output-root "${target_out}" \
            --parent-source-model "${parent_source}/source_model.npz" \
            --parent-source-seal "${parent_source}/source_seal.json" \
            --thresholds "${source_out}/thresholds.json" \
            --threshold-seal "${source_out}/source_seal.json"
          cat "${target_out}/summary.md"
          PARENT_TARGET="${parent_target}/target_result.json" AUDIT_TARGET="${target_out}/target_audit.json" python - <<'PY'
          import json
          import math
          import os
          from pathlib import Path

          parent = json.loads(Path(os.environ["PARENT_TARGET"]).read_text())
          audit = json.loads(Path(os.environ["AUDIT_TARGET"]).read_text())
          certificate = audit["combined"]["certificate"]
          assert certificate["decision_count"] == parent["aggregate"]["decision_count"] == 532
          assert certificate["nonfallback_count"] == parent["aggregate"]["certificate_nonfallback_count"] == 82
          assert math.isclose(
              certificate["rmse_ratio_to_fallback"],
              parent["aggregate"]["certificate_rmse_ratio"],
              rel_tol=0.0,
              abs_tol=1e-12,
          )
          PY

      - name: Upload complete audit evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dlo45-gate-risk-audit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/gate-audit-source/thresholds.json
            ${{ runner.temp }}/gate-audit-source/source_audit.json
            ${{ runner.temp }}/gate-audit-source/source_seal.json
            ${{ runner.temp }}/gate-audit-target/target_audit.json
            ${{ runner.temp }}/gate-audit-target/per_decision.jsonl
            ${{ runner.temp }}/gate-audit-target/summary.md
          if-no-files-found: error
          retention-days: 90

      - name: Commit compact evidence to the audit branch
        shell: bash
        run: |
          set -euo pipefail
          destination="results/science/deform_dlo45_decision_gate_audit_v1/official-dlo45-gate-risk-audit-20260902-v1"
          test ! -e "${destination}"
          mkdir -p "${destination}"
          cp "${RUNNER_TEMP}/gate-audit-source/thresholds.json" "${destination}/thresholds.json"
          cp "${RUNNER_TEMP}/gate-audit-source/source_audit.json" "${destination}/source_audit.json"
          cp "${RUNNER_TEMP}/gate-audit-source/source_seal.json" "${destination}/source_seal.json"
          cp "${RUNNER_TEMP}/gate-audit-target/target_audit.json" "${destination}/target_audit.json"
          cp "${RUNNER_TEMP}/gate-audit-target/per_decision.jsonl" "${destination}/per_decision.jsonl"
          cp "${RUNNER_TEMP}/gate-audit-target/summary.md" "${destination}/README.md"
          cat > "${destination}/provenance.json" <<EOF
          {
            "audit_repository_revision": "${GITHUB_SHA}",
            "audit_workflow_run_id": ${GITHUB_RUN_ID},
            "parent_workflow_run_id": ${PARENT_RUN_ID},
            "dataset_repository": "${DEFORM_REPOSITORY}",
            "dataset_commit": "${DEFORM_COMMIT}",
            "numpy_version": "${NUMPY_VERSION}",
            "target_retries": false,
            "target_tuning": false
          }
          EOF
          rm -rf upstream-DEFORM-target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${destination}"
          git diff --cached --check
          git commit -m "Record DEFORM matched-coverage gate and support audit"
          git push origin "HEAD:${GITHUB_REF_NAME}"
