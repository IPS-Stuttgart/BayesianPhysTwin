# workflow-lifecycle: permanent
# workflow-owner: IPS-Stuttgart maintainers
name: Deform360 real-data evaluation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deform360-real-evaluation.yml"
      - ".github/quality/workflow-inventory-budget-v1.json"
      - "docs/workflow_inventory_budget.md"
      - "experiments/deform360_real_v1/**"
      - "tests/test_deform360_real_v1.py"
      - "tests/test_workflow_inventory_budget.py"
  push:
    branches:
      - main
      - run/deform360-gpuserver4090-real-v1
    paths:
      - ".github/requests/deform360-real-evaluation-v1.json"

permissions:
  contents: read

concurrency:
  group: deform360-real-evaluation-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  DATASET_ROOT: /mnt/seagate10tb/florianpfaff/datasets/deform360
  REQUEST_PATH: .github/requests/deform360-real-evaluation-v1.json

jobs:
  contracts:
    name: Deform360 real-evaluation contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: experiments/deform360_real_v1/protocol.json

      - name: Install isolated contract dependencies
        run: python -m pip install numpy==1.26.4 pytest ruff

      - name: Run causal-boundary and carrier contracts
        run: python -m pytest -q tests/test_deform360_real_v1.py

      - name: Check focused source quality
        run: |
          python -m ruff check \
            experiments/deform360_real_v1 \
            tests/test_deform360_real_v1.py
          python -m ruff format --check \
            experiments/deform360_real_v1 \
            tests/test_deform360_real_v1.py
          python -m compileall -q experiments/deform360_real_v1

      - name: Validate request shape when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "${REQUEST_PATH}" ]]; then
            exit 0
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          request = json.loads(Path(os.environ["REQUEST_PATH"]).read_text())
          required = {
              "schema": "deform360-real-evaluation-request-v1",
              "dataset_root": "/mnt/seagate10tb/florianpfaff/datasets/deform360",
              "runner_label": "gpuserver4090",
              "profile": "pilot",
              "reserved_objects_authorized": False,
              "fresh_confirmation_authorized": False,
              "paper_claim_authorized": False,
              "evidence_class": (
                  "retrospective-public-real-data-development; "
                  "no fresh-confirmation claim"
              ),
          }
          for key, value in required.items():
              if request.get(key) != value:
                  raise SystemExit(f"invalid request field {key!r}")
          allowed = set(required) | {"request_id", "expected_source_revision"}
          if set(request) != allowed:
              raise SystemExit(
                  f"request keys changed: {sorted(set(request) - allowed)}"
              )
          if not request["request_id"]:
              raise SystemExit("request_id must be nonempty")
          revision = request["expected_source_revision"]
          if len(revision) != 40 or any(c not in "0123456789abcdef" for c in revision):
              raise SystemExit("expected_source_revision must be a lowercase commit SHA")
          PY

  authorize:
    name: Authorize one file-triggered development run
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      profile: ${{ steps.request.outputs.profile }}
    steps:
      - name: Check out request revision with its parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Require one newly added canonical request
        id: request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          test "${PUSH_FORCED}" = false
          test "${BEFORE_SHA}" != 0000000000000000000000000000000000000000
          mapfile -t changed < <(git diff --name-status "${BEFORE_SHA}" "${GITHUB_SHA}")
          printf 'Changed files:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = $'A\t'"${REQUEST_PATH}"
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          request = json.loads(Path(os.environ["REQUEST_PATH"]).read_text())
          parent = subprocess.check_output(
              ["git", "rev-parse", f"{os.environ['GITHUB_SHA']}^"], text=True
          ).strip()
          if request["expected_source_revision"] != parent:
              raise SystemExit(
                  "request expected_source_revision does not equal trigger parent"
              )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as handle:
              handle.write(f"profile={request['profile']}\n")
          PY

  evaluation:
    name: Read-only Deform360 diagnostic / gpuserver4090
    needs: [contracts, authorize]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      needs.contracts.result == 'success' &&
      needs.authorize.result == 'success'
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 180
    env:
      PROFILE: ${{ needs.authorize.outputs.profile }}
    steps:
      - name: Check out exact authorized revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Prepare isolated runtime and output
        shell: bash
        run: |
          set -euo pipefail
          test -d "${DATASET_ROOT}"
          test -r "${DATASET_ROOT}"
          resolved="$(readlink -f -- "${DATASET_ROOT}")"
          test "${resolved}" = "${DATASET_ROOT}"
          output="${RUNNER_TEMP}/deform360-real-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          venv="${RUNNER_TEMP}/deform360-real-venv-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "${output}"
          test ! -e "${venv}"
          python -m venv "${venv}"
          "${venv}/bin/python" -m pip install numpy==1.26.4
          {
            echo "EVAL_OUTPUT=${output}"
            echo "EVAL_VENV=${venv}"
            echo "EVAL_PYTHON=${venv}/bin/python"
          } >> "${GITHUB_ENV}"

      - name: Record non-sensitive execution identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${EVAL_OUTPUT}"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "revision=${GITHUB_SHA}"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "required_runner_label=gpuserver4090"
            echo "dataset_root=${DATASET_ROOT}"
            "${EVAL_PYTHON}" --version
            uname -a
            nvidia-smi --query-gpu=index,name,uuid,driver_version,memory.total \
              --format=csv,noheader
          } | tee "${EVAL_OUTPUT}/environment.txt"
          cp "${REQUEST_PATH}" "${EVAL_OUTPUT}/evaluation_request.json"

      - name: Evaluate bounded public real-data carriers
        shell: bash
        run: |
          set -euo pipefail
          scratch="${RUNNER_TEMP}/deform360-result-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          "${EVAL_PYTHON}" -m experiments.deform360_real_v1.run \
            --data-root "${DATASET_ROOT}" \
            --profile "${PROFILE}" \
            --output-dir "${scratch}"
          cp -a "${scratch}/." "${EVAL_OUTPUT}/"
          rm -rf -- "${scratch}"

      - name: Verify compact result and closed boundaries
        shell: bash
        run: |
          set -euo pipefail
          "${EVAL_PYTHON}" - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["EVAL_OUTPUT"])
          result = json.loads((root / "result.json").read_text())
          if result["data_root"] != os.environ["DATASET_ROOT"]:
              raise SystemExit("dataset root changed")
          if result["selection"]["evaluated_count"] < 1:
              raise SystemExit("no real-data carrier was evaluated")
          if result["selection"]["reserved_object_overlap"]:
              raise SystemExit("reserved object was evaluated")
          if result["claim_authorized"] is not False:
              raise SystemExit("result self-authorized a paper claim")
          if result["fresh_confirmation_authorized"] is not False:
              raise SystemExit("result self-authorized fresh confirmation")
          print(json.dumps(result["summary"], indent=2, sort_keys=True))
          PY
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Publish evaluation summary
        if: always() && env.EVAL_OUTPUT != ''
        shell: bash
        run: |
          if [[ -f "${EVAL_OUTPUT}/report.md" ]]; then
            cat "${EVAL_OUTPUT}/report.md" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "## Deform360 evaluation did not complete" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload aggregate evidence only
        if: always() && env.EVAL_OUTPUT != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: deform360-real-evaluation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.EVAL_OUTPUT }}/protocol.json
            ${{ env.EVAL_OUTPUT }}/evaluation_request.json
            ${{ env.EVAL_OUTPUT }}/environment.txt
            ${{ env.EVAL_OUTPUT }}/carrier_inventory.json
            ${{ env.EVAL_OUTPUT }}/result.json
            ${{ env.EVAL_OUTPUT }}/case_metrics.csv
            ${{ env.EVAL_OUTPUT }}/step_metrics.csv
            ${{ env.EVAL_OUTPUT }}/report.md
            ${{ env.EVAL_OUTPUT }}/failures.json
          if-no-files-found: warn
          retention-days: 90

      - name: Remove isolated runtime and scratch
        if: always()
        shell: bash
        run: |
          rm -rf -- "${EVAL_VENV:-}" "${EVAL_OUTPUT:-}"
