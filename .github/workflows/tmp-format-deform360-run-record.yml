name: Temporary format Deform360 run-record sources

on:
  push:
    branches:
      - fix/deform360-completion-receipt-contract

permissions:
  contents: write

concurrency:
  group: temporary-format-deform360-run-record
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/deform360-completion-receipt-contract
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: "3.12"

      - name: Apply exact Ruff normalization and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'ruff==0.16.1'
          files=(
            scripts/ci/render_deform360_calibration_source_run_record.py
            src/bayesian_phystwin/_deform360_calibration_artifact_chain.py
            src/bayesian_phystwin/_deform360_calibration_run_common.py
            src/bayesian_phystwin/_deform360_calibration_source_run_record_impl.py
            src/bayesian_phystwin/_deform360_calibration_source_run_record_validation.py
            src/bayesian_phystwin/deform360_calibration_source_run_record.py
            tests/test_deform360_calibration_source_direct_workflow.py
            tests/test_deform360_calibration_source_run_record.py
            tests/test_deform360_calibration_source_run_record_validation.py
            tests/test_render_deform360_calibration_source_run_record.py
          )
          python -m ruff check --fix --select I001 "${files[@]}"
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          rm -- .github/workflows/tmp-format-deform360-run-record.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- "${files[@]}" .github/workflows/tmp-format-deform360-run-record.yml
          git commit -m 'Normalize Deform360 run-record sources'
          git push origin HEAD:fix/deform360-completion-receipt-contract
