# workflow-lifecycle: temporary
# workflow-owner: IPS-Stuttgart maintainers
# workflow-expiry: 2026-09-15
name: Fix DEFORM gate-audit launcher reference

on:
  push:
    paths:
      - ".github/workflows/deform-dlo45-gate-audit-launcher-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: true
          clean: true

      - name: Correct certificate test path and commit once
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/deform-dlo45-gate-risk-audit-one-shot.yml
          grep -q 'tests/test_query_decision_certificate_v1.py' "${workflow}"
          sed -i 's#tests/test_query_decision_certificate_v1.py#tests/test_query_quotient_belief_v1.py#' "${workflow}"
          grep -q 'tests/test_query_quotient_belief_v1.py' "${workflow}"
          git diff --check
          git add "${workflow}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix DEFORM gate-audit certificate test path"
          git push origin "HEAD:${GITHUB_REF_NAME}"
