# workflow-lifecycle: temporary
# workflow-owner: IPS-Stuttgart maintainers
name: Repair self-collision native timestamps once

on:
  push:
    branches:
      - repair/self-collision-native-timestamps-v1
    paths:
      - ".github/workflows/repair-self-collision-native-timestamps-once.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: repair/self-collision-native-timestamps-v1
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Apply source-only cadence repair and recovery routing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          data = Path(
              "experiments/tracking_cloth_self_collision_selective_twin_v1/data.py"
          )
          text = data.read_text()
          old = '''    dt = np.diff(times)
              expected_dt = stride / 120.0
              if not np.allclose(dt, expected_dt, rtol=0.05, atol=1e-4):
                  raise ValueError("sampling does not match the frozen 120 Hz contract")
              if times[-1] < forecast_end - 2 * expected_dt:
                  raise ValueError("recording does not cover the complete forecast horizon")'''
          new = '''    dt = np.diff(times)
              expected_dt = float(np.median(dt))
              if (
                  not np.isfinite(expected_dt)
                  or expected_dt <= 0.0
                  or expected_dt > 0.25
                  or not np.allclose(dt, expected_dt, rtol=0.05, atol=1e-4)
              ):
                  raise ValueError("sampling is not a regular native timestamp grid")
              if times[-1] < forecast_end - 2 * expected_dt:
                  raise ValueError("recording does not cover the complete forecast horizon")'''
          if old not in text:
              raise SystemExit("hard-coded cadence block changed")
          data.write_text(text.replace(old, new))

          readme = Path(
              "experiments/tracking_cloth_self_collision_selective_twin_v1/README.md"
          )
          text = readme.read_text()
          anchor = '''The publisher describes the self-collision rod as static and stores its two
          markers before the cloth markers. The parser accepts the documented
          `four/two` and `normal/parallel` filename factors, and the reduced simulator
          holds a robust prefix estimate of the rod pose fixed after initialization.'''
          replacement = '''The publisher describes the self-collision rod as static and stores its two
          markers before the cloth markers. The parser accepts the documented
          `four/two` and `normal/parallel` filename factors. It preserves each file's
          monotone native timestamp grid and deterministically takes every fourth row;
          it does not impose the free-hanging pilot's 120 Hz cadence on this subset.
          The reduced simulator holds a robust prefix estimate of the rod pose fixed
          after initialization.'''
          if anchor not in text:
              raise SystemExit("README dataset-contract paragraph changed")
          readme.write_text(text.replace(anchor, replacement))

          test = Path("tests/test_tracking_cloth_self_collision_selective_twin_v1.py")
          text = test.read_text()
          old = '''def _write_case(path: Path, *, future_numeric: bool, forecast: float = 0.2) -> None:
              cloth = _grid()
              rod = np.asarray([[-0.7, 0.0, 0.24], [0.9, 0.0, 0.24]])
              dt = 1.0 / 120.0'''
          new = '''def _write_case(
              path: Path,
              *,
              future_numeric: bool,
              forecast: float = 0.2,
              native_hz: float = 120.0,
          ) -> None:
              cloth = _grid()
              rod = np.asarray([[-0.7, 0.0, 0.24], [0.9, 0.0, 0.24]])
              dt = 1.0 / native_hz'''
          if old not in text:
              raise SystemExit("synthetic writer block changed")
          text = text.replace(old, new)
          anchor = '''def test_contact_and_kinematic_predictions_are_finite(tmp_path: Path) -> None:
          '''
          addition = '''def test_prediction_input_accepts_regular_native_non_120hz_grid(
              tmp_path: Path,
          ) -> None:
              path = tmp_path / "cotton_A2_four_normal_rep3.csv"
              _write_case(path, future_numeric=False, native_hz=100.0)
              inputs = prediction_input(
                  Case(path, "cotton", "four_corners_normal", 3), _small_protocol()
              )
              assert np.allclose(np.diff(inputs.times), 0.01, rtol=0.05, atol=1e-4)


          def test_contact_and_kinematic_predictions_are_finite(tmp_path: Path) -> None:
          '''
          if anchor not in text:
              raise SystemExit("test insertion anchor changed")
          test.write_text(text.replace(anchor, addition))

          workflow = Path(
              ".github/workflows/tracking-cloth-self-collision-selective-twin-v1.yml"
          )
          text = workflow.read_text()
          text = text.replace(
              '      - ".github/requests/tracking-cloth-self-collision-selective-twin-v1.json"\n',
              '      - ".github/requests/tracking-cloth-self-collision-selective-twin-v1.json"\n'
              '      - ".github/requests/tracking-cloth-self-collision-selective-twin-recovery-v1.json"\n',
              2,
          )
          old = '''  REQUEST_PATH: .github/requests/tracking-cloth-self-collision-selective-twin-v1.json
          '''
          new = '''  PRIMARY_REQUEST_PATH: .github/requests/tracking-cloth-self-collision-selective-twin-v1.json
            RECOVERY_REQUEST_PATH: .github/requests/tracking-cloth-self-collision-selective-twin-recovery-v1.json
          '''
          if old not in text:
              raise SystemExit("workflow request env changed")
          text = text.replace(old, new)

          old = '''          request_path = Path(os.environ["REQUEST_PATH"])
                    if request_path.exists():
                        request = json.loads(request_path.read_text())
                        expected = {
                            "schema": (
                                "tracking-cloth-self-collision-selective-twin-request-v1"
                            ),
                            "mode": "fresh_rep3_confirmation",
                            "dataset_root": os.environ["DATASET_ROOT"],
                            "runner_label": "gpuserver4090",
                            "fit_repetition": 1,
                            "selection_repetition": 2,
                            "confirmation_repetition": 3,
                            "fresh_confirmation": True,
                            "paper_claim_authorized": False,
                        }
                        for key, value in expected.items():
                            assert request.get(key) == value, (key, request.get(key), value)
                        assert set(request) == set(expected) | {
                            "request_id",
                            "expected_source_revision",
                            "protocol_sha256",
                        }
                        assert request["request_id"]
                        revision = request["expected_source_revision"]
                        assert len(revision) == 40
                        assert set(revision) <= set("0123456789abcdef")'''
          new = '''          specifications = {
                        Path(os.environ["PRIMARY_REQUEST_PATH"]): (
                            {
                                "schema": (
                                    "tracking-cloth-self-collision-selective-twin-request-v1"
                                ),
                                "mode": "fresh_rep3_confirmation",
                                "dataset_root": os.environ["DATASET_ROOT"],
                                "runner_label": "gpuserver4090",
                                "fit_repetition": 1,
                                "selection_repetition": 2,
                                "confirmation_repetition": 3,
                                "fresh_confirmation": True,
                                "paper_claim_authorized": False,
                            },
                            set(),
                        ),
                        Path(os.environ["RECOVERY_REQUEST_PATH"]): (
                            {
                                "schema": (
                                    "tracking-cloth-self-collision-selective-twin-"
                                    "recovery-request-v1"
                                ),
                                "mode": "source_timestamp_contract_recovery",
                                "dataset_root": os.environ["DATASET_ROOT"],
                                "runner_label": "gpuserver4090",
                                "fit_repetition": 1,
                                "selection_repetition": 2,
                                "confirmation_repetition": 3,
                                "fresh_confirmation": True,
                                "paper_claim_authorized": False,
                                "prior_failed_run_id": "33565468838",
                                "repair_scope": "native_timestamp_cadence_only",
                            },
                            {"prior_failed_run_id", "repair_scope"},
                        ),
                    }
                    for request_path, (expected, recovery_fields) in specifications.items():
                        if not request_path.exists():
                            continue
                        request = json.loads(request_path.read_text())
                        for key, value in expected.items():
                            assert request.get(key) == value, (
                                request_path.name,
                                key,
                                request.get(key),
                                value,
                            )
                        common = {
                            "request_id",
                            "expected_source_revision",
                            "protocol_sha256",
                        }
                        assert set(request) == set(expected) | common
                        assert recovery_fields <= set(request)
                        assert request["request_id"]
                        revision = request["expected_source_revision"]
                        assert len(revision) == 40
                        assert set(revision) <= set("0123456789abcdef")'''
          if old not in text:
              raise SystemExit("workflow contract request block changed")
          text = text.replace(old, new)

          old = '''          test "${#changed[@]}" -eq 1
                    test "${changed[0]}" = $'A\\t.github/requests/tracking-cloth-self-collision-selective-twin-v1.json'
                    python - <<'PY'
          '''
          new = '''          test "${#changed[@]}" -eq 1
                    case "${changed[0]}" in
                      $'A\\t.github/requests/tracking-cloth-self-collision-selective-twin-v1.json')
                        request="$PRIMARY_REQUEST_PATH"
                        ;;
                      $'A\\t.github/requests/tracking-cloth-self-collision-selective-twin-recovery-v1.json')
                        request="$RECOVERY_REQUEST_PATH"
                        ;;
                      *) echo "push is not one newly added registered request" >&2; exit 2 ;;
                    esac
                    REQUEST_PATH="$request" python - <<'PY'
          '''
          if old not in text:
              raise SystemExit("workflow authorization routing block changed")
          text = text.replace(old, new)
          old = '''          if request["protocol_sha256"] != digest:
                        raise SystemExit("request protocol digest changed")
                    with Path(os.environ["GITHUB_OUTPUT"]).open("a") as stream:
          '''
          new = '''          if request["protocol_sha256"] != digest:
                        raise SystemExit("request protocol digest changed")
                    if request["schema"].endswith("recovery-request-v1"):
                        if request["prior_failed_run_id"] != "33565468838":
                            raise SystemExit("recovery is not bound to the failed run")
                        if request["repair_scope"] != "native_timestamp_cadence_only":
                            raise SystemExit("recovery scope changed")
                    with Path(os.environ["GITHUB_OUTPUT"]).open("a") as stream:
          '''
          if old not in text:
              raise SystemExit("workflow recovery authorization anchor changed")
          workflow.write_text(text.replace(old, new))
          PY
          python -m pip install ruff==0.16.5
          python -m ruff format \
            experiments/tracking_cloth_self_collision_selective_twin_v1/data.py \
            tests/test_tracking_cloth_self_collision_selective_twin_v1.py
          python -m ruff check \
            experiments/tracking_cloth_self_collision_selective_twin_v1/data.py \
            tests/test_tracking_cloth_self_collision_selective_twin_v1.py
          rm .github/workflows/repair-self-collision-native-timestamps-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            experiments/tracking_cloth_self_collision_selective_twin_v1/data.py \
            experiments/tracking_cloth_self_collision_selective_twin_v1/README.md \
            tests/test_tracking_cloth_self_collision_selective_twin_v1.py \
            .github/workflows/tracking-cloth-self-collision-selective-twin-v1.yml \
            .github/workflows/repair-self-collision-native-timestamps-once.yml
          git commit -m "Use native timestamps for self-collision source recovery"
          git push origin HEAD:repair/self-collision-native-timestamps-v1
