name: Materialize adaptive stochastic policy tree

on:
  push:
    branches:
      - science/adaptive-stochastic-policy-tree-v1
    paths:
      - .github/workflows/materialize-adaptive-policy-tree-v1.yml

permissions:
  contents: write

concurrency:
  group: materialize-adaptive-policy-tree-v1
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact payload revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: true
          persist-credentials: true

      - name: Materialize and verify reviewed files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import string
          import tarfile
          import zlib
          from pathlib import Path

          target_b64_length = 53824
          target_compressed_sha = '77d542323a37432b2bc3dad5f0876108922f20a0184afb4939e1f8c1f522f7c3'
          target_archive_sha = 'bd289fb07a9e276547f5df164d3b8cb2adb0aa7e7eff997933b0e926876ed67a'
          expected_parts = [
              'adaptive-policy-tree-v1.part00',
              'adaptive-policy-tree-v1.part01',
              'adaptive-policy-tree-v1.part02',
              'adaptive-policy-tree-v1.part03',
              'adaptive-policy-tree-v1.part04a',
              'adaptive-policy-tree-v1.part04b',
              'adaptive-policy-tree-v1.part05',
              'adaptive-policy-tree-v1.part06',
              'adaptive-policy-tree-v1.part07',
          ]
          part_root = Path('.github/materialization')
          parts = [part_root / name for name in expected_parts]
          if not all(path.is_file() for path in parts):
              raise SystemExit('one or more reviewed payload parts are missing')
          unexpected = sorted(
              path.name for path in part_root.glob('adaptive-policy-tree-v1.part*')
              if path.name not in expected_parts
          )
          if unexpected:
              raise SystemExit(f'unexpected payload parts: {unexpected}')

          values = [path.read_text(encoding='utf-8').strip() for path in parts]
          encoded = ''.join(values)
          if len(encoded) == target_b64_length - 1 and len(values[4]) == 3499:
              # One character was dropped by the contents transport in part04a.
              # Recover it uniquely from the precommitted compressed-byte digest;
              # no scientific source is interpreted before that digest matches.
              prefix_length = sum(len(value) for value in values[:4])
              alphabet = string.ascii_uppercase + string.ascii_lowercase + string.digits + '+/'
              matches: list[str] = []
              for offset in range(len(values[4]) + 1):
                  position = prefix_length + offset
                  for character in alphabet:
                      candidate = encoded[:position] + character + encoded[position:]
                      try:
                          compressed_candidate = base64.b64decode(candidate, validate=True)
                      except ValueError:
                          continue
                      if hashlib.sha256(compressed_candidate).hexdigest() == target_compressed_sha:
                          matches.append(candidate)
                  if len(matches) > 1:
                      break
              if len(matches) != 1:
                  raise SystemExit(f'payload repair was not unique: {len(matches)} matches')
              encoded = matches[0]
              print('Recovered the single dropped base64 character from the committed digest.')

          if len(encoded) != target_b64_length:
              raise SystemExit(f'payload length mismatch: {len(encoded)}')
          compressed = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(compressed).hexdigest() != target_compressed_sha:
              raise SystemExit('compressed payload digest mismatch')
          archive_bytes = zlib.decompress(compressed)
          if hashlib.sha256(archive_bytes).hexdigest() != target_archive_sha:
              raise SystemExit('archive digest mismatch')

          expected = {
              'experiments/adaptive_act_sense_fallback_certificate_v1/README.md':
                  '875f77ede19a34b27b3c58117ccc1e5531234336100f1a25e4352a0e05c8f7dd',
              'experiments/adaptive_act_sense_fallback_certificate_v1/__init__.py':
                  '73db8feed051114c707023c7149c4653b00a642aa11a764e9d9347c6f2979b8a',
              'experiments/adaptive_act_sense_fallback_certificate_v1/run.py':
                  '6e91720d918d089298287e2729eef69add7983b10f17ac4902800950602638c0',
              'experiments/adaptive_act_sense_fallback_certificate_v1/result.json':
                  '4259dd2d33ab075af5201390661425bc47e5f716463293e06d1ebba522d50d29',
              'src/bayesian_phystwin/adaptive_act_sense_fallback_certificate_v1.py':
                  '1752ed1bf729a329b122ee8ab7bd56a92032db2dc105990b57a7918ce58967b2',
              'tests/test_adaptive_act_sense_fallback_certificate_v1.py':
                  '5e41701731da5c02c28879a8b07c3a3e35d3aea4861a49958afbbf87e161c2a3',
          }
          with tarfile.open(fileobj=io.BytesIO(archive_bytes), mode='r:') as archive:
              members = {member.name: member for member in archive.getmembers()}
              for relative, digest in expected.items():
                  member = members.get(relative)
                  if member is None or not member.isfile():
                      raise SystemExit(f'missing expected archive member: {relative}')
                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit(f'cannot read archive member: {relative}')
                  payload = source.read()
                  if hashlib.sha256(payload).hexdigest() != digest:
                      raise SystemExit(f'file digest mismatch: {relative}')
                  destination = Path(relative)
                  if destination.is_absolute() or '..' in destination.parts:
                      raise SystemExit(f'unsafe destination: {relative}')
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(payload)

          for path in parts:
              path.unlink()
          Path('.github/workflows/materialize-adaptive-policy-tree-v1.yml').unlink()
          PY

          python -m py_compile \
            src/bayesian_phystwin/adaptive_act_sense_fallback_certificate_v1.py \
            experiments/adaptive_act_sense_fallback_certificate_v1/run.py \
            tests/test_adaptive_act_sense_fallback_certificate_v1.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Add exact stochastic adaptive policy-tree certificate'
          git push origin "HEAD:${GITHUB_REF_NAME}"
