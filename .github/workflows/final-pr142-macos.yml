name: Final PR 142 macOS validation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/final-pr142-macos.yml"

permissions:
  contents: read

concurrency:
  group: final-pr142-macos-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  full-suite-and-distributions:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/deform360-calibration-seal'
    name: Full suite and distributions / Python 3.12 / macOS
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out exact pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install complete test environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,graph,vision]"
          python -m pip check

      - name: Run complete repository suite and CLI contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest --tb=short
          bpt --help >/dev/null
          bpt experiment describe seal-deform360-calibration >/dev/null
          bpt experiment run seal-deform360-calibration --help >/dev/null

      - name: Build and validate distributions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Exercise installed wheel and source distribution
        shell: bash
        run: |
          set -euo pipefail
          for kind in wheel sdist; do
            environment="$RUNNER_TEMP/bpt-pr142-${kind}"
            python -m venv "$environment"
            python_bin="$environment/bin/python"
            "$python_bin" -m pip install --upgrade pip
            if [[ "$kind" == wheel ]]; then
              artifact=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
            else
              artifact=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
            fi
            test -n "$artifact"
            "$python_bin" -m pip install "$artifact"
            "$python_bin" -m pip check
            "$environment/bin/bpt" --help >/dev/null
            "$environment/bin/bpt" experiment describe \
              seal-deform360-calibration >/dev/null
            "$environment/bin/bpt" experiment run \
              seal-deform360-calibration --help >/dev/null
          done
