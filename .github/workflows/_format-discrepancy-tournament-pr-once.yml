name: Format discrepancy tournament PR once

on:
  push:
    branches:
      - agent/discrepancy-candidate-tournament-v1-current
    paths:
      - .github/workflows/_format-discrepancy-tournament-pr-once.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/_format-discrepancy-tournament-pr-once.yml

permissions:
  contents: write

concurrency:
  group: format-discrepancy-tournament-pr-once
  cancel-in-progress: false

jobs:
  format:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      ((github.event_name == 'push' &&
        github.ref == 'refs/heads/agent/discrepancy-candidate-tournament-v1-current') ||
       (github.event_name == 'pull_request' &&
        github.head_ref == 'agent/discrepancy-candidate-tournament-v1-current'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/discrepancy-candidate-tournament-v1-current
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development environment
        run: |
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Apply authoritative Ruff formatting and validate
        shell: bash
        run: |
          set -euo pipefail
          file=src/bayesian_phystwin/discrepancy_candidate_tournament.py
          python -m ruff check --fix -- "${file}"
          python -m ruff format -- "${file}"
          python -m ruff check -- "${file}"
          python -m ruff format --check -- "${file}"
          python -m pytest -q \
            tests/test_horizon_conditioned_discrepancy_tournament.py \
            tests/test_horizon_conditioned_discrepancy_tournament_cli.py \
            tests/test_horizon_conditioned_discrepancy_tournament_crossfit.py \
            tests/test_horizon_conditioned_discrepancy_tournament_hardening.py \
            tests/test_command_registry.py \
            tests/test_cli_main.py
          python -m compileall -q src tests
          git diff --check

      - name: Remove one-use workflow and publish
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_format-discrepancy-tournament-pr-once.yml
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Apply Ruff formatting to discrepancy tournament"
          git push origin HEAD:agent/discrepancy-candidate-tournament-v1-current
