name: Reusable frozen Deform360 calibration source

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: deform360-official-calibration-source-direct
  cancel-in-progress: true

env:
  BPT_SOURCE_SHA: ${{ inputs.source_sha }}
  PROCESSING_REVISION: d8522a4403b766aeb387510c04e89032a56fdf35
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  DATA_ROOT: ${{ vars.DEFORM360_OFFICIAL_CALIBRATION_DATA_ROOT || '/mnt/lexar4tb/datasets/deform360_official_hub_visuotactile_v1/calibration-source' }}
  PROCESSED_ROOT: ${{ vars.DEFORM360_OFFICIAL_CALIBRATION_PROCESSED_ROOT || '/mnt/lexar4tb/datasets/deform360_official_hub_visuotactile_v1/calibration-processed' }}

jobs:
  prepare-calibration-source:
    name: Direct reviewed ten-object calibration source / workstation2
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 400
    steps:
      - name: Publish non-sensitive run beacon before checkout
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evidence_root="${RUNNER_TEMP}/deform360-calibration-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          site_root="${RUNNER_TEMP}/deform360-calibration-site-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          processing_repo="${GITHUB_WORKSPACE}/_deform360_processing"
          staged_root="${PROCESSED_ROOT}/staged-raw"
          rm -rf -- "${evidence_root}" "${site_root}"
          mkdir -p -- "${evidence_root}" "${site_root}"
          {
            echo "EVIDENCE_ROOT=${evidence_root}"
            echo "PYTHON_SITE=${site_root}"
            echo "PROCESSING_REPO=${processing_repo}"
            echo "STAGED_ROOT=${staged_root}"
          } >> "${GITHUB_ENV}"
          python3 - "${evidence_root}/beacon.json" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          body = "\n".join(
              [
                  "## Direct ten-object calibration-source execution started",
                  "",
                  f"- workflow run: `{os.environ['GITHUB_RUN_ID']}`",
                  f"- exact reviewed source revision: `{os.environ['BPT_SOURCE_SHA']}`",
                  "- runner lane: `self-hosted, Linux, X64, nvidia-smi`",
                  "- authorized payload scope: ten frozen calibration objects only",
                  "- forbidden payload scope: all confirmation objects and target outcomes",
              ]
          )
          Path(sys.argv[1]).write_text(
              json.dumps({"body": body}, sort_keys=True), encoding="utf-8"
          )
          PY
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/148/comments" \
            --data-binary @"${evidence_root}/beacon.json"

      - name: Check out exact reviewed BayesianPhysTwin source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Check out exact official Deform360 processing source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lhy0807/deform360
          ref: ${{ env.PROCESSING_REVISION }}
          path: _deform360_processing
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Validate and prepare the frozen calibration source
        shell: bash
        run: bash scripts/ci/run_deform360_calibration_source_direct.sh

      - name: Publish non-sensitive completion receipt
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evidence_root="${EVIDENCE_ROOT:-${RUNNER_TEMP}/deform360-calibration-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"
          mkdir -p -- "${evidence_root}"
          manifest="${evidence_root}/execution-manifest.json"
          receipt="${evidence_root}/completion-receipt.json"
          python3 - "${manifest}" "${receipt}" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys

          manifest_path = Path(sys.argv[1])
          lines = [
              "## Direct ten-object calibration-source execution completed",
              "",
              f"- workflow run: `{os.environ['GITHUB_RUN_ID']}`",
              f"- workflow attempt: `{os.environ['GITHUB_RUN_ATTEMPT']}`",
              f"- exact reviewed source revision: `{os.environ['BPT_SOURCE_SHA']}`",
          ]
          try:
              record = json.loads(manifest_path.read_text(encoding="utf-8"))
              if record.get("schema") != (
                  "bayesian-phystwin.deform360-calibration-source-run"
              ):
                  raise ValueError("unexpected execution-record schema")
              expected_digest = record.get("record_sha256")
              payload = dict(record)
              payload.pop("record_sha256", None)
              actual_digest = hashlib.sha256(
                  json.dumps(
                      payload,
                      sort_keys=True,
                      separators=(",", ":"),
                      allow_nan=False,
                  ).encode("utf-8")
              ).hexdigest()
              if expected_digest != actual_digest:
                  raise ValueError("execution-record digest changed")
              if record.get("source_revision") != os.environ["BPT_SOURCE_SHA"]:
                  raise ValueError("execution-record source changed")
              if record.get("workflow_run_id") != int(os.environ["GITHUB_RUN_ID"]):
                  raise ValueError("execution-record run changed")
              if record.get("workflow_run_attempt") != int(
                  os.environ["GITHUB_RUN_ATTEMPT"]
              ):
                  raise ValueError("execution-record attempt changed")
              lines.extend(
                  [
                      f"- status: `{record['status']}`",
                      f"- exit code: `{record['exit_code']}`",
                      f"- failure stage: `{record['failure_stage']}`",
                      (
                          "- confirmation boundary verified: "
                          f"`{record['confirmation_boundary_verified']}`"
                      ),
                      f"- execution-record digest: `{record['record_sha256']}`",
                  ]
              )
              for label, valid_key, error_key, digest_key in (
                  ("plan", "plan_valid", "plan_error", "plan_sha256"),
                  (
                      "download",
                      "download_valid",
                      "download_error",
                      "download_sha256",
                  ),
                  ("result", "result_valid", "result_error", "result_sha256"),
              ):
                  if record.get(valid_key) is True:
                      lines.append(f"- {label} digest: `{record[digest_key]}`")
                  elif record.get(error_key) is not None:
                      lines.append(f"- {label} record: `{record[error_key]}`")
              plan_gate = record.get("plan_support_gate")
              if isinstance(plan_gate, dict):
                  admitted_strata = json.dumps(
                      plan_gate["supported_by_stratum"],
                      sort_keys=True,
                      separators=(",", ":"),
                  )
                  lines.extend(
                      [
                          (
                              "- admitted objects: "
                              f"`{plan_gate['supported_object_count']}`"
                          ),
                          f"- admitted by stratum: `{admitted_strata}`",
                          (
                              "- admission gate passed: "
                              f"`{plan_gate['support_passed']}`"
                          ),
                      ]
                  )
              gate = record.get("support_gate")
              if isinstance(gate, dict):
                  strata = json.dumps(
                      gate["supported_by_stratum"],
                      sort_keys=True,
                      separators=(",", ":"),
                  )
                  lines.extend(
                      [
                          (
                              "- prepared objects: "
                              f"`{gate['supported_object_count']}`"
                          ),
                          f"- prepared by stratum: `{strata}`",
                          f"- support gate passed: `{gate['support_passed']}`",
                      ]
                  )
          except (OSError, ValueError, KeyError):
              lines.extend(
                  [
                      "- status: `execution-record-unavailable`",
                      "- confirmation boundary verified: `unknown`",
                  ]
              )
          lines.extend(
              [
                  "",
                  "This receipt contains no local paths, object identities, or target outcomes.",
              ]
          )
          Path(sys.argv[2]).write_text(
              json.dumps({"body": "\n".join(lines)}, sort_keys=True),
              encoding="utf-8",
          )
          PY
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/148/comments" \
            --data-binary @"${receipt}"

      - name: Publish compact calibration-source evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: deform360-official-calibration-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_ROOT }}
          if-no-files-found: warn
          retention-days: 30

      - name: Publish compact job summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "### Official-Hub Deform360 calibration source" >> "${GITHUB_STEP_SUMMARY}"
          echo >> "${GITHUB_STEP_SUMMARY}"
          echo "- Runner: \`${RUNNER_NAME}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Source revision: \`${BPT_SOURCE_SHA}\`" >> "${GITHUB_STEP_SUMMARY}"
          manifest="${EVIDENCE_ROOT:-}/execution-manifest.json"
          if [[ -f "${manifest}" ]]; then
            if python3 - "${manifest}" <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import hashlib
          import json
          from pathlib import Path
          import sys

          record = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected_digest = record.get("record_sha256")
          payload = dict(record)
          payload.pop("record_sha256", None)
          actual_digest = hashlib.sha256(
              json.dumps(
                  payload,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              ).encode("utf-8")
          ).hexdigest()
          if expected_digest != actual_digest:
              raise ValueError("execution-record digest changed")
          print(f"- Status: `{record['status']}`")
          print(f"- Exit code: `{record['exit_code']}`")
          print(
              "- Confirmation boundary verified: "
              f"`{record['confirmation_boundary_verified']}`"
          )
          for label, valid_key, error_key, digest_key in (
              ("Plan", "plan_valid", "plan_error", "plan_sha256"),
              (
                  "Download",
                  "download_valid",
                  "download_error",
                  "download_sha256",
              ),
              ("Result", "result_valid", "result_error", "result_sha256"),
          ):
              if record.get(valid_key) is True:
                  print(f"- {label} digest: `{record[digest_key]}`")
              elif record.get(error_key) is not None:
                  print(f"- {label} record: `{record[error_key]}`")
          plan_gate = record.get("plan_support_gate")
          if isinstance(plan_gate, dict):
              print(
                  "- Admitted objects: "
                  f"`{plan_gate['supported_object_count']}`"
              )
              print(
                  "- Admitted by stratum: "
                  f"`{plan_gate['supported_by_stratum']}`"
              )
              print(
                  "- Admission gate passed: "
                  f"`{plan_gate['support_passed']}`"
              )
          gate = record.get("support_gate")
          if isinstance(gate, dict):
              print(f"- Prepared objects: `{gate['supported_object_count']}`")
              print(f"- Prepared by stratum: `{gate['supported_by_stratum']}`")
              print(f"- Support gate passed: `{gate['support_passed']}`")
          print(f"- Execution-record digest: `{record['record_sha256']}`")
          PY
            then
              :
            else
              echo "- Execution record: \`invalid\`" >> "${GITHUB_STEP_SUMMARY}"
            fi
          else
            echo "- Execution record: \`unavailable\`" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Remove isolated runtime and processing checkout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for path in "${PYTHON_SITE:-}" "${PROCESSING_REPO:-}"; do
            if [[ -n "${path}" ]]; then
              rm -rf -- "${path}"
            fi
          done
