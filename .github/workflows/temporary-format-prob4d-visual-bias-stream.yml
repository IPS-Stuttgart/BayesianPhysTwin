name: Temporary recursive visual-bias consumer formatter

on:
  push:
    branches: [agent/prob4d-visual-bias-stream-binding]
    paths:
      - ".github/workflows/temporary-format-prob4d-visual-bias-stream.yml"
      - "src/bayesian_phystwin/prob4d_visual_bias_stream.py"
      - "tests/test_prob4d_visual_bias_stream.py"
      - "tests/test_prob4d_visual_bias_stream_crossrepo.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temporary-format-prob4d-visual-bias-stream.yml"
      - "src/bayesian_phystwin/prob4d_visual_bias_stream.py"
      - "tests/test_prob4d_visual_bias_stream.py"
      - "tests/test_prob4d_visual_bias_stream_crossrepo.py"

permissions:
  contents: write

concurrency:
  group: temporary-prob4d-visual-bias-stream-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 15
    steps:
      - name: Check out the exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Create an isolated quality environment
        shell: bash
        run: |
          set -euo pipefail
          environment="${RUNNER_TEMP}/prob4d-visual-bias-stream-format-${GITHUB_RUN_ID}"
          python -m venv --clear "${environment}"
          "${environment}/bin/python" -m ensurepip --upgrade
          "${environment}/bin/python" -m pip install --upgrade pip
          echo "${environment}/bin" >> "${GITHUB_PATH}"

      - name: Install the reviewed quality environment
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "ruff==0.16.1"

      - name: Make opaque producer update copies explicit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/bayesian_phystwin/prob4d_visual_bias_stream.py")
          source = path.read_text(encoding="utf-8")
          start_marker = '        raw_updates = _exact_tuple(source.updates, name="updates")\n'
          end_marker = '        return ValidatedProb4DVisualBiasStreamV1(\n'
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          replacement = "\n".join(
              [
                  '        raw_updates = _exact_tuple(source.updates, name="updates")',
                  '        copied_updates: list[Prob4DVisualBiasStreamUpdateBindingV1] = []',
                  '        for raw_update in raw_updates:',
                  '            update = cast(Any, raw_update)',
                  '            copied_updates.append(',
                  '                Prob4DVisualBiasStreamUpdateBindingV1(',
                  '                    bias_model_id=update.bias_model_id,',
                  '                    observation_stream_update_id=update.observation_stream_update_id,',
                  '                    visual_bias_artifact_id=update.visual_bias_artifact_id,',
                  '                    observation_artifact_id=update.observation_artifact_id,',
                  '                    observation_identity_sha256=update.observation_identity_sha256,',
                  '                    frame_start=update.frame_start,',
                  '                    frame_stop_exclusive=update.frame_stop_exclusive,',
                  '                    row_start=update.row_start,',
                  '                    row_stop_exclusive=update.row_stop_exclusive,',
                  '                    maximum_gauge_projection=update.maximum_gauge_projection,',
                  '                    previous_update_id=update.previous_update_id,',
                  '                    update_id=update.update_id,',
                  '                )',
                  '            )',
                  '        updates = tuple(copied_updates)',
                  '',
              ]
          )
          path.write_text(source[:start] + replacement + source[end:], encoding="utf-8")
          PY

      - name: Format, lint, and type-check the focused files
        run: |
          python -m ruff format \
            src/bayesian_phystwin/prob4d_visual_bias_stream.py \
            tests/test_prob4d_visual_bias_stream.py \
            tests/test_prob4d_visual_bias_stream_crossrepo.py
          python -m ruff check \
            src/bayesian_phystwin/prob4d_visual_bias_stream.py \
            tests/test_prob4d_visual_bias_stream.py \
            tests/test_prob4d_visual_bias_stream_crossrepo.py
          python -m ruff format --check \
            src/bayesian_phystwin/prob4d_visual_bias_stream.py \
            tests/test_prob4d_visual_bias_stream.py \
            tests/test_prob4d_visual_bias_stream_crossrepo.py
          python -m mypy src/bayesian_phystwin/prob4d_visual_bias_stream.py

      - name: Publish only against the unchanged branch head
        shell: bash
        env:
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            src/bayesian_phystwin/prob4d_visual_bias_stream.py \
            tests/test_prob4d_visual_bias_stream.py \
            tests/test_prob4d_visual_bias_stream_crossrepo.py; then
            exit 0
          fi
          remote_head="$(git ls-remote origin refs/heads/agent/prob4d-visual-bias-stream-binding | cut -f1)"
          test "${remote_head}" = "${REVIEWED_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayesian_phystwin/prob4d_visual_bias_stream.py \
            tests/test_prob4d_visual_bias_stream.py \
            tests/test_prob4d_visual_bias_stream_crossrepo.py
          git commit -m "Format and type-harden recursive visual-bias consumer"
          git push origin HEAD:agent/prob4d-visual-bias-stream-binding
