name: Temporary Deform360 self-hosted contract publisher

on:
  push:
    branches: [agent/deform360-calibration-self-hosted-gate]
    paths:
      - ".github/workflows/temporary-deform360-self-hosted-contract-publisher.yml"
      - "scripts/ci/temporary_patch_deform360_self_hosted_gate.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temporary-deform360-self-hosted-contract-publisher.yml"
      - "scripts/ci/temporary_patch_deform360_self_hosted_gate.py"
      - ".github/workflows/deform360-official-hub-calibration-source.yml"
      - "tests/test_deform360_calibration_source_workflow.py"
      - "docs/deform360_official_hub_calibration_source_v1.md"

permissions:
  contents: write

concurrency:
  group: temporary-deform360-self-hosted-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 45
    steps:
      - name: Check out the exact reviewed branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Apply the reviewed deterministic patch
        run: python3 scripts/ci/temporary_patch_deform360_self_hosted_gate.py

      - name: Create an isolated validation target site
        shell: bash
        run: |
          set -euo pipefail
          base_python="$(command -v python3.12 || command -v python3)"
          publisher_root="${RUNNER_TEMP}/deform360-self-hosted-publisher-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          publisher_site="${publisher_root}/site"
          rm -rf "${publisher_root}"
          mkdir -p "${publisher_site}"
          "${base_python}" -m pip install \
            --break-system-packages \
            --no-cache-dir \
            --target "${publisher_site}" \
            ".[dev,graph]" \
            "huggingface_hub>=0.24"
          {
            echo "PUBLISHER_BASE_PYTHON=${base_python}"
            echo "PUBLISHER_ROOT=${publisher_root}"
            echo "PUBLISHER_SITE=${publisher_site}"
            echo "PYTHONPATH=${GITHUB_WORKSPACE}/src:${publisher_site}${PYTHONPATH:+:${PYTHONPATH}}"
          } >> "${GITHUB_ENV}"

      - name: Validate and canonicalize the permanent files
        shell: bash
        run: |
          set -euo pipefail
          "${PUBLISHER_BASE_PYTHON}" -m pip check
          "${PUBLISHER_BASE_PYTHON}" -m ruff format \
            tests/test_deform360_calibration_source_workflow.py
          "${PUBLISHER_BASE_PYTHON}" -m ruff check \
            tests/test_deform360_calibration_source_workflow.py
          "${PUBLISHER_BASE_PYTHON}" -m ruff format --check \
            tests/test_deform360_calibration_source_workflow.py
          "${PUBLISHER_BASE_PYTHON}" -m pytest -q -p no:cacheprovider \
            tests/test_deform360_official_hub_calibration_source.py \
            tests/test_deform360_calibration_source_workflow.py \
            tests/test_deform360_visual_provider_freeze.py
          "${PUBLISHER_BASE_PYTHON}" -m compileall -q \
            scripts/science/deform360_calibration_source \
            scripts/science/run_deform360_official_hub_calibration_source.py
          git diff --check

      - name: Commit only the reviewed permanent files
        shell: bash
        env:
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/agent/deform360-calibration-self-hosted-gate | cut -f1)"
          test "${remote_head}" = "${REVIEWED_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/deform360-official-hub-calibration-source.yml \
            tests/test_deform360_calibration_source_workflow.py \
            docs/deform360_official_hub_calibration_source_v1.md
          git commit -m "Run Deform360 calibration contracts on workstation2"
          git push origin HEAD:agent/deform360-calibration-self-hosted-gate

      - name: Remove the publisher target site
        if: always()
        shell: bash
        run: |
          if [[ -n "${PUBLISHER_ROOT:-}" ]]; then
            rm -rf -- "${PUBLISHER_ROOT}"
          fi
