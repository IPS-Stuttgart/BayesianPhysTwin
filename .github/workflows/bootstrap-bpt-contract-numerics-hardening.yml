name: Bootstrap BPT contract and numerical hardening

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  publish-product-branch:
    if: github.head_ref == 'agent/bootstrap-bpt-contract-numerics-hardening-20260727'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PRODUCT_BRANCH: agent/harden-bpt-contract-numerics
    steps:
      - name: Check out current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply the reviewed product patch
        shell: bash
        run: |
          set -euo pipefail
          git switch -c "${PRODUCT_BRANCH}"
          python - <<'PY'
          import base64
          import gzip

          payload = ""
          source = gzip.decompress(base64.b64decode(payload)).decode("utf-8")
          exec(compile(source, "bpt-contract-numerics-patch.py", "exec"))
          PY

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Format and lint the intended files
        shell: bash
        run: |
          python -m ruff check --fix -- \
            src/bayesian_phystwin/observation_belief.py \
            src/bayesian_phystwin/grouped_likelihood.py \
            src/bayesian_phystwin/phystwin_bayesian_anchor.py \
            src/bayesian_phystwin/contracts/fixed_anchor.py \
            tests/test_observation_belief.py \
            tests/test_grouped_likelihood.py \
            tests/test_causal4d_provider_v1.py \
            tests/test_phystwin_bayesian_anchor.py
          python -m ruff format -- \
            src/bayesian_phystwin/observation_belief.py \
            src/bayesian_phystwin/grouped_likelihood.py \
            src/bayesian_phystwin/phystwin_bayesian_anchor.py \
            src/bayesian_phystwin/contracts/fixed_anchor.py \
            tests/test_observation_belief.py \
            tests/test_grouped_likelihood.py \
            tests/test_causal4d_provider_v1.py \
            tests/test_phystwin_bayesian_anchor.py
          python -m ruff check -- \
            src/bayesian_phystwin/observation_belief.py \
            src/bayesian_phystwin/grouped_likelihood.py \
            src/bayesian_phystwin/phystwin_bayesian_anchor.py \
            src/bayesian_phystwin/contracts/fixed_anchor.py \
            tests/test_observation_belief.py \
            tests/test_grouped_likelihood.py \
            tests/test_causal4d_provider_v1.py \
            tests/test_phystwin_bayesian_anchor.py

      - name: Run focused contract and numerical tests
        run: |
          python -m pytest -q \
            tests/test_observation_belief.py \
            tests/test_observation_belief_gauge_adapter.py \
            tests/test_grouped_likelihood.py \
            tests/test_phystwin_bayesian_anchor.py \
            tests/test_causal4d_provider_v1.py \
            tests/test_prob4d_joint_contract_fixture.py

      - name: Commit and run the exact quality ratchet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            CHANGELOG.md \
            docs/causal4d_belief_provider_v1.md \
            docs/observation_belief_contract.md \
            src/bayesian_phystwin/contracts/fixed_anchor.py \
            src/bayesian_phystwin/grouped_likelihood.py \
            src/bayesian_phystwin/observation_belief.py \
            src/bayesian_phystwin/phystwin_bayesian_anchor.py \
            tests/test_causal4d_provider_v1.py \
            tests/test_grouped_likelihood.py \
            tests/test_observation_belief.py \
            tests/test_phystwin_bayesian_anchor.py
          git diff --cached --check
          git commit -m "Harden immutable observation and covariance semantics"
          python tools/quality/changed_python_quality.py --base HEAD^ --head HEAD

      - name: Publish the clean product branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:refs/heads/${PRODUCT_BRANCH}"
          {
            echo "### Published product branch"
            echo
            echo "\`${PRODUCT_BRANCH}\`"
            echo
            echo "Commit: \`$(git rev-parse HEAD)\`"
          } >> "${GITHUB_STEP_SUMMARY}"
