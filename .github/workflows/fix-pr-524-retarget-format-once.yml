name: Format PR 524 retargeted Deform360 files once

on:
  push:
    branches:
      - agent/deform360-covariance-residual-history-dry-run-v1

permissions:
  contents: write

concurrency:
  group: fix-pr-524-retarget-format-once
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  format-and-verify:
    if: github.ref == 'refs/heads/agent/deform360-covariance-residual-history-dry-run-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact feature head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply canonical formatting and focused validation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1"
          python -m pip install -e ".[dev]"
          python -m pip check
          files=(
            scripts/science/acquire_deform360_covariance_target_v1.py
            scripts/science/build_deform360_covariance_target_v1.py
            tests/test_deform360_covariance_target_acquisition_v1.py
            tests/test_deform360_covariance_target_v1.py
          )
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m compileall -q "${files[@]}"
          python -m pytest -q -p no:cacheprovider \
            tests/test_deform360_covariance_target_acquisition_v1.py \
            tests/test_deform360_covariance_target_v1.py \
            tests/test_pull_request_workflow_integrity.py \
            tests/test_test_suite_manifest.py

      - name: Publish only the four formatted files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          helper=.github/workflows/fix-pr-524-retarget-format-once.yml
          rm -- "${helper}"
          git diff --check
          actual="$(git status --short | awk '{print $2}' | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            "${helper}" \
            scripts/science/acquire_deform360_covariance_target_v1.py \
            scripts/science/build_deform360_covariance_target_v1.py \
            tests/test_deform360_covariance_target_acquisition_v1.py \
            tests/test_deform360_covariance_target_v1.py \
            | LC_ALL=C sort)"
          test "${actual}" = "${expected}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- \
            "${helper}" \
            scripts/science/acquire_deform360_covariance_target_v1.py \
            scripts/science/build_deform360_covariance_target_v1.py \
            tests/test_deform360_covariance_target_acquisition_v1.py \
            tests/test_deform360_covariance_target_v1.py
          git commit -m "Format retained Deform360 target files"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" push \
            origin HEAD:refs/heads/agent/deform360-covariance-residual-history-dry-run-v1
