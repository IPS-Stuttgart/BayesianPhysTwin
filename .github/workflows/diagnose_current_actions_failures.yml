name: Diagnose current Actions failures

on:
  pull_request:
    paths:
      - .github/workflows/diagnose_current_actions_failures.yml

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect bridge source coverage ranges
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: 094fd579d7533272df6ca988b2022169e5aee03b
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ["REPOSITORY"]
          sha = os.environ["TARGET_SHA"]
          token = os.environ["GH_TOKEN"]
          path = "src/bayesian_phystwin/deform360_fresh_object_session_v6_prediction_bridge.py"
          url = (
              f"https://api.github.com/repos/{repo}/contents/{path}"
              f"?ref={urllib.parse.quote(sha, safe='')}"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "bayesian-phystwin-actions-diagnostic",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          text = base64.b64decode(payload["content"]).decode("utf-8")
          lines = text.splitlines()
          for index, line in enumerate(lines, start=1):
              if 105 <= index <= 535:
                  print(f"{index:04d}: {line}")
          PY
