name: Diagnose current Actions failures

on:
  pull_request:
    paths:
      - .github/workflows/diagnose_current_actions_failures.yml

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enumerate recent workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timedelta, timezone

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "bayesian-phystwin-actions-diagnostic",
          }

          def get(path):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}{path}", headers=headers
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          runs = get("/actions/runs?per_page=100")["workflow_runs"]
          cutoff = datetime.now(timezone.utc) - timedelta(hours=12)

          print("=== latest main run per workflow ===")
          latest_main = {}
          for run in runs:
              if run.get("head_branch") != "main":
                  continue
              latest_main.setdefault(run["workflow_id"], run)
          for run in sorted(latest_main.values(), key=lambda r: r["created_at"], reverse=True):
              print(
                  "MAIN\t{id}\t{name}\t{status}\t{conclusion}\t{event}\t{sha}\t{created}\t{url}".format(
                      id=run["id"],
                      name=run["name"],
                      status=run["status"],
                      conclusion=run.get("conclusion"),
                      event=run["event"],
                      sha=run["head_sha"],
                      created=run["created_at"],
                      url=run["html_url"],
                  )
              )

          print("=== recent unresolved failures by exact head/event/workflow ===")
          latest_exact = {}
          for run in runs:
              key = (run["workflow_id"], run["head_sha"], run["event"])
              latest_exact.setdefault(key, run)
          unresolved = []
          for run in latest_exact.values():
              created = datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))
              if created < cutoff or run.get("conclusion") != "failure":
                  continue
              unresolved.append(run)
          for run in sorted(unresolved, key=lambda r: r["created_at"], reverse=True):
              print(
                  "FAIL\t{id}\t{name}\t{branch}\t{event}\t{sha}\t{attempt}\t{created}\t{url}".format(
                      id=run["id"],
                      name=run["name"],
                      branch=run.get("head_branch"),
                      event=run["event"],
                      sha=run["head_sha"],
                      attempt=run.get("run_attempt"),
                      created=run["created_at"],
                      url=run["html_url"],
                  )
              )

          print("=== all recent failures (12h, newest first) ===")
          for run in runs:
              created = datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))
              if created < cutoff or run.get("conclusion") != "failure":
                  continue
              print(
                  "HISTFAIL\t{id}\t{name}\t{branch}\t{event}\t{sha}\t{attempt}\t{created}\t{url}".format(
                      id=run["id"],
                      name=run["name"],
                      branch=run.get("head_branch"),
                      event=run["event"],
                      sha=run["head_sha"],
                      attempt=run.get("run_attempt"),
                      created=run["created_at"],
                      url=run["html_url"],
                  )
              )
          PY
