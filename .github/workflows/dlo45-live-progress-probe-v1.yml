# workflow-lifecycle: temporary
# workflow-owner: IPS-Stuttgart maintainers
name: Promote completed Deform360 TCN evidence PR

on:
  push:
    branches:
      - ops/dlo45-live-progress-probe-v1
    paths:
      - .github/workflows/dlo45-live-progress-probe-v1.yml

permissions:
  contents: read
  pull-requests: write

jobs:
  ready:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mark validated PR 828 ready for review
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NODE_ID: PR_kwDOTTwils8AAAABBj4lhA
        shell: bash
        run: |
          set -euo pipefail
          payload="$(python - <<'PY'
          import json
          import os

          print(json.dumps({
              "query": (
                  "mutation($pullRequestId: ID!) { "
                  "markPullRequestReadyForReview(input: {pullRequestId: $pullRequestId}) { "
                  "pullRequest { number isDraft headRefOid } } }"
              ),
              "variables": {"pullRequestId": os.environ["PULL_REQUEST_NODE_ID"]},
          }))
          PY
          )"
          response="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-Github-Next-Global-ID: 1" \
            https://api.github.com/graphql \
            --data "$payload")"
          printf '%s\n' "$response"
          RESPONSE="$response" python - <<'PY'
          import json
          import os

          response = json.loads(os.environ["RESPONSE"])
          if response.get("errors"):
              raise SystemExit(response["errors"])
          pull = response["data"]["markPullRequestReadyForReview"]["pullRequest"]
          if pull["number"] != 828 or pull["isDraft"]:
              raise SystemExit(f"PR was not promoted: {pull}")
          if pull["headRefOid"] != "abf046c90985226abf405f46feda6d21da1895a9":
              raise SystemExit(f"PR head changed unexpectedly: {pull['headRefOid']}")
          PY
