# workflow-lifecycle: permanent
# workflow-owner: IPS-Stuttgart maintainers
# Review-branch helper; never part of the code merge.
name: Review experiment source snapshots
on:
  workflow_dispatch:
  push:
    branches: [maintenance/review-code-experiments-2026-09-07]
    paths: [.github/workflows/review-experiment-sources.yml]
permissions:
  contents: read
concurrency:
  group: review-experiment-sources-${{ github.ref }}
  cancel-in-progress: false
jobs:
  formatter:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Retain pinned formatter for offline review
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/review-tools"
          python3 -m pip download --only-binary=:all: --no-deps ruff==0.16.2 --dest "$RUNNER_TEMP/review-tools"
          cd "$RUNNER_TEMP/review-tools"
          sha256sum *.whl > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: code-review-formatter
          path: ${{ runner.temp }}/review-tools/
          if-no-files-found: error
          retention-days: 3
