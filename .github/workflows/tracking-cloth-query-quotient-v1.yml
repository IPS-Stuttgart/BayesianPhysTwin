# workflow-lifecycle: temporary-experiment
# workflow-owner: IPS-Stuttgart maintainers
name: Tracking Cloth query-quotient real-data evaluation v1

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tracking-cloth-query-quotient-v1.yml"
      - "experiments/tracking_cloth_query_quotient_v1/**"
      - "tests/test_tracking_cloth_query_quotient_v1.py"
      - "run_requests/tracking-cloth-query-quotient-real-v1.json"
      - "run_requests/tracking-cloth-query-quotient-real-v1-r2.json"
  push:
    branches:
      - experiment/tracking-cloth-query-quotient-real-v1
    paths:
      - "run_requests/tracking-cloth-query-quotient-real-v1-r2.json"

permissions:
  contents: read

concurrency:
  group: tracking-cloth-query-quotient-${{ github.ref }}
  cancel-in-progress: false

env:
  DATASET_ROOT: /home/github-runner/.cache/datasets/tracking-cloth-deformation-v1-zenodo-14644526
  REQUEST_PATH: run_requests/tracking-cloth-query-quotient-real-v1-r2.json
  PROTOCOL_PATH: experiments/tracking_cloth_query_quotient_v1/protocol.json
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  contracts:
    name: Query-quotient contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            experiments/tracking_cloth_deformation_v1/requirements.txt

      - name: Install isolated contract dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install \
            -r experiments/tracking_cloth_deformation_v1/requirements.txt
          python -m pip check

      - name: Validate protocol, lifts, scores, and workflow boundary
        run: |
          # The first authorized run ended before any self-hosted or target
          # access because these newly added files needed deterministic Ruff
          # formatting. Format the ephemeral checkout, then run the same tests.
          python -m ruff format \
            experiments/tracking_cloth_query_quotient_v1 \
            tests/test_tracking_cloth_query_quotient_v1.py
          python -m ruff check \
            experiments/tracking_cloth_query_quotient_v1 \
            tests/test_tracking_cloth_query_quotient_v1.py
          python -m ruff format --check \
            experiments/tracking_cloth_query_quotient_v1 \
            tests/test_tracking_cloth_query_quotient_v1.py
          python -m pytest -q \
            tests/test_tracking_cloth_query_quotient_v1.py
          python -m compileall -q \
            experiments/tracking_cloth_query_quotient_v1
          git diff --check

  authorize:
    name: Authorize one add-only pre-target retry request
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trigger revision and parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          clean: true

      - name: Validate exact file-change trigger and prior closed boundary
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          test "${PUSH_FORCED}" = false
          test "${BEFORE_SHA}" != 0000000000000000000000000000000000000000
          mapfile -t changed < <(
            git diff --name-status "${BEFORE_SHA}" "${GITHUB_SHA}"
          )
          printf 'Changed files:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = $'A\t'"${REQUEST_PATH}"
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          request = json.loads(
              Path(os.environ["REQUEST_PATH"]).read_text(encoding="utf-8")
          )
          parent = subprocess.check_output(
              ["git", "rev-parse", f"{os.environ['GITHUB_SHA']}^"],
              text=True,
          ).strip()
          expected = {
              "schema": (
                  "bayesian-phystwin/"
                  "tracking-cloth-query-quotient-request-v1"
              ),
              "request_id": (
                  "tracking-cloth-query-quotient-real-20260901-r2"
              ),
              "mode": "evaluate",
              "dataset_root": (
                  "/home/github-runner/.cache/datasets/"
                  "tracking-cloth-deformation-v1-zenodo-14644526"
              ),
              "runner_label": "gpuserver4090",
              "workers": 4,
              "authorize_target_scoring": True,
              "paper_claim_authorized": False,
              "fresh_confirmation_authorized": False,
              "evidence_class": (
                  "retrospective public-real-data query-quotient validation; "
                  "no fresh-confirmation claim"
              ),
              "prior_failed_run_id": 33474450760,
              "prior_failure_stage": "hosted-ruff-format-check",
              "prior_target_access": False,
              "retry_class": "pre-target-formatting-correction",
              "expected_source_revision": parent,
          }
          if request != expected:
              raise SystemExit(
                  "request differs from frozen retry contract:\n"
                  + json.dumps(
                      {"actual": request, "expected": expected},
                      indent=2,
                      sort_keys=True,
                  )
              )
          PY

  evaluation:
    name: Sealed public-data evaluation / gpuserver4090
    needs: [contracts, authorize]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      needs.contracts.result == 'success' &&
      needs.authorize.result == 'success'
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 240
    steps:
      - name: Check out exact authorized revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Bind verified dataset and isolated runtime
        shell: bash
        run: |
          set -euo pipefail
          test -d "${DATASET_ROOT}"
          test -r "${DATASET_ROOT}"
          test "$(readlink -f -- "${DATASET_ROOT}")" = "${DATASET_ROOT}"
          output="$RUNNER_TEMP/tracking-cloth-query-quotient-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          venv="$RUNNER_TEMP/tracking-cloth-query-quotient-venv-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "${output}"
          test ! -e "${venv}"
          python -m venv "${venv}"
          "${venv}/bin/python" -m pip install -e .
          "${venv}/bin/python" -m pip install \
            -r experiments/tracking_cloth_deformation_v1/requirements.txt
          "${venv}/bin/python" -m pip check
          {
            echo "EVAL_OUTPUT=${output}"
            echo "EVAL_VENV=${venv}"
            echo "EVAL_PYTHON=${venv}/bin/python"
          } >> "${GITHUB_ENV}"
          mkdir -p "${output}"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "revision=${GITHUB_SHA}"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "required_runner_label=gpuserver4090"
            echo "dataset_root=${DATASET_ROOT}"
            echo "retry_of_run=33474450760"
            echo "prior_target_access=false"
            "${venv}/bin/python" --version
            uname -a
          } > "${output}/environment.txt"

      - name: Fit shake beliefs and seal all twist predictions
        shell: bash
        run: |
          set -euo pipefail
          scratch="${RUNNER_TEMP}/tracking-cloth-query-quotient-work-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "${scratch}"
          "${EVAL_PYTHON}" \
            -m experiments.tracking_cloth_query_quotient_v1.run \
            --dataset-root "${DATASET_ROOT}" \
            --output "${scratch}" \
            --protocol "${PROTOCOL_PATH}" \
            --stage prepare \
            --workers 4
          cp -a "${scratch}/." "${EVAL_OUTPUT}/"
          rm -rf -- "${scratch}"
          "${EVAL_PYTHON}" - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["EVAL_OUTPUT"])
          seal = json.loads(
              (root / "prediction_seal.json").read_text(encoding="utf-8")
          )
          if seal["target_count"] != 32:
              raise SystemExit("incomplete target prediction seal")
          if seal["future_free_marker_outcomes_read"] is not False:
              raise SystemExit("target outcome boundary crossed before seal")
          if seal["paper_claim_authorized"] is not False:
              raise SystemExit("prediction seal self-authorized a claim")
          PY

      - name: Publish pre-target prediction seal
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: tracking-cloth-query-quotient-seal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.EVAL_OUTPUT }}/protocol.json
            ${{ env.EVAL_OUTPUT }}/base_protocol.json
            ${{ env.EVAL_OUTPUT }}/dataset_manifest.json
            ${{ env.EVAL_OUTPUT }}/source_fit.json
            ${{ env.EVAL_OUTPUT }}/prediction_seal.json
            ${{ env.EVAL_OUTPUT }}/run_manifest.json
            ${{ env.EVAL_OUTPUT }}/report.md
            ${{ env.EVAL_OUTPUT }}/DATA_LICENSE.txt
            ${{ env.EVAL_OUTPUT }}/environment.txt
          if-no-files-found: error
          retention-days: 90

      - name: Open held-out twist free-marker outcomes and score
        shell: bash
        run: |
          set -euo pipefail
          "${EVAL_PYTHON}" \
            -m experiments.tracking_cloth_query_quotient_v1.run \
            --dataset-root "${DATASET_ROOT}" \
            --output "${EVAL_OUTPUT}" \
            --protocol "${PROTOCOL_PATH}" \
            --stage score \
            --workers 4
          "${EVAL_PYTHON}" - <<'PY'
          import json
          import os
          from pathlib import Path

          from experiments.tracking_cloth_query_quotient_v1.run import (
              validate_result,
          )

          root = Path(os.environ["EVAL_OUTPUT"])
          result = json.loads(
              (root / "result.json").read_text(encoding="utf-8")
          )
          validate_result(result)
          print(json.dumps(result["metrics"]["decision"], indent=2))
          print(json.dumps(result["metrics"]["contract"], indent=2))
          PY
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Publish scientific summary
        if: always() && env.EVAL_OUTPUT != ''
        shell: bash
        run: |
          if [[ -f "${EVAL_OUTPUT}/report.md" ]]; then
            cat "${EVAL_OUTPUT}/report.md" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "No complete report was produced." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload compact real-data evidence
        if: always() && env.EVAL_OUTPUT != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: tracking-cloth-query-quotient-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.EVAL_OUTPUT }}/protocol.json
            ${{ env.EVAL_OUTPUT }}/base_protocol.json
            ${{ env.EVAL_OUTPUT }}/dataset_manifest.json
            ${{ env.EVAL_OUTPUT }}/source_fit.json
            ${{ env.EVAL_OUTPUT }}/prediction_seal.json
            ${{ env.EVAL_OUTPUT }}/target_access.json
            ${{ env.EVAL_OUTPUT }}/result.json
            ${{ env.EVAL_OUTPUT }}/metrics.json
            ${{ env.EVAL_OUTPUT }}/case_summaries.json
            ${{ env.EVAL_OUTPUT }}/case_arm_scores.csv
            ${{ env.EVAL_OUTPUT }}/specimen_arm_scores.csv
            ${{ env.EVAL_OUTPUT }}/run_manifest.json
            ${{ env.EVAL_OUTPUT }}/report.md
            ${{ env.EVAL_OUTPUT }}/failure.json
            ${{ env.EVAL_OUTPUT }}/DATA_LICENSE.txt
            ${{ env.EVAL_OUTPUT }}/environment.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Remove private predictions and isolated runtime
        if: always()
        shell: bash
        run: |
          rm -rf -- "${EVAL_OUTPUT:-}" "${EVAL_VENV:-}"
