# workflow-lifecycle: permanent
# workflow-owner: IPS-Stuttgart maintainers
name: Tracking Cloth cost-aware action feasibility V2

on:
  pull_request:
    paths:
      - ".github/workflows/tracking-cloth-action-feasibility-costed-v2.yml"
      - "experiments/tracking_cloth_action_feasibility_costed_v2/**"
      - "tests/test_tracking_cloth_action_feasibility_costed_v2.py"
      - "src/bayesian_phystwin/act_sense_fallback_certificate_v1.py"
      - "src/bayesian_phystwin/support_robust_act_sense_fallback_certificate_v1.py"
      - "experiments/tracking_cloth_action_feasibility_v1/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/tracking-cloth-action-feasibility-costed-v2.yml"
      - "experiments/tracking_cloth_action_feasibility_costed_v2/**"
      - "tests/test_tracking_cloth_action_feasibility_costed_v2.py"
      - "src/bayesian_phystwin/act_sense_fallback_certificate_v1.py"
      - "src/bayesian_phystwin/support_robust_act_sense_fallback_certificate_v1.py"
      - "experiments/tracking_cloth_action_feasibility_v1/**"

permissions:
  contents: read

concurrency:
  group: tracking-cloth-action-feasibility-costed-v2-${{ github.sha }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  contracts:
    name: Cost-aware support-robust source contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate V2 theorem bridge and source custody
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_tracking_cloth_action_feasibility_costed_v2.py \
            tests/test_support_robust_act_sense_fallback_certificate_v1.py \
            tests/test_tracking_cloth_action_feasibility_v1.py
          python -m ruff check \
            experiments/tracking_cloth_action_feasibility_costed_v2 \
            tests/test_tracking_cloth_action_feasibility_costed_v2.py
          python -m ruff format --check \
            experiments/tracking_cloth_action_feasibility_costed_v2 \
            tests/test_tracking_cloth_action_feasibility_costed_v2.py
          python -m py_compile \
            experiments/tracking_cloth_action_feasibility_costed_v2/_decision.py \
            experiments/tracking_cloth_action_feasibility_costed_v2/run.py

      - name: Verify source-only workflow policy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          protocol = json.loads(
              Path(
                  "experiments/tracking_cloth_action_feasibility_costed_v2/protocol.json"
              ).read_text(encoding="utf-8")
          )
          assert protocol["source_repetitions"] == [1, 2]
          assert protocol["reserved_target_repetition"] == 3
          boundary = protocol["information_boundary"]
          assert boundary["rep3_numeric_outcomes_read"] is False
          assert boundary["rep3_protocol_authorized"] is False
          workflow = Path(
              ".github/workflows/tracking-cloth-action-feasibility-costed-v2.yml"
          ).read_text(encoding="utf-8")
          source = workflow[workflow.index("\n  source_audit:") :]
          assert "if: github.event_name == 'push'" in source
          assert "[self-hosted, Linux, X64, gpuserver4090]" in source
          assert "--reserved-target" not in source
          assert "rep3" not in source.lower()
          assert "${{ secrets." not in workflow
          assert "contents: write" not in workflow
          assert "git push" not in workflow
          PY

  source_audit:
    name: Cost-aware source audit / gpuserver4090
    if: github.event_name == 'push'
    needs: contracts
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 60
    env:
      DATASET_ROOT: /home/github-runner/.cache/datasets/tracking-cloth-deformation-v1-zenodo-14644526
    steps:
      - name: Check out exact merged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Execute source-only costed support audit
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DATASET_ROOT"
          venv="$RUNNER_TEMP/tracking-action-v2-venv-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          output="$RUNNER_TEMP/tracking-action-v2-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$venv"
          test ! -e "$output"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install -e .
          "$venv/bin/python" -m \
            experiments.tracking_cloth_action_feasibility_costed_v2.run \
            --dataset-root "$DATASET_ROOT" \
            --output "$output"
          echo "ACTION_V2_OUTPUT=$output" >> "$GITHUB_ENV"
          echo "ACTION_V2_VENV=$venv" >> "$GITHUB_ENV"

      - name: Validate target closure and publish summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["ACTION_V2_OUTPUT"])
          result = json.loads((root / "result.json").read_text(encoding="utf-8"))
          assert result["rep3_numeric_outcomes_read"] is False
          assert result["rep3_protocol_authorized"] is False
          assert result["source_gate"]["automatic_target_follow_on"] is False
          print(json.dumps({
              "result_id": result["result_id"],
              "source_gate": result["source_gate"],
              "primary": result["decision_summary"][
                  "selected_primary_source_setting"
              ],
          }, indent=2, sort_keys=True))
          PY
          cat "$ACTION_V2_OUTPUT/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compact source evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: tracking-cloth-action-feasibility-costed-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.ACTION_V2_OUTPUT }}/result.json
            ${{ env.ACTION_V2_OUTPUT }}/source_cases.csv
            ${{ env.ACTION_V2_OUTPUT }}/SUMMARY.md
            ${{ env.ACTION_V2_OUTPUT }}/protocol.json
          if-no-files-found: warn
          retention-days: 90

      - name: Remove isolated source execution
        if: always()
        shell: bash
        run: |
          rm -rf \
            "${ACTION_V2_OUTPUT:-}" \
            "${ACTION_V2_VENV:-}" \
            "$RUNNER_TEMP/tracking-action-v2-venv-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
