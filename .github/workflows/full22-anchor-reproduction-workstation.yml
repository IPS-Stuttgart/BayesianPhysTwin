name: Frozen full-22 Bayesian anchor reproduction (workstation2)

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/full22-anchor-reproduction-workstation.yml"
      - "reproductions/full22_anchor_v1/**"
      - "tests/test_full22_reproduction_capsule.py"
      - "scripts/science/run_full22_endpoint_model_average_diagnostic.py"
      - "src/bayesian_phystwin/phystwin_data.py"
      - "src/bayesian_phystwin/run_manifest.py"
      - "src/bayesian_phystwin/cli/run_manifest.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full22-anchor-reproduction-workstation-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  FROZEN_SOURCE_REVISION: e393bb6ff61d44815afd8d09dfc5334cb55d5524
  SOURCE_PROTOCOL_ID: ee11310a84b92ff2158018a13ef09989e641e7c0ea84733fe8a6abf267093c65
  PORTABLE_PROTOCOL_ID: 5d31b04c464478d839ac3919ec04209b5ff22c75cf7fe8de54a6d189a4802872

jobs:
  reproduce:
    name: Self-hosted public-data reproduction
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 240
    steps:
      - name: Check out current capsule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Create isolated system-Python environment
        shell: bash
        run: |
          set -euo pipefail
          python_version="$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          if [[ "${python_version}" != "3.12" ]]; then
            echo "::error title=Unexpected system Python::Expected Python 3.12, found ${python_version}"
            exit 1
          fi
          venv="${RUNNER_TEMP}/bpt-full22-python-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "${venv}"
          python3 -m venv "${venv}"
          echo "${venv}/bin" >> "${GITHUB_PATH}"
          "${venv}/bin/python" -m pip install --upgrade pip
          "${venv}/bin/python" --version

      - name: Resolve isolated paths
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/bpt-full22-anchor-workstation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${root}/evidence"
          {
            echo "DATA_ROOT=${HOME}/.cache/bayesian-phystwin/trajectory-evaluation-v1"
            echo "FROZEN_SOURCE=${root}/frozen-source"
            echo "OUTPUT_ROOT=${root}/evidence"
          } >> "${GITHUB_ENV}"

      - name: Record runner and accelerator identities
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "evaluated_revision=${GITHUB_SHA}"
            echo "frozen_source_revision=${FROZEN_SOURCE_REVISION}"
            echo "source_protocol_id=${SOURCE_PROTOCOL_ID}"
            echo "portable_protocol_id=${PORTABLE_PROTOCOL_ID}"
            python --version
            uname -a
            lscpu
          } | tee "${OUTPUT_ROOT}/runner.txt"
          nvidia-smi -L | tee "${OUTPUT_ROOT}/nvidia-smi-L.txt"
          nvidia-smi \
            --query-gpu=index,name,uuid,driver_version,memory.total \
            --format=csv,noheader \
            | tee "${OUTPUT_ROOT}/nvidia-smi.csv"

      - name: Install locked evaluation dependencies
        run: |
          python -m pip install -e ".[dev,data]"
          python -m pip check
          python -m pip freeze --all > "${OUTPUT_ROOT}/pip-freeze.txt"

      - name: Verify capsule before data access
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check \
            reproductions/full22_anchor_v1/reproduce.py \
            tests/test_full22_reproduction_capsule.py
          python -m ruff format --check \
            reproductions/full22_anchor_v1/reproduce.py \
            tests/test_full22_reproduction_capsule.py
          python -m pytest -q tests/test_full22_reproduction_capsule.py

      - name: Create exact frozen source worktree
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "${FROZEN_SOURCE}" "${FROZEN_SOURCE_REVISION}"
          test "$(git -C "${FROZEN_SOURCE}" rev-parse HEAD)" = \
            "${FROZEN_SOURCE_REVISION}"
          test -z "$(git -C "${FROZEN_SOURCE}" status --porcelain=v1)"

      - name: Retrieve or verify the public trajectory subset
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from scripts.science.run_full22_endpoint_model_average_diagnostic import (
              _download_trajectory_subset,
          )

          manifest = _download_trajectory_subset(Path(os.environ["DATA_ROOT"]))
          source_manifest = Path(manifest["manifest_path"])
          compatibility_manifest = source_manifest.with_name(
              "evaluation_subset_manifest.json"
          )
          compatibility_manifest.write_bytes(source_manifest.read_bytes())
          print(
              json.dumps(
                  {
                      "compatibility_manifest": str(compatibility_manifest.resolve()),
                      "manifest_path": manifest["manifest_path"],
                      "manifest_sha256": manifest["manifest_sha256"],
                      "selected_case_count": len(manifest["selected_cases"]),
                  },
                  indent=2,
                  sort_keys=True,
              )
          )
          PY

      - name: Execute frozen full-22 reproduction
        shell: bash
        run: |
          set -euo pipefail
          python reproductions/full22_anchor_v1/reproduce.py \
            "${FROZEN_SOURCE}" \
            "${DATA_ROOT}" \
            "${OUTPUT_ROOT}/result" \
            --workers 8 \
            --force \
            | tee "${OUTPUT_ROOT}/console.txt"

      - name: Verify retained evidence and clean repository
        shell: bash
        run: |
          set -euo pipefail
          python -m bayesian_phystwin.cli.run_manifest validate \
            "${OUTPUT_ROOT}/result/run_manifest.json" \
            --artifact-root "${OUTPUT_ROOT}/result"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["OUTPUT_ROOT"]) / "result"
          verification = json.loads(
              (root / "verification.json").read_text(encoding="utf-8")
          )
          identity = json.loads(
              (root / "input" / "data_identity.json").read_text(encoding="utf-8")
          )
          method_lock = json.loads(
              (root / "method_lock.json").read_text(encoding="utf-8")
          )
          expected_source_protocol_id = os.environ["SOURCE_PROTOCOL_ID"]
          expected_portable_protocol_id = os.environ["PORTABLE_PROTOCOL_ID"]
          if verification["status"] != "verified":
              raise SystemExit("metric verification did not pass")
          if verification["check_count"] != 8:
              raise SystemExit("unexpected full-22 metric check count")
          if identity["identity_sha256"] != (
              "f67534421ee2f81ec823171427fb0ac66d3ac1762eb1f5b7624ddda92d057ffc"
          ):
              raise SystemExit("portable data identity changed")
          if method_lock["source_protocol_id"] != expected_source_protocol_id:
              raise SystemExit("historical source protocol identity changed")
          if method_lock["portable_protocol_id"] != expected_portable_protocol_id:
              raise SystemExit("portable protocol identity changed")
          if method_lock["runtime_protocol_id"] == expected_portable_protocol_id:
              raise SystemExit("raw path-bound protocol ID was not retained separately")
          summary = {
              "data_identity_sha256": identity["identity_sha256"],
              "metric_check_count": verification["check_count"],
              "portable_protocol_id": method_lock["portable_protocol_id"],
              "runtime_protocol_id": method_lock["runtime_protocol_id"],
              "source_protocol_id": method_lock["source_protocol_id"],
              "status": verification["status"],
          }
          (Path(os.environ["OUTPUT_ROOT"]) / "scientific-readout.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"

      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Frozen full-22 Bayesian anchor reproduction"
            echo
            echo "- Runner: \`${RUNNER_NAME}\`"
            echo "- Evaluated revision: \`${GITHUB_SHA}\`"
            echo "- Frozen source revision: \`${FROZEN_SOURCE_REVISION}\`"
            if [[ -f "${OUTPUT_ROOT}/scientific-readout.json" ]]; then
              echo "- Portable data identity: \`$(python -c 'import json,os; print(json.load(open(os.environ["OUTPUT_ROOT"] + "/scientific-readout.json"))["data_identity_sha256"])')\`"
              echo "- Portable protocol identity: \`$(python -c 'import json,os; print(json.load(open(os.environ["OUTPUT_ROOT"] + "/scientific-readout.json"))["portable_protocol_id"])')\`"
              echo "- Metric verification: \`verified (8/8)\`"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove frozen worktree
        if: always()
        shell: bash
        run: |
          git worktree remove --force "${FROZEN_SOURCE}" 2>/dev/null || true
          git worktree prune

      - name: Upload full-22 reproduction evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bpt-full22-anchor-reproduction-workstation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bpt-full22-anchor-workstation-${{ github.run_id }}-${{ github.run_attempt }}/evidence
          if-no-files-found: error
          retention-days: 90
