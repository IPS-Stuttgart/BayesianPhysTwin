name: Fix PR 127 formatting

on:
  push:
    branches:
      - agent/deform360-official-hub-visuotactile-v1
    paths:
      - .github/workflows/fix-pr127-format.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out writable branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/deform360-official-hub-visuotactile-v1
          persist-credentials: true
      - name: Apply Ruff formatter and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'ruff==0.16.1'
          python -m ruff format tests/test_deform360_hub_selection.py
          git rm .github/workflows/fix-pr127-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_deform360_hub_selection.py
          git diff --cached --check
          git commit -m 'Format Deform360 Stage-0 workflow policy test'
          git push origin HEAD:agent/deform360-official-hub-visuotactile-v1
