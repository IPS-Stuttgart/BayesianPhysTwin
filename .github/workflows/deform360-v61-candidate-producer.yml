# workflow-lifecycle: temporary
# workflow-owner: IPS-Stuttgart maintainers
# workflow-issue: #642
# workflow-expiry: 2026-09-30
name: Deform360 v6.1 candidate producer

on:
  workflow_dispatch:
    inputs:
      execute_authorized:
        description: Run the one protected source-prefix candidate production
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deform360-v61-candidate-producer-v1
  cancel-in-progress: false

env:
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  AUTHORIZED_RUNNER_NAME: workstation2
  RESULTS_ROOT: /mnt/lexar4tb/datasets/deform360/results
  UPSTREAM_RUN_ROOT: /mnt/lexar4tb/datasets/deform360/results/bayesian-phystwin/deform360-v6-source-camera-reuse/5cc43432eb509b98442d289ec884b30780ff26c76ab8654826d000bb4832e3b3
  CANDIDATE_AMENDMENT_PATH: protocols/amendments/deform360_official_hub_fresh_object_session_v6_candidate_producer.json
  CANDIDATE_AMENDMENT_ID: 593ca6c08ee5430ad37bc0cc5bb3d1b79d77a049714cb36a8c78696f3c68cfee
  CANDIDATE_AMENDMENT_FILE_SHA256: 6b5b5b99bea29c2927d52fb6ae52623f1d154a038932b6922900b709c30b10db
  EXECUTION_LOCK_PATH: protocols/locks/deform360_official_hub_joint_sparse_source_execution_v5.json
  EXECUTION_LOCK_ID: 76b74483790ace51d642889be2e3dbb22149e30f7919b5855a18066434e25189
  EXECUTION_LOCK_FILE_SHA256: 429a2c6e745a223ef5cae3c22ab991c09201121943624a9574036fec69b2c33a
  UPSTREAM_SOURCE_REVISION: 913909596b71ac6ad717835ce7a87ae01e42c5ab
  UPSTREAM_SOURCE_PLAN_ID: d9b9e4df9d020e8ae076f407f61d5e1f328c68d2f4fe4d8e4ad1688d2d253100
  UPSTREAM_SOURCE_PLAN_FILE_SHA256: 08863166df11033f4a968c94a4cb5bd02869175ce3bf1c1859c8ac49be371991
  UPSTREAM_PREDICTION_BATCH_ID: 5b1cdf3f047b52665650dcbf56d8ec205ced8788e2cdd0e528793a9ece9387f0
  UPSTREAM_PREDICTION_BATCH_FILE_SHA256: 5b40c7d0a71a841c937875a2fafc8d224d23204f367ab092f7f8ff92883bfd87
  UPSTREAM_PREDICTION_RECEIPT_ID: 04a5a8b71603b66850e35122405bc24c5de1e766c14cc2b58974f1ea97fb49ef
  UPSTREAM_PREDICTION_RECEIPT_FILE_SHA256: 584597aa3025444acd334fb50c8acee26abe0af44c4dee7537aa37be37155803
  UPSTREAM_EXECUTION_RECEIPT_ID: a408e44eaecf9e63311a2f1a6f511f130e586031e8a0e8e795d58fa5696e3026
  UPSTREAM_EXECUTION_RECEIPT_FILE_SHA256: 5f8e8668a056cd21dbe1bfb6bf17ae8fdba201861ca32677b99ba704758e8255

jobs:
  contracts:
    name: Candidate producer contracts / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out exact proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate the exact target-closed producer
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev,graph,vision]"
          files=(
            scripts/science/run_deform360_fresh_object_session_candidate_v6_1.py
            src/bayesian_phystwin/deform360_fresh_object_session_candidate_v6_1.py
            src/bayesian_phystwin/deform360_fresh_object_session_candidate_runner_v6_1.py
            src/bayesian_phystwin/deform360_fresh_object_session_public_inputs_v6_1.py
            tests/test_deform360_fresh_object_session_candidate_v6_1.py
            tests/test_deform360_fresh_object_session_candidate_runner_v6_1.py
            tests/test_deform360_v61_candidate_producer_workflow.py
            tests/test_deform360_joint_sparse_public_inputs_v5.py
          )
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m py_compile "${files[@]}"
          python -m mypy \
            scripts/science/run_deform360_fresh_object_session_candidate_v6_1.py \
            src/bayesian_phystwin/deform360_fresh_object_session_candidate_v6_1.py \
            src/bayesian_phystwin/deform360_fresh_object_session_candidate_runner_v6_1.py
          python -m mypy \
            src/bayesian_phystwin/deform360_fresh_object_session_public_inputs_v6_1.py
          bash -n scripts/ci/run_deform360_v61_candidate_producer.sh
          python -m pytest -q -p no:cacheprovider \
            tests/test_deform360_fresh_object_session_candidate_v6_1.py \
            tests/test_deform360_fresh_object_session_candidate_runner_v6_1.py \
            tests/test_deform360_fresh_object_session_source_v6_1.py \
            tests/test_deform360_v61_candidate_producer_workflow.py \
            tests/test_deform360_joint_sparse_public_inputs_v5.py \
            tests/test_pull_request_workflow_integrity.py
          test "$(sha256sum "${CANDIDATE_AMENDMENT_PATH}" | awk '{print $1}')" = \
            "${CANDIDATE_AMENDMENT_FILE_SHA256}"
          test "$(sha256sum "${EXECUTION_LOCK_PATH}" | awk '{print $1}')" = \
            "${EXECUTION_LOCK_FILE_SHA256}"
          python scripts/science/run_deform360_fresh_object_session_candidate_v6_1.py \
            validate-amendment --amendment "${CANDIDATE_AMENDMENT_PATH}"
          python tools/quality/check_workflow_policy.py \
            --base "${{ github.event.pull_request.base.sha || github.event.before }}" \
            --head "${GITHUB_SHA}"
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"

  execute:
    name: Seal source-prefix candidate panel / workstation2
    needs: contracts
    if: >-
      inputs.execute_authorized == true &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected == true &&
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin'
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Publish the closed information boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME}" = "${AUTHORIZED_RUNNER_NAME}"
          echo "public_real_world_dataset=true"
          echo "new_measurements_collected=false"
          echo "human_approval_used=false"
          echo "prob4d_pipeline_artifacts_reused=true"
          echo "prob4d_decoded_uniform_fusion_used=false"
          echo "motioncrafter_disjoint_baseline_used=true"
          echo "new_prob4d_inference_run=false"
          echo "new_motioncrafter_inference_run=false"
          echo "public_tactile_axis_identity_available=false"
          echo "source_suffix_opened=false"
          echo "confirmation_payloads_opened=false"
          echo "target_outcomes_used=false"
          echo "independent_confirmation_authorized=false"

      - name: Check out exact protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the exact reviewed producer
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[graph,vision]"
          python -m pip check
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1)"

      - name: Admit the exact sealed upstream and one empty output root
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME}" = "${AUTHORIZED_RUNNER_NAME}"
          results="$(realpath -e "${RESULTS_ROOT}")"
          upstream="$(realpath -e "${UPSTREAM_RUN_ROOT}")"
          compact="$(realpath -e "${UPSTREAM_RUN_ROOT}/compact")"
          panel="$(realpath -e "${UPSTREAM_RUN_ROOT}/prediction-panel")"
          test "${results}" = "${RESULTS_ROOT}"
          test "${upstream}" = "${UPSTREAM_RUN_ROOT}"
          case "${upstream}/" in "${results}/"*) ;; *) exit 2 ;; esac
          test "${compact}" = "${UPSTREAM_RUN_ROOT}/compact"
          test "${panel}" = "${UPSTREAM_RUN_ROOT}/prediction-panel"
          test -z "$(find "${compact}" "${panel}" -type l -print -quit)"
          test "$(sha256sum "${CANDIDATE_AMENDMENT_PATH}" | awk '{print $1}')" = \
            "${CANDIDATE_AMENDMENT_FILE_SHA256}"
          test "$(jq -r '.amendment_id' "${CANDIDATE_AMENDMENT_PATH}")" = \
            "${CANDIDATE_AMENDMENT_ID}"
          test "$(sha256sum "${EXECUTION_LOCK_PATH}" | awk '{print $1}')" = \
            "${EXECUTION_LOCK_FILE_SHA256}"
          test "$(jq -r '.execution_lock_id' "${EXECUTION_LOCK_PATH}")" = \
            "${EXECUTION_LOCK_ID}"
          test "$(sha256sum "${compact}/source-plan.json" | awk '{print $1}')" = \
            "${UPSTREAM_SOURCE_PLAN_FILE_SHA256}"
          test "$(jq -r '.plan_id' "${compact}/source-plan.json")" = \
            "${UPSTREAM_SOURCE_PLAN_ID}"
          test "$(jq -r '.implementation_revision' "${compact}/source-plan.json")" = \
            "${UPSTREAM_SOURCE_REVISION}"
          test "$(sha256sum "${compact}/source-prediction-batch.json" | awk '{print $1}')" = \
            "${UPSTREAM_PREDICTION_BATCH_FILE_SHA256}"
          test "$(jq -r '.prediction_batch_id' "${compact}/source-prediction-batch.json")" = \
            "${UPSTREAM_PREDICTION_BATCH_ID}"
          test "$(sha256sum "${compact}/source-prediction-receipt.json" | awk '{print $1}')" = \
            "${UPSTREAM_PREDICTION_RECEIPT_FILE_SHA256}"
          test "$(jq -r '.receipt_id' "${compact}/source-prediction-receipt.json")" = \
            "${UPSTREAM_PREDICTION_RECEIPT_ID}"
          test "$(sha256sum "${compact}/execution-receipt.json" | awk '{print $1}')" = \
            "${UPSTREAM_EXECUTION_RECEIPT_FILE_SHA256}"
          test "$(jq -r '.receipt_id' "${compact}/execution-receipt.json")" = \
            "${UPSTREAM_EXECUTION_RECEIPT_ID}"
          test "$(jq -r '.information_boundary.source_suffix_opened' "${compact}/execution-receipt.json")" = false
          output="${RESULTS_ROOT}/bayesian-phystwin/deform360-v61-candidate-producer/${CANDIDATE_AMENDMENT_ID}"
          test ! -e "${output}"
          test ! -e "${output}.claim"
          {
            echo "BPT_SOURCE_SHA=${GITHUB_SHA}"
            echo "RUN_ROOT=${output}"
            echo "RUN_CLAIM=${output}.claim"
            echo "UPSTREAM_COMPACT_ROOT=${compact}"
            echo "UPSTREAM_PREDICTION_PANEL_ROOT=${panel}"
          } >> "${GITHUB_ENV}"

      - name: Materialize and seal the source-prefix candidate panel
        id: execute
        shell: bash
        run: |
          set -uo pipefail
          set +e
          bash scripts/ci/run_deform360_v61_candidate_producer.sh \
            > "${RUNNER_TEMP}/deform360-v61-candidate-producer.log" 2>&1
          status=$?
          set -e
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Retain one bounded terminal receipt
        id: retain
        if: always() && steps.execute.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          claim="${RUN_CLAIM}"
          if [[ ! -f "${claim}" || -L "${claim}" ]]; then
            echo "candidate execution did not create its one-shot claim" >&2
            exit 0
          fi
          expected="$(printf 'workflow_run_id=%s\nworkflow_run_attempt=%s\nsource_revision=%s\n' \
            "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" "${GITHUB_SHA}")"
          if [[ "$(cat "${claim}")" != "${expected}" ]]; then
            echo "durable candidate root belongs to another run" >&2
            exit 0
          fi
          echo "owns_run=true" >> "${GITHUB_OUTPUT}"
          if [[ -e "${RUN_ROOT}" ]]; then
            test -d "${RUN_ROOT}"
            test ! -L "${RUN_ROOT}"
          else
            mkdir "${RUN_ROOT}"
          fi
          compact="${RUN_ROOT}/compact"
          if [[ -e "${compact}" ]]; then
            test -d "${compact}"
            test ! -L "${compact}"
          else
            mkdir "${compact}"
          fi
          logs="${compact}/logs"
          mkdir -p "${logs}"
          marker="${compact}/execution-started.txt"
          if [[ ! -e "${marker}" ]]; then
            install -m 600 "${claim}" "${marker}"
          fi
          test -f "${marker}"
          test ! -L "${marker}"
          test "$(cat "${marker}")" = "${expected}"
          log="${RUNNER_TEMP}/deform360-v61-candidate-producer.log"
          if [[ -f "${log}" && ! -L "${log}" ]]; then
            tail -c 64000 "${log}" > "${logs}/runner.log"
          fi
          receipt="${compact}/execution-receipt.json"
          status="${{ steps.execute.outputs.exit_code }}"
          status="${status:-1}"
          if [[ "${status}" != "0" && -f "${receipt}" ]]; then
            test ! -L "${receipt}"
            preterminal="${compact}/preterminal-execution-receipt.json"
            test ! -e "${preterminal}"
            mv "${receipt}" "${preterminal}"
          fi
          if [[ ! -f "${receipt}" ]]; then
            python scripts/science/run_deform360_fresh_object_session_candidate_v6_1.py \
              retain-failure \
              --candidate-revision "${GITHUB_SHA}" \
              --runner-name "${RUNNER_NAME}" \
              --workflow-run-id "${GITHUB_RUN_ID}" \
              --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
              --terminal-stage publish-candidate-panel \
              --exit-code "$(( status == 0 ? 1 : status ))" \
              --artifact-root "${compact}" \
              --output "${receipt}"
          fi
          rm -f "${compact}/SHA256SUMS"
          (
            cd "${compact}"
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
            sha256sum --check SHA256SUMS >/dev/null
          )

      - name: Verify compact evidence and the closed boundary
        if: always() && steps.retain.outputs.owns_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          compact="${RUN_ROOT}/compact"
          (cd "${compact}" && sha256sum --check SHA256SUMS >/dev/null)
          python scripts/science/run_deform360_fresh_object_session_candidate_v6_1.py \
            validate-execution --receipt "${compact}/execution-receipt.json"
          jq -e '
            .information_boundary.source_suffix_opened == false and
            .information_boundary.confirmation_payloads_opened == false and
            .information_boundary.v6_target_outcomes_used == false and
            .information_boundary.prob4d_pipeline_artifacts_reused == true and
            .information_boundary.prob4d_decoded_uniform_fusion_used == false and
            .information_boundary.motioncrafter_disjoint_baseline_used == true and
            .information_boundary.new_prob4d_inference_run == false and
            .information_boundary.new_motioncrafter_inference_run == false and
            .source_suffix_access_authorized == false and
            .independent_confirmation_authorized == false and
            .claim_authorized == false and
            (
              (
                .status == "candidate-prefix-panel-sealed" and
                .prediction_record_count == 100
              ) or
              (
                .status == "candidate-prefix-technical-failure-retained" and
                .exit_code > 0
              )
            )
          ' "${compact}/execution-receipt.json" >/dev/null
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1)"

      - name: Upload compact source-prefix evidence
        if: always() && steps.retain.outputs.owns_run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: deform360-v61-candidate-producer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RUN_ROOT }}/compact
          if-no-files-found: error
          retention-days: 180

      - name: Preserve the one-shot terminal decision
        if: always() && steps.execute.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          status="${{ steps.execute.outputs.exit_code }}"
          status="${status:-1}"
          test "${{ steps.retain.outputs.owns_run }}" = "true"
          test "${status}" = "0"

# No endpoint plan, suffix scorer, source gate, or confirmation command appears here.
