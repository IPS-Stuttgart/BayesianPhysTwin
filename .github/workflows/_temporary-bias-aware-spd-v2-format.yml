name: Temporary apply verified SPD v2 Ruff artifact

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - '.github/workflows/_temporary-bias-aware-spd-v2-format.yml'
      - 'src/bayesian_phystwin/bias_aware_belief_v2.py'
      - 'tests/test_bias_aware_belief_v2.py'
      - 'tests/test_bias_aware_belief_v2_adversarial.py'
      - 'tests/test_spd_system.py'

permissions:
  contents: write

jobs:
  apply-verified-formatting:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact same-repository PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Verify exact reviewed head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git branch --show-current)" = "${GITHUB_HEAD_REF}"

      - name: Reproduce and verify the formatter artifact
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'ruff==0.16.1'
          files=(
            src/bayesian_phystwin/bias_aware_belief_v2.py
            tests/test_bias_aware_belief_v2.py
            tests/test_bias_aware_belief_v2_adversarial.py
            tests/test_spd_system.py
          )
          python -m ruff check --fix --select I001 "${files[@]}"
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          git diff --check
          git diff --binary -- "${files[@]}" > /tmp/bias-aware-spd-v2-ruff.patch

          cat <<'EOF' | sha256sum -c -
          1fc2d51bc5f382a91e76e9b624ee90ff50096ccc9ddb9a9888649bcf0fb66dd9  /tmp/bias-aware-spd-v2-ruff.patch
          20a640af59e0ddb0b6fd94af2a1bc2a8045d80c41556a21c0396af9f5bea0961  src/bayesian_phystwin/bias_aware_belief_v2.py
          908454f0b70ed97c7b2a5b36c172337674661a676b6b0025333bf670d8600b07  tests/test_bias_aware_belief_v2.py
          aee24e6d3f6bcdc6d5bc8e2d98ca29042a646102b8fe60ce6bb3a02db19fd898  tests/test_bias_aware_belief_v2_adversarial.py
          b8b8797c6d3b77f792cb14bb8f616763fc0ca97cac060180543afa91db75c24f  tests/test_spd_system.py
          EOF

          printf '%s\n' "${files[@]}" | sort > /tmp/expected-files
          git diff --name-only | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files

      - name: Commit only the verified generated files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/bayesian_phystwin/bias_aware_belief_v2.py
            tests/test_bias_aware_belief_v2.py
            tests/test_bias_aware_belief_v2_adversarial.py
            tests/test_spd_system.py
          )
          git add -- "${files[@]}"
          git diff --cached --check
          git diff --quiet
          printf '%s\n' "${files[@]}" | sort > /tmp/expected-staged-files
          git diff --cached --name-only | sort > /tmp/actual-staged-files
          diff -u /tmp/expected-staged-files /tmp/actual-staged-files
          if git diff --cached --quiet; then
            echo 'Verified artifact unexpectedly produced no formatting changes.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply deterministic Ruff formatting to SPD v2'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
