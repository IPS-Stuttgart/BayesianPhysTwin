name: Temporary bias-aware SPD v2 formatting artifact

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_temporary-bias-aware-spd-v2-format.yml'
      - 'src/bayesian_phystwin/bias_aware_belief_v2.py'
      - 'tests/test_bias_aware_belief_v2.py'
      - 'tests/test_bias_aware_belief_v2_adversarial.py'
      - 'tests/test_spd_system.py'

permissions:
  contents: read

jobs:
  format-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Produce deterministic Ruff output
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'ruff>=0.6'
          files=(
            src/bayesian_phystwin/bias_aware_belief_v2.py
            tests/test_bias_aware_belief_v2.py
            tests/test_bias_aware_belief_v2_adversarial.py
            tests/test_spd_system.py
          )
          python -m ruff check --fix --select I001 "${files[@]}"
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          git diff --check
          git diff --binary > bias-aware-spd-v2-ruff.patch

      - name: Upload formatted files and patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: bias-aware-spd-v2-ruff-output
          path: |
            bias-aware-spd-v2-ruff.patch
            src/bayesian_phystwin/bias_aware_belief_v2.py
            tests/test_bias_aware_belief_v2.py
            tests/test_bias_aware_belief_v2_adversarial.py
            tests/test_spd_system.py
          if-no-files-found: error
          retention-days: 1
