name: Apply prospective belief formatting

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/apply-prospective-belief-formatting.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-prospective-belief-formatting
  cancel-in-progress: true

jobs:
  format:
    if: github.head_ref == 'agent/prospective-belief-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/prospective-belief-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Apply and verify Ruff fixes
        run: |
          python -m ruff check --fix -- \
            src/bayesian_phystwin/endpoint_model_average.py \
            src/bayesian_phystwin/parameter_posterior.py \
            src/bayesian_phystwin/structured_reliability.py \
            tests/test_prospective_prob4d_update.py \
            tests/test_release_metadata.py
          python -m ruff check -- \
            src/bayesian_phystwin/endpoint_model_average.py \
            src/bayesian_phystwin/parameter_posterior.py \
            src/bayesian_phystwin/structured_reliability.py \
            tests/test_prospective_prob4d_update.py \
            tests/test_release_metadata.py
      - name: Publish source-only formatting commit
        run: |
          set -euo pipefail
          git config user.name "OpenAI"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayesian_phystwin/endpoint_model_average.py \
            src/bayesian_phystwin/parameter_posterior.py \
            src/bayesian_phystwin/structured_reliability.py \
            tests/test_prospective_prob4d_update.py \
            tests/test_release_metadata.py
          if git diff --cached --quiet; then
            echo "Ruff produced no changes"
            exit 0
          fi
          git commit -m "Apply prospective belief quality formatting"
          git push origin HEAD:agent/prospective-belief-hardening
