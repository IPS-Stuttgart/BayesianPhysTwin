name: Exact observed-information covariance

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/observed-information-covariance.yml"
      - "src/bayesian_phystwin/observed_information_covariance.py"
      - "tests/test_observed_information_covariance.py"
      - "docs/observed_information_covariance.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observed-information-covariance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Exact mixture curvature, covariance parity, and fail-closed tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the NumPy-only development environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Check focused source quality
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check \
            src/bayesian_phystwin/observed_information_covariance.py \
            tests/test_observed_information_covariance.py
          python -m ruff format --check \
            src/bayesian_phystwin/observed_information_covariance.py \
            tests/test_observed_information_covariance.py
          python -m mypy \
            src/bayesian_phystwin/observed_information_covariance.py

      - name: Run focused and adjacent uncertainty contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -p no:cacheprovider \
            tests/test_observed_information_covariance.py \
            tests/test_prior_aware_and_linearization.py \
            tests/test_prior_aware_likelihood_conformance.py \
            tests/test_group_sandwich_covariance.py
          python -m py_compile \
            src/bayesian_phystwin/observed_information_covariance.py \
            tests/test_observed_information_covariance.py

      - name: Verify the checkout remained read-only
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
