name: Deform360 metadata-only preflight

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deform360-metadata-preflight.yml"
      - "protocols/deform360_metadata_preflight_v1.json"
      - "scripts/science/build_deform360_metadata_inventory.py"
      - "tests/test_deform360_metadata_inventory.py"
      - "docs/deform360_metadata_preflight.md"
      - "configs/sota/deform360_bias_aware_guarded_belief_prospective_v1.json"
      - "configs/sota/deform360_bias_aware_guarded_belief_prospective_v2.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deform360-metadata-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEFORM360_ROOT: /home/github-runner/.cache/datasets/deform360
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  inventory:
    name: Target-blind names-only cache inventory
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 60
    steps:
      - name: Check out BayesianPhysTwin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Record runner and mounted-root identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deform360-metadata-preflight
          test -d "${DEFORM360_ROOT}"
          resolved_root="$(readlink -f "${DEFORM360_ROOT}")"
          echo "DEFORM360_ROOT=${resolved_root}" >> "${GITHUB_ENV}"
          {
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "revision=${GITHUB_SHA}"
            echo "dataset_root=${resolved_root}"
            uname -a
            python --version
          } | tee deform360-metadata-preflight/environment.txt
          nvidia-smi --query-gpu=name,uuid,driver_version,memory.total \
            --format=csv,noheader \
            | tee deform360-metadata-preflight/gpus.csv

      - name: Build names-only inventory
        shell: bash
        run: |
          set -euo pipefail
          python scripts/science/build_deform360_metadata_inventory.py \
            --data-root "${DEFORM360_ROOT}" \
            --repository . \
            --protocol protocols/deform360_metadata_preflight_v1.json \
            --output deform360-metadata-preflight/inventory.json \
            | tee deform360-metadata-preflight/inventory.log

      - name: Verify tracked tree remained clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git status --porcelain=v1 --untracked-files=no \
            | tee deform360-metadata-preflight/git-status.txt
          test ! -s deform360-metadata-preflight/git-status.txt

      - name: Publish metadata-only summary
        if: always()
        shell: bash
        run: |
          if [[ -f deform360-metadata-preflight/inventory.json ]]; then
            python - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json
          from pathlib import Path

          payload = json.loads(
              Path("deform360-metadata-preflight/inventory.json").read_text(
                  encoding="utf-8"
              )
          )
          print("### Deform360 metadata-only preflight")
          print()
          print(f"- Inventory SHA-256: `{payload['inventory_sha256']}`")
          print(f"- Recognized objects: `{payload['recognized_object_count']}`")
          print(f"- Classification counts: `{payload['classification_counts']}`")
          print(
              "- Reserved targets present by name: "
              f"`{payload['reserved_target_objects_present_by_name']}`"
          )
          print("- Dataset payloads opened: `false`")
          print("- Reserved target outcomes opened: `false`")
          PY
          else
            echo "### Deform360 metadata-only preflight" \
              >> "${GITHUB_STEP_SUMMARY}"
            echo >> "${GITHUB_STEP_SUMMARY}"
            echo "No inventory artifact was produced." \
              >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload metadata-only evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deform360-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: deform360-metadata-preflight
          if-no-files-found: error
          retention-days: 30
