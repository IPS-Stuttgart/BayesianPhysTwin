name: Deform360 runner-local bootstrap contracts

on:
  workflow_call:
    inputs:
      source_sha:
        description: Caller-declared reviewed revision, verified after event-bound checkout.
        required: true
        type: string

permissions:
  contents: read

env:
  RUNTIME_LOCK: requirements/locks/deform360-runner-local-science-py312.txt
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  contracts:
    name: Hosted bootstrap contracts / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out event-bound proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
          clean: true

      - name: Verify event and caller source identities
        env:
          DECLARED_SOURCE_SHA: ${{ inputs.source_sha }}
          EVENT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EVENT_SOURCE_SHA}"
          test "${DECLARED_SOURCE_SHA}" = "${EVENT_SOURCE_SHA}"
          test -z "$(git status --porcelain=v1)"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/locks/deform360-runner-local-science-py312.txt

      - name: Install the locked contract runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1"
          python -m pip install \
            --constraint "${RUNTIME_LOCK}" \
            --no-build-isolation \
            -e ".[dev,graph]"
          python -m pip check
          site="$(python - <<'PY'
          import sysconfig
          print(sysconfig.get_paths()["purelib"])
          PY
          )"
          python scripts/ci/verify_deform360_runtime_lock.py \
            --lock "${RUNTIME_LOCK}" \
            --site "${site}" \
            --allow-local bayesian-phystwin \
            --output "${RUNNER_TEMP}/deform360-contract-runtime.json"

      - name: Validate data-free workflow implementation
        shell: bash
        run: |
          set -euo pipefail
          files=(
            scripts/ci/check_deform360_runner_capacity.py
            scripts/ci/stage_deform360_local_calibration_cache.py
            scripts/ci/verify_deform360_runtime_lock.py
            tests/test_deform360_runner_capacity.py
            tests/test_deform360_runner_local_checkout_boundary.py
            tests/test_deform360_runtime_lock.py
            tests/test_stage_deform360_local_calibration_cache.py
            tests/test_deform360_runner_local_science_workflow.py
          )
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy \
            scripts/ci/check_deform360_runner_capacity.py \
            scripts/ci/verify_deform360_runtime_lock.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_deform360_runner_capacity.py \
            tests/test_deform360_runner_local_checkout_boundary.py \
            tests/test_deform360_runtime_lock.py \
            tests/test_stage_deform360_local_calibration_cache.py \
            tests/test_deform360_runner_local_science_workflow.py \
            tests/test_pull_request_workflow_integrity.py
          python -m compileall -q \
            scripts/ci/check_deform360_runner_capacity.py \
            scripts/ci/stage_deform360_local_calibration_cache.py \
            scripts/ci/verify_deform360_runtime_lock.py
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"
