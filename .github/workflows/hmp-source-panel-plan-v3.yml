name: HMP source panel plan v3

on:
  push:
    branches: [science/hierarchical-missing-physics-diagnosis-v1]
    paths:
      - protocols/execution_requests/hmp_source_panel_plan_v3.json

permissions:
  contents: write

concurrency:
  group: hmp-source-panel-plan-v3
  cancel-in-progress: false

jobs:
  plan:
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned numerical dependency
        run: python -m pip install --disable-pip-version-check --no-input numpy==2.2.6
      - name: Execute source-only panel plan
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/hmp-source-panel-plan-v3"
          python scripts/science/run_hierarchical_source_panel_plan_v3.py \
            --request protocols/execution_requests/hmp_source_panel_plan_v3.json \
            --census evidence/hierarchical_missing_physics/runtime_census_gpuserver4090_v1/result.json \
            --receipt evidence/hierarchical_missing_physics/runtime_census_gpuserver4090_v1/receipt.json \
            --output-dir "$RUNNER_TEMP/hmp-source-panel-plan-v3"
          cat "$RUNNER_TEMP/hmp-source-panel-plan-v3/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain plan and receipt
        run: |
          set -euo pipefail
          target=evidence/hierarchical_missing_physics/source_panel_plan_v1
          rm -rf "$target"
          mkdir -p "$(dirname "$target")"
          cp -a "$RUNNER_TEMP/hmp-source-panel-plan-v3" "$target"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$target"
          git commit -m "Record DLO2/DLO3 hierarchical panel plan"
          git push origin HEAD:science/hierarchical-missing-physics-diagnosis-v1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: hmp-source-panel-plan-v3-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hmp-source-panel-plan-v3
          if-no-files-found: error
          retention-days: 90
