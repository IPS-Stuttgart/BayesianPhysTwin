name: Diagnose bias-aware Ruff import ordering

on:
  push:
    branches: [fix/bias-aware-ruff-imports-v2]

permissions:
  contents: read

concurrency:
  group: diagnose-bias-aware-ruff-imports-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Print Ruff's exact import autofix
        run: |
          set -euo pipefail
          python -m pip install "ruff==0.16.2"
          python -m ruff check --select I --fix \
            src/bayesian_phystwin/bias_aware_input_contract.py \
            tests/test_bias_aware_belief_v2_input_contracts.py
          git diff -- \
            src/bayesian_phystwin/bias_aware_input_contract.py \
            tests/test_bias_aware_belief_v2_input_contracts.py
          git diff --check
