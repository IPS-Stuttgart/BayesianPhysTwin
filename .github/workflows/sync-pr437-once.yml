name: Sync PR 437 once

on:
  push:
    branches:
      - agent/reduce-manifest-workflow-fanout
    paths:
      - .github/workflows/sync-pr437-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/reduce-manifest-workflow-fanout
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Merge current main and validate the policy patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          rm .github/workflows/sync-pr437-once.yml
          git add -A
          git commit -m "Sync manifest fan-out policy with current main"

          python -m pip install -e ".[dev]"
          python -m ruff check \
            tests/test_deform360_source_support_failure_evidence_v1.py \
            tests/test_pull_request_workflow_integrity.py
          python -m ruff format --check \
            tests/test_deform360_source_support_failure_evidence_v1.py \
            tests/test_pull_request_workflow_integrity.py
          python -m pytest -q \
            tests/test_deform360_source_support_failure_evidence_v1.py \
            tests/test_pull_request_workflow_integrity.py \
            tests/test_deform360_prob4d_distribution_manifest.py \
            tests/test_evidence_decision_packaging.py
          git diff --check
          git push origin HEAD:agent/reduce-manifest-workflow-fanout
