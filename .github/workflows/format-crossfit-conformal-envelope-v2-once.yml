# workflow-lifecycle: temporary
# workflow-owner: IPS-Stuttgart maintainers
# workflow-expiry: 2026-09-15
name: Format crossfit conformal envelope v2 once

on:
  push:
    branches:
      - science/crossfit-conformal-regret-envelope-v2
    paths:
      - ".github/workflows/format-crossfit-conformal-envelope-v2-once.yml"

permissions:
  contents: write

concurrency:
  group: format-crossfit-conformal-envelope-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          clean: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Apply deterministic source fix and formatter
        shell: bash
        run: |
          set -euo pipefail
          path="experiments/deform_dlo45_decision_identifiability_v1/support_envelope_crossfit.py"
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "experiments/deform_dlo45_decision_identifiability_v1/"
              "support_envelope_crossfit.py"
          )
          source = path.read_text()
          source = source.replace("import math\n", "")
          source = source.replace('.encode("utf-8")', ".encode()")
          path.write_text(source)
          PY
          python -m pip install "ruff==0.16.5"
          python -m ruff check --fix "${path}"
          python -m ruff format "${path}"
          python -m ruff check "${path}"
          python -m ruff format --check "${path}"
      - name: Commit exact formatted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/deform_dlo45_decision_identifiability_v1/support_envelope_crossfit.py
          if git diff --cached --quiet; then
            echo "Source already formatted."
          else
            git commit -m "Format cross-fitted conformal envelope source"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
