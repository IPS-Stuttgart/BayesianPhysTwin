# workflow-lifecycle: permanent
# workflow-owner: IPS-Stuttgart maintainers
name: Support-robust act-sense-fallback certificate v1

on:
  push:
    branches: [science/support-robust-act-sense-fallback-v1]
    paths:
      - ".github/workflows/support-robust-act-sense-fallback-v1.yml"
      - "src/bayesian_phystwin/act_sense_fallback_certificate_v1.py"
      - "src/bayesian_phystwin/query_decision_certificate_v1.py"
      - "src/bayesian_phystwin/support_robust_act_sense_fallback_certificate_v1.py"
      - "experiments/support_robust_act_sense_fallback_v1/**"
      - "tests/test_deform_dlo_act_sense_fallback_certificate_v1.py"
      - "tests/test_support_robust_act_sense_fallback_certificate_v1.py"
      - "tests/test_support_robust_act_sense_fallback_mechanism_v1.py"
  pull_request:
    paths:
      - ".github/workflows/support-robust-act-sense-fallback-v1.yml"
      - "src/bayesian_phystwin/act_sense_fallback_certificate_v1.py"
      - "src/bayesian_phystwin/query_decision_certificate_v1.py"
      - "src/bayesian_phystwin/support_robust_act_sense_fallback_certificate_v1.py"
      - "experiments/support_robust_act_sense_fallback_v1/**"
      - "tests/test_deform_dlo_act_sense_fallback_certificate_v1.py"
      - "tests/test_support_robust_act_sense_fallback_certificate_v1.py"
      - "tests/test_support_robust_act_sense_fallback_mechanism_v1.py"

permissions:
  contents: read

concurrency:
  group: support-robust-act-sense-fallback-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install focused dependencies
        run: python -m pip install numpy==1.26.4 pytest ruff==0.14.14
      - name: Validate exact and support-robust certificates
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_deform_dlo_act_sense_fallback_certificate_v1.py \
            tests/test_support_robust_act_sense_fallback_certificate_v1.py \
            tests/test_support_robust_act_sense_fallback_mechanism_v1.py
          python -m experiments.support_robust_act_sense_fallback_v1.run --check
          python -m py_compile \
            src/bayesian_phystwin/support_robust_act_sense_fallback_certificate_v1.py \
            experiments/support_robust_act_sense_fallback_v1/run.py
          python -m ruff check \
            src/bayesian_phystwin/support_robust_act_sense_fallback_certificate_v1.py \
            experiments/support_robust_act_sense_fallback_v1/run.py \
            tests/test_support_robust_act_sense_fallback_certificate_v1.py \
            tests/test_support_robust_act_sense_fallback_mechanism_v1.py
          python -m ruff format --check \
            src/bayesian_phystwin/support_robust_act_sense_fallback_certificate_v1.py \
            experiments/support_robust_act_sense_fallback_v1/run.py \
            tests/test_support_robust_act_sense_fallback_certificate_v1.py \
            tests/test_support_robust_act_sense_fallback_mechanism_v1.py
