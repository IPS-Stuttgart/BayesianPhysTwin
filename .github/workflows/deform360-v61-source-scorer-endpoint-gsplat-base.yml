# workflow-lifecycle: temporary
# workflow-owner: IPS-Stuttgart maintainers
# workflow-issue: #645
# workflow-expiry: 2026-09-30
name: Deform360 v6.1 public-source scorer endpoint gsplat base repair

on:
  workflow_dispatch:
    inputs:
      execute_authorized:
        description: Run the one protected public-source suffix scorer
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deform360-v61-source-scorer-endpoint-gsplat-base-v1
  cancel-in-progress: false

