  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PYOPENGL_PLATFORM: egl
  TORCH_CUDA_ARCH_LIST: "8.9"
  AUTHORIZED_RUNNER_NAME: workstation2
  RESULTS_ROOT: /mnt/lexar4tb/datasets/deform360/results
  ALIGNED_ROOT: /mnt/lexar4tb/datasets/deform360_official_hub_visuotactile_v1/calibration-processed/aligned
  CANDIDATE_RUN_ROOT: /mnt/lexar4tb/datasets/deform360/results/bayesian-phystwin/deform360-v61-candidate-producer/593ca6c08ee5430ad37bc0cc5bb3d1b79d77a049714cb36a8c78696f3c68cfee
  SOURCE_SCORING_AMENDMENT_PATH: protocols/amendments/deform360_official_hub_fresh_object_session_v6_1_source_scoring.json
