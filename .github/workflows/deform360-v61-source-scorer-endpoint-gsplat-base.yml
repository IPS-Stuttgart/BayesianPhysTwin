jobs:
  contracts:
    name: Source scorer contracts / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out exact proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate the exact target-closed scorer
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev,graph,vision]"
          files=(
            scripts/remote/process_deform360_fresh_object_session_source_endpoint_v6_1.py
            scripts/science/run_deform360_fresh_object_session_source_scorer_v6_1.py
            src/bayesian_phystwin/deform360_fresh_object_session_source_scorer_v6_1.py
            tests/test_deform360_fresh_object_session_source_scorer_v6_1.py
            tests/test_deform360_v61_source_scorer_workflow.py
          )
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m py_compile "${files[@]}"
          python -m mypy \
            scripts/science/run_deform360_fresh_object_session_source_scorer_v6_1.py \
            src/bayesian_phystwin/deform360_fresh_object_session_source_scorer_v6_1.py
          bash -n scripts/ci/run_deform360_v61_source_scorer.sh
          python -m pytest -q -p no:cacheprovider \
            tests/test_deform360_fresh_object_session_source_scorer_v6_1.py \
            tests/test_deform360_fresh_object_session_source_v6.py \
            tests/test_deform360_fresh_object_session_source_v6_1.py \
            tests/test_deform360_v61_source_scorer_workflow.py \
            tests/test_pull_request_workflow_integrity.py
          test "$(sha256sum "${SOURCE_SCORING_AMENDMENT_PATH}" | awk '{print $1}')" = \
            "${SOURCE_SCORING_AMENDMENT_FILE_SHA256}"
          test "$(sha256sum "${EXECUTION_LOCK_PATH}" | awk '{print $1}')" = \
            "${EXECUTION_LOCK_FILE_SHA256}"
          test "$(sha256sum "${CUDA_RUNTIME_LOCK_PATH}" | awk '{print $1}')" = \
            "${CUDA_RUNTIME_LOCK_SHA256}"
          test "$(sha256sum "${CUDNN_SUPPLY_REPAIR_PATH}" | awk '{print $1}')" = \
            "${CUDNN_SUPPLY_REPAIR_FILE_SHA256}"
          test "$(jq -r '.repair_id' "${CUDNN_SUPPLY_REPAIR_PATH}")" = \
            "${CUDNN_SUPPLY_REPAIR_ID}"
          test "$(sha256sum "${GSPLAT_ATTESTATION_REPAIR_PATH}" | awk '{print $1}')" = \
            "${GSPLAT_ATTESTATION_REPAIR_FILE_SHA256}"
          test "$(jq -r '.repair_id' "${GSPLAT_ATTESTATION_REPAIR_PATH}")" = \
            "${GSPLAT_ATTESTATION_REPAIR_ID}"
          test "$(sha256sum "${ENDPOINT_GSPLAT_BASE_REPAIR_PATH}" | awk '{print $1}')" = \
            "${ENDPOINT_GSPLAT_BASE_REPAIR_FILE_SHA256}"
          test "$(jq -r '.repair_id' "${ENDPOINT_GSPLAT_BASE_REPAIR_PATH}")" = \
            "${ENDPOINT_GSPLAT_BASE_REPAIR_ID}"
          test "$(sha256sum scripts/remote/process_deform360_fresh_object_session_source_endpoint_v6_1.py | awk '{print $1}')" = \
            "${ENDPOINT_PROCESSOR_SHA256}"
          python scripts/science/run_deform360_fresh_object_session_source_scorer_v6_1.py \
            validate-amendment \
            --scoring-amendment "${SOURCE_SCORING_AMENDMENT_PATH}" >/dev/null
          python tools/quality/check_workflow_policy.py \
            --base "${{ github.event.pull_request.base.sha || github.event.before }}" \
            --head "${GITHUB_SHA}"
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"

  execute:
    name: Score public source panel / workstation2
    needs: contracts
    if: >-
      inputs.execute_authorized == true &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected == true &&
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin'
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 1440
    permissions:
      contents: read
    steps:
      - name: Publish the closed information boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME}" = "${AUTHORIZED_RUNNER_NAME}"
          echo "public_real_world_dataset=true"
          echo "new_measurements_collected=false"
          echo "human_approval_required=false"
          echo "source_suffix_opened=false"
          echo "confirmation_payloads_opened=false"
          echo "target_outcomes_opened=false"
          echo "held_v8_artifacts_accessed=false"
          echo "prob4d_decoded_uniform_fusion_used=false"
          echo "motioncrafter_disjoint_baseline_used=true"
          echo "independent_confirmation_authorized=false"

      - name: Check out exact protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Check out frozen Deform360 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lhy0807/deform360
          ref: ${{ env.DEFORM360_REVISION }}
          path: _deform360
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Check out frozen SAM2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: facebookresearch/sam2
          ref: ${{ env.SAM2_REVISION }}
          path: _sam2
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Check out frozen Causal4D selector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/Causal4D
          ref: ${{ env.CAUSAL4D_REVISION }}
          path: _causal4d
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Set up Python 3.10
        id: python310
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Build and attest the isolated source runtime
        id: runtime
        shell: bash
        env:
          BOOTSTRAP_PYTHON: ${{ steps.python310.outputs.python-path }}
          RUNTIME_LOG: ${{ runner.temp }}/deform360-v61-source-runtime.log
        run: |
          set -euo pipefail
          set +e
          (
            set -euo pipefail
            test "${RUNNER_NAME}" = "${AUTHORIZED_RUNNER_NAME}"
            test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
            test "$(git -C _deform360 rev-parse HEAD)" = "${DEFORM360_REVISION}"
            test "$(git -C _sam2 rev-parse HEAD)" = "${SAM2_REVISION}"
            test "$(git -C _causal4d rev-parse HEAD)" = "${CAUSAL4D_REVISION}"
            test "$(sha256sum _deform360/pyproject.toml | awk '{print $1}')" = \
              "${DEFORM360_PROCESSING_PYPROJECT_SHA256}"
            test "$(sha256sum "${CUDA_RUNTIME_LOCK_PATH}" | awk '{print $1}')" = \
              "${CUDA_RUNTIME_LOCK_SHA256}"
            test "$(sha256sum "${CUDNN_SUPPLY_REPAIR_PATH}" | awk '{print $1}')" = \
              "${CUDNN_SUPPLY_REPAIR_FILE_SHA256}"
            test "$(jq -r '.repair_id' "${CUDNN_SUPPLY_REPAIR_PATH}")" = \
              "${CUDNN_SUPPLY_REPAIR_ID}"
            test "$(jq -r '.failed_execution_evidence.workflow_run_id' \
              "${CUDNN_SUPPLY_REPAIR_PATH}")" = "${CUDNN_FAILED_WORKFLOW_RUN_ID}"
            test "$(jq -r '.failed_execution_evidence.source_revision' \
              "${CUDNN_SUPPLY_REPAIR_PATH}")" = "${CUDNN_FAILED_SOURCE_REVISION}"
            test "$(sha256sum "${GSPLAT_ATTESTATION_REPAIR_PATH}" | awk '{print $1}')" = \
              "${GSPLAT_ATTESTATION_REPAIR_FILE_SHA256}"
            test "$(jq -r '.repair_id' "${GSPLAT_ATTESTATION_REPAIR_PATH}")" = \
              "${GSPLAT_ATTESTATION_REPAIR_ID}"
            test "$(jq -r '.predecessor_runtime_repair.repair_id' \
              "${GSPLAT_ATTESTATION_REPAIR_PATH}")" = "${CUDNN_SUPPLY_REPAIR_ID}"
            test "$(jq -r '.failed_execution_evidence.workflow_run_id' \
              "${GSPLAT_ATTESTATION_REPAIR_PATH}")" = \
              "${ATTESTATION_FAILED_WORKFLOW_RUN_ID}"
            test "$(jq -r '.failed_execution_evidence.source_revision' \
              "${GSPLAT_ATTESTATION_REPAIR_PATH}")" = \
              "${ATTESTATION_FAILED_SOURCE_REVISION}"
            test "$(sha256sum "${ENDPOINT_GSPLAT_BASE_REPAIR_PATH}" | awk '{print $1}')" = \
              "${ENDPOINT_GSPLAT_BASE_REPAIR_FILE_SHA256}"
            test "$(jq -r '.repair_id' "${ENDPOINT_GSPLAT_BASE_REPAIR_PATH}")" = \
              "${ENDPOINT_GSPLAT_BASE_REPAIR_ID}"
            test "$(jq -r '.failed_execution_evidence.workflow_run_id' \
              "${ENDPOINT_GSPLAT_BASE_REPAIR_PATH}")" = \
              "${ENDPOINT_FAILED_WORKFLOW_RUN_ID}"
            test "$(jq -r '.failed_execution_evidence.source_revision' \
              "${ENDPOINT_GSPLAT_BASE_REPAIR_PATH}")" = \
              "${ENDPOINT_FAILED_SOURCE_REVISION}"
            test "$(jq -r '.failed_execution_evidence.compact_receipt_id' \
              "${ENDPOINT_GSPLAT_BASE_REPAIR_PATH}")" = \
              "${ENDPOINT_FAILED_RECEIPT_ID}"
            test "$(jq -r '.failed_execution_evidence.compact_receipt_file_sha256' \
              "${ENDPOINT_GSPLAT_BASE_REPAIR_PATH}")" = \
              "${ENDPOINT_FAILED_RECEIPT_FILE_SHA256}"
            test "$(sha256sum scripts/remote/process_deform360_fresh_object_session_source_endpoint_v6_1.py | awk '{print $1}')" = \
              "${ENDPOINT_PROCESSOR_SHA256}"
            runtime="${RUNNER_TEMP}/deform360-v61-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            wheel="${RUNNER_TEMP}/gsplat-1.4.0+pt24cu121-cp310-cp310-linux_x86_64.whl"
            cudnn_wheel="${RUNNER_TEMP}/nvidia_cudnn_cu12-9.1.0.70-py3-none-manylinux2014_x86_64.whl"
            checkpoint="/mnt/lexar4tb/datasets/deform360/sam2-2b90b9f5/checkpoints/sam2.1_hiera_small.pt"
            test ! -e "${runtime}"
            test ! -e "${wheel}"
            test ! -e "${cudnn_wheel}"
            test -f "${checkpoint}"
            test ! -L "${checkpoint}"
            test "$(sha256sum "${checkpoint}" | awk '{print $1}')" = \
              "${SAM2_CHECKPOINT_SHA256}"
            "${BOOTSTRAP_PYTHON}" -m venv --copies "${runtime}"
            python_path="${runtime}/bin/python"
            "${python_path}" -m pip install \
              "pip==25.2" "setuptools==80.9.0" "wheel==0.45.1"
            curl --fail --location --retry 5 --retry-delay 2 \
              --proto '=https' --tlsv1.2 \
              --output "${cudnn_wheel}" "${CUDNN_WHEEL_URL}"
            test "$(stat -c '%s' "${cudnn_wheel}")" = \
              "${CUDNN_WHEEL_BYTE_COUNT}"
            test "$(sha256sum "${cudnn_wheel}" | awk '{print $1}')" = \
              "${CUDNN_WHEEL_SHA256}"
            "${python_path}" -m pip install --no-deps "${cudnn_wheel}"
            "${python_path}" -m pip install -r "${CUDA_RUNTIME_LOCK_PATH}"
            curl --fail --location --retry 5 --retry-delay 2 \
              --proto '=https' --tlsv1.2 \
              --output "${wheel}" "${GSPLAT_WHEEL_URL}"
            test "$(stat -c '%s' "${wheel}")" = "${GSPLAT_WHEEL_BYTE_COUNT}"
            test "$(sha256sum "${wheel}" | awk '{print $1}')" = \
              "${GSPLAT_WHEEL_SHA256}"
            "${python_path}" -m pip install --no-deps "${wheel}"
            "${python_path}" -m pip install -e ".[graph,vision]"
            "${python_path}" -m pip install "./_deform360[processing]"
            SAM2_BUILD_CUDA=0 "${python_path}" -m pip install --no-deps -e ./_sam2
            "${python_path}" -m pip install \
              "fpsample>=0.3" "hydra-core>=1.3.2" "iopath>=0.1.10" \
              "pillow>=9.4" "plyfile>=1.0" "scipy>=1.10" \
              "tqdm>=4.66" "trimesh>=4.0" "yourdfpy>=0.0.56"
            "${python_path}" - <<'PY'
          import hashlib
          from importlib.metadata import distribution, version
          from pathlib import Path
          import sys

          import gsplat
          from gsplat.cuda._backend import _C
          from nerfstudio.configs import method_configs
          from nerfstudio.scripts import exporter
          import sam2
          import torch
          import torchvision

          if sys.version_info[:2] != (3, 10):
              raise SystemExit("Python runtime identity changed")
          if torch.__version__ != "2.4.0+cu121" or torch.version.cuda != "12.1":
              raise SystemExit("Torch runtime identity changed")
          if version("nvidia-cudnn-cu12") != "9.1.0.70":
              raise SystemExit("cuDNN distribution identity changed")
          if torchvision.__version__ != "0.19.0+cu121":
              raise SystemExit("torchvision runtime identity changed")
          if not torch.cuda.is_available() or torch.cuda.device_count() < 2:
              raise SystemExit("the registered two-GPU runtime is unavailable")
          if any(torch.cuda.get_device_capability(i) != (8, 9) for i in range(2)):
              raise SystemExit("CUDA device capability changed")
          if (
              gsplat.__version__ != "1.4.0+pt24cu121"
              or version("gsplat") != "1.4.0+pt24cu121"
          ):
              raise SystemExit("gsplat distribution identity changed")
          extension = Path(_C.__file__).resolve()
          located = Path(distribution("gsplat").locate_file("gsplat/csrc.so")).resolve()
          observed = hashlib.sha256(extension.read_bytes()).hexdigest()
          if extension != located or observed != (
              "e0b664c9d6f355e611bdfa720103b86b399ded3dcc5ecfaf59eaade992f1359b"
          ):
              raise SystemExit("precompiled gsplat CUDA extension changed")
          if str(_C.CameraModelType.PINHOLE) != "CameraModelType.PINHOLE":
              raise SystemExit("gsplat CUDA backend is unavailable")
          if "splatfacto" not in method_configs.method_configs:
              raise SystemExit("nerfstudio splatfacto is unavailable")
          if not hasattr(exporter, "ExportGaussianSplat"):
              raise SystemExit("nerfstudio exporter is unavailable")
          print(
              torch.__version__,
              torchvision.__version__,
              gsplat.__version__,
              version("gsplat"),
          )
          print(extension, observed, sam2.__file__)
          PY
            {
              echo "BPT_PYTHON=${python_path}"
              echo "CUDNN_WHEEL=${cudnn_wheel}"
              echo "GSPLAT_WHEEL=${wheel}"
              echo "SAM2_CHECKPOINT=${checkpoint}"
            } >> "${GITHUB_ENV}"
          ) > "${RUNTIME_LOG}" 2>&1
          status=$?
          set -e
          cat "${RUNTIME_LOG}"
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Admit one empty durable source-scoring root
        id: admit
        if: steps.runtime.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME}" = "${AUTHORIZED_RUNNER_NAME}"
          results="$(realpath -e "${RESULTS_ROOT}")"
          aligned="$(realpath -e "${ALIGNED_ROOT}")"
          candidate="$(realpath -e "${CANDIDATE_RUN_ROOT}")"
          candidate_panel="$(realpath -e "${CANDIDATE_RUN_ROOT}/candidate-panel")"
          candidate_compact="$(realpath -e "${CANDIDATE_RUN_ROOT}/compact")"
          test "${results}" = "${RESULTS_ROOT}"
          test "${aligned}" = "${ALIGNED_ROOT}"
          test "${candidate}" = "${CANDIDATE_RUN_ROOT}"
          test -z "$(find "${candidate_panel}" "${candidate_compact}" -type l -print -quit)"
          test "$(sha256sum "${SOURCE_SCORING_AMENDMENT_PATH}" | awk '{print $1}')" = \
            "${SOURCE_SCORING_AMENDMENT_FILE_SHA256}"
          test "$(jq -r '.amendment_id' "${SOURCE_SCORING_AMENDMENT_PATH}")" = \
            "${SOURCE_SCORING_AMENDMENT_ID}"
          test "$(sha256sum "${EXECUTION_LOCK_PATH}" | awk '{print $1}')" = \
            "${EXECUTION_LOCK_FILE_SHA256}"
          test "$(jq -r '.execution_lock_id' "${EXECUTION_LOCK_PATH}")" = \
            "${EXECUTION_LOCK_ID}"
          test "$(sha256sum "${candidate_panel}/candidate-panel-receipt.json" | awk '{print $1}')" = \
            "${CANDIDATE_PANEL_RECEIPT_FILE_SHA256}"
          test "$(jq -r '.receipt_id' "${candidate_panel}/candidate-panel-receipt.json")" = \
            "${CANDIDATE_PANEL_RECEIPT_ID}"
          test "$(sha256sum "${candidate_panel}/raw-nested-prediction-batch.json" | awk '{print $1}')" = \
            "${RAW_PREDICTION_BATCH_FILE_SHA256}"
          test "$(jq -r '.prediction_batch_id' "${candidate_panel}/raw-nested-prediction-batch.json")" = \
            "${RAW_PREDICTION_BATCH_ID}"
          test "$(sha256sum "${candidate_compact}/execution-receipt.json" | awk '{print $1}')" = \
            "${CANDIDATE_EXECUTION_RECEIPT_FILE_SHA256}"
          test "$(jq -r '.receipt_id' "${candidate_compact}/execution-receipt.json")" = \
            "${CANDIDATE_EXECUTION_RECEIPT_ID}"
          test "$(jq -r '.candidate_revision' "${candidate_compact}/execution-receipt.json")" = \
            "${CANDIDATE_REVISION}"
          test "$(jq -r '.prediction_record_count' "${candidate_compact}/execution-receipt.json")" = 100
          test "$(jq -r '.technical_failure_record_count' "${candidate_compact}/execution-receipt.json")" = 0
          test "$(jq -r '.information_boundary.source_suffix_opened' "${candidate_compact}/execution-receipt.json")" = false
          test "$(sha256sum "${candidate_compact}/upstream-source-plan.json" | awk '{print $1}')" = \
            "${UPSTREAM_SOURCE_PLAN_FILE_SHA256}"
          test "$(jq -r '.plan_id' "${candidate_compact}/upstream-source-plan.json")" = \
            "${UPSTREAM_SOURCE_PLAN_ID}"
          output="${RESULTS_ROOT}/bayesian-phystwin/deform360-v61-source-scorer-endpoint-gsplat-base/${ENDPOINT_GSPLAT_BASE_REPAIR_ID}"
          endpoint="${output}-endpoint"
          test ! -e "${output}"
          test ! -e "${output}.claim"
          test ! -e "${endpoint}"
          {
            echo "BPT_SOURCE_SHA=${GITHUB_SHA}"
            echo "CANDIDATE_ROOT=${candidate_panel}"
            echo "CANDIDATE_EXECUTION_RECEIPT=${candidate_compact}/execution-receipt.json"
            echo "SOURCE_PLAN=${candidate_compact}/upstream-source-plan.json"
            echo "CAUSAL4D_REPOSITORY=${GITHUB_WORKSPACE}/_causal4d"
            echo "DEFORM360_REPOSITORY=${GITHUB_WORKSPACE}/_deform360"
            echo "SAM2_REPOSITORY=${GITHUB_WORKSPACE}/_sam2"
            echo "RUN_ROOT=${output}"
            echo "RUN_CLAIM=${output}.claim"
            echo "ENDPOINT_ROOT=${endpoint}"
          } >> "${GITHUB_ENV}"
          echo "admitted=true" >> "${GITHUB_OUTPUT}"

      - name: Run the one authorized public-source scorer
        id: execute
        if: steps.admit.outputs.admitted == 'true'
        shell: bash
        run: |
          set -uo pipefail
          set +e
          bash scripts/ci/run_deform360_v61_source_scorer.sh \
            > "${RUNNER_TEMP}/deform360-v61-source-scorer.log" 2>&1
          status=$?
          set -e
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Retain one bounded terminal source receipt
        id: retain
        if: always() && steps.execute.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "${RUN_CLAIM}" || -L "${RUN_CLAIM}" ]]; then
            echo "source scorer did not create its one-shot claim" >&2
            exit 0
          fi
          expected="$(printf 'workflow_run_id=%s\nworkflow_run_attempt=%s\nsource_revision=%s\n' \
            "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" "${GITHUB_SHA}")"
          if [[ "$(cat "${RUN_CLAIM}")" != "${expected}" ]]; then
            echo "durable source root belongs to another run" >&2
            exit 0
          fi
          echo "owns_run=true" >> "${GITHUB_OUTPUT}"
          test -d "${RUN_ROOT}"
          test ! -L "${RUN_ROOT}"
          compact="${RUN_ROOT}/compact"
          mkdir -p "${compact}/logs"
          test -d "${compact}"
          test ! -L "${compact}"
          install -m 600 "${CUDNN_SUPPLY_REPAIR_PATH}" \
            "${compact}/cudnn-supply-runtime-repair.json"
          install -m 600 "${GSPLAT_ATTESTATION_REPAIR_PATH}" \
            "${compact}/gsplat-attestation-runtime-repair.json"
          install -m 600 "${ENDPOINT_GSPLAT_BASE_REPAIR_PATH}" \
            "${compact}/endpoint-gsplat-base-runtime-repair.json"
          cat > "${compact}/source-runtime-repair-attestation.json" <<EOF
          {
            "cudnn_distribution_version": "${CUDNN_DISTRIBUTION_VERSION}",
            "cudnn_wheel_byte_count": ${CUDNN_WHEEL_BYTE_COUNT},
            "cudnn_wheel_sha256": "${CUDNN_WHEEL_SHA256}",
            "cudnn_supply_repair_id": "${CUDNN_SUPPLY_REPAIR_ID}",
            "endpoint_gsplat_base_repair_id": "${ENDPOINT_GSPLAT_BASE_REPAIR_ID}",
            "gsplat_attestation_repair_id": "${GSPLAT_ATTESTATION_REPAIR_ID}",
            "gsplat_distribution_version": "${GSPLAT_DISTRIBUTION_VERSION}",
            "gsplat_extension_sha256": "${GSPLAT_EXTENSION_SHA256}",
            "gsplat_wheel_byte_count": ${GSPLAT_WHEEL_BYTE_COUNT},
            "gsplat_wheel_sha256": "${GSPLAT_WHEEL_SHA256}",
            "predecessor_source_revision": "${ENDPOINT_FAILED_SOURCE_REVISION}",
            "predecessor_workflow_run_id": ${ENDPOINT_FAILED_WORKFLOW_RUN_ID},
            "runtime_and_endpoint_dependency_attestation_changed_only": true
          }
          EOF
          log="${RUNNER_TEMP}/deform360-v61-source-scorer.log"
          if [[ -f "${log}" && ! -L "${log}" ]]; then
            tail -c 64000 "${log}" > "${compact}/logs/runner.log"
          fi
          receipt="${compact}/source-scoring-receipt.json"
          status="${{ steps.execute.outputs.exit_code }}"
          status="${status:-1}"
          if [[ ! -f "${receipt}" ]]; then
            test -f "${compact}/source-suffix-opening-authorization.json"
            if [[ -d "${ENDPOINT_ROOT}/terminal-failures" ]]; then
              test ! -L "${ENDPOINT_ROOT}/terminal-failures"
              test -z "$(find "${ENDPOINT_ROOT}/terminal-failures" -type l -print -quit)"
              cp -a "${ENDPOINT_ROOT}/terminal-failures" \
                "${compact}/endpoint-terminal-failures"
            fi
            if [[ -d "${RUN_ROOT}/source-outcomes" ]]; then
              test ! -L "${RUN_ROOT}/source-outcomes"
              test -z "$(find "${RUN_ROOT}/source-outcomes" -type l -print -quit)"
              cp -a "${RUN_ROOT}/source-outcomes" \
                "${compact}/partial-source-outcomes"
            fi
            if [[ -d "${RUN_ROOT}/support-reports" ]]; then
              test ! -L "${RUN_ROOT}/support-reports"
              test -z "$(find "${RUN_ROOT}/support-reports" -type l -print -quit)"
              cp -a "${RUN_ROOT}/support-reports" \
                "${compact}/partial-support-reports"
            fi
            source_opened=false
            if [[ -f "${compact}/source-suffix-opened.txt" ]] && \
               [[ "$(cat "${compact}/source-suffix-opened.txt")" = true ]]; then
              source_opened=true
            fi
            stage=source-scorer
            if [[ -f "${compact}/terminal-stage.txt" ]]; then
              stage="$(cat "${compact}/terminal-stage.txt")"
            fi
            command=(
              "${BPT_PYTHON}"
              scripts/science/run_deform360_fresh_object_session_source_scorer_v6_1.py
              retain-failure
              --scorer-revision "${GITHUB_SHA}"
              --runner-name "${RUNNER_NAME}"
              --workflow-run-id "${GITHUB_RUN_ID}"
              --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}"
              --authorization "${compact}/source-suffix-opening-authorization.json"
              --terminal-stage "${stage}"
              --exit-code "$(( status == 0 ? 1 : status ))"
              --artifact-root "${compact}"
              --output "${receipt}"
            )
            if [[ "${source_opened}" = true ]]; then
              command+=(--source-suffix-opened)
            fi
            "${command[@]}" >/dev/null
          fi
          rm -f "${compact}/SHA256SUMS"
          (
            cd "${compact}"
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
            sha256sum --check SHA256SUMS >/dev/null
          )

      - name: Verify compact source decision and closed confirmation boundary
        if: always() && steps.retain.outputs.owns_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          compact="${RUN_ROOT}/compact"
          (cd "${compact}" && sha256sum --check SHA256SUMS >/dev/null)
          "${BPT_PYTHON}" scripts/science/run_deform360_fresh_object_session_source_scorer_v6_1.py \
            validate-receipt --receipt "${compact}/source-scoring-receipt.json" >/dev/null
          jq -e '
            .information_boundary.confirmation_payloads_opened == false and
            .information_boundary.target_outcomes_opened == false and
            .information_boundary.held_v8_artifacts_accessed == false and
            .information_boundary.human_approval_required == false and
            .information_boundary.new_measurements_collected == false and
            .information_boundary.prob4d_decoded_uniform_fusion_used == false and
            .independent_confirmation_authorized == false and
            .claim_authorized == false and
            (
              (
                (.status == "source-challenger-advanced" or
                 .status == "source-reference-retained") and
                .source_gate_evaluated == null and
                .outcome_count == 100
              ) or
              (
                .status == "source-scoring-technical-failure-retained" and
                .source_gate_evaluated == false and
                .source_gate_passed == null and
                .source_continuation_authorized == false
              )
            )
          ' "${compact}/source-scoring-receipt.json" >/dev/null
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Upload compact public-source evidence
        if: always() && steps.retain.outputs.owns_run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: deform360-v61-source-scorer-endpoint-gsplat-base-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RUN_ROOT }}/compact
          if-no-files-found: error
          retention-days: 180

      - name: Require one complete one-shot terminal decision
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.runtime.outputs.exit_code }}" = "0"
          test "${{ steps.admit.outputs.admitted }}" = "true"
          test "${{ steps.execute.outcome }}" != "skipped"
          status="${{ steps.execute.outputs.exit_code }}"
          status="${status:-1}"
          test "${{ steps.retain.outputs.owns_run }}" = "true"
          test "${status}" = "0"

# This workflow contains no confirmation, target, held-v8, or claim command.
