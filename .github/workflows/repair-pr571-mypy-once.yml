name: Repair PR 571 MyPy narrowing once

on:
  push:
    branches:
      - agent/query-covariance-composition-v1

permissions:
  contents: write

concurrency:
  group: repair-pr571-mypy-once
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'IPS-Stuttgart/BayesianPhysTwin'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/query-covariance-composition-v1
          fetch-depth: 1
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply exact type-narrowing replacement and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/bayesian_phystwin/query_covariance_decision_v1.py")
          text = path.read_text(encoding="utf-8")
          old = '''        if any(item is None for item in directional):
              raise ValueError("active queries require directional fractions")
          defined_directional = cast(tuple[float, float, float], directional)
          minimum, mean, maximum = defined_directional
          if not minimum <= mean <= maximum:
              raise ValueError("directional shared fractions are not ordered")
          if shared == 0.0 and not all(
              _close(item, 0.0) for item in defined_directional
          ):
              raise ValueError(
                  "zero shared covariance requires zero directional fractions"
              )
          if conditional == 0.0 and not all(
              _close(item, 1.0) for item in defined_directional
          ):
              raise ValueError(
                  "all-shared covariance requires unit directional fractions"
              )
          '''
          new = '''        minimum, mean, maximum = directional
          if minimum is None or mean is None or maximum is None:
              raise ValueError("active queries require directional fractions")
          defined_directional = (minimum, mean, maximum)
          if not minimum <= mean <= maximum:
              raise ValueError("directional shared fractions are not ordered")
          if shared == 0.0 and not all(
              _close(item, 0.0) for item in defined_directional
          ):
              raise ValueError(
                  "zero shared covariance requires zero directional fractions"
              )
          if conditional == 0.0 and not all(
              _close(item, 1.0) for item in defined_directional
          ):
              raise ValueError(
                  "all-shared covariance requires unit directional fractions"
              )
          '''
          if text.count(old) != 1:
              raise SystemExit("expected narrowing block was not found exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          rm .github/workflows/repair-pr571-mypy-once.yml
          python -m compileall -q src/bayesian_phystwin/query_covariance_decision_v1.py
          git diff --check

      - name: Commit exact repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/bayesian_phystwin/query_covariance_decision_v1.py \
            .github/workflows/repair-pr571-mypy-once.yml
          git commit -m 'Narrow directional covariance fractions explicitly'
          git push origin HEAD:agent/query-covariance-composition-v1
