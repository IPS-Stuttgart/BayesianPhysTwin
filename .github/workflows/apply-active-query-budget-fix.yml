name: Apply active-query reseed-budget fix

on:
  push:
    branches:
      - agent/physics-guided-active-queries
    paths:
      - .github/workflows/apply-active-query-budget-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/physics-guided-active-queries

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Enforce the dynamic-event budget and add regression coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/bayesian_phystwin/phystwin_active_queries.py")
          source = source_path.read_text(encoding="utf-8")
          old = "    maximum_event_count = cfg.query_count + cfg.maximum_reseeds\n"
          new = "    maximum_event_count = len(initial) + cfg.maximum_reseeds\n"
          if source.count(old) != 1:
              raise SystemExit("active-query event-budget expression changed unexpectedly")
          source_path.write_text(source.replace(old, new), encoding="utf-8")

          test_path = Path("tests/test_phystwin_active_queries.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = "\ndef test_two_view_gate_is_not_weakened_when_support_is_insufficient() -> None:\n"
          if tests.count(marker) != 1:
              raise SystemExit("active-query test insertion point changed unexpectedly")
          regression = '''

def test_reseed_budget_is_not_borrowed_from_missing_initial_queries() -> None:
    rollout = np.zeros((4, 2, 3), dtype=float)
    rollout[:, 0, 0] = np.linspace(0.0, 3.0, 4)
    rollout[:, 1, 1] = np.linspace(0.0, 1.0, 4)
    pixels = _projected_pixels(2, rollout)
    predicted = np.ones((2, 4, 2), dtype=float)
    predicted[:, 0, 1] = 0.0
    tracker = np.ones_like(predicted)
    tracker[:, 1:, 0] = 0.0
    config = PhysicsGuidedQueryConfig(
        query_count=2,
        maximum_reseeds=0,
        minimum_motion_m=0.1,
        contact_exclusion_fraction=0.0,
        reseed_patience_frames=1,
        minimum_reseed_interval_frames=1,
    )

    plan = plan_physics_guided_queries(
        rollout,
        pixels,
        predicted,
        tracker_support_probability=tracker,
        config=config,
    )

    np.testing.assert_array_equal(plan.node_ids, np.asarray([0]))
    np.testing.assert_array_equal(plan.seed_frames, np.asarray([0]))
    assert plan.reseed_count == 0
'''
          test_path.write_text(tests.replace(marker, regression + marker), encoding="utf-8")
          PY

      - name: Run focused regression suite
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest -q tests/test_phystwin_active_queries.py

      - name: Commit the reviewed fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bayesian_phystwin/phystwin_active_queries.py tests/test_phystwin_active_queries.py
          git commit -m "Enforce the active-query reseed budget"
          git push origin HEAD:agent/physics-guided-active-queries
