# workflow-lifecycle: temporary-one-shot
# workflow-owner: IPS-Stuttgart maintainers
name: Deform360 reserved action confirmation v4

on:
  push:
    branches: [science/deform360-icra-development-v2]
    paths:
      - ".github/requests/deform360-reserved-confirmation-v4.json"

permissions:
  contents: read

concurrency:
  group: deform360-reserved-confirmation-v4
  cancel-in-progress: false

env:
  DATASET_ROOT: /mnt/seagate10tb/florianpfaff/datasets/deform360
  PROTOCOL_PATH: protocols/deform360_reserved_confirmation_v4.json
  REQUEST_PATH: .github/requests/deform360-reserved-confirmation-v4.json
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  confirmation:
    name: Frozen reserved-object confirmation / gpuserver4090
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 180
    steps:
      - name: Check out exact authorization revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          clean: true

      - name: Authorize exactly one newly added request
        shell: bash
        run: |
          set -euo pipefail
          test -f "${REQUEST_PATH}"
          mapfile -t changed < <(git diff --name-status HEAD^ HEAD)
          printf 'Changed files:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = $'A\t'"${REQUEST_PATH}"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          path = Path(os.environ["REQUEST_PATH"])
          request = json.loads(path.read_text(encoding="utf-8"))
          parent = subprocess.check_output(
              ["git", "rev-parse", "HEAD^"], text=True
          ).strip()
          expected = {
              "schema": "deform360-reserved-confirmation-request-v4",
              "protocol_path": "protocols/deform360_reserved_confirmation_v4.json",
              "dataset_root": "/mnt/seagate10tb/florianpfaff/datasets/deform360",
              "runner_label": "gpuserver4090",
              "eligible_reserved_object_ids": [
                  "066-glove-half-black-cloth",
                  "075-leather",
                  "080-wool",
                  "091-net-cloth",
              ],
              "open_reserved_numeric_payloads": True,
              "paper_claim_authorized": False,
              "fresh_confirmation_authorized": False,
          }
          for key, value in expected.items():
              if request.get(key) != value:
                  raise SystemExit(f"invalid request field {key!r}")
          allowed = set(expected) | {"request_id", "expected_source_revision"}
          if set(request) != allowed:
              raise SystemExit(f"unexpected request keys: {sorted(set(request)-allowed)}")
          if request.get("expected_source_revision") != parent:
              raise SystemExit("request is not bound to its exact parent revision")
          if not request.get("request_id"):
              raise SystemExit("request_id must be nonempty")
          PY

      - name: Prepare isolated NumPy runtime and evidence root
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_OS}" = Linux
          test "${RUNNER_ARCH}" = X64
          test -d "${DATASET_ROOT}"
          test "$(readlink -f -- "${DATASET_ROOT}")" = "${DATASET_ROOT}"
          venv="${RUNNER_TEMP}/deform360-confirmation-v4-venv-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          output="${RUNNER_TEMP}/deform360-confirmation-v4-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "${venv}" "${output}"
          python3 -m venv "${venv}"
          "${venv}/bin/python" -m pip install numpy==1.26.4
          mkdir -p -- "${output}"
          {
            echo "PYTHON_BIN=${venv}/bin/python"
            echo "VENV_ROOT=${venv}"
            echo "OUTPUT_ROOT=${output}"
          } >> "${GITHUB_ENV}"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "revision=${GITHUB_SHA}"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "dataset_root=${DATASET_ROOT}"
            git hash-object scripts/science/run_deform360_action_kernel_v3.py
            git hash-object scripts/science/run_deform360_action_conditioned_tactile_v2.py
            "${venv}/bin/python" --version
            uname -a
            nvidia-smi --query-gpu=index,name,uuid,driver_version,memory.total --format=csv,noheader
          } | tee "${output}/environment.txt"
          cp "${PROTOCOL_PATH}" "${output}/protocol.json"
          cp "${REQUEST_PATH}" "${output}/request.json"

      - name: Revalidate frozen source before reserved access
        shell: bash
        run: |
          set -euo pipefail
          "${PYTHON_BIN}" -m py_compile \
            scripts/science/run_deform360_action_conditioned_tactile_v2.py \
            scripts/science/run_deform360_action_kernel_v3.py \
            scripts/science/run_deform360_reserved_confirmation_v4.py
          "${PYTHON_BIN}" scripts/science/run_deform360_reserved_confirmation_v4.py --help
          git diff --exit-code

      - name: Execute exact frozen method on reserved objects
        shell: bash
        run: |
          set -euo pipefail
          "${PYTHON_BIN}" scripts/science/run_deform360_reserved_confirmation_v4.py \
            --protocol "${PROTOCOL_PATH}" \
            --data-root "${DATASET_ROOT}" \
            --output-json "${OUTPUT_ROOT}/result.json" \
            --output-report "${OUTPUT_ROOT}/report.md" \
            | tee "${OUTPUT_ROOT}/console.log"
          cat "${OUTPUT_ROOT}/report.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify complete compact confirmation evidence
        shell: bash
        run: |
          set -euo pipefail
          "${PYTHON_BIN}" - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(
              (Path(os.environ["OUTPUT_ROOT"]) / "result.json").read_text()
          )
          if result["status"] != "complete":
              raise SystemExit("confirmation is incomplete")
          if result["summary"]["object_count"] != 4:
              raise SystemExit("eligible reserved roster was not completed")
          boundary = result["information_boundary"]
          required_true = (
              "protocol_frozen_before_reserved_numeric_payload_access",
              "exact_development_method_reused",
              "eligible_reserved_robot_trajectories_opened",
              "eligible_reserved_tactile_responses_opened",
              "future_robot_trajectory_is_intervention_input",
              "target_tactile_opened_after_source_fit",
          )
          required_false = (
              "ineligible_reserved_payloads_opened",
              "camera_pixels_opened",
              "geometry_or_point_cloud_opened",
              "new_measurements_collected",
          )
          if any(boundary[key] is not True for key in required_true):
              raise SystemExit("required confirmation boundary was not met")
          if any(boundary[key] is not False for key in required_false):
              raise SystemExit("closed confirmation boundary changed")
          if result["confirmation_decision"]["paper_claim_authorized"] is not False:
              raise SystemExit("result self-authorized a paper claim")
          PY
          sha256sum "${OUTPUT_ROOT}"/* > "${OUTPUT_ROOT}/SHA256SUMS"
          git diff --exit-code

      - name: Upload compact confirmation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: deform360-reserved-confirmation-v4-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_ROOT }}
          if-no-files-found: error
          retention-days: 90

      - name: Remove isolated runtime
        if: always()
        shell: bash
        run: rm -rf -- "${VENV_ROOT:-}"
