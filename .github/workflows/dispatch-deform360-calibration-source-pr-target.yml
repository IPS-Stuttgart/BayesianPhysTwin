name: Execute frozen Deform360 calibration source from exact PR target

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/calibration-dispatch-trigger/deform360-official-hub-calibration-source-2026-08-07.txt"

permissions:
  contents: read
  issues: write

concurrency:
  group: dispatch-deform360-calibration-source-pr-target
  cancel-in-progress: true

jobs:
  admit:
    name: Admit trusted default-branch calibration execution
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'FlorianPfaff' &&
      github.event.pull_request.head.ref == 'agent/calibration-dispatch-trigger-v1' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.changed_files == 1 &&
      github.event.pull_request.additions == 1 &&
      github.event.pull_request.deletions == 0
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
    steps:
      - name: Seal exact default-branch source revision
        id: identity
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Default-branch source revision is not an exact commit." >&2
            exit 1
          fi
          echo "source_sha=${SOURCE_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Publish non-sensitive admission receipt
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
          TRIGGER_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TRIGGER_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          receipt="${RUNNER_TEMP}/calibration-admission-receipt.json"
          python3 - "${receipt}" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          body = "\n".join(
              [
                  "## Calibration-source execution admitted",
                  "",
                  f"- dispatcher workflow run: `{os.environ['GITHUB_RUN_ID']}`",
                  f"- exact default-branch source revision: `{os.environ['SOURCE_SHA']}`",
                  f"- execution-only trigger PR: `#{os.environ['TRIGGER_PR']}`",
                  f"- trigger-head revision: `{os.environ['TRIGGER_HEAD_SHA']}`",
                  "- state: `admitted; awaiting self-hosted runner assignment`",
                  "- next required evidence: the pre-checkout `workstation2` run beacon",
                  "",
                  (
                      "This hosted admission job opens no dataset payload, checks out "
                      "no pull-request code, and does not claim that the self-hosted "
                      "execution has started."
                  ),
              ]
          )
          Path(sys.argv[1]).write_text(
              json.dumps({"body": body}, sort_keys=True),
              encoding="utf-8",
          )
          PY
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/148/comments" \
            --data-binary @"${receipt}"

  execute:
    name: Execute trusted reusable calibration lane
    needs: admit
    if: needs.admit.result == 'success'
    uses: ./.github/workflows/deform360-official-hub-calibration-source-reusable.yml
    with:
      source_sha: ${{ needs.admit.outputs.source_sha }}
