name: Apply observation contract consolidation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: observation-contract-publish-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          show-progress: false
      - name: Apply source consolidation
        run: |
          python .github/agent-patches/apply_observation_contract.py
          rm .github/agent-patches/apply_observation_contract.py
          rm -f .github/workflows/observation-contract-conformance.yml
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Validate and format
        run: |
          python -m pip install -e ".[dev]"
          python -m ruff format src/bayesian_phystwin/observation_belief.py src/bayesian_phystwin/observation_contract_bundle.py tests/test_observation_contract_bundle.py
          python -m ruff check src/bayesian_phystwin/observation_belief.py src/bayesian_phystwin/observation_contract_bundle.py tests/test_observation_contract_bundle.py
          python -m pytest -q tests/test_observation_contract_bundle.py tests/test_observation_belief.py tests/test_prob4d_joint_contract_fixture.py
      - name: Commit consolidated contract
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Consolidate the observation-belief contract'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
