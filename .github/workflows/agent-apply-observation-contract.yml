name: Apply observation contract consolidation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/agent-patches/apply_observation_contract.py
      - .github/workflows/agent-apply-observation-contract.yml

permissions:
  contents: write

concurrency:
  group: observation-contract-publish-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/observation-contract-conformance' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          clean: true
          fetch-depth: 1
          show-progress: false

      - name: Verify exact reviewed head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"

      - name: Apply source consolidation and remove publication scaffolding
        shell: bash
        run: |
          set -euo pipefail
          python .github/agent-patches/apply_observation_contract.py
          rm .github/agent-patches/apply_observation_contract.py
          rm .github/workflows/agent-apply-observation-contract.yml
          rm -f .github/workflows/observation-contract-conformance.yml

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate and format
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir -e ".[dev]"
          python -m ruff format \
            src/bayesian_phystwin/observation_belief.py \
            src/bayesian_phystwin/observation_contract_bundle.py \
            tests/test_observation_contract_bundle.py
          python -m ruff check \
            src/bayesian_phystwin/observation_belief.py \
            src/bayesian_phystwin/observation_contract_bundle.py \
            tests/test_observation_contract_bundle.py
          python -m pytest -q \
            tests/test_observation_contract_bundle.py \
            tests/test_observation_belief.py \
            tests/test_prob4d_joint_contract_fixture.py
          python -m compileall -q src/bayesian_phystwin tests
          git diff --check

      - name: Commit consolidated contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && {
            echo 'finalizer produced no changes' >&2
            exit 1
          }
          git commit -m 'Consolidate the observation-belief contract'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
