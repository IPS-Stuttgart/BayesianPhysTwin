name: Temporary PR 815 Ruff format repair

on:
  push:
    branches:
      - science/deform360-gpuserver4090-real-eval-v1

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: science/deform360-gpuserver4090-real-eval-v1
          fetch-depth: 0
          persist-credentials: true
      - name: Apply Ruff formatting
        shell: bash
        run: |
          python -m pip install ruff==0.16.5
          python -m ruff format scripts/science/audit_deform360_reserved_confirmation_v4.py
          python -m ruff format --check scripts/science/audit_deform360_reserved_confirmation_v4.py
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/science/audit_deform360_reserved_confirmation_v4.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Format Deform360 reserved confirmation audit'
          git push origin HEAD:science/deform360-gpuserver4090-real-eval-v1
