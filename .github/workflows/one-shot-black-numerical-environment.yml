name: One-shot Black 26.3.1 formatter artifact

on:
  push:
    branches:
      - agent/numerical-environment-profile-v1

permissions:
  contents: read

jobs:
  format:
    name: Format numerical-environment test shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply the repository's exact formatter
        run: |
          python -m pip install --disable-pip-version-check "black==26.3.1"
          python -m black \
            tests/test_runtime_provenance_numerical_environment_v1_1.py \
            tests/test_runtime_provenance_numerical_environment_v1_3.py \
            tests/test_runtime_provenance_numerical_environment_v1_4.py
          python -m black --check \
            tests/test_runtime_provenance_numerical_environment_v1_1.py \
            tests/test_runtime_provenance_numerical_environment_v1_3.py \
            tests/test_runtime_provenance_numerical_environment_v1_4.py

      - name: Upload exact formatted files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: black-26.3.1-formatted-${{ github.sha }}
          path: |
            tests/test_runtime_provenance_numerical_environment_v1_1.py
            tests/test_runtime_provenance_numerical_environment_v1_3.py
            tests/test_runtime_provenance_numerical_environment_v1_4.py
          if-no-files-found: error
          retention-days: 1
