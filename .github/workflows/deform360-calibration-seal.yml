name: Deform360 calibration execution seal

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deform360-calibration-seal.yml"
      - "docs/deform360_calibration_execution_v1.md"
      - "src/bayesian_phystwin/cli/_command_inventory.py"
      - "src/bayesian_phystwin/cli/deform360_calibration_execution.py"
      - "src/bayesian_phystwin/cli/experiments.py"
      - "src/bayesian_phystwin/deform360_calibration_execution.py"
      - "tests/test_deform360_calibration_execution.py"
      - "tests/test_deform360_calibration_execution_boundaries.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deform360-calibration-seal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Cohort, lineage, atomic publication, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Check formatting and typing
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/bayesian_phystwin/deform360_calibration_execution.py
            src/bayesian_phystwin/cli/deform360_calibration_execution.py
            src/bayesian_phystwin/cli/_command_inventory.py
            src/bayesian_phystwin/cli/experiments.py
            tests/test_deform360_calibration_execution.py
            tests/test_deform360_calibration_execution_boundaries.py
          )
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy --no-site-packages \
            src/bayesian_phystwin/deform360_calibration_execution.py \
            src/bayesian_phystwin/cli/deform360_calibration_execution.py

      - name: Exercise the complete pre-confirmation boundary
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_deform360_calibration_execution.py \
            tests/test_deform360_calibration_execution_boundaries.py \
            tests/test_deform360_calibration_bundle.py \
            tests/test_deform360_visual_provider_lock.py \
            tests/test_evidence_use_ledger.py
          python -m compileall -q src/bayesian_phystwin
