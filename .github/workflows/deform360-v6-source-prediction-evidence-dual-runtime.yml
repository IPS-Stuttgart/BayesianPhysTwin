jobs:
  contracts:
    name: Dual-runtime contracts / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out exact proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate the target-closed dual-runtime repair
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1"
          python -m pip install -e ".[dev,graph]"
          python -m ruff check \
            tests/test_deform360_v6_frame_zero_cuda_runtime_repair.py \
            tests/test_deform360_v6_primary_cma_runtime_repair.py \
            tests/test_deform360_v6_primary_pynput_runtime_repair.py \
            tests/test_deform360_v6_official_phystwin_py310_runtime_repair.py \
            tests/test_deform360_v6_case_subprocess_stdin_isolation_repair.py \
            tests/test_deform360_v6_case_stdin_marker_bootstrap_binding_repair.py
          python -m ruff format --check \
            tests/test_deform360_v6_frame_zero_cuda_runtime_repair.py \
            tests/test_deform360_v6_primary_cma_runtime_repair.py \
            tests/test_deform360_v6_primary_pynput_runtime_repair.py \
            tests/test_deform360_v6_official_phystwin_py310_runtime_repair.py \
            tests/test_deform360_v6_case_subprocess_stdin_isolation_repair.py \
            tests/test_deform360_v6_case_stdin_marker_bootstrap_binding_repair.py
          bash -n scripts/ci/dispatch_deform360_v6_source_python.sh
          python -m pytest -q -p no:cacheprovider \
            tests/test_deform360_v6_frame_zero_cuda_runtime_repair.py \
            tests/test_deform360_v6_primary_cma_runtime_repair.py \
            tests/test_deform360_v6_primary_pynput_runtime_repair.py \
            tests/test_deform360_v6_official_phystwin_py310_runtime_repair.py \
            tests/test_deform360_v6_case_subprocess_stdin_isolation_repair.py \
            tests/test_deform360_v6_case_stdin_marker_bootstrap_binding_repair.py \
            tests/test_pull_request_workflow_integrity.py
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"

  evidence:
    name: Seal 100 real source predictions / workstation2 / dual runtime
    needs: contracts
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin'
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 720
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Admit the sole runner and target-closed roots
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME}" = "${AUTHORIZED_RUNNER_NAME}"
          nvidia-smi
          test -d "${RESULTS_ROOT}"
          test -d "${PROCESSED_ROOT}/aligned"
          test -d "${VISUAL_PRODUCTION_ROOT}"
          test -d "${METRIC_BATCH_ROOT}"
          for admitted in \
            "${RESULTS_ROOT}" \
            "${PROCESSED_ROOT}" \
            "${VISUAL_PRODUCTION_ROOT}" \
            "${METRIC_BATCH_ROOT}"; do
            case "${admitted}/" in
              "${OFFICIAL_RAW_ROOT}/"*|"${ADAPTIVE_CONFIRMATION_RAW_ROOT}/"*)
                echo "an admitted path overlaps a forbidden raw root" >&2
                exit 1
                ;;
            esac
          done
          echo "development_suffix_opened=false"
          echo "v5_confirmation_payloads_opened=false"
          echo "v6_target_payloads_opened=false"
          echo "v6_target_outcomes_used=false"
          echo "replacement_allowed=false"

      - name: Check out exact protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Check out frozen Deform360 physical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lhy0807/deform360
          ref: ${{ env.DEFORM360_PHYSICAL_REVISION }}
          path: _deform360_physical
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Check out frozen official PhysTwin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Jianghanxiao/PhysTwin
          ref: ${{ env.OFFICIAL_PHYSTWIN_REVISION }}
          path: _official_phystwin
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Check out frozen SAM2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: facebookresearch/sam2
          ref: ${{ env.SAM2_REVISION }}
          path: _sam2
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Check out Causal4D source for exact-file discovery
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/Causal4D
          ref: ${{ env.CAUSAL4D_DISCOVERY_REVISION }}
          path: _causal4d_discovery
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Download authoritative calibration source artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ env.SOURCE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/deform360-v6-source-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Set up frame-zero Python 3.10
        id: python310
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Set up primary Python 3.12
        id: python312
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build isolated primary and frame-zero CUDA runtimes
        id: runtime
        shell: bash
        env:
          PRIMARY_BOOTSTRAP_PYTHON: ${{ steps.python312.outputs.python-path }}
          FRAME_ZERO_BOOTSTRAP_PYTHON: ${{ steps.python310.outputs.python-path }}
          OFFICIAL_PHYSTWIN_REPO: ${{ github.workspace }}/_official_phystwin
          RUNTIME_LOG: ${{ runner.temp }}/deform360-v6-dual-runtime-bootstrap.log
        run: |
          set -euo pipefail
          set +e
          (
            set -euo pipefail
            test "$(sha256sum "${FRAME_ZERO_RUNTIME_REPAIR_PATH}" | awk '{print $1}')" \
              = "${FRAME_ZERO_RUNTIME_REPAIR_SHA256}"
            test "$(sha256sum "${DISPATCH_NAMESPACE_REPAIR_PATH}" | awk '{print $1}')" \
              = "${DISPATCH_NAMESPACE_REPAIR_SHA256}"
            test "$(sha256sum "${FALLBACK_CONFIG_ROUTE_REPAIR_PATH}" | awk '{print $1}')" \
              = "${FALLBACK_CONFIG_ROUTE_REPAIR_SHA256}"
            test "$(sha256sum "${PRIMARY_CMA_RUNTIME_REPAIR_PATH}" | awk '{print $1}')" \
              = "${PRIMARY_CMA_RUNTIME_REPAIR_SHA256}"
            test "$(sha256sum "${PRIMARY_PYNPUT_RUNTIME_REPAIR_PATH}" | awk '{print $1}')" \
              = "${PRIMARY_PYNPUT_RUNTIME_REPAIR_SHA256}"
            test "$(sha256sum "${OFFICIAL_PHYSTWIN_RUNTIME_REPAIR_PATH}" | awk '{print $1}')" \
              = "${OFFICIAL_PHYSTWIN_RUNTIME_REPAIR_SHA256}"
            test "$(sha256sum "${CASE_STDIN_ISOLATION_REPAIR_PATH}" | awk '{print $1}')" \
              = "${CASE_STDIN_ISOLATION_REPAIR_SHA256}"
            test "$(sha256sum "${CASE_STDIN_MARKER_BOOTSTRAP_REPAIR_PATH}" | awk '{print $1}')" \
              = "${CASE_STDIN_MARKER_BOOTSTRAP_REPAIR_SHA256}"
            test "$(sha256sum "${OFFICIAL_PHYSTWIN_REPO}/env_install/env_install.sh" | awk '{print $1}')" \
              = "${PRIMARY_PYNPUT_UPSTREAM_ENVIRONMENT_SHA256}"
            test "$(sha256sum "${OFFICIAL_PHYSTWIN_REPO}/qqtt/engine/trainer_warp.py" | awk '{print $1}')" \
              = "${PRIMARY_PYNPUT_TRAINER_SHA256}"
            test "$(sha256sum "${PREVIOUS_FALLBACK_CONFIG_PATH}" | awk '{print $1}')" \
              = "${PREVIOUS_FALLBACK_CONFIG_FILE_SHA256}"
            test "$(sha256sum "${CORRECTED_FALLBACK_CONFIG_PATH}" | awk '{print $1}')" \
              = "${CORRECTED_FALLBACK_CONFIG_FILE_SHA256}"
            "${PRIMARY_BOOTSTRAP_PYTHON}" - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          expected = (
              (
                  os.environ["PREVIOUS_FALLBACK_CONFIG_PATH"],
                  os.environ["PREVIOUS_FALLBACK_CONFIG_CANONICAL_SHA256"],
                  False,
              ),
              (
                  os.environ["CORRECTED_FALLBACK_CONFIG_PATH"],
                  os.environ["CORRECTED_FALLBACK_CONFIG_CANONICAL_SHA256"],
                  True,
              ),
          )
          for path_raw, expected_digest, method_required in expected:
              payload = json.loads(Path(path_raw).read_text(encoding="utf-8"))
              canonical = json.dumps(
                  payload["config"],
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              ).encode("utf-8")
              digest = hashlib.sha256(canonical).hexdigest()
              if digest != payload.get("config_sha256") or digest != expected_digest:
                  raise SystemExit(f"fallback config canonical identity changed: {path_raw}")
              has_method = isinstance(payload["config"].get("method"), dict)
              if has_method is not method_required:
                  raise SystemExit(f"fallback config role changed: {path_raw}")
          PY
            test "$(sha256sum scripts/ci/dispatch_deform360_v6_source_python.sh | awk '{print $1}')" \
              = "${DISPATCHER_SHA256}"
            test "$(sha256sum _deform360_physical/pyproject.toml | awk '{print $1}')" \
              = "${DEFORM360_PROCESSING_PYPROJECT_SHA256}"
            test "$(git -C "${OFFICIAL_PHYSTWIN_REPO}" rev-parse HEAD:gaussian_splatting/submodules/simple-knn)" \
              = "${OFFICIAL_PHYSTWIN_SIMPLE_KNN_TREE_OID}"
            test "$(git -C "${OFFICIAL_PHYSTWIN_REPO}" rev-parse HEAD:gaussian_splatting/submodules/diff-gaussian-rasterization)" \
              = "${OFFICIAL_PHYSTWIN_RASTERIZER_TREE_OID}"
            test -x "${OFFICIAL_PHYSTWIN_CUDA_HOME}/bin/nvcc"
            "${OFFICIAL_PHYSTWIN_CUDA_HOME}/bin/nvcc" --version \
              | grep -F "V${OFFICIAL_PHYSTWIN_CUDA_TOOLKIT_VERSION}"

            primary_runtime="${RUNNER_TEMP}/deform360-v6-primary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            frame_zero_runtime="${RUNNER_TEMP}/deform360-v6-frame-zero-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            dispatcher="${RUNNER_TEMP}/deform360-v6-python-dispatch-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            marker="${RUNNER_TEMP}/deform360-v6-frame-zero-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
            config_repair_marker="${RUNNER_TEMP}/deform360-v6-fallback-config-repair-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
            official_runtime_marker="${RUNNER_TEMP}/deform360-v6-official-phystwin-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
            case_stdin_isolation_marker="${RUNNER_TEMP}/deform360-v6-case-stdin-isolation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
            official_bootstrap_marker="${RUNNER_TEMP}/deform360-v6-official-phystwin-bootstrap-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
            official_build_root="${RUNNER_TEMP}/deform360-v6-official-phystwin-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            official_wheelhouse="${RUNNER_TEMP}/deform360-v6-official-phystwin-wheels-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            official_binary_requirements="${RUNNER_TEMP}/deform360-v6-official-phystwin-binary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
            official_iopath_requirement="${RUNNER_TEMP}/deform360-v6-official-phystwin-iopath-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
            pytorch3d_wheel="${RUNNER_TEMP}/pytorch3d-0.7.8-cp310-cp310-linux_x86_64.whl"
            constraints="${RUNNER_TEMP}/deform360-v6-frame-zero-constraints-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
            cma_requirement="${RUNNER_TEMP}/deform360-v6-primary-cma-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
            pynput_requirements="${RUNNER_TEMP}/deform360-v6-primary-pynput-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
            test ! -e "${primary_runtime}"
            test ! -e "${frame_zero_runtime}"
            test ! -e "${dispatcher}"
            test ! -e "${marker}"
            test ! -e "${config_repair_marker}"
            test ! -e "${official_runtime_marker}"
            test ! -e "${case_stdin_isolation_marker}"
            test ! -e "${official_bootstrap_marker}"
            test ! -e "${official_build_root}"
            test ! -e "${official_wheelhouse}"
            test ! -e "${official_binary_requirements}"
            test ! -e "${official_iopath_requirement}"
            test ! -e "${pytorch3d_wheel}"
            test ! -e "${constraints}"
            test ! -e "${cma_requirement}"
            test ! -e "${pynput_requirements}"

            "${PRIMARY_BOOTSTRAP_PYTHON}" -m venv \
              --copies --system-site-packages "${primary_runtime}"
            primary_python="${primary_runtime}/bin/python"
            "${primary_python}" -m pip install \
              "pip==25.2" \
              "setuptools==80.9.0" \
              "wheel==0.45.1"
            "${primary_python}" -m pip install -e ".[graph,vision]"
            "${primary_python}" -m pip install -e "./_deform360_physical[processing]"
            SAM2_BUILD_CUDA=0 \
              "${primary_python}" -m pip install -e ./_sam2
            "${primary_python}" -m pip install \
              "virtualenv==21.7.4" \
              "fpsample>=0.3" \
              "h5py>=3.8" \
              "hydra-core>=1.3.2" \
              "imageio>=2.34" \
              "iopath>=0.1.10" \
              "networkx>=3.0" \
              "pillow>=9.4" \
              "plyfile>=1.0" \
              "scipy>=1.10" \
              "tqdm>=4.66" \
              "trimesh>=4.0" \
              "warp-lang>=1.6" \
              "yourdfpy>=0.0.56"
            printf '%s\n' \
              "cma==${PRIMARY_CMA_VERSION} --hash=sha256:${PRIMARY_CMA_WHEEL_SHA256}" \
              > "${cma_requirement}"
            "${primary_python}" -m pip install \
              --no-deps \
              --only-binary=:all: \
              --require-hashes \
              --requirement "${cma_requirement}"
            printf '%s\n' \
              "pynput==${PRIMARY_PYNPUT_VERSION} --hash=sha256:${PRIMARY_PYNPUT_WHEEL_SHA256}" \
              "evdev==${PRIMARY_EVDEV_VERSION} --hash=sha256:${PRIMARY_EVDEV_SDIST_SHA256}" \
              "python-xlib==${PRIMARY_PYTHON_XLIB_VERSION} --hash=sha256:${PRIMARY_PYTHON_XLIB_WHEEL_SHA256}" \
              "six==${PRIMARY_SIX_VERSION} --hash=sha256:${PRIMARY_SIX_WHEEL_SHA256}" \
              > "${pynput_requirements}"
            "${primary_python}" -m pip install \
              --no-build-isolation \
              --only-binary=pynput,python-xlib,six \
              --no-binary=evdev \
              --require-hashes \
              --requirement "${pynput_requirements}"
            set +e
            primary_pip_check="$("${primary_python}" -m pip check 2>&1)"
            primary_pip_status=$?
            set -e
            printf '%s\n' "${primary_pip_check}"
            test "${primary_pip_status}" -eq 1
            test "$(printf '%s\n' "${primary_pip_check}" | wc -l)" -eq 1
            test "${primary_pip_check}" = "${EXPECTED_PRIMARY_PIP_CHECK_CONFLICT}"

            "${FRAME_ZERO_BOOTSTRAP_PYTHON}" -m venv \
              --copies "${frame_zero_runtime}"
            frame_zero_python="${frame_zero_runtime}/bin/python"
            "${frame_zero_python}" -m pip install \
              "pip==25.2" \
              "setuptools==80.9.0" \
              "wheel==0.45.1"
            "${frame_zero_python}" -m pip install \
              "numpy==${FRAME_ZERO_NUMPY_VERSION}"
            "${frame_zero_python}" -m pip install \
              --index-url "${PYTORCH_CU121_INDEX}" \
              --extra-index-url https://pypi.org/simple \
              "torch==${FRAME_ZERO_TORCH_VERSION}" \
              "torchvision==${FRAME_ZERO_TORCHVISION_VERSION}"
            "${frame_zero_python}" -m pip install \
              --no-deps \
              --index-url "${GSPLAT_PT24_CU121_INDEX}" \
              "gsplat==${FRAME_ZERO_GSPLAT_VERSION}"
            printf '%s\n' \
              "numpy==${FRAME_ZERO_NUMPY_VERSION}" \
              "torch==${FRAME_ZERO_TORCH_VERSION}" \
              "torchvision==${FRAME_ZERO_TORCHVISION_VERSION}" \
              "gsplat==${FRAME_ZERO_GSPLAT_VERSION}" \
              "nerfstudio==${FRAME_ZERO_NERFSTUDIO_VERSION}" \
              "opencv-python-headless==4.10.0.84" \
              "opencv-contrib-python==4.10.0.84" \
              > "${constraints}"
            PIP_CONSTRAINT="${constraints}" \
              "${frame_zero_python}" -m pip install -e ".[graph,vision]"
            PIP_CONSTRAINT="${constraints}" \
              "${frame_zero_python}" -m pip install \
                "nerfstudio==${FRAME_ZERO_NERFSTUDIO_VERSION}"
            PIP_CONSTRAINT="${constraints}" \
              "${frame_zero_python}" -m pip install -e \
                "./_deform360_physical[processing]"

            printf '%s\n' \
              "ninja==${OFFICIAL_PHYSTWIN_NINJA_VERSION} --hash=sha256:${OFFICIAL_PHYSTWIN_NINJA_WHEEL_SHA256}" \
              "warp-lang==${OFFICIAL_PHYSTWIN_WARP_VERSION} --hash=sha256:${OFFICIAL_PHYSTWIN_WARP_WHEEL_SHA256}" \
              "kornia==${OFFICIAL_PHYSTWIN_KORNIA_VERSION} --hash=sha256:${OFFICIAL_PHYSTWIN_KORNIA_WHEEL_SHA256}" \
              "kornia_rs==${OFFICIAL_PHYSTWIN_KORNIA_RS_VERSION} --hash=sha256:${OFFICIAL_PHYSTWIN_KORNIA_RS_WHEEL_SHA256}" \
              "einops==${OFFICIAL_PHYSTWIN_EINOPS_VERSION} --hash=sha256:${OFFICIAL_PHYSTWIN_EINOPS_WHEEL_SHA256}" \
              "portalocker==${OFFICIAL_PHYSTWIN_PORTALOCKER_VERSION} --hash=sha256:${OFFICIAL_PHYSTWIN_PORTALOCKER_WHEEL_SHA256}" \
              > "${official_binary_requirements}"
            "${frame_zero_python}" -m pip install \
              --no-deps \
              --only-binary=:all: \
              --require-hashes \
              --requirement "${official_binary_requirements}"
            printf '%s\n' \
              "iopath==${OFFICIAL_PHYSTWIN_IOPATH_VERSION} --hash=sha256:${OFFICIAL_PHYSTWIN_IOPATH_SDIST_SHA256}" \
              > "${official_iopath_requirement}"
            "${frame_zero_python}" -m pip install \
              --no-build-isolation \
              --no-deps \
              --no-binary=iopath \
              --require-hashes \
              --requirement "${official_iopath_requirement}"
            "${frame_zero_python}" -m pip install \
              --no-deps \
              --only-binary=:all: \
              --require-hashes \
              --requirement "${cma_requirement}"
            "${frame_zero_python}" -m pip install \
              --no-build-isolation \
              --only-binary=pynput,python-xlib,six \
              --no-binary=evdev \
              --require-hashes \
              --requirement "${pynput_requirements}"

            curl --fail --location --proto '=https' --tlsv1.2 \
              --output "${pytorch3d_wheel}" \
              "${OFFICIAL_PHYSTWIN_PYTORCH3D_URL}"
            test "$(sha256sum "${pytorch3d_wheel}" | awk '{print $1}')" \
              = "${OFFICIAL_PHYSTWIN_PYTORCH3D_WHEEL_SHA256}"
            "${frame_zero_python}" -m pip install \
              --no-deps "${pytorch3d_wheel}"

            mkdir -p "${official_build_root}" "${official_wheelhouse}"
            cp -a \
              "${OFFICIAL_PHYSTWIN_REPO}/gaussian_splatting/submodules/simple-knn" \
              "${official_build_root}/simple-knn"
            cp -a \
              "${OFFICIAL_PHYSTWIN_REPO}/gaussian_splatting/submodules/diff-gaussian-rasterization" \
              "${official_build_root}/diff-gaussian-rasterization"
            CUDA_HOME="${OFFICIAL_PHYSTWIN_CUDA_HOME}" \
            PATH="${OFFICIAL_PHYSTWIN_CUDA_HOME}/bin:${PATH}" \
            MAX_JOBS="${OFFICIAL_PHYSTWIN_MAX_JOBS}" \
            NVCC_PREPEND_FLAGS="${OFFICIAL_PHYSTWIN_NVCC_PREPEND_FLAGS}" \
            TORCH_CUDA_ARCH_LIST="${OFFICIAL_PHYSTWIN_TORCH_CUDA_ARCH_LIST}" \
              "${frame_zero_python}" -m pip wheel \
                --no-build-isolation \
                --no-deps \
                --wheel-dir "${official_wheelhouse}" \
                "${official_build_root}/simple-knn"
            CUDA_HOME="${OFFICIAL_PHYSTWIN_CUDA_HOME}" \
            PATH="${OFFICIAL_PHYSTWIN_CUDA_HOME}/bin:${PATH}" \
            MAX_JOBS="${OFFICIAL_PHYSTWIN_MAX_JOBS}" \
            NVCC_PREPEND_FLAGS="${OFFICIAL_PHYSTWIN_NVCC_PREPEND_FLAGS}" \
            TORCH_CUDA_ARCH_LIST="${OFFICIAL_PHYSTWIN_TORCH_CUDA_ARCH_LIST}" \
              "${frame_zero_python}" -m pip wheel \
                --no-build-isolation \
                --no-deps \
                --wheel-dir "${official_wheelhouse}" \
                "${official_build_root}/diff-gaussian-rasterization"
            mapfile -t simple_knn_wheels < <(
              find "${official_wheelhouse}" -maxdepth 1 -type f \
                -name 'simple_knn-*.whl' -print | sort
            )
            mapfile -t rasterizer_wheels < <(
              find "${official_wheelhouse}" -maxdepth 1 -type f \
                -name 'diff_gaussian_rasterization-*.whl' -print | sort
            )
            test "${#simple_knn_wheels[@]}" -eq 1
            test "${#rasterizer_wheels[@]}" -eq 1
            simple_knn_wheel="${simple_knn_wheels[0]}"
            rasterizer_wheel="${rasterizer_wheels[0]}"
            simple_knn_wheel_sha256="$(sha256sum "${simple_knn_wheel}" | awk '{print $1}')"
            rasterizer_wheel_sha256="$(sha256sum "${rasterizer_wheel}" | awk '{print $1}')"
            "${frame_zero_python}" -m pip install \
              --no-deps "${simple_knn_wheel}" "${rasterizer_wheel}"
            test -z "$(git -C "${OFFICIAL_PHYSTWIN_REPO}" status --porcelain=v1)"
            "${frame_zero_python}" -m pip check

            install -m 700 \
              scripts/ci/dispatch_deform360_v6_source_python.sh \
              "${dispatcher}"
            test ! -L "${dispatcher}"
            test -x "${dispatcher}"

            REPAIR_ID="selector-repair-environment-probe-v1" \
            BPT_PRIMARY_PYTHON="${primary_python}" \
            BPT_FRAME_ZERO_PYTHON="${frame_zero_python}" \
            BPT_FRAME_ZERO_RUNTIME_MARKER="${marker}" \
            BPT_FRAME_ZERO_FALLBACK_CONFIG_REPAIR_MARKER="${config_repair_marker}" \
            BPT_OFFICIAL_PHYSTWIN_RUNTIME_MARKER="${official_runtime_marker}" \
            BPT_CASE_STDIN_ISOLATION_MARKER="${case_stdin_isolation_marker}" \
            "${dispatcher}" - <<'PY'
          from importlib.metadata import version
          import sys

          import bayesian_phystwin
          import cma
          import deform360
          import os
          from pynput import keyboard
          import sam2
          import torch
          import warp

          if not torch.cuda.is_available():
              raise SystemExit("primary CUDA runtime is unavailable")
          if version("torch") != "2.5.1+cu121":
              raise SystemExit("primary Torch runtime identity changed")
          if version("SAM-2") != "1.0":
              raise SystemExit("primary SAM2 runtime identity changed")
          if version("virtualenv") != "21.7.4":
              raise SystemExit("primary virtualenv identity changed")
          if version("cma") != os.environ["PRIMARY_CMA_VERSION"]:
              raise SystemExit("primary CMA runtime identity changed")
          if not callable(cma.CMAEvolutionStrategy):
              raise SystemExit("primary CMA import probe failed")
          expected_pynput = {
              "evdev": os.environ["PRIMARY_EVDEV_VERSION"],
              "pynput": os.environ["PRIMARY_PYNPUT_VERSION"],
              "python-xlib": os.environ["PRIMARY_PYTHON_XLIB_VERSION"],
              "six": os.environ["PRIMARY_SIX_VERSION"],
          }
          observed_pynput = {name: version(name) for name in expected_pynput}
          if observed_pynput != expected_pynput:
              raise SystemExit(
                  f"primary pynput runtime identity changed: {observed_pynput!r}"
              )
          if os.environ.get("PYNPUT_BACKEND") != "dummy":
              raise SystemExit("primary pynput backend is not headless")
          if "pynput.keyboard._dummy" not in sys.modules:
              raise SystemExit("primary pynput dummy backend was not selected")
          if not callable(keyboard.Listener):
              raise SystemExit("primary pynput import probe failed")
          if os.environ.get("REPAIR_ID") != "selector-repair-environment-probe-v1":
              raise SystemExit("dispatcher changed an inherited repair identity")
          print(version("torch"))
          print(version("SAM-2"))
          print(version("cma"))
          print(observed_pynput)
          print(version("bayesian-phystwin"))
          print(version("deform360"))
          print(warp.__version__)
          print(bayesian_phystwin.__file__)
          print(deform360.__file__)
          print(sam2.__file__)
          PY
            test ! -e "${case_stdin_isolation_marker}"

            BPT_OFFICIAL_PHYSTWIN_BOOTSTRAP_MARKER="${official_bootstrap_marker}" \
            SIMPLE_KNN_WHEEL_SHA256="${simple_knn_wheel_sha256}" \
            RASTERIZER_WHEEL_SHA256="${rasterizer_wheel_sha256}" \
              "${frame_zero_python}" - <<'PY'
          from importlib.metadata import version
          import json
          import os
          from pathlib import Path
          import sys

          import bayesian_phystwin
          import cma
          import deform360
          from diff_gaussian_rasterization import (
              GaussianRasterizationSettings,
              GaussianRasterizer,
          )
          from gsplat.cuda._backend import _C
          from nerfstudio.configs import method_configs
          from nerfstudio.scripts import exporter
          from pynput import keyboard
          from simple_knn._C import distCUDA2
          import torch

          expected = {
              "cma": os.environ["PRIMARY_CMA_VERSION"],
              "diff-gaussian-rasterization": "0.0.0",
              "einops": os.environ["OFFICIAL_PHYSTWIN_EINOPS_VERSION"],
              "numpy": "1.26.4",
              "iopath": os.environ["OFFICIAL_PHYSTWIN_IOPATH_VERSION"],
              "kornia": os.environ["OFFICIAL_PHYSTWIN_KORNIA_VERSION"],
              "kornia_rs": os.environ["OFFICIAL_PHYSTWIN_KORNIA_RS_VERSION"],
              "ninja": os.environ["OFFICIAL_PHYSTWIN_NINJA_VERSION"],
              "portalocker": os.environ["OFFICIAL_PHYSTWIN_PORTALOCKER_VERSION"],
              "pynput": os.environ["PRIMARY_PYNPUT_VERSION"],
              "pytorch3d": os.environ["OFFICIAL_PHYSTWIN_PYTORCH3D_VERSION"],
              "simple_knn": "0.0.0",
              "torch": "2.4.0+cu121",
              "torchvision": "0.19.0+cu121",
              "warp-lang": os.environ["OFFICIAL_PHYSTWIN_WARP_VERSION"],
              "gsplat": "1.4.0+pt24cu121",
              "nerfstudio": "1.1.5",
          }
          observed = {name: version(name) for name in expected}
          if observed != expected:
              raise SystemExit(f"frame-zero runtime identity changed: {observed!r}")
          if not torch.cuda.is_available():
              raise SystemExit("frame-zero CUDA runtime is unavailable")
          if torch.version.cuda != "12.1":
              raise SystemExit("official PhysTwin Torch CUDA identity changed")
          if torch.cuda.get_device_capability() != (8, 9):
              raise SystemExit("official PhysTwin CUDA architecture changed")
          if _C is None or not hasattr(_C, "CameraModelType"):
              raise SystemExit("precompiled gsplat CUDA backend is unavailable")
          if not callable(distCUDA2):
              raise SystemExit("simple-knn CUDA extension is unavailable")
          if not callable(GaussianRasterizationSettings) or not callable(
              GaussianRasterizer
          ):
              raise SystemExit("Gaussian rasterizer CUDA extension is unavailable")
          if not callable(cma.CMAEvolutionStrategy):
              raise SystemExit("official PhysTwin CMA import probe failed")
          if "pynput.keyboard._dummy" not in sys.modules or not callable(
              keyboard.Listener
          ):
              raise SystemExit("official PhysTwin headless pynput probe failed")
          if "splatfacto" not in method_configs.method_configs:
              raise SystemExit("nerfstudio splatfacto method is unavailable")
          if not hasattr(exporter, "ExportGaussianSplat"):
              raise SystemExit("nerfstudio Gaussian exporter is unavailable")
          official_root = Path(os.environ["OFFICIAL_PHYSTWIN_REPO"]).resolve()
          if not official_root.is_dir() or official_root.is_symlink():
              raise SystemExit("frozen official PhysTwin checkout is unavailable")
          sys.path.insert(0, str(official_root))
