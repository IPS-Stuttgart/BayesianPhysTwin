              ],
              "repair_id": os.environ["CASE_STDIN_MARKER_BOOTSTRAP_REPAIR_ID"],
              "repair_path": os.environ[
                  "CASE_STDIN_MARKER_BOOTSTRAP_REPAIR_PATH"
              ],
          }
          canonical = json.dumps(
              receipt,
              sort_keys=True,
              separators=(",", ":"),
              allow_nan=False,
          ).encode("utf-8")
          receipt["receipt_id"] = hashlib.sha256(canonical).hexdigest()
          path.write_text(
              json.dumps(receipt, indent=2, sort_keys=True, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Retain bounded runner diagnostics
        if: always()
        shell: bash
        env:
          BPT_SOURCE_SHA: ${{ github.sha }}
          EVIDENCE_ROOT: ${{ runner.temp }}
          RUNTIME_LOG: ${{ runner.temp }}/deform360-v6-dual-runtime-bootstrap.log
        run: |
          set -euo pipefail
          compact="${EVIDENCE_ROOT}/deform360-v6-source-prediction-evidence"
          logs="${compact}/logs"
          run_root="${RESULTS_ROOT}/bayesian-phystwin/deform360-v6-source-prediction/${AMENDMENT_ID}/${BPT_SOURCE_SHA}"
          mkdir -p "${logs}"
          test ! -L "${compact}"
          test ! -L "${logs}"
          if [[ -f "${RUNTIME_LOG}" && ! -L "${RUNTIME_LOG}" ]]; then
            tail -c 64000 "${RUNTIME_LOG}" > "${logs}/dual-runtime-bootstrap.log"
          fi
          if [[ -d "${run_root}/logs" ]]; then
            while IFS= read -r log; do
              target="${logs}/$(basename "${log}")"
              test ! -L "${target}"
              tail -c 64000 "${log}" > "${target}"
            done < <(find "${run_root}/logs" -type f -name '*.log' | sort)
          fi
          rm -f "${compact}/SHA256SUMS"
          (
            cd "${compact}"
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
            sha256sum --check SHA256SUMS >/dev/null
          )

      - name: Upload compact source prediction evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deform360-v6-source-prediction-dual-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deform360-v6-source-prediction-evidence
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
          overwrite: false

      - name: Publish bounded source receipt to issue 148
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RECEIPT_PATH: ${{ runner.temp }}/deform360-v6-source-prediction-evidence/execution-receipt.json
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          test -f "${RECEIPT_PATH}"
          test ! -L "${RECEIPT_PATH}"
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          receipt = json.loads(Path(os.environ["RECEIPT_PATH"]).read_text())
          runtime = receipt["runtime_frame_zero_precompiled_cuda"]
          namespace = receipt["runtime_dispatch_namespace_repair"]
          config_route = receipt["runtime_fallback_config_routing_repair"]
          cma_runtime = receipt["runtime_primary_cma_import_dependency"]
          pynput_runtime = receipt["runtime_primary_pynput_import_dependency"]
          official_runtime = receipt["runtime_official_phystwin_py310"]
          stdin_isolation = receipt["runtime_case_subprocess_stdin_isolation"]
          body = f"""## Deform360 v6 dual-runtime source evidence: `{receipt['status']}`

          - workflow run: `{receipt['workflow_run_id']}`, attempt `{receipt['workflow_run_attempt']}`
          - exact protected-main revision: `{receipt['source_revision']}`
          - receipt ID: `{receipt['receipt_id']}`
          - terminal stage: `{receipt['terminal_stage']}`
          - exit code: `{receipt['exit_code']}`
          - physical manifests: `{receipt['physical_manifest_count']}/10`
          - sealed source predictions: `{receipt['source_prediction_seal_count']}/100`
          - frame-zero precompiled CUDA runtime activated: `{str(runtime['activated']).lower()}`
          - frame-zero gsplat: `{runtime['gsplat_version']}`
          - dispatcher namespace repair activated: `{str(namespace['activated']).lower()}`
          - fallback-config routing repair activated: `{str(config_route['activated']).lower()}`
          - primary CMA import dependency activated: `{str(cma_runtime['activated']).lower()}`
          - primary headless pynput dependency activated: `{str(pynput_runtime['activated']).lower()}`
          - official PhysTwin Python 3.10 bootstrap passed: `{str(official_runtime['bootstrap_probe_passed']).lower()}`
          - physical-prior Python 3.10 route activated: `{str(official_runtime['physical_prior_stage_activated']).lower()}`
          - per-case subprocess stdin isolation activated: `{str(stdin_isolation['activated']).lower()}`
          - simple-knn source tree: `{official_runtime['simple_knn_tree_oid']}`
          - Gaussian rasterizer source tree: `{official_runtime['diff_gaussian_rasterization_tree_oid']}`
          - Actions artifact ID: `{os.environ.get('ARTIFACT_ID') or 'unknown'}`
          - development suffix opened: `false`
          - v5 confirmation payloads opened: `false`
          - v6 fresh target selected: `false`
          - v6 target payloads opened: `false`
          - v6 target outcomes used: `false`
          - replacement allowed: `false`

          This run routes frame-zero reconstruction and the physical-prior stage through the upstream-compatible Python 3.10/Torch 2.4 runtime. It builds the two Gaussian CUDA extensions from exact frozen PhysTwin source trees outside that checkout, replaces the uniquely matched stale integration-report argument with the already-frozen initializer specification, and admits only hash-pinned downloaded dependencies. Registered per-case subprocess entry points receive closed standard input so they cannot consume the frozen object-roster stream; generic dispatcher calls retain their existing stdin behavior. Interactive keyboard control is disabled and the registered optimizer and physical arm are unchanged. It cannot score the development suffix, select a fresh v6 cohort, open target data, or authorize a claim.
          """
          request = urllib.request.Request(
              (
                  "https://api.github.com/repos/"
                  f"{os.environ['GITHUB_REPOSITORY']}/issues/"
                  f"{os.environ['ISSUE_NUMBER']}/comments"
              ),
              data=json.dumps({"body": body}).encode("utf-8"),
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 201:
                  raise SystemExit(f"unexpected issue API status: {response.status}")
          PY

      - name: Enforce terminal source status
        if: always()
        shell: bash
        env:
          RECEIPT_PATH: ${{ runner.temp }}/deform360-v6-source-prediction-evidence/execution-receipt.json
        run: |
          set -euo pipefail
          test -f "${RECEIPT_PATH}"
          test ! -L "${RECEIPT_PATH}"
          status=$(python -c 'import json,os; print(json.load(open(os.environ["RECEIPT_PATH"]))["status"])')
          case "${status}" in
            source-prediction-evidence-sealed)
              exit 0
              ;;
            source-inputs-incomplete)
              exit 3
              ;;
            *)
              exit 1
              ;;
          esac
