name: Harden full-22 exact-head concurrency

on:
  push:
    branches:
      - agent/full22-discrepancy-tournament-orchestrator-v1-current
    paths:
      - .github/workflows/harden-full22-exact-head-concurrency.yml

permissions:
  contents: write

concurrency:
  group: harden-full22-exact-head-concurrency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harden:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.ref ==
      'refs/heads/agent/full22-discrepancy-tournament-orchestrator-v1-current'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/full22-discrepancy-tournament-orchestrator-v1-current
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Scope long evidence runs to the exact source head
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path(
              ".github/workflows/"
              "full22-discrepancy-candidate-tournament-v1.yml"
          )
          text = workflow.read_text(encoding="utf-8")
          old = """concurrency:
            group: full22-discrepancy-tournament-v1-${{ github.ref }}
            cancel-in-progress: true
          """
          new = """concurrency:
            group: >-
              full22-discrepancy-tournament-v1-${{
                github.event.pull_request.head.sha || github.sha
              }}
            cancel-in-progress: true
          """
          if text.count(old) != 1:
              raise SystemExit("unexpected full-22 concurrency block")
          workflow.write_text(text.replace(old, new, 1), encoding="utf-8")

          tests = Path("tests/test_full22_discrepancy_candidate_tournament_v1.py")
          test_text = tests.read_text(encoding="utf-8")
          marker = "def test_workflow_concurrency_is_scoped_to_exact_source_head()"
          if marker in test_text:
              raise SystemExit("exact-head concurrency regression already exists")
          test_lines = [
              "",
              "",
              "def test_workflow_concurrency_is_scoped_to_exact_source_head() -> None:",
              "    workflow_path = (",
              "        REPOSITORY_ROOT",
              "        / \".github\"",
              "        / \"workflows\"",
              "        / \"full22-discrepancy-candidate-tournament-v1.yml\"",
              "    )",
              "    workflow = workflow_path.read_text(encoding=\"utf-8\")",
              "    concurrency = workflow.split(\"concurrency:\\n\", 1)[1].split(",
              "        \"\\nenv:\\n\", 1",
              "    )[0]",
              "",
              "    assert (",
              "        \"github.event.pull_request.head.sha || github.sha\"",
              "        in concurrency",
              "    )",
              "    assert \"github.ref\" not in concurrency",
              "    assert \"cancel-in-progress: true\" in concurrency",
          ]
          tests.write_text(
              test_text.rstrip() + "\n".join(test_lines) + "\n",
              encoding="utf-8",
          )

          Path(
              ".github/workflows/harden-full22-exact-head-concurrency.yml"
          ).unlink()
          PY

      - name: Validate the concurrency repair
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev,graph]"
          python -m ruff format \
            tests/test_full22_discrepancy_candidate_tournament_v1.py
          python -m ruff check \
            scripts/science/run_full22_discrepancy_candidate_tournament_v1.py \
            tests/test_full22_discrepancy_candidate_tournament_v1.py
          python -m ruff format --check \
            scripts/science/run_full22_discrepancy_candidate_tournament_v1.py \
            tests/test_full22_discrepancy_candidate_tournament_v1.py
          python -m pytest -q \
            tests/test_full22_discrepancy_candidate_tournament_v1.py \
            tests/test_pull_request_workflow_integrity.py
          git diff --check

      - name: Publish the repair and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            .github/workflows/harden-full22-exact-head-concurrency.yml \
            .github/workflows/full22-discrepancy-candidate-tournament-v1.yml \
            tests/test_full22_discrepancy_candidate_tournament_v1.py
          git diff --cached --check
          git commit -m "Scope full-22 concurrency to exact source head"
          git push origin \
            HEAD:agent/full22-discrepancy-tournament-orchestrator-v1-current
