name: Temporary report covariance-only coverage gaps

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temporary-register-covariance-coverage.yml"
      - "tests/test_covariance_only_hybrid_adversarial.py"
  push:
    branches:
      - agent/full22-covariance-only-hybrid-v1
    paths:
      - ".github/workflows/temporary-register-covariance-coverage.yml"
      - "tests/test_covariance_only_hybrid_adversarial.py"

permissions:
  contents: read

concurrency:
  group: temporary-report-covariance-coverage-gaps
  cancel-in-progress: true

jobs:
  report:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/full22-covariance-only-hybrid-v1
          fetch-depth: 1
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Print exact missing lines and branches
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev,graph]"
          python -m pip install "coverage==7.13.3"
          python -m ruff check tests/test_covariance_only_hybrid_adversarial.py
          python -m ruff format --check tests/test_covariance_only_hybrid_adversarial.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_covariance_only_hybrid.py \
            tests/test_covariance_only_hybrid_adversarial.py \
            tests/test_full22_covariance_only_hybrid_v1.py
          python -m coverage run --branch --source=bayesian_phystwin \
            -m pytest -q \
            tests/test_covariance_only_hybrid.py \
            tests/test_covariance_only_hybrid_adversarial.py \
            tests/test_full22_covariance_only_hybrid_v1.py
          python -m coverage json -o focused-coverage.json
          python - <<'PY'
          import json

          report = json.load(open('focused-coverage.json', encoding='utf-8'))
          paths = (
              'src/bayesian_phystwin/covariance_only_hybrid.py',
              'src/bayesian_phystwin/covariance_only_hybrid_analysis.py',
          )
          for path in paths:
              record = report['files'][path]
              summary = record['summary']
              lines = 100.0 * summary['covered_lines'] / summary['num_statements']
              branches = (
                  100.0 * summary['covered_branches'] / summary['num_branches']
                  if summary['num_branches']
                  else 100.0
              )
              print(f'FILE {path}')
              print(f'LINES {lines:.2f}%')
              print(f'BRANCHES {branches:.2f}%')
              print('MISSING_LINES', record.get('missing_lines', []))
              print('MISSING_BRANCHES', record.get('missing_branches', []))
          PY
