name: Temporary register covariance-only coverage

on:
  push:
    branches:
      - agent/full22-covariance-only-hybrid-v1
    paths:
      - ".github/workflows/temporary-register-covariance-coverage.yml"

permissions:
  contents: write

concurrency:
  group: temporary-register-covariance-coverage
  cancel-in-progress: true

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/full22-covariance-only-hybrid-v1
          fetch-depth: 1
          persist-credentials: true
          clean: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Register and validate focused coverage
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev,graph]"
          python -m pip install "coverage==7.13.3"
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('.github/quality/test-suites.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          suite = payload['suites']['stable-core-coverage']
          additions = [
              'tests/test_covariance_only_hybrid.py',
              'tests/test_full22_covariance_only_hybrid_v1.py',
          ]
          anchor = 'tests/test_calibration.py'
          position = suite.index(anchor) + 1
          for member in reversed(additions):
              if member not in suite:
                  suite.insert(position, member)
          path.write_text(
              json.dumps(payload, indent=2, sort_keys=False) + '\n',
              encoding='utf-8',
          )
          PY
          python tools/quality/test_suite_manifest.py validate --json
          python -m coverage run --branch --source=bayesian_phystwin \
            -m pytest -q \
            tests/test_covariance_only_hybrid.py \
            tests/test_full22_covariance_only_hybrid_v1.py
          python -m coverage json -o focused-coverage.json
          python - <<'PY'
          import json

          report = json.load(open('focused-coverage.json', encoding='utf-8'))
          required = {
              'src/bayesian_phystwin/covariance_only_hybrid.py': (90.0, 80.0),
              'src/bayesian_phystwin/covariance_only_hybrid_analysis.py': (90.0, 80.0),
          }
          for path, (line_floor, branch_floor) in required.items():
              summary = report['files'][path]['summary']
              lines = 100.0 * summary['covered_lines'] / summary['num_statements']
              branches = (
                  100.0 * summary['covered_branches'] / summary['num_branches']
                  if summary['num_branches']
                  else 100.0
              )
              print(f'{path}: lines={lines:.2f}%, branches={branches:.2f}%')
              if lines < line_floor or branches < branch_floor:
                  raise SystemExit(
                      f'focused coverage below floor for {path}: '
                      f'lines={lines:.2f}%, branches={branches:.2f}%'
                  )
          PY
          rm .github/workflows/temporary-register-covariance-coverage.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/quality/test-suites.json \
            .github/workflows/temporary-register-covariance-coverage.yml
          git commit -m "Register covariance-only tests for stable coverage"
          git push origin HEAD:agent/full22-covariance-only-hybrid-v1
