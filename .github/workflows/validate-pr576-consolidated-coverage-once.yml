name: Validate PR 576 consolidated coverage once

on:
  push:
    branches:
      - agent/registered-residual-history-single-path-v1

permissions:
  contents: write

concurrency:
  group: validate-pr576-consolidated-coverage-once
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'IPS-Stuttgart/BayesianPhysTwin'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/registered-residual-history-single-path-v1
          fetch-depth: 1
          persist-credentials: true

      - name: Format, test, and enforce focused coverage
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pip install 'coverage[toml]>=7.6'
          python -m ruff check --fix \
            tests/test_portable_contracts_deform360_registered_residual_history_v1.py
          python -m ruff format \
            tests/test_portable_contracts_deform360_registered_residual_history_v1.py
          python -m ruff check \
            src/bayesian_phystwin/deform360_registered_residual_history_v1.py \
            tests/test_portable_contracts_deform360_registered_residual_history_v1.py
          python -m mypy \
            src/bayesian_phystwin/deform360_registered_residual_history_v1.py
          python -m coverage erase
          python -m coverage run --branch --source=bayesian_phystwin -m pytest -q \
            tests/test_portable_contracts_deform360_registered_residual_history_v1.py
          python -m coverage json -o /tmp/pr576-coverage.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/pr576-coverage.json').read_text())
          suffix = 'deform360_registered_residual_history_v1.py'
          rows = [value for key, value in report['files'].items() if key.endswith(suffix)]
          if len(rows) != 1:
              raise SystemExit(f'expected one coverage row, found {len(rows)}')
          summary = rows[0]['summary']
          lines = 100.0 * summary['covered_lines'] / summary['num_statements']
          branches = 100.0 * summary['covered_branches'] / summary['num_branches']
          print(f'focused line coverage: {lines:.2f}%')
          print(f'focused branch coverage: {branches:.2f}%')
          if lines < 90.0 or branches < 80.0:
              raise SystemExit('focused coverage remains below repository floors')
          PY
          git diff --check

      - name: Commit permanent formatting and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/validate-pr576-consolidated-coverage-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Validate consolidated residual-history coverage'
          git push origin HEAD:agent/registered-residual-history-single-path-v1
