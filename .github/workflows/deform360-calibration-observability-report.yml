name: Deform360 calibration observability report contracts

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deform360-calibration-observability-report.yml"
      - "docs/deform360_calibration_observability_report.md"
      - "scripts/science/build_deform360_calibration_observability_report.py"
      - "src/bayesian_phystwin/deform360_calibration_observability_report.py"
      - "tests/test_deform360_calibration_observability_report.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deform360-calibration-observability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  contracts:
    name: Object-balanced calibration report / Python ${{ matrix.python-version }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Create isolated validation environment
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/deform360-observability-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.python-version }}"
          python -m venv "${root}/venv"
          echo "OBSERVABILITY_ROOT=${root}" >> "${GITHUB_ENV}"
          echo "${root}/venv/bin" >> "${GITHUB_PATH}"

      - name: Install exact source and quality checks
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1"
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Record exact environment
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "revision=$(git rev-parse HEAD)"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            python --version
            python -m pip --version
            python -m pip freeze --all
          } | tee "${OBSERVABILITY_ROOT}/environment.txt"

      - name: Check focused source quality
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/bayesian_phystwin/deform360_calibration_observability_report.py
            scripts/science/build_deform360_calibration_observability_report.py
            tests/test_deform360_calibration_observability_report.py
          )
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy \
            src/bayesian_phystwin/deform360_calibration_observability_report.py \
            scripts/science/build_deform360_calibration_observability_report.py

      - name: Run focused and adjacent contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -p no:cacheprovider \
            tests/test_deform360_calibration_observability_report.py \
            tests/test_observability_diagnostics.py \
            tests/test_deform360_calibration_execution.py \
            tests/test_deform360_calibration_source_run_record.py \
            | tee "${OBSERVABILITY_ROOT}/pytest.txt"
          python -m py_compile \
            src/bayesian_phystwin/deform360_calibration_observability_report.py \
            scripts/science/build_deform360_calibration_observability_report.py \
            tests/test_deform360_calibration_observability_report.py

      - name: Verify exact read-only repository state
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"

      - name: Upload compact contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deform360-calibration-observability-${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.OBSERVABILITY_ROOT }}/environment.txt
            ${{ env.OBSERVABILITY_ROOT }}/pytest.txt
          if-no-files-found: warn
          retention-days: 30
