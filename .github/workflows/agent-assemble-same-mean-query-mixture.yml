name: Assemble same-mean query mixture source

on:
  push:
    branches:
      - agent/same-mean-query-mixture-v1
    paths:
      - .agent-payload/READY

permissions:
  contents: write

concurrency:
  group: agent-same-mean-query-mixture-v1
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact staging branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/same-mean-query-mixture-v1
          fetch-depth: 1
          persist-credentials: true

      - name: Verify and extract the reviewed payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .agent-payload -maxdepth 1 -type f -name 'payload.part*' | wc -l)" -eq 5
          printf '%s  %s\n' \
            25d78135d5d76dd041c344d7bffc2ee584bb510b946e294b48371459e70dcb5a .agent-payload/payload.part00 \
            8c5ae0b4bb71cf31a2ca5b296a1bbd0e951f0ff7f61381b4e25a47c7710f8cf0 .agent-payload/payload.part01 \
            8a98924e4678f6dd0257e9d4dca2c1069e6b7b0dc97c5e6768e31ebbbc2785a5 .agent-payload/payload.part02 \
            1f0efd648c0812a32409e34dbccac538fe83815d9e43db03965a6042729edc26 .agent-payload/payload.part03 \
            60e7f776d0fe43c9fdd95ee9efe7473831a2df1eb8c6515b989714339d2b0cfc .agent-payload/payload.part04 \
            | sha256sum --check -
          cat .agent-payload/payload.part* > /tmp/payload.b64
          base64 --decode /tmp/payload.b64 > /tmp/payload.tar.gz
          printf '%s  %s\n' \
            69f37764d1a93dc097f148f8ab787cf3c9df0b40f9a4b6489970403646f9649b \
            /tmp/payload.tar.gz \
            | sha256sum --check -
          python - <<'PY'
          from pathlib import Path
          import shutil
          import tarfile

          expected = [
              "docs/predictive_query_mixture_v1.md",
              "src/bayesian_phystwin/predictive_query_mixture.py",
              "src/bayesian_phystwin/query_density_calibration.py",
              "tests/test_covariance_only_hybrid_mixture_v1.py",
              "tests/test_query_calibration_mixture_density_v1.py",
          ]
          with tarfile.open("/tmp/payload.tar.gz", "r:gz") as archive:
              members = archive.getmembers()
              names = sorted(member.name for member in members)
              if names != expected:
                  raise SystemExit(f"payload paths differ: {names}")
              if any(not member.isfile() for member in members):
                  raise SystemExit("payload contains a non-regular member")
              for member in members:
                  target = Path(member.name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit(f"cannot read {member.name}")
                  with source, target.open("wb") as destination:
                      shutil.copyfileobj(source, destination)
          PY
          python -m compileall -q \
            src/bayesian_phystwin/predictive_query_mixture.py \
            src/bayesian_phystwin/query_density_calibration.py \
            tests/test_covariance_only_hybrid_mixture_v1.py \
            tests/test_query_calibration_mixture_density_v1.py
          git diff --check

      - name: Publish the assembled source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/predictive_query_mixture_v1.md \
            src/bayesian_phystwin/predictive_query_mixture.py \
            src/bayesian_phystwin/query_density_calibration.py \
            tests/test_covariance_only_hybrid_mixture_v1.py \
            tests/test_query_calibration_mixture_density_v1.py
          git rm -r .agent-payload
          git commit -m "Add same-mean predictive query mixture"
          git push origin HEAD:agent/same-mean-query-mixture-v1
