name: ClaimBundle paper handoff

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/claim-bundle-paper-handoff.yml"
      - "src/bayesian_phystwin/paper_handoff_v1.py"
      - "src/bayesian_phystwin/cli/claim_bundle.py"
      - "tests/test_paper_handoff_v1.py"
      - "tests/test_claim_bundle_cli_paper_handoff_compat.py"
      - "tests/test_claim_bundle_v1.py"
      - "docs/claim_bundle_v1.md"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/claim-bundle-paper-handoff.yml"
      - "src/bayesian_phystwin/paper_handoff_v1.py"
      - "src/bayesian_phystwin/cli/claim_bundle.py"
      - "tests/test_paper_handoff_v1.py"
      - "tests/test_claim_bundle_cli_paper_handoff_compat.py"
      - "tests/test_claim_bundle_v1.py"
      - "docs/claim_bundle_v1.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claim-bundle-paper-handoff-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  contracts:
    name: Artifact identity and compact-table rows
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true

      - name: Provision Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install validation environment
        run: |
          python -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1"
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Check source quality
        run: |
          python -m ruff check \
            src/bayesian_phystwin/paper_handoff_v1.py \
            src/bayesian_phystwin/cli/claim_bundle.py \
            tests/test_paper_handoff_v1.py \
            tests/test_claim_bundle_cli_paper_handoff_compat.py
          python -m ruff format --check \
            src/bayesian_phystwin/paper_handoff_v1.py \
            src/bayesian_phystwin/cli/claim_bundle.py \
            tests/test_paper_handoff_v1.py \
            tests/test_claim_bundle_cli_paper_handoff_compat.py
          python -m mypy \
            src/bayesian_phystwin/paper_handoff_v1.py \
            src/bayesian_phystwin/cli/claim_bundle.py

      - name: Run focused and adjacent contracts
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_paper_handoff_v1.py \
            tests/test_claim_bundle_cli_paper_handoff_compat.py \
            tests/test_claim_bundle_v1.py
          python -m py_compile \
            src/bayesian_phystwin/paper_handoff_v1.py \
            src/bayesian_phystwin/cli/claim_bundle.py \
            tests/test_paper_handoff_v1.py \
            tests/test_claim_bundle_cli_paper_handoff_compat.py
          python -m pip check

      - name: Verify clean repository state
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"
