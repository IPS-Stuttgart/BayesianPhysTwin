name: PR 655 MyPy repair

on:
  push:
    branches:
      - feature/newton-mpm-backend-v1

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/newton-mpm-backend-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Remove stale MyPy ignores and validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("src/bayesian_phystwin/_newton_mpm_runtime.py"): (
                  "        rot=wp.quat_identity(),  # type: ignore[call-arg]\n",
                  "        rot=wp.quat_identity(),\n",
              ),
              Path("src/bayesian_phystwin/physical_rollout_v1.py"): (
                  "    np.lib.format.write_array(  # type: ignore[no-untyped-call]\n",
                  "    np.lib.format.write_array(\n",
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"expected exactly one stale ignore in {path}, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python -m ruff check \
            src/bayesian_phystwin/_newton_mpm_runtime.py \
            src/bayesian_phystwin/physical_rollout_v1.py
          python -m ruff format --check \
            src/bayesian_phystwin/_newton_mpm_runtime.py \
            src/bayesian_phystwin/physical_rollout_v1.py
          python -m mypy \
            src/bayesian_phystwin/_newton_mpm_runtime.py \
            src/bayesian_phystwin/physical_rollout_v1.py
          git rm .github/workflows/pr655-mypy-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayesian_phystwin/_newton_mpm_runtime.py \
            src/bayesian_phystwin/physical_rollout_v1.py
          git commit -m "Remove stale MyPy ignores from Newton MPM path"
          git push origin HEAD:feature/newton-mpm-backend-v1
