# workflow-lifecycle: temporary
# workflow-owner: IPS-Stuttgart maintainers
name: Fix query-probe certificate typing once

on:
  push:
    branches:
      - feature/query-probe-certificate-v1
    paths:
      - ".github/workflows/fix-query-probe-mypy-once.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/query-probe-certificate-v1
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Apply typing repair and verify
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/bayesian_phystwin/query_probe_certificate_v1.py")
          text = path.read_text()
          text = text.replace(
              "import itertools\nfrom numbers import Integral, Real\nfrom typing import Final, NamedTuple, TypeAlias, cast\n",
              "import itertools\nimport math\nfrom collections.abc import Iterable\nfrom numbers import Integral, Real\nfrom typing import Final, NamedTuple, TypeAlias, cast\n",
          )
          text = text.replace(
              '''def _finite_nonnegative(value: object, *, name: str) -> float:
              if isinstance(value, (bool, np.bool_)) or not isinstance(value, Real):
                  raise ValueError(f"{name} must be a finite nonnegative real number")
              result = float(value)
              if not np.isfinite(result) or result < 0.0:
                  raise ValueError(f"{name} must be a finite nonnegative real number")
              return result
          ''',
              '''def _finite_nonnegative(value: object, *, name: str) -> float:
              if isinstance(value, (bool, np.bool_)) or not isinstance(value, Real):
                  raise ValueError(f"{name} must be a finite nonnegative real number")
              scalar: float = float(value)
              if not math.isfinite(scalar) or scalar < 0.0:
                  raise ValueError(f"{name} must be a finite nonnegative real number")
              return scalar
          ''',
          )
          text = text.replace(
              '''def _positive_integer(value: object, *, name: str) -> int:
              if isinstance(value, (bool, np.bool_)) or not isinstance(value, Integral):
                  raise ValueError(f"{name} must be a positive integer")
              result = int(value)
              if result <= 0:
                  raise ValueError(f"{name} must be a positive integer")
              return result
          ''',
              '''def _positive_integer(value: object, *, name: str) -> int:
              if isinstance(value, (bool, np.bool_)) or not isinstance(value, Integral):
                  raise ValueError(f"{name} must be a positive integer")
              scalar: int = int(value)
              if scalar <= 0:
                  raise ValueError(f"{name} must be a positive integer")
              return scalar
          ''',
          )
          text = text.replace(
              '''def _probe_sequence(value: object) -> tuple[object, ...]:
              try:
                  probes = tuple(cast(object, value))  # type: ignore[arg-type]
              except TypeError as error:
                  raise ValueError("probe_likelihoods must be an iterable of matrices") from error
              return probes
          ''',
              '''def _probe_sequence(value: object) -> tuple[object, ...]:
              if isinstance(value, (str, bytes)) or not isinstance(value, Iterable):
                  raise ValueError("probe_likelihoods must be an iterable of matrices")
              return tuple(cast(Iterable[object], value))
          ''',
          )
          old = '''    probe_certificates = tuple(
              query_probe_certificate(
                  prior_weights,
                  quotient_weights,
                  class_index,
                  losses,
                  likelihood,
                  probe_cost=float(cost),
                  regret_tolerance=regret_tolerance,
                  max_policy_count=policy_cap,
              )
              for likelihood, cost in zip(probes, costs, strict=True)
          )
          '''
          new = '''    probe_certificate_list: list[QueryProbeCertificateV1] = []
              for probe_index, likelihood in enumerate(probes):
                  probe_certificate_list.append(
                      query_probe_certificate(
                          prior_weights,
                          quotient_weights,
                          class_index,
                          losses,
                          likelihood,
                          probe_cost=float(costs[probe_index]),
                          regret_tolerance=regret_tolerance,
                          max_policy_count=policy_cap,
                      )
                  )
              probe_certificates = tuple(probe_certificate_list)
          '''
          if old not in text:
              raise SystemExit("probe certificate construction block changed")
          text = text.replace(old, new)
          old = '''        else:
                  route = "probe"
                  selected_direct = None
                  selected_probe = probe_indices[selected_meta]
                  probe_policy_index = policy_indices[selected_meta]
                  selected_policy = _immutable_int64(
                      probe_certificates[selected_probe].contingent_action_indices[
                          probe_policy_index
                      ]
                  )
          '''
          new = '''        else:
                  route = "probe"
                  selected_direct = None
                  selected_probe_value = int(probe_indices[selected_meta])
                  probe_policy_index = int(policy_indices[selected_meta])
                  selected_probe = selected_probe_value
                  selected_policy = _immutable_int64(
                      probe_certificates[
                          selected_probe_value
                      ].contingent_action_indices[probe_policy_index]
                  )
          '''
          if old not in text:
              raise SystemExit("selected probe block changed")
          path.write_text(text.replace(old, new))
          PY
          python -m pip install -e '.[dev]'
          python -m ruff format \
            src/bayesian_phystwin/query_probe_certificate_v1.py \
            tests/test_query_probe_certificate_v1.py
          python -m ruff check \
            src/bayesian_phystwin/query_probe_certificate_v1.py \
            tests/test_query_probe_certificate_v1.py
          python -m mypy --strict src/bayesian_phystwin/query_probe_certificate_v1.py
          python -m pytest -q \
            tests/test_query_probe_certificate_v1.py \
            tests/test_query_decision_certificate_v1.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayesian_phystwin/query_probe_certificate_v1.py \
            tests/test_query_probe_certificate_v1.py
          git commit -m "Fix exact query-probe certificate typing"
          git push origin HEAD:feature/query-probe-certificate-v1
