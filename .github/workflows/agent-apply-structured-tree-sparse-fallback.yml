name: Apply structured tree-sparse fallback

on:
  pull_request:
    branches: [main]
    paths:
      - .github/agent-patches/apply_structured_tree_sparse_fallback.py
      - .github/workflows/agent-apply-structured-tree-sparse-fallback.yml
      - src/bayesian_phystwin/structured_gauge_aware_result.py
      - src/bayesian_phystwin/tree_sparse_structured_gauge_prob4d.py
      - docs/structured_tree_sparse_fallback.md

permissions:
  contents: write

concurrency:
  group: structured-tree-sparse-finalize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/structured-tree-sparse-fallback' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          clean: true
          fetch-depth: 1
          show-progress: false

      - name: Verify exact reviewed head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"

      - name: Apply final source patch and remove publication scaffolding
        shell: bash
        run: |
          set -euo pipefail
          python .github/agent-patches/apply_structured_tree_sparse_fallback.py
          rm .github/agent-patches/apply_structured_tree_sparse_fallback.py
          rm .github/workflows/agent-apply-structured-tree-sparse-fallback.yml

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development environment
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir -e ".[dev]"
          python -m pip check

      - name: Format and validate focused implementation
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/bayesian_phystwin/sparse_prior_aware_gauge_belief.py
            src/bayesian_phystwin/structured_gauge_aware_result.py
            src/bayesian_phystwin/tree_sparse_structured_gauge_prob4d.py
            tests/test_tree_sparse_explicit_gauge_prob4d.py
          )
          python -m ruff format "${files[@]}"
          python -m ruff check --fix --unsafe-fixes "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m mypy --python-version 3.12 \
            src/bayesian_phystwin/sparse_prior_aware_gauge_belief.py \
            src/bayesian_phystwin/structured_gauge_aware_result.py \
            src/bayesian_phystwin/tree_sparse_structured_gauge_prob4d.py
          python -m pytest -q \
            tests/test_tree_sparse_explicit_gauge_prob4d.py \
            tests/test_sparse_prior_aware_gauge_belief.py \
            tests/test_tree_sparse_prob4d_roundtrip.py \
            tests/test_prospective_prob4d_update.py
          python -m compileall -q src/bayesian_phystwin tests
          git diff --check

      - name: Commit structured result implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && {
            echo 'structured fallback finalizer produced no changes' >&2
            exit 1
          }
          git commit -m 'Add structured tree-sparse fallback results'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
