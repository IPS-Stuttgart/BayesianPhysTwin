name: Repair tree-separator parity typing

on:
  push:
    branches: [agent/tree-separator-shadow-parity-v1]

permissions:
  contents: write

concurrency:
  group: repair-tree-separator-parity-typing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.ref == 'refs/heads/agent/tree-separator-shadow-parity-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/tree-separator-shadow-parity-v1
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Normalize NumPy scalar typing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/bayesian_phystwin/tree_separator_gaussian_parity.py")
          text = path.read_text(encoding="utf-8")
          marker = "np.finfo(np.float64).tiny"
          replacement = "float(np.finfo(np.float64).tiny)"
          if text.count(marker) != 2 or replacement in text:
              raise SystemExit("unexpected minimum-scale marker counts")
          path.write_text(text.replace(marker, replacement), encoding="utf-8")
          Path(".github/workflows/repair-tree-separator-parity-typing.yml").unlink()
          PY
      - name: Validate focused typing repair
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff check \
            src/bayesian_phystwin/tree_separator_gaussian_parity.py \
            tests/test_tree_separator_gaussian_parity.py
          python -m ruff format --check \
            src/bayesian_phystwin/tree_separator_gaussian_parity.py \
            tests/test_tree_separator_gaussian_parity.py
          python -m mypy src/bayesian_phystwin/tree_separator_gaussian_parity.py
          python -m pytest -q \
            tests/test_tree_separator_gaussian_parity.py \
            tests/test_structured_point_covariance_tree_separator_gaussian.py \
            tests/test_structured_point_covariance_tree_block_coverage_edges.py \
            tests/test_structured_point_covariance_tree_block_operator.py \
            tests/test_tree_block_sparse_gauge_belief.py \
            tests/test_structured_point_covariance_causal4d_tree_block_provider.py \
            tests/test_portable_contracts_tree_block_strict_admission.py
          git diff --check
      - name: Publish typing repair and remove workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayesian_phystwin/tree_separator_gaussian_parity.py \
            .github/workflows/repair-tree-separator-parity-typing.yml
          git diff --cached --check
          git commit -m "Fix tree-separator parity scale typing"
          git push origin HEAD:agent/tree-separator-shadow-parity-v1
