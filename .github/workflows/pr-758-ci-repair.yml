# workflow-lifecycle: permanent
# workflow-owner: IPS-Stuttgart maintainers
name: PR 758 CI repair

on:
  push:
    branches:
      - experiment/simulation-based-calibration-v1
    paths:
      - ".github/workflows/pr-758-ci-repair.yml"

permissions:
  contents: write

concurrency:
  group: pr-758-ci-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply deterministic CI repairs and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path("src/bayesian_phystwin_experiments/simulation_based_calibration_v1.py")
          text = source.read_text(encoding="utf-8")
          old = (
              "    if isinstance(value, list):\n"
              "        return [\n"
              "            _canonicalize_result_numbers(item, decimal_places) for item in value\n"
              "        ]\n"
              "    if isinstance(value, tuple):\n"
              "        return [\n"
              "            _canonicalize_result_numbers(item, decimal_places) for item in value\n"
              "        ]\n"
          )
          new = (
              "    if isinstance(value, list):\n"
              "        return [_canonicalize_result_numbers(item, decimal_places) for item in value]\n"
              "    if isinstance(value, tuple):\n"
              "        return [_canonicalize_result_numbers(item, decimal_places) for item in value]\n"
          )
          if text.count(old) != 1:
              raise SystemExit("expected Ruff-format target not found exactly once")
          source.write_text(text.replace(old, new, 1), encoding="utf-8")

          temporary = Path(".github/workflows/simulation-based-calibration-v1.yml")
          if not temporary.is_file():
              raise SystemExit("registered temporary workflow is already absent")
          temporary.unlink()

          Path(".github/workflows/pr-758-ci-repair.yml").unlink()
          PY
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair simulation calibration CI"
          git push origin "HEAD:${GITHUB_REF_NAME}"
