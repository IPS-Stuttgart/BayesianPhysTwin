# workflow-lifecycle: permanent
# workflow-owner: IPS-Stuttgart maintainers
name: PR 759 final immutable-action pin

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/pr-759-final-pin.yml"

permissions:
  contents: write

concurrency:
  group: pr-759-final-immutable-action-pin
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Pin the final action and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/deform360-calibration-visual-production.yml")
          old = "actions/setup-python@v7"
          new = "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0"
          text = path.read_text(encoding="utf-8")
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one remaining {old!r}, found {count}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          Path(".github/workflows/pr-759-final-pin.yml").unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/deform360-calibration-visual-production.yml
          git add -u .github/workflows/pr-759-final-pin.yml
          git commit -m "Pin final calibration workflow action"
          echo "REPAIR_COMMIT=$(git rev-parse HEAD)"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
