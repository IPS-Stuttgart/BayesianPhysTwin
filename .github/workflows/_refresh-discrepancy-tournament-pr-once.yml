name: Refresh discrepancy tournament PR once

on:
  push:
    branches:
      - agent/discrepancy-candidate-tournament-v1
    paths:
      - .github/workflows/_refresh-discrepancy-tournament-pr-once.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/_refresh-discrepancy-tournament-pr-once.yml

permissions:
  contents: write

concurrency:
  group: refresh-discrepancy-tournament-pr-once
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      ((github.event_name == 'push' &&
        github.ref == 'refs/heads/agent/discrepancy-candidate-tournament-v1') ||
       (github.event_name == 'pull_request' &&
        github.head_ref == 'agent/discrepancy-candidate-tournament-v1'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/discrepancy-candidate-tournament-v1
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Merge current main and resolve known additive overlap
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = \
            "agent/discrepancy-candidate-tournament-v1"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status="$?"
          set -e
          if [[ "${merge_status}" -ne 0 ]]; then
            git checkout --theirs -- \
              src/bayesian_phystwin/posterior_covariance_semantics.py \
              MANIFEST.in
            grep -qxF \
              'include docs/discrepancy_candidate_tournament_v1.md' \
              MANIFEST.in || \
              printf '\ninclude docs/discrepancy_candidate_tournament_v1.md\n' \
                >> MANIFEST.in
            git add \
              src/bayesian_phystwin/posterior_covariance_semantics.py \
              MANIFEST.in
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          rm .github/workflows/_refresh-discrepancy-tournament-pr-once.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Merge current main into discrepancy tournament branch"
          git push origin HEAD:agent/discrepancy-candidate-tournament-v1
