name: Symmetry-complete three-repository chain v1

on:
  push:
    branches:
      - research/symmetry-complete-action-gate-v1
      - main
    paths:
      - ".github/workflows/symmetry-complete-crossrepo-chain-v1.yml"
      - "src/bayesian_phystwin/symmetry_complete_action_gate_v1.py"
      - "tests/test_symmetry_complete_action_gate_v1.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/symmetry-complete-crossrepo-chain-v1.yml"
      - "src/bayesian_phystwin/symmetry_complete_action_gate_v1.py"
      - "tests/test_symmetry_complete_action_gate_v1.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: symmetry-complete-crossrepo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  PROB4D_REF: research/symmetry-complete-belief-v1
  CAUSAL4D_REF: research/shared-gauge-intervention-receipt-v1

jobs:
  chain:
    name: Prob4D to Causal4D to BayesianPhysTwin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact BayesianPhysTwin revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Retrieve the companion research branches
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$PROB4D_REF" \
            https://github.com/IPS-Stuttgart/Prob4D.git \
            "$RUNNER_TEMP/Prob4D"
          git clone --depth 1 --branch "$CAUSAL4D_REF" \
            https://github.com/IPS-Stuttgart/Causal4D.git \
            "$RUNNER_TEMP/Causal4D"
          git -C "$RUNNER_TEMP/Prob4D" rev-parse HEAD > "$RUNNER_TEMP/prob4d-head.txt"
          git -C "$RUNNER_TEMP/Causal4D" rev-parse HEAD > "$RUNNER_TEMP/causal4d-head.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/bayesian-phystwin-head.txt"
      - name: Install the three NumPy execution surfaces
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e .
          python -m pip install -e "$RUNNER_TEMP/Prob4D"
          python -m pip install -e "$RUNNER_TEMP/Causal4D"
          python -m pip check
      - name: Produce the portable Causal4D receipt
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/symmetry-complete-crossrepo"
          mkdir -p "$root"
          python "$RUNNER_TEMP/Causal4D/scripts/science/run_shared_gauge_intervention_receipt_study_v1.py" \
            --output "$root/causal-result.json"
      - name: Verify the complete chain and tamper control
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/symmetry-complete-crossrepo"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          import numpy as np

          from bayesian_phystwin.symmetry_complete_action_gate_v1 import (
              act_or_fallback_symmetry_complete_v1,
          )
          from prob4d.equivariant_decision import certify_gauge_coupled_actions

          runner = Path(os.environ["RUNNER_TEMP"])
          root = runner / "symmetry-complete-crossrepo"
          causal_result = json.loads(
              (root / "causal-result.json").read_text(encoding="utf-8")
          )
          receipt = causal_result["portable_receipt"]

          losses = np.empty((1, 4, 3), dtype=np.float64)
          losses[0, :, :] = np.array([0.0, 2.0, 1.0])
          structural_certificate = certify_gauge_coupled_actions(
              losses,
              [1.0],
              cover_radius=0.0,
              pairwise_lipschitz=np.zeros((1, 3, 3)),
              fallback_action=2,
              regret_tolerance=0.0,
          )
          structural = structural_certificate.pairwise_upper_bound
          names = ("track-shared-frame", "orthogonal-shared-frame", "fallback")
          decision = act_or_fallback_symmetry_complete_v1(
              action_names=names,
              structural_pairwise_upper_bound=structural,
              structural_certificate_id="prob4d-crossrepo-c4-v1",
              state_evidence_id=receipt["state_evidence_id"],
              action_template_id=receipt["action_template_id"],
              loss_id=receipt["loss_id"],
              fallback_action=2,
              fallback_id=receipt["fallback_id"],
              causal4d_receipt=receipt,
              regret_tolerance=0.0,
              require_radius_scope="deterministic-complete",
          )

          tampered = json.loads(json.dumps(receipt))
          tampered["pairwise_realization_margin"][0][2] = 0.0
          invalid = act_or_fallback_symmetry_complete_v1(
              action_names=names,
              structural_pairwise_upper_bound=structural,
              structural_certificate_id="prob4d-crossrepo-c4-v1",
              state_evidence_id=receipt["state_evidence_id"],
              action_template_id=receipt["action_template_id"],
              loss_id=receipt["loss_id"],
              fallback_action=2,
              fallback_id=receipt["fallback_id"],
              causal4d_receipt=tampered,
              regret_tolerance=0.0,
              require_radius_scope="deterministic-complete",
          )

          checks = {
              "prob4d_structural_action_exact": bool(
                  structural_certificate.robustly_optimal[0]
                  and structural_certificate.worst_case_regret_upper_bound[0]
                  < 1e-12
              ),
              "causal4d_receipt_valid": bool(
                  causal_result["decision"]
                  == "controlled-shared-gauge-receipt-passed"
                  and all(causal_result["checks"].values())
              ),
              "bayesian_phystwin_executes_action": bool(
                  decision.valid_evidence
                  and decision.status == "verified-exact-optimal"
                  and decision.selected_action == 0
                  and decision.admitted
              ),
              "realization_margin_consumed_exactly": bool(
                  np.array_equal(
                      decision.realization_pairwise_margin,
                      np.asarray(receipt["pairwise_realization_margin"]),
                  )
              ),
              "tampered_receipt_returns_exact_fallback": bool(
                  not invalid.valid_evidence
                  and invalid.status == "invalid-fail-closed"
                  and invalid.selected_action == 2
                  and invalid.exact_fallback
              ),
          }
          assert all(checks.values()), checks
          heads = {
              "Prob4D": (runner / "prob4d-head.txt").read_text().strip(),
              "Causal4D": (runner / "causal4d-head.txt").read_text().strip(),
              "BayesianPhysTwin": (
                  runner / "bayesian-phystwin-head.txt"
              ).read_text().strip(),
          }
          result = {
              "schema": "symmetry-complete-three-repository-chain",
              "schema_version": 1,
              "decision": "three-repository-chain-passed",
              "repository_heads": heads,
              "prob4d": {
                  "structural_pairwise_upper_bound": structural.tolist(),
                  "worst_case_regret_upper_bound": (
                      structural_certificate.worst_case_regret_upper_bound.tolist()
                  ),
              },
              "causal4d": {
                  "contract_id": receipt["contract_id"],
                  "receipt_id": receipt["receipt_id"],
                  "pairwise_realization_margin": (
                      receipt["pairwise_realization_margin"]
                  ),
              },
              "bayesian_phystwin": {
                  "status": decision.status,
                  "total_pairwise_upper_bound": (
                      decision.total_pairwise_upper_bound.tolist()
                  ),
                  "worst_case_regret_upper_bound": (
                      decision.worst_case_regret_upper_bound.tolist()
                  ),
                  "selected_action": decision.selected_action,
                  "decision_record_id": decision.decision_record_id,
              },
              "tampered_receipt_control": {
                  "status": invalid.status,
                  "selected_action": invalid.selected_action,
                  "exact_fallback": invalid.exact_fallback,
              },
              "checks": checks,
              "claim_boundary": (
                  "Controlled cross-repository interface evidence only; no "
                  "physical-symmetry, provider, target, actuator, or safety claim."
              ),
          }
          canonical = json.dumps(
              result,
              sort_keys=True,
              separators=(",", ":"),
              allow_nan=False,
          )
          result["result_id"] = hashlib.sha256(
              canonical.encode("utf-8")
          ).hexdigest()
          (root / "chain-result.json").write_text(
              json.dumps(result, indent=2, sort_keys=True, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
          cp "$root/chain-result.json" "$root/chain-result-first.json"
          python - <<'PY'
          # Verify the retained result is valid JSON and content-addressed.
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "symmetry-complete-crossrepo"
          result = json.loads((root / "chain-result.json").read_text(encoding="utf-8"))
          result_id = result.pop("result_id")
          canonical = json.dumps(
              result,
              sort_keys=True,
              separators=(",", ":"),
              allow_nan=False,
          )
          assert hashlib.sha256(canonical.encode("utf-8")).hexdigest() == result_id
          PY
          sha256sum "$root"/*.json "$RUNNER_TEMP"/*-head.txt
      - name: Upload the complete cross-repository evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: symmetry-complete-crossrepo-${{ github.sha }}
          path: |
            ${{ runner.temp }}/symmetry-complete-crossrepo/
            ${{ runner.temp }}/prob4d-head.txt
            ${{ runner.temp }}/causal4d-head.txt
            ${{ runner.temp }}/bayesian-phystwin-head.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
