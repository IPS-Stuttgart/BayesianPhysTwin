name: Temporary Ruff format PR 762

on:
  push:
    branches:
      - feature/multi-action-trajectory-value-v1
    paths:
      - .github/workflows/temporary-ruff-format-pr762.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/multi-action-trajectory-value-v1
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Format exact changed Python files
        run: |
          python -m pip install --disable-pip-version-check ruff==0.16.4
          python -m ruff format \
            src/bayesian_phystwin_experiments/multi_action_query_identifiability_v1.py \
            src/bayesian_phystwin_experiments/trajectory_value_v1.py \
            tests/test_query_calibration_multi_action_v1.py \
            tests/test_trajectory_value_v1.py

      - name: Commit formatted files and remove temporary workflow
        run: |
          rm .github/workflows/temporary-ruff-format-pr762.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayesian_phystwin_experiments/multi_action_query_identifiability_v1.py \
            src/bayesian_phystwin_experiments/trajectory_value_v1.py \
            tests/test_query_calibration_multi_action_v1.py \
            tests/test_trajectory_value_v1.py \
            .github/workflows/temporary-ruff-format-pr762.yml
          git commit -m "Format multi-action and trajectory-value sources"
          git push origin HEAD:feature/multi-action-trajectory-value-v1
