name: Fix bias-aware v2 IRLS test budget once

on:
  push:
    branches:
      - fix/bias-aware-v2-irls-nonconvergence

permissions:
  contents: write

concurrency:
  group: fix-bias-aware-v2-irls-budget-once
  cancel-in-progress: false

jobs:
  fix:
    if: github.repository == 'IPS-Stuttgart/BayesianPhysTwin'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/bias-aware-v2-irls-nonconvergence
          fetch-depth: 1
          persist-credentials: true

      - name: Increase only the explicit compatibility-test budget
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_bias_aware_belief_v2_adversarial.py")
          text = path.read_text(encoding="utf-8")
          old = "        config=_v2_config(maximum_iterations=8),\n"
          new = "        config=_v2_config(maximum_iterations=32),\n"
          if text.count(old) != 1:
              raise SystemExit(f"expected one explicit IRLS budget, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          python -m pip install -e '.[dev]'
          python -m pytest -q \
            tests/test_bias_aware_belief_v2.py \
            tests/test_bias_aware_belief_v2_adversarial.py \
            tests/test_bias_aware_belief_v2_nonconvergence.py
          python -m ruff check \
            src/bayesian_phystwin/bias_aware_belief_v2.py \
            tests/test_bias_aware_belief_v2.py \
            tests/test_bias_aware_belief_v2_adversarial.py \
            tests/test_bias_aware_belief_v2_nonconvergence.py
          python -m ruff format --check \
            src/bayesian_phystwin/bias_aware_belief_v2.py \
            tests/test_bias_aware_belief_v2.py \
            tests/test_bias_aware_belief_v2_adversarial.py \
            tests/test_bias_aware_belief_v2_nonconvergence.py
          git diff --check

      - name: Commit the bounded test correction and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-bias-aware-v2-irls-budget-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/fix-bias-aware-v2-irls-budget-once.yml \
            tests/test_bias_aware_belief_v2_adversarial.py
          git commit -m 'Use a sufficient explicit IRLS compatibility budget'
          git push origin HEAD:fix/bias-aware-v2-irls-nonconvergence
