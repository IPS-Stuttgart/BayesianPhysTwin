name: Generate conformal complete-plan result v1

on:
  push:
    branches: [science/conformal-complete-plan-certificate-v1]
    paths:
      - ".github/requests/generate-conformal-complete-plan-result-v1.json"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 2
          clean: true
      - name: Authorize exact add-only generation request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          test "${PUSH_FORCED}" = false
          test "${BEFORE_SHA}" != 0000000000000000000000000000000000000000
          mapfile -t changed < <(git diff --name-status "${BEFORE_SHA}" "${GITHUB_SHA}")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = $'A\t.github/requests/generate-conformal-complete-plan-result-v1.json'
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          request = json.loads(
              Path(
                  ".github/requests/generate-conformal-complete-plan-result-v1.json"
              ).read_text(encoding="utf-8")
          )
          expected = {
              "schema": "bayesian-phystwin/result-generation-request-v1",
              "request_id": "generate-conformal-complete-plan-result-v1-20260902",
              "module": "experiments.conformal_complete_plan_certificate_v1.run",
              "scientific_change": False,
          }
          for key, value in expected.items():
              if request.get(key) != value:
                  raise SystemExit(f"invalid {key}: {request.get(key)!r}")
          if set(request) != set(expected) | {"expected_source_revision"}:
              raise SystemExit("generation request fields changed")
          parent = subprocess.check_output(
              ["git", "rev-parse", f"{os.environ['GITHUB_SHA']}^"], text=True
          ).strip()
          if request["expected_source_revision"] != parent:
              raise SystemExit("generation request is not bound to its exact parent")
          PY
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Generate and validate content-addressed result
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python -m pip install numpy==1.26.4 pytest ruff==0.16.5
          python -m experiments.conformal_complete_plan_certificate_v1.run
          python -m experiments.conformal_complete_plan_certificate_v1.run --check
          python -m pytest -q tests/test_conformal_complete_plan_certificate_v1.py
          python -m ruff check \
            src/bayesian_phystwin/conformal_complete_plan_certificate_v1.py \
            experiments/conformal_complete_plan_certificate_v1/run.py \
            tests/test_conformal_complete_plan_certificate_v1.py
          python -m ruff format --check \
            src/bayesian_phystwin/conformal_complete_plan_certificate_v1.py \
            experiments/conformal_complete_plan_certificate_v1/run.py \
            tests/test_conformal_complete_plan_certificate_v1.py
          git diff --check
      - name: Commit result and retire one-shot generator
        run: |
          set -euo pipefail
          rm -f \
            .github/requests/generate-conformal-complete-plan-result-v1.json \
            .github/workflows/generate-conformal-complete-plan-result-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            experiments/conformal_complete_plan_certificate_v1/result.json \
            .github/requests/generate-conformal-complete-plan-result-v1.json \
            .github/workflows/generate-conformal-complete-plan-result-v1.yml
          git commit -m 'Record conformal complete-plan phase diagram'
          git push origin HEAD:science/conformal-complete-plan-certificate-v1
