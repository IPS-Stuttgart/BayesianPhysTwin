name: Temporary exact tree-sparse test correction

on:
  push:
    branches:
      - agent/consume-claim-bearing-tree-sparse-prob4d
    paths:
      - .github/workflows/temporary-fix-tree-sparse-test.yml

permissions:
  contents: write

jobs:
  correct-test:
    if: github.repository == 'IPS-Stuttgart/BayesianPhysTwin'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          clean: true

      - name: Apply exact assertion correction and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          test_path = Path('tests/test_tree_sparse_explicit_gauge_prob4d.py')
          old = 'assert result.reason == "no-observation-support"'
          new = 'assert result.reason == "no-identifiable-query-state"'
          text = test_path.read_text(encoding='utf-8')
          if text.count(old) != 1:
              raise SystemExit('expected assertion was not present exactly once')
          test_path.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/temporary-fix-tree-sparse-test.yml').unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_tree_sparse_explicit_gauge_prob4d.py \
            .github/workflows/temporary-fix-tree-sparse-test.yml
          git diff --cached --check
          git commit -m 'Align tree-sparse fallback test with rejection order'
          git push origin "HEAD:${GITHUB_REF_NAME}"
