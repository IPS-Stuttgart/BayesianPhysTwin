name: Diagnose workstation2 backlog

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-workstation2-backlog.yml"

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'diagnostic/track-287509-push-run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Scan all active self-hosted jobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          api = f"https://api.github.com/repos/{repository}/actions"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "BayesianPhysTwin-read-only-backlog-diagnostic",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(url: str):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          found = []
          run_count = 0
          for status in ("in_progress", "queued"):
              for page in range(1, 11):
                  query = urllib.parse.urlencode(
                      {"status": status, "per_page": 100, "page": page}
                  )
                  runs = get(f"{api}/runs?{query}").get("workflow_runs", [])
                  if not runs:
                      break
                  run_count += len(runs)
                  for run in runs:
                      run_id = int(run["id"])
                      jobs = get(
                          f"{api}/runs/{run_id}/jobs?per_page=100"
                      ).get("jobs", [])
                      for job in jobs:
                          labels = job.get("labels") or []
                          runner = job.get("runner_name") or ""
                          if "self-hosted" not in labels and runner != "workstation2":
                              continue
                          item = (
                              status,
                              run_id,
                              run.get("name"),
                              run.get("head_sha"),
                              run.get("event"),
                              job.get("id"),
                              job.get("name"),
                              job.get("status"),
                              runner,
                              labels,
                              run.get("html_url"),
                          )
                          if item not in found:
                              found.append(item)
          print(f"active_runs_scanned={run_count}")
          print(f"self_hosted_jobs_found={len(found)}")
          for item in found:
              (
                  requested_status,
                  run_id,
                  run_name,
                  head_sha,
                  event,
                  job_id,
                  job_name,
                  job_status,
                  runner,
                  labels,
                  url,
              ) = item
              print(
                  "SELF_HOSTED "
                  f"requested_status={requested_status} run_id={run_id} "
                  f"run_name={run_name!r} head_sha={head_sha} event={event} "
                  f"job_id={job_id} job_name={job_name!r} "
                  f"job_status={job_status} runner_name={runner!r} "
                  f"labels={labels!r} url={url}"
              )
          PY
