# workflow-lifecycle: temporary
# workflow-owner: IPS-Stuttgart maintainers
name: Rematerialize statistical capability atlas once

on:
  push:
    branches: [feature/decision-capability-atlas-v1]
    paths:
      - ".github/workflows/rematerialize-statistical-capability-atlas.yml"

permissions:
  contents: write

concurrency:
  group: rematerialize-statistical-capability-atlas-v1
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.ref == 'refs/heads/feature/decision-capability-atlas-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/decision-capability-atlas-v1
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify and regenerate exact result
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          files=(
            src/bayesian_phystwin/decision_capability_atlas_v1.py
            src/bayesian_phystwin/decision_capability_task_uncertainty_v1.py
            src/bayesian_phystwin/decision_capability_calibration_v1.py
            tests/test_deform_dlo45_decision_capability_atlas_v1.py
            tests/test_deform_dlo45_decision_capability_task_uncertainty_v1.py
            tests/test_decision_capability_calibration_v1.py
            experiments/decision_capability_atlas_v1/run.py
            experiments/decision_capability_calibration_v1/run.py
          )
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy \
            src/bayesian_phystwin/decision_capability_atlas_v1.py \
            src/bayesian_phystwin/decision_capability_task_uncertainty_v1.py \
            src/bayesian_phystwin/decision_capability_calibration_v1.py
          python -m pytest -q \
            tests/test_deform_dlo45_decision_capability_atlas_v1.py \
            tests/test_deform_dlo45_decision_capability_task_uncertainty_v1.py \
            tests/test_decision_capability_calibration_v1.py
          python experiments/decision_capability_atlas_v1/run.py \
            --output experiments/decision_capability_atlas_v1/result.json
          python experiments/decision_capability_calibration_v1/run.py \
            --output experiments/decision_capability_calibration_v1/result.json
          python experiments/decision_capability_atlas_v1/run.py \
            --output "$RUNNER_TEMP/atlas.json" \
            --check experiments/decision_capability_atlas_v1/result.json
          python experiments/decision_capability_calibration_v1/run.py \
            --output "$RUNNER_TEMP/calibration.json" \
            --check experiments/decision_capability_calibration_v1/result.json

      - name: Commit results and remove launcher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Florian Pfaff"
          git config user.email "6773539+FlorianPfaff@users.noreply.github.com"
          git add \
            experiments/decision_capability_atlas_v1/result.json \
            experiments/decision_capability_calibration_v1/result.json
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate capability evidence on current main"
          fi
          git rm .github/workflows/rematerialize-statistical-capability-atlas.yml
          git commit -m "Remove temporary capability evidence rematerializer"
          git push origin HEAD:feature/decision-capability-atlas-v1
