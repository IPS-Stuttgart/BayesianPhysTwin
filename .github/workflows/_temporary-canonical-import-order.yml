name: Temporary canonical-contract import-order repair

on:
  push:
    branches: [refresh/claim-bundle-v1]
    paths:
      - .github/workflows/_temporary-canonical-import-order.yml

permissions:
  contents: write

concurrency:
  group: temporary-canonical-import-order-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.ref == 'refs/heads/refresh/claim-bundle-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Replace dynamic adversarial import with top-level alias
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_canonical_contracts.py")
          source = path.read_text(encoding="utf-8")
          old = '''import test_deform360_calibration_observability_case_builder as observability_cases
          adversarial_cases = importlib.import_module(
              "test_deform360_calibration_observability_case_builder_adversarial"
          )
          '''
          new = '''import test_deform360_calibration_observability_case_builder as observability_cases
          import test_deform360_calibration_observability_case_builder_adversarial as adversarial_cases
          '''
          if source.count(old) != 1:
              raise SystemExit("expected exactly one dynamic adversarial import")
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY
          python -m ruff check --fix tests/test_canonical_contracts.py
          python -m ruff format tests/test_canonical_contracts.py
          python -m py_compile tests/test_canonical_contracts.py
          git diff --check

      - name: Commit import-order repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tests/test_canonical_contracts.py
          git commit -m "Canonicalize stable-core test imports"
          git push origin HEAD:refresh/claim-bundle-v1
