# workflow-lifecycle: experimental
# workflow-owner: IPS-Stuttgart maintainers
name: DP local residual development pilot
on:
  push:
    branches: [experiment/dp-local-residual-pilot-20260907]
    paths: [.github/workflows/dp-local-residual-pilot.yml, experiments/dp_local_residual_pilot/**]
permissions:
  contents: read
concurrency:
  group: dp-local-residual-development-pilot
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Locate development metadata only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, hashlib
          from pathlib import Path
          roots = []
          for parent in (Path('/home/florianpfaff/source-only'), Path('/home/github-runner/.cache/workflows')):
              if parent.exists():
                  children = sorted(p for p in parent.iterdir() if p.is_dir() and ('deform' in p.name.lower() or 'dlo' in p.name.lower()))
                  print('WORKSPACES', [str(p) for p in children])
                  roots += [p for p in children if 'dlo2' in p.name.lower() or p.name == 'deform-bayesian-v1']
          for root in roots:
              for current, dirs, files in os.walk(root):
                  p = Path(current)
                  depth = len(p.relative_to(root).parts)
                  dirs[:] = sorted(d for d in dirs if d not in ('eval', 'test', '.git', '__pycache__', 'site-packages', 'node_modules') and not any(x in d.lower() for x in ('held', 'confirm', 'target')))
                  if depth >= 6:
                      dirs[:] = []
                  for f in sorted(files):
                      if f in ('training_validation_result.json', 'source_manifest.json', 'update_6400.pt', 'pyvenv.cfg'):
                          fp = p / f
                          print('INPUT', str(fp))
                          if f == 'training_validation_result.json':
                              data = fp.read_bytes()
                              print('TRAINING', hashlib.sha256(data).hexdigest(), data.decode())
                          if f == 'source_manifest.json':
                              data = fp.read_bytes()
                              print('MANIFEST', hashlib.sha256(data).hexdigest(), data.decode()[:2500])
          PY
