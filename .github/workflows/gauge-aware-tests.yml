name: Gauge-aware belief tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: >-
          python -m pytest -q
          tests/test_gauge_aware_belief.py
          tests/test_observation_belief_gauge_adapter.py
          tests/test_recursive_gauge_rbf_belief.py
          tests/test_phystwin_recursive_gauge_rbf_source.py
