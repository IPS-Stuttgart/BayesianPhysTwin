name: Temporary legacy sparse-result compatibility correction

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temporary-preserve-legacy-sparse-result.yml

permissions:
  contents: write

concurrency:
  group: temporary-legacy-sparse-result-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  correct:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/structured-tree-sparse-fallback'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          clean: true

      - name: Verify exact reviewed head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"

      - name: Preserve legacy diagnostics and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('src/bayesian_phystwin/sparse_prior_aware_gauge_belief.py')
          text = source.read_text(encoding='utf-8')

          fallback_old = '''    result_diagnostics = dict(diagnostics)
              result_diagnostics.update(
                  {
                      "result_covariance_representation": (
                          prior_covariance.representation
                          if structured
                          else DENSE_COVARIANCE_REPRESENTATION
                      ),
                      "result_dense_covariance_materialized": not structured,
                      "result_estimated_dense_covariance_bytes": (
                          prior_covariance.estimated_dense_bytes
                      ),
                      "result_stored_covariance_bytes_before_materialization": (
                          prior_covariance.stored_nbytes
                      ),
                  }
              )
          '''
          fallback_new = '''    result_diagnostics: Mapping[str, Any] = diagnostics
              if structured:
                  result_diagnostics = {
                      **diagnostics,
                      "result_covariance_representation": prior_covariance.representation,
                      "result_dense_covariance_materialized": False,
                      "result_estimated_dense_covariance_bytes": (
                          prior_covariance.estimated_dense_bytes
                      ),
                      "result_stored_covariance_bytes_before_materialization": (
                          prior_covariance.stored_nbytes
                      ),
                  }
          '''
          accepted_old = '''    diagnostics.update(
                  {
                      "result_covariance_representation": DENSE_COVARIANCE_REPRESENTATION,
                      "result_dense_covariance_materialized": True,
                      "result_estimated_dense_covariance_bytes": int(covariance.nbytes),
                      "result_stored_covariance_bytes_before_materialization": int(
                          covariance.nbytes
                      ),
                  }
              )
              legacy_result = GaugeAwareBeliefResult(
          '''
          accepted_new = '''    result_diagnostics: Mapping[str, Any] = diagnostics
              if _STRUCTURED_RESULT_MODE.get():
                  result_diagnostics = {
                      **diagnostics,
                      "result_covariance_representation": DENSE_COVARIANCE_REPRESENTATION,
                      "result_dense_covariance_materialized": True,
                      "result_estimated_dense_covariance_bytes": int(covariance.nbytes),
                      "result_stored_covariance_bytes_before_materialization": int(
                          covariance.nbytes
                      ),
                  }
              legacy_result = GaugeAwareBeliefResult(
          '''
          for old, new, label in (
              (fallback_old, fallback_new, 'fallback diagnostics'),
              (accepted_old, accepted_new, 'accepted diagnostics'),
          ):
              if text.count(old) != 1:
                  raise SystemExit(f'{label} target was not present exactly once')
              text = text.replace(old, new)
          legacy_diagnostics = '        diagnostics=diagnostics,\n        input_lineage={} if batch.metadata is None else batch.metadata,\n    )\n    if _STRUCTURED_RESULT_MODE.get():\n'
          structured_diagnostics = '        diagnostics=result_diagnostics,\n        input_lineage={} if batch.metadata is None else batch.metadata,\n    )\n    if _STRUCTURED_RESULT_MODE.get():\n'
          if text.count(legacy_diagnostics) != 1:
              raise SystemExit('accepted result diagnostics target changed')
          text = text.replace(legacy_diagnostics, structured_diagnostics)
          source.write_text(text, encoding='utf-8')

          tests = Path('tests/test_tree_sparse_explicit_gauge_prob4d.py')
          test_text = tests.read_text(encoding='utf-8')
          addition = '''

          def test_legacy_sparse_result_diagnostics_remain_content_compatible() -> None:
              from bayesian_phystwin.sparse_prior_aware_gauge_belief import (
                  update_sparse_prior_aware_gauge_belief,
                  update_sparse_prior_aware_gauge_belief_structured,
              )

              adapted = _build(_validated_observation())
              legacy = update_sparse_prior_aware_gauge_belief(
                  adapted.batch,
                  adapted.tree_gauge_design,
                  config=_config(),
              )
              structured = update_sparse_prior_aware_gauge_belief_structured(
                  adapted.batch,
                  adapted.tree_gauge_design,
                  config=_config(),
              )

              assert not any(key.startswith("result_") for key in legacy.diagnostics)
              assert structured.diagnostics["result_dense_covariance_materialized"] is True
              assert structured.diagnostics["result_covariance_representation"] == (
                  "dense-covariance-v1"
              )
          '''
          marker = 'def test_legacy_sparse_result_diagnostics_remain_content_compatible'
          if marker in test_text:
              raise SystemExit('legacy diagnostics compatibility test already exists')
          tests.write_text(test_text.rstrip() + addition + '\n', encoding='utf-8')

          Path('.github/workflows/temporary-preserve-legacy-sparse-result.yml').unlink()
          PY

          python -m pip install --no-cache-dir -e ".[dev]"
          python -m ruff format \
            src/bayesian_phystwin/sparse_prior_aware_gauge_belief.py \
            tests/test_tree_sparse_explicit_gauge_prob4d.py
          python -m ruff check \
            src/bayesian_phystwin/sparse_prior_aware_gauge_belief.py \
            tests/test_tree_sparse_explicit_gauge_prob4d.py
          python -m mypy --python-version 3.12 \
            src/bayesian_phystwin/sparse_prior_aware_gauge_belief.py
          python -m pytest -q tests/test_tree_sparse_explicit_gauge_prob4d.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bayesian_phystwin/sparse_prior_aware_gauge_belief.py \
            tests/test_tree_sparse_explicit_gauge_prob4d.py \
            .github/workflows/temporary-preserve-legacy-sparse-result.yml
          git diff --cached --check
          git commit -m 'Preserve legacy sparse-result identities'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
