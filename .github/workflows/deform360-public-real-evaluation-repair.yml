# workflow-lifecycle: permanent
# workflow-owner: IPS-Stuttgart maintainers
name: Deform360 public real evaluation repair

on:
  push:
    branches:
      - science/deform360-gpuserver4090-real-eval-v1
    paths:
      - .github/workflows/deform360-public-real-evaluation-repair.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deform360-public-real-evaluation-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  DATASET_ROOT: /mnt/seagate10tb/florianpfaff/datasets/deform360
  PROTOCOL: protocols/deform360_gpuserver4090_real_evaluation_v1.json

jobs:
  contracts:
    name: Repaired Deform360 evaluator smoke contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install contract dependencies
        run: python -m pip install numpy==1.26.4
      - name: Compile and execute a subprocess-isolated tactile fixture
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/science/run_deform360_gpuserver4090_real_evaluation_v1.py
          root="$RUNNER_TEMP/deform360-contract"
          rm -rf "$root"
          mkdir -p "$root/data/raw-repository/raw/001-rope/tactile_left"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import numpy as np

          root = Path(os.environ["RUNNER_TEMP"]) / "deform360-contract"
          tactile = root / "data/raw-repository/raw/001-rope/tactile_left"
          for record, phase in enumerate((0.0, 0.25, 0.5), start=1):
              frames = 80
              values = np.zeros((frames, 16, 32), dtype=np.float32)
              time = np.linspace(0.0, 4.0 * np.pi, frames)
              center = 8.0 + 4.0 * np.sin(time + phase)
              amplitude = 0.4 + 0.35 * (1.0 + np.sin(0.5 * time + phase))
              for index in range(frames):
                  column = int(np.clip(round(center[index]), 1, 29))
                  values[index, 4:9, column - 1:column + 2] = amplitude[index]
              path = tactile / f"sensor_{record:03d}.npy"
              values.tofile(path)
              np.save(tactile / f"median_{record:03d}.npy", np.zeros((16, 32), dtype=np.float32))
          protocol = json.loads(Path("protocols/deform360_gpuserver4090_real_evaluation_v1.json").read_text())
          protocol["dataset"]["root"] = str(root / "data")
          protocol["development_object_ids"] = ["001-rope"]
          protocol["forbidden_reserved_object_ids"] = ["999-reserved"]
          protocol["limits"].update({
              "maximum_objects": 1,
              "maximum_sensor_groups_per_object": 1,
              "maximum_source_recordings_per_group": 2,
              "maximum_frames_per_recording": 96,
              "minimum_frames_per_recording": 24,
              "forecast_horizon_frames": 4,
              "window_stride": 2,
              "bootstrap_repetitions": 100,
          })
          protocol["joint_uncertainty"].update({
              "maximum_low_rank": 3,
              "energy_score_samples": 8,
          })
          (root / "protocol.json").write_text(json.dumps(protocol))
          PY
          python scripts/science/run_deform360_gpuserver4090_real_evaluation_v1.py \
            --protocol "$root/protocol.json" \
            --dataset-root "$root/data" \
            --output-json "$root/result.json" \
            --output-report "$root/report.md"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads((Path(os.environ["RUNNER_TEMP"]) / "deform360-contract/result.json").read_text())
          assert result["status"] == "complete"
          assert result["summary"]["primary_modality"] == "tactile_response"
          assert result["summary"]["primary_object_count"] == 1
          assert result["completed_groups"][0]["source_fit_frozen_before_target_open"] is True
          assert result["paper_claim_authorized"] is False
          PY

  real-evaluation:
    name: Read-only repaired Deform360 scoring / gpuserver4090
    needs: contracts
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 180
    steps:
      - name: Check out exact revision with result-retention credential
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          clean: true
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Prepare isolated evaluation environment
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/science/deform360-gpuserver4090-real-eval-v1
          test -d "$DATASET_ROOT"
          test -r "$DATASET_ROOT"
          root="$RUNNER_TEMP/deform360-real-evaluation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf "$root"
          mkdir -p "$root/output"
          python -m venv "$root/venv"
          "$root/venv/bin/python" -m pip install numpy==1.26.4
          {
            echo "DEFORM360_RUN_ROOT=$root"
            echo "DEFORM360_PYTHON=$root/venv/bin/python"
            echo "DEFORM360_OUTPUT=$root/output"
          } >> "$GITHUB_ENV"
      - name: Execute the unchanged frozen real-data protocol
        shell: bash
        run: |
          set -euo pipefail
          "$DEFORM360_PYTHON" scripts/science/run_deform360_gpuserver4090_real_evaluation_v1.py \
            --protocol "$PROTOCOL" \
            --dataset-root "$DATASET_ROOT" \
            --output-json "$DEFORM360_OUTPUT/result.json" \
            --output-report "$DEFORM360_OUTPUT/report.md"
      - name: Verify and record compact evidence
        shell: bash
        run: |
          set -euo pipefail
          "$DEFORM360_PYTHON" - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads((Path(os.environ["DEFORM360_OUTPUT"]) / "result.json").read_text())
          assert result["status"] == "complete"
          assert result["summary"]["primary_object_count"] >= 1
          assert result["summary"]["completed_group_count"] >= 1
          assert result["carrier_inventory"]["reserved_object_payloads_opened"] is False
          assert result["dataset_mutated"] is False
          assert result["raw_data_uploaded"] is False
          assert result["paper_claim_authorized"] is False
          print(json.dumps(result["summary"], indent=2, sort_keys=True))
          PY
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "revision=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "runner_name=$RUNNER_NAME"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            "$DEFORM360_PYTHON" --version
            uname -a
            nvidia-smi --query-gpu=index,name,uuid,driver_version,memory.total --format=csv,noheader || true
            sha256sum "$PROTOCOL" \
              scripts/science/run_deform360_gpuserver4090_real_evaluation_v1.py \
              "$DEFORM360_OUTPUT/result.json" \
              "$DEFORM360_OUTPUT/report.md"
          } > "$DEFORM360_OUTPUT/environment.txt"
      - name: Publish report
        shell: bash
        run: cat "$DEFORM360_OUTPUT/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload compact evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: deform360-gpuserver4090-real-evaluation-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.DEFORM360_OUTPUT }}/result.json
            ${{ env.DEFORM360_OUTPUT }}/report.md
            ${{ env.DEFORM360_OUTPUT }}/environment.txt
          if-no-files-found: error
          retention-days: 90
      - name: Retain result, repair the loader contract, and retire launchers
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin "$GITHUB_REF_NAME"
          mkdir -p evidence/deform360 docs
          cp "$DEFORM360_OUTPUT/result.json" \
            evidence/deform360/deform360_gpuserver4090_real_evaluation_v1.json
          cp "$DEFORM360_OUTPUT/environment.txt" \
            evidence/deform360/deform360_gpuserver4090_real_evaluation_v1_environment.txt
          cp "$DEFORM360_OUTPUT/report.md" \
            docs/deform360_gpuserver4090_real_evaluation_v1.md
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_deform360_gpuserver4090_real_evaluation_v1.py")
          text = path.read_text()
          if "import sys\n" not in text:
              text = text.replace("import json\n", "import json\nimport sys\n", 1)
          needle = "MODULE = importlib.util.module_from_spec(SPEC)\nSPEC.loader.exec_module(MODULE)"
          replacement = "MODULE = importlib.util.module_from_spec(SPEC)\nsys.modules[SPEC.name] = MODULE\nSPEC.loader.exec_module(MODULE)"
          if needle not in text and replacement not in text:
              raise SystemExit("unexpected synthetic loader contract")
          path.write_text(text.replace(needle, replacement))
          PY
          rm -f .github/workflows/deform360-public-real-evaluation.yml
          rm -f .github/workflows/deform360-public-real-evaluation-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Retain Deform360 gpuserver4090 real-data evaluation"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Remove isolated environment
        if: always()
        shell: bash
        run: |
          if test -n "${DEFORM360_RUN_ROOT:-}"; then rm -rf "$DEFORM360_RUN_ROOT"; fi
