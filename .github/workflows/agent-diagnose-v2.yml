name: Diagnose RunManifest V2

on:
  push:
    branches: [agent/evidence-provenance-v2]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Capture Ruff diagnostics
        shell: bash
        run: |
          set +e
          python -m ruff check \
            src/bayesian_phystwin/run_manifest.py \
            src/bayesian_phystwin/repository_provenance.py \
            src/bayesian_phystwin/run_manifest_v2.py \
            src/bayesian_phystwin/cli/main.py \
            src/bayesian_phystwin/cli/run_manifest.py \
            tests/test_cli_main.py \
            tests/test_run_manifest.py \
            tests/test_run_manifest_v2.py \
            tests/test_run_manifest_cli.py \
            > ruff-output.txt 2>&1
          printf 'ruff_status=%s\n' "$?" > status.txt
          cat status.txt
          cat ruff-output.txt
          exit 0
      - uses: actions/upload-artifact@v7
        with:
          name: run-manifest-v2-ruff-diagnostics
          path: |
            status.txt
            ruff-output.txt
          retention-days: 2
