name: Locked ecosystem installed-wheel compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ecosystem-locked-golden-path.yml"
      - "scripts/run_three_repository_golden_path.sh"
      - "src/bayesian_phystwin/data/ecosystem_compatibility_v1.json"
      - "src/bayesian_phystwin/ecosystem_compatibility.py"
      - "src/bayesian_phystwin/cli/ecosystem_validate.py"
      - "tests/test_ecosystem_compatibility.py"
      - "integration_tests/**"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ecosystem-locked-golden-path.yml"
      - "scripts/run_three_repository_golden_path.sh"
      - "src/bayesian_phystwin/data/ecosystem_compatibility_v1.json"
      - "src/bayesian_phystwin/ecosystem_compatibility.py"
      - "src/bayesian_phystwin/cli/ecosystem_validate.py"
      - "tests/test_ecosystem_compatibility.py"
      - "integration_tests/**"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      latest_main_canary:
        description: Also test current Prob4D and Causal4D main branches
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "43 5 * * 1"

permissions:
  contents: read

concurrency:
  group: locked-ecosystem-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LOCKED_BPT_REF: 3f37fbc87975f0581a0e58434e53b44c4d61b402
  LOCKED_PROB4D_REF: 9ad07f89f9a85b68cf1375a4087ffa447b6af846
  LOCKED_CAUSAL4D_REF: b0bf0c2de176b29534ef59484ad167b8f27d9dae

jobs:
  lock-contract:
    name: Compatibility lock contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact reviewed BayesianPhysTwin source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate lock bytes and workflow pins
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m pytest -q tests/test_ecosystem_compatibility.py
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("src/bayesian_phystwin/data/ecosystem_compatibility_v1.json")
          lock = json.loads(path.read_text(encoding="utf-8"))
          expected = {
              "bayesian_phystwin": os.environ["LOCKED_BPT_REF"],
              "prob4d": os.environ["LOCKED_PROB4D_REF"],
              "causal4d": os.environ["LOCKED_CAUSAL4D_REF"],
          }
          observed = {
              name: lock["components"][name]["revision"] for name in expected
          }
          if observed != expected:
              raise SystemExit(
                  f"workflow pins differ from compatibility lock: {observed}"
              )
          tested = lock["validation"]["bayesian_phystwin_tested_revision"]
          if tested != expected["bayesian_phystwin"]:
              raise SystemExit("locked BayesianPhysTwin revision was not the tested source")
          print(json.dumps({"locked_revisions": observed}, sort_keys=True))
          PY

  current-bpt-locked-companions:
    name: Current BPT + locked Prob4D/Causal4D
    needs: lock-contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      THREE_REPOSITORY_REQUIRE_LOCKED_REVISIONS: "true"
    steps:
      - name: Check out exact reviewed BayesianPhysTwin source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: bayesian-phystwin
          persist-credentials: false
          clean: true

      - name: Check out locked Prob4D producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/Prob4D
          ref: ${{ env.LOCKED_PROB4D_REF }}
          path: prob4d
          persist-credentials: false
          clean: true

      - name: Check out locked Causal4D consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/Causal4D
          ref: ${{ env.LOCKED_CAUSAL4D_REF }}
          path: causal4d
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            bayesian-phystwin/pyproject.toml
            prob4d/pyproject.toml
            causal4d/pyproject.toml

      - name: Verify locked companion revisions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C prob4d rev-parse HEAD)" = "${LOCKED_PROB4D_REF}"
          test "$(git -C causal4d rev-parse HEAD)" = "${LOCKED_CAUSAL4D_REF}"

      - name: Build wheels and execute the public path
        shell: bash
        run: |
          set -euo pipefail
          export THREE_REPOSITORY_COMPATIBILITY_REPORT="${RUNNER_TEMP}/current-bpt-locked-companions.json"
          bash bayesian-phystwin/scripts/run_three_repository_golden_path.sh \
            bayesian-phystwin prob4d causal4d

      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: current-bpt-locked-companions
          path: ${{ runner.temp }}/current-bpt-locked-companions.json
          if-no-files-found: warn
          retention-days: 30

  historical-lock-reproduction:
    name: Reproduce exact locked trio
    needs: lock-contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      THREE_REPOSITORY_REQUIRE_LOCKED_REVISIONS: "true"
    steps:
      - name: Check out locked BayesianPhysTwin source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/BayesianPhysTwin
          ref: ${{ env.LOCKED_BPT_REF }}
          path: bayesian-phystwin
          persist-credentials: false
          clean: true

      - name: Check out locked Prob4D producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/Prob4D
          ref: ${{ env.LOCKED_PROB4D_REF }}
          path: prob4d
          persist-credentials: false
          clean: true

      - name: Check out locked Causal4D consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/Causal4D
          ref: ${{ env.LOCKED_CAUSAL4D_REF }}
          path: causal4d
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            bayesian-phystwin/pyproject.toml
            prob4d/pyproject.toml
            causal4d/pyproject.toml

      - name: Verify the exact locked checkout identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C bayesian-phystwin rev-parse HEAD)" = "${LOCKED_BPT_REF}"
          test "$(git -C prob4d rev-parse HEAD)" = "${LOCKED_PROB4D_REF}"
          test "$(git -C causal4d rev-parse HEAD)" = "${LOCKED_CAUSAL4D_REF}"

      - name: Reproduce the historical installed-wheel path
        shell: bash
        run: |
          set -euo pipefail
          bash bayesian-phystwin/scripts/run_three_repository_golden_path.sh \
            bayesian-phystwin prob4d causal4d

  latest-main-canary:
    name: Latest three-repository main canary
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.latest_main_canary)
    needs: lock-contract
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out current BayesianPhysTwin source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: bayesian-phystwin
          persist-credentials: false
          clean: true

      - name: Check out latest Prob4D main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/Prob4D
          ref: main
          path: prob4d
          persist-credentials: false
          clean: true

      - name: Check out latest Causal4D main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/Causal4D
          ref: main
          path: causal4d
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            bayesian-phystwin/pyproject.toml
            prob4d/pyproject.toml
            causal4d/pyproject.toml

      - name: Exercise current repository heads
        shell: bash
        run: |
          set -euo pipefail
          bash bayesian-phystwin/scripts/run_three_repository_golden_path.sh \
            bayesian-phystwin prob4d causal4d
