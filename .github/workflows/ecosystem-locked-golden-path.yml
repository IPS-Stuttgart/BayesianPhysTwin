name: Historical ecosystem lock reproduction

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ecosystem-locked-golden-path.yml"
      - "src/bayesian_phystwin/data/ecosystem_compatibility_v1.json"
      - "src/bayesian_phystwin/ecosystem_compatibility.py"
      - "tests/test_ecosystem_compatibility.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ecosystem-locked-golden-path.yml"
      - "src/bayesian_phystwin/data/ecosystem_compatibility_v1.json"
      - "src/bayesian_phystwin/ecosystem_compatibility.py"
      - "tests/test_ecosystem_compatibility.py"
  workflow_dispatch:
  schedule:
    - cron: "43 5 1 * *"

permissions:
  contents: read

concurrency:
  group: historical-ecosystem-lock-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LOCKED_BPT_REF: 3f37fbc87975f0581a0e58434e53b44c4d61b402
  LOCKED_PROB4D_REF: 9ad07f89f9a85b68cf1375a4087ffa447b6af846
  LOCKED_CAUSAL4D_REF: b0bf0c2de176b29534ef59484ad167b8f27d9dae

jobs:
  lock-contract:
    name: Historical lock identity contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact reviewed BayesianPhysTwin source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate lock bytes and literal workflow pins
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m pytest -q tests/test_ecosystem_compatibility.py
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          lock = json.loads(
              Path(
                  "src/bayesian_phystwin/data/ecosystem_compatibility_v1.json"
              ).read_text(encoding="utf-8")
          )
          expected = {
              "bayesian_phystwin": os.environ["LOCKED_BPT_REF"],
              "prob4d": os.environ["LOCKED_PROB4D_REF"],
              "causal4d": os.environ["LOCKED_CAUSAL4D_REF"],
          }
          observed = {
              name: lock["components"][name]["revision"] for name in expected
          }
          if observed != expected:
              raise SystemExit(
                  f"workflow pins differ from compatibility lock: {observed}"
              )
          if (
              lock["validation"]["bayesian_phystwin_tested_revision"]
              != expected["bayesian_phystwin"]
          ):
              raise SystemExit(
                  "locked BayesianPhysTwin revision was not the tested source"
              )
          if lock["validation"]["workflow_run_id"] != 31019529164:
              raise SystemExit("historical workflow identity changed")
          print(json.dumps({"locked_revisions": observed}, sort_keys=True))
          PY

  historical-lock-reproduction:
    name: Reproduce exact locked trio
    needs: lock-contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out locked BayesianPhysTwin source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/BayesianPhysTwin
          ref: ${{ env.LOCKED_BPT_REF }}
          path: bayesian-phystwin
          persist-credentials: false
          clean: true

      - name: Check out locked Prob4D producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/Prob4D
          ref: ${{ env.LOCKED_PROB4D_REF }}
          path: prob4d
          persist-credentials: false
          clean: true

      - name: Check out locked Causal4D consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/Causal4D
          ref: ${{ env.LOCKED_CAUSAL4D_REF }}
          path: causal4d
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            bayesian-phystwin/pyproject.toml
            prob4d/pyproject.toml
            causal4d/pyproject.toml

      - name: Verify exact checkout identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C bayesian-phystwin rev-parse HEAD)" = "${LOCKED_BPT_REF}"
          test "$(git -C prob4d rev-parse HEAD)" = "${LOCKED_PROB4D_REF}"
          test "$(git -C causal4d rev-parse HEAD)" = "${LOCKED_CAUSAL4D_REF}"

      - name: Reproduce historical installed-wheel integration
        shell: bash
        run: |
          set -euo pipefail
          bash bayesian-phystwin/scripts/run_three_repository_golden_path.sh \
            bayesian-phystwin prob4d causal4d
