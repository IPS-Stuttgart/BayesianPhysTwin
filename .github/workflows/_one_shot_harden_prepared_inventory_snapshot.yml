name: One-shot prepared inventory snapshot hardening

# Final guarded retry after the byte-custody review.
on:
  push:
    branches: [agent/deform360-prepared-source-inventory-v1]
    paths:
      - ".github/workflows/_one_shot_harden_prepared_inventory_snapshot.yml"
      - "scripts/_one_shot_harden_prepared_inventory_snapshot.py"
      - "tests/test_deform360_calibration_prepared_inventory_snapshot.py"

permissions:
  contents: write

concurrency:
  group: one-shot-prepared-inventory-snapshot-hardening
  cancel-in-progress: true

jobs:
  harden:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.ref == 'refs/heads/agent/deform360-prepared-source-inventory-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply exact reviewed source transformation
        run: |
          set -euo pipefail
          python scripts/_one_shot_harden_prepared_inventory_snapshot.py

      - name: Install validation environment
        run: |
          set -euo pipefail
          python -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1"
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Format and validate final source
        run: |
          set -euo pipefail
          files=(
            scripts/science/inventory_deform360_calibration_prepared_source.py
            tests/test_deform360_calibration_prepared_inventory.py
            tests/test_deform360_calibration_prepared_inventory_snapshot.py
          )
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy \
            scripts/science/inventory_deform360_calibration_prepared_source.py

      - name: Run focused and adjacent contracts
        run: |
          set -euo pipefail
          python -m pytest -q -p no:cacheprovider \
            tests/test_deform360_calibration_prepared_inventory.py \
            tests/test_deform360_calibration_prepared_inventory_snapshot.py \
            tests/test_deform360_calibration_source_run_record.py \
            tests/test_deform360_calibration_observability_case_builder.py \
            tests/test_deform360_calibration_observability_batch.py
          python -m py_compile \
            scripts/science/inventory_deform360_calibration_prepared_source.py \
            tests/test_deform360_calibration_prepared_inventory_snapshot.py

      - name: Remove temporary transport and verify final scope
        run: |
          set -euo pipefail
          rm -- \
            .github/workflows/_one_shot_harden_prepared_inventory_snapshot.yml \
            scripts/_one_shot_harden_prepared_inventory_snapshot.py
          git diff --check
          allowed='^(\.github/workflows/deform360-calibration-prepared-inventory\.yml|MANIFEST\.in|docs/deform360_calibration_prepared_inventory\.md|docs/experiment_index\.md|scripts/science/inventory_deform360_calibration_prepared_source\.py|tests/test_deform360_calibration_prepared_inventory\.py|tests/test_deform360_calibration_prepared_inventory_snapshot\.py)$'
          unexpected="$(git diff --name-only 0f403cbed8b5fc9ac585b5f7c237106809207b3f -- | grep -Ev "${allowed}" || true)"
          if [[ -n "${unexpected}" ]]; then
            printf 'Unexpected final paths:\n%s\n' "${unexpected}" >&2
            exit 1
          fi

      - name: Commit validated final source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Read prepared inventory payloads from verified snapshots'
          git push origin HEAD:agent/deform360-prepared-source-inventory-v1
