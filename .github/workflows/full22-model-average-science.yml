name: Full-22 endpoint model-average science diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/full22-model-average-science.yml"
      - "protocols/full22_endpoint_model_average_diagnostic_v1.json"
      - "scripts/science/run_full22_endpoint_model_average_diagnostic.py"
      - "tests/test_full22_endpoint_model_average_diagnostic.py"
      - "src/bayesian_phystwin/endpoint_model_average.py"
  workflow_dispatch:
    inputs:
      workers:
        description: Independent PhysTwin cases evaluated concurrently
        required: false
        default: "8"
        type: string

permissions:
  contents: read

concurrency:
  group: full22-model-average-science-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  diagnostic:
    name: Retrospective full-22 point and calibration comparison
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 360
    steps:
      - name: Check out BayesianPhysTwin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Resolve cache, output, and worker settings
        shell: bash
        env:
          CONFIGURED_CACHE: ${{ vars.PHYSTWIN_EVALUATION_CACHE }}
          REQUESTED_WORKERS: ${{ inputs.workers || '8' }}
        run: |
          set -euo pipefail
          if [[ -n "${CONFIGURED_CACHE}" ]]; then
            data_root="${CONFIGURED_CACHE}/trajectory-evaluation-v1"
          else
            data_root="${HOME}/.cache/bayesian-phystwin/trajectory-evaluation-v1"
          fi
          if ! [[ "${REQUESTED_WORKERS}" =~ ^[1-9][0-9]*$ ]]; then
            echo "workers must be a positive integer" >&2
            exit 1
          fi
          output_root="${RUNNER_TEMP}/bpt-full22-model-average-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${data_root}" "${output_root}"
          echo "DATA_ROOT=${data_root}" >> "${GITHUB_ENV}"
          echo "OUTPUT_ROOT=${output_root}" >> "${GITHUB_ENV}"
          echo "CASE_WORKERS=${REQUESTED_WORKERS}" >> "${GITHUB_ENV}"

      - name: Record runner and source identity
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "revision=${GITHUB_SHA}"
            echo "case_workers=${CASE_WORKERS}"
            uname -a
            lscpu
          } | tee "${OUTPUT_ROOT}/runner.txt"
          nvidia-smi -L | tee "${OUTPUT_ROOT}/nvidia-smi-L.txt"
          nvidia-smi \
            --query-gpu=index,name,uuid,driver_version,memory.total \
            --format=csv,noheader \
            | tee "${OUTPUT_ROOT}/nvidia-smi.csv"

      - name: Install the locked evaluation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,data,graph]"
          python -m pip check
          python -m pip freeze --all > "${OUTPUT_ROOT}/pip-freeze.txt"

      - name: Validate implementation and protocol before target evaluation
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check \
            scripts/science/run_full22_endpoint_model_average_diagnostic.py \
            tests/test_full22_endpoint_model_average_diagnostic.py
          python -m ruff format --check \
            scripts/science/run_full22_endpoint_model_average_diagnostic.py \
            tests/test_full22_endpoint_model_average_diagnostic.py
          python -m pytest -q \
            tests/test_full22_endpoint_model_average_diagnostic.py \
            tests/test_endpoint_model_average.py
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path(
              "protocols/full22_endpoint_model_average_diagnostic_v1.json"
          )
          payload = json.loads(path.read_text(encoding="utf-8"))
          digest = hashlib.sha256(
              json.dumps(
                  payload,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              ).encode("utf-8")
          ).hexdigest()
          expected = "8c4021f082b03ef761bc97300eeac11b6f3f92a2bdc52c1941020f6c1f340217"
          if digest != expected:
              raise SystemExit(
                  f"protocol digest changed: expected {expected}, received {digest}"
              )
          print(f"locked protocol: {digest}")
          PY

      - name: Run the locked full-22 diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python scripts/science/run_full22_endpoint_model_average_diagnostic.py \
            "${DATA_ROOT}" \
            "${OUTPUT_ROOT}/result" \
            --protocol \
              protocols/full22_endpoint_model_average_diagnostic_v1.json \
            --workers "${CASE_WORKERS}" \
            --repository-revision "${GITHUB_SHA}" \
            --force \
            | tee "${OUTPUT_ROOT}/diagnostic-console.json"
          cp "${DATA_ROOT}/trajectory_evaluation_manifest.json" \
            "${OUTPUT_ROOT}/result/data_manifest.json"

      - name: Verify result integrity and summarize scientific readout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path(__import__("os").environ["OUTPUT_ROOT"])
          result = root / "result"
          summary_path = result / "summary.json"
          manifest = json.loads(
              (result / "artifact_manifest.json").read_text(encoding="utf-8")
          )
          actual = hashlib.sha256(summary_path.read_bytes()).hexdigest()
          if actual != manifest["summary_sha256"]:
              raise SystemExit("summary digest disagrees with artifact manifest")
          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          confirmation = summary["aggregate"]["confirmation_19"]
          methods = confirmation["point"]["methods"]
          calibration = confirmation["predictive_calibration"]

          rows = []
          for method in (
              "released_phystwin",
              "selected_bayesian_anchor",
              "model_average",
              "model_average_anchor_guard",
              "last_residual",
          ):
              rows.append(
                  {
                      "method": method,
                      "cd_mm": 1000.0
                      * methods[method]["chamfer_distance_m"][
                          "equal_case_mean_m"
                      ],
                      "track_mm": 1000.0
                      * methods[method]["track_error_m"][
                          "equal_case_mean_m"
                      ],
                  }
              )
          readout = {
              "schema": "bayesian-phystwin-full22-model-average-readout",
              "schema_version": 1,
              "repository_revision": summary["repository_revision"],
              "protocol_sha256": summary["protocol_sha256"],
              "confirmation_case_count": confirmation["case_count"],
              "anchor_acceptance_fraction": confirmation[
                  "anchor_acceptance_fraction"
              ],
              "point_metrics": rows,
              "calibration": {
                  posterior: {
                      "coverage_90": calibration[posterior]["updated_only"][
                          "equal_case_overall"
                      ]["coverage_90"],
                      "mean_nees_over_dimension": calibration[posterior][
                          "updated_only"
                      ]["equal_case_overall"]["mean_nees_over_dimension"],
                      "mean_negative_log_likelihood": calibration[posterior][
                          "updated_only"
                      ]["equal_case_overall"][
                          "mean_negative_log_likelihood"
                      ],
                  }
                  for posterior in (
                      "selected_bayesian_anchor",
                      "model_average",
                  )
              },
              "claim_boundary": summary["claim_boundary"],
          }
          (root / "scientific-readout.json").write_text(
              json.dumps(readout, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(readout, indent=2, sort_keys=True))
          PY
          git diff --exit-code
          git status --porcelain=v1 | tee "${OUTPUT_ROOT}/git-status.txt"
          test ! -s "${OUTPUT_ROOT}/git-status.txt"

      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Full-22 endpoint model-average diagnostic"
            echo
            echo "- Runner: \`${RUNNER_NAME}\`"
            echo "- Revision: \`${GITHUB_SHA}\`"
            echo "- Case workers: \`${CASE_WORKERS}\`"
            if [[ -f "${OUTPUT_ROOT}/scientific-readout.json" ]]; then
              python - <<'PY'
          import json
          import os
          from pathlib import Path

          readout = json.loads(
              (Path(os.environ["OUTPUT_ROOT"]) / "scientific-readout.json").read_text(
                  encoding="utf-8"
              )
          )
          print("- Confirmation cohort: `19 cases`")
          print(
              "- Anchor acceptance fraction: "
              f"`{readout['anchor_acceptance_fraction']:.3f}`"
          )
          print("")
          print("| Method | CD (mm) | Track (mm) |")
          print("| --- | ---: | ---: |")
          for row in readout["point_metrics"]:
              print(
                  f"| `{row['method']}` | {row['cd_mm']:.3f} | "
                  f"{row['track_mm']:.3f} |"
              )
          print("")
          print("| Posterior | 90% coverage | mean NEES / 3 |")
          print("| --- | ---: | ---: |")
          for posterior, values in readout["calibration"].items():
              print(
                  f"| `{posterior}` | {values['coverage_90']:.3f} | "
                  f"{values['mean_nees_over_dimension']:.3f} |"
              )
          print("")
          print(
              "This is a retrospective diagnostic on a previously used cohort, "
              "not fresh independent validation."
          )
          PY
            else
              echo "- The run stopped before producing a scientific readout."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload compact scientific evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bpt-full22-model-average-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bpt-full22-model-average-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
