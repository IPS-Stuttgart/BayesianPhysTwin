name: Harden Deform360 logical path

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/harden-deform360-logical-path.yml"

permissions:
  contents: write

concurrency:
  group: harden-deform360-logical-path-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/deform360-calibration-seal'
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 5
    steps:
      - name: Check out exact pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          clean: true

      - name: Require canonical logical paths and publish
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "src/bayesian_phystwin/cli/"
              "deform360_calibration_execution.py"
          )
          text = path.read_text(encoding="utf-8")
          needle = (
              '        or ".." in path.parts\n'
              '        or "." in path.parts\n'
              '    ):\n'
          )
          replacement = (
              '        or ".." in path.parts\n'
              '        or "." in path.parts\n'
              '        or path.as_posix() != value\n'
              '    ):\n'
          )
          if text.count(needle) != 1:
              raise SystemExit("logical-path validation anchor changed")
          path.write_text(
              text.replace(needle, replacement),
              encoding="utf-8",
              newline="\n",
          )
          PY
          "$HOME/.local/bin/ruff" check --fix \
            src/bayesian_phystwin/cli/deform360_calibration_execution.py
          "$HOME/.local/bin/ruff" format \
            src/bayesian_phystwin/cli/deform360_calibration_execution.py
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bayesian_phystwin/cli/deform360_calibration_execution.py
          git commit -m "Require canonical Deform360 logical source paths"
          git push origin "HEAD:${HEAD_REF}"
