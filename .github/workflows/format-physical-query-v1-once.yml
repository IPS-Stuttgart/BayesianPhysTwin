name: Format PhysicalQueryV1 once

on:
  push:
    branches:
      - agent/physical-query-contract-v1

permissions:
  contents: write

concurrency:
  group: format-physical-query-v1-once
  cancel-in-progress: false

jobs:
  format:
    if: github.repository == 'IPS-Stuttgart/BayesianPhysTwin'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/physical-query-contract-v1
          fetch-depth: 1
          persist-credentials: true

      - name: Format and validate the bounded files
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'ruff>=0.6'
          python -m ruff format \
            src/bayesian_phystwin/physical_query_v1.py \
            tests/test_physical_query_v1.py
          python -m ruff check \
            src/bayesian_phystwin/physical_query_v1.py \
            src/bayesian_phystwin/v1/__init__.py \
            tests/test_physical_query_v1.py
          python -m compileall -q \
            src/bayesian_phystwin/physical_query_v1.py \
            src/bayesian_phystwin/v1/__init__.py \
            tests/test_physical_query_v1.py
          git diff --check

      - name: Commit formatted source and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/format-physical-query-v1-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/format-physical-query-v1-once.yml \
            src/bayesian_phystwin/physical_query_v1.py \
            tests/test_physical_query_v1.py
          git commit -m 'Apply canonical PhysicalQueryV1 formatting'
          git push origin HEAD:agent/physical-query-contract-v1
