name: Temporary isolated PR 365 type repair

on:
  push:
    branches: [ops/pr365-type-narrowing]
    paths:
      - .github/workflows/tree-sparse-prob4d.yml

permissions:
  contents: write

concurrency:
  group: ops-pr365-type-narrowing
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact operations head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Verify isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GITHUB_REF_NAME}" = "ops/pr365-type-narrowing"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Apply explicit type narrowings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/bayesian_phystwin/prior_aware_gauge_belief_v2.py")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  '''    _require(
                      not isinstance(value, (bool, np.bool_)) and isinstance(value, Real),
                      f"v2 admission certificate field {name!r} must be a finite real or null",
                  )
                  result = float(value)
          ''',
                  '''    if isinstance(value, (bool, np.bool_)) or not isinstance(value, Real):
                      raise ValueError(
                          f"v2 admission certificate field {name!r} must be a finite real or null"
                      )
                  result = float(value)
          ''',
              ),
              (
                  '''    _require(
                      maximum_condition_number is not None and maximum_condition_number >= 1.0,
                      "v2 admission certificate maximum condition number must be finite and at least one",
                  )

                  diagnostics_valid = certificate["diagnostics_valid"] is True
          ''',
                  '''    if maximum_condition_number is None or maximum_condition_number < 1.0:
                      raise ValueError(
                          "v2 admission certificate maximum condition number must be finite and at least one"
                      )

                  diagnostics_valid = certificate["diagnostics_valid"] is True
          ''',
              ),
              (
                  '''    certificate = diagnostics.get(_CERTIFICATE_KEY)
                  _require(
                      isinstance(certificate, Mapping),
                      "v2 diagnostics do not contain an admission certificate",
                  )
                  certificate_passed = _validate_certificate_mapping(certificate)
          ''',
                  '''    certificate = diagnostics.get(_CERTIFICATE_KEY)
                  if not isinstance(certificate, Mapping):
                      raise ValueError(
                          "v2 diagnostics do not contain an admission certificate"
                      )
                  certificate_passed = _validate_certificate_mapping(certificate)
          ''',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one exact replacement site, found {count}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate repaired source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          source=src/bayesian_phystwin/prior_aware_gauge_belief_v2.py
          python -m ruff format "$source"
          python -m ruff check "$source"
          python -m mypy "$source"
          python -m pytest -q -p no:cacheprovider \
            tests/test_claim_bearing_strict_admission.py \
            tests/test_portable_contracts_strict_admission_certificate.py

      - name: Commit validated source blob
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          actual="$(git status --porcelain --untracked-files=all | sed -E 's/^...//' | sort)"
          test "$actual" = "src/bayesian_phystwin/prior_aware_gauge_belief_v2.py"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bayesian_phystwin/prior_aware_gauge_belief_v2.py
          git commit -m "Validate strict certificate type narrowings"
          git fetch --no-tags origin ops/pr365-type-narrowing
          test "$(git rev-parse FETCH_HEAD)" = "${GITHUB_SHA}"
          git push origin HEAD:refs/heads/ops/pr365-type-narrowing