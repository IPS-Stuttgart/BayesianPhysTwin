name: Tree-sparse Prob4D integration

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/quality/test-suites.json"
      - ".github/workflows/tree-sparse-prob4d.yml"
      - "docs/claim-bearing-tree-sparse-prob4d.md"
      - "src/bayesian_phystwin/_gauge_aware_contracts.py"
      - "src/bayesian_phystwin/*gauge*.py"
      - "src/bayesian_phystwin/observed_information_covariance.py"
      - "tests/test_*gauge*.py"
      - "tests/test_tree_sparse_prob4d_roundtrip.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tree-sparse-prob4d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact reviewed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development environment
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir -e ".[dev]"
          python -m pip check

      - name: Check focused quality
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/bayesian_phystwin/_gauge_aware_contracts.py
            src/bayesian_phystwin/observed_information_covariance.py
            src/bayesian_phystwin/prior_aware_gauge_belief.py
            src/bayesian_phystwin/sparse_prior_aware_gauge_belief.py
            src/bayesian_phystwin/tree_sparse_explicit_gauge_prob4d.py
            tests/test_tree_sparse_explicit_gauge_prob4d.py
            tests/test_tree_sparse_prob4d_roundtrip.py
          )
          python -m ruff check -- "${files[@]}"
          python -m ruff format --check --diff "${files[@]}"
          python -m mypy --python-version 3.12 \
            src/bayesian_phystwin/_gauge_aware_contracts.py \
            src/bayesian_phystwin/observed_information_covariance.py \
            src/bayesian_phystwin/prior_aware_gauge_belief.py \
            src/bayesian_phystwin/sparse_prior_aware_gauge_belief.py \
            src/bayesian_phystwin/tree_sparse_explicit_gauge_prob4d.py

      - name: Run focused and adjacent tests
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_gauge_aware_belief.py \
            tests/test_prior_aware_and_linearization.py \
            tests/test_prior_aware_likelihood_conformance.py \
            tests/test_information_mass_invariants.py \
            tests/test_observed_information_covariance.py \
            tests/test_explicit_gauge_prob4d.py \
            tests/test_sparse_prior_aware_gauge_belief.py \
            tests/test_sparse_explicit_gauge_prob4d.py \
            tests/test_tree_sparse_explicit_gauge_prob4d.py
          python -m compileall -q src/bayesian_phystwin tests

  real-producer-roundtrip:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact reviewed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install consumer and exact merged producer
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir -e ".[dev]"
          python -m pip install --no-cache-dir \
            "prob4d @ git+https://github.com/IPS-Stuttgart/Prob4D@b2953319e9b7afea04013c214c502b38c5a83489"
          python -m pip check
          python - <<'PY'
          import sys
          import prob4d
          import bayesian_phystwin.tree_sparse_explicit_gauge_prob4d

          forbidden = {"torch", "diffusers", "decord"}
          loaded = sorted(forbidden & set(sys.modules))
          if loaded:
              raise SystemExit(f"optional GPU dependencies loaded: {loaded}")
          print(f"Prob4D import: {prob4d.__file__}")
          PY

      - name: Run serialized producer-to-consumer round trip
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_tree_sparse_prob4d_roundtrip.py
          python -m compileall -q \
            src/bayesian_phystwin/tree_sparse_explicit_gauge_prob4d.py \
            tests/test_tree_sparse_prob4d_roundtrip.py

  finalize-pr349:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact reviewed branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Add branch-complete admission coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          test_path = Path("tests/test_claim_bearing_strict_admission.py")
          text = test_path.read_text(encoding="utf-8")
          if "import pytest\n" not in text:
              text = text.replace(
                  "import numpy as np\n",
                  "import numpy as np\nimport pytest\n\n"
                  "import bayesian_phystwin.prior_aware_gauge_belief_v2 as strict_v2\n",
                  1,
              )
          if "update_sparse_prior_aware_gauge_belief_structured," not in text:
              text = text.replace(
                  "    update_sparse_prior_aware_gauge_belief,\n",
                  "    update_sparse_prior_aware_gauge_belief,\n"
                  "    update_sparse_prior_aware_gauge_belief_structured,\n",
                  1,
              )
          block = r'''


def _converged_config() -> PriorAwareGaugeConfigV1:
    return replace(
        _exhausted_config(),
        maximum_iterations=100,
        convergence_tolerance=1.0e-12,
    )


def test_tree_sparse_structured_v2_admits_converged_result() -> None:
    batch, tree = _tree_fixture()
    result = update_sparse_prior_aware_gauge_belief_structured_v2(
        batch,
        tree,
        config=_converged_config(),
    )
    assert result.inference_admissible
    assert result.diagnostics["strict_admission_passed"] is True
    assert result.diagnostics["strict_admission_reason"] == "strict-admission-passed"


def test_tree_sparse_structured_v2_preserves_underlying_rejection() -> None:
    batch, tree = _tree_fixture()
    config = replace(_converged_config(), maximum_state_update_m=1.0e-12)
    result = update_sparse_prior_aware_gauge_belief_structured_v2(
        batch,
        tree,
        config=config,
    )
    assert not result.inference_admissible
    assert result.diagnostics["strict_admission_reason"] == (
        "underlying-inference-rejected"
    )
    assert result.diagnostics["underlying_inference_admissible"] is False


def test_tree_sparse_structured_v2_rejects_invalid_argument_types() -> None:
    batch, tree = _tree_fixture()
    with pytest.raises(TypeError, match="batch must"):
        update_sparse_prior_aware_gauge_belief_structured_v2(object(), tree)  # type: ignore[arg-type]
    with pytest.raises(TypeError, match="gauge must"):
        update_sparse_prior_aware_gauge_belief_structured_v2(batch, object())  # type: ignore[arg-type]
    with pytest.raises(TypeError, match="config must"):
        update_sparse_prior_aware_gauge_belief_structured_v2(
            batch,
            tree,
            config=object(),  # type: ignore[arg-type]
        )
    with pytest.raises(TypeError, match="admission_config must"):
        update_sparse_prior_aware_gauge_belief_structured_v2(
            batch,
            tree,
            admission_config=object(),  # type: ignore[arg-type]
        )


def test_dense_sparse_v2_rejects_structured_fallback_substitution(
    monkeypatch: pytest.MonkeyPatch,
) -> None:
    batch, tree = _tree_fixture()
    config = _exhausted_config()
    historical = update_sparse_prior_aware_gauge_belief(batch, tree, config=config)
    structured = update_sparse_prior_aware_gauge_belief_structured(
        batch,
        tree,
        config=config,
    )
    assert historical.inference_admissible
    monkeypatch.setattr(
        strict_v2,
        "update_sparse_prior_aware_gauge_belief",
        lambda *_args, **_kwargs: historical,
    )
    monkeypatch.setattr(
        strict_v2,
        "_sparse_fallback_result",
        lambda *_args, **_kwargs: structured,
    )
    with pytest.raises(RuntimeError, match="returned a structured result"):
        update_sparse_prior_aware_gauge_belief_v2(batch, tree, config=config)
'''
          if "def _converged_config()" not in text:
              text = text.rstrip() + block + "\n"
          test_path.write_text(text, encoding="utf-8")

          manifest_path = Path(".github/quality/test-suites.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          additions = [
              "tests/test_prior_aware_gauge_belief_v2.py",
              "tests/test_claim_bearing_strict_admission.py",
          ]
          for suite_name in ("stable-core-coverage", "core-contracts"):
              suite = manifest["suites"][suite_name]
              for item in additions:
                  while item in suite:
                      suite.remove(item)
              anchor = suite.index("tests/test_prior_aware_likelihood_conformance.py") + 1
              suite[anchor:anchor] = additions
          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Format and validate exact source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir -e ".[dev,graph]"
          python -m pip install "coverage==7.13.3"
          python -m pip check
          python -m ruff format \
            src/bayesian_phystwin/prior_aware_gauge_belief_v2.py \
            tests/test_claim_bearing_strict_admission.py
          python -m ruff check \
            src/bayesian_phystwin/prior_aware_gauge_belief_v2.py \
            src/bayesian_phystwin/prospective_prob4d_update.py \
            src/bayesian_phystwin/tree_sparse_structured_gauge_prob4d.py \
            tests/test_claim_bearing_strict_admission.py
          python -m mypy --python-version 3.12 \
            src/bayesian_phystwin/prior_aware_gauge_belief_v2.py \
            src/bayesian_phystwin/prospective_prob4d_update.py \
            src/bayesian_phystwin/tree_sparse_structured_gauge_prob4d.py
          python -m pytest -q \
            tests/test_prior_aware_gauge_belief_v2.py \
            tests/test_claim_bearing_strict_admission.py
          python -m pytest -q tests/test_test_suite_manifest.py
          python -m compileall -q src/bayesian_phystwin tests

      - name: Run authoritative stable-core coverage ratchet
        shell: bash
        run: |
          set -euo pipefail
          python tools/quality/test_suite_manifest.py list stable-core-coverage \
            > "$RUNNER_TEMP/stable-core-tests.txt"
          mapfile -t stable_tests < "$RUNNER_TEMP/stable-core-tests.txt"
          test "${#stable_tests[@]}" -gt 0
          python -m coverage run --branch --source=bayesian_phystwin \
            -m pytest -q "${stable_tests[@]}"
          python -m coverage json -o package-coverage.json
          stable_files=(
            src/bayesian_phystwin/_gauge_aware_contracts.py
            src/bayesian_phystwin/_gauge_aware_solver.py
            src/bayesian_phystwin/calibration.py
            src/bayesian_phystwin/causal4d_provider_v1.py
            src/bayesian_phystwin/cli/main.py
            src/bayesian_phystwin/cli/run_manifest.py
            src/bayesian_phystwin/gauge_aware_belief.py
            src/bayesian_phystwin/deform360_contact_anchor.py
            src/bayesian_phystwin/observation_belief.py
            src/bayesian_phystwin/observation_belief_gauge_adapter.py
            src/bayesian_phystwin/phystwin_profile.py
            src/bayesian_phystwin/prob4d_causal_lineage.py
            src/bayesian_phystwin/prob4d_observation_contract.py
            src/bayesian_phystwin/pseudo_measurements.py
            src/bayesian_phystwin/repository_provenance.py
            src/bayesian_phystwin/robust_likelihood.py
            src/bayesian_phystwin/run_manifest.py
            src/bayesian_phystwin/run_manifest_v2.py
          )
          stable_include=$(IFS=,; echo "${stable_files[*]}")
          python -m coverage json --include="${stable_include}" \
            -o stable-core-coverage.json
          python tools/quality/check_coverage_floors.py \
            stable-core-coverage.json \
            .github/quality/stable-core-coverage-floors.json \
            --changed-coverage-json package-coverage.json \
            --base ae5cbcfa4a125d3df2f034d11f6e0cc7a065c00a \
            --head "$(git rev-parse HEAD)"

      - name: Publish finalized source and restore permanent workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/tree-sparse-prob4d.yml \
            > .github/workflows/tree-sparse-prob4d.yml
          rm -f .github/workflows/_temporary_finalize_pr349.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/quality/test-suites.json \
            .github/workflows/tree-sparse-prob4d.yml \
            .github/workflows/_temporary_finalize_pr349.yml \
            src/bayesian_phystwin/prior_aware_gauge_belief_v2.py \
            tests/test_claim_bearing_strict_admission.py
          git commit -m "Complete strict-admission coverage [finalize-pr349]"
          git push origin HEAD:agent/fail-closed-prior-aware-irls
