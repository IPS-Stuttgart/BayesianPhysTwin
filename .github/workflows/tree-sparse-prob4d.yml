name: Temporary finalize PR 354 certificate formatting

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/tree-sparse-prob4d.yml"

permissions:
  contents: write

concurrency:
  group: temporary-finalize-pr354-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/strict-admission-certificate-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact reviewed branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Verify exact clean branch state
        env:
          REVIEWED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${REVIEWED_HEAD}"
          test -z "$(git status --porcelain --untracked-files=all)"
          git fetch --no-tags origin main agent/strict-admission-certificate-v1
          test "$(git rev-parse origin/agent/strict-admission-certificate-v1)" = \
            "${REVIEWED_HEAD}"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Format and validate certificate product
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          source=src/bayesian_phystwin/prior_aware_gauge_belief_v2.py
          python -m ruff format "$source"
          python -m ruff format --check \
            "$source" \
            tests/test_claim_bearing_strict_admission.py \
            tests/test_portable_contracts_strict_admission_certificate.py
          python -m ruff check \
            "$source" \
            tests/test_claim_bearing_strict_admission.py \
            tests/test_portable_contracts_strict_admission_certificate.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_claim_bearing_strict_admission.py \
            tests/test_portable_contracts_strict_admission_certificate.py
          python -m compileall -q "$source"

      - name: Restore permanent workflow and publish exact product
        env:
          REVIEWED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:.github/workflows/tree-sparse-prob4d.yml \
            > .github/workflows/tree-sparse-prob4d.yml
          rm -f \
            .github/workflows/_temporary_harden_pr354_certificate.yml \
            .github/workflows/_temporary_launch_pr354_hardening.yml
          git diff --check
          actual="$(git status --porcelain --untracked-files=all \
            | sed -E 's/^...//' | sort)"
          expected="$(cat <<'EOF'
          .github/workflows/tree-sparse-prob4d.yml
          src/bayesian_phystwin/prior_aware_gauge_belief_v2.py
          EOF
          )"
          test "$actual" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format strict-admission certificate invariants"
          git fetch --no-tags origin agent/strict-admission-certificate-v1
          test "$(git rev-parse FETCH_HEAD)" = "${REVIEWED_HEAD}"
          git push origin HEAD:refs/heads/agent/strict-admission-certificate-v1
