# workflow-lifecycle: temporary-one-shot
# workflow-owner: IPS-Stuttgart maintainers
name: Transport4D Deform360 metadata reserve one-shot

on:
  push:
    branches: [research/transport4d-tiered-public-v1]
    paths:
      - ".github/requests/transport4d-deform360-reserve-audit-v1.json"

permissions:
  contents: read

concurrency:
  group: transport4d-deform360-reserve-audit-v1
  cancel-in-progress: false

env:
  DATASET_ROOT: /mnt/seagate10tb/florianpfaff/datasets/deform360
  REQUEST_PATH: .github/requests/transport4d-deform360-reserve-audit-v1.json
  RESERVE_PROTOCOL: protocols/transport4d_deform360_reserve_audit_v1.json
  ACTION_PROTOCOL: protocols/deform360_action_kernel_v3.json
  UNTOUCHED_PROTOCOL: protocols/deform360_untouched_confirmation_v5.json
  EXPECTED_PROTOCOL_ID: a7d5f520ae3e4761452476af7af57fa023aea031114aa0239c2690bb531407c8
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  contracts:
    name: Validate reserve contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact request revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
          clean: true
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate metadata-only implementation and protocol
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest ruff==0.14.14
          python -m ruff check \
            src/bayesian_phystwin_experiments/transport4d_public_reserve_v1.py \
            scripts/science/audit_transport4d_deform360_reserve_v1.py \
            tests/test_transport4d_public_reserve_v1.py
          python -m ruff format --check \
            src/bayesian_phystwin_experiments/transport4d_public_reserve_v1.py \
            scripts/science/audit_transport4d_deform360_reserve_v1.py \
            tests/test_transport4d_public_reserve_v1.py
          python -m py_compile \
            src/bayesian_phystwin_experiments/transport4d_public_reserve_v1.py \
            scripts/science/audit_transport4d_deform360_reserve_v1.py \
            tests/test_transport4d_public_reserve_v1.py
          PYTHONPATH=src python -m pytest -q \
            tests/test_transport4d_public_reserve_v1.py
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RESERVE_PROTOCOL"])
          value = json.loads(path.read_text(encoding="utf-8"))
          supplied = value.pop("protocol_id")
          encoded = json.dumps(
              value,
              sort_keys=True,
              separators=(",", ":"),
              allow_nan=False,
          ).encode("utf-8")
          assert hashlib.sha256(encoded).hexdigest() == supplied
          assert supplied == os.environ["EXPECTED_PROTOCOL_ID"]
          boundary = value["information_boundary"]
          for name in (
              "robot_numeric_payload_opened",
              "tactile_numeric_payload_opened",
              "camera_pixel_opened",
              "geometry_or_point_cloud_opened",
              "target_outcome_opened",
              "confirmation_authorized",
              "paper_claim_authorized",
          ):
              assert boundary[name] is False
          PY

  authorize:
    name: Authorize one add-only metadata request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_revision: ${{ steps.request.outputs.source_revision }}
      request_id: ${{ steps.request.outputs.request_id }}
    steps:
      - name: Check out request with parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
          clean: true
      - id: request
        name: Verify exact request and source parent
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = IPS-Stuttgart/BayesianPhysTwin
          test "${GITHUB_REF}" = refs/heads/research/transport4d-tiered-public-v1
          test "${PUSH_FORCED}" = false
          test "${BEFORE_SHA}" != 0000000000000000000000000000000000000000
          mapfile -t changed < <(git diff --name-status "${BEFORE_SHA}" "${GITHUB_SHA}")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = $'A\t.github/requests/transport4d-deform360-reserve-audit-v1.json'
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          request = json.loads(Path(os.environ["REQUEST_PATH"]).read_text())
          expected = {
              "schema": "bayesian-phystwin/transport4d-deform360-reserve-request-v1",
              "request_id": "transport4d-deform360-metadata-reserve-20260902-v1",
              "dataset_root": os.environ["DATASET_ROOT"],
              "runner_labels": ["self-hosted", "Linux", "X64", "gpuserver4090"],
              "protocol_path": os.environ["RESERVE_PROTOCOL"],
              "protocol_id": os.environ["EXPECTED_PROTOCOL_ID"],
              "metadata_only": True,
              "numeric_payload_authorized": False,
              "confirmation_authorized": False,
              "paper_claim_authorized": False,
          }
          for name, expected_value in expected.items():
              if request.get(name) != expected_value:
                  raise SystemExit(f"invalid {name}: {request.get(name)!r}")
          if set(request) != set(expected) | {"expected_source_revision"}:
              raise SystemExit("request fields differ from frozen schema")
          parent = subprocess.check_output(
              ["git", "rev-parse", f"{os.environ['GITHUB_SHA']}^"],
              text=True,
          ).strip()
          if request["expected_source_revision"] != parent:
              raise SystemExit("request is not bound to its trigger parent")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              print(f"source_revision={parent}", file=stream)
              print(f"request_id={request['request_id']}", file=stream)
          PY

  reserve:
    name: Freeze metadata-only Deform360 reserve / gpuserver4090
    needs: [contracts, authorize]
    if: >-
      always() &&
      needs.contracts.result == 'success' &&
      needs.authorize.result == 'success' &&
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.ref == 'refs/heads/research/transport4d-tiered-public-v1'
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 60
    steps:
      - name: Admit exact runner and source revision
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_OS}" = Linux
          test "${RUNNER_ARCH}" = X64
          test -d "${DATASET_ROOT}"
      - name: Check out exact reviewed request revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
          clean: true
      - name: Reverify request, protocol, and clean tree
        shell: bash
        env:
          SOURCE_REVISION: ${{ needs.authorize.outputs.source_revision }}
        run: |
          set -euo pipefail
          test "$(git rev-parse "${GITHUB_SHA}^")" = "${SOURCE_REVISION}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python3 -m py_compile \
            src/bayesian_phystwin_experiments/transport4d_public_reserve_v1.py \
            scripts/science/audit_transport4d_deform360_reserve_v1.py
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          request = json.loads(Path(os.environ["REQUEST_PATH"]).read_text())
          assert request["metadata_only"] is True
          assert request["numeric_payload_authorized"] is False
          assert request["confirmation_authorized"] is False
          assert request["paper_claim_authorized"] is False
          assert request["protocol_id"] == os.environ["EXPECTED_PROTOCOL_ID"]
          PY
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Run metadata-only reservation
        shell: bash
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/transport4d-reserve-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "${output}"
          mkdir -p -- "${output}"
          echo "OUTPUT_ROOT=${output}" >> "${GITHUB_ENV}"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "revision=${GITHUB_SHA}"
            echo "source_revision=${{ needs.authorize.outputs.source_revision }}"
            echo "request_id=${{ needs.authorize.outputs.request_id }}"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "dataset_root=$(readlink -f -- "${DATASET_ROOT}")"
            python3 --version
            uname -a
          } > "${output}/environment.txt"
          PYTHONPATH=src python3 \
            scripts/science/audit_transport4d_deform360_reserve_v1.py \
            --data-root "${DATASET_ROOT}" \
            --protocol "${RESERVE_PROTOCOL}" \
            --action-kernel-protocol "${ACTION_PROTOCOL}" \
            --untouched-protocol "${UNTOUCHED_PROTOCOL}" \
            --output "${output}/reserve.json" \
            --report "${output}/reserve.md"
      - name: Validate target closure and result identity
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src OUTPUT_ROOT="${OUTPUT_ROOT}" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          from bayesian_phystwin_experiments.transport4d_public_reserve_v1 import (
              canonical_id,
          )

          path = Path(os.environ["OUTPUT_ROOT"]) / "reserve.json"
          result = json.loads(path.read_text(encoding="utf-8"))
          supplied = result.pop("reserve_id")
          if canonical_id(result) != supplied:
              raise SystemExit("reserve identity mismatch")
          result["reserve_id"] = supplied
          boundary = result["information_boundary"]
          required_false = (
              "robot_numeric_payload_opened",
              "tactile_numeric_payload_opened",
              "camera_pixel_opened",
              "geometry_or_point_cloud_opened",
              "target_outcome_opened",
              "confirmation_authorized",
              "paper_claim_authorized",
          )
          if any(boundary[name] is not False for name in required_false):
              raise SystemExit("metadata-only information boundary changed")
          if any(row["numeric_payload_opened"] is not False for row in result["objects"]):
              raise SystemExit("one reserved object reports numeric payload access")
          print(json.dumps({
              "status": result["status"],
              "reserve_id": supplied,
              "metadata_object_count": result["metadata_object_count"],
              "protected_object_count": result["protected_object_count"],
              "remaining_metadata_object_count": result["remaining_metadata_object_count"],
              "calibration_object_count": result["calibration_object_count"],
              "confirmation_object_count": result["confirmation_object_count"],
              "reservation_ready": result["reservation_ready"],
              "numeric_payload_opened": False,
          }, indent=2, sort_keys=True))
          PY
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Publish reserve summary
        if: always()
        shell: bash
        run: |
          if test -f "${OUTPUT_ROOT}/reserve.md"; then
            cat "${OUTPUT_ROOT}/reserve.md" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "No reserve result was produced." >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Upload compact metadata reserve
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: transport4d-deform360-reserve-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.OUTPUT_ROOT }}/reserve.json
            ${{ env.OUTPUT_ROOT }}/reserve.md
            ${{ env.OUTPUT_ROOT }}/environment.txt
          if-no-files-found: warn
          retention-days: 90
