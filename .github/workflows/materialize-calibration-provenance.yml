name: Materialize calibration provenance hardening

on:
  push:
    branches:
      - agent/fix-calibration-provenance
    paths:
      - .github/workflows/materialize-calibration-provenance.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.head_commit.message == 'Materialize calibration provenance hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out transport commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .agent/calibration-provenance.b64.* | base64 --decode > /tmp/calibration-provenance-patch.py
          python /tmp/calibration-provenance-patch.py
          rm -f .agent/calibration-provenance.b64.*
          rmdir .agent

      - name: Install development dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Format and commit source patch
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/bayesian_phystwin/deform360_calibration_execution.py
            src/bayesian_phystwin/deform360_calibration_bundle.py
            src/bayesian_phystwin/deform360_visual_provider_lock.py
            src/bayesian_phystwin/cli/deform360_calibration_execution.py
            tests/test_deform360_calibration_bundle.py
            tests/test_deform360_calibration_execution.py
            tests/test_deform360_calibration_execution_boundaries.py
            tests/test_deform360_visual_provider_lock.py
          )
          python -m ruff check --fix "${files[@]}"
          python -m ruff format "${files[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden calibration provenance sealing"

      - name: Validate committed patch
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/bayesian_phystwin/deform360_calibration_execution.py
            src/bayesian_phystwin/deform360_calibration_bundle.py
            src/bayesian_phystwin/deform360_visual_provider_lock.py
            src/bayesian_phystwin/cli/deform360_calibration_execution.py
            tests/test_deform360_calibration_bundle.py
            tests/test_deform360_calibration_execution.py
            tests/test_deform360_calibration_execution_boundaries.py
            tests/test_deform360_visual_provider_lock.py
          )
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy --no-site-packages \
            src/bayesian_phystwin/deform360_calibration_execution.py \
            src/bayesian_phystwin/deform360_calibration_bundle.py \
            src/bayesian_phystwin/deform360_visual_provider_lock.py \
            src/bayesian_phystwin/cli/deform360_calibration_execution.py
          python -m pytest -q \
            tests/test_deform360_calibration_bundle.py \
            tests/test_deform360_calibration_execution.py \
            tests/test_deform360_calibration_execution_boundaries.py \
            tests/test_deform360_visual_provider_lock.py
          python -m compileall -q src/bayesian_phystwin
          test -z "$(git status --porcelain)"

      - name: Publish source commit
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:agent/fix-calibration-provenance
