name: Repair PR 29 provider quality

on:
  push:
    branches: [agent/owned-phystwin-provider-v2]
    paths:
      - ".github/workflows/repair-pr29-provider-quality.yml"

permissions:
  contents: write

concurrency:
  group: repair-pr29-provider-quality
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/owned-phystwin-provider-v2
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[dev,graph]" opencv-python-headless
      - name: Repair import ordering and mypy target
        shell: bash
        run: |
          python -m ruff check --fix src/bayesian_phystwin/causal4d_provider_v1.py
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/causal4d-provider-compatibility.yml")
          text = path.read_text(encoding="utf-8")
          old = "          python -m mypy \\\n"
          new = "          python -m mypy --python-version 3.12 \\\n"
          if old not in text:
              raise SystemExit("provider mypy invocation not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Validate repaired provider surface
        run: |
          python -m ruff check \
            src/bayesian_phystwin/contracts \
            src/bayesian_phystwin/phystwin \
            src/bayesian_phystwin/causal4d_provider_v1.py \
            src/bayesian_phystwin/causal4d_provider_v2.py \
            tests/test_causal4d_provider_v2.py
          python -m mypy --python-version 3.12 \
            src/bayesian_phystwin/contracts \
            src/bayesian_phystwin/phystwin \
            src/bayesian_phystwin/causal4d_provider_v1.py \
            src/bayesian_phystwin/causal4d_provider_v2.py
          python -m pytest -q \
            tests/test_causal4d_provider_v1.py \
            tests/test_causal4d_provider_v2.py
          git diff --check
      - name: Commit repaired branch
        shell: bash
        run: |
          rm .github/workflows/repair-pr29-provider-quality.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix provider quality diagnostics"
          git push origin HEAD:agent/owned-phystwin-provider-v2
