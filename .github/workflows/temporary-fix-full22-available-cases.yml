name: Temporary full-22 available-cases compatibility repair

on:
  push:
    branches:
      - agent/portable-full22-anchor-reproduction
    paths:
      - .github/workflows/temporary-fix-full22-available-cases.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temporary-fix-full22-available-cases.yml

permissions:
  contents: write

concurrency:
  group: temporary-full22-available-cases-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 15
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/portable-full22-anchor-reproduction
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Patch compatibility-manifest construction and regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          repository = Path.cwd()
          workflow_paths = (
              repository / ".github/workflows/full22-anchor-reproduction.yml",
              repository / ".github/workflows/full22-anchor-reproduction-workstation.yml",
          )
          old = "          compatibility_manifest.write_bytes(source_manifest.read_bytes())"
          new = '''          source_payload = json.loads(
              source_manifest.read_text(encoding="utf-8")
          )
          selected_cases = source_payload.get("selected_cases")
          if (
              not isinstance(selected_cases, list)
              or len(selected_cases) != 22
              or any(not isinstance(case, str) or not case for case in selected_cases)
              or len(set(selected_cases)) != 22
          ):
              raise SystemExit("trajectory manifest does not bind 22 unique cases")
          compatibility_payload = dict(source_payload)
          compatibility_payload["available_cases"] = list(selected_cases)
          compatibility_manifest.write_text(
              json.dumps(compatibility_payload, indent=2, sort_keys=True) + "\\n",
              encoding="utf-8",
          )'''
          for path in workflow_paths:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected one verbatim-manifest copy in {path}, found {count}"
                  )
              path.write_text(text.replace(old, new), encoding="utf-8")

          test_path = repository / "tests/test_full22_reproduction_capsule.py"
          test_text = test_path.read_text(encoding="utf-8")
          anchor = 'EXPECTED_PATH = SCRIPT_PATH.with_name("expected_metrics.json")\n'
          constants = '''EXPECTED_PATH = SCRIPT_PATH.with_name("expected_metrics.json")
          WORKFLOW_PATHS = (
              Path(__file__).parents[1]
              / ".github"
              / "workflows"
              / "full22-anchor-reproduction.yml",
              Path(__file__).parents[1]
              / ".github"
              / "workflows"
              / "full22-anchor-reproduction-workstation.yml",
          )
          '''
          if test_text.count(anchor) != 1:
              raise SystemExit("unexpected expected-metrics constant anchor")
          test_text = test_text.replace(anchor, constants)
          test_anchor = '\n\ndef test_manifest_command_binds_claim_protocol_and_outputs'
          regression = '''

          @pytest.mark.parametrize("workflow_path", WORKFLOW_PATHS)
          def test_workflows_construct_source_compatible_manifest(
              workflow_path: Path,
          ) -> None:
              workflow = workflow_path.read_text(encoding="utf-8")

              assert "compatibility_manifest.write_bytes" not in workflow
              assert (
                  'compatibility_payload["available_cases"] = list(selected_cases)'
                  in workflow
              )
              assert "len(selected_cases) != 22" in workflow


          def test_manifest_command_binds_claim_protocol_and_outputs'''
          if test_text.count(test_anchor) != 1:
              raise SystemExit("unexpected manifest-command test anchor")
          test_path.write_text(
              test_text.replace(test_anchor, regression),
              encoding="utf-8",
          )

          (repository / ".github/workflows/temporary-fix-full22-available-cases.yml").unlink()
          PY

          python3 -m py_compile tests/test_full22_reproduction_capsule.py
          grep -q 'compatibility_payload\["available_cases"\] = list(selected_cases)' \
            .github/workflows/full22-anchor-reproduction.yml
          grep -q 'compatibility_payload\["available_cases"\] = list(selected_cases)' \
            .github/workflows/full22-anchor-reproduction-workstation.yml
          ! grep -q 'compatibility_manifest.write_bytes' \
            .github/workflows/full22-anchor-reproduction.yml
          ! grep -q 'compatibility_manifest.write_bytes' \
            .github/workflows/full22-anchor-reproduction-workstation.yml
          git diff --check

      - name: Commit and publish clean repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Construct source-compatible full-22 manifests"
          git push origin HEAD:agent/portable-full22-anchor-reproduction
