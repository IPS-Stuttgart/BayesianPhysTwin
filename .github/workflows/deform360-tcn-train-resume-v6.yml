# workflow-lifecycle: temporary-one-shot
# workflow-owner: IPS-Stuttgart maintainers
name: Deform360 matched TCN training resume v6

on:
  push:
    branches: [science/deform360-tcn-fallback-runner-v6]
    paths:
      - ".github/requests/deform360-tcn-train-resume-v6.json"

permissions:
  contents: read

concurrency:
  group: deform360-tcn-train-resume-v6
  cancel-in-progress: false

env:
  BASE_PROTOCOL_PATH: protocols/deform360_tcn_baseline_v6.json
  EVALUATOR_PATH: scripts/science/run_deform360_tcn_baseline_v6.py
  MATERIALIZER_PATH: scripts/science/materialize_deform360_tcn_carriers_v6.py
  DATASET_CACHE_ROOT: /home/github-runner/.cache/datasets/deform360-tcn-carriers-v6-5ea8c5d3-e92deaf7
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"
  CUBLAS_WORKSPACE_CONFIG: ":4096:8"
  CUDA_VISIBLE_DEVICES: "0"
  OMP_NUM_THREADS: "4"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  contracts:
    name: Canonical-root resume contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Compile unchanged evaluator and transport
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            "${MATERIALIZER_PATH}" \
            scripts/science/materialize_deform360_tcn_carriers_v6_base.py \
            scripts/science/run_deform360_action_conditioned_tactile_v2.py \
            scripts/science/run_deform360_action_kernel_v3.py \
            "${EVALUATOR_PATH}"
          python - <<'PY'
          import json
          from pathlib import Path

          protocol = json.loads(Path("protocols/deform360_tcn_baseline_v6.json").read_text())
          assert len(protocol["development_object_ids"]) == 14
          assert len(protocol["evaluation_object_ids"]) == 92
          assert protocol["training"]["history_frames"] == 8
          assert protocol["training"]["future_action_samples"] == 9
          assert protocol["statistics"]["expected_held_out_count"] == 21
          PY

  evaluate:
    name: Matched TCN comparison / cached alternate GPU runner
    needs: contracts
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 360
    steps:
      - name: Check out exact comparison source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true

      - name: Bind canonical cache and output
        shell: bash
        run: |
          set -euo pipefail
          canonical="$(readlink -f -- "${DATASET_CACHE_ROOT}")"
          test -n "${canonical}"
          test -d "${canonical}/raw-repository/raw"
          test -d "${canonical}/processed-repository/processed"
          output="${RUNNER_TEMP}/deform360-tcn-resume-v6-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          venv="${RUNNER_TEMP}/deform360-tcn-resume-venv-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "${output}" "${venv}"
          mkdir -p -- "${output}"
          {
            echo "CANONICAL_DATASET_ROOT=${canonical}"
            echo "OUTPUT_ROOT=${output}"
            echo "VENV_ROOT=${venv}"
            echo "EFFECTIVE_PROTOCOL=${output}/effective-protocol.json"
          } >> "${GITHUB_ENV}"

      - name: Revalidate cached selective carriers
        shell: bash
        run: |
          set -euo pipefail
          python3 "${MATERIALIZER_PATH}" \
            --protocol "${BASE_PROTOCOL_PATH}" \
            --output-root "${CANONICAL_DATASET_ROOT}" \
            --manifest "${OUTPUT_ROOT}/carrier-manifest.json" \
            --workers 12 \
            2>&1 | tee "${OUTPUT_ROOT}/materialization.log"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads((Path(os.environ["OUTPUT_ROOT"]) / "carrier-manifest.json").read_text())
          if manifest["status"] != "complete" or manifest["object_count"] != 106:
              raise SystemExit("cached selective carrier set is incomplete")
          if any(manifest[key] != 0 for key in (
              "camera_files_downloaded",
              "geometry_or_point_cloud_files_downloaded",
              "video_files_downloaded",
          )):
              raise SystemExit("forbidden payload class entered cache")
          PY

      - name: Bootstrap isolated CUDA Torch runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv --without-pip "${VENV_ROOT}"
          curl --fail --location --retry 4 --retry-all-errors \
            https://bootstrap.pypa.io/get-pip.py \
            --output "${RUNNER_TEMP}/get-pip-${GITHUB_RUN_ID}.py"
          "${VENV_ROOT}/bin/python" "${RUNNER_TEMP}/get-pip-${GITHUB_RUN_ID}.py"
          "${VENV_ROOT}/bin/python" -m pip install numpy==1.26.4
          "${VENV_ROOT}/bin/python" -m pip install \
            "torch==2.8.0+cu128" \
            --index-url https://download.pytorch.org/whl/cu128
          echo "PYTHON_BIN=${VENV_ROOT}/bin/python" >> "${GITHUB_ENV}"

      - name: Freeze canonical transport protocol and validate runtime
        shell: bash
        run: |
          set -euo pipefail
          "${PYTHON_BIN}" - <<'PY'
          import json
          import os
          from pathlib import Path

          protocol = json.loads(Path(os.environ["BASE_PROTOCOL_PATH"]).read_text())
          protocol["status"] = "frozen-before-canonical-cache-cuda-execution"
          protocol["dataset_root"] = os.environ["CANONICAL_DATASET_ROOT"]
          protocol["training"]["device"] = "cuda"
          protocol["training"]["torch_threads"] = 4
          protocol["execution_transport"] = {
              "canonical_cache_root": os.environ["CANONICAL_DATASET_ROOT"],
              "raw_revision": "5ea8c5d3fc7b4a7b4f9f921f2ceb1de24610f6a4",
              "processed_revision": "e92deaf7e437e7e51ad464706ae647f522a279d9",
              "comparison_method_changed": False,
              "scientific_protocol_changed": False,
              "path_canonicalization_only": True,
          }
          Path(os.environ["EFFECTIVE_PROTOCOL"]).write_text(
              json.dumps(protocol, indent=2, sort_keys=True) + "\n"
          )
          PY
          "${PYTHON_BIN}" - <<'PY'
          import torch
          if not torch.cuda.is_available():
              raise SystemExit("CUDA unavailable")
          value = torch.nn.Conv1d(8, 8, 3, padding=1).cuda()(
              torch.zeros((2, 8, 8), device="cuda")
          )
          if not torch.isfinite(value).all():
              raise SystemExit("CUDA smoke failed")
          print(torch.__version__, torch.cuda.get_device_name(0))
          PY
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "revision=${GITHUB_SHA}"
            echo "runner_name=${RUNNER_NAME}"
            echo "canonical_dataset_root=${CANONICAL_DATASET_ROOT}"
            sha256sum \
              "${BASE_PROTOCOL_PATH}" \
              "${EFFECTIVE_PROTOCOL}" \
              "${EVALUATOR_PATH}" \
              "${MATERIALIZER_PATH}" \
              scripts/science/materialize_deform360_tcn_carriers_v6_base.py
            "${PYTHON_BIN}" --version
            nvidia-smi --query-gpu=index,name,uuid,driver_version,memory.total \
              --format=csv,noheader
          } | tee "${OUTPUT_ROOT}/environment.txt"

      - name: Train and evaluate matched state-only and action TCNs
        shell: bash
        run: |
          set -euo pipefail
          "${PYTHON_BIN}" "${EVALUATOR_PATH}" \
            --protocol "${EFFECTIVE_PROTOCOL}" \
            --data-root "${CANONICAL_DATASET_ROOT}" \
            --output-json "${OUTPUT_ROOT}/result.json" \
            --output-report "${OUTPUT_ROOT}/report.md" \
            --output-csv "${OUTPUT_ROOT}/object-results.csv" \
            2>&1 | tee "${OUTPUT_ROOT}/console.log"
          cat "${OUTPUT_ROOT}/report.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify complete matched comparison
        shell: bash
        run: |
          set -euo pipefail
          "${PYTHON_BIN}" - <<'PY'
          import json
          import math
          import os
          from pathlib import Path

          result = json.loads((Path(os.environ["OUTPUT_ROOT"]) / "result.json").read_text())
          if result["status"] != "complete":
              raise SystemExit("TCN comparison incomplete")
          if result["summary"]["object_count"] != 92:
              raise SystemExit("92-object roster changed")
          if result["summary"]["held_out_action_family"]["object_count"] != 21:
              raise SystemExit("21-object harder subset changed")
          reproduced = result["summary"]["methods"]["v3_bayesian_action_ensemble"]
          if not math.isclose(reproduced, 0.6283797735320816, rel_tol=0.0, abs_tol=1e-10):
              raise SystemExit(f"frozen v3 aggregate changed: {reproduced}")
          models = result["final_model_freeze"]["models"]
          if models["state_only_tcn"]["parameter_count"] != models["action_conditioned_tcn"]["parameter_count"]:
              raise SystemExit("TCN parameter counts differ")
          if result["final_model_freeze"]["target_tactile_opened_after_freeze"] is not True:
              raise SystemExit("target access preceded model freeze")
          PY
          sha256sum "${OUTPUT_ROOT}"/* > "${OUTPUT_ROOT}/sha256sums.txt"

      - name: Upload complete competitive-baseline evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deform360-tcn-train-resume-v6-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_ROOT }}
          if-no-files-found: warn
          retention-days: 90

      - name: Remove isolated numerical runtime
        if: always()
        shell: bash
        run: rm -rf -- "${VENV_ROOT:-}"
