name: Publish causal source-competence product

on:
  pull_request:
    branches: [main]
    paths:
      - ".staging/causal_source_competence_payload.part*"
      - ".github/workflows/publish-causal-source-competence.yml"

permissions:
  contents: write

concurrency:
  group: publish-causal-source-competence-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_SHA: a0d2f4ec7100be98b33fe2253c80202da7eb8d39
  PAYLOAD_BASE64_SHA256: 9d306ba82f1e2559183c45f6b7704ee00c5761abbde9421a5e9e51539933e695
  PAYLOAD_TARGZ_SHA256: 89e867da26a91c26afa2c4c66208d4e7ba2378f8fa1e8974b6a85099534a9029
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  publish:
    name: Verify, test, and replace staging history
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 30
    steps:
      - name: Check out staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/causal-source-competence
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Provision Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Reconstruct exact payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import os
          import tarfile
          from pathlib import Path, PurePosixPath

          expected = {
              ".github/workflows/causal-source-competence.yml",
              "docs/causal_source_competence.md",
              "src/bayesian_phystwin/causal_source_competence.py",
              "tests/test_causal_source_competence.py",
          }
          chunks = [
              Path(f".staging/causal_source_competence_payload.part{index}")
              for index in range(1, 3)
          ]
          if any(not path.is_file() for path in chunks):
              raise SystemExit("causal source-competence payload is incomplete")
          encoded = "".join(path.read_text(encoding="ascii").strip() for path in chunks)
          if hashlib.sha256(encoded.encode("ascii")).hexdigest() != os.environ[
              "PAYLOAD_BASE64_SHA256"
          ]:
              raise SystemExit("causal source-competence base64 digest mismatch")
          payload = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(payload).hexdigest() != os.environ[
              "PAYLOAD_TARGZ_SHA256"
          ]:
              raise SystemExit("causal source-competence tar digest mismatch")
          with tarfile.open(fileobj=io.BytesIO(payload), mode="r:gz") as archive:
              members = archive.getmembers()
              names = {member.name for member in members}
              if names != expected or len(members) != len(expected):
                  raise SystemExit(f"unexpected payload paths: {sorted(names)}")
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts or not member.isfile():
                      raise SystemExit(f"inadmissible payload member: {member.name}")
                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit(f"payload member has no bytes: {member.name}")
                  target = Path(member.name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(source.read())
          PY

      - name: Create isolated environment
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/source-competence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "${root}"
          python -m venv "${root}/venv"
          echo "${root}/venv/bin" >> "${GITHUB_PATH}"
          "${root}/venv/bin/python" -m pip install \
            "pip==25.2" "setuptools==80.9.0" "wheel==0.45.1"
          "${root}/venv/bin/python" -m pip install -e ".[dev]"
          "${root}/venv/bin/python" -m pip check

      - name: Format and validate product
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            src/bayesian_phystwin/causal_source_competence.py
            tests/test_causal_source_competence.py
          )
          python -m ruff format "${paths[@]}"
          python -m ruff check "${paths[@]}"
          python -m mypy src/bayesian_phystwin/causal_source_competence.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_causal_source_competence.py \
            tests/test_structured_reliability.py
          python -m py_compile \
            src/bayesian_phystwin/causal_source_competence.py \
            tests/test_causal_source_competence.py
          python -m pip check
          git diff --check

      - name: Replace staging history with product commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .staging/causal_source_competence_payload.part{1,2}
          rmdir .staging 2>/dev/null || true
          rm -f .github/workflows/publish-causal-source-competence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --soft "${BASE_SHA}"
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          test ! -e .github/workflows/publish-causal-source-competence.yml
          test ! -d .staging
          git commit -m "Add causal source-competence filtering"
          git push --force-with-lease origin "HEAD:feature/causal-source-competence"
