# workflow-lifecycle: temporary-one-shot
# workflow-owner: IPS-Stuttgart maintainers
name: Format DLO45 evidence collector v1

on:
  push:
    branches: [evidence/deform-dlo45-run-33361441865]
    paths:
      - .github/workflows/format-deform-dlo45-evidence-collector-v1.yml

permissions:
  contents: write

concurrency:
  group: format-deform-dlo45-evidence-collector-v1
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out evidence branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: evidence/deform-dlo45-run-33361441865
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Format and self-test collector
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install ruff==0.16.5
          target=scripts/science/collect_deform_dlo45_run_evidence_v1.py
          ruff check --fix "$target"
          ruff format "$target"
          ruff check "$target"
          ruff format --check "$target"
          python "$target" --self-test

      - name: Publish formatting and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/format-deform-dlo45-evidence-collector-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/science/collect_deform_dlo45_run_evidence_v1.py \
            .github/workflows/format-deform-dlo45-evidence-collector-v1.yml
          git diff --cached --check
          git commit -m 'Format DLO4 DLO5 evidence collector'
          git push origin HEAD:evidence/deform-dlo45-run-33361441865
