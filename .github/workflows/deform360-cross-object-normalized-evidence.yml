name: Temporary harden Deform360 cross-object diagnostic

on:
  push:
    branches:
      - agent/deform360-cross-object-normalized-evidence-v1
    paths:
      - ".github/workflows/deform360-cross-object-normalized-evidence.yml"
      - ".github/scripts/patch_deform360_cross_object_v1.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deform360-cross-object-normalized-evidence.yml"
      - ".github/scripts/patch_deform360_cross_object_v1.py"

permissions:
  contents: write

concurrency:
  group: temporary-harden-deform360-cross-object-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact publication branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/deform360-cross-object-normalized-evidence-v1
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install focused validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,graph]" "ruff==0.16.1"
          python -m pip check

      - name: Apply and validate the hardening patch
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile .github/scripts/patch_deform360_cross_object_v1.py
          python .github/scripts/patch_deform360_cross_object_v1.py
          python -m pytest -q \
            tests/test_deform360_cross_object_normalized_evidence.py \
            tests/test_endpoint_model_average.py
          git diff --check

      - name: Restore and harden the permanent read-only workflow
        shell: bash
        run: |
          set -euo pipefail
          git show 62920d0225daa133d7a38a32ff9e5a43b01f5a13:.github/workflows/deform360-cross-object-normalized-evidence.yml \
            > .github/workflows/deform360-cross-object-normalized-evidence.yml
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/deform360-cross-object-normalized-evidence.yml")
          text = path.read_text(encoding="utf-8")
          old_execute = '''      - name: Execute locked cross-object diagnostic
                shell: bash
                run: |
                  set -euo pipefail
                  mkdir -p "${OUTPUT_ROOT}/result"
                  /usr/bin/time -v \\
                    -o "${OUTPUT_ROOT}/resource-usage.txt" \\
                    "${VENV_ROOT}/bin/python" \\
                      scripts/science/run_deform360_cross_object_normalized_evidence.py \\
                      --data-root "${DEFORM360_DATA_ROOT}" \\
                      --protocol protocols/deform360_cross_object_normalized_evidence_v1.json \\
                      --output-dir "${OUTPUT_ROOT}/result" \\
                      --workers "${EVALUATION_WORKERS}" \\
                      --revision "${GITHUB_SHA}" \\
                    | tee "${OUTPUT_ROOT}/compact-console.json"
          '''.replace("        ", "")
          new_execute = '''      - name: Execute locked cross-object diagnostic
                shell: bash
                run: |
                  set -uo pipefail
                  mkdir -p "${OUTPUT_ROOT}/result"
                  set +e
                  /usr/bin/time -v \\
                    -o "${OUTPUT_ROOT}/resource-usage.txt" \\
                    "${VENV_ROOT}/bin/python" \\
                      scripts/science/run_deform360_cross_object_normalized_evidence.py \\
                      --data-root "${DEFORM360_DATA_ROOT}" \\
                      --protocol protocols/deform360_cross_object_normalized_evidence_v1.json \\
                      --output-dir "${OUTPUT_ROOT}/result" \\
                      --workers "${EVALUATION_WORKERS}" \\
                      --revision "${GITHUB_SHA}" \\
                    | tee "${OUTPUT_ROOT}/compact-console.json"
                  decision_exit_code=${PIPESTATUS[0]}
                  set -e
                  if [[ ${decision_exit_code} -ne 0 && ${decision_exit_code} -ne 3 ]]; then
                    echo "Unexpected evaluator exit code: ${decision_exit_code}" >&2
                    exit "${decision_exit_code}"
                  fi
                  echo "DECISION_EXIT_CODE=${decision_exit_code}" >> "${GITHUB_ENV}"
                  printf '%s\\n' "${decision_exit_code}" \\
                    > "${OUTPUT_ROOT}/decision-exit-code.txt"
          '''.replace("        ", "")
          if text.count(old_execute) != 1:
              raise SystemExit("permanent execute-step anchor changed")
          text = text.replace(old_execute, new_execute, 1)

          old_manifest = '''          manifest = json.loads(
                        (result_root / "artifact_manifest.json").read_text(encoding="utf-8")
                    )
                    expected_protocol = "1fea455cd61fa838d94bb4892973ba944d851b894c876087431fab6461a60ad4"
          '''.replace("        ", "")
          new_manifest = '''          manifest = json.loads(
                        (result_root / "artifact_manifest.json").read_text(encoding="utf-8")
                    )
                    decision_exit_code = int(os.environ["DECISION_EXIT_CODE"])
                    expected_protocol = "1fea455cd61fa838d94bb4892973ba944d851b894c876087431fab6461a60ad4"
          '''.replace("        ", "")
          if text.count(old_manifest) != 1:
              raise SystemExit("permanent verification manifest anchor changed")
          text = text.replace(old_manifest, new_manifest, 1)

          old_counts = '''          if len(summary["input_archives"]) != 33 or len(summary["folds"]) != 6:
                        raise SystemExit("executed cohort size differs from the locked protocol")
                    if summary["diagnosis"]["no_automatic_claim_promotion"] is not True:
                        raise SystemExit("diagnostic unexpectedly promotes a claim")
          '''.replace("        ", "")
          new_counts = '''          input_archives = summary["input_archives"]
                    if len(input_archives) != 33 or len(summary["folds"]) != 6:
                        raise SystemExit("executed cohort size differs from the locked protocol")
                    if any(int(item["byte_count"]) <= 0 for item in input_archives):
                        raise SystemExit("an input archive has an invalid byte count")
                    input_hashes = [str(item["sha256"]) for item in input_archives]
                    if len(input_hashes) != len(set(input_hashes)):
                        raise SystemExit("duplicate input archive content was executed")
                    input_set_sha256 = summary["input_set_sha256"]
                    if readout["input_set_sha256"] != input_set_sha256:
                        raise SystemExit("readout does not bind the selected input bytes")
                    if manifest["input_set_sha256"] != input_set_sha256:
                        raise SystemExit("artifact manifest does not bind the selected input bytes")
                    boundary_count = int(summary["aggregate"]["boundary_selection_count"])
                    expected_exit_code = 3 if boundary_count else 0
                    expected_status = (
                        "inconclusive-boundary-selection"
                        if boundary_count
                        else "completed-retrospective-diagnostic"
                    )
                    if decision_exit_code != expected_exit_code:
                        raise SystemExit("decision exit code does not match the boundary-selection result")
                    if summary["scientific_status"] != expected_status:
                        raise SystemExit("summary scientific status is inconsistent")
                    if readout["scientific_status"] != expected_status:
                        raise SystemExit("readout scientific status is inconsistent")
                    if summary["diagnosis"]["no_automatic_claim_promotion"] is not True:
                        raise SystemExit("diagnostic unexpectedly promotes a claim")
          '''.replace("        ", "")
          if text.count(old_counts) != 1:
              raise SystemExit("permanent verification cohort anchor changed")
          text = text.replace(old_counts, new_counts, 1)

          old_compact = '''              "manifest_sha256": manifest["manifest_sha256"],
                        "selected_kappas": summary["aggregate"]["selected_kappas"],
          '''.replace("        ", "")
          new_compact = '''              "manifest_sha256": manifest["manifest_sha256"],
                        "input_set_sha256": input_set_sha256,
                        "scientific_status": summary["scientific_status"],
                        "decision_exit_code": decision_exit_code,
                        "selected_kappas": summary["aggregate"]["selected_kappas"],
          '''.replace("        ", "")
          if text.count(old_compact) != 1:
              raise SystemExit("permanent compact-readout anchor changed")
          text = text.replace(old_compact, new_compact, 1)
          path.write_text(text, encoding="utf-8")
          PY
          git diff --check

      - name: Publish ordinary reviewable source only
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/scripts/patch_deform360_cross_object_v1.py
          git add \
            .github/workflows/deform360-cross-object-normalized-evidence.yml \
            docs/deform360_cross_object_normalized_evidence_v1.md \
            scripts/science/run_deform360_cross_object_normalized_evidence.py \
            tests/test_deform360_cross_object_normalized_evidence.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Harden cross-object Deform360 evidence diagnostic"
          git push origin HEAD:agent/deform360-cross-object-normalized-evidence-v1
