# workflow-lifecycle: temporary-one-shot
# workflow-owner: IPS-Stuttgart maintainers
name: Repair anytime admission typing v1

on:
  push:
    branches: [science/anytime-valid-simulator-admission-v1]
    paths:
      - ".github/workflows/repair-anytime-admission-typing-v1.yml"

permissions:
  contents: write

concurrency:
  group: repair-anytime-admission-typing-v1
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'IPS-Stuttgart/BayesianPhysTwin'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: science/anytime-valid-simulator-admission-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Add exact NumPy annotations and validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/bayesian_phystwin/anytime_admission_v1.py')
          text = path.read_text(encoding='utf-8')

          old = '    result = np.full(count, 1.0 / count, dtype=np.float64)'
          new = '    result: np.ndarray = np.full(count, 1.0 / count, dtype=np.float64)'
          if text.count(old) != 1:
              raise SystemExit(f'weight annotation: expected one match, got {text.count(old)}')
          text = text.replace(old, new)

          old = '        self._log_wealth = np.zeros(len(bets), dtype=np.float64)'
          new = '        self._log_wealth: np.ndarray = np.zeros(len(bets), dtype=np.float64)'
          if text.count(old) != 1:
              raise SystemExit(f'gain annotation: expected one match, got {text.count(old)}')
          text = text.replace(old, new)

          old = '        self._log_wealth = np.zeros(len(fractions), dtype=np.float64)'
          new = '        self._log_wealth: np.ndarray = np.zeros(len(fractions), dtype=np.float64)'
          if text.count(old) != 1:
              raise SystemExit(f'harm annotation: expected one match, got {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')

          test_path = Path('tests/test_anytime_recursive_admission_v1.py')
          test_text = test_path.read_text(encoding='utf-8')
          replacements = (
              (
                  'assert config.total_alpha_gain == pytest.approx(0.05)',
                  'assert config.total_alpha_gain == pytest.approx(0.025)',
              ),
              (
                  'assert config.total_alpha_harm == pytest.approx(0.05)',
                  'assert config.total_alpha_harm == pytest.approx(0.025)',
              ),
          )
          for old, new in replacements:
              if test_text.count(old) != 1:
                  raise SystemExit(f'alpha assertion: expected one match for {old!r}')
              test_text = test_text.replace(old, new)
          test_path.write_text(test_text, encoding='utf-8')
          PY
          python -m pip install -e '.[dev]'
          python -m ruff check \
            src/bayesian_phystwin/anytime_admission_v1.py \
            src/bayesian_phystwin_experiments/anytime_recursive_admission_v1.py \
            scripts/science/run_anytime_recursive_admission_v1.py \
            tests/test_anytime_admission_v1.py \
            tests/test_anytime_recursive_admission_v1.py
          python -m ruff format --check \
            src/bayesian_phystwin/anytime_admission_v1.py \
            src/bayesian_phystwin_experiments/anytime_recursive_admission_v1.py \
            scripts/science/run_anytime_recursive_admission_v1.py \
            tests/test_anytime_admission_v1.py \
            tests/test_anytime_recursive_admission_v1.py
          python -m mypy src/bayesian_phystwin/anytime_admission_v1.py
          python -m pytest -q \
            tests/test_anytime_admission_v1.py \
            tests/test_anytime_recursive_admission_v1.py

      - name: Remove one-shot workflow and publish
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-anytime-admission-typing-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/bayesian_phystwin/anytime_admission_v1.py \
            tests/test_anytime_recursive_admission_v1.py \
            .github/workflows/repair-anytime-admission-typing-v1.yml
          git diff --cached --check
          git commit -m 'Annotate anytime admission NumPy state'
          git push origin HEAD:science/anytime-valid-simulator-admission-v1
