name: One-shot resolve PR 137 against current main

on:
  push:
    branches:
      - agent/deform360-calibration-evidence-ledger

permissions:
  contents: write

concurrency:
  group: one-shot-resolve-pr137
  cancel-in-progress: true

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/deform360-calibration-evidence-ledger
          fetch-depth: 0

      - name: Replay the contract suites onto current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/tests.yml
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/tests.yml')
          text = path.read_text(encoding='utf-8')
          marker = '            tests/test_deform360_contact_anchor.py \\\n'
          addition = (
              '            tests/test_deform360_calibration_bundle.py \\\n'
              '            tests/test_evidence_use_ledger.py \\\n'
          )
          if addition not in text:
              occurrences = text.count(marker)
              if occurrences != 2:
                  raise SystemExit(
                      f'expected two stable/core contact-anchor markers, found {occurrences}'
                  )
              text = text.replace(marker, marker + addition)
          path.write_text(text.rstrip() + '\n', encoding='utf-8')
          PY
          rm .github/workflows/one-shot-resolve-pr137.yml

      - name: Commit the resolved branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/tests.yml .github/workflows/one-shot-resolve-pr137.yml
          git diff --cached --check
          git commit -m 'Rebase calibration contracts onto current main'
          git push origin HEAD:agent/deform360-calibration-evidence-ledger
