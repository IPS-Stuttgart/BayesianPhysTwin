name: Capability atlas format repair

on:
  push:
    branches: [feature/decision-capability-atlas-v1]
    paths:
      - ".github/workflows/capability-atlas-format-repair.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/decision-capability-atlas-v1
          persist-credentials: true
          fetch-depth: 0

      - name: Format changed Python sources
        run: |
          python -m pip install ruff==0.16.5
          python -m ruff format \
            src/bayesian_phystwin/decision_capability_atlas_v1.py \
            experiments/decision_capability_atlas_v1/run.py \
            tests/test_deform_dlo45_decision_capability_atlas_v1.py
          python -m ruff check \
            src/bayesian_phystwin/decision_capability_atlas_v1.py \
            experiments/decision_capability_atlas_v1/run.py \
            tests/test_deform_dlo45_decision_capability_atlas_v1.py

      - name: Commit formatting-only repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/bayesian_phystwin/decision_capability_atlas_v1.py \
            experiments/decision_capability_atlas_v1/run.py \
            tests/test_deform_dlo45_decision_capability_atlas_v1.py
          if git diff --cached --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git commit -m 'Format decision capability atlas sources'
          git push origin HEAD:feature/decision-capability-atlas-v1