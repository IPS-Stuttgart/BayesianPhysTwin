name: Apply prospective belief hardening

on:
  push:
    branches:
      - agent/prospective-belief-hardening
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/apply-prospective-belief-hardening.yml"
      - ".github/patches/prospective-belief-hardening/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-prospective-belief-hardening
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.ref_name == 'agent/prospective-belief-hardening' ||
      github.head_ref == 'agent/prospective-belief-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: agent/prospective-belief-hardening

      - name: Verify immutable publication inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "agent/prospective-belief-hardening"
          test "$(git merge-base HEAD origin/main)" = \
            "4f7e329eca8a6078e0337dec0a6530389860e8a9"
          test "$(find .github/patches/prospective-belief-hardening \
            -maxdepth 1 -type f -name 'part-*' | wc -l)" -eq 9

      - name: Reassemble, verify, and apply product patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patches/prospective-belief-hardening/part-* \
            > "$RUNNER_TEMP/prospective-belief.patch.gz.b64"
          base64 --decode \
            "$RUNNER_TEMP/prospective-belief.patch.gz.b64" \
            > "$RUNNER_TEMP/prospective-belief.patch.gz"
          echo "be085ef801467cfaf2a526415513e05638297ee9a56a3ea5d122d98d993d4792  $RUNNER_TEMP/prospective-belief.patch.gz" \
            | sha256sum --check --strict
          gzip --decompress --stdout \
            "$RUNNER_TEMP/prospective-belief.patch.gz" \
            > "$RUNNER_TEMP/prospective-belief.patch"
          echo "e325312a8fa91dbd717a0f8cafff1b562e38c06bc952b34ea8be558836bcad5f  $RUNNER_TEMP/prospective-belief.patch" \
            | sha256sum --check --strict
          git apply --check "$RUNNER_TEMP/prospective-belief.patch"
          git apply "$RUNNER_TEMP/prospective-belief.patch"
          rm -rf .github/patches/prospective-belief-hardening
          rm .github/workflows/apply-prospective-belief-hardening.yml

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate product tree
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m compileall -q src tests
          python -m pytest -q \
            tests/test_endpoint_model_average.py \
            tests/test_prospective_prob4d_update.py \
            tests/test_structured_reliability.py \
            tests/test_parameter_posterior.py \
            tests/test_release_metadata.py

      - name: Publish clean product commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          test ! -e .github/workflows/apply-prospective-belief-hardening.yml
          test ! -d .github/patches/prospective-belief-hardening
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "Add prospective belief update infrastructure"
          git push origin HEAD:agent/prospective-belief-hardening
