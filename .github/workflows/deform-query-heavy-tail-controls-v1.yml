# workflow-lifecycle: experimental
# workflow-owner: IPS-Stuttgart maintainers
name: DEFORM fixed-forecast heavy-tail controls v1

on:
  push:
    branches:
      - science/deform-conditional-query-posterior-v1
    paths:
      - .github/requests/deform-query-heavy-tail-controls-v1.json

permissions:
  contents: read
  actions: read

concurrency:
  group: deform-query-heavy-tail-controls-v1
  cancel-in-progress: false

env:
  CAPSULE: experiments/deform_query_heavy_tail_controls_v1
  REQUEST: .github/requests/deform-query-heavy-tail-controls-v1.json
  DATASET_ROOT: /mnt/seagate10tb/florianpfaff/datasets/deform/data_set
  PARENT_SCRIPT: experiments/deform_conditional_query_posterior_v1/run.py
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  controls:
    name: Calibrate and score independent heavy-tail controls
    runs-on: [self-hosted, gpuserver4090]
    timeout-minutes: 45
    steps:
      - name: Check out exact file-change trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Verify immutable source and request-only trigger
        env:
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          request = json.loads(Path(os.environ['REQUEST']).read_text())
          before = os.environ['BEFORE']
          changed = subprocess.check_output(['git', 'diff', '--name-only', before, os.environ['GITHUB_SHA']], text=True).splitlines()
          assert changed == [os.environ['REQUEST']], changed
          assert request['experiment_revision'] == before
          assert request['status'] == 'authorized'
          assert request['runner_labels'] == ['self-hosted', 'gpuserver4090']
          assert request['dataset_root'] == os.environ['DATASET_ROOT']
          assert request['parent_artifact_id'] == 9974939619
          assert request['official_eval_access'] is False
          assert request['new_acquisition'] is False
          for name, expected in request['git_blobs'].items():
              actual = subprocess.check_output(['git', 'hash-object', name], text=True).strip()
              assert actual == expected, (name, actual, expected)
          assert Path(os.environ['DATASET_ROOT']).is_dir()
          PY
          base="$RUNNER_TEMP/query-heavy-tail-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$base"
          echo "CAPSULE_OUTPUT=$base" >> "$GITHUB_ENV"
          echo "CAPSULE_PYTHON=$base/venv/bin/python" >> "$GITHUB_ENV"
          python -m venv "$base/venv"
          "$base/venv/bin/python" -m pip install 'numpy==2.2.6' 'scipy==1.15.3' 'pytest==8.4.2'
          "$base/venv/bin/python" -m pip freeze > "$base/runtime.txt"
          cp "$REQUEST" "$base/request.json"
          cp -r "$CAPSULE" "$base/source"
          cp .github/workflows/deform-query-heavy-tail-controls-v1.yml "$base/workflow.yml"

      - name: Numerical and future-data exclusion tests
        shell: bash
        run: |
          set -euo pipefail
          "$CAPSULE_PYTHON" -m pytest -q -p no:cacheprovider --import-mode=importlib \
            "$CAPSULE/test_run.py" \
            experiments/deform_conditional_query_posterior_v1/test_run.py 2>&1 | tee "$CAPSULE_OUTPUT/tests.log"

      - name: Fetch immutable parent evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          "$CAPSULE_PYTHON" - <<'PY'
          import os, shutil, urllib.request
          from pathlib import Path
          class StripAuthorization(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  redirected = super().redirect_request(req, fp, code, msg, headers, newurl)
                  if redirected is not None:
                      redirected.remove_header('Authorization')
                  return redirected
          request = urllib.request.Request(
              'https://api.github.com/repos/IPS-Stuttgart/BayesianPhysTwin/actions/artifacts/9974939619/zip',
              headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'BayesianPhysTwin-heavy-tail-controls',
              },
          )
          opener = urllib.request.build_opener(StripAuthorization())
          with opener.open(request, timeout=90) as response:
              with (Path(os.environ['CAPSULE_OUTPUT']) / 'parent.zip').open('wb') as output:
                  shutil.copyfileobj(response, output)
          PY
          echo "e7e182e009ac234fb611afb6ca03eb1006ee65da2688ec2a084105667fa4e591  $CAPSULE_OUTPUT/parent.zip" | sha256sum --check --strict

      - name: Calibrate, seal, and score the real-data controls
        shell: bash
        run: |
          set -euo pipefail
          "$CAPSULE_PYTHON" "$CAPSULE/run.py" \
            --parent-zip "$CAPSULE_OUTPUT/parent.zip" \
            --dataset-root "$DATASET_ROOT" \
            --output "$CAPSULE_OUTPUT/evidence" \
            --revision "$GITHUB_SHA" 2>&1 | tee "$CAPSULE_OUTPUT/run.log"
          cat "$CAPSULE_OUTPUT/evidence/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain completed or technical-failure evidence
        if: always() && env.CAPSULE_OUTPUT != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: deform-query-heavy-tail-controls-v1-${{ github.run_id }}
          path: |
            ${{ env.CAPSULE_OUTPUT }}/evidence/
            ${{ env.CAPSULE_OUTPUT }}/source/
            ${{ env.CAPSULE_OUTPUT }}/request.json
            ${{ env.CAPSULE_OUTPUT }}/workflow.yml
            ${{ env.CAPSULE_OUTPUT }}/tests.log
            ${{ env.CAPSULE_OUTPUT }}/runtime.txt
            ${{ env.CAPSULE_OUTPUT }}/run.log
          if-no-files-found: warn
          retention-days: 90

      - name: Remove only the job-owned virtual environment
        if: always() && env.CAPSULE_OUTPUT != ''
        shell: bash
        run: rm -rf -- "$CAPSULE_OUTPUT/venv"
