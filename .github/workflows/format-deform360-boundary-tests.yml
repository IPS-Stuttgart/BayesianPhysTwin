name: Format Deform360 boundary tests

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/format-deform360-boundary-tests.yml"

permissions:
  contents: write

concurrency:
  group: format-deform360-boundary-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/deform360-calibration-seal'
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 10
    steps:
      - name: Check out the exact pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          clean: true

      - name: Format and publish the boundary tests
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/deform360-ruff"
          ruff_python="$RUNNER_TEMP/deform360-ruff/bin/python"
          "$ruff_python" -m pip install --upgrade pip
          "$ruff_python" -m pip install "ruff==0.16.1"
          "$ruff_python" -m ruff check --fix \
            tests/test_deform360_calibration_execution_boundaries.py
          "$ruff_python" -m ruff format \
            tests/test_deform360_calibration_execution_boundaries.py
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_deform360_calibration_execution_boundaries.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Apply deterministic boundary-test formatting"
          git push origin "HEAD:${HEAD_REF}"
