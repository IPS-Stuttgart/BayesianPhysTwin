name: One-shot finalize PR 260

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/_one_shot_finalize_pr260.yml"
      - "scripts/_one_shot_fix_pr260_typing.py"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: one-shot-finalize-pr260
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 260 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref ==
        'feat/deform360-calibration-visual-production-plan-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply explicit parser narrowing
        run: |
          set -euo pipefail
          python scripts/_one_shot_fix_pr260_typing.py

      - name: Install validation environment
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev,graph]" "numpy>=1.24,<2.2"
          python -m pip check

      - name: Format source and register stable-core coverage
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/bayesian_phystwin/deform360_calibration_visual_production_plan.py
            scripts/science/build_deform360_calibration_visual_production_plan.py
            tests/test_deform360_calibration_visual_production_plan.py
          )
          python -m ruff check --fix "${files[@]}"
          python -m ruff format "${files[@]}"
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/tests.yml")
          source = path.read_text(encoding="utf-8")
          entry = "            tests/test_deform360_calibration_visual_production_plan.py \\\n"
          if entry not in source:
              anchor = "            tests/test_deform360_visual_provider_lock.py \\\n"
              if anchor not in source:
                  raise SystemExit("stable-core coverage anchor changed")
              source = source.replace(anchor, anchor + entry, 1)
          path.write_text(source, encoding="utf-8")
          PY
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          git diff --check

      - name: Run focused and adjacent contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -p no:cacheprovider \
            tests/test_deform360_calibration_visual_production_plan.py \
            tests/test_deform360_calibration_observability_batch.py \
            tests/test_deform360_calibration_observability_case_builder.py \
            tests/test_deform360_calibration_source_run_record.py \
            tests/test_deform360_visual_provider_lock.py
          python -m mypy \
            src/bayesian_phystwin/deform360_calibration_visual_production_plan.py \
            scripts/science/build_deform360_calibration_visual_production_plan.py
          python -W error::SyntaxWarning -m py_compile \
            src/bayesian_phystwin/deform360_calibration_visual_production_plan.py \
            scripts/science/build_deform360_calibration_visual_production_plan.py \
            tests/test_deform360_calibration_visual_production_plan.py

      - name: Remove temporary workflows and verify scope
        run: |
          set -euo pipefail
          rm -- \
            .github/workflows/_temporary_prepare_pr260_formatted_source.yml \
            .github/workflows/_one_shot_finalize_pr260.yml \
            scripts/_one_shot_fix_pr260_typing.py
          git diff --check
          unexpected="$(git diff --name-only 0f403cbed8b5fc9ac585b5f7c237106809207b3f -- | grep -E '^(.github/workflows/_|scripts/_one_shot)' || true)"
          if [[ -n "${unexpected}" ]]; then
            printf 'Temporary paths remain:\n%s\n' "${unexpected}" >&2
            exit 1
          fi

      - name: Commit validated final source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize target-blind calibration visual production plan'
          git push origin HEAD:feat/deform360-calibration-visual-production-plan-v1
