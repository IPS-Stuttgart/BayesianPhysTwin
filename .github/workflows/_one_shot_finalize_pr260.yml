name: Export validated PR 260 final tree

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/_one_shot_finalize_pr260.yml"
      - "scripts/_one_shot_fix_pr260_typing.py"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: export-final-pr260-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  export:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 260 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref ==
        'feat/deform360-calibration-visual-production-plan-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply explicit parser narrowing
        run: |
          set -euo pipefail
          python scripts/_one_shot_fix_pr260_typing.py

      - name: Install validation environment
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev,graph]" "numpy>=1.24,<2.2"
          python -m pip check

      - name: Format source and register stable-core coverage
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/bayesian_phystwin/deform360_calibration_visual_production_plan.py
            scripts/science/build_deform360_calibration_visual_production_plan.py
            tests/test_deform360_calibration_visual_production_plan.py
          )
          python -m ruff check --fix "${files[@]}"
          python -m ruff format "${files[@]}"
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/tests.yml")
          source = path.read_text(encoding="utf-8")
          entry = "            tests/test_deform360_calibration_visual_production_plan.py \\\n"
          if entry not in source:
              anchor = "            tests/test_deform360_visual_provider_lock.py \\\n"
              if anchor not in source:
                  raise SystemExit("stable-core coverage anchor changed")
              source = source.replace(anchor, anchor + entry, 1)
          path.write_text(source, encoding="utf-8")
          PY
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          git diff --check

      - name: Run focused and adjacent contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -p no:cacheprovider \
            tests/test_deform360_calibration_visual_production_plan.py \
            tests/test_deform360_calibration_observability_batch.py \
            tests/test_deform360_calibration_observability_case_builder.py \
            tests/test_deform360_calibration_source_run_record.py \
            tests/test_deform360_visual_provider_lock.py
          python -m mypy \
            src/bayesian_phystwin/deform360_calibration_visual_production_plan.py \
            scripts/science/build_deform360_calibration_visual_production_plan.py
          python -W error::SyntaxWarning -m py_compile \
            src/bayesian_phystwin/deform360_calibration_visual_production_plan.py \
            scripts/science/build_deform360_calibration_visual_production_plan.py \
            tests/test_deform360_calibration_visual_production_plan.py

      - name: Assemble exact final tree
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/pr260-final-tree"
          mkdir -p \
            "$root/.github/workflows" \
            "$root/docs" \
            "$root/scripts/science" \
            "$root/src/bayesian_phystwin" \
            "$root/tests"
          cp .github/workflows/tests.yml "$root/.github/workflows/tests.yml"
          cp docs/deform360_calibration_visual_production_plan.md "$root/docs/"
          cp scripts/science/build_deform360_calibration_visual_production_plan.py \
            "$root/scripts/science/"
          cp src/bayesian_phystwin/deform360_calibration_visual_production_plan.py \
            "$root/src/bayesian_phystwin/"
          cp tests/test_deform360_calibration_visual_production_plan.py \
            "$root/tests/"
          cat > "$root/DELETE_PATHS.txt" <<'EOF'
          .github/workflows/_one_shot_finalize_pr260.yml
          .github/workflows/_temporary_prepare_pr260_formatted_source.yml
          scripts/_one_shot_fix_pr260_typing.py
          EOF
          (
            cd "$root"
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Create detached validated commit object
        shell: bash
        env:
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          PARENT_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          FINAL_ROOT: ${{ runner.temp }}/pr260-final-tree
          RECEIPT: ${{ runner.temp }}/pr260-detached-commit.json
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          api = os.environ["API_URL"]
          repository = os.environ["REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          parent = os.environ["PARENT_SHA"]
          root = Path(os.environ["FINAL_ROOT"])
          receipt_path = Path(os.environ["RECEIPT"])

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          def request(method: str, path: str, payload: object | None = None) -> object:
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  f"{api}/repos/{repository}{path}",
                  data=data,
                  headers=headers,
                  method=method,
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          parent_commit = request("GET", f"/git/commits/{parent}")
          if not isinstance(parent_commit, dict):
              raise SystemExit("parent commit response is not an object")
          base_tree = str(parent_commit["tree"]["sha"])

          entries = []
          file_paths = (
              ".github/workflows/tests.yml",
              "docs/deform360_calibration_visual_production_plan.md",
              "scripts/science/build_deform360_calibration_visual_production_plan.py",
              "src/bayesian_phystwin/deform360_calibration_visual_production_plan.py",
              "tests/test_deform360_calibration_visual_production_plan.py",
          )
          blob_shas = {}
          for relative in file_paths:
              payload = (root / relative).read_bytes()
              blob = request(
                  "POST",
                  "/git/blobs",
                  {
                      "content": base64.b64encode(payload).decode("ascii"),
                      "encoding": "base64",
                  },
              )
              if not isinstance(blob, dict):
                  raise SystemExit(f"blob response is not an object: {relative}")
              blob_sha = str(blob["sha"])
              blob_shas[relative] = blob_sha
              entries.append(
                  {
                      "path": relative,
                      "mode": "100644",
                      "type": "blob",
                      "sha": blob_sha,
                  }
              )

          for relative in (
              ".github/workflows/_one_shot_finalize_pr260.yml",
              ".github/workflows/_temporary_prepare_pr260_formatted_source.yml",
              "scripts/_one_shot_fix_pr260_typing.py",
          ):
              entries.append(
                  {
                      "path": relative,
                      "mode": "100644",
                      "type": "blob",
                      "sha": None,
                  }
              )

          tree = request(
              "POST",
              "/git/trees",
              {"base_tree": base_tree, "tree": entries},
          )
          if not isinstance(tree, dict):
              raise SystemExit("tree response is not an object")
          tree_sha = str(tree["sha"])
          commit = request(
              "POST",
              "/git/commits",
              {
                  "message": "Finalize target-blind calibration visual production plan",
                  "tree": tree_sha,
                  "parents": [parent],
              },
          )
          if not isinstance(commit, dict):
              raise SystemExit("commit response is not an object")
          commit_sha = str(commit["sha"])
          receipt = {
              "repository": repository,
              "parent_sha": parent,
              "tree_sha": tree_sha,
              "commit_sha": commit_sha,
              "blob_shas": blob_shas,
              "deleted_paths": [
                  ".github/workflows/_one_shot_finalize_pr260.yml",
                  ".github/workflows/_temporary_prepare_pr260_formatted_source.yml",
                  "scripts/_one_shot_fix_pr260_typing.py",
              ],
          }
          receipt_path.write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Upload exact final tree and detached commit receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: pr260-detached-commit-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/pr260-final-tree/
            ${{ runner.temp }}/pr260-detached-commit.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
