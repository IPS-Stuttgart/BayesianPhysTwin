name: Export validated PR 260 final tree

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/_one_shot_finalize_pr260.yml"
      - "scripts/_one_shot_fix_pr260_typing.py"

permissions:
  contents: read

concurrency:
  group: export-final-pr260-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  export:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 260 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref ==
        'feat/deform360-calibration-visual-production-plan-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply explicit parser narrowing
        run: |
          set -euo pipefail
          python scripts/_one_shot_fix_pr260_typing.py

      - name: Install validation environment
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev,graph]" "numpy>=1.24,<2.2"
          python -m pip check

      - name: Format source and register stable-core coverage
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/bayesian_phystwin/deform360_calibration_visual_production_plan.py
            scripts/science/build_deform360_calibration_visual_production_plan.py
            tests/test_deform360_calibration_visual_production_plan.py
          )
          python -m ruff check --fix "${files[@]}"
          python -m ruff format "${files[@]}"
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/tests.yml")
          source = path.read_text(encoding="utf-8")
          entry = "            tests/test_deform360_calibration_visual_production_plan.py \\\n"
          if entry not in source:
              anchor = "            tests/test_deform360_visual_provider_lock.py \\\n"
              if anchor not in source:
                  raise SystemExit("stable-core coverage anchor changed")
              source = source.replace(anchor, anchor + entry, 1)
          path.write_text(source, encoding="utf-8")
          PY
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          git diff --check

      - name: Run focused and adjacent contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -p no:cacheprovider \
            tests/test_deform360_calibration_visual_production_plan.py \
            tests/test_deform360_calibration_observability_batch.py \
            tests/test_deform360_calibration_observability_case_builder.py \
            tests/test_deform360_calibration_source_run_record.py \
            tests/test_deform360_visual_provider_lock.py
          python -m mypy \
            src/bayesian_phystwin/deform360_calibration_visual_production_plan.py \
            scripts/science/build_deform360_calibration_visual_production_plan.py
          python -W error::SyntaxWarning -m py_compile \
            src/bayesian_phystwin/deform360_calibration_visual_production_plan.py \
            scripts/science/build_deform360_calibration_visual_production_plan.py \
            tests/test_deform360_calibration_visual_production_plan.py

      - name: Assemble exact final tree
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/pr260-final-tree"
          mkdir -p \
            "$root/.github/workflows" \
            "$root/docs" \
            "$root/scripts/science" \
            "$root/src/bayesian_phystwin" \
            "$root/tests"
          cp .github/workflows/tests.yml "$root/.github/workflows/tests.yml"
          cp docs/deform360_calibration_visual_production_plan.md "$root/docs/"
          cp scripts/science/build_deform360_calibration_visual_production_plan.py \
            "$root/scripts/science/"
          cp src/bayesian_phystwin/deform360_calibration_visual_production_plan.py \
            "$root/src/bayesian_phystwin/"
          cp tests/test_deform360_calibration_visual_production_plan.py \
            "$root/tests/"
          cat > "$root/DELETE_PATHS.txt" <<'EOF'
          .github/workflows/_one_shot_finalize_pr260.yml
          .github/workflows/_temporary_prepare_pr260_formatted_source.yml
          scripts/_one_shot_fix_pr260_typing.py
          EOF
          (
            cd "$root"
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Upload exact final tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: pr260-final-tree-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/pr260-final-tree/
          if-no-files-found: error
          retention-days: 7
