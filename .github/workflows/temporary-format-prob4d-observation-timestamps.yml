name: Temporary format Prob4D observation timestamps

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temporary-format-prob4d-observation-timestamps.yml"
      - "tools/temporary_harden_timestamp_consumer.py"
      - "tools/temporary_narrow_timestamp_admission_claim.py"
      - "tools/temporary_add_clock_prior_file_loader.py"
      - "src/bayesian_phystwin/causal4d_observation_clock_prior.py"
      - "src/bayesian_phystwin/prob4d_observation_timestamps.py"
      - "src/bayesian_phystwin/prob4d_observation_timestamp_admission.py"
      - "tests/test_prob4d_observation_timestamps.py"
      - "tests/test_prob4d_observation_timestamp_admission.py"
      - "tests/test_prob4d_observation_timestamps_crossrepo.py"
      - "tests/test_prob4d_observation_timestamps_causal4d.py"
      - "docs/prob4d_observation_timestamps.md"

permissions:
  contents: write

concurrency:
  group: temporary-format-prob4d-observation-timestamps-${{ github.ref }}
  cancel-in-progress: true

env:
  PROB4D_TIMESTAMP_PRODUCER_REVISION: 34b74302383ecf91c46c4d7a32e2bd22260ad7ed
  CAUSAL4D_CLOCK_PRIOR_REVISION: 183045f4a1085bd37221eb2294181f43ca629de0
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  format-validate-publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/prob4d-observation-timestamp-consumer-v1
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Check out exact Prob4D timestamp producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/Prob4D
          ref: ${{ env.PROB4D_TIMESTAMP_PRODUCER_REVISION }}
          path: _external/prob4d
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Check out exact Causal4D clock-prior producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/Causal4D
          ref: ${{ env.CAUSAL4D_CLOCK_PRIOR_REVISION }}
          path: _external/causal4d
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Create isolated producer-consumer environment
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/format-prob4d-observation-timestamps-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python -m venv "${root}/venv"
          echo "${root}/venv/bin" >> "${GITHUB_PATH}"
          "${root}/venv/bin/python" -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1"
          "${root}/venv/bin/python" -m pip install -e ".[dev]"
          "${root}/venv/bin/python" -m pip install -e ./_external/prob4d
          "${root}/venv/bin/python" -m pip install -e ./_external/causal4d
          "${root}/venv/bin/python" -m pip check

      - name: Apply exact hardening and claim-boundary patches
        shell: bash
        run: |
          set -euo pipefail
          python tools/temporary_harden_timestamp_consumer.py
          python tools/temporary_narrow_timestamp_admission_claim.py
          python tools/temporary_add_clock_prior_file_loader.py

      - name: Format permanent source and tests
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/bayesian_phystwin/causal4d_observation_clock_prior.py
            src/bayesian_phystwin/prob4d_observation_timestamps.py
            src/bayesian_phystwin/prob4d_observation_timestamp_admission.py
            tests/test_prob4d_observation_timestamps.py
            tests/test_prob4d_observation_timestamp_admission.py
            tests/test_prob4d_observation_timestamps_crossrepo.py
            tests/test_prob4d_observation_timestamps_causal4d.py
          )
          python -m ruff check --fix "${files[@]}"
          python -m ruff format "${files[@]}"

      - name: Validate permanent source and producer parity
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/bayesian_phystwin/causal4d_observation_clock_prior.py
            src/bayesian_phystwin/prob4d_observation_timestamps.py
            src/bayesian_phystwin/prob4d_observation_timestamp_admission.py
            tests/test_prob4d_observation_timestamps.py
            tests/test_prob4d_observation_timestamp_admission.py
            tests/test_prob4d_observation_timestamps_crossrepo.py
            tests/test_prob4d_observation_timestamps_causal4d.py
          )
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy \
            src/bayesian_phystwin/causal4d_observation_clock_prior.py \
            src/bayesian_phystwin/prob4d_observation_timestamps.py \
            src/bayesian_phystwin/prob4d_observation_timestamp_admission.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_prob4d_observation_timestamps.py \
            tests/test_prob4d_observation_timestamp_admission.py \
            tests/test_prob4d_observation_timestamps_crossrepo.py \
            tests/test_prob4d_observation_timestamps_causal4d.py \
            tests/test_observation_timing_nuisance.py \
            tests/test_observation_timing_interchange.py \
            tests/test_observation_belief.py
          python -m py_compile "${files[@]}"

      - name: Publish only permanent validated files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _external
          rm tools/temporary_harden_timestamp_consumer.py
          rm tools/temporary_narrow_timestamp_admission_claim.py
          rm tools/temporary_add_clock_prior_file_loader.py
          rm .github/workflows/temporary-format-prob4d-observation-timestamps.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Validate full Causal4D observation clock prior"
          git push origin HEAD:agent/prob4d-observation-timestamp-consumer-v1
