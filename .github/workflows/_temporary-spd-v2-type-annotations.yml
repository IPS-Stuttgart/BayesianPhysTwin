name: Temporary exact SPD v2 type annotations

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - '.github/workflows/_temporary-spd-v2-type-annotations.yml'
      - 'src/bayesian_phystwin/bias_aware_belief_v2.py'

permissions:
  contents: write

jobs:
  annotate-and-validate:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact same-repository PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify exact reviewed head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git branch --show-current)" = "${GITHUB_HEAD_REF}"

      - name: Apply six exact no-runtime annotations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/bayesian_phystwin/bias_aware_belief_v2.py')
          text = path.read_text(encoding='utf-8')
          replacements = (
              (
                  '    camera_target = np.empty((len(camera_rows), 3), dtype=np.float64)\n',
                  '    camera_target: np.ndarray = np.empty(\n'
                  '        (len(camera_rows), 3), dtype=np.float64\n'
                  '    )\n',
              ),
              (
                  '    camera_row_variance = np.empty(len(camera_rows), dtype=np.float64)\n',
                  '    camera_row_variance: np.ndarray = np.empty(\n'
                  '        len(camera_rows), dtype=np.float64\n'
                  '    )\n',
              ),
              (
                  '    camera_base_weight = np.empty(len(camera_rows), dtype=np.float64)\n',
                  '    camera_base_weight: np.ndarray = np.empty(\n'
                  '        len(camera_rows), dtype=np.float64\n'
                  '    )\n',
              ),
              (
                  '    has_anchor = anchor_innovation_m is not None\n    if has_anchor:\n',
                  '    has_anchor = anchor_innovation_m is not None\n'
                  '    anchor_variance: np.ndarray\n'
                  '    if has_anchor:\n',
              ),
              (
                  '    camera_robust = np.ones(len(camera_rows), dtype=np.float64)\n',
                  '    camera_robust: np.ndarray = np.ones(\n'
                  '        len(camera_rows), dtype=np.float64\n'
                  '    )\n',
              ),
              (
                  '    anchor_robust = np.ones(len(anchor_target), dtype=np.float64)\n',
                  '    anchor_robust: np.ndarray = np.ones(\n'
                  '        len(anchor_target), dtype=np.float64\n'
                  '    )\n',
              ),
          )
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f'exact annotation target occurred {count} times: {old!r}'
                  )
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = \
            'src/bayesian_phystwin/bias_aware_belief_v2.py'
          git diff --check

      - name: Validate exact annotated source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m ruff check -- \
            src/bayesian_phystwin/bias_aware_belief_v2.py
          python -m ruff format --check -- \
            src/bayesian_phystwin/bias_aware_belief_v2.py
          python -m mypy \
            src/bayesian_phystwin/bias_aware_belief_v2.py
          python -m pytest -q \
            tests/test_bias_aware_belief_v2.py \
            tests/test_bias_aware_belief_v2_adversarial.py \
            tests/test_bias_aware_belief_v2_amendment.py \
            tests/test_spd_system.py \
            tests/test_spd_system_adversarial.py
          python -m compileall -q \
            src/bayesian_phystwin/bias_aware_belief_v2.py
          git diff --check

      - name: Commit only the validated annotation change
        shell: bash
        run: |
          set -euo pipefail
          path='src/bayesian_phystwin/bias_aware_belief_v2.py'
          git add -- "${path}"
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = "${path}"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Expected annotation change is empty.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add explicit array annotations to SPD v2'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
