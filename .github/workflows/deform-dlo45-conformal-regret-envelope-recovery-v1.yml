# workflow-lifecycle: temporary
# workflow-owner: IPS-Stuttgart maintainers
# workflow-expiry: 2026-09-15
name: DEFORM conformal regret envelope recovery

on:
  push:
    paths:
      - ".github/workflows/deform-dlo45-conformal-regret-envelope-recovery-v1.yml"
      - ".github/requests/deform-dlo45-conformal-regret-envelope-v1.json"
      - "src/bayesian_phystwin/conformal_regret_envelope_v1.py"
      - "experiments/deform_dlo45_decision_identifiability_v1/support_envelope.py"
      - "experiments/deform_dlo45_decision_identifiability_v1/support_envelope_jsonsafe.py"
      - "experiments/deform_dlo45_decision_identifiability_v1/support_envelope_protocol.json"
      - "tests/test_conformal_regret_envelope_v1.py"
      - "tests/test_deform_dlo45_conformal_regret_envelope_v1.py"
      - "tests/test_deform_dlo45_conformal_regret_jsonsafe_v1.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deform-dlo45-conformal-regret-recovery-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  DATASET_ROOT: /mnt/seagate10tb/florianpfaff/datasets/deform/data_set
  PARENT_PROTOCOL: experiments/deform_dlo45_decision_identifiability_v1/protocol.json
  ENVELOPE_PROTOCOL: experiments/deform_dlo45_decision_identifiability_v1/support_envelope_protocol.json
  PARENT_SOURCE_RESULT: results/science/deform_dlo45_decision_identifiability_v1/official-dlo45-one-shot-20260901-v1/source_result.json
  REQUEST: .github/requests/deform-dlo45-conformal-regret-envelope-v1.json
  RUN_KEY: official-dlo45-conformal-regret-envelope-20260902-v1

jobs:
  recover-and-evaluate:
    runs-on: [self-hosted, Linux, X64, nvidia-smi, gpuserver4090]
    timeout-minutes: 90
    steps:
      - name: Check out exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          clean: true

      - name: Validate complete local DEFORM roster and frozen identities
        shell: bash
        run: |
          set -euo pipefail
          for dlo in DLO4 DLO5; do
            test -d "${DATASET_ROOT}/${dlo}/train"
            test -d "${DATASET_ROOT}/${dlo}/eval"
            test "$(find "${DATASET_ROOT}/${dlo}/train" -maxdepth 1 -type f -name '*.pkl' | wc -l)" -eq 56
            test "$(find "${DATASET_ROOT}/${dlo}/eval" -maxdepth 1 -type f -name '*.pkl' | wc -l)" -eq 14
            test "$(find "${DATASET_ROOT}/${dlo}" -type f | wc -l)" -eq 70
          done
          test "$(sha256sum "${PARENT_SOURCE_RESULT}" | cut -d' ' -f1)" = \
            "77332c323ddd09d945f65f57e3b83a12deedd9ea94509e43c13c9ca87f3cc353"
          test "$(sha256sum "${ENVELOPE_PROTOCOL}" | cut -d' ' -f1)" = \
            "4b6c43aeab98bf1cdfe35d118c74887b99ee8c68d9d8024e3b8c9b684a90c732"

      - name: Install isolated exact environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/dlo45-conformal-recovery-venv"
          python="${RUNNER_TEMP}/dlo45-conformal-recovery-venv/bin/python"
          "${python}" -m pip install --disable-pip-version-check \
            "pip==25.2" "setuptools==80.9.0" "wheel==0.45.1" "numpy==2.2.6"
          "${python}" -m pip install --disable-pip-version-check -e ".[dev]"
          "${python}" -m pip check

      - name: Commit code-only formatting before reading calibration outcomes
        shell: bash
        run: |
          set -euo pipefail
          python="${RUNNER_TEMP}/dlo45-conformal-recovery-venv/bin/python"
          files=(
            src/bayesian_phystwin/conformal_regret_envelope_v1.py
            experiments/deform_dlo45_decision_identifiability_v1/support_envelope.py
            experiments/deform_dlo45_decision_identifiability_v1/support_envelope_jsonsafe.py
            tests/test_conformal_regret_envelope_v1.py
            tests/test_deform_dlo45_conformal_regret_envelope_v1.py
            tests/test_deform_dlo45_conformal_regret_jsonsafe_v1.py
          )
          "${python}" -m ruff format "${files[@]}"
          if ! git diff --quiet -- "${files[@]}"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "${files[@]}"
            git diff --cached --check
            git commit -m "Format JSON-safe conformal regret recovery"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "SCIENTIFIC_REVISION=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Validate support-robust contracts
        shell: bash
        run: |
          set -euo pipefail
          python="${RUNNER_TEMP}/dlo45-conformal-recovery-venv/bin/python"
          files=(
            src/bayesian_phystwin/conformal_regret_envelope_v1.py
            experiments/deform_dlo45_decision_identifiability_v1/support_envelope.py
            experiments/deform_dlo45_decision_identifiability_v1/support_envelope_jsonsafe.py
            tests/test_conformal_regret_envelope_v1.py
            tests/test_deform_dlo45_conformal_regret_envelope_v1.py
            tests/test_deform_dlo45_conformal_regret_jsonsafe_v1.py
          )
          "${python}" -m ruff check "${files[@]}"
          "${python}" -m ruff format --check "${files[@]}"
          "${python}" -m pytest -q -p no:cacheprovider \
            tests/test_conformal_regret_envelope_v1.py \
            tests/test_deform_dlo45_conformal_regret_envelope_v1.py \
            tests/test_deform_dlo45_conformal_regret_jsonsafe_v1.py \
            tests/test_query_quotient_belief_v1.py \
            tests/test_deform_dlo45_decision_identifiability_v1.py

      - name: Calibrate and seal trajectory-level envelope from source-test trajectories
        shell: bash
        run: |
          set -euo pipefail
          python="${RUNNER_TEMP}/dlo45-conformal-recovery-venv/bin/python"
          source_root="${RUNNER_TEMP}/conformal-source"
          rm -rf "${source_root}"
          mkdir -p "${source_root}"
          "${python}" -m \
            experiments.deform_dlo45_decision_identifiability_v1.support_envelope_jsonsafe \
            source \
            --parent-protocol "${PARENT_PROTOCOL}" \
            --envelope-protocol "${ENVELOPE_PROTOCOL}" \
            --parent-source-result "${PARENT_SOURCE_RESULT}" \
            --request "${REQUEST}" \
            --dataset-root "${DATASET_ROOT}" \
            --output-root "${source_root}" \
            > "${source_root}/stdout.json"
          SOURCE_ROOT="${source_root}" "${python}" - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["SOURCE_ROOT"])
          value = json.loads((root / "source_envelope.json").read_text())
          seal = json.loads((root / "source_seal.json").read_text())
          assert value["target_data_read"] is False
          assert value["target_outcomes_used"] is False
          assert seal["target_data_read"] is False
          assert seal["target_outcomes_used"] is False
          for dlo in ("DLO4", "DLO5"):
              assert value["dlos"][dlo]["calibration_trajectory_count"] == 8
              assert value["dlos"][dlo]["decision_count_per_trajectory"] == 19
              level90 = value["dlos"][dlo]["envelopes"]["0.100000"]
              assert level90["base_certificate_selected_action"]["radius"] == "infinite"
              assert level90["base_certificate_selected_action"]["has_finite_radius"] is False
              level80 = value["dlos"][dlo]["envelopes"]["0.200000"]
              assert level80["base_certificate_selected_action"]["has_finite_radius"] is True
          print(json.dumps({
              dlo: value["dlos"][dlo]["envelopes"]["0.200000"]
                  ["base_certificate_selected_action"]["radius"]
              for dlo in ("DLO4", "DLO5")
          }, indent=2, sort_keys=True))
          PY

      - name: Apply the frozen envelope to all held trajectories
        shell: bash
        run: |
          set -euo pipefail
          python="${RUNNER_TEMP}/dlo45-conformal-recovery-venv/bin/python"
          source_root="${RUNNER_TEMP}/conformal-source"
          target_root="${RUNNER_TEMP}/conformal-target"
          rm -rf "${target_root}"
          mkdir -p "${target_root}"
          "${python}" -m \
            experiments.deform_dlo45_decision_identifiability_v1.support_envelope_jsonsafe \
            target \
            --parent-protocol "${PARENT_PROTOCOL}" \
            --envelope-protocol "${ENVELOPE_PROTOCOL}" \
            --request "${REQUEST}" \
            --dataset-root "${DATASET_ROOT}" \
            --source-root "${source_root}" \
            --output-root "${target_root}" \
            > "${target_root}/stdout.json"
          TARGET_ROOT="${target_root}" "${python}" - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["TARGET_ROOT"])
          value = json.loads((root / "target_result.json").read_text())
          assert value["status"] == "complete"
          assert value["target_tuning"] is False
          assert value["target_retries"] is False
          assert value["primary_policy_key"] == (
              "per_dlo/0.200000/base_certificate_selected_action/0.300000"
          )
          print(json.dumps({
              "primary_policy": value["primary_policy"],
              "DLO4_primary_coverage": value["dlos"]["DLO4"]["coverage"]
                  ["per_dlo"]["0.200000"]
                  ["base_certificate_selected_action"]
                  ["empirical_trajectory_coverage"],
              "DLO5_primary_coverage": value["dlos"]["DLO5"]["coverage"]
                  ["per_dlo"]["0.200000"]
                  ["base_certificate_selected_action"]
                  ["empirical_trajectory_coverage"],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload complete source and held evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dlo45-conformal-recovery-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/conformal-source
            ${{ runner.temp }}/conformal-target
          if-no-files-found: warn
          retention-days: 90

      - name: Commit compact evidence to the experiment branch
        if: success() && github.event_name == 'push' && github.ref_type == 'branch'
        shell: bash
        run: |
          set -euo pipefail
          destination="results/science/deform_dlo45_conformal_regret_envelope_v1/${RUN_KEY}"
          test ! -e "${destination}"
          mkdir -p "${destination}/source" "${destination}/target"
          cp "${RUNNER_TEMP}/conformal-source/source_envelope.json" \
            "${destination}/source/source_envelope.json"
          cp "${RUNNER_TEMP}/conformal-source/source_seal.json" \
            "${destination}/source/source_seal.json"
          cp "${RUNNER_TEMP}/conformal-target/target_result.json" \
            "${destination}/target/target_result.json"
          cp "${RUNNER_TEMP}/conformal-target/provenance.json" \
            "${destination}/target/provenance.json"
          cat > "${destination}/workflow_provenance.json" <<EOF
          {
            "event_revision": "${GITHUB_SHA}",
            "scientific_revision": "${SCIENTIFIC_REVISION}",
            "workflow_run_id": ${GITHUB_RUN_ID},
            "workflow_run_attempt": ${GITHUB_RUN_ATTEMPT},
            "runner_name": "${RUNNER_NAME}",
            "dataset_root": "${DATASET_ROOT}",
            "target_tuning": false,
            "target_retries": false
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${destination}"
          git diff --cached --check
          git commit -m "Record conformal regret-envelope evidence"
          git push origin "HEAD:${GITHUB_REF_NAME}"
