name: Repair PR 427 once

on:
  push:
    branches:
      - agent/deform360-fresh-object-session-v6-source-gate

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/deform360-fresh-object-session-v6-source-gate
          fetch-depth: 0

      - name: Apply reviewed repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/bayesian_phystwin/deform360_fresh_object_session_source_v6.py")
          text = path.read_text(encoding="utf-8")

          early_identity = '''    _content_identity(amendment, "amendment_id", "v6 covariance amendment")
              if amendment.get("amendment_id") != AMENDMENT_ID:
                  raise ValueError("v6 covariance amendment identity changed")
              base = _mapping(amendment.get("base_policy"), name="base_policy")
          '''
          delayed_identity = '''    _content_identity(amendment, "amendment_id", "v6 covariance amendment")
              base = _mapping(amendment.get("base_policy"), name="base_policy")
          '''
          if text.count(early_identity) != 1:
              raise SystemExit("unexpected amendment identity block")
          text = text.replace(early_identity, delayed_identity, 1)

          roster_tail = '''        if observed != roster:
                      raise ValueError("v6 candidate covariance roster changed")
              return amendment
          '''
          checked_roster_tail = '''        if observed != roster:
                      raise ValueError("v6 candidate covariance roster changed")
              if amendment.get("amendment_id") != AMENDMENT_ID:
                  raise ValueError("v6 covariance amendment identity changed")
              return amendment
          '''
          if text.count(roster_tail) != 1:
              raise SystemExit("unexpected covariance roster tail")
          text = text.replace(roster_tail, checked_roster_tail, 1)

          nullable_outcome = '''        outcome = by_seal.get(cast(str, seal.get("seal_id")))
                  if outcome is None:
                      raise ValueError("v6 source evidence omits a sealed prediction")
                  records.append(
                      {
                          "object_id": seal["object_id"],
                          "episode_id": seal["episode_id"],
                          "stratum": seal["stratum"],
                          "prediction_seal_id": seal["seal_id"],
                          "prediction": seal["variants"],
                          "outcome": outcome["variants"],
                      }
                  )
          '''
          narrowed_outcome = '''        matched_outcome = by_seal.get(cast(str, seal.get("seal_id")))
                  if matched_outcome is None:
                      raise ValueError("v6 source evidence omits a sealed prediction")
                  records.append(
                      {
                          "object_id": seal["object_id"],
                          "episode_id": seal["episode_id"],
                          "stratum": seal["stratum"],
                          "prediction_seal_id": seal["seal_id"],
                          "prediction": seal["variants"],
                          "outcome": matched_outcome["variants"],
                      }
                  )
          '''
          if text.count(nullable_outcome) != 1:
              raise SystemExit("unexpected nullable outcome block")
          text = text.replace(nullable_outcome, narrowed_outcome, 1)

          path.write_text(text, encoding="utf-8")
          PY

          rm .github/workflows/repair-pr427-once.yml
          python -m py_compile src/bayesian_phystwin/deform360_fresh_object_session_source_v6.py

      - name: Commit repaired branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bayesian_phystwin/deform360_fresh_object_session_source_v6.py .github/workflows/repair-pr427-once.yml
          git commit -m "Fix v6 source-gate validation diagnostics"
          git push origin HEAD:agent/deform360-fresh-object-session-v6-source-gate
