# workflow-lifecycle: temporary
# workflow-owner: IPS-Stuttgart maintainers
name: Bootstrap interventional cause identifiability once

on:
  push:
    branches:
      - research/interventional-cause-identifiability-v1
    paths:
      - ".github/workflows/bootstrap-interventional-cause-identifiability-once.yml"
      - ".github/bootstrap/interventional-cause-identifiability-v1.tar.gz.b64"

permissions:
  contents: write

concurrency:
  group: bootstrap-interventional-cause-identifiability-v1
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"

jobs:
  materialize:
    name: Materialize, validate, and commit reviewed source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: research/interventional-cause-identifiability-v1
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Materialize source bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/interventional-cause-identifiability-v1.tar.gz"
          base64 --decode \
            .github/bootstrap/interventional-cause-identifiability-v1.tar.gz.b64 \
            > "$bundle"
          tar -tzf "$bundle" | LC_ALL=C sort > "$RUNNER_TEMP/bundle-files.txt"
          cat > "$RUNNER_TEMP/expected-files.txt" <<'EOF'
          docs/interventional_cause_identifiability_v1.md
          scripts/science/run_interventional_cause_attribution_v1.py
          src/bayesian_phystwin_experiments/interventional_cause_identifiability_v1.py
          tests/test_interventional_cause_attribution_controlled_v1.py
          tests/test_interventional_cause_identifiability_v1.py
          EOF
          diff -u "$RUNNER_TEMP/expected-files.txt" "$RUNNER_TEMP/bundle-files.txt"
          tar -xzf "$bundle" -C .

      - name: Install focused development environment
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Validate theorem, contracts, and controlled falsification
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/bayesian_phystwin_experiments/interventional_cause_identifiability_v1.py
            scripts/science/run_interventional_cause_attribution_v1.py
            tests/test_interventional_cause_identifiability_v1.py
            tests/test_interventional_cause_attribution_controlled_v1.py
          )
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          PYTHONPATH=src python -m pytest -q -p no:cacheprovider \
            tests/test_interventional_cause_identifiability_v1.py \
            tests/test_interventional_cause_attribution_controlled_v1.py
          PYTHONPATH=src python -m compileall -q \
            src/bayesian_phystwin_experiments/interventional_cause_identifiability_v1.py \
            scripts/science/run_interventional_cause_attribution_v1.py

      - name: Execute deterministic controlled study
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/why-is-the-twin-wrong-controlled-v1"
          test ! -e "$output"
          PYTHONPATH=src python \
            scripts/science/run_interventional_cause_attribution_v1.py \
            --output "$output"
          RESULT_PATH="$output/result.json" python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path(os.environ["RESULT_PATH"]).read_text())
          aggregate = result["aggregate"]
          assert result["total_trials"] == 10_000
          assert result["source_action_identifiable_cause_count"] == 0
          assert result["all_interventions_identifiable_cause_count"] == 5
          assert aggregate["source_only_cause_accuracy"] == 0.2
          assert aggregate["multi_action_cause_accuracy"] == 1.0
          assert aggregate["multi_action_confirmation_rmse"] == (
              aggregate["oracle_confirmation_rmse"]
          )
          assert aggregate["multi_action_confirmation_rmse"] < 0.06
          assert aggregate["source_only_confirmation_rmse"] > 0.4
          assert aggregate["wrong_action_confirmation_rmse"] > 0.6
          control = result["undeclared_nuisance_control"]
          assert control["declared_material_status"] == "confounded"
          assert control["declared_material_residualized_rank"] == 0
          PY
          cat "$output/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit only the scientific contribution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayesian_phystwin_experiments/interventional_cause_identifiability_v1.py \
            scripts/science/run_interventional_cause_attribution_v1.py \
            tests/test_interventional_cause_identifiability_v1.py \
            tests/test_interventional_cause_attribution_controlled_v1.py \
            docs/interventional_cause_identifiability_v1.md
          test -n "$(git diff --cached --name-only)"
          git commit -m "Add interventional physical-cause identifiability"
          git push origin HEAD:research/interventional-cause-identifiability-v1
