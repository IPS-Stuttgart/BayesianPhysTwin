name: Repair and sync PR 432 once

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fix-pr432-once.yml
  push:
    branches:
      - agent/numerical-environment-profile-v1
    paths:
      - .github/workflows/fix-pr432-once.yml

permissions:
  contents: write

concurrency:
  group: repair-pr432-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.ref == 'agent/numerical-environment-profile-v1')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/numerical-environment-profile-v1
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Merge current main and apply typed metadata access
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main

          python - <<'PY'
          from pathlib import Path

          path = Path("src/bayesian_phystwin/numerical_environment_v1.py")
          text = path.read_text(encoding="utf-8")
          old = '        raw_name = distribution.metadata.get("Name")\n'
          new = '        raw_name = distribution.metadata["Name"]\n'
          if text.count(old) == 1 and text.count(new) == 0:
              text = text.replace(old, new, 1)
          elif text.count(old) != 0 or text.count(new) != 1:
              raise SystemExit("unexpected installed-distribution metadata access")
          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/fix-pr432-once.yml").unlink()
          PY

          git add -A
          git commit -m "Sync and repair numerical environment profiles"

          python -m pip install -e ".[dev]"
          python -m mypy src/bayesian_phystwin/numerical_environment_v1.py
          python -m pytest -q \
            tests/test_runtime_provenance_numerical_environment_v1_1.py \
            tests/test_runtime_provenance_numerical_environment_v1_2.py \
            tests/test_runtime_provenance_numerical_environment_v1_3.py \
            tests/test_runtime_provenance_numerical_environment_v1_4.py \
            tests/test_runtime_provenance_numerical_environment_v1_5.py
          python -m ruff check src/bayesian_phystwin/numerical_environment_v1.py
          python -m ruff format --check \
            src/bayesian_phystwin/numerical_environment_v1.py
          git diff --check
          git push origin HEAD:agent/numerical-environment-profile-v1
