name: Temporary frozen-container reader hardening

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/contract-integrity-reader-hardening.yml
      - src/bayesian_phystwin/_canonical_contracts.py
      - tests/test_portable_contracts_integrity.py

permissions:
  contents: write
  pull-requests: read

jobs:
  harden-and-remove:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Guard inherited readers and remove this workflow
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          module = Path("src/bayesian_phystwin/_canonical_contracts.py")
          text = module.read_text(encoding="utf-8")
          typing_marker = "from typing import Any\n"
          if text.count(typing_marker) != 1:
              raise SystemExit("typing import marker was not found exactly once")
          text = text.replace(
              typing_marker,
              "from typing import Any, SupportsIndex\n",
          )

          marker = (
              "    def copy(self) -> dict[str, Any]:\n"
              "        return self._snapshot_dict()\n\n"
              "    def __repr__(self) -> str:\n"
          )
          replacement = (
              "    def copy(self) -> dict[str, Any]:\n"
              "        return self._snapshot_dict()\n\n"
              "    @staticmethod\n"
              "    def _validated_operand(value: object) -> object:\n"
              "        if isinstance(value, FrozenDict):\n"
              "            return value._snapshot_dict()\n"
              "        return value\n\n"
              "    def __or__(self, other: object) -> Any:\n"
              "        validated = self._validated_operand(other)\n"
              "        if not isinstance(validated, dict):\n"
              "            return NotImplemented\n"
              "        return dict.__or__(self._snapshot_dict(), validated)\n\n"
              "    def __ror__(self, other: object) -> Any:\n"
              "        validated = self._validated_operand(other)\n"
              "        if not isinstance(validated, dict):\n"
              "            return NotImplemented\n"
              "        return dict.__ror__(self._snapshot_dict(), validated)\n\n"
              "    def __repr__(self) -> str:\n"
          )
          if text.count(marker) != 1:
              raise SystemExit("FrozenDict insertion marker was not found exactly once")
          text = text.replace(marker, replacement)
          replacements = (
              (
                  "        return self._snapshot_dict() == other\n",
                  "        return self._snapshot_dict() == self._validated_operand(other)\n",
              ),
              (
                  "        return self._snapshot_dict() != other\n",
                  "        return self._snapshot_dict() != self._validated_operand(other)\n",
              ),
          )
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"FrozenDict comparison marker missing: {old!r}")
              text = text.replace(old, new)

          marker = (
              "    def copy(self) -> list[Any]:\n"
              "        return list(self._snapshot_tuple())\n\n"
              "    def __repr__(self) -> str:\n"
          )
          replacement = (
              "    def copy(self) -> list[Any]:\n"
              "        return list(self._snapshot_tuple())\n\n"
              "    @staticmethod\n"
              "    def _validated_operand(value: object) -> object:\n"
              "        if isinstance(value, FrozenList):\n"
              "            return list(value._snapshot_tuple())\n"
              "        return value\n\n"
              "    def count(self, value: object) -> int:\n"
              "        return list(self._snapshot_tuple()).count(value)\n\n"
              "    def index(self, value: object, *bounds: SupportsIndex) -> int:\n"
              "        return list(self._snapshot_tuple()).index(value, *bounds)\n\n"
              "    def __add__(self, other: object) -> Any:\n"
              "        validated = self._validated_operand(other)\n"
              "        if not isinstance(validated, list):\n"
              "            return NotImplemented\n"
              "        return list.__add__(list(self._snapshot_tuple()), validated)\n\n"
              "    def __radd__(self, other: object) -> Any:\n"
              "        validated = self._validated_operand(other)\n"
              "        if not isinstance(validated, list):\n"
              "            return NotImplemented\n"
              "        return list.__add__(validated, list(self._snapshot_tuple()))\n\n"
              "    def __mul__(self, other: object) -> Any:\n"
              "        if not isinstance(other, SupportsIndex):\n"
              "            return NotImplemented\n"
              "        return list.__mul__(list(self._snapshot_tuple()), other)\n\n"
              "    def __rmul__(self, other: object) -> Any:\n"
              "        if not isinstance(other, SupportsIndex):\n"
              "            return NotImplemented\n"
              "        return list.__rmul__(list(self._snapshot_tuple()), other)\n\n"
              "    def __lt__(self, other: object) -> Any:\n"
              "        validated = self._validated_operand(other)\n"
              "        if not isinstance(validated, list):\n"
              "            return NotImplemented\n"
              "        return list.__lt__(list(self._snapshot_tuple()), validated)\n\n"
              "    def __le__(self, other: object) -> Any:\n"
              "        validated = self._validated_operand(other)\n"
              "        if not isinstance(validated, list):\n"
              "            return NotImplemented\n"
              "        return list.__le__(list(self._snapshot_tuple()), validated)\n\n"
              "    def __gt__(self, other: object) -> Any:\n"
              "        validated = self._validated_operand(other)\n"
              "        if not isinstance(validated, list):\n"
              "            return NotImplemented\n"
              "        return list.__gt__(list(self._snapshot_tuple()), validated)\n\n"
              "    def __ge__(self, other: object) -> Any:\n"
              "        validated = self._validated_operand(other)\n"
              "        if not isinstance(validated, list):\n"
              "            return NotImplemented\n"
              "        return list.__ge__(list(self._snapshot_tuple()), validated)\n\n"
              "    def __repr__(self) -> str:\n"
          )
          if text.count(marker) != 1:
              raise SystemExit("FrozenList insertion marker was not found exactly once")
          text = text.replace(marker, replacement)
          replacements = (
              (
                  "        return list(self._snapshot_tuple()) == other\n",
                  "        return list(self._snapshot_tuple()) == self._validated_operand(other)\n",
              ),
              (
                  "        return list(self._snapshot_tuple()) != other\n",
                  "        return list(self._snapshot_tuple()) != self._validated_operand(other)\n",
              ),
          )
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"FrozenList comparison marker missing: {old!r}")
              text = text.replace(old, new)
          module.write_text(text, encoding="utf-8")

          tests = Path("tests/test_portable_contracts_integrity.py")
          text = tests.read_text(encoding="utf-8")
          replacements = (
              (
                  "        lambda: metadata.copy(),\n"
                  "        lambda: repr(metadata),\n",
                  "        lambda: metadata.copy(),\n"
                  "        lambda: dict(metadata),\n"
                  "        lambda: metadata | {\"other\": 3},\n"
                  "        lambda: {\"other\": 3} | metadata,\n"
                  "        lambda: repr(metadata),\n",
              ),
              (
                  "        lambda: items.copy(),\n"
                  "        lambda: repr(items),\n"
                  "        lambda: items == [],\n",
                  "        lambda: items.copy(),\n"
                  "        lambda: items.count(1),\n"
                  "        lambda: items.index(1),\n"
                  "        lambda: items + [3],\n"
                  "        lambda: [0] + items,\n"
                  "        lambda: items * 2,\n"
                  "        lambda: 2 * items,\n"
                  "        lambda: items < [2],\n"
                  "        lambda: items <= [2],\n"
                  "        lambda: items > [0],\n"
                  "        lambda: items >= [0],\n"
                  "        lambda: repr(items),\n"
                  "        lambda: items == [],\n",
              ),
              (
                  "    assert metadata.copy() == expected\n"
                  "    assert len(items) == 2\n",
                  "    assert metadata.copy() == expected\n"
                  "    assert metadata | {\"extra\": 3} == {**expected, \"extra\": 3}\n"
                  "    assert {\"extra\": 3} | metadata == {\"extra\": 3, **expected}\n"
                  "    assert len(items) == 2\n",
              ),
              (
                  "    assert items.copy() == expected[\"nested\"][\"items\"]\n"
                  "    assert json.loads(json.dumps(metadata)) == expected\n",
                  "    assert items.copy() == expected[\"nested\"][\"items\"]\n"
                  "    assert items.count(1) == 1\n"
                  "    assert items.index(1) == 0\n"
                  "    assert items.index(1, 0, 1) == 0\n"
                  "    assert items + [3] == [1, {\"accepted\": True}, 3]\n"
                  "    assert [0] + items == [0, 1, {\"accepted\": True}]\n"
                  "    assert items * 2 == expected[\"nested\"][\"items\"] * 2\n"
                  "    assert 2 * items == expected[\"nested\"][\"items\"] * 2\n"
                  "    assert items < [2]\n"
                  "    assert items <= expected[\"nested\"][\"items\"]\n"
                  "    assert items > [0]\n"
                  "    assert items >= expected[\"nested\"][\"items\"]\n"
                  "    with pytest.raises(TypeError):\n"
                  "        _ = metadata | []\n"
                  "    with pytest.raises(TypeError):\n"
                  "        _ = [] | metadata\n"
                  "    with pytest.raises(TypeError):\n"
                  "        _ = items + (3,)\n"
                  "    with pytest.raises(TypeError):\n"
                  "        _ = (0,) + items\n"
                  "    with pytest.raises(TypeError):\n"
                  "        _ = items * 1.5\n"
                  "    with pytest.raises(TypeError):\n"
                  "        _ = 1.5 * items\n"
                  "    with pytest.raises(TypeError):\n"
                  "        _ = items < (2,)\n"
                  "    assert json.loads(json.dumps(metadata)) == expected\n",
              ),
          )
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"test insertion marker missing: {old!r}")
              text = text.replace(old, new)
          tests.write_text(text, encoding="utf-8")
          PY
          python -m pip install "ruff==0.16.2"
          python -m ruff format \
            src/bayesian_phystwin/_canonical_contracts.py \
            tests/test_portable_contracts_integrity.py
          python -m ruff format --check \
            src/bayesian_phystwin/_canonical_contracts.py \
            tests/test_portable_contracts_integrity.py
          rm .github/workflows/contract-integrity-reader-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayesian_phystwin/_canonical_contracts.py \
            tests/test_portable_contracts_integrity.py \
            .github/workflows/contract-integrity-reader-hardening.yml
          git diff --cached --check
          git commit -m "Guard inherited frozen-container read operations"
          git push origin "HEAD:${HEAD_BRANCH}"
