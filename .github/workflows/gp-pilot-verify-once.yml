# workflow-lifecycle: temporary
# workflow-owner: IPS-Stuttgart maintainers
# workflow-expires: 2026-09-14
# workflow-removal-condition: Remove after verified result blobs and formatting are applied.
name: Verify frozen GP pilot once
on:
  pull_request:
    paths:
      - '.github/workflows/gp-pilot-verify-once.yml'
permissions:
  contents: read
jobs:
  verify-evidence:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.number == 952
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 04da7ccfadb8bc64f3707800a2b10839f29a482e
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.10'
      - name: Install verification dependencies
        run: python -m pip install numpy==1.24.3 ruff==0.16.6
      - name: Verify sealed predictions and retain compact Git objects
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.request
          import urllib.error
          from zipfile import ZipFile
          import numpy as np
          base = 'https://api.github.com/repos/IPS-Stuttgart/BayesianPhysTwin'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}
          def request(path, value=None):
              data = None if value is None else json.dumps(value).encode()
              req = urllib.request.Request(base + path, headers=headers, data=data)
              with urllib.request.urlopen(req, timeout=60) as response:
                  return response.read()
          # curl strips Authorization on cross-origin redirects by default.
          payload = subprocess.run(['curl', '--fail', '--location', '--silent', '--show-error', '--header', headers['Authorization'].join(['Authorization: ', '']), base + '/actions/artifacts/9995263426/zip'], check=True, capture_output=True).stdout
          expected = '7236cddfbc46dd5ceb977ec6c36296de8614b0392dacf387d14c24931b4873d8'
          assert hashlib.sha256(payload).hexdigest() == expected
          with ZipFile(io.BytesIO(payload)) as archive:
              files = {name: archive.read(name) for name in ['result.json', 'report.md', 'selection.json', 'preparation.json', 'prediction_seal.json', 'predictions.npz', 'validation_truth.npz', 'validation.npz']}
          result = json.loads(files['result.json'])
          seal = json.loads(files['prediction_seal.json'])
          assert hashlib.sha256(files['predictions.npz']).hexdigest() == seal['predictions_sha256']
          assert hashlib.sha256(files['selection.json']).hexdigest() == seal['selection_sha256']
          with np.load(io.BytesIO(files['predictions.npz']), allow_pickle=False) as npz:
              pred = {key: npz[key] for key in npz.files}
          with np.load(io.BytesIO(files['validation_truth.npz']), allow_pickle=False) as npz:
              truth = npz['targets']
          with np.load(io.BytesIO(files['validation.npz']), allow_pickle=False) as npz:
              assert npz['names'].tolist() == result['validation_names']
              np.testing.assert_array_equal(npz['baseline'], pred['baseline'])
          assert truth.shape == (8, 498, 12, 3)
          baseline_loss = np.mean(np.abs(pred['ridge_fixed'] - truth), axis=(1, 2, 3))
          draws = np.random.default_rng(720260907).integers(0, 8, (10000, 8))
          widths = {}
          for row in result['methods']:
              name = row['method']
              assert np.isfinite(pred[name]).all() and pred[name].shape == truth.shape
              np.testing.assert_array_equal(pred[name][:, :, [0, 1, -2, -1]], pred['baseline'][:, :, [0, 1, -2, -1]])
              loss = np.mean(np.abs(pred[name] - truth), axis=(1, 2, 3))
              np.testing.assert_allclose(loss * 1000, row['case_l1_mm'], atol=1e-11, rtol=0)
              np.testing.assert_allclose(loss.mean() * 1000, row['mean_coordinate_l1_mm'], atol=1e-11, rtol=0)
              diff = loss - baseline_loss
              ci = np.quantile(diff[draws].mean(axis=1), [0.025, 0.975]) * 1000
              np.testing.assert_allclose(ci, row['paired_bootstrap_95_mm'], atol=1e-11, rtol=0)
              assert int(np.sum(diff < -1e-12)) == row['wins_vs_ridge']
              if name.endswith('gp'):
                  variance = pred[name + '_raw_variance']
                  error = pred[name][:, :, 2:-2] - truth[:, :, 2:-2]
                  coverage = np.mean(np.abs(error) <= 1.6448536269514722 * np.sqrt(variance))
                  np.testing.assert_allclose(coverage, row['raw_coordinate_coverage90'], atol=1e-12, rtol=0)
                  widths[name] = float(2000 * 1.6448536269514722 * np.sqrt(variance).mean())
          assert seal['outer_validation_truth_read'] is False
          assert result['source_test_read'] is False and result['official_eval_read'] is False
          selection = json.loads(files['selection.json'])
          assert len(selection['inner_fit_names']) == 32 and len(selection['inner_validation_names']) == 8
          assert not set(selection['inner_fit_names']) & set(selection['inner_validation_names'])
          assert len(selection['duplicate_groups']) == 40
          for family, chosen in selection['selected'].items():
              best = min((row for row in selection['gp_bank'] if row['family'] == family), key=lambda row: (row['inner_l1_m'], row['length'], row['noise_variance'], row['shrinkage']))
              assert best == chosen
          verification = {'status': 'passed', 'source_run_id': 34053472701, 'artifact_id': 9995263426, 'artifact_sha256': expected, 'source_revision': '04da7ccfadb8bc64f3707800a2b10839f29a482e', 'checks': ['artifact_digest', 'prediction_and_selection_seals', 'all_five_point_scores', 'all_case_scores', 'all_paired_bootstrap_intervals', 'all_clamped_nodes_exact', 'query_names_and_baseline', 'inner_only_hyperparameter_selection', 'reported_raw_coordinate_coverage'], 'posthoc_raw_interval_mean_full_width90_mm': widths, 'boundary': 'independent arithmetic verification of retrospective development evidence, not a new experiment or calibration claim'}
          objects = []
          for name in ['result.json', 'report.md', 'selection.json', 'preparation.json', 'prediction_seal.json']:
              blob = json.loads(request('/git/blobs', {'content': files[name].decode(), 'encoding': 'utf-8'}))
              objects.append({'path': 'experiments/deform_gp_residual_dev_v1/results/' + name, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          blob = json.loads(request('/git/blobs', {'content': json.dumps(verification, indent=2, sort_keys=True) + '\n', 'encoding': 'utf-8'}))
          objects.append({'path': 'experiments/deform_gp_residual_dev_v1/results/verification.json', 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          path = Path('experiments/deform_gp_residual_dev_v1/import_cache.py')
          before = ast.dump(ast.parse(path.read_text()))
          subprocess.run(['python', '-m', 'ruff', 'format', str(path)], check=True)
          subprocess.run(['python', '-m', 'ruff', 'check', str(path)], check=True)
          assert ast.dump(ast.parse(path.read_text())) == before
          blob = json.loads(request('/git/blobs', {'content': path.read_text(), 'encoding': 'utf-8'}))
          objects.append({'path': str(path), 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          print('VERIFICATION', json.dumps(verification, sort_keys=True))
          print('VERIFIED_RESULT_BLOBS', json.dumps(objects))
          own_shas = {'52120c79cd859e170c3c766199c38bca805c2eeb', '1dc09d59b03bcecf675fb0b57fe32ae262a9d4d9', 'dc2ed6a141d11bdaad5a7efbd96f35dd592e9274', 'ca5378f6cb7c872af3314247fec8d688ea40aad1', '7a54b605f33d789bbec99778f93fe8849e809f4c', os.environ['REQUEST_HEAD']}
          path = '/actions/workflows/351734685/runs?branch=research%2Fdeform-gp-nystrom-dev-779c15c4&per_page=50'
          runs = json.loads(request(path))['workflow_runs']
          for run in runs:
              if run['head_branch'] == 'research/deform-gp-nystrom-dev-779c15c4' and run['head_sha'] in own_shas and run['status'] != 'completed' and run['id'] != 34053472701:
                  try:
                      request('/actions/runs/' + str(run['id']) + '/cancel', {})
                      print('CANCELLED_OWN_REDUNDANT_RUN', run['id'])
                  except urllib.error.HTTPError as exc:
                      if exc.code != 409:
                          raise
                      print('OWN_RUN_ALREADY_FINISHED', run['id'])
          PY
