name: Export validated PR 262 final tree

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/_one_shot_finalize_pr262.yml"
      - "scripts/_one_shot_fix_pr262_typing.py"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: export-final-pr262-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  export:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 262 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref ==
        'agent/deform360-visual-execution-admission-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply explicit parser narrowing
        run: |
          set -euo pipefail
          python scripts/_one_shot_fix_pr262_typing.py

      - name: Install validation environment
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev,graph]" "numpy>=1.24,<2.2"
          python -m pip install "build>=1.2"
          python -m pip check

      - name: Apply exact Ruff normalization
        run: |
          set -euo pipefail
          files=(
            src/bayesian_phystwin/deform360_calibration_visual_execution_admission.py
            scripts/science/admit_deform360_calibration_visual_execution.py
            tests/test_deform360_calibration_visual_execution_admission.py
            tests/conftest.py
          )
          python -m ruff check --fix "${files[@]}"
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"

      - name: Run focused validation
        run: |
          set -euo pipefail
          python -m mypy \
            src/bayesian_phystwin/deform360_calibration_visual_execution_admission.py \
            scripts/science/admit_deform360_calibration_visual_execution.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_deform360_calibration_visual_execution_admission.py \
            tests/test_deform360_calibration_visual_production_plan.py
          python -m py_compile \
            src/bayesian_phystwin/deform360_calibration_visual_execution_admission.py \
            scripts/science/admit_deform360_calibration_visual_execution.py \
            tests/test_deform360_calibration_visual_execution_admission.py
          python -m build --sdist

      - name: Assemble exact final tree
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/pr262-final-tree"
          mkdir -p \
            "$root/.github/workflows" \
            "$root/docs" \
            "$root/scripts/science" \
            "$root/src/bayesian_phystwin" \
            "$root/tests"
          cp .github/workflows/deform360-calibration-visual-execution-admission.yml \
            "$root/.github/workflows/"
          cp MANIFEST.in "$root/"
          cp docs/deform360_calibration_visual_execution_admission.md "$root/docs/"
          cp scripts/science/admit_deform360_calibration_visual_execution.py \
            "$root/scripts/science/"
          cp src/bayesian_phystwin/deform360_calibration_visual_execution_admission.py \
            "$root/src/bayesian_phystwin/"
          cp tests/conftest.py "$root/tests/"
          cp tests/test_deform360_calibration_visual_execution_admission.py \
            "$root/tests/"
          cat > "$root/DELETE_PATHS.txt" <<'EOF'
          .github/workflows/_one_shot_finalize_pr262.yml
          scripts/_one_shot_fix_pr262_typing.py
          EOF
          (
            cd "$root"
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Publish validated blob identities
        shell: bash
        env:
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          PARENT_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          FINAL_ROOT: ${{ runner.temp }}/pr262-final-tree
          RECEIPT: ${{ runner.temp }}/pr262-blob-receipt.json
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          api = os.environ["API_URL"]
          repository = os.environ["REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          parent = os.environ["PARENT_SHA"]
          root = Path(os.environ["FINAL_ROOT"])
          receipt_path = Path(os.environ["RECEIPT"])
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          def request(method: str, path: str, payload: object | None = None) -> object:
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  f"{api}/repos/{repository}{path}",
                  data=data,
                  headers=headers,
                  method=method,
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          parent_commit = request("GET", f"/git/commits/{parent}")
          if not isinstance(parent_commit, dict):
              raise SystemExit("parent commit response is not an object")
          base_tree = str(parent_commit["tree"]["sha"])
          blob_shas = {}
          for relative in (
              ".github/workflows/deform360-calibration-visual-execution-admission.yml",
              "MANIFEST.in",
              "docs/deform360_calibration_visual_execution_admission.md",
              "scripts/science/admit_deform360_calibration_visual_execution.py",
              "src/bayesian_phystwin/deform360_calibration_visual_execution_admission.py",
              "tests/conftest.py",
              "tests/test_deform360_calibration_visual_execution_admission.py",
          ):
              payload = (root / relative).read_bytes()
              blob = request(
                  "POST",
                  "/git/blobs",
                  {
                      "content": base64.b64encode(payload).decode("ascii"),
                      "encoding": "base64",
                  },
              )
              if not isinstance(blob, dict):
                  raise SystemExit(f"blob response is not an object: {relative}")
              blob_shas[relative] = str(blob["sha"])
          receipt = {
              "repository": repository,
              "parent_sha": parent,
              "base_tree_sha": base_tree,
              "blob_shas": blob_shas,
              "deleted_paths": [
                  ".github/workflows/_one_shot_finalize_pr262.yml",
                  "scripts/_one_shot_fix_pr262_typing.py",
              ],
          }
          receipt_path.write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Upload exact final tree and blob receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: pr262-blob-receipt-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/pr262-final-tree/
            ${{ runner.temp }}/pr262-blob-receipt.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
