name: One-shot finalize PR 262

on:
  push:
    branches: [agent/deform360-visual-execution-admission-v1]
    paths:
      - ".github/workflows/_one_shot_finalize_pr262.yml"
      - "src/bayesian_phystwin/deform360_calibration_visual_execution_admission.py"
      - "scripts/science/admit_deform360_calibration_visual_execution.py"
      - "tests/test_deform360_calibration_visual_execution_admission.py"

permissions:
  contents: write

concurrency:
  group: one-shot-finalize-pr262
  cancel-in-progress: true

jobs:
  finalize:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.ref == 'refs/heads/agent/deform360-visual-execution-admission-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install validation environment
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev,graph]" "numpy>=1.24,<2.2"
          python -m pip install "build>=1.2"
          python -m pip check

      - name: Apply exact Ruff normalization
        run: |
          set -euo pipefail
          files=(
            src/bayesian_phystwin/deform360_calibration_visual_execution_admission.py
            scripts/science/admit_deform360_calibration_visual_execution.py
            tests/test_deform360_calibration_visual_execution_admission.py
            tests/conftest.py
          )
          python -m ruff check --fix "${files[@]}"
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"

      - name: Run focused validation
        run: |
          set -euo pipefail
          python -m mypy \
            src/bayesian_phystwin/deform360_calibration_visual_execution_admission.py \
            scripts/science/admit_deform360_calibration_visual_execution.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_deform360_calibration_visual_execution_admission.py \
            tests/test_deform360_calibration_visual_production_plan.py
          python -m py_compile \
            src/bayesian_phystwin/deform360_calibration_visual_execution_admission.py \
            scripts/science/admit_deform360_calibration_visual_execution.py \
            tests/test_deform360_calibration_visual_execution_admission.py
          python -m build --sdist

      - name: Remove temporary workflow and verify scope
        run: |
          set -euo pipefail
          rm .github/workflows/_one_shot_finalize_pr262.yml
          git diff --check
          test -z "$(git diff --name-only 29734825b3cfba6300f873bbc1a049e369e2f226 -- | grep -E '^\.github/workflows/_one_shot' || true)"

      - name: Commit validated final source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize retained-byte visual execution admission'
          git push origin HEAD:agent/deform360-visual-execution-admission-v1
