name: Execute golden-path artifact hardening

on:
  pull_request:
    branches:
      - agent/golden-path-decision-artifacts-v1
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  harden:
    if: >-
      github.event.pull_request.head.ref ==
      'agent/execute-golden-path-artifact-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact target branch
        uses: actions/checkout@v7
        with:
          ref: agent/golden-path-decision-artifacts-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Apply reviewed strictness fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path(
              "src/bayesian_phystwin/"
              "three_repository_golden_path_artifacts_v1.py"
          )
          text = source.read_text(encoding="utf-8")
          if "import hashlib\nimport math\n" not in text:
              text = text.replace(
                  "import math\n",
                  "import hashlib\nimport math\n",
                  1,
              )
          text = text.replace(
              "        canonical = np.ascontiguousarray(array)\n"
              "        import hashlib\n\n"
              "        return cls(\n",
              "        canonical = np.ascontiguousarray(array)\n"
              "        return cls(\n",
              1,
          )
          text = text.replace(
              '        if (\n'
              '            payload["schema_version"]\n'
              '            != GOLDEN_PATH_SELECTION_SCHEMA_VERSION\n'
              '        ):\n',
              '        if (\n'
              '            type(payload["schema_version"]) is not int\n'
              '            or payload["schema_version"]\n'
              '            != GOLDEN_PATH_SELECTION_SCHEMA_VERSION\n'
              '        ):\n',
              1,
          )
          text = text.replace(
              '        if payload["schema_version"] != '
              'GOLDEN_PATH_BUNDLE_SCHEMA_VERSION:\n',
              '        if (\n'
              '            type(payload["schema_version"]) is not int\n'
              '            or payload["schema_version"]\n'
              '            != GOLDEN_PATH_BUNDLE_SCHEMA_VERSION\n'
              '        ):\n',
              1,
          )
          text = text.replace(
              ") -> Mapping[str, Path]:\n",
              ") -> Mapping[str, str]:\n",
              1,
          )
          source.write_text(text, encoding="utf-8")

          tests = Path(
              "tests/test_three_repository_golden_path_artifacts_v1.py"
          )
          test_text = tests.read_text(encoding="utf-8")
          if "from dataclasses import replace\n" not in test_text:
              test_text = test_text.replace(
                  "from collections.abc import Mapping\n",
                  "from collections.abc import Mapping\n"
                  "from dataclasses import replace\n",
                  1,
              )
          old = '''    drifted_rejected = GoldenPathSelectionArtifactV1(
        **{
            **bundle.rejected.__dict__,
            "run_manifest_id": "9" * 64,
        }
    )
'''
          new = '''    drifted_rejected = replace(
        bundle.rejected,
        run_manifest_id="9" * 64,
    )
'''
          if old not in test_text:
              raise RuntimeError("slots-based drift test patch target changed")
          test_text = test_text.replace(old, new, 1)
          tests.write_text(test_text, encoding="utf-8")
          PY

      - name: Install focused validation environment
        run: python -m pip install -e ".[dev]" coverage

      - name: Format and validate the artifact contract
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/bayesian_phystwin/three_repository_golden_path_artifacts_v1.py
            tests/test_three_repository_golden_path_artifacts_v1.py
          )
          ruff format "${files[@]}"
          ruff check "${files[@]}"
          ruff format --check "${files[@]}"
          python -m mypy \
            src/bayesian_phystwin/three_repository_golden_path_artifacts_v1.py
          coverage run --branch --source=bayesian_phystwin \
            -m pytest -q tests/test_three_repository_golden_path_artifacts_v1.py
          coverage report -m \
            --include=src/bayesian_phystwin/three_repository_golden_path_artifacts_v1.py
          git diff --check

      - name: Push the reviewed product patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No hardening changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayesian_phystwin/three_repository_golden_path_artifacts_v1.py \
            tests/test_three_repository_golden_path_artifacts_v1.py
          git commit -m "Harden golden-path artifact serialization"
          git push origin HEAD:agent/golden-path-decision-artifacts-v1
