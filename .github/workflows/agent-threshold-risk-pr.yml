name: Apply threshold-risk implementation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: agent-threshold-risk-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  implement:
    if: github.head_ref == 'agent/tie-preserving-threshold-risk'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/tie-preserving-threshold-risk
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Extract and apply the staged patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/agent-threshold-risk-coverage.yml')
          text = workflow.read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          body = text[start:end]
          dedented = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in body.splitlines()
          )
          Path('/tmp/apply_threshold_risk.py').write_text(
              dedented + '\n', encoding='utf-8'
          )
          PY
          python /tmp/apply_threshold_risk.py
          rm .github/workflows/agent-threshold-risk-pr.yml
      - name: Format and validate implementation
        run: |
          python -m ruff format \
            src/bayesian_phystwin/decisive_evidence.py \
            tests/test_decisive_evidence.py
          python -m ruff check \
            src/bayesian_phystwin/decisive_evidence.py \
            tests/test_decisive_evidence.py
          python -m ruff format --check \
            src/bayesian_phystwin/decisive_evidence.py \
            tests/test_decisive_evidence.py
          python -m mypy --python-version 3.12 \
            src/bayesian_phystwin/decisive_evidence.py
          python -m pytest -q tests/test_decisive_evidence.py
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add tie-preserving threshold risk coverage"
          git push origin HEAD:agent/tie-preserving-threshold-risk
