name: Format PR 571 once

on:
  push:
    branches:
      - agent/query-covariance-composition-v1

permissions:
  contents: write

concurrency:
  group: format-pr571-once
  cancel-in-progress: false

jobs:
  format:
    if: github.repository == 'IPS-Stuttgart/BayesianPhysTwin'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/query-covariance-composition-v1
          fetch-depth: 1
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Format exact PR files and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'ruff==0.16.2'
          python -m ruff format \
            src/bayesian_phystwin/query_covariance_decision_v1.py \
            tests/test_query_calibration_covariance_decision_integrity_v1.py \
            tests/test_query_calibration_covariance_decision_v1.py \
            tests/test_query_calibration_covariance_decision_v1_validation.py
          rm .github/workflows/format-pr571-once.yml
          git diff --check

      - name: Commit the exact formatting result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/bayesian_phystwin/query_covariance_decision_v1.py \
            tests/test_query_calibration_covariance_decision_integrity_v1.py \
            tests/test_query_calibration_covariance_decision_v1.py \
            tests/test_query_calibration_covariance_decision_v1_validation.py \
            .github/workflows/format-pr571-once.yml
          if git diff --cached --quiet; then
            echo 'No formatting changes were required.'
            exit 0
          fi
          git commit -m 'Apply canonical Ruff formatting to query covariance decision'
          git push origin HEAD:agent/query-covariance-composition-v1
