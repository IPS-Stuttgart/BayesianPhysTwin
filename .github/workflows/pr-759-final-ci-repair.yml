# workflow-lifecycle: permanent
# workflow-owner: IPS-Stuttgart maintainers
name: PR 759 final CI repair

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/pr-759-final-ci-repair.yml"

permissions:
  contents: write

concurrency:
  group: pr-759-final-ci-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Pin the remaining action and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/deform360-calibration-visual-production.yml')
          text = path.read_text(encoding='utf-8')
          source = 'actions/setup-python@v7'
          target = 'actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0'
          count = text.count(source)
          if count != 1:
              raise SystemExit(f'expected exactly one remaining setup-python@v7, found {count}')
          path.write_text(text.replace(source, target), encoding='utf-8')
          Path('.github/workflows/pr-759-final-ci-repair.yml').unlink()
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add \
            .github/workflows/deform360-calibration-visual-production.yml \
            .github/workflows/pr-759-final-ci-repair.yml
          git diff --cached --check
          git commit -m "Pin remaining calibration visual action"
          git rev-parse HEAD
          git push origin "HEAD:${GITHUB_HEAD_REF}"
