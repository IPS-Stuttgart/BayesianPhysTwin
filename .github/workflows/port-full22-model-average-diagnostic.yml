name: Port full-22 diagnostic data onto main

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  port:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify the science-only source delta
        shell: bash
        run: |
          set -euo pipefail
          source_base=b01890665aa22419bfb6310d3dc1716b7769e78a
          source_head=b25abb2014ab54d07113eaf4a84205fa6c12c739
          git fetch --no-tags origin "${source_base}" "${source_head}"

          cat > /tmp/expected-files.txt <<'EOF'
          .github/workflows/full22-model-average-hosted-reference.yml
          .github/workflows/full22-model-average-science.yml
          protocols/full22_endpoint_model_average_diagnostic_v1.json
          results/diagnostics/full22_endpoint_model_average_v1/README.md
          results/diagnostics/full22_endpoint_model_average_v1/artifact_manifest.json
          results/diagnostics/full22_endpoint_model_average_v1/per_case.csv
          results/diagnostics/full22_endpoint_model_average_v1/readout.json
          scripts/science/run_full22_endpoint_model_average_diagnostic.py
          tests/test_full22_endpoint_model_average_diagnostic.py
          EOF
          git diff --name-only "${source_base}" "${source_head}" \
            | LC_ALL=C sort > /tmp/actual-files.txt
          LC_ALL=C sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - name: Restore the seven non-workflow artifacts
        shell: bash
        run: |
          set -euo pipefail
          source_head=b25abb2014ab54d07113eaf4a84205fa6c12c739
          cat > /tmp/data-files.txt <<'EOF'
          protocols/full22_endpoint_model_average_diagnostic_v1.json
          results/diagnostics/full22_endpoint_model_average_v1/README.md
          results/diagnostics/full22_endpoint_model_average_v1/artifact_manifest.json
          results/diagnostics/full22_endpoint_model_average_v1/per_case.csv
          results/diagnostics/full22_endpoint_model_average_v1/readout.json
          scripts/science/run_full22_endpoint_model_average_diagnostic.py
          tests/test_full22_endpoint_model_average_diagnostic.py
          EOF
          while IFS= read -r file; do
            mkdir -p "$(dirname "${file}")"
            git show "${source_head}:${file}" > "${file}"
          done < /tmp/data-files.txt

      - name: Make the CSV evidence byte-stable
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          script = Path(
              'scripts/science/run_full22_endpoint_model_average_diagnostic.py'
          )
          text = script.read_text(encoding='utf-8')
          old = '        writer = csv.DictWriter(handle, fieldnames=fieldnames)\n'
          new = (
              '        writer = csv.DictWriter(\n'
              '            handle, fieldnames=fieldnames, lineterminator="\\n"\n'
              '        )\n'
          )
          if text.count(old) != 1:
              raise RuntimeError('unexpected full-22 CSV writer implementation')
          script.write_text(text.replace(old, new), encoding='utf-8')

          tests = Path('tests/test_full22_endpoint_model_average_diagnostic.py')
          text = tests.read_text(encoding='utf-8')
          marker = 'def test_case_csv_uses_repository_stable_lf_line_endings'
          if marker not in text:
              text += '''

          def test_case_csv_uses_repository_stable_lf_line_endings(
              tmp_path: Path,
          ) -> None:
              module = _load_script()
              point = {
                  method: {
                      "chamfer_distance_m": 1.0,
                      "track_error_m": 2.0,
                  }
                  for method in module.METHODS
              }
              output = tmp_path / "per_case.csv"

              module._write_case_csv(
                  output,
                  {
                      "case": {
                          "cohort": "confirmation",
                          "anchor_validation": {"accepted": True},
                          "point": point,
                      }
                  },
              )

              raw = output.read_bytes()
              assert b"\\r\\n" not in raw
              assert raw.count(b"\\n") == 2
          '''
              tests.write_text(text, encoding='utf-8')

          root = Path('results/diagnostics/full22_endpoint_model_average_v1')
          manifest_path = root / 'artifact_manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          raw = (root / 'per_case.csv').read_bytes()
          if b'\r\n' in raw:
              raise RuntimeError('repository CSV unexpectedly retains CRLF bytes')
          repository_digest = hashlib.sha256(raw).hexdigest()
          reconstructed_hosted_digest = hashlib.sha256(
              raw.replace(b'\n', b'\r\n')
          ).hexdigest()
          if reconstructed_hosted_digest != manifest['per_case_csv_sha256']:
              raise RuntimeError(
                  'the hosted/repository CSV mismatch is not explained solely '
                  'by Git line-ending normalization'
              )
          manifest['hosted_per_case_csv_sha256'] = manifest[
              'per_case_csv_sha256'
          ]
          manifest['repository_per_case_csv_sha256'] = repository_digest
          manifest['repository_per_case_csv_line_endings'] = 'LF'
          manifest_path.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )

          readme = root / 'README.md'
          text = readme.read_text(encoding='utf-8')
          summary_line = (
              '- Summary SHA-256: '
              '`6b2baa1d1cddb941c7682aebc360e3fc9622bbd553849dbb95696c7afba7f672`\n'
          )
          addition = (
              '- Hosted per-case CSV SHA-256: '
              f'`{manifest["hosted_per_case_csv_sha256"]}`\n'
              '- Repository LF per-case CSV SHA-256: '
              f'`{repository_digest}`\n'
          )
          if addition not in text:
              if text.count(summary_line) != 1:
                  raise RuntimeError('unexpected result README hash section')
              text = text.replace(summary_line, summary_line + addition)
              note = (
                  '\nThe hosted artifact was emitted with CSV `CRLF` row endings, '
                  'whereas Git normalized the committed snapshot to `LF`. '
                  'Reconstructing `CRLF` from the committed rows reproduces the '
                  'hosted manifest hash exactly. Both byte identities are retained '
                  'above, and the evaluator now emits `LF` explicitly.\n'
              )
              text = text.replace('\n## Main point result', note + '\n## Main point result')
              readme.write_text(text, encoding='utf-8')
          PY

      - name: Install locked development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,data,graph]"
          python -m pip check

      - name: Validate code, protocol, and committed evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check --fix \
            scripts/science/run_full22_endpoint_model_average_diagnostic.py \
            tests/test_full22_endpoint_model_average_diagnostic.py
          python -m ruff format \
            scripts/science/run_full22_endpoint_model_average_diagnostic.py \
            tests/test_full22_endpoint_model_average_diagnostic.py
          python -m ruff check \
            scripts/science/run_full22_endpoint_model_average_diagnostic.py \
            tests/test_full22_endpoint_model_average_diagnostic.py
          python -m ruff format --check \
            scripts/science/run_full22_endpoint_model_average_diagnostic.py \
            tests/test_full22_endpoint_model_average_diagnostic.py
          python -m pytest -q \
            tests/test_full22_endpoint_model_average_diagnostic.py \
            tests/test_endpoint_model_average.py
          python - <<'PY'
          import csv
          import hashlib
          import json
          from pathlib import Path

          root = Path('results/diagnostics/full22_endpoint_model_average_v1')
          manifest = json.loads(
              (root / 'artifact_manifest.json').read_text(encoding='utf-8')
          )
          protocol = json.loads(
              Path(
                  'protocols/full22_endpoint_model_average_diagnostic_v1.json'
              ).read_text(encoding='utf-8')
          )
          protocol_digest = hashlib.sha256(
              json.dumps(
                  protocol,
                  sort_keys=True,
                  separators=(',', ':'),
                  allow_nan=False,
              ).encode('utf-8')
          ).hexdigest()
          expected_protocol = (
              '8c4021f082b03ef761bc97300eeac11b6f3f92a2bdc52c1941020f6c1f340217'
          )
          if protocol_digest != expected_protocol:
              raise SystemExit(
                  f'protocol digest changed: {protocol_digest} != {expected_protocol}'
              )
          if manifest['protocol_sha256'] != protocol_digest:
              raise SystemExit('manifest protocol digest disagrees with protocol')

          per_case = root / 'per_case.csv'
          raw = per_case.read_bytes()
          repository_digest = hashlib.sha256(raw).hexdigest()
          if repository_digest != manifest['repository_per_case_csv_sha256']:
              raise SystemExit('repository CSV digest disagrees with manifest')
          hosted_digest = hashlib.sha256(raw.replace(b'\n', b'\r\n')).hexdigest()
          if hosted_digest != manifest['hosted_per_case_csv_sha256']:
              raise SystemExit('hosted CSV digest is not reproduced by CRLF rows')
          if manifest['per_case_csv_sha256'] != hosted_digest:
              raise SystemExit('legacy per-case digest no longer identifies hosted CSV')
          if manifest['repository_per_case_csv_line_endings'] != 'LF':
              raise SystemExit('repository CSV line-ending contract changed')
          with per_case.open(newline='', encoding='utf-8') as stream:
              rows = list(csv.DictReader(stream))
          if len(rows) != 22:
              raise SystemExit(f'expected 22 per-case rows, received {len(rows)}')

          readout = json.loads((root / 'readout.json').read_text(encoding='utf-8'))
          if readout['protocol_sha256'] != protocol_digest:
              raise SystemExit('readout protocol digest disagrees with protocol')
          if readout['classification'] != 'retrospective-non-claim-bearing-diagnostic':
              raise SystemExit('readout claim classification changed')
          if readout['confirmation_19']['case_count'] != 19:
              raise SystemExit('confirmation partition no longer contains 19 cases')
          print(
              json.dumps(
                  {
                      'protocol_sha256': protocol_digest,
                      'repository_per_case_sha256': repository_digest,
                      'hosted_per_case_sha256': hosted_digest,
                      'case_count': len(rows),
                      'classification': readout['classification'],
                  },
                  indent=2,
                  sort_keys=True,
              )
          )
          PY
          git diff --check

      - name: Commit the validated non-workflow artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            protocols/full22_endpoint_model_average_diagnostic_v1.json \
            results/diagnostics/full22_endpoint_model_average_v1/README.md \
            results/diagnostics/full22_endpoint_model_average_v1/artifact_manifest.json \
            results/diagnostics/full22_endpoint_model_average_v1/per_case.csv \
            results/diagnostics/full22_endpoint_model_average_v1/readout.json \
            scripts/science/run_full22_endpoint_model_average_diagnostic.py \
            tests/test_full22_endpoint_model_average_diagnostic.py
          git diff --cached --check
          git commit -m 'Publish locked full-22 model-average diagnostic data'
          git push origin HEAD:${{ github.head_ref }}
