name: Execute golden-path dtype typing repair

on:
  pull_request:
    branches:
      - agent/golden-path-decision-artifacts-v1
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.head.ref ==
      'agent/execute-golden-path-dtype-typing'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact target branch
        uses: actions/checkout@v7
        with:
          ref: agent/golden-path-decision-artifacts-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Apply the reviewed dtype annotation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "src/bayesian_phystwin/"
              "three_repository_golden_path_artifacts_v1.py"
          )
          text = path.read_text(encoding="utf-8")
          old = "            dtype = np.dtype(dtype_text)\n"
          new = "            dtype: np.dtype[Any] = np.dtype(dtype_text)\n"
          if old not in text:
              if new in text:
                  raise SystemExit(0)
              raise RuntimeError("dtype annotation target changed")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Install and validate the focused contract
        run: python -m pip install -e ".[dev]"

      - name: Run authoritative source checks
        shell: bash
        run: |
          set -euo pipefail
          file=src/bayesian_phystwin/three_repository_golden_path_artifacts_v1.py
          ruff check "${file}"
          ruff format --check "${file}"
          python -m mypy "${file}"
          python -m pytest -q \
            tests/test_three_repository_golden_path_artifacts_v1.py
          git diff --check

      - name: Push the typing-only commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "The dtype annotation is already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayesian_phystwin/three_repository_golden_path_artifacts_v1.py
          git commit -m "Type the golden-path array dtype"
          git push origin HEAD:agent/golden-path-decision-artifacts-v1
