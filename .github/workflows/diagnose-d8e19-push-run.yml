name: Diagnose protected-main Deform360 run

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-d8e19-push-run.yml"

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'diagnostic/track-d8e19-push-run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report exact push workflow and jobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: d8e19b5b572fda3e1373302a1052c297f19eeea3
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          target_sha = os.environ["TARGET_SHA"]
          token = os.environ["GH_TOKEN"]
          api = "https://api.github.com"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "BayesianPhysTwin-read-only-run-diagnostic",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get_json(url: str) -> dict[str, object]:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          query = urllib.parse.urlencode(
              {
                  "head_sha": target_sha,
                  "event": "push",
                  "per_page": 100,
              }
          )
          payload = get_json(f"{api}/repos/{repository}/actions/runs?{query}")
          runs = payload.get("workflow_runs", [])
          if not isinstance(runs, list):
              raise SystemExit("workflow_runs response changed")
          print(f"target_sha={target_sha}")
          print(f"push_run_count={len(runs)}")
          for run in sorted(runs, key=lambda row: str(row.get("created_at")), reverse=True):
              run_id = int(run["id"])
              print(
                  "RUN "
                  f"id={run_id} "
                  f"name={run.get('name')!r} "
                  f"status={run.get('status')} "
                  f"conclusion={run.get('conclusion')} "
                  f"attempt={run.get('run_attempt')} "
                  f"created_at={run.get('created_at')} "
                  f"updated_at={run.get('updated_at')} "
                  f"url={run.get('html_url')}"
              )
              jobs = get_json(
                  f"{api}/repos/{repository}/actions/runs/{run_id}/jobs?per_page=100"
              ).get("jobs", [])
              if not isinstance(jobs, list):
                  raise SystemExit("jobs response changed")
              for job in jobs:
                  print(
                      "JOB "
                      f"run_id={run_id} "
                      f"id={job.get('id')} "
                      f"name={job.get('name')!r} "
                      f"status={job.get('status')} "
                      f"conclusion={job.get('conclusion')} "
                      f"runner_name={job.get('runner_name')!r} "
                      f"started_at={job.get('started_at')} "
                      f"completed_at={job.get('completed_at')}"
                  )
          if not runs:
              raise SystemExit(3)
          PY
