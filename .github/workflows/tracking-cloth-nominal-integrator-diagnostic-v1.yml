# workflow-lifecycle: temporary
# workflow-owner: IPS-Stuttgart maintainers
name: Tracking Cloth nominal integrator diagnostic v1

on:
  push:
    branches: [science/tracking-cloth-self-collision-stable-bank-source-v1]
    paths:
      - ".github/requests/tracking-cloth-nominal-integrator-diagnostic-v1.json"

permissions:
  contents: read

concurrency:
  group: tracking-cloth-nominal-integrator-diagnostic-v1
  cancel-in-progress: false

env:
  DATASET_ROOT: /home/github-runner/.cache/datasets/tracking-cloth-deformation-v1-zenodo-14644526
  REQUEST_PATH: .github/requests/tracking-cloth-nominal-integrator-diagnostic-v1.json
  SCRIPT_PATH: scripts/science/diagnose_tracking_cloth_nominal_integrator_v1.py
  PROTOCOL_PATH: experiments/tracking_cloth_self_collision_stable_bank_v1/protocol.json
  SCRIPT_GIT_BLOB_SHA1: a3f076d49b44493e71b942b194447e793f2073e2
  PROTOCOL_GIT_BLOB_SHA1: 3a24f07b8303a209cf9edc0858bfb460f72ebe4e
  DATA_GIT_BLOB_SHA1: 303074602b88eaaeee990941e4f84fe47a242324
  MODEL_GIT_BLOB_SHA1: be513a069a464fb0a82f5eca7ff7f22620525dbd
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate immutable diagnostic request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          test "${PUSH_FORCED}" = false
          test "${BEFORE_SHA}" != 0000000000000000000000000000000000000000
          mapfile -t changed < <(git diff --name-status "${BEFORE_SHA}" "${GITHUB_SHA}")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = $'A\t.github/requests/tracking-cloth-nominal-integrator-diagnostic-v1.json'
          test "$(git hash-object "${SCRIPT_PATH}")" = "${SCRIPT_GIT_BLOB_SHA1}"
          test "$(git hash-object "${PROTOCOL_PATH}")" = "${PROTOCOL_GIT_BLOB_SHA1}"
          test "$(git hash-object experiments/tracking_cloth_self_collision_selective_twin_v1/data.py)" = "${DATA_GIT_BLOB_SHA1}"
          test "$(git hash-object experiments/tracking_cloth_self_collision_selective_twin_v1/model.py)" = "${MODEL_GIT_BLOB_SHA1}"
          python -m py_compile "${SCRIPT_PATH}"
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          request = json.loads(Path(os.environ["REQUEST_PATH"]).read_text())
          expected = {
              "schema": "bayesian-phystwin/tracking-cloth-nominal-integrator-diagnostic-request-v1",
              "request_id": "tracking-cloth-nominal-integrator-diagnostic-v1-20260903-a",
              "prior_failed_run_id": 33666405028,
              "prior_failure": "nominal-contact-hypothesis-unstable-on-rep1",
              "dataset_root": os.environ["DATASET_ROOT"],
              "script_path": os.environ["SCRIPT_PATH"],
              "script_git_blob_sha1": os.environ["SCRIPT_GIT_BLOB_SHA1"],
              "protocol_path": os.environ["PROTOCOL_PATH"],
              "protocol_git_blob_sha1": os.environ["PROTOCOL_GIT_BLOB_SHA1"],
              "data_git_blob_sha1": os.environ["DATA_GIT_BLOB_SHA1"],
              "model_git_blob_sha1": os.environ["MODEL_GIT_BLOB_SHA1"],
              "substep_grid": [8, 16, 32, 64, 128, 256],
              "source_repetition": 1,
              "target_repetition_opened": False,
              "source_only": True,
              "automatic_target_follow_on": False,
              "paper_claim_authorized": False,
          }
          for key, value in expected.items():
              if request.get(key) != value:
                  raise SystemExit(f"invalid {key}: {request.get(key)!r}")
          if set(request) != set(expected) | {"expected_source_revision"}:
              raise SystemExit("diagnostic request fields changed")
          parent = subprocess.check_output(
              ["git", "rev-parse", f"{os.environ['GITHUB_SHA']}^"], text=True
          ).strip()
          if request["expected_source_revision"] != parent:
              raise SystemExit("diagnostic request is not bound to its exact parent")
          PY

  diagnose:
    needs: contracts
    if: needs.contracts.result == 'success'
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 240
    env:
      OUTPUT_ROOT: nominal-integrator-diagnostic-output
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          clean: true
      - name: Revalidate source-only execution boundary
        shell: bash
        run: |
          set -euo pipefail
          test -d "${DATASET_ROOT}"
          test "$(readlink -f -- "${DATASET_ROOT}")" = "${DATASET_ROOT}"
          test "$(git hash-object "${SCRIPT_PATH}")" = "${SCRIPT_GIT_BLOB_SHA1}"
          test "$(git hash-object "${PROTOCOL_PATH}")" = "${PROTOCOL_GIT_BLOB_SHA1}"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          request = json.loads(Path(os.environ["REQUEST_PATH"]).read_text())
          parent = subprocess.check_output(
              ["git", "rev-parse", f"{os.environ['GITHUB_SHA']}^"], text=True
          ).strip()
          if request["expected_source_revision"] != parent:
              raise SystemExit("request parent changed")
          if request["target_repetition_opened"] is not False:
              raise SystemExit("target repetition boundary changed")
          if request["source_only"] is not True:
              raise SystemExit("source-only boundary changed")
          if request["automatic_target_follow_on"] is not False:
              raise SystemExit("automatic target follow-on enabled")
          PY
      - name: Run nominal substep sweep on rep1 only
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          rm -rf -- "${OUTPUT_ROOT}"
          python3 "${SCRIPT_PATH}" \
            --dataset-root "${DATASET_ROOT}" \
            --protocol "${PROTOCOL_PATH}" \
            --output "${OUTPUT_ROOT}"
      - name: Verify target closure and publish summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "${OUTPUT_ROOT}/diagnostic.json"
          jq -e '.rep3_numeric_outcomes_read == false' "${OUTPUT_ROOT}/diagnostic.json"
          cat "${OUTPUT_ROOT}/REPORT.md" >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload compact diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: tracking-cloth-nominal-integrator-diagnostic-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: nominal-integrator-diagnostic-output
          if-no-files-found: warn
          retention-days: 30
