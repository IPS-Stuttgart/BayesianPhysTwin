# workflow-lifecycle: temporary
# workflow-owner: IPS-Stuttgart maintainers
name: Deform360 same-mean dependence-query v6

on:
  push:
    branches: [science/deform360-dependence-query-v6]
    paths:
      - ".github/requests/deform360-dependence-query-v6.json"

permissions:
  actions: read
  contents: read

concurrency:
  group: deform360-dependence-query-v6-${{ github.ref }}
  cancel-in-progress: false

env:
  DATASET_ROOT: /mnt/seagate10tb/florianpfaff/datasets/deform360
  CONTROL_ROOT: control
  PARENT_CONTROL_ROOT: parent-control
  FROZEN_ROOT: frozen
  PROTOCOL_PATH: control/protocols/deform360_dependence_query_v6.json
  RUNNER_PATH: control/scripts/science/run_deform360_dependence_query_v6.py
  PARENT_PROTOCOL_PATH: parent-control/protocols/deform360_untouched_confirmation_v5.json
  PARENT_CONTROL_REVISION: e409527b8499a225bde8bd7f8c532a30e96548c6
  FROZEN_REVISION: 25ba91c021124569c4dcf84c66eda5ec088868e0
  PARENT_ARTIFACT_ID: "9738998271"
  PARENT_ARTIFACT_SHA256: e98f9e2687f568d0d0fcabec9ce0393a7e1b34ca3019acb1e14fdf894885a948
  PARENT_RESULT_SHA256: 0ad16b15c94d81b8c14221a271eb1f647d689a530284570becdfeca87e0d8ec7
  PARENT_READINESS_SHA256: 58841144ae5105080ecb991cc73e9021214fc8676f9e55948ef3511fb12a2f8e
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install focused contract dependencies
        run: python -m pip install numpy==1.26.4 pytest ruff
      - name: Validate dependence-query contracts
        run: |
          python -m pytest -q tests/test_deform360_dependence_query_v6.py
          python -m json.tool protocols/deform360_dependence_query_v6.json >/dev/null
          python -m py_compile scripts/science/run_deform360_dependence_query_v6.py
          python -m ruff check \
            scripts/science/run_deform360_dependence_query_v6.py \
            tests/test_deform360_dependence_query_v6.py
          python -m ruff format --check \
            scripts/science/run_deform360_dependence_query_v6.py \
            tests/test_deform360_dependence_query_v6.py

  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      request_path: ${{ steps.request.outputs.request_path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: request
        name: Authorize one add-only retrospective request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = refs/heads/science/deform360-dependence-query-v6
          test "${PUSH_FORCED}" = false
          test "${BEFORE_SHA}" != 0000000000000000000000000000000000000000
          mapfile -t changed < <(git diff --name-status "${BEFORE_SHA}" "${GITHUB_SHA}")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = $'A\t.github/requests/deform360-dependence-query-v6.json'
          REQUEST=.github/requests/deform360-dependence-query-v6.json
          REQUEST_PATH="${REQUEST}" python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          path = Path(os.environ["REQUEST_PATH"])
          value = json.loads(path.read_text(encoding="utf-8"))
          expected = {
              "schema": "bayesian-phystwin/deform360-dependence-query-workflow-request-v6",
              "request_id": "deform360-dependence-query-v6-20260901",
              "purpose": "Rerun the exact frozen v3 point predictor on the completed 92-object Deform360 roster and compare same-mean, coordinate-marginal-matched covariance dependence arms on source-calibrated tactile queries and execute-versus-fallback risk.",
              "runner_labels": ["self-hosted", "Linux", "X64", "gpuserver4090"],
              "dataset_root": "/mnt/seagate10tb/florianpfaff/datasets/deform360",
              "protocol_path": "protocols/deform360_dependence_query_v6.json",
              "parent_confirmation_run_id": 33335779766,
              "parent_confirmation_artifact_id": 9738998271,
              "parent_control_revision": "e409527b8499a225bde8bd7f8c532a30e96548c6",
              "frozen_point_revision": "25ba91c021124569c4dcf84c66eda5ec088868e0",
              "retrospective_target_reuse": True,
              "paper_claim_authorized": False,
          }
          for key, expected_value in expected.items():
              if value.get(key) != expected_value:
                  raise SystemExit(f"invalid {key}: {value.get(key)!r}")
          allowed = set(expected) | {"expected_source_revision"}
          if set(value) != allowed:
              raise SystemExit("request fields differ from the frozen schema")
          parent = subprocess.check_output(
              ["git", "rev-parse", f"{os.environ['GITHUB_SHA']}^"],
              text=True,
          ).strip()
          if value["expected_source_revision"] != parent:
              raise SystemExit("expected_source_revision is not the trigger parent")
          PY
          echo "request_path=${REQUEST}" >> "${GITHUB_OUTPUT}"

  evaluate:
    needs: [contracts, authorize]
    if: >-
      always() && needs.contracts.result == 'success' &&
      needs.authorize.result == 'success'
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 240
    env:
      REQUEST_PATH: ${{ needs.authorize.outputs.request_path }}
    steps:
      - name: Check out v6 control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          persist-credentials: false
          clean: true

      - name: Check out exact parent confirmation control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: e409527b8499a225bde8bd7f8c532a30e96548c6
          path: parent-control
          persist-credentials: false
          clean: true

      - name: Check out exact frozen v3 point method
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 25ba91c021124569c4dcf84c66eda5ec088868e0
          path: frozen
          persist-credentials: false
          clean: true

      - name: Recover and verify full parent confirmation evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf parent-evidence parent-evidence.zip
          mkdir -p parent-evidence
          curl --fail --location --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PARENT_ARTIFACT_ID}/zip" \
            --output parent-evidence.zip
          printf '%s  %s\n' "${PARENT_ARTIFACT_SHA256}" parent-evidence.zip \
            | sha256sum --check --strict
          unzip -q parent-evidence.zip -d parent-evidence
          test -s parent-evidence/result.json
          test -s parent-evidence/bound-readiness.json
          printf '%s  %s\n' "${PARENT_RESULT_SHA256}" parent-evidence/result.json \
            | sha256sum --check --strict
          printf '%s  %s\n' "${PARENT_READINESS_SHA256}" \
            parent-evidence/bound-readiness.json | sha256sum --check --strict

      - name: Prepare isolated numerical runtime and evidence root
        shell: bash
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP}/deform360-dependence-query-v6-venv-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          output="${RUNNER_TEMP}/deform360-dependence-query-v6-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "${venv}" "${output}"
          python3 -m venv "${venv}"
          "${venv}/bin/python" -m pip install --disable-pip-version-check numpy==1.26.4
          mkdir -p -- "${output}"
          {
            echo "PYTHON_BIN=${venv}/bin/python"
            echo "VENV_ROOT=${venv}"
            echo "OUTPUT_ROOT=${output}"
          } >> "${GITHUB_ENV}"

      - name: Validate exact lineage and runtime
        shell: bash
        run: |
          set -euo pipefail
          test -d "${DATASET_ROOT}"
          test "$(readlink -f -- "${DATASET_ROOT}")" = "${DATASET_ROOT}"
          test "$(git -C "${PARENT_CONTROL_ROOT}" rev-parse HEAD)" = \
            "${PARENT_CONTROL_REVISION}"
          test "$(git -C "${FROZEN_ROOT}" rev-parse HEAD)" = "${FROZEN_REVISION}"
          "${PYTHON_BIN}" -m py_compile \
            "${RUNNER_PATH}" \
            parent-control/scripts/science/run_deform360_untouched_confirmation_v5.py \
            parent-control/scripts/science/audit_deform360_untouched_confirmation_v5.py \
            frozen/scripts/science/run_deform360_action_kernel_v3.py \
            frozen/scripts/science/run_deform360_action_conditioned_tactile_v2.py
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "control_revision=${GITHUB_SHA}"
            echo "parent_control_revision=$(git -C "${PARENT_CONTROL_ROOT}" rev-parse HEAD)"
            echo "frozen_revision=$(git -C "${FROZEN_ROOT}" rev-parse HEAD)"
            echo "runner_name=${RUNNER_NAME}"
            echo "dataset_root=${DATASET_ROOT}"
            sha256sum \
              "${PROTOCOL_PATH}" \
              "${RUNNER_PATH}" \
              parent-evidence/result.json \
              parent-evidence/bound-readiness.json \
              parent-evidence.zip
            git -C "${PARENT_CONTROL_ROOT}" hash-object \
              protocols/deform360_untouched_confirmation_v5.json \
              scripts/science/run_deform360_untouched_confirmation_v5.py \
              scripts/science/audit_deform360_untouched_confirmation_v5.py
            git -C "${FROZEN_ROOT}" hash-object \
              scripts/science/run_deform360_action_kernel_v3.py \
              scripts/science/run_deform360_action_conditioned_tactile_v2.py
            "${PYTHON_BIN}" --version
            "${PYTHON_BIN}" -c 'import numpy; print("numpy=" + numpy.__version__)'
            uname -a
          } | tee "${OUTPUT_ROOT}/environment.txt"
          cp "${PROTOCOL_PATH}" "${OUTPUT_ROOT}/protocol.json"
          cp "control/${REQUEST_PATH}" "${OUTPUT_ROOT}/request.json"

      - name: Run same-mean dependence-query evaluation
        shell: bash
        run: |
          set -euo pipefail
          "${PYTHON_BIN}" "${RUNNER_PATH}" \
            --protocol "${PROTOCOL_PATH}" \
            --parent-protocol "${PARENT_PROTOCOL_PATH}" \
            --parent-result parent-evidence/result.json \
            --readiness-json parent-evidence/bound-readiness.json \
            --data-root "${DATASET_ROOT}" \
            --parent-control-root "${PARENT_CONTROL_ROOT}" \
            --frozen-root "${FROZEN_ROOT}" \
            --output-json "${OUTPUT_ROOT}/result.json" \
            --output-report "${OUTPUT_ROOT}/report.md" \
            --output-csv "${OUTPUT_ROOT}/object-results.csv" \
            | tee "${OUTPUT_ROOT}/console.log"
          cat "${OUTPUT_ROOT}/report.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Enforce complete same-mean evidence and claim boundary
        shell: bash
        run: |
          set -euo pipefail
          "${PYTHON_BIN}" - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["OUTPUT_ROOT"])
          result = json.loads((root / "result.json").read_text(encoding="utf-8"))
          if result["status"] != "complete":
              raise SystemExit("dependence-query result is incomplete")
          if result["summary"]["object_count"] != 92:
              raise SystemExit("complete 92-object roster was not evaluated")
          boundary = result["information_boundary"]
          for key in (
              "exact_frozen_v3_point_predictor_reused",
              "parent_point_result_reproduced_exactly",
              "same_mean_across_covariance_arms",
              "coordinate_marginals_matched",
              "query_scales_thresholds_and_radii_source_only",
          ):
              if boundary[key] is not True:
                  raise SystemExit(f"required information boundary failed: {key}")
          if boundary["target_outcomes_used_for_protocol_or_arm_selection"] is not False:
              raise SystemExit("target outcomes influenced protocol or arm selection")
          decision = result["decision"]
          for key in (
              "paper_claim_authorized",
              "fresh_confirmation_authorized",
              "strict_counterfactual_claim_authorized",
          ):
              if decision[key] is not False:
                  raise SystemExit(f"result self-authorized forbidden claim: {key}")
          unsigned = dict(result)
          supplied = unsigned.pop("result_sha256")
          encoded = json.dumps(
              unsigned,
              sort_keys=True,
              separators=(",", ":"),
              allow_nan=False,
          ).encode("utf-8")
          if hashlib.sha256(encoded).hexdigest() != supplied:
              raise SystemExit("result digest is invalid")
          PY
          sha256sum "${OUTPUT_ROOT}"/* > "${OUTPUT_ROOT}/sha256sums.txt"
          git -C control diff --exit-code
          test -z "$(git -C control status --porcelain --untracked-files=all)"
          git -C parent-control diff --exit-code
          test -z "$(git -C parent-control status --porcelain --untracked-files=all)"
          git -C frozen diff --exit-code
          test -z "$(git -C frozen status --porcelain --untracked-files=all)"

      - name: Upload complete dependence-query evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: deform360-dependence-query-v6-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_ROOT }}
          if-no-files-found: warn
          retention-days: 90

      - name: Remove isolated runtime
        if: always()
        shell: bash
        run: rm -rf -- "${VENV_ROOT:-}"
