# workflow-lifecycle: permanent
# workflow-owner: IPS-Stuttgart maintainers
name: Deform360 posterior marginalization versus MAP v1

on:
  push:
    branches:
      - science/deform360-posterior-vs-map-v1
    paths:
      - .github/requests/deform360-posterior-vs-map-v1.json

permissions:
  actions: read
  contents: read

concurrency:
  group: deform360-posterior-vs-map-v1
  cancel-in-progress: false

env:
  DATASET_ROOT: /mnt/seagate10tb/florianpfaff/datasets/deform360
  CONTROL_ROOT: control
  ORIGINAL_V6_ROOT: original-v6
  RECOVERY_ROOT: recovery
  PARENT_CONTROL_ROOT: parent-control
  FROZEN_ROOT: frozen
  EVALUATOR: control/scripts/science/run_deform360_posterior_vs_map_v1.py
  PROTOCOL: control/protocols/deform360_posterior_vs_map_v1.json
  ORIGINAL_V6_RUNNER: original-v6/scripts/science/run_deform360_dependence_query_v6.py
  ORIGINAL_V6_PROTOCOL: original-v6/protocols/deform360_dependence_query_v6.json
  RECOVERY_RUNNER: recovery/scripts/science/run_deform360_dependence_query_v6_bound_carrier_recovery_v1.py
  PARENT_PROTOCOL: parent-control/protocols/deform360_untouched_confirmation_v5.json
  ORIGINAL_V6_REVISION: 954538832106d8ded13f1101b3a2b2e855b40513
  ORIGINAL_V6_RUNNER_SHA256: 06c22fc3fe667c4f2f11eddee3dcb1b78b5465b6312136efb010611e1ebab91c
  RECOVERY_REVISION: 0f9312a3cae9f854631d8c61c2893c6527014219
  RECOVERY_RUNNER_GIT_BLOB_SHA1: 0955ad7ce0c176e7538bd5b91cc36e3444564be5
  PARENT_CONTROL_REVISION: e409527b8499a225bde8bd7f8c532a30e96548c6
  FROZEN_REVISION: 25ba91c021124569c4dcf84c66eda5ec088868e0
  PARENT_ARTIFACT_ID: "9738998271"
  PARENT_ARTIFACT_SHA256: e98f9e2687f568d0d0fcabec9ce0393a7e1b34ca3019acb1e14fdf894885a948
  PARENT_RESULT_SHA256: 0ad16b15c94d81b8c14221a271eb1f647d689a530284570becdfeca87e0d8ec7
  PARENT_READINESS_SHA256: 58841144ae5105080ecb991cc73e9021214fc8676f9e55948ef3511fb12a2f8e
  EVALUATOR_SHA256: ef5ba5fb1ef60bf45fc47de8588e59103b87b09854f542c9d75491ce932476c7
  PROTOCOL_SHA256: 04ecaa8a1aff0e606f01bec95dcda6f8c116e5a64b7e205fc3347df07a4861a1
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install focused contract dependencies
        run: python -m pip install numpy==1.26.4 pytest
      - name: Validate frozen protocol and numerical contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool protocols/deform360_posterior_vs_map_v1.json >/dev/null
          python -m py_compile scripts/science/run_deform360_posterior_vs_map_v1.py
          python scripts/science/run_deform360_posterior_vs_map_v1.py --self-test
          python -m pytest -q tests/test_deform360_posterior_vs_map_v1.py
          printf '%s  %s\n' "${EVALUATOR_SHA256}" \
            scripts/science/run_deform360_posterior_vs_map_v1.py \
            | sha256sum --check --strict
          printf '%s  %s\n' "${PROTOCOL_SHA256}" \
            protocols/deform360_posterior_vs_map_v1.json \
            | sha256sum --check --strict

  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      request_path: ${{ steps.request.outputs.request_path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: request
        name: Authorize one add-only posterior-vs-MAP request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = refs/heads/science/deform360-posterior-vs-map-v1
          test "${PUSH_FORCED}" = false
          test "${BEFORE_SHA}" != 0000000000000000000000000000000000000000
          mapfile -t changed < <(git diff --name-status "${BEFORE_SHA}" "${GITHUB_SHA}")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = $'A\t.github/requests/deform360-posterior-vs-map-v1.json'
          REQUEST=.github/requests/deform360-posterior-vs-map-v1.json
          REQUEST_PATH="${REQUEST}" python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          path = Path(os.environ["REQUEST_PATH"])
          value = json.loads(path.read_text(encoding="utf-8"))
          expected = {
              "schema": "bayesian-phystwin/deform360-posterior-vs-map-request-v1",
              "request_id": "deform360-posterior-vs-map-20260903",
              "workflow": "deform360-dependence-query-v6.yml",
              "branch": "science/deform360-posterior-vs-map-v1",
              "dataset_root": "/mnt/seagate10tb/florianpfaff/datasets/deform360",
              "runner_labels": ["self-hosted", "Linux", "X64", "gpuserver4090"],
              "protocol_sha256": "04ecaa8a1aff0e606f01bec95dcda6f8c116e5a64b7e205fc3347df07a4861a1",
              "evaluator_sha256": "ef5ba5fb1ef60bf45fc47de8588e59103b87b09854f542c9d75491ce932476c7",
              "original_v6_revision": "954538832106d8ded13f1101b3a2b2e855b40513",
              "recovery_revision": "0f9312a3cae9f854631d8c61c2893c6527014219",
              "parent_control_revision": "e409527b8499a225bde8bd7f8c532a30e96548c6",
              "frozen_point_revision": "25ba91c021124569c4dcf84c66eda5ec088868e0",
              "parent_confirmation_artifact_id": 9738998271,
              "object_count": 92,
              "retrospective_target_reuse": True,
              "source_only_calibration": True,
              "new_measurements_collected": False,
              "robot_actions_selected": False,
              "negative_or_mixed_result_must_be_retained": True,
              "target_outcomes_may_tune_protocol": False,
              "unbound_numeric_payloads_may_open": False,
              "paper_claim_authorized": False,
          }
          for key, expected_value in expected.items():
              if value.get(key) != expected_value:
                  raise SystemExit(f"invalid {key}: {value.get(key)!r}")
          allowed = set(expected) | {"expected_source_revision"}
          if set(value) != allowed:
              raise SystemExit("request fields differ from the frozen request schema")
          parent = subprocess.check_output(
              ["git", "rev-parse", f"{os.environ['GITHUB_SHA']}^"],
              text=True,
          ).strip()
          if value["expected_source_revision"] != parent:
              raise SystemExit("expected_source_revision is not the trigger parent")
          PY
          echo "request_path=${REQUEST}" >> "${GITHUB_OUTPUT}"

  evaluate:
    needs: [contracts, authorize]
    if: >-
      always() && needs.contracts.result == 'success' &&
      needs.authorize.result == 'success'
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 300
    env:
      REQUEST_PATH: ${{ needs.authorize.outputs.request_path }}
    steps:
      - name: Check out posterior-vs-MAP control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          persist-credentials: false
          clean: true

      - name: Check out exact original v6 analysis
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 954538832106d8ded13f1101b3a2b2e855b40513
          path: original-v6
          persist-credentials: false
          clean: true

      - name: Check out exact bound-carrier recovery implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0f9312a3cae9f854631d8c61c2893c6527014219
          path: recovery
          persist-credentials: false
          clean: true

      - name: Check out exact parent confirmation control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: e409527b8499a225bde8bd7f8c532a30e96548c6
          path: parent-control
          persist-credentials: false
          clean: true

      - name: Check out exact frozen v3 point method
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 25ba91c021124569c4dcf84c66eda5ec088868e0
          path: frozen
          persist-credentials: false
          clean: true

      - name: Recover and verify parent confirmation evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf parent-evidence parent-evidence.zip
          mkdir -p parent-evidence
          curl --fail --location --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PARENT_ARTIFACT_ID}/zip" \
            --output parent-evidence.zip
          printf '%s  %s\n' "${PARENT_ARTIFACT_SHA256}" parent-evidence.zip \
            | sha256sum --check --strict
          unzip -q parent-evidence.zip -d parent-evidence
          test -s parent-evidence/result.json
          test -s parent-evidence/bound-readiness.json
          printf '%s  %s\n' "${PARENT_RESULT_SHA256}" parent-evidence/result.json \
            | sha256sum --check --strict
          printf '%s  %s\n' "${PARENT_READINESS_SHA256}" \
            parent-evidence/bound-readiness.json | sha256sum --check --strict

      - name: Prepare isolated NumPy runtime and output root
        shell: bash
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP}/deform360-posterior-map-venv-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          output="${RUNNER_TEMP}/deform360-posterior-map-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "${venv}" "${output}"
          python3 -m venv "${venv}"
          "${venv}/bin/python" -m pip install --disable-pip-version-check numpy==1.26.4
          mkdir -p -- "${output}"
          {
            echo "PYTHON_BIN=${venv}/bin/python"
            echo "VENV_ROOT=${venv}"
            echo "OUTPUT_ROOT=${output}"
          } >> "${GITHUB_ENV}"

      - name: Validate exact lineage, dataset, and frozen analysis bytes
        shell: bash
        run: |
          set -euo pipefail
          test -d "${DATASET_ROOT}"
          test "$(readlink -f -- "${DATASET_ROOT}")" = "${DATASET_ROOT}"
          test "$(git -C "${CONTROL_ROOT}" rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git -C "${ORIGINAL_V6_ROOT}" rev-parse HEAD)" = "${ORIGINAL_V6_REVISION}"
          test "$(git -C "${RECOVERY_ROOT}" rev-parse HEAD)" = "${RECOVERY_REVISION}"
          test "$(git -C "${PARENT_CONTROL_ROOT}" rev-parse HEAD)" = "${PARENT_CONTROL_REVISION}"
          test "$(git -C "${FROZEN_ROOT}" rev-parse HEAD)" = "${FROZEN_REVISION}"
          test "$(git -C "${RECOVERY_ROOT}" hash-object \
            scripts/science/run_deform360_dependence_query_v6_bound_carrier_recovery_v1.py)" \
            = "${RECOVERY_RUNNER_GIT_BLOB_SHA1}"
          printf '%s  %s\n' "${ORIGINAL_V6_RUNNER_SHA256}" "${ORIGINAL_V6_RUNNER}" \
            | sha256sum --check --strict
          printf '%s  %s\n' "${EVALUATOR_SHA256}" "${EVALUATOR}" \
            | sha256sum --check --strict
          printf '%s  %s\n' "${PROTOCOL_SHA256}" "${PROTOCOL}" \
            | sha256sum --check --strict
          "${PYTHON_BIN}" -m py_compile \
            "${EVALUATOR}" \
            "${ORIGINAL_V6_RUNNER}" \
            "${RECOVERY_RUNNER}" \
            parent-control/scripts/science/run_deform360_untouched_confirmation_v5.py \
            parent-control/scripts/science/audit_deform360_untouched_confirmation_v5.py \
            frozen/scripts/science/run_deform360_action_kernel_v3.py \
            frozen/scripts/science/run_deform360_action_conditioned_tactile_v2.py
          "${PYTHON_BIN}" "${EVALUATOR}" --self-test
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "control_revision=${GITHUB_SHA}"
            echo "original_v6_revision=${ORIGINAL_V6_REVISION}"
            echo "recovery_revision=${RECOVERY_REVISION}"
            echo "parent_control_revision=${PARENT_CONTROL_REVISION}"
            echo "frozen_revision=${FROZEN_REVISION}"
            echo "runner_name=${RUNNER_NAME}"
            echo "dataset_root=${DATASET_ROOT}"
            sha256sum \
              "${EVALUATOR}" \
              "${PROTOCOL}" \
              "${ORIGINAL_V6_RUNNER}" \
              "${RECOVERY_RUNNER}" \
              parent-evidence/result.json \
              parent-evidence/bound-readiness.json \
              parent-evidence.zip
            "${PYTHON_BIN}" --version
            "${PYTHON_BIN}" -c 'import numpy; print("numpy=" + numpy.__version__)'
            uname -a
          } | tee "${OUTPUT_ROOT}/environment.txt"
          cp "${PROTOCOL}" "${OUTPUT_ROOT}/protocol.json"
          cp "${CONTROL_ROOT}/${REQUEST_PATH}" "${OUTPUT_ROOT}/request.json"

      - name: Run frozen 92-object posterior-vs-MAP evaluation
        shell: bash
        run: |
          set -euo pipefail
          "${PYTHON_BIN}" "${EVALUATOR}" \
            --protocol "${PROTOCOL}" \
            --original-v6-runner "${ORIGINAL_V6_RUNNER}" \
            --original-v6-protocol "${ORIGINAL_V6_PROTOCOL}" \
            --recovery-runner "${RECOVERY_RUNNER}" \
            --parent-protocol "${PARENT_PROTOCOL}" \
            --parent-result parent-evidence/result.json \
            --readiness-json parent-evidence/bound-readiness.json \
            --data-root "${DATASET_ROOT}" \
            --parent-control-root "${PARENT_CONTROL_ROOT}" \
            --frozen-root "${FROZEN_ROOT}" \
            --output-json "${OUTPUT_ROOT}/result.json" \
            --output-report "${OUTPUT_ROOT}/report.md" \
            --output-csv "${OUTPUT_ROOT}/object-results.csv" \
            | tee "${OUTPUT_ROOT}/console.log"

      - name: Validate invariant-complete result and seal artifact
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT_ROOT="${OUTPUT_ROOT}" "${PYTHON_BIN}" - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["OUTPUT_ROOT"])
          result = json.loads((root / "result.json").read_text(encoding="utf-8"))
          if result.get("schema") != "bayesian-phystwin/deform360-posterior-vs-map-result-v1":
              raise SystemExit("unexpected result schema")
          if result.get("status") != "complete":
              raise SystemExit("result is incomplete")
          if result["summary"]["object_count"] != 92:
              raise SystemExit("result does not contain all 92 physical objects")
          if result["decision"]["invariants_passed"] is not True:
              raise SystemExit("scientific invariants failed")
          if result["decision"]["paper_claim_authorized"] is not False:
              raise SystemExit("workflow unexpectedly authorized a paper claim")
          boundary = result["information_boundary"]
          required_false = (
              "robot_probe_or_action_selection",
              "camera_pixels_opened",
              "geometry_or_point_cloud_opened",
              "new_measurements_collected",
              "unbound_numeric_payloads_opened",
              "target_outcomes_used_for_tuning_or_arm_selection",
          )
          if any(boundary[name] is not False for name in required_false):
              raise SystemExit("result opened a forbidden information boundary")
          unsigned = dict(result)
          stored = unsigned.pop("result_sha256")
          payload = json.dumps(
              unsigned,
              sort_keys=True,
              separators=(",", ":"),
              allow_nan=False,
          ).encode("utf-8")
          if hashlib.sha256(payload).hexdigest() != stored:
              raise SystemExit("result payload digest is invalid")
          (root / "status.json").write_text(
              json.dumps(
                  {
                      "schema_version": 1,
                      "state": "completed",
                      "classification": result["decision"]["classification"],
                      "invariants_passed": True,
                      "posterior_marginalization_supported": result["decision"]["posterior_marginalization_supported"],
                      "decision_value_supported": result["decision"]["decision_value_supported"],
                      "same_mean_distribution_supported": result["decision"]["same_mean_distribution_supported"],
                      "result_sha256": stored,
                      "object_count": 92,
                      "retrospective": True,
                      "new_measurements_collected": False,
                      "robot_actions_selected": False,
                      "paper_claim_authorized": False,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          lines = []
          for path in sorted(root.iterdir()):
              if path.is_file() and path.name != "sha256sums.txt":
                  lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")
          (root / "sha256sums.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(json.dumps(result["decision"], indent=2, sort_keys=True))
          PY

      - name: Publish scientific summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Deform360 posterior marginalization versus MAP v1"
            echo
            echo "- Runner tag: \`gpuserver4090\`"
            echo "- Dataset: exact parent-bound carriers under \`${DATASET_ROOT}\`"
            echo "- Robot probing/action selection: none"
            if [[ -s "${OUTPUT_ROOT:-}/result.json" ]]; then
              OUTPUT_ROOT="${OUTPUT_ROOT}" /usr/bin/python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path(os.environ["OUTPUT_ROOT"], "result.json").read_text())
          decision = result["decision"]
          summary = result["summary"]
          primary = summary["comparisons"]["map_gaussian"]
          print(f"- Classification: **{decision['classification']}**")
          print(f"- Posterior marginalization supported: **{str(decision['posterior_marginalization_supported']).lower()}**")
          print(f"- Decision value supported: **{str(decision['decision_value_supported']).lower()}**")
          for metric in ("nll", "crps", "brier", "decision_loss"):
              row = primary[metric]
              ci = row["bootstrap_95"]
              print(f"- Mixture − MAP {metric}: `{row['mean_difference']:.6g}` (95% object bootstrap `[{ci[0]:.6g}, {ci[1]:.6g}]`)")
          PY
            else
              echo "- No result payload was produced."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload content-addressed evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: deform360-posterior-vs-map-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deform360-posterior-map-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
