# workflow-lifecycle: permanent
# workflow-owner: IPS-Stuttgart maintainers
name: Deform360 source-residual bootstrap comparator v1

on:
  push:
    branches:
      - science/deform360-bootstrap-comparator-v1
    paths:
      - .github/requests/deform360-bootstrap-comparator-v1.json

permissions:
  actions: read
  contents: read

concurrency:
  group: deform360-bootstrap-comparator-v1
  cancel-in-progress: false

env:
  DATASET_ROOT: /mnt/seagate10tb/florianpfaff/datasets/deform360
  EXPERIMENT_ROOT: experiment-control
  RECOVERY_ROOT: recovery-control
  ORIGINAL_V6_ROOT: original-v6
  PARENT_CONTROL_ROOT: parent-control
  FROZEN_ROOT: frozen
  EXPERIMENT_RUNNER: experiment-control/scripts/science/run_deform360_bootstrap_comparator_v1.py
  EXPERIMENT_PROTOCOL: experiment-control/protocols/deform360_bootstrap_comparator_v1.json
  RECOVERY_RUNNER: recovery-control/scripts/science/run_deform360_dependence_query_v6_bound_carrier_recovery_v1.py
  ORIGINAL_V6_RUNNER: original-v6/scripts/science/run_deform360_dependence_query_v6.py
  PARENT_PROTOCOL: parent-control/protocols/deform360_untouched_confirmation_v5.json
  RECOVERY_REVISION: 0f9312a3cae9f854631d8c61c2893c6527014219
  RECOVERY_RUNNER_GIT_BLOB: 0955ad7ce0c176e7538bd5b91cc36e3444564be5
  ORIGINAL_V6_REVISION: 954538832106d8ded13f1101b3a2b2e855b40513
  ORIGINAL_V6_RUNNER_SHA256: 06c22fc3fe667c4f2f11eddee3dcb1b78b5465b6312136efb010611e1ebab91c
  PARENT_CONTROL_REVISION: e409527b8499a225bde8bd7f8c532a30e96548c6
  FROZEN_REVISION: 25ba91c021124569c4dcf84c66eda5ec088868e0
  PARENT_ARTIFACT_ID: "9738998271"
  PARENT_ARTIFACT_SHA256: e98f9e2687f568d0d0fcabec9ce0393a7e1b34ca3019acb1e14fdf894885a948
  PARENT_RESULT_SHA256: 0ad16b15c94d81b8c14221a271eb1f647d689a530284570becdfeca87e0d8ec7
  PARENT_READINESS_SHA256: 58841144ae5105080ecb991cc73e9021214fc8676f9e55948ef3511fb12a2f8e
  REFERENCE_ARTIFACT_ID: "9811194776"
  REFERENCE_ARTIFACT_SHA256: 8b3bad2bc0620228ebe32027028b1666ea7772a1850f0ab45d525e30e4ced82a
  REFERENCE_RESULT_SHA256: c73659af65c2b87923f7bd668f9717afab03e449a5b3abd3a5b597ec60898fd1
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install focused contract dependencies
        run: python -m pip install numpy==1.26.4 pytest ruff==0.14.14
      - name: Validate comparator contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool protocols/deform360_bootstrap_comparator_v1.json >/dev/null
          python -m py_compile \
            scripts/science/run_deform360_bootstrap_comparator_v1.py
          python scripts/science/run_deform360_bootstrap_comparator_v1.py --self-test
          python -m pytest -q tests/test_deform360_bootstrap_comparator_v1.py
          python -m ruff check \
            scripts/science/run_deform360_bootstrap_comparator_v1.py \
            tests/test_deform360_bootstrap_comparator_v1.py
          python - <<'PY'
          import json
          from pathlib import Path

          extension = json.loads(
              Path("protocols/deform360_bootstrap_comparator_v1.json").read_text()
          )
          original = json.loads(
              Path("protocols/deform360_dependence_query_v6.json").read_text()
          )
          expected = extension["reference_evaluation"]
          actual = original["evaluation"]
          for key, value in expected.items():
              if actual.get(key) != value:
                  raise SystemExit(
                      f"reference evaluation mismatch for {key}: "
                      f"{actual.get(key)!r} != {value!r}"
                  )
          PY

  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      request_path: ${{ steps.request.outputs.request_path }}
      control_revision: ${{ steps.request.outputs.control_revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: request
        name: Authorize one add-only bootstrap-comparator request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = refs/heads/science/deform360-bootstrap-comparator-v1
          test "${PUSH_FORCED}" = false
          test "${BEFORE_SHA}" != 0000000000000000000000000000000000000000
          mapfile -t changed < <(git diff --name-status "${BEFORE_SHA}" "${GITHUB_SHA}")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = \
            $'A\t.github/requests/deform360-bootstrap-comparator-v1.json'
          REQUEST=.github/requests/deform360-bootstrap-comparator-v1.json
          REQUEST_PATH="${REQUEST}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(Path(os.environ["REQUEST_PATH"]).read_text())
          expected = {
              "schema": "bayesian-phystwin/deform360-bootstrap-comparator-request-v1",
              "request_id": "deform360-bootstrap-comparator-20260903",
              "reference_workflow_run_id": 33528032875,
              "reference_artifact_id": 9811194776,
              "runner_labels": ["self-hosted", "Linux", "X64", "gpuserver4090"],
              "dataset_root": "/mnt/seagate10tb/florianpfaff/datasets/deform360",
              "comparator": "episode-balanced-source-residual-bootstrap",
              "same_target_mean": True,
              "same_query_variance": True,
              "retrospective_target_reuse": True,
              "unbound_numeric_payloads_may_open": False,
              "new_measurements_collected": False,
              "scientific_result_must_not_control_job_success": True,
              "paper_claim_authorized": False,
          }
          if value != expected:
              raise SystemExit("request differs from the frozen authorization")
          PY
          control_revision="$(git rev-parse HEAD^)"
          {
            echo "request_path=${REQUEST}"
            echo "control_revision=${control_revision}"
          } >> "${GITHUB_OUTPUT}"

  evaluate:
    needs: [contracts, authorize]
    if: >-
      always() && needs.contracts.result == 'success' &&
      needs.authorize.result == 'success'
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 240
    env:
      REQUEST_PATH: ${{ needs.authorize.outputs.request_path }}
      CONTROL_REVISION: ${{ needs.authorize.outputs.control_revision }}
    steps:
      - name: Check out exact comparator control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CONTROL_REVISION }}
          path: experiment-control
          persist-credentials: false
          clean: true

      - name: Check out exact bound-carrier recovery
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0f9312a3cae9f854631d8c61c2893c6527014219
          path: recovery-control
          persist-credentials: false
          clean: true

      - name: Check out exact original dependence analysis
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 954538832106d8ded13f1101b3a2b2e855b40513
          path: original-v6
          persist-credentials: false
          clean: true

      - name: Check out exact parent confirmation control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: e409527b8499a225bde8bd7f8c532a30e96548c6
          path: parent-control
          persist-credentials: false
          clean: true

      - name: Check out exact frozen point method
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 25ba91c021124569c4dcf84c66eda5ec088868e0
          path: frozen
          persist-credentials: false
          clean: true

      - name: Recover bound parent and reference evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf parent-evidence reference-evidence parent.zip reference.zip
          mkdir -p parent-evidence reference-evidence
          curl --fail --location --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PARENT_ARTIFACT_ID}/zip" \
            --output parent.zip
          curl --fail --location --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${REFERENCE_ARTIFACT_ID}/zip" \
            --output reference.zip
          printf '%s  %s\n' "${PARENT_ARTIFACT_SHA256}" parent.zip \
            | sha256sum --check --strict
          printf '%s  %s\n' "${REFERENCE_ARTIFACT_SHA256}" reference.zip \
            | sha256sum --check --strict
          unzip -q parent.zip -d parent-evidence
          unzip -q reference.zip -d reference-evidence
          test -s parent-evidence/result.json
          test -s parent-evidence/bound-readiness.json
          test -s reference-evidence/result.json
          printf '%s  %s\n' "${PARENT_RESULT_SHA256}" parent-evidence/result.json \
            | sha256sum --check --strict
          printf '%s  %s\n' "${PARENT_READINESS_SHA256}" \
            parent-evidence/bound-readiness.json | sha256sum --check --strict
          REFERENCE_RESULT_SHA256="${REFERENCE_RESULT_SHA256}" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          result = json.loads(Path("reference-evidence/result.json").read_text())
          supplied = result.pop("result_sha256")
          encoded = json.dumps(
              result,
              sort_keys=True,
              separators=(",", ":"),
              allow_nan=False,
          ).encode()
          if hashlib.sha256(encoded).hexdigest() != supplied:
              raise SystemExit("reference result digest is invalid")
          if supplied != os.environ["REFERENCE_RESULT_SHA256"]:
              raise SystemExit("reference result identity changed")
          PY

      - name: Prepare isolated numerical runtime
        shell: bash
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP}/deform360-bootstrap-v1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          output="${RUNNER_TEMP}/deform360-bootstrap-result-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "${venv}" "${output}"
          python3 -m venv "${venv}"
          "${venv}/bin/python" -m pip install --disable-pip-version-check numpy==1.26.4
          mkdir -p -- "${output}"
          {
            echo "PYTHON_BIN=${venv}/bin/python"
            echo "VENV_ROOT=${venv}"
            echo "OUTPUT_ROOT=${output}"
          } >> "${GITHUB_ENV}"

      - name: Validate exact lineage and mounted data
        shell: bash
        run: |
          set -euo pipefail
          test -d "${DATASET_ROOT}"
          test "$(readlink -f -- "${DATASET_ROOT}")" = "${DATASET_ROOT}"
          test "$(git -C "${EXPERIMENT_ROOT}" rev-parse HEAD)" = "${CONTROL_REVISION}"
          test "$(git -C "${RECOVERY_ROOT}" rev-parse HEAD)" = "${RECOVERY_REVISION}"
          test "$(git -C "${ORIGINAL_V6_ROOT}" rev-parse HEAD)" = "${ORIGINAL_V6_REVISION}"
          test "$(git -C "${PARENT_CONTROL_ROOT}" rev-parse HEAD)" = "${PARENT_CONTROL_REVISION}"
          test "$(git -C "${FROZEN_ROOT}" rev-parse HEAD)" = "${FROZEN_REVISION}"
          test "$(git -C "${RECOVERY_ROOT}" hash-object scripts/science/run_deform360_dependence_query_v6_bound_carrier_recovery_v1.py)" = \
            "${RECOVERY_RUNNER_GIT_BLOB}"
          printf '%s  %s\n' "${ORIGINAL_V6_RUNNER_SHA256}" "${ORIGINAL_V6_RUNNER}" \
            | sha256sum --check --strict
          "${PYTHON_BIN}" -m py_compile \
            "${EXPERIMENT_RUNNER}" \
            "${RECOVERY_RUNNER}" \
            "${ORIGINAL_V6_RUNNER}"
          "${PYTHON_BIN}" "${EXPERIMENT_RUNNER}" --self-test
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "trigger_revision=${GITHUB_SHA}"
            echo "control_revision=${CONTROL_REVISION}"
            echo "recovery_revision=${RECOVERY_REVISION}"
            echo "original_v6_revision=${ORIGINAL_V6_REVISION}"
            echo "parent_control_revision=${PARENT_CONTROL_REVISION}"
            echo "frozen_revision=${FROZEN_REVISION}"
            echo "runner_name=${RUNNER_NAME}"
            echo "dataset_root=${DATASET_ROOT}"
            sha256sum \
              "${EXPERIMENT_RUNNER}" \
              "${EXPERIMENT_PROTOCOL}" \
              "${RECOVERY_RUNNER}" \
              "${ORIGINAL_V6_RUNNER}" \
              parent-evidence/result.json \
              parent-evidence/bound-readiness.json \
              reference-evidence/result.json \
              parent.zip \
              reference.zip
            "${PYTHON_BIN}" --version
            "${PYTHON_BIN}" -c 'import numpy; print("numpy=" + numpy.__version__)'
            uname -a
          } | tee "${OUTPUT_ROOT}/environment.txt"
          cp "${EXPERIMENT_PROTOCOL}" "${OUTPUT_ROOT}/protocol.json"

      - name: Run matched source-residual bootstrap comparison
        shell: bash
        run: |
          set -euo pipefail
          "${PYTHON_BIN}" "${EXPERIMENT_RUNNER}" \
            --protocol "${EXPERIMENT_PROTOCOL}" \
            --recovery-runner "${RECOVERY_RUNNER}" \
            --base-runner "${ORIGINAL_V6_RUNNER}" \
            --parent-protocol "${PARENT_PROTOCOL}" \
            --parent-result parent-evidence/result.json \
            --readiness-json parent-evidence/bound-readiness.json \
            --reference-result reference-evidence/result.json \
            --data-root "${DATASET_ROOT}" \
            --parent-control-root "${PARENT_CONTROL_ROOT}" \
            --frozen-root "${FROZEN_ROOT}" \
            --output-json "${OUTPUT_ROOT}/result.json" \
            --output-report "${OUTPUT_ROOT}/report.md" \
            --output-csv "${OUTPUT_ROOT}/object-results.csv" \
            | tee "${OUTPUT_ROOT}/console.log"
          cat "${OUTPUT_ROOT}/report.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Enforce complete comparison evidence
        shell: bash
        run: |
          set -euo pipefail
          "${PYTHON_BIN}" - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["OUTPUT_ROOT"])
          result = json.loads((root / "result.json").read_text())
          if result["status"] != "complete":
              raise SystemExit("comparison result is incomplete")
          if result["summary"]["object_count"] != 92:
              raise SystemExit("complete 92-object roster was not evaluated")
          if result["integrity"]["exact_scientific_reproduction"] is not True:
              raise SystemExit("reference dependence result did not reproduce")
          if result["decision"]["all_integrity_gates_passed"] is not True:
              raise SystemExit("one or more integrity gates failed")
          boundary = result["information_boundary"]
          for key in (
              "exact_bound_carrier_roster_reused",
              "exact_frozen_point_predictor_reused",
              "exact_original_three_arm_result_reproduced",
              "bootstrap_source_residuals_only",
              "bootstrap_episode_balanced",
              "same_target_mean",
              "same_query_variance",
          ):
              if boundary[key] is not True:
                  raise SystemExit(f"required boundary failed: {key}")
          for key in (
              "target_outcomes_used_for_comparator_construction",
              "unbound_numeric_payloads_opened",
              "new_measurements_collected",
          ):
              if boundary[key] is not False:
                  raise SystemExit(f"forbidden information flow: {key}")
          for key in (
              "paper_claim_authorized",
              "fresh_confirmation_authorized",
              "deployment_claim_authorized",
          ):
              if result["decision"][key] is not False:
                  raise SystemExit(f"result self-authorized forbidden claim: {key}")
          unsigned = dict(result)
          supplied = unsigned.pop("result_sha256")
          encoded = json.dumps(
              unsigned,
              sort_keys=True,
              separators=(",", ":"),
              allow_nan=False,
          ).encode()
          if hashlib.sha256(encoded).hexdigest() != supplied:
              raise SystemExit("result digest is invalid")
          PY
          sha256sum "${OUTPUT_ROOT}"/* > "${OUTPUT_ROOT}/sha256sums.txt"
          for root in experiment-control recovery-control original-v6 parent-control frozen; do
            git -C "${root}" diff --exit-code
            test -z "$(git -C "${root}" status --porcelain --untracked-files=all)"
          done

      - name: Upload bootstrap-comparator evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: deform360-bootstrap-comparator-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_ROOT }}
          if-no-files-found: warn
          retention-days: 90

      - name: Remove isolated runtime
        if: always()
        shell: bash
        run: rm -rf -- "${VENV_ROOT:-}"
