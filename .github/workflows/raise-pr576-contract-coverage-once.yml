          report = json.loads(Path("/tmp/pr576-coverage.json").read_text())
          suffix = "deform360_registered_residual_history_v1.py"
          matches = [value for key, value in report["files"].items() if key.endswith(suffix)]
          if len(matches) != 1:
              raise SystemExit(f"expected one module coverage record, found {len(matches)}")
          summary = matches[0]["summary"]
          line_rate = 100.0 * summary["covered_lines"] / summary["num_statements"]
          branch_rate = 100.0 * summary["covered_branches"] / summary["num_branches"]
          print(f"module line coverage: {line_rate:.2f}%")
          print(f"module branch coverage: {branch_rate:.2f}%")
          if line_rate < 90.0 or branch_rate < 80.0:
              raise SystemExit("focused module coverage remains below repository floors")
          PY
          git diff --check

      - name: Commit permanent tests and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/raise-pr576-contract-coverage-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Cover registered residual-history admission boundaries'
          git push origin HEAD:agent/registered-residual-history-single-path-v1
