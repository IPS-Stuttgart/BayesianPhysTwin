            {
                "fallback_reasons": (
                    "insufficient-per-track-support",
                    "insufficient-per-track-support",
                )
            },
            "sorted and unique",
        ),
        ({"fallback_reasons": ("unsupported",)}, "unsupported reason"),
        (
            {"valid_observation_count_by_track": (1, 2, 2, 2)},
