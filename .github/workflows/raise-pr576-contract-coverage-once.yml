            replace(decision, **changes, decision_id=None)


def test_accepted_and_fallback_decision_invariants_fail_closed() -> None:
    accepted = _run(_arrays()).decision
    with pytest.raises(ValueError, match="cannot contain fallback reasons"):
        replace(
            accepted,
            valid_observation_count_by_track=(1, 2, 2, 2),
            fallback_reasons=("insufficient-per-track-support",),
            decision_id=None,
        )
    with pytest.raises(ValueError, match="lacks endpoint donor lineage"):
        replace(accepted, endpoint_config_id=None, decision_id=None)
    with pytest.raises(ValueError, match="did not deploy reference covariance"):
        replace(
            accepted,
            reference_covariance_identity_preserved=True,
            decision_id=None,
        )

    unsupported_arrays = _arrays()
    unsupported_arrays["validity"][2, 3] = False
    unsupported_arrays["observation"][2, 3] = np.nan
    unsupported_arrays["registered_mean"] = _registered_mean(unsupported_arrays)
    fallback = _run(unsupported_arrays).decision
    with pytest.raises(ValueError, match="require at least one reason"):
        replace(
            accepted,
            accepted=False,
            fallback_reasons=(),
            endpoint_config_id=None,
            endpoint_posterior_id=None,
            endpoint_prediction_ids=(),
            donor_covariance_sha256=None,
            hybrid_artifact_id=None,
            output_covariance_sha256=accepted.reference_covariance_sha256,
            reference_covariance_identity_preserved=True,
            decision_id=None,
        )
    with pytest.raises(ValueError, match="must not retain donor execution"):
        replace(fallback, endpoint_config_id="a" * 64, decision_id=None)
    with pytest.raises(ValueError, match="preserve reference covariance identity"):
        replace(
            fallback,
            reference_covariance_identity_preserved=False,
            decision_id=None,
        )
    with pytest.raises(ValueError, match="differs from the reference"):
        replace(fallback, output_covariance_sha256="f" * 64, decision_id=None)


def test_prediction_wrapper_guards_fail_closed() -> None:
    accepted = _run(_arrays())
    assert accepted.hybrid is not None
    with pytest.raises(TypeError, match="provenance must be"):
        RegisteredResidualHistoryPredictionV1(
            mean_m=accepted.mean_m,
            covariance_m2=accepted.covariance_m2,
            provenance=object(),
            decision=accepted.decision,
            hybrid=accepted.hybrid,
        )
    with pytest.raises(TypeError, match="decision must be"):
        RegisteredResidualHistoryPredictionV1(
            mean_m=accepted.mean_m,
            covariance_m2=accepted.covariance_m2,
            provenance=accepted.provenance,
            decision=object(),
            hybrid=accepted.hybrid,
        )
    other_provenance = replace(
        accepted.provenance,
        source_inventory_id="f" * 64,
        provenance_id=None,
    )
    with pytest.raises(ValueError, match="source provenance differ"):
        RegisteredResidualHistoryPredictionV1(
            mean_m=accepted.mean_m,
            covariance_m2=accepted.covariance_m2,
            provenance=other_provenance,
            decision=accepted.decision,
            hybrid=accepted.hybrid,
        )
    with pytest.raises(ValueError, match="mean shape"):
        replace(accepted, mean_m=accepted.mean_m[:-1])
    with pytest.raises(ValueError, match="covariance shape"):
        replace(accepted, covariance_m2=accepted.covariance_m2[:-1])
    changed_mean = np.array(accepted.mean_m, copy=True)
    changed_mean[0, 0, 0] += 1e-9
    with pytest.raises(ValueError, match="mean content"):
        replace(accepted, mean_m=changed_mean)
    changed_covariance = np.array(accepted.covariance_m2, copy=True)
    changed_covariance[0, 0, 0, 0] += 1e-9
    with pytest.raises(ValueError, match="covariance content"):
        replace(accepted, covariance_m2=changed_covariance)
    with pytest.raises(ValueError, match="missing the covariance hybrid"):
        replace(accepted, hybrid=None)
    other = _run(_arrays())
    assert other.hybrid is not None
    with pytest.raises(ValueError, match="retain hybrid objects"):
        replace(accepted, hybrid=other.hybrid)

    unsupported_arrays = _arrays()
    unsupported_arrays["validity"][2, 3] = False
    unsupported_arrays["observation"][2, 3] = np.nan
    unsupported_arrays["registered_mean"] = _registered_mean(unsupported_arrays)
    fallback = _run(unsupported_arrays)
    with pytest.raises(ValueError, match="must not retain a covariance hybrid"):
        replace(fallback, hybrid=accepted.hybrid)


def test_execution_array_types_shapes_and_finiteness_fail_closed() -> None:
    arrays = _arrays()
    with pytest.raises(TypeError, match="physical_prefix_m must be a NumPy array"):
        _validate_arrays(arrays, physical_prefix_m=[])
    with pytest.raises(ValueError, match="prefix arrays"):
        _validate_arrays(
            arrays,
            physical_prefix_m=arrays["physical_prefix"][:-1],
        )
    with pytest.raises(ValueError, match="prefix arrays"):
        _validate_arrays(
            arrays,
            observed_validity=arrays["validity"][:-1],
        )
    with pytest.raises(ValueError, match="prefix arrays"):
        _validate_arrays(
            arrays,
            physical_prefix_m=np.zeros((3, 4, 2), dtype=np.float64),
            provider_observation_prefix_m=np.zeros((3, 4, 2), dtype=np.float64),
        )
    with pytest.raises(ValueError, match="prefix arrays"):
        _validate_arrays(
            arrays,
            physical_prefix_m=np.zeros((0, 4, 3), dtype=np.float64),
            provider_observation_prefix_m=np.zeros((0, 4, 3), dtype=np.float64),
            observed_validity=np.zeros((0, 4), dtype=bool),
        )
    with pytest.raises(ValueError, match="physical_future_m"):
        _validate_arrays(
            arrays,
            physical_future_m=arrays["physical_future"][:2],
            registered_last_residual_mean_m=arrays["registered_mean"][:2],
            reference_covariance_m2=arrays["reference_covariance"][:2],
        )
    with pytest.raises(ValueError, match="track rosters differ"):
        _validate_arrays(
            arrays,
            physical_future_m=arrays["physical_future"][:, :3],
            registered_last_residual_mean_m=arrays["registered_mean"][:, :3],
            reference_covariance_m2=arrays["reference_covariance"][:, :3],
        )
    with pytest.raises(ValueError, match="registered_last_residual_mean_m shape"):
        _validate_arrays(
            arrays,
            registered_last_residual_mean_m=arrays["registered_mean"][:, :3],
        )
    with pytest.raises(ValueError, match="reference_covariance_m2 shape"):
        _validate_arrays(
            arrays,
            reference_covariance_m2=arrays["reference_covariance"][:, :3],
        )

    for field, match in (
        ("physical_prefix", "physical_prefix_m must be finite"),
        ("physical_future", "physical_future_m must be finite"),
        ("registered_mean", "registered_last_residual_mean_m must be finite"),
        ("reference_covariance", "reference_covariance_m2 must be finite"),
    ):
        changed = np.array(arrays[field], copy=True)
        changed.flat[0] = np.nan
        keyword = {
            "physical_prefix": "physical_prefix_m",
            "physical_future": "physical_future_m",
            "registered_mean": "registered_last_residual_mean_m",
            "reference_covariance": "reference_covariance_m2",
        }[field]
        with pytest.raises(ValueError, match=match):
            _validate_arrays(arrays, **{keyword: changed})

    observation = np.array(arrays["observation"], copy=True)
    observation[0, 0] = np.nan
    with pytest.raises(ValueError, match="valid provider observations"):
        _validate_arrays(arrays, provider_observation_prefix_m=observation)

    all_valid = np.ones_like(arrays["validity"])
    finite_observation = np.array(arrays["physical_prefix"], copy=True) + 0.01
    validated = _validate_arrays(
        arrays,
        provider_observation_prefix_m=finite_observation,
        observed_validity=all_valid,
    )
    assert validated[2] is all_valid


def test_reconstructed_mean_handles_a_track_without_support() -> None:
    residual = np.zeros((2, 2, 3), dtype=np.float64)
    residual[:, 0, 0] = (0.1, 0.2)
    validity = np.asarray([[True, False], [True, False]], dtype=bool)
    mean = residual_module._reconstructed_reference_mean(
        np.zeros((3, 2, 3), dtype=np.float64),
        residual,
        validity,
    )
    np.testing.assert_array_equal(mean[:, 0, 0], np.full(3, 0.2))
    np.testing.assert_array_equal(mean[:, 1], np.zeros((3, 3)))


def test_fallback_object_identity_assertions_are_live(
    monkeypatch: pytest.MonkeyPatch,
) -> None:
    arrays = _arrays()
    arrays["validity"][2, 3] = False
    arrays["observation"][2, 3] = np.nan
    arrays["registered_mean"] = _registered_mean(arrays)

    def copied_mean(**kwargs: object) -> SimpleNamespace:
        return SimpleNamespace(
            mean_m=np.array(kwargs["mean_m"], copy=True),
            covariance_m2=kwargs["covariance_m2"],
        )

    monkeypatch.setattr(
        residual_module,
        "RegisteredResidualHistoryPredictionV1",
        copied_mean,
    )
    with pytest.raises(AssertionError, match="copied the registered mean"):
        _run(arrays)

    def copied_covariance(**kwargs: object) -> SimpleNamespace:
        return SimpleNamespace(
            mean_m=kwargs["mean_m"],
            covariance_m2=np.array(kwargs["covariance_m2"], copy=True),
        )

    monkeypatch.setattr(
        residual_module,
        "RegisteredResidualHistoryPredictionV1",
        copied_covariance,
    )
    with pytest.raises(AssertionError, match="copied the reference covariance"):
        _run(arrays)


def test_runtime_top_level_and_internal_assertions_fail_closed(
    monkeypatch: pytest.MonkeyPatch,
) -> None:
    arrays = _arrays()
    with pytest.raises(ValueError, match="source_unit_id"):
        run_registered_residual_history_v1(
            arrays["physical_prefix"],
            arrays["observation"],
            arrays["validity"],
            arrays["physical_future"],
            arrays["registered_mean"],
            arrays["reference_covariance"],
            source_unit_id="",
            provenance=_provenance(),
        )
    with pytest.raises(TypeError, match="provenance must be"):
        run_registered_residual_history_v1(
            arrays["physical_prefix"],
            arrays["observation"],
            arrays["validity"],
            arrays["physical_future"],
            arrays["registered_mean"],
            arrays["reference_covariance"],
            source_unit_id="opened-source-object-session-001",
            provenance=object(),
        )

    original_infer = residual_module.infer_model_averaged_endpoint

    def changed_update_count(*args: object, **kwargs: object) -> object:
        posterior = original_infer(*args, **kwargs)
        object.__setattr__(
            posterior,
            "update_count",
            posterior.update_count + np.ones_like(posterior.update_count),
        )
        return posterior

    monkeypatch.setattr(
        residual_module,
        "infer_model_averaged_endpoint",
        changed_update_count,
    )
    with pytest.raises(AssertionError, match="different causal observations"):
        _run(arrays)
    monkeypatch.setattr(
        residual_module,
        "infer_model_averaged_endpoint",
        original_infer,
    )

    original_compose = residual_module.compose_covariance_only_hybrid

    def copied_hybrid_mean(*args: object, **kwargs: object) -> SimpleNamespace:
        hybrid = original_compose(*args, **kwargs)
        return SimpleNamespace(
            mean_m=np.array(hybrid.mean_m, copy=True),
            covariance_m2=hybrid.covariance_m2,
            record=hybrid.record,
        )

    monkeypatch.setattr(
        residual_module,
        "compose_covariance_only_hybrid",
        copied_hybrid_mean,
    )
    with pytest.raises(AssertionError, match="copied the reference mean"):
        _run(arrays)


def test_combined_fallback_reasons_are_sorted_and_metadata_is_retained() -> None:
    arrays = _arrays()
    arrays["validity"][2, 3] = False
    arrays["observation"][2, 3] = np.nan
    arrays["registered_mean"] = _registered_mean(arrays)
    arrays["registered_mean"][0, 0, 0] += 0.001
    result = _run(arrays, metadata={"negative_evidence": True})
    assert result.decision.fallback_reasons == (
        "insufficient-per-track-support",
        "registered-mean-mismatch",
    )
    assert result.decision.metadata["negative_evidence"] is True
