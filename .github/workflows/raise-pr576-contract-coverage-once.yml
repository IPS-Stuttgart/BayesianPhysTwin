name: Raise PR 576 residual-history contract coverage once

on:
  push:
    branches:
      - agent/registered-residual-history-single-path-v1

permissions:
  contents: write

concurrency:
  group: raise-pr576-contract-coverage-once
  cancel-in-progress: false

jobs:
  coverage:
    if: github.repository == 'IPS-Stuttgart/BayesianPhysTwin'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/registered-residual-history-single-path-v1
          fetch-depth: 1
          persist-credentials: true

      - name: Add focused fail-closed coverage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/bayesian_phystwin/deform360_registered_residual_history_v1.py)" = \
            05ce415c9a6f1b6f853621955cd7185a0acdc651
          test "$(git hash-object tests/test_portable_contracts_deform360_registered_residual_history_v1.py)" = \
            4f4ce81e1212dfb439e622f6b5f6f40996e21088
          python - <<'PY'
          from pathlib import Path

          source = Path(
              "src/bayesian_phystwin/deform360_registered_residual_history_v1.py"
          )
          text = source.read_text(encoding="utf-8")
          dead_horizon_guard = '''    for label_index, chunk in enumerate(np.array_split(indices, 3)):
              if not len(chunk):
                  raise AssertionError("canonical horizon partition contains an empty bin")
              bins[chunk] = label_index
          '''
          direct_horizon_assignment = '''    for label_index, chunk in enumerate(np.array_split(indices, 3)):
              bins[chunk] = label_index
          '''
          if text.count(dead_horizon_guard) != 1:
              raise SystemExit("canonical horizon guard changed")
          text = text.replace(dead_horizon_guard, direct_horizon_assignment)
          redundant_admission = '''            if insufficient or mean_mismatch:
                  raise ValueError("accepted decision violates registered admission")
          '''
          if text.count(redundant_admission) != 1:
              raise SystemExit("redundant accepted-admission guard changed")
          text = text.replace(redundant_admission, "")
          source.write_text(text, encoding="utf-8")

          test = Path(
              "tests/test_portable_contracts_deform360_registered_residual_history_v1.py"
          )
          text = test.read_text(encoding="utf-8")
          old_imports = '''import inspect
          from dataclasses import replace

          import numpy as np
          import pytest

          from bayesian_phystwin.deform360_registered_residual_history_v1 import (
          '''
          new_imports = '''import inspect
          from collections.abc import Callable
          from dataclasses import replace
          from types import SimpleNamespace

          import numpy as np
          import pytest

          import bayesian_phystwin.deform360_registered_residual_history_v1 as residual_module
          from bayesian_phystwin.deform360_registered_residual_history_v1 import (
          '''
          if text.count(old_imports) != 1:
              raise SystemExit("test import block changed")
          text = text.replace(old_imports, new_imports)
          public_anchor = '''    REGISTERED_REFERENCE_PREDICTOR_ID,
              RegisteredResidualHistoryPredictionV1,
          '''
          public_replacement = '''    REGISTERED_REFERENCE_PREDICTOR_ID,
              RegisteredResidualHistoryDecisionV1,
              RegisteredResidualHistoryPredictionV1,
          '''
          if text.count(public_anchor) != 1:
              raise SystemExit("decision import anchor changed")
          text = text.replace(public_anchor, public_replacement)
          marker = "\n\ndef test_private_scalar_and_tuple_helpers_fail_closed() -> None:\n"
          if marker in text:
              raise SystemExit("focused coverage tests already present")
          text += r'''


def _validate_arrays(
    arrays: dict[str, np.ndarray],
    **overrides: object,
) -> tuple[np.ndarray, np.ndarray, np.ndarray, np.ndarray, np.ndarray, np.ndarray]:
    return residual_module._validate_execution_arrays(
        overrides.get("physical_prefix_m", arrays["physical_prefix"]),
        overrides.get("provider_observation_prefix_m", arrays["observation"]),
        overrides.get("observed_validity", arrays["validity"]),
        overrides.get("physical_future_m", arrays["physical_future"]),
        overrides.get("registered_last_residual_mean_m", arrays["registered_mean"]),
        overrides.get("reference_covariance_m2", arrays["reference_covariance"]),
    )


def test_private_scalar_and_tuple_helpers_fail_closed() -> None:
    for value in (None, "", " padded "):
        with pytest.raises(ValueError, match="nonempty canonical string"):
            residual_module._canonical_string(value, name="value")
    with pytest.raises(ValueError, match="single canonical line"):
        residual_module._canonical_string("two\nlines", name="value")

    cases: tuple[tuple[Callable[..., object], object, str], ...] = (
        (residual_module._canonical_string_tuple, ["a"], "canonical tuple"),
        (residual_module._canonical_string_tuple, (), "nonempty"),
        (residual_module._canonical_string_tuple, ("b", "a"), "sorted and unique"),
        (residual_module._canonical_string_tuple, ("a", "a"), "sorted and unique"),
        (residual_module._digest_tuple, ["a" * 64], "canonical tuple"),
        (residual_module._digest_tuple, (), "nonempty"),
        (
            residual_module._digest_tuple,
            ("b" * 64, "a" * 64),
            "sorted and unique",
        ),
        (
            residual_module._digest_tuple,
            ("a" * 64, "a" * 64),
            "sorted and unique",
        ),
    )
    for helper, value, match in cases:
        with pytest.raises(ValueError, match=match):
            helper(value, name="value")


def test_private_array_validators_fail_closed() -> None:
    with pytest.raises(TypeError, match="must be a NumPy array$"):
        residual_module._float64_array([], name="value", ndim=1)
    with pytest.raises(TypeError, match="preserve identity"):
        residual_module._float64_array(
            [],
            name="value",
            ndim=1,
            preserve_identity=True,
        )
    with pytest.raises(ValueError, match="dtype float64"):
        residual_module._float64_array(
            np.zeros(2, dtype=np.float32),
            name="value",
            ndim=1,
        )
    with pytest.raises(ValueError, match="3 dimensions"):
        residual_module._float64_array(
            np.zeros((2, 2), dtype=np.float64),
            name="value",
            ndim=3,
        )
    with pytest.raises(ValueError, match="C-contiguous"):
        residual_module._float64_array(
            np.zeros((2, 3, 4), dtype=np.float64).transpose(1, 0, 2),
            name="value",
            ndim=3,
        )

    with pytest.raises(TypeError, match="NumPy array"):
        residual_module._boolean_array([], name="value", ndim=2)
    with pytest.raises(ValueError, match="Boolean dtype"):
        residual_module._boolean_array(
            np.zeros((2, 2), dtype=np.int64),
            name="value",
            ndim=2,
        )
    with pytest.raises(ValueError, match="2 dimensions"):
        residual_module._boolean_array(
            np.zeros(2, dtype=bool),
            name="value",
            ndim=2,
        )
    with pytest.raises(ValueError, match="C-contiguous"):
        residual_module._boolean_array(
            np.zeros((2, 3), dtype=bool).T,
            name="value",
            ndim=2,
        )


def test_private_horizon_and_config_guards_fail_closed() -> None:
    for value in (True, 2):
        with pytest.raises(ValueError, match="at least three future frames"):
            residual_module._canonical_horizon_bins(value)
    with pytest.raises(TypeError, match="ModelAveragedEndpointConfigV1"):
        residual_module._endpoint_config_descriptor(object())


def test_provenance_tuple_and_reconstruction_guards_fail_closed() -> None:
    provenance = _provenance()
    cases: tuple[tuple[dict[str, object], str], ...] = (
        (
            {"scoring_reconstruction_id": provenance.provider_reconstruction_id},
            "reconstructions must differ",
        ),
        ({"provider_camera_family_ids": ["family"]}, "canonical tuple"),
        ({"provider_camera_family_ids": ()}, "nonempty"),
        (
            {"provider_camera_family_ids": ("recorder-family-02", "recorder-family-00")},
            "sorted and unique",
        ),
        ({"provider_input_artifact_ids": ["1" * 64]}, "canonical tuple"),
        ({"provider_input_artifact_ids": ()}, "nonempty"),
        (
            {"provider_input_artifact_ids": ("3" * 64, "1" * 64)},
            "sorted and unique",
        ),
    )
    for changes, match in cases:
        with pytest.raises(ValueError, match=match):
            replace(provenance, **changes, provenance_id=None)


