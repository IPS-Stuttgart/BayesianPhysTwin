name: Repair Deform360 prepared inventory validation once

on:
  push:
    branches:
      - fix/deform360-v6-prepared-inventory-identity
    paths:
      - .github/workflows/repair-deform360-prepared-inventory-validation-once.yml

permissions:
  contents: write

concurrency:
  group: repair-deform360-prepared-inventory-validation-once
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/deform360-v6-prepared-inventory-identity
          fetch-depth: 1
          persist-credentials: true
          clean: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Scope validation to the prepared-inventory command
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/ci/run_deform360_v6_source_prediction_evidence.sh")
          text = path.read_text(encoding="utf-8")
          block_start = text.index(
              'export SCIENCE_RUNNER\n"${BPT_PYTHON}" - <<\'PY\'\n'
          )
          block_end = text.index("\nPY\n\nPHYSICAL_UPSTREAM_ROOT=", block_start)
          block = text[block_start:block_end]
          import_old = "import json\nimport os\nfrom pathlib import Path\n"
          import_new = "import json\nimport os\nimport re\nfrom pathlib import Path\n"
          if block.count(import_old) != 1:
              raise SystemExit("prepared-inventory validation import block changed")
          block = block.replace(import_old, import_new, 1)

          validation_old = '''runner = Path(os.environ["SCIENCE_RUNNER"]).read_text(encoding="utf-8")
          needle = '--implementation-revision "${BPT_SOURCE_SHA}"'
          if runner.count(needle) != 1:
              raise SystemExit("archived prepared-inventory implementation binding changed")
          '''
          validation_new = '''runner = Path(os.environ["SCIENCE_RUNNER"]).read_text(encoding="utf-8")
          inventory_pattern = re.compile(
              r"scripts/science/inventory_deform360_calibration_prepared_source\\.py"
              r"[\\s\\S]*?--implementation-revision \\"\\$\\{BPT_SOURCE_SHA\\}\\""
              r"[\\s\\S]*?--output \\"\\$\\{RUN_ROOT\\}/prepared-source-inventory\\.json\\""
          )
          if len(inventory_pattern.findall(runner)) != 1:
              raise SystemExit("archived prepared-inventory command binding changed")
          '''
          if block.count(validation_old) != 1:
              raise SystemExit("prepared-inventory generic validation changed")
          block = block.replace(validation_old, validation_new, 1)
          text = text[:block_start] + block + text[block_end:]
          path.write_text(text, encoding="utf-8")
          PY

          cat > tests/test_deform360_v6_prepared_inventory_binding.py <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          RUNNER = ROOT / "scripts/ci/run_deform360_v6_source_prediction_evidence.sh"
          SCIENCE_RUNNER = ROOT / (
              "scripts/ci/archive/run_deform360_v6_source_prediction_evidence_v2.sh"
          )
          LOCK = (
              ROOT
              / "protocols/locks/deform360_official_hub_joint_sparse_source_execution_v5.json"
          )

          AUTHORITATIVE_ADMISSION_RUN_ID = "31272512658"
          AUTHORITATIVE_IMPLEMENTATION_REVISION = (
              "e190c94014e6024e324d860618662526af6ea682"
          )
          PREPARED_INVENTORY_ID = (
              "6994aa621b38dc8fb21cd38e43363bde3ea12dd644532addeecfc07a30f84e7b"
          )
          PREPARED_INVENTORY_FILE_SHA256 = (
              "4da96c4f636d195f7aea5d971fbd83bd3b0f35b1c66a77af68007bbd08a69007"
          )


          def test_runtime_reuses_the_frozen_prepared_inventory_identity() -> None:
              lock = json.loads(LOCK.read_text(encoding="utf-8"))
              assert lock["physical_baseline"]["prepared_source_inventory"] == {
                  "file_sha256": PREPARED_INVENTORY_FILE_SHA256,
                  "inventory_id": PREPARED_INVENTORY_ID,
              }

              runner = RUNNER.read_text(encoding="utf-8")
              assert (
                  f'PREPARED_INVENTORY_IMPLEMENTATION_REVISION="'
                  f'{AUTHORITATIVE_IMPLEMENTATION_REVISION}"'
              ) in runner
              assert f'PREPARED_INVENTORY_ID="{PREPARED_INVENTORY_ID}"' in runner
              assert (
                  f'PREPARED_INVENTORY_FILE_SHA256="{PREPARED_INVENTORY_FILE_SHA256}"'
                  in runner
              )
              assert (
                  f'PREPARED_INVENTORY_ADMISSION_RUN_ID="{AUTHORITATIVE_ADMISSION_RUN_ID}"'
                  in runner
              )


          def test_runtime_rewrites_only_the_inventory_generator_revision() -> None:
              runner = RUNNER.read_text(encoding="utf-8")
              science = SCIENCE_RUNNER.read_text(encoding="utf-8")
              inventory_pattern = re.compile(
                  r"scripts/science/inventory_deform360_calibration_prepared_source\.py"
                  r"[\s\S]*?--implementation-revision \"\$\{BPT_SOURCE_SHA\}\""
                  r"[\s\S]*?--output \"\$\{RUN_ROOT\}/prepared-source-inventory\.json\""
              )

              assert science.count('--implementation-revision "${BPT_SOURCE_SHA}"') == 2
              assert len(inventory_pattern.findall(science)) == 1
              assert (
                  'target="scripts/science/'
                  'inventory_deform360_calibration_prepared_source.py"' in runner
              )
              assert "inventory_pattern = re.compile(" in runner
              assert "len(inventory_pattern.findall(runner)) != 1" in runner
              assert (
                  'rewritten+=("$1" "${PREPARED_INVENTORY_IMPLEMENTATION_REVISION}")'
                  in runner
              )
              assert 'if [[ "${replacements}" -ne 1 ]]' in runner
              assert 'exec "${REAL_BPT_PYTHON}" "$@"' in runner
              assert 'BPT_PYTHON="${PYTHON_SHIM}"' in runner
              assert '"runtime_prepared_inventory_identity"' in runner
          PY

      - name: Validate the repaired head
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m ruff format \
            tests/test_deform360_v6_prepared_inventory_binding.py
          python -m ruff check \
            tests/test_deform360_v6_prepared_inventory_binding.py
          bash -n scripts/ci/run_deform360_v6_source_prediction_evidence.sh
          python -m pytest -q \
            tests/test_deform360_v6_prepared_inventory_binding.py \
            tests/test_deform360_v6_physical_upstream_history.py \
            tests/test_deform360_joint_sparse_geometric_v4_v6_source_execution.py
          git diff --check

      - name: Publish the clean two-file repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-deform360-prepared-inventory-validation-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/ci/run_deform360_v6_source_prediction_evidence.sh \
            tests/test_deform360_v6_prepared_inventory_binding.py \
            .github/workflows/repair-deform360-prepared-inventory-validation-once.yml
          git diff --cached --check
          git commit -m 'Scope prepared inventory validation to its generator command'
          git push origin HEAD:fix/deform360-v6-prepared-inventory-identity
