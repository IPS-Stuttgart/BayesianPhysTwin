name: PR 20 mypy diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Capture mypy output
        shell: bash
        run: |
          set +e
          python -m mypy --python-version 3.12 \
            src/bayesian_phystwin/selective_risk.py \
            > mypy-output.txt 2>&1
          status=$?
          cat mypy-output.txt
          echo "mypy_exit_status=$status" >> "$GITHUB_ENV"
          exit 0
      - name: Upload exact mypy output
        uses: actions/upload-artifact@v7
        with:
          name: pr20-mypy-output
          path: mypy-output.txt
          if-no-files-found: error
          retention-days: 1
      - name: Report mypy status
        run: exit "${mypy_exit_status}"
