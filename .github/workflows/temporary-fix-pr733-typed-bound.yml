name: Temporary fix PR 733 typed bound

on:
  push:
    branches:
      - agent/provider-physical-mapping-audit-v1
    paths:
      - .github/workflows/temporary-fix-pr733-typed-bound.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'IPS-Stuttgart/BayesianPhysTwin'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/provider-physical-mapping-audit-v1
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Introduce a typed unit-scale lower bound
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/bayesian_phystwin/provider_physical_mapping_audit_v1.py')
          text = path.read_text(encoding='utf-8')
          typed_constant = (
              '_MINIMUM_POSITIVE_UNIT_SCALE_M: Final = '
              'float(np.finfo(float).tiny)\n'
          )
          anchor = '_MAXIMUM_SAFE_UNIT_SCALE_M: Final = math.sqrt(np.finfo(float).max)\n'
          if typed_constant not in text:
              if text.count(anchor) != 1:
                  raise SystemExit(f'expected one constant anchor, found {text.count(anchor)}')
              text = text.replace(anchor, typed_constant + anchor)

          replacements = (
              'minimum=np.finfo(float).tiny,',
              'minimum=float(np.finfo(float).tiny),',
          )
          for old in replacements:
              text = text.replace(old, 'minimum=_MINIMUM_POSITIVE_UNIT_SCALE_M,')
          if text.count('minimum=_MINIMUM_POSITIVE_UNIT_SCALE_M,') != 1:
              raise SystemExit('typed lower bound is not used exactly once')
          path.write_text(text, encoding='utf-8')
          PY
          python -m pip install ruff==0.16.4
          python -m ruff format src/bayesian_phystwin/provider_physical_mapping_audit_v1.py
      - name: Commit repair when needed
        shell: bash
        run: |
          if git diff --quiet -- src/bayesian_phystwin/provider_physical_mapping_audit_v1.py; then
            echo 'Typed lower bound already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bayesian_phystwin/provider_physical_mapping_audit_v1.py
          git commit -m 'Define typed provider unit-scale lower bound'
          git push origin HEAD:agent/provider-physical-mapping-audit-v1
