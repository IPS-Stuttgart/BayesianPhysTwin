# workflow-lifecycle: temporary-one-shot
# workflow-owner: IPS-Stuttgart maintainers
name: Format Deform360 untouched confirmation PR 821

on:
  push:
    branches: [science/deform360-stronger-confirmation-v5]
    paths:
      - ".github/requests/format-deform360-untouched-pr821-v1.json"

permissions:
  contents: write

concurrency:
  group: format-deform360-untouched-pr821-v1
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out writable PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: science/deform360-untouched-confirmation-v5-evidence
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Format, validate, and publish retained sources
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install ruff==0.16.5 numpy==2.2.6
          files=(
            scripts/science/audit_deform360_untouched_confirmation_v5.py
            scripts/science/run_deform360_untouched_confirmation_v5.py
          )
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m py_compile "${files[@]}"
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "${files[@]}"
          if git diff --cached --quiet; then
            echo "No formatting change required."
            exit 0
          fi
          git commit -m "Format Deform360 untouched confirmation sources"
          git push origin HEAD:science/deform360-untouched-confirmation-v5-evidence
