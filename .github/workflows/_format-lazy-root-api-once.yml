name: Format lazy root API once

on:
  push:
    branches:
      - agent/v05-lazy-root-api

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/v05-lazy-root-api
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Format reported files
        run: |
          python -m pip install 'ruff==0.16.2'
          python -m ruff format \
            src/bayesian_phystwin/__init__.py \
            tests/test_public_api_manifest.py
          git diff --check

      - name: Commit exact formatter output
        run: |
          if git diff --quiet -- \
            src/bayesian_phystwin/__init__.py \
            tests/test_public_api_manifest.py; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/bayesian_phystwin/__init__.py \
            tests/test_public_api_manifest.py
          git commit -m 'Apply Ruff formatting'
          git push origin HEAD:agent/v05-lazy-root-api
