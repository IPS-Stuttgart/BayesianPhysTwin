name: Format domain covariance calibration

on:
  push:
    branches:
      - agent/domain-covariance-calibration-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/domain-covariance-calibration-v1
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Ruff
        run: python -m pip install 'ruff>=0.6'
      - name: Apply repository formatting and safe lint fixes
        shell: bash
        run: |
          ruff format \
            src/bayesian_phystwin/_domain_covariance_calibration*.py \
            src/bayesian_phystwin/domain_covariance_calibration.py \
            tests/domain_covariance_calibration_test_helpers.py \
            tests/test_source_competence_domain_covariance_calibration*.py
          ruff check --fix \
            src/bayesian_phystwin/_domain_covariance_calibration*.py \
            src/bayesian_phystwin/domain_covariance_calibration.py \
            tests/domain_covariance_calibration_test_helpers.py \
            tests/test_source_competence_domain_covariance_calibration*.py
          ruff format --check \
            src/bayesian_phystwin/_domain_covariance_calibration*.py \
            src/bayesian_phystwin/domain_covariance_calibration.py \
            tests/domain_covariance_calibration_test_helpers.py \
            tests/test_source_competence_domain_covariance_calibration*.py
          ruff check \
            src/bayesian_phystwin/_domain_covariance_calibration*.py \
            src/bayesian_phystwin/domain_covariance_calibration.py \
            tests/domain_covariance_calibration_test_helpers.py \
            tests/test_source_competence_domain_covariance_calibration*.py
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No formatter changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/bayesian_phystwin/_domain_covariance_calibration*.py \
            src/bayesian_phystwin/domain_covariance_calibration.py \
            tests/domain_covariance_calibration_test_helpers.py \
            tests/test_source_competence_domain_covariance_calibration*.py
          git commit -m 'Apply Ruff formatting to covariance calibration'
          git push origin HEAD:agent/domain-covariance-calibration-v1
