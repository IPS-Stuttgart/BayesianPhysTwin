name: Temporary register PR 262 coverage

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]
    paths:
      - ".github/workflows/_temporary_register_pr262_coverage.yml"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: temporary-register-pr262-coverage-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  register:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.event.pull_request.number == 262 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref ==
        'agent/deform360-visual-execution-admission-v1' &&
      github.event.pull_request.user.login == 'FlorianPfaff'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Register exact coverage suite and publish final tree
        shell: bash
        env:
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PARENT_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repository_root = Path.cwd()
          tests_path = repository_root / ".github/workflows/tests.yml"
          source = tests_path.read_text(encoding="utf-8")
          entries = (
              "            tests/test_deform360_calibration_visual_"
              "execution_admission.py \\\n",
              "            tests/test_deform360_calibration_visual_"
              "execution_admission_edges.py \\\n",
          )
          for entry in entries:
              if entry in source:
                  raise SystemExit(f"coverage entry already exists: {entry.strip()}")
          anchor = (
              "            tests/test_deform360_calibration_visual_"
              "production_plan.py \\\n"
          )
          if source.count(anchor) != 1:
              raise SystemExit("visual-production coverage anchor changed")
          updated = source.replace(anchor, anchor + "".join(entries))
          for entry in entries:
              if updated.count(entry) != 1:
                  raise SystemExit(f"coverage entry was not inserted once: {entry.strip()}")
          for relative in (
              "tests/test_deform360_calibration_visual_execution_admission.py",
              "tests/test_deform360_calibration_visual_execution_admission_edges.py",
          ):
              if not (repository_root / relative).is_file():
                  raise SystemExit(f"coverage test is missing: {relative}")
          tests_path.write_text(updated, encoding="utf-8")

          api = os.environ["API_URL"]
          repository = os.environ["REPOSITORY"]
          branch = os.environ["BRANCH"]
          parent = os.environ["PARENT_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          def request(method: str, path: str, payload: object | None = None) -> object:
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  f"{api}/repos/{repository}{path}",
                  data=data,
                  headers=headers,
                  method=method,
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          parent_commit = request("GET", f"/git/commits/{parent}")
          if not isinstance(parent_commit, dict):
              raise SystemExit("parent commit response is not an object")
          base_tree = str(parent_commit["tree"]["sha"])
          blob = request(
              "POST",
              "/git/blobs",
              {
                  "content": base64.b64encode(updated.encode("utf-8")).decode("ascii"),
                  "encoding": "base64",
              },
          )
          if not isinstance(blob, dict):
              raise SystemExit("blob response is not an object")
          tree = request(
              "POST",
              "/git/trees",
              {
                  "base_tree": base_tree,
                  "tree": [
                      {
                          "path": ".github/workflows/tests.yml",
                          "mode": "100644",
                          "type": "blob",
                          "sha": str(blob["sha"]),
                      },
                      {
                          "path": (
                              ".github/workflows/"
                              "_temporary_register_pr262_coverage.yml"
                          ),
                          "mode": "100644",
                          "type": "blob",
                          "sha": None,
                      },
                  ],
              },
          )
          if not isinstance(tree, dict):
              raise SystemExit("tree response is not an object")
          commit = request(
              "POST",
              "/git/commits",
              {
                  "message": "Register visual-execution admission coverage",
                  "tree": str(tree["sha"]),
                  "parents": [parent],
              },
          )
          if not isinstance(commit, dict):
              raise SystemExit("commit response is not an object")
          branch_path = urllib.parse.quote(branch, safe="")
          current = request("GET", f"/git/ref/heads/{branch_path}")
          if not isinstance(current, dict):
              raise SystemExit("branch response is not an object")
          current_sha = str(current["object"]["sha"])
          if current_sha != parent:
              raise SystemExit(
                  f"branch advanced during finalization: {current_sha} != {parent}"
              )
          result = request(
              "PATCH",
              f"/git/refs/heads/{branch_path}",
              {"sha": str(commit["sha"]), "force": False},
          )
          if not isinstance(result, dict):
              raise SystemExit("ref-update response is not an object")
          print(
              json.dumps(
                  {
                      "parent_sha": parent,
                      "commit_sha": str(commit["sha"]),
                      "tests_blob_sha": str(blob["sha"]),
                  },
                  sort_keys=True,
              )
          )
          PY
