name: Temporary register PR 262 coverage

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]
    paths:
      - ".github/workflows/_temporary_register_pr262_coverage.yml"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: temporary-register-pr262-coverage-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  register:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.event.pull_request.number == 262 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref ==
        'agent/deform360-visual-execution-admission-v1' &&
      github.event.pull_request.user.login == 'FlorianPfaff'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Register admission coverage tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          repository_root = Path.cwd()
          path = repository_root / ".github/workflows/tests.yml"
          source = path.read_text(encoding="utf-8")
          entries = (
              "            tests/test_deform360_calibration_visual_"
              "execution_admission.py \\\n",
              "            tests/test_deform360_calibration_visual_"
              "execution_admission_edges.py \\\n",
          )
          for entry in entries:
              if entry in source:
                  raise SystemExit(f"coverage entry already exists: {entry.strip()}")
          anchor = (
              "            tests/test_deform360_calibration_visual_"
              "production_plan.py \\\n"
          )
          if source.count(anchor) != 1:
              raise SystemExit("visual-production coverage anchor changed")
          updated = source.replace(anchor, anchor + "".join(entries))
          for entry in entries:
              if updated.count(entry) != 1:
                  raise SystemExit(f"coverage entry was not inserted once: {entry.strip()}")
          for relative in (
              "tests/test_deform360_calibration_visual_execution_admission.py",
              "tests/test_deform360_calibration_visual_execution_admission_edges.py",
          ):
              if not (repository_root / relative).is_file():
                  raise SystemExit(f"coverage test is missing: {relative}")
          path.write_text(updated, encoding="utf-8")
          PY
          git diff --check
          git diff -- .github/workflows/tests.yml

      - name: Publish validated workflow blob and receipt
        shell: bash
        env:
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          PARENT_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          RECEIPT: ${{ runner.temp }}/pr262-coverage-receipt.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          api = os.environ["API_URL"]
          repository = os.environ["REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          parent = os.environ["PARENT_SHA"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          def request(method: str, path: str, payload: object | None = None) -> object:
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  f"{api}/repos/{repository}{path}",
                  data=data,
                  headers=headers,
                  method=method,
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          parent_commit = request("GET", f"/git/commits/{parent}")
          if not isinstance(parent_commit, dict):
              raise SystemExit("parent commit response is not an object")
          payload = Path(".github/workflows/tests.yml").read_bytes()
          blob = request(
              "POST",
              "/git/blobs",
              {
                  "content": base64.b64encode(payload).decode("ascii"),
                  "encoding": "base64",
              },
          )
          if not isinstance(blob, dict):
              raise SystemExit("blob response is not an object")
          receipt = {
              "repository": repository,
              "parent_sha": parent,
              "base_tree_sha": str(parent_commit["tree"]["sha"]),
              "blob_sha": str(blob["sha"]),
              "path": ".github/workflows/tests.yml",
              "deleted_paths": [
                  ".github/workflows/_temporary_register_pr262_coverage.yml"
              ],
          }
          Path(os.environ["RECEIPT"]).write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Upload validated workflow and receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pr262-coverage-registration-${{ github.event.pull_request.head.sha }}
          path: |
            .github/workflows/tests.yml
            ${{ runner.temp }}/pr262-coverage-receipt.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 2
