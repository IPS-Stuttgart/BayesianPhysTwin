name: Deform360 covariance residual adapter v1

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deform360-covariance-residual-adapter-v1.yml"
      - "docs/deform360_covariance_residual_adapter_dry_run_v1.md"
      - "protocols/locks/deform360_covariance_residual_adapter_dry_run_v1.json"
      - "protocols/locks/deform360_covariance_only_target_v1_2.json"
      - "scripts/science/run_deform360_covariance_residual_adapter_dry_run_v1.py"
      - "src/bayesian_phystwin/covariance_only_hybrid.py"
      - "src/bayesian_phystwin/deform360_covariance_residual_adapter_v1.py"
      - "src/bayesian_phystwin/endpoint_model_average.py"
      - "tests/test_covariance_only_hybrid.py"
      - "tests/test_deform360_covariance_residual_adapter_dry_run_v1.py"
      - "tests/test_deform360_covariance_residual_adapter_v1.py"
      - "tests/test_deform360_covariance_residual_adapter_workflow_v1.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/deform360-covariance-residual-adapter-v1.yml"
      - "docs/deform360_covariance_residual_adapter_dry_run_v1.md"
      - "protocols/locks/deform360_covariance_residual_adapter_dry_run_v1.json"
      - "scripts/science/run_deform360_covariance_residual_adapter_dry_run_v1.py"
      - "src/bayesian_phystwin/deform360_covariance_residual_adapter_v1.py"
      - "tests/test_deform360_covariance_residual_adapter_dry_run_v1.py"
      - "tests/test_deform360_covariance_residual_adapter_v1.py"
      - "tests/test_deform360_covariance_residual_adapter_workflow_v1.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    deform360-covariance-residual-adapter-v1-${{
      github.event.pull_request.head.sha || github.sha
    }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PROTOCOL: >-
    protocols/locks/deform360_covariance_residual_adapter_dry_run_v1.json
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  source-only-dry-run:
    name: Source-only residual-history adapter dry run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Initialize compact evidence directory
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/deform360-covariance-residual-adapter-v1"
          rm -rf -- "${evidence}"
          mkdir -p -- "${evidence}"
          echo "EVIDENCE_ROOT=${evidence}" >> "${GITHUB_ENV}"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development environment
        run: |
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Verify exact revision and hosted information boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test -z "$(git status --porcelain=v1)"
          test "${RUNNER_OS}" = "Linux"
          test "${RUNNER_ARCH}" = "X64"
          test "${RUNNER_NAME}" != "workstation2"
          test ! -e /mnt/lexar4tb

      - name: Run focused quality and contract checks
        shell: bash
        run: |
          set -euo pipefail
          files=(
            scripts/science/run_deform360_covariance_residual_adapter_dry_run_v1.py
            src/bayesian_phystwin/deform360_covariance_residual_adapter_v1.py
            tests/test_deform360_covariance_residual_adapter_dry_run_v1.py
            tests/test_deform360_covariance_residual_adapter_v1.py
            tests/test_deform360_covariance_residual_adapter_workflow_v1.py
          )
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy \
            src/bayesian_phystwin/deform360_covariance_residual_adapter_v1.py
          python -m pytest -q \
            tests/test_covariance_only_hybrid.py \
            tests/test_deform360_covariance_residual_adapter_v1.py \
            tests/test_deform360_covariance_residual_adapter_dry_run_v1.py \
            tests/test_deform360_covariance_residual_adapter_workflow_v1.py

      - name: Execute the locked source-only dry run
        shell: bash
        run: |
          set -euo pipefail
          evidence="${EVIDENCE_ROOT}"
          python \
            scripts/science/run_deform360_covariance_residual_adapter_dry_run_v1.py \
            --protocol "${PROTOCOL}" \
            --output "${evidence}/result.json" \
            | tee "${evidence}/run.log"
          python -m pip freeze --all > "${evidence}/pip-freeze.txt"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "revision=${SOURCE_SHA}"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            python --version
          } > "${evidence}/execution-environment.txt"

      - name: Verify the machine-readable result boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(
              (Path(os.environ["EVIDENCE_ROOT"]) / "result.json").read_text(
                  encoding="utf-8"
              )
          )
          if result.get("dry_run_passed") is not True:
              raise SystemExit("source-only dry run did not pass")
          boundary = result.get("information_boundary")
          if not isinstance(boundary, dict) or boundary.get("source_only") is not True:
              raise SystemExit("source-only boundary is missing")
          for field in (
              "camera_media_decoded",
              "sensor_arrays_loaded_from_target",
              "target_payload_opened",
              "target_outcomes_opened",
              "predictions_run_on_target",
              "claim_authorized",
          ):
              if boundary.get(field) is not False:
                  raise SystemExit(f"information boundary opened: {field}")
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Publish source-only summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Deform360 covariance residual-history adapter"
            echo
            echo "- Exact source revision: \`${SOURCE_SHA}\`"
            echo "- Runner: GitHub-hosted \`${RUNNER_NAME}\`"
            if [[ -f "${EVIDENCE_ROOT:-}/result.json" ]]; then
              python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(
              (Path(os.environ["EVIDENCE_ROOT"]) / "result.json").read_text(
                  encoding="utf-8"
              )
          )
          print(f"- Dry run passed: `{str(result['dry_run_passed']).lower()}`")
          print(f"- Result SHA-256: `{result['result_sha256']}`")
          print("- Target payload opened: `false`")
          print("- Target outcomes opened: `false`")
          print("- Claim authorized: `false`")
          PY
            else
              echo "- The run stopped before publishing result.json."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload compact source-only evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: residual-adapter-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deform360-covariance-residual-adapter-v1
          if-no-files-found: error
          retention-days: 30
