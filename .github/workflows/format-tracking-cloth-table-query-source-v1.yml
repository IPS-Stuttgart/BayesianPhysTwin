# workflow-lifecycle: one-shot development maintenance
# workflow-owner: IPS-Stuttgart maintainers
name: Format Tracking Cloth table-query source v1

on:
  push:
    branches: [science/tracking-cloth-table-query-source-v1]
    paths:
      - .github/requests/format-tracking-cloth-table-query-source-v1.json

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: science/tracking-cloth-table-query-source-v1
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Apply the repository formatter and lint autofixes
        run: |
          python -m pip install ruff numpy==1.26.4
          python -m ruff check --fix \
            experiments/tracking_cloth_deformation_v1/table_query_source_v1.py
          python -m ruff format \
            experiments/tracking_cloth_deformation_v1/table_query_source_v1.py
          python -m experiments.tracking_cloth_deformation_v1.table_query_source_v1 \
            --self-test
      - name: Commit exact formatter output
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then
            echo "No formatter changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/tracking_cloth_deformation_v1/table_query_source_v1.py
          git commit -m "Format table-query source feasibility study"
          git push origin HEAD:science/tracking-cloth-table-query-source-v1
