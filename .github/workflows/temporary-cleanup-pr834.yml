name: One-shot cleanup for same-mean covariance audit

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temporary-cleanup-pr834.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'science/deform360-same-mean-query-covariance-v6'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
          clean: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Canonicalize changed Python files
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'ruff>=0.15.22,<0.17'
          git fetch --no-tags origin main:refs/remotes/origin/main
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR origin/main...HEAD -- '*.py')
          if (( ${#files[@]} )); then
            python -m ruff format "${files[@]}"
            python -m ruff check --fix "${files[@]}"
          fi
      - name: Remove temporary helpers and commit repair
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            .github/workflows/temporary-fix-pr834.yml \
            .github/workflows/temporary-cleanup-pr834.yml
          git add -- '*.py'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Repair same-mean covariance audit preflight'
          git pull --rebase origin "${HEAD_REF}"
          git push origin "HEAD:${HEAD_REF}"
