name: Repair PR 571 formatting once

on:
  push:
    branches:
      - agent/query-covariance-composition-v1
    paths:
      - .github/workflows/repair-pr571-format-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v7
        with:
          ref: agent/query-covariance-composition-v1
          fetch-depth: 0

      - name: Apply canonical Ruff formatting
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/bayesian_phystwin/query_covariance_decision_v1.py")
          text = path.read_text(encoding="utf-8")
          old = (
              "        if shared == 0.0 and not all(\n"
              "            _close(item, 0.0) for item in defined_directional\n"
              "        ):\n"
          )
          new = (
              "        if shared == 0.0 and not all("
              "_close(item, 0.0) for item in defined_directional):\n"
          )
          if text.count(old) != 1:
              raise SystemExit("expected exactly one Ruff formatting target")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          python -m pip install ruff
          python -m ruff format --check src/bayesian_phystwin/query_covariance_decision_v1.py
          python -m ruff check src/bayesian_phystwin/query_covariance_decision_v1.py

      - name: Commit repair and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-pr571-format-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bayesian_phystwin/query_covariance_decision_v1.py .github/workflows/repair-pr571-format-once.yml
          git commit -m 'Format query covariance decision validation'
          git push origin HEAD:agent/query-covariance-composition-v1
