name: Deform360 Stage-1 control plane

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deform360-stage1-control.yml"
      - "src/bayesian_phystwin/deform360_stage1_control.py"
      - "src/bayesian_phystwin/cli/deform360_stage1_control.py"
      - "src/bayesian_phystwin/cli/experiments.py"
      - "src/bayesian_phystwin/cli/_command_inventory.py"
      - "tests/test_deform360_stage1_control.py"
      - "tests/test_deform360_stage1_workflow.py"
      - "tests/test_command_registry.py"
      - "docs/deform360_stage1_control_plane.md"
  workflow_dispatch:
    inputs:
      profile:
        description: Control-plane transition to execute
        required: true
        default: contracts
        type: choice
        options:
          - contracts
          - prepare
          - seal
      provider_attestation_path:
        description: Existing claim-bearing Prob4D provider attestation
        required: false
        type: string
      motioncrafter_revision:
        description: Exact 40-character MotionCrafter revision
        required: false
        type: string
      model_set_id:
        description: Immutable Prob4D/MotionCrafter model-set SHA-256
        required: false
        type: string
      initial_metric_frame_prior_id:
        description: Initial metric-frame prior SHA-256
        required: false
        type: string
      root_seed:
        description: Frozen root seed
        required: false
        default: "20260805"
        type: string
      provider_lock_path:
        description: Reviewed visual-provider lock for the seal transition
        required: false
        type: string
      stage1_plan_path:
        description: Reviewed Stage-1 plan for the seal transition
        required: false
        type: string
      calibration_bundle_path:
        description: Complete calibration bundle for the seal transition
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deform360-stage1-${{ github.ref }}-${{ inputs.profile || 'contracts' }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  contracts:
    name: Stage-1 contract and command tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install contract environment
        run: |
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Validate registered command and focused contracts
        shell: bash
        run: |
          set -euo pipefail
          bpt commands describe prepare-deform360-stage1 --json \
            | tee stage1-command.json
          bpt experiment run prepare-deform360-stage1 --help \
            | tee stage1-help.txt
          python -m ruff check \
            src/bayesian_phystwin/deform360_stage1_control.py \
            src/bayesian_phystwin/cli/deform360_stage1_control.py \
            tests/test_deform360_stage1_control.py \
            tests/test_deform360_stage1_workflow.py
          python -m ruff format --check \
            src/bayesian_phystwin/deform360_stage1_control.py \
            src/bayesian_phystwin/cli/deform360_stage1_control.py \
            tests/test_deform360_stage1_control.py \
            tests/test_deform360_stage1_workflow.py
          python -m pytest -q \
            tests/test_deform360_stage1_control.py \
            tests/test_deform360_stage1_workflow.py \
            tests/test_deform360_visual_provider_lock.py \
            tests/test_deform360_calibration_bundle.py \
            tests/test_prob4d_causal_lineage.py \
            tests/test_command_registry.py \
            tests/test_cli_main.py

      - name: Upload compact contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deform360-stage1-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            stage1-command.json
            stage1-help.txt
          if-no-files-found: error
          retention-days: 30

  prepare:
    name: Create target-blind provider lock and Stage-1 plan
    needs: contracts
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'prepare'
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 30
    env:
      INPUT_PROVIDER_ATTESTATION: ${{ inputs.provider_attestation_path }}
      INPUT_MOTIONCRAFTER_REVISION: ${{ inputs.motioncrafter_revision }}
      INPUT_MODEL_SET_ID: ${{ inputs.model_set_id }}
      INPUT_INITIAL_PRIOR_ID: ${{ inputs.initial_metric_frame_prior_id }}
      INPUT_ROOT_SEED: ${{ inputs.root_seed }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true

      - name: Create isolated output root
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/deform360-stage1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "${root}"
          mkdir -p "${root}"
          echo "STAGE1_OUTPUT_ROOT=${root}" >> "${GITHUB_ENV}"

      - name: Install lightweight control-plane environment
        run: |
          python3 -m venv "${STAGE1_OUTPUT_ROOT}/venv"
          "${STAGE1_OUTPUT_ROOT}/venv/bin/python" -m pip install -e ".[dev]"
          echo "${STAGE1_OUTPUT_ROOT}/venv/bin" >> "${GITHUB_PATH}"

      - name: Validate prepare inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            INPUT_PROVIDER_ATTESTATION \
            INPUT_MOTIONCRAFTER_REVISION \
            INPUT_MODEL_SET_ID \
            INPUT_INITIAL_PRIOR_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error title=Missing Stage-1 input::${name} is required"
              exit 1
            fi
          done
          test -f "${INPUT_PROVIDER_ATTESTATION}"

      - name: Create provider lock and Stage-1 plan
        shell: bash
        run: |
          set -euo pipefail
          provider="${STAGE1_OUTPUT_ROOT}/visual-provider-lock.json"
          plan="${STAGE1_OUTPUT_ROOT}/stage1-plan.json"
          bpt experiment run prepare-deform360-stage1 provider-lock \
            --provider-attestation "${INPUT_PROVIDER_ATTESTATION}" \
            --motioncrafter-revision "${INPUT_MOTIONCRAFTER_REVISION}" \
            --model-set-id "${INPUT_MODEL_SET_ID}" \
            --initial-metric-frame-prior-id "${INPUT_INITIAL_PRIOR_ID}" \
            --root-seed "${INPUT_ROOT_SEED}" \
            --output "${provider}" \
            | tee "${STAGE1_OUTPUT_ROOT}/provider-summary.json"
          bpt experiment run prepare-deform360-stage1 plan \
            --provider-lock "${provider}" \
            --output "${plan}" \
            | tee "${STAGE1_OUTPUT_ROOT}/plan-summary.json"
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path(os.environ["STAGE1_OUTPUT_ROOT"])
          provider = json.loads((root / "visual-provider-lock.json").read_text())
          plan = json.loads((root / "stage1-plan.json").read_text())
          subprocess.run(
              [
                  "bpt",
                  "experiment",
                  "run",
                  "prepare-deform360-stage1",
                  "verify-plan",
                  "--plan",
                  str(root / "stage1-plan.json"),
                  "--expected-plan-id",
                  plan["plan_id"],
                  "--expected-provider-lock-id",
                  provider["artifact_id"],
                  "--expected-selection-artifact-sha256",
                  plan["selection_artifact_sha256"],
              ],
              check=True,
              stdout=(root / "plan-verification.json").open("w", encoding="utf-8"),
          )
          PY
          sha256sum \
            "${STAGE1_OUTPUT_ROOT}/visual-provider-lock.json" \
            "${STAGE1_OUTPUT_ROOT}/stage1-plan.json" \
            "${STAGE1_OUTPUT_ROOT}/provider-summary.json" \
            "${STAGE1_OUTPUT_ROOT}/plan-summary.json" \
            "${STAGE1_OUTPUT_ROOT}/plan-verification.json" \
            > "${STAGE1_OUTPUT_ROOT}/SHA256SUMS"
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"

      - name: Upload target-blind prepare evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deform360-stage1-prepare-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.STAGE1_OUTPUT_ROOT }}/visual-provider-lock.json
            ${{ env.STAGE1_OUTPUT_ROOT }}/stage1-plan.json
            ${{ env.STAGE1_OUTPUT_ROOT }}/provider-summary.json
            ${{ env.STAGE1_OUTPUT_ROOT }}/plan-summary.json
            ${{ env.STAGE1_OUTPUT_ROOT }}/plan-verification.json
            ${{ env.STAGE1_OUTPUT_ROOT }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  seal:
    name: Seal completed calibration before confirmation access
    needs: contracts
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'seal'
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 30
    env:
      INPUT_PROVIDER_LOCK: ${{ inputs.provider_lock_path }}
      INPUT_STAGE1_PLAN: ${{ inputs.stage1_plan_path }}
      INPUT_CALIBRATION_BUNDLE: ${{ inputs.calibration_bundle_path }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true

      - name: Create isolated output root
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/deform360-stage1-seal-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "${root}"
          mkdir -p "${root}"
          echo "STAGE1_OUTPUT_ROOT=${root}" >> "${GITHUB_ENV}"

      - name: Install lightweight control-plane environment
        run: |
          python3 -m venv "${STAGE1_OUTPUT_ROOT}/venv"
          "${STAGE1_OUTPUT_ROOT}/venv/bin/python" -m pip install -e ".[dev]"
          echo "${STAGE1_OUTPUT_ROOT}/venv/bin" >> "${GITHUB_PATH}"

      - name: Validate seal inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            INPUT_PROVIDER_LOCK \
            INPUT_STAGE1_PLAN \
            INPUT_CALIBRATION_BUNDLE; do
            if [[ -z "${!name}" || ! -f "${!name}" ]]; then
              echo "::error title=Missing Stage-1 seal input::${name} must be a file"
              exit 1
            fi
          done

      - name: Derive and verify the calibration seal
        shell: bash
        run: |
          set -euo pipefail
          output="${STAGE1_OUTPUT_ROOT}/visual-calibration-lock.json"
          summary="${STAGE1_OUTPUT_ROOT}/stage1-seal-summary.json"
          bpt experiment run prepare-deform360-stage1 seal \
            --plan "${INPUT_STAGE1_PLAN}" \
            --provider-lock "${INPUT_PROVIDER_LOCK}" \
            --calibration-bundle "${INPUT_CALIBRATION_BUNDLE}" \
            --output "${output}" \
            --summary-output "${summary}" \
            | tee "${STAGE1_OUTPUT_ROOT}/seal-console-summary.json"
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path(os.environ["STAGE1_OUTPUT_ROOT"])
          plan_path = Path(os.environ["INPUT_STAGE1_PLAN"])
          provider_path = Path(os.environ["INPUT_PROVIDER_LOCK"])
          bundle_path = Path(os.environ["INPUT_CALIBRATION_BUNDLE"])
          lock_path = root / "visual-calibration-lock.json"
          plan = json.loads(plan_path.read_text(encoding="utf-8"))
          provider = json.loads(provider_path.read_text(encoding="utf-8"))
          bundle = json.loads(bundle_path.read_text(encoding="utf-8"))
          calibration_lock = json.loads(lock_path.read_text(encoding="utf-8"))
          result = subprocess.run(
              [
                  "bpt",
                  "experiment",
                  "run",
                  "prepare-deform360-stage1",
                  "verify-seal",
                  "--plan",
                  str(plan_path),
                  "--provider-lock",
                  str(provider_path),
                  "--calibration-bundle",
                  str(bundle_path),
                  "--calibration-lock",
                  str(lock_path),
                  "--expected-plan-id",
                  plan["plan_id"],
                  "--expected-provider-lock-id",
                  provider["artifact_id"],
                  "--expected-bundle-id",
                  bundle["bundle_id"],
                  "--expected-calibration-lock-id",
                  calibration_lock["artifact_id"],
                  "--expected-selection-artifact-sha256",
                  plan["selection_artifact_sha256"],
                  "--expected-evidence-use-ledger-id",
                  bundle["evidence_use_ledger_id"],
              ],
              check=True,
              capture_output=True,
              text=True,
          )
          (root / "seal-verification.json").write_text(
              result.stdout,
              encoding="utf-8",
          )
          PY
          sha256sum \
            "${output}" \
            "${summary}" \
            "${STAGE1_OUTPUT_ROOT}/seal-console-summary.json" \
            "${STAGE1_OUTPUT_ROOT}/seal-verification.json" \
            > "${STAGE1_OUTPUT_ROOT}/SHA256SUMS"
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"

      - name: Upload compact calibration-seal evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deform360-stage1-seal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.STAGE1_OUTPUT_ROOT }}/visual-calibration-lock.json
            ${{ env.STAGE1_OUTPUT_ROOT }}/stage1-seal-summary.json
            ${{ env.STAGE1_OUTPUT_ROOT }}/seal-console-summary.json
            ${{ env.STAGE1_OUTPUT_ROOT }}/seal-verification.json
            ${{ env.STAGE1_OUTPUT_ROOT }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
