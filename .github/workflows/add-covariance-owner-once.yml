# workflow-lifecycle: temporary
# workflow-owner: IPS-Stuttgart maintainers
# workflow-issue: #769
# workflow-expiry: 2026-08-26
name: Add covariance workflow owner once

on:
  push:
    branches:
      - feature/covariance-source-readiness-dispatch-v1

permissions:
  contents: write

concurrency:
  group: add-covariance-owner-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/covariance-source-readiness-dispatch-v1
          fetch-depth: 0
      - name: Add permanent owner declaration and retire this migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/deform360-covariance-only-independent-validation-v1.yml")
          lifecycle = "# workflow-lifecycle: permanent\n"
          owner = "# workflow-owner: IPS-Stuttgart maintainers\n"
          text = path.read_text(encoding="utf-8")
          if not text.startswith(lifecycle):
              raise SystemExit("expected permanent lifecycle declaration at file start")
          if owner not in text.split("name:", 1)[0]:
              text = lifecycle + owner + text[len(lifecycle):]
              path.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/add-covariance-owner-once.yml
          git diff --check
      - name: Commit the owner declaration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/deform360-covariance-only-independent-validation-v1.yml \
            .github/workflows/add-covariance-owner-once.yml
          git commit -m "Declare covariance validation workflow owner"
          git push origin HEAD:feature/covariance-source-readiness-dispatch-v1
