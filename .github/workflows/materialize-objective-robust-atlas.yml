# workflow-lifecycle: temporary
# workflow-owner: IPS-Stuttgart maintainers
# workflow-issue: https://github.com/IPS-Stuttgart/BayesianPhysTwin/pull/878
# workflow-expiry: 2026-09-03
name: Materialize objective-robust atlas once

on:
  push:
    branches: [feature/decision-capability-atlas-v1]
    paths:
      - ".github/workflows/materialize-objective-robust-atlas.yml"

permissions:
  contents: write

concurrency:
  group: materialize-objective-robust-atlas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    name: Generate exact result and remove launcher
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/decision-capability-atlas-v1
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Generate exact result
        run: |
          mkdir -p build/objective-robust-atlas
          python experiments/decision_capability_atlas_v1/run.py \
            --output build/objective-robust-atlas/result.json
          python experiments/decision_capability_atlas_v1/run.py \
            --output build/objective-robust-atlas/result-second.json
          cmp build/objective-robust-atlas/result.json \
            build/objective-robust-atlas/result-second.json

      - name: Upload exact result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: objective-robust-atlas-exact-${{ github.sha }}
          path: build/objective-robust-atlas/result.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove launcher
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/materialize-objective-robust-atlas.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove objective-robust atlas materializer"
          git push origin HEAD:feature/decision-capability-atlas-v1
