name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Changed-file quality and strict core typing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Lint and format-check changed Python files
        id: ruff
        continue-on-error: true
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          python tools/check_changed_python_quality.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            2>&1 | tee ruff.txt
      - name: Strictly type-check stable contracts and scientific interfaces
        id: mypy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m mypy --strict \
            src/bayesian_phystwin/causal4d_provider_v1.py \
            src/bayesian_phystwin/observation_belief.py \
            src/bayesian_phystwin/observation_belief_gauge_adapter.py \
            src/bayesian_phystwin/_gauge_aware_contracts.py \
            src/bayesian_phystwin/_gauge_aware_solver.py \
            src/bayesian_phystwin/gauge_aware_belief.py \
            src/bayesian_phystwin/run_manifest.py \
            src/bayesian_phystwin/repository_provenance.py \
            src/bayesian_phystwin/run_manifest_v2.py \
            src/bayesian_phystwin/cli/main.py \
            src/bayesian_phystwin/cli/run_manifest.py \
            tools/check_changed_python_quality.py \
            tools/check_changed_semantic_coverage.py \
            2>&1 | tee mypy.txt
      - name: Upload quality diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-diagnostics
          path: |
            ruff.txt
            mypy.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce quality gates
        if: always()
        shell: bash
        env:
          RUFF_OUTCOME: ${{ steps.ruff.outcome }}
          MYPY_OUTCOME: ${{ steps.mypy.outcome }}
        run: |
          printf 'changed-file Ruff: %s\n' "$RUFF_OUTCOME"
          printf 'strict core mypy: %s\n' "$MYPY_OUTCOME"
          [[ "$RUFF_OUTCOME" == "success" ]]
          [[ "$MYPY_OUTCOME" == "success" ]]

  core-contracts:
    name: Core contracts / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install NumPy-only package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Assert graph and vision extras are absent
        run: |
          python - <<'PY'
          import importlib.util

          forbidden = ("cv2", "scipy")
          present = [name for name in forbidden if importlib.util.find_spec(name)]
          if present:
              raise SystemExit(f"optional dependencies leaked into core job: {present}")
          PY
      - name: Run core contract suite
        run: |
          python -m pytest -q \
            tests/test_causal4d_provider_v1.py \
            tests/test_contract_properties.py \
            tests/test_gauge_aware_belief.py \
            tests/test_gauge_aware_properties.py \
            tests/test_observation_belief.py \
            tests/test_observation_belief_gauge_adapter.py \
            tests/test_profile_properties.py \
            tests/test_quality_gate_tools.py \
            tests/test_cli_main.py \
            tests/test_run_manifest.py \
            tests/test_run_manifest_v2.py \
            tests/test_run_manifest_cli.py

  semantic-coverage:
    name: Changed scientific-core coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install NumPy-only package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Exercise stable semantic interfaces with branch coverage
        run: |
          python -m coverage erase
          python -m coverage run \
            --branch \
            --source=src/bayesian_phystwin \
            -m pytest -q \
            tests/test_causal4d_provider_v1.py \
            tests/test_contract_properties.py \
            tests/test_gauge_aware_belief.py \
            tests/test_gauge_aware_properties.py \
            tests/test_observation_belief.py \
            tests/test_observation_belief_gauge_adapter.py \
            tests/test_cli_main.py \
            tests/test_run_manifest.py \
            tests/test_run_manifest_v2.py \
            tests/test_run_manifest_cli.py
          python -m coverage json -o coverage.json
      - name: Require line and branch coverage on changed semantic code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: >-
          python tools/check_changed_semantic_coverage.py
          --coverage-json coverage.json
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
      - name: Upload semantic coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semantic-coverage
          path: coverage.json
          if-no-files-found: warn
          retention-days: 14

  full-suite:
    name: Full suite / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: python -m pip install -e ".[dev,graph,vision]"
      - name: Run full suite
        run: >-
          python -m pytest
          --tb=short
          --junitxml=pytest-results-${{ matrix.python-version }}.xml
      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: pytest-results-${{ matrix.python-version }}.xml
          if-no-files-found: warn
          retention-days: 14

  provider-contract:
    name: Provider contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: python -m pip install -e ".[dev,graph,vision]"
      - name: Validate provider and observation boundaries
        run: |
          python -m pytest -q \
            tests/test_causal4d_provider_v1.py \
            tests/test_gauge_aware_belief.py \
            tests/test_observation_belief_gauge_adapter.py \
            tests/test_observation_belief.py
          bpt provider manifest \
            --provider-revision "${GITHUB_SHA}" \
            --output provider-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("provider-manifest.json").read_text())
          required = {
              "artifact_checksums",
              "particle_endpoint_position",
              "particle_endpoint_velocity",
              "physical_parameter_particles",
          }
          missing = required - set(payload["capabilities"])
          if missing:
              raise SystemExit(f"missing provider capabilities: {sorted(missing)}")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: provider-manifest
          path: provider-manifest.json
          retention-days: 14

  build:
    name: Build distributions
    needs: [quality, core-contracts, semantic-coverage, full-suite, provider-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and validate distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  installed-artifact:
    name: Installed ${{ matrix.kind }} smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        kind: [wheel, sdist]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install isolated artifact
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/bpt-artifact-smoke"
          python_bin="$RUNNER_TEMP/bpt-artifact-smoke/bin/python"
          "$python_bin" -m pip install --upgrade pip
          if [[ "${{ matrix.kind }}" == "wheel" ]]; then
            artifact=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          else
            artifact=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          fi
          test -n "$artifact"
          "$python_bin" -m pip install "$artifact"
          "$python_bin" -m pip check
      - name: Exercise stable installed commands
        shell: bash
        run: |
          bin="$RUNNER_TEMP/bpt-artifact-smoke/bin"
          "$bin/bpt" --help
          "$bin/bpt" provider manifest --help
          "$bin/bpt" observation validate --help
          "$bin/bpt" run manifest --help
          "$bin/bpt-provider-manifest" --help
          "$bin/bpt-run-manifest" --help
