name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  apply-prior-aware-irls-fix:
    name: Apply prior-aware IRLS fail-closed fix
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/fail-closed-prior-aware-irls'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Apply sparse guard and regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          dense_path = Path("src/bayesian_phystwin/prior_aware_gauge_belief.py")
          dense_text = dense_path.read_text(encoding="utf-8")
          if "mixture-fixed-point-not-converged" not in dense_text:
              raise SystemExit("dense fail-closed guard is missing")

          sparse_path = Path(
              "src/bayesian_phystwin/sparse_prior_aware_gauge_belief.py"
          )
          sparse_text = sparse_path.read_text(encoding="utf-8")
          needle = '''    try:
              reduced_covariance = _spd_covariance(normal)
          '''
          guard = '''    if not fixed_point_converged:
              diagnostics.update(
                  {
                      "iterations": iteration_count,
                      "mixture_fixed_point_converged": False,
                      "mixture_solution_delta": solution_delta,
                      "mixture_stationarity_norm": stationarity_norm,
                      "condition_number": condition_number,
                  }
              )
              return _sparse_fallback_result(
                  batch,
                  gauge,
                  "mixture-fixed-point-not-converged",
                  diagnostics,
                  prior_covariance=full_prior,
              )

          '''
          if "mixture-fixed-point-not-converged" not in sparse_text:
              if sparse_text.count(needle) != 1:
                  raise SystemExit("unexpected sparse covariance solve anchor")
              sparse_text = sparse_text.replace(needle, guard + needle)
              sparse_path.write_text(sparse_text, encoding="utf-8")

          test_path = Path("tests/test_sparse_prior_aware_gauge_belief.py")
          test_text = test_path.read_text(encoding="utf-8")
          test_name = "test_prior_aware_solvers_fail_closed_on_unconverged_mixture"
          if test_name not in test_text:
              test_text += '''


def test_prior_aware_solvers_fail_closed_on_unconverged_mixture() -> None:
    dense_batch, sparse_batch, sparse_design = _fixture()
    config = _config(maximum_iterations=1, convergence_tolerance=1.0e-15)

    dense = update_prior_aware_gauge_belief(dense_batch, config=config)
    sparse = update_sparse_prior_aware_gauge_belief(
        sparse_batch,
        sparse_design,
        config=config,
    )

    assert not dense.inference_admissible
    assert not sparse.inference_admissible
    assert dense.reason == sparse.reason == "mixture-fixed-point-not-converged"
    assert dense.diagnostics["iterations"] == 1
    assert sparse.diagnostics["iterations"] == 1
    assert dense.diagnostics["mixture_fixed_point_converged"] is False
    assert sparse.diagnostics["mixture_fixed_point_converged"] is False
    _assert_result_parity(dense, sparse)
'''
              test_path.write_text(test_text, encoding="utf-8")
          PY
      - name: Install and verify focused surfaces
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          files=(
            src/bayesian_phystwin/prior_aware_gauge_belief.py
            src/bayesian_phystwin/sparse_prior_aware_gauge_belief.py
            tests/test_sparse_prior_aware_gauge_belief.py
          )
          python -m ruff format -- "${files[@]}"
          python -m ruff check -- "${files[@]}"
          python -m ruff format --check --diff "${files[@]}"
          python -m mypy --python-version 3.12 \
            src/bayesian_phystwin/prior_aware_gauge_belief.py \
            src/bayesian_phystwin/sparse_prior_aware_gauge_belief.py
          python -m pytest -q \
            tests/test_sparse_prior_aware_gauge_belief.py \
            tests/test_prior_aware_and_linearization.py \
            tests/test_prior_aware_likelihood_conformance.py \
            tests/test_tree_sparse_explicit_gauge_prob4d.py
          python -m compileall -q src/bayesian_phystwin tests
      - name: Publish verified source-only change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- .github/workflows/tests.yml
          git rm -f .github/workflows/agent-apply-prior-aware-irls.yml
          git add \
            src/bayesian_phystwin/prior_aware_gauge_belief.py \
            src/bayesian_phystwin/sparse_prior_aware_gauge_belief.py \
            tests/test_sparse_prior_aware_gauge_belief.py \
            .github/workflows/tests.yml
          git commit -m "Fail closed on non-converged prior-aware IRLS"
          git push origin HEAD:agent/fail-closed-prior-aware-irls

  quality:
    name: Python quality ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      QUALITY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Check changed files and stable interfaces
        id: quality
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python tools/quality/changed_python_quality.py \
            --base "${QUALITY_BASE_SHA}" \
            --head "${QUALITY_HEAD_SHA}" \
            2>&1 | tee quality-ratchet.txt
      - name: Upload quality diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-quality-ratchet
          path: quality-ratchet.txt
          if-no-files-found: error
          retention-days: 14
      - name: Fail on quality violations
        if: steps.quality.outcome == 'failure'
        run: exit 1

  stable-core-coverage:
    name: Stable-core branch coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      QUALITY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install coverage test dependencies
        run: |
          python -m pip install -e ".[dev,graph]"
          python -m pip install "coverage==7.13.3"
      - name: Run stable-core coverage suite
        shell: bash
        run: |
          python tools/quality/test_suite_manifest.py list stable-core-coverage \
            > "$RUNNER_TEMP/stable-core-tests.txt"
          mapfile -t stable_tests < "$RUNNER_TEMP/stable-core-tests.txt"
          test "${#stable_tests[@]}" -gt 0
          python -m coverage run --branch --source=bayesian_phystwin \
            -m pytest -q "${stable_tests[@]}"

          python -m coverage json -o package-coverage.json

          stable_files=(
            src/bayesian_phystwin/_gauge_aware_contracts.py
            src/bayesian_phystwin/_gauge_aware_solver.py
            src/bayesian_phystwin/calibration.py
            src/bayesian_phystwin/causal4d_provider_v1.py
            src/bayesian_phystwin/cli/main.py
            src/bayesian_phystwin/cli/run_manifest.py
            src/bayesian_phystwin/gauge_aware_belief.py
            src/bayesian_phystwin/deform360_contact_anchor.py
            src/bayesian_phystwin/observation_belief.py
            src/bayesian_phystwin/observation_belief_gauge_adapter.py
            src/bayesian_phystwin/phystwin_profile.py
            src/bayesian_phystwin/prob4d_causal_lineage.py
            src/bayesian_phystwin/prob4d_observation_contract.py
            src/bayesian_phystwin/pseudo_measurements.py
            src/bayesian_phystwin/repository_provenance.py
            src/bayesian_phystwin/robust_likelihood.py
            src/bayesian_phystwin/run_manifest.py
            src/bayesian_phystwin/run_manifest_v2.py
          )
          stable_include=$(IFS=,; echo "${stable_files[*]}")
          python -m coverage json \
            --include="${stable_include}" \
            -o stable-core-coverage.json
          python -m coverage report \
            --include="${stable_include}" \
            --show-missing | tee stable-core-coverage.txt

          coverage_args=(
            stable-core-coverage.json
            .github/quality/stable-core-coverage-floors.json
            --changed-coverage-json package-coverage.json
            --head "${QUALITY_HEAD_SHA}"
          )
          if [[ -n "${QUALITY_BASE_SHA}" ]]; then
            coverage_args+=(--base "${QUALITY_BASE_SHA}")
          fi
          python tools/quality/check_coverage_floors.py "${coverage_args[@]}"
      - name: Upload stable-core coverage evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stable-core-coverage
          path: |
            .coverage
            package-coverage.json
            stable-core-coverage.json
            stable-core-coverage.txt
          if-no-files-found: warn
          retention-days: 14

  core-contracts:
    name: Core contracts / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install NumPy-only package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Assert graph and vision extras are absent
        run: |
          python - <<'PY'
          import importlib.util

          forbidden = ("cv2", "scipy")
          present = [name for name in forbidden if importlib.util.find_spec(name)]
          if present:
              raise SystemExit(f"optional dependencies leaked into core job: {present}")
          PY
      - name: Run core contract suite
        shell: bash
        run: |
          python tools/quality/test_suite_manifest.py list core-contracts \
            > "$RUNNER_TEMP/core-contract-tests.txt"
          mapfile -t core_tests < "$RUNNER_TEMP/core-contract-tests.txt"
          test "${#core_tests[@]}" -gt 0
          python -m pytest -q "${core_tests[@]}"

  full-suite:
    name: Full suite / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: python -m pip install -e ".[dev,graph,vision]"
      - name: Run full suite
        run: >-
          python -m pytest
          --tb=short
          --junitxml=pytest-results-${{ matrix.python-version }}.xml
      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: pytest-results-${{ matrix.python-version }}.xml
          if-no-files-found: warn
          retention-days: 14

  provider-contract:
    name: Provider contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: python -m pip install -e ".[dev,graph,vision]"
      - name: Validate provider and observation boundaries
        shell: bash
        run: |
          python tools/quality/test_suite_manifest.py list provider-contract \
            > "$RUNNER_TEMP/provider-contract-tests.txt"
          mapfile -t provider_tests < "$RUNNER_TEMP/provider-contract-tests.txt"
          test "${#provider_tests[@]}" -gt 0
          python -m pytest -q "${provider_tests[@]}"
          bpt provider manifest \
            --provider-revision "${GITHUB_SHA}" \
            --output provider-manifest.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from bayesian_phystwin.causal4d_graph_provider_v1 import (
              causal4d_graph_provider_manifest,
          )

          payload = json.loads(Path("provider-manifest.json").read_text())
          required = {
              "artifact_checksums",
              "particle_endpoint_position",
              "particle_endpoint_velocity",
              "physical_parameter_particles",
          }
          missing = required - set(payload["capabilities"])
          if missing:
              raise SystemExit(f"missing provider capabilities: {sorted(missing)}")

          graph_payload = causal4d_graph_provider_manifest(
              provider_revision=os.environ["GITHUB_SHA"]
          )
          graph_required = {"controller_grouping", "phystwin_spring_graph"}
          graph_missing = graph_required - set(graph_payload["capabilities"])
          if graph_missing:
              raise SystemExit(
                  f"missing graph-provider capabilities: {sorted(graph_missing)}"
              )
          if graph_payload["artifact_schema_versions"] != {
              "PhysTwinSpringGraph": 1
          }:
              raise SystemExit("unexpected graph-provider artifact schema")
          Path("graph-provider-manifest.json").write_text(
              json.dumps(graph_payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: provider-manifests
          path: |
            provider-manifest.json
            graph-provider-manifest.json
          retention-days: 14

  build:
    name: Build distributions
    needs:
      - quality
      - stable-core-coverage
      - core-contracts
      - full-suite
      - provider-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and validate distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  installed-artifact:
    name: Installed ${{ matrix.kind }} smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        kind: [wheel, sdist]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install isolated artifact
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/bpt-artifact-smoke"
          python_bin="$RUNNER_TEMP/bpt-artifact-smoke/bin/python"
          "$python_bin" -m pip install --upgrade pip
          if [[ "${{ matrix.kind }}" == "wheel" ]]; then
            artifact=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          else
            artifact=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          fi
          test -n "$artifact"
          "$python_bin" -m pip install "$artifact"
          "$python_bin" -m pip check
      - name: Exercise stable installed commands
        shell: bash
        run: |
          bin="$RUNNER_TEMP/bpt-artifact-smoke/bin"
          "$bin/bpt" --help
          "$bin/bpt" provider manifest --help
          "$bin/bpt" observation validate --help
          "$bin/bpt" run manifest --help
          "$bin/bpt" experiment list >/dev/null
          "$bin/bpt" experiment describe phystwin-refit
          "$bin/bpt" experiment describe seal-deform360-calibration >/dev/null
          "$bin/bpt" experiment run seal-deform360-calibration --help >/dev/null
