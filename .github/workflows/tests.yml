name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"
          - "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,graph]" opencv-python-headless
      - name: Run full suite
        run: >-
          python -m pytest
          --tb=short
          --junitxml=pytest-results-${{ matrix.python-version }}.xml
      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: pytest-results-${{ matrix.python-version }}.xml
          if-no-files-found: warn
          retention-days: 14

  provider-contract:
    name: Provider contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,graph]" opencv-python-headless
      - name: Validate provider and observation boundaries
        run: |
          python -m pytest -q \
            tests/test_causal4d_provider_v1.py \
            tests/test_gauge_aware_belief.py \
            tests/test_observation_belief_gauge_adapter.py \
            tests/test_observation_belief.py
          bpt-provider-manifest \
            --provider-revision "${GITHUB_SHA}" \
            --output provider-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("provider-manifest.json").read_text())
          required = {
              "artifact_checksums",
              "particle_endpoint_position",
              "particle_endpoint_velocity",
              "physical_parameter_particles",
          }
          missing = required - set(payload["capabilities"])
          if missing:
              raise SystemExit(f"missing provider capabilities: {sorted(missing)}")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: provider-manifest
          path: provider-manifest.json
          retention-days: 14

  build:
    name: Build distribution
    needs:
      - test
      - provider-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Smoke-test installed wheel
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/bpt-wheel-smoke"
          "$RUNNER_TEMP/bpt-wheel-smoke/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/bpt-wheel-smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/bpt-wheel-smoke/bin/python" - <<'PY'
          from bayesian_phystwin.causal4d_provider_v1 import provider_manifest

          manifest = provider_manifest("wheel-smoke")
          assert manifest.schema_version == 1
          print(manifest.manifest_id)
          PY
          "$RUNNER_TEMP/bpt-wheel-smoke/bin/bpt-provider-manifest" \
            --provider-revision wheel-smoke >/dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14
