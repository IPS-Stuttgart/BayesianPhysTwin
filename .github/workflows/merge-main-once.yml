name: Merge main once

on:
  push:
    branches:
      - agent/separate-grouped-likelihood-semantics
    paths:
      - .github/workflows/merge-main-once.yml

permissions:
  contents: write

jobs:
  merge:
    name: Merge main if conflict-free
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Merge current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-ff origin/main -m 'Merge main into grouped-likelihood branch'
          git push origin "HEAD:${GITHUB_REF_NAME}"
