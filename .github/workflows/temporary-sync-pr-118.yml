name: Temporary sync PR 118 with main

on:
  push:
    branches:
      - agent/portable-full22-anchor-reproduction

permissions:
  contents: write

concurrency:
  group: temporary-sync-pr-118
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Check out writable PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/portable-full22-anchor-reproduction
          fetch-depth: 0
          persist-credentials: true
          clean: true
      - name: Merge current main and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/main
          git rm .github/workflows/temporary-sync-pr-118.yml
          git commit -m "Remove temporary PR synchronization workflow"
          git push origin HEAD:agent/portable-full22-anchor-reproduction
