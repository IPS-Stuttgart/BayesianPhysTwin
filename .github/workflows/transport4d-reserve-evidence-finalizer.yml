name: Retain Transport4D metadata reserve evidence

on:
  push:
    branches: [research/transport4d-tiered-public-v1]
    paths:
      - ".github/workflows/transport4d-reserve-evidence-finalizer.yml"

permissions:
  actions: read
  contents: write

concurrency:
  group: transport4d-reserve-evidence-finalizer
  cancel-in-progress: false

jobs:
  retain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_RUN_ID: "33619965425"
      SOURCE_HEAD_SHA: c1ea890b075c67454805658f7ff521697b7d61b6
      ARTIFACT_ID: "9842497019"
      ARTIFACT_NAME: transport4d-deform360-reserve-33619965425-1
      ARTIFACT_SHA256: b08e8b34f98f3de103b2ea06c9658d4e02413543897678b566844a0744fd588f
      PROTOCOL_ID: a7d5f520ae3e4761452476af7af57fa023aea031114aa0239c2690bb531407c8
      RESERVE_ID: 0fba6a0cda4ac23fc8f900ca4632d73a22ae0559d42e48cc2ec8c5ea79030dc4
      OUTPUT_DIR: evidence/transport4d_deform360_reserve_v1
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true
      - name: Download exact metadata-only artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/transport4d-reserve.zip"
          extracted="$RUNNER_TEMP/transport4d-reserve"
          rm -rf -- "$archive" "$extracted"
          mkdir -p -- "$extracted"
          curl --fail --location --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output "$archive"
          printf '%s  %s\n' "$ARTIFACT_SHA256" "$archive" \
            | sha256sum --check --strict
          unzip -q "$archive" -d "$extracted"
          test -f "$extracted/reserve.json"
          test -f "$extracted/reserve.md"
          test -f "$extracted/environment.txt"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "EXTRACTED=$extracted" >> "$GITHUB_ENV"
      - name: Validate scientific identity and target closure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["EXTRACTED"])
          result = json.loads((root / "reserve.json").read_text(encoding="utf-8"))
          supplied = result.pop("reserve_id")
          encoded = json.dumps(
              result,
              sort_keys=True,
              separators=(",", ":"),
              allow_nan=False,
          ).encode("utf-8")
          assert hashlib.sha256(encoded).hexdigest() == supplied
          assert supplied == os.environ["RESERVE_ID"]
          assert result["protocol_id"] == os.environ["PROTOCOL_ID"]
          assert result["status"] == "metadata-reserve-ready"
          assert result["metadata_object_count"] == 190
          assert result["protected_object_count"] == 120
          assert result["remaining_metadata_object_count"] == 70
          assert result["calibration_object_count"] == 23
          assert result["confirmation_object_count"] == 47
          assert result["reservation_ready"] is True
          assert len(result["objects"]) == 70
          assert all(row["numeric_payload_opened"] is False for row in result["objects"])
          boundary = result["information_boundary"]
          for name in (
              "robot_numeric_payload_opened",
              "tactile_numeric_payload_opened",
              "camera_pixel_opened",
              "geometry_or_point_cloud_opened",
              "target_outcome_opened",
              "confirmation_authorized",
              "paper_claim_authorized",
          ):
              assert boundary[name] is False
          result["reserve_id"] = supplied
          PY
      - name: Materialize compact retained evidence
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"
          cp "$EXTRACTED/reserve.json" "$OUTPUT_DIR/result.json"
          cp "$EXTRACTED/reserve.md" "$OUTPUT_DIR/report.md"
          cat > "$OUTPUT_DIR/README.md" <<'EOF'
          # Transport4D Deform360 metadata reserve

          The one-shot target-closed audit found 190 metadata-bearing public
          Deform360 objects. It conservatively protected 120 namespaces used or
          reserved by the bound BayesianPhysTwin and Causal4D protocols, then
          assigned every remaining namespace by the frozen hash rule:

          - 23 calibration objects;
          - 47 confirmation objects;
          - zero numeric payload reads;
          - no replacement or later split movement permitted.

          This is a namespace and metadata reservation, not carrier qualification
          or numerical confirmation. A later reviewed protocol must retain every
          support-negative object and cannot open confirmation outcomes until the
          transport model, tier gates, queries, losses, and success criteria are
          frozen.
          EOF
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          output = Path(os.environ["OUTPUT_DIR"])
          files = {}
          for name in ("README.md", "report.md", "result.json"):
              data = (output / name).read_bytes()
              files[name] = {
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              }
          manifest = {
              "schema": "bayesian-phystwin.transport4d_deform360_reserve_evidence",
              "schema_version": 1,
              "source_workflow_run_id": int(os.environ["SOURCE_RUN_ID"]),
              "source_head_sha": os.environ["SOURCE_HEAD_SHA"],
              "artifact_id": int(os.environ["ARTIFACT_ID"]),
              "artifact_name": os.environ["ARTIFACT_NAME"],
              "artifact_sha256": os.environ["ARTIFACT_SHA256"],
              "protocol_id": os.environ["PROTOCOL_ID"],
              "reserve_id": os.environ["RESERVE_ID"],
              "status": "metadata-reserve-ready",
              "metadata_object_count": 190,
              "protected_object_count": 120,
              "calibration_object_count": 23,
              "confirmation_object_count": 47,
              "numeric_payload_opened": False,
              "confirmation_authorized": False,
              "paper_claim_authorized": False,
              "files": files,
          }
          unsigned = json.dumps(
              manifest,
              sort_keys=True,
              separators=(",", ":"),
              allow_nan=False,
          ).encode("utf-8")
          manifest["evidence_id"] = hashlib.sha256(unsigned).hexdigest()
          (output / "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Remove one-shot execution surface and commit evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/requests/transport4d-deform360-reserve-audit-v1.json \
            .github/workflows/transport4d-deform360-reserve-audit-one-shot.yml \
            .github/workflows/transport4d-reserve-evidence-finalizer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Retain target-closed Transport4D Deform360 reserve"
          git push origin HEAD:research/transport4d-tiered-public-v1
