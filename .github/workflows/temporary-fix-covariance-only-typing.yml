name: Temporary fix covariance-only typing

on:
  push:
    branches:
      - agent/full22-covariance-only-hybrid-v1
    paths:
      - ".github/workflows/temporary-fix-covariance-only-typing.yml"

permissions:
  contents: write

concurrency:
  group: temporary-fix-covariance-only-typing
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/full22-covariance-only-hybrid-v1
          fetch-depth: 1
          persist-credentials: true
          clean: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Tighten typed JSON and NumPy boundaries
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python - <<'PY'
          from pathlib import Path

          analysis = Path("src/bayesian_phystwin/covariance_only_hybrid_analysis.py")
          text = analysis.read_text(encoding="utf-8")
          replacements = {
              "    output_nll = np.empty(len(scales), dtype=np.float64)\n":
                  "    output_nll: np.ndarray = np.empty(len(scales), dtype=np.float64)\n",
              "    output_coverage = np.empty(len(scales), dtype=np.float64)\n":
                  "    output_coverage: np.ndarray = np.empty(len(scales), dtype=np.float64)\n",
              "    output_width = np.empty(len(scales), dtype=np.float64)\n":
                  "    output_width: np.ndarray = np.empty(len(scales), dtype=np.float64)\n",
              "        training = np.ones(len(cases), dtype=bool)\n":
                  "        training: np.ndarray = np.ones(len(cases), dtype=bool)\n",
              "    output = np.empty((len(folds), len(HORIZONS)), dtype=np.float64)\n":
                  "    output: np.ndarray = np.empty((len(folds), len(HORIZONS)), dtype=np.float64)\n",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"unexpected analysis replacement count: {old!r}")
              text = text.replace(old, new)
          analysis.write_text(text, encoding="utf-8")

          script = Path("scripts/science/run_full22_covariance_only_hybrid_v1.py")
          text = script.read_text(encoding="utf-8")
          once = {
              '                float(row["mean_nll_difference"]),\n':
                  '                _finite(row["mean_nll_difference"], name="mean_nll_difference"),\n',
              '                float(row["simultaneous_interval_lower"]),\n':
                  '                _finite(\n                    row["simultaneous_interval_lower"],\n                    name="simultaneous_interval_lower",\n                ),\n',
              '                float(row["simultaneous_interval_upper"]),\n':
                  '                _finite(\n                    row["simultaneous_interval_upper"],\n                    name="simultaneous_interval_upper",\n                ),\n',
              '                float(coverage["reference_marginal_coverage"]),\n':
                  '                _finite(\n                    coverage["reference_marginal_coverage"],\n                    name="reference_marginal_coverage",\n                ),\n',
              '                float(coverage["hybrid_marginal_coverage"]),\n':
                  '                _finite(\n                    coverage["hybrid_marginal_coverage"],\n                    name="hybrid_marginal_coverage",\n                ),\n',
              '    scales = tuple(float(value) for value in calibration["covariance_scales"])\n':
                  '    scales = tuple(\n        _finite(value, name=f"covariance_scales[{index}]", positive=True)\n        for index, value in enumerate(\n            _sequence(calibration["covariance_scales"], name="covariance_scales")\n        )\n    )\n',
              '    reference_nll = np.empty(shape, dtype=np.float64)\n':
                  '    reference_nll: np.ndarray = np.empty(shape, dtype=np.float64)\n',
              '    reference_coverage = np.empty(shape, dtype=np.float64)\n':
                  '    reference_coverage: np.ndarray = np.empty(shape, dtype=np.float64)\n',
              '    reference_width = np.empty(shape, dtype=np.float64)\n':
                  '    reference_width: np.ndarray = np.empty(shape, dtype=np.float64)\n',
              '    nll_grid = np.empty(grid_shape, dtype=np.float64)\n':
                  '    nll_grid: np.ndarray = np.empty(grid_shape, dtype=np.float64)\n',
              '    coverage_grid = np.empty(grid_shape, dtype=np.float64)\n':
                  '    coverage_grid: np.ndarray = np.empty(grid_shape, dtype=np.float64)\n',
              '    width_grid = np.empty(grid_shape, dtype=np.float64)\n':
                  '    width_grid: np.ndarray = np.empty(grid_shape, dtype=np.float64)\n',
              '            float(_mapping(protocol["cohort"], name="cohort")["fit_fraction"]),\n':
                  '            _finite(\n                _mapping(protocol["cohort"], name="cohort")["fit_fraction"],\n                name="fit_fraction",\n            ),\n',
              '        seed=int(inference["bootstrap_seed"]),\n':
                  '        seed=_integer(inference["bootstrap_seed"], name="bootstrap_seed"),\n',
              '        seed=int(inference["bootstrap_seed"]) + 1000,\n':
                  '        seed=_integer(inference["bootstrap_seed"], name="bootstrap_seed") + 1000,\n',
          }
          for old, new in once.items():
              if text.count(old) != 1:
                  raise SystemExit(f"unexpected script replacement count: {old!r}")
              text = text.replace(old, new)
          twice = {
              '        replicates=int(inference["bootstrap_replicates"]),\n':
                  '        replicates=_integer(\n            inference["bootstrap_replicates"],\n            name="bootstrap_replicates",\n            minimum=1000,\n        ),\n',
              '        confidence=float(inference["confidence"]),\n':
                  '        confidence=_finite(inference["confidence"], name="confidence"),\n',
          }
          for old, new in twice.items():
              if text.count(old) != 2:
                  raise SystemExit(f"unexpected repeated replacement count: {old!r}")
              text = text.replace(old, new)
          script.write_text(text, encoding="utf-8")
          PY
          files=(
            scripts/science/run_full22_covariance_only_hybrid_v1.py
            src/bayesian_phystwin/covariance_only_hybrid.py
            src/bayesian_phystwin/covariance_only_hybrid_analysis.py
            tests/test_covariance_only_hybrid.py
            tests/test_full22_covariance_only_hybrid_v1.py
          )
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m mypy \
            src/bayesian_phystwin/covariance_only_hybrid.py \
            src/bayesian_phystwin/covariance_only_hybrid_analysis.py \
            scripts/science/run_full22_covariance_only_hybrid_v1.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_covariance_only_hybrid.py \
            tests/test_full22_covariance_only_hybrid_v1.py \
            tests/test_pull_request_workflow_integrity.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/science/run_full22_covariance_only_hybrid_v1.py \
            src/bayesian_phystwin/covariance_only_hybrid_analysis.py
          git commit -m "Tighten covariance-only type boundaries"
          git push origin HEAD:agent/full22-covariance-only-hybrid-v1
