name: Validate provenance hardening for PR 95

on:
  push:
    branches:
      - agent/prospective-belief-hardening
    paths:
      - ".github/workflows/validate-provenance-hardening-pr95.yml"
      - "src/bayesian_phystwin/prospective_prob4d_update.py"
      - "tests/test_prospective_prob4d_update.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-provenance-hardening-pr95
  cancel-in-progress: true

jobs:
  validate:
    name: Provenance contracts and adversarial tests
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development environment
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "coverage==7.13.3"
      - name: Lint and type-check changed contract
        run: |
          python -m ruff check \
            src/bayesian_phystwin/prospective_prob4d_update.py \
            tests/test_prospective_prob4d_update.py
          python -m mypy --python-version 3.12 \
            src/bayesian_phystwin/prospective_prob4d_update.py
      - name: Run focused adversarial and integration tests
        run: |
          python -m coverage run --branch --source=bayesian_phystwin -m pytest -q \
            tests/test_prospective_prob4d_update.py \
            tests/test_prior_aware_and_linearization.py \
            tests/test_prob4d_causal_lineage.py \
            tests/test_prob4d_joint_contract_fixture.py
          python -m coverage report \
            --include="src/bayesian_phystwin/prospective_prob4d_update.py" \
            --show-missing \
            --fail-under=95
          python -m pip check
      - name: Publish successful validation marker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "schema": "bayesian-phystwin-provenance-hardening-validation-v1",
              "validated_revision": os.environ["GITHUB_SHA"],
              "runner": os.environ["RUNNER_NAME"],
              "completed_at": datetime.now(timezone.utc).isoformat(),
              "checks": [
                  "ruff",
                  "mypy",
                  "focused-pytest",
                  "branch-coverage-at-least-95-percent",
                  "pip-check",
              ],
              "result": "success",
          }
          Path("validation/provenance-hardening-pr95.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/provenance-hardening-pr95.json
          git commit -m "Record provenance hardening validation"
          git push origin HEAD:agent/prospective-belief-hardening
