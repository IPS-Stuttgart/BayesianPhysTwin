name: Execute isolated full-22 structured optimization

on:
  pull_request:
    branches: [agent/full22-structured-marginal-optimization-v1]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: execute-full22-structured-optimization-pr
  cancel-in-progress: false

jobs:
  execute:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref ==
      'agent/full22-structured-marginal-optimization-executor'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out isolated optimization target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/full22-structured-marginal-optimization-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Execute and validate the staged repair
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install PyYAML
          python - <<'PY'
          import subprocess
          from pathlib import Path

          import yaml

          staged = Path(
              ".github/workflows/repair-full22-structured-marginals.yml"
          )
          payload = yaml.safe_load(staged.read_text(encoding="utf-8"))
          scripts = {
              step["name"]: step["run"]
              for step in payload["jobs"]["repair"]["steps"]
              if "run" in step
          }
          workflow = Path(
              ".github/workflows/"
              "full22-discrepancy-candidate-tournament-v1.yml"
          )
          documentation = Path(
              "docs/full22_discrepancy_candidate_tournament_v1.md"
          )
          original_workflow = workflow.read_text(encoding="utf-8")
          original_documentation = documentation.read_text(encoding="utf-8")

          subprocess.run(
              [
                  "bash",
                  "-lc",
                  scripts[
                      "Apply exact structured-marginal and compact-readout adapters"
                  ],
              ],
              check=True,
          )

          workflow.write_text(original_workflow, encoding="utf-8")
          addition = """

          ## Exact structured marginal evaluation

          The structured candidate is scored through its exact registered per-track
          three-dimensional marginal moments. The orchestration layer derives those
          marginals directly from the candidate's compact frozen posterior instead of
          constructing one repeated prediction object per forecast horizon. This
          preserves the predictive means and per-track marginal covariances while
          leaving candidate revisions, admission decisions, scoring rules, fallback
          behavior, the locked protocol identity, and the claim boundary unchanged.
          """
          documentation.write_text(
              original_documentation.rstrip() + addition + "\n",
              encoding="utf-8",
          )

          subprocess.run(
              [
                  "bash",
                  "-lc",
                  scripts["Validate the isolated optimization"],
              ],
              check=True,
          )
          Path(
              ".github/full22-structured-marginal-optimization-trigger.txt"
          ).unlink(missing_ok=True)
          PY
          git diff --check

      - name: Publish the validated clean optimization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/science/run_full22_discrepancy_candidate_tournament_v1.py \
            tests/test_full22_discrepancy_candidate_tournament_v1.py \
            docs/full22_discrepancy_candidate_tournament_v1.md \
            .github/workflows/repair-full22-structured-marginals.yml \
            .github/full22-structured-marginal-optimization-trigger.txt
          git diff --cached --check
          git commit -m "Optimize full-22 structured marginal evaluation"
          git push origin \
            HEAD:agent/full22-structured-marginal-optimization-v1
