name: Execute isolated full-22 structured optimization

on:
  pull_request:
    branches: [agent/full22-structured-marginal-optimization-v1]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: execute-full22-structured-optimization-pr
  cancel-in-progress: false

jobs:
  execute:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref ==
      'agent/full22-structured-marginal-optimization-executor'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out isolated optimization target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/full22-structured-marginal-optimization-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Execute and validate the staged repair
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install PyYAML
          python - <<'PY'
          import subprocess
          from pathlib import Path

          import yaml

          workflow = Path(
              ".github/workflows/repair-full22-structured-marginals.yml"
          )
          payload = yaml.safe_load(workflow.read_text(encoding="utf-8"))
          scripts = {
              step["name"]: step["run"]
              for step in payload["jobs"]["repair"]["steps"]
              if "run" in step
          }
          for name in (
              "Apply exact structured-marginal and compact-readout adapters",
              "Validate the isolated optimization",
          ):
              subprocess.run(
                  ["bash", "-lc", scripts[name]],
                  check=True,
              )
          Path(
              ".github/full22-structured-marginal-optimization-trigger.txt"
          ).unlink(missing_ok=True)
          PY
          git diff --check

      - name: Publish the validated clean optimization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/science/run_full22_discrepancy_candidate_tournament_v1.py \
            tests/test_full22_discrepancy_candidate_tournament_v1.py \
            .github/workflows/full22-discrepancy-candidate-tournament-v1.yml \
            docs/full22_discrepancy_candidate_tournament_v1.md \
            .github/workflows/repair-full22-structured-marginals.yml \
            .github/full22-structured-marginal-optimization-trigger.txt
          git diff --cached --check
          git commit -m "Optimize full-22 structured marginal evaluation"
          git push origin \
            HEAD:agent/full22-structured-marginal-optimization-v1
