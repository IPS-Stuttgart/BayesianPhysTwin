# workflow-lifecycle: permanent
# workflow-owner: IPS-Stuttgart maintainers
name: Deform360 query-sufficient dependence v1

on:
  push:
    branches:
      - science/deform360-query-sufficient-dependence-v1
    paths:
      - .github/requests/deform360-query-sufficient-dependence-v1.json

permissions:
  actions: read
  contents: read

concurrency:
  group: deform360-query-sufficient-dependence-v1
  cancel-in-progress: false

env:
  DATASET_ROOT: /mnt/seagate10tb/florianpfaff/datasets/deform360
  CONTROL_ROOT: control
  ORIGINAL_V6_ROOT: original-v6
  PARENT_CONTROL_ROOT: parent-control
  FROZEN_ROOT: frozen
  PROB4D_ROOT: prob4d
  RUNNER_PATH: control/scripts/science/run_deform360_query_sufficient_dependence_v1.py
  RECOVERY_RUNNER_PATH: control/scripts/science/run_deform360_dependence_query_v6_bound_carrier_recovery_v1.py
  PROTOCOL_PATH: control/protocols/deform360_query_sufficient_dependence_v1.json
  ORIGINAL_V6_RUNNER_PATH: original-v6/scripts/science/run_deform360_dependence_query_v6.py
  REFERENCE_PROTOCOL_PATH: original-v6/protocols/deform360_dependence_query_v6.json
  PARENT_PROTOCOL_PATH: parent-control/protocols/deform360_untouched_confirmation_v5.json
  ORIGINAL_V6_REVISION: 954538832106d8ded13f1101b3a2b2e855b40513
  ORIGINAL_V6_RUNNER_BLOB: b5c2b219f083d3f3af578a840194829bacd56e3e
  RECOVERY_RUNNER_BLOB: 0955ad7ce0c176e7538bd5b91cc36e3444564be5
  PARENT_CONTROL_REVISION: e409527b8499a225bde8bd7f8c532a30e96548c6
  FROZEN_REVISION: 25ba91c021124569c4dcf84c66eda5ec088868e0
  PROB4D_REVISION: 25d7fc1c363892f432c4f3ddf15665fc20ab727e
  PROB4D_KERNEL_BLOB: 06cd938e5c705d8fab62eaf8338baa6bbd40f5c5
  REFERENCE_ARTIFACT_ID: "9811194776"
  REFERENCE_ARTIFACT_SHA256: 8b3bad2bc0620228ebe32027028b1666ea7772a1850f0ab45d525e30e4ced82a
  REFERENCE_RESULT_SHA256: c73659af65c2b87923f7bd668f9717afab03e449a5b3abd3a5b597ec60898fd1
  PARENT_ARTIFACT_ID: "9738998271"
  PARENT_ARTIFACT_SHA256: e98f9e2687f568d0d0fcabec9ce0393a7e1b34ca3019acb1e14fdf894885a948
  PARENT_RESULT_SHA256: 0ad16b15c94d81b8c14221a271eb1f647d689a530284570becdfeca87e0d8ec7
  PARENT_READINESS_SHA256: 58841144ae5105080ecb991cc73e9021214fc8676f9e55948ef3511fb12a2f8e
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out pinned Prob4D kernel
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/Prob4D
          ref: 25d7fc1c363892f432c4f3ddf15665fc20ab727e
          path: prob4d
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install focused contract dependencies
        run: python -m pip install numpy==1.26.4 pytest ruff==0.14.14
      - name: Validate contracts and exact projection implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool protocols/deform360_query_sufficient_dependence_v1.json >/dev/null
          python -m py_compile \
            scripts/science/run_deform360_query_sufficient_dependence_v1.py \
            scripts/science/run_deform360_dependence_query_v6_bound_carrier_recovery_v1.py
          python scripts/science/run_deform360_query_sufficient_dependence_v1.py \
            --self-test
          python -m pytest -q tests/test_deform360_query_sufficient_dependence_v1.py
          python -m ruff check \
            scripts/science/run_deform360_query_sufficient_dependence_v1.py \
            tests/test_deform360_query_sufficient_dependence_v1.py
          python -m ruff format --check \
            scripts/science/run_deform360_query_sufficient_dependence_v1.py \
            tests/test_deform360_query_sufficient_dependence_v1.py
          test "$(git -C prob4d rev-parse HEAD)" = "${PROB4D_REVISION}"
          test "$(git -C prob4d hash-object src/prob4d/query_preserving_compression.py)" = \
            "${PROB4D_KERNEL_BLOB}"
          PYTHONPATH=prob4d/src python - <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          import numpy as np

          path = Path("scripts/science/run_deform360_query_sufficient_dependence_v1.py")
          spec = importlib.util.spec_from_file_location("query_sufficient_contract", path)
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          qpc = module.load_prob4d_compressor(Path("prob4d"))
          rng = np.random.default_rng(260903)
          factor = rng.normal(size=(24, 8))
          weights = rng.normal(size=(5, 24))
          bank = {
              name: (weights[index], "upper")
              for index, name in enumerate(
                  (
                      "total_load",
                      "sensor_imbalance",
                      "horizontal_balance",
                      "vertical_balance",
                      "center_periphery",
                  )
              )
          }
          protocol = {
              "evaluation": {
                  "maximum_query_loss_fraction": 1e-10,
                  "maximum_portfolio_rank": 5,
                  "relative_eigenspace_tolerance": 1e-12,
              }
          }
          compressed = module.prob4d_compress(qpc, factor, bank, protocol)
          assert compressed.retained_rank <= 5
          reduced = np.asarray(compressed.compressed_factor_m).reshape(24, -1)
          full_cov = (weights @ factor) @ (weights @ factor).T
          reduced_cov = (weights @ reduced) @ (weights @ reduced).T
          np.testing.assert_allclose(reduced_cov, full_cov, rtol=1e-9, atol=1e-9)
          PY

  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      request_path: ${{ steps.request.outputs.request_path }}
    steps:
      - name: Check out trigger commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: request
        name: Authorize one add-only retrospective execution request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = \
            refs/heads/science/deform360-query-sufficient-dependence-v1
          test "${PUSH_FORCED}" = false
          test "${BEFORE_SHA}" != 0000000000000000000000000000000000000000
          mapfile -t changed < <(git diff --name-status "${BEFORE_SHA}" "${GITHUB_SHA}")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = \
            $'A\t.github/requests/deform360-query-sufficient-dependence-v1.json'
          REQUEST=.github/requests/deform360-query-sufficient-dependence-v1.json
          REQUEST_PATH="${REQUEST}" python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          path = Path(os.environ["REQUEST_PATH"])
          value = json.loads(path.read_text(encoding="utf-8"))
          expected = {
              "schema": "bayesian-phystwin/deform360-query-sufficient-dependence-request-v1",
              "request_id": "deform360-query-sufficient-dependence-v1-20260903",
              "purpose": "Reproduce the bound 92-object same-mean dependence study and test the minimum five-query factor subspace plus a matched-rank observation-energy control.",
              "runner_labels": ["self-hosted", "Linux", "X64", "gpuserver4090"],
              "dataset_root": "/mnt/seagate10tb/florianpfaff/datasets/deform360",
              "protocol_path": "protocols/deform360_query_sufficient_dependence_v1.json",
              "reference_workflow_run_id": 33528032875,
              "reference_artifact_id": 9811194776,
              "reference_result_sha256": "c73659af65c2b87923f7bd668f9717afab03e449a5b3abd3a5b597ec60898fd1",
              "point_predictor_changed": False,
              "full_covariance_changed_before_compression": False,
              "query_bank_changed": False,
              "source_calibration_or_decision_rule_changed": False,
              "target_outcomes_may_select_projection_or_rank": False,
              "unbound_numeric_payloads_may_open": False,
              "new_measurements_collected": False,
              "paper_claim_authorized": False,
          }
          for key, expected_value in expected.items():
              if value.get(key) != expected_value:
                  raise SystemExit(f"invalid {key}: {value.get(key)!r}")
          allowed = set(expected) | {"expected_source_revision"}
          if set(value) != allowed:
              raise SystemExit("request fields differ from the frozen schema")
          parent = subprocess.check_output(
              ["git", "rev-parse", f"{os.environ['GITHUB_SHA']}^"],
              text=True,
          ).strip()
          if value["expected_source_revision"] != parent:
              raise SystemExit("expected_source_revision is not the trigger parent")
          PY
          echo "request_path=${REQUEST}" >> "${GITHUB_OUTPUT}"

  evaluate:
    needs: [contracts, authorize]
    if: >-
      always() && needs.contracts.result == 'success' &&
      needs.authorize.result == 'success'
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 300
    env:
      REQUEST_PATH: ${{ needs.authorize.outputs.request_path }}
    steps:
      - name: Check out experiment control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          persist-credentials: false
          clean: true
      - name: Check out exact original dependence implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 954538832106d8ded13f1101b3a2b2e855b40513
          path: original-v6
          persist-credentials: false
          clean: true
      - name: Check out exact parent confirmation control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: e409527b8499a225bde8bd7f8c532a30e96548c6
          path: parent-control
          persist-credentials: false
          clean: true
      - name: Check out exact frozen point method
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 25ba91c021124569c4dcf84c66eda5ec088868e0
          path: frozen
          persist-credentials: false
          clean: true
      - name: Check out exact Prob4D compressor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/Prob4D
          ref: 25d7fc1c363892f432c4f3ddf15665fc20ab727e
          path: prob4d
          persist-credentials: false
          clean: true

      - name: Recover exact reference and parent evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf reference-evidence parent-evidence reference-evidence.zip parent-evidence.zip
          mkdir -p reference-evidence parent-evidence
          curl --fail --location --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${REFERENCE_ARTIFACT_ID}/zip" \
            --output reference-evidence.zip
          printf '%s  %s\n' "${REFERENCE_ARTIFACT_SHA256}" reference-evidence.zip \
            | sha256sum --check --strict
          unzip -q reference-evidence.zip -d reference-evidence
          test -s reference-evidence/result.json
          printf '%s  %s\n' "${REFERENCE_RESULT_SHA256}" reference-evidence/result.json \
            | sha256sum --check --strict
          curl --fail --location --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PARENT_ARTIFACT_ID}/zip" \
            --output parent-evidence.zip
          printf '%s  %s\n' "${PARENT_ARTIFACT_SHA256}" parent-evidence.zip \
            | sha256sum --check --strict
          unzip -q parent-evidence.zip -d parent-evidence
          test -s parent-evidence/result.json
          test -s parent-evidence/bound-readiness.json
          printf '%s  %s\n' "${PARENT_RESULT_SHA256}" parent-evidence/result.json \
            | sha256sum --check --strict
          printf '%s  %s\n' "${PARENT_READINESS_SHA256}" \
            parent-evidence/bound-readiness.json | sha256sum --check --strict

      - name: Prepare isolated numerical runtime
        shell: bash
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP}/deform360-query-sufficient-v1-venv-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          output="${RUNNER_TEMP}/deform360-query-sufficient-v1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "${venv}" "${output}"
          python3 -m venv "${venv}"
          "${venv}/bin/python" -m pip install --disable-pip-version-check numpy==1.26.4
          mkdir -p -- "${output}"
          {
            echo "PYTHON_BIN=${venv}/bin/python"
            echo "VENV_ROOT=${venv}"
            echo "OUTPUT_ROOT=${output}"
          } >> "${GITHUB_ENV}"

      - name: Validate exact source and data lineage
        shell: bash
        run: |
          set -euo pipefail
          test -d "${DATASET_ROOT}"
          test "$(readlink -f -- "${DATASET_ROOT}")" = "${DATASET_ROOT}"
          test "$(git -C "${ORIGINAL_V6_ROOT}" rev-parse HEAD)" = "${ORIGINAL_V6_REVISION}"
          test "$(git -C "${PARENT_CONTROL_ROOT}" rev-parse HEAD)" = \
            "${PARENT_CONTROL_REVISION}"
          test "$(git -C "${FROZEN_ROOT}" rev-parse HEAD)" = "${FROZEN_REVISION}"
          test "$(git -C "${PROB4D_ROOT}" rev-parse HEAD)" = "${PROB4D_REVISION}"
          test "$(git -C "${ORIGINAL_V6_ROOT}" hash-object scripts/science/run_deform360_dependence_query_v6.py)" = \
            "${ORIGINAL_V6_RUNNER_BLOB}"
          test "$(git -C "${CONTROL_ROOT}" hash-object scripts/science/run_deform360_dependence_query_v6_bound_carrier_recovery_v1.py)" = \
            "${RECOVERY_RUNNER_BLOB}"
          test "$(git -C "${PROB4D_ROOT}" hash-object src/prob4d/query_preserving_compression.py)" = \
            "${PROB4D_KERNEL_BLOB}"
          "${PYTHON_BIN}" -m py_compile \
            "${RUNNER_PATH}" \
            "${RECOVERY_RUNNER_PATH}" \
            "${ORIGINAL_V6_RUNNER_PATH}" \
            parent-control/scripts/science/run_deform360_untouched_confirmation_v5.py \
            parent-control/scripts/science/audit_deform360_untouched_confirmation_v5.py \
            frozen/scripts/science/run_deform360_action_kernel_v3.py \
            frozen/scripts/science/run_deform360_action_conditioned_tactile_v2.py \
            prob4d/src/prob4d/query_preserving_compression.py
          "${PYTHON_BIN}" "${RUNNER_PATH}" --self-test
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "experiment_revision=${GITHUB_SHA}"
            echo "original_v6_revision=$(git -C "${ORIGINAL_V6_ROOT}" rev-parse HEAD)"
            echo "parent_control_revision=$(git -C "${PARENT_CONTROL_ROOT}" rev-parse HEAD)"
            echo "frozen_revision=$(git -C "${FROZEN_ROOT}" rev-parse HEAD)"
            echo "prob4d_revision=$(git -C "${PROB4D_ROOT}" rev-parse HEAD)"
            echo "runner_name=${RUNNER_NAME}"
            echo "dataset_root=${DATASET_ROOT}"
            sha256sum \
              "${RUNNER_PATH}" \
              "${RECOVERY_RUNNER_PATH}" \
              "${ORIGINAL_V6_RUNNER_PATH}" \
              "${PROTOCOL_PATH}" \
              prob4d/src/prob4d/query_preserving_compression.py \
              reference-evidence/result.json \
              parent-evidence/result.json \
              parent-evidence/bound-readiness.json \
              reference-evidence.zip \
              parent-evidence.zip
            "${PYTHON_BIN}" --version
            "${PYTHON_BIN}" -c 'import numpy; print("numpy=" + numpy.__version__)'
            uname -a
          } | tee "${OUTPUT_ROOT}/environment.txt"
          cp "${PROTOCOL_PATH}" "${OUTPUT_ROOT}/protocol.json"
          cp "control/${REQUEST_PATH}" "${OUTPUT_ROOT}/request.json"

      - name: Run query-sufficient dependence evaluation
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="${PROB4D_ROOT}/src" "${PYTHON_BIN}" "${RUNNER_PATH}" \
            --protocol "${PROTOCOL_PATH}" \
            --reference-result reference-evidence/result.json \
            --reference-protocol "${REFERENCE_PROTOCOL_PATH}" \
            --original-v6-runner "${ORIGINAL_V6_RUNNER_PATH}" \
            --recovery-runner "${RECOVERY_RUNNER_PATH}" \
            --parent-protocol "${PARENT_PROTOCOL_PATH}" \
            --parent-result parent-evidence/result.json \
            --readiness-json parent-evidence/bound-readiness.json \
            --data-root "${DATASET_ROOT}" \
            --original-v6-root "${ORIGINAL_V6_ROOT}" \
            --recovery-root "${CONTROL_ROOT}" \
            --parent-control-root "${PARENT_CONTROL_ROOT}" \
            --frozen-root "${FROZEN_ROOT}" \
            --prob4d-root "${PROB4D_ROOT}" \
            --output-json "${OUTPUT_ROOT}/result.json" \
            --output-report "${OUTPUT_ROOT}/report.md" \
            --output-csv "${OUTPUT_ROOT}/object-results.csv" \
            | tee "${OUTPUT_ROOT}/console.log"
          cat "${OUTPUT_ROOT}/report.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Enforce complete query-sufficient result
        shell: bash
        run: |
          set -euo pipefail
          "${PYTHON_BIN}" - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["OUTPUT_ROOT"])
          result = json.loads((root / "result.json").read_text(encoding="utf-8"))
          if result["status"] != "complete":
              raise SystemExit("query-sufficient result is incomplete")
          if result["summary"]["object_count"] != 92:
              raise SystemExit("complete 92-object roster was not evaluated")
          failed = [name for name, passed in result["decision"]["gates"].items() if not passed]
          if failed:
              raise SystemExit(f"query-sufficient gates failed: {failed}")
          if result["decision"]["query_sufficient_representation_supported"] is not True:
              raise SystemExit("query-sufficient representation was not supported")
          if result["decision"]["existing_decision_advantage_retained_exactly"] is not True:
              raise SystemExit("existing dependence advantage was not retained")
          for key in (
              "fresh_confirmation_authorized",
              "paper_claim_authorized",
              "deployment_safety_authorized",
              "query_calibration_supported",
          ):
              if result["decision"][key] is not False:
                  raise SystemExit(f"result self-authorized forbidden claim: {key}")
          boundary = result["information_boundary"]
          for key in (
              "point_predictor_changed",
              "full_covariance_changed_before_compression",
              "query_bank_changed",
              "source_calibration_changed",
              "decision_rule_changed",
              "target_outcomes_used_to_select_projection_or_rank",
              "unbound_numeric_payloads_opened",
              "camera_pixels_opened",
              "geometry_or_point_cloud_opened",
              "new_measurements_collected",
              "full_field_covariance_preserved",
          ):
              if boundary[key] is not False:
                  raise SystemExit(f"forbidden boundary value: {key}")
          if boundary["registered_query_portfolio_covariance_preserved"] is not True:
              raise SystemExit("registered query covariance was not preserved")
          unsigned = dict(result)
          supplied = unsigned.pop("result_sha256")
          encoded = json.dumps(
              unsigned,
              sort_keys=True,
              separators=(",", ":"),
              allow_nan=False,
          ).encode("utf-8")
          if hashlib.sha256(encoded).hexdigest() != supplied:
              raise SystemExit("result digest is invalid")
          PY
          sha256sum "${OUTPUT_ROOT}"/* > "${OUTPUT_ROOT}/sha256sums.txt"
          for root in control original-v6 parent-control frozen prob4d; do
            git -C "${root}" diff --exit-code
            test -z "$(git -C "${root}" status --porcelain --untracked-files=all)"
          done

      - name: Upload query-sufficient dependence evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: deform360-query-sufficient-dependence-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_ROOT }}
          if-no-files-found: warn
          retention-days: 90

      - name: Remove isolated runtime
        if: always()
        shell: bash
        run: rm -rf -- "${VENV_ROOT:-}"
