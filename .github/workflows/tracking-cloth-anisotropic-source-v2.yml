# workflow-lifecycle: one-shot source-only development
# workflow-owner: IPS-Stuttgart maintainers
name: Tracking Cloth anisotropic source feasibility v2

on:
  push:
    branches: [science/tracking-cloth-anisotropic-source-v2]
    paths:
      - .github/requests/tracking-cloth-anisotropic-source-v2-run.json

permissions:
  contents: read

concurrency:
  group: tracking-cloth-anisotropic-source-v2
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Require one canonical source-only request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          request=.github/requests/tracking-cloth-anisotropic-source-v2-run.json
          test "$GITHUB_REF" = refs/heads/science/tracking-cloth-anisotropic-source-v2
          test "$PUSH_FORCED" = false
          mapfile -t changed < <(git diff --name-status "$BEFORE_SHA" "$GITHUB_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = $'A\t'"$request"
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          path = Path('.github/requests/tracking-cloth-anisotropic-source-v2-run.json')
          request = json.loads(path.read_text())
          expected = {
              'schema': 'tracking-cloth-anisotropic-source-v2-request',
              'mode': 'active_source_v2',
              'dataset_root': '/home/github-runner/.cache/datasets/tracking-cloth-deformation-v1-zenodo-14644526',
              'runner_label': 'gpuserver4090',
              'workers': 4,
              'authorize_target_scoring': False,
              'paper_claim_authorized': False,
              'evidence_class': 'public-real-data source-only development after prior twist exposure; no target or confirmation claim',
          }
          if any(request.get(key) != value for key, value in expected.items()):
              raise SystemExit('request fields differ from source-only contract')
          parent = subprocess.check_output(
              ['git', 'rev-parse', f"{os.environ['GITHUB_SHA']}^"], text=True
          ).strip()
          if request.get('expected_source_revision') != parent:
              raise SystemExit('request is not bound to its immediate parent revision')
          if not request.get('request_id'):
              raise SystemExit('request_id must be nonempty')
          allowed = set(expected) | {'request_id', 'expected_source_revision'}
          if set(request) - allowed:
              raise SystemExit('unknown request fields')
          PY

  source:
    needs: authorize
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 90
    env:
      DATASET_ROOT: /home/github-runner/.cache/datasets/tracking-cloth-deformation-v1-zenodo-14644526
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Prepare isolated source environment
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DATASET_ROOT"
          test -r "$DATASET_ROOT"
          venv="$RUNNER_TEMP/tracking-cloth-aniso-v2-venv-$GITHUB_RUN_ID"
          output="$RUNNER_TEMP/tracking-cloth-aniso-v2-$GITHUB_RUN_ID"
          test ! -e "$venv"
          test ! -e "$output"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install -r experiments/tracking_cloth_deformation_v1/requirements.txt
          echo "CLOTH_PY=$venv/bin/python" >> "$GITHUB_ENV"
          echo "CLOTH_VENV=$venv" >> "$GITHUB_ENV"
          echo "CLOTH_OUT=$output" >> "$GITHUB_ENV"
      - name: Run source-only anisotropic policy feasibility
        shell: bash
        run: |
          set -euo pipefail
          "$CLOTH_PY" -m experiments.tracking_cloth_deformation_v1.active_probe_anisotropic_source_v2 \
            --dataset-root "$DATASET_ROOT" \
            --output "$CLOTH_OUT" \
            --stage source \
            --workers 4
          cp .github/requests/tracking-cloth-anisotropic-source-v2-run.json \
            "$CLOTH_OUT/evaluation_request.json"
      - name: Publish source-only summary
        if: always() && env.CLOTH_OUT != ''
        shell: bash
        run: |
          if test -f "$CLOTH_OUT/report.md"; then
            cat "$CLOTH_OUT/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f "$CLOTH_OUT/failure.json"; then
            cat "$CLOTH_OUT/failure.json" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload aggregate source evidence only
        if: always() && env.CLOTH_OUT != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: tracking-cloth-anisotropic-source-v2-${{ github.run_id }}
          path: |
            ${{ env.CLOTH_OUT }}/*.json
            ${{ env.CLOTH_OUT }}/*.csv
            ${{ env.CLOTH_OUT }}/report.md
            ${{ env.CLOTH_OUT }}/DATA_LICENSE.txt
          retention-days: 30
          if-no-files-found: error
      - name: Remove isolated environment
        if: always()
        shell: bash
        run: |
          if test -n "${CLOTH_OUT:-}"; then rm -rf "$CLOTH_OUT"; fi
          if test -n "${CLOTH_VENV:-}"; then rm -rf "$CLOTH_VENV"; fi
