name: Execute golden-path post-cleanup validator repair

on:
  pull_request:
    branches:
      - agent/golden-path-decision-artifacts-v1
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.head.ref ==
      'agent/execute-golden-path-post-validator'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact target branch
        uses: actions/checkout@v7
        with:
          ref: agent/golden-path-decision-artifacts-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Replace the dead temporary-venv validator
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(
              ".github/workflows/three-repository-golden-path.yml"
          )
          text = path.read_text(encoding="utf-8")
          start_marker = (
              '          "${RUNNER_TEMP}/three-repository-venv/bin/python" '
              "-I - <<'PY'\n"
          )
          end_marker = "          PY\n"
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          replacement = r'''          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def reject_duplicate_keys(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise SystemExit(f"duplicate JSON key: {key}")
                  result[key] = value
              return result

          def reject_nonfinite(value):
              raise SystemExit(f"non-finite JSON constant: {value}")

          def load_json(path):
              with path.open("r", encoding="utf-8") as stream:
                  return json.load(
                      stream,
                      object_pairs_hook=reject_duplicate_keys,
                      parse_constant=reject_nonfinite,
                  )

          def canonical_sha256(value):
              payload = json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              ).encode("utf-8")
              return hashlib.sha256(payload).hexdigest()

          def require_digest(value, name):
              if (
                  type(value) is not str
                  or len(value) != 64
                  or any(character not in "0123456789abcdef" for character in value)
              ):
                  raise SystemExit(f"{name} is not a lowercase SHA-256 digest")
              return value

          def validate_array_identity(record, name):
              expected = {
                  "array_id",
                  "dtype",
                  "shape",
                  "nbytes",
                  "payload_sha256",
              }
              if set(record) != expected:
                  raise SystemExit(f"{name} array identity fields changed")
              require_digest(record["payload_sha256"], f"{name} payload")
              descriptor = {
                  key: record[key]
                  for key in ("dtype", "shape", "nbytes", "payload_sha256")
              }
              if require_digest(record["array_id"], f"{name} array ID") != canonical_sha256(descriptor):
                  raise SystemExit(f"{name} array ID does not match its descriptor")

          def validate_selection(record, decision):
              if record.get("decision") != decision:
                  raise SystemExit(f"{decision} artifact has wrong decision")
              descriptor = {
                  key: value
                  for key, value in record.items()
                  if key != "artifact_id"
              }
              if require_digest(record.get("artifact_id"), f"{decision} artifact ID") != canonical_sha256(descriptor):
                  raise SystemExit(f"{decision} artifact ID does not match its payload")
              for field in (
                  "observation_artifact_id",
                  "twin_belief_id",
                  "physical_posterior_id",
                  "provider_manifest_id",
                  "run_manifest_id",
                  "evidence_fingerprint",
              ):
                  require_digest(record.get(field), f"{decision} {field}")
              for field in (
                  "baseline_identity",
                  "candidate_identity",
                  "selected_identity",
              ):
                  validate_array_identity(record[field], f"{decision} {field}")

          root = Path(os.environ["EVIDENCE_ROOT"]).resolve()
          expected = {
              "accepted-selection.json",
              "exact-prob4d-observation.npz",
              "golden-path-bundle.json",
              "lineage-bound-physical-posterior.npz",
              "lineage-bound-twin-belief.npz",
              "profile-bound.npz",
              "rejected-selection.json",
              "run-manifest-v2.json",
          }
          actual = {path.name for path in root.iterdir() if path.is_file()}
          if actual != expected:
              raise SystemExit(
                  f"golden-path evidence roster changed: "
                  f"missing={sorted(expected - actual)}, "
                  f"extra={sorted(actual - expected)}"
              )

          manifest = load_json(root / "run-manifest-v2.json")
          accepted = load_json(root / "accepted-selection.json")
          rejected = load_json(root / "rejected-selection.json")
          bundle = load_json(root / "golden-path-bundle.json")

          manifest_id = require_digest(manifest.get("manifest_id"), "run manifest ID")
          manifest_descriptor = {
              key: value
              for key, value in manifest.items()
              if key != "manifest_id"
          }
          if manifest_id != canonical_sha256(manifest_descriptor):
              raise SystemExit("run manifest ID does not match its payload")
          evidence_fingerprint = require_digest(
              manifest.get("evidence_fingerprint"),
              "evidence fingerprint",
          )
          scientific_descriptor = {
              key: value
              for key, value in manifest.items()
              if key not in {
                  "manifest_id",
                  "evidence_fingerprint",
                  "created_utc",
                  "notes",
              }
          }
          if evidence_fingerprint != canonical_sha256(scientific_descriptor):
              raise SystemExit("evidence fingerprint does not match its payload")

          for artifact in [*manifest.get("inputs", []), *manifest.get("outputs", [])]:
              artifact_path = root / artifact["path"]
              if not artifact_path.is_file():
                  raise SystemExit(f"manifest artifact is missing: {artifact['path']}")
              data = artifact_path.read_bytes()
              if len(data) != artifact["size_bytes"]:
                  raise SystemExit(f"manifest artifact size changed: {artifact['path']}")
              if hashlib.sha256(data).hexdigest() != artifact["sha256"]:
                  raise SystemExit(f"manifest artifact digest changed: {artifact['path']}")

          validate_selection(accepted, "accepted")
          validate_selection(rejected, "rejected")
          if bundle.get("accepted") != accepted or bundle.get("rejected") != rejected:
              raise SystemExit("accepted/rejected pair does not match the bundle")
          bundle_descriptor = {
              key: value
              for key, value in bundle.items()
              if key != "bundle_id"
          }
          bundle_id = require_digest(bundle.get("bundle_id"), "bundle ID")
          if bundle_id != canonical_sha256(bundle_descriptor):
              raise SystemExit("bundle ID does not match its payload")

          shared_fields = (
              "case_id",
              "protocol_id",
              "observation_artifact_id",
              "twin_belief_id",
              "physical_posterior_id",
              "provider_manifest_id",
              "run_manifest_id",
              "evidence_fingerprint",
              "repository_revisions",
              "wheel_sha256",
              "package_versions",
              "baseline_identity",
              "candidate_identity",
          )
          for field in shared_fields:
              if accepted[field] != rejected[field]:
                  raise SystemExit(f"accepted/rejected artifacts disagree on {field}")
          if accepted["run_manifest_id"] != manifest_id or rejected["run_manifest_id"] != manifest_id:
              raise SystemExit("decision artifact changed run-manifest binding")
          if accepted["evidence_fingerprint"] != evidence_fingerprint:
              raise SystemExit("accepted artifact changed evidence fingerprint")
          if rejected["evidence_fingerprint"] != evidence_fingerprint:
              raise SystemExit("rejected artifact changed evidence fingerprint")
          if accepted.get("candidate_accepted") is not True:
              raise SystemExit("accepted artifact does not accept the candidate")
          if accepted["selected_identity"] != accepted["candidate_identity"]:
              raise SystemExit("accepted artifact does not select candidate bytes")
          if accepted.get("exact_fallback_identity") is not None:
              raise SystemExit("accepted artifact unexpectedly claims fallback")
          if rejected.get("candidate_accepted") is not False:
              raise SystemExit("rejected artifact accepts the candidate")
          if rejected["selected_identity"] != rejected["baseline_identity"]:
              raise SystemExit("rejected artifact does not select baseline bytes")
          if rejected.get("exact_fallback_identity") != rejected["baseline_identity"]["array_id"]:
              raise SystemExit("rejected artifact changed exact fallback identity")

          with open(
              os.environ["GITHUB_STEP_SUMMARY"],
              "a",
              encoding="utf-8",
          ) as summary:
              summary.write("### Golden-path decision artifacts\n\n")
              summary.write(f"- Bundle ID: `{bundle_id}`\n")
              summary.write(f"- Accepted artifact: `{accepted['artifact_id']}`\n")
              summary.write(f"- Rejected artifact: `{rejected['artifact_id']}`\n")
              summary.write(
                  "- Exact fallback identity: "
                  f"`{rejected['exact_fallback_identity']}`\n"
              )
              summary.write(f"- Run manifest: `{manifest_id}`\n")
              summary.write(
                  "- Evidence admission: `promotable` "
                  "(typed validation completed inside the isolated installed-wheel test)\n\n"
              )
              summary.write(
                  "The accepted record demonstrates the admitted candidate "
                  "routing contract. The rejected record demonstrates exact "
                  "baseline-byte fallback. Neither record is an accuracy, "
                  "calibration, transfer, or physical-benefit claim.\n"
              )
          PY
'''
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY

      - name: Validate workflow policy and syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tests/test_three_repository_workflow.py
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path(".github/workflows/three-repository-golden-path.yml")
          yaml.safe_load(path.read_text(encoding="utf-8"))
          PY
          if grep -Fq '${RUNNER_TEMP}/three-repository-venv/bin/python' \
            .github/workflows/three-repository-golden-path.yml; then
            echo "dead temporary-venv validator remains" >&2
            exit 1
          fi
          git diff --check

      - name: Push the workflow-only repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "The post-cleanup validator is already repaired."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/three-repository-golden-path.yml
          git commit -m "Validate golden-path evidence after environment cleanup"
          git push origin HEAD:agent/golden-path-decision-artifacts-v1
