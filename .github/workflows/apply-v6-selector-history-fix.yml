name: Apply Deform360 v6 selector history repair

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/apply-v6-selector-history-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/fix-v6-selector-history'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply reviewed repair and remove transport workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path(
              ".github/workflows/deform360-v6-source-prediction-evidence.yml"
          )
          workflow = workflow_path.read_text(encoding="utf-8")
          checkout_anchor = (
              "      - name: Check out Causal4D source for exact-file discovery\n"
          )
          start = workflow.index(checkout_anchor)
          stop = workflow.index("\n      - name:", start + len(checkout_anchor))
          checkout = workflow[start:stop]
          if checkout.count("fetch-depth: 1") != 1:
              raise SystemExit("unexpected Causal4D discovery checkout")
          checkout = checkout.replace("fetch-depth: 1", "fetch-depth: 0", 1)
          workflow = workflow[:start] + checkout + workflow[stop:]
          workflow_path.write_text(workflow, encoding="utf-8")

          runner_path = Path("scripts/ci/run_deform360_v6_source_prediction_evidence.sh")
          runner = runner_path.read_text(encoding="utf-8")
          old = r'''set_stage "locate-frozen-generic-selector"
          GENERIC_SELECTOR_SOURCE=""
          while IFS= read -r candidate; do
            [[ -f "${candidate}" && ! -L "${candidate}" ]] || continue
            if [[ "$(sha256_file "${candidate}")" = "${SELECTOR_SHA256}" ]]; then
              GENERIC_SELECTOR_SOURCE="${candidate}"
              break
            fi
          done < <(
            find \
              "${RUNNER_WORKSPACE:-/home/github-runner}" \
              /home/github-runner \
              -type f -path '*/src/causal4d_public/deform360_object_sam2.py' \
              2>/dev/null | sort -u
          )
          test -n "${GENERIC_SELECTOR_SOURCE}" \
            || fail_incomplete "frozen generic SAM2 selector source is unavailable"
          GENERIC_SELECTOR_ROOT="$(dirname "$(dirname "${GENERIC_SELECTOR_SOURCE}")")"
          '''
          new = r'''set_stage "locate-frozen-generic-selector"
          GENERIC_SELECTOR_SOURCE=""
          SELECTOR_RELATIVE_PATH="src/causal4d_public/deform360_object_sam2.py"
          CAUSAL4D_DISCOVERY_REPO="${GITHUB_WORKSPACE}/_causal4d_discovery"
          while IFS= read -r candidate; do
            [[ -f "${candidate}" && ! -L "${candidate}" ]] || continue
            if [[ "$(sha256_file "${candidate}")" = "${SELECTOR_SHA256}" ]]; then
              GENERIC_SELECTOR_SOURCE="${candidate}"
              break
            fi
          done < <(
            find \
              "${RUNNER_WORKSPACE:-/home/github-runner}" \
              /home/github-runner \
              -type f -path "*/${SELECTOR_RELATIVE_PATH}" \
              2>/dev/null | sort -u
          )
          if [[ -z "${GENERIC_SELECTOR_SOURCE}" \
            && -d "${CAUSAL4D_DISCOVERY_REPO}/.git" ]]; then
            SELECTOR_HISTORY_REVISION=""
            SELECTOR_HISTORY_CANDIDATE="${RUN_ROOT}/.frozen-selector-candidate.py"
            while IFS= read -r revision; do
              [[ -n "${revision}" ]] || continue
              if git -C "${CAUSAL4D_DISCOVERY_REPO}" show \
                "${revision}:${SELECTOR_RELATIVE_PATH}" \
                > "${SELECTOR_HISTORY_CANDIDATE}" 2>/dev/null \
                && [[ "$(sha256_file "${SELECTOR_HISTORY_CANDIDATE}")" \
                  = "${SELECTOR_SHA256}" ]]; then
                SELECTOR_HISTORY_REVISION="${revision}"
                break
              fi
            done < <(
              git -C "${CAUSAL4D_DISCOVERY_REPO}" log \
                --all --format='%H' -- "${SELECTOR_RELATIVE_PATH}"
            )
            rm -f "${SELECTOR_HISTORY_CANDIDATE}"
            if [[ -n "${SELECTOR_HISTORY_REVISION}" ]]; then
              SELECTOR_HISTORY_ROOT=(
                "${RUN_ROOT}/frozen-causal4d-${SELECTOR_HISTORY_REVISION}"
              )
              SELECTOR_HISTORY_ROOT="${SELECTOR_HISTORY_ROOT[0]}"
              SELECTOR_HISTORY_SOURCE=(
                "${SELECTOR_HISTORY_ROOT}/${SELECTOR_RELATIVE_PATH}"
              )
              SELECTOR_HISTORY_SOURCE="${SELECTOR_HISTORY_SOURCE[0]}"
              if [[ ! -f "${SELECTOR_HISTORY_SOURCE}" ]]; then
                rm -rf "${SELECTOR_HISTORY_ROOT}"
                mkdir -p "${SELECTOR_HISTORY_ROOT}"
                git -C "${CAUSAL4D_DISCOVERY_REPO}" archive \
                  "${SELECTOR_HISTORY_REVISION}" src/causal4d_public \
                  | tar -xf - -C "${SELECTOR_HISTORY_ROOT}" \
                  || fail_invalid "cannot materialize frozen Causal4D selector source"
              fi
              if [[ -f "${SELECTOR_HISTORY_SOURCE}" \
                && ! -L "${SELECTOR_HISTORY_SOURCE}" \
                && "$(sha256_file "${SELECTOR_HISTORY_SOURCE}")" \
                  = "${SELECTOR_SHA256}" ]]; then
                GENERIC_SELECTOR_SOURCE="${SELECTOR_HISTORY_SOURCE}"
                echo "frozen selector source revision=${SELECTOR_HISTORY_REVISION}"
              fi
            fi
          fi
          test -n "${GENERIC_SELECTOR_SOURCE}" \
            || fail_incomplete "frozen generic SAM2 selector source is unavailable"
          GENERIC_SELECTOR_ROOT="$(dirname "$(dirname "${GENERIC_SELECTOR_SOURCE}")")"
          '''
          if runner.count(old) != 1:
              raise SystemExit("unexpected frozen-selector discovery block")
          runner_path.write_text(runner.replace(old, new, 1), encoding="utf-8")

          test_path = Path(
              "tests/test_deform360_joint_sparse_geometric_v4_v6_source_execution.py"
          )
          tests = test_path.read_text(encoding="utf-8")
          workflow_needle = '    assert "git push" not in text\n'
          workflow_insert = '''    causal4d_checkout = next(
              step
              for step in evidence["steps"]
              if step["name"] == "Check out Causal4D source for exact-file discovery"
          )
          assert causal4d_checkout["with"]["fetch-depth"] == "0"
          '''
          if tests.count(workflow_needle) != 1:
              raise SystemExit("unexpected workflow-policy test")
          tests = tests.replace(
              workflow_needle,
              workflow_needle + workflow_insert,
              1,
          )
          runner_needle = '    assert "sam2.1_hiera_large.pt" not in text\n'
          runner_insert = '''    assert (
              'SELECTOR_RELATIVE_PATH="src/causal4d_public/'
              'deform360_object_sam2.py"' in text
          )
          assert 'git -C "${CAUSAL4D_DISCOVERY_REPO}" log' in text
          assert "--all --format='%H'" in text
          assert 'git -C "${CAUSAL4D_DISCOVERY_REPO}" archive' in text
          '''
          if tests.count(runner_needle) != 1:
              raise SystemExit("unexpected source-runner test")
          tests = tests.replace(
              runner_needle,
              runner_needle + runner_insert,
              1,
          )
          test_path.write_text(tests, encoding="utf-8")

          Path(".github/workflows/apply-v6-selector-history-fix.yml").unlink()
          PY

          bash -n scripts/ci/run_deform360_v6_source_prediction_evidence.sh
          python -m compileall -q \
            tests/test_deform360_joint_sparse_geometric_v4_v6_source_execution.py
          git diff --check
          git diff -- \
            .github/workflows/deform360-v6-source-prediction-evidence.yml \
            scripts/ci/run_deform360_v6_source_prediction_evidence.sh \
            tests/test_deform360_joint_sparse_geometric_v4_v6_source_execution.py
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/deform360-v6-source-prediction-evidence.yml \
            scripts/ci/run_deform360_v6_source_prediction_evidence.sh \
            tests/test_deform360_joint_sparse_geometric_v4_v6_source_execution.py \
            .github/workflows/apply-v6-selector-history-fix.yml
          git commit -m "Discover frozen selector from Causal4D history"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
