name: PR 175 canonical format export

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/pr175-format-export.yml"
      - "src/bayesian_phystwin/prob4d_visual_bias_stream.py"
      - "tests/test_prob4d_visual_bias_stream.py"
      - "tests/test_prob4d_visual_bias_stream_crossrepo.py"

permissions:
  contents: read

concurrency:
  group: pr175-format-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 10
    steps:
      - name: Check out exact reviewed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Produce canonical Ruff output
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/pr175-format-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "${root}"
          python -m venv "${root}/venv"
          "${root}/venv/bin/python" -m pip install \
            "pip==25.2" \
            "ruff==0.16.1"
          "${root}/venv/bin/python" -m ruff check --fix --select I001 \
            src/bayesian_phystwin/prob4d_visual_bias_stream.py \
            tests/test_prob4d_visual_bias_stream.py \
            tests/test_prob4d_visual_bias_stream_crossrepo.py
          "${root}/venv/bin/python" -m ruff format \
            src/bayesian_phystwin/prob4d_visual_bias_stream.py \
            tests/test_prob4d_visual_bias_stream.py \
            tests/test_prob4d_visual_bias_stream_crossrepo.py

      - name: Upload formatted files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr175-canonical-files-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            src/bayesian_phystwin/prob4d_visual_bias_stream.py
            tests/test_prob4d_visual_bias_stream.py
            tests/test_prob4d_visual_bias_stream_crossrepo.py
          if-no-files-found: error
          retention-days: 1
