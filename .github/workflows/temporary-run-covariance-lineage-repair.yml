name: Temporary run covariance source-lineage repair

on:
  push:
    branches:
      - agent/full22-covariance-only-hybrid-v1
    paths:
      - ".github/workflows/temporary-run-covariance-lineage-repair.yml"

permissions:
  contents: write

concurrency:
  group: temporary-run-covariance-lineage-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/full22-covariance-only-hybrid-v1
          fetch-depth: 1
          persist-credentials: true
          clean: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Apply and validate the source-lineage repair
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python scripts/temporary_patch_covariance_source_lineage.py
          files=(
            scripts/science/run_full22_covariance_only_hybrid_v1.py
            src/bayesian_phystwin/covariance_only_hybrid.py
            src/bayesian_phystwin/covariance_only_hybrid_analysis.py
            tests/test_covariance_only_hybrid.py
            tests/test_full22_covariance_only_hybrid_v1.py
          )
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m mypy \
            src/bayesian_phystwin/covariance_only_hybrid.py \
            src/bayesian_phystwin/covariance_only_hybrid_analysis.py \
            scripts/science/run_full22_covariance_only_hybrid_v1.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_covariance_only_hybrid.py \
            tests/test_full22_covariance_only_hybrid_v1.py \
            tests/test_pull_request_workflow_integrity.py
          rm -f \
            scripts/temporary_patch_covariance_source_lineage.py \
            .github/workflows/temporary-run-covariance-lineage-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bind covariance analysis to sealed source lineage"
          git push origin HEAD:agent/full22-covariance-only-hybrid-v1
