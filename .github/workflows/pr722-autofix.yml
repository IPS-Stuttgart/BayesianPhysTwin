name: PR 722 autofix artifact

on:
  push:
    branches:
      - agent/physical-cause-certificates-v2

permissions:
  contents: read

jobs:
  build-autofix:
    if: github.event.head_commit.message == 'chore: prepare PR 722 autofix'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-cov ruff mypy

      - name: Apply deterministic repairs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          lifecycle_path = Path('api/public-module-lifecycle-v1.json')
          lifecycle = json.loads(lifecycle_path.read_text(encoding='utf-8'))
          module = 'bayesian_phystwin.physical_cause_evidence_v2'
          experimental = lifecycle['experimental_modules']
          if module in experimental:
              experimental.remove(module)
          lifecycle_path.write_text(
              json.dumps(lifecycle, indent=2) + '\n',
              encoding='utf-8',
          )

          suites_path = Path('.github/quality/test-suites.json')
          suites = json.loads(suites_path.read_text(encoding='utf-8'))
          test_path = 'tests/test_physical_cause_evidence_v2.py'
          stable = suites['suites']['stable-core-coverage']
          if test_path not in stable:
              stable.append(test_path)
          suites_path.write_text(
              json.dumps(suites, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          python -m ruff format -- \
            src/bayesian_phystwin/physical_cause_evidence_v2.py \
            tests/test_physical_cause_evidence_v2.py
          git diff --check

      - name: Prepare repair artifact
        run: |
          mkdir -p \
            pr722-autofix/src/bayesian_phystwin \
            pr722-autofix/tests \
            pr722-autofix/api \
            pr722-autofix/.github/quality
          cp src/bayesian_phystwin/physical_cause_evidence_v2.py \
            pr722-autofix/src/bayesian_phystwin/
          cp tests/test_physical_cause_evidence_v2.py pr722-autofix/tests/
          cp api/public-module-lifecycle-v1.json pr722-autofix/api/
          cp .github/quality/test-suites.json pr722-autofix/.github/quality/
          git diff --binary -- \
            src/bayesian_phystwin/physical_cause_evidence_v2.py \
            tests/test_physical_cause_evidence_v2.py \
            api/public-module-lifecycle-v1.json \
            .github/quality/test-suites.json \
            > pr722-autofix/pr722-autofix.patch
          git diff --stat > pr722-autofix/diff-stat.txt

      - name: Verify formatting and lint
        run: |
          set -o pipefail
          {
            python -m ruff check -- \
              src/bayesian_phystwin/physical_cause_evidence_v2.py \
              tests/test_physical_cause_evidence_v2.py
            python -m ruff format --check -- \
              src/bayesian_phystwin/physical_cause_evidence_v2.py \
              tests/test_physical_cause_evidence_v2.py
          } 2>&1 | tee pr722-autofix/ruff.txt

      - name: Verify strict typing
        run: |
          set -o pipefail
          python -m mypy --strict \
            src/bayesian_phystwin/physical_cause_evidence_v2.py \
            2>&1 | tee pr722-autofix/mypy.txt

      - name: Run focused contract tests
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_physical_cause_evidence_v2.py \
            tests/test_public_module_lifecycle.py \
            tests/test_test_suite_manifest.py \
            2>&1 | tee pr722-autofix/pytest-focused.txt

      - name: Check new-module coverage
        run: |
          set -o pipefail
          python -m pytest -q tests/test_physical_cause_evidence_v2.py \
            --cov=bayesian_phystwin.physical_cause_evidence_v2 \
            --cov-branch \
            --cov-report=term-missing \
            2>&1 | tee pr722-autofix/coverage-focused.txt

      - name: Upload deterministic repair
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr722-autofix
          path: pr722-autofix
          if-no-files-found: error
          retention-days: 2
