# workflow-lifecycle: one-off
# workflow-owner: IPS-Stuttgart maintainers
# Branch-only retrospective diagnostic; do not merge this launcher into main.
name: GP small-data stronger-ridge control
on:
  push:
    branches: [science/gp-ridge-control-20260908]
    paths:
      - experiments/gp_ridge_small_data_control_v1.py
      - .github/workflows/gp-ridge-small-data-control-v1.yml
permissions:
  contents: read
concurrency:
  group: gp-ridge-small-data-control-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare:
    runs-on: [self-hosted, Linux, X64, gpuserver6000]
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Create isolated environment
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/gp-ridge-small-data-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$root"
          python -m venv "$root/venv"
          "$root/venv/bin/python" -m pip install numpy==1.26.4 scipy==1.15.3 scikit-learn==1.7.2 pytest==8.3.5
          echo "FROZEN_PYTHON=$root/venv/bin/python" >> "$GITHUB_ENV"
          echo "OUTPUT_ROOT=$root" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "EXPERIMENT_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Run numerical and selection-boundary tests
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_ROOT/tests"
          cp tests/test_gaussian_residual_v1.py "$OUTPUT_ROOT/tests/test_gaussian_residual_v1.py"
          "$FROZEN_PYTHON" -m pytest -q -c /dev/null --confcutdir="$OUTPUT_ROOT/tests" "$OUTPUT_ROOT/tests/test_gaussian_residual_v1.py" --junitxml="$OUTPUT_ROOT/tests.xml" | tee "$OUTPUT_ROOT/tests.log"
          "$FROZEN_PYTHON" experiments/gp_ridge_small_data_control_v1.py --self-test | tee "$OUTPUT_ROOT/selection-test.log"
      - name: Compare on pinned historical development caches
        run: |
          set -euo pipefail
          "$FROZEN_PYTHON" experiments/gp_ridge_small_data_control_v1.py \
            --cache /home/github-runner/.cache/bpt-gp-residual-pilot-v1 \
            --output "$OUTPUT_ROOT/results" | tee "$OUTPUT_ROOT/execution.log"
      - name: Retain selected predictions and complete comparison
        if: always() && env.OUTPUT_ROOT != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gp-ridge-small-data-control-${{ github.run_id }}
          path: |
            ${{ env.OUTPUT_ROOT }}/results
            ${{ env.OUTPUT_ROOT }}/*.log
            ${{ env.OUTPUT_ROOT }}/tests.xml
          if-no-files-found: warn
          retention-days: 90
