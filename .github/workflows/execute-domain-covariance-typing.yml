name: Execute domain covariance typing repair

on:
  pull_request:
    branches:
      - agent/domain-covariance-calibration-v1-clean
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  execute:
    if: >-
      github.event.pull_request.head.ref ==
      'agent/execute-domain-covariance-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact target branch
        uses: actions/checkout@v7
        with:
          ref: agent/domain-covariance-calibration-v1-clean
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Narrow normalized held-score types
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "src/bayesian_phystwin/domain_covariance_calibration.py"
          )
          text = path.read_text(encoding="utf-8")
          replacements = {
              "from typing import Any\n": "from typing import Any, cast\n",
              "    def mean_loo_nll_improvement(self) -> float:\n"
              "        return float(np.mean([row[3] - row[4] for row in self.leave_one_group_out]))\n":
              "    def mean_loo_nll_improvement(self) -> float:\n"
              "        held = cast(Sequence[HeldGroupScore], self.leave_one_group_out)\n"
              "        return float(np.mean([row[3] - row[4] for row in held]))\n",
              "    def worst_loo_nll_regression(self) -> float:\n"
              "        return max(0.0, max(row[4] - row[3] for row in self.leave_one_group_out))\n":
              "    def worst_loo_nll_regression(self) -> float:\n"
              "        held = cast(Sequence[HeldGroupScore], self.leave_one_group_out)\n"
              "        return max(0.0, max(row[4] - row[3] for row in held))\n",
              "                for row in self.leave_one_group_out\n":
              "                for row in cast(\n"
              "                    Sequence[HeldGroupScore], self.leave_one_group_out\n"
              "                )\n",
          }
          for old, new in replacements.items():
              if new in text:
                  continue
              if text.count(old) != 1:
                  raise RuntimeError(f"typing patch target changed: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate formatting and strict changed-module typing
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          ruff format src/bayesian_phystwin/domain_covariance_calibration.py
          ruff check src/bayesian_phystwin/domain_covariance_calibration.py
          ruff format --check src/bayesian_phystwin/domain_covariance_calibration.py
          python -m mypy src/bayesian_phystwin/domain_covariance_calibration.py

      - name: Publish the reviewed target fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bayesian_phystwin/domain_covariance_calibration.py
          if git diff --cached --quiet; then
            echo "Target already contains the typing repair."
            exit 0
          fi
          git commit -m "Narrow covariance decision score types"
          git push origin HEAD:agent/domain-covariance-calibration-v1-clean
