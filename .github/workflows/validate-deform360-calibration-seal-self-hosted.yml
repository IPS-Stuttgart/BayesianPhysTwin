name: Validate Deform360 calibration seal self-hosted

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validate-deform360-calibration-seal-self-hosted.yml"

permissions:
  contents: read

concurrency:
  group: validate-deform360-calibration-seal-self-hosted-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/deform360-calibration-seal'
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 20
    steps:
      - name: Check out exact pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
          clean: true
          fetch-depth: 0

      - name: Install isolated user-site validation tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install \
            --user \
            --break-system-packages \
            -e ".[dev]"
          python3 -m pip install \
            --user \
            --break-system-packages \
            "coverage==7.13.3"
          python3 -m pip check

      - name: Run focused quality and contract validation
        shell: bash
        run: |
          set -euo pipefail
          ruff_bin="$HOME/.local/bin/ruff"
          test -x "$ruff_bin"
          files=(
            src/bayesian_phystwin/deform360_calibration_execution.py
            src/bayesian_phystwin/cli/deform360_calibration_execution.py
            src/bayesian_phystwin/cli/_command_inventory.py
            src/bayesian_phystwin/cli/experiments.py
            tests/test_deform360_calibration_execution.py
            tests/test_deform360_calibration_execution_boundaries.py
          )
          "$ruff_bin" check "${files[@]}"
          "$ruff_bin" format --check "${files[@]}"
          python3 -m pytest -q \
            tests/test_deform360_calibration_execution.py \
            tests/test_deform360_calibration_execution_boundaries.py \
            tests/test_deform360_calibration_bundle.py \
            tests/test_deform360_visual_provider_lock.py \
            tests/test_evidence_use_ledger.py

      - name: Measure changed implementation coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 -m coverage erase
          python3 -m coverage run \
            --branch \
            --source=bayesian_phystwin \
            -m pytest -q \
            tests/test_deform360_calibration_execution.py \
            tests/test_deform360_calibration_execution_boundaries.py
          python3 -m coverage report \
            --include='src/bayesian_phystwin/deform360_calibration_execution.py,src/bayesian_phystwin/cli/deform360_calibration_execution.py' \
            --show-missing \
            --fail-under=90
