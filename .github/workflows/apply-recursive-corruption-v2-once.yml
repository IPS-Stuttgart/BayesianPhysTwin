name: Apply recursive-corruption v2 once

on:
  push:
    branches:
      - science/recursive-corruption-v2-matched-guards

permissions:
  contents: write

concurrency:
  group: apply-recursive-corruption-v2-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v7
        with:
          ref: science/recursive-corruption-v2-matched-guards
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Materialize reviewed source payload
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/recursive-corruption-v2.b64" <<'PAYLOAD'
[...truncated for display...]
PAYLOAD
          base64 -d "$RUNNER_TEMP/recursive-corruption-v2.b64" > "$RUNNER_TEMP/recursive-corruption-v2.tar.gz"
          echo 'e4c04130dc816c49f23d359241756df8aec7f366dcb5952f74560c7d64b61154  '"$RUNNER_TEMP/recursive-corruption-v2.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/recursive-corruption-v2.tar.gz"

      - name: Install and validate focused revision
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m ruff format \
            src/bayesian_phystwin/recursive_corruption_benchmark_v2.py \
            scripts/science/analyze_recursive_corruption_v2.py \
            scripts/science/run_recursive_corruption_v2.py \
            tests/test_recursive_corruption_benchmark_v2.py
          python -m ruff check --fix \
            src/bayesian_phystwin/recursive_corruption_benchmark_v2.py \
            scripts/science/analyze_recursive_corruption_v2.py \
            scripts/science/run_recursive_corruption_v2.py \
            tests/test_recursive_corruption_benchmark_v2.py
          python -m ruff format --check \
            src/bayesian_phystwin/recursive_corruption_benchmark_v2.py \
            scripts/science/analyze_recursive_corruption_v2.py \
            scripts/science/run_recursive_corruption_v2.py \
            tests/test_recursive_corruption_benchmark_v2.py
          python -m ruff check \
            src/bayesian_phystwin/recursive_corruption_benchmark_v2.py \
            scripts/science/analyze_recursive_corruption_v2.py \
            scripts/science/run_recursive_corruption_v2.py \
            tests/test_recursive_corruption_benchmark_v2.py
          python -m pytest -q tests/test_recursive_corruption_benchmark_v2.py
          python -m py_compile \
            src/bayesian_phystwin/recursive_corruption_benchmark_v2.py \
            scripts/science/analyze_recursive_corruption_v2.py \
            scripts/science/run_recursive_corruption_v2.py
          git diff --check

      - name: Commit reviewed revision and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-recursive-corruption-v2-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add matched-guard recursive corruption benchmark v2'
          git push origin HEAD:science/recursive-corruption-v2-matched-guards
