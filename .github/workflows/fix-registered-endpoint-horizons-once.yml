name: Fix registered endpoint horizons once

on:
  push:
    branches:
      - agent/deform360-residual-history-source-only-v1

permissions:
  contents: write

concurrency:
  group: fix-registered-endpoint-horizons-once
  cancel-in-progress: false

jobs:
  fix:
    if: github.repository == 'IPS-Stuttgart/BayesianPhysTwin'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/deform360-residual-history-source-only-v1
          fetch-depth: 1
          persist-credentials: true

      - name: Hard-bind consecutive endpoint horizons
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path(
              "src/bayesian_phystwin/"
              "_deform360_covariance_residual_history_registered_v1.py"
          )
          text = source.read_text(encoding="utf-8")
          old = '''        if np.any(steps < 1) or not np.all(np.diff(steps) > 0):
              raise ValueError("future_horizon_steps must be positive and increasing")
          '''
          new = '''        expected_steps = np.arange(1, len(steps) + 1, dtype=np.int64)
          if not np.array_equal(steps, expected_steps):
              raise ValueError(
                  "future_horizon_steps must be exactly consecutive from one"
              )
          '''
          if text.count(old) != 2:
              raise SystemExit(
                  f"expected two endpoint-step validators, found {text.count(old)}"
              )
          source.write_text(text.replace(old, new), encoding="utf-8")

          test = Path(
              "tests/"
              "test_portable_contracts_deform360_covariance_registered_donor_v1.py"
          )
          text = test.read_text(encoding="utf-8")
          replacements = {
              '"horizon_steps": np.asarray([1, 7, 14], dtype=np.int64),': (
                  '"horizon_steps": np.asarray([1, 2, 3], dtype=np.int64),'
              ),
              '(np.asarray([0, 2, 3], dtype=np.int64), "positive and increasing"),': (
                  '(np.asarray([0, 2, 3], dtype=np.int64), "exactly consecutive"),'
              ),
              '(np.asarray([1, 3, 2], dtype=np.int64), "positive and increasing"),': (
                  '(np.asarray([1, 3, 2], dtype=np.int64), "exactly consecutive"),'
              ),
              'with pytest.raises(ValueError, match="positive and increasing"):\n': (
                  'with pytest.raises(ValueError, match="exactly consecutive"):\n'
              ),
          }
          for old_value, new_value in replacements.items():
              if text.count(old_value) != 1:
                  raise SystemExit(
                      f"expected one test replacement for {old_value!r}, "
                      f"found {text.count(old_value)}"
                  )
              text = text.replace(old_value, new_value)
          anchor = '''        (np.asarray([1, 3, 2], dtype=np.int64), "exactly consecutive"),
          '''
          addition = '''        (np.asarray([1, 3, 2], dtype=np.int64), "exactly consecutive"),
                  (np.asarray([1, 3, 4], dtype=np.int64), "exactly consecutive"),
          '''
          if text.count(anchor) != 1:
              raise SystemExit("cannot add skipped-horizon regression")
          test.write_text(text.replace(anchor, addition), encoding="utf-8")

          docs = Path("docs/deform360_covariance_residual_history_source_only_v1.md")
          text = docs.read_text(encoding="utf-8")
          old_docs = '''The covariance donor is hard-bound to `independent_endpoint_v1` and the
          reference predictor to `last_residual`. The early/middle/late scale schedule is
          hard-bound to `[8, 16, 16]`; these values are not caller-selectable.
          '''
          new_docs = '''The covariance donor is hard-bound to `independent_endpoint_v1` and the
          reference predictor to `last_residual`. It uses exactly the consecutive future
          horizons `1...H`, matching the frozen full-22 donor; skipped or caller-selected
          forecast steps fail closed. The early/middle/late scale schedule is hard-bound
          to `[8, 16, 16]`; these values are not caller-selectable.
          '''
          if text.count(old_docs) != 1:
              raise SystemExit("cannot update source-only donor documentation")
          docs.write_text(text.replace(old_docs, new_docs), encoding="utf-8")
          PY

          python -m pip install -e '.[dev]'
          python -m ruff format \
            src/bayesian_phystwin/_deform360_covariance_residual_history_registered_v1.py \
            tests/test_portable_contracts_deform360_covariance_registered_donor_v1.py
          python -m ruff check \
            src/bayesian_phystwin/_deform360_covariance_residual_history_registered_v1.py \
            tests/test_portable_contracts_deform360_covariance_registered_donor_v1.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_portable_contracts_deform360_covariance_registered_donor_v1.py
          git diff --check

      - name: Commit the bounded correction and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-registered-endpoint-horizons-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Hard-bind consecutive independent-endpoint horizons'
          git push origin HEAD:agent/deform360-residual-history-source-only-v1
