name: Fix registered endpoint horizons once

on:
  push:
    branches:
      - agent/deform360-residual-history-source-only-v1

permissions:
  contents: write

concurrency:
  group: fix-registered-endpoint-horizons-once
  cancel-in-progress: false

jobs:
  fix:
    if: github.repository == 'IPS-Stuttgart/BayesianPhysTwin'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/deform360-residual-history-source-only-v1
          fetch-depth: 1
          persist-credentials: true

      - name: Hard-bind endpoint horizons and scale bins
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: Path, old: str, new: str, *, expected: int = 1) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} replacements, found {count}"
                  )
              path.write_text(text.replace(old, new), encoding="utf-8")

          registered = Path(
              "src/bayesian_phystwin/"
              "_deform360_covariance_residual_history_registered_v1.py"
          )
          replace_exact(
              registered,
              '''        if np.any(steps < 1) or not np.all(np.diff(steps) > 0):
              raise ValueError("future_horizon_steps must be positive and increasing")
          ''',
              '''        expected_steps = np.arange(1, len(steps) + 1, dtype=np.int64)
          if not np.array_equal(steps, expected_steps):
              raise ValueError(
                  "future_horizon_steps must be exactly consecutive from one"
              )
          ''',
              expected=2,
          )

          decision = Path(
              "src/bayesian_phystwin/"
              "_deform360_covariance_residual_history_decision_v1.py"
          )
          replace_exact(
              decision,
              '''    if np.any((bins < 0) | (bins >= len(HORIZON_LABELS))):
              raise ValueError(
                  "future_horizon_bins must use early/middle/late indices 0, 1, 2"
              )
              return bins
          ''',
              '''    if np.any((bins < 0) | (bins >= len(HORIZON_LABELS))):
              raise ValueError(
                  "future_horizon_bins must use early/middle/late indices 0, 1, 2"
              )
              expected = np.empty(future_count, dtype=np.int64)
              for label_index, indices in enumerate(
                  np.array_split(np.arange(future_count, dtype=np.int64), len(HORIZON_LABELS))
              ):
                  expected[indices] = label_index
              if not np.array_equal(bins, expected):
                  raise ValueError(
                      "future_horizon_bins must equal the canonical equal three-way partition"
                  )
              return bins
          ''',
          )

          test = Path(
              "tests/"
              "test_portable_contracts_deform360_covariance_registered_donor_v1.py"
          )
          replace_exact(
              test,
              '"horizon_steps": np.asarray([1, 7, 14], dtype=np.int64),',
              '"horizon_steps": np.asarray([1, 2, 3], dtype=np.int64),',
          )
          replace_exact(
              test,
              '(np.asarray([0, 2, 3], dtype=np.int64), "positive and increasing"),',
              '(np.asarray([0, 2, 3], dtype=np.int64), "exactly consecutive"),',
          )
          replace_exact(
              test,
              '(np.asarray([1, 3, 2], dtype=np.int64), "positive and increasing"),',
              '''(np.asarray([1, 3, 2], dtype=np.int64), "exactly consecutive"),
                  (np.asarray([1, 3, 4], dtype=np.int64), "exactly consecutive"),''',
          )
          replace_exact(
              test,
              'with pytest.raises(ValueError, match="positive and increasing"):\n',
              'with pytest.raises(ValueError, match="exactly consecutive"):\n',
          )
          anchor = '''def test_donor_and_execution_ids_are_tamper_evident() -> None:
          '''
          addition = '''def test_noncanonical_horizon_bins_fail_closed() -> None:
              arrays = _arrays()
              arrays["horizon_bins"] = np.asarray([0, 0, 2], dtype=np.int64)
              with pytest.raises(ValueError, match="canonical equal three-way partition"):
                  _run(arrays)


          def test_donor_and_execution_ids_are_tamper_evident() -> None:
          '''
          replace_exact(test, anchor, addition)

          docs = Path("docs/deform360_covariance_residual_history_source_only_v1.md")
          replace_exact(
              docs,
              '''The covariance donor is hard-bound to `independent_endpoint_v1` and the
          reference predictor to `last_residual`. The early/middle/late scale schedule is
          hard-bound to `[8, 16, 16]`; these values are not caller-selectable.
          ''',
              '''The covariance donor is hard-bound to `independent_endpoint_v1` and the
          reference predictor to `last_residual`. It uses exactly the consecutive future
          horizons `1...H`, matching the frozen full-22 donor; skipped or caller-selected
          forecast steps fail closed. Future frames are assigned to the canonical equal
          early/middle/late three-way partition, and the corresponding scale schedule is
          hard-bound to `[8, 16, 16]`; neither bins nor values are caller-selectable.
          ''',
          )
          PY

          python -m pip install -e '.[dev]'
          python -m ruff format \
            src/bayesian_phystwin/_deform360_covariance_residual_history_registered_v1.py \
            src/bayesian_phystwin/_deform360_covariance_residual_history_decision_v1.py \
            tests/test_portable_contracts_deform360_covariance_registered_donor_v1.py
          python -m ruff check \
            src/bayesian_phystwin/_deform360_covariance_residual_history_registered_v1.py \
            src/bayesian_phystwin/_deform360_covariance_residual_history_decision_v1.py \
            tests/test_portable_contracts_deform360_covariance_registered_donor_v1.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_portable_contracts_deform360_covariance_registered_donor_v1.py \
            tests/test_portable_contracts_deform360_covariance_residual_history_v1.py \
            tests/test_portable_contracts_deform360_covariance_residual_history_edges_v1.py
          git diff --check

      - name: Commit the bounded correction and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-registered-endpoint-horizons-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Hard-bind registered endpoint horizons and scale bins'
          git push origin HEAD:agent/deform360-residual-history-source-only-v1
