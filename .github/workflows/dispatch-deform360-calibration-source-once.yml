name: Dispatch frozen Deform360 calibration source once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-deform360-calibration-source-once.yml"

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: dispatch-deform360-calibration-source-once
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch reviewed ten-object calibration lane
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch exact main revision and locate the workflow run
        id: dispatch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}"
          workflow="deform360-official-hub-calibration-source.yml"
          headers=(
            --header "Authorization: Bearer ${GITHUB_TOKEN}"
            --header "Accept: application/vnd.github+json"
            --header "X-GitHub-Api-Version: 2022-11-28"
          )

          curl --fail-with-body --silent --show-error \
            --request POST \
            "${headers[@]}" \
            "${api}/actions/workflows/${workflow}/dispatches" \
            --data '{"ref":"main"}'

          run_id=""
          for _ in $(seq 1 30); do
            response="${RUNNER_TEMP}/workflow-runs.json"
            curl --fail-with-body --silent --show-error \
              "${headers[@]}" \
              "${api}/actions/workflows/${workflow}/runs?event=workflow_dispatch&branch=main&per_page=20" \
              > "${response}"
            run_id=$(python3 - "${response}" "${SOURCE_SHA}" <<'PY'
          import json
          from pathlib import Path
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected_sha = sys.argv[2]
          for run in payload.get("workflow_runs", []):
              if run.get("head_sha") == expected_sha:
                  print(run["id"])
                  break
          PY
            )
            if [[ -n "${run_id}" ]]; then
              break
            fi
            sleep 2
          done

          if [[ -z "${run_id}" ]]; then
            echo "The workflow dispatch was accepted, but its exact run was not found." >&2
            exit 1
          fi
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
          echo "Dispatched ${workflow} as run ${run_id} at ${SOURCE_SHA}."

      - name: Record the non-sensitive dispatch receipt on issue 148
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          receipt="${RUNNER_TEMP}/dispatch-receipt.json"
          python3 - "${receipt}" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          run_id = os.environ["RUN_ID"]
          source_sha = os.environ["SOURCE_SHA"]
          body = "\n".join(
              [
                  "## Ten-object calibration-source execution dispatched",
                  "",
                  f"- workflow run: `{run_id}`",
                  f"- exact reviewed `main` revision: `{source_sha}`",
                  "- frozen dataset selection: `deform360-official-hub-visuotactile-v1`",
                  "- authorized payload scope: the ten committed calibration objects only",
                  "- forbidden payload scope: all twelve confirmation objects and target outcomes",
                  "",
                  "This one-shot launcher opens no dataset itself. The dispatched permanent workflow retains technical failures without replacement and verifies that the confirmation cohort remains absent.",
              ]
          )
          Path(sys.argv[1]).write_text(
              json.dumps({"body": body}, sort_keys=True),
              encoding="utf-8",
          )
          PY
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/issues/148/comments" \
            --data-binary @"${receipt}"
