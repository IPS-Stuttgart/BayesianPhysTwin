# workflow-lifecycle: permanent
# workflow-owner: IPS-Stuttgart maintainers
name: DEFORM DLO4-DLO5 support-robust decision envelope v1

on:
  pull_request:
    paths:
      - ".github/workflows/deform-dlo45-support-envelope-v1.yml"
      - ".github/quality/workflow-inventory-budget-v1.json"
      - "src/bayesian_phystwin/support_robust_decision_certificate_v1.py"
      - "docs/support_robust_decision_certificate_v1.md"
      - "experiments/deform_dlo45_decision_identifiability_v1/support_envelope_audit.py"
      - "experiments/deform_dlo45_decision_identifiability_v1/support_envelope_protocol.json"
      - "tests/test_support_robust_decision_certificate_v1.py"
      - "tests/test_deform_dlo45_support_envelope_audit.py"
      - "tests/test_workflow_inventory_budget.py"
  push:
    branches: [main]
    paths:
      - ".github/requests/deform-dlo45-support-envelope-v1.json"

permissions:
  actions: read
  contents: read

concurrency:
  group: deform-dlo45-support-envelope-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  DATASET_ROOT: /mnt/seagate10tb/florianpfaff/datasets/deform/data_set
  PARENT_PROTOCOL: experiments/deform_dlo45_decision_identifiability_v1/protocol.json
  ENVELOPE_PROTOCOL: experiments/deform_dlo45_decision_identifiability_v1/support_envelope_protocol.json
  REQUEST_PATH: .github/requests/deform-dlo45-support-envelope-v1.json
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  contracts:
    name: Support-envelope contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install focused check environment
        run: python -m pip install -e . pytest ruff
      - name: Validate implementation and frozen protocol
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_support_robust_decision_certificate_v1.py \
            tests/test_deform_dlo45_support_envelope_audit.py \
            tests/test_query_decision_certificate_v1.py
          python -m ruff check \
            src/bayesian_phystwin/support_robust_decision_certificate_v1.py \
            experiments/deform_dlo45_decision_identifiability_v1/support_envelope_audit.py \
            tests/test_support_robust_decision_certificate_v1.py \
            tests/test_deform_dlo45_support_envelope_audit.py
          python -m ruff format --check \
            src/bayesian_phystwin/support_robust_decision_certificate_v1.py \
            experiments/deform_dlo45_decision_identifiability_v1/support_envelope_audit.py \
            tests/test_support_robust_decision_certificate_v1.py \
            tests/test_deform_dlo45_support_envelope_audit.py
          python -m py_compile \
            src/bayesian_phystwin/support_robust_decision_certificate_v1.py \
            experiments/deform_dlo45_decision_identifiability_v1/support_envelope_audit.py
          python - <<'PY'
          from pathlib import Path

          from experiments.deform_dlo45_decision_identifiability_v1.support_envelope_audit import (
              load_envelope_protocol,
          )

          protocol = load_envelope_protocol(
              Path(
                  "experiments/deform_dlo45_decision_identifiability_v1/"
                  "support_envelope_protocol.json"
              )
          )
          assert protocol["conformal"]["calibration_unit"] == "complete_trajectory"
          assert protocol["conformal"]["miscoverage"] == 0.2
          assert protocol["operational"]["target_tuning"] is False
          assert protocol["operational"]["target_retries"] is False
          PY

  authorize:
    name: Authorize one immutable request
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_revision: ${{ steps.request.outputs.source_revision }}
      request_id: ${{ steps.request.outputs.request_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Require one newly added request file
        id: request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$PUSH_FORCED" = false
          test "$BEFORE_SHA" != 0000000000000000000000000000000000000000
          mapfile -t changed < <(git diff --name-status "$BEFORE_SHA" "$GITHUB_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = $'A\t.github/requests/deform-dlo45-support-envelope-v1.json'
          REQUEST_PATH="$REQUEST_PATH" python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          request = json.loads(Path(os.environ["REQUEST_PATH"]).read_text())
          expected = {
              "contract": "deform-dlo45-support-envelope-request-v1",
              "schema_version": 1,
              "status": "authorized",
              "mode": "retrospective_within_dlo_evaluate",
              "dataset_root": os.environ["DATASET_ROOT"],
              "runner_label": "gpuserver4090",
              "parent_workflow_run_id": 33473378340,
              "source_only_calibration_first": True,
              "target_tuning": False,
              "target_retries": False,
              "fresh_confirmation": False,
              "paper_claim_authorized": False,
          }
          for key, expected_value in expected.items():
              assert request.get(key) == expected_value, (
                  key,
                  request.get(key),
                  expected_value,
              )
          assert set(request) == set(expected) | {
              "request_id",
              "expected_source_revision",
          }
          parent = subprocess.check_output(
              ["git", "rev-parse", f"{os.environ['GITHUB_SHA']}^"],
              text=True,
          ).strip()
          assert request["expected_source_revision"] == parent
          assert request["request_id"]
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as stream:
              stream.write(f"source_revision={parent}\n")
              stream.write(f"request_id={request['request_id']}\n")
          PY

  evaluate:
    name: Trajectory-conformal DEFORM audit / gpuserver4090
    needs: [contracts, authorize]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      needs.contracts.result == 'success' &&
      needs.authorize.result == 'success'
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.source_revision }}
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Prepare isolated execution and parent evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ARTIFACT_ID: "9787311310"
          SOURCE_ARTIFACT_SHA256: fdb35f680e4cf685303f841b8974c16eb9301ad52cbdc8f5af0d87a9dfc358ee
          TARGET_ARTIFACT_ID: "9787322207"
          TARGET_ARTIFACT_SHA256: 588e006efe45d5f6bbc5459f9f031a4c4f92c28aaaf4004ef4c0d5c85eba5663
        run: |
          set -euo pipefail
          test -d "$DATASET_ROOT/DLO4/train"
          test -d "$DATASET_ROOT/DLO4/eval"
          test -d "$DATASET_ROOT/DLO5/train"
          test -d "$DATASET_ROOT/DLO5/eval"
          venv="$RUNNER_TEMP/dlo45-support-envelope-venv-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          work="$RUNNER_TEMP/dlo45-support-envelope-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$venv"
          test ! -e "$work"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install -e .
          mkdir -p "$work/parent-source" "$work/parent-target"
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" \
            --output "$work/parent-source.zip"
          echo "$SOURCE_ARTIFACT_SHA256  $work/parent-source.zip" | sha256sum --check
          unzip -q "$work/parent-source.zip" -d "$work/parent-source"
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$TARGET_ARTIFACT_ID/zip" \
            --output "$work/parent-target.zip"
          echo "$TARGET_ARTIFACT_SHA256  $work/parent-target.zip" | sha256sum --check
          unzip -q "$work/parent-target.zip" -d "$work/parent-target"
          echo "ENVELOPE_PY=$venv/bin/python" >> "$GITHUB_ENV"
          echo "ENVELOPE_WORK=$work" >> "$GITHUB_ENV"
          echo "ENVELOPE_SOURCE_OUT=$work/source-envelope" >> "$GITHUB_ENV"
          echo "ENVELOPE_TARGET_OUT=$work/target-audit" >> "$GITHUB_ENV"

      - name: Calibrate source-only complete-trajectory envelope
        shell: bash
        run: |
          set -euo pipefail
          "$ENVELOPE_PY" -m \
            experiments.deform_dlo45_decision_identifiability_v1.support_envelope_audit \
            source \
            --dataset-root "$DATASET_ROOT" \
            --parent-source-dir "$ENVELOPE_WORK/parent-source" \
            --parent-protocol "$PARENT_PROTOCOL" \
            --envelope-protocol "$ENVELOPE_PROTOCOL" \
            --output-dir "$ENVELOPE_SOURCE_OUT"
          test -s "$ENVELOPE_SOURCE_OUT/source_envelope_seal.json"

      - name: Open existing held trajectories once after source seal
        shell: bash
        run: |
          set -euo pipefail
          "$ENVELOPE_PY" -m \
            experiments.deform_dlo45_decision_identifiability_v1.support_envelope_audit \
            target \
            --dataset-root "$DATASET_ROOT" \
            --parent-source-dir "$ENVELOPE_WORK/parent-source" \
            --parent-target-dir "$ENVELOPE_WORK/parent-target" \
            --parent-protocol "$PARENT_PROTOCOL" \
            --envelope-protocol "$ENVELOPE_PROTOCOL" \
            --source-envelope-dir "$ENVELOPE_SOURCE_OUT" \
            --output-dir "$ENVELOPE_TARGET_OUT"
          test -s "$ENVELOPE_TARGET_OUT/target_audit.json"

      - name: Record provenance and concise result
        shell: bash
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/$ENVELOPE_PROTOCOL" "$ENVELOPE_WORK/support_envelope_protocol.json"
          cat > "$ENVELOPE_WORK/github_run.json" <<EOF
          {
            "repository": "$GITHUB_REPOSITORY",
            "request_id": "${{ needs.authorize.outputs.request_id }}",
            "source_revision": "${{ needs.authorize.outputs.source_revision }}",
            "trigger_sha": "$GITHUB_SHA",
            "run_id": "$GITHUB_RUN_ID",
            "run_attempt": "$GITHUB_RUN_ATTEMPT",
            "runner_name": "$RUNNER_NAME",
            "runner_os": "$RUNNER_OS"
          }
          EOF
          TARGET="$ENVELOPE_TARGET_OUT/target_audit.json" "$ENVELOPE_PY" - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path(os.environ["TARGET"]).read_text())
          print("# DEFORM support-robust decision envelope")
          print()
          for dlo, record in result["dlos"].items():
              fixed = record["fixed_epsilon_policy"]
              retained = record["source_retention_policy"]
              print(f"## {dlo}")
              print(f"- conformal radius: {record['envelope_radius']:.6f}")
              print(
                  "- empirical trajectory coverage: "
                  f"{record['empirical_base_policy_trajectory_coverage']:.3f}"
              )
              print(
                  f"- fixed epsilon={record['fixed_epsilon']}: "
                  f"{fixed['nonfallback_count']} nonfallback, "
                  f"{100*fixed['rmse_reduction_fraction']:.2f}% RMSE reduction, "
                  f"{fixed['harmful_nonfallback_count']} harmful"
              )
              print(
                  f"- source-retention epsilon={record['source_retention_epsilon']:.6f}: "
                  f"{retained['nonfallback_count']} nonfallback, "
                  f"{100*retained['rmse_reduction_fraction']:.2f}% RMSE reduction, "
                  f"{retained['harmful_nonfallback_count']} harmful"
              )
              print()
          PY
          TARGET="$ENVELOPE_TARGET_OUT/target_audit.json" "$ENVELOPE_PY" - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          result = json.loads(Path(os.environ["TARGET"]).read_text())
          print("# DEFORM support-robust decision envelope")
          print()
          print("Retrospective within-DLO trajectory-level calibration; no safety claim.")
          print()
          for dlo, record in result["dlos"].items():
              fixed = record["fixed_epsilon_policy"]
              print(f"- **{dlo}**: q={record['envelope_radius']:.4f}, ")
              print(
                  f"  empirical coverage={record['empirical_base_policy_trajectory_coverage']:.3f}, "
                  f"fixed-epsilon nonfallback={fixed['nonfallback_count']}, "
                  f"RMSE reduction={100*fixed['rmse_reduction_fraction']:.2f}%."
              )
          PY

      - name: Upload auditable source and target evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: deform-dlo45-support-envelope-v1-${{ github.run_id }}
          path: |
            ${{ env.ENVELOPE_SOURCE_OUT }}
            ${{ env.ENVELOPE_TARGET_OUT }}
            ${{ env.ENVELOPE_WORK }}/support_envelope_protocol.json
            ${{ env.ENVELOPE_WORK }}/github_run.json
          if-no-files-found: warn
          retention-days: 90
