# workflow-lifecycle: permanent
# workflow-owner: IPS-Stuttgart maintainers
name: Tracking Cloth physical-action feasibility v1

on:
  pull_request:
    paths:
      - ".github/workflows/tracking-cloth-action-feasibility-v1.yml"
      - "experiments/tracking_cloth_action_feasibility_v1/**"
      - "tests/test_tracking_cloth_action_feasibility_v1.py"
      - "src/bayesian_phystwin/act_sense_fallback_certificate_v1.py"
      - "experiments/tracking_cloth_self_collision_selective_twin_v1/data.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/tracking-cloth-action-feasibility-v1.yml"
      - "experiments/tracking_cloth_action_feasibility_v1/**"
      - "tests/test_tracking_cloth_action_feasibility_v1.py"
      - "src/bayesian_phystwin/act_sense_fallback_certificate_v1.py"
      - "experiments/tracking_cloth_self_collision_selective_twin_v1/data.py"

permissions:
  contents: read

concurrency:
  group: tracking-cloth-action-feasibility-v1-${{ github.sha }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  contracts:
    name: Physical-action feasibility contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install focused development dependencies
        shell: bash
        run: python -m pip install -e ".[dev]"

      - name: Test source-only action contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_tracking_cloth_action_feasibility_v1.py
          python -m ruff check \
            experiments/tracking_cloth_action_feasibility_v1 \
            tests/test_tracking_cloth_action_feasibility_v1.py
          python -m ruff format --check \
            experiments/tracking_cloth_action_feasibility_v1 \
            tests/test_tracking_cloth_action_feasibility_v1.py

      - name: Verify target-closed workflow policy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          protocol = json.loads(
              Path(
                  "experiments/tracking_cloth_action_feasibility_v1/protocol.json"
              ).read_text(encoding="utf-8")
          )
          assert protocol["source_repetitions"] == [1, 2]
          assert protocol["reserved_target_repetition"] == 3
          boundary = protocol["information_boundary"]
          assert boundary["target_rep3_numeric_outcomes_read"] is False
          assert boundary["target_protocol_authorized"] is False
          workflow = Path(
              ".github/workflows/tracking-cloth-action-feasibility-v1.yml"
          ).read_text(encoding="utf-8")
          source = workflow[workflow.index("\n  source_audit:") :]
          assert "if: github.event_name == 'push'" in source
          assert "[self-hosted, Linux, X64, gpuserver4090]" in source
          assert "${{ secrets." not in workflow
          assert "contents: write" not in workflow
          assert "git push" not in workflow
          PY

  source_audit:
    name: Source-only physical-action audit / gpuserver4090
    if: github.event_name == 'push'
    needs: contracts
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 45
    env:
      DATASET_ROOT: /home/github-runner/.cache/datasets/tracking-cloth-deformation-v1-zenodo-14644526
    steps:
      - name: Check out exact merged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Execute source-only factorial audit
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DATASET_ROOT"
          venv="$RUNNER_TEMP/tracking-action-source-venv-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          output="$RUNNER_TEMP/tracking-action-source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$venv"
          test ! -e "$output"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install -e .
          "$venv/bin/python" -m \
            experiments.tracking_cloth_action_feasibility_v1.run \
            --dataset-root "$DATASET_ROOT" \
            --output "$output"
          cp experiments/tracking_cloth_action_feasibility_v1/protocol.json \
            "$output/protocol.json"
          echo "ACTION_SOURCE_OUTPUT=$output" >> "$GITHUB_ENV"

      - name: Publish compact source summary
        shell: bash
        run: cat "$ACTION_SOURCE_OUTPUT/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload source-only evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: tracking-cloth-action-feasibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.ACTION_SOURCE_OUTPUT }}/result.json
            ${{ env.ACTION_SOURCE_OUTPUT }}/source_cases.csv
            ${{ env.ACTION_SOURCE_OUTPUT }}/SUMMARY.md
            ${{ env.ACTION_SOURCE_OUTPUT }}/protocol.json
          if-no-files-found: error
          retention-days: 90

      - name: Remove source execution
        if: always()
        shell: bash
        run: |
          rm -rf \
            "${ACTION_SOURCE_OUTPUT:-}" \
            "$RUNNER_TEMP/tracking-action-source-venv-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
