# workflow-lifecycle: temporary
# workflow-owner: IPS-Stuttgart maintainers
name: Launch Deform360 decision-sufficient compression v1

on:
  push:
    branches: [science/deform360-decision-sufficient-compression-v1]
    paths:
      - ".github/requests/launch-deform360-decision-sufficient-compression-v1.json"

permissions:
  contents: write

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Authorize one add-only launch request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          test "${PUSH_FORCED}" = false
          test "${BEFORE_SHA}" != 0000000000000000000000000000000000000000
          mapfile -t changed < <(git diff --name-status "${BEFORE_SHA}" "${GITHUB_SHA}")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = \
            $'A\t.github/requests/launch-deform360-decision-sufficient-compression-v1.json'
      - name: Require formatted validated implementation
        shell: bash
        run: |
          set -euo pipefail
          test ! -e \
            .github/workflows/format-deform360-decision-sufficient-compression-v1.yml
          test ! -e \
            .github/requests/format-deform360-decision-sufficient-compression-v1.json
          test ! -e \
            tests/test_deform360_decision_sufficient_compression_v1_fixed.py
          python -m pip install numpy==1.26.4 pytest ruff==0.14.14
          python -m ruff check \
            scripts/science/run_deform360_decision_sufficient_compression_v1.py \
            tests/test_deform360_decision_sufficient_compression_v1.py
          python -m ruff format --check \
            scripts/science/run_deform360_decision_sufficient_compression_v1.py \
            tests/test_deform360_decision_sufficient_compression_v1.py
          python -m pytest -q \
            tests/test_deform360_decision_sufficient_compression_v1.py
          python scripts/science/run_deform360_decision_sufficient_compression_v1.py \
            --self-test
          python -m json.tool \
            protocols/deform360_decision_sufficient_compression_v1.json >/dev/null
      - name: Retire launcher in a separate cleanup commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm \
            .github/requests/launch-deform360-decision-sufficient-compression-v1.json \
            .github/workflows/launch-deform360-decision-sufficient-compression-v1.yml
          git add -A
          git commit -m "Retire decision-sufficient compression launcher"
          git push origin HEAD:science/deform360-decision-sufficient-compression-v1
      - name: Add the sole numerical request in its own commit
        shell: bash
        run: |
          set -euo pipefail
          parent="$(git rev-parse HEAD)"
          mkdir -p .github/requests
          EXPECTED_SOURCE_REVISION="${parent}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = {
              "schema": "bayesian-phystwin/deform360-decision-sufficient-compression-workflow-request-v1",
              "request_id": "deform360-decision-sufficient-compression-v1-20260902",
              "purpose": "Evaluate minimum-rank query-visible covariance factors on the exact completed 92-object same-mean Deform360 decision study, with full-factor parity and a rank-matched spectral control.",
              "runner_labels": ["self-hosted", "Linux", "X64", "gpuserver4090"],
              "dataset_root": "/mnt/seagate10tb/florianpfaff/datasets/deform360",
              "protocol_path": "protocols/deform360_decision_sufficient_compression_v1.json",
              "parent_dependence_run_id": 33528032875,
              "parent_dependence_artifact_id": 9811194776,
              "original_v6_revision": "954538832106d8ded13f1101b3a2b2e855b40513",
              "frozen_point_revision": "25ba91c021124569c4dcf84c66eda5ec088868e0",
              "retrospective_target_reuse": True,
              "paper_claim_authorized": False,
              "expected_source_revision": os.environ["EXPECTED_SOURCE_REVISION"],
          }
          path = Path(
              ".github/requests/"
              "deform360-decision-sufficient-compression-v1.json"
          )
          path.write_text(
              json.dumps(value, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          git add \
            .github/requests/deform360-decision-sufficient-compression-v1.json
          git commit -m "Launch decision-sufficient covariance compression study"
          git push origin HEAD:science/deform360-decision-sufficient-compression-v1
