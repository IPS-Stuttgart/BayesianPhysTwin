name: Sync PR 432 with current main once

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/sync-pr432-current-main-once.yml

permissions:
  contents: write

concurrency:
  group: sync-pr432-current-main-once
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.event.pull_request.head.ref == 'agent/numerical-environment-profile-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/numerical-environment-profile-v1
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Merge protected main and validate the final feature tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          rm .github/workflows/sync-pr432-current-main-once.yml
          git add -A
          git commit -m "Sync numerical environment profiles with current main"

          python -m pip install -e ".[dev]"
          python -m mypy src/bayesian_phystwin/numerical_environment_v1.py
          python -m pytest -q \
            tests/test_runtime_provenance_numerical_environment_v1_1.py \
            tests/test_runtime_provenance_numerical_environment_v1_2.py \
            tests/test_runtime_provenance_numerical_environment_v1_3.py \
            tests/test_runtime_provenance_numerical_environment_v1_4.py \
            tests/test_runtime_provenance_numerical_environment_v1_5.py \
            tests/test_pull_request_workflow_integrity.py
          python -m ruff check \
            src/bayesian_phystwin/numerical_environment_v1.py \
            tests/test_runtime_provenance_numerical_environment_v1_1.py \
            tests/test_runtime_provenance_numerical_environment_v1_2.py \
            tests/test_runtime_provenance_numerical_environment_v1_3.py \
            tests/test_runtime_provenance_numerical_environment_v1_4.py \
            tests/test_runtime_provenance_numerical_environment_v1_5.py
          python -m ruff format --check \
            src/bayesian_phystwin/numerical_environment_v1.py \
            tests/test_runtime_provenance_numerical_environment_v1_1.py \
            tests/test_runtime_provenance_numerical_environment_v1_2.py \
            tests/test_runtime_provenance_numerical_environment_v1_3.py \
            tests/test_runtime_provenance_numerical_environment_v1_4.py \
            tests/test_runtime_provenance_numerical_environment_v1_5.py
          git diff --check
          git push origin HEAD:agent/numerical-environment-profile-v1
