name: Materialize Deform360 seal hardening from PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: materialize-deform360-calibration-seal-hardening
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/harden-deform360-calibration-seal
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Extract and apply the staged patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'EXTRACT'
          from pathlib import Path

          workflow = Path(
              ".github/workflows/agent-harden-deform360-calibration-seal.yml"
          ).read_text(encoding="utf-8")
          start = "          python - <<'PY'\n"
          stop = "\n          PY\n"
          if workflow.count(start) != 1 or workflow.count(stop) != 1:
              raise SystemExit("cannot locate staged patch payload")
          payload = workflow.split(start, 1)[1].split(stop, 1)[0]
          lines = []
          for line in payload.splitlines():
              lines.append(line[10:] if line.startswith("          ") else line)
          Path("/tmp/materialize.py").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          EXTRACT
          python /tmp/materialize.py
          rm .github/workflows/agent-harden-deform360-calibration-seal-pr.yml

      - name: Commit materialized fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden Deform360 calibration seal provenance"

      - name: Install development dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Validate focused contracts
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/bayesian_phystwin/deform360_calibration_execution.py
            src/bayesian_phystwin/deform360_calibration_bundle.py
            src/bayesian_phystwin/deform360_visual_provider_lock.py
            src/bayesian_phystwin/cli/deform360_calibration_execution.py
            tests/test_deform360_calibration_bundle.py
            tests/test_deform360_visual_provider_lock.py
            tests/test_deform360_calibration_execution.py
            tests/test_deform360_calibration_execution_boundaries.py
          )
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy --no-site-packages \
            src/bayesian_phystwin/deform360_calibration_execution.py \
            src/bayesian_phystwin/deform360_calibration_bundle.py \
            src/bayesian_phystwin/deform360_visual_provider_lock.py \
            src/bayesian_phystwin/cli/deform360_calibration_execution.py
          python -m pytest -q \
            tests/test_deform360_calibration_bundle.py \
            tests/test_deform360_visual_provider_lock.py \
            tests/test_deform360_calibration_execution.py \
            tests/test_deform360_calibration_execution_boundaries.py
          python -m compileall -q src/bayesian_phystwin
          git diff --check HEAD^

      - name: Push validated commit
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:agent/harden-deform360-calibration-seal
