name: One-shot fix full-22 hosted dependencies

on:
  push:
    branches:
      - agent/portable-full22-anchor-reproduction

permissions:
  contents: write

concurrency:
  group: one-shot-fix-full22-hosted-deps
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/portable-full22-anchor-reproduction
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Repair and test the hosted dependency contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/full22-anchor-reproduction.yml")
          text = workflow.read_text(encoding="utf-8")
          old = 'python -m pip install -e ".[dev,data]"'
          new = 'python -m pip install -e ".[dev,data,graph]"'
          if text.count(old) != 1:
              raise SystemExit("hosted dependency command changed unexpectedly")
          workflow.write_text(text.replace(old, new), encoding="utf-8")

          tests = Path("tests/test_full22_reproduction_capsule.py")
          marker = "def test_hosted_workflow_installs_graph_dependency() -> None:"
          test_text = tests.read_text(encoding="utf-8")
          if marker not in test_text:
              test_text += '''\n\ndef test_hosted_workflow_installs_graph_dependency() -> None:\n    workflow = (\n        Path(__file__).parents[1]\n        / ".github"\n        / "workflows"\n        / "full22-anchor-reproduction.yml"\n    ).read_text(encoding="utf-8")\n\n    assert 'python -m pip install -e ".[dev,data,graph]"' in workflow\n    assert 'python -m pip install -e ".[dev,data]"' not in workflow\n'''
              tests.write_text(test_text, encoding="utf-8")
          PY
          python -m pip install --disable-pip-version-check -e ".[dev,data,graph]"
          python -m pip check
          python -m ruff check \
            reproductions/full22_anchor_v1/reproduce.py \
            tests/test_full22_reproduction_capsule.py
          python -m ruff format \
            reproductions/full22_anchor_v1/reproduce.py \
            tests/test_full22_reproduction_capsule.py
          python -m ruff check \
            reproductions/full22_anchor_v1/reproduce.py \
            tests/test_full22_reproduction_capsule.py
          python -m ruff format --check \
            reproductions/full22_anchor_v1/reproduce.py \
            tests/test_full22_reproduction_capsule.py
          python -m pytest -q tests/test_full22_reproduction_capsule.py

      - name: Commit the focused repair and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-fix-full22-hosted-deps.yml
          git add \
            .github/workflows/full22-anchor-reproduction.yml \
            tests/test_full22_reproduction_capsule.py
          git diff --cached --check
          git commit -m "Install SciPy for hosted full-22 retrieval"
          git push origin HEAD:agent/portable-full22-anchor-reproduction
