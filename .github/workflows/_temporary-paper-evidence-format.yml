name: Temporary paper-evidence formatter

on:
  push:
    branches: [refresh/claim-bundle-v1]
    paths:
      - .github/workflows/_temporary-paper-evidence-format.yml

permissions:
  contents: write

concurrency:
  group: temporary-paper-evidence-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.ref == 'refs/heads/refresh/claim-bundle-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Provision Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply pinned canonical formatting
        run: |
          set -euo pipefail
          python -m pip install "ruff==0.16.1"
          python -m ruff format \
            src/bayesian_phystwin/cli/run_manifest.py \
            src/bayesian_phystwin/paper_evidence_v1.py \
            tests/test_paper_evidence_v1.py
          git diff --check

      - name: Commit formatting repair to the reviewed branch
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            src/bayesian_phystwin/cli/run_manifest.py \
            src/bayesian_phystwin/paper_evidence_v1.py \
            tests/test_paper_evidence_v1.py; then
            echo "Paper-evidence files already use canonical formatting."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/bayesian_phystwin/cli/run_manifest.py \
            src/bayesian_phystwin/paper_evidence_v1.py \
            tests/test_paper_evidence_v1.py
          git commit -m "Apply canonical Ruff formatting to paper evidence"
          git push origin HEAD:refresh/claim-bundle-v1
