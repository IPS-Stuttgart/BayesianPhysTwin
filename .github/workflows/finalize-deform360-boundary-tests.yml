name: Finalize Deform360 boundary tests

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/finalize-deform360-boundary-tests.yml"

permissions:
  contents: write

concurrency:
  group: finalize-deform360-boundary-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/deform360-calibration-seal'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Format and register the boundary suite
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python -m pip install "ruff==0.16.1"
          python -m ruff format \
            tests/test_deform360_calibration_execution_boundaries.py
          python - <<'PY'
          from pathlib import Path

          tests_workflow = Path('.github/workflows/tests.yml')
          text = tests_workflow.read_text(encoding='utf-8')
          needle = (
              '            tests/test_deform360_calibration_execution.py \\\n'
          )
          replacement = needle + (
              '            '
              'tests/test_deform360_calibration_execution_boundaries.py \\\n'
          )
          if text.count(needle) != 2:
              raise SystemExit('authoritative test-list insertion count changed')
          tests_workflow.write_text(
              text.replace(needle, replacement),
              encoding='utf-8',
              newline='\n',
          )

          focused = Path('.github/workflows/deform360-calibration-seal.yml')
          text = focused.read_text(encoding='utf-8')
          replacements = {
              '      - "tests/test_deform360_calibration_execution.py"\n': (
                  '      - "tests/test_deform360_calibration_execution.py"\n'
                  '      - '
                  '"tests/test_deform360_calibration_execution_boundaries.py"\n'
              ),
              '            tests/test_deform360_calibration_execution.py\n': (
                  '            tests/test_deform360_calibration_execution.py\n'
                  '            '
                  'tests/test_deform360_calibration_execution_boundaries.py\n'
              ),
              '            tests/test_deform360_calibration_execution.py \\\n': (
                  '            tests/test_deform360_calibration_execution.py \\\n'
                  '            '
                  'tests/test_deform360_calibration_execution_boundaries.py \\\n'
              ),
          }
          for needle, replacement in replacements.items():
              if text.count(needle) != 1:
                  raise SystemExit(
                      f'focused test-list insertion count changed: {needle!r}'
                  )
              text = text.replace(needle, replacement)
          focused.write_text(text, encoding='utf-8', newline='\n')
          PY
          git rm .github/workflows/finalize-deform360-boundary-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/tests.yml \
            .github/workflows/deform360-calibration-seal.yml \
            tests/test_deform360_calibration_execution_boundaries.py
          git commit -m "Exercise Deform360 calibration rejection boundaries"
          git push origin "HEAD:${HEAD_REF}"
