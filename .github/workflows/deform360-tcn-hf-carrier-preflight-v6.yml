# workflow-lifecycle: temporary-one-shot
# workflow-owner: IPS-Stuttgart maintainers
name: Deform360 selective carrier preflight v6

on:
  push:
    branches: [science/deform360-tcn-fallback-runner-v6]
    paths:
      - ".github/requests/deform360-tcn-hf-carrier-preflight-v6.json"

permissions:
  contents: read

concurrency:
  group: deform360-tcn-hf-carrier-preflight-v6
  cancel-in-progress: false

jobs:
  preflight:
    name: Inspect official selective carrier availability
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true

      - name: Prepare isolated report directory
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/deform360-hf-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "${out}"
          mkdir -p "${out}"
          echo "OUTPUT_ROOT=${out}" >> "${GITHUB_ENV}"

      - name: Inspect raw and processed repository carriers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "${OUTPUT_ROOT}/carrier_inventory.txt"
          import json
          import urllib.error
          import urllib.parse
          import urllib.request

          USER_AGENT = "BayesianPhysTwin-Deform360-carrier-audit-v6"
          probes = (
              "004-rubber-band",
              "021-bag-cloth",
              "068-nylon-rope",
          )

          def get_json(url: str):
              request = urllib.request.Request(url, headers={"User-Agent": USER_AGENT})
              with urllib.request.urlopen(request, timeout=120) as response:
                  return json.load(response)

          def repo_info(repo: str):
              return get_json(f"https://huggingface.co/api/datasets/{repo}")

          def list_tree(repo: str, path: str):
              encoded = urllib.parse.quote(path, safe="/")
              suffix = f"/{encoded}" if encoded else ""
              url = f"https://huggingface.co/api/datasets/{repo}/tree/main{suffix}?expand=true"
              return get_json(url)

          def first_existing(repo: str, paths):
              for path in paths:
                  try:
                      return path, list_tree(repo, path)
                  except urllib.error.HTTPError as error:
                      if error.code != 404:
                          raise
              return None, None

          for repo in ("brownu/deform360", "brownu/deform360_processed"):
              print(f"## repo={repo}")
              try:
                  info = repo_info(repo)
                  print(f"revision={info.get('sha')}")
                  print(f"private={info.get('private')}")
                  for object_id in probes:
                      root_path, entries = first_existing(
                          repo,
                          (
                              f"raw/{object_id}",
                              f"processed/{object_id}",
                              object_id,
                          ),
                      )
                      if entries is None:
                          print(f"object={object_id} path=unavailable")
                          continue
                      print(f"object={object_id} path={root_path} entries={len(entries)}")
                      for item in entries:
                          print(
                              "  ROOT\t"
                              + str(item.get("path"))
                              + "\t"
                              + str(item.get("size"))
                              + "\t"
                              + str(item.get("type"))
                          )
                      for item in entries:
                          path = str(item.get("path", ""))
                          lowered = path.lower()
                          kind = item.get("type")
                          if kind == "directory" and "tactile" in lowered:
                              children = list_tree(repo, path)
                              for child in children:
                                  child_path = str(child.get("path", ""))
                                  child_lower = child_path.lower()
                                  if child_lower.endswith(".npy") or child_lower.endswith(".txt"):
                                      print(
                                          "  TACTILE\t"
                                          + child_path
                                          + "\t"
                                          + str(child.get("size"))
                                          + "\t"
                                          + str(child.get("type"))
                                      )
                          if kind == "directory" and "episode" in lowered:
                              episode_children = list_tree(repo, path)
                              for child in episode_children:
                                  child_path = str(child.get("path", ""))
                                  child_lower = child_path.lower()
                                  if "robot" in child_lower or "tactile" in child_lower or child_lower.endswith(".tar"):
                                      print(
                                          "  EPISODE\t"
                                          + child_path
                                          + "\t"
                                          + str(child.get("size"))
                                          + "\t"
                                          + str(child.get("type"))
                                      )
                                  if child.get("type") == "directory" and child_lower.endswith("/robot"):
                                      for grandchild in list_tree(repo, child_path):
                                          grand_path = str(grandchild.get("path", ""))
                                          if grand_path.lower().endswith(("robot.npy", "robot.npz")):
                                              print(
                                                  "  ROBOT\t"
                                                  + grand_path
                                                  + "\t"
                                                  + str(grandchild.get("size"))
                                                  + "\t"
                                                  + str(grandchild.get("type"))
                                              )
              except Exception as exc:
                  print(f"repo_error={type(exc).__name__}: {exc}")
          PY

      - name: Upload inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deform360-tcn-hf-carrier-preflight-v6-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_ROOT }}
          if-no-files-found: warn
          retention-days: 7
