name: Temporary fix PR 733 mypy

on:
  push:
    branches:
      - agent/provider-physical-mapping-audit-v1
    paths:
      - .github/workflows/temporary-fix-pr733-mypy.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'IPS-Stuttgart/BayesianPhysTwin'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/provider-physical-mapping-audit-v1
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Repair NumPy scalar typing and format
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/bayesian_phystwin/provider_physical_mapping_audit_v1.py')
          old = '                minimum=np.finfo(float).tiny,\n'
          new = '                minimum=float(np.finfo(float).tiny),\n'
          text = path.read_text(encoding='utf-8')
          if text.count(old) != 1:
              raise SystemExit(f'expected one typing target, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python -m pip install ruff==0.16.4
          python -m ruff format src/bayesian_phystwin/provider_physical_mapping_audit_v1.py
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bayesian_phystwin/provider_physical_mapping_audit_v1.py
          git commit -m 'Fix provider unit scale typing'
          git push origin HEAD:agent/provider-physical-mapping-audit-v1
