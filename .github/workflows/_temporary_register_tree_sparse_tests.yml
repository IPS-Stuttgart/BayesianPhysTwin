name: Temporary tree-sparse suite registrar

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/_temporary_register_tree_sparse_tests.yml"
      - ".github/quality/test-suites.json"
      - "tests/test_tree_sparse_explicit_gauge_prob4d.py"
      - "tests/test_tree_sparse_prob4d_roundtrip.py"

permissions:
  contents: write

concurrency:
  group: temporary-tree-sparse-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  register:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact reviewed branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Register tests and validate suite invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(".github/quality/test-suites.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          additions = [
              "tests/test_tree_sparse_explicit_gauge_prob4d.py",
              "tests/test_tree_sparse_prob4d_roundtrip.py",
          ]
          anchor = "tests/test_sparse_explicit_gauge_prob4d.py"
          for suite_name in ("stable-core-coverage", "core-contracts"):
              suite = data["suites"][suite_name]
              for item in additions:
                  while item in suite:
                      suite.remove(item)
              position = suite.index(anchor) + 1
              suite[position:position] = additions
          path.write_text(
              json.dumps(data, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
          python -m pip install --no-cache-dir -e ".[dev]"
          python -m pytest -q tests/test_test_suite_manifest.py
          python -m json.tool .github/quality/test-suites.json >/dev/null

      - name: Publish manifest and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_temporary_register_tree_sparse_tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/quality/test-suites.json \
            .github/workflows/_temporary_register_tree_sparse_tests.yml
          git commit -m "Register tree-sparse Prob4D contract tests [tree-sparse-suite]"
          git push origin HEAD:agent/consume-claim-bearing-tree-sparse-prob4d
