# workflow-lifecycle: permanent
# workflow-owner: IPS-Stuttgart maintainers
name: GP discrepancy development

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/gp-discrepancy-development.yml
      - src/bayesian_phystwin_experiments/gp_discrepancy*.py
      - scripts/science/*gp_development_v1.py
      - scripts/science/run_gp_discrepancy_development_v1.py
      - tests/test_gp_discrepancy*.py
      - configs/diagnostics/gp_discrepancy_development_v1.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gp-discrepancy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  PYTHONHASHSEED: "0"
  PYTHONPATH: src

jobs:
  controlled:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test implementation and information boundaries
        run: |
          python -m pytest -q tests/test_gp_discrepancy_v1.py tests/test_gp_discrepancy_study_v1.py
          python scripts/science/export_deform_gp_development_v1.py --help
      - name: Run complete controlled seed and adverse-arm matrix
        run: |
          python scripts/science/run_gp_discrepancy_development_v1.py \
            --synthetic --output-dir outputs/gp-discrepancy
      - name: Record formatting diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p outputs/gp-discrepancy
          files=(
            src/bayesian_phystwin_experiments/gp_discrepancy_v1.py
            src/bayesian_phystwin_experiments/gp_discrepancy_study_v1.py
            scripts/science/run_gp_discrepancy_development_v1.py
            scripts/science/export_deform_gp_development_v1.py
            tests/test_gp_discrepancy_v1.py
            tests/test_gp_discrepancy_study_v1.py
          )
          python -m ruff check --diff "${files[@]}" > outputs/gp-discrepancy/lint.patch || true
          python -m ruff format --diff "${files[@]}" > outputs/gp-discrepancy/format.patch || true
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
      - name: Retain controlled evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gp-discrepancy-controlled-${{ github.run_id }}
          path: outputs/gp-discrepancy
          if-no-files-found: error
          retention-days: 90
