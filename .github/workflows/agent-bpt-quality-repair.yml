name: Agent BPT quality repair bootstrap

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: agent-bpt-quality-repair
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/bootstrap-bpt-quality-repair-20260727'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,graph]" opencv-python-headless
          python -m pip install "coverage==7.13.3"

      - name: Apply and format repair candidate
        run: |
          set -euo pipefail
          python .github/agent_bpt_quality_repair.py
          files=(
            .github/agent_bpt_quality_repair.py
            src/bayesian_phystwin/_gauge_aware_contracts.py
            src/bayesian_phystwin/_gauge_aware_solver.py
            src/bayesian_phystwin/_prior_aware_gauge_math.py
            src/bayesian_phystwin/observation_belief_gauge_adapter.py
            src/bayesian_phystwin/prior_aware_gauge_belief.py
            src/bayesian_phystwin/phystwin/geometry.py
            src/bayesian_phystwin/phystwin/replay.py
            tests/test_observation_belief_gauge_adapter.py
          )
          python -m ruff format -- "${files[@]}"
          python -m ruff check --fix -- "${files[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply BPT quality repair candidate"

      - name: Run Python quality ratchet
        id: quality
        continue-on-error: true
        run: |
          set -o pipefail
          base_sha=$(git rev-parse origin/main)
          python tools/quality/changed_python_quality.py \
            --base "$base_sha" \
            --head HEAD \
            2>&1 | tee quality-ratchet.txt

      - name: Upload quality diagnostics
        if: steps.quality.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: agent-bpt-quality-diagnostics
          path: quality-ratchet.txt
          if-no-files-found: error
          retention-days: 1

      - name: Stop after quality failure
        if: steps.quality.outcome == 'failure'
        run: exit 1

      - name: Run stable-core coverage ratchet
        run: |
          set -euo pipefail
          base_sha=$(git rev-parse origin/main)
          python -m coverage erase
          python -m coverage run --branch --source=bayesian_phystwin -m pytest -q \
            tests/test_causal4d_graph_provider_v1.py \
            tests/test_causal4d_provider_v1.py \
            tests/test_gauge_aware_belief.py \
            tests/test_observation_belief.py \
            tests/test_observation_belief_gauge_adapter.py \
            tests/test_prior_aware_and_linearization.py \
            tests/test_prior_aware_likelihood_conformance.py \
            tests/test_prob4d_causal_lineage.py \
            tests/test_prob4d_joint_contract_fixture.py \
            tests/test_cli_main.py \
            tests/test_run_manifest.py \
            tests/test_run_manifest_v2.py \
            tests/test_run_manifest_cli.py \
            tests/test_phystwin_profile.py \
            tests/test_information_mass_invariants.py \
            tests/test_quality_invariants.py
          python -m coverage json -o package-coverage.json
          stable_files=(
            src/bayesian_phystwin/_gauge_aware_contracts.py
            src/bayesian_phystwin/_gauge_aware_solver.py
            src/bayesian_phystwin/causal4d_provider_v1.py
            src/bayesian_phystwin/cli/main.py
            src/bayesian_phystwin/cli/run_manifest.py
            src/bayesian_phystwin/gauge_aware_belief.py
            src/bayesian_phystwin/observation_belief.py
            src/bayesian_phystwin/observation_belief_gauge_adapter.py
            src/bayesian_phystwin/phystwin_profile.py
            src/bayesian_phystwin/prob4d_causal_lineage.py
            src/bayesian_phystwin/prob4d_observation_contract.py
            src/bayesian_phystwin/repository_provenance.py
            src/bayesian_phystwin/run_manifest.py
            src/bayesian_phystwin/run_manifest_v2.py
          )
          stable_include=$(IFS=,; echo "${stable_files[*]}")
          python -m coverage json \
            --include="$stable_include" \
            -o stable-core-coverage.json
          python tools/quality/check_coverage_floors.py \
            stable-core-coverage.json \
            .github/quality/stable-core-coverage-floors.json \
            --changed-coverage-json package-coverage.json \
            --base "$base_sha" \
            --head HEAD

      - name: Run provider quality and contract tests
        run: |
          set -euo pipefail
          python -m mypy --python-version 3.12 \
            src/bayesian_phystwin/contracts \
            src/bayesian_phystwin/phystwin \
            src/bayesian_phystwin/causal4d_provider_v1.py \
            src/bayesian_phystwin/causal4d_provider_v2.py
          python -m pytest -q \
            tests/test_causal4d_provider_v1.py \
            tests/test_causal4d_provider_v2.py \
            tests/test_observation_belief_gauge_adapter.py \
            tests/test_information_mass_invariants.py \
            tests/test_provider_composite_weight_semantics.py

      - name: Publish product-only branch
        env:
          PRODUCT_BRANCH: fix/bpt-quality-provider-gates-20260727
        run: |
          set -euo pipefail
          exclusions=(
            ':(exclude).github/agent_bpt_quality_repair.py'
            ':(exclude).github/workflows/agent-bpt-quality-repair.yml'
          )
          git diff --binary origin/main...HEAD -- . "${exclusions[@]}" > /tmp/product.patch
          test -s /tmp/product.patch
          git diff --check origin/main...HEAD -- . "${exclusions[@]}"
          git switch -C "$PRODUCT_BRANCH" origin/main
          git apply --index /tmp/product.patch
          git commit -m "Repair BPT quality and provider gates"
          git push --force origin "HEAD:refs/heads/$PRODUCT_BRANCH"
          echo "Published product-only branch: $PRODUCT_BRANCH" >> "$GITHUB_STEP_SUMMARY"
