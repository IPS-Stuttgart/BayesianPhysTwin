name: Apply exact persistent provider-design typing fix

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temporary-fix-persistent-provider-design.yml"

permissions:
  contents: write

concurrency:
  group: temporary-fix-persistent-provider-design-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Check out exact reviewed PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          clean: true

      - name: Check out exact merged Prob4D producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/Prob4D
          ref: e37c3d50d4a07a2c3760389e79d59b0ac9402dc4
          path: _external/prob4d
          persist-credentials: false
          clean: true

      - name: Provision Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply the exact annotation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/bayesian_phystwin/persistent_prob4d_visual_bias.py")
          source = path.read_text(encoding="utf-8")
          old = "    provider_design = np.zeros((3, latent_dimension), dtype=np.float64)\n"
          new = "    provider_design: np.ndarray = np.zeros(\n        (3, latent_dimension),\n        dtype=np.float64,\n    )\n"
          count = source.count(old)
          if count != 1:
              raise SystemExit(
                  f"expected one provider_design annotation target, found {count}"
              )
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Create isolated validation environment
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/persistent-provider-design-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "${root}"
          python -m venv "${root}/venv"
          echo "${root}/venv/bin" >> "${GITHUB_PATH}"
          "${root}/venv/bin/python" -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1"
          "${root}/venv/bin/python" -m pip install -e ".[dev]"
          "${root}/venv/bin/python" -m pip install -e ./_external/prob4d
          "${root}/venv/bin/python" -m pip check

      - name: Validate exact repaired tree
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check \
            src/bayesian_phystwin/prob4d_visual_bias_stream.py \
            src/bayesian_phystwin/persistent_prob4d_visual_bias.py \
            tests/test_prob4d_visual_bias_stream.py \
            tests/test_prob4d_visual_bias_stream_crossrepo.py \
            tests/test_persistent_prob4d_visual_bias.py
          python -m ruff format --check \
            src/bayesian_phystwin/prob4d_visual_bias_stream.py \
            src/bayesian_phystwin/persistent_prob4d_visual_bias.py \
            tests/test_prob4d_visual_bias_stream.py \
            tests/test_prob4d_visual_bias_stream_crossrepo.py \
            tests/test_persistent_prob4d_visual_bias.py
          python -m mypy \
            src/bayesian_phystwin/prob4d_visual_bias_stream.py \
            src/bayesian_phystwin/persistent_prob4d_visual_bias.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_prob4d_visual_bias_stream.py \
            tests/test_prob4d_visual_bias_stream_crossrepo.py \
            tests/test_persistent_prob4d_visual_bias.py \
            tests/test_prob4d_visual_bias_update.py \
            tests/test_prob4d_visual_bias_update_adversarial.py \
            tests/test_prob4d_visual_bias_crossrepo.py \
            tests/prob4d_factor_stream_contract_cases.py \
            tests/test_observation_belief_gauge_adapter.py
          python -m py_compile \
            src/bayesian_phystwin/prob4d_visual_bias_stream.py \
            src/bayesian_phystwin/persistent_prob4d_visual_bias.py \
            tests/test_persistent_prob4d_visual_bias.py
          test -n "$(git diff -- src/bayesian_phystwin/persistent_prob4d_visual_bias.py)"
          test -z "$(git diff --name-only | grep -v '^src/bayesian_phystwin/persistent_prob4d_visual_bias.py$' || true)"

      - name: Retire temporary workflow and publish the validated fix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _external
          rm .github/workflows/temporary-fix-persistent-provider-design.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Annotate persistent visual-bias provider design"
          git push origin HEAD:agent/fix-persistent-provider-design-typing
