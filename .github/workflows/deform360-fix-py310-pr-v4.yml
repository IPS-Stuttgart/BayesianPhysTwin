# workflow-lifecycle: temporary-one-shot
# workflow-owner: IPS-Stuttgart maintainers
name: Repair Deform360 PR 815 Python 3.10 syntax

on:
  push:
    branches: [science/deform360-icra-development-v2]
    paths:
      - ".github/requests/deform360-fix-py310-pr-v4.json"

permissions:
  contents: write

concurrency:
  group: deform360-fix-py310-pr-v4
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out writable PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: science/deform360-gpuserver4090-real-eval-v1
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Replace multiline f-string and validate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install ruff==0.14.14 numpy==1.26.4 pytest
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "scripts/science/run_deform360_action_conditioned_tactile_v2.py"
          )
          source = path.read_text(encoding="utf-8")
          old = '''        raise EvaluationError(
            f"episode {episode.descriptor.episode_id} has no windows for horizon {
                horizon
            }"
        )
'''
          new = '''        message = (
            f"episode {episode.descriptor.episode_id} has no windows "
            f"for horizon {horizon}"
        )
        raise EvaluationError(message)
'''
          if old not in source:
              raise SystemExit("expected multiline f-string was not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          files=(
            scripts/science/audit_deform360_icra_carriers_v2.py
            scripts/science/audit_deform360_reserved_confirmation_readiness_v4.py
            scripts/science/inspect_deform360_robot_tactile_alignment_v2.py
            scripts/science/run_deform360_action_conditioned_tactile_v2.py
            scripts/science/run_deform360_action_kernel_v3.py
            scripts/science/run_deform360_gpuserver4090_real_evaluation_v1.py
            scripts/science/run_deform360_reserved_confirmation_v4.py
            tests/test_deform360_gpuserver4090_real_evaluation_v1.py
          )
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m compileall -q scripts/science tests/test_deform360_gpuserver4090_real_evaluation_v1.py
          python -m pytest -q tests/test_deform360_gpuserver4090_real_evaluation_v1.py
          git diff --check

      - name: Publish repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/science/run_deform360_action_conditioned_tactile_v2.py
          git commit -m "Fix Python 3.10 compatibility in Deform360 evaluator"
          git push origin HEAD:science/deform360-gpuserver4090-real-eval-v1
