# workflow-lifecycle: permanent
# workflow-owner: IPS-Stuttgart maintainers
name: Tracking Cloth selective digital twin v1

on:
  pull_request:
    paths:
      - ".github/workflows/tracking-cloth-selective-twin-v1.yml"
      - ".github/quality/workflow-inventory-budget-v1.json"
      - ".github/requests/tracking-cloth-selective-twin-v1.json"
      - "experiments/tracking_cloth_selective_twin_v1/**"
      - "tests/test_tracking_cloth_selective_twin_v1.py"
      - "tests/test_workflow_inventory_budget.py"
  push:
    branches: [main]
    paths:
      - ".github/requests/tracking-cloth-selective-twin-v1.json"

permissions:
  contents: read

concurrency:
  group: tracking-cloth-selective-twin-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  DATASET_ROOT: /home/github-runner/.cache/datasets/tracking-cloth-deformation-v1-zenodo-14644526
  REQUEST_PATH: .github/requests/tracking-cloth-selective-twin-v1.json
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  contracts:
    name: Selective-twin contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: experiments/tracking_cloth_deformation_v1/requirements.txt
      - name: Install focused dependencies
        run: >-
          python -m pip install
          -r experiments/tracking_cloth_deformation_v1/requirements.txt
          pytest ruff
      - name: Validate implementation and protocol
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_tracking_cloth_selective_twin_v1.py
          python -m ruff check \
            experiments/tracking_cloth_selective_twin_v1 \
            tests/test_tracking_cloth_selective_twin_v1.py
          python -m ruff format --check \
            experiments/tracking_cloth_selective_twin_v1 \
            tests/test_tracking_cloth_selective_twin_v1.py
          python - <<'PY'
          import json
          from pathlib import Path

          protocol = json.loads(
              Path(
                  "experiments/tracking_cloth_selective_twin_v1/protocol.json"
              ).read_text()
          )
          assert protocol["schema"] == (
              "bayesian-phystwin.tracking-cloth-selective-twin.v1"
          )
          assert protocol["outer_split"] == "leave-one-material-out"
          assert protocol["primary_candidate"] == "bayesian_physics"
          assert protocol["information_boundary"]["fresh_confirmation"] is False
          assert protocol["information_boundary"]["paper_claim_authorized"] is False
          PY
      - name: Validate request when present
        shell: bash
        run: |
          set -euo pipefail
          if test ! -f "$REQUEST_PATH"; then
            exit 0
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          request = json.loads(Path(os.environ["REQUEST_PATH"]).read_text())
          expected = {
              "schema": "tracking-cloth-selective-twin-request-v1",
              "mode": "retrospective_evaluate",
              "dataset_root": os.environ["DATASET_ROOT"],
              "runner_label": "gpuserver4090",
              "paper_claim_authorized": False,
              "fresh_confirmation": False,
              "prior_target_run_id": "33302686759",
          }
          for key, value in expected.items():
              assert request.get(key) == value, (key, request.get(key), value)
          assert set(request) == set(expected) | {
              "request_id",
              "expected_source_revision",
          }
          assert request["request_id"]
          revision = request["expected_source_revision"]
          assert len(revision) == 40
          assert set(revision) <= set("0123456789abcdef")
          PY

  authorize:
    name: Authorize one immutable request
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_revision: ${{ steps.request.outputs.source_revision }}
      request_id: ${{ steps.request.outputs.request_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Require one newly added request file
        id: request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$PUSH_FORCED" = false
          test "$BEFORE_SHA" != 0000000000000000000000000000000000000000
          mapfile -t changed < <(git diff --name-status "$BEFORE_SHA" "$GITHUB_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = $'A\t.github/requests/tracking-cloth-selective-twin-v1.json'
          REQUEST_PATH="$REQUEST_PATH" python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          request = json.loads(Path(os.environ["REQUEST_PATH"]).read_text())
          parent = subprocess.check_output(
              ["git", "rev-parse", f"{os.environ['GITHUB_SHA']}^"],
              text=True,
          ).strip()
          if request["expected_source_revision"] != parent:
              raise SystemExit("Request is not bound to the trigger commit parent")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as stream:
              stream.write(f"source_revision={parent}\n")
              stream.write(f"request_id={request['request_id']}\n")
          PY

  evaluate:
    name: Cross-material physical competence / gpuserver4090
    needs: [contracts, authorize]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      needs.contracts.result == 'success' &&
      needs.authorize.result == 'success'
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Prepare isolated execution
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DATASET_ROOT"
          venv="$RUNNER_TEMP/selective-twin-venv-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          output="$RUNNER_TEMP/selective-twin-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$venv"
          test ! -e "$output"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install \
            -r experiments/tracking_cloth_deformation_v1/requirements.txt
          echo "SELECTIVE_PY=$venv/bin/python" >> "$GITHUB_ENV"
          echo "SELECTIVE_VENV=$venv" >> "$GITHUB_ENV"
          echo "SELECTIVE_OUT=$output" >> "$GITHUB_ENV"
      - name: Run retrospective cross-material screen
        shell: bash
        run: |
          set -euo pipefail
          "$SELECTIVE_PY" -m experiments.tracking_cloth_selective_twin_v1.run \
            --dataset-root "$DATASET_ROOT" \
            --output "$SELECTIVE_OUT"
          REQUEST_PATH="$GITHUB_WORKSPACE/$REQUEST_PATH" \
          OUTPUT_PATH="$SELECTIVE_OUT/evaluation_request.json" \
          "$SELECTIVE_PY" - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          raw = Path(os.environ["REQUEST_PATH"]).read_bytes()
          request = json.loads(raw)
          request["request_sha256"] = hashlib.sha256(raw).hexdigest()
          request["github_run_id"] = os.environ["GITHUB_RUN_ID"]
          request["github_run_attempt"] = os.environ["GITHUB_RUN_ATTEMPT"]
          Path(os.environ["OUTPUT_PATH"]).write_text(
              json.dumps(request, indent=2, sort_keys=True) + "\n"
          )
          PY
      - name: Reject raw trajectory payloads
        if: always() && env.SELECTIVE_OUT != ''
        shell: bash
        run: |
          set -euo pipefail
          if find "$SELECTIVE_OUT" -type f \( -iname '*.npz' -o -iname '*.pkl' \) \
              -print -quit | grep -q .; then
            echo "Raw prediction or trajectory payload found" >&2
            exit 3
          fi
      - name: Publish summary
        if: always() && env.SELECTIVE_OUT != ''
        shell: bash
        run: |
          if test -f "$SELECTIVE_OUT/report.md"; then
            cat "$SELECTIVE_OUT/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f "$SELECTIVE_OUT/failure.json"; then
            echo "## Incomplete run: no scientific conclusion" >> "$GITHUB_STEP_SUMMARY"
            cat "$SELECTIVE_OUT/failure.json" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload compact evidence
        if: always() && env.SELECTIVE_OUT != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: tracking-cloth-selective-twin-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.SELECTIVE_OUT }}/*.json
            ${{ env.SELECTIVE_OUT }}/*.csv
            ${{ env.SELECTIVE_OUT }}/report.md
            ${{ env.SELECTIVE_OUT }}/DATA_LICENSE.txt
          retention-days: 90
          if-no-files-found: warn
      - name: Remove isolated execution
        if: always()
        shell: bash
        run: |
          rm -rf "${SELECTIVE_OUT:-}" "${SELECTIVE_VENV:-}"
