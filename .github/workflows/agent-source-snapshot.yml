name: Agent source snapshot

on:
  push:
    branches:
      - agent/query-covariance-crossfit-v1
    paths:
      - .github/workflows/agent-source-snapshot.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-artifact@v7
        with:
          name: agent-repository-snapshot
          path: |
            .github
            docs
            scripts
            src
            tests
            README.md
            pyproject.toml
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
