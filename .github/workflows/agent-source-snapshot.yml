name: Agent source snapshot

on:
  push:
    branches:
      - agent/query-covariance-crossfit-v1
    paths:
      - .github/workflows/agent-source-snapshot.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: agent-source-snapshot
          path: |
            .github/quality/test-suites.json
            docs/source_reading_guide.md
            src/bayesian_phystwin/_query_covariance_crossfit_common.py
            src/bayesian_phystwin/_query_covariance_crossfit_scoring.py
            src/bayesian_phystwin/_query_covariance_crossfit_selection.py
            src/bayesian_phystwin/query_covariance_crossfit.py
            tests/test_query_covariance_crossfit.py
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
