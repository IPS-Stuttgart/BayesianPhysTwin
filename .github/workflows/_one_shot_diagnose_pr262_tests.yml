name: Diagnose PR 262 admission regressions

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/_one_shot_diagnose_pr262_tests.yml"

permissions:
  contents: read

jobs:
  case:
    if: github.event.pull_request.number == 262
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        test:
          - test_admission_binds_all_jobs_to_exact_source_bytes
          - test_admission_round_trip_is_deterministic_and_non_replacing
          - test_camera_omission_and_source_identity_drift_fail_closed
          - test_frame_and_upstream_identity_mismatch_fail_closed
          - test_duplicate_keys_boolean_versions_and_tampering_are_rejected
          - test_plan_is_parsed_from_the_opened_descriptor_snapshot
    name: ${{ matrix.test }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: |
          python scripts/_one_shot_fix_pr262_typing.py
          python -m pip install -e ".[dev,graph]" "numpy>=1.24,<2.2"
          python -m ruff check --fix \
            src/bayesian_phystwin/deform360_calibration_visual_execution_admission.py \
            tests/test_deform360_calibration_visual_execution_admission.py
          python -m ruff format \
            src/bayesian_phystwin/deform360_calibration_visual_execution_admission.py \
            tests/test_deform360_calibration_visual_execution_admission.py
      - run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_deform360_calibration_visual_execution_admission.py::${{ matrix.test }}
