# workflow-lifecycle: temporary
# workflow-owner: IPS-Stuttgart maintainers
name: Finalize Tracking Cloth action feasibility V2c

on:
  push:
    branches: [science/tracking-cloth-active-decision-rep3-v1]
    paths:
      - ".github/requests/finalize-tracking-cloth-action-costed-v2c.json"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 2
          clean: true
      - name: Authorize typed cleanup
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          test "${PUSH_FORCED}" = false
          mapfile -t changed < <(git diff --name-status "${BEFORE_SHA}" "${GITHUB_SHA}")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = $'A\t.github/requests/finalize-tracking-cloth-action-costed-v2c.json'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Apply type-only test correction and retained idempotent repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          decision_path = Path(
              "experiments/tracking_cloth_action_feasibility_costed_v2/_decision.py"
          )
          decision = decision_path.read_text(encoding="utf-8")
          return_line = "    return np.min(pair_budget, axis=1)"
          diagonal_line = "    np.fill_diagonal(pair_budget, 1.0)"
          if diagonal_line not in decision:
              if decision.count(return_line) != 1:
                  raise SystemExit("support-budget marker changed")
              decision = decision.replace(
                  return_line,
                  "    # A plan compared with itself has identically zero loss gap.\n"
                  "    np.fill_diagonal(pair_budget, 1.0)\n"
                  + return_line,
                  1,
              )
              decision_path.write_text(decision, encoding="utf-8")

          permanent = Path(
              ".github/workflows/tracking-cloth-action-feasibility-costed-v2.yml"
          )
          workflow = permanent.read_text(encoding="utf-8")
          old = '          assert "rep3" not in source.lower()\n'
          if old in workflow:
              workflow = workflow.replace(
                  old,
                  '          assert "scoring_truth" not in source\n'
                  '          assert "--stage target" not in source\n'
                  '          assert "--stage predict" not in source\n'
                  '          assert "--stage score" not in source\n',
                  1,
              )
              permanent.write_text(workflow, encoding="utf-8")

          test_path = Path(
              "tests/test_tracking_cloth_action_feasibility_costed_v2.py"
          )
          test = test_path.read_text(encoding="utf-8")
          old_import = '''from bayesian_phystwin.act_sense_fallback_certificate_v1 import (
              act_sense_fallback_certificate,
          )'''
          old_import = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in old_import.splitlines()
          )
          new_import = '''from bayesian_phystwin.act_sense_fallback_certificate_v1 import (
              ActSenseFallbackCertificateV1,
              act_sense_fallback_certificate,
          )'''
          new_import = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in new_import.splitlines()
          )
          if "ActSenseFallbackCertificateV1" not in test:
              if test.count(old_import) != 1:
                  raise SystemExit("certificate import marker changed")
              test = test.replace(old_import, new_import, 1)
          test = test.replace(
              "def _parent_certificate():\n",
              "def _parent_certificate() -> ActSenseFallbackCertificateV1:\n",
              1,
          )
          test = test.replace('        [[0.0, 1.0]],\n', '        [[1.0, 0.0]],\n', 1)
          old_bounds = (
              '        unknown_action_loss_lower=np.asarray([0.0, 0.0]),\n'
              '        unknown_action_loss_upper=np.asarray([10.0, 0.0]),\n'
          )
          new_bounds = (
              '        unknown_action_loss_lower=np.asarray([10.0, 0.0]),\n'
              '        unknown_action_loss_upper=np.asarray([10.0, 10.0]),\n'
          )
          if old_bounds in test:
              test = test.replace(old_bounds, new_bounds, 1)
          test_path.write_text(test, encoding="utf-8")
          PY
      - name: Validate every V2 contract
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff format \
            experiments/tracking_cloth_action_feasibility_costed_v2 \
            tests/test_tracking_cloth_action_feasibility_costed_v2.py
          python -m ruff check --fix \
            experiments/tracking_cloth_action_feasibility_costed_v2 \
            tests/test_tracking_cloth_action_feasibility_costed_v2.py
          python -m ruff format --check \
            experiments/tracking_cloth_action_feasibility_costed_v2 \
            tests/test_tracking_cloth_action_feasibility_costed_v2.py
          python -m pytest -q \
            tests/test_tracking_cloth_action_feasibility_costed_v2.py \
            tests/test_support_robust_act_sense_fallback_certificate_v1.py \
            tests/test_tracking_cloth_action_feasibility_v1.py
          python -m py_compile \
            experiments/tracking_cloth_action_feasibility_costed_v2/_decision.py \
            experiments/tracking_cloth_action_feasibility_costed_v2/run.py
          git diff --check
      - name: Commit validated source V2 and retire temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/requests/finalize-tracking-cloth-action-costed-v2.json \
            .github/requests/finalize-tracking-cloth-action-costed-v2b.json \
            .github/requests/finalize-tracking-cloth-action-costed-v2c.json \
            .github/workflows/finalize-tracking-cloth-action-costed-v2.yml \
            .github/workflows/finalize-tracking-cloth-action-costed-v2b.yml \
            .github/workflows/finalize-tracking-cloth-action-costed-v2c.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize typed cost-aware cloth source gate V2'
          git push origin HEAD:science/tracking-cloth-active-decision-rep3-v1
