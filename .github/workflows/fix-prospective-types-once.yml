name: Fix prospective belief typing once

on:
  push:
    branches:
      - agent/prospective-belief-hardening
    paths:
      - .github/workflows/fix-prospective-types-once.yml

permissions:
  contents: write

jobs:
  fix:
    name: Add strict local annotations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact annotation-only edits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("src/bayesian_phystwin/parameter_posterior.py"): (
                  (
                      "        normalized = self.log_weights - np.max(self.log_weights)\n",
                      "        normalized: np.ndarray = self.log_weights - np.max(self.log_weights)\n",
                  ),
                  (
                      "        total = np.sum(weights)\n",
                      "        total: float = float(np.sum(weights))\n",
                  ),
              ),
              Path("src/bayesian_phystwin/structured_reliability.py"): (
                  (
                      "    logs = np.empty((transition_count, 2, 2), dtype=np.float64)\n",
                      "    logs: np.ndarray = np.empty((transition_count, 2, 2), dtype=np.float64)\n",
                  ),
              ),
          }
          for path, edits in replacements.items():
              content = path.read_text(encoding="utf-8")
              for old, new in edits:
                  if content.count(old) != 1:
                      raise SystemExit(f"expected exactly one occurrence in {path}: {old!r}")
                  content = content.replace(old, new)
              path.write_text(content, encoding="utf-8")
          PY
          git diff --check
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Validate the exact quality failure
        run: |
          python -m pip install -e ".[dev]"
          python -m ruff check \
            src/bayesian_phystwin/parameter_posterior.py \
            src/bayesian_phystwin/structured_reliability.py
          python -m ruff format --check \
            src/bayesian_phystwin/parameter_posterior.py \
            src/bayesian_phystwin/structured_reliability.py
          python -m mypy \
            src/bayesian_phystwin/parameter_posterior.py \
            src/bayesian_phystwin/structured_reliability.py
      - name: Commit annotation-only repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/bayesian_phystwin/parameter_posterior.py \
            src/bayesian_phystwin/structured_reliability.py
          git commit -m 'Annotate prospective belief numerics'
          git push origin "HEAD:${GITHUB_REF_NAME}"
