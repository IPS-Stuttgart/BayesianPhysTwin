name: Normalize provider-owned information-cap diff

on:
  push:
    branches:
      - agent/provider-owned-information-caps
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: agent-cleanup-provider-owned-information-caps
  cancel-in-progress: false

jobs:
  normalize:
    if: github.event_name == 'push' || github.head_ref == 'agent/provider-owned-information-caps'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/provider-owned-information-caps
          fetch-depth: 0
      - name: Restore changed files from main
        run: |
          git fetch origin main
          git checkout origin/main -- \
            docs/gauge_aware_observation_update.md \
            src/bayesian_phystwin/_gauge_aware_contracts.py \
            src/bayesian_phystwin/_gauge_aware_solver.py \
            src/bayesian_phystwin/_prior_aware_gauge_math.py \
            src/bayesian_phystwin/gauge_aware_belief.py \
            src/bayesian_phystwin/observation_belief_gauge_adapter.py \
            src/bayesian_phystwin/prior_aware_gauge_belief.py \
            tests/test_information_mass_invariants.py \
            tests/test_observation_belief_gauge_adapter.py
      - name: Reapply semantic-only patch
        run: |
          git show 139c7c4f052b50228c81fc7a7b0ff6b3eb8f08c0:.github/agent-patches/apply_provider_owned_caps.py > /tmp/apply_provider_owned_caps.py
          python /tmp/apply_provider_owned_caps.py
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tools
        run: python -m pip install -q -e ".[dev]"
      - name: Run Ruff
        id: ruff
        continue-on-error: true
        run: |
          python -m ruff check --fix \
            src/bayesian_phystwin/_gauge_aware_contracts.py \
            src/bayesian_phystwin/_gauge_aware_solver.py \
            src/bayesian_phystwin/_prior_aware_gauge_math.py \
            src/bayesian_phystwin/gauge_aware_belief.py \
            src/bayesian_phystwin/observation_belief_gauge_adapter.py \
            src/bayesian_phystwin/prior_aware_gauge_belief.py \
            tests/test_information_mass_invariants.py \
            tests/test_observation_belief_gauge_adapter.py \
            >ruff-output.txt 2>&1
          python -m ruff check \
            src/bayesian_phystwin/_gauge_aware_contracts.py \
            src/bayesian_phystwin/_gauge_aware_solver.py \
            src/bayesian_phystwin/_prior_aware_gauge_math.py \
            src/bayesian_phystwin/gauge_aware_belief.py \
            src/bayesian_phystwin/observation_belief_gauge_adapter.py \
            src/bayesian_phystwin/prior_aware_gauge_belief.py \
            tests/test_information_mass_invariants.py \
            tests/test_observation_belief_gauge_adapter.py \
            >>ruff-output.txt 2>&1
      - name: Upload Ruff diagnostics
        if: steps.ruff.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: provider-cap-ruff-diagnostics
          path: ruff-output.txt
          retention-days: 2
          if-no-files-found: error
      - name: Run mypy
        id: mypy
        continue-on-error: true
        run: |
          python -m mypy \
            src/bayesian_phystwin/_gauge_aware_contracts.py \
            src/bayesian_phystwin/_gauge_aware_solver.py \
            src/bayesian_phystwin/_prior_aware_gauge_math.py \
            src/bayesian_phystwin/gauge_aware_belief.py \
            src/bayesian_phystwin/observation_belief_gauge_adapter.py \
            src/bayesian_phystwin/prior_aware_gauge_belief.py \
            >mypy-output.txt 2>&1
      - name: Upload mypy diagnostics
        if: steps.mypy.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: provider-cap-mypy-diagnostics
          path: mypy-output.txt
          retention-days: 2
          if-no-files-found: error
      - name: Stop on static-analysis failure
        if: steps.ruff.outcome == 'failure' || steps.mypy.outcome == 'failure'
        run: exit 1
      - name: Run focused tests
        run: |
          python -m pytest -q \
            tests/test_information_mass_invariants.py \
            tests/test_observation_belief_gauge_adapter.py \
            tests/test_gauge_aware_belief.py \
            tests/test_prior_aware_and_linearization.py \
            tests/test_prior_aware_likelihood_conformance.py
      - name: Finalize normalized source commit
        run: |
          rm -f .github/workflows/agent-cleanup-provider-owned-caps.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize provider-owned information-cap implementation"
          git push origin HEAD:agent/provider-owned-information-caps
