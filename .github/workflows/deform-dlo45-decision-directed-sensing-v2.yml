name: DEFORM decision-directed virtual sensing v2

on:
  push:
    branches:
      - science/deform-dlo45-decision-directed-sensing-v2
    paths:
      - ".github/requests/deform-dlo45-decision-directed-sensing-v2.json"

permissions:
  contents: read

concurrency:
  group: deform-dlo45-decision-directed-sensing-v2-${{ github.ref }}
  cancel-in-progress: false

env:
  REQUEST: .github/requests/deform-dlo45-decision-directed-sensing-v2.json
  PROTOCOL: experiments/deform_dlo45_decision_directed_sensing_v2/protocol.json
  DATASET_ROOT: /mnt/seagate10tb/florianpfaff/datasets/deform/data_set
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  contract:
    name: Validate source-calibrated sensing capsule
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Require a request-only trigger
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          test -n "$before"
          test "$before" != "0000000000000000000000000000000000000000"
          mapfile -t changed < <(git diff --name-only "$before" "$GITHUB_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$REQUEST"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate code, tests, protocol, and request
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1"
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m ruff check \
            experiments/deform_dlo45_decision_directed_sensing_v2/evaluate.py \
            tests/test_deform_dlo45_decision_directed_sensing_v2.py
          python -m ruff format --check \
            experiments/deform_dlo45_decision_directed_sensing_v2/evaluate.py \
            tests/test_deform_dlo45_decision_directed_sensing_v2.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_deform_dlo45_decision_directed_sensing_v2.py \
            tests/test_query_quotient_belief_v1.py
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          request_path = Path(os.environ["REQUEST"])
          request = json.loads(request_path.read_text(encoding="utf-8"))
          supplied = request.pop("request_id")
          payload = json.dumps(
              request,
              sort_keys=True,
              separators=(",", ":"),
              allow_nan=False,
          ).encode()
          assert hashlib.sha256(payload).hexdigest() == supplied
          assert request["contract"] == (
              "deform-dlo45-decision-directed-sensing-request-v2"
          )
          assert request["schema_version"] == 2
          assert request["status"] == "authorized"
          assert request["branch"] == os.environ["GITHUB_REF_NAME"]
          assert request["runner_labels"] == ["self-hosted", "gpuserver4090"]
          assert request["registered_runner_name"] == "workstation1"
          assert request["dataset_root"] == os.environ["DATASET_ROOT"]
          assert request["protocol_path"] == os.environ["PROTOCOL"]
          assert request["source_calibrated_source_test_only"] is True
          assert request["official_evaluation_access_authorized"] is False
          assert (
              request["future_internal_outcome_access_before_action_selection"]
              is False
          )
          assert request["new_data_collection_authorized"] is False
          assert request["dataset_mutation_authorized"] is False
          assert request["result_publication_authorized"] is True
          protocol_blob = subprocess.check_output(
              ["git", "hash-object", os.environ["PROTOCOL"]],
              text=True,
          ).strip()
          assert protocol_blob == request["protocol_git_blob_sha1"]
          PY

  pilot:
    name: Source-calibrated competing-action sensing replay
    needs: contract
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      needs.contract.result == 'success'
    runs-on: [self-hosted, gpuserver4090]
    timeout-minutes: 300
    steps:
      - name: Check out exact triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true

      - name: Bind the expected runner and source-only dataset view
        id: dataset
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "workstation1"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          test -d "$DATASET_ROOT"
          isolated="$RUNNER_TEMP/deform-dlo45-source-only-v2-$GITHUB_RUN_ID"
          rm -rf -- "$isolated"
          mkdir -p "$isolated/DLO4" "$isolated/DLO5"
          for dlo in DLO4 DLO5; do
            train="$DATASET_ROOT/$dlo/train"
            test -d "$train"
            test "$(find "$train" -maxdepth 1 -type f -name '*.pkl' | wc -l)" \
              -eq 56
            ln -s "$train" "$isolated/$dlo/train"
            test ! -e "$isolated/$dlo/eval"
          done
          echo "root=$isolated" >> "$GITHUB_OUTPUT"
          {
            echo "runner_name=$RUNNER_NAME"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "dataset_root=$(readlink -f "$DATASET_ROOT")"
            echo "source_only_root=$isolated"
          } > "$RUNNER_TEMP/decision-sensing-v2-environment.txt"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install an isolated numerical runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/deform-dlo45-sensing-v2-venv-$GITHUB_RUN_ID"
          rm -rf -- "$venv"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1" \
            "numpy==2.2.6"
          "$venv/bin/python" -m pip install --no-deps -e .
          "$venv/bin/python" -m pip check
          echo "python=$venv/bin/python" >> "$GITHUB_OUTPUT"
          "$venv/bin/python" - <<'PY'
          import json
          import platform

          import numpy

          print(
              json.dumps(
                  {
                      "python": platform.python_version(),
                      "numpy": numpy.__version__,
                  },
                  sort_keys=True,
              )
          )
          PY

      - name: Execute the source-calibrated no-new-data pilot
        id: execute
        env:
          PYTHON: ${{ steps.runtime.outputs.python }}
          SOURCE_ONLY_ROOT: ${{ steps.dataset.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/deform-dlo45-decision-directed-sensing-v2-$GITHUB_RUN_ID"
          rm -rf -- "$out"
          "$PYTHON" -m \
            experiments.deform_dlo45_decision_directed_sensing_v2.evaluate \
            --dataset-root "$SOURCE_ONLY_ROOT" \
            --protocol "$PROTOCOL" \
            --output-dir "$out" \
            --source-revision "$GITHUB_SHA"
          echo "output=$out" >> "$GITHUB_OUTPUT"

      - name: Validate and summarize the exploratory result
        env:
          OUTPUT: ${{ steps.execute.outputs.output }}
          PYTHON: ${{ steps.runtime.outputs.python }}
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON" - <<'PY'
          import json
          import math
          import os
          from pathlib import Path

          root = Path(os.environ["OUTPUT"])
          result = json.loads((root / "result.json").read_text())
          compact = json.loads((root / "compact_result.json").read_text())
          assert result["contract"] == (
              "deform-dlo45-decision-directed-sensing-v2"
          )
          assert result["schema_version"] == 2
          assert result["status"] in {
              "source-test-only-exploratory-result",
              "source-test-only-negative-calibration-gate",
          }
          assert compact["result_id"] == result["result_id"]
          accounting = result["accounting"]
          expected = {
              "fit_trajectories": 78,
              "fit_windows": 1482,
              "calibration_trajectories": 18,
              "calibration_windows": 342,
              "source_test_trajectories": 16,
              "source_test_decision_windows": 304,
              "calibration_base_configurations": 9,
              "calibration_grid_configurations": 72,
              "calibration_case_rows": 24624,
              "policies": 9,
              "budgets": 7,
              "source_test_case_rows": 19152,
          }
          for key, value in expected.items():
              assert accounting[key] == value, (key, accounting[key], value)
          assert accounting["official_evaluation_files_opened"] is False
          assert (
              accounting["future_internal_nodes_used_before_action_selection"]
              is False
          )
          assert accounting["new_data_collected"] is False
          selected = result["selected_calibration"]
          assert selected["sensor_log_likelihood_scale"] in {0.5, 1.0, 2.0}
          assert selected["action_prototype_scale"] in {0.5, 0.75, 1.0}
          assert selected["regret_tolerance"] in {
              0.0,
              0.005,
              0.01,
              0.02,
              0.05,
              0.1,
              0.2,
              0.4,
          }
          expected_policies = {
              "decision_regret",
              "bayes_risk",
              "posterior_entropy",
              "class_entropy",
              "state_variance",
              "query_variance",
              "center_out",
              "random",
              "oracle_decision",
          }
          assert set(result["aggregate"]) == expected_policies
          for policy in result["aggregate"].values():
              assert set(policy) == {"0", "1", "2", "3", "4", "6", "8"}
              for row in policy.values():
                  for key in (
                      "pooled_task_rmse_mm",
                      "pooled_fallback_task_rmse_mm",
                      "mean_trajectory_improvement",
                      "nonfallback_fraction",
                      "certified_fraction",
                      "mean_sensor_count",
                      "mean_measurement_cost",
                      "nonfallback_harmful_fraction",
                      "mean_normalized_realized_regret",
                  ):
                      assert math.isfinite(float(row[key]))
          print(
              json.dumps(
                  {
                      "result_id": result["result_id"],
                      "classification": result["classification"],
                      "selected_calibration": selected,
                      "decision_regret_budget_4": (
                          result["aggregate"]["decision_regret"]["4"]
                      ),
                  },
                  indent=2,
                  sort_keys=True,
              )
          )
          PY
          cat "$OUTPUT/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete exploratory evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: deform-dlo45-decision-directed-sensing-v2-${{ github.run_id }}
          path: |
            ${{ steps.execute.outputs.output }}/result.json
            ${{ steps.execute.outputs.output }}/compact_result.json
            ${{ steps.execute.outputs.output }}/SUMMARY.md
            ${{ steps.execute.outputs.output }}/calibration_grid.json
            ${{ steps.execute.outputs.output }}/calibration_cases.jsonl
            ${{ steps.execute.outputs.output }}/source_test_cases.jsonl
            ${{ runner.temp }}/decision-sensing-v2-environment.txt
            experiments/deform_dlo45_decision_directed_sensing_v2/protocol.json
            .github/requests/deform-dlo45-decision-directed-sensing-v2.json
          if-no-files-found: error
          retention-days: 90

      - name: Remove isolated runtime and source view
        if: always()
        shell: bash
        run: |
          rm -rf -- \
            "$RUNNER_TEMP/deform-dlo45-source-only-v2-$GITHUB_RUN_ID" \
            "$RUNNER_TEMP/deform-dlo45-sensing-v2-venv-$GITHUB_RUN_ID"
