name: Temporary finalize tree-block covariance operator

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temporary-finalize-tree-block-operator.yml

permissions:
  contents: write

concurrency:
  group: temporary-tree-block-operator-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/tree-block-covariance-operator'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          clean: true

      - name: Verify exact reviewed head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"

      - name: Finalize source, tests and release note
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path(
              'src/bayesian_phystwin/tree_block_posterior_operator.py'
          )
          text = source_path.read_text(encoding='utf-8')
          replacements = {
              '        raw.dtype.kind not in {"b", "O", "U", "S"},\n': (
                  '        raw.dtype.kind in {"i", "u", "f"},\n'
              ),
              '        basis = np.zeros((self.dimension, len(selected)), '
              'dtype=np.float64)\n': (
                  '        basis: np.ndarray = np.zeros(\n'
                  '            (self.dimension, len(selected)), dtype=np.float64\n'
                  '        )\n'
              ),
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'source finalization target changed: {old!r}')
              text = text.replace(old, new)
          source_path.write_text(text, encoding='utf-8')

          test_path = Path(
              'tests/test_structured_point_covariance_tree_block_operator.py'
          )
          text = test_path.read_text(encoding='utf-8')
          replacements = {
              'from typing import Any\n\n': '',
              '        parent_coupling[index] = np.eye(block_size) * '
              '(0.05 + 0.01 * index)\n': (
                  '        parent_coupling[index] = np.eye(block_size) * (\n'
                  '            0.03 + 0.005 * (index % 5)\n'
                  '        )\n'
              ),
              '                    0.006 * (index + 1) * (row + 1) '
              '/ (column + 1)\n': (
                  '                    0.002\n'
                  '                    * ((index % 7) + 1)\n'
                  '                    * (row + 1)\n'
                  '                    / (column + 1)\n'
              ),
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'test finalization target changed: {old!r}')
              text = text.replace(old, new)
          test_path.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          entry = (
              '- Exact factorized tree-block posterior covariance application, '
              'arbitrary linear\n'
              '  query and cross covariance, and selected marginals without '
              'complete dense\n'
              '  materialization.\n'
          )
          anchor = '### Added\n\n'
          if entry not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('changelog Added anchor changed')
              text = text.replace(anchor, anchor + entry, 1)
          changelog.write_text(text, encoding='utf-8')

          Path(
              '.github/workflows/temporary-finalize-tree-block-operator.yml'
          ).unlink()
          PY

          python -m pip install --disable-pip-version-check --no-cache-dir -e ".[dev]"
          files=(
            src/bayesian_phystwin/tree_block_posterior_operator.py
            tests/test_structured_point_covariance_tree_block_operator.py
          )
          python -m ruff check --fix "${files[@]}"
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m mypy --python-version 3.12 \
            src/bayesian_phystwin/tree_block_posterior_operator.py
          python -m pytest -q \
            tests/test_structured_point_covariance_tree_block_operator.py \
            tests/test_tree_block_sparse_gauge_belief.py \
            tests/test_portable_contracts_tree_block_strict_admission.py
          python -m compileall -q src/bayesian_phystwin tests
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Finalize tree-block posterior covariance operator'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
