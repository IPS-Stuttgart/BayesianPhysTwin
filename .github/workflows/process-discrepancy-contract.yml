name: Process discrepancy contract

on:
  push:
    branches: [main]
    paths:
      - "src/bayesian_phystwin/process_discrepancy.py"
      - "src/bayesian_phystwin/_process_discrepancy_*.py"
      - "tests/test_process_discrepancy.py"
      - "docs/dynamics_consistent_process_discrepancy.md"
      - ".github/workflows/process-discrepancy-contract.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/bayesian_phystwin/process_discrepancy.py"
      - "src/bayesian_phystwin/_process_discrepancy_*.py"
      - "tests/test_process_discrepancy.py"
      - "docs/dynamics_consistent_process_discrepancy.md"
      - ".github/workflows/process-discrepancy-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: process-discrepancy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Process discrepancy quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Lint and check formatting
        run: |
          python -m ruff check \
            src/bayesian_phystwin/process_discrepancy.py \
            src/bayesian_phystwin/_process_discrepancy_common.py \
            src/bayesian_phystwin/_process_discrepancy_basis.py \
            src/bayesian_phystwin/_process_discrepancy_model.py \
            src/bayesian_phystwin/_process_discrepancy_inference.py \
            tests/test_process_discrepancy.py
          python -m ruff format --check \
            src/bayesian_phystwin/process_discrepancy.py \
            src/bayesian_phystwin/_process_discrepancy_common.py \
            src/bayesian_phystwin/_process_discrepancy_basis.py \
            src/bayesian_phystwin/_process_discrepancy_model.py \
            src/bayesian_phystwin/_process_discrepancy_inference.py \
            tests/test_process_discrepancy.py
      - name: Type-check public implementation
        run: >-
          python -m mypy
          src/bayesian_phystwin/process_discrepancy.py
          src/bayesian_phystwin/_process_discrepancy_common.py
          src/bayesian_phystwin/_process_discrepancy_basis.py
          src/bayesian_phystwin/_process_discrepancy_model.py
          src/bayesian_phystwin/_process_discrepancy_inference.py

  compatibility:
    name: Process discrepancy / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install NumPy-only package and tests
        run: python -m pip install -e ".[dev]"
      - name: Run process discrepancy contract tests
        run: python -m pytest -q tests/test_process_discrepancy.py
