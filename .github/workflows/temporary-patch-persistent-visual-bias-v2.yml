name: Apply verified persistent visual-bias hardening

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temporary-patch-persistent-visual-bias-v2.yml"
      - "tools/temporary_patch_persistent_visual_bias_v2.py"

permissions:
  contents: write

concurrency:
  group: temporary-persistent-visual-bias-hardening-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact reviewed PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply deterministic source and test patch
        run: python tools/temporary_patch_persistent_visual_bias_v2.py

      - name: Validate before publishing
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/persistent-hardening-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python -m venv "${root}/venv"
          "${root}/venv/bin/python" -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1"
          "${root}/venv/bin/python" -m pip install -e ".[dev]"
          "${root}/venv/bin/python" -m ruff format \
            src/bayesian_phystwin/persistent_prob4d_visual_bias.py \
            tests/test_persistent_prob4d_visual_bias.py
          "${root}/venv/bin/python" -m ruff check \
            src/bayesian_phystwin/persistent_prob4d_visual_bias.py \
            tests/test_persistent_prob4d_visual_bias.py
          "${root}/venv/bin/python" -m ruff format --check \
            src/bayesian_phystwin/persistent_prob4d_visual_bias.py \
            tests/test_persistent_prob4d_visual_bias.py
          "${root}/venv/bin/python" -m mypy \
            src/bayesian_phystwin/persistent_prob4d_visual_bias.py
          "${root}/venv/bin/python" -m pytest -q -p no:cacheprovider \
            tests/test_persistent_prob4d_visual_bias.py
          "${root}/venv/bin/python" -m py_compile \
            src/bayesian_phystwin/persistent_prob4d_visual_bias.py \
            tests/test_persistent_prob4d_visual_bias.py
          test -n "$(git diff -- src/bayesian_phystwin/persistent_prob4d_visual_bias.py)"
          test -n "$(git diff -- tests/test_persistent_prob4d_visual_bias.py)"

      - name: Retire temporary writer and publish one commit
        shell: bash
        run: |
          set -euo pipefail
          rm \
            .github/workflows/temporary-patch-persistent-visual-bias-v2.yml \
            tools/temporary_patch_persistent_visual_bias_v2.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden persistent visual-bias candidate selection"
          git push origin HEAD:agent/persistent-prob4d-visual-bias-solver
