# workflow-lifecycle: experimental
# workflow-owner: IPS-Stuttgart maintainers
name: Partial observation conditioning v1
on:
  push:
    branches: [research/partial-observation-conditioning-20260906]
    paths:
      - '.github/workflows/partial-observation-conditioning-v1.yml'
      - 'experiments/partial_observation_conditioning_v1/request.json'
permissions:
  contents: read
concurrency:
  group: partial-observation-conditioning-v1
  cancel-in-progress: false
jobs:
  evaluate:
    if: github.repository == 'IPS-Stuttgart/BayesianPhysTwin'
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 50
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/scripts/remote:${{ github.workspace }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Read-only inventory of authorized DEFORM assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, shutil
          from pathlib import Path
          data = Path('/mnt/seagate10tb/florianpfaff/datasets/deform/data_set')
          for dlo in ['DLO4', 'DLO5']:
              for split in ['train', 'eval']:
                  paths = sorted((data/dlo/split).glob('*.pkl'))
                  print('DATA', dlo, split, len(paths), [p.name for p in paths[:3]], flush=True)
          root = Path('/home/github-runner/.cache/workflows/deform-dlo45/runs/33361441865-1')
          print('CACHE_ROOT', root, root.exists(), flush=True)
          if root.is_dir():
              for p in sorted(root.rglob('*')):
                  if p.is_file() and p.suffix in ['.npz', '.json', '.pt', '.pth']:
                      print('CACHE', p.relative_to(root), p.stat().st_size, flush=True)
          else:
              base = root.parent
              print('RUN_DIRECTORIES', [p.name for p in sorted(base.glob('*')) if p.is_dir()], flush=True)
          base = Path('/home/github-runner/.cache/workflows/deform-dlo45')
          for p in sorted(base.glob('*/bin/python*')):
              print('PYTHON', p, flush=True)
          print('SYSTEM_PYTHON', shutil.which('python3'), flush=True)
          try:
              import numpy as np
              print('NUMPY', np.__version__, flush=True)
          except ImportError:
              print('NUMPY unavailable in system Python', flush=True)
          PY
      - name: Create isolated NumPy test environment
        if: hashFiles('experiments/partial_observation_conditioning_v1/request.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/partial-observation-venv"
          "$RUNNER_TEMP/partial-observation-venv/bin/pip" install 'numpy==2.2.6' 'pytest==8.3.5'
      - name: Validate and execute fixed partial-observation experiment
        if: hashFiles('experiments/partial_observation_conditioning_v1/request.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          PY="$RUNNER_TEMP/partial-observation-venv/bin/python"
          export OUT="$RUNNER_TEMP/partial-observation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          "$PY" -m pytest -q experiments/partial_observation_conditioning_v1/test_experiment.py
          "$PY" -u experiments/partial_observation_conditioning_v1/run.py \
            --request experiments/partial_observation_conditioning_v1/request.json --output "$OUT"
          cat "$OUT/report.md" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retain complete compact evidence including failures
        if: always() && env.OUT != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: partial-observation-conditioning-v1-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: warn
          retention-days: 90
