name: Format conformal complete-plan certificate v1

on:
  push:
    branches: [science/conformal-complete-plan-certificate-v1]
    paths:
      - ".github/requests/format-conformal-complete-plan-v1.json"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 2
          clean: true
      - name: Authorize exact add-only formatting request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          test "${PUSH_FORCED}" = false
          mapfile -t changed < <(git diff --name-status "${BEFORE_SHA}" "${GITHUB_SHA}")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = $'A\t.github/requests/format-conformal-complete-plan-v1.json'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Format and validate focused implementation
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python -m pip install numpy==1.26.4 pytest ruff==0.16.5
          python -m ruff format \
            src/bayesian_phystwin/conformal_complete_plan_certificate_v1.py \
            experiments/conformal_complete_plan_certificate_v1/run.py \
            tests/test_conformal_complete_plan_certificate_v1.py
          python -m ruff check \
            src/bayesian_phystwin/conformal_complete_plan_certificate_v1.py \
            experiments/conformal_complete_plan_certificate_v1/run.py \
            tests/test_conformal_complete_plan_certificate_v1.py
          python -m pytest -q tests/test_conformal_complete_plan_certificate_v1.py
          python -m py_compile \
            src/bayesian_phystwin/conformal_complete_plan_certificate_v1.py \
            experiments/conformal_complete_plan_certificate_v1/run.py
          git diff --check
      - name: Commit canonical layout and retire formatter
        run: |
          set -euo pipefail
          rm -f \
            .github/requests/format-conformal-complete-plan-v1.json \
            .github/workflows/format-conformal-complete-plan-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/bayesian_phystwin/conformal_complete_plan_certificate_v1.py \
            experiments/conformal_complete_plan_certificate_v1/run.py \
            tests/test_conformal_complete_plan_certificate_v1.py \
            .github/requests/format-conformal-complete-plan-v1.json \
            .github/workflows/format-conformal-complete-plan-v1.yml
          git commit -m 'Format conformal complete-plan certificate'
          git push origin HEAD:science/conformal-complete-plan-certificate-v1
