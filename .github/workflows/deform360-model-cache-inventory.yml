name: Deform360 model-cache inventory

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deform360-model-cache-inventory.yml"
      - ".github/workflows/deform360-visual-provider-freeze.yml"
      - "protocols/locks/deform360_official_hub_visuotactile_v1_visual_provider_spec.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deform360-model-cache-inventory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    name: Target-blind cache inventory / workstation2
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 30
    steps:
      - name: Check out exact proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true

      - name: Inventory model metadata only
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/deform360-model-cache-inventory-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "${root}"
          mkdir -p "${root}"
          report="${root}/inventory.txt"
          echo "DEFORM360_CACHE_INVENTORY_ROOT=${root}" >> "${GITHUB_ENV}"

          {
            echo "schema=bayesian-phystwin/deform360-model-cache-inventory-v1"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "revision=${GITHUB_SHA}"
            echo "runner=${RUNNER_NAME}"
            echo "home=${HOME}"
            echo
            echo "environment_cache_variables:"
            env | grep -E '^(HF_HOME|HUGGINGFACE_HUB_CACHE|TRANSFORMERS_CACHE|XDG_CACHE_HOME)=' \
              | sort || true
            echo
            echo "mounts:"
            findmnt -rn -o TARGET,SOURCE,FSTYPE \
              | grep -E '^(/home|/mnt|/opt|/srv|/data)(/| |$)' \
              | sort || true
            echo
            echo "standard_repository_directories:"
            for base in /home/github-runner /mnt /opt /srv /data; do
              [[ -d "${base}" ]] || continue
              find "${base}" -maxdepth 14 -type d \
                \( -name 'models--TencentARC--MotionCrafter' \
                   -o -name 'models--stable-diffusion-v1-5--stable-diffusion-v1-5' \
                   -o -name 'models--stabilityai--stable-video-diffusion-img2vid-xt' \) \
                -print 2>/dev/null || true
            done | sort -u
            echo
            echo "motioncrafter_marker_directories:"
            for base in /home/github-runner /mnt /opt /srv /data; do
              [[ -d "${base}" ]] || continue
              find "${base}" -maxdepth 16 -type d \
                \( -name 'unet_determ' -o -name 'geometry_motion_vae' \) \
                -print 2>/dev/null || true
            done | sort -u
            echo
            echo "named_motioncrafter_directories:"
            for base in /home/github-runner /mnt /opt /srv /data; do
              [[ -d "${base}" ]] || continue
              find "${base}" -maxdepth 14 -type d -iname '*motioncrafter*' \
                -print 2>/dev/null || true
            done | sort -u
            echo
            echo "stable_video_model_indices:"
            for base in /home/github-runner /mnt /opt /srv /data; do
              [[ -d "${base}" ]] || continue
              find "${base}" -maxdepth 16 -type f -name model_index.json \
                -path '*stable*video*diffusion*' -print 2>/dev/null || true
            done | sort -u
          } | tee "${report}"

          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          report = Path(os.environ["DEFORM360_CACHE_INVENTORY_ROOT"]) / "inventory.txt"
          digest = hashlib.sha256(report.read_bytes()).hexdigest()
          (report.parent / "SHA256SUMS").write_text(
              f"{digest}  inventory.txt\n", encoding="utf-8"
          )
          PY

          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Upload target-blind inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deform360-model-cache-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.DEFORM360_CACHE_INVENTORY_ROOT }}/inventory.txt
            ${{ env.DEFORM360_CACHE_INVENTORY_ROOT }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
