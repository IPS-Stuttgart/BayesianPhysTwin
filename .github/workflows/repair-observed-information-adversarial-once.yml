name: One-shot observed-information adversarial test repair

on:
  push:
    branches:
      - agent/observed-information-covariance-v1
    paths:
      - ".github/workflows/repair-observed-information-adversarial-once.yml"
      - "tests/test_observed_information_covariance_adversarial.py"

permissions:
  contents: write

concurrency:
  group: one-shot-observed-information-adversarial-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    name: Use scale-independent diagnostic tampering
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.actor == 'FlorianPfaff'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact same-repository branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/observed-information-covariance-v1
          fetch-depth: 0
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Replace only the scale-sensitive diagnostic mutation
        shell: bash
        env:
          EXPECTED_EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_EVENT_SHA}"
          python -m pip install -e ".[dev]"

          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_observed_information_covariance_adversarial.py")
          text = path.read_text(encoding="utf-8")
          old = "        diagnostics[key] = float(diagnostics[key]) + 1.0\n"
          new = "        diagnostics[key] = -1.0\n"
          count = text.count(old)
          if count == 1:
              path.write_text(text.replace(old, new), encoding="utf-8")
          elif count == 0 and new in text:
              pass
          else:
              raise SystemExit(f"unexpected replacement count: {count}")
          PY

          file=tests/test_observed_information_covariance_adversarial.py
          python -m ruff format "$file"
          python -m ruff check "$file"
          python -m pytest -q \
            tests/test_observed_information_covariance.py \
            tests/test_observed_information_covariance_adversarial.py \
            tests/test_observed_information_covariance_public_surface.py
          git diff --check

          mapfile -t changed < <(git diff --name-only)
          if (( ${#changed[@]} == 0 )); then
            echo "Exact branch head already contains the repair."
            exit 0
          fi
          if (( ${#changed[@]} != 1 )) || [[ "${changed[0]}" != "$file" ]]; then
            printf 'Unexpected changed paths:\n%s\n' "${changed[*]}" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$file"
          git commit -m "Use scale-independent diagnostic drift values"
          git push origin HEAD:refs/heads/agent/observed-information-covariance-v1
