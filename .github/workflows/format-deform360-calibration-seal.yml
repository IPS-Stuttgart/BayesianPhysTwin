name: Format Deform360 calibration seal

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/format-deform360-calibration-seal.yml"

permissions:
  contents: write

concurrency:
  group: format-deform360-calibration-seal-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/deform360-calibration-seal'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Install the formatter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Format, remove this one-shot workflow, and publish
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python -m pip install "ruff==0.16.1"
          python -m ruff format \
            src/bayesian_phystwin/deform360_calibration_execution.py \
            src/bayesian_phystwin/cli/deform360_calibration_execution.py \
            tests/test_deform360_calibration_execution.py
          git rm .github/workflows/format-deform360-calibration-seal.yml
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayesian_phystwin/deform360_calibration_execution.py \
            src/bayesian_phystwin/cli/deform360_calibration_execution.py \
            tests/test_deform360_calibration_execution.py
          git commit -m "Apply deterministic Ruff formatting"
          git push origin "HEAD:${HEAD_REF}"
