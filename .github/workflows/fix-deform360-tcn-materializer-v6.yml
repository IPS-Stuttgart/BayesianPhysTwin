# workflow-lifecycle: temporary-one-shot
# workflow-owner: IPS-Stuttgart maintainers
name: Repair Deform360 selective materializer v6

on:
  push:
    branches: [science/deform360-tcn-fallback-runner-v6]
    paths:
      - ".github/requests/fix-deform360-tcn-materializer-v6.json"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: science/deform360-tcn-fallback-runner-v6
          fetch-depth: 0

      - name: Match frozen evaluator handling of irregular tactile directories
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/science/materialize_deform360_tcn_carriers_v6.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          matches = [
              index
              for index, line in enumerate(lines)
              if line.strip() == "if len(nonmedian) != len(episodes):"
          ]
          if len(matches) != 1:
              raise SystemExit(f"expected one mismatch branch, found {len(matches)}")
          start = matches[0]
          end = next(
              index
              for index in range(start + 1, len(lines))
              if lines[index].strip()
              == "tactile_counts[Path(directory).name] = len(nonmedian)"
          )
          indentation = lines[start][ : len(lines[start]) - len(lines[start].lstrip())]
          replacement = [
              indentation + "if len(nonmedian) != len(episodes):",
              indentation
              + "    # Match the frozen evaluator: ignore tactile directories with",
              indentation + "    # extra or missing non-median episode files.",
              indentation + "    continue",
          ]
          lines = lines[:start] + replacement + lines[end:]
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          python -m py_compile scripts/science/materialize_deform360_tcn_carriers_v6.py
          python - <<'PY'
          from pathlib import Path

          source = Path("scripts/science/materialize_deform360_tcn_carriers_v6.py").read_text()
          if "tactile episode count mismatch" in source:
              raise SystemExit("fatal mismatch behavior remains")
          required = (
              "# Match the frozen evaluator: ignore tactile directories with",
              "if len(nonmedian) != len(episodes):\n            # Match the frozen evaluator",
              "            continue\n        tactile_counts[Path(directory).name]",
          )
          missing = [token for token in required if token not in source]
          if missing:
              raise SystemExit(f"evaluator-compatible repair validation failed: {missing}")
          PY
          git diff --check

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/science/materialize_deform360_tcn_carriers_v6.py
          git commit -m "Match evaluator handling of irregular tactile groups"
          git push origin HEAD:science/deform360-tcn-fallback-runner-v6
