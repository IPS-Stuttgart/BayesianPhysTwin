# workflow-lifecycle: temporary-one-shot
# workflow-owner: IPS-Stuttgart maintainers
name: Repair Deform360 selective materializer v6

on:
  push:
    branches: [science/deform360-tcn-fallback-runner-v6]
    paths:
      - ".github/requests/fix-deform360-tcn-materializer-v6.json"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: science/deform360-tcn-fallback-runner-v6
          fetch-depth: 0

      - name: Add persistent tree cache and rate-limit-aware retries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/science/materialize_deform360_tcn_carriers_v6.py")
          lines = path.read_text(encoding="utf-8").splitlines()

          def replace_region(start_prefix: str, end_prefix: str, replacement: list[str]) -> None:
              global lines
              starts = [i for i, line in enumerate(lines) if line.startswith(start_prefix)]
              if len(starts) != 1:
                  raise SystemExit(f"expected one {start_prefix!r}, found {len(starts)}")
              start = starts[0]
              end = next(
                  i for i in range(start + 1, len(lines)) if lines[i].startswith(end_prefix)
              )
              lines = lines[:start] + replacement + lines[end:]

          class_index = next(
              i for i, line in enumerate(lines) if line.startswith("class MaterializationError")
          )
          if not any(line.startswith("TREE_CACHE_DIRECTORY") for line in lines):
              lines[class_index:class_index] = [
                  "TREE_CACHE_DIRECTORY: Path | None = None",
                  "",
                  "",
              ]

          replace_region(
              "def request_bytes(",
              "def request_json(",
              [
                  "def request_bytes(url: str, *, attempts: int = 20) -> bytes:",
                  "    for attempt in range(attempts):",
                  "        request = urllib.request.Request(url, headers={\"User-Agent\": USER_AGENT})",
                  "        wait_seconds: float | None = None",
                  "        try:",
                  "            with urllib.request.urlopen(request, timeout=180) as response:",
                  "                return response.read()",
                  "        except urllib.error.HTTPError as error:",
                  "            retryable = error.code in {408, 425, 429, 500, 502, 503, 504}",
                  "            if not retryable or attempt + 1 == attempts:",
                  "                raise",
                  "            if error.code == 429:",
                  "                retry_after = error.headers.get(\"Retry-After\")",
                  "                try:",
                  "                    wait_seconds = float(retry_after) if retry_after else 60.0",
                  "                except ValueError:",
                  "                    wait_seconds = 60.0",
                  "                wait_seconds = max(wait_seconds, 60.0)",
                  "        except (TimeoutError, urllib.error.URLError):",
                  "            if attempt + 1 == attempts:",
                  "                raise",
                  "        if wait_seconds is None:",
                  "            wait_seconds = min(2**attempt + random.random(), 30.0)",
                  "        print(",
                  "            f\"http_retry={attempt + 1}/{attempts} wait={wait_seconds:.1f}s url={url}\" ,",
                  "            flush=True,",
                  "        )",
                  "        time.sleep(wait_seconds)",
                  "    raise AssertionError(\"unreachable\")",
                  "",
                  "",
              ],
          )

          replace_region(
              "def list_tree(",
              "def resolve_url(",
              [
                  "def list_tree(repository: str, revision: str, path: str) -> list[dict[str, Any]]:",
                  "    cache_path: Path | None = None",
                  "    if TREE_CACHE_DIRECTORY is not None:",
                  "        cache_key = hashlib.sha256(",
                  "            f\"{repository}\\0{revision}\\0{path}\".encode(\"utf-8\")",
                  "        ).hexdigest()",
                  "        cache_path = TREE_CACHE_DIRECTORY / f\"{cache_key}.json\"",
                  "        if cache_path.is_file():",
                  "            cached = json.loads(cache_path.read_text(encoding=\"utf-8\"))",
                  "            if not isinstance(cached, list):",
                  "                raise MaterializationError(f\"invalid tree cache entry: {cache_path}\")",
                  "            return [dict(item) for item in cached if isinstance(item, Mapping)]",
                  "    value = request_json(tree_url(repository, revision, path))",
                  "    if not isinstance(value, list):",
                  "        raise MaterializationError(",
                  "            f\"unexpected tree response for {repository}@{revision}:{path}\"",
                  "        )",
                  "    normalized = [dict(item) for item in value if isinstance(item, Mapping)]",
                  "    if cache_path is not None:",
                  "        write_json(cache_path, normalized)",
                  "    time.sleep(0.05)",
                  "    return normalized",
                  "",
                  "",
              ],
          )

          main_index = next(i for i, line in enumerate(lines) if line == "def main() -> None:")
          if lines[main_index + 1].strip() != "global TREE_CACHE_DIRECTORY":
              lines.insert(main_index + 1, "    global TREE_CACHE_DIRECTORY")
          root_mkdir_index = next(
              i for i in range(main_index, len(lines)) if lines[i] == "    root.mkdir(parents=True, exist_ok=True)"
          )
          cache_assignment = [
              "    TREE_CACHE_DIRECTORY = root / \".tree-cache\"",
              "    TREE_CACHE_DIRECTORY.mkdir(parents=True, exist_ok=True)",
          ]
          if not any("TREE_CACHE_DIRECTORY = root" in line for line in lines):
              lines[root_mkdir_index + 1 : root_mkdir_index + 1] = cache_assignment

          old_workers = "        max_workers=min(max(args.workers, 1), 12)"
          matches = [i for i, line in enumerate(lines) if line == old_workers]
          if len(matches) != 1:
              raise SystemExit(f"expected one discovery worker cap, found {len(matches)}")
          lines[matches[0]] = "        max_workers=1"

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          python -m py_compile scripts/science/materialize_deform360_tcn_carriers_v6.py
          python - <<'PY'
          from pathlib import Path

          source = Path("scripts/science/materialize_deform360_tcn_carriers_v6.py").read_text()
          required = (
              "TREE_CACHE_DIRECTORY: Path | None = None",
              "attempts: int = 20",
              "wait_seconds = max(wait_seconds, 60.0)",
              "write_json(cache_path, normalized)",
              "global TREE_CACHE_DIRECTORY",
              'TREE_CACHE_DIRECTORY = root / ".tree-cache"',
              "max_workers=1",
          )
          missing = [token for token in required if token not in source]
          if missing:
              raise SystemExit(f"rate-limit repair validation failed: {missing}")
          PY
          git diff --check

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/science/materialize_deform360_tcn_carriers_v6.py
          git commit -m "Make selective carrier discovery resumable"
          git push origin HEAD:science/deform360-tcn-fallback-runner-v6
