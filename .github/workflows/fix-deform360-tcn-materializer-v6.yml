# workflow-lifecycle: temporary-one-shot
# workflow-owner: IPS-Stuttgart maintainers
name: Repair Deform360 selective materializer v6

on:
  push:
    branches: [science/deform360-tcn-fallback-runner-v6]
    paths:
      - ".github/requests/fix-deform360-tcn-materializer-v6.json"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: science/deform360-tcn-fallback-runner-v6
          fetch-depth: 0

      - name: Match frozen evaluator handling of irregular tactile directories
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/science/materialize_deform360_tcn_carriers_v6.py")
          text = path.read_text(encoding="utf-8")
          old = '''        if len(nonmedian) != len(episodes):
              raise MaterializationError(
                  f"tactile episode count mismatch for {object_id}:{directory}: "
                  f"{len(nonmedian)} != {len(episodes)}"
              )
          tactile_counts[Path(directory).name] = len(nonmedian)
          '''
          old = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in old.splitlines()
          ) + "\n"
          new = '''        if len(nonmedian) != len(episodes):
              # Match the frozen evaluator: ignore tactile directories with
              # extra or missing non-median episode files.
              continue
          tactile_counts[Path(directory).name] = len(nonmedian)
          '''
          new = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in new.splitlines()
          ) + "\n"
          if text.count(old) != 1:
              raise SystemExit(f"expected one mismatch block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python -m py_compile scripts/science/materialize_deform360_tcn_carriers_v6.py
          python - <<'PY'
          from pathlib import Path

          source = Path("scripts/science/materialize_deform360_tcn_carriers_v6.py").read_text()
          if "tactile episode count mismatch" in source:
              raise SystemExit("fatal mismatch behavior remains")
          if "if len(nonmedian) != len(episodes):\n            # Match the frozen evaluator" not in source:
              raise SystemExit("evaluator-compatible skip was not installed")
          PY
          git diff --check

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/science/materialize_deform360_tcn_carriers_v6.py
          git commit -m "Match evaluator handling of irregular tactile groups"
          git push origin HEAD:science/deform360-tcn-fallback-runner-v6
