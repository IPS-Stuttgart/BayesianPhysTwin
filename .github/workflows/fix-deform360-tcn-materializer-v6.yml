# workflow-lifecycle: temporary-one-shot
# workflow-owner: IPS-Stuttgart maintainers
name: Repair Deform360 selective materializer v6

on:
  push:
    branches: [science/deform360-tcn-fallback-runner-v6]
    paths:
      - ".github/requests/fix-deform360-tcn-materializer-v6.json"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: science/deform360-tcn-fallback-runner-v6
          fetch-depth: 0

      - name: Match frozen evaluator handling of irregular tactile directories
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/science/materialize_deform360_tcn_carriers_v6.py")
          text = path.read_text(encoding="utf-8")
          start_marker = (
              "    plans: list[DownloadPlan] = []\n"
              "    tactile_counts: dict[str, int] = {}\n"
          )
          end_marker = "\n    for episode_id in episodes:"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''    plans: list[DownloadPlan] = []
          tactile_counts: dict[str, int] = {}
          ignored_tactile_counts: dict[str, int] = {}
          eligible_tactile_directories: list[str] = []
          for directory in tactile_directories:
              children = list_tree(RAW_REPOSITORY, RAW_REVISION, directory)
              selected = sorted(
                  (
                      item
                      for item in children
                      if item.get("type") == "file"
                      and str(item.get("path", "")).lower().endswith(".npy")
                  ),
                  key=lambda item: str(item.get("path")),
              )
              nonmedian = [
                  item
                  for item in selected
                  if not Path(str(item.get("path"))).name.lower().startswith("median_")
              ]
              directory_name = Path(directory).name
              if len(nonmedian) != len(episodes):
                  # Match discover_object(): directories with extra or missing
                  # non-median tactile files are ignored rather than fatal.
                  ignored_tactile_counts[directory_name] = len(nonmedian)
                  continue
              eligible_tactile_directories.append(directory)
              tactile_counts[directory_name] = len(nonmedian)
              for item in selected:
                  source = str(item["path"])
                  destination = root / "raw-repository" / source
                  plans.append(
                      DownloadPlan(
                          repository=RAW_REPOSITORY,
                          revision=RAW_REVISION,
                          source_candidates=(source,),
                          destination=destination,
                          kind="tactile",
                          expected_size=int(item.get("size") or 0) or None,
                      )
                  )
          if len(eligible_tactile_directories) < 2:
              raise MaterializationError(
                  f"too few evaluator-eligible tactile directories for {object_id}: "
                  f"eligible={eligible_tactile_directories}, "
                  f"ignored={ignored_tactile_counts}"
              )
          '''
          replacement = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in replacement.splitlines()
          )
          text = text[:start] + replacement + text[end:]

          old_inventory = (
              '        "tactile_directories": tactile_directories,\n'
              '        "tactile_episode_counts": tactile_counts,\n'
          )
          new_inventory = (
              '        "tactile_directories": tactile_directories,\n'
              '        "eligible_tactile_directories": eligible_tactile_directories,\n'
              '        "tactile_episode_counts": tactile_counts,\n'
              '        "ignored_tactile_episode_counts": ignored_tactile_counts,\n'
          )
          if text.count(old_inventory) != 1:
              raise SystemExit(
                  f"expected one inventory block, found {text.count(old_inventory)}"
              )
          text = text.replace(old_inventory, new_inventory, 1)
          path.write_text(text, encoding="utf-8")
          PY
          python -m py_compile scripts/science/materialize_deform360_tcn_carriers_v6.py
          python - <<'PY'
          from pathlib import Path

          source = Path("scripts/science/materialize_deform360_tcn_carriers_v6.py").read_text()
          required = (
              "ignored_tactile_counts[directory_name] = len(nonmedian)",
              "eligible_tactile_directories.append(directory)",
              '"ignored_tactile_episode_counts": ignored_tactile_counts',
          )
          missing = [token for token in required if token not in source]
          if missing:
              raise SystemExit(f"repair validation failed: {missing}")
          PY
          git diff --check

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/science/materialize_deform360_tcn_carriers_v6.py
          git commit -m "Match evaluator handling of irregular tactile groups"
          git push origin HEAD:science/deform360-tcn-fallback-runner-v6
