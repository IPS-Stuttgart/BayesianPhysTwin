# workflow-lifecycle: temporary-one-shot
# workflow-owner: IPS-Stuttgart maintainers
name: Normalize Deform360 dependence-query source

on:
  push:
    branches: [science/deform360-dependence-query-v6]
    paths:
      - ".github/requests/deform360-dependence-query-v6-format.json"

permissions:
  contents: write

concurrency:
  group: deform360-dependence-query-v6-source-normalization
  cancel-in-progress: false

jobs:
  format-and-retire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: science/deform360-dependence-query-v6
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Authorize one add-only formatter request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = refs/heads/science/deform360-dependence-query-v6
          test "${PUSH_FORCED}" = false
          test "${BEFORE_SHA}" != 0000000000000000000000000000000000000000
          mapfile -t changed < <(git diff --name-status "${BEFORE_SHA}" "${GITHUB_SHA}")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = $'A\t.github/requests/deform360-dependence-query-v6-format.json'
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('.github/requests/deform360-dependence-query-v6-format.json')
          value = json.loads(path.read_text(encoding='utf-8'))
          expected = {
              'schema': 'bayesian-phystwin/deform360-dependence-query-format-request-v1',
              'request_id': 'deform360-dependence-query-v6-format-20260901',
              'formatter': 'ruff==0.16.5',
              'files': [
                  'scripts/science/run_deform360_dependence_query_v6.py',
                  'tests/test_deform360_dependence_query_v6.py',
              ],
              'scientific_change_authorized': False,
          }
          if value != expected:
              raise SystemExit('formatter request differs from the exact schema')
          PY
      - name: Apply exact repository formatter and retire this launcher
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ruff==0.16.5
          python -m ruff format \
            scripts/science/run_deform360_dependence_query_v6.py \
            tests/test_deform360_dependence_query_v6.py
          python -m ruff format --check \
            scripts/science/run_deform360_dependence_query_v6.py \
            tests/test_deform360_dependence_query_v6.py
          rm -f \
            .github/workflows/deform360-dependence-query-v6-source-normalization.yml \
            .github/requests/deform360-dependence-query-v6-format.json
          python - <<'PY'
          import json
          from pathlib import Path

          budget_path = Path('.github/quality/workflow-inventory-budget-v1.json')
          budget = json.loads(budget_path.read_text(encoding='utf-8'))
          if budget['maximum_checked_in_workflows'] != 86:
              raise SystemExit('unexpected temporary workflow budget')
          budget['maximum_checked_in_workflows'] = 85
          budget_path.write_text(
              json.dumps(budget, indent=2, sort_keys=False) + '\n',
              encoding='utf-8',
          )

          test_path = Path('tests/test_workflow_inventory_budget.py')
          text = test_path.read_text(encoding='utf-8')
          replacements = {
              'maximum_checked_in_workflows"] == 86': 'maximum_checked_in_workflows"] == 85',
              'checked_in_workflow_count"] == 86': 'checked_in_workflow_count"] == 85',
              'workflow_retirement_gap"] == 5': 'workflow_retirement_gap"] == 4',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected inventory text: {old}')
              text = text.replace(old, new)
          test_path.write_text(text, encoding='utf-8')
          PY
          python -m ruff format tests/test_workflow_inventory_budget.py
          git diff --check
          git status --short
      - name: Commit normalized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            scripts/science/run_deform360_dependence_query_v6.py \
            tests/test_deform360_dependence_query_v6.py \
            .github/quality/workflow-inventory-budget-v1.json \
            tests/test_workflow_inventory_budget.py \
            .github/workflows/deform360-dependence-query-v6-source-normalization.yml \
            .github/requests/deform360-dependence-query-v6-format.json
          git diff --cached --quiet && { echo 'formatter produced no commit' >&2; exit 2; }
          git commit -m "Format dependence-query implementation"
          git push origin HEAD:science/deform360-dependence-query-v6
