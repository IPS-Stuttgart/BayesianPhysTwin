name: Temporary sort three-repository imports

on:
  push:
    branches:
      - agent/three-repository-golden-path
    paths:
      - ".github/workflows/temporary-sort-three-repository-imports.yml"

permissions:
  contents: write

jobs:
  sort-imports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/three-repository-golden-path
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install "ruff>=0.6"
      - name: Sort imports
        run: >-
          python -m ruff check --fix --
          integration_tests/test_three_repository_evidence.py
          integration_tests/test_three_repository_golden_path.py
          integration_tests/test_three_repository_lineage.py
      - name: Commit formatter output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            integration_tests/test_three_repository_evidence.py \
            integration_tests/test_three_repository_golden_path.py \
            integration_tests/test_three_repository_lineage.py
          if git diff --cached --quiet; then
            echo "Imports already sorted."
            exit 0
          fi
          git commit -m "Sort three-repository integration imports"
          git push origin HEAD:agent/three-repository-golden-path
