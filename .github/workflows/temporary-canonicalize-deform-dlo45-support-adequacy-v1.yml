# workflow-lifecycle: temporary
# workflow-owner: IPS-Stuttgart maintainers
# workflow-issue: #868
# workflow-expiry: 2026-09-15
name: Canonicalize DEFORM support-adequacy prototype

on:
  push:
    branches:
      - science/deform-dlo45-support-adequacy-prototype-v1
    paths:
      - ".github/workflows/temporary-canonicalize-deform-dlo45-support-adequacy-v1.yml"

permissions:
  contents: write

concurrency:
  group: canonicalize-deform-dlo45-support-adequacy-v1
  cancel-in-progress: false

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact prototype branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: science/deform-dlo45-support-adequacy-prototype-v1
          fetch-depth: 1
          persist-credentials: true
          clean: true

      - name: Canonicalize source and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install ruff==0.16.5
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "experiments/deform_dlo45_decision_identifiability_v1/"
              "support_adequacy_audit.py"
          )
          text = path.read_text(encoding="utf-8")
          old = '                    "risk_score": risks[record.stable_id],\n'
          new = (
              '                    "risk_score": (\n'
              '                        risks[record.stable_id]\n'
              '                        if math.isfinite(risks[record.stable_id])\n'
              '                        else None\n'
              '                    ),\n'
          )
          if text.count(old) != 1:
              raise SystemExit("risk-score serialization marker changed")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          files=(
            experiments/deform_dlo45_decision_identifiability_v1/support_adequacy_audit.py
            tests/test_deform_dlo45_support_adequacy_v1.py
          )
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          rm -f .github/workflows/temporary-canonicalize-deform-dlo45-support-adequacy-v1.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            "${files[@]}" \
            .github/workflows/temporary-canonicalize-deform-dlo45-support-adequacy-v1.yml
          git commit -m "Canonicalize support-adequacy prototype"
          git push origin HEAD:science/deform-dlo45-support-adequacy-prototype-v1
