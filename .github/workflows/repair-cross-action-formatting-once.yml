name: Repair cross-action formatting once

on:
  push:
    branches:
      - feature/cross-action-transport-v1

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/cross-action-transport-v1
          fetch-depth: 0
      - name: Apply the formatter-equivalent edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/bayesian_phystwin_experiments/cross_action_transport_contracts_v1.py")
          text = path.read_text(encoding="utf-8")
          replacements = (
              (
                  """        return tuple(\n            (source, target)\n            for source in self.action_ids\n            for target in self.action_ids\n        )\n""",
                  """        return tuple(\n            (source, target) for source in self.action_ids for target in self.action_ids\n        )\n""",
              ),
              (
                  """            \"maximum_harmful_session_fraction\": (\n                self.maximum_harmful_session_fraction\n            ),\n""",
                  """            \"maximum_harmful_session_fraction\": (self.maximum_harmful_session_fraction),\n""",
              ),
              (
                  """        return cast(str, content_id(self.descriptor()))\n\n__all__ = [\n""",
                  """        return cast(str, content_id(self.descriptor()))\n\n\n__all__ = [\n""",
              ),
          )
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one formatter target, found {count}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/repair-cross-action-formatting-once.yml
          git diff --check
      - name: Commit the formatting repair and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bayesian_phystwin_experiments/cross_action_transport_contracts_v1.py .github/workflows/repair-cross-action-formatting-once.yml
          git commit -m "Format cross-action transport contracts"
          git push origin HEAD:feature/cross-action-transport-v1
