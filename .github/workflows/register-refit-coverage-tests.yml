name: Register refit coverage tests

on:
  push:
    branches:
      - agent/fail-closed-phystwin-refit-inputs

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/fail-closed-phystwin-refit-inputs
          fetch-depth: 0
      - name: Register refit tests in stable-core coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('.github/quality/test-suites.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          suite = payload['suites']['stable-core-coverage']
          additions = [
              'tests/test_phystwin_refit.py',
              'tests/test_phystwin_refit_input_contracts.py',
          ]
          anchor = suite.index('tests/test_phystwin_raw_cues.py') + 1
          for name in reversed(additions):
              if name not in suite:
                  suite.insert(anchor, name)
          path.write_text(
              json.dumps(payload, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          rm .github/workflows/register-refit-coverage-tests.yml
      - name: Commit registration and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/quality/test-suites.json \
            .github/workflows/register-refit-coverage-tests.yml
          git commit -m "Register refit tests for coverage"
          git push origin HEAD:agent/fail-closed-phystwin-refit-inputs
