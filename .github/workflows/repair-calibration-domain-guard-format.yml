name: Repair calibration-domain guard formatting once

on:
  push:
    branches: [agent/calibration-domain-guard-v1]

permissions:
  contents: write

concurrency:
  group: repair-calibration-domain-guard-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.ref == 'refs/heads/agent/calibration-domain-guard-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/calibration-domain-guard-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply and validate canonical formatting
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff format \
            src/bayesian_phystwin/calibration_domain_guard.py \
            tests/test_source_competence_calibration_domain_guard.py
          python -m ruff check \
            src/bayesian_phystwin/calibration_domain_guard.py \
            tests/test_source_competence_calibration_domain_guard.py
          python -m ruff format --check \
            src/bayesian_phystwin/calibration_domain_guard.py \
            tests/test_source_competence_calibration_domain_guard.py
          python -m pytest -q \
            tests/test_source_competence_calibration_domain_guard.py
          rm .github/workflows/repair-calibration-domain-guard-format.yml
          git diff --check

      - name: Publish only the validated source repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayesian_phystwin/calibration_domain_guard.py \
            tests/test_source_competence_calibration_domain_guard.py \
            .github/workflows/repair-calibration-domain-guard-format.yml
          git diff --cached --check
          git commit -m "Format calibration-domain guard"
          git push origin HEAD:agent/calibration-domain-guard-v1
