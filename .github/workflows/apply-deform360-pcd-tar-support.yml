name: Apply Deform360 official point-cloud archive support

on:
  push:
    branches:
      - fix/deform360-official-pcd-tar-carrier

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/deform360-official-pcd-tar-carrier
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply and validate archive support
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_deform360_pcd_tar_support.py
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m ruff check \
            experiments/deform360_real_v1/run.py \
            tests/test_deform360_real_v1.py
          python -m ruff format --check \
            experiments/deform360_real_v1/run.py \
            tests/test_deform360_real_v1.py
          python -m pytest -q tests/test_deform360_real_v1.py
          git diff --check

      - name: Commit validated source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            experiments/deform360_real_v1/run.py \
            tests/test_deform360_real_v1.py
          git diff --cached --check
          git commit -m "Support official Deform360 pcd_clean.tar carriers"
          git push origin HEAD:fix/deform360-official-pcd-tar-carrier
