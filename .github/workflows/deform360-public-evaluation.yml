name: Deform360 metadata-only inventory

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deform360-public-evaluation.yml"
      - "configs/sota/deform360_bias_aware_guarded_belief_prospective_v1.json"
      - "configs/sota/deform360_bias_aware_guarded_belief_prospective_v2.json"
      - "docs/deform360_public_evaluation_v1.md"
      - "protocols/deform360_independent_normalized_evidence_v1.json"
      - "scripts/science/run_deform360_public_evaluation.py"
      - "tests/test_deform360_public_evaluation.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deform360-public-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEFORM360_ROOT: /home/github-runner/.cache/datasets/deform360
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  inventory:
    name: Metadata-only cohort inventory
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 60
    steps:
      - name: Check out BayesianPhysTwin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Record runner and mounted-root identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deform360-inventory
          test -d "${DEFORM360_ROOT}"
          resolved_root="$(readlink -f "${DEFORM360_ROOT}")"
          echo "DEFORM360_ROOT=${resolved_root}" >> "${GITHUB_ENV}"
          {
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "revision=${GITHUB_SHA}"
            echo "dataset_root=${resolved_root}"
            uname -a
            python --version
          } | tee deform360-inventory/environment.txt
          nvidia-smi --query-gpu=name,uuid,driver_version,memory.total \
            --format=csv,noheader \
            | tee deform360-inventory/gpus.csv

      - name: Inventory names only without opening dataset payloads
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from collections import Counter, defaultdict
          from pathlib import Path

          root = Path(os.environ["DEFORM360_ROOT"]).resolve()
          repository = Path.cwd()
          v1 = json.loads(
              (
                  repository
                  / "configs/sota/deform360_bias_aware_guarded_belief_prospective_v1.json"
              ).read_text(encoding="utf-8")
          )["config"]
          v2 = json.loads(
              (
                  repository
                  / "configs/sota/deform360_bias_aware_guarded_belief_prospective_v2.json"
              ).read_text(encoding="utf-8")
          )["config"]
          known_objects = set(map(str, v1["open_or_reserved_objects"]))
          for values in v1["candidate_pools"].values():
              known_objects.update(map(str, values))
          for cohort_name in ("calibration_cohort", "target_cohort"):
              for records in v2[cohort_name].values():
                  known_objects.update(str(record["object_id"]) for record in records)
          known_objects = set(sorted(known_objects))
          object_episode_pattern = {
              object_id: re.compile(
                  rf"^{re.escape(object_id)}-ep(\d{{1,4}})$", re.IGNORECASE
              )
              for object_id in known_objects
          }
          generic_episode_pattern = re.compile(
              r"(?:episode[_-]?|ep)(\d{1,4})", re.IGNORECASE
          )
          numeric_extensions = {".npz", ".npy", ".h5", ".ply"}
          extensions = Counter()
          object_sample_paths: dict[str, list[str]] = defaultdict(list)
          object_numeric_paths: dict[str, list[str]] = defaultdict(list)
          object_episodes: dict[str, set[int]] = defaultdict(set)
          top_level = []
          total_files = 0
          total_directories = 0

          for path in sorted(root.iterdir()):
              top_level.append(
                  {
                      "name": path.name,
                      "kind": "directory" if path.is_dir() else "file",
                  }
              )

          def identify(parts: tuple[str, ...]) -> tuple[str | None, int | None]:
              object_id = None
              episode = None
              for part in parts:
                  if part in known_objects:
                      object_id = part
                      break
                  for candidate, pattern in object_episode_pattern.items():
                      match = pattern.fullmatch(part)
                      if match is not None:
                          object_id = candidate
                          episode = int(match.group(1))
                          break
                  if object_id is not None:
                      break
              if object_id is None:
                  return None, None
              if episode is None:
                  for part in parts:
                      match = generic_episode_pattern.search(part)
                      if match is not None:
                          episode = int(match.group(1))
                          break
              return object_id, episode

          for directory, names, files in os.walk(root):
              names[:] = sorted(
                  name
                  for name in names
                  if name not in {".git", "__pycache__", "node_modules"}
              )
              total_directories += 1
              for name in sorted(files):
                  total_files += 1
                  suffix = Path(name).suffix.lower() or "<none>"
                  extensions[suffix] += 1
                  relative = (Path(directory) / name).relative_to(root).as_posix()
                  object_id, episode = identify(tuple(relative.split("/")))
                  if object_id is None:
                      continue
                  if len(object_sample_paths[object_id]) < 25:
                      object_sample_paths[object_id].append(relative)
                  if suffix in numeric_extensions:
                      object_numeric_paths[object_id].append(relative)
                  if episode is not None:
                      object_episodes[object_id].add(episode)

          objects = [
              {
                  "object_id": object_id,
                  "episode_ids_from_names": sorted(object_episodes[object_id]),
                  "sample_paths": sorted(object_sample_paths[object_id]),
                  "numeric_paths": sorted(set(object_numeric_paths[object_id])),
                  "numeric_path_counts": dict(
                      sorted(
                          Counter(
                              Path(path).suffix.lower()
                              for path in object_numeric_paths[object_id]
                          ).items()
                      )
                  ),
              }
              for object_id in sorted(known_objects)
              if object_sample_paths[object_id] or object_numeric_paths[object_id]
          ]
          payload = {
              "schema": "bayesian-phystwin/deform360-name-inventory-v1",
              "schema_version": 1,
              "repository_revision": os.environ["GITHUB_SHA"],
              "dataset_root": str(root),
              "known_object_vocabulary_count": len(known_objects),
              "information_boundary": {
                  "dataset_payload_opened": False,
                  "file_contents_hashed": False,
                  "names_and_directory_structure_only": True,
                  "reserved_target_outcomes_opened": False,
              },
              "total_files": total_files,
              "total_directories": total_directories,
              "object_count": len(objects),
              "top_level": top_level,
              "extension_counts": dict(sorted(extensions.items())),
              "objects": objects,
          }
          canonical = json.dumps(
              payload,
              sort_keys=True,
              separators=(",", ":"),
              allow_nan=False,
          ).encode("utf-8")
          payload["inventory_sha256"] = hashlib.sha256(canonical).hexdigest()
          destination = Path("deform360-inventory/inventory.json")
          destination.write_text(
              json.dumps(payload, indent=2, sort_keys=True, allow_nan=False)
              + "\n",
              encoding="utf-8",
          )
          print(
              json.dumps(
                  {
                      "object_count": payload["object_count"],
                      "total_files": payload["total_files"],
                      "inventory_sha256": payload["inventory_sha256"],
                      "objects_with_npz": sum(
                          bool(item["numeric_path_counts"].get(".npz"))
                          for item in objects
                      ),
                      "objects_with_h5": sum(
                          bool(item["numeric_path_counts"].get(".h5"))
                          for item in objects
                      ),
                  },
                  indent=2,
                  sort_keys=True,
              )
          )
          PY

      - name: Verify tracked tree remained clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git status --porcelain=v1 --untracked-files=no \
            | tee deform360-inventory/git-status.txt
          test ! -s deform360-inventory/git-status.txt

      - name: Publish metadata-only summary
        if: always()
        shell: bash
        run: |
          if [[ -f deform360-inventory/inventory.json ]]; then
            python - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json
          from pathlib import Path

          payload = json.loads(
              Path("deform360-inventory/inventory.json").read_text(
                  encoding="utf-8"
              )
          )
          print("### Deform360 metadata-only inventory")
          print()
          print(f"- Objects found: `{payload['object_count']}`")
          print(f"- Files named: `{payload['total_files']}`")
          print(f"- Inventory SHA-256: `{payload['inventory_sha256']}`")
          print("- Dataset payloads opened: `false`")
          print("- Reserved target outcomes opened: `false`")
          PY
          else
            echo "### Deform360 metadata-only inventory" >> "${GITHUB_STEP_SUMMARY}"
            echo >> "${GITHUB_STEP_SUMMARY}"
            echo "No inventory artifact was produced." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload metadata-only inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deform360-name-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: deform360-inventory
          if-no-files-found: error
          retention-days: 30
