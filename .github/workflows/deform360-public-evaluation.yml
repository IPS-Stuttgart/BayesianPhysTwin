name: Deform360 public-data evaluation

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/science/run_deform360_public_evaluation.py"
      - "tests/test_deform360_public_evaluation.py"
      - "docs/deform360_public_evaluation_v1.md"
      - ".github/workflows/deform360-public-evaluation.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: Evaluation scale
        required: true
        default: standard
        type: choice
        options:
          - smoke
          - standard
          - full

permissions:
  contents: read

concurrency:
  group: deform360-public-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEFORM360_ROOT: /home/github-runner/.cache/datasets/deform360
  EVAL_PROFILE: ${{ inputs.profile || 'standard' }}
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  evaluate:
    name: Rolling public Deform360 benchmark
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 360
    steps:
      - name: Check out BayesianPhysTwin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Create isolated environment
        shell: bash
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=${PWD}/.venv" >> "${GITHUB_ENV}"
          echo "${PWD}/.venv/bin" >> "${GITHUB_PATH}"

      - name: Record runner and dataset identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deform360-evaluation
          test -d "${DEFORM360_ROOT}"
          resolved_root="$(readlink -f "${DEFORM360_ROOT}")"
          echo "DEFORM360_ROOT=${resolved_root}" >> "${GITHUB_ENV}"
          {
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "revision=${GITHUB_SHA}"
            echo "profile=${EVAL_PROFILE}"
            echo "dataset_root=${resolved_root}"
            uname -a
            python --version
            du -sh "${resolved_root}"
          } | tee deform360-evaluation/environment.txt
          nvidia-smi --query-gpu=name,uuid,driver_version,memory.total \
            --format=csv,noheader \
            | tee deform360-evaluation/gpus.csv

      - name: Inventory mounted Deform360 release
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          root = Path(os.environ["DEFORM360_ROOT"]).resolve()
          extensions = Counter()
          top_level = []
          sample_paths = []
          total_files = 0
          for path in sorted(root.iterdir()):
              top_level.append(
                  {
                      "name": path.name,
                      "kind": "directory" if path.is_dir() else "file",
                  }
              )
          for directory, names, files in os.walk(root):
              names[:] = sorted(name for name in names if name != ".git")
              for name in sorted(files):
                  total_files += 1
                  suffix = Path(name).suffix.lower() or "<none>"
                  extensions[suffix] += 1
                  if len(sample_paths) < 500:
                      sample_paths.append(
                          str((Path(directory) / name).relative_to(root))
                      )
          payload = {
              "root": str(root),
              "total_files": total_files,
              "top_level": top_level,
              "extension_counts": dict(sorted(extensions.items())),
              "sample_paths": sample_paths,
          }
          destination = Path("deform360-evaluation/dataset-inventory.json")
          destination.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Install evaluation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,graph]"
          python -m pip check

      - name: Run focused evaluation tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q tests/test_deform360_public_evaluation.py \
            | tee deform360-evaluation/tests.log

      - name: Run rolling public-data evaluation
        shell: bash
        run: |
          set -euo pipefail
          case "${EVAL_PROFILE}" in
            smoke)
              max_archives=8
              max_frames=32
              max_tracks=512
              ;;
            standard)
              max_archives=64
              max_frames=96
              max_tracks=2048
              ;;
            full)
              max_archives=256
              max_frames=256
              max_tracks=4096
              ;;
            *)
              echo "Unsupported profile: ${EVAL_PROFILE}" >&2
              exit 2
              ;;
          esac
          python scripts/science/run_deform360_public_evaluation.py \
            --data-root "${DEFORM360_ROOT}" \
            --output deform360-evaluation/result.json \
            --max-archives "${max_archives}" \
            --max-frames-per-archive "${max_frames}" \
            --max-tracks "${max_tracks}" \
            | tee deform360-evaluation/evaluation.log

      - name: Render concise result summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result_path = Path("deform360-evaluation/result.json")
          output = Path("deform360-evaluation/summary.md")
          if not result_path.is_file():
              output.write_text(
                  "# Deform360 evaluation\n\nNo result JSON was produced.\n",
                  encoding="utf-8",
              )
              raise SystemExit(0)
          result = json.loads(result_path.read_text(encoding="utf-8"))
          lines = [
              "# Deform360 public-data evaluation",
              "",
              f"- Result SHA-256: `{result['result_sha256']}`",
              "- Dataset access: read-only",
              "- Prediction: rolling causal prefix",
              "- Claim: external diagnostic, not official Table-4 parity",
              "",
              "```json",
              json.dumps(result["summary"], indent=2, sort_keys=True),
              "```",
              "",
          ]
          output.write_text("\n".join(lines), encoding="utf-8")
          PY
          cat deform360-evaluation/summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Record resolved environment
        if: always()
        shell: bash
        run: |
          python -m pip freeze \
            | tee deform360-evaluation/pip-freeze.txt
          git status --short \
            | tee deform360-evaluation/git-status.txt

      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deform360-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: deform360-evaluation
          if-no-files-found: error
          retention-days: 30
