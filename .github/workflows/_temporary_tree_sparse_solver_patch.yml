name: Temporary tree-sparse solver artifact

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/_temporary_tree_sparse_solver_patch.yml"
      - "scripts/_temporary_tree_sparse_solver_patch.py"
      - "src/bayesian_phystwin/sparse_prior_aware_gauge_belief.py"

permissions:
  contents: read

concurrency:
  group: temporary-tree-sparse-solver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact reviewed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Generate and validate patched solver
        shell: bash
        run: |
          set -euo pipefail
          sed -i \
            's/        information = np.zeros/        information: np.ndarray = np.zeros/' \
            scripts/_temporary_tree_sparse_solver_patch.py
          python scripts/_temporary_tree_sparse_solver_patch.py
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python -m ruff format src/bayesian_phystwin/sparse_prior_aware_gauge_belief.py
          python -m ruff check src/bayesian_phystwin/sparse_prior_aware_gauge_belief.py
          python -m mypy --python-version 3.12 \
            src/bayesian_phystwin/sparse_prior_aware_gauge_belief.py
          python -m pytest -q \
            tests/test_sparse_prior_aware_gauge_belief.py \
            tests/test_sparse_explicit_gauge_prob4d.py

      - name: Upload exact patched solver
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: tree-sparse-solver-source
          path: src/bayesian_phystwin/sparse_prior_aware_gauge_belief.py
          if-no-files-found: error
          retention-days: 1
