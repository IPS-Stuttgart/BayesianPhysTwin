name: Temporary tree-sparse solver patch

on:
  push:
    branches:
      - agent/consume-claim-bearing-tree-sparse-prob4d

permissions:
  contents: write

concurrency:
  group: temporary-tree-sparse-solver-patch
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[tree-sparse-solver-patch]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply precision-form causal-tree gauge support
        run: python scripts/_temporary_tree_sparse_solver_patch.py

      - name: Validate solver patch
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python -m ruff format src/bayesian_phystwin/sparse_prior_aware_gauge_belief.py
          python -m ruff check src/bayesian_phystwin/sparse_prior_aware_gauge_belief.py
          python -m mypy --python-version 3.12 \
            src/bayesian_phystwin/sparse_prior_aware_gauge_belief.py
          python -m pytest -q \
            tests/test_sparse_prior_aware_gauge_belief.py \
            tests/test_sparse_explicit_gauge_prob4d.py

      - name: Publish solver patch and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_temporary_tree_sparse_solver_patch.yml
          rm scripts/_temporary_tree_sparse_solver_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayesian_phystwin/sparse_prior_aware_gauge_belief.py \
            .github/workflows/_temporary_tree_sparse_solver_patch.yml \
            scripts/_temporary_tree_sparse_solver_patch.py
          git commit -m "Add precision-form causal-tree gauge priors [tree-sparse-solver-patch]"
          git push origin HEAD:agent/consume-claim-bearing-tree-sparse-prob4d
