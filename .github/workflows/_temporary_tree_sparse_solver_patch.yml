name: Temporary tree-sparse solver publisher

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/_temporary_tree_sparse_solver_patch.yml"
      - "scripts/_temporary_tree_sparse_solver_patch.py"
      - "src/bayesian_phystwin/sparse_prior_aware_gauge_belief.py"

permissions:
  contents: write

concurrency:
  group: temporary-tree-sparse-solver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact reviewed branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Generate and validate exact solver source
        shell: bash
        run: |
          set -euo pipefail
          sed -i \
            's/        information = np.zeros/        information: np.ndarray = np.zeros/' \
            scripts/_temporary_tree_sparse_solver_patch.py
          python scripts/_temporary_tree_sparse_solver_patch.py
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python -m ruff format src/bayesian_phystwin/sparse_prior_aware_gauge_belief.py
          python -m ruff check src/bayesian_phystwin/sparse_prior_aware_gauge_belief.py
          python -m mypy --python-version 3.12 \
            src/bayesian_phystwin/sparse_prior_aware_gauge_belief.py
          python -m pytest -q \
            tests/test_sparse_prior_aware_gauge_belief.py \
            tests/test_sparse_explicit_gauge_prob4d.py

      - name: Publish validated source and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_temporary_tree_sparse_solver_patch.yml
          rm scripts/_temporary_tree_sparse_solver_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayesian_phystwin/sparse_prior_aware_gauge_belief.py \
            .github/workflows/_temporary_tree_sparse_solver_patch.yml \
            scripts/_temporary_tree_sparse_solver_patch.py
          git commit -m "Add precision-form causal-tree gauge priors [tree-sparse-solver-patch]"
          git push origin HEAD:agent/consume-claim-bearing-tree-sparse-prob4d
