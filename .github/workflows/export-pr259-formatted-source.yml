name: Export PR 259 canonical formatted source

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/export-pr259-formatted-source.yml"
      - ".github/workflows/one-shot-fix-deform360-visual-jobs.yml"
      - "scripts/science/build_deform360_calibration_visual_jobs.py"
      - "src/bayesian_phystwin/deform360_calibration_visual_jobs.py"
      - "tests/conftest.py"
      - "tests/test_deform360_calibration_visual_jobs.py"

permissions:
  contents: read

concurrency:
  group: export-pr259-formatted-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  export:
    name: Canonical Ruff output and focused diagnostics
    if: github.event.pull_request.number == 259
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install exact validation environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1"
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Apply the two known lint fixes and canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          product = Path(
              "src/bayesian_phystwin/deform360_calibration_visual_jobs.py"
          )
          text = product.read_text(encoding="utf-8")
          anchor = "    genuine_boolean,\n"
          if text.count(anchor) != 1:
              raise SystemExit("unused-import anchor changed")
          product.write_text(text.replace(anchor, ""), encoding="utf-8")

          tests = Path("tests/test_deform360_calibration_visual_jobs.py")
          text = tests.read_text(encoding="utf-8")
          anchor = '.encode("utf-8")'
          if text.count(anchor) != 1:
              raise SystemExit("redundant-encoding anchor changed")
          tests.write_text(text.replace(anchor, ".encode()"), encoding="utf-8")
          PY
          files=(
            scripts/science/build_deform360_calibration_visual_jobs.py
            src/bayesian_phystwin/deform360_calibration_visual_jobs.py
            tests/conftest.py
            tests/test_deform360_calibration_visual_jobs.py
          )
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"

      - name: Run strict typing
        id: typing
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m mypy \
            scripts/science/build_deform360_calibration_visual_jobs.py \
            src/bayesian_phystwin/deform360_calibration_visual_jobs.py \
            | tee mypy.txt

      - name: Run focused contracts
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -p no:cacheprovider \
            tests/test_deform360_calibration_visual_jobs.py \
            tests/test_deform360_calibration_observability_batch.py \
            tests/test_deform360_calibration_source_run_record.py \
            tests/test_deform360_visual_provider_lock.py \
            tests/test_deform360_bias_aware_prospective_staging.py \
            | tee pytest.txt

      - name: Record exact formatted file identities
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            scripts/science/build_deform360_calibration_visual_jobs.py \
            src/bayesian_phystwin/deform360_calibration_visual_jobs.py \
            tests/conftest.py \
            tests/test_deform360_calibration_visual_jobs.py \
            > SHA256SUMS

      - name: Upload exact formatted source and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pr259-canonical-formatted-${{ github.run_id }}
          path: |
            scripts/science/build_deform360_calibration_visual_jobs.py
            src/bayesian_phystwin/deform360_calibration_visual_jobs.py
            tests/conftest.py
            tests/test_deform360_calibration_visual_jobs.py
            SHA256SUMS
            mypy.txt
            pytest.txt
          if-no-files-found: error
          retention-days: 1

      - name: Fail when diagnostics failed
        if: steps.typing.outcome != 'success' || steps.tests.outcome != 'success'
        shell: bash
        run: exit 1
