name: Three-repository installed-wheel golden path

on:
  pull_request:
    paths:
      - ".github/workflows/three-repository-golden-path.yml"
      - "scripts/run_three_repository_golden_path.sh"
      - "integration_tests/**"
      - "tests/fixtures/prob4d_joint_observation_v1.json"
      - "tests/test_prob4d_joint_contract_fixture.py"
      - "tests/test_prob4d_causal_lineage.py"
      - "tests/test_three_repository_workflow.py"
      - "tests/test_ecosystem_compatibility.py"
      - "tests/test_endpoint_model_average.py"
      - "tests/test_prospective_prob4d_update.py"
      - "docs/three_repository_golden_path.md"
      - "docs/ecosystem_compatibility.md"
      - "docs/prospective_belief_updates_v1.md"
      - "pyproject.toml"
      - "src/bayesian_phystwin/data/ecosystem_compatibility_v1.json"
      - "src/bayesian_phystwin/ecosystem_compatibility.py"
      - "src/bayesian_phystwin/cli/ecosystem_validate.py"
      - "src/bayesian_phystwin/causal4d_artifacts_v1.py"
      - "src/bayesian_phystwin/causal4d_belief_provider_v1.py"
      - "src/bayesian_phystwin/causal4d_belief_provider_v2.py"
      - "src/bayesian_phystwin/causal4d_provider_v1.py"
      - "src/bayesian_phystwin/causal4d_provider_v2.py"
      - "src/bayesian_phystwin/causal4d_graph_provider_v1.py"
      - "src/bayesian_phystwin/causal4d_public_provider_v1.py"
      - "src/bayesian_phystwin/causal4d_scientific_provider_v1.py"
      - "src/bayesian_phystwin/contracts/**"
      - "src/bayesian_phystwin/phystwin/**"
      - "src/bayesian_phystwin/cli/provider_manifest.py"
      - "src/bayesian_phystwin/evidence_policy.py"
      - "src/bayesian_phystwin/endpoint_model_average.py"
      - "src/bayesian_phystwin/prospective_prob4d_update.py"
      - "src/bayesian_phystwin/observation_belief.py"
      - "src/bayesian_phystwin/observation_belief_gauge_adapter.py"
      - "src/bayesian_phystwin/prob4d_causal_lineage.py"
      - "src/bayesian_phystwin/prob4d_observation_contract.py"
      - "src/bayesian_phystwin/prob4d_provider_attestation.py"
      - "src/bayesian_phystwin/gauge_aware_belief.py"
      - "src/bayesian_phystwin/_gauge_aware_contracts.py"
      - "src/bayesian_phystwin/_gauge_aware_solver.py"
      - "src/bayesian_phystwin/repository_provenance.py"
      - "src/bayesian_phystwin/run_manifest.py"
      - "src/bayesian_phystwin/run_manifest_v2.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/three-repository-golden-path.yml"
      - "scripts/run_three_repository_golden_path.sh"
      - "integration_tests/**"
      - "tests/fixtures/prob4d_joint_observation_v1.json"
      - "tests/test_prob4d_joint_contract_fixture.py"
      - "tests/test_prob4d_causal_lineage.py"
      - "tests/test_three_repository_workflow.py"
      - "tests/test_ecosystem_compatibility.py"
      - "tests/test_endpoint_model_average.py"
      - "tests/test_prospective_prob4d_update.py"
      - "docs/three_repository_golden_path.md"
      - "docs/ecosystem_compatibility.md"
      - "docs/prospective_belief_updates_v1.md"
      - "pyproject.toml"
      - "src/bayesian_phystwin/data/ecosystem_compatibility_v1.json"
      - "src/bayesian_phystwin/ecosystem_compatibility.py"
      - "src/bayesian_phystwin/cli/ecosystem_validate.py"
      - "src/bayesian_phystwin/causal4d_artifacts_v1.py"
      - "src/bayesian_phystwin/causal4d_belief_provider_v1.py"
      - "src/bayesian_phystwin/causal4d_belief_provider_v2.py"
      - "src/bayesian_phystwin/causal4d_provider_v1.py"
      - "src/bayesian_phystwin/causal4d_provider_v2.py"
      - "src/bayesian_phystwin/causal4d_graph_provider_v1.py"
      - "src/bayesian_phystwin/causal4d_public_provider_v1.py"
      - "src/bayesian_phystwin/causal4d_scientific_provider_v1.py"
      - "src/bayesian_phystwin/contracts/**"
      - "src/bayesian_phystwin/phystwin/**"
      - "src/bayesian_phystwin/cli/provider_manifest.py"
      - "src/bayesian_phystwin/evidence_policy.py"
      - "src/bayesian_phystwin/endpoint_model_average.py"
      - "src/bayesian_phystwin/prospective_prob4d_update.py"
      - "src/bayesian_phystwin/observation_belief.py"
      - "src/bayesian_phystwin/observation_belief_gauge_adapter.py"
      - "src/bayesian_phystwin/prob4d_causal_lineage.py"
      - "src/bayesian_phystwin/prob4d_observation_contract.py"
      - "src/bayesian_phystwin/prob4d_provider_attestation.py"
      - "src/bayesian_phystwin/gauge_aware_belief.py"
      - "src/bayesian_phystwin/_gauge_aware_contracts.py"
      - "src/bayesian_phystwin/_gauge_aware_solver.py"
      - "src/bayesian_phystwin/repository_provenance.py"
      - "src/bayesian_phystwin/run_manifest.py"
      - "src/bayesian_phystwin/run_manifest_v2.py"
  repository_dispatch:
    types:
      - prob4d-compatibility
      - causal4d-compatibility
  workflow_dispatch:
    inputs:
      prob4d_ref:
        description: Optional Prob4D branch, tag, or commit; blank uses the lock
        required: false
        type: string
        default: ""
      causal4d_ref:
        description: Optional Causal4D branch, tag, or commit; blank uses the lock
        required: false
        type: string
        default: ""
      run_latest_main_canary:
        description: Also test both current main branches as a non-blocking canary
        required: false
        type: boolean
        default: true
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: >-
    three-repository-golden-path-${{ github.workflow }}-${{ github.ref }}-
    ${{ github.event.client_payload.prob4d_ref || inputs.prob4d_ref || 'locked' }}-
    ${{ github.event.client_payload.causal4d_ref || inputs.causal4d_ref || 'locked' }}
  cancel-in-progress: true

env:
  BPT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PROB4D_CHECKOUT_REPOSITORY: IPS-Stuttgart/Prob4D

jobs:
  resolve-lock:
    name: Resolve committed ecosystem lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      prob4d_ref: ${{ steps.resolve.outputs.prob4d_ref }}
      causal4d_ref: ${{ steps.resolve.outputs.causal4d_ref }}
      lock_enforced: ${{ steps.resolve.outputs.lock_enforced }}
      locked_prob4d_ref: ${{ steps.resolve.outputs.locked_prob4d_ref }}
      locked_causal4d_ref: ${{ steps.resolve.outputs.locked_causal4d_ref }}
    steps:
      - name: Check out exact Bayesian-PhysTwin source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BPT_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve locked or explicit companion revisions
        id: resolve
        env:
          PROB4D_OVERRIDE: >-
            ${{ github.event.client_payload.prob4d_ref || inputs.prob4d_ref || '' }}
          CAUSAL4D_OVERRIDE: >-
            ${{ github.event.client_payload.causal4d_ref || inputs.causal4d_ref || '' }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t locked_refs < <(python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path(
                  "src/bayesian_phystwin/data/ecosystem_compatibility_v1.json"
              ).read_text(encoding="utf-8")
          )
          print(payload["components"]["prob4d"]["revision"])
          print(payload["components"]["causal4d"]["revision"])
          PY
          )
          test "${#locked_refs[@]}" -eq 2
          locked_prob4d_ref="${locked_refs[0]}"
          locked_causal4d_ref="${locked_refs[1]}"
          selected_prob4d_ref="${PROB4D_OVERRIDE:-${locked_prob4d_ref}}"
          selected_causal4d_ref="${CAUSAL4D_OVERRIDE:-${locked_causal4d_ref}}"
          lock_enforced=true
          if [[ -n "${PROB4D_OVERRIDE}" || -n "${CAUSAL4D_OVERRIDE}" ]]; then
            lock_enforced=false
          fi
          {
            echo "prob4d_ref=${selected_prob4d_ref}"
            echo "causal4d_ref=${selected_causal4d_ref}"
            echo "lock_enforced=${lock_enforced}"
            echo "locked_prob4d_ref=${locked_prob4d_ref}"
            echo "locked_causal4d_ref=${locked_causal4d_ref}"
          } >> "${GITHUB_OUTPUT}"

  consumer-contract-fixture:
    name: BPT + Causal4D consumer fixture / Python 3.12
    needs: resolve-lock
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact Bayesian-PhysTwin source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BPT_SOURCE_SHA }}
          path: bayesian-phystwin
          fetch-depth: 1
          persist-credentials: false

      - name: Check out selected Causal4D consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/Causal4D
          ref: ${{ needs.resolve-lock.outputs.causal4d_ref }}
          path: causal4d
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            bayesian-phystwin/pyproject.toml
            causal4d/pyproject.toml

      - name: Install both consumer packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./bayesian-phystwin[dev]"
          python -m pip install -e "./causal4d[dev]"

      - name: Validate the Bayesian-PhysTwin consumer fixture
        run: |
          python -m pytest -q \
            bayesian-phystwin/tests/test_prob4d_joint_contract_fixture.py \
            bayesian-phystwin/tests/test_prob4d_causal_lineage.py \
            bayesian-phystwin/tests/test_three_repository_workflow.py \
            bayesian-phystwin/tests/test_ecosystem_compatibility.py

      - name: Validate the Causal4D consumer fixture
        run: |
          python -m pytest -q \
            causal4d/tests/test_prob4d_joint_contract_fixture.py \
            causal4d/tests/test_observation_contract_bundle.py \
            causal4d/tests/test_observation_lineage.py

      - name: Record fixture-gate scope
        run: |
          {
            echo "### Always-executed consumer contract fixture"
            echo
            echo "BayesianPhysTwin and Causal4D independently validated the checked-in observation fixture."
            echo "This detects consumer/schema drift but does not replace the"
            echo "installed-wheel Prob4D -> BayesianPhysTwin -> Causal4D gate."
            echo
            echo "Causal4D ref: \`${{ needs.resolve-lock.outputs.causal4d_ref }}\`"
            echo "Exact committed lock: \`${{ needs.resolve-lock.outputs.lock_enforced }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  installed-wheel-golden-path:
    name: Prob4D -> BPT -> Causal4D / Python 3.12
    needs: [resolve-lock, consumer-contract-fixture]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact Bayesian-PhysTwin source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BPT_SOURCE_SHA }}
          path: bayesian-phystwin
          fetch-depth: 1
          persist-credentials: false

      - name: Check out selected Prob4D producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PROB4D_CHECKOUT_REPOSITORY }}
          ref: ${{ needs.resolve-lock.outputs.prob4d_ref }}
          path: prob4d
          fetch-depth: 1
          persist-credentials: false

      - name: Check out selected Causal4D consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/Causal4D
          ref: ${{ needs.resolve-lock.outputs.causal4d_ref }}
          path: causal4d
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            bayesian-phystwin/pyproject.toml
            prob4d/pyproject.toml
            causal4d/pyproject.toml

      - name: Build, install, validate, and execute the isolated golden path
        env:
          THREE_REPOSITORY_COMPATIBILITY_REPORT: >-
            ${{ github.workspace }}/three-repository-compatibility.json
          THREE_REPOSITORY_REQUIRE_LOCKED_REVISIONS: >-
            ${{ needs.resolve-lock.outputs.lock_enforced }}
        run: |
          bash bayesian-phystwin/scripts/run_three_repository_golden_path.sh \
            bayesian-phystwin \
            prob4d \
            causal4d

      - name: Upload installed-wheel compatibility report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: three-repository-compatibility
          path: three-repository-compatibility.json
          if-no-files-found: error
          retention-days: 14

      - name: Record tested repository refs
        run: |
          {
            echo "### Tested repository refs"
            echo
            echo "- Prob4D ref: \`${{ needs.resolve-lock.outputs.prob4d_ref }}\`"
            echo "- Prob4D checkout repository: \`${PROB4D_CHECKOUT_REPOSITORY}\`"
            echo "- Prob4D project identity: \`github-repository-id:1295794737\`"
            echo "- BayesianPhysTwin: \`${BPT_SOURCE_SHA}\`"
            echo "- Causal4D: \`${{ needs.resolve-lock.outputs.causal4d_ref }}\`"
            echo "- exact committed lock: \`${{ needs.resolve-lock.outputs.lock_enforced }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  latest-main-canary:
    name: Latest Prob4D and Causal4D main canary
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_latest_main_canary)
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact Bayesian-PhysTwin source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BPT_SOURCE_SHA }}
          path: bayesian-phystwin
          fetch-depth: 1
          persist-credentials: false

      - name: Check out latest public Prob4D main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PROB4D_CHECKOUT_REPOSITORY }}
          ref: main
          path: prob4d
          fetch-depth: 1
          persist-credentials: false

      - name: Check out latest public Causal4D main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/Causal4D
          ref: main
          path: causal4d
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            bayesian-phystwin/pyproject.toml
            prob4d/pyproject.toml
            causal4d/pyproject.toml

      - name: Build and execute the latest-main installed-wheel canary
        env:
          THREE_REPOSITORY_COMPATIBILITY_REPORT: >-
            ${{ github.workspace }}/three-repository-main-canary.json
          THREE_REPOSITORY_REQUIRE_LOCKED_REVISIONS: "false"
        run: |
          bash bayesian-phystwin/scripts/run_three_repository_golden_path.sh \
            bayesian-phystwin \
            prob4d \
            causal4d

      - name: Record latest-main revisions
        if: always()
        run: |
          {
            echo "### Latest-main canary"
            echo
            echo "- Prob4D: \`$(git -C prob4d rev-parse HEAD)\`"
            echo "- BayesianPhysTwin: \`${BPT_SOURCE_SHA}\`"
            echo "- Causal4D: \`$(git -C causal4d rev-parse HEAD)\`"
            echo
            echo "This lane is advisory and does not replace the committed lock."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload latest-main canary report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: three-repository-main-canary
          path: three-repository-main-canary.json
          if-no-files-found: warn
          retention-days: 7
