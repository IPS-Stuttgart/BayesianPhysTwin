name: Three-repository installed-wheel golden path

on:
  pull_request:
    paths:
      - ".github/workflows/three-repository-golden-path.yml"
      - "scripts/run_three_repository_golden_path.sh"
      - "integration_tests/**"
      - "docs/three_repository_golden_path.md"
      - "pyproject.toml"
      - "src/bayesian_phystwin/causal4d_provider_v1.py"
      - "src/bayesian_phystwin/causal4d_provider_v2.py"
      - "src/bayesian_phystwin/causal4d_graph_provider_v1.py"
      - "src/bayesian_phystwin/contracts/**"
      - "src/bayesian_phystwin/phystwin/**"
      - "src/bayesian_phystwin/cli/provider_manifest.py"
      - "src/bayesian_phystwin/evidence_policy.py"
      - "src/bayesian_phystwin/observation_belief.py"
      - "src/bayesian_phystwin/observation_belief_gauge_adapter.py"
      - "src/bayesian_phystwin/prob4d_causal_lineage.py"
      - "src/bayesian_phystwin/prob4d_observation_contract.py"
      - "src/bayesian_phystwin/gauge_aware_belief.py"
      - "src/bayesian_phystwin/_gauge_aware_contracts.py"
      - "src/bayesian_phystwin/_gauge_aware_solver.py"
      - "src/bayesian_phystwin/repository_provenance.py"
      - "src/bayesian_phystwin/run_manifest.py"
      - "src/bayesian_phystwin/run_manifest_v2.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/three-repository-golden-path.yml"
      - "scripts/run_three_repository_golden_path.sh"
      - "integration_tests/**"
      - "docs/three_repository_golden_path.md"
      - "pyproject.toml"
      - "src/bayesian_phystwin/causal4d_provider_v1.py"
      - "src/bayesian_phystwin/causal4d_provider_v2.py"
      - "src/bayesian_phystwin/causal4d_graph_provider_v1.py"
      - "src/bayesian_phystwin/contracts/**"
      - "src/bayesian_phystwin/phystwin/**"
      - "src/bayesian_phystwin/cli/provider_manifest.py"
      - "src/bayesian_phystwin/evidence_policy.py"
      - "src/bayesian_phystwin/observation_belief.py"
      - "src/bayesian_phystwin/observation_belief_gauge_adapter.py"
      - "src/bayesian_phystwin/prob4d_causal_lineage.py"
      - "src/bayesian_phystwin/prob4d_observation_contract.py"
      - "src/bayesian_phystwin/gauge_aware_belief.py"
      - "src/bayesian_phystwin/_gauge_aware_contracts.py"
      - "src/bayesian_phystwin/_gauge_aware_solver.py"
      - "src/bayesian_phystwin/repository_provenance.py"
      - "src/bayesian_phystwin/run_manifest.py"
      - "src/bayesian_phystwin/run_manifest_v2.py"
  workflow_dispatch:
    inputs:
      prob4d_ref:
        description: Prob4D branch, tag, or commit to validate
        required: false
        default: main
      causal4d_ref:
        description: Causal4D branch, tag, or commit to validate
        required: false
        default: main
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: three-repository-golden-path-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-wheel-golden-path:
    name: Prob4D -> BPT -> Causal4D / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PROB4D_READ_TOKEN: ${{ secrets.PROB4D_READ_TOKEN }}
    steps:
      - name: Classify private-repository access
        id: access
        shell: bash
        env:
          IS_FORK_PULL_REQUEST: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail
          if [[ -n "${PROB4D_READ_TOKEN}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "required=true" >> "$GITHUB_OUTPUT"
          elif [[ "${IS_FORK_PULL_REQUEST}" == "true" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Private compatibility unavailable on fork::The fork pull request cannot access PROB4D_READ_TOKEN, so it cannot admit three-repository evidence."
            {
              echo "### Three-repository gate unavailable on fork"
              echo
              echo "GitHub does not expose the private \`PROB4D_READ_TOKEN\` secret to fork pull requests."
              echo "The private installed-wheel gate is therefore unavailable and no cross-repository evidence is admitted by this run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "::error title=Required three-repository gate not executed::Configure PROB4D_READ_TOKEN with contents-read access to FlorianPfaff/Prob4D."
            {
              echo "### Required three-repository gate not executed"
              echo
              echo "The trusted event requires the repository secret \`PROB4D_READ_TOKEN\`."
              echo "Missing credentials are a failing configuration error, not a successful compatibility result."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Require private credential on trusted events
        if: steps.access.outputs.required == 'true' && steps.access.outputs.enabled != 'true'
        shell: bash
        run: exit 1

      - name: Check out Bayesian-PhysTwin
        if: steps.access.outputs.enabled == 'true'
        uses: actions/checkout@v7
        with:
          path: bayesian-phystwin
          persist-credentials: false

      - name: Check out Prob4D
        if: steps.access.outputs.enabled == 'true'
        uses: actions/checkout@v7
        with:
          repository: FlorianPfaff/Prob4D
          ref: ${{ inputs.prob4d_ref || 'main' }}
          path: prob4d
          token: ${{ env.PROB4D_READ_TOKEN }}
          persist-credentials: false

      - name: Check out Causal4D
        if: steps.access.outputs.enabled == 'true'
        uses: actions/checkout@v7
        with:
          repository: FlorianPfaff/Causal4D
          ref: ${{ inputs.causal4d_ref || 'main' }}
          path: causal4d
          persist-credentials: false

      - name: Set up Python
        if: steps.access.outputs.enabled == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            bayesian-phystwin/pyproject.toml
            prob4d/pyproject.toml
            causal4d/pyproject.toml

      - name: Build, install, and execute the isolated golden path
        id: golden_path
        if: steps.access.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash bayesian-phystwin/scripts/run_three_repository_golden_path.sh \
            bayesian-phystwin \
            prob4d \
            causal4d
          touch "$RUNNER_TEMP/three-repository-golden-path.executed"

      - name: Assert trusted gate execution
        if: always() && steps.access.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.access.outputs.enabled }}" != "true" ]]; then
            echo "::error title=Three-repository gate unavailable::The required private credential was not configured."
            exit 1
          fi
          test -f "$RUNNER_TEMP/three-repository-golden-path.executed"
          if [[ "${{ steps.golden_path.outcome }}" != "success" ]]; then
            echo "::error title=Three-repository gate failed::The installed-wheel golden path did not complete successfully."
            exit 1
          fi
