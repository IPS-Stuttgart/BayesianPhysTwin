name: Repair PR 437 stale manifest test once

on:
  push:
    branches:
      - agent/reduce-manifest-workflow-fanout
    paths:
      - .github/workflows/fix-pr437-stale-test-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/reduce-manifest-workflow-fanout
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Update the specialized-workflow contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_deform360_source_support_failure_evidence_v1.py")
          text = path.read_text(encoding="utf-8")
          old = '    assert "MANIFEST.in" in text\n'
          new = '    assert "MANIFEST.in" not in text\n'
          if text.count(old) != 1:
              raise SystemExit("unexpected MANIFEST.in workflow assertion count")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/fix-pr437-stale-test-once.yml").unlink()
          PY

          python -m pip install -e ".[dev]"
          python -m ruff check \
            tests/test_deform360_source_support_failure_evidence_v1.py \
            tests/test_pull_request_workflow_integrity.py
          python -m ruff format --check \
            tests/test_deform360_source_support_failure_evidence_v1.py \
            tests/test_pull_request_workflow_integrity.py
          python -m pytest -q \
            tests/test_deform360_source_support_failure_evidence_v1.py \
            tests/test_pull_request_workflow_integrity.py \
            tests/test_deform360_prob4d_distribution_manifest.py \
            tests/test_evidence_decision_packaging.py
          git diff --check

      - name: Publish the repaired exact tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            tests/test_deform360_source_support_failure_evidence_v1.py \
            .github/workflows/fix-pr437-stale-test-once.yml
          git commit -m "Align provider census test with central manifest validation"
          git push origin HEAD:agent/reduce-manifest-workflow-fanout
