name: Format DEFORM sensing v2 source

on:
  push:
    branches:
      - science/deform-dlo45-decision-directed-sensing-v2
    paths:
      - ".github/workflows/format-deform-dlo45-sensing-v2.yml"

permissions:
  contents: write

concurrency:
  group: format-deform-dlo45-sensing-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true

      - name: Require the one-shot workflow creation trigger
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          test -n "$before"
          test "$before" != "0000000000000000000000000000000000000000"
          mapfile -t changed < <(git diff --name-only "$before" "$GITHUB_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/format-deform-dlo45-sensing-v2.yml"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply the repository formatter
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "ruff==0.16.5"
          python -m ruff format \
            experiments/deform_dlo45_decision_directed_sensing_v2/evaluate.py \
            tests/test_deform_dlo45_decision_directed_sensing_v2.py
          python -m ruff format --check \
            experiments/deform_dlo45_decision_directed_sensing_v2/evaluate.py \
            tests/test_deform_dlo45_decision_directed_sensing_v2.py
          python -m ruff check \
            experiments/deform_dlo45_decision_directed_sensing_v2/evaluate.py \
            tests/test_deform_dlo45_decision_directed_sensing_v2.py
          python -m py_compile \
            experiments/deform_dlo45_decision_directed_sensing_v2/evaluate.py \
            tests/test_deform_dlo45_decision_directed_sensing_v2.py
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx \
            "experiments/deform_dlo45_decision_directed_sensing_v2/evaluate.py"
          printf '%s\n' "${changed[@]}" | grep -Fx \
            "tests/test_deform_dlo45_decision_directed_sensing_v2.py"

      - name: Publish the formatted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            experiments/deform_dlo45_decision_directed_sensing_v2/evaluate.py \
            tests/test_deform_dlo45_decision_directed_sensing_v2.py
          git commit -m "Format source-calibrated sensing v2"
          git push origin "HEAD:${GITHUB_REF_NAME}"
