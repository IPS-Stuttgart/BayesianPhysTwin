# workflow-lifecycle: temporary
# workflow-owner: IPS-Stuttgart maintainers
# workflow-expiry: 2026-09-03
name: Format conformal regret envelope

on:
  push:
    paths:
      - ".github/workflows/format-conformal-regret-envelope-v1.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          persist-credentials: true
          clean: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Format exact changed Python files
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "ruff==0.13.1"
          python -m ruff format \
            experiments/deform_dlo45_decision_identifiability_v1/support_envelope.py \
            experiments/deform_dlo45_decision_identifiability_v1/support_envelope_jsonsafe.py \
            src/bayesian_phystwin/conformal_regret_envelope_v1.py \
            tests/test_deform_dlo45_conformal_regret_envelope_core_v1.py \
            tests/test_deform_dlo45_conformal_regret_envelope_v1.py \
            tests/test_deform_dlo45_conformal_regret_jsonsafe_v1.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            experiments/deform_dlo45_decision_identifiability_v1/support_envelope.py \
            experiments/deform_dlo45_decision_identifiability_v1/support_envelope_jsonsafe.py \
            src/bayesian_phystwin/conformal_regret_envelope_v1.py \
            tests/test_deform_dlo45_conformal_regret_envelope_core_v1.py \
            tests/test_deform_dlo45_conformal_regret_envelope_v1.py \
            tests/test_deform_dlo45_conformal_regret_jsonsafe_v1.py
          if git diff --cached --quiet; then
            echo "Files already formatted."
          else
            git commit -m "Format conformal-regret-envelope source"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
