# workflow-lifecycle: temporary
# workflow-owner: IPS-Stuttgart maintainers
name: Tracking Cloth stable-bank source retry v2

on:
  push:
    branches: [science/tracking-cloth-self-collision-stable-bank-source-v1]
    paths:
      - ".github/requests/tracking-cloth-self-collision-stable-bank-source-retry-v2.json"

permissions:
  contents: read

concurrency:
  group: tracking-cloth-stable-bank-source-retry-v2
  cancel-in-progress: false

env:
  DATASET_ROOT: /home/github-runner/.cache/datasets/tracking-cloth-deformation-v1-zenodo-14644526
  REQUEST_PATH: .github/requests/tracking-cloth-self-collision-stable-bank-source-retry-v2.json
  PROTOCOL_PATH: experiments/tracking_cloth_self_collision_stable_bank_v1/protocol.json
  PROTOCOL_GIT_BLOB_SHA1: 3a24f07b8303a209cf9edc0858bfb460f72ebe4e
  MODEL_GIT_BLOB_SHA1: 4631b036522cc68cd7aad86f6b1cc9555278e642
  ENTRYPOINT_GIT_BLOB_SHA1: e36e0c77dcfa965eb05588621d8ed04cec59f625
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      expected_source_revision: ${{ steps.authorize.outputs.expected_source_revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          clean: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install numpy==1.26.4 pytest ruff==0.14.14
      - name: Validate frozen source implementation
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          test "$(git hash-object "${PROTOCOL_PATH}")" = "${PROTOCOL_GIT_BLOB_SHA1}"
          test "$(git hash-object experiments/tracking_cloth_self_collision_stable_bank_v1/model.py)" = "${MODEL_GIT_BLOB_SHA1}"
          test "$(git hash-object experiments/tracking_cloth_self_collision_stable_bank_v1/entrypoint.py)" = "${ENTRYPOINT_GIT_BLOB_SHA1}"
          python -m json.tool "${PROTOCOL_PATH}" >/dev/null
          python -m pytest -q \
            tests/test_tracking_cloth_self_collision_stable_bank_v1.py \
            tests/test_tracking_cloth_self_collision_selective_twin_v1.py \
            tests/test_tracking_cloth_self_collision_workflow_v1.py
          python -m py_compile \
            experiments/tracking_cloth_self_collision_stable_bank_v1/model.py \
            experiments/tracking_cloth_self_collision_stable_bank_v1/entrypoint.py
          python -m ruff check \
            experiments/tracking_cloth_self_collision_stable_bank_v1/model.py \
            experiments/tracking_cloth_self_collision_stable_bank_v1/entrypoint.py \
            tests/test_tracking_cloth_self_collision_stable_bank_v1.py
          python -m ruff format --check \
            experiments/tracking_cloth_self_collision_stable_bank_v1/model.py \
            experiments/tracking_cloth_self_collision_stable_bank_v1/entrypoint.py \
            tests/test_tracking_cloth_self_collision_stable_bank_v1.py
      - id: authorize
        name: Authorize one add-only retry request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          test "${PUSH_FORCED}" = false
          test "${BEFORE_SHA}" != 0000000000000000000000000000000000000000
          mapfile -t changed < <(git diff --name-status "${BEFORE_SHA}" "${GITHUB_SHA}")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = $'A\t.github/requests/tracking-cloth-self-collision-stable-bank-source-retry-v2.json'
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          path = Path(os.environ["REQUEST_PATH"])
          value = json.loads(path.read_text(encoding="utf-8"))
          expected = {
              "schema": "bayesian-phystwin/tracking-cloth-stable-bank-source-retry-request-v2",
              "request_id": "tracking-cloth-stable-bank-source-retry-v2-20260903-a",
              "prior_failed_run_ids": [33588967510, 33592037490],
              "prior_target_outcomes_opened": False,
              "repair_scope": "retry-after-import-order-fix-only",
              "dataset_root": os.environ["DATASET_ROOT"],
              "protocol_path": os.environ["PROTOCOL_PATH"],
              "protocol_git_blob_sha1": os.environ["PROTOCOL_GIT_BLOB_SHA1"],
              "model_git_blob_sha1": os.environ["MODEL_GIT_BLOB_SHA1"],
              "entrypoint_git_blob_sha1": os.environ["ENTRYPOINT_GIT_BLOB_SHA1"],
              "runner_labels": ["self-hosted", "Linux", "X64", "gpuserver4090"],
              "source_only": True,
              "automatic_target_follow_on": False,
              "paper_claim_authorized": False,
          }
          for key, expected_value in expected.items():
              if value.get(key) != expected_value:
                  raise SystemExit(f"invalid {key}: {value.get(key)!r}")
          if set(value) != set(expected) | {"expected_source_revision"}:
              raise SystemExit("retry request fields changed")
          parent = subprocess.check_output(
              ["git", "rev-parse", f"{os.environ['GITHUB_SHA']}^"], text=True
          ).strip()
          if value["expected_source_revision"] != parent:
              raise SystemExit("retry request is not bound to its exact source revision")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              print(f"expected_source_revision={parent}", file=stream)
          PY

  source:
    needs: contracts
    if: needs.contracts.result == 'success'
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 480
    env:
      OUTPUT_ROOT: source-output-retry-v2
    steps:
      - name: Check out exact request commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          clean: true
      - name: Revalidate source-only boundary
        shell: bash
        run: |
          set -euo pipefail
          test -d "${DATASET_ROOT}"
          test "$(readlink -f -- "${DATASET_ROOT}")" = "${DATASET_ROOT}"
          test "$(git hash-object "${PROTOCOL_PATH}")" = "${PROTOCOL_GIT_BLOB_SHA1}"
          test "$(git hash-object experiments/tracking_cloth_self_collision_stable_bank_v1/model.py)" = "${MODEL_GIT_BLOB_SHA1}"
          test "$(git hash-object experiments/tracking_cloth_self_collision_stable_bank_v1/entrypoint.py)" = "${ENTRYPOINT_GIT_BLOB_SHA1}"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          value = json.loads(Path(os.environ["REQUEST_PATH"]).read_text())
          parent = subprocess.check_output(
              ["git", "rev-parse", f"{os.environ['GITHUB_SHA']}^"], text=True
          ).strip()
          if value["expected_source_revision"] != parent:
              raise SystemExit("self-hosted request binding changed")
          if value["source_only"] is not True:
              raise SystemExit("source_only boundary changed")
          if value["automatic_target_follow_on"] is not False:
              raise SystemExit("automatic target follow-on became enabled")
          if value["paper_claim_authorized"] is not False:
              raise SystemExit("paper claim became authorized")
          if value["prior_target_outcomes_opened"] is not False:
              raise SystemExit("prior target-outcome boundary changed")
          PY
      - name: Prepare isolated numerical runtime
        shell: bash
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP}/tracking-cloth-stable-bank-retry-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "${venv}" "${OUTPUT_ROOT}"
          python3 -m venv "${venv}"
          "${venv}/bin/python" -m pip install --disable-pip-version-check numpy==1.26.4
          mkdir -p -- "${OUTPUT_ROOT}"
          {
            echo "PYTHON_BIN=${venv}/bin/python"
            echo "VENV_ROOT=${venv}"
          } >> "${GITHUB_ENV}"
      - name: Fit source-stable bank and evaluate rep2 gate
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          "${PYTHON_BIN}" -m \
            experiments.tracking_cloth_self_collision_stable_bank_v1.entrypoint \
            --stage source \
            --dataset-root "${DATASET_ROOT}" \
            --protocol "${PROTOCOL_PATH}" \
            --output "${OUTPUT_ROOT}/source"
      - name: Validate compact source evidence and target closure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="${OUTPUT_ROOT}/source"
          if test ! -f "${root}/source_result.json"; then
            echo "No scientific source result was produced." >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["OUTPUT_ROOT"]) / "source"
          result = json.loads((root / "source_result.json").read_text())
          fits = json.loads((root / "physics_fits.json").read_text())
          if result["rep3_numeric_outcomes_read"] is not False:
              raise SystemExit("rep3 outcome boundary changed")
          if fits["rep3_outcomes_read"] is not False:
              raise SystemExit("rep3 fit boundary changed")
          for name, value in fits["fits"].items():
              if value["candidate_count"] != 18:
                  raise SystemExit(f"candidate roster changed for {name}")
              if value["valid_fraction"] < 0.5:
                  raise SystemExit(f"stable bank too small for {name}")
              if [400.0, 2.0, 200.0] not in value["parameters"]:
                  raise SystemExit(f"nominal member missing for {name}")
              allowed = {
                  "nonfinite contact rollout",
                  "contact rollout escaped the registered domain",
              }
              if not set(value["rejection_reasons"]).issubset(allowed):
                  raise SystemExit(f"unregistered rejection reason for {name}")
          receipt = {
              "schema": "bayesian-phystwin/tracking-cloth-stable-bank-source-retry-receipt-v2",
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "github_sha": os.environ["GITHUB_SHA"],
              "source_result_id": result["result_id"],
              "source_gate_pass": result["source_gate"]["pass"],
              "fit_count": len(fits["fits"]),
              "rep3_numeric_outcomes_read": False,
              "automatic_target_follow_on": False,
              "paper_claim_authorized": False,
          }
          (root / "source_retry_receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY
      - name: Upload compact source evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: tracking-cloth-stable-bank-source-retry-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: source-output-retry-v2/source
          if-no-files-found: warn
          retention-days: 30
      - name: Remove isolated runtime
        if: always()
        shell: bash
        run: |
          rm -rf -- "${VENV_ROOT:-}" "${OUTPUT_ROOT:-}"
