name: Materialize Causal4D session-specific transport v2

on:
  push:
    branches:
      - feature/causal4d-session-specific-transport-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/causal4d-session-specific-transport-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify and materialize the reviewed source payload
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import lzma
          import tarfile
          from pathlib import Path

          root = Path.cwd().resolve()
          payload_dir = root / "tools" / "one_shot"
          parts = sorted(payload_dir.glob("causal4d-transport-v2.payload.*"))
          if not parts:
              print("Payload already materialized.")
              raise SystemExit(0)

          encoded = "".join(part.read_text(encoding="ascii").strip() for part in parts)
          compressed = base64.b64decode(encoded, validate=True)
          expected = "888a9a47c6cda6398781f1a368eabdf50ab96947d10ca21338209bfcdc4bba2d"
          actual = hashlib.sha256(compressed).hexdigest()
          if actual != expected:
              raise SystemExit(f"payload digest mismatch: {actual}")

          archive = lzma.decompress(compressed)
          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:") as handle:
              for member in handle.getmembers():
                  destination = (root / member.name).resolve()
                  if destination != root and root not in destination.parents:
                      raise SystemExit(f"unsafe archive member: {member.name}")
              handle.extractall(root, filter="data")

          for part in parts:
              part.unlink()
          try:
              payload_dir.rmdir()
          except OSError:
              pass
          PY

          python -m compileall -q \
            src/bayesian_phystwin_experiments/cross_action_transport_v2.py \
            src/bayesian_phystwin_experiments/cross_action_placebo_v2.py \
            src/bayesian_phystwin_experiments/causal4d_cross_action_registration_v1.py \
            tests/test_cross_action_transport_v2.py \
            tests/test_causal4d_cross_action_registration_v1.py

      - name: Commit materialized implementation
        shell: bash
        run: |
          if git diff --quiet --exit-code && git diff --cached --quiet --exit-code; then
            echo "No materialization changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Causal4D session-specific transport evidence"
          git push origin HEAD:feature/causal4d-session-specific-transport-v2
