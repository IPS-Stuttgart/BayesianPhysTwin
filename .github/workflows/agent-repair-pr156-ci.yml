name: Repair PR 156 CI coverage

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/agent-repair-pr156-ci.yml

permissions:
  contents: write

concurrency:
  group: repair-pr156-ci-coverage
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/pokeflex-same-object-paper-artifacts
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Add the focused reporting regression to explicit core suites
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/tests.yml")
          lines = path.read_text(encoding="utf-8").splitlines()
          target = "tests/test_pokeflex_same_object_reporting.py"
          inserted = 0
          index = 0
          while index < len(lines):
              if lines[index].strip() == "tests/test_quality_invariants.py":
                  indent = lines[index][: len(lines[index]) - len(lines[index].lstrip())]
                  next_line = lines[index + 1].strip() if index + 1 < len(lines) else ""
                  if next_line != target:
                      if not lines[index].rstrip().endswith("\\"):
                          lines[index] = lines[index].rstrip() + " \\"
                      lines.insert(index + 1, indent + target)
                      inserted += 1
                      index += 1
              index += 1
          if inserted != 2:
              raise SystemExit(f"expected two explicit-suite insertions, got {inserted}")
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          git diff --check
          python -m pip install -e ".[dev]"
          python -m pytest -q tests/test_pokeflex_same_object_reporting.py

      - name: Commit the coverage repair and remove this executor
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-repair-pr156-ci.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Cover PokeFlex reporting in explicit core suites"
          git push origin HEAD:agent/pokeflex-same-object-paper-artifacts
