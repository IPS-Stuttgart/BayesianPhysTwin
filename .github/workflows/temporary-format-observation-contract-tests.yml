name: Temporary observation-contract test formatter

on:
  push:
    branches:
      - agent/observation-contract-conformance
    paths:
      - .github/workflows/temporary-format-observation-contract-tests.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'IPS-Stuttgart/BayesianPhysTwin'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          clean: true

      - name: Apply exact Ruff formatting and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_observation_contract_bundle.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '''    assert observation_contract_bundle_manifest()["files"] == {
                  "schema.json": digest
              }
          ''': '''    assert observation_contract_bundle_manifest()["files"] == {"schema.json": digest}
          ''',
              '''    payload: Any = copy.deepcopy(
                  contract_module._read_json("vectors/minimal.json")
              )
          ''': '''    payload: Any = copy.deepcopy(contract_module._read_json("vectors/minimal.json"))
          ''',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected formatting target was not present exactly once: {old!r}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/temporary-format-observation-contract-tests.yml').unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_observation_contract_bundle.py \
            .github/workflows/temporary-format-observation-contract-tests.yml
          git diff --cached --check
          git commit -m 'Format observation-contract corruption tests'
          git push origin "HEAD:${GITHUB_REF_NAME}"
