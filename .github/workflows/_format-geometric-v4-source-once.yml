name: Format geometric v4 source once

on:
  push:
    branches:
      - agent/materialize-deform360-joint-sparse-geometric-v4
    paths:
      - .github/workflows/_format-geometric-v4-source-once.yml

permissions:
  contents: write

concurrency:
  group: format-geometric-v4-source-once
  cancel-in-progress: false

jobs:
  format-source:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.ref == 'refs/heads/agent/materialize-deform360-joint-sparse-geometric-v4'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/materialize-deform360-joint-sparse-geometric-v4
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Format, validate, and publish
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          python -m pip install -e ".[dev]"
          python -m ruff format \
            src/bayesian_phystwin/deform360_joint_sparse_geometric_source_v4.py
          python -m ruff check \
            src/bayesian_phystwin/deform360_joint_sparse_geometric_source_v4.py
          python -m mypy \
            src/bayesian_phystwin/deform360_joint_sparse_geometric_source_v4.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_deform360_joint_sparse_geometric_v4.py \
            tests/test_deform360_joint_sparse_geometric_v4_causal_coverage.py \
            tests/test_deform360_joint_sparse_geometric_v4_end_to_end.py \
            tests/test_deform360_joint_sparse_geometric_v4_workflow.py \
            tests/test_deform360_joint_sparse_observability_v4.py \
            tests/test_deform360_joint_sparse_observability_v4_cli.py \
            tests/test_pull_request_workflow_integrity.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bayesian_phystwin/deform360_joint_sparse_geometric_source_v4.py
          git commit -m "Format geometric v4 source admission"
          git push origin HEAD:agent/materialize-deform360-joint-sparse-geometric-v4
