name: Temporary rebuild covariance-only experiment on current main

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temporary-rebuild-covariance-current-main.yml

permissions:
  contents: write

concurrency:
  group: temporary-rebuild-covariance-current-main
  cancel-in-progress: true

jobs:
  rebuild:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out current-main target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/full22-covariance-only-hybrid-v1-current
          fetch-depth: 1
          persist-credentials: true
          clean: true

      - name: Copy reviewed experiment and retain current-main infrastructure
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin \
            agent/full22-covariance-only-hybrid-v1
          source_ref=origin/agent/full22-covariance-only-hybrid-v1
          paths=(
            docs/full22_covariance_only_hybrid_v1.md
            protocols/full22_covariance_only_hybrid_v1.json
            results/science/full22_covariance_only_hybrid_v1/result.md
            results/science/full22_covariance_only_hybrid_v1/summary.json
            scripts/science/run_full22_covariance_only_hybrid_v1.py
            src/bayesian_phystwin/covariance_only_hybrid.py
            src/bayesian_phystwin/covariance_only_hybrid_analysis.py
            tests/test_covariance_only_hybrid.py
            tests/test_covariance_only_hybrid_adversarial.py
            tests/test_full22_covariance_only_hybrid_evidence_v1.py
            tests/test_full22_covariance_only_hybrid_v1.py
          )
          git checkout "${source_ref}" -- "${paths[@]}"
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('.github/quality/test-suites.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          suite = payload['suites']['stable-core-coverage']
          additions = [
              'tests/test_covariance_only_hybrid.py',
              'tests/test_covariance_only_hybrid_adversarial.py',
              'tests/test_full22_covariance_only_hybrid_v1.py',
          ]
          anchor = 'tests/test_calibration.py'
          position = suite.index(anchor) + 1
          for member in reversed(additions):
              if member not in suite:
                  suite.insert(position, member)
          path.write_text(
              json.dumps(payload, indent=2, sort_keys=False) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Validate current-main reconstruction
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Run focused contracts and publish
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev,graph]'
          files=(
            scripts/science/run_full22_covariance_only_hybrid_v1.py
            src/bayesian_phystwin/covariance_only_hybrid.py
            src/bayesian_phystwin/covariance_only_hybrid_analysis.py
            tests/test_covariance_only_hybrid.py
            tests/test_covariance_only_hybrid_adversarial.py
            tests/test_full22_covariance_only_hybrid_evidence_v1.py
            tests/test_full22_covariance_only_hybrid_v1.py
          )
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy \
            src/bayesian_phystwin/covariance_only_hybrid.py \
            src/bayesian_phystwin/covariance_only_hybrid_analysis.py \
            scripts/science/run_full22_covariance_only_hybrid_v1.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_covariance_only_hybrid.py \
            tests/test_covariance_only_hybrid_adversarial.py \
            tests/test_full22_covariance_only_hybrid_evidence_v1.py \
            tests/test_full22_covariance_only_hybrid_v1.py \
            tests/test_pull_request_workflow_integrity.py \
            tests/test_pr_ready.py
          python tools/quality/test_suite_manifest.py validate --json
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Rebuild covariance-only experiment on current main'
          git push origin HEAD:agent/full22-covariance-only-hybrid-v1-current
