name: Deform360 normalized-evidence external evaluation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deform360-normalized-evidence-external.yml"
      - "protocols/deform360_normalized_evidence_external_v1.json"
      - "scripts/science/run_deform360_normalized_evidence_external.py"
      - "tests/test_deform360_normalized_evidence_external.py"
      - "docs/deform360_normalized_evidence_external_v1.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deform360-normalized-evidence-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  evaluate:
    name: Seal names, then evaluate normalized evidence
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 240
    steps:
      - name: Check out BayesianPhysTwin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Resolve mounted data and isolated output paths
        shell: bash
        env:
          CONFIGURED_ROOT: ${{ vars.DEFORM360_DATA_ROOT }}
        run: |
          set -euo pipefail
          if [[ -n "${CONFIGURED_ROOT}" ]]; then
            data_root="${CONFIGURED_ROOT}"
          else
            data_root="/home/github-runner/.cache/datasets/deform360"
          fi
          if [[ ! -d "${data_root}" ]]; then
            echo "Deform360 mount is missing: ${data_root}" >&2
            exit 1
          fi
          output_root="${RUNNER_TEMP}/deform360-normalized-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          venv_root="${RUNNER_TEMP}/deform360-normalized-venv-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${output_root}"
          echo "DEFORM360_DATA_ROOT=${data_root}" >> "${GITHUB_ENV}"
          echo "OUTPUT_ROOT=${output_root}" >> "${GITHUB_ENV}"
          echo "VENV_ROOT=${venv_root}" >> "${GITHUB_ENV}"

      - name: Record runner, GPU, and source identities
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "revision=${GITHUB_SHA}"
            echo "dataset_root=${DEFORM360_DATA_ROOT}"
            uname -a
            lscpu
          } | tee "${OUTPUT_ROOT}/runner.txt"
          nvidia-smi -L | tee "${OUTPUT_ROOT}/nvidia-smi-L.txt"
          nvidia-smi \
            --query-gpu=index,name,uuid,driver_version,memory.total \
            --format=csv,noheader \
            | tee "${OUTPUT_ROOT}/nvidia-smi.csv"

      - name: Create isolated evaluation environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "${VENV_ROOT}"
          "${VENV_ROOT}/bin/python" -m pip install --upgrade pip
          "${VENV_ROOT}/bin/python" -m pip install -e ".[dev,graph]"
          "${VENV_ROOT}/bin/python" -m pip check
          "${VENV_ROOT}/bin/python" -m pip freeze --all \
            > "${OUTPUT_ROOT}/pip-freeze.txt"

      - name: Validate evaluator before dataset inventory
        shell: bash
        run: |
          set -euo pipefail
          "${VENV_ROOT}/bin/python" -m ruff check \
            scripts/science/run_deform360_normalized_evidence_external.py \
            tests/test_deform360_normalized_evidence_external.py
          "${VENV_ROOT}/bin/python" -m ruff format --check \
            scripts/science/run_deform360_normalized_evidence_external.py \
            tests/test_deform360_normalized_evidence_external.py
          "${VENV_ROOT}/bin/python" -m pytest -q \
            tests/test_deform360_normalized_evidence_external.py \
            tests/test_endpoint_model_average.py
          "${VENV_ROOT}/bin/python" - <<'PY'
          import json
          from pathlib import Path

          protocol = json.loads(
              Path(
                  "protocols/deform360_normalized_evidence_external_v1.json"
              ).read_text(encoding="utf-8")
          )
          if protocol["status"] != "locked-before-numeric-payload-access":
              raise SystemExit("protocol is not locked before numeric access")
          if protocol["normalized_evidence"]["temperature_or_scale_tuned"]:
              raise SystemExit("normalized evidence unexpectedly permits tuning")
          if len(protocol["explicit_excluded_object_ids"]) != len(
              set(protocol["explicit_excluded_object_ids"])
          ):
              raise SystemExit("explicit exclusion IDs are not unique")
          print(json.dumps(protocol, indent=2, sort_keys=True))
          PY

      - name: Fingerprint mounted names before selection
        shell: bash
        run: |
          set -euo pipefail
          find "${DEFORM360_DATA_ROOT}" -printf '%P\0' \
            | sort -z \
            | sha256sum \
            | tee "${OUTPUT_ROOT}/dataset-names-before.sha256"

      - name: Seal exact cohort from names only
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          set +e
          "${VENV_ROOT}/bin/python" \
            scripts/science/run_deform360_normalized_evidence_external.py seal \
            --data-root "${DEFORM360_DATA_ROOT}" \
            --protocol protocols/deform360_normalized_evidence_external_v1.json \
            --output "${OUTPUT_ROOT}/selection.json" \
            --repository-root . \
            | tee "${OUTPUT_ROOT}/selection-console.json"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "${status}" -eq 0 ]]; then
            echo "proceed=true" >> "${GITHUB_OUTPUT}"
          elif [[ "${status}" -eq 3 ]]; then
            echo "proceed=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::Names-only selection found fewer than the locked minimum object count."
          else
            exit "${status}"
          fi

      - name: Prove the selection seal precedes numeric access
        shell: bash
        run: |
          set -euo pipefail
          "${VENV_ROOT}/bin/python" - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["OUTPUT_ROOT"]) / "selection.json"
          seal = json.loads(path.read_text(encoding="utf-8"))
          boundary = seal["information_boundary"]
          if boundary != {
              "dataset_payload_opened": False,
              "file_contents_hashed": False,
              "names_and_directory_structure_only": True,
              "selection_uses_target_outcomes": False,
          }:
              raise SystemExit("selection information boundary changed")
          print(f"selection_file_sha256={hashlib.sha256(path.read_bytes()).hexdigest()}")
          print(f"selection_sha256={seal['selection_sha256']}")
          print(f"selected_object_count={len(seal['selected'])}")
          print(f"support_passed={seal['support_passed']}")
          PY

      - name: Evaluate only sealed numeric archives
        if: steps.seal.outputs.proceed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          "${VENV_ROOT}/bin/python" \
            scripts/science/run_deform360_normalized_evidence_external.py evaluate \
            --seal "${OUTPUT_ROOT}/selection.json" \
            --protocol protocols/deform360_normalized_evidence_external_v1.json \
            --output "${OUTPUT_ROOT}/result.json" \
            --repository-root . \
            --max-frames-per-archive 48 \
            --max-tracks 512 \
            --chamfer-points 256 \
            | tee "${OUTPUT_ROOT}/evaluation-console.json"

      - name: Verify result identity and publish scientific readout
        if: steps.seal.outputs.proceed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          "${VENV_ROOT}/bin/python" - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["OUTPUT_ROOT"])
          result_path = root / "result.json"
          result = json.loads(result_path.read_text(encoding="utf-8"))
          expected = result.pop("result_sha256")
          actual = hashlib.sha256(
              json.dumps(
                  result,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              ).encode("utf-8")
          ).hexdigest()
          if expected != actual:
              raise SystemExit("result digest changed")
          seal = json.loads((root / "selection.json").read_text(encoding="utf-8"))
          allowed = {
              (entry["object_id"], entry["archive_path"])
              for entry in seal["selected"]
          }
          inspected = {
              (entry["object_id"], entry["archive_path"])
              for entry in result["inspection"]
          }
          if inspected != allowed:
              raise SystemExit("numeric inspection deviated from the selection seal")
          readout = {
              "schema": "bayesian-phystwin-deform360-normalized-evidence-readout-v1",
              "protocol_id": result["protocol_id"],
              "selection_sha256": result["selection_sha256"],
              "result_sha256": expected,
              "selected_object_count": result["selected_object_count"],
              "supported_object_count": result["supported_object_count"],
              "summary": result["summary"],
              "claim_boundary": result["claim_boundary"],
          }
          (root / "scientific-readout.json").write_text(
              json.dumps(readout, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(readout, indent=2, sort_keys=True))
          PY

      - name: Verify mounted names and repository remained unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find "${DEFORM360_DATA_ROOT}" -printf '%P\0' \
            | sort -z \
            | sha256sum \
            | tee "${OUTPUT_ROOT}/dataset-names-after.sha256"
          diff \
            "${OUTPUT_ROOT}/dataset-names-before.sha256" \
            "${OUTPUT_ROOT}/dataset-names-after.sha256"
          git diff --exit-code
          git status --porcelain=v1 | tee "${OUTPUT_ROOT}/git-status.txt"
          test ! -s "${OUTPUT_ROOT}/git-status.txt"

      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Deform360 normalized-evidence external evaluation"
            echo
            echo "- Runner: \`${RUNNER_NAME}\`"
            echo "- Names-only selection proceeded: \`${{ steps.seal.outputs.proceed }}\`"
            if [[ -f "${OUTPUT_ROOT}/selection.json" ]]; then
              "${VENV_ROOT}/bin/python" - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["OUTPUT_ROOT"])
          seal = json.loads((root / "selection.json").read_text(encoding="utf-8"))
          print(f"- Selected objects: `{len(seal['selected'])}`")
          print(f"- Selection digest: `{seal['selection_sha256']}`")
          if (root / "result.json").is_file():
              result = json.loads((root / "result.json").read_text(encoding="utf-8"))
              print(f"- Supported objects: `{result['supported_object_count']}`")
              print(f"- Scientific gates: `{result['summary']['gates']}`")
          PY
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload compact external-evaluation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deform360-normalized-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_ROOT }}
          if-no-files-found: error
          retention-days: 30

      - name: Enforce names-only support gate
        if: always() && steps.seal.outputs.proceed == 'false'
        run: |
          echo "The locked names-only cohort did not reach its minimum size." >&2
          exit 1

      - name: Remove isolated environment
        if: always()
        run: rm -rf "${VENV_ROOT}"
