# workflow-lifecycle: temporary
# workflow-owner: IPS-Stuttgart maintainers
name: Deform360 gpuserver4090 operational download status

on:
  push:
    branches:
      - science/deform360-gpuserver4090-preflight
    paths:
      - ".github/workflows/deform360-gpuserver4090-download-status.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deform360-gpuserver4090-download-status-${{ github.ref }}
  cancel-in-progress: true

env:
  DEFORM360_ROOT: /mnt/seagate10tb/florianpfaff/datasets/deform360
  PYTHONUNBUFFERED: "1"

jobs:
  operational-status:
    name: Read downloader metadata without dataset payloads
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 10
    steps:
      - name: Inspect only downloader-owned status metadata
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/deform360-download-status"
          root="$(readlink -f "${DEFORM360_ROOT}")"
          mkdir -p "${out}"
          test -d "${root}"
          export OUT="${out}"
          export ROOT="${root}"
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import time
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          out = Path(os.environ["OUT"])
          status_path = root / "download.status"
          lock_path = root / ".download.lock"

          def stat_record(path: Path) -> dict[str, object]:
              if not path.exists():
                  return {"exists": False, "path": str(path)}
              stat = path.stat(follow_symlinks=False)
              return {
                  "exists": True,
                  "path": str(path),
                  "size_bytes": stat.st_size,
                  "mtime_ns": stat.st_mtime_ns,
                  "age_seconds": max(0.0, time.time() - stat.st_mtime),
                  "mode_octal": oct(stat.st_mode & 0o7777),
                  "uid": stat.st_uid,
                  "gid": stat.st_gid,
              }

          raw_status = ""
          status_readable = False
          status_read_error = None
          if status_path.is_file():
              try:
                  raw_status = status_path.read_text(
                      encoding="utf-8",
                      errors="replace",
                  )
                  status_readable = True
              except PermissionError as error:
                  status_read_error = {
                      "type": type(error).__name__,
                      "errno": error.errno,
                      "message": "status file is not readable by the runner; no privilege escalation attempted",
                  }

          redacted_status = re.sub(
              r"https?://\S+",
              "<redacted-url>",
              raw_status,
          )
          redacted_status = re.sub(
              r"(?i)(token|secret|password|key)\s*[=:]\s*\S+",
              r"\1=<redacted>",
              redacted_status,
          )
          redacted_status = re.sub(
              r"\b[A-Fa-f0-9]{48,}\b",
              "<redacted-long-hex>",
              redacted_status,
          )
          if not status_readable:
              redacted_status = "[download.status unreadable to GitHub runner; no privilege escalation attempted]\n"
          (out / "download-status-redacted.txt").write_text(
              redacted_status,
              encoding="utf-8",
          )

          incomplete = []
          for path in sorted(root.rglob("*.incomplete")):
              try:
                  stat = path.stat(follow_symlinks=False)
              except FileNotFoundError:
                  continue
              incomplete.append(
                  {
                      "relative_path": path.relative_to(root).as_posix(),
                      "size_bytes": stat.st_size,
                      "mtime_ns": stat.st_mtime_ns,
                      "age_seconds": max(0.0, time.time() - stat.st_mtime),
                      "mode_octal": oct(stat.st_mode & 0o7777),
                      "uid": stat.st_uid,
                      "gid": stat.st_gid,
                  }
              )

          result = {
              "schema": "bayesian-phystwin/deform360-download-operational-status-v1",
              "schema_version": 1,
              "runner_label": "gpuserver4090",
              "runner_name": os.environ.get("RUNNER_NAME"),
              "hostname": os.uname().nodename,
              "dataset_root": str(root),
              "captured_unix_ns": time.time_ns(),
              "status_file": stat_record(status_path),
              "status_readable": status_readable,
              "status_read_error": status_read_error,
              "lock_file": stat_record(lock_path),
              "redacted_status_text": redacted_status,
              "incomplete_file_count": len(incomplete),
              "incomplete_files": incomplete,
              "information_boundary": {
                  "dataset_payload_opened": False,
                  "only_downloader_status_content_opened": status_readable,
                  "dataset_file_contents_hashed": False,
                  "reserved_target_outcomes_opened": False,
                  "privilege_escalation_attempted": False,
              },
          }
          (out / "operational-status.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Upload redacted operational status
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deform360-download-status-${{ github.run_id }}
          path: ${{ runner.temp }}/deform360-download-status
          if-no-files-found: error
          retention-days: 30
