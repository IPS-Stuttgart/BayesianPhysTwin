name: Temporary formatter for PR 92

on:
  push:
    branches:
      - agent/harden-content-addressed-contracts

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/harden-content-addressed-contracts
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"
      - name: Format changed contract files
        run: |
          python -m pip install --disable-pip-version-check ruff==0.16.1
          python -m ruff format \
            src/bayesian_phystwin/complete_belief_selection.py \
            src/bayesian_phystwin/observation_belief.py \
            src/bayesian_phystwin/physical_linearization.py
      - name: Commit formatter output
        run: |
          if git diff --quiet -- \
            src/bayesian_phystwin/complete_belief_selection.py \
            src/bayesian_phystwin/observation_belief.py \
            src/bayesian_phystwin/physical_linearization.py; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayesian_phystwin/complete_belief_selection.py \
            src/bayesian_phystwin/observation_belief.py \
            src/bayesian_phystwin/physical_linearization.py
          git commit -m "Format content-addressed contract hardening"
          git push origin HEAD:agent/harden-content-addressed-contracts
