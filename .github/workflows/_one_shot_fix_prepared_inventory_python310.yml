name: One-shot Python 3.10 prepared inventory compatibility

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/_one_shot_fix_prepared_inventory_python310.yml"
      - "scripts/_one_shot_fix_prepared_inventory_python310.py"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: one-shot-prepared-inventory-python310-pr-258
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 258 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref ==
        'agent/deform360-prepared-source-inventory-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply exact reviewed compatibility repair
        run: |
          set -euo pipefail
          python scripts/_one_shot_fix_prepared_inventory_python310.py

      - name: Install validation environment
        run: |
          set -euo pipefail
          python -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1"
          python -m pip install -e ".[dev]" "numpy>=1.24,<2.2"
          python -m pip check

      - name: Validate supported-runtime behavior
        run: |
          set -euo pipefail
          files=(
            scripts/science/inventory_deform360_calibration_prepared_source.py
            tests/test_deform360_calibration_prepared_inventory.py
            tests/test_deform360_calibration_prepared_inventory_snapshot.py
          )
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy \
            scripts/science/inventory_deform360_calibration_prepared_source.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_deform360_calibration_prepared_inventory.py \
            tests/test_deform360_calibration_prepared_inventory_snapshot.py \
            tests/test_deform360_calibration_source_run_record.py \
            tests/test_deform360_calibration_observability_case_builder.py \
            tests/test_deform360_calibration_observability_batch.py
          python -m py_compile \
            scripts/science/inventory_deform360_calibration_prepared_source.py \
            tests/test_deform360_calibration_prepared_inventory_snapshot.py

      - name: Remove temporary transport and verify final scope
        run: |
          set -euo pipefail
          rm -- \
            .github/workflows/_one_shot_fix_prepared_inventory_python310.yml \
            scripts/_one_shot_fix_prepared_inventory_python310.py
          git diff --check
          unexpected="$(git diff --name-only 0f403cbed8b5fc9ac585b5f7c237106809207b3f -- | grep -E '^(.github/workflows/_one_shot|scripts/_one_shot)' || true)"
          if [[ -n "${unexpected}" ]]; then
            printf 'Temporary paths remain:\n%s\n' "${unexpected}" >&2
            exit 1
          fi

      - name: Commit validated final source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use portable anonymous inventory snapshots'
          git push origin HEAD:agent/deform360-prepared-source-inventory-v1
