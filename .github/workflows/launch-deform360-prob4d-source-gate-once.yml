name: Launch reviewed Deform360 Prob4D public source gate once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/launch-deform360-prob4d-source-gate-once.yml"

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: launch-deform360-prob4d-source-gate-once
  cancel-in-progress: false

jobs:
  execute:
    name: Execute frozen ten-object public source gate
    uses: ./.github/workflows/deform360-prob4d-source-gate.yml
    with:
      execute_authorized: true

  receipt:
    name: Publish public source-gate receipt
    if: always()
    needs: execute
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Post custody-preserving status to issue 148
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.execute.result }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body=$(cat <<EOF
          ## Deform360 Prob4D public source gate completed with result \`${RESULT}\`

          - launcher workflow run: [\`${GITHUB_RUN_ID}\`](${run_url})
          - launcher attempt: \`${GITHUB_RUN_ATTEMPT}\`
          - exact reviewed main revision: \`${GITHUB_SHA}\`
          - empirical runner: \`workstation2\` via the sole \`self-hosted\` label
          - official/raw Deform360 root registered on runner: \`/mnt/lexar4tb/datasets/deform360/data-7fea8e2\`
          - adaptive-confirmation download registered on runner: \`/mnt/lexar4tb/datasets/deform360/adaptive-confirmation-download-5a9c56d593462486bdd0953dcaf6f9c643bf8370\`
          - official/raw payload opened by this source-gate stage: \`false\`
          - adaptive-confirmation payloads opened: \`false\`
          - confirmation payloads opened: \`false\`
          - future frames used: \`false\`
          - target outcomes used: \`false\`
          - replacement streams allowed: \`false\`

          This launcher executes only the frozen ten-object public source gate.
          A successful gate may authorize a separately locked confirmation
          evaluation; this run itself is not confirmation evidence and does not
          authorize target-informed retuning.
          EOF
          )
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/148/comments" \
            -f body="${body}"

# Reviewed one-shot public source-gate request: 2026-08-09-runner-local-v1
