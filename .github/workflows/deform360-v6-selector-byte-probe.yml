name: Deform360 v6 selector byte probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deform360-v6-selector-byte-probe.yml"

permissions:
  contents: read

jobs:
  selector-bytes:
    name: Locate frozen Causal4D selector bytes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Check out complete Causal4D history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/Causal4D
          ref: 50e3682a5dbf976b20cc9115b6e7a975d0144ea5
          path: _causal4d_selector_probe
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Locate the registered selector digest in history
        shell: bash
        run: |
          set -euo pipefail
          repository="_causal4d_selector_probe"
          relative="src/causal4d_public/deform360_object_sam2.py"
          selector="${repository}/${relative}"
          expected="79b161fa66489f75b5b078c7ae409387feed74c51a38b86e89800d0aa578b1df"
          test -f "${selector}"
          observed=$(sha256sum "${selector}" | awk '{print $1}')
          bytes=$(stat -c '%s' "${selector}")
          echo "selector_path=${selector}"
          echo "selector_byte_count=${bytes}"
          echo "selector_sha256=${observed}"
          echo "registered_sha256=${expected}"
          echo "selector_matches_registered=$([[ "${observed}" = "${expected}" ]] && echo true || echo false)"

          match=""
          match_bytes=""
          while IFS= read -r revision; do
            candidate=$(git -C "${repository}" show "${revision}:${relative}" 2>/dev/null || true)
            [[ -n "${candidate}" ]] || continue
            digest=$(printf '%s\n' "${candidate}" | sha256sum | awk '{print $1}')
            if [[ "${digest}" = "${expected}" ]]; then
              match="${revision}"
              match_bytes=$(printf '%s\n' "${candidate}" | wc -c)
              break
            fi
          done < <(git -C "${repository}" log --format='%H' --all -- "${relative}")

          echo "historical_match_revision=${match:-none}"
          echo "historical_match_byte_count=${match_bytes:-none}"
          if [[ -z "${match}" ]]; then
            exit 3
          fi
