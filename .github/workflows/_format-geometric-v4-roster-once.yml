name: Format geometric v4 roster once

on:
  push:
    branches:
      - agent/materialize-deform360-joint-sparse-geometric-v4
    paths:
      - .github/workflows/_format-geometric-v4-roster-once.yml

permissions:
  contents: write

concurrency:
  group: format-geometric-v4-roster-once
  cancel-in-progress: false

jobs:
  format:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.ref == 'refs/heads/agent/materialize-deform360-joint-sparse-geometric-v4'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/materialize-deform360-joint-sparse-geometric-v4
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Format, validate, and publish roster hardening
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = \
            "agent/materialize-deform360-joint-sparse-geometric-v4"
          python -m pip install -e ".[dev]"
          source=src/bayesian_phystwin/deform360_joint_sparse_geometric_source_v4.py
          python -m ruff format "$source"
          python -m ruff check --fix "$source"
          python -m ruff check "$source"
          python -m ruff format --check "$source"
          python -m mypy \
            src/bayesian_phystwin/deform360_joint_sparse_geometric_common_v4.py \
            "$source"
          python -m pytest -q -p no:cacheprovider \
            tests/test_deform360_joint_sparse_geometric_v4.py \
            tests/test_deform360_joint_sparse_geometric_v4_end_to_end.py \
            tests/test_deform360_joint_sparse_geometric_v4_pipeline.py
          python -m compileall -q "$source"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$source"
          git commit -m "Format Deform360 metric-plan roster hardening"
          git push origin HEAD:agent/materialize-deform360-joint-sparse-geometric-v4
