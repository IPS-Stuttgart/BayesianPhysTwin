name: Materialize Deform360 V2 hardening

on:
  push:
    branches:
      - agent/deform360-group-evaluation-v2
    paths:
      - ".github/workflows/materialize-deform360-v2.yml"
      - "tools/deform360-v2-bundle-*.b64"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/materialize-deform360-v2.yml"
      - "tools/deform360-v2-bundle-*.b64"

permissions:
  contents: write

concurrency:
  group: materialize-deform360-v2-${{ github.sha }}
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 45
    steps:
      - name: Check out staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/deform360-group-evaluation-v2
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Reconstruct and content-verify the source bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/deform360-v2.tar.gz"
          source_root="${RUNNER_TEMP}/deform360-v2"
          python - "${bundle}" "${source_root}" <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import struct
          import sys
          import tarfile
          import zlib
          from pathlib import Path, PurePosixPath

          expected_archive_sha256 = (
              "446332a40b0d54f10140113e939e1a16bf0a04d39f419a5e1c891820939ae6c5"
          )
          committed_prefix_sha256 = (
              "17c2d0749f2de3c925cf5d94d136a8f6076f67e15c5dd41e38a51fac976d66e2"
          )
          allowed = {
              ".github/workflows/deform360-group-evaluation.yml",
              ".github/workflows/deform360-public-evaluation.yml",
              "docs/deform360_group_evaluation_v2.md",
              "scripts/science/prepare_deform360_archive_manifest.py",
              "scripts/science/prepare_deform360_name_inventory.py",
              "scripts/science/prepare_deform360_public_protocol.py",
              "scripts/science/run_deform360_group_evaluation.py",
              "tests/test_deform360_archive_manifest.py",
              "tests/test_deform360_group_evaluation.py",
              "tests/test_deform360_name_inventory.py",
              "tests/test_deform360_preflight_workflow.py",
              "tests/test_deform360_public_protocol.py",
          }
          part_paths = [
              Path("tools/deform360-v2-bundle-00.b64"),
              Path("tools/deform360-v2-bundle-01.b64"),
              Path("tools/deform360-v2-bundle-02.b64"),
          ]
          encoded = "".join(
              "".join(path.read_text(encoding="ascii").split())
              for path in part_paths
          )
          encoded += "=" * ((-len(encoded)) % 4)
          committed = base64.b64decode(encoded, validate=True)
          committed_digest = hashlib.sha256(committed).hexdigest()
          print(
              f"decoded committed bytes={len(committed)} "
              f"sha256={committed_digest}"
          )
          if committed_digest != committed_prefix_sha256:
              raise SystemExit("committed source-bundle prefix changed")

          decoder = zlib.decompressobj(16 + zlib.MAX_WBITS)
          unpacked = decoder.decompress(committed)
          unpacked += decoder.flush()
          trailer = struct.pack(
              "<II",
              zlib.crc32(unpacked) & 0xFFFFFFFF,
              len(unpacked) & 0xFFFFFFFF,
          )
          matches: list[tuple[int, bytes]] = []
          for missing_trailer_bytes in range(0, len(trailer) + 1):
              suffix = trailer[len(trailer) - missing_trailer_bytes :]
              candidate = committed + suffix
              if hashlib.sha256(candidate).hexdigest() == expected_archive_sha256:
                  matches.append((missing_trailer_bytes, candidate))
          if len(matches) != 1:
              raise SystemExit(
                  "the truncated committed gzip cannot be uniquely repaired to "
                  "the original locked archive digest"
              )
          missing_trailer_bytes, payload = matches[0]
          print(
              "recovered original locked gzip by appending "
              f"{missing_trailer_bytes} deterministic trailer bytes"
          )

          bundle = Path(sys.argv[1])
          source_root = Path(sys.argv[2])
          bundle.write_bytes(payload)
          source_root.mkdir(parents=True, exist_ok=True)

          with tarfile.open(bundle, mode="r:gz") as archive:
              files: dict[str, tarfile.TarInfo] = {}
              for member in archive.getmembers():
                  raw = PurePosixPath(member.name)
                  if raw.is_absolute() or ".." in raw.parts:
                      raise SystemExit(f"unsafe archive path: {member.name}")
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f"unsafe archive member type: {member.name}")
                  if member.isdir():
                      continue
                  if not member.isfile() or len(raw.parts) < 2:
                      raise SystemExit(f"unexpected archive member: {member.name}")
                  relative = PurePosixPath(*raw.parts[1:]).as_posix()
                  if relative not in allowed or relative in files:
                      raise SystemExit(
                          f"unexpected or duplicate product file: {relative}"
                      )
                  files[relative] = member
              if set(files) != allowed:
                  missing = sorted(allowed - set(files))
                  raise SystemExit(f"source bundle lacks declared files: {missing}")
              for relative in sorted(allowed):
                  stream = archive.extractfile(files[relative])
                  if stream is None:
                      raise SystemExit(f"cannot read archive member: {relative}")
                  target = source_root / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(stream.read())
          print(f"verified exact product file count: {len(allowed)}")
          PY

      - name: Copy and validate only the clean product diff
        shell: bash
        run: |
          set -euo pipefail
          source_root="${RUNNER_TEMP}/deform360-v2"
          files=(
            ".github/workflows/deform360-group-evaluation.yml"
            ".github/workflows/deform360-public-evaluation.yml"
            "docs/deform360_group_evaluation_v2.md"
            "scripts/science/prepare_deform360_archive_manifest.py"
            "scripts/science/prepare_deform360_name_inventory.py"
            "scripts/science/prepare_deform360_public_protocol.py"
            "scripts/science/run_deform360_group_evaluation.py"
            "tests/test_deform360_archive_manifest.py"
            "tests/test_deform360_group_evaluation.py"
            "tests/test_deform360_name_inventory.py"
            "tests/test_deform360_preflight_workflow.py"
            "tests/test_deform360_public_protocol.py"
          )
          for path in "${files[@]}"; do
            test -f "${source_root}/${path}"
            mkdir -p "$(dirname "${path}")"
            cp -a "${source_root}/${path}" "${path}"
          done

          rm -f \
            .github/workflows/materialize-deform360-v2.yml \
            tools/deform360-v2-bundle-00.b64 \
            tools/deform360-v2-bundle-01.b64 \
            tools/deform360-v2-bundle-02.b64

          python -m pip install -e ".[dev,graph]"
          python -m py_compile \
            scripts/science/prepare_deform360_archive_manifest.py \
            scripts/science/prepare_deform360_name_inventory.py \
            scripts/science/prepare_deform360_public_protocol.py \
            scripts/science/run_deform360_group_evaluation.py
          python -m ruff check \
            scripts/science/prepare_deform360_archive_manifest.py \
            scripts/science/prepare_deform360_name_inventory.py \
            scripts/science/prepare_deform360_public_protocol.py \
            scripts/science/run_deform360_group_evaluation.py \
            tests/test_deform360_archive_manifest.py \
            tests/test_deform360_group_evaluation.py \
            tests/test_deform360_name_inventory.py \
            tests/test_deform360_preflight_workflow.py \
            tests/test_deform360_public_protocol.py
          python -m ruff format --check \
            scripts/science/prepare_deform360_archive_manifest.py \
            scripts/science/prepare_deform360_name_inventory.py \
            scripts/science/prepare_deform360_public_protocol.py \
            scripts/science/run_deform360_group_evaluation.py \
            tests/test_deform360_archive_manifest.py \
            tests/test_deform360_group_evaluation.py \
            tests/test_deform360_name_inventory.py \
            tests/test_deform360_preflight_workflow.py \
            tests/test_deform360_public_protocol.py
          python -m pytest -q \
            tests/test_deform360_archive_manifest.py \
            tests/test_deform360_group_evaluation.py \
            tests/test_deform360_name_inventory.py \
            tests/test_deform360_preflight_workflow.py \
            tests/test_deform360_public_protocol.py \
            tests/test_endpoint_model_average.py \
            tests/test_group_conformal.py
          git diff --check

      - name: Publish ordinary source
        shell: bash
        run: |
          set -euo pipefail
          files=(
            ".github/workflows/deform360-group-evaluation.yml"
            ".github/workflows/deform360-public-evaluation.yml"
            "docs/deform360_group_evaluation_v2.md"
            "scripts/science/prepare_deform360_archive_manifest.py"
            "scripts/science/prepare_deform360_name_inventory.py"
            "scripts/science/prepare_deform360_public_protocol.py"
            "scripts/science/run_deform360_group_evaluation.py"
            "tests/test_deform360_archive_manifest.py"
            "tests/test_deform360_group_evaluation.py"
            "tests/test_deform360_name_inventory.py"
            "tests/test_deform360_preflight_workflow.py"
            "tests/test_deform360_public_protocol.py"
          )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            .github/workflows/materialize-deform360-v2.yml \
            tools/deform360-v2-bundle-00.b64 \
            tools/deform360-v2-bundle-01.b64 \
            tools/deform360-v2-bundle-02.b64 \
            "${files[@]}"
          git diff --cached --check
          git commit -m "Harden staged Deform360 group evaluation"
          git push origin HEAD:agent/deform360-group-evaluation-v2
