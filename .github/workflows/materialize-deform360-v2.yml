name: Materialize Deform360 V2 hardening

on:
  push:
    branches:
      - agent/deform360-group-evaluation-v2
    paths:
      - ".github/workflows/materialize-deform360-v2.yml"
      - "tools/deform360-v2-bundle-*.b64"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/materialize-deform360-v2.yml"
      - "tools/deform360-v2-bundle-*.b64"

permissions:
  contents: write

concurrency:
  group: materialize-deform360-v2-${{ github.sha }}
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 30
    steps:
      - name: Check out staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/deform360-group-evaluation-v2
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Reconstruct and verify the exact source bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/deform360-v2.tar.gz"
          source_root="${RUNNER_TEMP}/deform360-v2"
          python - "${bundle}" <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import sys
          from pathlib import Path

          expected = "446332a40b0d54f10140113e939e1a16bf0a04d39f419a5e1c891820939ae6c5"
          paths = [
              Path("tools/deform360-v2-bundle-00.b64"),
              Path("tools/deform360-v2-bundle-01.b64"),
              Path("tools/deform360-v2-bundle-02.b64"),
          ]
          parts = ["".join(path.read_text(encoding="ascii").split()) for path in paths]

          def padded(value: str) -> str:
              return value + "=" * ((-len(value)) % 4)

          candidates: list[tuple[str, bytes]] = []
          try:
              candidates.append(
                  (
                      "independent-chunks",
                      b"".join(
                          base64.b64decode(padded(part), validate=True)
                          for part in parts
                      ),
                  )
              )
          except ValueError as error:
              print(f"independent-chunks rejected: {error}")

          joined = "".join(parts)
          for name, encoded in (
              ("whole-stream", joined),
              ("de-padded-stream", "".join(part.rstrip("=") for part in parts)),
          ):
              try:
                  candidates.append(
                      (name, base64.b64decode(padded(encoded), validate=True))
                  )
              except ValueError as error:
                  print(f"{name} rejected: {error}")

          matches = []
          for name, payload in candidates:
              digest = hashlib.sha256(payload).hexdigest()
              print(f"{name}: bytes={len(payload)} sha256={digest}")
              if digest == expected:
                  matches.append((name, payload))
          if len(matches) != 1:
              raise SystemExit(
                  f"expected exactly one verified decode strategy, found {len(matches)}"
              )
          strategy, payload = matches[0]
          Path(sys.argv[1]).write_bytes(payload)
          print(f"verified decode strategy: {strategy}")
          PY
          echo "446332a40b0d54f10140113e939e1a16bf0a04d39f419a5e1c891820939ae6c5  ${bundle}" \
            | sha256sum --check --strict
          mkdir -p "${source_root}"
          tar -xzf "${bundle}" -C "${source_root}" --strip-components=1

      - name: Publish only the clean product diff
        shell: bash
        run: |
          set -euo pipefail
          source_root="${RUNNER_TEMP}/deform360-v2"
          files=(
            ".github/workflows/deform360-group-evaluation.yml"
            ".github/workflows/deform360-public-evaluation.yml"
            "docs/deform360_group_evaluation_v2.md"
            "scripts/science/prepare_deform360_archive_manifest.py"
            "scripts/science/prepare_deform360_name_inventory.py"
            "scripts/science/prepare_deform360_public_protocol.py"
            "scripts/science/run_deform360_group_evaluation.py"
            "tests/test_deform360_archive_manifest.py"
            "tests/test_deform360_group_evaluation.py"
            "tests/test_deform360_name_inventory.py"
            "tests/test_deform360_preflight_workflow.py"
            "tests/test_deform360_public_protocol.py"
          )
          for path in "${files[@]}"; do
            test -f "${source_root}/${path}"
            mkdir -p "$(dirname "${path}")"
            cp -a "${source_root}/${path}" "${path}"
          done

          rm -f \
            .github/workflows/materialize-deform360-v2.yml \
            tools/deform360-v2-bundle-00.b64 \
            tools/deform360-v2-bundle-01.b64 \
            tools/deform360-v2-bundle-02.b64

          python -m py_compile \
            scripts/science/prepare_deform360_archive_manifest.py \
            scripts/science/prepare_deform360_name_inventory.py \
            scripts/science/prepare_deform360_public_protocol.py \
            scripts/science/run_deform360_group_evaluation.py
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            .github/workflows/materialize-deform360-v2.yml \
            tools/deform360-v2-bundle-00.b64 \
            tools/deform360-v2-bundle-01.b64 \
            tools/deform360-v2-bundle-02.b64 \
            "${files[@]}"
          git diff --cached --check
          git commit -m "Harden staged Deform360 group evaluation"
          git push origin HEAD:agent/deform360-group-evaluation-v2
