name: Temporary main synchronization for PR 96

on:
  push:
    branches:
      - agent/separate-grouped-likelihood-semantics
    paths:
      - .github/workflows/temporary-sync-pr96.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/separate-grouped-likelihood-semantics
          fetch-depth: 0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          rm .github/workflows/temporary-sync-pr96.yml
          git add .github/workflows/temporary-sync-pr96.yml
          git commit -m "Remove temporary branch synchronization workflow"
          git push origin HEAD:agent/separate-grouped-likelihood-semantics
