name: Fix root deprecation formatting once

on:
  push:
    branches:
      - agent/root-deprecation-policy-current-v1

permissions:
  contents: write

concurrency:
  group: fix-root-deprecation-formatting-once
  cancel-in-progress: false

jobs:
  fix:
    if: github.repository == 'IPS-Stuttgart/BayesianPhysTwin'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/root-deprecation-policy-current-v1
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply Ruff's canonical layout and validate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m ruff check --fix src/bayesian_phystwin/__init__.py
          python -m ruff format src/bayesian_phystwin/__init__.py
          python -m ruff check src/bayesian_phystwin/__init__.py
          python -m ruff format --check src/bayesian_phystwin/__init__.py
          python -m pytest -q -p no:cacheprovider tests/test_root_deprecation_policy.py
          git diff --check

      - name: Commit the formatter result and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-root-deprecation-format-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Apply canonical root deprecation formatting'
          git push origin HEAD:agent/root-deprecation-policy-current-v1
