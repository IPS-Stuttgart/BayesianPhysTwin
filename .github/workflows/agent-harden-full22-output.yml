name: Agent harden full-22 output handling

# Temporary self-removing workflow for the isolated capsule branch.
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  harden:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/full22-reproduction-capsule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply output-path safety repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          script_path = Path("reproductions/full22_anchor_v1/reproduce.py")
          script = script_path.read_text(encoding="utf-8")
          old = '''def reproduce(args: argparse.Namespace) -> None:
              source_checkout = args.source_checkout.resolve()
              data_root = args.data_root.resolve()
              output = args.output_dir.resolve()
              if output.exists() and any(output.iterdir()) and not args.force:
                  raise FileExistsError(
                      f"output directory is not empty: {output}; pass --force to replace it"
                  )
              if output.exists() and args.force:
                  shutil.rmtree(output)
              output.mkdir(parents=True, exist_ok=True)

              validate_source_checkout(source_checkout)
              data_manifest = validate_data_root(data_root)
          '''
          new = '''def _validate_output_path(output: Path, protected_roots: Sequence[Path]) -> None:
              if output.exists() and not output.is_dir():
                  raise NotADirectoryError(output)
              for protected in protected_roots:
                  root = protected.resolve()
                  if output == root or output in root.parents or root in output.parents:
                      raise ValueError(
                          "output directory must not overlap a source, data, or repository "
                          f"root: {root}"
                      )


          def reproduce(args: argparse.Namespace) -> None:
              source_checkout = args.source_checkout.resolve()
              data_root = args.data_root.resolve()
              output = args.output_dir.resolve()
              _validate_output_path(
                  output,
                  (source_checkout, data_root, REPOSITORY_ROOT),
              )
              if output.exists() and any(output.iterdir()) and not args.force:
                  raise FileExistsError(
                      f"output directory is not empty: {output}; pass --force to replace it"
                  )

              validate_source_checkout(source_checkout)
              data_manifest = validate_data_root(data_root)
              if output.exists() and args.force:
                  shutil.rmtree(output)
              output.mkdir(parents=True, exist_ok=True)
          '''
          if script.count(old) != 1:
              raise SystemExit("unexpected reproduce() block; refusing an ambiguous repair")
          script_path.write_text(script.replace(old, new), encoding="utf-8")

          test_path = Path("tests/test_full22_reproduction_capsule.py")
          tests = test_path.read_text(encoding="utf-8")
          tests = tests.replace(
              "from types import ModuleType\n",
              "from types import ModuleType, SimpleNamespace\n",
              1,
          )
          marker = "def test_output_path_rejects_protected_overlaps"
          if marker in tests:
              raise SystemExit("output-path tests already exist")
          tests += '''


          @pytest.mark.parametrize("relation", ("same", "ancestor", "descendant"))
          def test_output_path_rejects_protected_overlaps(
              tmp_path: Path,
              relation: str,
          ) -> None:
              capsule = _load_capsule()
              protected = tmp_path / "protected"
              protected.mkdir()
              output = {
                  "same": protected,
                  "ancestor": tmp_path,
                  "descendant": protected / "bundle",
              }[relation]

              with pytest.raises(ValueError, match="must not overlap"):
                  capsule._validate_output_path(output, (protected,))


          def test_output_path_rejects_existing_file(tmp_path: Path) -> None:
              capsule = _load_capsule()
              protected = tmp_path / "protected"
              protected.mkdir()
              output = tmp_path / "bundle"
              output.write_text("not a directory", encoding="utf-8")

              with pytest.raises(NotADirectoryError):
                  capsule._validate_output_path(output, (protected,))


          def test_force_preserves_output_when_source_validation_fails(
              tmp_path: Path,
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              capsule = _load_capsule()
              source = tmp_path / "source"
              data = tmp_path / "data"
              output = tmp_path / "output"
              source.mkdir()
              data.mkdir()
              output.mkdir()
              marker_path = output / "must-survive.txt"
              marker_path.write_text("evidence", encoding="utf-8")

              def reject_source(_source: Path) -> None:
                  raise ValueError("invalid source")

              monkeypatch.setattr(capsule, "validate_source_checkout", reject_source)
              args = SimpleNamespace(
                  source_checkout=source,
                  data_root=data,
                  output_dir=output,
                  workers=1,
                  force=True,
              )

              with pytest.raises(ValueError, match="invalid source"):
                  capsule.reproduce(args)
              assert marker_path.read_text(encoding="utf-8") == "evidence"
          '''
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Format and test the repair
        run: |
          set -euo pipefail
          python -m pip install "pytest>=8,<10" "ruff==0.16.0"
          files=(
            reproductions/full22_anchor_v1/reproduce.py
            tests/test_full22_reproduction_capsule.py
          )
          python -m ruff check --fix -- "${files[@]}"
          python -m ruff format -- "${files[@]}"
          python -m ruff check -- "${files[@]}"
          python -m ruff format --check -- "${files[@]}"
          python -m pytest -q tests/test_full22_reproduction_capsule.py

      - name: Commit product-only safety repair
        run: |
          set -euo pipefail
          rm .github/workflows/agent-harden-full22-output.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden full-22 capsule output handling"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
