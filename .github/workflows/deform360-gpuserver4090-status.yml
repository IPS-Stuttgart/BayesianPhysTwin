# workflow-lifecycle: temporary
# workflow-owner: IPS-Stuttgart maintainers
name: Deform360 gpuserver4090 downloader status

on:
  push:
    branches:
      - science/deform360-gpuserver4090-preflight
    paths:
      - ".github/workflows/deform360-gpuserver4090-status.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deform360-gpuserver4090-status-${{ github.ref }}
  cancel-in-progress: true

env:
  DEFORM360_ROOT: /mnt/seagate10tb/florianpfaff/datasets/deform360
  PYTHONUNBUFFERED: "1"

jobs:
  status:
    name: Downloader control-file and incomplete-file diagnostic
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 10
    steps:
      - name: Inspect downloader control state without opening dataset payloads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["DEFORM360_ROOT"]).resolve()
          if not root.is_dir():
              raise SystemExit(f"missing dataset root: {root}")

          gpu_names = os.popen(
              "nvidia-smi --query-gpu=name --format=csv,noheader"
          ).read().strip().splitlines()
          if not any("4090" in name for name in gpu_names):
              raise SystemExit(f"runner has no RTX 4090: {gpu_names}")

          def first_level_directories(path: Path) -> list[str]:
              if not path.is_dir():
                  return []
              return sorted(
                  child.name
                  for child in path.iterdir()
                  if child.is_dir() and not child.is_symlink()
              )

          incomplete = []
          for directory, names, files in os.walk(root, followlinks=False):
              names[:] = sorted(
                  name
                  for name in names
                  if name not in {".git", "__pycache__", "node_modules"}
              )
              for filename in sorted(files):
                  if not filename.endswith(".incomplete"):
                      continue
                  path = Path(directory) / filename
                  try:
                      stat = path.stat(follow_symlinks=False)
                  except FileNotFoundError:
                      continue
                  incomplete.append(
                      {
                          "path": path.relative_to(root).as_posix(),
                          "size_bytes": stat.st_size,
                          "mtime_ns": stat.st_mtime_ns,
                      }
                  )

          status_path = root / "download.status"
          status_text = None
          status_sha256 = None
          if status_path.is_file() and not status_path.is_symlink():
              import hashlib

              raw = status_path.read_bytes()
              status_sha256 = hashlib.sha256(raw).hexdigest()
              text = raw[:4096].decode("utf-8", errors="replace")
              safe_lines = []
              for line in text.splitlines():
                  lowered = line.lower()
                  if any(
                      marker in lowered
                      for marker in (
                          "token",
                          "authorization",
                          "cookie",
                          "secret",
                          "password",
                          "api_key",
                          "apikey",
                      )
                  ):
                      safe_lines.append("<redacted-sensitive-status-line>")
                      continue
                  line = re.sub(r"https?://\S+", "<redacted-url>", line)
                  safe_lines.append(line)
              status_text = "\n".join(safe_lines)

          raw_objects = first_level_directories(root / "raw-repository" / "raw")
          processed_candidates = []
          for candidate in (
              root / "processed-repository" / "processed",
              root / "processed-repository" / "data",
              root / "processed-repository",
          ):
              names = first_level_directories(candidate)
              if names:
                  processed_candidates.append(
                      {"root": str(candidate), "first_level_directories": names}
                  )

          result = {
              "schema": "bayesian-phystwin/deform360-downloader-status-v1",
              "schema_version": 1,
              "runner_name": os.environ.get("RUNNER_NAME"),
              "hostname": os.uname().nodename,
              "gpu_names": gpu_names,
              "dataset_root": str(root),
              "status_file_present": status_path.is_file(),
              "status_file_sha256": status_sha256,
              "sanitized_status_text": status_text,
              "incomplete_file_count": len(incomplete),
              "incomplete_file_bytes": sum(
                  int(record["size_bytes"]) for record in incomplete
              ),
              "incomplete_files": incomplete,
              "raw_object_directory_count": len(raw_objects),
              "raw_object_directories": raw_objects,
              "processed_directory_candidates": processed_candidates,
              "information_boundary": {
                  "dataset_payload_opened": False,
                  "only_downloader_control_file_content_opened": True,
                  "dataset_names_sizes_and_timestamps_inspected": True,
                  "reserved_target_outcomes_opened": False,
              },
          }
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
