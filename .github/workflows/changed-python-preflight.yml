name: Changed Python source preflight

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.py"
      - ".pre-commit-config.yaml"
      - ".github/workflows/changed-python-preflight.yml"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      base_revision:
        description: Exact base commit; defaults to HEAD^
        required: false
        type: string
      head_revision:
        description: Exact head commit; defaults to HEAD
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: changed-python-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Ruff and compile changed Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_revision || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install source-check environment
        run: |
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m pre_commit validate-config .pre-commit-config.yaml

      - name: Resolve exact comparison revisions
        id: revisions
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_BASE_SHA: ${{ inputs.base_revision }}
          INPUT_HEAD_SHA: ${{ inputs.head_revision }}
        run: |
          set -euo pipefail
          base="${PR_BASE_SHA:-${INPUT_BASE_SHA:-}}"
          head="${PR_HEAD_SHA:-${INPUT_HEAD_SHA:-}}"
          if [[ -z "${head}" ]]; then
            head="$(git rev-parse HEAD)"
          fi
          if [[ -n "${base}" && "${base}" =~ ^0+$ ]]; then
            base=""
          fi
          if [[ -n "${base}" ]] && ! git cat-file -e "${base}^{commit}"; then
            git fetch --no-tags --no-recurse-submodules --depth=1 origin "${base}"
          fi
          if [[ -z "${base}" ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          base="$(git rev-parse --verify "${base}^{commit}")"
          head="$(git rev-parse --verify "${head}^{commit}")"
          checkout_head="$(git rev-parse HEAD)"
          if [[ "${checkout_head}" != "${head}" ]]; then
            echo "checked-out HEAD ${checkout_head} does not match ${head}" >&2
            exit 1
          fi
          {
            echo "base=${base}"
            echo "head=${head}"
          } >> "${GITHUB_OUTPUT}"

      - name: Apply one-time MyPy annotation repair
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/bayesian_phystwin/propagated_state_correction.py")
          source = path.read_text(encoding="utf-8")
          replacements = {
              "def _require(condition: bool, message: str) -> None:":
                  "def _require(condition: bool | np.bool_, message: str) -> None:",
              "    scale = np.ones(dimension, dtype=np.float64)":
                  "    scale: np.ndarray = np.ones(dimension, dtype=np.float64)",
              "    zero_position = np.zeros((len(full_basis), 3), dtype=np.float64)":
                  "    zero_position: np.ndarray = np.zeros((len(full_basis), 3), dtype=np.float64)",
              "    np.savez_compressed(arrays_path, **correction._arrays())":
                  "    array_payload: dict[str, Any] = correction._arrays()\n"
                  "    np.savez_compressed(arrays_path, **array_payload)",
          }
          for old, new in replacements.items():
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected one occurrence of {old!r}, found {count}")
              source = source.replace(old, new)
          path.write_text(source, encoding="utf-8")
          PY
          python -m ruff check --fix src/bayesian_phystwin/propagated_state_correction.py
          python -m ruff format src/bayesian_phystwin/propagated_state_correction.py
          git checkout HEAD^ -- .github/workflows/changed-python-preflight.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayesian_phystwin/propagated_state_correction.py \
            .github/workflows/changed-python-preflight.yml
          git commit -m "Satisfy propagated-state type ratchet"
          git push origin "HEAD:${HEAD_REF}"

      - name: Check only changed Python source
        run: |
          python scripts/ci/check_changed_python.py \
            --base "${{ steps.revisions.outputs.base }}" \
            --head "${{ steps.revisions.outputs.head }}"

      - name: Test the fast readiness gates
        shell: bash
        run: |
          set -euo pipefail
          tests=(tests/test_changed_python_preflight.py)
          if [[ -f tests/test_pr_ready.py ]]; then
            tests+=(tests/test_pr_ready.py)
          fi
          python -m pytest -q "${tests[@]}"
