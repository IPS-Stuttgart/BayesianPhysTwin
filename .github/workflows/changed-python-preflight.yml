# workflow-lifecycle: permanent
# workflow-owner: IPS-Stuttgart maintainers
name: Changed source and workflow preflight

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.py"
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/changed-python-preflight.yml"
      - "docs/workflow_lifecycle.md"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      base_revision:
        description: Exact base commit; defaults to HEAD^
        required: false
        type: string
      head_revision:
        description: Exact head commit; defaults to HEAD
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: changed-source-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Ruff, compile, and workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_revision || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install source-check environment
        run: |
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m pre_commit validate-config .pre-commit-config.yaml

      - name: Resolve exact comparison revisions
        id: revisions
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_BASE_SHA: ${{ inputs.base_revision }}
          INPUT_HEAD_SHA: ${{ inputs.head_revision }}
        run: |
          set -euo pipefail
          base="${PR_BASE_SHA:-${INPUT_BASE_SHA:-}}"
          head="${PR_HEAD_SHA:-${INPUT_HEAD_SHA:-}}"
          if [[ -z "${head}" ]]; then
            head="$(git rev-parse HEAD)"
          fi
          if [[ -n "${base}" && "${base}" =~ ^0+$ ]]; then
            base=""
          fi
          if [[ -n "${base}" ]] && ! git cat-file -e "${base}^{commit}"; then
            git fetch --no-tags --no-recurse-submodules --depth=1 origin "${base}"
          fi
          if [[ -z "${base}" ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          base="$(git rev-parse --verify "${base}^{commit}")"
          head="$(git rev-parse --verify "${head}^{commit}")"
          checkout_head="$(git rev-parse HEAD)"
          if [[ "${checkout_head}" != "${head}" ]]; then
            echo "checked-out HEAD ${checkout_head} does not match ${head}" >&2
            exit 1
          fi
          {
            echo "base=${base}"
            echo "head=${head}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check changed Python and workflow definitions
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/check_changed_python.py \
            --base "${{ steps.revisions.outputs.base }}" \
            --head "${{ steps.revisions.outputs.head }}"
          python tools/quality/check_workflow_policy.py \
            --base "${{ steps.revisions.outputs.base }}" \
            --head "${{ steps.revisions.outputs.head }}"

      - name: Materialize canonical Ruff output after formatter failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/canonical-ruff"
          rm -rf -- "$root"
          mkdir -p "$root/files"
          mapfile -d '' files < <(
            git diff --name-only --diff-filter=ACMR -z \
              "${{ steps.revisions.outputs.base }}" \
              "${{ steps.revisions.outputs.head }}" -- '*.py'
          )
          if [[ "${#files[@]}" -eq 0 ]]; then
            printf 'No changed Python files.\n' > "$root/README.txt"
          else
            python -m ruff format "${files[@]}"
            for file in "${files[@]}"; do
              mkdir -p "$root/files/$(dirname "$file")"
              cp -- "$file" "$root/files/$file"
            done
            printf '%s\n' "${files[@]}" > "$root/paths.txt"
          fi
          printf '%s\n' \
            "base=${{ steps.revisions.outputs.base }}" \
            "head=${{ steps.revisions.outputs.head }}" \
            > "$root/revisions.txt"

      - name: Upload canonical Ruff output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: canonical-ruff-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/canonical-ruff
          if-no-files-found: error
          retention-days: 7

      - name: Test the fast readiness gates
        shell: bash
        run: |
          set -euo pipefail
          tests=(tests/test_changed_python_preflight.py)
          tests+=(tests/test_workflow_policy.py)
          tests+=(tests/test_workflow_registry_audit.py)
          tests+=(tests/test_repository_branch_lifecycle_audit.py)
          if [[ -f tests/test_pr_ready.py ]]; then
            tests+=(tests/test_pr_ready.py)
          fi
          python -m pytest -q "${tests[@]}"
