# workflow-lifecycle: permanent
# workflow-owner: IPS-Stuttgart maintainers
name: Changed source and workflow preflight

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.py"
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/changed-python-preflight.yml"
      - "docs/workflow_lifecycle.md"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      base_revision:
        description: Exact base commit; defaults to HEAD^
        required: false
        type: string
      head_revision:
        description: Exact head commit; defaults to HEAD
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: changed-source-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-active-decision:
    name: Materialize content-addressed active-decision payload
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'feature/active-decision-acquisition-v1' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Reconstruct the content-addressed archive
        id: payload
        shell: bash
        env:
          EXPECTED_RAW_SHA256: bf7bc9c7f53e22138711314671d9b9256dee09c78c11f05aa6d77a45f5515177
        run: |
          set -euo pipefail
          raw="$RUNNER_TEMP/active-decision-payload.zip"
          repaired="$RUNNER_TEMP/active-decision-payload-repaired.zip"
          python - "$raw" <<'PY'
          import base64
          import hashlib
          import os
          import sys
          from pathlib import Path

          output = Path(sys.argv[1])
          root = Path("ops/bootstrap/active-decision")
          chunks = [root / f"chunk-{index:02d}.txt" for index in range(7)]
          chunks += [root / f"chunk-07-part-{index:02d}.txt" for index in range(4)]
          missing = [str(path) for path in chunks if not path.is_file()]
          if missing:
              raise SystemExit(f"missing payload chunks: {missing}")
          encoded = "".join(path.read_text(encoding="ascii").strip() for path in chunks)
          raw = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(raw).hexdigest()
          if digest != os.environ["EXPECTED_RAW_SHA256"]:
              raise SystemExit(f"active-decision raw digest mismatch: {digest}")
          output.write_bytes(raw)
          PY
          printf 'y\n' | zip -FF "$raw" --out "$repaired" >/tmp/zip-repair.log 2>&1
          test -s "$repaired"
          cat /tmp/zip-repair.log
          echo "archive=$repaired" >> "$GITHUB_OUTPUT"

      - name: Validate, materialize, and retire bootstrap data
        shell: bash
        env:
          ARCHIVE: ${{ steps.payload.outputs.archive }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          archive_path = Path(os.environ["ARCHIVE"])
          expected = {
              ".github/workflows/active-decision-acquisition-v1.yml",
              "docs/active-decision-acquisition-v1.md",
              "experiments/active_decision_acquisition_v1/run.py",
              "protocols/active-decision-acquisition-study-v1.json",
              "results/science/active_decision_acquisition_v1/controlled-v1/result.json",
              "results/science/active_decision_acquisition_v1/controlled-v1/summary.md",
              "src/bayesian_phystwin/active_decision_acquisition_v1.py",
              "tests/test_active_decision_acquisition_study_v1.py",
              "tests/test_active_decision_v1.py",
          }
          with zipfile.ZipFile(archive_path) as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise SystemExit(f"active-decision payload CRC failure: {bad}")
              members = [member.filename for member in archive.infolist() if not member.is_dir()]
              if len(members) != len(expected) or set(members) != expected:
                  raise SystemExit(f"unexpected payload members: {members}")
              for member in archive.infolist():
                  path = Path(member.filename)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe payload member: {member.filename}")
              archive.extractall(Path.cwd())
          PY
          rm -f .github/workflows/active-decision-acquisition-v1.yml
          git rm -r ops/bootstrap/active-decision
          git checkout origin/main -- .github/workflows/changed-python-preflight.yml
          git add \
            .github/workflows/changed-python-preflight.yml \
            docs/active-decision-acquisition-v1.md \
            experiments/active_decision_acquisition_v1/run.py \
            protocols/active-decision-acquisition-study-v1.json \
            results/science/active_decision_acquisition_v1/controlled-v1/result.json \
            results/science/active_decision_acquisition_v1/controlled-v1/summary.md \
            src/bayesian_phystwin/active_decision_acquisition_v1.py \
            tests/test_active_decision_acquisition_study_v1.py \
            tests/test_active_decision_v1.py
          python - <<'PY'
          import subprocess

          expected = {
              ".github/workflows/changed-python-preflight.yml",
              "docs/active-decision-acquisition-v1.md",
              "experiments/active_decision_acquisition_v1/run.py",
              "protocols/active-decision-acquisition-study-v1.json",
              "results/science/active_decision_acquisition_v1/controlled-v1/result.json",
              "results/science/active_decision_acquisition_v1/controlled-v1/summary.md",
              "src/bayesian_phystwin/active_decision_acquisition_v1.py",
              "tests/test_active_decision_acquisition_study_v1.py",
              "tests/test_active_decision_v1.py",
          }
          expected.update(
              f"ops/bootstrap/active-decision/chunk-{index:02d}.txt" for index in range(8)
          )
          expected.update(
              f"ops/bootstrap/active-decision/chunk-07-part-{index:02d}.txt"
              for index in range(4)
          )
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only"], text=True
              ).splitlines()
          )
          if changed != expected:
              raise SystemExit(
                  f"unexpected staged bootstrap materialization diff: {sorted(changed)}"
              )
          PY
          test -z "$(git status --short | grep '^??' || true)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Add exact active decision acquisition"
          git push origin HEAD:feature/active-decision-acquisition-v1

  preflight:
    name: Ruff, compile, and workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_revision || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install source-check environment
        run: |
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m pre_commit validate-config .pre-commit-config.yaml

      - name: Resolve exact comparison revisions
        id: revisions
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_BASE_SHA: ${{ inputs.base_revision }}
          INPUT_HEAD_SHA: ${{ inputs.head_revision }}
        run: |
          set -euo pipefail
          base="${PR_BASE_SHA:-${INPUT_BASE_SHA:-}}"
          head="${PR_HEAD_SHA:-${INPUT_HEAD_SHA:-}}"
          if [[ -z "${head}" ]]; then
            head="$(git rev-parse HEAD)"
          fi
          if [[ -n "${base}" && "${base}" =~ ^0+$ ]]; then
            base=""
          fi
          if [[ -n "${base}" ]] && ! git cat-file -e "${base}^{commit}"; then
            git fetch --no-tags --no-recurse-submodules --depth=1 origin "${base}"
          fi
          if [[ -z "${base}" ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          base="$(git rev-parse --verify "${base}^{commit}")"
          head="$(git rev-parse --verify "${head}^{commit}")"
          checkout_head="$(git rev-parse HEAD)"
          if [[ "${checkout_head}" != "${head}" ]]; then
            echo "checked-out HEAD ${checkout_head} does not match ${head}" >&2
            exit 1
          fi
          {
            echo "base=${base}"
            echo "head=${head}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check changed Python and workflow definitions
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/check_changed_python.py \
            --base "${{ steps.revisions.outputs.base }}" \
            --head "${{ steps.revisions.outputs.head }}"
          python tools/quality/check_workflow_policy.py \
            --base "${{ steps.revisions.outputs.base }}" \
            --head "${{ steps.revisions.outputs.head }}"

      - name: Test the fast readiness gates
        shell: bash
        run: |
          set -euo pipefail
          tests=(tests/test_changed_python_preflight.py)
          tests+=(tests/test_workflow_policy.py)
          tests+=(tests/test_workflow_registry_audit.py)
          tests+=(tests/test_repository_branch_lifecycle_audit.py)
          if [[ -f tests/test_pr_ready.py ]]; then
            tests+=(tests/test_pr_ready.py)
          fi
          python -m pytest -q "${tests[@]}"
