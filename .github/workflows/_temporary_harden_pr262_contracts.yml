name: Temporary harden PR 262 contracts

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]
    paths:
      - ".github/workflows/_temporary_harden_pr262_contracts.yml"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: temporary-harden-pr262-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  harden:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.event.pull_request.number == 262 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref ==
        'agent/deform360-visual-execution-admission-v1' &&
      github.event.pull_request.user.login == 'FlorianPfaff'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply fail-closed contract hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, *, name: str) -> str:
              if text.count(old) != 1:
                  raise SystemExit(f"{name} shape changed")
              return text.replace(old, new)

          source_path = Path(
              "src/bayesian_phystwin/"
              "deform360_calibration_visual_execution_admission.py"
          )
          source = source_path.read_text(encoding="utf-8")
          source = replace_once(
              source,
              "from pathlib import Path, PurePosixPath\n",
              "from pathlib import Path\n",
              name="pathlib import",
          )
          source = replace_once(
              source,
              "from ._canonical_contracts import plain_json\n",
              "from ._canonical_contracts import "
              "canonical_relative_posix_path, plain_json\n",
              name="canonical path import",
          )
          source = replace_once(
              source,
              '''def _safe_relative_path(value: object, *, name: str) -> str:
              text = _literal_string(value, name=name)
              path = PurePosixPath(text)
              if (
                  path.is_absolute()
                  or "\\\\" in text
                  or any(part in {"", ".", ".."} for part in path.parts)
              ):
                  raise ValueError(f"{name} must be a safe POSIX relative path")
              return path.as_posix()
          ''',
              '''def _safe_relative_path(value: object, *, name: str) -> str:
              return canonical_relative_posix_path(
                  _literal_string(value, name=name),
                  name=name,
              )
          ''',
              name="safe relative path validator",
          )
          source = replace_once(
              source,
              '        if item["synthetic_episode_index"] != 0:\n'
              '            raise ValueError('\
              'f"inventory episode index changed: {object_id}")\n',
              '        synthetic_episode_index = _literal_integer(\n'
              '            item["synthetic_episode_index"],\n'
              '            name=f"{object_id} synthetic_episode_index",\n'
              '        )\n'
              '        if synthetic_episode_index != 0:\n'
              '            raise ValueError('\
              'f"inventory episode index changed: {object_id}")\n',
              name="synthetic episode index validator",
          )
          source_path.write_text(source, encoding="utf-8")

          docs_path = Path("docs/deform360_calibration_visual_execution_admission.md")
          docs = docs_path.read_text(encoding="utf-8")
          docs = replace_once(
              docs,
              "modification\n time, and change time",
              "modification\ntime, and change time",
              name="documentation line wrap",
          )
          docs_path.write_text(docs, encoding="utf-8")

          tests_path = Path(
              "tests/test_deform360_calibration_visual_execution_admission.py"
          )
          tests = tests_path.read_text(encoding="utf-8")
          anchor = (
              '    with pytest.raises(ValueError, match="version changed"):\n'
              "        build_deform360_calibration_visual_execution_admission(\n"
              "            visual_production_plan_path=plan_path,\n"
              "            prepared_source_inventory_path=inventory_path,\n"
              "            implementation_revision=IMPLEMENTATION_REVISION,\n"
              "        )\n\n"
              '    admission = _build(tmp_path / "tamper")\n'
          )
          replacement = (
              '    with pytest.raises(ValueError, match="version changed"):\n'
              "        build_deform360_calibration_visual_execution_admission(\n"
              "            visual_production_plan_path=plan_path,\n"
              "            prepared_source_inventory_path=inventory_path,\n"
              "            implementation_revision=IMPLEMENTATION_REVISION,\n"
              "        )\n\n"
              "    plan_path, inventory_path, _plan = _inputs(\n"
              '        tmp_path / "boolean-index"\n'
              "    )\n"
              '    inventory = json.loads(inventory_path.read_text(encoding="utf-8"))\n'
              '    inventory["objects"][0]["synthetic_episode_index"] = False\n'
              "    _rewrite_inventory(inventory_path, inventory)\n"
              "    with pytest.raises(ValueError, match=\"synthetic_episode_index\"):\n"
              "        build_deform360_calibration_visual_execution_admission(\n"
              "            visual_production_plan_path=plan_path,\n"
              "            prepared_source_inventory_path=inventory_path,\n"
              "            implementation_revision=IMPLEMENTATION_REVISION,\n"
              "        )\n\n"
              "    plan_path, inventory_path, _plan = _inputs(\n"
              '        tmp_path / "path-alias"\n'
              "    )\n"
              '    inventory = json.loads(inventory_path.read_text(encoding="utf-8"))\n'
              '    video = inventory["objects"][0]["cameras"][0]["video"]\n'
              '    video["path"] = video["path"].replace(\n'
              '        "/undistorted.mp4",\n'
              '        "//undistorted.mp4",\n'
              "    )\n"
              "    _rewrite_inventory(inventory_path, inventory)\n"
              "    with pytest.raises(\n"
              '        ValueError, match="canonical relative POSIX path"\n'
              "    ):\n"
              "        build_deform360_calibration_visual_execution_admission(\n"
              "            visual_production_plan_path=plan_path,\n"
              "            prepared_source_inventory_path=inventory_path,\n"
              "            implementation_revision=IMPLEMENTATION_REVISION,\n"
              "        )\n\n"
              '    admission = _build(tmp_path / "tamper")\n'
          )
          tests = replace_once(
              tests,
              anchor,
              replacement,
              name="adversarial-test insertion point",
          )
          tests_path.write_text(tests, encoding="utf-8")
          PY

      - name: Install exact validation environment
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev,graph]" "numpy>=1.24,<2.2"
          python -m pip check

      - name: Normalize and validate exact source
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/bayesian_phystwin/deform360_calibration_visual_execution_admission.py
            tests/test_deform360_calibration_visual_execution_admission.py
          )
          python -m ruff check --fix "${files[@]}"
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy \
            src/bayesian_phystwin/deform360_calibration_visual_execution_admission.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_deform360_calibration_visual_execution_admission.py \
            tests/test_deform360_calibration_visual_production_plan.py
          python -m py_compile \
            src/bayesian_phystwin/deform360_calibration_visual_execution_admission.py \
            tests/test_deform360_calibration_visual_execution_admission.py
          git diff --check

      - name: Publish validated blob identities
        shell: bash
        env:
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          PARENT_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          RECEIPT: ${{ runner.temp }}/pr262-hardening-receipt.json
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          api = os.environ["API_URL"]
          repository = os.environ["REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          parent = os.environ["PARENT_SHA"]
          receipt_path = Path(os.environ["RECEIPT"])
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          def request(method: str, path: str, payload: object | None = None) -> object:
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  f"{api}/repos/{repository}{path}",
                  data=data,
                  headers=headers,
                  method=method,
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          parent_commit = request("GET", f"/git/commits/{parent}")
          if not isinstance(parent_commit, dict):
              raise SystemExit("parent commit response is not an object")
          base_tree = str(parent_commit["tree"]["sha"])
          blob_shas = {}
          for relative in (
              "docs/deform360_calibration_visual_execution_admission.md",
              "src/bayesian_phystwin/deform360_calibration_visual_execution_admission.py",
              "tests/test_deform360_calibration_visual_execution_admission.py",
          ):
              payload = Path(relative).read_bytes()
              blob = request(
                  "POST",
                  "/git/blobs",
                  {
                      "content": base64.b64encode(payload).decode("ascii"),
                      "encoding": "base64",
                  },
              )
              if not isinstance(blob, dict):
                  raise SystemExit(f"blob response is not an object: {relative}")
              blob_shas[relative] = str(blob["sha"])
          receipt = {
              "repository": repository,
              "parent_sha": parent,
              "base_tree_sha": base_tree,
              "blob_shas": blob_shas,
              "deleted_paths": [
                  ".github/workflows/_temporary_harden_pr262_contracts.yml"
              ],
          }
          receipt_path.write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Upload validated source and receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pr262-contract-hardening-${{ github.event.pull_request.head.sha }}
          path: |
            docs/deform360_calibration_visual_execution_admission.md
            src/bayesian_phystwin/deform360_calibration_visual_execution_admission.py
            tests/test_deform360_calibration_visual_execution_admission.py
            ${{ runner.temp }}/pr262-hardening-receipt.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 2
