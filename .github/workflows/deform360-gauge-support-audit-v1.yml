name: Deform360 metric-gauge source support audit v1

on:
  push:
    branches:
      - science/deform360-gauge-support-audit-v1
    paths:
      - .github/requests/deform360-gauge-support-audit-v1.json

permissions:
  actions: read
  contents: read

concurrency:
  group: deform360-gauge-support-audit-v1
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  REQUEST_PATH: .github/requests/deform360-gauge-support-audit-v1.json
  SOURCE_EXECUTION_LOCK: protocols/locks/deform360_official_hub_joint_sparse_source_execution_v5.json
  SOURCE_ROOT: /mnt/lexar4tb/datasets/deform360-official-hub-visuotactile-v1/calibration-source
  PROCESSED_ROOT: /mnt/lexar4tb/datasets/deform360-official-hub-visuotactile-v1/calibration-processed
  FORBIDDEN_CONFIRMATION_ROOT: /mnt/lexar4tb/datasets/deform360/adaptive-confirmation-download-5a9c56d593462486bdd0953dcaf6f9c643bf8370
  RESULTS_ROOT: /mnt/lexar4tb/datasets/deform360/results
  UPSTREAM_RUN_ROOT: /mnt/lexar4tb/datasets/deform360/results/bayesian-phystwin/deform360-v6-source-prediction/f8ed525480a6a96265af3cd58e62a96bf1ed748294d0af02aa6386763b993b7f/6bb16bb307349c50535b1b368c60dfb4d5d17ab9
  BASE_RUN_ID: "31585420194"
  BASE_ARTIFACT_ID: "9137481740"
  BASE_ARTIFACT_NAME: deform360-v6-source-prediction-dual-runtime-31585420194-1
  BASE_ARTIFACT_DIGEST: sha256:d811ff1ea4d6ad22a6e7476d2911602af1ee71f81339c0737e1cc60fd5883f9d
  BASE_HEAD_SHA: 6bb16bb307349c50535b1b368c60dfb4d5d17ab9

jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, gpuserver6000]
    timeout-minutes: 180
    steps:
      - name: Check out exact audit revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          clean: true

      - name: Authorize one add-only source-audit request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/science/deform360-gauge-support-audit-v1
          test "$PUSH_FORCED" = false
          test "$BEFORE_SHA" != 0000000000000000000000000000000000000000
          mapfile -t changed < <(git diff --name-status "$BEFORE_SHA" "$GITHUB_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = $'A\t.github/requests/deform360-gauge-support-audit-v1.json'
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          request = json.loads(Path(os.environ["REQUEST_PATH"]).read_text(encoding="utf-8"))
          expected = {
              "schema": "deform360-metric-gauge-support-audit-request-v1",
              "request_id": "deform360-gauge-support-audit-20260831-v1",
              "runner_label": "gpuserver6000",
              "source_only": True,
              "cluster_sizes_pixels": [64, 48, 32, 24, 16, 12, 8, 4],
              "minimum_independent_clusters": 8,
              "prior_failed_run_id": 33012751418,
              "prior_failure_receipt_id": "e705d19c50273e2b1f09ff1ccd09fd4cf08b250241f2d0f4c4f0a17bcb775df3",
              "prior_prediction_record_count": 0,
              "prior_target_access": False,
              "confirmation_access_authorized": False,
              "purpose": "diagnose prefix-only metric-gauge support without changing the registered predictor",
          }
          for key, value in expected.items():
              if request.get(key) != value:
                  raise SystemExit(f"invalid {key}: {request.get(key)!r}")
          if set(request) != set(expected) | {"expected_source_revision"}:
              raise SystemExit("audit request fields differ")
          parent = subprocess.check_output(
              ["git", "rev-parse", f"{os.environ['GITHUB_SHA']}^"], text=True
          ).strip()
          if request["expected_source_revision"] != parent:
              raise SystemExit("expected_source_revision is not the trigger parent")
          PY

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact source-only runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "numpy==2.2.6"
          python -m pip install --no-deps -e .
          python -m pip check
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1)"

      - name: Bind source roots and exclude confirmation data
        shell: bash
        run: |
          set -euo pipefail
          source_root="$(realpath -e "$SOURCE_ROOT")"
          processed_root="$(realpath -e "$PROCESSED_ROOT")"
          forbidden_root="$(realpath -e "$FORBIDDEN_CONFIRMATION_ROOT")"
          results_root="$(realpath -e "$RESULTS_ROOT")"
          upstream_root="$(realpath -e "$UPSTREAM_RUN_ROOT")"
          test "$source_root" = "$SOURCE_ROOT"
          test "$processed_root" = "$PROCESSED_ROOT"
          test "$forbidden_root" = "$FORBIDDEN_CONFIRMATION_ROOT"
          test "$results_root" = "$RESULTS_ROOT"
          test "$upstream_root" = "$UPSTREAM_RUN_ROOT"
          for admitted in "$source_root" "$processed_root" "$results_root" "$upstream_root"; do
            test "$admitted" != "$forbidden_root"
            case "$admitted/" in "$forbidden_root/"*) exit 2 ;; esac
            case "$forbidden_root/" in "$admitted/"*) exit 2 ;; esac
          done
          mkdir -p "$RUNNER_TEMP/deform360-gauge-audit"
          {
            echo "AUDIT_OUTPUT=$RUNNER_TEMP/deform360-gauge-audit/audit.json"
            echo "AUDIT_LOG=$RUNNER_TEMP/deform360-gauge-audit/audit.log"
            echo "COMPACT_ROOT=$RUNNER_TEMP/deform360-v6-base-source"
          } >> "$GITHUB_ENV"

      - name: Verify immutable public source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run")" = "$BASE_HEAD_SHA"
          test "$(jq -r '.status' <<<"$run")" = completed
          test "$(jq -r '.conclusion' <<<"$run")" = success
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}")"
          test "$(jq -r '.name' <<<"$artifact")" = "$BASE_ARTIFACT_NAME"
          test "$(jq -r '.digest' <<<"$artifact")" = "$BASE_ARTIFACT_DIGEST"
          test "$(jq -r '.expired' <<<"$artifact")" = false

      - name: Download exact compact source evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: ${{ env.BASE_ARTIFACT_NAME }}
          path: ${{ env.COMPACT_ROOT }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BASE_RUN_ID }}

      - name: Audit exact first-frame gauge support over source prefixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee "$AUDIT_LOG"
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path
          from typing import Any

          import numpy as np

          import bayesian_phystwin.deform360_covariance_source_producer_v1 as producer
          from bayesian_phystwin.deform360_joint_sparse_public_inputs_v5 import (
              _load_metric_prefix,
              load_motioncrafter_prediction,
              robust_similarity_transform,
          )

          SIZES = (64, 48, 32, 24, 16, 12, 8, 4)
          REQUIRED = 8

          def canonical_id(payload: dict[str, Any]) -> str:
              return hashlib.sha256(
                  json.dumps(
                      payload,
                      sort_keys=True,
                      separators=(",", ":"),
                      allow_nan=False,
                  ).encode("utf-8")
              ).hexdigest()

          compact = Path(os.environ["COMPACT_ROOT"]).resolve(strict=True)
          plan_path = compact / "source-plan.json"
          execution_receipt = compact / "execution-receipt.json"
          if producer._sha256_file(plan_path) != producer.UPSTREAM_SOURCE_PLAN_FILE_SHA256:
              raise SystemExit("source plan identity changed")
          lock_path = Path(os.environ["SOURCE_EXECUTION_LOCK"]).resolve(strict=True)
          lock = producer.load_deform360_joint_sparse_source_execution_lock_v5(lock_path)
          plan = producer.validate_deform360_joint_sparse_source_prediction_plan_v5(
              producer.load_strict_json_object(plan_path, label="source plan"),
              lock=lock,
          )
          common = {"audit/source-plan.json": producer._file_record(plan_path)}
          units = producer._resolve_source_inputs(
              source_plan=plan,
              input_root=producer._ordinary_root(Path(os.environ["RESULTS_ROOT"])),
              upstream_run_root=producer._ordinary_directory(
                  Path(os.environ["UPSTREAM_RUN_ROOT"]), name="upstream run root"
              ),
              upstream_evidence_root=execution_receipt.parent,
              common_artifacts=common,
          )

          camera_records: list[dict[str, Any]] = []
          for unit in units:
              for camera_id, visual_path, metric_path in unit.visual_inputs:
                  prediction = load_motioncrafter_prediction(visual_path)
                  frames = prediction.frame_indices
                  if frames is None:
                      raise SystemExit(f"missing frame indices: {unit.object_id}/{camera_id}")
                  image_shape = (
                      int(prediction.valid_mask.shape[1]),
                      int(prediction.valid_mask.shape[2]),
                  )
                  metric = _load_metric_prefix(
                      metric_path,
                      raw_prefix_range_half_open=unit.raw_prefix_range_half_open,
                      image_shape=image_shape,
                  )
                  start, stop = unit.raw_prefix_range_half_open
                  stats: dict[int, dict[str, Any]] = {
                      size: {
                          "maximum_pair_count": 0,
                          "maximum_independent_cluster_count": 0,
                          "qualifying_frame_count": 0,
                          "first": None,
                      }
                      for size in SIZES
                  }
                  for prediction_index, raw_value in enumerate(np.asarray(frames).tolist()):
                      raw_frame = int(raw_value)
                      if raw_frame < start or raw_frame >= stop:
                          continue
                      metric_index = raw_frame - start
                      active = np.asarray(
                          prediction.valid_mask[prediction_index], dtype=np.bool_
                      ) & np.asarray(metric.valid_mask[metric_index], dtype=np.bool_)
                      rows, columns = np.nonzero(active)
                      pair_count = int(len(rows))
                      for size in SIZES:
                          entry = stats[size]
                          entry["maximum_pair_count"] = max(
                              int(entry["maximum_pair_count"]), pair_count
                          )
                          if pair_count == 0:
                              cluster_count = 0
                              clusters = np.empty((0, 2), dtype=np.int64)
                          else:
                              clusters = np.column_stack(
                                  (rows // size, columns // size)
                              )
                              cluster_count = int(
                                  len(np.unique(clusters, axis=0))
                              )
                          entry["maximum_independent_cluster_count"] = max(
                              int(entry["maximum_independent_cluster_count"]),
                              cluster_count,
                          )
                          if cluster_count >= REQUIRED:
                              entry["qualifying_frame_count"] = (
                                  int(entry["qualifying_frame_count"]) + 1
                              )
                              if entry["first"] is None:
                                  entry["first"] = (
                                      prediction_index,
                                      metric_index,
                                      raw_frame,
                                      rows.copy(),
                                      columns.copy(),
                                      clusters.copy(),
                                  )

                  scale_records: dict[str, Any] = {}
                  for size in SIZES:
                      entry = stats[size]
                      first = entry.pop("first")
                      fit_record: dict[str, Any] | None = None
                      if first is not None:
                          (
                              prediction_index,
                              metric_index,
                              raw_frame,
                              rows,
                              columns,
                              clusters,
                          ) = first
                          try:
                              trim_fraction = max(0.8, min(1.0, 8.0 / len(rows)))
                              transform = robust_similarity_transform(
                                  np.asarray(
                                      prediction.point_map[
                                          prediction_index, rows, columns
                                      ]
                                  ),
                                  np.asarray(
                                      metric.points_world_m[
                                          metric_index, rows, columns
                                      ]
                                  ),
                                  trim_fraction=trim_fraction,
                                  iterations=5,
                              )
                              inlier = np.asarray(
                                  transform["inlier_mask"], dtype=np.bool_
                              )
                              inlier_clusters = int(
                                  len(np.unique(clusters[inlier], axis=0))
                              )
                              fit_record = {
                                  "error": None,
                                  "raw_frame_index": raw_frame,
                                  "input_pair_count": int(
                                      transform["input_pair_count"]
                                  ),
                                  "inlier_pair_count": int(
                                      transform["inlier_pair_count"]
                                  ),
                                  "independent_cluster_count": int(
                                      len(np.unique(clusters, axis=0))
                                  ),
                                  "inlier_independent_cluster_count": inlier_clusters,
                                  "inlier_rmse_m": float(transform["inlier_rmse_m"]),
                                  "contract_pass": inlier_clusters >= REQUIRED,
                              }
                          except Exception as error:  # diagnostic receipt only
                              fit_record = {
                                  "error": f"{type(error).__name__}: {error}",
                                  "raw_frame_index": raw_frame,
                                  "contract_pass": False,
                              }
                      scale_records[str(size)] = {
                          **entry,
                          "prefit_support": (
                              int(entry["qualifying_frame_count"]) > 0
                          ),
                          "first_frame_robust_fit": fit_record,
                          "contract_pass": bool(
                              fit_record is not None
                              and fit_record.get("contract_pass") is True
                          ),
                      }
                  camera_records.append(
                      {
                          "object_id": unit.object_id,
                          "episode": unit.episode,
                          "stratum": unit.stratum,
                          "camera_id": camera_id,
                          "image_shape": list(image_shape),
                          "raw_prefix_range_half_open": list(
                              unit.raw_prefix_range_half_open
                          ),
                          "visual_sha256": producer._sha256_file(visual_path),
                          "metric_sha256": producer._sha256_file(metric_path),
                          "scales": scale_records,
                      }
                  )
                  print(
                      unit.object_id,
                      camera_id,
                      "default32=",
                      scale_records["32"]["contract_pass"],
                      "max32=",
                      scale_records["32"][
                          "maximum_independent_cluster_count"
                      ],
                      flush=True,
                  )

          unit_ids = sorted(
              {f"{row['object_id']}#ep{int(row['episode']):04d}" for row in camera_records}
          )
          aggregate: dict[str, Any] = {}
          for size in SIZES:
              key = str(size)
              camera_passes = sum(
                  bool(row["scales"][key]["contract_pass"])
                  for row in camera_records
              )
              unit_passes = 0
              for unit_id in unit_ids:
                  rows = [
                      row
                      for row in camera_records
                      if f"{row['object_id']}#ep{int(row['episode']):04d}" == unit_id
                  ]
                  if rows and all(
                      bool(row["scales"][key]["contract_pass"])
                      for row in rows
                  ):
                      unit_passes += 1
              aggregate[key] = {
                  "camera_pass_count": camera_passes,
                  "camera_count": len(camera_records),
                  "unit_full_panel_pass_count": unit_passes,
                  "unit_count": len(unit_ids),
                  "all_cameras_pass": camera_passes == len(camera_records),
                  "all_units_pass": unit_passes == len(unit_ids),
              }
          common_scales = [
              size for size in SIZES if aggregate[str(size)]["all_cameras_pass"]
          ]
          identity: dict[str, Any] = {
              "schema": "bayesian-phystwin.deform360-metric-gauge-support-audit-v1",
              "schema_version": 1,
              "implementation_revision": os.environ["GITHUB_SHA"],
              "request_sha256": producer._sha256_file(
                  Path(os.environ["REQUEST_PATH"])
              ),
              "upstream_source_plan_id": plan["plan_id"],
              "upstream_source_plan_sha256": producer._sha256_file(plan_path),
              "prior_failure": {
                  "run_id": 33012751418,
                  "receipt_id": "e705d19c50273e2b1f09ff1ccd09fd4cf08b250241f2d0f4c4f0a17bcb775df3",
                  "diagnostic": "metric gauge lacks eight independent causal clusters",
                  "target_access": False,
              },
              "audit_contract": {
                  "algorithm": "exact-first-qualifying-causal-frame-per-cluster-scale",
                  "cluster_sizes_pixels": list(SIZES),
                  "minimum_independent_clusters": REQUIRED,
                  "robust_similarity_iterations": 5,
                  "registered_predictor_changed": False,
              },
              "aggregate": aggregate,
              "common_full_panel_passing_scales_pixels": common_scales,
              "camera_records": camera_records,
              "information_boundary": {
                  "source_prefix_arrays_opened": True,
                  "source_suffix_opened": False,
                  "confirmation_root_entered": False,
                  "confirmation_payload_opened": False,
                  "target_outcome_opened": False,
                  "future_object_observations_used": False,
                  "registered_prediction_run": False,
                  "model_or_hyperparameter_selected": False,
              },
              "claim_authorized": False,
          }
          payload = dict(identity)
          payload["audit_id"] = canonical_id(identity)
          output = Path(os.environ["AUDIT_OUTPUT"])
          output.write_text(
              json.dumps(payload, indent=2, sort_keys=True, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "audit_id": payload["audit_id"],
              "camera_count": len(camera_records),
              "unit_count": len(unit_ids),
              "default_32": aggregate["32"],
              "common_full_panel_passing_scales_pixels": common_scales,
          }, indent=2, sort_keys=True))
          PY

      - name: Verify target boundary and upload audit
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.information_boundary.source_suffix_opened' "$AUDIT_OUTPUT")" = false
          test "$(jq -r '.information_boundary.confirmation_payload_opened' "$AUDIT_OUTPUT")" = false
          test "$(jq -r '.information_boundary.target_outcome_opened' "$AUDIT_OUTPUT")" = false
          test "$(jq -r '.claim_authorized' "$AUDIT_OUTPUT")" = false
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Upload bounded source-only gauge audit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: deform360-gauge-support-audit-v1-${{ github.run_id }}
          path: ${{ runner.temp }}/deform360-gauge-audit
          if-no-files-found: error
          retention-days: 90
