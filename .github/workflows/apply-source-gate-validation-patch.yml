name: Apply source-gate validator integration

on:
  push:
    branches:
      - agent/harden-source-gate-validation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Wire independent evidence validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/science/evaluate_deform360_prob4d_source_gate.py")
          text = path.read_text(encoding="utf-8")
          import_block = (
              "from bayesian_phystwin.deform360_prob4d_source_gate_validation import (\n"
              "    validate_source_gate_decision_evidence,\n"
              ")\n"
          )
          import_anchor = (
              "from bayesian_phystwin.deform360_public_contact_prefix import (\n"
          )
          if import_block not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit("source-gate import anchor changed")
              text = text.replace(import_anchor, import_block + import_anchor, 1)

          validation_call = "    validate_source_gate_decision_evidence(result, lock)\n"
          validation_anchor = '''    _require(
              lock["artifact_id"] == result["gate_lock_id"]
              and _sha256_file(lock_path) == result["gate_lock_file_sha256"],
              "copied source gate lock changed",
          )
          '''
          if validation_call not in text:
              if text.count(validation_anchor) != 1:
                  raise SystemExit("source-gate validation anchor changed")
              text = text.replace(
                  validation_anchor,
                  validation_anchor + validation_call,
                  1,
              )
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet -- scripts/science/evaluate_deform360_prob4d_source_gate.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/science/evaluate_deform360_prob4d_source_gate.py
          git commit -m "Wire hardened source gate validation"
          git push
