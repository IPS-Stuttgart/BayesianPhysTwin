name: Temporary format covariance-only branch

on:
  push:
    branches:
      - agent/full22-covariance-only-hybrid-v1
    paths:
      - ".github/workflows/temporary-format-covariance-only.yml"
      - "scripts/science/run_full22_covariance_only_hybrid_v1.py"
      - "src/bayesian_phystwin/covariance_only_hybrid.py"
      - "src/bayesian_phystwin/covariance_only_hybrid_analysis.py"
      - "tests/test_covariance_only_hybrid.py"

permissions:
  contents: write

concurrency:
  group: temporary-format-covariance-only
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/full22-covariance-only-hybrid-v1
          fetch-depth: 1
          persist-credentials: true
          clean: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Apply the repository formatter exactly
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "ruff==0.16.2"
          python -m ruff format \
            scripts/science/run_full22_covariance_only_hybrid_v1.py \
            src/bayesian_phystwin/covariance_only_hybrid.py \
            src/bayesian_phystwin/covariance_only_hybrid_analysis.py \
            tests/test_covariance_only_hybrid.py
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/science/run_full22_covariance_only_hybrid_v1.py \
            src/bayesian_phystwin/covariance_only_hybrid.py \
            src/bayesian_phystwin/covariance_only_hybrid_analysis.py \
            tests/test_covariance_only_hybrid.py
          git commit -m "Format covariance-only experiment"
          git push origin HEAD:agent/full22-covariance-only-hybrid-v1
