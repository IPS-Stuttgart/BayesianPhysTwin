# workflow-lifecycle: temporary
# workflow-owner: IPS-Stuttgart maintainers
name: Format Deform360 query readiness

on:
  push:
    branches:
      - science/deform360-query-validation-readiness-v1
    paths:
      - .github/workflows/format-deform360-query-readiness.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: science/deform360-query-validation-readiness-v1
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Format and commit only the readiness implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pytest==9.1.1 ruff==0.16.5
          python -m ruff format \
            scripts/science/audit_deform360_query_validation_readiness.py \
            tests/test_deform360_query_validation_readiness.py
          python -m ruff check \
            scripts/science/audit_deform360_query_validation_readiness.py \
            tests/test_deform360_query_validation_readiness.py
          python -m pytest -q \
            tests/test_deform360_query_validation_readiness.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/science/audit_deform360_query_validation_readiness.py \
            tests/test_deform360_query_validation_readiness.py
          git diff --cached --quiet && exit 0
          git commit -m "Format Deform360 query-readiness contracts"
          git push origin HEAD:science/deform360-query-validation-readiness-v1
