name: Revalidate frozen Deform360 Prob4D visible-source v2 terminal

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/revalidate-deform360-prob4d-visible-source-v2.yml"
      - "src/bayesian_phystwin/deform360_prob4d_visible_source_audit.py"
      - "scripts/science/audit_deform360_prob4d_visible_source_v2.py"
      - "tests/test_deform360_prob4d_visible_source_audit.py"
      - "tests/test_deform360_prob4d_visible_source_audit_workflow.py"
      - "results/sota/deform360_prob4d_visible_source_v2/source-artifact/**"
      - "docs/deform360_prob4d_visible_source_v2_result.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/revalidate-deform360-prob4d-visible-source-v2.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: revalidate-deform360-prob4d-visible-source-v2
  cancel-in-progress: false

env:
  SOURCE_RUN_ID: "31301431579"
  SOURCE_RUN_ATTEMPT: "1"
  SOURCE_RUN_CONCLUSION: failure
  SOURCE_HEAD_SHA: 136f72b996e9c76b0bab3ab5db5d0fe7172e0307
  SOURCE_WORKFLOW_NAME: Launch reviewed Deform360 Prob4D target-free-visible source gate v2 once
  SOURCE_WORKFLOW_PATH: .github/workflows/launch-deform360-prob4d-visible-source-gate-v2-once.yml
  SOURCE_ARTIFACT_ID: "9034737368"
  SOURCE_ARTIFACT_NAME: deform360-prob4d-source-gate-31301431579-1
  SOURCE_ARTIFACT_DIGEST: sha256:caa8d5ea887ec5273c306dd8de59d57056181ef139c98ac7acb76185032a3828
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  contracts:
    name: Visible-source v2 independent-audit contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact proposed validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install contract dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1"
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Validate compact-audit contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check \
            src/bayesian_phystwin/deform360_prob4d_visible_source_audit.py \
            scripts/science/audit_deform360_prob4d_visible_source_v2.py \
            tests/test_deform360_prob4d_visible_source_audit.py \
            tests/test_deform360_prob4d_visible_source_audit_workflow.py
          python -m ruff format --check \
            src/bayesian_phystwin/deform360_prob4d_visible_source_audit.py \
            scripts/science/audit_deform360_prob4d_visible_source_v2.py \
            tests/test_deform360_prob4d_visible_source_audit.py \
            tests/test_deform360_prob4d_visible_source_audit_workflow.py
          python -m mypy \
            src/bayesian_phystwin/deform360_prob4d_visible_source_audit.py \
            scripts/science/audit_deform360_prob4d_visible_source_v2.py \
            tests/test_deform360_prob4d_visible_source_audit.py \
            tests/test_deform360_prob4d_visible_source_audit_workflow.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_deform360_prob4d_visible_source_audit.py \
            tests/test_deform360_prob4d_visible_source_audit_workflow.py
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"

  audit:
    name: Independently audit the frozen v2 technical terminal
    needs: contracts
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact merged validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact validator source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1"
          python -m pip install -e .
          python -m pip check
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1)"

      - name: Verify exact source run and compact artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          test "$(jq -r '.name' <<<"${run}")" = "${SOURCE_WORKFLOW_NAME}"
          test "$(jq -r '.path' <<<"${run}")" = "${SOURCE_WORKFLOW_PATH}"
          test "$(jq -r '.event' <<<"${run}")" = "push"
          test "$(jq -r '.head_branch' <<<"${run}")" = "main"
          test "$(jq -r '.head_sha' <<<"${run}")" = "${SOURCE_HEAD_SHA}"
          test "$(jq -r '.status' <<<"${run}")" = "completed"
          test "$(jq -r '.conclusion' <<<"${run}")" = \
            "${SOURCE_RUN_CONCLUSION}"
          test "$(jq -r '.run_attempt' <<<"${run}")" = \
            "${SOURCE_RUN_ATTEMPT}"
          test "$(jq -r '.repository.full_name' <<<"${run}")" = \
            "${GITHUB_REPOSITORY}"

          artifacts="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100")"
          test "$(jq --arg name "${SOURCE_ARTIFACT_NAME}" \
            '[.artifacts[] | select(.name == $name)] | length' \
            <<<"${artifacts}")" = "1"
          artifact="$(jq --arg name "${SOURCE_ARTIFACT_NAME}" \
            '.artifacts[] | select(.name == $name)' <<<"${artifacts}")"
          test "$(jq -r '.id' <<<"${artifact}")" = "${SOURCE_ARTIFACT_ID}"
          test "$(jq -r '.digest' <<<"${artifact}")" = \
            "${SOURCE_ARTIFACT_DIGEST}"
          test "$(jq -r '.expired' <<<"${artifact}")" = "false"
          test "$(jq -r '.workflow_run.id' <<<"${artifact}")" = \
            "${SOURCE_RUN_ID}"
          test "$(jq -r '.workflow_run.head_sha' <<<"${artifact}")" = \
            "${SOURCE_HEAD_SHA}"

      - name: Download only the exact compact source artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.SOURCE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/deform360-visible-source-v2-source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Validate and freeze the compact technical terminal
        env:
          SOURCE_ROOT: ${{ runner.temp }}/deform360-visible-source-v2-source
          AUDIT_ROOT: ${{ runner.temp }}/deform360-visible-source-v2-audit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/science/audit_deform360_prob4d_visible_source_v2.py \
            --source-root "${SOURCE_ROOT}" \
            --output-dir "${AUDIT_ROOT}" \
            --validator-revision "$(git rev-parse HEAD)" \
            --source-run-id "${SOURCE_RUN_ID}" \
            --source-run-attempt "${SOURCE_RUN_ATTEMPT}" \
            --source-artifact-id "${SOURCE_ARTIFACT_ID}" \
            --source-artifact-name "${SOURCE_ARTIFACT_NAME}" \
            --source-artifact-digest "${SOURCE_ARTIFACT_DIGEST}"

      - name: Upload independent compact audit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: deform360-prob4d-visible-source-v2-independent-audit-${{ env.SOURCE_RUN_ID }}
          path: ${{ runner.temp }}/deform360-visible-source-v2-audit
          if-no-files-found: error
          retention-days: 180

      - name: Enforce the closed technical terminal
        env:
          AUDIT_ROOT: ${{ runner.temp }}/deform360-visible-source-v2-audit
        shell: bash
        run: |
          set -euo pipefail
          receipt="${AUDIT_ROOT}/independent-audit-receipt.json"
          test "$(jq -r '.audit_status' "${receipt}")" = \
            "validated-source-sample-materialization-failure"
          test "$(jq -r '.result_kind' "${receipt}")" = \
            "source-pipeline-technical-terminal"
          test "$(jq -r '.support_gate_passed' "${receipt}")" = "true"
          test "$(jq -r '.source_gate_evaluated' "${receipt}")" = "false"
          test "$(jq -r '.source_gate_passed' "${receipt}")" = "null"
          test "$(jq -r '.confirmation_access_authorized' "${receipt}")" = \
            "false"
          test "$(jq -r '.information_boundary.human_approval_required' \
            "${receipt}")" = "false"
          test "$(jq -r '.information_boundary.confirmation_payloads_opened' \
            "${receipt}")" = "false"
          test "$(jq -r '.information_boundary.target_outcomes_used' \
            "${receipt}")" = "false"
          (
            cd "${AUDIT_ROOT}"
            sha256sum --check SHA256SUMS >/dev/null
          )
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1)"
