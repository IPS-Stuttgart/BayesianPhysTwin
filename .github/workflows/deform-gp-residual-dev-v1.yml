# workflow-lifecycle: experimental
# workflow-owner: IPS-Stuttgart maintainers
name: DEFORM GP residual development v1
on:
  pull_request:
    paths:
      - '.github/workflows/deform-gp-residual-dev-v1.yml'
      - 'experiments/deform_gp_residual_dev_v1/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deform-gp-residual-dev-v1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-preflight:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 5
    steps:
      - name: Read retained development metadata only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          root = Path('/home/florianpfaff/source-only/deform-dlo2-local-residual-v5')
          train = root / 'train-8cc85de7/training_run'
          print('RUNNER', os.environ.get('RUNNER_NAME'))
          for name in ['training_validation_result.json', 'source_manifest.json', 'preflight.json']:
              p = train / name
              data = p.read_bytes()
              print('METADATA', name, hashlib.sha256(data).hexdigest(), data.decode())
          source = root / 'source-8cc85de7'
          print('SOURCE_TOP_LEVEL', sorted(p.name for p in source.iterdir()))
          for parent in ['/home/florianpfaff/source-only', '/home/github/actions-runner', '/home/github', '/opt']:
              p = Path(parent)
              if p.is_dir():
                  print('RUNTIME_DIRECTORY_NAMES', str(p), sorted(c.name for c in p.iterdir() if c.is_dir()))
          PY
