name: Format provider-owned information caps

on:
  push:
    branches:
      - agent/provider-owned-information-caps
    paths:
      - ".github/workflows/agent-format-provider-caps.yml"

permissions:
  contents: write

concurrency:
  group: agent-format-provider-caps
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/provider-owned-information-caps
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install "ruff>=0.6"
      - name: Format changed Python surface
        run: |
          python -m ruff format \
            src/bayesian_phystwin/_gauge_aware_contracts.py \
            src/bayesian_phystwin/_gauge_aware_solver.py \
            src/bayesian_phystwin/_prior_aware_gauge_math.py \
            src/bayesian_phystwin/gauge_aware_belief.py \
            src/bayesian_phystwin/observation_belief_gauge_adapter.py \
            src/bayesian_phystwin/prior_aware_gauge_belief.py \
            tests/test_information_mass_invariants.py \
            tests/test_observation_belief_gauge_adapter.py \
            tests/test_provider_composite_weight_semantics.py
          python -m ruff check \
            src/bayesian_phystwin/_gauge_aware_contracts.py \
            src/bayesian_phystwin/_gauge_aware_solver.py \
            src/bayesian_phystwin/_prior_aware_gauge_math.py \
            src/bayesian_phystwin/gauge_aware_belief.py \
            src/bayesian_phystwin/observation_belief_gauge_adapter.py \
            src/bayesian_phystwin/prior_aware_gauge_belief.py \
            tests/test_information_mass_invariants.py \
            tests/test_observation_belief_gauge_adapter.py \
            tests/test_provider_composite_weight_semantics.py
      - name: Remove one-shot workflow
        run: rm .github/workflows/agent-format-provider-caps.yml
      - name: Commit formatter output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Format provider-owned information-cap changes"
          git push origin HEAD:agent/provider-owned-information-caps
