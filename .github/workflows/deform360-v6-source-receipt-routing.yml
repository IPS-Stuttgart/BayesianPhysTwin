name: Route Deform360 v6 source receipt to current gate

on:
  workflow_run:
    workflows:
      - Deform360 v6 source prediction evidence — dual CUDA runtimes
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: deform360-v6-source-receipt-routing-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

env:
  ISSUE_NUMBER: "461"

jobs:
  route:
    name: Verify and route compact source receipt
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion != 'cancelled' &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download exact compact source artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: deform360-v6-source-prediction-dual-runtime-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/deform360-v6-source-prediction-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify and route bounded receipt to issue 461
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RECEIPT_ROOT: ${{ runner.temp }}/deform360-v6-source-prediction-evidence
        run: |
          set -euo pipefail
          test -d "${RECEIPT_ROOT}"
          test ! -L "${RECEIPT_ROOT}"
          test -f "${RECEIPT_ROOT}/SHA256SUMS"
          test ! -L "${RECEIPT_ROOT}/SHA256SUMS"
          (
            cd "${RECEIPT_ROOT}"
            sha256sum --check SHA256SUMS
          )
          test -f "${RECEIPT_ROOT}/execution-receipt.json"
          test ! -L "${RECEIPT_ROOT}/execution-receipt.json"
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path
          from typing import Never

          repository = os.environ["GITHUB_REPOSITORY"]
          issue_number = os.environ["ISSUE_NUMBER"]
          source_run_id = os.environ["SOURCE_RUN_ID"]
          source_run_attempt = os.environ["SOURCE_RUN_ATTEMPT"]
          source_head_sha = os.environ["SOURCE_HEAD_SHA"]
          source_workflow_conclusion = os.environ["SOURCE_WORKFLOW_CONCLUSION"]
          token = os.environ["GITHUB_TOKEN"]
          receipt_path = Path(os.environ["RECEIPT_ROOT"]) / "execution-receipt.json"
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))

          def reject(message: str) -> Never:
              raise SystemExit(message)

          if receipt.get("schema") != (
              "bayesian-phystwin.deform360-v6-source-prediction-"
              "execution-receipt"
          ):
              reject("unexpected source receipt schema")
          if receipt.get("schema_version") != 1:
              reject("unexpected source receipt schema version")
          if receipt.get("source_revision") != source_head_sha:
              reject("source receipt revision does not match triggering run")
          if str(receipt.get("workflow_run_id")) != source_run_id:
              reject("source receipt run ID does not match triggering run")
          if str(receipt.get("workflow_run_attempt")) != source_run_attempt:
              reject("source receipt attempt does not match triggering run")

          allowed_statuses = {
              "source-prediction-evidence-sealed",
              "source-inputs-incomplete",
              "source-technical-failure-retained",
              "invalid",
          }
          status = receipt.get("status")
          if status not in allowed_statuses:
              reject("unexpected source receipt terminal status")

          for name, maximum in (
              ("physical_manifest_count", 10),
              ("source_prediction_seal_count", 100),
          ):
              value = receipt.get(name)
              if isinstance(value, bool) or not isinstance(value, int):
                  reject(f"{name} is not a genuine integer")
              if not 0 <= value <= maximum:
                  reject(f"{name} is outside the registered bound")

          boundary = receipt.get("information_boundary")
          if not isinstance(boundary, dict):
              reject("source receipt has no information boundary")
          for name in (
              "development_suffix_opened",
              "future_object_observations_used_for_prediction",
              "v5_confirmation_payloads_opened",
              "v5_confirmation_outcomes_used",
              "v6_fresh_target_selected",
              "v6_target_payloads_opened",
              "v6_target_outcomes_used",
              "replacement_allowed",
          ):
              if boundary.get(name) is not False:
                  reject(f"source receipt violates closed boundary: {name}")
          for name in (
              "claim_authorized",
              "fresh_target_selection_authorized",
              "fresh_target_payload_access_authorized",
          ):
              if receipt.get(name) is not False:
                  reject(f"source receipt violates authorization boundary: {name}")

          declared_receipt_id = receipt.get("receipt_id")
          if not isinstance(declared_receipt_id, str):
              reject("source receipt has no content identity")
          canonical_receipt = dict(receipt)
          canonical_receipt.pop("receipt_id")
          canonical = json.dumps(
              canonical_receipt,
              sort_keys=True,
              separators=(",", ":"),
              allow_nan=False,
          ).encode("utf-8")
          observed_receipt_id = hashlib.sha256(canonical).hexdigest()
          if observed_receipt_id != declared_receipt_id:
              reject("source receipt content identity does not verify")

          marker = (
              "<!-- deform360-v6-source-receipt:"
              f"{declared_receipt_id}:issue-{issue_number} -->"
          )
          issue_comments_url = (
              f"https://api.github.com/repos/{repository}/issues/"
              f"{issue_number}/comments"
          )
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          page = 1
          while True:
              query = urllib.parse.urlencode({"per_page": 100, "page": page})
              request = urllib.request.Request(
                  f"{issue_comments_url}?{query}",
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  comments = json.load(response)
              if any(marker in comment.get("body", "") for comment in comments):
                  print("bounded source receipt already routed")
                  raise SystemExit(0)
              if len(comments) < 100:
                  break
              page += 1

          run_url = f"https://github.com/{repository}/actions/runs/{source_run_id}"
          body = f"""{marker}
          ## Deform360 v6 source receipt routed to the current gate: `{status}`

          - source workflow run: [`{source_run_id}`]({run_url}), attempt `{source_run_attempt}`
          - source workflow conclusion: `{source_workflow_conclusion}`
          - exact protected-main revision: `{source_head_sha}`
          - receipt ID: `{declared_receipt_id}`
          - terminal stage: `{receipt.get('terminal_stage')}`
          - exit code: `{receipt.get('exit_code')}`
          - physical manifests: `{receipt['physical_manifest_count']}/10`
          - sealed source predictions: `{receipt['source_prediction_seal_count']}/100`
          - development suffix opened: `false`
          - v5 confirmation payloads opened: `false`
          - v6 fresh target selected: `false`
          - v6 target payloads opened: `false`
          - v6 target outcomes used: `false`
          - replacement allowed: `false`

          This is an independently verified mirror of the compact source receipt produced by the frozen dual-runtime workflow. The artifact manifest, receipt content identity, triggering revision, run identity, and closed information/authorization boundary all verified before routing. It does not score the development suffix, authorize confirmation or target access, alter the frozen candidate, or establish a scientific claim.
          """
          request = urllib.request.Request(
              issue_comments_url,
              data=json.dumps({"body": body}).encode("utf-8"),
              headers=headers,
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 201:
                  reject(f"unexpected issue API status: {response.status}")
          PY
