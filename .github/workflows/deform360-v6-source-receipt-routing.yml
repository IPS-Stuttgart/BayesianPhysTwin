# workflow-lifecycle: permanent
# workflow-owner: IPS-Stuttgart maintainers
name: Route Deform360 v6 source receipt to current gate

on:
  workflow_run:
    workflows:
      - Deform360 v6 source prediction evidence — dual CUDA runtimes
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: deform360-v6-source-receipt-routing-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

env:
  ISSUE_NUMBER: "461"

jobs:
  route:
    name: Verify and route compact source receipt
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion != 'cancelled' &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted router revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Download exact compact source artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: deform360-v6-source-prediction-dual-runtime-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/deform360-v6-source-prediction-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify and route bounded receipt to issue 461
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RECEIPT_ROOT: ${{ runner.temp }}/deform360-v6-source-prediction-evidence
        run: |
          set -euo pipefail
          python tools/quality/route_deform360_v6_source_receipt.py
