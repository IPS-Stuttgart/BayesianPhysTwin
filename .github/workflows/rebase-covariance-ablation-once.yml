name: Rebase covariance ablation once

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rebase-covariance-ablation-once.yml"

permissions:
  contents: write

concurrency:
  group: rebase-covariance-ablation-once
  cancel-in-progress: false

jobs:
  rebase:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref ==
      'agent/add-prob4d-covariance-ablation-rebased'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the rebased branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
          clean: true
      - name: Apply the exact PR 371 patch onto current main
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = \
            "$(git rev-parse origin/main)" || true
          curl --fail --location --retry 5 \
            --output "${RUNNER_TEMP}/pr371.patch" \
            "https://github.com/IPS-Stuttgart/BayesianPhysTwin/pull/371.patch"
          if ! git apply --3way --index "${RUNNER_TEMP}/pr371.patch"; then
            mapfile -t unresolved < <(git diff --name-only --diff-filter=U)
            printf 'unresolved=%s\n' "${unresolved[*]}"
            test "${#unresolved[@]}" -eq 1
            test "${unresolved[0]}" = ".github/quality/test-suites.json"
            git checkout --ours -- .github/quality/test-suites.json
            python - <<'PY'
          import json
          from pathlib import Path

          path = Path('.github/quality/test-suites.json')
          value = json.loads(path.read_text(encoding='utf-8'))
          test_path = 'tests/test_prob4d_covariance_ablation.py'
          for name in ('stable-core-coverage', 'core-contracts'):
              suite = value['suites'][name]
              if test_path not in suite:
                  anchor = suite.index('tests/test_provider_failure_decomposition.py')
                  suite.insert(anchor + 1, test_path)
          path.write_text(
              json.dumps(value, indent=2, sort_keys=False) + '\n',
              encoding='utf-8',
          )
          PY
            git add .github/quality/test-suites.json
          fi
          rm .github/workflows/rebase-covariance-ablation-once.yml
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebase controlled Prob4D covariance ablation"
          git push origin "HEAD:${HEAD_BRANCH}"
