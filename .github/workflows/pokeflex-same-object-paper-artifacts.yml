name: PokeFlex same-object paper artifacts

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/pokeflex-same-object-paper-artifacts.yml"
      - "src/bayesian_phystwin/pokeflex_same_object_reporting.py"
      - "scripts/paper/ensure_pokeflex_same_object_candidates.py"
      - "scripts/paper/make_pokeflex_same_object_figure.py"
      - "scripts/paper/prepare_pokeflex_same_object_assets.py"
      - "scripts/paper/render_pokeflex_same_object_video.py"
      - "scripts/paper/pokeflex_same_object_video_*.py"
      - "tests/test_pokeflex_same_object_reporting.py"
      - "tests/test_pokeflex_same_object_workflow.py"
      - "docs/pokeflex_same_object_paper_artifacts.md"
      - "configs/sota/pokeflex_independent_depth_*.json"
      - "results/sota/pokeflex_independent_depth_regret_guard_prospective_v1/**"
  workflow_dispatch:
    inputs:
      candidate_root:
        description: Existing frozen candidate-artifact root; optional
        required: false
        type: string
      take_id:
        description: Visual exemplar; blank selects the strongest prospective take
        required: false
        type: string
      fps:
        description: Encoded video frame rate
        required: true
        default: "30"
        type: string

permissions:
  contents: read

concurrency:
  group: pokeflex-same-object-paper-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  MPLBACKEND: Agg
  PYVISTA_OFF_SCREEN: "true"

jobs:
  source-preflight:
    name: Hosted source and result contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install lightweight source-check environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Validate focused source and result contracts
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/bayesian_phystwin/pokeflex_same_object_reporting.py
            scripts/paper/ensure_pokeflex_same_object_candidates.py
            scripts/paper/make_pokeflex_same_object_figure.py
            scripts/paper/prepare_pokeflex_same_object_assets.py
            scripts/paper/pokeflex_same_object_video_capture.py
            scripts/paper/pokeflex_same_object_video_encode.py
            scripts/paper/pokeflex_same_object_video_plot.py
            scripts/paper/render_pokeflex_same_object_video.py
            tests/test_pokeflex_same_object_reporting.py
            tests/test_pokeflex_same_object_workflow.py
          )
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy \
            --cache-dir "${RUNNER_TEMP}/pokeflex-paper-mypy-cache" \
            src/bayesian_phystwin/pokeflex_same_object_reporting.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_pokeflex_same_object_reporting.py \
            tests/test_pokeflex_same_object_workflow.py
          python -m py_compile "${files[@]}"

  artifacts:
    name: Reproduce figure and render video on workstation2
    needs: source-preflight
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 720
    env:
      INPUT_CANDIDATE_ROOT: ${{ inputs.candidate_root }}
      INPUT_TAKE_ID: ${{ inputs.take_id }}
      INPUT_FPS: ${{ inputs.fps }}
      VAR_DATASET_ROOT: ${{ vars.POKEFLEX_DATA_ROOT }}
      VAR_UPSTREAM_CHECKOUT: ${{ vars.POKEFLEX_UPSTREAM_CHECKOUT }}
      VAR_CHECKPOINT_ROOT: ${{ vars.POKEFLEX_CHECKPOINT_ROOT }}
      VAR_PYTHON: ${{ vars.POKEFLEX_PYTHON }}
      VAR_CANDIDATE_ROOT: ${{ vars.POKEFLEX_PROSPECTIVE_ARTIFACT_ROOT }}
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Initialize isolated artifact paths and Python
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/pokeflex-paper-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "${root}"
          mkdir -p "${root}/evidence" "${root}/output" "${root}/resolved"

          candidate_root="${INPUT_CANDIDATE_ROOT:-${VAR_CANDIDATE_ROOT:-}}"
          if [[ -z "${candidate_root}" ]]; then
            candidate_root="/mnt/corsair/florianpfaff/pokeflex-regret-prospective-v1"
          fi

          python_bin="${VAR_PYTHON:-}"
          if [[ -z "${python_bin}" ]] && command -v python3.11 >/dev/null 2>&1; then
            python_bin="$(command -v python3.11)"
          fi
          if [[ -z "${python_bin}" && -n "${RUNNER_TOOL_CACHE:-}" ]]; then
            shopt -s nullglob
            candidates=("${RUNNER_TOOL_CACHE}"/Python/3.11.*/x64/bin/python)
            shopt -u nullglob
            if (( ${#candidates[@]} )); then
              python_bin="$(printf '%s\n' "${candidates[@]}" | sort -V | tail -n 1)"
            fi
          fi
          if [[ -z "${python_bin}" || ! -x "${python_bin}" ]]; then
            echo "A Python 3.11 interpreter is required for the released checkpoint." >&2
            exit 1
          fi
          "${python_bin}" - <<'PY'
          import sys
          if sys.version_info[:2] != (3, 11):
              raise SystemExit(
                  f"released-checkpoint runtime requires Python 3.11, got {sys.version}"
              )
          PY

          {
            echo "POKEFLEX_RUN_ROOT=${root}"
            echo "POKEFLEX_RESOLVED=${root}/resolved"
            echo "POKEFLEX_CANDIDATES=${root}/resolved/candidates"
            echo "POKEFLEX_EVIDENCE=${root}/evidence"
            echo "POKEFLEX_OUTPUT=${root}/output"
            echo "POKEFLEX_SOURCE_CANDIDATE_ROOT=${candidate_root}"
            echo "POKEFLEX_VERIFIED_CANDIDATE_ROOT=${root}/verified-candidates"
            echo "POKEFLEX_BOOTSTRAP_PYTHON=${python_bin}"
            echo "POKEFLEX_VENV=${root}/venv"
            echo "MPLCONFIGDIR=${root}/matplotlib"
            echo "XDG_CACHE_HOME=${root}/cache"
          } >> "${GITHUB_ENV}"

      - name: Validate frozen input custody before runtime installation
        shell: bash
        run: |
          set -euo pipefail
          "${POKEFLEX_BOOTSTRAP_PYTHON}" - <<'PY' | \
            tee "${POKEFLEX_EVIDENCE}/input-preflight.json"
          import hashlib
          import json
          import os
          from pathlib import Path

          result_path = Path(
              "results/sota/"
              "pokeflex_independent_depth_regret_guard_prospective_v1/"
              "prospective_evaluation.json"
          )
          manifest_path = result_path.with_name("execution_manifest.json")
          result = json.loads(result_path.read_text(encoding="utf-8"))
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          requested = os.environ.get("INPUT_TAKE_ID", "").strip()
          takes = result["takes"]
          take_ids = {str(item["take_id"]) for item in takes}
          if requested:
              if requested not in take_ids:
                  raise SystemExit(f"requested take is outside the frozen panel: {requested}")
              selected = requested
          else:
              selected = str(
                  max(takes, key=lambda item: item["relative_improvement"])["take_id"]
              )

          candidate_root = Path(os.environ["POKEFLEX_SOURCE_CANDIDATE_ROOT"])
          candidates = []
          for record in result["candidate_artifacts"]:
              path = candidate_root / Path(str(record["path"])).name
              status = "missing"
              observed = None
              try:
                  if path.is_file():
                      digest = hashlib.sha256()
                      with path.open("rb") as handle:
                          for block in iter(lambda: handle.read(1024 * 1024), b""):
                              digest.update(block)
                      observed = digest.hexdigest()
                      status = (
                          "verified"
                          if observed == str(record["sha256"])
                          else "digest-mismatch"
                      )
              except OSError:
                  status = "unreadable"
              candidates.append(
                  {
                      "take_id": Path(str(record["path"])).name.removesuffix(
                          "_candidates.json"
                      ),
                      "path": str(path),
                      "status": status,
                      "expected_sha256": str(record["sha256"]),
                      "observed_sha256": observed,
                  }
              )

          archives = {
              str(record["take_id"]): record for record in manifest["archives"]
          }
          archive = archives[selected]
          archive_path = Path(str(archive["path"]))
          try:
              archive_readable = archive_path.is_file()
              archive_size_matches = (
                  archive_readable
                  and archive_path.stat().st_size == int(archive["size_bytes"])
              )
          except OSError:
              archive_readable = False
              archive_size_matches = False

          object_name = selected.split("_T", maxsplit=1)[0]
          dataset_root_text = os.environ.get("VAR_DATASET_ROOT", "").strip()
          possible_roots = []
          if dataset_root_text:
              configured = Path(dataset_root_text)
              possible_roots.extend(
                  [
                      configured / selected,
                      configured / object_name / selected,
                      configured / "poking" / object_name / selected,
                  ]
              )
          possible_roots.extend(
              [
                  Path("/mnt/lexar4tb/pokeflex/poking") / object_name / selected,
                  Path("/mnt/corsair/pokeflex/poking") / object_name / selected,
              ]
          )
          extracted = None
          for candidate in possible_roots:
              try:
                  if (candidate / "robot_data.json").is_file():
                      extracted = candidate.resolve()
                      break
              except OSError:
                  continue

          if not archive_size_matches and extracted is None:
              raise SystemExit(
                  "selected video take has neither a readable size-matched "
                  "frozen archive nor an extracted robot_data.json root"
              )

          print(
              json.dumps(
                  {
                      "schema_version": 1,
                      "selected_take_id": selected,
                      "candidate_artifacts": candidates,
                      "selected_archive": str(archive_path),
                      "selected_archive_readable": archive_readable,
                      "selected_archive_size_matches": archive_size_matches,
                      "selected_extracted_take": (
                          None if extracted is None else str(extracted)
                      ),
                  },
                  indent=2,
                  sort_keys=True,
              )
          )
          PY

      - name: Create isolated released-checkpoint runtime
        shell: bash
        run: |
          set -euo pipefail
          "${POKEFLEX_BOOTSTRAP_PYTHON}" -m venv --clear "${POKEFLEX_VENV}"
          "${POKEFLEX_VENV}/bin/python" -m ensurepip --upgrade
          "${POKEFLEX_VENV}/bin/python" -m pip install \
            --no-cache-dir --upgrade pip setuptools wheel
          "${POKEFLEX_VENV}/bin/python" -m pip install \
            --no-cache-dir \
            "torch==2.1.0" \
            --index-url https://download.pytorch.org/whl/cu121
          "${POKEFLEX_VENV}/bin/python" -m pip install \
            --no-cache-dir \
            -e ".[graph,vision]" \
            "numpy==1.26.4" \
            gdown \
            imageio-ffmpeg \
            matplotlib \
            pillow \
            pyvista \
            siren-pytorch \
            transformers==4.46.3 \
            trimesh
          "${POKEFLEX_VENV}/bin/python" -m pip check
          echo "BPT_PYTHON=${POKEFLEX_VENV}/bin/python" >> "${GITHUB_ENV}"
          "${POKEFLEX_VENV}/bin/python" - <<'PY'
          import cv2
          import imageio_ffmpeg
          import matplotlib
          import numpy
          import pyvista
          import scipy
          import torch
          import transformers
          import trimesh

          if not torch.cuda.is_available():
              raise SystemExit("PokeFlex runtime cannot see CUDA")
          print(f"torch={torch.__version__}")
          print(f"torch_cuda={torch.version.cuda}")
          print(f"gpu={torch.cuda.get_device_name(0)}")
          for module in (
              cv2,
              imageio_ffmpeg,
              matplotlib,
              numpy,
              pyvista,
              scipy,
              transformers,
              trimesh,
          ):
              print(f"{module.__name__}={module.__version__}")
          PY

      - name: Validate installed runtime entrypoints
        shell: bash
        run: |
          set -euo pipefail
          "${BPT_PYTHON}" \
            scripts/paper/ensure_pokeflex_same_object_candidates.py --help
          "${BPT_PYTHON}" scripts/paper/prepare_pokeflex_same_object_assets.py --help
          "${BPT_PYTHON}" scripts/paper/make_pokeflex_same_object_figure.py --help
          "${BPT_PYTHON}" scripts/paper/render_pokeflex_same_object_video.py --help

      - name: Stage or reproduce exact candidate artifacts
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --output-root "${POKEFLEX_VERIFIED_CANDIDATE_ROOT}"
            --workspace-root "${POKEFLEX_RUN_ROOT}/candidate-preparation"
            --evidence-output "${POKEFLEX_EVIDENCE}/candidate-preparation.json"
            --github-env "${GITHUB_ENV}"
          )
          if [[ -n "${POKEFLEX_SOURCE_CANDIDATE_ROOT:-}" ]]; then
            args+=(--candidate-root "${POKEFLEX_SOURCE_CANDIDATE_ROOT}")
          fi
          if [[ -n "${VAR_DATASET_ROOT:-}" ]]; then
            args+=(--dataset-root "${VAR_DATASET_ROOT}")
          fi
          if [[ -n "${VAR_UPSTREAM_CHECKOUT:-}" ]]; then
            args+=(--upstream-checkout "${VAR_UPSTREAM_CHECKOUT}")
          fi
          if [[ -n "${VAR_CHECKPOINT_ROOT:-}" ]]; then
            args+=(--checkpoint-root "${VAR_CHECKPOINT_ROOT}")
          fi
          "${BPT_PYTHON}" \
            scripts/paper/ensure_pokeflex_same_object_candidates.py "${args[@]}" \
            | tee "${POKEFLEX_EVIDENCE}/candidate-preparation.log"

      - name: Resolve and verify immutable PokeFlex assets
        shell: bash
        run: |
          set -euo pipefail
          dataset_root="${POKEFLEX_REGENERATED_DATA_ROOT:-${VAR_DATASET_ROOT:-}}"
          upstream_checkout="${POKEFLEX_REGENERATED_UPSTREAM_CHECKOUT:-${VAR_UPSTREAM_CHECKOUT:-}}"
          checkpoint_root="${POKEFLEX_REGENERATED_CHECKPOINT_ROOT:-${VAR_CHECKPOINT_ROOT:-}}"
          args=(
            --output-root "${POKEFLEX_RESOLVED}"
            --candidate-root "${POKEFLEX_VERIFIED_CANDIDATE_ROOT}"
            --candidate-preparation-evidence "${POKEFLEX_EVIDENCE}/candidate-preparation.json"
            --take-id "${INPUT_TAKE_ID:-}"
            --github-env "${GITHUB_ENV}"
          )
          if [[ -n "${dataset_root}" ]]; then
            args+=(--dataset-root "${dataset_root}")
          fi
          if [[ -n "${upstream_checkout}" ]]; then
            args+=(--upstream-checkout "${upstream_checkout}")
          fi
          if [[ -n "${checkpoint_root}" ]]; then
            args+=(--checkpoint-root "${checkpoint_root}")
          fi
          "${BPT_PYTHON}" \
            scripts/paper/prepare_pokeflex_same_object_assets.py "${args[@]}" \
            | tee "${POKEFLEX_EVIDENCE}/asset-resolution.log"
          cp "${POKEFLEX_RESOLVED}/workflow_assets.json" \
            "${POKEFLEX_EVIDENCE}/workflow_assets.json"

      - name: Build frozen calibration figure
        shell: bash
        run: |
          set -euo pipefail
          "${BPT_PYTHON}" scripts/paper/make_pokeflex_same_object_figure.py \
            --prospective-result \
              results/sota/pokeflex_independent_depth_regret_guard_prospective_v1/prospective_evaluation.json \
            --candidate-artifact "${POKEFLEX_CANDIDATES}/FoamDice_T7_candidates.json" \
            --candidate-artifact "${POKEFLEX_CANDIDATES}/FoamDice_T8_candidates.json" \
            --candidate-artifact "${POKEFLEX_CANDIDATES}/PlushOctopus_T7_candidates.json" \
            --output-root "${POKEFLEX_OUTPUT}" \
            | tee "${POKEFLEX_EVIDENCE}/figure-console.log"

      - name: Render strongest prospective take
        shell: bash
        run: |
          set -euo pipefail
          "${BPT_PYTHON}" scripts/paper/render_pokeflex_same_object_video.py \
            --prospective-result \
              results/sota/pokeflex_independent_depth_regret_guard_prospective_v1/prospective_evaluation.json \
            --dataset-root "${POKEFLEX_DATA_ROOT}" \
            --upstream-checkout "${POKEFLEX_UPSTREAM_CHECKOUT}" \
            --checkpoint-root "${POKEFLEX_CHECKPOINT_ROOT}" \
            --take-id "${POKEFLEX_SELECTED_TAKE}" \
            --fps "${INPUT_FPS:-30}" \
            --repeats-per-state 2 \
            --output-root "${POKEFLEX_OUTPUT}" \
            | tee "${POKEFLEX_EVIDENCE}/video-console.log"

      - name: Record environment and verify paper artifacts
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "revision=${GITHUB_SHA}"
            echo "runner_name=${RUNNER_NAME}"
            echo "bootstrap_python=${POKEFLEX_BOOTSTRAP_PYTHON}"
            echo "python=${BPT_PYTHON}"
            echo "take=${POKEFLEX_SELECTED_TAKE}"
            echo "archive=${POKEFLEX_SELECTED_ARCHIVE}"
            echo "upstream_checkout=${POKEFLEX_UPSTREAM_CHECKOUT}"
            echo "checkpoint_root=${POKEFLEX_CHECKPOINT_ROOT}"
            "${BPT_PYTHON}" --version
            uname -a
            nvidia-smi --query-gpu=index,name,uuid,driver_version,memory.total \
              --format=csv,noheader
          } | tee "${POKEFLEX_EVIDENCE}/environment.txt"
          "${BPT_PYTHON}" - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ["POKEFLEX_OUTPUT"])
          diagnostic = json.loads(
              (output / "pokeflex_same_object_diagnostic.json").read_text()
          )
          bounded = diagnostic["bounded_result"]
          if bounded["take_count"] != 3 or bounded["object_count"] != 2:
              raise SystemExit("same-object panel changed")
          if bounded["accepted_frame_count"] != 87:
              raise SystemExit("accepted-frame result changed")
          if bounded["exact_fallback_frame_count"] != 154:
              raise SystemExit("fallback result changed")
          videos = list(output.glob("*.mp4"))
          if len(videos) != 1 or videos[0].stat().st_size <= 100_000:
              raise SystemExit("exactly one nonempty MP4 is required")
          for name in (
              "pokeflex_same_object_calibration.png",
              "pokeflex_same_object_calibration.pdf",
              "pokeflex_same_object_video_poster.png",
          ):
              if (output / name).stat().st_size <= 10_000:
                  raise SystemExit(f"paper artifact is unexpectedly small: {name}")
          print(json.dumps(bounded, indent=2, sort_keys=True))
          PY
          find "${POKEFLEX_OUTPUT}" "${POKEFLEX_EVIDENCE}" -type f \
            -print0 | sort -z | xargs -0 sha256sum \
            > "${POKEFLEX_EVIDENCE}/SHA256SUMS"
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"

      - name: Publish bounded result summary
        if: always()
        shell: bash
        run: |
          {
            echo "### PokeFlex same-object temporal-transfer artifacts"
            echo
            echo "The claim is limited to new takes of previously seen objects."
            echo "Independent-object calibration failed and is not rescued by this run."
          } >> "${GITHUB_STEP_SUMMARY}"
          if [[ -n "${POKEFLEX_OUTPUT:-}" && \
                -f "${POKEFLEX_OUTPUT}/pokeflex_same_object_diagnostic.json" ]]; then
            echo '```json' >> "${GITHUB_STEP_SUMMARY}"
            if [[ -n "${BPT_PYTHON:-}" && -x "${BPT_PYTHON}" ]]; then
              "${BPT_PYTHON}" -c \
                'import json, os; from pathlib import Path; p=Path(os.environ["POKEFLEX_OUTPUT"])/"pokeflex_same_object_diagnostic.json"; print(json.dumps(json.loads(p.read_text())["bounded_result"], indent=2, sort_keys=True))' \
                >> "${GITHUB_STEP_SUMMARY}"
            else
              cat "${POKEFLEX_OUTPUT}/pokeflex_same_object_diagnostic.json" \
                >> "${GITHUB_STEP_SUMMARY}"
            fi
            echo '```' >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload figure, video, and compact evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pokeflex-same-object-paper-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.POKEFLEX_OUTPUT }}
            ${{ env.POKEFLEX_EVIDENCE }}/input-preflight.json
            ${{ env.POKEFLEX_EVIDENCE }}/candidate-preparation.log
            ${{ env.POKEFLEX_EVIDENCE }}/candidate-preparation.json
            ${{ env.POKEFLEX_EVIDENCE }}/asset-resolution.log
            ${{ env.POKEFLEX_EVIDENCE }}/workflow_assets.json
            ${{ env.POKEFLEX_EVIDENCE }}/environment.txt
            ${{ env.POKEFLEX_EVIDENCE }}/figure-console.log
            ${{ env.POKEFLEX_EVIDENCE }}/video-console.log
            ${{ env.POKEFLEX_EVIDENCE }}/SHA256SUMS
          if-no-files-found: warn
          retention-days: 90
