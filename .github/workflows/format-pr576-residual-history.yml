name: Format PR 576 residual history path

on:
  push:
    branches:
      - agent/registered-residual-history-single-path-v1

permissions:
  contents: write

concurrency:
  group: format-pr576-residual-history
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/registered-residual-history-single-path-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Apply and verify repository formatting
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'ruff==0.16.2'
          python -m ruff format \
            src/bayesian_phystwin/deform360_registered_residual_history_v1.py \
            tests/test_portable_contracts_deform360_registered_residual_history_v1.py
          python -m ruff check \
            src/bayesian_phystwin/deform360_registered_residual_history_v1.py \
            tests/test_portable_contracts_deform360_registered_residual_history_v1.py
          python -m ruff format --check \
            src/bayesian_phystwin/deform360_registered_residual_history_v1.py \
            tests/test_portable_contracts_deform360_registered_residual_history_v1.py
          rm .github/workflows/format-pr576-residual-history.yml
          git diff --check

      - name: Commit formatted product files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/bayesian_phystwin/deform360_registered_residual_history_v1.py \
            tests/test_portable_contracts_deform360_registered_residual_history_v1.py \
            .github/workflows/format-pr576-residual-history.yml
          git commit -m 'Format registered residual-history path'
          git push origin HEAD:agent/registered-residual-history-single-path-v1
