name: Temporary canonical-contract import repair

on:
  push:
    branches: [refresh/claim-bundle-v1]
    paths:
      - .github/workflows/_temporary-canonical-import-fix.yml

permissions:
  contents: write

concurrency:
  group: temporary-canonical-import-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.ref == 'refs/heads/refresh/claim-bundle-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Replace invalid multiline module import exactly
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_canonical_contracts.py")
          source = path.read_text(encoding="utf-8")
          invalid = '''import test_deform360_calibration_observability_case_builder_adversarial as (
              adversarial_cases,
          )
          '''
          replacement = '''adversarial_cases = importlib.import_module(
              "test_deform360_calibration_observability_case_builder_adversarial"
          )
          '''
          if source.count(invalid) != 1:
              raise SystemExit("expected exactly one invalid canonical-contract import")
          path.write_text(source.replace(invalid, replacement), encoding="utf-8")
          PY
          python -m py_compile tests/test_canonical_contracts.py
          git diff --check

      - name: Commit syntax repair to the reviewed branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tests/test_canonical_contracts.py
          git commit -m "Repair canonical-contract adversarial test import"
          git push origin HEAD:refresh/claim-bundle-v1
