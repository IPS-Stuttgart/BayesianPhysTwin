name: Materialize Deform360 confirmation authorization

on:
  push:
    branches:
      - agent/deform360-confirmation-authorization
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: deform360-confirmation-materialize-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

env:
  TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}

jobs:
  materialize:
    name: Validate and publish exact source
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact transport commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Verify and extract exact source bundle
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/bpt-confirmation-clean.tar.gz"
          ARCHIVE="${archive}" python - <<'PY'
          import base64
          import hashlib
          import os
          import re
          from pathlib import Path

          expected_sha256 = (
              "d37cef2b0d07ca923ac41c8d16f364ab334ab49821243a7a25786742838a1781"
          )
          chunks = sorted(Path(".agent").glob("bpt-confirmation-clean.b64.*"))
          if not chunks:
              raise SystemExit("no confirmation source chunks found")
          encoded = b"".join(path.read_bytes() for path in chunks)
          encoded = re.sub(rb"[^A-Za-z0-9+/=]", b"", encoded).replace(b"=", b"")

          candidates: list[tuple[int | None, bytes]] = []
          if len(encoded) % 4 == 1:
              candidates.extend(
                  (index, encoded[:index] + encoded[index + 1 :])
                  for index in range(len(encoded))
              )
          else:
              candidates.append((None, encoded))

          matches: list[tuple[int | None, bytes]] = []
          for removed_index, candidate in candidates:
              padded = candidate + b"=" * (-len(candidate) % 4)
              try:
                  decoded = base64.b64decode(padded, validate=True)
              except ValueError:
                  continue
              if hashlib.sha256(decoded).hexdigest() == expected_sha256:
                  matches.append((removed_index, decoded))

          if len(matches) != 1:
              raise SystemExit(
                  "expected one SHA-256-matching source recovery, "
                  f"found {len(matches)}"
              )
          removed_index, decoded = matches[0]
          print(f"recovered_extra_base64_character_index={removed_index}")
          Path(os.environ["ARCHIVE"]).write_bytes(decoded)
          PY
          actual_sha256="$(sha256sum "${archive}" | cut -d ' ' -f 1)"
          echo "assembled_archive_sha256=${actual_sha256}"
          printf '%s  %s\n' \
            'd37cef2b0d07ca923ac41c8d16f364ab334ab49821243a7a25786742838a1781' \
            "${archive}" | sha256sum -c -
          tar -xzf "${archive}"
          rm -rf .agent
          rm -f .github/workflows/deform360-confirmation-materialize.yml

      - name: Install validation environment
        run: |
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Validate exact staged source
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/bayesian_phystwin/deform360_confirmation_authorization.py
            src/bayesian_phystwin/cli/deform360_confirmation_authorization.py
            src/bayesian_phystwin/cli/_command_inventory.py
            src/bayesian_phystwin/cli/experiments.py
            tests/test_deform360_confirmation_authorization.py
            tests/test_command_registry.py
          )
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy \
            src/bayesian_phystwin/deform360_confirmation_authorization.py \
            src/bayesian_phystwin/cli/deform360_confirmation_authorization.py
          python -m pytest -q \
            tests/test_deform360_confirmation_authorization.py \
            tests/test_deform360_calibration_execution.py \
            tests/test_deform360_calibration_bundle.py \
            tests/test_evidence_use_ledger.py \
            tests/test_command_registry.py \
            tests/test_cli_main.py \
            tests/test_release_metadata.py
          bpt commands describe authorize-deform360-confirmation --json >/dev/null
          bpt experiment run authorize-deform360-confirmation --help >/dev/null
          python -m compileall -q src
          git diff --check

      - name: Publish one clean validated commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --soft origin/main
          git add -A
          git commit -m 'Add one-shot Deform360 confirmation authorization'
          git push --force-with-lease origin "HEAD:${TARGET_BRANCH}"
