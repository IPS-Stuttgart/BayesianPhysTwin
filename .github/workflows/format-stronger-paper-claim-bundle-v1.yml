# workflow-lifecycle: temporary-one-shot
# workflow-owner: IPS-Stuttgart maintainers
name: Format stronger paper claim bundle v1

on:
  push:
    branches: [science/stronger-paper-claim-bundle-v1]
    paths:
      - .github/workflows/format-stronger-paper-claim-bundle-v1.yml

permissions:
  contents: write

concurrency:
  group: format-stronger-paper-claim-bundle-v1
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out claim branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: science/stronger-paper-claim-bundle-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Format and self-test claim composer
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install ruff==0.16.5
          target=scripts/science/build_stronger_paper_claim_bundle_v1.py
          ruff check --fix "$target"
          ruff format "$target"
          ruff check "$target"
          ruff format --check "$target"
          python "$target" --self-test

      - name: Publish formatting and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/format-stronger-paper-claim-bundle-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/science/build_stronger_paper_claim_bundle_v1.py \
            .github/workflows/format-stronger-paper-claim-bundle-v1.yml
          git diff --cached --check
          git commit -m 'Format stronger paper claim composer'
          git push origin HEAD:science/stronger-paper-claim-bundle-v1
