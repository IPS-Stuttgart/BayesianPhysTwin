name: Full-22 tempered model-average hosted experiment

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/full22-tempered-model-average-hosted.yml"
      - "protocols/full22_tempered_model_average_experiment_v1.json"
      - "scripts/science/run_full22_tempered_model_average_experiment.py"
      - "scripts/science/run_full22_endpoint_model_average_diagnostic.py"
      - "tests/test_full22_tempered_model_average_experiment.py"
      - "src/bayesian_phystwin/endpoint_model_average.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full22-tempered-model-average-hosted-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  experiment:
    name: Source-tuned hosted reference
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out BayesianPhysTwin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Resolve isolated paths
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/bpt-full22-tempered-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${root}/data" "${root}/evidence"
          echo "DATA_ROOT=${root}/data" >> "${GITHUB_ENV}"
          echo "OUTPUT_ROOT=${root}/evidence" >> "${GITHUB_ENV}"

      - name: Record independent runtime
        shell: bash
        run: |
          {
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "revision=${GITHUB_SHA}"
            uname -a
            lscpu
          } | tee "${OUTPUT_ROOT}/runner.txt"

      - name: Install locked evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,data,graph]"
          python -m pip check
          python -m pip freeze --all > "${OUTPUT_ROOT}/pip-freeze.txt"

      - name: Verify code and locked protocol before target evaluation
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check \
            scripts/science/run_full22_tempered_model_average_experiment.py \
            tests/test_full22_tempered_model_average_experiment.py
          python -m ruff format --check \
            scripts/science/run_full22_tempered_model_average_experiment.py \
            tests/test_full22_tempered_model_average_experiment.py
          python -m pytest -q \
            tests/test_full22_tempered_model_average_experiment.py \
            tests/test_endpoint_model_average.py
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          payload = json.loads(
              Path(
                  "protocols/full22_tempered_model_average_experiment_v1.json"
              ).read_text(encoding="utf-8")
          )
          actual = hashlib.sha256(
              json.dumps(
                  payload,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              ).encode("utf-8")
          ).hexdigest()
          expected = "a351cf37ba19130feca4dcfb87b1e7ab9a2e601d22edeed3a39a00c904ecbbe3"
          if actual != expected:
              raise SystemExit(
                  f"protocol digest changed: expected {expected}, received {actual}"
              )
          print(f"locked protocol: {actual}")
          PY

      - name: Execute source selection and confirmation diagnosis
        shell: bash
        run: |
          set -euo pipefail
          python scripts/science/run_full22_tempered_model_average_experiment.py \
            "${DATA_ROOT}" \
            "${OUTPUT_ROOT}/result" \
            --protocol \
              protocols/full22_tempered_model_average_experiment_v1.json \
            --workers 2 \
            --repository-revision "${GITHUB_SHA}" \
            --force \
            | tee "${OUTPUT_ROOT}/experiment-console.json"
          cp "${DATA_ROOT}/trajectory_evaluation_manifest.json" \
            "${OUTPUT_ROOT}/result/data_manifest.json"

      - name: Verify compact evidence and selection boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["OUTPUT_ROOT"]) / "result"
          manifest = json.loads(
              (root / "artifact_manifest.json").read_text(encoding="utf-8")
          )
          for name, key in (
              ("selection.json", "selection_sha256"),
              ("summary.json", "summary_sha256"),
              ("readout.json", "readout_sha256"),
              ("per_case.csv", "per_case_csv_sha256"),
          ):
              actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
              if actual != manifest[key]:
                  raise SystemExit(f"{name} digest disagrees with manifest")
          summary = json.loads((root / "summary.json").read_text(encoding="utf-8"))
          selection = json.loads(
              (root / "selection.json").read_text(encoding="utf-8")
          )
          if summary["aggregate"]["confirmation_19"]["case_count"] != 19:
              raise SystemExit("confirmation partition no longer has 19 cases")
          if not summary["selection"]["locked_before_confirmation"]:
              raise SystemExit("selection was not locked before confirmation")
          if selection["confirmation_outcomes_opened"] is not False:
              raise SystemExit("selection artifact crossed the outcome boundary")
          if summary["classification"] != (
              "retrospective-non-claim-bearing-experiment"
          ):
              raise SystemExit("claim classification changed")
          print(json.dumps(summary["selection"], indent=2, sort_keys=True))
          PY
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"

      - name: Publish scientific job summary
        if: always()
        shell: bash
        run: |
          if [[ -f "${OUTPUT_ROOT}/result/readout.json" ]]; then
            python - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json
          import os
          from pathlib import Path

          readout = json.loads(
              (Path(os.environ["OUTPUT_ROOT"]) / "result" / "readout.json").read_text(
                  encoding="utf-8"
              )
          )
          selection = readout["selection"]
          point = readout["confirmation_point"]["methods"]
          calibration = readout["confirmation_predictive_calibration"]
          print("### Full-22 tempered model-average experiment")
          print()
          print(f"- Selected temperature: `{selection['selected_temperature']}`")
          print(f"- Guard threshold (m): `{selection['guard_threshold_m']}`")
          print(
              "- Confirmation guard acceptance: "
              f"`{readout['confirmation_guard_acceptance_fraction']:.3f}`"
          )
          print(
              "- Horizon covariance scales: `"
              f"{selection['group_conformal_scales_by_horizon']}`"
          )
          print()
          print("| Method | CD (mm) | Track (mm) |")
          print("| --- | ---: | ---: |")
          for method in (
              "temperature_1_model_average",
              "tempered_model_average",
              "tempered_model_average_guard",
              "last_residual",
          ):
              values = point[method]
              print(
                  f"| `{method}` | "
                  f"{1000 * values['chamfer_distance_m']['equal_case_mean_m']:.3f} | "
                  f"{1000 * values['track_error_m']['equal_case_mean_m']:.3f} |"
              )
          print()
          print("| Posterior | 90% coverage | NEES / 3 | Mean NLL |")
          print("| --- | ---: | ---: | ---: |")
          for posterior in (
              "temperature_1_model_average_raw",
              "tempered_model_average_raw",
              "tempered_model_average_group_conformal",
          ):
              values = calibration[posterior]["updated_only"][
                  "equal_case_overall"
              ]
              print(
                  f"| `{posterior}` | {values['coverage_90']:.3f} | "
                  f"{values['mean_nees_over_dimension']:.3f} | "
                  f"{values['mean_negative_log_likelihood']:.3f} |"
              )
          print()
          print(
              "Retrospective non-claim-bearing result: the released cohort and "
              "split already informed method development."
          )
          PY
          else
            echo "### Full-22 tempered experiment stopped before readout" \
              >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload independent-runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bpt-full22-tempered-hosted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bpt-full22-tempered-${{ github.run_id }}-${{ github.run_attempt }}/evidence
          if-no-files-found: error
          retention-days: 30
