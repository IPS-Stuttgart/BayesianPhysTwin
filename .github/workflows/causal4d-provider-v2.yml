name: Causal4D provider v2 contract

on:
  push:
    branches: [main]
    paths:
      - "src/bayesian_phystwin/causal4d_provider_v2.py"
      - "src/bayesian_phystwin/_causal4d_provider_v2_*.py"
      - "tests/test_causal4d_provider_v2.py"
      - "docs/causal4d_provider_v2.md"
      - ".github/workflows/causal4d-provider-v2.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/bayesian_phystwin/causal4d_provider_v2.py"
      - "src/bayesian_phystwin/_causal4d_provider_v2_*.py"
      - "tests/test_causal4d_provider_v2.py"
      - "docs/causal4d_provider_v2.md"
      - ".github/workflows/causal4d-provider-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: causal4d-provider-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Provider v2 / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install provider test dependencies
        run: python -m pip install -e ".[dev,graph]"
      - name: Check provider source quality
        run: |
          python -m ruff check \
            src/bayesian_phystwin/causal4d_provider_v2.py \
            src/bayesian_phystwin/_causal4d_provider_v2_types.py \
            src/bayesian_phystwin/_causal4d_provider_v2_case.py \
            src/bayesian_phystwin/_causal4d_provider_v2_replay.py \
            tests/test_causal4d_provider_v2.py
          python -m ruff format --check \
            src/bayesian_phystwin/causal4d_provider_v2.py \
            src/bayesian_phystwin/_causal4d_provider_v2_types.py \
            src/bayesian_phystwin/_causal4d_provider_v2_case.py \
            src/bayesian_phystwin/_causal4d_provider_v2_replay.py \
            tests/test_causal4d_provider_v2.py
          python -m mypy \
            src/bayesian_phystwin/causal4d_provider_v2.py \
            src/bayesian_phystwin/_causal4d_provider_v2_types.py \
            src/bayesian_phystwin/_causal4d_provider_v2_case.py \
            src/bayesian_phystwin/_causal4d_provider_v2_replay.py
      - name: Run provider v2 contract tests
        run: python -m pytest -q tests/test_causal4d_provider_v2.py
