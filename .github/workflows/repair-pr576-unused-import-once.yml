name: Repair PR 576 unused import once

on:
  push:
    branches:
      - agent/registered-residual-history-single-path-v1
    paths:
      - .github/workflows/repair-pr576-unused-import-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v7
        with:
          ref: agent/registered-residual-history-single-path-v1
          fetch-depth: 0

      - name: Remove unused import
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "tests/test_portable_contracts_deform360_"
              "registered_residual_history_v1_validation.py"
          )
          text = path.read_text(encoding="utf-8")
          old = "    RegisteredResidualHistoryDecisionV1,\n"
          if text.count(old) != 1:
              raise SystemExit("expected exactly one unused decision import")
          path.write_text(text.replace(old, ""), encoding="utf-8")
          PY
          python -m pip install ruff
          python -m ruff format --check tests/test_portable_contracts_deform360_registered_residual_history_v1_validation.py
          python -m ruff check tests/test_portable_contracts_deform360_registered_residual_history_v1_validation.py

      - name: Commit repair and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-pr576-unused-import-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_portable_contracts_deform360_registered_residual_history_v1_validation.py .github/workflows/repair-pr576-unused-import-once.yml
          git commit -m 'Remove unused residual-history test import'
          git push origin HEAD:agent/registered-residual-history-single-path-v1
