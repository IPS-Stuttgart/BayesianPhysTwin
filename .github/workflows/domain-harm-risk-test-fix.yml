name: Temporary domain harm-risk test repair

on:
  push:
    branches:
      - agent/domain-harm-risk-certificate-v1

permissions:
  contents: write

jobs:
  repair-and-remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/domain-harm-risk-certificate-v1
          persist-credentials: true
      - name: Preserve genuine Python identifier types and remove this workflow
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_guard_harm_risk_domains.py")
          text = path.read_text(encoding="utf-8")
          old = '''    evidence = _evidence()
              dynamic = np.asarray(evidence["domain_ids"]) == "dynamic"
              certificate = certify_domain_guard_harm_risk(
                  domain_guard_certificate=guard,
                  threshold_source_artifact_id=THRESHOLD_SOURCE_ID,
                  certification_partition_id=CERTIFICATION_PARTITION_ID,
                  threshold_selection_group_ids=("threshold-selection-1",),
                  group_ids=tuple(np.asarray(evidence["group_ids"])[dynamic]),
                  domain_ids=tuple(np.asarray(evidence["domain_ids"])[dynamic]),
                  risk_scores=np.asarray(evidence["risk_scores"])[dynamic],
                  candidate_losses=np.asarray(evidence["candidate_losses"])[dynamic],
                  fallback_losses=np.asarray(evidence["fallback_losses"])[dynamic],
                  fallback_identity_verified=np.asarray(evidence["fallback_identity_verified"])[
                      dynamic
                  ],
          '''
          new = '''    evidence = _evidence()
              evidence_group_ids = evidence["group_ids"]
              evidence_domain_ids = evidence["domain_ids"]
              assert isinstance(evidence_group_ids, tuple)
              assert isinstance(evidence_domain_ids, tuple)
              selected_indices = tuple(
                  index
                  for index, domain in enumerate(evidence_domain_ids)
                  if domain == "dynamic"
              )
              indices = np.asarray(selected_indices, dtype=np.int64)
              certificate = certify_domain_guard_harm_risk(
                  domain_guard_certificate=guard,
                  threshold_source_artifact_id=THRESHOLD_SOURCE_ID,
                  certification_partition_id=CERTIFICATION_PARTITION_ID,
                  threshold_selection_group_ids=("threshold-selection-1",),
                  group_ids=tuple(
                      evidence_group_ids[index] for index in selected_indices
                  ),
                  domain_ids=tuple(
                      evidence_domain_ids[index] for index in selected_indices
                  ),
                  risk_scores=np.asarray(evidence["risk_scores"])[indices],
                  candidate_losses=np.asarray(evidence["candidate_losses"])[indices],
                  fallback_losses=np.asarray(evidence["fallback_losses"])[indices],
                  fallback_identity_verified=np.asarray(
                      evidence["fallback_identity_verified"]
                  )[indices],
          '''
          if text.count(old) != 1:
              raise SystemExit("expected domain-harm test block was not found exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          python -m pip install "ruff==0.16.2"
          python -m ruff format tests/test_guard_harm_risk_domains.py
          python -m ruff format --check tests/test_guard_harm_risk_domains.py
          rm .github/workflows/domain-harm-risk-test-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/test_guard_harm_risk_domains.py \
            .github/workflows/domain-harm-risk-test-fix.yml
          git diff --cached --check
          git commit -m "Preserve exact identifier types in domain harm-risk tests"
          git push origin HEAD:agent/domain-harm-risk-certificate-v1
