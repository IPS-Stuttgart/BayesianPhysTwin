name: Apply chronological placebo physicality v2

on:
  push:
    branches:
      - science/chronological-placebo-physicality-v2

permissions:
  contents: write

concurrency:
  group: apply-chronological-placebo-physicality-v2
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: science/chronological-placebo-physicality-v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Materialize reviewed implementation
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          from pathlib import Path

          files = {
              ".bootstrap/cross_action_placebo_v2.source.b64": (
                  "src/bayesian_phystwin_experiments/cross_action_placebo_v2.py"
              ),
              ".bootstrap/cross_action_placebo_v2.test.b64": (
                  "tests/test_cross_action_placebo_v2.py"
              ),
              ".bootstrap/cross_action_placebo_v2.docs.b64": (
                  "docs/cross_action_placebo_v2.md"
              ),
          }
          for encoded_path, output_path in files.items():
              encoded = Path(encoded_path).read_text().strip()
              output = Path(output_path)
              output.parent.mkdir(parents=True, exist_ok=True)
              output.write_bytes(gzip.decompress(base64.b64decode(encoded)))

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text()
          bullet = (
              "- Added a target-closed chronological broken-mechanism physicality "
              "certificate that binds four source-prefix-only placebos to the "
              "cross-action v2 parent, enforces exact fallback, and uses joint "
              "familywise session-bootstrap bounds.\n"
          )
          marker = "## [Unreleased]\n\n"
          if bullet not in text:
              if marker not in text:
                  raise SystemExit("missing Unreleased changelog marker")
              changelog.write_text(text.replace(marker, marker + bullet, 1))
          PY
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Apply canonical formatting and lint fixes
        run: |
          python -m ruff format src/bayesian_phystwin_experiments/cross_action_placebo_v2.py tests/test_cross_action_placebo_v2.py
          python -m ruff check --fix -- src/bayesian_phystwin_experiments/cross_action_placebo_v2.py tests/test_cross_action_placebo_v2.py
          python -m ruff format --check -- src/bayesian_phystwin_experiments/cross_action_placebo_v2.py tests/test_cross_action_placebo_v2.py
          python -m ruff check -- src/bayesian_phystwin_experiments/cross_action_placebo_v2.py tests/test_cross_action_placebo_v2.py
      - name: Run focused contract tests
        run: |
          python -m pytest -q tests/test_cross_action_transport_v2.py tests/test_cross_action_placebo_v1.py tests/test_cross_action_placebo_v2.py
          git diff --check
      - name: Publish reviewed patch and remove bootstrap
        shell: bash
        run: |
          rm -rf .bootstrap
          rm .github/workflows/apply-chronological-placebo-physicality-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add chronological placebo physicality certificate v2"
          git push origin HEAD:science/chronological-placebo-physicality-v2
