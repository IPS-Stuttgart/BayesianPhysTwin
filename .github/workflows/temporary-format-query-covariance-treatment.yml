name: Temporary format query covariance treatment

on:
  push:
    branches:
      - agent/query-covariance-treatment-v1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/query-covariance-treatment-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Install repository formatter
        run: python -m pip install "ruff==0.16.2"

      - name: Apply canonical formatting
        run: |
          set -euo pipefail
          python -m ruff format \
            src/bayesian_phystwin/query_covariance_treatment \
            tests/test_query_calibration_covariance_treatment.py
          python -m ruff check \
            src/bayesian_phystwin/query_covariance_treatment \
            tests/test_query_calibration_covariance_treatment.py

      - name: Commit the formatter result
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayesian_phystwin/query_covariance_treatment \
            tests/test_query_calibration_covariance_treatment.py
          git commit -m "Apply canonical Ruff formatting"
          git push origin HEAD:agent/query-covariance-treatment-v1
