name: Execute ecosystem compatibility formatting

on:
  pull_request:
    branches:
      - agent/ecosystem-compatibility-table-v1
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  format:
    if: >-
      github.event.pull_request.head.ref ==
      'agent/execute-ecosystem-table-format'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact target branch
        uses: actions/checkout@v7
        with:
          ref: agent/ecosystem-compatibility-table-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install canonical formatter
        run: python -m pip install ruff==0.16.2

      - name: Format and validate the reviewed files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/bayesian_phystwin/ecosystem_compatibility_v1.py
            tests/test_ecosystem_compatibility_v1.py
          )
          ruff format "${files[@]}"
          ruff check "${files[@]}"
          ruff format --check "${files[@]}"
          python -m py_compile "${files[@]}"
          git diff --check

      - name: Push the formatting-only commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayesian_phystwin/ecosystem_compatibility_v1.py \
            tests/test_ecosystem_compatibility_v1.py
          git commit -m "Apply authoritative Ruff formatting"
          git push origin HEAD:agent/ecosystem-compatibility-table-v1
