name: Temporary deterministic Deform360 run-record import repair

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - '.github/workflows/_temporary-fix-deform360-run-record-imports.yml'
      - 'src/bayesian_phystwin/deform360_calibration_source_run_record.py'
      - 'tests/test_deform360_calibration_source_run_record_validation.py'
      - 'tests/test_render_deform360_calibration_source_run_record.py'

permissions:
  contents: write

jobs:
  format-validate-and-commit:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact same-repository PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify exact reviewed head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git branch --show-current)" = "${GITHUB_HEAD_REF}"

      - name: Apply deterministic Ruff normalization
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          files=(
            src/bayesian_phystwin/deform360_calibration_source_run_record.py
            tests/test_deform360_calibration_source_run_record_validation.py
            tests/test_render_deform360_calibration_source_run_record.py
          )
          python -m ruff check --fix --select I001 "${files[@]}"
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy \
            src/bayesian_phystwin/deform360_calibration_source_run_record.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_deform360_calibration_source_direct_workflow.py \
            tests/test_deform360_calibration_source_run_record.py \
            tests/test_deform360_calibration_source_run_record_validation.py \
            tests/test_render_deform360_calibration_source_run_record.py
          python -m compileall -q "${files[@]}"
          git diff --check

          printf '%s\n' "${files[@]}" | sort > /tmp/expected-files
          git diff --name-only | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files

      - name: Commit only the validated generated files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/bayesian_phystwin/deform360_calibration_source_run_record.py
            tests/test_deform360_calibration_source_run_record_validation.py
            tests/test_render_deform360_calibration_source_run_record.py
          )
          git add -- "${files[@]}"
          git diff --cached --check
          git diff --quiet
          printf '%s\n' "${files[@]}" | sort > /tmp/expected-staged-files
          git diff --cached --name-only | sort > /tmp/actual-staged-files
          diff -u /tmp/expected-staged-files /tmp/actual-staged-files
          if git diff --cached --quiet; then
            echo 'Expected import-order repair is empty.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Normalize Deform360 run-record source'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
