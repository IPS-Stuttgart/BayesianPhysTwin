name: Deform360 covariance residual adapter dry run v1

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deform360-covariance-residual-adapter-dry-run-v1.yml"
      - "docs/deform360_covariance_residual_adapter_dry_run_v1.md"
      - "protocols/locks/deform360_covariance_only_residual_adapter_dry_run_v1.json"
      - "scripts/science/run_deform360_covariance_residual_adapter_dry_run_v1.py"
      - "src/bayesian_phystwin/deform360_covariance_residual_adapter_v1.py"
      - "tests/test_deform360_covariance_residual_adapter_v1.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    deform360-covariance-residual-adapter-v1-${{
      github.event.pull_request.head.sha || github.sha
    }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PROTOCOL: protocols/locks/deform360_covariance_only_residual_adapter_dry_run_v1.json

jobs:
  source-only-contract:
    name: Source-only residual-history contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install exact development environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1"
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Validate source-only adapter contracts
        shell: bash
        run: |
          set -euo pipefail
          files=(
            scripts/science/run_deform360_covariance_residual_adapter_dry_run_v1.py
            src/bayesian_phystwin/deform360_covariance_residual_adapter_v1.py
            tests/test_deform360_covariance_residual_adapter_v1.py
          )
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy \
            src/bayesian_phystwin/deform360_covariance_residual_adapter_v1.py \
            scripts/science/run_deform360_covariance_residual_adapter_dry_run_v1.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_covariance_only_hybrid.py \
            tests/test_deform360_covariance_residual_adapter_v1.py \
            tests/test_pull_request_workflow_integrity.py \
            tests/test_pr_ready.py

      - name: Run deterministic source-only dry gate
        shell: bash
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/deform360-covariance-residual-dry-run-v1.json"
          python \
            scripts/science/run_deform360_covariance_residual_adapter_dry_run_v1.py \
            "${output}" \
            --protocol "${PROTOCOL}"
          jq -e '
            .status == "passed" and
            .accepted_mean_identity_preserved == true and
            .validity_preserved == true and
            .nearest_fill_used == false and
            .information_boundary.source_only == true and
            .information_boundary.target_payload_opened == false and
            .information_boundary.target_outcomes_opened == false and
            .information_boundary.target_cache_path_accessed == false
          ' "${output}" >/dev/null
          test "$(jq -r '.result_id' "${output}")" = \
            "14ee5b6899737295a4431e8562110618be591055638f70c609bd4fc87e6f456d"

      - name: Prove repository remained unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"
