name: Causal4D provider compatibility

on:
  pull_request:
    paths:
      - "src/bayesian_phystwin/contracts/**"
      - "src/bayesian_phystwin/phystwin/**"
      - "src/bayesian_phystwin/causal4d_provider_v1.py"
      - "src/bayesian_phystwin/causal4d_provider_v2.py"
      - "tests/test_causal4d_provider_v1.py"
      - "tests/test_causal4d_provider_v2.py"
      - "docs/causal4d_provider_v1.md"
      - "docs/causal4d_provider_v2.md"
      - "pyproject.toml"
      - ".github/workflows/causal4d-provider-compatibility.yml"
  push:
    branches: [main]
    paths:
      - "src/bayesian_phystwin/contracts/**"
      - "src/bayesian_phystwin/phystwin/**"
      - "src/bayesian_phystwin/causal4d_provider_v1.py"
      - "src/bayesian_phystwin/causal4d_provider_v2.py"
      - "tests/test_causal4d_provider_v1.py"
      - "tests/test_causal4d_provider_v2.py"
      - "docs/causal4d_provider_v1.md"
      - "docs/causal4d_provider_v2.md"
      - "pyproject.toml"
      - ".github/workflows/causal4d-provider-compatibility.yml"
  workflow_dispatch:
    inputs:
      causal4d_ref:
        description: Causal4D branch, tag, or commit to validate
        required: false
        default: main
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: causal4d-provider-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider-quality:
    name: Provider API quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Lint owned provider modules
        id: ruff
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m ruff check \
            src/bayesian_phystwin/contracts \
            src/bayesian_phystwin/phystwin \
            src/bayesian_phystwin/causal4d_provider_v1.py \
            src/bayesian_phystwin/causal4d_provider_v2.py \
            tests/test_causal4d_provider_v2.py \
            2>&1 | tee ruff-output.txt
      - name: Type-check owned provider modules
        id: mypy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m mypy \
            src/bayesian_phystwin/contracts \
            src/bayesian_phystwin/phystwin \
            src/bayesian_phystwin/causal4d_provider_v1.py \
            src/bayesian_phystwin/causal4d_provider_v2.py \
            2>&1 | tee mypy-output.txt
      - name: Upload provider quality diagnostics
        if: steps.ruff.outcome == 'failure' || steps.mypy.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: provider-quality-diagnostics
          path: |
            ruff-output.txt
            mypy-output.txt
          if-no-files-found: error
          retention-days: 3
      - name: Fail on provider quality diagnostics
        if: steps.ruff.outcome == 'failure' || steps.mypy.outcome == 'failure'
        run: exit 1

  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Bayesian-PhysTwin
        uses: actions/checkout@v7
        with:
          path: bayesian-phystwin

      - name: Check out Causal4D
        uses: actions/checkout@v7
        with:
          repository: FlorianPfaff/Causal4D
          ref: ${{ inputs.causal4d_ref || 'main' }}
          path: causal4d

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            bayesian-phystwin/pyproject.toml
            causal4d/pyproject.toml

      - name: Install both repositories
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./bayesian-phystwin[dev,graph]" opencv-python-headless
          python -m pip install -e "./causal4d[dev]"

      - name: Run provider and downstream compatibility tests
        env:
          CAUSAL4D_REQUIRE_BPT_PROVIDER: "1"
        shell: bash
        run: |
          tests=(
            bayesian-phystwin/tests/test_causal4d_provider_v1.py
            bayesian-phystwin/tests/test_causal4d_provider_v2.py
            causal4d/tests/test_causal4d_provider_contract.py
            causal4d/tests/test_causal4d_bpt_belief.py
            causal4d/tests/test_causal4d_phystwin_backend.py
          )
          if [[ -f causal4d/tests/test_bpt_provider_import_boundary.py ]]; then
            tests+=(causal4d/tests/test_bpt_provider_import_boundary.py)
          fi
          if [[ -f causal4d/tests/test_bpt_provider_integration.py ]]; then
            tests+=(causal4d/tests/test_bpt_provider_integration.py)
          fi
          python -m pytest -q "${tests[@]}"
