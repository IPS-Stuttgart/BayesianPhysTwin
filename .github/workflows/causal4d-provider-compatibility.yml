name: Causal4D provider compatibility

on:
  pull_request:
    paths:
      - "src/bayesian_phystwin/contracts/**"
      - "src/bayesian_phystwin/phystwin/**"
      - "src/bayesian_phystwin/data/ecosystem_compatibility_v1.json"
      - "src/bayesian_phystwin/ecosystem_compatibility.py"
      - "src/bayesian_phystwin/cli/ecosystem_validate.py"
      - "src/bayesian_phystwin/cli/command_registry.py"
      - "src/bayesian_phystwin/cli/_command_inventory.py"
      - "src/bayesian_phystwin/causal4d_provider_v1.py"
      - "src/bayesian_phystwin/causal4d_provider_v2.py"
      - "src/bayesian_phystwin/causal4d_belief_provider_v1.py"
      - "src/bayesian_phystwin/causal4d_belief_provider_v2.py"
      - "src/bayesian_phystwin/endpoint_model_average.py"
      - "tests/test_causal4d_provider_v1.py"
      - "tests/test_causal4d_provider_v2.py"
      - "tests/test_endpoint_model_average.py"
      - "tests/test_ecosystem_compatibility.py"
      - "tests/test_command_registry.py"
      - "docs/causal4d_provider_v1.md"
      - "docs/causal4d_provider_v2.md"
      - "docs/causal4d_belief_provider_v1.md"
      - "docs/ecosystem_compatibility.md"
      - "docs/prospective_belief_updates_v1.md"
      - "MANIFEST.in"
      - "pyproject.toml"
      - ".github/workflows/causal4d-provider-compatibility.yml"
  push:
    branches: [main]
    paths:
      - "src/bayesian_phystwin/contracts/**"
      - "src/bayesian_phystwin/phystwin/**"
      - "src/bayesian_phystwin/data/ecosystem_compatibility_v1.json"
      - "src/bayesian_phystwin/ecosystem_compatibility.py"
      - "src/bayesian_phystwin/cli/ecosystem_validate.py"
      - "src/bayesian_phystwin/cli/command_registry.py"
      - "src/bayesian_phystwin/cli/_command_inventory.py"
      - "src/bayesian_phystwin/causal4d_provider_v1.py"
      - "src/bayesian_phystwin/causal4d_provider_v2.py"
      - "src/bayesian_phystwin/causal4d_belief_provider_v1.py"
      - "src/bayesian_phystwin/causal4d_belief_provider_v2.py"
      - "src/bayesian_phystwin/endpoint_model_average.py"
      - "tests/test_causal4d_provider_v1.py"
      - "tests/test_causal4d_provider_v2.py"
      - "tests/test_endpoint_model_average.py"
      - "tests/test_ecosystem_compatibility.py"
      - "tests/test_command_registry.py"
      - "docs/causal4d_provider_v1.md"
      - "docs/causal4d_provider_v2.md"
      - "docs/causal4d_belief_provider_v1.md"
      - "docs/ecosystem_compatibility.md"
      - "docs/prospective_belief_updates_v1.md"
      - "MANIFEST.in"
      - "pyproject.toml"
      - ".github/workflows/causal4d-provider-compatibility.yml"
  workflow_dispatch:
    inputs:
      causal4d_ref:
        description: Optional Causal4D branch, tag, or commit; blank uses the lock
        required: false
        type: string
        default: ""
      run_latest_main_canary:
        description: Also test current Causal4D main as a non-blocking canary
        required: false
        type: boolean
        default: true
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: causal4d-provider-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BPT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  resolve-lock:
    name: Resolve committed compatibility lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      causal4d_ref: ${{ steps.resolve.outputs.causal4d_ref }}
      lock_enforced: ${{ steps.resolve.outputs.lock_enforced }}
      locked_causal4d_ref: ${{ steps.resolve.outputs.locked_causal4d_ref }}
    steps:
      - name: Check out exact Bayesian-PhysTwin source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BPT_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve locked or explicit Causal4D revision
        id: resolve
        env:
          CAUSAL4D_OVERRIDE: ${{ inputs.causal4d_ref || '' }}
        shell: bash
        run: |
          set -euo pipefail
          locked_ref="$(python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path(
                  "src/bayesian_phystwin/data/ecosystem_compatibility_v1.json"
              ).read_text(encoding="utf-8")
          )
          print(payload["components"]["causal4d"]["revision"])
          PY
          )"
          selected_ref="${locked_ref}"
          lock_enforced=true
          if [[ -n "${CAUSAL4D_OVERRIDE}" ]]; then
            selected_ref="${CAUSAL4D_OVERRIDE}"
            lock_enforced=false
          fi
          {
            echo "causal4d_ref=${selected_ref}"
            echo "lock_enforced=${lock_enforced}"
            echo "locked_causal4d_ref=${locked_ref}"
          } >> "${GITHUB_OUTPUT}"

  compatibility:
    name: Provider API and locked Causal4D compatibility
    needs: resolve-lock
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact Bayesian-PhysTwin source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BPT_SOURCE_SHA }}
          path: bayesian-phystwin
          fetch-depth: 1
          persist-credentials: false

      - name: Check out selected Causal4D consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/Causal4D
          ref: ${{ needs.resolve-lock.outputs.causal4d_ref }}
          path: causal4d
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            bayesian-phystwin/pyproject.toml
            causal4d/pyproject.toml

      - name: Install both repositories
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./bayesian-phystwin[dev,graph]" opencv-python-headless
          python -m pip install -e "./causal4d[dev]"

      - name: Lint owned provider and compatibility modules
        id: ruff
        continue-on-error: true
        working-directory: bayesian-phystwin
        shell: bash
        run: |
          set -euo pipefail
          {
            python -m ruff check \
              src/bayesian_phystwin/contracts \
              src/bayesian_phystwin/phystwin \
              src/bayesian_phystwin/ecosystem_compatibility.py \
              src/bayesian_phystwin/cli/ecosystem_validate.py \
              src/bayesian_phystwin/causal4d_provider_v2.py \
              src/bayesian_phystwin/causal4d_belief_provider_v1.py \
              src/bayesian_phystwin/causal4d_belief_provider_v2.py \
              src/bayesian_phystwin/endpoint_model_average.py \
              tests/test_causal4d_provider_v2.py \
              tests/test_endpoint_model_average.py \
              tests/test_ecosystem_compatibility.py
            python -m ruff format --check \
              src/bayesian_phystwin/ecosystem_compatibility.py \
              src/bayesian_phystwin/cli/ecosystem_validate.py \
              tests/test_ecosystem_compatibility.py
            # v1 is a frozen compatibility facade; retain its historical import
            # grouping while enforcing every non-import-order Ruff diagnostic.
            python -m ruff check --ignore I001 \
              src/bayesian_phystwin/causal4d_provider_v1.py
          } 2>&1 | tee ruff-output.txt

      - name: Type-check owned provider and compatibility modules
        id: mypy
        continue-on-error: true
        working-directory: bayesian-phystwin
        shell: bash
        run: |
          set -o pipefail
          python -m mypy --python-version 3.12 \
            src/bayesian_phystwin/contracts \
            src/bayesian_phystwin/phystwin \
            src/bayesian_phystwin/ecosystem_compatibility.py \
            src/bayesian_phystwin/cli/ecosystem_validate.py \
            src/bayesian_phystwin/causal4d_provider_v1.py \
            src/bayesian_phystwin/causal4d_provider_v2.py \
            src/bayesian_phystwin/causal4d_belief_provider_v1.py \
            src/bayesian_phystwin/causal4d_belief_provider_v2.py \
            src/bayesian_phystwin/endpoint_model_average.py \
            2>&1 | tee mypy-output.txt

      - name: Upload provider quality diagnostics
        if: steps.ruff.outcome == 'failure' || steps.mypy.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: provider-quality-diagnostics
          path: |
            bayesian-phystwin/ruff-output.txt
            bayesian-phystwin/mypy-output.txt
          if-no-files-found: error
          retention-days: 3

      - name: Run provider and downstream compatibility tests
        env:
          CAUSAL4D_REQUIRE_BPT_PROVIDER: "1"
        shell: bash
        run: |
          tests=(
            bayesian-phystwin/tests/test_causal4d_provider_v1.py
            bayesian-phystwin/tests/test_causal4d_provider_v2.py
            bayesian-phystwin/tests/test_endpoint_model_average.py
            bayesian-phystwin/tests/test_ecosystem_compatibility.py
            causal4d/tests/test_causal4d_provider_contract.py
            causal4d/tests/test_causal4d_bpt_belief.py
            causal4d/tests/test_causal4d_phystwin_backend.py
          )
          if [[ -f causal4d/tests/test_bpt_provider_import_boundary.py ]]; then
            tests+=(causal4d/tests/test_bpt_provider_import_boundary.py)
          fi
          if [[ -f causal4d/tests/test_bpt_provider_integration.py ]]; then
            tests+=(causal4d/tests/test_bpt_provider_integration.py)
          fi
          python -m pytest -q "${tests[@]}"

      - name: Validate the selected ecosystem revision
        working-directory: bayesian-phystwin
        env:
          LOCK_ENFORCED: ${{ needs.resolve-lock.outputs.lock_enforced }}
        shell: bash
        run: |
          set -euo pipefail
          causal4d_sha="$(git -C ../causal4d rev-parse HEAD)"
          arguments=(
            ecosystem validate
            --json
            --output-json ecosystem-compatibility.json
          )
          if [[ "${LOCK_ENFORCED}" == "true" ]]; then
            arguments+=(--revision "causal4d=${causal4d_sha}")
          fi
          bpt "${arguments[@]}"

      - name: Emit versioned provider manifests
        working-directory: bayesian-phystwin
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from bayesian_phystwin.causal4d_belief_provider_v1 import (
              causal4d_belief_provider_manifest,
          )
          from bayesian_phystwin.causal4d_belief_provider_v2 import (
              causal4d_belief_provider_v2_manifest,
          )
          from bayesian_phystwin.causal4d_provider_v2 import (
              causal4d_provider_manifest,
          )

          revision = os.environ["BPT_SOURCE_SHA"]
          manifests = {
              "provider-v2-manifest.json": causal4d_provider_manifest(
                  provider_revision=revision
              ),
              "belief-provider-v1-manifest.json": (
                  causal4d_belief_provider_manifest(provider_revision=revision)
              ),
              "belief-provider-v2-manifest.json": (
                  causal4d_belief_provider_v2_manifest(
                      provider_revision=revision
                  )
              ),
          }
          for filename, payload in manifests.items():
              Path(filename).write_text(
                  json.dumps(payload, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Upload locked compatibility evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: versioned-provider-manifests
          path: |
            bayesian-phystwin/provider-v2-manifest.json
            bayesian-phystwin/belief-provider-v1-manifest.json
            bayesian-phystwin/belief-provider-v2-manifest.json
            bayesian-phystwin/ecosystem-compatibility.json
          if-no-files-found: error
          retention-days: 14

      - name: Record selected compatibility boundary
        shell: bash
        run: |
          {
            echo "### Causal4D compatibility boundary"
            echo
            echo "- selected ref: \`${{ needs.resolve-lock.outputs.causal4d_ref }}\`"
            echo "- committed locked ref: \`${{ needs.resolve-lock.outputs.locked_causal4d_ref }}\`"
            echo "- exact lock enforced: \`${{ needs.resolve-lock.outputs.lock_enforced }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Fail on provider quality diagnostics
        if: steps.ruff.outcome == 'failure' || steps.mypy.outcome == 'failure'
        run: exit 1

  latest-main-canary:
    name: Latest Causal4D main canary
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_latest_main_canary)
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact Bayesian-PhysTwin source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BPT_SOURCE_SHA }}
          path: bayesian-phystwin
          fetch-depth: 1
          persist-credentials: false

      - name: Check out latest Causal4D main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/Causal4D
          ref: main
          path: causal4d
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            bayesian-phystwin/pyproject.toml
            causal4d/pyproject.toml

      - name: Install both repositories
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./bayesian-phystwin[dev,graph]" opencv-python-headless
          python -m pip install -e "./causal4d[dev]"

      - name: Run latest-main provider compatibility tests
        env:
          CAUSAL4D_REQUIRE_BPT_PROVIDER: "1"
        shell: bash
        run: |
          tests=(
            bayesian-phystwin/tests/test_causal4d_provider_v1.py
            bayesian-phystwin/tests/test_causal4d_provider_v2.py
            bayesian-phystwin/tests/test_endpoint_model_average.py
            causal4d/tests/test_causal4d_provider_contract.py
            causal4d/tests/test_causal4d_bpt_belief.py
            causal4d/tests/test_causal4d_phystwin_backend.py
          )
          if [[ -f causal4d/tests/test_bpt_provider_import_boundary.py ]]; then
            tests+=(causal4d/tests/test_bpt_provider_import_boundary.py)
          fi
          if [[ -f causal4d/tests/test_bpt_provider_integration.py ]]; then
            tests+=(causal4d/tests/test_bpt_provider_integration.py)
          fi
          python -m pytest -q "${tests[@]}"

      - name: Record canary package compatibility
        working-directory: bayesian-phystwin
        shell: bash
        run: |
          set -euo pipefail
          bpt ecosystem validate \
            --json \
            --output-json latest-main-ecosystem-compatibility.json
          {
            echo "### Latest-main canary"
            echo
            echo "Causal4D revision: \`$(git -C ../causal4d rev-parse HEAD)\`"
            echo
            echo "This lane is advisory and does not replace the committed lock."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload latest-main canary report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: latest-main-compatibility-canary
          path: bayesian-phystwin/latest-main-ecosystem-compatibility.json
          if-no-files-found: warn
          retention-days: 7
