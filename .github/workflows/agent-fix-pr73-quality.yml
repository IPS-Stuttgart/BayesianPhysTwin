name: Fix PR 73 quality gates

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/validate-prob4d-provider-v2-attestation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Add focused attestation coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_prob4d_causal_lineage.py")
          text = path.read_text(encoding="utf-8")
          old_import = '''from bayesian_phystwin.prob4d_provider_attestation import (
              compute_prob4d_provider_manifest_id,
          )
          '''
          new_import = '''from bayesian_phystwin.prob4d_provider_attestation import (
              compute_prob4d_provider_manifest_id,
              validate_prob4d_provider_attestation,
          )
          '''
          if text.count(old_import) != 1:
              raise SystemExit("unexpected attestation import block")
          text = text.replace(old_import, new_import, 1)

          marker = "def test_exploratory_provider_v2_attestation_is_valid_but_not_claim_bearing"
          if marker in text:
              raise SystemExit("focused attestation tests already exist")
          text += '''


          def test_exploratory_provider_v2_attestation_is_valid_but_not_claim_bearing() -> None:
              attestation = _provider_attestation()
              attestation.update(
                  export_mode="exploratory",
                  claim_bearing=False,
                  calibration_compatibility_validated=False,
                  calibration_artifact_ids={
                      "gauge_artifact_id": None,
                      "point_artifact_id": None,
                  },
                  covariance_root_mode="legacy_eigenvectors",
                  composition_jacobian_mode="legacy_finite_difference",
                  runtime_revision={
                      "expected_revision": "d" * 40,
                      "observed_revision": None,
                      "source": "unavailable",
                      "clean_checkout": None,
                      "matched": False,
                      "independently_verified": False,
                  },
              )

              validated = validate_prob4d_provider_attestation(
                  attestation,
                  source_revision="d" * 40,
              )

              assert validated["claim_bearing"] is False
              assert validated["calibration_artifact_ids"] == {
                  "gauge_artifact_id": None,
                  "point_artifact_id": None,
              }
              assert validated["runtime_revision"]["source"] == "unavailable"


          def test_provider_attestation_rejects_nonfinite_json() -> None:
              attestation = _provider_attestation()
              attestation["provider_manifest"]["metadata"]["nonfinite"] = float("nan")

              with pytest.raises(ValueError, match="finite JSON data"):
                  validate_prob4d_provider_attestation(
                      attestation,
                      source_revision="d" * 40,
                  )


          def test_prob4d_causal_lineage_rejects_nonmapping_attestation() -> None:
              belief = _belief()
              metadata = deepcopy(dict(belief.metadata))
              metadata["prob4d_provider_attestation"] = "not-a-mapping"

              with pytest.raises(ValueError, match="attestation must be a mapping"):
                  validate_prob4d_causal_observation_belief(
                      replace(belief, metadata=metadata)
                  )
          '''
          path.write_text(text, encoding="utf-8")
          PY

      - name: Format and validate the repair
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff check --fix \
            src/bayesian_phystwin/prob4d_causal_lineage.py \
            tests/test_prob4d_causal_lineage.py
          python -m ruff format \
            src/bayesian_phystwin/prob4d_causal_lineage.py \
            tests/test_prob4d_causal_lineage.py
          python -m ruff check \
            src/bayesian_phystwin/prob4d_causal_lineage.py \
            tests/test_prob4d_causal_lineage.py
          python -m ruff format --check \
            src/bayesian_phystwin/prob4d_causal_lineage.py \
            tests/test_prob4d_causal_lineage.py
          python -m pytest -q tests/test_prob4d_causal_lineage.py

      - name: Commit product-only quality repair
        run: |
          set -euo pipefail
          rm .github/workflows/agent-fix-pr73-quality.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Cover exploratory Prob4D attestations"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
