name: Agent cover v2 replay touch

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/fixed-anchor-provider-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Add replay regression coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_causal4d_provider_v1.py")
          text = path.read_text(encoding="utf-8")
          import_anchor = (
              "import bayesian_phystwin.causal4d_provider_v1 as provider_api\n"
              "from bayesian_phystwin.causal4d_belief_provider_v1 import (\n"
          )
          import_replacement = (
              "import bayesian_phystwin.causal4d_provider_v1 as provider_api\n"
              "import bayesian_phystwin.phystwin.replay as replay_v2\n"
              "from bayesian_phystwin.causal4d_belief_provider_v1 import (\n"
          )
          if text.count(import_anchor) != 1:
              raise SystemExit("unexpected provider import block")
          text = text.replace(import_anchor, import_replacement, 1)

          contract_anchor = (
              "from bayesian_phystwin.phystwin_bayesian_anchor import "
              "robust_random_walk_endpoint\n"
          )
          contract_replacement = (
              "from bayesian_phystwin.contracts.replay import InitialReplayRequestV1\n"
              "from bayesian_phystwin.phystwin.replay import "
              "OfficialPhysTwinReplayProviderV2\n"
              + contract_anchor
          )
          if text.count(contract_anchor) != 1:
              raise SystemExit("unexpected replay import anchor")
          text = text.replace(contract_anchor, contract_replacement, 1)

          marker = "\n\ndef test_factory_hides_simulator_initialization"
          if text.count(marker) != 1:
              raise SystemExit("unexpected test insertion marker")
          test = '''

          def test_v2_adapter_executes_explicit_initial_request(
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              simulator = _FakeSimulator()
              torch = _FakeTorch()
              warp = _FakeWarp()
              adapter = OfficialPhysTwinReplayProviderV2(
                  simulator,
                  torch,
                  warp,
                  device="cpu",
                  frame_dt_s=0.03,
                  simulator_configuration_id="config-v1",
                  released_initial_state_id="released-v1",
              )
              monkeypatch.setattr(
                  replay_v2,
                  "_rollout_initial_trajectory",
                  lambda simulator_arg, wp_arg, *, frame_count: (
                      np.zeros((frame_count, 2, 3), dtype=np.float32),
                      np.ones((frame_count, 2, 3), dtype=np.float32),
                  ),
              )
              controls = np.arange(12, dtype=np.float32).reshape(4, 1, 3)
              common = {
                  "request_id": "request-v1",
                  "simulator_configuration_id": "config-v1",
                  "group_log_scales": np.asarray((0.2, -0.1)),
                  "controller_points_m": controls,
                  "frame_count": 3,
              }

              with pytest.raises(ValueError, match="released state"):
                  adapter.replay(
                      InitialReplayRequestV1(
                          initial_state_id="wrong-state",
                          **common,
                      )
                  )

              trajectory = adapter.replay(
                  InitialReplayRequestV1(
                      initial_state_id="released-v1",
                      **common,
                  )
              )
              np.testing.assert_allclose(
                  simulator.group_log_scale_tensor.values,
                  (0.2, -0.1),
              )
              np.testing.assert_allclose(simulator.controller_points.values, controls)
              np.testing.assert_array_equal(trajectory.frame_ids, np.arange(3))
              assert trajectory.positions_m.shape == trajectory.velocities_mps.shape == (
                  3,
                  2,
                  3,
              )
              assert warp.synchronize_calls == 2
              adapter.close()
          '''
          text = text.replace(marker, test + marker, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Format and validate focused provider tests
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff check --fix tests/test_causal4d_provider_v1.py
          python -m ruff format tests/test_causal4d_provider_v1.py
          python -m ruff check tests/test_causal4d_provider_v1.py
          python -m ruff format --check tests/test_causal4d_provider_v1.py
          python -m pytest -q tests/test_causal4d_provider_v1.py

      - name: Commit product-only coverage repair
        run: |
          set -euo pipefail
          rm .github/workflows/agent-cover-v2-replay-touch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Cover explicit provider-v2 replay requests"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
