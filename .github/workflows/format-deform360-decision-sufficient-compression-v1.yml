# workflow-lifecycle: temporary
# workflow-owner: IPS-Stuttgart maintainers
name: Format Deform360 decision-sufficient compression v1

on:
  push:
    branches: [science/deform360-decision-sufficient-compression-v1]
    paths:
      - ".github/requests/format-deform360-decision-sufficient-compression-v1.json"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Authorize one add-only formatter request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          test "${PUSH_FORCED}" = false
          test "${BEFORE_SHA}" != 0000000000000000000000000000000000000000
          mapfile -t changed < <(git diff --name-status "${BEFORE_SHA}" "${GITHUB_SHA}")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = \
            $'A\t.github/requests/format-deform360-decision-sufficient-compression-v1.json'
      - name: Apply exact formatter and validate contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install numpy==1.26.4 pytest ruff==0.14.14
          cp \
            tests/test_deform360_decision_sufficient_compression_v1_fixed.py \
            tests/test_deform360_decision_sufficient_compression_v1.py
          rm tests/test_deform360_decision_sufficient_compression_v1_fixed.py
          python -m ruff check --fix \
            scripts/science/run_deform360_decision_sufficient_compression_v1.py \
            tests/test_deform360_decision_sufficient_compression_v1.py
          python -m ruff format \
            scripts/science/run_deform360_decision_sufficient_compression_v1.py \
            tests/test_deform360_decision_sufficient_compression_v1.py
          python -m ruff check \
            scripts/science/run_deform360_decision_sufficient_compression_v1.py \
            tests/test_deform360_decision_sufficient_compression_v1.py
          python -m ruff format --check \
            scripts/science/run_deform360_decision_sufficient_compression_v1.py \
            tests/test_deform360_decision_sufficient_compression_v1.py
          python -m pytest -q \
            tests/test_deform360_decision_sufficient_compression_v1.py
          python scripts/science/run_deform360_decision_sufficient_compression_v1.py \
            --self-test
          python -m json.tool \
            protocols/deform360_decision_sufficient_compression_v1.json >/dev/null
      - name: Commit formatted study and retire formatter
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/requests/format-deform360-decision-sufficient-compression-v1.json \
            .github/workflows/format-deform360-decision-sufficient-compression-v1.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Format decision-sufficient compression study"
          git push origin HEAD:science/deform360-decision-sufficient-compression-v1
