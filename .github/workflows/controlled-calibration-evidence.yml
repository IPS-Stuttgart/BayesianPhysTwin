name: Controlled calibration scientific evidence

on:
  workflow_dispatch:
    inputs:
      study:
        description: Frozen target-free calibration study to execute
        required: true
        default: all
        type: choice
        options:
          - all
          - simulation-based-calibration
          - synthetic-benchmark-sbc
      verify_replay:
        description: Re-run the selected study and require byte-identical result JSON
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: controlled-calibration-evidence-${{ github.ref }}-${{ inputs.study }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  simulation-based-calibration:
    name: Frozen simulation-based calibration v1
    if: >-
      github.ref == 'refs/heads/main' &&
      (inputs.study == 'all' || inputs.study == 'simulation-based-calibration')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out exact reviewed main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Provision Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build and install the exact source wheel
        shell: bash
        run: |
          set -euo pipefail
          out="outputs/controlled-calibration-evidence/simulation-based-calibration"
          mkdir -p "${out}/wheels" "${out}/primary"
          python -m pip install --upgrade pip
          python -m pip wheel --no-deps --wheel-dir "${out}/wheels" .
          mapfile -t wheels < <(find "${out}/wheels" -maxdepth 1 -name '*.whl' -print)
          test "${#wheels[@]}" -eq 1
          python -m venv .controlled-calibration-venv
          .controlled-calibration-venv/bin/python -m pip install "${wheels[0]}"
          .controlled-calibration-venv/bin/python -m pip check
          sha256sum "${wheels[0]}" | tee "${out}/wheel-sha256.txt"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            git status --porcelain=v1
            .controlled-calibration-venv/bin/python -VV
            .controlled-calibration-venv/bin/python -m pip freeze --all
            uname -a
          } > "${out}/environment.txt"

      - name: Execute the frozen registered study
        shell: bash
        run: |
          set -uo pipefail
          out="outputs/controlled-calibration-evidence/simulation-based-calibration"
          printf '%s\n' \
            '.controlled-calibration-venv/bin/python scripts/science/run_simulation_based_calibration_v1.py --protocol protocols/locks/simulation_based_calibration_v1.json --output primary/result.json --summary-output primary/summary.json --require-registered-decision' \
            > "${out}/command.txt"
          set +e
          .controlled-calibration-venv/bin/python \
            scripts/science/run_simulation_based_calibration_v1.py \
            --protocol protocols/locks/simulation_based_calibration_v1.json \
            --output "${out}/primary/result.json" \
            --summary-output "${out}/primary/summary.json" \
            --require-registered-decision \
            2>&1 | tee "${out}/run.log"
          status="${PIPESTATUS[0]}"
          set -e
          printf '%s\n' "${status}" > "${out}/exit-code.txt"

      - name: Verify deterministic replay
        if: inputs.verify_replay
        shell: bash
        run: |
          set -uo pipefail
          out="outputs/controlled-calibration-evidence/simulation-based-calibration"
          mkdir -p "${out}/replay"
          set +e
          .controlled-calibration-venv/bin/python \
            scripts/science/run_simulation_based_calibration_v1.py \
            --protocol protocols/locks/simulation_based_calibration_v1.json \
            --output "${out}/replay/result.json" \
            --summary-output "${out}/replay/summary.json" \
            --require-registered-decision \
            2>&1 | tee "${out}/replay.log"
          status="${PIPESTATUS[0]}"
          set -e
          if [[ "${status}" -eq 0 && "$(cat "${out}/exit-code.txt")" -eq 0 ]]; then
            cmp "${out}/primary/result.json" "${out}/replay/result.json"
            cmp "${out}/primary/summary.json" "${out}/replay/summary.json"
          fi
          printf '%s\n' "${status}" > "${out}/replay-exit-code.txt"

      - name: Build content-addressed evidence manifest
        if: always()
        env:
          VERIFY_REPLAY: ${{ inputs.verify_replay }}
        shell: bash
        run: |
          set -euo pipefail
          .controlled-calibration-venv/bin/python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(
              "outputs/controlled-calibration-evidence/"
              "simulation-based-calibration"
          )
          files = []
          for path in sorted(root.rglob("*")):
              if not path.is_file() or path.name == "manifest.json":
                  continue
              payload = path.read_bytes()
              files.append(
                  {
                      "path": path.relative_to(root).as_posix(),
                      "bytes": len(payload),
                      "sha256": hashlib.sha256(payload).hexdigest(),
                  }
              )
          manifest = {
              "schema_version": 1,
              "artifact_kind": "ControlledScientificEvidenceManifest",
              "study": "simulation-based-calibration-v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit": os.environ["GITHUB_SHA"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "registered_protocol": (
                  "protocols/locks/simulation_based_calibration_v1.json"
              ),
              "verify_replay": os.environ["VERIFY_REPLAY"] == "true",
              "target_outcomes_used": False,
              "deform360_confirmation_opened": False,
              "causal4d_physical_outcome_used": False,
              "files": files,
              "claim_boundary": (
                  "Controlled synthetic calibration evidence only. A passing "
                  "decision does not establish real-data calibration, physical "
                  "identification, provider competence, Causal4D intervention "
                  "benefit, deployment safety, or state of the art."
              ),
          }
          canonical = json.dumps(
              manifest,
              sort_keys=True,
              separators=(",", ":"),
              allow_nan=False,
          ).encode("utf-8")
          manifest["manifest_id"] = hashlib.sha256(canonical).hexdigest()
          (root / "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True, allow_nan=False)
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload retained evidence bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: simulation-based-calibration-v1-${{ github.run_id }}
          path: outputs/controlled-calibration-evidence/simulation-based-calibration
          if-no-files-found: error
          retention-days: 90

      - name: Enforce the registered decision and replay gate
        env:
          VERIFY_REPLAY: ${{ inputs.verify_replay }}
        shell: bash
        run: |
          set -euo pipefail
          out="outputs/controlled-calibration-evidence/simulation-based-calibration"
          test "$(cat "${out}/exit-code.txt")" -eq 0
          if [[ "${VERIFY_REPLAY}" == "true" ]]; then
            test "$(cat "${out}/replay-exit-code.txt")" -eq 0
          fi

  synthetic-benchmark-sbc:
    name: End-to-end synthetic benchmark SBC v1
    if: >-
      github.ref == 'refs/heads/main' &&
      (inputs.study == 'all' || inputs.study == 'synthetic-benchmark-sbc')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out exact reviewed main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Provision Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build and install the exact source wheel
        shell: bash
        run: |
          set -euo pipefail
          out="outputs/controlled-calibration-evidence/synthetic-benchmark-sbc"
          mkdir -p "${out}/wheels" "${out}/primary"
          python -m pip install --upgrade pip
          python -m pip wheel --no-deps --wheel-dir "${out}/wheels" .
          mapfile -t wheels < <(find "${out}/wheels" -maxdepth 1 -name '*.whl' -print)
          test "${#wheels[@]}" -eq 1
          python -m venv .synthetic-sbc-venv
          .synthetic-sbc-venv/bin/python -m pip install "${wheels[0]}"
          .synthetic-sbc-venv/bin/python -m pip check
          sha256sum "${wheels[0]}" | tee "${out}/wheel-sha256.txt"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            git status --porcelain=v1
            .synthetic-sbc-venv/bin/python -VV
            .synthetic-sbc-venv/bin/python -m pip freeze --all
            uname -a
          } > "${out}/environment.txt"

      - name: Execute the frozen end-to-end study
        shell: bash
        run: |
          set -uo pipefail
          out="outputs/controlled-calibration-evidence/synthetic-benchmark-sbc"
          printf '%s\n' \
            '.synthetic-sbc-venv/bin/python scripts/science/run_synthetic_benchmark_sbc_v1.py --replicates 512 --seed 20260824 --bins 10 --likelihood-scale-multipliers 1,0.5,2 --output primary/result.json' \
            > "${out}/command.txt"
          set +e
          .synthetic-sbc-venv/bin/python \
            scripts/science/run_synthetic_benchmark_sbc_v1.py \
            --replicates 512 \
            --seed 20260824 \
            --bins 10 \
            --likelihood-scale-multipliers 1,0.5,2 \
            --output "${out}/primary/result.json" \
            2>&1 | tee "${out}/run.log"
          status="${PIPESTATUS[0]}"
          set -e
          printf '%s\n' "${status}" > "${out}/runner-exit-code.txt"

      - name: Evaluate the registered normative controls
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          out="outputs/controlled-calibration-evidence/synthetic-benchmark-sbc"
          set +e
          .synthetic-sbc-venv/bin/python - <<'PY' \
            2>&1 | tee "${out}/validation.log"
          import json
          from pathlib import Path

          root = Path(
              "outputs/controlled-calibration-evidence/synthetic-benchmark-sbc"
          )
          result_path = root / "primary" / "result.json"
          validation = {
              "schema_version": 1,
              "artifact_kind": "SyntheticBenchmarkSBCDecision",
              "result_present": result_path.is_file(),
              "matched_has_smallest_mean_ks": False,
              "matched_has_smallest_90_coverage_error": False,
              "decision": "runner_failed_before_decision",
          }
          if result_path.is_file():
              result = json.loads(result_path.read_text(encoding="utf-8"))
              separation = result["normative_control_separation"]
              validation["matched_has_smallest_mean_ks"] = bool(
                  separation["matched_has_smallest_mean_ks"]
              )
              validation["matched_has_smallest_90_coverage_error"] = bool(
                  separation["matched_has_smallest_90_coverage_error"]
              )
              passed = (
                  validation["matched_has_smallest_mean_ks"]
                  and validation["matched_has_smallest_90_coverage_error"]
              )
              validation["decision"] = (
                  "matched-posterior-separated-from-dispersion-controls"
                  if passed
                  else "normative-control-separation-not-established"
              )
              validation["result_id"] = result["result_id"]
          else:
              passed = False
          (root / "validation.json").write_text(
              json.dumps(validation, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(validation, indent=2, sort_keys=True))
          raise SystemExit(0 if passed else 3)
          PY
          status="${PIPESTATUS[0]}"
          set -e
          printf '%s\n' "${status}" > "${out}/validation-exit-code.txt"

      - name: Verify deterministic replay
        if: inputs.verify_replay
        shell: bash
        run: |
          set -uo pipefail
          out="outputs/controlled-calibration-evidence/synthetic-benchmark-sbc"
          mkdir -p "${out}/replay"
          set +e
          .synthetic-sbc-venv/bin/python \
            scripts/science/run_synthetic_benchmark_sbc_v1.py \
            --replicates 512 \
            --seed 20260824 \
            --bins 10 \
            --likelihood-scale-multipliers 1,0.5,2 \
            --output "${out}/replay/result.json" \
            2>&1 | tee "${out}/replay.log"
          status="${PIPESTATUS[0]}"
          set -e
          if [[ "${status}" -eq 0 && "$(cat "${out}/runner-exit-code.txt")" -eq 0 ]]; then
            cmp "${out}/primary/result.json" "${out}/replay/result.json"
          fi
          printf '%s\n' "${status}" > "${out}/replay-exit-code.txt"

      - name: Build content-addressed evidence manifest
        if: always()
        env:
          VERIFY_REPLAY: ${{ inputs.verify_replay }}
        shell: bash
        run: |
          set -euo pipefail
          .synthetic-sbc-venv/bin/python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(
              "outputs/controlled-calibration-evidence/synthetic-benchmark-sbc"
          )
          files = []
          for path in sorted(root.rglob("*")):
              if not path.is_file() or path.name == "manifest.json":
                  continue
              payload = path.read_bytes()
              files.append(
                  {
                      "path": path.relative_to(root).as_posix(),
                      "bytes": len(payload),
                      "sha256": hashlib.sha256(payload).hexdigest(),
                  }
              )
          manifest = {
              "schema_version": 1,
              "artifact_kind": "ControlledScientificEvidenceManifest",
              "study": "synthetic-benchmark-sbc-v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit": os.environ["GITHUB_SHA"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "replicate_count": 512,
              "root_seed": 20260824,
              "likelihood_scale_multipliers": [1.0, 0.5, 2.0],
              "verify_replay": os.environ["VERIFY_REPLAY"] == "true",
              "target_outcomes_used": False,
              "deform360_confirmation_opened": False,
              "causal4d_physical_outcome_used": False,
              "files": files,
              "claim_boundary": (
                  "End-to-end controlled synthetic posterior evidence only. "
                  "It does not establish simulator adequacy, real calibration, "
                  "physical identifiability, provider competence, intervention "
                  "benefit, deployment safety, or state of the art."
              ),
          }
          canonical = json.dumps(
              manifest,
              sort_keys=True,
              separators=(",", ":"),
              allow_nan=False,
          ).encode("utf-8")
          manifest["manifest_id"] = hashlib.sha256(canonical).hexdigest()
          (root / "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True, allow_nan=False)
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload retained evidence bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: synthetic-benchmark-sbc-v1-${{ github.run_id }}
          path: outputs/controlled-calibration-evidence/synthetic-benchmark-sbc
          if-no-files-found: error
          retention-days: 90

      - name: Enforce registered controls and replay gate
        env:
          VERIFY_REPLAY: ${{ inputs.verify_replay }}
        shell: bash
        run: |
          set -euo pipefail
          out="outputs/controlled-calibration-evidence/synthetic-benchmark-sbc"
          test "$(cat "${out}/runner-exit-code.txt")" -eq 0
          test "$(cat "${out}/validation-exit-code.txt")" -eq 0
          if [[ "${VERIFY_REPLAY}" == "true" ]]; then
            test "$(cat "${out}/replay-exit-code.txt")" -eq 0
          fi
