name: Restore PR 29 provider v1 compatibility file

on:
  push:
    branches: [agent/owned-phystwin-provider-v2]
    paths:
      - ".github/workflows/restore-pr29-provider-v1.yml"

permissions:
  contents: write

concurrency:
  group: restore-pr29-provider-v1
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/owned-phystwin-provider-v2
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Restore known-good provider and apply audited edits
        shell: bash
        run: |
          git show eb4649ad8ea2154fd0bec1c0db20f7440e8ca03e:src/bayesian_phystwin/causal4d_provider_v1.py \
            > src/bayesian_phystwin/causal4d_provider_v1.py
          python - <<'PY'
          from pathlib import Path

          provider = Path("src/bayesian_phystwin/causal4d_provider_v1.py")
          text = provider.read_text(encoding="utf-8")
          old = '''from .phystwin.replay import (
              _rollout_initial_trajectory,
              _rollout_restart_trajectory,
              _state_numpy as _owned_state_numpy,
          )
          '''
          new = '''from .phystwin.replay import (
              _rollout_initial_trajectory,
              _rollout_restart_trajectory,
          )
          from .phystwin.replay import (
              _state_numpy as _owned_state_numpy,
          )
          '''
          if old not in text:
              raise SystemExit("known provider import block not found")
          provider.write_text(text.replace(old, new, 1), encoding="utf-8")

          workflow = Path(".github/workflows/causal4d-provider-compatibility.yml")
          text = workflow.read_text(encoding="utf-8")
          old_mypy = "          python -m mypy \\\n"
          new_mypy = "          python -m mypy --python-version 3.12 \\\n"
          if new_mypy not in text:
              if old_mypy not in text:
                  raise SystemExit("provider mypy invocation not found")
              workflow.write_text(text.replace(old_mypy, new_mypy, 1), encoding="utf-8")
          PY
          test "$(wc -l < src/bayesian_phystwin/causal4d_provider_v1.py)" -ge 390
      - name: Validate restored provider surface
        shell: bash
        run: |
          python -m pip install -e ".[dev,graph]" opencv-python-headless
          python -m compileall -q src/bayesian_phystwin/causal4d_provider_v1.py
          python -m ruff check \
            src/bayesian_phystwin/contracts \
            src/bayesian_phystwin/phystwin \
            src/bayesian_phystwin/causal4d_provider_v1.py \
            src/bayesian_phystwin/causal4d_provider_v2.py \
            tests/test_causal4d_provider_v2.py
          python -m mypy --python-version 3.12 \
            src/bayesian_phystwin/contracts \
            src/bayesian_phystwin/phystwin \
            src/bayesian_phystwin/causal4d_provider_v1.py \
            src/bayesian_phystwin/causal4d_provider_v2.py
          python -m pytest -q \
            tests/test_causal4d_provider_v1.py \
            tests/test_causal4d_provider_v2.py
          git diff --check
      - name: Commit exact restoration
        shell: bash
        run: |
          rm .github/workflows/restore-pr29-provider-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore provider v1 compatibility surface"
          git push origin HEAD:agent/owned-phystwin-provider-v2
