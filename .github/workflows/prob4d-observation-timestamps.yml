name: Prob4D observation timestamp consumer

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/prob4d-observation-timestamps.yml"
      - "src/bayesian_phystwin/prob4d_observation_timestamps.py"
      - "src/bayesian_phystwin/prob4d_observation_timestamp_admission.py"
      - "tests/test_prob4d_observation_timestamps.py"
      - "tests/test_prob4d_observation_timestamp_admission.py"
      - "tests/test_prob4d_observation_timestamps_crossrepo.py"
      - "tests/test_prob4d_observation_timestamps_causal4d.py"
      - "docs/prob4d_observation_timestamps.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prob4d-observation-timestamps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROB4D_TIMESTAMP_PRODUCER_REVISION: 34b74302383ecf91c46c4d7a32e2bd22260ad7ed
  CAUSAL4D_CLOCK_PRIOR_REVISION: 183045f4a1085bd37221eb2294181f43ca629de0
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  contracts:
    name: Exact timestamp lineage, covariance separation, and producer parity
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact reviewed BayesianPhysTwin revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Check out exact Prob4D timestamp producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/Prob4D
          ref: ${{ env.PROB4D_TIMESTAMP_PRODUCER_REVISION }}
          path: _external/prob4d
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Check out exact Causal4D clock-prior producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/Causal4D
          ref: ${{ env.CAUSAL4D_CLOCK_PRIOR_REVISION }}
          path: _external/causal4d
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Resolve isolated validation paths
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/prob4d-observation-timestamps-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "${root}"
          mkdir -p "${root}"
          {
            echo "TIMESTAMP_RUN_ROOT=${root}"
            echo "TIMESTAMP_VENV=${root}/venv"
          } >> "${GITHUB_ENV}"

      - name: Provision Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Create an isolated producer-consumer environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "${TIMESTAMP_VENV}"
          echo "${TIMESTAMP_VENV}/bin" >> "${GITHUB_PATH}"
          "${TIMESTAMP_VENV}/bin/python" -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1"
          "${TIMESTAMP_VENV}/bin/python" -m pip install -e ".[dev]"
          "${TIMESTAMP_VENV}/bin/python" -m pip install -e ./_external/prob4d
          "${TIMESTAMP_VENV}/bin/python" -m pip install \
            -e ./_external/causal4d --no-deps
          "${TIMESTAMP_VENV}/bin/python" -m pip check

      - name: Record exact environment and source identities
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "revision=$(git rev-parse HEAD)"
            echo "prob4d_revision=$(git -C _external/prob4d rev-parse HEAD)"
            echo "causal4d_revision=$(git -C _external/causal4d rev-parse HEAD)"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            python --version
            python -m pip --version
            python -m pip freeze --all
          } | tee "${TIMESTAMP_RUN_ROOT}/environment.txt"
          test "$(git -C _external/prob4d rev-parse HEAD)" = \
            "${PROB4D_TIMESTAMP_PRODUCER_REVISION}"
          test "$(git -C _external/causal4d rev-parse HEAD)" = \
            "${CAUSAL4D_CLOCK_PRIOR_REVISION}"
          test -z "$(git -C _external/prob4d status --porcelain=v1)"
          test -z "$(git -C _external/causal4d status --porcelain=v1)"

      - name: Check focused source quality
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check \
            src/bayesian_phystwin/prob4d_observation_timestamps.py \
            src/bayesian_phystwin/prob4d_observation_timestamp_admission.py \
            tests/test_prob4d_observation_timestamps.py \
            tests/test_prob4d_observation_timestamp_admission.py \
            tests/test_prob4d_observation_timestamps_crossrepo.py \
            tests/test_prob4d_observation_timestamps_causal4d.py
          python -m ruff format --check \
            src/bayesian_phystwin/prob4d_observation_timestamps.py \
            src/bayesian_phystwin/prob4d_observation_timestamp_admission.py \
            tests/test_prob4d_observation_timestamps.py \
            tests/test_prob4d_observation_timestamp_admission.py \
            tests/test_prob4d_observation_timestamps_crossrepo.py \
            tests/test_prob4d_observation_timestamps_causal4d.py
          python -m mypy \
            src/bayesian_phystwin/prob4d_observation_timestamps.py \
            src/bayesian_phystwin/prob4d_observation_timestamp_admission.py

      - name: Run focused, adjacent, and producer-parity contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -p no:cacheprovider \
            tests/test_prob4d_observation_timestamps.py \
            tests/test_prob4d_observation_timestamp_admission.py \
            tests/test_prob4d_observation_timestamps_crossrepo.py \
            tests/test_prob4d_observation_timestamps_causal4d.py \
            tests/test_observation_timing_nuisance.py \
            tests/test_observation_timing_interchange.py \
            tests/test_observation_belief.py \
            | tee "${TIMESTAMP_RUN_ROOT}/pytest.txt"
          python -m py_compile \
            src/bayesian_phystwin/prob4d_observation_timestamps.py \
            src/bayesian_phystwin/prob4d_observation_timestamp_admission.py \
            tests/test_prob4d_observation_timestamps.py \
            tests/test_prob4d_observation_timestamp_admission.py \
            tests/test_prob4d_observation_timestamps_crossrepo.py \
            tests/test_prob4d_observation_timestamps_causal4d.py

      - name: Verify exact read-only repository state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _external
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"

      - name: Upload compact validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prob4d-observation-timestamps-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.TIMESTAMP_RUN_ROOT }}/environment.txt
            ${{ env.TIMESTAMP_RUN_ROOT }}/pytest.txt
          if-no-files-found: warn
          retention-days: 30
