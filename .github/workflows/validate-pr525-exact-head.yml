name: Validate PR 525 exact head

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validate-pr525-exact-head.yml"

permissions:
  contents: read

concurrency:
  group: validate-pr525-exact-head
  cancel-in-progress: true

jobs:
  validate:
    if: github.head_ref == 'agent/validate-pr525-exact-head'
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 20
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dcb89d89b3099d5ab7d559ecef4893a4ace08d63
          fetch-depth: 2
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Create isolated validation environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/pr525-validation-venv"
          "$RUNNER_TEMP/pr525-validation-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/pr525-validation-venv/bin/python" -m pip install -e ".[dev]"
          "$RUNNER_TEMP/pr525-validation-venv/bin/python" -m pip check
          "$RUNNER_TEMP/pr525-validation-venv/bin/python" -m pre_commit validate-config \
            .pre-commit-config.yaml

      - name: Validate exact revision and changed-source gates
        shell: bash
        run: |
          set -euo pipefail
          python="$RUNNER_TEMP/pr525-validation-venv/bin/python"
          test "$(git rev-parse HEAD)" = "dcb89d89b3099d5ab7d559ecef4893a4ace08d63"
          test "$(git rev-parse HEAD^)" = "52c8e0e897b0c1e28b4d25b9ac9a1a6984d71689"
          "$python" scripts/ci/check_changed_python.py \
            --base 52c8e0e897b0c1e28b4d25b9ac9a1a6984d71689 \
            --head dcb89d89b3099d5ab7d559ecef4893a4ace08d63

      - name: Run focused regression suites
        shell: bash
        run: |
          set -euo pipefail
          python="$RUNNER_TEMP/pr525-validation-venv/bin/python"
          "$python" -m pytest -q \
            tests/test_source_competence_domain_covariance_calibration_v2.py \
            tests/test_source_competence_domain_covariance_calibration_v2_adversarial.py \
            tests/test_changed_python_preflight.py \
            tests/test_pr_ready.py
