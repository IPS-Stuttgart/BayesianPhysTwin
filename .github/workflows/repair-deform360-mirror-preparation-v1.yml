name: Repair Deform360 mirror preparation v1

on:
  push:
    branches:
      - science/deform360-query-sufficient-dependence-v1
    paths:
      - .github/requests/repair-deform360-mirror-preparation-v1.json

permissions:
  contents: write

concurrency:
  group: repair-deform360-mirror-preparation-v1
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repair request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 2
      - name: Remove expression-expanding validation and self-remove
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-status HEAD^ HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = $'A\t.github/requests/repair-deform360-mirror-preparation-v1.json'
          path=.github/workflows/prepare-deform360-query-sufficient-mirror-v1.yml
          test "$(grep -c "grep -F 'GH_TOKEN:" "${path}")" -eq 1
          sed -i "/grep -F 'GH_TOKEN:/d" "${path}"
          test "$(grep -c "grep -F 'GH_TOKEN:" "${path}" || true)" -eq 0
          git rm \
            .github/workflows/repair-deform360-mirror-preparation-v1.yml \
            .github/requests/repair-deform360-mirror-preparation-v1.json \
            .github/requests/prepare-deform360-query-sufficient-mirror-v1.json
          git add "${path}"
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Repair exact-bound mirror preparation checks"
          git push origin "HEAD:${GITHUB_REF_NAME}"
