name: Install query-probe certificate capsule

on:
  push:
    branches:
      - feature/query-probe-certificate-v2
    paths:
      - ".github/workflows/install-query-probe-certificate-v2.yml"
      - "scripts/install_query_probe_certificate_v2.py"

permissions:
  contents: write

concurrency:
  group: install-query-probe-certificate-v2
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/query-probe-certificate-v2
          persist-credentials: true
          clean: true

      - name: Update manifests and remove installer
        run: python3 scripts/install_query_probe_certificate_v2.py

      - name: Validate modified JSON
        run: |
          python3 -m json.tool .github/quality/test-suites.json >/dev/null
          python3 tools/quality/test_suite_manifest.py list stable-core-coverage \
            | grep -Fx tests/test_query_probe_certificate_v1.py
          test ! -e .github/workflows/install-query-probe-certificate-v2.yml
          test ! -e scripts/install_query_probe_certificate_v2.py

      - name: Commit durable capsule
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Register common-comparator certificate in stable-core CI"
          git push origin HEAD:feature/query-probe-certificate-v2
