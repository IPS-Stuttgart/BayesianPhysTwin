name: One-shot observed-information MyPy annotations

on:
  push:
    branches:
      - agent/observed-information-covariance-v1
    paths:
      - ".github/workflows/annotate-observed-information-once.yml"
      - "src/bayesian_phystwin/observed_information_covariance.py"

permissions:
  contents: write

concurrency:
  group: one-shot-observed-information-annotations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  annotate:
    name: Add exact FloatArray annotations
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.actor == 'FlorianPfaff'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact same-repository branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/observed-information-covariance-v1
          fetch-depth: 0
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Add only the six MyPy-required annotations
        shell: bash
        env:
          EXPECTED_EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_EVENT_SHA}"
          python -m pip install -e ".[dev]"

          python - <<'PY'
          from pathlib import Path

          path = Path("src/bayesian_phystwin/observed_information_covariance.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "    observation_precision = np.zeros(len(observation_groups), dtype=np.float64)\n":
                  "    observation_precision: FloatArray = np.zeros(\n"
                  "        len(observation_groups), dtype=np.float64\n"
                  "    )\n",
              "    observation_derivative = np.zeros(len(observation_groups), dtype=np.float64)\n":
                  "    observation_derivative: FloatArray = np.zeros(\n"
                  "        len(observation_groups), dtype=np.float64\n"
                  "    )\n",
              "    observation_row_precision = np.zeros(len(batch.innovation_m), dtype=np.float64)\n":
                  "    observation_row_precision: FloatArray = np.zeros(\n"
                  "        len(batch.innovation_m), dtype=np.float64\n"
                  "    )\n",
              "    anchor_precision = np.zeros(len(anchor_groups), dtype=np.float64)\n":
                  "    anchor_precision: FloatArray = np.zeros(\n"
                  "        len(anchor_groups), dtype=np.float64\n"
                  "    )\n",
              "    anchor_derivative = np.zeros(len(anchor_groups), dtype=np.float64)\n":
                  "    anchor_derivative: FloatArray = np.zeros(\n"
                  "        len(anchor_groups), dtype=np.float64\n"
                  "    )\n",
              "    anchor_row_precision = np.zeros(anchor_count, dtype=np.float64)\n":
                  "    anchor_row_precision: FloatArray = np.zeros(\n"
                  "        anchor_count, dtype=np.float64\n"
                  "    )\n",
          }
          changed = False
          for old, new in replacements.items():
              count = text.count(old)
              if count == 1:
                  text = text.replace(old, new)
                  changed = True
              elif count == 0 and new in text:
                  continue
              else:
                  raise SystemExit(f"unexpected replacement count {count} for {old!r}")
          if changed:
              path.write_text(text, encoding="utf-8")
          PY

          file=src/bayesian_phystwin/observed_information_covariance.py
          python -m ruff format "$file"
          python -m ruff check "$file"
          python -m mypy "$file"
          git diff --check

          mapfile -t changed < <(git diff --name-only)
          if (( ${#changed[@]} == 0 )); then
            echo "Exact branch head already has the required annotations."
            exit 0
          fi
          if (( ${#changed[@]} != 1 )) || [[ "${changed[0]}" != "$file" ]]; then
            printf 'Unexpected changed paths:\n%s\n' "${changed[*]}" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$file"
          git commit -m "Annotate observed-information working arrays"
          git push origin HEAD:refs/heads/agent/observed-information-covariance-v1
