name: Diagnose retained Deform360 visual-production failure once

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-deform360-visual-production-failure-once.yml"
      - "scripts/ci/diagnose_deform360_visual_production_failure.py"
      - "tests/test_diagnose_deform360_visual_production_failure.py"
      - "tests/test_deform360_production_failure_diagnostic_workflow.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-deform360-visual-production-failure-once.yml"

permissions:
  contents: read

concurrency:
  group: diagnose-deform360-visual-production-failure-once
  cancel-in-progress: false

env:
  FAILED_PRODUCTION_RUN_ID: "31277475724"
  FAILED_PRODUCTION_ATTEMPT_ID: 31277475724-1
  FAILED_IMPLEMENTATION_REVISION: 312d4a46545b547efcdab79d4f285473077887cf
  ADMISSION_ID: 715ab8479bad4d97eba766cdba1a161f1f6e83e3fd597bb09a2bf8ab8dc91e15
  EXPECTED_JOB_COUNT: "324"
  EXPECTED_STDERR_SHA256: 0ceb1aa1732f8efd2a75eac1c008c6afd5fc1e80349e01d3c86f09706ff52fba
  EXPECTED_STDERR_BYTES: "812"
  AUTHORIZED_RUNNER_NAME: workstation2
  VISUAL_OUTPUT_ROOT: /mnt/lexar4tb/datasets/deform360/results/bayesian-phystwin/calibration-visual-production
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  contracts:
    name: Failure-diagnostic contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact proposed source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Validate the data-free diagnostic contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          files=(
            scripts/ci/diagnose_deform360_visual_production_failure.py
            tests/test_diagnose_deform360_visual_production_failure.py
            tests/test_deform360_production_failure_diagnostic_workflow.py
          )
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy \
            scripts/ci/diagnose_deform360_visual_production_failure.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_diagnose_deform360_visual_production_failure.py \
            tests/test_deform360_production_failure_diagnostic_workflow.py
          python -m py_compile \
            scripts/ci/diagnose_deform360_visual_production_failure.py
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"

  diagnose:
    name: Verify and summarize one retained common traceback
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin'
    needs: contracts
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Check out exact reviewed main revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true
      - name: Provision complete Python 3.12 runtime
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          check-latest: false
      - name: Verify authorized runner before protected-root access
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME}" = "${AUTHORIZED_RUNNER_NAME}"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1)"
      - name: Verify all receipts and sanitize the common traceback
        shell: bash
        run: |
          set -euo pipefail
          parent="${RUNNER_TEMP}/deform360-failure-diagnostic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          diagnostic_root="${parent}/evidence"
          mkdir -p -- "${parent}"
          python scripts/ci/diagnose_deform360_visual_production_failure.py \
            --visual-output-root "${VISUAL_OUTPUT_ROOT}" \
            --admission-id "${ADMISSION_ID}" \
            --implementation-revision "${FAILED_IMPLEMENTATION_REVISION}" \
            --attempt-id "${FAILED_PRODUCTION_ATTEMPT_ID}" \
            --failed-workflow-run-id "${FAILED_PRODUCTION_RUN_ID}" \
            --expected-job-count "${EXPECTED_JOB_COUNT}" \
            --expected-stderr-sha256 "${EXPECTED_STDERR_SHA256}" \
            --expected-stderr-bytes "${EXPECTED_STDERR_BYTES}" \
            --output-dir "${diagnostic_root}"
          echo "DIAGNOSTIC_ROOT=${diagnostic_root}" >> "${GITHUB_ENV}"
      - name: Seal compact diagnostic evidence
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "${DIAGNOSTIC_ROOT}"
            sha256sum diagnostic.json sanitized-traceback.txt > SHA256SUMS
          )
      - name: Upload compact failure diagnostic
        uses: actions/upload-artifact@v7
        with:
          name: deform360-visual-production-failure-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DIAGNOSTIC_ROOT }}
          if-no-files-found: error
          retention-days: 90
      - name: Verify read-only repository state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"

# Reviewed one-shot diagnostic request: 2026-08-09-common-traceback-v2
