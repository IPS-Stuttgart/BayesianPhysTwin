name: Deform360 v6 frozen upstream history locator

on:
  pull_request:
    paths:
      - ".github/workflows/deform360-v6-frozen-upstream-history-locator.yml"
      - "scripts/ci/locate_frozen_source_bundle.py"
      - "tests/test_frozen_source_history_locator.py"
      - "src/bayesian_phystwin/deform360_bias_aware_prospective_physical.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deform360-v6-frozen-upstream-history-${{ github.ref }}
  cancel-in-progress: true

jobs:
  locate:
    name: Locate exact frozen source bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Fetch every repository ref
        run: |
          set -euo pipefail
          git fetch --force --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*'
          test "$(git rev-parse --is-shallow-repository)" = "false"

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install source-check environment
        run: |
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Validate locator implementation
        run: |
          set -euo pipefail
          files=(
            scripts/ci/locate_frozen_source_bundle.py
            tests/test_frozen_source_history_locator.py
          )
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy scripts/ci/locate_frozen_source_bundle.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_frozen_source_history_locator.py

      - name: Search complete history without data access
        run: |
          set -euo pipefail
          mkdir -p outputs/deform360-v6-frozen-upstream-history
          python scripts/ci/locate_frozen_source_bundle.py \
            --repository-root . \
            --output \
              outputs/deform360-v6-frozen-upstream-history/report.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "outputs/deform360-v6-frozen-upstream-history/report.json"
          )
          report = json.loads(path.read_text(encoding="utf-8"))
          summary = {
              key: report[key]
              for key in (
                  "report_id",
                  "candidate_commit_count",
                  "anchor_match_count",
                  "exact_match_count",
              )
          }
          print(json.dumps(summary, indent=2, sort_keys=True))
          for match in report["exact_matches"]:
              print(
                  "exact_match",
                  match["revision"],
                  ",".join(match["refs_pointing_at"]),
                  ",".join(match["containing_tags"]),
              )
          PY

      - name: Upload content-addressed diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deform360-v6-frozen-upstream-history-${{ github.run_id }}
          path: outputs/deform360-v6-frozen-upstream-history
          if-no-files-found: error
          retention-days: 30
