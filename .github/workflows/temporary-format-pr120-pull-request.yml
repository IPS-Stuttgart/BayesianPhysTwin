name: Temporary PR formatter for Deform360 study

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temporary-format-pr120-pull-request.yml

permissions:
  contents: write

concurrency:
  group: temporary-pr-format-deform360-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
          clean: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Format and verify the exact study files
        run: |
          python -m pip install "ruff==0.16.1"
          python -m ruff format \
            scripts/science/run_deform360_normalized_evidence_external.py \
            tests/test_deform360_normalized_evidence_external.py
          python -m ruff check \
            scripts/science/run_deform360_normalized_evidence_external.py \
            tests/test_deform360_normalized_evidence_external.py
          python -m ruff format --check \
            scripts/science/run_deform360_normalized_evidence_external.py \
            tests/test_deform360_normalized_evidence_external.py
      - name: Publish formatter-only changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/science/run_deform360_normalized_evidence_external.py \
            tests/test_deform360_normalized_evidence_external.py
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "Format external Deform360 evaluator"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
