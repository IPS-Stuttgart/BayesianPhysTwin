name: Reduce manifest workflow fan-out once

on:
  push:
    branches:
      - agent/reduce-manifest-workflow-fanout
    paths:
      - .github/workflows/reduce-manifest-workflow-fanout-once.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/reduce-manifest-workflow-fanout-once.yml

permissions:
  contents: write

concurrency:
  group: reduce-manifest-workflow-fanout-once
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      ((github.event_name == 'push' &&
        github.ref == 'refs/heads/agent/reduce-manifest-workflow-fanout') ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref ==
          'agent/reduce-manifest-workflow-fanout'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact cleanup branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/reduce-manifest-workflow-fanout
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Restrict global manifest validation to central workflows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflows = (
              ".github/workflows/deform360-calibration-observability-batch.yml",
              ".github/workflows/deform360-calibration-prepared-inventory.yml",
              ".github/workflows/deform360-calibration-visual-execution-admission.yml",
              ".github/workflows/deform360-calibration-visual-production.yml",
              ".github/workflows/deform360-joint-sparse-geometric-v4-contracts.yml",
              ".github/workflows/deform360-joint-sparse-observability-v4.yml",
              ".github/workflows/deform360-joint-sparse-prospective-v5-contracts.yml",
              ".github/workflows/inventory-deform360-v4-results-once.yml",
              ".github/workflows/launch-deform360-provider-failure-census-v1-once.yml",
              ".github/workflows/recursive-prob4d-stream-self-hosted.yml",
          )
          manifest_entries = {
              '- "MANIFEST.in"',
              "- 'MANIFEST.in'",
              "- MANIFEST.in",
          }
          total_removed = 0
          for relative in workflows:
              path = Path(relative)
              lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
              retained = [
                  line for line in lines if line.strip() not in manifest_entries
              ]
              removed = len(lines) - len(retained)
              if removed < 1:
                  raise SystemExit(f"no MANIFEST.in path trigger found in {relative}")
              path.write_text("".join(retained), encoding="utf-8")
              total_removed += removed
          if total_removed < len(workflows):
              raise SystemExit("manifest trigger removal count changed")

          test_path = Path("tests/test_pull_request_workflow_integrity.py")
          test_text = test_path.read_text(encoding="utf-8")
          marker = (
              "def test_global_manifest_changes_use_central_validation_only()"
          )
          if marker in test_text:
              raise SystemExit("manifest fan-out regression already exists")
          addition = r'''


def test_global_manifest_changes_use_central_validation_only() -> None:
    specialized = (
        "deform360-calibration-observability-batch.yml",
        "deform360-calibration-prepared-inventory.yml",
        "deform360-calibration-visual-execution-admission.yml",
        "deform360-calibration-visual-production.yml",
        "deform360-joint-sparse-geometric-v4-contracts.yml",
        "deform360-joint-sparse-observability-v4.yml",
        "deform360-joint-sparse-prospective-v5-contracts.yml",
        "inventory-deform360-v4-results-once.yml",
        "launch-deform360-provider-failure-census-v1-once.yml",
        "recursive-prob4d-stream-self-hosted.yml",
    )

    def event_paths(relative: str, event: str) -> tuple[str, ...]:
        workflow = _load_workflow(
            (_WORKFLOW_ROOT / relative).read_text(encoding="utf-8")
        )
        events = workflow.get("on")
        assert isinstance(events, Mapping)
        configuration = events.get(event)
        if configuration is None:
            return ()
        assert isinstance(configuration, Mapping)
        paths = configuration.get("paths")
        if paths is None:
            return ()
        if isinstance(paths, str):
            return (paths,)
        assert isinstance(paths, list)
        return tuple(str(path) for path in paths)

    for relative in specialized:
        assert "MANIFEST.in" not in event_paths(relative, "pull_request")
        assert "MANIFEST.in" not in event_paths(relative, "push")

    assert "MANIFEST.in" in event_paths("release-candidate.yml", "pull_request")
    assert event_paths("tests.yml", "pull_request") == ()
'''
          test_path.write_text(test_text.rstrip() + addition + "\n", encoding="utf-8")

          Path(
              ".github/workflows/reduce-manifest-workflow-fanout-once.yml"
          ).unlink()
          PY

      - name: Validate the focused cleanup
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff format tests/test_pull_request_workflow_integrity.py
          python -m ruff check tests/test_pull_request_workflow_integrity.py
          python -m ruff format --check \
            tests/test_pull_request_workflow_integrity.py
          python -m pytest -q \
            tests/test_pull_request_workflow_integrity.py \
            tests/test_deform360_prob4d_distribution_manifest.py \
            tests/test_evidence_decision_packaging.py
          python - <<'PY'
          from pathlib import Path

          import yaml

          for path in sorted(Path(".github/workflows").glob("*.yml")):
              yaml.safe_load(path.read_text(encoding="utf-8"))
          PY
          git diff --check

      - name: Publish the reviewable cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            .github/workflows \
            tests/test_pull_request_workflow_integrity.py
          git diff --cached --check
          git commit -m "Limit manifest-triggered workflow fan-out"
          git push origin \
            HEAD:agent/reduce-manifest-workflow-fanout
