name: Repair geometric v4 roster fixtures once

on:
  push:
    branches:
      - agent/materialize-deform360-joint-sparse-geometric-v4
    paths:
      - .github/workflows/_repair-geometric-v4-roster-fixtures-once.yml

permissions:
  contents: write

concurrency:
  group: repair-geometric-v4-roster-fixtures-once
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.ref == 'refs/heads/agent/materialize-deform360-joint-sparse-geometric-v4'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/materialize-deform360-joint-sparse-geometric-v4
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Repair fixtures, validate, and publish
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          python -m pip install -e ".[dev]"
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_deform360_joint_sparse_geometric_v4_pipeline.py")
          text = path.read_text(encoding="utf-8")
          old = '                "case_id": _sha(f"case-{index}"),\n'
          new = '''                "case_id": content_id(
                    {
                        "schema": (
                            "bayesian-phystwin."
                            "deform360-prob4d-metric-case-id-v1"
                        ),
                        "object_id": object_id,
                        "episode_id": index,
                    }
                ),
'''
          if text.count(old) != 1:
              raise SystemExit("expected exactly one legacy source-fixture case ID")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          python -m ruff format \
            src/bayesian_phystwin/deform360_joint_sparse_geometric_source_v4.py \
            tests/test_deform360_joint_sparse_geometric_v4_pipeline.py
          python -m ruff check \
            src/bayesian_phystwin/deform360_joint_sparse_geometric_source_v4.py \
            tests/test_deform360_joint_sparse_geometric_v4_pipeline.py
          python -m mypy \
            src/bayesian_phystwin/deform360_joint_sparse_geometric_source_v4.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_deform360_joint_sparse_geometric_v4.py \
            tests/test_deform360_joint_sparse_geometric_v4_pipeline.py \
            tests/test_deform360_joint_sparse_geometric_v4_end_to_end.py \
            tests/test_deform360_joint_sparse_geometric_v4_causal_coverage.py \
            tests/test_deform360_joint_sparse_geometric_v4_workflow.py \
            tests/test_deform360_joint_sparse_observability_v4.py \
            tests/test_deform360_joint_sparse_observability_v4_cli.py \
            tests/test_pull_request_workflow_integrity.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayesian_phystwin/deform360_joint_sparse_geometric_source_v4.py \
            tests/test_deform360_joint_sparse_geometric_v4_pipeline.py
          git commit -m "Align geometric v4 fixtures with roster validation"
          git push origin HEAD:agent/materialize-deform360-joint-sparse-geometric-v4
