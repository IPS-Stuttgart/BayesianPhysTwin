# workflow-lifecycle: temporary-one-shot
# workflow-owner: IPS-Stuttgart maintainers
name: Publish formatted Deform360 ICRA source to PR 815

on:
  push:
    branches: [science/deform360-icra-development-v2]
    paths:
      - ".github/requests/deform360-publish-format-to-pr-v4.json"

permissions:
  contents: write

concurrency:
  group: deform360-publish-format-to-pr-v4
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out writable PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: science/deform360-gpuserver4090-real-eval-v1
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Patch, format, test, and push PR branch
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            ruff==0.14.14 \
            autopep8==2.3.2 \
            numpy==1.26.4 \
            pytest
          files=(
            scripts/science/audit_deform360_icra_carriers_v2.py
            scripts/science/inspect_deform360_robot_tactile_alignment_v2.py
            scripts/science/run_deform360_action_conditioned_tactile_v2.py
            scripts/science/run_deform360_action_kernel_v3.py
            scripts/science/run_deform360_gpuserver4090_real_evaluation_v1.py
            scripts/science/run_deform360_reserved_confirmation_v4.py
            tests/test_deform360_gpuserver4090_real_evaluation_v1.py
          )
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "scripts/science/run_deform360_action_conditioned_tactile_v2.py"
          )
          source = path.read_text(encoding="utf-8")
          old = (
              "    except (OSError, ValueError):\n"
              "        flat = np.fromfile(path, dtype=np.float32)\n"
              "        if flat.size == 0 or flat.size % frame_size:\n"
              "            raise EvaluationError("
              "f\"unsupported tactile carrier: {path}\")\n"
          )
          new = (
              "    except (OSError, ValueError) as error:\n"
              "        flat = np.fromfile(path, dtype=np.float32)\n"
              "        if flat.size == 0 or flat.size % frame_size:\n"
              "            raise EvaluationError(\n"
              "                f\"unsupported tactile carrier: {path}\"\n"
              "            ) from error\n"
          )
          if old in source:
              source = source.replace(old, new, 1)
          elif ") from error" not in source:
              raise SystemExit("expected tactile exception block was not found")
          path.write_text(source, encoding="utf-8")
          PY
          python -m autopep8 \
            --in-place \
            --aggressive \
            --aggressive \
            --max-line-length 88 \
            scripts/science/run_deform360_action_conditioned_tactile_v2.py
          python -m ruff check --fix --unsafe-fixes "${files[@]}"
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m compileall -q \
            scripts/science \
            tests/test_deform360_gpuserver4090_real_evaluation_v1.py
          python -m pytest -q \
            tests/test_deform360_gpuserver4090_real_evaluation_v1.py
          rm -f \
            .github/workflows/deform360-format-icra-v4.yml \
            .github/requests/deform360-format-icra-v4.json
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "No target-branch change was required."
            exit 0
          fi
          git commit -m "Format Deform360 action-conditioned evaluation source"
          git push origin HEAD:science/deform360-gpuserver4090-real-eval-v1
