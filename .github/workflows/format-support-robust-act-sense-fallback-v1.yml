name: Format support-robust act-sense-fallback v1

on:
  push:
    branches: [science/support-robust-act-sense-fallback-v1]
    paths:
      - ".github/requests/format-support-robust-act-sense-fallback-v1.json"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 2
          clean: true
      - name: Authorize one formatting request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          test "${PUSH_FORCED}" = false
          mapfile -t changed < <(git diff --name-status "${BEFORE_SHA}" "${GITHUB_SHA}")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = $'A\t.github/requests/format-support-robust-act-sense-fallback-v1.json'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Apply exact formatter and verify contracts
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python -m pip install numpy==1.26.4 pytest ruff==0.14.14
          python -m ruff format \
            src/bayesian_phystwin/support_robust_act_sense_fallback_certificate_v1.py \
            experiments/support_robust_act_sense_fallback_v1/run.py
          python -m ruff check \
            src/bayesian_phystwin/support_robust_act_sense_fallback_certificate_v1.py \
            experiments/support_robust_act_sense_fallback_v1/run.py \
            tests/test_support_robust_act_sense_fallback_certificate_v1.py \
            tests/test_support_robust_act_sense_fallback_mechanism_v1.py
          python -m pytest -q \
            tests/test_deform_dlo_act_sense_fallback_certificate_v1.py \
            tests/test_support_robust_act_sense_fallback_certificate_v1.py \
            tests/test_support_robust_act_sense_fallback_mechanism_v1.py
          python -m experiments.support_robust_act_sense_fallback_v1.run --check
          git diff --check
      - name: Commit canonical formatting
        run: |
          set -euo pipefail
          rm -f .github/requests/format-support-robust-act-sense-fallback-v1.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/bayesian_phystwin/support_robust_act_sense_fallback_certificate_v1.py \
            experiments/support_robust_act_sense_fallback_v1/run.py \
            .github/requests/format-support-robust-act-sense-fallback-v1.json
          git commit -m 'Format support-robust act-sense-fallback certificate'
          git push origin HEAD:science/support-robust-act-sense-fallback-v1
