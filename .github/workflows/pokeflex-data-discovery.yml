name: PokeFlex data discovery

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/pokeflex-data-discovery.yml"

permissions:
  contents: read

jobs:
  discover:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 30
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true

      - name: Locate readable PokeFlex inputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          roots = tuple(map(Path, ("/mnt/corsair", "/mnt/lexar4tb", "/home/github-runner", "/opt")))
          filenames = {
              "FoamDice_T7.zip",
              "FoamDice_T8.zip",
              "PlushOctopus_T7.zip",
              "FoamDice_T7_candidates.json",
              "FoamDice_T8_candidates.json",
              "PlushOctopus_T7_candidates.json",
          }
          take_ids = {"FoamDice_T7", "FoamDice_T8", "PlushOctopus_T7"}
          maximum_depth = 12

          def describe(path: Path) -> None:
              try:
                  stat = path.stat()
                  print(
                      f"FOUND path={path} size={stat.st_size} mode={oct(stat.st_mode & 0o777)} "
                      f"uid={stat.st_uid} gid={stat.st_gid} readable={os.access(path, os.R_OK)}"
                  )
              except OSError as error:
                  print(f"FOUND-UNSTATABLE path={path} error={error}")

          for root in roots:
              print(f"ROOT path={root} exists={root.exists()} readable={os.access(root, os.R_OK)}")
              if not root.is_dir():
                  continue
              for current, directories, files in os.walk(
                  root,
                  followlinks=False,
                  onerror=lambda error: print(f"WALK-ERROR path={error.filename} error={error}"),
              ):
                  current_path = Path(current)
                  try:
                      depth = len(current_path.relative_to(root).parts)
                  except ValueError:
                      depth = maximum_depth + 1
                  if depth >= maximum_depth:
                      directories[:] = []
                  for filename in sorted(filenames.intersection(files)):
                      describe(current_path / filename)
                  if "robot_data.json" in files and current_path.name in take_ids:
                      describe(current_path / "robot_data.json")
                      print(f"TAKE-ROOT path={current_path} readable={os.access(current_path, os.R_OK | os.X_OK)}")
          PY
