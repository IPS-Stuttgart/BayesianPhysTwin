# workflow-lifecycle: temporary-one-shot
# workflow-owner: IPS-Stuttgart maintainers
name: Register anytime admission stable coverage v1

on:
  push:
    branches: [science/anytime-valid-simulator-admission-v1]
    paths:
      - ".github/workflows/register-anytime-admission-coverage-v1.yml"

permissions:
  contents: write

concurrency:
  group: register-anytime-admission-coverage-v1
  cancel-in-progress: false

jobs:
  register:
    if: github.repository == 'IPS-Stuttgart/BayesianPhysTwin'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: science/anytime-valid-simulator-admission-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Register tests and enforce changed-module coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('.github/quality/test-suites.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          suite = payload['suites']['stable-core-coverage']
          additions = [
              'tests/test_anytime_admission_v1.py',
              'tests/test_anytime_recursive_admission_v1.py',
          ]
          for item in additions:
              if item in suite:
                  raise SystemExit(f'already registered: {item}')
          anchor = suite.index('tests/test_recursive_corruption_benchmark.py')
          suite[anchor:anchor] = additions
          path.write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          PY
          python -m pip install -e '.[dev,graph]'
          python -m pip install 'coverage==7.13.3'
          python tools/quality/test_suite_manifest.py validate
          python -m coverage run --branch --source=bayesian_phystwin \
            -m pytest -q \
            tests/test_anytime_admission_v1.py \
            tests/test_anytime_recursive_admission_v1.py
          python -m coverage report \
            --include='src/bayesian_phystwin/anytime_admission_v1.py' \
            --show-missing \
            --fail-under=90
          python -m coverage json -o anytime-coverage.json
          python - <<'PY'
          import json
          data = json.load(open('anytime-coverage.json', encoding='utf-8'))
          key = next(
              key for key in data['files']
              if key.endswith('bayesian_phystwin/anytime_admission_v1.py')
          )
          summary = data['files'][key]['summary']
          line = summary['percent_covered']
          branch = 100.0 * summary['covered_branches'] / summary['num_branches']
          print(f'line_coverage={line:.2f}%')
          print(f'branch_coverage={branch:.2f}%')
          if line < 90.0 or branch < 80.0:
              raise SystemExit(
                  f'coverage below contract: line={line:.2f}, branch={branch:.2f}'
              )
          PY

      - name: Remove one-shot workflow and publish registration
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/register-anytime-admission-coverage-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/quality/test-suites.json \
            .github/workflows/register-anytime-admission-coverage-v1.yml
          git diff --cached --check
          git commit -m 'Register anytime admission stable coverage tests'
          git push origin HEAD:science/anytime-valid-simulator-admission-v1
