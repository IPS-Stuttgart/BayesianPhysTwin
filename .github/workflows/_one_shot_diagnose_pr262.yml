name: Diagnose PR 262 focused validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/_one_shot_diagnose_pr262.yml"
      - ".github/workflows/_one_shot_finalize_pr262.yml"
      - "scripts/_one_shot_fix_pr262_typing.py"

permissions:
  contents: read

concurrency:
  group: diagnose-pr262-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 262 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply parser narrowing and Ruff normalization
        run: |
          set -euo pipefail
          python scripts/_one_shot_fix_pr262_typing.py
          files=(
            src/bayesian_phystwin/deform360_calibration_visual_execution_admission.py
            scripts/science/admit_deform360_calibration_visual_execution.py
            tests/test_deform360_calibration_visual_execution_admission.py
            tests/conftest.py
          )
          python -m pip install -e ".[dev,graph]" "numpy>=1.24,<2.2"
          python -m pip install "build>=1.2"
          python -m ruff check --fix "${files[@]}"
          python -m ruff format "${files[@]}"

      - name: Strict MyPy
        run: |
          python -m mypy \
            src/bayesian_phystwin/deform360_calibration_visual_execution_admission.py \
            scripts/science/admit_deform360_calibration_visual_execution.py

      - name: Focused pytest
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_deform360_calibration_visual_execution_admission.py \
            tests/test_deform360_calibration_visual_production_plan.py

      - name: Byte compilation
        run: |
          python -m py_compile \
            src/bayesian_phystwin/deform360_calibration_visual_execution_admission.py \
            scripts/science/admit_deform360_calibration_visual_execution.py \
            tests/test_deform360_calibration_visual_execution_admission.py

      - name: Source distribution
        run: python -m build --sdist
