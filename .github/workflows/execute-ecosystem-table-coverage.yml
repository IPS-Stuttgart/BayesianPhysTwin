name: Execute ecosystem compatibility coverage ownership

on:
  pull_request:
    branches:
      - agent/ecosystem-compatibility-table-v1
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  register:
    if: >-
      github.event.pull_request.head.ref ==
      'agent/execute-ecosystem-table-coverage'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact target branch
        uses: actions/checkout@v7
        with:
          ref: agent/ecosystem-compatibility-table-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Register permanent CI ownership
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = Path(".github/quality/test-suites.json")
          payload = json.loads(manifest.read_text(encoding="utf-8"))
          test = "tests/test_ecosystem_compatibility_v1.py"
          for suite in (
              "stable-core-coverage",
              "core-contracts",
              "provider-contract",
          ):
              members = payload["suites"][suite]
              if test not in members:
                  members.append(test)
          manifest.write_text(
              json.dumps(payload, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Validate manifest and focused contract
        shell: bash
        run: |
          set -euo pipefail
          python tools/quality/test_suite_manifest.py validate
          for suite in stable-core-coverage core-contracts provider-contract; do
            python tools/quality/test_suite_manifest.py list "${suite}" \
              | grep -Fx tests/test_ecosystem_compatibility_v1.py
          done
          python -m pip install -e ".[dev]" coverage==7.13.3
          coverage run --branch --source=bayesian_phystwin \
            -m pytest -q tests/test_ecosystem_compatibility_v1.py
          coverage report -m \
            --include=src/bayesian_phystwin/ecosystem_compatibility_v1.py \
            --fail-under=90
          git diff --check

      - name: Push the ownership-only commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Coverage ownership is already registered."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/quality/test-suites.json
          git commit -m "Register ecosystem compatibility contract coverage"
          git push origin HEAD:agent/ecosystem-compatibility-table-v1
