name: Repair Deform360 staged publisher

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: repair-deform360-visuotactile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 10
    steps:
      - name: Check out publication branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/deform360-official-hub-visuotactile-v1
          fetch-depth: 0

      - name: Route the corrected publisher to workstation2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          publisher = Path(
              ".github/workflows/apply-deform360-visuotactile-ci.yml"
          )
          text = publisher.read_text(encoding="utf-8")
          old = "    runs-on: ubuntu-latest\n"
          new = "    runs-on: [self-hosted, Linux, X64, nvidia-smi]\n"
          if text.count(old) != 1:
              raise SystemExit(
                  "publisher runner source changed: "
                  f"count={text.count(old)}"
              )
          publisher.write_text(text.replace(old, new), encoding="utf-8")
          Path(
              ".github/workflows/repair-deform360-visuotactile-publisher.yml"
          ).unlink()
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Route corrected Deform360 publisher to workstation2"
          git push origin HEAD:agent/deform360-official-hub-visuotactile-v1
