name: Finalize provider-owned information-cap diff

# The second workflow-file commit triggers this one-shot finalizer.
on:
  push:
    branches:
      - agent/finalize-provider-owned-information-caps
    paths:
      - ".github/workflows/agent-finalize-provider-caps.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/finalize-provider-owned-information-caps
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tools
        run: python -m pip install -q -e ".[dev]"
      - name: Format and lint product diff
        run: |
          python -m ruff format \
            src/bayesian_phystwin/_gauge_aware_contracts.py \
            src/bayesian_phystwin/_gauge_aware_solver.py \
            src/bayesian_phystwin/_prior_aware_gauge_math.py \
            src/bayesian_phystwin/gauge_aware_belief.py \
            src/bayesian_phystwin/observation_belief_gauge_adapter.py \
            src/bayesian_phystwin/prior_aware_gauge_belief.py \
            tests/test_information_mass_invariants.py \
            tests/test_observation_belief_gauge_adapter.py \
            tests/test_provider_composite_weight_semantics.py
          python -m ruff check \
            src/bayesian_phystwin/_gauge_aware_contracts.py \
            src/bayesian_phystwin/_gauge_aware_solver.py \
            src/bayesian_phystwin/_prior_aware_gauge_math.py \
            src/bayesian_phystwin/gauge_aware_belief.py \
            src/bayesian_phystwin/observation_belief_gauge_adapter.py \
            src/bayesian_phystwin/prior_aware_gauge_belief.py \
            tests/test_information_mass_invariants.py \
            tests/test_observation_belief_gauge_adapter.py \
            tests/test_provider_composite_weight_semantics.py
      - name: Run focused regressions
        run: |
          python -m pytest -q \
            tests/test_information_mass_invariants.py \
            tests/test_observation_belief_gauge_adapter.py \
            tests/test_provider_composite_weight_semantics.py \
            tests/test_gauge_aware_belief.py \
            tests/test_prior_aware_and_linearization.py \
            tests/test_prior_aware_likelihood_conformance.py
      - name: Commit stable product-only diff
        shell: bash
        run: |
          rm .github/workflows/agent-finalize-provider-caps.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Format and validate provider-owned information caps"
          git push origin HEAD:agent/finalize-provider-owned-information-caps
