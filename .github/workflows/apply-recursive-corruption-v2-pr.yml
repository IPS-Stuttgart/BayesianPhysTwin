name: Apply recursive-corruption v2 in PR context

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-recursive-corruption-v2-pr.yml'
      - '.github/recursive-corruption-v2-payload/**'

permissions:
  contents: write

concurrency:
  group: apply-recursive-corruption-v2-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'science/recursive-corruption-v2-matched-guards'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source branch
        uses: actions/checkout@v7
        with:
          ref: science/recursive-corruption-v2-matched-guards
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Reassemble the reviewed hash-bound payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/recursive-corruption-v2-payload/part-* \
            > "$RUNNER_TEMP/recursive-corruption-v2.b64"
          base64 -d "$RUNNER_TEMP/recursive-corruption-v2.b64" \
            > "$RUNNER_TEMP/recursive-corruption-v2.tar.gz"
          echo 'e4c04130dc816c49f23d359241756df8aec7f366dcb5952f74560c7d64b61154  '"$RUNNER_TEMP/recursive-corruption-v2.tar.gz" \
            | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/recursive-corruption-v2.tar.gz"

      - name: Validate the complete focused revision
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m ruff format \
            src/bayesian_phystwin/recursive_corruption_benchmark_v2.py \
            scripts/science/analyze_recursive_corruption_v2.py \
            scripts/science/run_recursive_corruption_v2.py \
            tests/test_recursive_corruption_benchmark_v2.py
          python -m ruff check --fix \
            src/bayesian_phystwin/recursive_corruption_benchmark_v2.py \
            scripts/science/analyze_recursive_corruption_v2.py \
            scripts/science/run_recursive_corruption_v2.py \
            tests/test_recursive_corruption_benchmark_v2.py
          python -m ruff format --check \
            src/bayesian_phystwin/recursive_corruption_benchmark_v2.py \
            scripts/science/analyze_recursive_corruption_v2.py \
            scripts/science/run_recursive_corruption_v2.py \
            tests/test_recursive_corruption_benchmark_v2.py
          python -m ruff check \
            src/bayesian_phystwin/recursive_corruption_benchmark_v2.py \
            scripts/science/analyze_recursive_corruption_v2.py \
            scripts/science/run_recursive_corruption_v2.py \
            tests/test_recursive_corruption_benchmark_v2.py
          python -m pytest -q tests/test_recursive_corruption_benchmark_v2.py
          python -m py_compile \
            src/bayesian_phystwin/recursive_corruption_benchmark_v2.py \
            scripts/science/analyze_recursive_corruption_v2.py \
            scripts/science/run_recursive_corruption_v2.py
          git diff --check

      - name: Publish reviewed source and remove transport helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/recursive-corruption-v2-payload
          rm .github/workflows/apply-recursive-corruption-v2-once.yml
          rm .github/workflows/apply-recursive-corruption-v2-pr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add matched-guard recursive corruption benchmark v2'
          git push origin HEAD:science/recursive-corruption-v2-matched-guards
