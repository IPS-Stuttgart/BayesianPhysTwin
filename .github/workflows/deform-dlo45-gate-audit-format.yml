# workflow-lifecycle: temporary
# workflow-owner: IPS-Stuttgart maintainers
# workflow-expiry: 2026-09-15
name: Format DEFORM DLO4/DLO5 gate audit

on:
  push:
    paths:
      - ".github/workflows/deform-dlo45-gate-audit-format.yml"
      - "experiments/deform_dlo45_decision_identifiability_v1/gate_audit.py"
      - "tests/test_deform_dlo45_decision_gate_audit_v1.py"

permissions:
  contents: write

concurrency:
  group: format-deform-dlo45-gate-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[gate-audit-format]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply canonical Ruff fixes and formatting
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "ruff==0.16.5"
          files=(
            experiments/deform_dlo45_decision_identifiability_v1/gate_audit.py
            tests/test_deform_dlo45_decision_gate_audit_v1.py
          )
          python -m ruff check --fix --unsafe-fixes "${files[@]}"
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          git diff --check

      - name: Commit normalized source once
        shell: bash
        run: |
          set -euo pipefail
          files=(
            experiments/deform_dlo45_decision_identifiability_v1/gate_audit.py
            tests/test_deform_dlo45_decision_gate_audit_v1.py
          )
          git add "${files[@]}"
          if git diff --cached --quiet; then
            echo "Sources already canonical."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[gate-audit-format] Normalize DEFORM gate audit"
          git push origin "HEAD:${GITHUB_REF_NAME}"
