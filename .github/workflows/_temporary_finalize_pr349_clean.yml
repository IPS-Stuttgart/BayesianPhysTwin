name: Temporary finalize PR 349 on clean product tree

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/_temporary_finalize_pr349_clean.yml"

permissions:
  contents: write

concurrency:
  group: temporary-finalize-pr349-clean-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BASE_SHA: ae5cbcfa4a125d3df2f034d11f6e0cc7a065c00a
  BRANCH_NAME: agent/fail-closed-prior-aware-irls
  EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/fail-closed-prior-aware-irls'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact reviewed branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Verify exact clean base and branch head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git fetch --no-tags origin main "$BRANCH_NAME"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-parse "origin/$BRANCH_NAME")" = "$EVENT_HEAD_SHA"
          test "$(git merge-base HEAD origin/main)" = "$BASE_SHA"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply final source and suite updates
        run: python scripts/_temporary_finalize_pr349.py

      - name: Format and validate exact source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir -e ".[dev,graph]"
          python -m pip install "coverage==7.13.3"
          python -m pip check
          python -m ruff format \
            src/bayesian_phystwin/prior_aware_gauge_belief_v2.py \
            tests/test_claim_bearing_strict_admission.py
          python -m ruff check \
            src/bayesian_phystwin/prior_aware_gauge_belief_v2.py \
            src/bayesian_phystwin/prospective_prob4d_update.py \
            src/bayesian_phystwin/tree_sparse_structured_gauge_prob4d.py \
            tests/test_claim_bearing_strict_admission.py
          python -m mypy --python-version 3.12 \
            src/bayesian_phystwin/prior_aware_gauge_belief_v2.py \
            src/bayesian_phystwin/prospective_prob4d_update.py \
            src/bayesian_phystwin/tree_sparse_structured_gauge_prob4d.py
          python -m pytest -q \
            tests/test_prior_aware_gauge_belief_v2.py \
            tests/test_claim_bearing_strict_admission.py
          python -m pytest -q tests/test_test_suite_manifest.py
          python -m compileall -q src/bayesian_phystwin tests

      - name: Create the exact clean product commit
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:.github/workflows/tree-sparse-prob4d.yml \
            > .github/workflows/tree-sparse-prob4d.yml
          rm -f .github/workflows/_temporary_finalize_pr349.yml
          rm -f .github/workflows/_temporary_finalize_pr349_clean.yml
          rm -f scripts/_temporary_finalize_pr349.py
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          actual="$(git diff --cached --name-only | sort)"
          expected="$(cat <<'EOF'
          .github/quality/test-suites.json
          .github/workflows/_temporary_finalize_pr349.yml
          .github/workflows/_temporary_finalize_pr349_clean.yml
          .github/workflows/tree-sparse-prob4d.yml
          scripts/_temporary_finalize_pr349.py
          src/bayesian_phystwin/prior_aware_gauge_belief_v2.py
          tests/test_claim_bearing_strict_admission.py
          EOF
          )"
          test "$actual" = "$expected"
          git commit -m "Complete strict-admission coverage [finalize-pr349]"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Run authoritative stable-core coverage on the clean product
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          export COVERAGE_FILE="$RUNNER_TEMP/.coverage"
          python tools/quality/test_suite_manifest.py list stable-core-coverage \
            > "$RUNNER_TEMP/stable-core-tests.txt"
          mapfile -t stable_tests < "$RUNNER_TEMP/stable-core-tests.txt"
          test "${#stable_tests[@]}" -gt 0
          python -m coverage run --branch --source=bayesian_phystwin \
            -m pytest -q "${stable_tests[@]}"
          python -m coverage json -o "$RUNNER_TEMP/package-coverage.json"
          stable_files=(
            src/bayesian_phystwin/_gauge_aware_contracts.py
            src/bayesian_phystwin/_gauge_aware_solver.py
            src/bayesian_phystwin/calibration.py
            src/bayesian_phystwin/causal4d_provider_v1.py
            src/bayesian_phystwin/cli/main.py
            src/bayesian_phystwin/cli/run_manifest.py
            src/bayesian_phystwin/gauge_aware_belief.py
            src/bayesian_phystwin/deform360_contact_anchor.py
            src/bayesian_phystwin/observation_belief.py
            src/bayesian_phystwin/observation_belief_gauge_adapter.py
            src/bayesian_phystwin/phystwin_profile.py
            src/bayesian_phystwin/prob4d_causal_lineage.py
            src/bayesian_phystwin/prob4d_observation_contract.py
            src/bayesian_phystwin/pseudo_measurements.py
            src/bayesian_phystwin/repository_provenance.py
            src/bayesian_phystwin/robust_likelihood.py
            src/bayesian_phystwin/run_manifest.py
            src/bayesian_phystwin/run_manifest_v2.py
          )
          stable_include=$(IFS=,; echo "${stable_files[*]}")
          python -m coverage json --include="$stable_include" \
            -o "$RUNNER_TEMP/stable-core-coverage.json"
          python tools/quality/check_coverage_floors.py \
            "$RUNNER_TEMP/stable-core-coverage.json" \
            .github/quality/stable-core-coverage-floors.json \
            --changed-coverage-json "$RUNNER_TEMP/package-coverage.json" \
            --base "$BASE_SHA" \
            --head "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Publish the exact validated product commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BRANCH_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$EVENT_HEAD_SHA"
          git push origin "HEAD:refs/heads/$BRANCH_NAME"
