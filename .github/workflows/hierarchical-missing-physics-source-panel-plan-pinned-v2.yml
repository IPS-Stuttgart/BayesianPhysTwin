name: Hierarchical missing-physics source panel plan pinned v2

on:
  push:
    branches:
      - science/hierarchical-missing-physics-diagnosis-v1
    paths:
      - protocols/execution_requests/hierarchical_missing_physics_source_panel_plan_pinned_v2.json

permissions:
  contents: write

concurrency:
  group: hierarchical-missing-physics-source-panel-plan-pinned-v2
  cancel-in-progress: false

jobs:
  plan:
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 90
    env:
      REQUEST: protocols/execution_requests/hierarchical_missing_physics_source_panel_plan_pinned_v2.json
      CENSUS: evidence/hierarchical_missing_physics/runtime_census_gpuserver4090_v1/result.json
      CENSUS_RECEIPT: evidence/hierarchical_missing_physics/runtime_census_gpuserver4090_v1/receipt.json
      EVIDENCE_DIR: evidence/hierarchical_missing_physics/source_panel_plan_v1
    steps:
      - name: Check out exact trigger revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Validate source-only provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = workstation1
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          request = json.loads(Path(os.environ["REQUEST"]).read_text(encoding="utf-8"))
          census_path = Path(os.environ["CENSUS"])
          census = json.loads(census_path.read_text(encoding="utf-8"))
          receipt = json.loads(Path(os.environ["CENSUS_RECEIPT"]).read_text(encoding="utf-8"))
          assert request["schema"] == "bayesian-phystwin.deform-dlo23-source-panel-plan-pinned-request"
          assert request["schema_version"] == 2
          assert request["source_census_id"] == census["census_id"] == receipt["census_id"]
          assert request["source_census_receipt_id"] == receipt["receipt_id"]
          assert hashlib.sha256(census_path.read_bytes()).hexdigest() == receipt["result_sha256"]
          assert request["authorized_source_objects"] == ["DLO2", "DLO3"]
          assert request["forbidden_target_objects"] == ["DLO4", "DLO5"]
          assert request["target_payload_read_authorized"] is False
          assert request["target_outcome_semantic_mapping_authorized"] is False
          assert receipt["dlo4_dlo5_payload_read"] is False
          assert receipt["target_scores_read"] is False
          PY
          python3 -m py_compile scripts/science/plan_deform_dlo23_hierarchical_panel.py

      - name: Prepare isolated pinned planner runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/hmp-panel-plan-v2-venv-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check --no-input \
            "pip==25.2" "setuptools==80.9.0" "wheel==0.45.1" "numpy==2.2.6"
          echo "python=$venv/bin/python" >> "$GITHUB_OUTPUT"
          echo "venv=$venv" >> "$GITHUB_OUTPUT"

      - name: Construct the hash-bound source adapter plan
        id: construct
        env:
          PYTHON: ${{ steps.runtime.outputs.python }}
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/hmp-panel-plan-v2"
          test ! -e "$work"
          mkdir -p "$work"
          "$PYTHON" scripts/science/plan_deform_dlo23_hierarchical_panel.py \
            --census "$CENSUS" \
            --output "$work/result.json" \
            | tee "$work/summary.log"
          RESULT="$work/result.json" "$PYTHON" - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path(os.environ["RESULT"]).read_text(encoding="utf-8"))
          boundary = result["information_boundary"]
          forbidden = (
              "dlo4_payload_read",
              "dlo5_payload_read",
              "protected_parent_target_result_read",
              "target_outcome_used_for_semantic_mapping",
              "ambiguous_carrier_auto_selected",
          )
          assert all(boundary[key] is False for key in forbidden)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"result={os.environ['RESULT']}\n")
              output.write(f"ready={'true' if result['ready_for_panel_build'] else 'false'}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## DLO2/DLO3 source panel plan\n\n")
              summary.write(f"Plan ID: `{result['plan_id']}`\n\n")
              summary.write(f"Ready for panel build: `{result['ready_for_panel_build']}`\n\n")
              for dlo, decision in sorted(result["decisions"].items()):
                  summary.write(
                      f"- {dlo}: `{decision['reason']}`; candidates "
                      f"`{decision['candidate_count']}`; top `{decision['top_score']}`; "
                      f"margin `{decision['score_margin']}`\n"
                  )
          PY

      - name: Retain the source-only plan
        env:
          PYTHON: ${{ steps.runtime.outputs.python }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          cp "${{ steps.construct.outputs.result }}" "$EVIDENCE_DIR/result.json"
          RESULT="$EVIDENCE_DIR/result.json" "$PYTHON" - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          result_path = Path(os.environ["RESULT"])
          result = json.loads(result_path.read_text(encoding="utf-8"))
          receipt = {
              "schema": "bayesian-phystwin.deform-dlo23-source-panel-plan-receipt",
              "schema_version": 2,
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "evaluated_commit_sha": os.environ["GITHUB_SHA"],
              "runner_name": os.environ["RUNNER_NAME"],
              "source_census_id": result["source_census_id"],
              "plan_id": result["plan_id"],
              "result_sha256": hashlib.sha256(result_path.read_bytes()).hexdigest(),
              "ready_for_panel_build": result["ready_for_panel_build"],
              "decisions": result["decisions"],
              "dlo4_dlo5_payload_read": False,
              "target_scores_read": False,
              "claim_scope": "source-only adapter planning"
          }
          unsigned = json.dumps(receipt, sort_keys=True, separators=(",", ":")).encode()
          receipt["receipt_id"] = hashlib.sha256(unsigned).hexdigest()
          (result_path.parent / "receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$EVIDENCE_DIR"
          git commit -m "Record DLO2/DLO3 hierarchical panel plan"
          git push origin HEAD:science/hierarchical-missing-physics-diagnosis-v1

      - name: Upload the exact plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: hierarchical-missing-physics-source-panel-plan-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hmp-panel-plan-v2/
            evidence/hierarchical_missing_physics/source_panel_plan_v1/
          if-no-files-found: error
          retention-days: 90

      - name: Remove isolated runtime
        if: always()
        shell: bash
        run: rm -rf -- "${{ steps.runtime.outputs.venv }}"
