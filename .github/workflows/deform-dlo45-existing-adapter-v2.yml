# workflow-lifecycle: one-shot
# workflow-owner: IPS-Stuttgart maintainers
name: DEFORM DLO4 DLO5 existing adapter v2

on:
  push:
    branches:
      - science/deform360-rope-pilot-v1
    paths:
      - ".github/workflows/deform-dlo45-existing-adapter-v2.yml"
      - "scripts/science/audit_deform_dlo45_realdata_v1.py"
      - "scripts/science/invoke_deform_dlo_source_adapter_v1.py"
      - "triggers/deform_dlo45_existing_adapter_v2.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deform-dlo45-existing-adapter-v2-${{ github.ref }}
  cancel-in-progress: false

env:
  DATASET_ROOT: /mnt/seagate10tb/florianpfaff/datasets/deform/data_set
  ADAPTER_REF: phystwin-deform-dlo-source-v1
  AUDITOR: scripts/science/audit_deform_dlo45_realdata_v1.py
  INVOKER: scripts/science/invoke_deform_dlo_source_adapter_v1.py
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONNOUSERSITE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  execute:
    name: Existing adapter independent execution / gpuserver4090
    runs-on: [self-hosted, gpuserver4090]
    timeout-minutes: 180
    steps:
      - name: Admit assigned runner
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_NAME} os=${RUNNER_OS} arch=${RUNNER_ARCH}"
          test "${RUNNER_OS}" = "Linux"
          test "${RUNNER_ARCH}" = "X64"

      - name: Check out exact experiment revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Check out the existing DEFORM adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/BayesianPhysTwin
          ref: ${{ env.ADAPTER_REF }}
          path: _deform_adapter
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Resolve runtime, data, and evidence identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          adapter_sha="$(git -C _deform_adapter rev-parse HEAD)"
          base_python=""
          for candidate in /usr/bin/python3.12 /usr/local/bin/python3.12 /usr/bin/python3 /usr/local/bin/python3
          do
            if [[ -x "${candidate}" ]]; then
              base_python="${candidate}"
              break
            fi
          done
          test -n "${base_python}"
          test -d "${DATASET_ROOT}"
          resolved_dataset="$(realpath -e -- "${DATASET_ROOT}")"
          runtime_site="${RUNNER_TEMP}/deform-dlo45-v2-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          evidence_root="${RUNNER_TEMP}/deform-dlo45-v2-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "${runtime_site}" "${evidence_root}"
          mkdir -p -- "${runtime_site}" "${evidence_root}"
          {
            echo "BASE_PYTHON=${base_python}"
            echo "ADAPTER_SHA=${adapter_sha}"
            echo "RUNTIME_SITE=${runtime_site}"
            echo "EVIDENCE_ROOT=${evidence_root}"
            echo "RESOLVED_DATASET_ROOT=${resolved_dataset}"
            echo "PYTHONPATH=${runtime_site}"
          } >> "${GITHUB_ENV}"
          {
            echo "experiment_revision=${GITHUB_SHA}"
            echo "adapter_revision=${adapter_sha}"
            echo "adapter_ref=${ADAPTER_REF}"
            echo "dataset_declared=${DATASET_ROOT}"
            echo "dataset_resolved=${resolved_dataset}"
            echo "runner=${RUNNER_NAME}"
            stat -c 'dataset device=%d inode=%i mode=%a' "${resolved_dataset}"
            "${base_python}" --version
            uname -a
            df -h "${resolved_dataset}"
          } | tee "${evidence_root}/environment.txt"

      - name: Validate experiment-side controllers
        shell: bash
        run: |
          set -euo pipefail
          "${BASE_PYTHON}" -m py_compile "${AUDITOR}" "${INVOKER}"
          "${BASE_PYTHON}" "${AUDITOR}" --self-test
          "${BASE_PYTHON}" "${INVOKER}" --self-test

      - name: Install an isolated adapter runtime with declared dependencies
        id: runtime
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          "${BASE_PYTHON}" -m pip --version
          "${BASE_PYTHON}" -m pip install \
            --target "${RUNTIME_SITE}" \
            "numpy==2.2.6" \
            "scipy==1.15.3" \
            "pandas==2.2.3" \
            "matplotlib==3.10.1" \
            "h5py==3.13.0" \
            "pytest==8.3.5"
          PYTHONPATH="${RUNTIME_SITE}" "${BASE_PYTHON}" -m pip install \
            --target "${RUNTIME_SITE}" \
            --no-build-isolation \
            "${GITHUB_WORKSPACE}/_deform_adapter"
          PYTHONPATH="${RUNTIME_SITE}" "${BASE_PYTHON}" - <<'PY' \
            | tee "${EVIDENCE_ROOT}/runtime.txt"
          import importlib.metadata
          import numpy
          import scipy

          print(f"numpy={numpy.__version__}")
          print(f"scipy={scipy.__version__}")
          for distribution in importlib.metadata.distributions(path=[__import__('os').environ['RUNTIME_SITE']]):
              name = distribution.metadata.get('Name')
              if name:
                  print(f"{name}=={distribution.version}")
          PY

      - name: Run the format audit without blocking adapter execution
        id: audit
        if: steps.runtime.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="${RUNTIME_SITE}" "${BASE_PYTHON}" "${AUDITOR}" \
            --dataset-root "${RESOLVED_DATASET_ROOT}" \
            --repository-root "${GITHUB_WORKSPACE}/_deform_adapter" \
            --repository-revision "${ADAPTER_SHA}" \
            --output "${EVIDENCE_ROOT}/audit" \
            2>&1 | tee "${EVIDENCE_ROOT}/audit.log"

      - name: Execute both directed DLO4/DLO5 adapter calls
        id: invocation
        if: steps.runtime.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="${RUNTIME_SITE}" "${BASE_PYTHON}" "${INVOKER}" \
            --adapter-root "${GITHUB_WORKSPACE}/_deform_adapter" \
            --adapter-revision "${ADAPTER_SHA}" \
            --dataset-root "${RESOLVED_DATASET_ROOT}" \
            --output "${EVIDENCE_ROOT}/invocation" \
            --python "${BASE_PYTHON}" \
            2>&1 | tee "${EVIDENCE_ROOT}/invocation.log"

      - name: Run adapter-native tests as an independent diagnostic
        id: tests
        if: steps.runtime.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/_deform_adapter"
          if [[ -d tests ]]; then
            PYTHONPATH="${RUNTIME_SITE}" "${BASE_PYTHON}" -m pytest -q \
              2>&1 | tee "${EVIDENCE_ROOT}/adapter-tests.log"
          else
            echo "No tests directory in adapter revision." | tee "${EVIDENCE_ROOT}/adapter-tests.log"
          fi

      - name: Write a durable bounded execution summary
        if: always()
        shell: bash
        env:
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          INVOCATION_OUTCOME: ${{ steps.invocation.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          set -euo pipefail
          mkdir -p -- "${EVIDENCE_ROOT:-${RUNNER_TEMP}/deform-dlo45-v2-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"
          export EVIDENCE_ROOT="${EVIDENCE_ROOT:-${RUNNER_TEMP}/deform-dlo45-v2-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"
          "${BASE_PYTHON:-/usr/bin/python3}" - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['EVIDENCE_ROOT'])
          invocation = None
          path = root / 'invocation' / 'invocation.json'
          if path.is_file():
              invocation = json.loads(path.read_text())
          result = {
              'schema': 'bayesian-phystwin/deform-dlo45-existing-adapter-execution-v2',
              'schema_version': 2,
              'repository_revision': os.environ['GITHUB_SHA'],
              'adapter_revision': os.environ.get('ADAPTER_SHA'),
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'workflow_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'runner_name': os.environ['RUNNER_NAME'],
              'dataset_root': os.environ.get('RESOLVED_DATASET_ROOT'),
              'outcomes': {
                  'runtime': os.environ['RUNTIME_OUTCOME'],
                  'audit': os.environ['AUDIT_OUTCOME'],
                  'invocation': os.environ['INVOCATION_OUTCOME'],
                  'adapter_tests': os.environ['TEST_OUTCOME'],
              },
              'invocation_summary': invocation.get('summary') if invocation else None,
              'information_boundary': {
                  'real_dataset_accessed': True,
                  'target_dependent_tuning': False,
                  'paper_claim_authorized': False,
              },
          }
          encoded=json.dumps(result,sort_keys=True,separators=(',',':'),allow_nan=False).encode()
          result['execution_id']=hashlib.sha256(encoded).hexdigest()
          (root/'execution.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          lines=[
              '# DEFORM DLO4/DLO5 existing-adapter execution v2','',
              f"- Execution ID: `{result['execution_id']}`",
              f"- Runtime: `{result['outcomes']['runtime']}`",
              f"- Audit: `{result['outcomes']['audit']}`",
              f"- Invocation: `{result['outcomes']['invocation']}`",
              f"- Adapter tests: `{result['outcomes']['adapter_tests']}`",
              f"- Invocation summary: `{result['invocation_summary']}`",'',
              'This is real-data adapter execution evidence. It is not, by itself, a paper-level physical-transport claim.'
          ]
          (root/'summary.md').write_text('\n'.join(lines)+'\n')
          PY
          find "${EVIDENCE_ROOT}" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > "${EVIDENCE_ROOT}/SHA256SUMS"
          cat "${EVIDENCE_ROOT}/summary.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload complete compact evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deform-dlo45-existing-adapter-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_ROOT }}
          if-no-files-found: error
          retention-days: 30

      - name: Enforce at least one successful directed real-data execution
        if: always()
        shell: bash
        env:
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
        run: |
          set -euo pipefail
          test "${RUNTIME_OUTCOME}" = "success"
          "${BASE_PYTHON}" - <<'PY'
          import json
          import os
          from pathlib import Path
          path=Path(os.environ['EVIDENCE_ROOT'])/'invocation'/'invocation.json'
          if not path.is_file():
              raise SystemExit('invocation result missing')
          value=json.loads(path.read_text())
          if value['summary']['successful_execution_count'] < 1:
              raise SystemExit('no directed real-data adapter execution succeeded')
          PY
