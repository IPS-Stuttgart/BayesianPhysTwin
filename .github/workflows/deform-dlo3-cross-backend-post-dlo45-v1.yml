# workflow-lifecycle: temporary-one-shot
# workflow-owner: IPS-Stuttgart maintainers
name: DLO3 no-refit cross-backend transfer after DLO45 v1

on:
  workflow_run:
    workflows:
      - DEFORM DLO4/DLO5 staged timeout recovery v3
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: deform-dlo3-cross-backend-post-dlo45-v1
  cancel-in-progress: false

env:
  IMPLEMENTATION_SHA: d8c144ddeff2b75a1fa600d44e9991444e98646c
  BLOCKING_RUN_ID: "33361441865"
  BLOCKING_HEAD_SHA: 0376ece871d7c3d9355788f812a3c4cc1c9165b0
  BLOCKING_HEAD_BRANCH: science/deform-dlo45-time-budget-recovery-v3
  BLOCKING_RUN_ROOT: /home/github-runner/.cache/workflows/deform-dlo45-time-budget-recovery-v3/runs/33361441865-1
  FROZEN_PYTHON: /home/florianpfaff/source-only/deform-bayesian-v1/venv/bin/python
  CROSS_BACKEND_ROOT: /home/github-runner/.cache/workflows/deform-dlo3-cross-backend-transfer-v1
  PROTOCOL: protocols/deform_dlo3_cross_backend_transfer_v1.json
  PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/scripts/remote:${{ github.workspace }}
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"

jobs:
  contracts:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.event.workflow_run.id == 33361441865 &&
      github.event.workflow_run.head_sha == '0376ece871d7c3d9355788f812a3c4cc1c9165b0' &&
      github.event.workflow_run.head_branch == 'science/deform-dlo45-time-budget-recovery-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact validated implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.IMPLEMENTATION_SHA }}
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Revalidate frozen transfer contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e . pytest ruff
          python -m pytest -q tests/test_deform_dlo3_cross_backend_transfer_v1.py
          python -m ruff check \
            scripts/remote/run_deform_dlo3_cross_backend_transfer_v1.py \
            src/bayesian_phystwin_experiments/deform_dlo_cross_backend_transfer_v1.py \
            tests/test_deform_dlo3_cross_backend_transfer_v1.py
          python -m ruff format --check \
            scripts/remote/run_deform_dlo3_cross_backend_transfer_v1.py \
            src/bayesian_phystwin_experiments/deform_dlo_cross_backend_transfer_v1.py \
            tests/test_deform_dlo3_cross_backend_transfer_v1.py

  evaluate:
    needs: contracts
    if: needs.contracts.result == 'success'
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 60
    env:
      BLOCKING_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      BLOCKING_EVENT_URL: ${{ github.event.workflow_run.html_url }}
      CROSS_BACKEND_OUT: /home/github-runner/.cache/workflows/deform-dlo3-cross-backend-transfer-v1/runs/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out exact validated implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.IMPLEMENTATION_SHA }}
          persist-credentials: false
          clean: true

      - name: Bind terminal DLO4/DLO5 evidence and fresh one-shot custody
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_run
          test "${{ github.event.workflow_run.id }}" = "$BLOCKING_RUN_ID"
          test "${{ github.event.workflow_run.head_sha }}" = "$BLOCKING_HEAD_SHA"
          test "${{ github.event.workflow_run.head_branch }}" = "$BLOCKING_HEAD_BRANCH"
          test "$BLOCKING_CONCLUSION" = success
          test -x "$FROZEN_PYTHON"
          test -f "$BLOCKING_RUN_ROOT/score/result.json"
          test -f "$PROTOCOL"
          test ! -e "$CROSS_BACKEND_OUT"
          mkdir -p "$CROSS_BACKEND_ROOT/runs" "$CROSS_BACKEND_ROOT/claims"
          claim="$CROSS_BACKEND_ROOT/claims/$BLOCKING_RUN_ID-$IMPLEMENTATION_SHA"
          mkdir "$claim"
          printf '%s\n' "$GITHUB_SHA" > "$claim/orchestrator_sha"
          printf '%s\n' "$GITHUB_RUN_ID" > "$claim/evaluation_run_id"
          mkdir -p "$CROSS_BACKEND_OUT/evaluation"
          cp --no-clobber "$BLOCKING_RUN_ROOT/score/result.json" \
            "$CROSS_BACKEND_OUT/deform_dlo45_result.json"
          BLOCKING_CONCLUSION="$BLOCKING_CONCLUSION" \
          BLOCKING_EVENT_URL="$BLOCKING_EVENT_URL" \
          "$FROZEN_PYTHON" - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ["CROSS_BACKEND_OUT"])
          record = {
              "schema_version": 1,
              "contract": "deform-dlo3-cross-backend-blocking-run-binding-v1",
              "blocking_run_id": int(os.environ["BLOCKING_RUN_ID"]),
              "blocking_head_sha": os.environ["BLOCKING_HEAD_SHA"],
              "blocking_head_branch": os.environ["BLOCKING_HEAD_BRANCH"],
              "blocking_conclusion": os.environ["BLOCKING_CONCLUSION"],
              "blocking_event_url": os.environ["BLOCKING_EVENT_URL"],
              "implementation_sha": os.environ["IMPLEMENTATION_SHA"],
              "dlo45_result_path": str(
                  (output / "deform_dlo45_result.json").resolve()
              ),
              "dlo45_workflow_terminal_before_dispatch": True,
              "paper_claim_authorized": False,
          }
          (output / "blocking_run_binding.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Execute sealed no-refit coefficient transfer
        shell: bash
        run: |
          set -euo pipefail
          "$FROZEN_PYTHON" \
            scripts/remote/run_deform_dlo3_cross_backend_transfer_v1.py \
            --protocol "$PROTOCOL" \
            --output-root "$CROSS_BACKEND_OUT/evaluation" \
            --mode run \
            | tee "$CROSS_BACKEND_OUT/evaluation.log"

      - name: Validate and summarize combined evidence
        shell: bash
        run: |
          set -euo pipefail
          "$FROZEN_PYTHON" - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["CROSS_BACKEND_OUT"])
          transfer = json.loads(
              (root / "evaluation" / "result.json").read_text(encoding="utf-8")
          )
          dlo45 = json.loads(
              (root / "deform_dlo45_result.json").read_text(encoding="utf-8")
          )
          if transfer["information_boundary"]["dlo3_official_evaluation_read"]:
              raise SystemExit("DLO3 official evaluation boundary was crossed")
          if transfer["information_boundary"]["dlo4_or_dlo5_read"]:
              raise SystemExit("cross-backend evaluator read DLO4 or DLO5 payloads")
          summary = {
              "schema_version": 1,
              "contract": "deform-dlo3-cross-backend-plus-dlo45-summary-v1",
              "cross_backend_decision": transfer["decision"],
              "cross_backend_relative_improvement": transfer[
                  "primary_vs_raw_pyelastica"
              ]["relative_improvement"],
              "cross_backend_wins": transfer["primary_vs_raw_pyelastica"]["wins"],
              "cross_backend_losses": transfer["primary_vs_raw_pyelastica"]["losses"],
              "improving_deform_seed_models": transfer["promotion_gate"][
                  "improving_seed_models"
              ],
              "backend_specific_gain_retained_fraction": transfer[
                  "backend_specific_gain_retained_fraction"
              ],
              "dlo45_contract": dlo45.get("contract"),
              "dlo45_decision": dlo45.get("decision"),
              "dlo45_result": dlo45,
              "paper_claim_authorized": False,
          }
          (root / "combined_summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          digest_lines = []
          for path in sorted(root.rglob("*")):
              if not path.is_file() or path.name == "SHA256SUMS":
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              digest_lines.append(f"{digest}  {path.relative_to(root).as_posix()}")
          (root / "SHA256SUMS").write_text(
              "\n".join(digest_lines) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
          cat "$CROSS_BACKEND_OUT/evaluation/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined DLO4/DLO5 and cross-backend evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: deform-dlo3-cross-backend-post-dlo45-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CROSS_BACKEND_OUT }}/blocking_run_binding.json
            ${{ env.CROSS_BACKEND_OUT }}/deform_dlo45_result.json
            ${{ env.CROSS_BACKEND_OUT }}/combined_summary.json
            ${{ env.CROSS_BACKEND_OUT }}/SHA256SUMS
            ${{ env.CROSS_BACKEND_OUT }}/evaluation.log
            ${{ env.CROSS_BACKEND_OUT }}/evaluation/preflight.json
            ${{ env.CROSS_BACKEND_OUT }}/evaluation/method_seal.json
            ${{ env.CROSS_BACKEND_OUT }}/evaluation/result.json
            ${{ env.CROSS_BACKEND_OUT }}/evaluation/report.md
            ${{ env.CROSS_BACKEND_OUT }}/evaluation/trajectory-results.csv
            ${{ env.PROTOCOL }}
          retention-days: 90
          if-no-files-found: warn

      - name: Lock retained evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -z "${CROSS_BACKEND_OUT:-}" || chmod -R u+rwX,go-rwx "$CROSS_BACKEND_OUT"
