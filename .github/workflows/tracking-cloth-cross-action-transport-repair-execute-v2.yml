# workflow-lifecycle: one-shot
# workflow-owner: IPS-Stuttgart maintainers
name: Structurally repair and execute Tracking Cloth transport v2

on:
  push:
    branches:
      - research/tracking-cloth-cross-action-transport-source-v1
    paths:
      - ".github/requests/tracking-cloth-cross-action-transport-repair-execute-v2.json"

permissions:
  contents: write

concurrency:
  group: tracking-cloth-cross-action-transport-repair-execute-v2
  cancel-in-progress: false

jobs:
  repair:
    name: Structurally repair, format, and test source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      patched_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Check out exact v2 request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Replace synthetic gauge columns structurally
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("experiments/tracking_cloth_cross_action_transport_v1/run.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          repaired: list[str] = []
          index = 0
          removed_gauge = False
          collapsed_causes = False
          while index < len(lines):
              line = lines[index]
              stripped = line.strip()
              if stripped.startswith("gauge_signatures = np.zeros("):
                  removed_gauge = True
                  index += 1
                  continue
              if stripped == "cause_signatures = {":
                  block = lines[index : index + 5]
                  if any("rigid_pairwise_gauge" in item for item in block):
                      repaired.append(
                          line[: len(line) - len(line.lstrip())]
                          + 'cause_signatures = {"material_contrast": material_signatures}'
                      )
                      index += 1
                      while index < len(lines) and lines[index].strip() != "}":
                          index += 1
                      if index >= len(lines):
                          raise SystemExit("unterminated cause_signatures block")
                      index += 1
                      collapsed_causes = True
                      continue
              repaired.append(line)
              index += 1
          if not removed_gauge or not collapsed_causes:
              raise SystemExit("expected synthetic gauge block was not repaired")
          text = "\n".join(repaired) + "\n"

          text = text.replace(
              "target_maps[interactions[target_index]] = np.hstack(\n"
              "            (target_centered, np.zeros((target_centered.shape[0], 3)))\n"
              "        )",
              "target_maps[interactions[target_index]] = target_centered",
          )
          text = text.replace(
              "source_design = np.hstack((material_signatures, gauge_signatures))",
              "source_design = material_signatures",
          )
          text = text.replace(
              "candidate_designs[candidate] = np.hstack(\n"
              "            (centered, np.zeros((centered.shape[0], 3)))\n"
              "        )",
              "candidate_designs[candidate] = centered",
          )
          text = text.replace("len(materials) + 3", "len(materials)")
          text = text.replace(
              "int(adequacy.nullity)",
              "int(adequacy.coefficient_nullspace.shape[1])",
          )

          marker = "def _case_value(case: object, *names: str) -> object | None:\n"
          if "def _construct(factory:" not in text:
              helper = '''def _construct(factory: object, **kwargs: object) -> object:
              """Call the checked-out repository revision across optional API drift."""

              signature = inspect.signature(factory)
              if any(
                  parameter.kind is inspect.Parameter.VAR_KEYWORD
                  for parameter in signature.parameters.values()
              ):
                  return factory(**kwargs)  # type: ignore[operator]
              accepted = {
                  name: value
                  for name, value in kwargs.items()
                  if name in signature.parameters
              }
              return factory(**accepted)  # type: ignore[operator]


          '''
              if marker not in text:
                  raise SystemExit("constructor helper insertion marker missing")
              text = text.replace(marker, helper + marker)

          text = text.replace(
              "    adequacy = InterventionalCauseFamilyAdequacyV1(\n",
              "    adequacy = _construct(\n"
              "        InterventionalCauseFamilyAdequacyV1,\n",
          )
          text = text.replace(
              "    quotient = InterventionalTransportQuotientV1(\n",
              "    quotient = _construct(\n"
              "        InterventionalTransportQuotientV1,\n",
          )
          text = text.replace(
              "            design = TargetDirectedInterventionDesignV1(\n",
              "            design = _construct(\n"
              "                TargetDirectedInterventionDesignV1,\n",
          )
          path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_tracking_cloth_cross_action_transport_v1.py")
          tests = test_path.read_text(encoding="utf-8")
          tests = tests.replace(
              "assert adequacy.nullity >= 4",
              "assert adequacy.coefficient_nullspace.shape[1] >= 1",
          )
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Install development package
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Canonicalize and validate repaired implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format \
            experiments/tracking_cloth_cross_action_transport_v1 \
            tests/test_tracking_cloth_cross_action_transport_v1.py
          python -m ruff check --fix \
            experiments/tracking_cloth_cross_action_transport_v1 \
            tests/test_tracking_cloth_cross_action_transport_v1.py
          python -m ruff format --check \
            experiments/tracking_cloth_cross_action_transport_v1 \
            tests/test_tracking_cloth_cross_action_transport_v1.py
          python -m ruff check \
            experiments/tracking_cloth_cross_action_transport_v1 \
            tests/test_tracking_cloth_cross_action_transport_v1.py
          python -m pytest -q tests/test_tracking_cloth_cross_action_transport_v1.py
          python -m compileall -q experiments/tracking_cloth_cross_action_transport_v1

      - name: Commit exact validated source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            experiments/tracking_cloth_cross_action_transport_v1 \
            tests/test_tracking_cloth_cross_action_transport_v1.py
          git diff --cached --check
          git commit -m "Harden centered-material transport certificate"
          sha=$(git rev-parse HEAD)
          git push origin HEAD:research/tracking-cloth-cross-action-transport-source-v1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  source-target:
    name: Seal and score exact validated real-data model
    needs: repair
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 120
    env:
      DATASET_ROOT: /home/github-runner/.cache/datasets/tracking-cloth-deformation-v1-zenodo-14644526
      RUN_DIR: ${{ github.workspace }}/.run/tracking-cloth-cross-action-transport-source-v1
      RESULT_DIR: results/science/tracking_cloth_cross_action_transport_v1/source-target-20260902-v1
    steps:
      - name: Check out exact validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.repair.outputs.patched_sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Validate source identity and dataset mount
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.repair.outputs.patched_sha }}"
          test -d "$DATASET_ROOT"
          test -r "$DATASET_ROOT"
          test "$(find "$DATASET_ROOT" -type f -name '*.csv' | wc -l)" -ge 120
          python3 --version

      - name: Create isolated runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUN_DIR"
          mkdir -p "$RUN_DIR"
          python3 -m venv --system-site-packages "$RUN_DIR/venv"
          "$RUN_DIR/venv/bin/python" -m pip install --no-deps -e .
          "$RUN_DIR/venv/bin/python" -m pip check

      - name: Seal all held-action predictions before target parsing
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src${PYTHONPATH:+:$PYTHONPATH}"
          "$RUN_DIR/venv/bin/python" -m \
            experiments.tracking_cloth_cross_action_transport_v1.run \
            --stage seal \
            --dataset-root "$DATASET_ROOT" \
            --protocol experiments/tracking_cloth_cross_action_transport_v1/protocol.json \
            --work-dir "$RUN_DIR/sealed"
          python3 - <<'PY'
          import json
          from pathlib import Path

          seal = json.loads(
              Path(".run/tracking-cloth-cross-action-transport-source-v1/sealed/seal.json").read_text(
                  encoding="utf-8"
              )
          )
          assert seal["numeric_access"] == {
              "repetition_1_cases": 12,
              "repetition_2_diagnostic_cases": 4,
              "repetition_2_held_target_cases": 0,
              "repetition_3_cases": 0,
          }
          assert seal["target_outcomes_used_to_select_or_fit"] is False
          PY

      - name: Verify seal and score the eight held-action trajectories once
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src${PYTHONPATH:+:$PYTHONPATH}"
          mkdir -p "$RUN_DIR/scored"
          "$RUN_DIR/venv/bin/python" -m \
            experiments.tracking_cloth_cross_action_transport_v1.run \
            --stage score \
            --dataset-root "$DATASET_ROOT" \
            --protocol experiments/tracking_cloth_cross_action_transport_v1/protocol.json \
            --work-dir "$RUN_DIR/sealed" \
            --output "$RUN_DIR/scored/result.json" \
            --report "$RUN_DIR/scored/report.md"
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path(".run/tracking-cloth-cross-action-transport-source-v1/scored/result.json").read_text(
                  encoding="utf-8"
              )
          )
          assert result["numeric_access"] == {
              "repetition_1_cases": 12,
              "repetition_2_diagnostic_cases_before_seal": 4,
              "repetition_2_held_target_cases_after_seal": 8,
              "repetition_3_cases": 0,
          }
          assert result["rep3_confirmation_authorized"] is False
          PY

      - name: Publish compact evidence and retire all one-shot files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RESULT_DIR"
          cp "$RUN_DIR/scored/result.json" "$RESULT_DIR/result.json"
          cp "$RUN_DIR/scored/report.md" "$RESULT_DIR/report.md"
          cp "$RUN_DIR/sealed/seal.json" "$RESULT_DIR/prediction_seal.json"
          cp experiments/tracking_cloth_cross_action_transport_v1/protocol.json \
            "$RESULT_DIR/protocol.json"
          cp experiments/tracking_cloth_cross_action_transport_v1/run.py \
            "$RESULT_DIR/run.py"
          cp .github/workflows/tracking-cloth-cross-action-transport-repair-execute-v2.yml \
            "$RESULT_DIR/executed_workflow.yml"
          rm -f \
            .github/workflows/tracking-cloth-cross-action-transport-source-v1.yml \
            .github/workflows/tracking-cloth-cross-action-transport-repair-execute-v1.yml \
            .github/workflows/tracking-cloth-cross-action-transport-repair-execute-v2.yml \
            .github/requests/tracking-cloth-cross-action-transport-source-v1.json \
            .github/requests/tracking-cloth-cross-action-transport-repair-execute-v1.json \
            .github/requests/tracking-cloth-cross-action-transport-repair-execute-v2.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Record sealed Tracking Cloth transport evidence"
          git push origin HEAD:research/tracking-cloth-cross-action-transport-source-v1

      - name: Upload complete seal and score payload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tracking-cloth-cross-action-transport-v2-${{ needs.repair.outputs.patched_sha }}
          path: .run/tracking-cloth-cross-action-transport-source-v1
          if-no-files-found: warn
          retention-days: 30
