name: Temporary format PokeFlex PR 172

on:
  push:
    branches:
      - integrate/pokeflex-all18-source-v4
    paths:
      - .github/workflows/temporary-format-pokeflex-pr172.yml

permissions:
  contents: write

concurrency:
  group: temporary-format-pokeflex-pr172
  cancel-in-progress: false

jobs:
  format-and-cover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: integrate/pokeflex-all18-source-v4
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install focused validation environment
        run: |
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Add stable-core collection and format exact files
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_pokeflex_action_robust_scale.py")
          text = path.read_text(encoding="utf-8")
          import_line = (
              "from test_pokeflex_action_robust_all18 import *  "
              "# noqa: E402,F403"
          )
          if import_line not in text:
              text = text.rstrip() + (
                  "\n\n\n# The stable-core coverage job invokes this file explicitly. "
                  "Import the\n# all-18 source contract cases so the new module is assessed by "
                  "the ordinary\n# changed-line and changed-branch ratchets without weakening "
                  "their thresholds.\n"
                  + import_line
                  + "\n"
              )
              path.write_text(text, encoding="utf-8")
          PY
          python -m ruff format \
            src/bayesian_phystwin/pokeflex_action_robust_all18.py \
            tests/test_pokeflex_action_robust_all18.py \
            tests/test_pokeflex_action_robust_all18_public13_result.py \
            tests/test_pokeflex_action_robust_scale.py
          python -m ruff check \
            src/bayesian_phystwin/pokeflex_action_robust_all18.py \
            tests/test_pokeflex_action_robust_all18.py \
            tests/test_pokeflex_action_robust_all18_public13_result.py \
            tests/test_pokeflex_action_robust_scale.py
          git diff --check
      - name: Run focused PokeFlex contracts
        run: |
          python -m pytest -q \
            tests/test_pokeflex_action_robust_scale.py \
            tests/test_pokeflex_action_robust_all18.py \
            tests/test_pokeflex_action_robust_all18_public13_result.py
      - name: Commit the exact product/test changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayesian_phystwin/pokeflex_action_robust_all18.py \
            tests/test_pokeflex_action_robust_all18.py \
            tests/test_pokeflex_action_robust_all18_public13_result.py \
            tests/test_pokeflex_action_robust_scale.py
          if git diff --cached --quiet; then
            echo "No formatting or coverage changes were required."
            exit 0
          fi
          git commit -m "Format and cover PokeFlex all-18 contracts"
          git push origin HEAD:integrate/pokeflex-all18-source-v4
