# workflow-lifecycle: temporary
# workflow-owner: IPS-Stuttgart maintainers
name: Deform360 action kernel v3

on:
  push:
    branches: [science/deform360-icra-development-v2]
    paths:
      - ".github/requests/deform360-action-kernel-v3.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deform360-action-kernel-v3-${{ github.ref }}
  cancel-in-progress: false

env:
  DATASET_ROOT: /mnt/seagate10tb/florianpfaff/datasets/deform360
  PROTOCOL_PATH: protocols/deform360_action_kernel_v3.json
  EVALUATOR_PATH: scripts/science/run_deform360_action_kernel_v3.py
  BASE_EVALUATOR_PATH: scripts/science/run_deform360_action_conditioned_tactile_v2.py
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  contracts:
    name: Nonlinear action-kernel contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install numerical dependency
        run: python -m pip install numpy==1.26.4
      - name: Compile and run kernel smoke contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "${BASE_EVALUATOR_PATH}" "${EVALUATOR_PATH}"
          python - <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          import numpy as np

          path = Path("scripts/science/run_deform360_action_kernel_v3.py")
          spec = importlib.util.spec_from_file_location("deform360_action_kernel_v3", path)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          rng = np.random.default_rng(19)
          state = rng.normal(size=(96, 8))
          action = rng.normal(size=(96, 5))
          target = np.column_stack((state[:, 0] + action[:, 0], state[:, 1] - action[:, 1]))
          fit = module.fit_kernel(state, action, target, module.KernelSpec(8, 1.0))
          prediction = module.kernel_predict(fit, state[:12], action[:12])
          if prediction.shape != (12, 2) or not np.all(np.isfinite(prediction)):
              raise SystemExit("kernel prediction contract failed")
          weights, temperature = module.generalized_bayes_weights(
              [
                  module.UnifiedCandidate("a", "action_kernel", 1.0, {}, {}, {}, {}, {}),
                  module.UnifiedCandidate("b", "action_kernel", 2.0, {}, {}, {}, {}, {}),
              ],
              0.05,
          )
          if not np.isclose(weights.sum(), 1.0) or not temperature > 0.0:
              raise SystemExit("candidate weighting contract failed")
          protocol = module.read_json(Path("protocols/deform360_action_kernel_v3.json"))
          if protocol["status"] != "frozen-before-ridge-v2-target-result-available":
              raise SystemExit("pre-result freeze identity changed")
          if protocol["paper_claim_authorized"] is not False:
              raise SystemExit("v3 protocol self-authorized a claim")
          PY

  evaluate:
    name: Nonlinear action-conditioned development / gpuserver4090
    needs: contracts
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 360
    steps:
      - name: Check out exact frozen evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
      - name: Prepare isolated NumPy runtime
        shell: bash
        run: |
          set -euo pipefail
          test -d "${DATASET_ROOT}"
          test -r "${DATASET_ROOT}"
          test "$(readlink -f -- "${DATASET_ROOT}")" = "${DATASET_ROOT}"
          venv="${RUNNER_TEMP}/deform360-action-v3-venv-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          output="${RUNNER_TEMP}/deform360-action-v3-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "${venv}" "${output}"
          python3 -m venv "${venv}"
          "${venv}/bin/python" -m pip install numpy==1.26.4
          mkdir -p -- "${output}"
          {
            echo "PYTHON_BIN=${venv}/bin/python"
            echo "VENV_ROOT=${venv}"
            echo "OUTPUT_ROOT=${output}"
          } >> "${GITHUB_ENV}"
      - name: Record execution and pre-result freeze identity
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "revision=${GITHUB_SHA}"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "required_runner_label=gpuserver4090"
            echo "dataset_root=${DATASET_ROOT}"
            echo "predecessor_run=33329809775"
            echo "predecessor_target_result_available_at_protocol_freeze=false"
            sha256sum "${PROTOCOL_PATH}" "${EVALUATOR_PATH}" "${BASE_EVALUATOR_PATH}"
            "${PYTHON_BIN}" --version
            uname -a
          } | tee "${OUTPUT_ROOT}/environment.txt"
      - name: Run frozen nonlinear action-conditioned evaluation
        shell: bash
        run: |
          set -euo pipefail
          "${PYTHON_BIN}" "${EVALUATOR_PATH}" \
            --protocol "${PROTOCOL_PATH}" \
            --data-root "${DATASET_ROOT}" \
            --output-json "${OUTPUT_ROOT}/result.json" \
            --output-report "${OUTPUT_ROOT}/report.md" \
            2>&1 | tee "${OUTPUT_ROOT}/console.log"
          cat "${OUTPUT_ROOT}/report.md" >> "${GITHUB_STEP_SUMMARY}"
      - name: Verify closed information boundary
        shell: bash
        run: |
          set -euo pipefail
          "${PYTHON_BIN}" - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads((Path(os.environ["OUTPUT_ROOT"]) / "result.json").read_text())
          if result["status"] != "complete" or result["summary"]["object_count"] < 10:
              raise SystemExit("v3 evaluation is incomplete")
          boundary = result["information_boundary"]
          if boundary["protocol_frozen_before_predecessor_target_result_available"] is not True:
              raise SystemExit("pre-result freeze boundary changed")
          for key in (
              "camera_pixels_opened",
              "geometry_or_point_cloud_opened",
              "reserved_object_payloads_opened",
              "fresh_confirmation_authorized",
              "paper_claim_authorized",
          ):
              if boundary[key] is not False:
                  raise SystemExit(f"closed boundary changed: {key}")
          if not all(row["source_fit_frozen_before_target_tactile_open"] for row in result["objects"]):
              raise SystemExit("a target opened before source fit")
          if not all(row["predecessor_target_result_available_at_protocol_freeze"] is False for row in result["objects"]):
              raise SystemExit("predecessor result boundary changed")
          PY
          cp "${PROTOCOL_PATH}" "${OUTPUT_ROOT}/protocol.json"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Upload compact nonlinear development evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deform360-action-kernel-v3-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_ROOT }}
          if-no-files-found: warn
          retention-days: 90
      - name: Remove isolated runtime
        if: always()
        shell: bash
        run: rm -rf -- "${VENV_ROOT:-}"
