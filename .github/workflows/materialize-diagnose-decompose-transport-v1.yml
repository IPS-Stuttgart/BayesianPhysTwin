# workflow-lifecycle: one-shot
# workflow-owner: IPS-Stuttgart maintainers
name: Materialize Diagnose-Decompose-Transport v1

on:
  push:
    branches:
      - research/diagnose-decompose-transport-v1
    paths:
      - .github/workflows/materialize-diagnose-decompose-transport-v1.yml
      - .github/requests/materialize-diagnose-decompose-transport-v1.part06

permissions:
  contents: write

concurrency:
  group: materialize-diagnose-decompose-transport-v1
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact trigger revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify and safely materialize the exact source bundle
        shell: bash
        run: |
          set -euo pipefail
          request_prefix=.github/requests/materialize-diagnose-decompose-transport-v1.part
          archive="$RUNNER_TEMP/diagnose-decompose-transport-v1.tar.gz"
          for suffix in 00 01 02 03 04 05 06; do
            test -f "${request_prefix}${suffix}"
          done
          cat "${request_prefix}"{00,01,02,03,04,05,06} | base64 --decode > "$archive"
          printf '%s  %s\n' \
            '0a64a631867f18a2f50bc954991d4b4bd22468ca64d4d3fa185b6f3a290cc8fe' \
            "$archive" | sha256sum --check --strict
          ARCHIVE="$archive" python - <<'PY'
          import os
          import tarfile
          from pathlib import Path, PurePosixPath

          allowed = {
              'src/bayesian_phystwin_experiments/discrepancy_scope_transport_v1.py',
              'tests/test_discrepancy_scope_transport_v1.py',
              'scripts/science/run_discrepancy_scope_transport_controlled_v1.py',
              'docs/discrepancy_scope_transport_v1.md',
              'protocols/discrepancy-scope-transport-v1.json',
              'evidence/discrepancy_scope_transport_controlled_v1/README.md',
              'evidence/discrepancy_scope_transport_controlled_v1/report.md',
              'evidence/discrepancy_scope_transport_controlled_v1/result.json',
          }
          archive = Path(os.environ['ARCHIVE'])
          with tarfile.open(archive, 'r:gz') as bundle:
              members = bundle.getmembers()
              names = {member.name for member in members}
              if names != allowed:
                  raise SystemExit(f'unexpected bundle paths: {sorted(names ^ allowed)}')
              for member in members:
                  path = PurePosixPath(member.name)
                  if (
                      member.isdir()
                      or member.issym()
                      or member.islnk()
                      or member.isdev()
                      or path.is_absolute()
                      or '..' in path.parts
                  ):
                      raise SystemExit(f'unsafe bundle member: {member.name}')
              bundle.extractall('.', filter='data')
          PY
          python -m json.tool protocols/discrepancy-scope-transport-v1.json >/dev/null

      - name: Install development dependencies
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pip check

      - name: Normalize, lint, test, and reproduce evidence twice
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/bayesian_phystwin_experiments/discrepancy_scope_transport_v1.py
            tests/test_discrepancy_scope_transport_v1.py
            scripts/science/run_discrepancy_scope_transport_controlled_v1.py
          )
          python -m ruff check --fix "${files[@]}"
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m pytest -q tests/test_discrepancy_scope_transport_v1.py
          python -m compileall -q \
            src/bayesian_phystwin_experiments/discrepancy_scope_transport_v1.py \
            scripts/science/run_discrepancy_scope_transport_controlled_v1.py
          output=evidence/discrepancy_scope_transport_controlled_v1/result.json
          report=evidence/discrepancy_scope_transport_controlled_v1/report.md
          PYTHONPATH=src python \
            scripts/science/run_discrepancy_scope_transport_controlled_v1.py \
            --output "$output" --report "$report"
          tmp="$RUNNER_TEMP/repeat"
          mkdir -p "$tmp"
          PYTHONPATH=src python \
            scripts/science/run_discrepancy_scope_transport_controlled_v1.py \
            --output "$tmp/result.json" --report "$tmp/report.md"
          cmp "$output" "$tmp/result.json"
          cmp "$report" "$tmp/report.md"

      - name: Remove one-shot carriers and commit only durable science
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/materialize-diagnose-decompose-transport-v1.yml \
            .github/requests/materialize-diagnose-decompose-transport-v1.b64 \
            .github/requests/materialize-diagnose-decompose-transport-v1.part{00,01,02,03,04,05,06}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Add Diagnose-Decompose-Transport scope certificate'
          git push origin HEAD:research/diagnose-decompose-transport-v1
