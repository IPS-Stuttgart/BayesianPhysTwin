# workflow-owner: IPS-Stuttgart maintainers
# workflow-issue: https://github.com/IPS-Stuttgart/BayesianPhysTwin/issues/949
# workflow-expires: 2026-09-14
# Branch-only diagnostic. Do not merge this temporary entry point.
name: DP residual development pilot 20260907
on:
  push:
    branches: [experiment/dp-residual-development-20260907]
    paths:
      - .github/workflows/dp-residual-development-20260907.yml
      - experiments/dp_residual_development_v1/*.py
permissions:
  contents: read
concurrency:
  group: dp-residual-development-20260907
  cancel-in-progress: true
jobs:
  development:
    if: github.repository == 'IPS-Stuttgart/BayesianPhysTwin'
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OUT: /home/github-runner/.cache/workflows/dp-residual-development-v1/${{ github.run_id }}-${{ github.run_attempt }}
      PY: /home/florianpfaff/source-only/deform-bayesian-v1/venv/bin/python
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /home/florianpfaff/source-only/deform-bayesian-v1/DEFORM-b73b8b8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Export authorized development arrays or reuse exact export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/scripts/remote:$GITHUB_WORKSPACE"
          CACHE=/home/github-runner/.cache/workflows/dp-residual-development-v1/34052837838-1
          if test -f "$CACHE/export_result.json" && test -f "$CACHE/development_arrays.npz"; then
            "$PY" - "$CACHE" "$OUT" <<'PY'
          import hashlib,json,shutil,sys
          from pathlib import Path
          src,dst=map(Path,sys.argv[1:])
          record=json.loads((src/'export_result.json').read_text())
          if record['source_test_opened'] or record['official_eval_read']:
              raise ValueError('Unacceptable cache boundary')
          if record['source_revision'] != 'c47c62bd52e89fb90a28bac21b5d5997a6772b14':
              raise ValueError('Unexpected exporter revision')
          if hashlib.sha256((src/'development_arrays.npz').read_bytes()).hexdigest() != record['array_sha256']:
              raise ValueError('Export digest changed')
          for name in ('development_arrays.npz','export_result.json','access_manifest.json'):
              shutil.copy2(src/name,dst/name)
          print('REUSED',str(src),record['array_sha256'])
          PY
          else
            "$PY" experiments/dp_residual_development_v1/run.py --output-root "$OUT" | tee "$OUT/export.log"
          fi
      - name: Numerical tests and fit-selected development comparison
        shell: bash
        run: |
          set -euo pipefail
          "$PY" -m unittest discover -s experiments/dp_residual_development_v1 -p test_model.py -v 2>&1 | tee "$OUT/tests.log"
          "$PY" experiments/dp_residual_development_v1/analyze.py --input "$OUT/development_arrays.npz" --output "$OUT/analysis" | tee "$OUT/analysis.log"
      - name: Retain results and technical failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dp-residual-development-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUT }}
          if-no-files-found: warn
          retention-days: 30
