# workflow-lifecycle: temporary-one-shot
# workflow-owner: IPS-Stuttgart maintainers
name: Transport4D Deform360 frozen-split support audit

on:
  push:
    branches: [research/transport4d-tiered-public-v1]
    paths:
      - ".github/requests/transport4d-deform360-support-audit-v1.json"

permissions:
  contents: read

concurrency:
  group: transport4d-deform360-support-audit-v1
  cancel-in-progress: false

env:
  DATASET_ROOT: /mnt/seagate10tb/florianpfaff/datasets/deform360
  REQUEST_PATH: .github/requests/transport4d-deform360-support-audit-v1.json
  RESERVE_RESULT: evidence/transport4d_deform360_reserve_v1/result.json
  RESERVE_ID: 0fba6a0cda4ac23fc8f900ca4632d73a22ae0559d42e48cc2ec8c5ea79030dc4
  SUPPORT_HELPER: scripts/science/audit_deform360_untouched_confirmation_v5.py
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_revision: ${{ steps.request.outputs.source_revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          clean: true
      - id: request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = IPS-Stuttgart/BayesianPhysTwin
          test "${GITHUB_REF}" = refs/heads/research/transport4d-tiered-public-v1
          test "${PUSH_FORCED}" = false
          mapfile -t changed < <(git diff --name-status "${BEFORE_SHA}" "${GITHUB_SHA}")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = $'A\t.github/requests/transport4d-deform360-support-audit-v1.json'
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          request = json.loads(Path(os.environ["REQUEST_PATH"]).read_text())
          expected = {
              "schema": "bayesian-phystwin/transport4d-deform360-support-request-v1",
              "request_id": "transport4d-deform360-frozen-split-support-20260902-v1",
              "dataset_root": os.environ["DATASET_ROOT"],
              "reserve_result_path": os.environ["RESERVE_RESULT"],
              "reserve_id": os.environ["RESERVE_ID"],
              "minimum_complete_episodes_per_object": 4,
              "metadata_and_file_identity_only": True,
              "numeric_payload_authorized": False,
              "replacement_allowed": False,
              "split_movement_allowed": False,
              "confirmation_authorized": False,
              "paper_claim_authorized": False,
          }
          for name, value in expected.items():
              if request.get(name) != value:
                  raise SystemExit(f"invalid {name}: {request.get(name)!r}")
          if set(request) != set(expected) | {"expected_source_revision"}:
              raise SystemExit("support request fields differ from frozen schema")
          parent = subprocess.check_output(
              ["git", "rev-parse", f"{os.environ['GITHUB_SHA']}^"], text=True
          ).strip()
          if request["expected_source_revision"] != parent:
              raise SystemExit("support request is not bound to its parent")
          reserve = json.loads(Path(os.environ["RESERVE_RESULT"]).read_text())
          if reserve["reserve_id"] != os.environ["RESERVE_ID"]:
              raise SystemExit("reserve identity changed")
          assert reserve["reservation_ready"] is True
          assert reserve["information_boundary"]["target_outcome_opened"] is False
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              print(f"source_revision={parent}", file=stream)
          PY
          python -m py_compile "${SUPPORT_HELPER}"
          git diff --exit-code

  support:
    needs: authorize
    if: >-
      always() && needs.authorize.result == 'success' &&
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.ref == 'refs/heads/research/transport4d-tiered-public-v1'
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 90
    steps:
      - name: Admit exact runner and mounted root
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_OS}" = Linux
          test "${RUNNER_ARCH}" = X64
          test -d "${DATASET_ROOT}"
      - name: Check out exact request revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          clean: true
      - name: Reverify target-closed request and source
        shell: bash
        env:
          SOURCE_REVISION: ${{ needs.authorize.outputs.source_revision }}
        run: |
          set -euo pipefail
          test "$(git rev-parse "${GITHUB_SHA}^")" = "${SOURCE_REVISION}"
          python3 -m py_compile "${SUPPORT_HELPER}"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          request = json.loads(Path(os.environ["REQUEST_PATH"]).read_text())
          assert request["metadata_and_file_identity_only"] is True
          assert request["numeric_payload_authorized"] is False
          assert request["replacement_allowed"] is False
          assert request["split_movement_allowed"] is False
          assert request["confirmation_authorized"] is False
          assert request["paper_claim_authorized"] is False
          PY
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Inspect frozen splits without loading arrays
        shell: bash
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/transport4d-support-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "$output"
          mkdir -p -- "$output"
          echo "OUTPUT_ROOT=$output" >> "$GITHUB_ENV"
          DATASET_ROOT="${DATASET_ROOT}" \
          RESERVE_RESULT="${RESERVE_RESULT}" \
          RESERVE_ID="${RESERVE_ID}" \
          SUPPORT_HELPER="${SUPPORT_HELPER}" \
          OUTPUT_ROOT="$output" \
          python3 - <<'PY'
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["DATASET_ROOT"]).resolve(strict=True)
          reserve_path = Path(os.environ["RESERVE_RESULT"])
          reserve = json.loads(reserve_path.read_text(encoding="utf-8"))
          assert reserve["reserve_id"] == os.environ["RESERVE_ID"]
          helper_path = Path(os.environ["SUPPORT_HELPER"])
          spec = importlib.util.spec_from_file_location("transport4d_support_helper", helper_path)
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load support helper")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          split_by_id = {
              **{object_id: "calibration" for object_id in reserve["calibration_object_ids"]},
              **{object_id: "confirmation" for object_id in reserve["confirmation_object_ids"]},
          }
          reserved_rows = {row["object_id"]: row for row in reserve["objects"]}
          rows = []
          for object_id in reserve["calibration_object_ids"] + reserve["confirmation_object_ids"]:
              inspected = module.inspect_object(root, object_id, 4)
              inspected["split"] = split_by_id[object_id]
              inspected["reserve_metadata_sha256"] = reserved_rows[object_id]["metadata_sha256"]
              inspected["metadata_identity_matches_reserve"] = (
                  inspected.get("metadata_sha256") == reserved_rows[object_id]["metadata_sha256"]
              )
              inspected["numeric_payload_opened"] = False
              rows.append(inspected)
          supported_calibration = [
              row["object_id"] for row in rows
              if row["split"] == "calibration" and row["eligible"]
          ]
          supported_confirmation = [
              row["object_id"] for row in rows
              if row["split"] == "confirmation" and row["eligible"]
          ]
          result = {
              "schema": "bayesian-phystwin.transport4d_deform360_support_audit",
              "schema_version": 1,
              "reserve_id": reserve["reserve_id"],
              "reserve_protocol_id": reserve["protocol_id"],
              "dataset_root": str(root),
              "minimum_complete_episodes_per_object": 4,
              "status": "complete-metadata-and-file-identity-audit",
              "calibration_object_count": len(reserve["calibration_object_ids"]),
              "confirmation_object_count": len(reserve["confirmation_object_ids"]),
              "supported_calibration_object_ids": supported_calibration,
              "supported_confirmation_object_ids": supported_confirmation,
              "supported_calibration_object_count": len(supported_calibration),
              "supported_confirmation_object_count": len(supported_confirmation),
              "registered_minimum_calibration_objects": 15,
              "registered_minimum_confirmation_objects": 29,
              "numeric_confirmation_feasible": (
                  len(supported_calibration) >= 15
                  and len(supported_confirmation) >= 29
              ),
              "objects": rows,
              "information_boundary": {
                  "metadata_json_opened": True,
                  "directory_names_and_file_sizes_opened": True,
                  "robot_numeric_payload_opened": False,
                  "tactile_numeric_payload_opened": False,
                  "camera_pixel_opened": False,
                  "geometry_or_point_cloud_opened": False,
                  "target_outcome_opened": False,
                  "replacement_allowed": False,
                  "split_movement_allowed": False,
                  "confirmation_authorized": False,
                  "paper_claim_authorized": False,
              },
              "claim_boundary": (
                  "File-identity support audit on the already frozen object split. "
                  "Support-negative objects remain assigned and cannot be replaced. "
                  "The result opens no numeric carrier or outcome and cannot authorize confirmation."
              ),
          }
          encoded = json.dumps(
              result, sort_keys=True, separators=(",", ":"), allow_nan=False
          ).encode("utf-8")
          result["support_id"] = hashlib.sha256(encoded).hexdigest()
          output = Path(os.environ["OUTPUT_ROOT"])
          (output / "support.json").write_text(
              json.dumps(result, indent=2, sort_keys=True, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          reason_counts = {}
          for row in rows:
              if row["eligible"]:
                  reason = "eligible"
              else:
                  reason = row.get("reason") or "unknown"
              reason_counts[reason] = reason_counts.get(reason, 0) + 1
          lines = [
              "# Transport4D frozen-split carrier support",
              "",
              f"- Calibration support: **{len(supported_calibration)}/{len(reserve['calibration_object_ids'])}**",
              f"- Confirmation support: **{len(supported_confirmation)}/{len(reserve['confirmation_object_ids'])}**",
              f"- Registered numerical cohort feasible: **{str(result['numeric_confirmation_feasible']).lower()}**",
              f"- Support classifications: `{reason_counts}`",
              "",
              "No robot, tactile, image, geometry, point-cloud, or target-outcome payload was opened.",
              "Support-negative objects remain in their original calibration or confirmation split.",
          ]
          (output / "support.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(json.dumps({
              "support_id": result["support_id"],
              "supported_calibration_object_count": len(supported_calibration),
              "supported_confirmation_object_count": len(supported_confirmation),
              "numeric_confirmation_feasible": result["numeric_confirmation_feasible"],
              "reason_counts": reason_counts,
          }, indent=2, sort_keys=True))
          PY
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "revision=${GITHUB_SHA}"
            echo "source_revision=${{ needs.authorize.outputs.source_revision }}"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "dataset_root=$(readlink -f -- "${DATASET_ROOT}")"
            python3 --version
            uname -a
          } > "$output/environment.txt"
      - name: Validate target closure and support identity
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT_ROOT="${OUTPUT_ROOT}" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["OUTPUT_ROOT"]) / "support.json"
          result = json.loads(path.read_text(encoding="utf-8"))
          supplied = result.pop("support_id")
          encoded = json.dumps(
              result, sort_keys=True, separators=(",", ":"), allow_nan=False
          ).encode("utf-8")
          assert hashlib.sha256(encoded).hexdigest() == supplied
          assert len(result["objects"]) == 70
          assert all(row["numeric_payload_opened"] is False for row in result["objects"])
          assert all(row["metadata_identity_matches_reserve"] is True for row in result["objects"])
          boundary = result["information_boundary"]
          for name in (
              "robot_numeric_payload_opened",
              "tactile_numeric_payload_opened",
              "camera_pixel_opened",
              "geometry_or_point_cloud_opened",
              "target_outcome_opened",
              "replacement_allowed",
              "split_movement_allowed",
              "confirmation_authorized",
              "paper_claim_authorized",
          ):
              assert boundary[name] is False
          PY
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Publish support summary
        if: always()
        shell: bash
        run: |
          if test -f "${OUTPUT_ROOT}/support.md"; then
            cat "${OUTPUT_ROOT}/support.md" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "No support result was produced." >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Upload compact support audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: transport4d-deform360-support-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.OUTPUT_ROOT }}/support.json
            ${{ env.OUTPUT_ROOT }}/support.md
            ${{ env.OUTPUT_ROOT }}/environment.txt
          if-no-files-found: warn
          retention-days: 90
