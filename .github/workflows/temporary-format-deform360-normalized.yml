name: Temporary format Deform360 normalized study

on:
  push:
    branches:
      - agent/deform360-normalized-evidence-external-v1
    paths:
      - .github/workflows/temporary-format-deform360-normalized.yml

permissions:
  contents: write

concurrency:
  group: temporary-format-deform360-normalized
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/deform360-normalized-evidence-external-v1
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Format and verify only the study files
        run: |
          python -m pip install "ruff==0.16.1"
          python -m ruff format \
            scripts/science/run_deform360_normalized_evidence_external.py \
            tests/test_deform360_normalized_evidence_external.py
          python -m ruff check \
            scripts/science/run_deform360_normalized_evidence_external.py \
            tests/test_deform360_normalized_evidence_external.py
          python -m ruff format --check \
            scripts/science/run_deform360_normalized_evidence_external.py \
            tests/test_deform360_normalized_evidence_external.py
      - name: Commit formatted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/science/run_deform360_normalized_evidence_external.py \
            tests/test_deform360_normalized_evidence_external.py
          if git diff --cached --quiet; then
            echo "Study files were already formatted."
          else
            git commit -m "Format Deform360 normalized-evidence study"
            git push origin HEAD:agent/deform360-normalized-evidence-external-v1
          fi
