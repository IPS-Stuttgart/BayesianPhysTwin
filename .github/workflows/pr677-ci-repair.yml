name: PR 677 CI repair

on:
  push:
    branches:
      - experiment/deform-dlo-local-residual-v4

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: experiment/deform-dlo-local-residual-v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Patch CI integration and format changed Python
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          checkpoint = Path("tests/test_deform_dlo_checkpoint_belief.py")
          text = checkpoint.read_text(encoding="utf-8")
          text = text.replace("import pytest\nimport torch\n", "import pytest\n")
          for signature in (
              "def test_checkpoint_belief_average_preserves_discrete_state() -> None:\n",
              "def test_checkpoint_belief_average_rejects_discrete_disagreement() -> None:\n",
          ):
              replacement = signature + '    torch = pytest.importorskip("torch")\n'
              if replacement not in text:
                  if signature not in text:
                      raise SystemExit(f"missing expected signature: {signature.strip()}")
                  text = text.replace(signature, replacement, 1)
          checkpoint.write_text(text, encoding="utf-8")

          ensemble = Path("tests/test_deform_dlo_deep_ensemble.py")
          text = ensemble.read_text(encoding="utf-8")
          text = text.replace("import pytest\nimport torch\n", "import pytest\n")
          needle = ") -> None:\n    runner = _load_runner()\n"
          replacement = (
              ") -> None:\n"
              '    torch = pytest.importorskip("torch")\n'
              "    runner = _load_runner()\n"
          )
          if replacement not in text:
              if needle not in text:
                  raise SystemExit("missing expected deep-ensemble torch test body")
              text = text.replace(needle, replacement, 1)
          ensemble.write_text(text, encoding="utf-8")

          manifest_path = Path(".github/quality/test-suites.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          stable = manifest["suites"]["stable-core-coverage"]
          pattern = "tests/test_deform_dlo*.py"
          if pattern not in stable:
              stable.append(pattern)
          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

          python -m pip install 'ruff>=0.6'
          mapfile -t changed_python < <(git diff --name-only origin/main...HEAD -- '*.py')
          python -m ruff format -- "${changed_python[@]}"
          python -m ruff check -- "${changed_python[@]}"
          python -m ruff format --check -- "${changed_python[@]}"
          python tools/quality/test_suite_manifest.py validate

          rm .github/workflows/pr677-ci-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix PR 677 CI integration'
          git push origin HEAD:experiment/deform-dlo-local-residual-v4
