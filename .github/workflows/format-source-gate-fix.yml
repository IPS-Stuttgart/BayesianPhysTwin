name: Format source-gate fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'agent/harden-source-gate-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/harden-source-gate-validation
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply repository formatter
        run: |
          python -m pip install 'ruff==0.16.2'
          python -m ruff format \
            src/bayesian_phystwin/deform360_prob4d_source_gate_validation.py \
            tests/test_deform360_prob4d_source_gate_regressions.py
          git diff --exit-code -- scripts/science/evaluate_deform360_prob4d_source_gate.py
      - name: Commit formatting only
        run: |
          if git diff --quiet -- \
            src/bayesian_phystwin/deform360_prob4d_source_gate_validation.py \
            tests/test_deform360_prob4d_source_gate_regressions.py; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/bayesian_phystwin/deform360_prob4d_source_gate_validation.py \
            tests/test_deform360_prob4d_source_gate_regressions.py
          git commit -m 'Format source-gate validation fix'
          git pull --rebase origin agent/harden-source-gate-validation
          git push origin HEAD:agent/harden-source-gate-validation
