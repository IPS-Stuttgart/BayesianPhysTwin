# workflow-lifecycle: permanent
# workflow-owner: IPS-Stuttgart maintainers
name: Deform360 decision-sufficient compression v1

on:
  push:
    branches: [science/deform360-decision-sufficient-compression-v1]
    paths:
      - ".github/requests/deform360-decision-sufficient-compression-v1.json"

permissions:
  actions: read
  contents: read

concurrency:
  group: deform360-decision-sufficient-compression-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  DATASET_ROOT: /mnt/seagate10tb/florianpfaff/datasets/deform360
  CONTROL_ROOT: control
  ORIGINAL_V6_ROOT: original-v6
  PARENT_CONTROL_ROOT: parent-control
  FROZEN_ROOT: frozen
  PROTOCOL_PATH: control/protocols/deform360_decision_sufficient_compression_v1.json
  RUNNER_PATH: control/scripts/science/run_deform360_decision_sufficient_compression_v1.py
  ORIGINAL_V6_RUNNER: original-v6/scripts/science/run_deform360_dependence_query_v6.py
  ORIGINAL_V6_PROTOCOL: original-v6/protocols/deform360_dependence_query_v6.json
  PARENT_PROTOCOL: parent-control/protocols/deform360_untouched_confirmation_v5.json
  ORIGINAL_V6_REVISION: 954538832106d8ded13f1101b3a2b2e855b40513
  PARENT_CONTROL_REVISION: e409527b8499a225bde8bd7f8c532a30e96548c6
  FROZEN_REVISION: 25ba91c021124569c4dcf84c66eda5ec088868e0
  DEPENDENCE_ARTIFACT_ID: "9811194776"
  DEPENDENCE_ARTIFACT_SHA256: 8b3bad2bc0620228ebe32027028b1666ea7772a1850f0ab45d525e30e4ced82a
  PARENT_ARTIFACT_ID: "9738998271"
  PARENT_ARTIFACT_SHA256: e98f9e2687f568d0d0fcabec9ce0393a7e1b34ca3019acb1e14fdf894885a948
  PARENT_RESULT_SHA256: 0ad16b15c94d81b8c14221a271eb1f647d689a530284570becdfeca87e0d8ec7
  PARENT_READINESS_SHA256: 58841144ae5105080ecb991cc73e9021214fc8676f9e55948ef3511fb12a2f8e
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install focused contract dependencies
        run: python -m pip install numpy==1.26.4 pytest ruff==0.14.14
      - name: Validate decision-sufficient compression contracts
        run: |
          python -m pytest -q \
            tests/test_deform360_decision_sufficient_compression_v1.py
          python "${RUNNER_PATH}" --self-test
          python -m json.tool "${PROTOCOL_PATH}" >/dev/null
          python -m py_compile "${RUNNER_PATH}"
          python -m ruff check \
            "${RUNNER_PATH}" \
            tests/test_deform360_decision_sufficient_compression_v1.py
          python -m ruff format --check \
            "${RUNNER_PATH}" \
            tests/test_deform360_decision_sufficient_compression_v1.py

  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      request_path: ${{ steps.request.outputs.request_path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: request
        name: Authorize one add-only compression request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = \
            refs/heads/science/deform360-decision-sufficient-compression-v1
          test "${PUSH_FORCED}" = false
          test "${BEFORE_SHA}" != 0000000000000000000000000000000000000000
          mapfile -t changed < <(git diff --name-status "${BEFORE_SHA}" "${GITHUB_SHA}")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = \
            $'A\t.github/requests/deform360-decision-sufficient-compression-v1.json'
          REQUEST=.github/requests/deform360-decision-sufficient-compression-v1.json
          REQUEST_PATH="${REQUEST}" python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          path = Path(os.environ["REQUEST_PATH"])
          value = json.loads(path.read_text(encoding="utf-8"))
          expected = {
              "schema": "bayesian-phystwin/deform360-decision-sufficient-compression-workflow-request-v1",
              "request_id": "deform360-decision-sufficient-compression-v1-20260902",
              "purpose": "Evaluate minimum-rank query-visible covariance factors on the exact completed 92-object same-mean Deform360 decision study, with full-factor parity and a rank-matched spectral control.",
              "runner_labels": ["self-hosted", "Linux", "X64", "gpuserver4090"],
              "dataset_root": "/mnt/seagate10tb/florianpfaff/datasets/deform360",
              "protocol_path": "protocols/deform360_decision_sufficient_compression_v1.json",
              "parent_dependence_run_id": 33528032875,
              "parent_dependence_artifact_id": 9811194776,
              "original_v6_revision": "954538832106d8ded13f1101b3a2b2e855b40513",
              "frozen_point_revision": "25ba91c021124569c4dcf84c66eda5ec088868e0",
              "retrospective_target_reuse": True,
              "paper_claim_authorized": False,
          }
          for key, expected_value in expected.items():
              if value.get(key) != expected_value:
                  raise SystemExit(f"invalid {key}: {value.get(key)!r}")
          allowed = set(expected) | {"expected_source_revision"}
          if set(value) != allowed:
              raise SystemExit("request fields differ from the frozen schema")
          parent = subprocess.check_output(
              ["git", "rev-parse", f"{os.environ['GITHUB_SHA']}^"],
              text=True,
          ).strip()
          if value["expected_source_revision"] != parent:
              raise SystemExit("expected_source_revision is not the trigger parent")
          PY
          echo "request_path=${REQUEST}" >> "${GITHUB_OUTPUT}"

  evaluate:
    needs: [contracts, authorize]
    if: >-
      always() && needs.contracts.result == 'success' &&
      needs.authorize.result == 'success'
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 240
    env:
      REQUEST_PATH: ${{ needs.authorize.outputs.request_path }}
    steps:
      - name: Check out compression control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          persist-credentials: false
          clean: true

      - name: Check out exact original v6 study
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 954538832106d8ded13f1101b3a2b2e855b40513
          path: original-v6
          persist-credentials: false
          clean: true

      - name: Check out exact parent confirmation control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: e409527b8499a225bde8bd7f8c532a30e96548c6
          path: parent-control
          persist-credentials: false
          clean: true

      - name: Check out exact frozen v3 point method
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 25ba91c021124569c4dcf84c66eda5ec088868e0
          path: frozen
          persist-credentials: false
          clean: true

      - name: Recover immutable parent evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf dependence-evidence parent-evidence \
            dependence-evidence.zip parent-evidence.zip
          mkdir -p dependence-evidence parent-evidence
          curl --fail --location --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${DEPENDENCE_ARTIFACT_ID}/zip" \
            --output dependence-evidence.zip
          printf '%s  %s\n' "${DEPENDENCE_ARTIFACT_SHA256}" \
            dependence-evidence.zip | sha256sum --check --strict
          unzip -q dependence-evidence.zip -d dependence-evidence
          test -s dependence-evidence/result.json
          curl --fail --location --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PARENT_ARTIFACT_ID}/zip" \
            --output parent-evidence.zip
          printf '%s  %s\n' "${PARENT_ARTIFACT_SHA256}" \
            parent-evidence.zip | sha256sum --check --strict
          unzip -q parent-evidence.zip -d parent-evidence
          test -s parent-evidence/result.json
          test -s parent-evidence/bound-readiness.json
          printf '%s  %s\n' "${PARENT_RESULT_SHA256}" \
            parent-evidence/result.json | sha256sum --check --strict
          printf '%s  %s\n' "${PARENT_READINESS_SHA256}" \
            parent-evidence/bound-readiness.json | sha256sum --check --strict

      - name: Prepare isolated numerical runtime
        shell: bash
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP}/decision-sufficient-compression-venv-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          output="${RUNNER_TEMP}/decision-sufficient-compression-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "${venv}" "${output}"
          python3 -m venv "${venv}"
          "${venv}/bin/python" -m pip install \
            --disable-pip-version-check numpy==1.26.4
          mkdir -p -- "${output}"
          {
            echo "PYTHON_BIN=${venv}/bin/python"
            echo "VENV_ROOT=${venv}"
            echo "OUTPUT_ROOT=${output}"
          } >> "${GITHUB_ENV}"

      - name: Validate exact lineage and runtime
        shell: bash
        run: |
          set -euo pipefail
          test -d "${DATASET_ROOT}"
          test "$(readlink -f -- "${DATASET_ROOT}")" = "${DATASET_ROOT}"
          test "$(git -C "${ORIGINAL_V6_ROOT}" rev-parse HEAD)" = \
            "${ORIGINAL_V6_REVISION}"
          test "$(git -C "${PARENT_CONTROL_ROOT}" rev-parse HEAD)" = \
            "${PARENT_CONTROL_REVISION}"
          test "$(git -C "${FROZEN_ROOT}" rev-parse HEAD)" = \
            "${FROZEN_REVISION}"
          "${PYTHON_BIN}" -m py_compile \
            "${RUNNER_PATH}" \
            "${ORIGINAL_V6_RUNNER}" \
            parent-control/scripts/science/run_deform360_untouched_confirmation_v5.py \
            frozen/scripts/science/run_deform360_action_kernel_v3.py \
            frozen/scripts/science/run_deform360_action_conditioned_tactile_v2.py
          "${PYTHON_BIN}" "${RUNNER_PATH}" --self-test
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "control_revision=${GITHUB_SHA}"
            echo "original_v6_revision=$(git -C "${ORIGINAL_V6_ROOT}" rev-parse HEAD)"
            echo "parent_control_revision=$(git -C "${PARENT_CONTROL_ROOT}" rev-parse HEAD)"
            echo "frozen_revision=$(git -C "${FROZEN_ROOT}" rev-parse HEAD)"
            echo "runner_name=${RUNNER_NAME}"
            echo "dataset_root=${DATASET_ROOT}"
            sha256sum \
              "${PROTOCOL_PATH}" \
              "${RUNNER_PATH}" \
              dependence-evidence.zip \
              dependence-evidence/result.json \
              parent-evidence.zip \
              parent-evidence/result.json \
              parent-evidence/bound-readiness.json
            "${PYTHON_BIN}" --version
            "${PYTHON_BIN}" -c \
              'import numpy; print("numpy=" + numpy.__version__)'
            uname -a
          } | tee "${OUTPUT_ROOT}/environment.txt"
          cp "${PROTOCOL_PATH}" "${OUTPUT_ROOT}/protocol.json"
          cp "control/${REQUEST_PATH}" "${OUTPUT_ROOT}/request.json"

      - name: Run decision-sufficient compression evaluation
        shell: bash
        run: |
          set -euo pipefail
          "${PYTHON_BIN}" "${RUNNER_PATH}" \
            --protocol "${PROTOCOL_PATH}" \
            --original-v6-runner "${ORIGINAL_V6_RUNNER}" \
            --original-v6-protocol "${ORIGINAL_V6_PROTOCOL}" \
            --parent-protocol "${PARENT_PROTOCOL}" \
            --parent-result parent-evidence/result.json \
            --readiness-json parent-evidence/bound-readiness.json \
            --data-root "${DATASET_ROOT}" \
            --original-v6-root "${ORIGINAL_V6_ROOT}" \
            --parent-control-root "${PARENT_CONTROL_ROOT}" \
            --frozen-root "${FROZEN_ROOT}" \
            --output-json "${OUTPUT_ROOT}/result.json" \
            --output-report "${OUTPUT_ROOT}/report.md" \
            --output-csv "${OUTPUT_ROOT}/object-results.csv" \
            | tee "${OUTPUT_ROOT}/console.log"
          cat "${OUTPUT_ROOT}/report.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Enforce exact parent parity and claim boundary
        shell: bash
        run: |
          set -euo pipefail
          "${PYTHON_BIN}" - <<'PY'
          import hashlib
          import json
          import math
          import os
          from pathlib import Path

          root = Path(os.environ["OUTPUT_ROOT"])
          result = json.loads((root / "result.json").read_text(encoding="utf-8"))
          parent = json.loads(
              Path("dependence-evidence/result.json").read_text(encoding="utf-8")
          )
          if result["status"] != "complete":
              raise SystemExit("compression result is incomplete")
          if result["summary"]["object_count"] != 92:
              raise SystemExit("complete 92-object roster was not evaluated")
          boundary = result["information_boundary"]
          for key in (
              "exact_frozen_point_predictor_reused",
              "exact_parent_point_result_reproduced",
              "same_predictive_mean_for_all_representations",
              "query_projection_uses_only_registered_queries_and_covariance_factor",
          ):
              if boundary[key] is not True:
                  raise SystemExit(f"required boundary failed: {key}")
          if boundary["query_projection_uses_target_outcomes"] is not False:
              raise SystemExit("target outcomes influenced the projection")
          current_full = result["summary"]["representation_summary"]["full_low_rank"]
          parent_full = parent["summary"]["arm_summary"]["full_low_rank"]
          for metric, value in current_full.items():
              if not math.isclose(
                  float(value),
                  float(parent_full[metric]),
                  rel_tol=1e-12,
                  abs_tol=1e-12,
              ):
                  raise SystemExit(f"full-factor parent metric changed: {metric}")
          decision = result["decision"]
          for key in (
              "global_field_covariance_preservation_supported",
              "arbitrary_future_query_preservation_supported",
              "calibration_supported",
              "closed_loop_robot_control_supported",
              "paper_claim_authorized",
          ):
              if decision[key] is not False:
                  raise SystemExit(f"result self-authorized forbidden claim: {key}")
          unsigned = dict(result)
          supplied = unsigned.pop("result_sha256")
          encoded = json.dumps(
              unsigned,
              sort_keys=True,
              separators=(",", ":"),
              allow_nan=False,
          ).encode("utf-8")
          if hashlib.sha256(encoded).hexdigest() != supplied:
              raise SystemExit("result digest is invalid")
          PY
          sha256sum "${OUTPUT_ROOT}"/* > "${OUTPUT_ROOT}/sha256sums.txt"
          git -C control diff --exit-code
          test -z "$(git -C control status --porcelain --untracked-files=all)"
          git -C original-v6 diff --exit-code
          test -z "$(git -C original-v6 status --porcelain --untracked-files=all)"
          git -C parent-control diff --exit-code
          test -z "$(git -C parent-control status --porcelain --untracked-files=all)"
          git -C frozen diff --exit-code
          test -z "$(git -C frozen status --porcelain --untracked-files=all)"

      - name: Upload complete compression evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: deform360-decision-sufficient-compression-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_ROOT }}
          if-no-files-found: warn
          retention-days: 90

      - name: Remove isolated runtime
        if: always()
        shell: bash
        run: rm -rf -- "${VENV_ROOT:-}"
