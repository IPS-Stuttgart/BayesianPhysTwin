name: Temporary domain harm-risk formatter

on:
  push:
    branches:
      - agent/domain-harm-risk-certificate-v1

permissions:
  contents: write

jobs:
  format-and-remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/domain-harm-risk-certificate-v1
          persist-credentials: true
      - name: Apply authoritative formatting and remove this workflow
        run: |
          set -euo pipefail
          python -m pip install "ruff==0.16.2"
          python -m ruff format \
            src/bayesian_phystwin/guard_harm_risk_domains.py \
            tests/test_guard_harm_risk_domains.py
          python -m ruff format --check \
            src/bayesian_phystwin/guard_harm_risk_domains.py \
            tests/test_guard_harm_risk_domains.py
          rm .github/workflows/domain-harm-risk-format.yml
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayesian_phystwin/guard_harm_risk_domains.py \
            tests/test_guard_harm_risk_domains.py \
            .github/workflows/domain-harm-risk-format.yml
          git diff --cached --check
          git commit -m "Apply canonical domain harm-risk formatting"
          git push origin HEAD:agent/domain-harm-risk-certificate-v1
