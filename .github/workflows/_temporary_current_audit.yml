name: Temporary current-main bug audit

on:
  push:
    branches:
      - agent/fix-significant-bugs-20260809
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: temporary-current-main-bug-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install audit environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev,data,graph,vision]"
          python -m pip install hypothesis pytest-timeout pip-audit
          python -m pip check

      - name: Run static and package checks
        run: |
          set -euo pipefail
          python -m compileall -q src scripts tools tests
          python -m ruff check src tests scripts tools
          python -m ruff format --check src tests scripts tools
          python -m mypy src/bayesian_phystwin
          python -m build
          python -m pip_audit --strict

      - name: Run full test suite in importlib mode
        env:
          PYTHONHASHSEED: "271828"
        run: python -m pytest -q --import-mode=importlib --disable-warnings --maxfail=20

      - name: Package exact audited checkout
        if: always()
        run: |
          set -euo pipefail
          git status --short > current-audit-git-status.txt
          git rev-parse HEAD > current-audit-head.txt
          tar \
            --exclude=.git \
            --exclude=dist \
            --exclude='*.egg-info' \
            --exclude=current-audited-checkout.tar.gz \
            -czf current-audited-checkout.tar.gz .

      - name: Upload exact audited checkout
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: current-audited-checkout
          path: |
            current-audited-checkout.tar.gz
            current-audit-git-status.txt
            current-audit-head.txt
          if-no-files-found: error
          retention-days: 3
