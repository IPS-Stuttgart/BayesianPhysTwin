name: Reconcile CLI consolidation v2 with current main

# Second commit intentionally triggers the branch-local workflow.
on:
  push:
    branches: [agent/consolidate-cli-entrypoints-v2]
    paths:
      - ".github/workflows/reconcile-cli-consolidation-v2.yml"

permissions:
  contents: write

concurrency:
  group: reconcile-cli-consolidation-v2
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/consolidate-cli-entrypoints-v2
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Merge current main and resolve owned conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [[ $merge_status -ne 0 ]]; then
            git checkout --ours src/bayesian_phystwin/cli/main.py
            git checkout --theirs pyproject.toml .github/workflows/tests.yml
          fi
          python - <<'PY'
          from pathlib import Path
          import re

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text(encoding="utf-8")
          replacement = (
              '[project.scripts]\n'
              'bpt = "bayesian_phystwin.cli.main:main"\n\n'
          )
          updated, count = re.subn(
              r"(?ms)^\[project\.scripts\]\n.*?(?=^\[)",
              replacement,
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("project.scripts table not found exactly once")
          pyproject.write_text(updated, encoding="utf-8")

          tests = Path(".github/workflows/tests.yml")
          text = tests.read_text(encoding="utf-8")
          old = (
              '          "$bin/bpt-provider-manifest" --help\n'
              '          "$bin/bpt-run-manifest" --help\n'
          )
          new = (
              '          "$bin/bpt" experiment list >/dev/null\n'
              '          "$bin/bpt" experiment describe phystwin-refit\n'
          )
          if new not in text:
              if old not in text:
                  raise SystemExit("legacy installed-script smoke checks not found")
              text = text.replace(old, new, 1)
          tests.write_text(text, encoding="utf-8")
          PY
          git add pyproject.toml .github/workflows/tests.yml src/bayesian_phystwin/cli/main.py
          unresolved="$(git diff --name-only --diff-filter=U)"
          if [[ -n "$unresolved" ]]; then
            echo "Unresolved merge conflicts:" >&2
            echo "$unresolved" >&2
            exit 1
          fi
      - name: Validate consolidated command surface
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build
          python -m pytest -q tests/test_cli_main.py tests/test_release_metadata.py
          python -m ruff check \
            src/bayesian_phystwin/cli/main.py \
            src/bayesian_phystwin/cli/experiments.py \
            tests/test_cli_main.py
          python -m ruff format --check \
            src/bayesian_phystwin/cli/main.py \
            src/bayesian_phystwin/cli/experiments.py \
            tests/test_cli_main.py
          python -m mypy --python-version 3.12 \
            src/bayesian_phystwin/cli/main.py \
            src/bayesian_phystwin/cli/experiments.py
          python -m build --wheel --sdist
          python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          scripts = data["project"]["scripts"]
          if scripts != {"bpt": "bayesian_phystwin.cli.main:main"}:
              raise SystemExit(f"unexpected script surface: {scripts}")
          PY
          git diff --check
      - name: Commit reconciled branch
        shell: bash
        run: |
          rm .github/workflows/reconcile-cli-consolidation-v2.yml
          git add -A
          git commit -m "Reconcile CLI consolidation with current main"
          git push origin HEAD:agent/consolidate-cli-entrypoints-v2
