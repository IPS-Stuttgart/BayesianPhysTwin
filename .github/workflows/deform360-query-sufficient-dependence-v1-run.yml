# workflow-lifecycle: one-shot-scientific
# workflow-owner: IPS-Stuttgart maintainers
name: Deform360 query-sufficient dependence v1 run

on:
  push:
    branches:
      - science/deform360-query-sufficient-dependence-v1
    paths:
      - .github/requests/deform360-query-sufficient-dependence-v1-run.json

permissions:
  actions: read
  contents: read

concurrency:
  group: deform360-query-sufficient-dependence-v1-run
  cancel-in-progress: false

env:
  DATASET_ROOT: /mnt/seagate10tb/florianpfaff/datasets/deform360
  PROTOCOL_PATH: experiment/protocols/deform360_query_sufficient_dependence_v1.json
  RUNNER_PATH: experiment/scripts/science/run_deform360_query_sufficient_dependence_v1.py
  ORIGINAL_V6_REVISION: 954538832106d8ded13f1101b3a2b2e855b40513
  RECOVERY_REVISION: 0f9312a3cae9f854631d8c61c2893c6527014219
  PARENT_CONTROL_REVISION: e409527b8499a225bde8bd7f8c532a30e96548c6
  FROZEN_REVISION: 25ba91c021124569c4dcf84c66eda5ec088868e0
  PROB4D_REVISION: 25d7fc1c363892f432c4f3ddf15665fc20ab727e
  REFERENCE_ARTIFACT_ID: "9811194776"
  REFERENCE_ARTIFACT_SHA256: 8b3bad2bc0620228ebe32027028b1666ea7772a1850f0ab45d525e30e4ced82a
  PARENT_ARTIFACT_ID: "9738998271"
  PARENT_ARTIFACT_SHA256: e98f9e2687f568d0d0fcabec9ce0393a7e1b34ca3019acb1e14fdf894885a948
  PARENT_RESULT_SHA256: 0ad16b15c94d81b8c14221a271eb1f647d689a530284570becdfeca87e0d8ec7
  PARENT_READINESS_SHA256: 58841144ae5105080ecb991cc73e9021214fc8676f9e55948ef3511fb12a2f8e
  OUTPUT_ROOT: evidence-output
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out proposed experiment
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install focused dependencies
        run: python -m pip install numpy==1.26.4 pytest ruff==0.14.14
      - name: Validate evaluator, tests, and protocol
        run: |
          set -euo pipefail
          python -m json.tool protocols/deform360_query_sufficient_dependence_v1.json >/dev/null
          python -m py_compile scripts/science/run_deform360_query_sufficient_dependence_v1.py
          python scripts/science/run_deform360_query_sufficient_dependence_v1.py --self-test
          python -m pytest -q tests/test_deform360_query_sufficient_dependence_v1.py
          python -m ruff check \
            scripts/science/run_deform360_query_sufficient_dependence_v1.py \
            tests/test_deform360_query_sufficient_dependence_v1.py

  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      trigger_parent: ${{ steps.request.outputs.trigger_parent }}
    steps:
      - name: Check out trigger commit and parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: request
        name: Authorize exactly one add-only request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = refs/heads/science/deform360-query-sufficient-dependence-v1
          test "${PUSH_FORCED}" = false
          test "${BEFORE_SHA}" != 0000000000000000000000000000000000000000
          mapfile -t changed < <(git diff --name-status "${BEFORE_SHA}" "${GITHUB_SHA}")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = $'A\t.github/requests/deform360-query-sufficient-dependence-v1-run.json'
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('.github/requests/deform360-query-sufficient-dependence-v1-run.json')
          value = json.loads(path.read_text(encoding='utf-8'))
          expected = {
              'schema': 'bayesian-phystwin/deform360-query-sufficient-dependence-request-v1',
              'request_id': 'deform360-query-sufficient-dependence-v1-run-20260903',
              'expected_source_revision': 'trigger-parent',
              'protocol_path': 'protocols/deform360_query_sufficient_dependence_v1.json',
              'runner_path': 'scripts/science/run_deform360_query_sufficient_dependence_v1.py',
              'runner_labels': ['self-hosted', 'Linux', 'X64', 'gpuserver4090'],
              'dataset_root': '/mnt/seagate10tb/florianpfaff/datasets/deform360',
              'reference_workflow_run_id': 33528032875,
              'reference_artifact_id': 9811194776,
              'reference_artifact_sha256': '8b3bad2bc0620228ebe32027028b1666ea7772a1850f0ab45d525e30e4ced82a',
              'query_count': 5,
              'maximum_portfolio_rank': 5,
              'matched_rank_energy_control': True,
              'fixed_query_cache_baseline_required': True,
              'retrospective_target_reuse': True,
              'new_dataset_namespace_opened': False,
              'new_measurements_collected': False,
              'paper_claim_authorized': False,
          }
          if value != expected:
              raise SystemExit('request differs from the frozen request contract')
          PY
          parent="$(git rev-parse "${GITHUB_SHA}^")"
          test "${parent}" = "${BEFORE_SHA}"
          echo "trigger_parent=${parent}" >> "${GITHUB_OUTPUT}"

  evaluate:
    needs: [contracts, authorize]
    if: >-
      always() && needs.contracts.result == 'success' &&
      needs.authorize.result == 'success'
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 240
    env:
      TRIGGER_PARENT: ${{ needs.authorize.outputs.trigger_parent }}
    steps:
      - name: Check out exact trigger tree and parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: experiment
          persist-credentials: false
          clean: true
          fetch-depth: 2

      - name: Materialize exact source repositories
        shell: bash
        run: |
          set -euo pipefail
          rm -rf original-v6 recovery parent-control frozen prob4d
          clone_exact() {
            local url="$1"
            local revision="$2"
            local destination="$3"
            git init -q "${destination}"
            git -C "${destination}" remote add origin "${url}"
            git -C "${destination}" fetch -q --depth 1 origin "${revision}"
            git -C "${destination}" checkout -q --detach FETCH_HEAD
            test "$(git -C "${destination}" rev-parse HEAD)" = "${revision}"
          }
          clone_exact https://github.com/IPS-Stuttgart/BayesianPhysTwin.git "${ORIGINAL_V6_REVISION}" original-v6
          clone_exact https://github.com/IPS-Stuttgart/BayesianPhysTwin.git "${RECOVERY_REVISION}" recovery
          clone_exact https://github.com/IPS-Stuttgart/BayesianPhysTwin.git "${PARENT_CONTROL_REVISION}" parent-control
          clone_exact https://github.com/IPS-Stuttgart/BayesianPhysTwin.git "${FROZEN_REVISION}" frozen
          clone_exact https://github.com/IPS-Stuttgart/Prob4D.git "${PROB4D_REVISION}" prob4d

      - name: Recover exact reference and parent artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf reference-evidence parent-evidence reference-evidence.zip parent-evidence.zip
          mkdir -p reference-evidence parent-evidence
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts"
          headers=(
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          curl --fail --location --retry 3 --retry-all-errors \
            "${headers[@]}" "${api}/${REFERENCE_ARTIFACT_ID}/zip" \
            --output reference-evidence.zip
          printf '%s  %s\n' "${REFERENCE_ARTIFACT_SHA256}" reference-evidence.zip \
            | sha256sum --check --strict
          unzip -q reference-evidence.zip -d reference-evidence
          test -s reference-evidence/result.json
          curl --fail --location --retry 3 --retry-all-errors \
            "${headers[@]}" "${api}/${PARENT_ARTIFACT_ID}/zip" \
            --output parent-evidence.zip
          printf '%s  %s\n' "${PARENT_ARTIFACT_SHA256}" parent-evidence.zip \
            | sha256sum --check --strict
          unzip -q parent-evidence.zip -d parent-evidence
          printf '%s  %s\n' "${PARENT_RESULT_SHA256}" parent-evidence/result.json \
            | sha256sum --check --strict
          printf '%s  %s\n' "${PARENT_READINESS_SHA256}" \
            parent-evidence/bound-readiness.json | sha256sum --check --strict

      - name: Prepare deterministic runtime and bind reference bytes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${OUTPUT_ROOT}"
          mkdir -p "${OUTPUT_ROOT}"
          venv="${RUNNER_TEMP}/deform360-query-sufficient-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "${venv}"
          python3 -m venv "${venv}"
          "${venv}/bin/python" -m pip install --disable-pip-version-check numpy==1.26.4
          echo "PYTHON_BIN=${venv}/bin/python" >> "${GITHUB_ENV}"
          echo "VENV_ROOT=${venv}" >> "${GITHUB_ENV}"
          "${venv}/bin/python" - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          source = Path('experiment/protocols/deform360_query_sufficient_dependence_v1.json')
          reference = Path('reference-evidence/result.json')
          output = Path('evidence-output/runtime-protocol.json')
          protocol = json.loads(source.read_text(encoding='utf-8'))
          marker = protocol['reference_result']['result_json_sha256']
          if marker != 'derive-from-bound-artifact-before-evaluation':
              raise SystemExit('unexpected committed result-hash marker')
          protocol['reference_result']['result_json_sha256'] = hashlib.sha256(
              reference.read_bytes()
          ).hexdigest()
          output.write_text(
              json.dumps(protocol, indent=2, sort_keys=True, allow_nan=False) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Validate identities and complete data root
        shell: bash
        run: |
          set -euo pipefail
          test -d "${DATASET_ROOT}"
          test "$(readlink -f -- "${DATASET_ROOT}")" = "${DATASET_ROOT}"
          test "$(git -C experiment rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git -C experiment rev-parse "${GITHUB_SHA}^")" = "${TRIGGER_PARENT}"
          test "$(git -C original-v6 hash-object scripts/science/run_deform360_dependence_query_v6.py)" = b5c2b219f083d3f3af578a840194829bacd56e3e
          test "$(git -C recovery hash-object scripts/science/run_deform360_dependence_query_v6_bound_carrier_recovery_v1.py)" = 0955ad7ce0c176e7538bd5b91cc36e3444564be5
          test "$(git -C prob4d hash-object src/prob4d/query_preserving_compression.py)" = 06cd938e5c705d8fab62eaf8338baa6bbd40f5c5
          "${PYTHON_BIN}" -m py_compile \
            experiment/scripts/science/run_deform360_query_sufficient_dependence_v1.py \
            original-v6/scripts/science/run_deform360_dependence_query_v6.py \
            recovery/scripts/science/run_deform360_dependence_query_v6_bound_carrier_recovery_v1.py \
            parent-control/scripts/science/run_deform360_untouched_confirmation_v5.py \
            parent-control/scripts/science/audit_deform360_untouched_confirmation_v5.py \
            frozen/scripts/science/run_deform360_action_kernel_v3.py \
            frozen/scripts/science/run_deform360_action_conditioned_tactile_v2.py \
            prob4d/src/prob4d/query_preserving_compression.py
          "${PYTHON_BIN}" experiment/scripts/science/run_deform360_query_sufficient_dependence_v1.py --self-test
          cp experiment/.github/requests/deform360-query-sufficient-dependence-v1-run.json "${OUTPUT_ROOT}/request.json"
          cp "${PROTOCOL_PATH}" "${OUTPUT_ROOT}/committed-protocol.json"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "trigger_revision=${GITHUB_SHA}"
            echo "trigger_parent=${TRIGGER_PARENT}"
            echo "runner_name=${RUNNER_NAME}"
            echo "dataset_root=${DATASET_ROOT}"
            echo "original_v6_revision=$(git -C original-v6 rev-parse HEAD)"
            echo "recovery_revision=$(git -C recovery rev-parse HEAD)"
            echo "parent_control_revision=$(git -C parent-control rev-parse HEAD)"
            echo "frozen_revision=$(git -C frozen rev-parse HEAD)"
            echo "prob4d_revision=$(git -C prob4d rev-parse HEAD)"
            sha256sum \
              experiment/scripts/science/run_deform360_query_sufficient_dependence_v1.py \
              "${OUTPUT_ROOT}/runtime-protocol.json" \
              reference-evidence/result.json reference-evidence.zip \
              parent-evidence/result.json parent-evidence/bound-readiness.json \
              parent-evidence.zip
            "${PYTHON_BIN}" --version
            "${PYTHON_BIN}" -c 'import numpy; print("numpy=" + numpy.__version__)'
            uname -a
          } | tee "${OUTPUT_ROOT}/environment.txt"

      - name: Evaluate all 92 bound objects
        shell: bash
        run: |
          set -euo pipefail
          "${PYTHON_BIN}" experiment/scripts/science/run_deform360_query_sufficient_dependence_v1.py \
            --protocol "${OUTPUT_ROOT}/runtime-protocol.json" \
            --reference-result reference-evidence/result.json \
            --reference-protocol original-v6/protocols/deform360_dependence_query_v6.json \
            --original-v6-runner original-v6/scripts/science/run_deform360_dependence_query_v6.py \
            --recovery-runner recovery/scripts/science/run_deform360_dependence_query_v6_bound_carrier_recovery_v1.py \
            --parent-protocol parent-control/protocols/deform360_untouched_confirmation_v5.json \
            --parent-result parent-evidence/result.json \
            --readiness-json parent-evidence/bound-readiness.json \
            --data-root "${DATASET_ROOT}" \
            --original-v6-root original-v6 \
            --recovery-root recovery \
            --parent-control-root parent-control \
            --frozen-root frozen \
            --prob4d-root prob4d \
            --output-json "${OUTPUT_ROOT}/result.json" \
            --output-report "${OUTPUT_ROOT}/report.md" \
            --output-csv "${OUTPUT_ROOT}/object-results.csv" \
            | tee "${OUTPUT_ROOT}/console.log"
          cat "${OUTPUT_ROOT}/report.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Enforce exactness and bounded claims
        shell: bash
        run: |
          set -euo pipefail
          "${PYTHON_BIN}" - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('evidence-output')
          result = json.loads((root / 'result.json').read_text(encoding='utf-8'))
          if result.get('status') != 'complete':
              raise SystemExit('result is incomplete')
          if result['summary']['object_count'] != 92:
              raise SystemExit('complete 92-object roster was not evaluated')
          decision = result['decision']
          if decision['query_sufficient_representation_supported'] is not True:
              failed = [name for name, value in decision['gates'].items() if not value]
              raise SystemExit(f'query-sufficient gate failed: {failed}')
          if decision['existing_decision_advantage_retained_exactly'] is not True:
              raise SystemExit('existing dependence advantage was not retained')
          for key in (
              'query_calibration_supported',
              'fresh_confirmation_authorized',
              'paper_claim_authorized',
              'deployment_safety_authorized',
          ):
              if decision[key] is not False:
                  raise SystemExit(f'forbidden claim self-authorized: {key}')
          boundary = result['information_boundary']
          for key in (
              'point_predictor_changed',
              'full_covariance_changed_before_compression',
              'query_bank_changed',
              'source_calibration_changed',
              'decision_rule_changed',
              'target_outcomes_used_to_select_projection_or_rank',
              'unbound_numeric_payloads_opened',
              'camera_pixels_opened',
              'geometry_or_point_cloud_opened',
              'new_measurements_collected',
              'full_field_covariance_preserved',
          ):
              if boundary[key] is not False:
                  raise SystemExit(f'forbidden or overstated boundary: {key}')
          if boundary['registered_query_portfolio_covariance_preserved'] is not True:
              raise SystemExit('registered query covariance was not preserved')
          unsigned = dict(result)
          supplied = unsigned.pop('result_sha256')
          encoded = json.dumps(
              unsigned, sort_keys=True, separators=(',', ':'), allow_nan=False
          ).encode('utf-8')
          if hashlib.sha256(encoded).hexdigest() != supplied:
              raise SystemExit('result digest is invalid')
          PY
          sha256sum "${OUTPUT_ROOT}"/* > "${OUTPUT_ROOT}/sha256sums.txt"
          for root in experiment original-v6 recovery parent-control frozen prob4d; do
            git -C "${root}" diff --exit-code
            test -z "$(git -C "${root}" status --porcelain --untracked-files=all)"
          done

      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: deform360-query-sufficient-dependence-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence-output
          if-no-files-found: warn
          retention-days: 90

      - name: Clean isolated execution material
        if: always()
        shell: bash
        run: |
          rm -rf -- "${VENV_ROOT:-}" original-v6 recovery parent-control frozen prob4d \
            reference-evidence parent-evidence reference-evidence.zip parent-evidence.zip
