# workflow-lifecycle: one-shot
# workflow-owner: IPS-Stuttgart maintainers
name: Terminal Tracking Cloth cross-action transport v4

on:
  push:
    branches:
      - research/tracking-cloth-cross-action-transport-source-v1
    paths:
      - ".github/requests/tracking-cloth-cross-action-transport-terminal-v4.json"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tracking-cloth-cross-action-transport-terminal-v4
  cancel-in-progress: false

jobs:
  terminal:
    name: Validate existing result or execute sealed source-target gate
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 150
    env:
      DATASET_ROOT: /home/github-runner/.cache/datasets/tracking-cloth-deformation-v1-zenodo-14644526
      RUN_DIR: ${{ github.workspace }}/.run/tracking-cloth-cross-action-transport-terminal-v4
      RESULT_DIR: results/science/tracking_cloth_cross_action_transport_v1/source-target-20260902-v1
      STATUS_DIR: results/science/tracking_cloth_cross_action_transport_v1/terminal-v4
    steps:
      - name: Check out exact terminal request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Execute or validate while retaining terminal diagnostics
        id: execute
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUN_DIR/logs" "$STATUS_DIR"
          status=success
          mode=execute
          failing_stage=""
          exit_code=0
          result="$RESULT_DIR/result.json"
          report="$RESULT_DIR/report.md"
          seal="$RESULT_DIR/prediction_seal.json"
          protocol=experiments/tracking_cloth_cross_action_transport_v1/protocol.json

          run_stage() {
            local stage="$1"
            shift
            echo "=== $stage ===" | tee "$RUN_DIR/logs/$stage.log"
            "$@" >> "$RUN_DIR/logs/$stage.log" 2>&1
            local code=$?
            if [ "$code" -ne 0 ]; then
              status=failure
              failing_stage="$stage"
              exit_code="$code"
              return "$code"
            fi
            return 0
          }

          if [ -f "$result" ]; then
            mode=validate-existing-result
            run_stage validate_existing_result python3 - "$result" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          result = json.loads(path.read_text(encoding="utf-8"))
          assert result["schema"] == (
              "bayesian-phystwin.tracking-cloth-cross-action-transport.result"
          )
          assert result["decision"] in {
              "cross-action-transport-source-gate-pass",
              "cross-action-transport-source-gate-negative",
          }
          assert result["numeric_access"]["repetition_3_cases"] == 0
          assert result["rep3_confirmation_authorized"] is False
          assert result["retrospective"] is True
          assert result["independently_blind_confirmation"] is False
          PY
          else
            if ! run_stage dataset_preflight bash -lc '
              set -euo pipefail
              test -d "$DATASET_ROOT"
              test -r "$DATASET_ROOT"
              count=$(find "$DATASET_ROOT" -type f -name "*.csv" | wc -l)
              test "$count" -ge 120
              printf "csv_count=%s\n" "$count"
              python3 --version
            '; then :; fi

            if [ "$status" = success ]; then
              if ! run_stage runtime_setup bash -lc '
                set -euo pipefail
                rm -rf "$RUN_DIR/runtime"
                python3 -m venv --system-site-packages "$RUN_DIR/runtime"
                "$RUN_DIR/runtime/bin/python" -m pip install --no-deps -e .
                "$RUN_DIR/runtime/bin/python" -m pip check
              '; then :; fi
            fi

            if [ "$status" = success ]; then
              if ! run_stage source_contract bash -lc '
                set -euo pipefail
                export PYTHONPATH="$GITHUB_WORKSPACE/src${PYTHONPATH:+:$PYTHONPATH}"
                "$RUN_DIR/runtime/bin/python" -m pytest -q \
                  tests/test_tracking_cloth_cross_action_transport_v1.py
                "$RUN_DIR/runtime/bin/python" -m compileall -q \
                  experiments/tracking_cloth_cross_action_transport_v1
              '; then :; fi
            fi

            if [ "$status" = success ]; then
              if ! run_stage seal_predictions bash -lc '
                set -euo pipefail
                export PYTHONPATH="$GITHUB_WORKSPACE/src${PYTHONPATH:+:$PYTHONPATH}"
                rm -rf "$RUN_DIR/sealed" "$RUN_DIR/scored"
                "$RUN_DIR/runtime/bin/python" -m \
                  experiments.tracking_cloth_cross_action_transport_v1.run \
                  --stage seal \
                  --dataset-root "$DATASET_ROOT" \
                  --protocol experiments/tracking_cloth_cross_action_transport_v1/protocol.json \
                  --work-dir "$RUN_DIR/sealed"
                python3 - <<"PY"
          import json
          from pathlib import Path
          seal = json.loads(
              Path(".run/tracking-cloth-cross-action-transport-terminal-v4/sealed/seal.json").read_text(
                  encoding="utf-8"
              )
          )
          assert seal["numeric_access"] == {
              "repetition_1_cases": 12,
              "repetition_2_diagnostic_cases": 4,
              "repetition_2_held_target_cases": 0,
              "repetition_3_cases": 0,
          }
          assert seal["target_outcomes_used_to_select_or_fit"] is False
          PY
              '; then :; fi
            fi

            if [ "$status" = success ]; then
              if ! run_stage score_held_actions bash -lc '
                set -euo pipefail
                export PYTHONPATH="$GITHUB_WORKSPACE/src${PYTHONPATH:+:$PYTHONPATH}"
                mkdir -p "$RUN_DIR/scored"
                "$RUN_DIR/runtime/bin/python" -m \
                  experiments.tracking_cloth_cross_action_transport_v1.run \
                  --stage score \
                  --dataset-root "$DATASET_ROOT" \
                  --protocol experiments/tracking_cloth_cross_action_transport_v1/protocol.json \
                  --work-dir "$RUN_DIR/sealed" \
                  --output "$RUN_DIR/scored/result.json" \
                  --report "$RUN_DIR/scored/report.md"
                python3 - <<"PY"
          import json
          from pathlib import Path
          result = json.loads(
              Path(".run/tracking-cloth-cross-action-transport-terminal-v4/scored/result.json").read_text(
                  encoding="utf-8"
              )
          )
          assert result["numeric_access"] == {
              "repetition_1_cases": 12,
              "repetition_2_diagnostic_cases_before_seal": 4,
              "repetition_2_held_target_cases_after_seal": 8,
              "repetition_3_cases": 0,
          }
          assert result["rep3_confirmation_authorized"] is False
          PY
              '; then :; fi
            fi

            if [ "$status" = success ]; then
              mkdir -p "$RESULT_DIR"
              cp "$RUN_DIR/scored/result.json" "$result"
              cp "$RUN_DIR/scored/report.md" "$report"
              cp "$RUN_DIR/sealed/seal.json" "$seal"
              cp "$protocol" "$RESULT_DIR/protocol.json"
              cp experiments/tracking_cloth_cross_action_transport_v1/run.py \
                "$RESULT_DIR/run.py"
            fi
          fi

          STATUS="$status" MODE="$mode" FAILING_STAGE="$failing_stage" \
          EXIT_CODE="$exit_code" RESULT_PATH="$result" REPORT_PATH="$report" \
          SEAL_PATH="$seal" python3 - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import subprocess
          from pathlib import Path

          def digest(path: Path) -> str | None:
              if not path.is_file():
                  return None
              value = hashlib.sha256()
              with path.open("rb") as handle:
                  while chunk := handle.read(1024 * 1024):
                      value.update(chunk)
              return value.hexdigest()

          def tail(path: Path, lines: int = 120) -> list[str]:
              if not path.is_file():
                  return []
              return path.read_text(encoding="utf-8", errors="replace").splitlines()[-lines:]

          run_dir = Path(os.environ["RUN_DIR"])
          status_dir = Path(os.environ["STATUS_DIR"])
          status_dir.mkdir(parents=True, exist_ok=True)
          result_path = Path(os.environ["RESULT_PATH"])
          report_path = Path(os.environ["REPORT_PATH"])
          seal_path = Path(os.environ["SEAL_PATH"])
          result = None
          if result_path.is_file():
              result = json.loads(result_path.read_text(encoding="utf-8"))
          failing_stage = os.environ["FAILING_STAGE"] or None
          record = {
              "schema": "bayesian-phystwin.tracking-cloth-cross-action-transport.terminal-status",
              "schema_version": 1,
              "status": os.environ["STATUS"],
              "mode": os.environ["MODE"],
              "failing_stage": failing_stage,
              "exit_code": int(os.environ["EXIT_CODE"]),
              "request_sha": os.environ.get("GITHUB_SHA"),
              "checked_out_sha": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "runner_name": os.environ.get("RUNNER_NAME"),
              "python": platform.python_version(),
              "dataset_root": os.environ["DATASET_ROOT"],
              "dataset_csv_count": sum(
                  1 for _ in Path(os.environ["DATASET_ROOT"]).rglob("*.csv")
              ) if Path(os.environ["DATASET_ROOT"]).is_dir() else 0,
              "result_path": str(result_path),
              "result_sha256": digest(result_path),
              "report_sha256": digest(report_path),
              "prediction_seal_sha256": digest(seal_path),
              "scientific_decision": result.get("decision") if result else None,
              "result_id": result.get("result_id") if result else None,
              "rep3_confirmation_authorized": (
                  result.get("rep3_confirmation_authorized") if result else False
              ),
              "numeric_rep3_cases": (
                  result.get("numeric_access", {}).get("repetition_3_cases")
                  if result else 0
              ),
              "failure_log_tail": (
                  tail(run_dir / "logs" / f"{failing_stage}.log")
                  if failing_stage else []
              ),
          }
          payload = json.dumps(
              record, sort_keys=True, separators=(",", ":"), allow_nan=False
          ).encode("utf-8")
          record["status_id"] = hashlib.sha256(payload).hexdigest()
          (status_dir / "execution_status.json").write_text(
              json.dumps(record, indent=2, sort_keys=True, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          lines = [
              "# Tracking Cloth cross-action transport terminal status",
              "",
              f"- Status: `{record['status']}`",
              f"- Mode: `{record['mode']}`",
              f"- Scientific decision: `{record['scientific_decision']}`",
              f"- Failing stage: `{record['failing_stage']}`",
              f"- Repetition-3 numeric cases: `{record['numeric_rep3_cases']}`",
              f"- Repetition-3 confirmation authorized: `{record['rep3_confirmation_authorized']}`",
              f"- Status ID: `{record['status_id']}`",
          ]
          if record["failure_log_tail"]:
              lines += ["", "## Failure log tail", "", "```text"]
              lines.extend(record["failure_log_tail"])
              lines.append("```")
          (status_dir / "execution_status.md").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          PY

          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "failing_stage=$failing_stage" >> "$GITHUB_OUTPUT"

      - name: Commit terminal evidence and retire obsolete one-shot files
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/tracking-cloth-cross-action-transport-terminal-v4.yml \
            "$STATUS_DIR/executed_workflow.yml"
          rm -f \
            .github/workflows/tracking-cloth-cross-action-transport-source-v1.yml \
            .github/workflows/tracking-cloth-cross-action-transport-repair-execute-v1.yml \
            .github/workflows/tracking-cloth-cross-action-transport-repair-execute-v2.yml \
            .github/workflows/tracking-cloth-cross-action-transport-recovery-v3.yml \
            .github/workflows/tracking-cloth-cross-action-transport-terminal-v4.yml \
            .github/requests/tracking-cloth-cross-action-transport-source-v1.json \
            .github/requests/tracking-cloth-cross-action-transport-repair-execute-v1.json \
            .github/requests/tracking-cloth-cross-action-transport-repair-execute-v2.json \
            .github/requests/tracking-cloth-cross-action-transport-recovery-v3.json \
            .github/requests/tracking-cloth-cross-action-transport-terminal-v4.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Record terminal Tracking Cloth transport status"
          git fetch origin research/tracking-cloth-cross-action-transport-source-v1
          git rebase origin/research/tracking-cloth-cross-action-transport-source-v1
          git push origin HEAD:research/tracking-cloth-cross-action-transport-source-v1

      - name: Update stacked PR with terminal status
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr=$(gh pr list \
            --head research/tracking-cloth-cross-action-transport-source-v1 \
            --base research/explain-transport-probe-abstain-v1 \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --body-file "$STATUS_DIR/execution_status.md"
          fi

      - name: Upload complete terminal payload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tracking-cloth-cross-action-transport-terminal-${{ github.sha }}
          path: |
            .run/tracking-cloth-cross-action-transport-terminal-v4
            results/science/tracking_cloth_cross_action_transport_v1
          if-no-files-found: warn
          retention-days: 30
