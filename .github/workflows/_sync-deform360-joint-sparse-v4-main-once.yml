name: Synchronize Deform360 joint-sparse v4 with main once

on:
  push:
    branches:
      - agent/deform360-joint-sparse-observability-v4
    paths:
      - .github/workflows/_sync-deform360-joint-sparse-v4-main-once.yml

permissions:
  contents: write

concurrency:
  group: sync-deform360-joint-sparse-v4-main-once
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.ref == 'refs/heads/agent/deform360-joint-sparse-observability-v4'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/deform360-joint-sparse-observability-v4
          fetch-depth: 0
          persist-credentials: true
          clean: true
      - name: Merge current main, remove helper, and publish
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "IPS-Stuttgart/BayesianPhysTwin"
          test "$(git branch --show-current)" = \
            "agent/deform360-joint-sparse-observability-v4"
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git rm .github/workflows/_sync-deform360-joint-sparse-v4-main-once.yml
          git diff --check
          git commit -m "Synchronize Deform360 joint-sparse v4 with main"
          git push origin HEAD:agent/deform360-joint-sparse-observability-v4
