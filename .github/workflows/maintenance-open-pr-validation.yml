name: Maintenance validation of open PRs

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/maintenance-open-pr-validation.yml"

permissions:
  contents: read

concurrency:
  group: maintenance-open-pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Exact-head validation on workstation2
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 180
    steps:
      - name: Check out validation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true

      - name: Check out PR 167 exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/BayesianPhysTwin
          ref: 1fdbb43fd6fd30caab0627657ec0a53216974fb6
          path: _validation/pr167
          persist-credentials: false
          clean: true

      - name: Check out PR 172 exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/BayesianPhysTwin
          ref: 6af891b882782e5c5f099dd1610c49f772866445
          path: _validation/pr172
          persist-credentials: false
          clean: true

      - name: Provision Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate PR 167 ecosystem lock
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/bpt-pr167-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --upgrade pip
          "$venv/bin/python" -m pip install -e "./_validation/pr167[dev]"
          cd _validation/pr167
          "$venv/bin/python" -m ruff check .
          "$venv/bin/python" -m pytest -q
          "$venv/bin/python" -m build --wheel --outdir "$RUNNER_TEMP/bpt-pr167-wheelhouse"
          wheel="$(find "$RUNNER_TEMP/bpt-pr167-wheelhouse" -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          wheel_venv="$RUNNER_TEMP/bpt-pr167-installed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python -m venv "$wheel_venv"
          "$wheel_venv/bin/python" -m pip install "$wheel"
          "$wheel_venv/bin/bpt" ecosystem validate --help
          echo "PR167 1fdbb43fd6fd30caab0627657ec0a53216974fb6 passed" >> "$RUNNER_TEMP/bpt-open-pr-validation.txt"

      - name: Validate PR 172 PokeFlex scale integration
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/bpt-pr172-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --upgrade pip
          "$venv/bin/python" -m pip install -e "./_validation/pr172[dev]"
          cd _validation/pr172
          "$venv/bin/python" -m ruff check \
            scripts/development/build_pokeflex_action_robust_all18_scale.py \
            scripts/remote/run_pokeflex_action_robust_all18_source.py \
            src/bayesian_phystwin/pokeflex_action_robust_all18.py \
            tests/test_pokeflex_action_robust_all18.py
          "$venv/bin/python" -m ruff format --check \
            scripts/development/build_pokeflex_action_robust_all18_scale.py \
            scripts/remote/run_pokeflex_action_robust_all18_source.py \
            src/bayesian_phystwin/pokeflex_action_robust_all18.py \
            tests/test_pokeflex_action_robust_all18.py
          "$venv/bin/python" -m pytest -q
          echo "PR172 6af891b882782e5c5f099dd1610c49f772866445 passed" >> "$RUNNER_TEMP/bpt-open-pr-validation.txt"

      - name: Upload compact validation summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bpt-open-pr-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bpt-open-pr-validation.txt
          if-no-files-found: warn
          retention-days: 7
