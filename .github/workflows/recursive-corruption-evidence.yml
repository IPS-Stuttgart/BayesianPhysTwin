name: Recursive corruption scientific evidence

on:
  workflow_dispatch:
    inputs:
      verify_replay:
        description: Re-run the frozen benchmark and require byte-identical outputs
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: recursive-corruption-evidence-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  evidence:
    name: Frozen 50-seed corruption and selectivity evidence
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out exact reviewed main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Provision Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build and install the exact source wheel
        shell: bash
        run: |
          set -euo pipefail
          out="outputs/recursive-corruption-evidence"
          mkdir -p "${out}/wheels" "${out}/primary"
          python -m pip install --upgrade pip
          python -m pip wheel --no-deps --wheel-dir "${out}/wheels" .
          mapfile -t wheels < <(find "${out}/wheels" -maxdepth 1 -name '*.whl' -print)
          test "${#wheels[@]}" -eq 1
          python -m venv .recursive-corruption-venv
          .recursive-corruption-venv/bin/python -m pip install "${wheels[0]}"
          .recursive-corruption-venv/bin/python -m pip check
          sha256sum "${wheels[0]}" | tee "${out}/wheel-sha256.txt"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            git status --porcelain=v1
            .recursive-corruption-venv/bin/python -VV
            .recursive-corruption-venv/bin/python -m pip freeze --all
            uname -a
          } > "${out}/environment.txt"

      - name: Execute the frozen recursive corruption benchmark
        shell: bash
        run: |
          set -uo pipefail
          out="outputs/recursive-corruption-evidence"
          cat > "${out}/commands.txt" <<'EOF'
          .recursive-corruption-venv/bin/bpt benchmark recursive-corruption --seeds 0:50 --output-json primary/result.json --output-csv primary/records.csv
          .recursive-corruption-venv/bin/python scripts/science/analyze_recursive_corruption_selectivity_v1.py --seeds 0:50 --conditions missing_burst,outlier_burst,coherent_drift,identity_switch,delayed_observation,density_drop --maximum-nis-grid 1,2,4,9,16,36,1000000 --output primary/selectivity.json
          EOF
          set +e
          .recursive-corruption-venv/bin/bpt benchmark recursive-corruption \
            --seeds 0:50 \
            --output-json "${out}/primary/result.json" \
            --output-csv "${out}/primary/records.csv" \
            2>&1 | tee "${out}/benchmark.log"
          benchmark_status="${PIPESTATUS[0]}"
          .recursive-corruption-venv/bin/python \
            scripts/science/analyze_recursive_corruption_selectivity_v1.py \
            --seeds 0:50 \
            --conditions \
              missing_burst,outlier_burst,coherent_drift,identity_switch,delayed_observation,density_drop \
            --maximum-nis-grid 1,2,4,9,16,36,1000000 \
            --output "${out}/primary/selectivity.json" \
            2>&1 | tee "${out}/selectivity.log"
          selectivity_status="${PIPESTATUS[0]}"
          set -e
          printf '%s\n' "${benchmark_status}" > "${out}/benchmark-exit-code.txt"
          printf '%s\n' "${selectivity_status}" > "${out}/selectivity-exit-code.txt"
          if [[ "${benchmark_status}" -eq 0 && "${selectivity_status}" -eq 0 ]]; then
            printf '0\n' > "${out}/exit-code.txt"
          elif [[ "${benchmark_status}" -ne 0 ]]; then
            printf '%s\n' "${benchmark_status}" > "${out}/exit-code.txt"
          else
            printf '%s\n' "${selectivity_status}" > "${out}/exit-code.txt"
          fi

      - name: Validate finite machine-readable outputs
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          out="outputs/recursive-corruption-evidence"
          set +e
          .recursive-corruption-venv/bin/python - <<'PY' \
            2>&1 | tee "${out}/validation.log"
          import json
          import math
          from pathlib import Path

          root = Path("outputs/recursive-corruption-evidence")
          required = (
              root / "primary" / "result.json",
              root / "primary" / "selectivity.json",
          )

          def reject_nonfinite(value: object, *, path: str = "root") -> None:
              if isinstance(value, float) and not math.isfinite(value):
                  raise ValueError(f"non-finite value at {path}")
              if isinstance(value, dict):
                  for key, child in value.items():
                      reject_nonfinite(child, path=f"{path}.{key}")
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      reject_nonfinite(child, path=f"{path}[{index}]")

          report = {
              "schema_version": 1,
              "artifact_kind": "RecursiveCorruptionEvidenceValidation",
              "files": [],
              "decision": "complete-finite-controlled-evidence",
          }
          try:
              for path in required:
                  payload = json.loads(path.read_text(encoding="utf-8"))
                  reject_nonfinite(payload)
                  report["files"].append(path.relative_to(root).as_posix())
              csv_path = root / "primary" / "records.csv"
              if not csv_path.is_file() or csv_path.stat().st_size == 0:
                  raise ValueError("missing or empty primary/records.csv")
          except Exception as error:
              report["decision"] = "evidence-output-validation-failed"
              report["error"] = str(error)
              passed = False
          else:
              passed = True
          (root / "validation.json").write_text(
              json.dumps(report, indent=2, sort_keys=True, allow_nan=False)
              + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2, sort_keys=True, allow_nan=False))
          raise SystemExit(0 if passed else 3)
          PY
          status="${PIPESTATUS[0]}"
          set -e
          printf '%s\n' "${status}" > "${out}/validation-exit-code.txt"

      - name: Verify deterministic replay
        if: inputs.verify_replay
        shell: bash
        run: |
          set -uo pipefail
          out="outputs/recursive-corruption-evidence"
          mkdir -p "${out}/replay"
          set +e
          .recursive-corruption-venv/bin/bpt benchmark recursive-corruption \
            --seeds 0:50 \
            --output-json "${out}/replay/result.json" \
            --output-csv "${out}/replay/records.csv" \
            2>&1 | tee "${out}/replay-benchmark.log"
          benchmark_status="${PIPESTATUS[0]}"
          .recursive-corruption-venv/bin/python \
            scripts/science/analyze_recursive_corruption_selectivity_v1.py \
            --seeds 0:50 \
            --conditions \
              missing_burst,outlier_burst,coherent_drift,identity_switch,delayed_observation,density_drop \
            --maximum-nis-grid 1,2,4,9,16,36,1000000 \
            --output "${out}/replay/selectivity.json" \
            2>&1 | tee "${out}/replay-selectivity.log"
          selectivity_status="${PIPESTATUS[0]}"
          set -e
          replay_status=0
          if [[ "${benchmark_status}" -ne 0 ]]; then
            replay_status="${benchmark_status}"
          elif [[ "${selectivity_status}" -ne 0 ]]; then
            replay_status="${selectivity_status}"
          elif [[ "$(cat "${out}/exit-code.txt")" -eq 0 ]]; then
            cmp "${out}/primary/result.json" "${out}/replay/result.json"
            cmp "${out}/primary/records.csv" "${out}/replay/records.csv"
            cmp "${out}/primary/selectivity.json" "${out}/replay/selectivity.json"
          fi
          printf '%s\n' "${replay_status}" > "${out}/replay-exit-code.txt"

      - name: Build content-addressed evidence manifest
        if: always()
        env:
          VERIFY_REPLAY: ${{ inputs.verify_replay }}
        shell: bash
        run: |
          set -euo pipefail
          .recursive-corruption-venv/bin/python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("outputs/recursive-corruption-evidence")
          files = []
          for path in sorted(root.rglob("*")):
              if not path.is_file() or path.name == "manifest.json":
                  continue
              payload = path.read_bytes()
              files.append(
                  {
                      "path": path.relative_to(root).as_posix(),
                      "bytes": len(payload),
                      "sha256": hashlib.sha256(payload).hexdigest(),
                  }
              )
          manifest = {
              "schema_version": 1,
              "artifact_kind": "ControlledScientificEvidenceManifest",
              "study": "recursive-corruption-v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit": os.environ["GITHUB_SHA"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "independent_seed_count": 50,
              "conditions": [
                  "missing_burst",
                  "outlier_burst",
                  "coherent_drift",
                  "identity_switch",
                  "delayed_observation",
                  "density_drop",
              ],
              "selectivity_grid": [1, 2, 4, 9, 16, 36, 1000000],
              "verify_replay": os.environ["VERIFY_REPLAY"] == "true",
              "target_outcomes_used": False,
              "deform360_confirmation_opened": False,
              "causal4d_physical_outcome_used": False,
              "files": files,
              "claim_boundary": (
                  "Controlled synthetic mechanism and retrospective selectivity "
                  "evidence only. It does not establish real-provider competence, "
                  "physical-object transfer, real covariance calibration, "
                  "Causal4D intervention benefit, deployment safety, or state "
                  "of the art."
              ),
          }
          canonical = json.dumps(
              manifest,
              sort_keys=True,
              separators=(",", ":"),
              allow_nan=False,
          ).encode("utf-8")
          manifest["manifest_id"] = hashlib.sha256(canonical).hexdigest()
          (root / "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True, allow_nan=False)
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload retained evidence bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: recursive-corruption-v1-${{ github.run_id }}
          path: outputs/recursive-corruption-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Enforce execution, validation, and replay gates
        env:
          VERIFY_REPLAY: ${{ inputs.verify_replay }}
        shell: bash
        run: |
          set -euo pipefail
          out="outputs/recursive-corruption-evidence"
          test "$(cat "${out}/exit-code.txt")" -eq 0
          test "$(cat "${out}/validation-exit-code.txt")" -eq 0
          if [[ "${VERIFY_REPLAY}" == "true" ]]; then
            test "$(cat "${out}/replay-exit-code.txt")" -eq 0
          fi
