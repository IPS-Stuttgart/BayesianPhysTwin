name: Register PR 524 residual-history stable coverage once

on:
  push:
    branches:
      - agent/deform360-covariance-residual-history-dry-run-v1

permissions:
  contents: write

concurrency:
  group: register-pr-524-stable-coverage-once
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  register-and-verify:
    if: github.ref == 'refs/heads/agent/deform360-covariance-residual-history-dry-run-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact feature head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Register tests and verify unchanged coverage floors
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1"
          python -m pip install -e ".[dev,graph]"
          python -m pip install "coverage==7.13.3"
          python -m pip check

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(".github/quality/test-suites.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          suite = payload["suites"]["stable-core-coverage"]
          entry = "tests/test_deform360_covariance_residual_history*.py"
          anchor = "tests/test_deform360_contact_anchor.py"
          if entry in suite:
              raise SystemExit(f"coverage entry already present: {entry}")
          suite.insert(suite.index(anchor) + 1, entry)
          path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

          python tools/quality/test_suite_manifest.py list stable-core-coverage \
            > "${RUNNER_TEMP}/stable-core-tests.txt"
          grep -Fx \
            tests/test_deform360_covariance_residual_history_real_camera_roster_v1.py \
            "${RUNNER_TEMP}/stable-core-tests.txt"
          grep -Fx \
            tests/test_deform360_covariance_residual_history_v1.py \
            "${RUNNER_TEMP}/stable-core-tests.txt"
          python -m pytest -q -p no:cacheprovider tests/test_test_suite_manifest.py

          python -m coverage run --branch --source=bayesian_phystwin \
            -m pytest -q -p no:cacheprovider \
            tests/test_deform360_covariance_residual_history_real_camera_roster_v1.py \
            tests/test_deform360_covariance_residual_history_v1.py
          python -m coverage json -o residual-history-coverage.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("residual-history-coverage.json").read_text(encoding="utf-8")
          )
          files = (
              "src/bayesian_phystwin/_deform360_covariance_residual_history_adapter_v1.py",
              "src/bayesian_phystwin/_deform360_covariance_residual_history_common_v1.py",
              "src/bayesian_phystwin/_deform360_covariance_residual_history_decision_v1.py",
              "src/bayesian_phystwin/deform360_covariance_residual_history_v1.py",
          )
          failures: list[str] = []
          for path in files:
              summary = payload["files"][path]["summary"]
              statements = int(summary["num_statements"])
              covered = int(summary["covered_lines"])
              branches = int(summary["num_branches"])
              covered_branches = int(summary["covered_branches"])
              line_pct = 100.0 if statements == 0 else 100.0 * covered / statements
              branch_pct = (
                  100.0 if branches == 0 else 100.0 * covered_branches / branches
              )
              print(f"{path}: lines={line_pct:.2f}%, branches={branch_pct:.2f}%")
              if line_pct < 90.0:
                  failures.append(f"{path}: line coverage {line_pct:.2f}% < 90.00%")
              if branch_pct < 80.0:
                  failures.append(f"{path}: branch coverage {branch_pct:.2f}% < 80.00%")
          if failures:
              raise SystemExit("\n".join(failures))
          PY

      - name: Publish only the central manifest registration
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          helper=.github/workflows/register-pr-524-stable-coverage-once.yml
          manifest=.github/quality/test-suites.json
          rm -f .coverage residual-history-coverage.json
          rm -- "${helper}"
          git diff --check
          actual="$(git status --short | awk '{print $2}' | LC_ALL=C sort)"
          expected="$(printf '%s\n' "${manifest}" "${helper}" | LC_ALL=C sort)"
          test "${actual}" = "${expected}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- "${manifest}" "${helper}"
          git commit -m "Register residual-history tests for stable coverage"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" push \
            origin HEAD:refs/heads/agent/deform360-covariance-residual-history-dry-run-v1
