# workflow-lifecycle: temporary-one-shot
# workflow-owner: IPS-Stuttgart maintainers
name: Fix Deform360 TCN source lint

on:
  push:
    branches: [science/deform360-temporal-baseline-v6]
    paths:
      - ".github/requests/fix-lint-deform360-tcn-v6.json"

permissions:
  contents: write

concurrency:
  group: fix-lint-deform360-tcn-v6
  cancel-in-progress: false

jobs:
  fix:
    name: Apply exact Ruff lint autofix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: science/deform360-temporal-baseline-v6
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply CI-matched Ruff autofix and formatting
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "ruff==0.14.14"
          python -m ruff check --fix scripts/science/run_deform360_tcn_baseline_v6.py
          python -m ruff format scripts/science/run_deform360_tcn_baseline_v6.py
          python -m ruff check scripts/science/run_deform360_tcn_baseline_v6.py
          python -m ruff format --check scripts/science/run_deform360_tcn_baseline_v6.py

      - name: Remove launcher and push the fixed source
        shell: bash
        run: |
          set -euo pipefail
          git rm -- \
            .github/workflows/fix-lint-deform360-tcn-v6.yml \
            .github/requests/fix-lint-deform360-tcn-v6.json
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/science/run_deform360_tcn_baseline_v6.py
          git commit -m "Fix Deform360 TCN source lint"
          git push origin HEAD:science/deform360-temporal-baseline-v6
