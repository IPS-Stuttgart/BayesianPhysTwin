# workflow-lifecycle: temporary
# workflow-owner: IPS-Stuttgart maintainers
name: Finalize Tracking Cloth action feasibility V2

on:
  push:
    branches: [science/tracking-cloth-active-decision-rep3-v1]
    paths:
      - ".github/requests/finalize-tracking-cloth-action-costed-v2.json"

permissions:
  contents: write

concurrency:
  group: finalize-tracking-cloth-action-costed-v2
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 2
          clean: true

      - name: Authorize one add-only finalization request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          test "${PUSH_FORCED}" = false
          test "${BEFORE_SHA}" != 0000000000000000000000000000000000000000
          mapfile -t changed < <(git diff --name-status "${BEFORE_SHA}" "${GITHUB_SHA}")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = $'A\t.github/requests/finalize-tracking-cloth-action-costed-v2.json'
          python - <<'PY'
          import json
          from pathlib import Path

          value = json.loads(
              Path(
                  ".github/requests/finalize-tracking-cloth-action-costed-v2.json"
              ).read_text(encoding="utf-8")
          )
          assert value == {
              "schema": "bayesian-phystwin/source-finalization-request-v1",
              "request_id": "finalize-tracking-cloth-action-costed-v2-20260902",
              "scientific_change": "correct-probe-cost-objective-and-diagonal-budget",
              "target_outcomes_opened": False,
          }
          PY

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply exact source-only corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          decision_path = Path(
              "experiments/tracking_cloth_action_feasibility_costed_v2/_decision.py"
          )
          text = decision_path.read_text(encoding="utf-8")
          old = '''    pair_budget[increasing] = np.clip(
              (regret_tolerance - represented_pairwise_gap[increasing])
              / slope[increasing],
              0.0,
              1.0,
          )
              return np.min(pair_budget, axis=1)
          '''
          old = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in old.splitlines()
          )
          new = '''    pair_budget[increasing] = np.clip(
              (regret_tolerance - represented_pairwise_gap[increasing])
              / slope[increasing],
              0.0,
              1.0,
          )
              # A plan compared with itself has identically zero loss gap even when
              # its unknown-domain scalar loss lies in a nondegenerate interval.
              np.fill_diagonal(pair_budget, 1.0)
              return np.min(pair_budget, axis=1)
          '''
          new = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in new.splitlines()
          )
          if text.count(old) != 1:
              raise SystemExit("support-budget patch marker changed")
          decision_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          workflow_path = Path(
              ".github/workflows/tracking-cloth-action-feasibility-costed-v2.yml"
          )
          workflow = workflow_path.read_text(encoding="utf-8")
          old_assertion = '          assert "rep3" not in source.lower()\n'
          new_assertions = (
              '          assert "scoring_truth" not in source\n'
              '          assert "--stage target" not in source\n'
              '          assert "--stage predict" not in source\n'
              '          assert "--stage score" not in source\n'
          )
          if workflow.count(old_assertion) != 1:
              raise SystemExit("workflow custody marker changed")
          workflow_path.write_text(
              workflow.replace(old_assertion, new_assertions, 1),
              encoding="utf-8",
          )
          PY

      - name: Format and validate complete V2 source contract
        shell: bash
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff format \
            experiments/tracking_cloth_action_feasibility_costed_v2 \
            tests/test_tracking_cloth_action_feasibility_costed_v2.py
          python -m ruff check \
            experiments/tracking_cloth_action_feasibility_costed_v2 \
            tests/test_tracking_cloth_action_feasibility_costed_v2.py
          python -m ruff format --check \
            experiments/tracking_cloth_action_feasibility_costed_v2 \
            tests/test_tracking_cloth_action_feasibility_costed_v2.py
          python -m pytest -q \
            tests/test_tracking_cloth_action_feasibility_costed_v2.py \
            tests/test_support_robust_act_sense_fallback_certificate_v1.py \
            tests/test_tracking_cloth_action_feasibility_v1.py
          python -m py_compile \
            experiments/tracking_cloth_action_feasibility_costed_v2/_decision.py \
            experiments/tracking_cloth_action_feasibility_costed_v2/run.py
          git diff --check

      - name: Commit validated V2 and retire one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/requests/finalize-tracking-cloth-action-costed-v2.json \
            .github/workflows/finalize-tracking-cloth-action-costed-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            experiments/tracking_cloth_action_feasibility_costed_v2 \
            tests/test_tracking_cloth_action_feasibility_costed_v2.py \
            .github/workflows/tracking-cloth-action-feasibility-costed-v2.yml \
            .github/requests/finalize-tracking-cloth-action-costed-v2.json \
            .github/workflows/finalize-tracking-cloth-action-costed-v2.yml
          git commit -m 'Finalize cost-aware support-robust cloth source gate'
          git push origin HEAD:science/tracking-cloth-active-decision-rep3-v1
