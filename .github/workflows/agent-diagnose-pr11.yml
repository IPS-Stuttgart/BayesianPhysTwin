name: Diagnose PR 11

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/reproducibility-cli-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Bayesian-PhysTwin
        uses: actions/checkout@v7
        with:
          path: bayesian-phystwin
      - name: Check out Causal4D
        uses: actions/checkout@v7
        with:
          repository: FlorianPfaff/Causal4D
          ref: main
          path: causal4d
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install both repositories
        run: |
          python -m pip install -e "./bayesian-phystwin[dev,graph,vision]"
          python -m pip install -e "./causal4d[dev]"
      - name: Capture diagnostics
        shell: bash
        run: |
          set +e
          python -m ruff check \
            bayesian-phystwin/src/bayesian_phystwin/run_manifest.py \
            bayesian-phystwin/src/bayesian_phystwin/cli/main.py \
            bayesian-phystwin/src/bayesian_phystwin/cli/run_manifest.py \
            bayesian-phystwin/tests/test_cli_main.py \
            bayesian-phystwin/tests/test_run_manifest.py \
            bayesian-phystwin/tests/test_run_manifest_cli.py \
            > ruff-output.txt 2>&1
          ruff_status=$?
          CAUSAL4D_REQUIRE_BPT_PROVIDER=1 python -m pytest -vv --tb=long \
            bayesian-phystwin/tests/test_causal4d_provider_v1.py \
            causal4d/tests/test_causal4d_provider_contract.py \
            causal4d/tests/test_causal4d_bpt_belief.py \
            causal4d/tests/test_causal4d_phystwin_backend.py \
            causal4d/tests/test_bpt_provider_import_boundary.py \
            causal4d/tests/test_bpt_provider_integration.py \
            > provider-output.txt 2>&1
          provider_status=$?
          printf 'ruff_status=%s\nprovider_status=%s\n' \
            "$ruff_status" "$provider_status" > status.txt
          cat status.txt
          cat ruff-output.txt
          tail -n 250 provider-output.txt
          exit 0
      - uses: actions/upload-artifact@v7
        with:
          name: pr11-diagnostics
          path: |
            status.txt
            ruff-output.txt
            provider-output.txt
          retention-days: 2
