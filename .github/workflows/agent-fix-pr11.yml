name: Apply PR 11 diagnostic fixes

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/reproducibility-cli-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/reproducibility-cli-ci
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Apply exact Ruff fix and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check --fix \
            src/bayesian_phystwin/run_manifest.py
          rm .github/workflows/agent-diagnose-pr11.yml
          rm .github/workflows/agent-fix-pr11.yml
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bayesian_phystwin/run_manifest.py .github/workflows
          git commit -m "Fix stable-interface import formatting"
          git push origin HEAD:agent/reproducibility-cli-ci
