# workflow-lifecycle: permanent
# workflow-owner: IPS-Stuttgart maintainers
name: DEFORM DLO4/DLO5 gate and support audit one-shot

on:
  push:
    paths:
      - ".github/workflows/deform-dlo45-gate-risk-audit-one-shot.yml"
      - ".github/requests/deform-dlo45-decision-gate-audit-v1.json"
      - "experiments/deform_dlo45_decision_identifiability_v1/gate_audit.py"
      - "experiments/deform_dlo45_decision_identifiability_v1/gate_audit_protocol.json"
      - "tests/test_deform_dlo45_decision_gate_audit_v1.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: deform-dlo45-gate-risk-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PARENT_PROTOCOL: experiments/deform_dlo45_decision_identifiability_v1/protocol.json
  AUDIT_PROTOCOL: experiments/deform_dlo45_decision_identifiability_v1/gate_audit_protocol.json
  REQUEST: .github/requests/deform-dlo45-decision-gate-audit-v1.json
  PARENT_RUN_ID: "33473378340"
  PARENT_SOURCE_ARTIFACT: dlo45-decision-source-33473378340
  PARENT_TARGET_ARTIFACT: dlo45-decision-result-33473378340
  DEFORM_REPOSITORY: roahmlab/DEFORM
  DEFORM_COMMIT: b73b8b8ecc033caefa693fab7898741d4e6dbeff
  NUMPY_VERSION: "2.2.6"

jobs:
  contracts:
    name: Audit contracts and registered-decision parity
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact audit revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate code, frozen request, and parity tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1" \
            "numpy==${NUMPY_VERSION}"
          python -m pip install -e ".[dev]"
          python -m pip check
          files=(
            experiments/deform_dlo45_decision_identifiability_v1/gate_audit.py
            tests/test_deform_dlo45_decision_gate_audit_v1.py
          )
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m pytest -q -p no:cacheprovider \
            tests/test_deform_dlo45_decision_gate_audit_v1.py \
            tests/test_deform_dlo45_decision_identifiability_v1.py \
            tests/test_query_decision_certificate_v1.py
          python - <<'PY'
          import json
          from pathlib import Path

          audit = json.loads(Path("experiments/deform_dlo45_decision_identifiability_v1/gate_audit_protocol.json").read_text())
          request = json.loads(Path(".github/requests/deform-dlo45-decision-gate-audit-v1.json").read_text())
          assert audit["contract"] == "deform-dlo45-decision-gate-audit-v1"
          assert audit["parent_workflow_run_id"] == 33473378340
          assert audit["target_tuning"] is False
          assert audit["target_outcomes_used_for_thresholds"] is False
          assert request["status"] == "authorized"
          assert request["parent_workflow_run_id"] == 33473378340
          assert request["target_tuning"] is False
          assert request["target_retries"] is False
          PY

  source:
    name: Source-only heuristic thresholds
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact audit revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Check out pinned source-only DEFORM data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.DEFORM_REPOSITORY }}
          ref: ${{ env.DEFORM_COMMIT }}
          path: upstream-DEFORM
          fetch-depth: 1
          persist-credentials: false
          clean: true
          sparse-checkout: |
            data_set/DLO4/train
            data_set/DLO5/train
          sparse-checkout-cone-mode: false

      - name: Set up pinned numerical runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install audit runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1" \
            "numpy==${NUMPY_VERSION}"
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Download exact parent source artifact
        uses: actions/download-artifact@da56cacac5b77e20dd173f01d3f2237d1f94d2f0 # v8.0.0
        with:
          name: ${{ env.PARENT_SOURCE_ARTIFACT }}
          run-id: ${{ env.PARENT_RUN_ID }}
          github-token: ${{ github.token }}
          repository: IPS-Stuttgart/BayesianPhysTwin
          path: ${{ runner.temp }}/parent-source

      - name: Validate source-only checkout
        id: dataset
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream-DEFORM rev-parse HEAD)" = "${DEFORM_COMMIT}"
          root="${GITHUB_WORKSPACE}/upstream-DEFORM/data_set"
          for dlo in DLO4 DLO5; do
            test "$(find "${root}/${dlo}/train" -maxdepth 1 -type f -name '*.pkl' | wc -l)" -eq 56
            test ! -e "${root}/${dlo}/eval"
          done
          echo "root=${root}" >> "${GITHUB_OUTPUT}"

      - name: Fit source-only matched-coverage thresholds
        shell: bash
        env:
          DATASET_ROOT: ${{ steps.dataset.outputs.root }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/gate-audit-source"
          rm -rf "${out}"
          mkdir -p "${out}"
          python -m experiments.deform_dlo45_decision_identifiability_v1.gate_audit \
            source \
            --protocol "${PARENT_PROTOCOL}" \
            --audit-protocol "${AUDIT_PROTOCOL}" \
            --request "${REQUEST}" \
            --dataset-root "${DATASET_ROOT}" \
            --output-root "${out}" \
            --parent-source-model "${RUNNER_TEMP}/parent-source/source_model.npz" \
            --parent-source-result "${RUNNER_TEMP}/parent-source/source_result.json" \
            --parent-source-seal "${RUNNER_TEMP}/parent-source/source_seal.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "gate-audit-source"
          value = json.loads((root / "thresholds.json").read_text())
          assert value["target_data_read"] is False
          assert value["target_outcomes_used"] is False
          for dlo in ("DLO4", "DLO5"):
              assert value["dlos"][dlo]["source_test_decision_count"] == 152
              assert value["dlos"][dlo]["source_certificate_nonfallback_count"] > 0
          PY

      - name: Upload source-frozen audit thresholds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: dlo45-gate-audit-source-${{ github.run_id }}
          path: ${{ runner.temp }}/gate-audit-source
          if-no-files-found: error
          retention-days: 90

  target:
    name: Held matched-coverage and support audit
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact audit revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          clean: true

      - name: Check out pinned held DEFORM data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.DEFORM_REPOSITORY }}
          ref: ${{ env.DEFORM_COMMIT }}
          path: upstream-DEFORM
          fetch-depth: 1
          persist-credentials: false
          clean: true
          sparse-checkout: |
            data_set/DLO4/eval
            data_set/DLO5/eval
          sparse-checkout-cone-mode: false

      - name: Set up pinned numerical runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install audit runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1" \
            "numpy==${NUMPY_VERSION}"
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Download exact parent source and target artifacts
        uses: actions/download-artifact@da56cacac5b77e20dd173f01d3f2237d1f94d2f0 # v8.0.0
        with:
          run-id: ${{ env.PARENT_RUN_ID }}
          github-token: ${{ github.token }}
          repository: IPS-Stuttgart/BayesianPhysTwin
          path: ${{ runner.temp }}/parent-artifacts

      - name: Download source-frozen audit thresholds
        uses: actions/download-artifact@da56cacac5b77e20dd173f01d3f2237d1f94d2f0 # v8.0.0
        with:
          name: dlo45-gate-audit-source-${{ github.run_id }}
          path: ${{ runner.temp }}/gate-audit-source

      - name: Validate held-only checkout
        id: dataset
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream-DEFORM rev-parse HEAD)" = "${DEFORM_COMMIT}"
          root="${GITHUB_WORKSPACE}/upstream-DEFORM/data_set"
          for dlo in DLO4 DLO5; do
            test "$(find "${root}/${dlo}/eval" -maxdepth 1 -type f -name '*.pkl' | wc -l)" -eq 14
            test ! -e "${root}/${dlo}/train"
          done
          echo "root=${root}" >> "${GITHUB_OUTPUT}"

      - name: Apply frozen gates and audit registered support
        shell: bash
        env:
          DATASET_ROOT: ${{ steps.dataset.outputs.root }}
        run: |
          set -euo pipefail
          parent_source="${RUNNER_TEMP}/parent-artifacts/${PARENT_SOURCE_ARTIFACT}"
          parent_target="${RUNNER_TEMP}/parent-artifacts/${PARENT_TARGET_ARTIFACT}"
          out="${RUNNER_TEMP}/gate-audit-target"
          rm -rf "${out}"
          mkdir -p "${out}"
          python -m experiments.deform_dlo45_decision_identifiability_v1.gate_audit \
            target \
            --protocol "${PARENT_PROTOCOL}" \
            --audit-protocol "${AUDIT_PROTOCOL}" \
            --request "${REQUEST}" \
            --dataset-root "${DATASET_ROOT}" \
            --output-root "${out}" \
            --parent-source-model "${parent_source}/source_model.npz" \
            --parent-source-seal "${parent_source}/source_seal.json" \
            --thresholds "${RUNNER_TEMP}/gate-audit-source/thresholds.json" \
            --threshold-seal "${RUNNER_TEMP}/gate-audit-source/source_seal.json"
          cat "${out}/summary.md"
          PARENT_TARGET="${parent_target}/target_result.json" AUDIT_TARGET="${out}/target_audit.json" python - <<'PY'
          import json
          import math
          import os
          from pathlib import Path

          parent = json.loads(Path(os.environ["PARENT_TARGET"]).read_text())
          audit = json.loads(Path(os.environ["AUDIT_TARGET"]).read_text())
          certificate = audit["combined"]["certificate"]
          assert certificate["decision_count"] == parent["aggregate"]["decision_count"] == 532
          assert certificate["nonfallback_count"] == parent["aggregate"]["certificate_nonfallback_count"] == 82
          assert math.isclose(
              certificate["rmse_ratio_to_fallback"],
              parent["aggregate"]["certificate_rmse_ratio"],
              rel_tol=0.0,
              abs_tol=1e-12,
          )
          for dlo in ("DLO4", "DLO5"):
              observed = audit["dlos"][dlo]["certificate"]
              expected = parent["dlos"][dlo]["aggregate"]["certificate"]
              assert observed["action_counts"] == expected["action_counts"]
              assert math.isclose(observed["rmse_mm"], expected["rmse_mm"], abs_tol=1e-10)
          PY

      - name: Upload complete audit evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: dlo45-gate-risk-audit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/gate-audit-source/thresholds.json
            ${{ runner.temp }}/gate-audit-source/source_audit.json
            ${{ runner.temp }}/gate-audit-source/source_seal.json
            ${{ runner.temp }}/gate-audit-target/target_audit.json
            ${{ runner.temp }}/gate-audit-target/per_decision.jsonl
            ${{ runner.temp }}/gate-audit-target/summary.md
          if-no-files-found: error
          retention-days: 90

      - name: Commit compact evidence to the audit branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          run_key="$(python - <<'PY'
          import json
          import os

          with open(os.environ["REQUEST"], encoding="utf-8") as handle:
              print(json.load(handle)["run_key"])
          PY
          )"
          destination="results/science/deform_dlo45_decision_gate_audit_v1/${run_key}"
          test ! -e "${destination}"
          mkdir -p "${destination}"
          cp "${RUNNER_TEMP}/gate-audit-source/thresholds.json" "${destination}/thresholds.json"
          cp "${RUNNER_TEMP}/gate-audit-source/source_audit.json" "${destination}/source_audit.json"
          cp "${RUNNER_TEMP}/gate-audit-source/source_seal.json" "${destination}/source_seal.json"
          cp "${RUNNER_TEMP}/gate-audit-target/target_audit.json" "${destination}/target_audit.json"
          cp "${RUNNER_TEMP}/gate-audit-target/per_decision.jsonl" "${destination}/per_decision.jsonl"
          cp "${RUNNER_TEMP}/gate-audit-target/summary.md" "${destination}/README.md"
          cat > "${destination}/provenance.json" <<EOF
          {
            "audit_repository_revision": "${GITHUB_SHA}",
            "audit_workflow_run_id": ${GITHUB_RUN_ID},
            "parent_workflow_run_id": 33473378340,
            "dataset_repository": "${DEFORM_REPOSITORY}",
            "dataset_commit": "${DEFORM_COMMIT}",
            "numpy_version": "${NUMPY_VERSION}",
            "target_retries": false,
            "target_tuning": false
          }
          EOF
          rm -rf upstream-DEFORM
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${destination}"
          git diff --cached --check
          git commit -m "Record DEFORM matched-coverage gate and support audit"
          git push origin "HEAD:${GITHUB_REF_NAME}"
