name: Repair IRLS PR quality gates

on:
  push:
    branches:
      - agent/fix-irls-fixed-point-convergence

permissions:
  contents: write

jobs:
  repair-test-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/fix-irls-fixed-point-convergence

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Add the missing convergence-branch regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_propagated_state_belief.py")
          text = path.read_text(encoding="utf-8")
          marker = "test_propagated_irls_takes_nonstationary_solution_branch"
          if marker not in text:
              text = text.rstrip() + "\n\n\n" + r'''
          def test_propagated_irls_takes_nonstationary_solution_branch() -> None:
              innovation = np.zeros((1, 1, 3), dtype=np.float64)
              innovation[0, 0, 0] = 0.01
              response = np.zeros((1, 1, 3, 1), dtype=np.float64)
              response[0, 0, 0, 0] = 1.0

              result = infer_propagated_state_belief(
                  innovation,
                  np.ones((1, 1), dtype=bool),
                  response,
                  np.zeros((1, 0), dtype=np.float64),
                  observation_variance_m2=np.full((1, 1), 1e-6, dtype=np.float64),
                  config=PropagatedStateBeliefConfig(
                      state_weight_prior_std=0.1,
                      maximum_iterations=1,
                      convergence_tolerance=1e-12,
                  ),
              )

              assert result.accepted
              assert result.diagnostics["iterations"] == 1
              assert result.state_weights[0] > 0.0
          '''.strip() + "\n"
              path.write_text(text, encoding="utf-8")
          PY

      - name: Install development tools
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'coverage==7.13.3'

      - name: Format and validate the focused repair
        shell: bash
        run: |
          python -m ruff format \
            src/bayesian_phystwin/propagated_state_belief.py \
            tests/test_propagated_state_belief.py
          python -m ruff check \
            src/bayesian_phystwin/_gauge_aware_solver.py \
            src/bayesian_phystwin/bias_aware_belief_v2.py \
            src/bayesian_phystwin/propagated_state_belief.py \
            tests/test_gauge_aware_belief.py \
            tests/test_bias_aware_belief_v2.py \
            tests/test_propagated_state_belief.py
          python -m ruff format --check \
            src/bayesian_phystwin/_gauge_aware_solver.py \
            src/bayesian_phystwin/bias_aware_belief_v2.py \
            src/bayesian_phystwin/propagated_state_belief.py \
            tests/test_gauge_aware_belief.py \
            tests/test_bias_aware_belief_v2.py \
            tests/test_propagated_state_belief.py
          python -m pytest -q \
            tests/test_gauge_aware_belief.py \
            tests/test_bias_aware_belief_v2.py \
            tests/test_propagated_state_belief.py
          python -m coverage run --branch --source=bayesian_phystwin \
            -m pytest -q tests/test_propagated_state_belief.py
          python -m coverage json -o focused-coverage.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("focused-coverage.json").read_text(encoding="utf-8"))
          file_data = data["files"]["src/bayesian_phystwin/propagated_state_belief.py"]
          missing = {tuple(arc) for arc in file_data.get("missing_branches", [])}
          if (416, 420) in missing:
              raise RuntimeError("nonstationary IRLS convergence branch is still uncovered")
          PY
          git diff --check

      - name: Commit the verified repair
        shell: bash
        run: |
          rm .github/workflows/agent-fix-irls-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayesian_phystwin/propagated_state_belief.py \
            tests/test_propagated_state_belief.py \
            .github/workflows/agent-fix-irls-format.yml
          git commit -m "Complete IRLS convergence regression coverage"
          git push origin HEAD:agent/fix-irls-fixed-point-convergence
