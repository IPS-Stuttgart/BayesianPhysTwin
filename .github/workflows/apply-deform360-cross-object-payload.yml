name: Apply complete Deform360 cross-object payload

on:
  push:
    branches:
      - agent/deform360-cross-object-normalized-evidence-v1
    paths:
      - ".github/workflows/apply-deform360-cross-object-payload.yml"
      - ".github/patches/deform360-cross-object/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/apply-deform360-cross-object-payload.yml"
      - ".github/patches/deform360-cross-object/**"

permissions:
  contents: write

concurrency:
  group: apply-deform360-cross-object-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact publication branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/deform360-cross-object-normalized-evidence-v1
          fetch-depth: 0
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Reconstruct and verify complete payload
        shell: bash
        run: |
          set -euo pipefail
          echo "f4a20d1f218fb8a8909989057c5e9d821455bc6255696789d61b9b2ff24d13a7  .github/patches/deform360-cross-object/part-00" | sha256sum --check --strict
          echo "bcfa958f73bb1de024b5d7a044fc20e1fd4b8f70286c48bd3c10f516268f1f5f  .github/patches/deform360-cross-object/part-01" | sha256sum --check --strict
          echo "a7a3d5add656327b031f87683080dd1ed4d8f4b35a13d43275d057e8fa498777  .github/patches/deform360-cross-object/part-02" | sha256sum --check --strict
          cat .github/patches/deform360-cross-object/part-* > payload.b64
          base64 --decode payload.b64 > payload.tar.gz
          echo "339362338a8adf1a586556c21a16891bd8d48f78d169ce11af2d721b877f7215  payload.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file payload.tar.gz
          rm payload.b64 payload.tar.gz
          rm .github/workflows/deform360-cross-object-normalized-evidence.yml

      - name: Validate ordinary source and locked boundary
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,graph]" "ruff==0.16.1"
          python -m pip check
          python -m ruff check --fix \
            scripts/science/run_deform360_cross_object_normalized_evidence.py \
            tests/test_deform360_cross_object_normalized_evidence.py
          python -m ruff format \
            scripts/science/run_deform360_cross_object_normalized_evidence.py \
            tests/test_deform360_cross_object_normalized_evidence.py
          python -m ruff check \
            scripts/science/run_deform360_cross_object_normalized_evidence.py \
            tests/test_deform360_cross_object_normalized_evidence.py
          python -m ruff format --check \
            scripts/science/run_deform360_cross_object_normalized_evidence.py \
            tests/test_deform360_cross_object_normalized_evidence.py
          python -m pytest -q \
            tests/test_deform360_cross_object_normalized_evidence.py \
            tests/test_endpoint_model_average.py
          python -m py_compile \
            scripts/science/run_deform360_cross_object_normalized_evidence.py
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path(
              "protocols/deform360_cross_object_normalized_evidence_v1.json"
          )
          payload = json.loads(path.read_text(encoding="utf-8"))
          digest = hashlib.sha256(
              json.dumps(
                  payload,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              ).encode("utf-8")
          ).hexdigest()
          expected = "1fea455cd61fa838d94bb4892973ba944d851b894c876087431fab6461a60ad4"
          if digest != expected:
              raise SystemExit(
                  f"protocol digest changed: expected {expected}, received {digest}"
              )
          boundary = payload["information_boundary"]
          if boundary["all_objects_previously_used_by_repository"] is not True:
              raise SystemExit("protocol no longer records prior object use")
          if boundary["globally_sealed_target_cohort"] is not False:
              raise SystemExit("protocol falsely claims a globally sealed cohort")
          if payload["status"] != "retrospective-non-fresh-cross-fitted-diagnostic":
              raise SystemExit("protocol status drifted")
          print(f"locked non-fresh protocol: {digest}")
          PY
          git diff --check

      - name: Publish ordinary product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/science/run_deform360_cross_object_normalized_evidence.py \
            tests/test_deform360_cross_object_normalized_evidence.py \
            docs/deform360_cross_object_normalized_evidence_v1.md
          git diff --cached --check
          git commit -m "Implement cross-object Deform360 evidence diagnostic"
          git push origin HEAD:agent/deform360-cross-object-normalized-evidence-v1
