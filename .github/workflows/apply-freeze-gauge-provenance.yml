name: Apply gauge-aware provenance hardening

on:
  push:
    branches:
      - agent/freeze-gauge-aware-provenance

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply the focused contract patch
        run: |
          python - <<'PY'
          from pathlib import Path

          contracts = Path("src/bayesian_phystwin/_gauge_aware_contracts.py")
          text = contracts.read_text(encoding="utf-8")
          if "from ._canonical_contracts import frozen_finite_json_mapping" not in text:
              text = text.replace(
                  "import json\nfrom collections.abc import Mapping\n",
                  "from collections.abc import Mapping\n",
              )
              text = text.replace(
                  "import numpy as np\n\n\ndef _require",
                  "import numpy as np\n\nfrom ._canonical_contracts import frozen_finite_json_mapping\n\n\ndef _require",
              )
              old = '''def _validated_metadata(values: Mapping[str, Any] | None) -> dict[str, Any]:
              try:
                  return json.loads(
                      json.dumps(
                          dict(values or {}),
                          sort_keys=True,
                          allow_nan=False,
                      )
                  )
              except (TypeError, ValueError) as error:
                  raise ValueError("metadata must contain finite JSON values") from error
          '''
              new = '''def _validated_metadata(values: Mapping[str, Any] | None) -> Mapping[str, Any]:
              return frozen_finite_json_mapping(values, name="metadata")
          '''
              if old not in text:
                  raise RuntimeError("gauge metadata helper changed unexpectedly")
              text = text.replace(old, new)
              contracts.write_text(text, encoding="utf-8")

          gauge_tests = Path("tests/test_gauge_aware_belief.py")
          text = gauge_tests.read_text(encoding="utf-8")
          if "test_gauge_aware_batch_recursively_owns_and_freezes_metadata" not in text:
              text = text.replace(
                  "    GaugeAwareBeliefConfig,\n    GaugeAwareObservationBatch,\n",
                  "    GaugeAwareBeliefConfig,\n    GaugeAwareBeliefResult,\n    GaugeAwareObservationBatch,\n",
              )
              text = text.replace(
                  "    anchor_bias_mode: np.ndarray | None = None,\n) -> GaugeAwareObservationBatch:\n",
                  "    anchor_bias_mode: np.ndarray | None = None,\n    metadata: dict[str, object] | None = None,\n) -> GaugeAwareObservationBatch:\n",
              )
              text = text.replace(
                  '        metadata={"observation_artifact_id": "a" * 64},\n',
                  '        metadata=(\n            {"observation_artifact_id": "a" * 64}\n            if metadata is None\n            else metadata\n        ),\n',
              )
              text += '''

          def test_gauge_aware_batch_recursively_owns_and_freezes_metadata() -> None:
              nested = {"calibration_ids": ["gauge-v1", "camera-v2"]}
              metadata: dict[str, object] = {"provider": nested}
              batch = _batch(
                  np.asarray([1.0]),
                  np.asarray([0.0]),
                  metadata=metadata,
              )

              nested["calibration_ids"].append("mutated")
              metadata["late"] = True

              assert batch.metadata == {
                  "provider": {"calibration_ids": ["gauge-v1", "camera-v2"]}
              }
              assert batch.metadata is not None
              with pytest.raises(TypeError, match="immutable"):
                  batch.metadata["provider"] = {}  # type: ignore[index]
              with pytest.raises(TypeError, match="immutable"):
                  batch.metadata["provider"]["calibration_ids"].append("mutated")


          def test_gauge_aware_result_recursively_owns_and_freezes_provenance() -> None:
              diagnostic_details = {"iterations": [1, 2]}
              lineage_details = {"calibration_ids": ["gauge-v1", "camera-v2"]}
              result = GaugeAwareBeliefResult(
                  inference_admissible=True,
                  reason="inference-admissible",
                  state_coefficients=np.asarray([0.0]),
                  gauge_delta=np.zeros(0),
                  shared_bias_coefficients=np.zeros(0),
                  view_bias_coefficients=np.zeros(0),
                  anchor_bias_coefficients=np.zeros(0),
                  posterior_covariance=np.asarray([[1.0]]),
                  identifiable_state_transform=np.asarray([[1.0]]),
                  identifiable_fractions=np.asarray([1.0]),
                  query_sensitivity_fractions=np.asarray([1.0]),
                  robust_weights=np.asarray([1.0]),
                  anchor_robust_weights=np.zeros(0),
                  diagnostics={"solver": diagnostic_details},
                  input_lineage={"provider": lineage_details},
              )

              diagnostic_details["iterations"].append(3)
              lineage_details["calibration_ids"].append("mutated")

              assert result.diagnostics == {"solver": {"iterations": [1, 2]}}
              assert result.input_lineage == {
                  "provider": {"calibration_ids": ["gauge-v1", "camera-v2"]}
              }
              with pytest.raises(TypeError, match="immutable"):
                  result.diagnostics["solver"]["iterations"].append(3)
              with pytest.raises(TypeError, match="immutable"):
                  result.input_lineage["provider"]["calibration_ids"][0] = "mutated"
          '''
              gauge_tests.write_text(text, encoding="utf-8")

          update_tests = Path("tests/test_prospective_prob4d_update.py")
          text = update_tests.read_text(encoding="utf-8")
          if "test_update_contract_exposes_immutable_result_lineage" not in text:
              needle = "def test_update_contract_rejects_invalid_calibration_digest() -> None:\n"
              addition = '''def test_update_contract_exposes_immutable_result_lineage() -> None:
              supplied = dict(CALIBRATION_IDS)
              lineage = {
                  **_lineage(),
                  "prob4d_claim_bearing_calibration_artifact_ids": supplied,
              }
              update = _update(result=_result(lineage))
              update_id = update.update_id

              supplied["gauge"] = "f" * 64

              assert update.result.input_lineage[
                  "prob4d_claim_bearing_calibration_artifact_ids"
              ] == CALIBRATION_IDS
              assert update.update_id == update_id
              with pytest.raises(TypeError, match="immutable"):
                  update.result.input_lineage[
                      "prob4d_claim_bearing_calibration_artifact_ids"
                  ]["gauge"] = "f" * 64


          '''
              if needle not in text:
                  raise RuntimeError("prospective update test insertion point changed")
              update_tests.write_text(text.replace(needle, addition + needle), encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          old = '''- Observation-belief metadata is now recursively immutable after canonical JSON
            validation, so nested mutation cannot change an existing artifact digest.
          '''
          new = '''- Observation-belief metadata and gauge-aware batch/result metadata, diagnostics,
            and input lineage are now recursively immutable after canonical JSON validation,
            so nested mutation cannot change an existing artifact, update, or audit record.
          '''
          if old in text:
              changelog.write_text(text.replace(old, new), encoding="utf-8")
          elif "gauge-aware batch/result metadata" not in text:
              raise RuntimeError("changelog insertion point changed")
          PY

      - name: Install development tools
        run: python -m pip install -e ".[dev]"

      - name: Format and validate the focused patch
        run: |
          python -m ruff format \
            src/bayesian_phystwin/_gauge_aware_contracts.py \
            tests/test_gauge_aware_belief.py \
            tests/test_prospective_prob4d_update.py
          python -m ruff check \
            src/bayesian_phystwin/_gauge_aware_contracts.py \
            tests/test_gauge_aware_belief.py \
            tests/test_prospective_prob4d_update.py
          python -m pytest -q \
            tests/test_gauge_aware_belief.py \
            tests/test_prospective_prob4d_update.py \
            tests/test_prospective_prob4d_update_content_ids.py \
            tests/test_prior_aware_and_linearization.py \
            tests/test_prior_aware_likelihood_conformance.py \
            tests/test_observation_belief_gauge_adapter.py

      - name: Commit the validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayesian_phystwin/_gauge_aware_contracts.py \
            tests/test_gauge_aware_belief.py \
            tests/test_prospective_prob4d_update.py \
            CHANGELOG.md
          git diff --cached --check
          git commit -m "Freeze gauge-aware provenance mappings"
          git push origin HEAD:${{ github.ref_name }}
