name: Format numerical contract hardening

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: format-numerical-contract-hardening
  cancel-in-progress: true

jobs:
  format:
    if: github.head_ref == 'agent/harden-numerical-contracts-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Apply canonical formatting and republish
        env:
          BRANCH: agent/harden-numerical-contracts-v1
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_REVISION}"

          python -m pip install --disable-pip-version-check "ruff==0.16.2"
          files=(
            src/bayesian_phystwin/observation_belief.py
            src/bayesian_phystwin/structured_point_covariance.py
            tests/test_observation_belief.py
            tests/test_structured_point_covariance.py
          )
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          rm .github/workflows/format-pr533.yml
          git diff --check

          git config user.name github-actions[bot]
          git config user.email \
            41898282+github-actions[bot]@users.noreply.github.com
          git add "${files[@]}" .github/workflows/format-pr533.yml
          git commit -m "Apply canonical formatting to numerical contracts"

          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" push \
            --force-with-lease="refs/heads/${BRANCH}:${SOURCE_REVISION}" \
            origin "HEAD:refs/heads/${BRANCH}"
