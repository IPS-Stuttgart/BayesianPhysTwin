name: Hierarchical missing-physics narrow runtime census v1

on:
  push:
    branches:
      - science/hierarchical-missing-physics-diagnosis-v1
    paths:
      - protocols/execution_requests/hierarchical_missing_physics_runtime_census_narrow_v1.json

permissions:
  contents: write

concurrency:
  group: hierarchical-missing-physics-runtime-census-narrow-v1
  cancel-in-progress: false

jobs:
  census:
    environment: trusted-self-hosted-validation
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 90
    env:
      REQUEST: protocols/execution_requests/hierarchical_missing_physics_runtime_census_narrow_v1.json
      ROOT_MAP: evidence/hierarchical_missing_physics/runtime_root_map_v1/receipt.json
      EVIDENCE_DIR: evidence/hierarchical_missing_physics/runtime_census_gpuserver4090_v1
    steps:
      - name: Check out exact request revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Validate immutable root-map-bound request
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = workstation1
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          request = json.loads(Path(os.environ["REQUEST"]).read_text(encoding="utf-8"))
          receipt = json.loads(Path(os.environ["ROOT_MAP"]).read_text(encoding="utf-8"))
          assert request["schema"] == "bayesian-phystwin.hierarchical-missing-physics-runtime-census-narrow-request"
          assert request["schema_version"] == 1
          assert request["root_map_receipt_id"] == receipt["receipt_id"]
          assert request["root_map_id"] == receipt["root_map_id"]
          assert receipt["target_payload_read"] is False
          assert request["numeric_source_payload_read_authorized"] is True
          assert request["pickle_deserialization_authorized"] is False
          assert request["target_payload_read_authorized"] is False
          assert request["target_score_read_authorized"] is False
          assert request["target_dependent_model_selection_authorized"] is False
          assert request["maximum_total_entries"] == 100000
          PY
          python3 -m py_compile scripts/science/inventory_deform_source_runtime_artifacts.py

      - name: Prepare isolated pinned runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/hmp-narrow-census-venv-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check --no-input \
            "pip==25.2" "setuptools==80.9.0" "wheel==0.45.1" "numpy==2.2.6"
          echo "python=$venv/bin/python" >> "$GITHUB_OUTPUT"
          echo "venv=$venv" >> "$GITHUB_OUTPUT"

      - name: Verify exact source roots from the metadata map
        id: roots
        shell: bash
        run: |
          set -euo pipefail
          roots="$RUNNER_TEMP/hmp-narrow-roots.txt"
          cat > "$roots" <<'EOF'
          /home/github-runner/.cache/workflows/deform-dlo3-cross-backend-scalar-v1/runs/33476871778-1
          /home/github-runner/.cache/workflows/deform-dlo3-hierarchical-transfers-v1/runs/33536420739-1
          /home/github-runner/actions-runner/_work/BayesianPhysTwin/BayesianPhysTwin
          EOF
          while IFS= read -r root; do
            test -d "$root"
            test ! -L "$root"
            case "${root,,}" in
              *dlo4*|*dlo5*|*dlo45*|*33361441865*) exit 2 ;;
            esac
          done < "$roots"
          echo "file=$roots" >> "$GITHUB_OUTPUT"

      - name: Inventory only selected source artifacts
        id: census
        env:
          PYTHON: ${{ steps.runtime.outputs.python }}
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/hmp-narrow-census"
          test ! -e "$work"
          mkdir -p "$work"
          args=()
          while IFS= read -r root; do args+=(--root "$root"); done < "${{ steps.roots.outputs.file }}"
          "$PYTHON" scripts/science/inventory_deform_source_runtime_artifacts.py \
            "${args[@]}" --max-depth 8 --max-entries 100000 --max-candidates 5000 \
            --output "$work/result.json" | tee "$work/summary.log"
          RESULT="$work/result.json" "$PYTHON" - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path(os.environ["RESULT"]).read_text(encoding="utf-8"))
          boundary = result["information_boundary"]
          forbidden = (
              "dlo4_directory_children_enumerated", "dlo4_payload_read",
              "dlo5_directory_children_enumerated", "dlo5_payload_read",
              "protected_parent_run_33361441865_artifact_read",
              "pickle_bearing_payload_deserialized", "target_scores_read",
              "target_dependent_model_selection",
          )
          assert all(boundary[key] is False for key in forbidden)
          readiness = result["adapter_readiness"]
          assert readiness["has_numeric_residual_candidate"] is True
          assert readiness["has_coefficient_candidate"] is True
          assert readiness["has_alternate_backend_candidate"] is True
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"result={os.environ['RESULT']}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Narrow DLO2/DLO3 runtime census\n\n")
              summary.write(f"Census ID: `{result['census_id']}`\n\n")
              summary.write(f"Entries scanned: `{result['search_audit']['entries_seen']}`\n\n")
              summary.write(f"Candidates: `{len(result['ranked_candidates'])}`\n\n")
              summary.write("All three adapter prerequisites were found; protected target access remained false.\n")
          PY

      - name: Commit source-only census and receipt
        env:
          PYTHON: ${{ steps.runtime.outputs.python }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          cp "${{ steps.census.outputs.result }}" "$EVIDENCE_DIR/result.json"
          RESULT="$EVIDENCE_DIR/result.json" "$PYTHON" - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          result_path = Path(os.environ["RESULT"])
          result = json.loads(result_path.read_text(encoding="utf-8"))
          receipt = {
              "schema": "bayesian-phystwin.hierarchical-missing-physics-runtime-census-receipt",
              "schema_version": 1,
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "evaluated_commit_sha": os.environ["GITHUB_SHA"],
              "runner_name": os.environ["RUNNER_NAME"],
              "root_map_receipt_id": "441a21d960d6b6454828462e1df08fc043e33764966be2fa3ff107d5009084e6",
              "census_id": result["census_id"],
              "result_sha256": hashlib.sha256(result_path.read_bytes()).hexdigest(),
              "adapter_readiness": result["adapter_readiness"],
              "dlo4_dlo5_payload_read": False,
              "target_scores_read": False,
              "claim_scope": "source-only retained-artifact discovery"
          }
          unsigned = json.dumps(receipt, sort_keys=True, separators=(",", ":")).encode()
          receipt["receipt_id"] = hashlib.sha256(unsigned).hexdigest()
          (result_path.parent / "receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$EVIDENCE_DIR"
          git commit -m "Record narrow retained DLO2/DLO3 artifacts"
          git push origin HEAD:science/hierarchical-missing-physics-diagnosis-v1

      - name: Upload exact census
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: hierarchical-missing-physics-narrow-census-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hmp-narrow-census/
            evidence/hierarchical_missing_physics/runtime_census_gpuserver4090_v1/
          if-no-files-found: error
          retention-days: 90

      - name: Remove isolated runtime
        if: always()
        shell: bash
        run: rm -rf -- "${{ steps.runtime.outputs.venv }}"
