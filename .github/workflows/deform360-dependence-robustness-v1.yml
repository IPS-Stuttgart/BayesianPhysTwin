# workflow-lifecycle: permanent
# workflow-owner: IPS-Stuttgart maintainers
name: Deform360 dependence matched-coverage robustness v1

on:
  push:
    branches:
      - science/deform360-dependence-robustness-v1
    paths:
      - .github/requests/deform360-dependence-robustness-v1.json

permissions:
  actions: read
  contents: read

concurrency:
  group: deform360-dependence-robustness-v1
  cancel-in-progress: false

env:
  DATASET_ROOT: /mnt/seagate10tb/florianpfaff/datasets/deform360
  CONTROL_ROOT: control
  RECOVERY_ROOT: recovery
  ORIGINAL_V6_ROOT: original-v6
  PARENT_CONTROL_ROOT: parent-control
  FROZEN_ROOT: frozen
  ROBUSTNESS_RUNNER: control/scripts/science/run_deform360_dependence_robustness_v1.py
  ROBUSTNESS_PROTOCOL: control/protocols/deform360_dependence_robustness_v1.json
  RECOVERY_RUNNER: recovery/scripts/science/run_deform360_dependence_query_v6_bound_carrier_recovery_v1.py
  ORIGINAL_V6_RUNNER: original-v6/scripts/science/run_deform360_dependence_query_v6.py
  PARENT_SCIENTIFIC_PROTOCOL: original-v6/protocols/deform360_dependence_query_v6.json
  PARENT_PROTOCOL: parent-control/protocols/deform360_untouched_confirmation_v5.json
  RECOVERY_REVISION: 28e8a44bfbab9e1556e0f51c53b46e91b8352481
  RECOVERY_RUNNER_SHA256: 6cca5314d3748304904ec97d97c7cd023956faf30a9fe48415684602a5add7ee
  ORIGINAL_V6_REVISION: 954538832106d8ded13f1101b3a2b2e855b40513
  ORIGINAL_V6_RUNNER_SHA256: 06c22fc3fe667c4f2f11eddee3dcb1b78b5465b6312136efb010611e1ebab91c
  PARENT_CONTROL_REVISION: e409527b8499a225bde8bd7f8c532a30e96548c6
  FROZEN_REVISION: 25ba91c021124569c4dcf84c66eda5ec088868e0
  PARENT_ARTIFACT_ID: "9738998271"
  PARENT_ARTIFACT_SHA256: e98f9e2687f568d0d0fcabec9ce0393a7e1b34ca3019acb1e14fdf894885a948
  PARENT_RESULT_SHA256: 0ad16b15c94d81b8c14221a271eb1f647d689a530284570becdfeca87e0d8ec7
  PARENT_READINESS_SHA256: 58841144ae5105080ecb991cc73e9021214fc8676f9e55948ef3511fb12a2f8e
  REFERENCE_ARTIFACT_ID: "9811194776"
  REFERENCE_ARTIFACT_SHA256: 8b3bad2bc0620228ebe32027028b1666ea7772a1850f0ab45d525e30e4ced82a
  REFERENCE_RESULT_SHA256: c73659af65c2b87923f7bd668f9717afab03e449a5b3abd3a5b597ec60898fd1
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install focused contract dependencies
        run: python -m pip install numpy==1.26.4 ruff==0.14.14
      - name: Validate robustness runner and frozen protocol
        run: |
          python -m json.tool "${ROBUSTNESS_PROTOCOL}" >/dev/null
          python -m py_compile "${ROBUSTNESS_RUNNER}"
          python "${ROBUSTNESS_RUNNER}" --self-test
          python -m ruff check "${ROBUSTNESS_RUNNER}"

  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      request_path: ${{ steps.request.outputs.request_path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: request
        name: Authorize one add-only retrospective robustness request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = refs/heads/science/deform360-dependence-robustness-v1
          test "${PUSH_FORCED}" = false
          test "${BEFORE_SHA}" != 0000000000000000000000000000000000000000
          mapfile -t changed < <(git diff --name-status "${BEFORE_SHA}" "${GITHUB_SHA}")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = $'A\t.github/requests/deform360-dependence-robustness-v1.json'
          REQUEST=.github/requests/deform360-dependence-robustness-v1.json
          REQUEST_PATH="${REQUEST}" python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          path = Path(os.environ["REQUEST_PATH"])
          value = json.loads(path.read_text(encoding="utf-8"))
          expected = {
              "schema": "bayesian-phystwin/deform360-dependence-robustness-request-v1",
              "request_id": "deform360-dependence-robustness-20260903",
              "purpose": "Re-execute the exact successful 92-object same-mean dependence study and add matched-coverage, equal-calibration-budget, and leave-one-query-out robustness diagnostics without changing its predictor, means, marginals, or query bank.",
              "runner_labels": ["self-hosted", "Linux", "X64", "gpuserver4090"],
              "dataset_root": "/mnt/seagate10tb/florianpfaff/datasets/deform360",
              "reference_run_id": 33528032875,
              "reference_artifact_id": 9811194776,
              "recovery_revision": "28e8a44bfbab9e1556e0f51c53b46e91b8352481",
              "original_v6_revision": "954538832106d8ded13f1101b3a2b2e855b40513",
              "parent_control_revision": "e409527b8499a225bde8bd7f8c532a30e96548c6",
              "frozen_point_revision": "25ba91c021124569c4dcf84c66eda5ec088868e0",
              "object_count": 92,
              "query_count": 5,
              "retrospective_target_reuse": True,
              "parent_scientific_projection_must_reproduce": True,
              "point_predictor_may_change": False,
              "predictive_means_may_change": False,
              "coordinate_marginals_may_change": False,
              "query_bank_may_change": False,
              "scientific_outcome_may_fail_workflow": False,
              "fresh_confirmation_claimed": False,
              "paper_claim_authorized": False,
          }
          for key, expected_value in expected.items():
              if value.get(key) != expected_value:
                  raise SystemExit(f"invalid {key}: {value.get(key)!r}")
          allowed = set(expected) | {"expected_source_revision"}
          if set(value) != allowed:
              raise SystemExit("request fields differ from the frozen schema")
          parent = subprocess.check_output(
              ["git", "rev-parse", f"{os.environ['GITHUB_SHA']}^"],
              text=True,
          ).strip()
          if value["expected_source_revision"] != parent:
              raise SystemExit("expected_source_revision is not the trigger parent")
          PY
          echo "request_path=${REQUEST}" >> "${GITHUB_OUTPUT}"

  evaluate:
    needs: [contracts, authorize]
    if: >-
      always() && needs.contracts.result == 'success' &&
      needs.authorize.result == 'success'
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 240
    env:
      REQUEST_PATH: ${{ needs.authorize.outputs.request_path }}
    steps:
      - name: Check out robustness control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          persist-credentials: false
          clean: true

      - name: Check out exact successful recovery control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 28e8a44bfbab9e1556e0f51c53b46e91b8352481
          path: recovery
          persist-credentials: false
          clean: true

      - name: Check out exact original v6 control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 954538832106d8ded13f1101b3a2b2e855b40513
          path: original-v6
          persist-credentials: false
          clean: true

      - name: Check out exact parent confirmation control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: e409527b8499a225bde8bd7f8c532a30e96548c6
          path: parent-control
          persist-credentials: false
          clean: true

      - name: Check out exact frozen v3 point method
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 25ba91c021124569c4dcf84c66eda5ec088868e0
          path: frozen
          persist-credentials: false
          clean: true

      - name: Recover and verify parent and reference evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf parent-evidence reference-evidence parent-evidence.zip reference-evidence.zip
          mkdir -p parent-evidence reference-evidence
          curl --fail --location --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PARENT_ARTIFACT_ID}/zip" \
            --output parent-evidence.zip
          printf '%s  %s\n' "${PARENT_ARTIFACT_SHA256}" parent-evidence.zip \
            | sha256sum --check --strict
          unzip -q parent-evidence.zip -d parent-evidence
          printf '%s  %s\n' "${PARENT_RESULT_SHA256}" parent-evidence/result.json \
            | sha256sum --check --strict
          printf '%s  %s\n' "${PARENT_READINESS_SHA256}" \
            parent-evidence/bound-readiness.json | sha256sum --check --strict
          curl --fail --location --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${REFERENCE_ARTIFACT_ID}/zip" \
            --output reference-evidence.zip
          printf '%s  %s\n' "${REFERENCE_ARTIFACT_SHA256}" reference-evidence.zip \
            | sha256sum --check --strict
          unzip -q reference-evidence.zip -d reference-evidence
          printf '%s  %s\n' "${REFERENCE_RESULT_SHA256}" reference-evidence/result.json \
            | sha256sum --check --strict

      - name: Prepare isolated numerical runtime
        shell: bash
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP}/deform360-dependence-robustness-venv-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          output="${RUNNER_TEMP}/deform360-dependence-robustness-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "${venv}" "${output}"
          python3 -m venv "${venv}"
          "${venv}/bin/python" -m pip install --disable-pip-version-check numpy==1.26.4
          mkdir -p -- "${output}"
          {
            echo "PYTHON_BIN=${venv}/bin/python"
            echo "VENV_ROOT=${venv}"
            echo "OUTPUT_ROOT=${output}"
          } >> "${GITHUB_ENV}"

      - name: Validate exact lineage and audit boundary
        shell: bash
        run: |
          set -euo pipefail
          test -d "${DATASET_ROOT}"
          test "$(readlink -f -- "${DATASET_ROOT}")" = "${DATASET_ROOT}"
          test "$(git -C "${RECOVERY_ROOT}" rev-parse HEAD)" = "${RECOVERY_REVISION}"
          test "$(git -C "${ORIGINAL_V6_ROOT}" rev-parse HEAD)" = "${ORIGINAL_V6_REVISION}"
          test "$(git -C "${PARENT_CONTROL_ROOT}" rev-parse HEAD)" = "${PARENT_CONTROL_REVISION}"
          test "$(git -C "${FROZEN_ROOT}" rev-parse HEAD)" = "${FROZEN_REVISION}"
          printf '%s  %s\n' "${RECOVERY_RUNNER_SHA256}" "${RECOVERY_RUNNER}" \
            | sha256sum --check --strict
          printf '%s  %s\n' "${ORIGINAL_V6_RUNNER_SHA256}" "${ORIGINAL_V6_RUNNER}" \
            | sha256sum --check --strict
          "${PYTHON_BIN}" -m py_compile \
            "${ROBUSTNESS_RUNNER}" \
            "${RECOVERY_RUNNER}" \
            "${ORIGINAL_V6_RUNNER}"
          "${PYTHON_BIN}" "${ROBUSTNESS_RUNNER}" --self-test
          cp "${ROBUSTNESS_PROTOCOL}" "${OUTPUT_ROOT}/protocol.json"
          cp "control/${REQUEST_PATH}" "${OUTPUT_ROOT}/request.json"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "audit_revision=${GITHUB_SHA}"
            echo "recovery_revision=$(git -C "${RECOVERY_ROOT}" rev-parse HEAD)"
            echo "original_v6_revision=$(git -C "${ORIGINAL_V6_ROOT}" rev-parse HEAD)"
            echo "parent_control_revision=$(git -C "${PARENT_CONTROL_ROOT}" rev-parse HEAD)"
            echo "frozen_revision=$(git -C "${FROZEN_ROOT}" rev-parse HEAD)"
            echo "runner_name=${RUNNER_NAME}"
            echo "dataset_root=${DATASET_ROOT}"
            sha256sum \
              "${ROBUSTNESS_RUNNER}" \
              "${ROBUSTNESS_PROTOCOL}" \
              "${RECOVERY_RUNNER}" \
              "${ORIGINAL_V6_RUNNER}" \
              reference-evidence/result.json \
              parent-evidence/result.json \
              parent-evidence/bound-readiness.json
            "${PYTHON_BIN}" --version
            "${PYTHON_BIN}" -c 'import numpy; print("numpy=" + numpy.__version__)'
            uname -a
          } | tee "${OUTPUT_ROOT}/environment.txt"

      - name: Run matched-coverage and calibration robustness audit
        shell: bash
        run: |
          set -euo pipefail
          "${PYTHON_BIN}" "${ROBUSTNESS_RUNNER}" \
            --recovery-runner "${RECOVERY_RUNNER}" \
            --base-runner "${ORIGINAL_V6_RUNNER}" \
            --parent-scientific-protocol "${PARENT_SCIENTIFIC_PROTOCOL}" \
            --parent-protocol "${PARENT_PROTOCOL}" \
            --parent-result parent-evidence/result.json \
            --readiness-json parent-evidence/bound-readiness.json \
            --data-root "${DATASET_ROOT}" \
            --parent-control-root "${PARENT_CONTROL_ROOT}" \
            --frozen-root "${FROZEN_ROOT}" \
            --reference-result reference-evidence/result.json \
            --robustness-protocol "${ROBUSTNESS_PROTOCOL}" \
            --output-json "${OUTPUT_ROOT}/result.json" \
            --output-report "${OUTPUT_ROOT}/report.md" \
            | tee "${OUTPUT_ROOT}/console.log"

      - name: Validate completed evidence and clean checkouts
        shell: bash
        run: |
          set -euo pipefail
          RESULT_PATH="${OUTPUT_ROOT}/result.json" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RESULT_PATH"])
          value = json.loads(path.read_text(encoding="utf-8"))
          if value.get("schema") != "bayesian-phystwin/deform360-dependence-robustness-result-v1":
              raise SystemExit("unexpected result schema")
          if value.get("status") != "complete":
              raise SystemExit("robustness audit is incomplete")
          reproduction = value.get("parent_reproduction", {})
          if reproduction.get("scientific_projection_equal") is not True:
              raise SystemExit("parent scientific projection changed")
          robustness = value.get("robustness", {})
          if robustness.get("object_count") != 92 or robustness.get("query_count") != 5:
              raise SystemExit("robustness roster changed")
          supplied = value.pop("result_sha256", None)
          encoded = json.dumps(
              value,
              sort_keys=True,
              separators=(",", ":"),
              allow_nan=False,
          ).encode("utf-8")
          if hashlib.sha256(encoded).hexdigest() != supplied:
              raise SystemExit("result digest is invalid")
          PY
          sha256sum "${OUTPUT_ROOT}"/* > "${OUTPUT_ROOT}/sha256sums.txt"
          for checkout in control recovery original-v6 parent-control frozen; do
            git -C "${checkout}" diff --exit-code
            test -z "$(git -C "${checkout}" status --porcelain --untracked-files=all)"
          done

      - name: Upload robustness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: deform360-dependence-robustness-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_ROOT }}
          if-no-files-found: warn
          retention-days: 90

      - name: Remove isolated runtime
        if: always()
        shell: bash
        run: rm -rf -- "${VENV_ROOT:-}"
