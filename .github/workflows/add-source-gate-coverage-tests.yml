name: Add source-gate coverage regression cases

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'agent/harden-source-gate-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/harden-source-gate-validation
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Add fail-closed parser tests to stable source-gate suite
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_deform360_prob4d_source_gate.py")
          text = path.read_text(encoding="utf-8")
          import_line = (
              "import bayesian_phystwin.deform360_prob4d_source_gate_validation "
              "as gate_validation\n"
          )
          if import_line not in text:
              anchor = "import pytest\n"
              if text.count(anchor) != 1:
                  raise SystemExit("pytest import anchor changed")
              text = text.replace(anchor, anchor + "\n" + import_line, 1)

          marker = "def test_source_gate_validation_helpers_fail_closed() -> None:\n"
          if marker not in text:
              text = text.rstrip() + '''\n\n\ndef test_source_gate_validation_helpers_fail_closed() -> None:
              with pytest.raises(ValueError, match="must be a JSON object"):
                  gate_validation._mapping([], name="mapping")
              with pytest.raises(ValueError, match="must be a JSON array"):
                  gate_validation._sequence("not-an-array", name="sequence")
              with pytest.raises(ValueError, match="nonempty literal string"):
                  gate_validation._literal_string(" ", name="literal")
              with pytest.raises(ValueError, match="integer >= 1"):
                  gate_validation._integer(0, name="integer", minimum=1)
              with pytest.raises(ValueError, match="must be a boolean"):
                  gate_validation._boolean(1, name="boolean")
              with pytest.raises(ValueError, match="must be numeric"):
                  gate_validation._real(True, name="real")
              with pytest.raises(ValueError, match="must be finite"):
                  gate_validation._real(float("inf"), name="real")
              with pytest.raises(ValueError, match="must be >= 0.0"):
                  gate_validation._real(-1.0, name="real", minimum=0.0)
              with pytest.raises(ValueError, match="must be <= 1.0"):
                  gate_validation._real(2.0, name="real", maximum=1.0)
              '''
          path.write_text(text, encoding="utf-8")
          PY
          python -m pip install 'ruff==0.16.2'
          python -m ruff format tests/test_deform360_prob4d_source_gate.py
      - name: Commit focused coverage tests
        shell: bash
        run: |
          if git diff --quiet -- tests/test_deform360_prob4d_source_gate.py; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_deform360_prob4d_source_gate.py
          git commit -m 'Cover source-gate fail-closed validation branches'
          git pull --rebase origin agent/harden-source-gate-validation
          git push origin HEAD:agent/harden-source-gate-validation
