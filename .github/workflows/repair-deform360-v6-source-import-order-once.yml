name: Repair Deform360 v6 source import order once

on:
  push:
    branches:
      - agent/deform360-fresh-object-session-v6-source-gate
    paths:
      - ".github/workflows/repair-deform360-v6-source-import-order-once.yml"

permissions:
  contents: write

concurrency:
  group: repair-deform360-v6-source-import-order-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/deform360-fresh-object-session-v6-source-gate
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Apply the reviewed import-order correction and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = \
            "refs/heads/agent/deform360-fresh-object-session-v6-source-gate"
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_deform360_fresh_object_session_source_v6.py")
          text = path.read_text(encoding="utf-8")
          old = (
              "import json\n"
              "from pathlib import Path\n"
              "from collections.abc import Mapping\n"
              "from typing import Any\n"
          )
          new = (
              "import json\n"
              "from collections.abc import Mapping\n"
              "from pathlib import Path\n"
              "from typing import Any\n"
          )
          if text.count(old) != 1:
              raise SystemExit("import-order correction is not unique")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          rm .github/workflows/repair-deform360-v6-source-import-order-once.yml
          python - <<'PY'
          from pathlib import Path

          text = Path(
              "tests/test_deform360_fresh_object_session_source_v6.py"
          ).read_text(encoding="utf-8")
          expected = (
              "import json\n"
              "from collections.abc import Mapping\n"
              "from pathlib import Path\n"
              "from typing import Any\n"
          )
          if text.count(expected) != 1:
              raise SystemExit("corrected import order is absent")
          PY
          test "$(git status --short | wc -l)" -eq 2

      - name: Commit the reviewed repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/test_deform360_fresh_object_session_source_v6.py \
            .github/workflows/repair-deform360-v6-source-import-order-once.yml
          git commit -m "Fix Deform360 v6 source import order"
          git push origin HEAD:agent/deform360-fresh-object-session-v6-source-gate
