name: Materialize DEFORM sensing v2 source

on:
  push:
    branches:
      - science/deform-dlo45-decision-directed-sensing-v2
    paths:
      - ".github/workflows/materialize-deform-dlo45-sensing-v2.yml"

permissions:
  contents: write

concurrency:
  group: materialize-deform-dlo45-sensing-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true

      - name: Require the one-shot workflow creation trigger
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          test -n "$before"
          test "$before" != "0000000000000000000000000000000000000000"
          mapfile -t changed < <(git diff --name-only "$before" "$GITHUB_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/materialize-deform-dlo45-sensing-v2.yml"

      - name: Decode and verify the readable Python source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import lzma
          from pathlib import Path

          payload_path = Path(
              ".github/materialize/deform-dlo45-sensing-v2-evaluate.py.xz.b64"
          )
          target_path = Path(
              "experiments/deform_dlo45_decision_directed_sensing_v2/evaluate.py"
          )
          encoded = "".join(payload_path.read_text(encoding="ascii").split())
          compressed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == (
              "2d777ff380b87b77860295a5c28367b32ad41a9478c470eb76cb6123ca7efdcd"
          )
          source = lzma.decompress(compressed)
          assert hashlib.sha256(source).hexdigest() == (
              "3533cbfefcbe5f5542840a1d4c674811bb4c1ad5c2f72ae76b1a4884475d778c"
          )
          target_path.write_bytes(source)
          PY
          python3 -m py_compile \
            experiments/deform_dlo45_decision_directed_sensing_v2/evaluate.py
          git diff --check
          test "$(git status --short | wc -l)" -eq 1
          git status --short | grep -F \
            "experiments/deform_dlo45_decision_directed_sensing_v2/evaluate.py"

      - name: Publish the materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/deform_dlo45_decision_directed_sensing_v2/evaluate.py
          git commit -m "Implement source-calibrated decision-directed sensing v2"
          git push origin "HEAD:${GITHUB_REF_NAME}"
