name: One-shot finalize Deform360 visual production v2 PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/patches/refresh_deform360_visual_production_v2.py"
      - ".github/patches/fix_deform360_visual_production_roots_v2.py"
      - ".github/workflows/_one_shot_finalize_deform360_visual_production_v2_pr.yml"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: one-shot-finalize-deform360-visual-production-v2-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref ==
        'agent/deform360-calibration-visual-production-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply reviewed transforms
        shell: bash
        run: |
          set -euo pipefail
          python .github/patches/refresh_deform360_visual_production_v2.py
          python .github/patches/fix_deform360_visual_production_roots_v2.py

      - name: Install validation environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev,graph]" "numpy>=1.24,<2.2"
          python -m pip install "build>=1.2"
          python -m pip check

      - name: Validate exact final tree
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/bayesian_phystwin/deform360_calibration_visual_production.py
            scripts/science/execute_deform360_calibration_visual_production.py
            tests/test_deform360_calibration_visual_production.py
            tests/test_deform360_calibration_visual_production_workflow.py
          )
          python -m ruff check --fix "${files[@]}"
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy \
            src/bayesian_phystwin/deform360_calibration_visual_production.py \
            scripts/science/execute_deform360_calibration_visual_production.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_deform360_calibration_visual_production.py \
            tests/test_deform360_calibration_visual_production_workflow.py \
            tests/test_portable_contracts.py
          python -m py_compile \
            src/bayesian_phystwin/deform360_calibration_visual_production.py \
            scripts/science/execute_deform360_calibration_visual_production.py \
            tests/test_deform360_calibration_visual_production.py \
            tests/test_deform360_calibration_visual_production_workflow.py
          python -m build --sdist

          rm -f \
            .github/patches/refresh_deform360_visual_production_v2.py \
            .github/patches/fix_deform360_visual_production_roots_v2.py \
            .github/workflows/_one_shot_refresh_deform360_visual_production_v2.yml \
            .github/workflows/_one_shot_finalize_deform360_visual_production_v2.yml \
            .github/workflows/_one_shot_finalize_deform360_visual_production_v2_pr.yml
          git diff --check

      - name: Publish finalized branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bind visual production to audited admission custody"
          git push origin HEAD:agent/deform360-calibration-visual-production-v2
