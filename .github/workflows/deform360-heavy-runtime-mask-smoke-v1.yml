# workflow-lifecycle: one-shot
# workflow-owner: IPS-Stuttgart maintainers
name: Deform360 heavy runtime and mask smoke

on:
  push:
    branches:
      - science/deform360-explicit-mount-source-v1
    paths:
      - ".github/requests/deform360-heavy-runtime-mask-smoke-v1.json"

permissions:
  contents: read

concurrency:
  group: deform360-heavy-runtime-mask-smoke-v1
  cancel-in-progress: false

env:
  REQUEST_PATH: .github/requests/deform360-heavy-runtime-mask-smoke-v1.json
  RAW_ROOT: /mnt/seagate10tb/florianpfaff/datasets/deform360/raw-repository
  REQUESTED_PROCESSED_ROOT: /mnt/seagate10tb/florianpfaff/datasets/deform360/processed-repository
  STAGING_ROOT: /mnt/seagate10tb/bayesian-phystwin-deform360-processed-v1
  SOURCE_OBJECT: 038-mat-cloth
  SOURCE_EPISODE: "3"
  OFFICIAL_REVISION: d8522a4403b766aeb387510c04e89032a56fdf35
  SAM3_REVISION: 35e52973bd14d2b1b939ef8e8c44d4183b31a466
  COTRACKER_REVISION: 4c3d3d4fcf4c4179a9a108dc6685b5c8b8a04f4f
  MASK_ENV_ROOT: /mnt/seagate10tb/bayesian-phystwin-deform360-processed-v1/runtime/deform360-mask-d8522a44-py312
  FULL_ENV_ROOT: /mnt/seagate10tb/bayesian-phystwin-deform360-processed-v1/runtime/deform360-processing-d8522a44-py312
  MODEL_CACHE_ROOT: /mnt/seagate10tb/bayesian-phystwin-deform360-processed-v1/runtime/model-cache
  PIP_CACHE_DIR: /mnt/seagate10tb/bayesian-phystwin-deform360-processed-v1/runtime/pip-cache
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  CUDA_VISIBLE_DEVICES: "0"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  runtime-and-mask:
    name: Heavy runtime and one-camera mask / gpuserver4090
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 240
    steps:
      - name: Check out exact request revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          clean: true

      - name: Check out pinned official Deform360 implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lhy0807/deform360
          ref: ${{ env.OFFICIAL_REVISION }}
          path: _deform360_official
          persist-credentials: false
          fetch-depth: 1
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Authorize one newly added source-only request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          test "${PUSH_FORCED}" = false
          test "${BEFORE_SHA}" != 0000000000000000000000000000000000000000
          mapfile -t changed < <(git diff --name-status "${BEFORE_SHA}" "${GITHUB_SHA}")
          printf 'Changed files:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = $'A\t'"${REQUEST_PATH}"
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          request = json.loads(Path(os.environ["REQUEST_PATH"]).read_text())
          required = {
              "schema": "deform360-heavy-runtime-mask-smoke-request-v1",
              "raw_root": os.environ["RAW_ROOT"],
              "requested_processed_root": os.environ["REQUESTED_PROCESSED_ROOT"],
              "staging_root": os.environ["STAGING_ROOT"],
              "source_object": os.environ["SOURCE_OBJECT"],
              "source_episode": int(os.environ["SOURCE_EPISODE"]),
              "runner_label": "gpuserver4090",
              "official_processing_revision": os.environ["OFFICIAL_REVISION"],
              "sam3_revision": os.environ["SAM3_REVISION"],
              "cotracker_revision": os.environ["COTRACKER_REVISION"],
              "camera_selection": "lexicographically-first-aligned-camera",
              "prompt_source": "raw-metadata-sam_prompt",
              "mask_smoke_authorized": True,
              "persistent_model_cache_authorized": True,
              "persistent_runtime_authorized": True,
              "persistent_source_mask_write_authorized": False,
              "target_future_authorized": False,
          }
          for key, expected in required.items():
              if request.get(key) != expected:
                  raise SystemExit(f"request field {key!r} changed")
          allowed = set(required) | {"request_id", "expected_source_revision"}
          if set(request) != allowed:
              raise SystemExit("request keys differ from the registered contract")
          parent = subprocess.check_output(
              ["git", "rev-parse", f"{os.environ['GITHUB_SHA']}^"], text=True
          ).strip()
          if request["expected_source_revision"] != parent:
              raise SystemExit("request does not bind the exact source parent")
          if not request["request_id"]:
              raise SystemExit("request_id must be nonempty")
          PY

      - name: Verify exact source state and prepare evidence roots
        shell: bash
        run: |
          set -euo pipefail
          test "$(realpath -e "${RAW_ROOT}")" = "${RAW_ROOT}"
          test "$(realpath -e "${REQUESTED_PROCESSED_ROOT}")" = "${REQUESTED_PROCESSED_ROOT}"
          test "$(realpath -e "${STAGING_ROOT}")" = "${STAGING_ROOT}"
          test ! -w "${REQUESTED_PROCESSED_ROOT}"
          test -w "${STAGING_ROOT}"
          test "$(git -C _deform360_official rev-parse HEAD)" = "${OFFICIAL_REVISION}"
          source_episode="${STAGING_ROOT}/cross-action-source-v1/${SOURCE_OBJECT}/episode_0003"
          test -d "${source_episode}"
          test -f "${source_episode}/robot/robot.npz"
          for sensor in \
            brics-odroid_tactilel_left \
            brics-odroid_tactilel_right \
            brics-odroid_tactiler_left \
            brics-odroid_tactiler_right; do
            test -f "${source_episode}/${sensor}/synced_tactile.npy"
          done
          runtime_evidence="${RUNNER_TEMP}/deform360-heavy-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mask_evidence="${RUNNER_TEMP}/deform360-mask-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          smoke="${RUNNER_TEMP}/deform360-mask-smoke-tree-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mask_build="${MASK_ENV_ROOT}.build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          full_build="${FULL_ENV_ROOT}.build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for path in "${runtime_evidence}" "${mask_evidence}" "${smoke}" "${mask_build}" "${full_build}"; do
            test ! -e "${path}"
          done
          mkdir -p \
            "${runtime_evidence}" \
            "${mask_evidence}" \
            "${smoke}" \
            "$(dirname "${MASK_ENV_ROOT}")" \
            "${MODEL_CACHE_ROOT}/huggingface" \
            "${MODEL_CACHE_ROOT}/torch" \
            "${PIP_CACHE_DIR}"
          {
            echo "SOURCE_EPISODE_ROOT=${source_episode}"
            echo "RUNTIME_EVIDENCE_ROOT=${runtime_evidence}"
            echo "MASK_EVIDENCE_ROOT=${mask_evidence}"
            echo "MASK_SMOKE_ROOT=${smoke}"
            echo "MASK_ENV_BUILD=${mask_build}"
            echo "FULL_ENV_BUILD=${full_build}"
            echo "HF_HOME=${MODEL_CACHE_ROOT}/huggingface"
            echo "HUGGINGFACE_HUB_CACHE=${MODEL_CACHE_ROOT}/huggingface/hub"
            echo "TORCH_HOME=${MODEL_CACHE_ROOT}/torch"
          } >> "${GITHUB_ENV}"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "revision=${GITHUB_SHA}"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "required_runner_label=gpuserver4090"
            echo "official_revision=${OFFICIAL_REVISION}"
            echo "source_episode=${source_episode}"
            python --version
            nvidia-smi -L
          } | tee "${runtime_evidence}/environment.txt"

      - name: Bootstrap exact mask runtime
        id: mask-runtime
        shell: bash
        run: |
          set -u
          ready=false
          reused=false
          log="${MASK_EVIDENCE_ROOT}/mask-runtime-install.log"
          manifest="${MASK_ENV_ROOT}/runtime-manifest.json"
          if [[ -x "${MASK_ENV_ROOT}/bin/python" && -f "${manifest}" ]]; then
            if "${MASK_ENV_ROOT}/bin/python" - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads((Path(os.environ["MASK_ENV_ROOT"]) / "runtime-manifest.json").read_text())
          expected = {
              "kind": "deform360-mask-runtime-v1",
              "official_revision": os.environ["OFFICIAL_REVISION"],
              "sam3_revision": os.environ["SAM3_REVISION"],
              "python_series": "3.12",
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f"mask runtime manifest mismatch: {key}")
          PY
            then
              ready=true
              reused=true
              echo "Reusing exact mask runtime ${MASK_ENV_ROOT}" | tee "${log}"
            fi
          fi
          if [[ "${ready}" != true ]]; then
            rm -rf -- "${MASK_ENV_BUILD}"
            python -m venv "${MASK_ENV_BUILD}"
            set +e
            "${MASK_ENV_BUILD}/bin/python" -m pip install --disable-pip-version-check \
              "${GITHUB_WORKSPACE}/_deform360_official[annotations]" \
              "torch==2.9.1" \
              "torchvision==0.24.1" \
              "git+https://github.com/facebookresearch/sam3.git@${SAM3_REVISION}" \
              > "${log}" 2>&1
            install_code=$?
            if [[ "${install_code}" -eq 0 ]]; then
              "${MASK_ENV_BUILD}/bin/python" -m pip check >> "${log}" 2>&1
              install_code=$?
            fi
            if [[ "${install_code}" -eq 0 ]]; then
              OFFICIAL_REVISION="${OFFICIAL_REVISION}" \
              SAM3_REVISION="${SAM3_REVISION}" \
              RUNTIME_ROOT="${MASK_ENV_BUILD}" \
              "${MASK_ENV_BUILD}/bin/python" - <<'PY' >> "${log}" 2>&1
          import importlib
          import json
          import os
          import platform
          import sys
          from pathlib import Path

          for name in ("cv2", "deform360", "h5py", "numpy", "sam3", "torch", "torchvision"):
              importlib.import_module(name)
          import torch
          if not torch.cuda.is_available():
              raise SystemExit("CUDA unavailable in exact mask runtime")
          payload = {
              "kind": "deform360-mask-runtime-v1",
              "official_revision": os.environ["OFFICIAL_REVISION"],
              "sam3_revision": os.environ["SAM3_REVISION"],
              "python_series": "3.12",
              "python": sys.version,
              "platform": platform.platform(),
              "torch": torch.__version__,
              "torch_cuda": torch.version.cuda,
              "cuda_device_count": torch.cuda.device_count(),
              "cuda_devices": [torch.cuda.get_device_name(i) for i in range(torch.cuda.device_count())],
          }
          (Path(os.environ["RUNTIME_ROOT"]) / "runtime-manifest.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
              install_code=$?
            fi
            set -e
            if [[ "${install_code}" -eq 0 ]]; then
              if [[ -e "${MASK_ENV_ROOT}" ]]; then
                rm -rf -- "${MASK_ENV_BUILD}"
                echo "Exact mask runtime appeared concurrently; refusing replacement." >> "${log}"
              else
                mv "${MASK_ENV_BUILD}" "${MASK_ENV_ROOT}"
              fi
              ready=true
            else
              rm -rf -- "${MASK_ENV_BUILD}"
            fi
          fi
          echo "ready=${ready}" >> "${GITHUB_OUTPUT}"
          echo "reused=${reused}" >> "${GITHUB_OUTPUT}"
          echo "MASK_RUNTIME_READY=${ready}" >> "${GITHUB_ENV}"
          echo "MASK_RUNTIME_REUSED=${reused}" >> "${GITHUB_ENV}"
          exit 0

      - name: Execute one-camera source mask smoke
        if: steps.mask-runtime.outputs.ready == 'true'
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          "${MASK_ENV_ROOT}/bin/python" - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import traceback
          from pathlib import Path

          import h5py
          import numpy as np
          import torch

          from deform360.processing.masks import process_masks_episode
          from deform360.processing.sam3_predictor import Sam3MaskPredictor

          source_episode = Path(os.environ["SOURCE_EPISODE_ROOT"])
          raw_metadata = (
              Path(os.environ["RAW_ROOT"])
              / "raw"
              / os.environ["SOURCE_OBJECT"]
              / "metadata.json"
          )
          smoke_root = Path(os.environ["MASK_SMOKE_ROOT"])
          aligned_object = smoke_root / os.environ["SOURCE_OBJECT"]
          smoke_episode = aligned_object / "episode_0003"
          evidence_root = Path(os.environ["MASK_EVIDENCE_ROOT"])

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(block)
              return digest.hexdigest()

          result = {
              "schema": "bayesian-phystwin/deform360-one-camera-mask-smoke-v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "revision": os.environ["GITHUB_SHA"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "runner_name": os.environ.get("RUNNER_NAME"),
              "required_runner_label": "gpuserver4090",
              "official_processing_revision": os.environ["OFFICIAL_REVISION"],
              "sam3_revision": os.environ["SAM3_REVISION"],
              "source_object": os.environ["SOURCE_OBJECT"],
              "source_episode": int(os.environ["SOURCE_EPISODE"]),
              "runtime_reused": os.environ.get("MASK_RUNTIME_REUSED") == "true",
              "runtime": {
                  "torch": torch.__version__,
                  "torch_cuda": torch.version.cuda,
                  "cuda_available": torch.cuda.is_available(),
                  "cuda_device_count": torch.cuda.device_count(),
                  "cuda_device": torch.cuda.get_device_name(0) if torch.cuda.is_available() else None,
              },
              "mask": {},
              "errors": [],
              "information_boundary": {
                  "source_video_decoded": False,
                  "persistent_runtime_or_cache_written": True,
                  "persistent_source_mask_written": False,
                  "requested_processed_tree_modified": False,
                  "target_directory_contents_listed": False,
                  "target_numeric_payload_opened": False,
                  "target_scoring_performed": False,
                  "fresh_confirmation_authorized": False,
                  "paper_claim_authorized": False,
              },
          }
          predictor = None
          try:
              metadata = json.loads(raw_metadata.read_text(encoding="utf-8"))
              prompt = str(metadata.get("sam_prompt", "")).strip()
              if not prompt:
                  raise ValueError("raw metadata has no nonempty sam_prompt")
              cameras = sorted(
                  path.name
                  for path in source_episode.iterdir()
                  if path.is_dir()
                  and (path / "undistorted.mp4").is_file()
                  and (path / "aligned_timestamps.txt").is_file()
              )
              if not cameras:
                  raise FileNotFoundError("source episode contains no aligned camera")
              camera = cameras[0]
              smoke_camera = smoke_episode / camera
              smoke_camera.mkdir(parents=True, exist_ok=False)
              for name in ("undistorted.mp4", "aligned_timestamps.txt"):
                  (smoke_camera / name).symlink_to(source_episode / camera / name)
              result["mask"].update(
                  {
                      "camera_selection": "lexicographically-first-aligned-camera",
                      "camera": camera,
                      "aligned_camera_count": len(cameras),
                      "prompt": prompt,
                      "prompt_source": "raw-metadata-sam_prompt",
                  }
              )
              predictor = Sam3MaskPredictor()
              outputs = process_masks_episode(
                  aligned_object,
                  int(os.environ["SOURCE_EPISODE"]),
                  prompt=prompt,
                  predictor=predictor,
                  cameras=[camera],
                  first_frame_box_fn=None,
                  overwrite=True,
                  preview=False,
              )
              result["information_boundary"]["source_video_decoded"] = True
              mask_path = outputs[camera]
              meta_path = mask_path.with_name("mask_refined.meta.json")
              meta = json.loads(meta_path.read_text(encoding="utf-8"))
              with h5py.File(mask_path, "r") as store:
                  dataset = store["data"]
                  frame_indices = np.linspace(
                      0, dataset.shape[0] - 1, min(12, dataset.shape[0]), dtype=int
                  )
                  sampled_nonzero = [int(np.count_nonzero(dataset[int(i)])) for i in frame_indices]
                  shape = [int(value) for value in dataset.shape]
                  dtype = str(dataset.dtype)
              frames_with_mask = int(meta["outputs"]["frames_with_mask"])
              grounded = bool(meta["parameters"]["grounded"])
              if not grounded or frames_with_mask < 1:
                  raise RuntimeError("SAM3 produced no grounded source mask")
              result["mask"].update(
                  {
                      "status": "success",
                      "model_id": meta.get("model", {}).get("id"),
                      "grounded": grounded,
                      "frames_with_mask": frames_with_mask,
                      "shape": shape,
                      "dtype": dtype,
                      "sampled_frame_indices": frame_indices.astype(int).tolist(),
                      "sampled_nonzero_pixels": sampled_nonzero,
                      "mask_size_bytes": mask_path.stat().st_size,
                      "mask_sha256": sha256(mask_path),
                      "metadata_sha256": sha256(meta_path),
                  }
              )
              result["decision"] = "source-mask-runtime-qualified"
              result["next_action"] = (
                  "Run all-camera source masks with the same pinned runtime, then execute "
                  "gripper masks and a bounded reconstruction pilot."
              )
          except Exception as error:
              result["mask"]["status"] = "failure"
              result["errors"].append(
                  {
                      "type": type(error).__name__,
                      "message": str(error),
                      "traceback": traceback.format_exc(limit=18),
                  }
              )
              result["decision"] = "source-mask-runtime-or-prompt-not-qualified"
              result["next_action"] = (
                  "Retain the source-only failure and repair only the exact runtime, model access, "
                  "or source prompt contract without opening a target episode."
              )
          finally:
              if predictor is not None:
                  try:
                      predictor.close()
                  except Exception:
                      pass
              if torch.cuda.is_available():
                  torch.cuda.empty_cache()
              shutil.rmtree(smoke_root, ignore_errors=True)

          result["claim_boundary"] = (
              "Source-only one-camera technical segmentation evidence on public Deform360 data. "
              "No persistent source mask, multi-view geometry, Prob4D qualification, "
              "BayesianPhysTwin benefit, cross-action transport, Causal4D decision value, "
              "target result, calibration, safety, or state-of-the-art claim."
          )
          canonical = json.dumps(result, sort_keys=True, separators=(",", ":"), allow_nan=False)
          result["result_sha256"] = hashlib.sha256(canonical.encode()).hexdigest()
          (evidence_root / "mask-smoke.json").write_text(
              json.dumps(result, indent=2, sort_keys=True, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          lines = [
              "# Deform360 one-camera source mask smoke",
              "",
              f"Decision: `{result['decision']}`",
              "",
              f"Camera: `{result['mask'].get('camera', 'unresolved')}`",
              f"Prompt: `{result['mask'].get('prompt', 'unresolved')}`",
              f"Mask status: `{result['mask'].get('status', 'not-run')}`",
              f"Frames with mask: `{result['mask'].get('frames_with_mask', 0)}`",
              "",
              f"Next action: {result['next_action']}",
              "",
              "The output mask was generated and verified only in runner scratch. No target "
              "episode or target score was opened.",
              "",
          ]
          (evidence_root / "report.md").write_text("\n".join(lines), encoding="utf-8")
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Record mask runtime bootstrap failure
        if: steps.mask-runtime.outputs.ready != 'true'
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["MASK_EVIDENCE_ROOT"])
          result = {
              "schema": "bayesian-phystwin/deform360-one-camera-mask-smoke-v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "revision": os.environ["GITHUB_SHA"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "runner_name": os.environ.get("RUNNER_NAME"),
              "required_runner_label": "gpuserver4090",
              "official_processing_revision": os.environ["OFFICIAL_REVISION"],
              "sam3_revision": os.environ["SAM3_REVISION"],
              "source_object": os.environ["SOURCE_OBJECT"],
              "source_episode": int(os.environ["SOURCE_EPISODE"]),
              "runtime_reused": False,
              "mask": {"status": "not-run"},
              "decision": "source-mask-runtime-bootstrap-failed",
              "next_action": (
                  "Retain the exact installation log and repair the pinned source-only runtime "
                  "without opening a target episode."
              ),
              "information_boundary": {
                  "source_video_decoded": False,
                  "persistent_runtime_or_cache_written": True,
                  "persistent_source_mask_written": False,
                  "requested_processed_tree_modified": False,
                  "target_directory_contents_listed": False,
                  "target_numeric_payload_opened": False,
                  "target_scoring_performed": False,
                  "fresh_confirmation_authorized": False,
                  "paper_claim_authorized": False,
              },
              "claim_boundary": (
                  "Source-only technical runtime evidence. No mask, geometry, target, "
                  "Prob4D, BayesianPhysTwin, Causal4D, calibration, safety, or SOTA claim."
              ),
          }
          canonical = json.dumps(result, sort_keys=True, separators=(",", ":"), allow_nan=False)
          result["result_sha256"] = hashlib.sha256(canonical.encode()).hexdigest()
          (root / "mask-smoke.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          (root / "report.md").write_text(
              "# Deform360 one-camera source mask smoke\n\n"
              "Decision: `source-mask-runtime-bootstrap-failed`\n\n"
              "The exact source-only installation log is retained. No source video or target "
              "payload was decoded.\n",
              encoding="utf-8",
          )
          PY

      - name: Upload mask runtime and smoke evidence
        if: always() && env.MASK_EVIDENCE_ROOT != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: deform360-mask-runtime-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.MASK_EVIDENCE_ROOT }}/mask-runtime-install.log
            ${{ env.MASK_EVIDENCE_ROOT }}/mask-smoke.json
            ${{ env.MASK_EVIDENCE_ROOT }}/report.md
          if-no-files-found: warn
          retention-days: 90

      - name: Bootstrap exact full processing runtime
        id: full-runtime
        shell: bash
        run: |
          set -u
          ready=false
          reused=false
          log="${RUNTIME_EVIDENCE_ROOT}/full-runtime-install.log"
          manifest="${FULL_ENV_ROOT}/runtime-manifest.json"
          if [[ -x "${FULL_ENV_ROOT}/bin/python" && -f "${manifest}" ]]; then
            if "${FULL_ENV_ROOT}/bin/python" - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads((Path(os.environ["FULL_ENV_ROOT"]) / "runtime-manifest.json").read_text())
          expected = {
              "kind": "deform360-full-processing-runtime-v1",
              "official_revision": os.environ["OFFICIAL_REVISION"],
              "sam3_revision": os.environ["SAM3_REVISION"],
              "cotracker_revision": os.environ["COTRACKER_REVISION"],
              "python_series": "3.12",
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f"full runtime manifest mismatch: {key}")
          PY
            then
              ready=true
              reused=true
              echo "Reusing exact full processing runtime ${FULL_ENV_ROOT}" | tee "${log}"
            fi
          fi
          if [[ "${ready}" != true ]]; then
            rm -rf -- "${FULL_ENV_BUILD}"
            python -m venv "${FULL_ENV_BUILD}"
            set +e
            "${FULL_ENV_BUILD}/bin/python" -m pip install --disable-pip-version-check \
              "${GITHUB_WORKSPACE}/_deform360_official[processing]" \
              > "${log}" 2>&1
            install_code=$?
            if [[ "${install_code}" -eq 0 ]]; then
              "${FULL_ENV_BUILD}/bin/python" -m pip install --disable-pip-version-check \
                -r "${GITHUB_WORKSPACE}/_deform360_official/requirements-processing.txt" \
                >> "${log}" 2>&1
              install_code=$?
            fi
            if [[ "${install_code}" -eq 0 ]]; then
              "${FULL_ENV_BUILD}/bin/python" -m pip check >> "${log}" 2>&1
              install_code=$?
            fi
            if [[ "${install_code}" -eq 0 ]]; then
              OFFICIAL_REVISION="${OFFICIAL_REVISION}" \
              SAM3_REVISION="${SAM3_REVISION}" \
              COTRACKER_REVISION="${COTRACKER_REVISION}" \
              RUNTIME_ROOT="${FULL_ENV_BUILD}" \
              "${FULL_ENV_BUILD}/bin/python" - <<'PY' >> "${log}" 2>&1
          import importlib
          import importlib.metadata
          import json
          import os
          import platform
          import sys
          from pathlib import Path

          modules = (
              "cotracker",
              "cv2",
              "deform360",
              "fpsample",
              "gsplat",
              "h5py",
              "mediapy",
              "nerfstudio",
              "numpy",
              "pyrender",
              "sam3",
              "torch",
              "torchvision",
              "trimesh",
          )
          imported = {}
          for name in modules:
              module = importlib.import_module(name)
              imported[name] = str(getattr(module, "__version__", "unknown"))
          import torch
          if not torch.cuda.is_available():
              raise SystemExit("CUDA unavailable in exact full processing runtime")
          distributions = {}
          for name in (
              "deform360",
              "gsplat",
              "nerfstudio",
              "torch",
              "torchvision",
          ):
              distributions[name] = importlib.metadata.version(name)
          payload = {
              "kind": "deform360-full-processing-runtime-v1",
              "official_revision": os.environ["OFFICIAL_REVISION"],
              "sam3_revision": os.environ["SAM3_REVISION"],
              "cotracker_revision": os.environ["COTRACKER_REVISION"],
              "python_series": "3.12",
              "python": sys.version,
              "platform": platform.platform(),
              "imports": imported,
              "distributions": distributions,
              "torch_cuda": torch.version.cuda,
              "cuda_device_count": torch.cuda.device_count(),
              "cuda_devices": [torch.cuda.get_device_name(i) for i in range(torch.cuda.device_count())],
          }
          (Path(os.environ["RUNTIME_ROOT"]) / "runtime-manifest.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
              install_code=$?
            fi
            set -e
            if [[ "${install_code}" -eq 0 ]]; then
              if [[ -e "${FULL_ENV_ROOT}" ]]; then
                rm -rf -- "${FULL_ENV_BUILD}"
                echo "Exact full runtime appeared concurrently; refusing replacement." >> "${log}"
              else
                mv "${FULL_ENV_BUILD}" "${FULL_ENV_ROOT}"
              fi
              ready=true
            else
              rm -rf -- "${FULL_ENV_BUILD}"
            fi
          fi
          echo "ready=${ready}" >> "${GITHUB_OUTPUT}"
          echo "reused=${reused}" >> "${GITHUB_OUTPUT}"
          echo "FULL_RUNTIME_READY=${ready}" >> "${GITHUB_ENV}"
          echo "FULL_RUNTIME_REUSED=${reused}" >> "${GITHUB_ENV}"
          exit 0

      - name: Record full processing runtime result
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ["RUNTIME_EVIDENCE_ROOT"])
          ready = os.environ.get("FULL_RUNTIME_READY") == "true"
          reused = os.environ.get("FULL_RUNTIME_REUSED") == "true"
          manifest_path = Path(os.environ["FULL_ENV_ROOT"]) / "runtime-manifest.json"
          manifest = (
              json.loads(manifest_path.read_text(encoding="utf-8"))
              if ready and manifest_path.is_file()
              else None
          )
          result = {
              "schema": "bayesian-phystwin/deform360-full-processing-runtime-result-v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "revision": os.environ["GITHUB_SHA"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "runner_name": os.environ.get("RUNNER_NAME"),
              "required_runner_label": "gpuserver4090",
              "official_processing_revision": os.environ["OFFICIAL_REVISION"],
              "sam3_revision": os.environ["SAM3_REVISION"],
              "cotracker_revision": os.environ["COTRACKER_REVISION"],
              "runtime_root": os.environ["FULL_ENV_ROOT"],
              "runtime_ready": ready,
              "runtime_reused": reused,
              "runtime_manifest": manifest,
              "decision": (
                  "full-source-processing-runtime-ready"
                  if ready
                  else "full-source-processing-runtime-bootstrap-failed"
              ),
              "next_action": (
                  "Run all-camera source masks, gripper masks, and a bounded source reconstruction pilot."
                  if ready
                  else "Retain the exact installation log and repair the pinned full-processing runtime."
              ),
              "information_boundary": {
                  "persistent_runtime_or_cache_written": True,
                  "source_geometry_generated": False,
                  "persistent_source_annotation_written": False,
                  "requested_processed_tree_modified": False,
                  "target_numeric_payload_opened": False,
                  "target_scoring_performed": False,
                  "fresh_confirmation_authorized": False,
                  "paper_claim_authorized": False,
              },
              "claim_boundary": (
                  "Source-only technical runtime evidence. No reconstructed geometry, target result, "
                  "Prob4D qualification, BayesianPhysTwin benefit, Causal4D decision value, "
                  "calibration, safety, or state-of-the-art claim."
              ),
          }
          canonical = json.dumps(result, sort_keys=True, separators=(",", ":"), allow_nan=False)
          result["result_sha256"] = hashlib.sha256(canonical.encode()).hexdigest()
          (evidence / "full-runtime.json").write_text(
              json.dumps(result, indent=2, sort_keys=True, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          lines = [
              "# Deform360 full processing runtime",
              "",
              f"Decision: `{result['decision']}`",
              f"Runtime ready: `{ready}`",
              f"Runtime reused: `{reused}`",
              "",
              f"Next action: {result['next_action']}",
              "",
          ]
          (evidence / "report.md").write_text("\n".join(lines), encoding="utf-8")
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Publish summaries
        if: always()
        shell: bash
        run: |
          if [[ -f "${MASK_EVIDENCE_ROOT}/report.md" ]]; then
            cat "${MASK_EVIDENCE_ROOT}/report.md" >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [[ -f "${RUNTIME_EVIDENCE_ROOT}/report.md" ]]; then
            cat "${RUNTIME_EVIDENCE_ROOT}/report.md" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload full runtime evidence
        if: always() && env.RUNTIME_EVIDENCE_ROOT != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: deform360-full-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.RUNTIME_EVIDENCE_ROOT }}/environment.txt
            ${{ env.RUNTIME_EVIDENCE_ROOT }}/full-runtime-install.log
            ${{ env.RUNTIME_EVIDENCE_ROOT }}/full-runtime.json
            ${{ env.RUNTIME_EVIDENCE_ROOT }}/report.md
          if-no-files-found: warn
          retention-days: 90

      - name: Remove nonpersistent scratch
        if: always()
        shell: bash
        run: |
          rm -rf -- \
            "${MASK_ENV_BUILD:-}" \
            "${FULL_ENV_BUILD:-}" \
            "${MASK_SMOKE_ROOT:-}" \
            "${MASK_EVIDENCE_ROOT:-}" \
            "${RUNTIME_EVIDENCE_ROOT:-}"
