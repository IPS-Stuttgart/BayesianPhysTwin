name: Execute domain covariance provenance tightening

on:
  pull_request:
    branches:
      - agent/domain-covariance-calibration-v1-clean
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  execute:
    if: >-
      github.event.pull_request.head.ref ==
      'agent/execute-domain-covariance-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact target branch
        uses: actions/checkout@v7
        with:
          ref: agent/domain-covariance-calibration-v1-clean
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Bind covariance identities to dtype and retain public input flexibility
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path(
              "src/bayesian_phystwin/domain_covariance_calibration.py"
          )
          text = source.read_text(encoding="utf-8")
          old_digest = '''def _array_digest(value: np.ndarray) -> str:
              array = np.ascontiguousarray(value, dtype=np.float64)
              digest = hashlib.sha256()
              digest.update(str(array.shape).encode("ascii"))
              digest.update(b"\\0float64\\0")
              digest.update(array.tobytes(order="C"))
              return digest.hexdigest()
          '''.replace("          ", "")
          new_digest = '''def _array_digest(value: np.ndarray) -> str:
              array = np.asarray(value)
              if array.dtype.kind not in "iuf":
                  raise ValueError("covariance digest requires real numeric values")
              canonical = np.ascontiguousarray(array)
              digest = hashlib.sha256()
              digest.update(str(canonical.shape).encode("ascii"))
              digest.update(b"\\0")
              digest.update(canonical.dtype.str.encode("ascii"))
              digest.update(b"\\0")
              digest.update(canonical.tobytes(order="C"))
              return digest.hexdigest()
          '''.replace("          ", "")
          if text.count(old_digest) != 1:
              raise SystemExit("covariance digest patch target changed")
          text = text.replace(old_digest, new_digest, 1)

          replacements = {
              "    transform_scores: Sequence[TransformScore]\n": (
                  "    transform_scores: Sequence[Sequence[object]]\n"
              ),
              "    leave_one_group_out: Sequence[HeldGroupScore]\n": (
                  "    leave_one_group_out: Sequence[Sequence[object]]\n"
              ),
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"public typing patch target changed: {old!r}")
              text = text.replace(old, new, 1)
          source.write_text(text, encoding="utf-8")

          tests = Path(
              "tests/"
              "test_source_competence_domain_covariance_calibration_edges.py"
          )
          test_text = tests.read_text(encoding="utf-8")
          marker = "\ndef test_identity_transform_retains_exact_raw_object() -> None:\n"
          addition = '''
          def test_application_digests_distinguish_input_dtype() -> None:
              certificate = _fit(residuals=np.ones((4, 1)))
              raw32 = np.asarray([[1.0]], dtype=np.float32)
              raw64 = np.asarray([[1.0]], dtype=np.float64)

              output32, record32 = apply_domain_covariance_calibration(
                  raw32,
                  certificate,
                  domain_id="dynamic",
                  inference_admissible=True,
              )
              output64, record64 = apply_domain_covariance_calibration(
                  raw64,
                  certificate,
                  domain_id="dynamic",
                  inference_admissible=True,
              )

              assert output32 is raw32
              assert output64 is raw64
              assert record32.raw_covariance_sha256 != record64.raw_covariance_sha256
              assert record32.artifact_id != record64.artifact_id

          '''.replace("          ", "")
          if addition not in test_text:
              if test_text.count(marker) != 1:
                  raise SystemExit("dtype test insertion point changed")
              test_text = test_text.replace(marker, "\n" + addition + marker.lstrip(), 1)
          tests.write_text(test_text, encoding="utf-8")

          docs = Path("docs/domain_covariance_calibration_v1.md")
          doc_text = docs.read_text(encoding="utf-8")
          old_doc = (
              "Successful nonidentity application returns a new immutable float64 array and a\n"
              "content-addressed record binding the selected transform and the actual input and\n"
              "output shapes and digests. Application records validate their internal gate,\n"
          )
          new_doc = (
              "Successful nonidentity application returns a new immutable float64 array and a\n"
              "content-addressed record binding the selected transform and the actual input and\n"
              "output shapes, dtypes, and canonical C-order values. Numerically equal arrays\n"
              "with different dtypes therefore retain distinct application identities. Records\n"
              "validate their internal gate,\n"
          )
          if doc_text.count(old_doc) != 1:
              raise SystemExit("application identity documentation target changed")
          docs.write_text(doc_text.replace(old_doc, new_doc, 1), encoding="utf-8")
          PY

      - name: Validate formatting, typing, contracts, and coverage
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]" coverage
          files=(
            src/bayesian_phystwin/domain_covariance_calibration.py
            tests/test_source_competence_domain_covariance_calibration.py
            tests/test_source_competence_domain_covariance_calibration_edges.py
          )
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy src/bayesian_phystwin/domain_covariance_calibration.py
          coverage run --branch -m pytest -q \
            tests/test_source_competence_domain_covariance_calibration.py \
            tests/test_source_competence_domain_covariance_calibration_edges.py
          coverage report -m \
            --include=src/bayesian_phystwin/domain_covariance_calibration.py \
            --fail-under=90
          git diff --check

      - name: Publish only the validated provenance patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayesian_phystwin/domain_covariance_calibration.py \
            tests/test_source_competence_domain_covariance_calibration_edges.py \
            docs/domain_covariance_calibration_v1.md
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "Bind covariance application identities to dtype"
          git push origin HEAD:agent/domain-covariance-calibration-v1-clean
