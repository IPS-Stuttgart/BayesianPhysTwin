name: Execute domain covariance typing repair

on:
  pull_request:
    branches:
      - agent/domain-covariance-calibration-v1-clean
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  execute:
    if: >-
      github.event.pull_request.head.ref ==
      'agent/execute-domain-covariance-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact target branch
        uses: actions/checkout@v7
        with:
          ref: agent/domain-covariance-calibration-v1-clean
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply the reviewed type narrowing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "src/bayesian_phystwin/domain_covariance_calibration.py"
          )
          text = path.read_text(encoding="utf-8")
          replacements = {
              "    transform_scores: Sequence[Sequence[object]]\n": (
                  "    transform_scores: Sequence[TransformScore]\n"
              ),
              "    leave_one_group_out: Sequence[Sequence[object]]\n": (
                  "    leave_one_group_out: Sequence[HeldGroupScore]\n"
              ),
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"typing patch target changed: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate formatting, typing, and focused contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          file=src/bayesian_phystwin/domain_covariance_calibration.py
          python -m ruff check "${file}"
          python -m ruff format --check "${file}"
          python -m mypy "${file}"
          python -m pytest -q \
            tests/test_source_competence_domain_covariance_calibration.py \
            tests/test_source_competence_domain_covariance_calibration_edges.py
          git diff --check

      - name: Publish only the validated typing patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bayesian_phystwin/domain_covariance_calibration.py
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "Narrow covariance score record types"
          git push origin HEAD:agent/domain-covariance-calibration-v1-clean
