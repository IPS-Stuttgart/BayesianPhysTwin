name: Execute domain covariance formatting

on:
  pull_request:
    branches:
      - agent/domain-covariance-calibration-v1-clean
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  execute:
    if: >-
      github.event.pull_request.head.ref ==
      'agent/execute-domain-covariance-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact target branch
        uses: actions/checkout@v7
        with:
          ref: agent/domain-covariance-calibration-v1-clean
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install focused validation dependencies
        run: python -m pip install -e ".[dev]" coverage

      - name: Apply canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/bayesian_phystwin/domain_covariance_calibration.py
            tests/test_source_competence_domain_covariance_calibration.py
            tests/test_source_competence_domain_covariance_calibration_edges.py
          )
          ruff format "${files[@]}"
          ruff check "${files[@]}"
          ruff format --check "${files[@]}"

      - name: Validate the focused contracts and coverage
        shell: bash
        run: |
          set -euo pipefail
          coverage run --branch -m pytest -q \
            tests/test_source_competence_domain_covariance_calibration.py \
            tests/test_source_competence_domain_covariance_calibration_edges.py
          coverage report -m \
            --include=src/bayesian_phystwin/domain_covariance_calibration.py \
            --fail-under=94
          git diff --check

      - name: Publish only the validated formatting patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayesian_phystwin/domain_covariance_calibration.py \
            tests/test_source_competence_domain_covariance_calibration.py \
            tests/test_source_competence_domain_covariance_calibration_edges.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Target branch already contains the canonical formatting."
            exit 0
          fi
          git commit -m "Apply canonical covariance calibration formatting"
          git push origin HEAD:agent/domain-covariance-calibration-v1-clean
