name: Temporary seal covariance-only analysis trigger

on:
  push:
    branches:
      - agent/full22-covariance-only-hybrid-v1
    paths:
      - .github/workflows/temporary-seal-covariance-analysis.yml

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/full22-covariance-only-hybrid-v1
          fetch-depth: 1
          persist-credentials: true
          clean: true

      - name: Restrict scientific reruns to explicit dispatch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/full22-covariance-only-hybrid-v1.yml')
          text = path.read_text(encoding='utf-8')
          old = '''    if: >-
              github.event_name != 'pull_request' ||
              github.event.pull_request.head.repo.full_name == github.repository
          '''
          new = '''    # The registered pull-request result is sealed. Reproduce the expensive
              # analysis only through an explicit manual dispatch; PRs still validate contracts.
              if: github.event_name == 'workflow_dispatch'
          '''
          if old not in text:
              raise SystemExit('registered analysis condition was not found exactly once')
          if text.count(old) != 1:
              raise SystemExit('registered analysis condition was not unique')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/temporary-seal-covariance-analysis.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/full22-covariance-only-hybrid-v1.yml \
            .github/workflows/temporary-seal-covariance-analysis.yml
          git commit -m 'Seal covariance-only analysis behind manual dispatch'
          git push origin HEAD:agent/full22-covariance-only-hybrid-v1
