name: Apply command-registry quality repair

on:
  push:
    branches:
      - agent/classify-command-registry

permissions:
  contents: write

concurrency:
  group: agent-fix-command-registry-quality
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/classify-command-registry
          fetch-depth: 0
      - name: Apply deterministic narrowing fixes
        run: python .github/agent-patches/fix_command_registry_quality.py
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Format repaired modules
        run: |
          python -m ruff format \
            src/bayesian_phystwin/_gauge_aware_contracts.py \
            src/bayesian_phystwin/_gauge_aware_solver.py \
            src/bayesian_phystwin/prob4d_observation_contract.py \
            src/bayesian_phystwin/observation_belief_gauge_adapter.py
      - name: Lint repaired modules
        run: |
          python -m ruff check \
            src/bayesian_phystwin/_gauge_aware_contracts.py \
            src/bayesian_phystwin/_gauge_aware_solver.py \
            src/bayesian_phystwin/prob4d_observation_contract.py \
            src/bayesian_phystwin/observation_belief_gauge_adapter.py
      - name: Run repository quality ratchet
        shell: bash
        run: |
          base=$(git merge-base origin/main HEAD)
          python tools/quality/changed_python_quality.py \
            --base "$base" \
            --head HEAD
      - name: Run focused regression tests
        run: |
          python -m pytest -q \
            tests/test_cli_main.py \
            tests/test_command_registry.py \
            tests/test_run_manifest_cli.py \
            tests/test_gauge_aware_belief.py \
            tests/test_observation_belief_gauge_adapter.py \
            tests/test_prob4d_joint_contract_fixture.py
      - name: Verify clean patch
        run: |
          test ! -e .github/agent-patches/fix_command_registry_quality.py
          test ! -e .github/workflows/agent-fix-command-registry-quality.yml
          git diff --check
          git status --short
      - name: Commit validated repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix isolated mypy narrowing in stable contracts"
          git push origin HEAD:agent/classify-command-registry
