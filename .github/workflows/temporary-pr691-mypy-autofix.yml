name: Temporary PR 691 MyPy autofix

on:
  push:
    branches:
      - agent/matphys-portable-identity-v1

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/matphys-portable-identity-v1
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Narrow validated source bundle path
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/bayesian_phystwin/matphys_portable_identity_v1.py")
          text = path.read_text(encoding="utf-8")
          old = '''        source_root = ordinary_directory(\n            cast(Mapping[str, object], receipt["source_bundle"])["path"],\n            name="source official MatPhys bundle",\n        )\n'''
          new = '''        source_bundle = cast(Mapping[str, object], receipt["source_bundle"])\n        source_root = ordinary_directory(\n            nonempty_string(source_bundle.get("path"), name="source_bundle.path"),\n            name="source official MatPhys bundle",\n        )\n'''
          if old not in text:
              raise SystemExit("expected source-root block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Validate focused quality checks
        run: |
          python -m pip install -e ".[dev]"
          python -m ruff format src/bayesian_phystwin/matphys_portable_identity_v1.py
          python -m ruff check src/bayesian_phystwin/matphys_portable_identity_v1.py
          python -m mypy src/bayesian_phystwin/matphys_portable_identity_v1.py
      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-pr691-mypy-autofix.yml
          git add src/bayesian_phystwin/matphys_portable_identity_v1.py
          git commit -m "Fix PR 691 source-path typing"
          git push origin HEAD:agent/matphys-portable-identity-v1
