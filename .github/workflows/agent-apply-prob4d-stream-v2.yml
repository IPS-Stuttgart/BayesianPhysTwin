name: Apply agent patch

on:
  push:
    branches:
      - agent/accept-prob4d-stream-contract-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply compatibility patch
        run: |
          base64 -d .github/agent-patches/accept-prob4d-stream-v2.py.gz.b64 | gzip -d > /tmp/apply.py
          python /tmp/apply.py
          rm .github/agent-patches/accept-prob4d-stream-v2.py.gz.b64
          rm .github/workflows/agent-apply-prob4d-stream-v2.yml
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Validate
        run: |
          python -m pip install -e '.[dev]'
          python -m ruff check \
            src/bayesian_phystwin/prob4d_causal_lineage.py \
            tests/test_prob4d_causal_lineage.py
          python -m pytest -q tests/test_prob4d_causal_lineage.py
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Accept Prob4D causal stream contract v2'
          git push origin HEAD:${{ github.ref_name }}
