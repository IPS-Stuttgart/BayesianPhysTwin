# Retriggered after the duplicate-helper cleanup commit.
name: Fix residual-history coverage manifest once

on:
  push:
    branches:
      - agent/deform360-covariance-residual-history-dry-run-v1

permissions:
  contents: write

concurrency:
  group: fix-residual-history-coverage-manifest-once
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  patch-and-verify:
    if: github.ref == 'refs/heads/agent/deform360-covariance-residual-history-dry-run-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/deform360-covariance-residual-history-dry-run-v1
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Register the existing focused tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(".github/quality/test-suites.json")
          document = json.loads(path.read_text(encoding="utf-8"))
          suite = document["suites"]["stable-core-coverage"]
          anchor = "tests/test_deform360_contact_anchor.py"
          additions = [
              "tests/test_deform360_covariance_residual_history_v1.py",
              "tests/test_deform360_covariance_residual_history_real_camera_roster_v1.py",
          ]
          if any(item in suite for item in additions):
              raise SystemExit("residual-history coverage tests are already registered")
          try:
              position = suite.index(anchor) + 1
          except ValueError as exc:
              raise SystemExit(f"coverage-suite anchor missing: {anchor}") from exc
          suite[position:position] = additions
          path.write_text(
              json.dumps(document, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
          python tools/quality/test_suite_manifest.py list stable-core-coverage \
            | grep -Fx "tests/test_deform360_covariance_residual_history_v1.py"
          python tools/quality/test_suite_manifest.py list stable-core-coverage \
            | grep -Fx "tests/test_deform360_covariance_residual_history_real_camera_roster_v1.py"

      - name: Validate focused contracts and exact coverage ratchet
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1"
          python -m pip install -e ".[dev,graph]"
          python -m pip install "coverage==7.13.3"
          python -m pip check
          python -m pytest -q -p no:cacheprovider \
            tests/test_deform360_covariance_residual_history_v1.py \
            tests/test_deform360_covariance_residual_history_real_camera_roster_v1.py \
            tests/test_test_suite_manifest.py

          python tools/quality/test_suite_manifest.py list stable-core-coverage \
            > "${RUNNER_TEMP}/stable-core-tests.txt"
          mapfile -t stable_tests < "${RUNNER_TEMP}/stable-core-tests.txt"
          test "${#stable_tests[@]}" -gt 0
          python -m coverage run --branch --source=bayesian_phystwin \
            -m pytest -q "${stable_tests[@]}"
          python -m coverage json -o package-coverage.json

          stable_files=(
            src/bayesian_phystwin/_gauge_aware_contracts.py
            src/bayesian_phystwin/_gauge_aware_solver.py
            src/bayesian_phystwin/calibration.py
            src/bayesian_phystwin/causal4d_provider_v1.py
            src/bayesian_phystwin/cli/main.py
            src/bayesian_phystwin/cli/run_manifest.py
            src/bayesian_phystwin/gauge_aware_belief.py
            src/bayesian_phystwin/deform360_contact_anchor.py
            src/bayesian_phystwin/observation_belief.py
            src/bayesian_phystwin/observation_belief_gauge_adapter.py
            src/bayesian_phystwin/phystwin_profile.py
            src/bayesian_phystwin/prob4d_causal_lineage.py
            src/bayesian_phystwin/prob4d_observation_contract.py
            src/bayesian_phystwin/pseudo_measurements.py
            src/bayesian_phystwin/repository_provenance.py
            src/bayesian_phystwin/robust_likelihood.py
            src/bayesian_phystwin/run_manifest.py
            src/bayesian_phystwin/run_manifest_v2.py
          )
          stable_include=$(IFS=,; echo "${stable_files[*]}")
          python -m coverage json \
            --include="${stable_include}" \
            -o stable-core-coverage.json
          base_sha="$(git rev-parse origin/main)"
          head_sha="$(git rev-parse HEAD)"
          python tools/quality/check_coverage_floors.py \
            stable-core-coverage.json \
            .github/quality/stable-core-coverage-floors.json \
            --changed-coverage-json package-coverage.json \
            --base "${base_sha}" \
            --head "${head_sha}"

      - name: Commit only the validated manifest and remove this helper
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          helper=.github/workflows/fix-residual-history-coverage-manifest-once.yml
          manifest=.github/quality/test-suites.json
          rm -- "${helper}"
          git diff --check
          actual="$(git status --short | awk '{print $2}' | LC_ALL=C sort)"
          expected="$(printf '%s\n' "${helper}" "${manifest}" | LC_ALL=C sort)"
          test "${actual}" = "${expected}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- "${helper}" "${manifest}"
          git commit -m "Register residual-history tests for coverage"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" push \
            origin HEAD:refs/heads/agent/deform360-covariance-residual-history-dry-run-v1
