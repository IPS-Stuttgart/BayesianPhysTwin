name: Apply Deform360 covariance residual adapter v1

on:
  push:
    branches: [deform360-covariance-only-target-v1]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-deform360-covariance-residual-adapter-v1
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.ref == 'deform360-covariance-only-target-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact proposed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Reconstruct and extract the bounded payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          parts=(
            .github/patches/deform360-covariance-residual-adapter-v1.part0.b64
            .github/patches/deform360-covariance-residual-adapter-v1.part1.b64
            .github/patches/deform360-covariance-residual-adapter-v1.part2.b64
            .github/patches/deform360-covariance-residual-adapter-v1.part3.b64
          )
          for part in "${parts[@]}"; do
            test -f "${part}"
          done
          payload="${RUNNER_TEMP}/deform360-covariance-residual-adapter-v1.tar.xz"
          cat "${parts[@]}" | tr -d '\r\n' | base64 --decode > "${payload}"
          echo \
            "f6b2238401fac3c599d205d9c4b0301b5358b758b37aa2c6d755c6d34fc2d35  ${payload}" \
            | sha256sum --check --strict
          xz --test "${payload}"
          tar -tJf "${payload}" > "${RUNNER_TEMP}/members.txt"
          export MEMBERS_FILE="${RUNNER_TEMP}/members.txt"
          python - <<'PY'
          import os
          from pathlib import Path, PurePosixPath

          expected = {
              ".github/workflows/deform360-covariance-residual-adapter-dry-run-v1.yml",
              "MANIFEST.in",
              "docs/deform360_covariance_residual_adapter_dry_run_v1.md",
              "protocols/locks/deform360_covariance_only_residual_adapter_dry_run_v1.json",
              "results/science/deform360_covariance_only_target_v1/residual_adapter_dry_run_v1.json",
              "scripts/science/run_deform360_covariance_residual_adapter_dry_run_v1.py",
              "src/bayesian_phystwin/deform360_covariance_residual_adapter_v1.py",
              "tests/test_deform360_covariance_residual_adapter_v1.py",
          }
          members = Path(os.environ["MEMBERS_FILE"]).read_text().splitlines()
          if set(members) != expected or len(members) != len(expected):
              raise SystemExit(f"unexpected patch members: {members}")
          for value in members:
              path = PurePosixPath(value)
              if path.is_absolute() or any(
                  part in {"", ".", ".."} for part in path.parts
              ):
                  raise SystemExit(f"unsafe patch member: {value}")
          PY
          tar -xJf "${payload}" -C .
          rm -- \
            "${parts[@]}" \
            .github/workflows/apply-deform360-covariance-residual-adapter-v1.yml

      - name: Install and validate the exact implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1"
          python -m pip install -e ".[dev]"
          python -m pip check
          files=(
            scripts/science/run_deform360_covariance_residual_adapter_dry_run_v1.py
            src/bayesian_phystwin/deform360_covariance_residual_adapter_v1.py
            tests/test_deform360_covariance_residual_adapter_v1.py
          )
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy \
            src/bayesian_phystwin/deform360_covariance_residual_adapter_v1.py \
            scripts/science/run_deform360_covariance_residual_adapter_dry_run_v1.py
          tests=(
            tests/test_covariance_only_hybrid.py
            tests/test_covariance_only_hybrid_adversarial.py
            tests/test_deform360_covariance_residual_adapter_v1.py
            tests/test_pull_request_workflow_integrity.py
          )
          if [[ -f tests/test_pr_ready.py ]]; then
            tests+=(tests/test_pr_ready.py)
          fi
          python -m pytest -q -p no:cacheprovider "${tests[@]}"

      - name: Reproduce the checked-in no-target receipt
        shell: bash
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/residual-adapter-dry-run.json"
          python \
            scripts/science/run_deform360_covariance_residual_adapter_dry_run_v1.py \
            "${output}" \
            --protocol \
            protocols/locks/deform360_covariance_only_residual_adapter_dry_run_v1.json
          cmp --silent \
            "${output}" \
            results/science/deform360_covariance_only_target_v1/residual_adapter_dry_run_v1.json
          jq -e '
            .status == "passed" and
            .information_boundary.target_payload_opened == false and
            .information_boundary.target_outcomes_opened == false and
            .information_boundary.target_cache_path_accessed == false and
            .information_boundary.claim_authorized == false
          ' "${output}" >/dev/null

      - name: Verify the bounded diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          python - <<'PY'
          import subprocess

          required = {
              ".github/patches/deform360-covariance-residual-adapter-v1.part0.b64",
              ".github/patches/deform360-covariance-residual-adapter-v1.part1.b64",
              ".github/patches/deform360-covariance-residual-adapter-v1.part2.b64",
              ".github/patches/deform360-covariance-residual-adapter-v1.part3.b64",
              ".github/workflows/apply-deform360-covariance-residual-adapter-v1.yml",
              "MANIFEST.in",
              "scripts/science/run_deform360_covariance_residual_adapter_dry_run_v1.py",
              "src/bayesian_phystwin/deform360_covariance_residual_adapter_v1.py",
              "tests/test_deform360_covariance_residual_adapter_v1.py",
          }
          allowed = required | {
              ".github/workflows/deform360-covariance-residual-adapter-dry-run-v1.yml",
              "docs/deform360_covariance_residual_adapter_dry_run_v1.md",
              "protocols/locks/deform360_covariance_only_residual_adapter_dry_run_v1.json",
              "results/science/deform360_covariance_only_target_v1/residual_adapter_dry_run_v1.json",
          }
          output = subprocess.check_output(
              ["git", "status", "--porcelain=v1"], text=True
          )
          changed = {
              line[3:] for line in output.splitlines() if line.strip()
          }
          if not required <= changed or not changed <= allowed:
              raise SystemExit(
                  f"unexpected bounded patch paths: changed={sorted(changed)}"
              )
          PY

      - name: Commit only the validated permanent gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- \
            .github/patches/deform360-covariance-residual-adapter-v1.part0.b64 \
            .github/patches/deform360-covariance-residual-adapter-v1.part1.b64 \
            .github/patches/deform360-covariance-residual-adapter-v1.part2.b64 \
            .github/patches/deform360-covariance-residual-adapter-v1.part3.b64 \
            .github/workflows/apply-deform360-covariance-residual-adapter-v1.yml \
            .github/workflows/deform360-covariance-residual-adapter-dry-run-v1.yml \
            MANIFEST.in \
            docs/deform360_covariance_residual_adapter_dry_run_v1.md \
            protocols/locks/deform360_covariance_only_residual_adapter_dry_run_v1.json \
            results/science/deform360_covariance_only_target_v1/residual_adapter_dry_run_v1.json \
            scripts/science/run_deform360_covariance_residual_adapter_dry_run_v1.py \
            src/bayesian_phystwin/deform360_covariance_residual_adapter_v1.py \
            tests/test_deform360_covariance_residual_adapter_v1.py
          git commit -m "Add source-only covariance residual adapter gate"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" push \
            origin HEAD:refs/heads/deform360-covariance-only-target-v1
