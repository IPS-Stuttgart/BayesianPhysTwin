name: Apply tree-block IRLS parity trace

on:
  push:
    branches: [agent/tree-block-irls-parity-trace-v1]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-tree-block-irls-parity-trace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      (
        github.ref == 'refs/heads/agent/tree-block-irls-parity-trace-v1' ||
        (
          github.head_ref == 'agent/tree-block-irls-parity-trace-v1' &&
          github.event.pull_request.head.repo.full_name == github.repository
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/tree-block-irls-parity-trace-v1
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply verified reviewed payload
        shell: bash
        env:
          PAYLOAD_SHA256: a5de112f84e39205bd0b815744e1eb74c1c718d8fec95b10839d0acce7b0525f
        run: |
          set -euo pipefail
          encoded="$RUNNER_TEMP/tree-block-irls-parity-trace-v1.b64"
          payload="$RUNNER_TEMP/tree-block-irls-parity-trace-v1.tgz"
          cat .bootstrap/tree-block-irls-parity-trace-v1.part-* > "$encoded"
          test "$(wc -c < "$encoded")" -eq 22400
          printf '%s  %s\n' edcb7a8225b9f39863be290a0c4626566ff7be7cd8143746863aaaab4435581b "$encoded" | sha256sum --check --strict
          base64 -d "$encoded" > "$payload"
          printf '%s  %s\n' "$PAYLOAD_SHA256" "$payload" | sha256sum --check --strict
          test ! -e src/bayesian_phystwin/tree_block_sparse_gauge_parity_trace.py
          test ! -e tests/test_structured_point_covariance_tree_block_sparse_gauge_parity_trace.py
          test ! -e docs/tree_block_sparse_gauge_parity_trace.md
          tar -xzf "$payload"
          rm -f .bootstrap/tree-block-irls-parity-trace-v1.part-*
          rm .github/workflows/apply-tree-block-irls-parity-trace.yml
          python -m compileall -q \
            src/bayesian_phystwin/tree_block_sparse_gauge_belief.py \
            src/bayesian_phystwin/tree_block_sparse_gauge_parity_trace.py \
            tests/test_structured_point_covariance_tree_block_sparse_gauge_parity_trace.py
      - name: Validate traced production boundary
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev,graph]"
          python -m ruff check --fix \
            src/bayesian_phystwin/tree_block_sparse_gauge_belief.py \
            src/bayesian_phystwin/tree_block_sparse_gauge_parity_trace.py \
            tests/test_structured_point_covariance_tree_block_sparse_gauge_parity_trace.py
          python -m ruff format \
            src/bayesian_phystwin/tree_block_sparse_gauge_belief.py \
            src/bayesian_phystwin/tree_block_sparse_gauge_parity_trace.py \
            tests/test_structured_point_covariance_tree_block_sparse_gauge_parity_trace.py
          python -m ruff check \
            src/bayesian_phystwin/tree_block_sparse_gauge_belief.py \
            src/bayesian_phystwin/tree_block_sparse_gauge_parity_trace.py \
            tests/test_structured_point_covariance_tree_block_sparse_gauge_parity_trace.py
          python -m ruff format --check \
            src/bayesian_phystwin/tree_block_sparse_gauge_belief.py \
            src/bayesian_phystwin/tree_block_sparse_gauge_parity_trace.py \
            tests/test_structured_point_covariance_tree_block_sparse_gauge_parity_trace.py
          python -m mypy \
            src/bayesian_phystwin/tree_block_sparse_gauge_belief.py \
            src/bayesian_phystwin/tree_block_sparse_gauge_parity_trace.py
          python -m pytest -q \
            tests/test_structured_point_covariance_tree_block_sparse_gauge_parity_trace.py \
            tests/test_tree_block_sparse_gauge_belief.py \
            tests/test_structured_point_covariance_tree_separator_gaussian_parity.py \
            tests/test_structured_point_covariance_tree_separator_gaussian_parity_validation.py \
            tests/test_structured_point_covariance_tree_separator_gaussian.py \
            tests/test_structured_point_covariance_tree_block_coverage_edges.py \
            tests/test_structured_point_covariance_tree_block_operator.py \
            tests/test_structured_point_covariance_causal4d_tree_block_provider.py \
            tests/test_portable_contracts_tree_block_strict_admission.py
          git diff --check
      - name: Publish implementation and remove bootstrap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add tree-block IRLS parity trace"
          git push origin HEAD:agent/tree-block-irls-parity-trace-v1
