name: Fix released visual-input API v2

on:
  push:
    branches:
      - agent/hash-lock-released-visual-inputs-v2

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/hash-lock-released-visual-inputs-v2
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Repair fixture and format contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_legacy_artifacts.py')
          text = path.read_text(encoding='utf-8')
          old = (
              'def _fake_visual_module(final_path: Path, raw_case: Path):\n'
              '    final_points = np.zeros((3, 2, 3), dtype=float)\n'
              '    final_visible = np.ones((3, 2), dtype=bool)\n\n'
              '    class FakeConfig:\n'
          )
          new = (
              'def _fake_visual_module(final_path: Path, raw_case: Path):\n'
              '    class FakeConfig:\n'
          )
          if text.count(old) != 1:
              raise RuntimeError('unexpected fake visual module preamble')
          text = text.replace(old, new)
          old_fields = (
              '        final_points = final_points\n'
              '        final_visible = final_visible\n'
          )
          new_fields = (
              '        final_points = np.zeros((3, 2, 3), dtype=float)\n'
              '        final_visible = np.ones((3, 2), dtype=bool)\n'
          )
          if text.count(old_fields) != 1:
              raise RuntimeError('unexpected fake mapping fields')
          path.write_text(text.replace(old_fields, new_fields), encoding='utf-8')
          PY
          python -m ruff format \
            src/bayesian_phystwin/causal4d_artifacts_v2.py \
            tests/test_legacy_artifacts.py
          python -m ruff check \
            src/bayesian_phystwin/causal4d_artifacts_v2.py \
            tests/test_legacy_artifacts.py
          python -m mypy --python-version 3.12 \
            src/bayesian_phystwin/causal4d_artifacts_v2.py
          python -m pytest -q tests/test_legacy_artifacts.py
      - name: Publish clean product branch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/agent-fix-released-visual-inputs-v2.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Validate digest-complete released visual inputs"
          git push --force-with-lease origin HEAD:refs/heads/agent/hash-lock-released-visual-inputs-v2
