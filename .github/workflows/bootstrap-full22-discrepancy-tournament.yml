name: Materialize full-22 discrepancy tournament branch

on:
  push:
    branches:
      - agent/full22-discrepancy-tournament-v1
    paths:
      - ".github/workflows/bootstrap-full22-discrepancy-tournament.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-full22-discrepancy-tournament.yml"
      - ".github/bootstrap/**"

permissions:
  contents: write

concurrency:
  group: materialize-full22-discrepancy-tournament
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/full22-discrepancy-tournament-v1
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Verify and materialize reviewed files
        shell: bash
        run: |
          set -euo pipefail
          bundle_b64="${RUNNER_TEMP}/full22-bundle.b64"
          bundle_tgz="${RUNNER_TEMP}/full22-bundle.tgz"
          cat .github/bootstrap/full22.part.* > "${bundle_b64}"
          base64 --decode "${bundle_b64}" > "${bundle_tgz}"
          echo "b0d9a954359b3b8c12c3f6bf75249870e79b64f154098177eb8cd88e7680ecbf  ${bundle_tgz}" \
            | sha256sum --check --strict
          tar -xzf "${bundle_tgz}" -C "${GITHUB_WORKSPACE}"
          cat <<'CHECKSUMS' | sha256sum --check --strict
          d6c40d783eda0e232a3a8dd0b52424949da56a536c89d189c33311b4d62c7801  protocols/full22_discrepancy_candidate_tournament_v1.json
          7c12be583363aab2b514108758cb05978c31a83a801e27c8c60b4b1f4452a08c  scripts/science/run_full22_discrepancy_candidate_tournament_v1.py
          53ee089e18bc41a05ae532b47540029214741f234c10d874c22a0d4053f2a815  tests/test_full22_discrepancy_candidate_tournament_v1.py
          a944f5444e9fa76706cfaa1de6c884ff20967283ebe3e7500739828667635d0f  .github/workflows/full22-discrepancy-candidate-tournament-v1.yml
          e8d4ab1a350ee239025250d7ffb0ea53a899fab0fc21878765b2dac94fd28043  docs/full22_discrepancy_candidate_tournament_v1.md
          CHECKSUMS
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path(
              "protocols/full22_discrepancy_candidate_tournament_v1.json"
          )
          payload = json.loads(path.read_text(encoding="utf-8"))
          digest = hashlib.sha256(
              json.dumps(
                  payload,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              ).encode("utf-8")
          ).hexdigest()
          expected = (
              "22746172fb6d207e80a2ebfeb2a003332317f3895317ff12988275acc75e16bd"
          )
          if digest != expected:
              raise SystemExit(
                  f"protocol digest changed: expected {expected}, received {digest}"
              )
          print(f"locked protocol: {digest}")
          PY
          python -m py_compile \
            scripts/science/run_full22_discrepancy_candidate_tournament_v1.py \
            tests/test_full22_discrepancy_candidate_tournament_v1.py

      - name: Update distribution manifest and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          for entry in \
            "include docs/full22_discrepancy_candidate_tournament_v1.md" \
            "include protocols/full22_discrepancy_candidate_tournament_v1.json" \
            "include scripts/science/run_full22_discrepancy_candidate_tournament_v1.py"
          do
            grep -qxF "${entry}" MANIFEST.in || printf '%s\n' "${entry}" >> MANIFEST.in
          done
          rm -rf .github/bootstrap
          rm .github/workflows/bootstrap-full22-discrepancy-tournament.yml

      - name: Publish one reviewable branch commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          test ! -e .github/bootstrap
          test ! -e .github/workflows/bootstrap-full22-discrepancy-tournament.yml
          git commit -m "Add prediction-first full-22 discrepancy tournament"
          git push origin HEAD:agent/full22-discrepancy-tournament-v1
