name: Temporary patch full-22 portable protocol identity

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temporary-patch-full22-portable-protocol.yml"
      - ".github/scripts/patch_full22_portable_protocol.py"

permissions:
  contents: write

concurrency:
  group: temporary-patch-full22-portable-protocol-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Apply exact source patch
        run: |
          set -euo pipefail
          python .github/scripts/patch_full22_portable_protocol.py
          python -m pip install -e ".[dev]"
          python -m ruff check --fix \
            reproductions/full22_anchor_v1/reproduce.py \
            tests/test_full22_reproduction_capsule.py
          python -m ruff format \
            reproductions/full22_anchor_v1/reproduce.py \
            tests/test_full22_reproduction_capsule.py
          python -m ruff check \
            reproductions/full22_anchor_v1/reproduce.py \
            tests/test_full22_reproduction_capsule.py
          python -m ruff format --check \
            reproductions/full22_anchor_v1/reproduce.py \
            tests/test_full22_reproduction_capsule.py
          python -m pytest -q tests/test_full22_reproduction_capsule.py
          python -m py_compile reproductions/full22_anchor_v1/reproduce.py
          rm \
            .github/scripts/patch_full22_portable_protocol.py \
            .github/workflows/temporary-patch-full22-portable-protocol.yml
          git diff --check
      - name: Publish clean capsule correction
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            .github/scripts/patch_full22_portable_protocol.py \
            .github/workflows/temporary-patch-full22-portable-protocol.yml \
            reproductions/full22_anchor_v1/reproduce.py \
            tests/test_full22_reproduction_capsule.py
          git diff --cached --check
          git commit -m "Normalize full-22 source protocol identity"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
