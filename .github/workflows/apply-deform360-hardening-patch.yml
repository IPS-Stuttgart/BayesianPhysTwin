name: Apply Deform360 hardening patch

on:
  push:
    branches:
      - agent/harden-deform360-provider-lock
    paths:
      - ".github/workflows/apply-deform360-hardening-patch.yml"
      - ".github/patches/bpt-improvements.patch.gz.b64.part*"

permissions:
  contents: write

concurrency:
  group: apply-deform360-hardening-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v7
        with:
          ref: agent/harden-deform360-provider-lock
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patches/bpt-improvements.patch.gz.b64.part{1,2,3,4} \
            | base64 --decode \
            | gzip --decompress \
            > "$RUNNER_TEMP/bayesian-phystwin-all.patch"
          echo "3e8404758c43136bd236cff243ab28dd8deff7abb21b17fc1fd0c5ebef96a329  $RUNNER_TEMP/bayesian-phystwin-all.patch" \
            | sha256sum --check
          git apply --check "$RUNNER_TEMP/bayesian-phystwin-all.patch"

      - name: Apply patch and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          git apply --index "$RUNNER_TEMP/bayesian-phystwin-all.patch"
          rm -f .github/patches/bpt-improvements.patch.gz.b64.part{1,2,3,4}
          rm -f .github/workflows/apply-deform360-hardening-patch.yml
          rmdir .github/patches 2>/dev/null || true
          git add -A
          git diff --cached --check

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff check \
            src/bayesian_phystwin/_canonical_contracts.py \
            src/bayesian_phystwin/deform360_contact_anchor.py \
            src/bayesian_phystwin/deform360_visual_provider_lock.py \
            src/bayesian_phystwin/prob4d_provider_attestation.py \
            scripts/science/build_deform360_hub_selection.py \
            tests/test_deform360_contact_anchor.py \
            tests/test_deform360_visual_provider_lock.py \
            tests/test_deform360_hub_selection.py \
            tests/test_prob4d_causal_lineage.py
          python -m ruff format --check \
            src/bayesian_phystwin/_canonical_contracts.py \
            src/bayesian_phystwin/deform360_contact_anchor.py \
            src/bayesian_phystwin/deform360_visual_provider_lock.py \
            src/bayesian_phystwin/prob4d_provider_attestation.py \
            scripts/science/build_deform360_hub_selection.py \
            tests/test_deform360_contact_anchor.py \
            tests/test_deform360_visual_provider_lock.py \
            tests/test_deform360_hub_selection.py \
            tests/test_prob4d_causal_lineage.py
          python -m pytest -q \
            tests/test_deform360_contact_anchor.py \
            tests/test_deform360_visual_provider_lock.py \
            tests/test_deform360_hub_selection.py \
            tests/test_prob4d_causal_lineage.py

      - name: Commit and push implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Harden Deform360 provider locks"
          git push origin HEAD:agent/harden-deform360-provider-lock
