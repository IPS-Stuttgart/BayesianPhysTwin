name: Agent fix PR 162 immutable arrays

on:
  push:
    branches:
      - agent/group-sandwich-covariance
    paths:
      - .github/workflows/agent-fix-pr162-immutable-arrays.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/group-sandwich-covariance
          fetch-depth: 0
          persist-credentials: true
          clean: true
      - name: Back frozen arrays with immutable bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('src/bayesian_phystwin/group_sandwich_covariance.py')
          text = source.read_text(encoding='utf-8')
          old = '''def _immutable(array: FloatArray) -> FloatArray:
              owned = np.array(array, dtype=np.float64, copy=True, order="C")
              owned.setflags(write=False)
              return owned
          '''
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines()) + '\n'
          new = '''def _immutable(array: FloatArray) -> FloatArray:
              canonical = np.array(array, dtype=np.dtype("<f8"), copy=True, order="C")
              frozen = np.frombuffer(
                  canonical.tobytes(order="C"),
                  dtype=np.dtype("<f8"),
              )
              return frozen.reshape(canonical.shape)
          '''
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines()) + '\n'
          if old not in text:
              raise SystemExit('immutable array helper marker changed')
          source.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/test_group_sandwich_covariance.py')
          text = tests.read_text(encoding='utf-8')
          old = '''def test_arrays_are_immutable() -> None:
              result = _example()
              with pytest.raises(ValueError):
                  result.covariance[0, 0] = 0.0
          '''
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines()) + '\n'
          new = '''def test_arrays_are_immutable() -> None:
              result = _example()
              with pytest.raises(ValueError):
                  result.covariance[0, 0] = 0.0
              with pytest.raises(ValueError):
                  result.covariance.setflags(write=True)
          '''
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines()) + '\n'
          if old not in text:
              raise SystemExit('immutability test marker changed')
          tests.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m pip install -e '.[dev]'
          python -m ruff format src/bayesian_phystwin/group_sandwich_covariance.py tests/test_group_sandwich_covariance.py
          python -m ruff check src/bayesian_phystwin/group_sandwich_covariance.py tests/test_group_sandwich_covariance.py
          python -m mypy src/bayesian_phystwin/group_sandwich_covariance.py
          python -m pytest -q tests/test_group_sandwich_covariance.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bayesian_phystwin/group_sandwich_covariance.py tests/test_group_sandwich_covariance.py
          git commit -m 'Make sandwich covariance arrays immutable'
          git push origin HEAD:agent/group-sandwich-covariance
