name: One-shot Ruff formatter

on:
  push:
    branches:
      - agent/prob4d-material-identity-consumer
    paths:
      - .github/workflows/format-material-identity-one-shot.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/prob4d-material-identity-consumer
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned formatter
        run: python -m pip install "ruff==0.16.1"
      - name: Format changed Python files
        run: |
          python -m ruff format \
            src/bayesian_phystwin/material_identity_marginalization.py \
            tests/test_material_identity_marginalization.py
      - name: Remove one-shot workflow and publish formatting
        shell: bash
        run: |
          rm .github/workflows/format-material-identity-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayesian_phystwin/material_identity_marginalization.py \
            tests/test_material_identity_marginalization.py \
            .github/workflows/format-material-identity-one-shot.yml
          git diff --cached --check
          git commit -m "Format material identity marginalization"
          git push origin HEAD:agent/prob4d-material-identity-consumer
