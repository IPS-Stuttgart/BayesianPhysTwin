name: One-shot observed-information Ruff formatter

on:
  push:
    branches:
      - agent/observed-information-covariance-v1
    paths:
      - ".github/workflows/format-observed-information-once.yml"
      - "src/bayesian_phystwin/observed_information_covariance.py"
      - "tests/test_observed_information_covariance.py"

permissions:
  contents: write

concurrency:
  group: one-shot-observed-information-format-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    name: Apply exact Ruff 0.16.1 output
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.actor == 'FlorianPfaff'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact same-repository branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/observed-information-covariance-v1
          fetch-depth: 0
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Format only the two reviewed files and push one ordinary commit
        shell: bash
        env:
          EXPECTED_EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_EVENT_SHA}"
          python -m pip install "ruff==0.16.1"

          files=(
            src/bayesian_phystwin/observed_information_covariance.py
            tests/test_observed_information_covariance.py
          )
          python -m ruff format "${files[@]}"
          git diff --check

          mapfile -t changed < <(git diff --name-only)
          if (( ${#changed[@]} == 0 )); then
            echo "Exact branch head already has Ruff 0.16.1 output."
            exit 0
          fi
          if (( ${#changed[@]} != 2 )); then
            printf 'Unexpected changed paths:\n%s\n' "${changed[*]}" >&2
            exit 1
          fi
          for path in "${changed[@]}"; do
            case "$path" in
              src/bayesian_phystwin/observed_information_covariance.py|tests/test_observed_information_covariance.py)
                ;;
              *)
                echo "Unexpected formatter output: $path" >&2
                exit 1
                ;;
            esac
          done

          python -m ruff format --check "${files[@]}"
          python -m ruff check "${files[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "Apply Ruff formatting to observed-information covariance"
          git push origin HEAD:refs/heads/agent/observed-information-covariance-v1
