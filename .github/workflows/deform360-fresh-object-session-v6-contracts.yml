name: Deform360 fresh object-session prospective v6 contracts

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deform360-fresh-object-session-v6-contracts.yml"
      - "docs/deform360_fresh_object_session_v6.md"
      - "protocols/locks/deform360_official_hub_fresh_object_session_v6.json"
      - "tests/test_deform360_fresh_object_session_v6_protocol.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/deform360-fresh-object-session-v6-contracts.yml"
      - "docs/deform360_fresh_object_session_v6.md"
      - "protocols/locks/deform360_official_hub_fresh_object_session_v6.json"
      - "tests/test_deform360_fresh_object_session_v6_protocol.py"

permissions:
  contents: read

concurrency:
  group: deform360-fresh-object-session-v6-contracts-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONHASHSEED: 0
  PYTHONUNBUFFERED: 1
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  contracts:
    name: Fresh object-session v6 design / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out exact proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Classify the dormant or complete design surface
        id: design
        shell: bash
        run: |
          set -euo pipefail
          required=(
            docs/deform360_fresh_object_session_v6.md
            protocols/locks/deform360_official_hub_fresh_object_session_v6.json
            tests/test_deform360_fresh_object_session_v6_protocol.py
          )
          present=0
          missing=()
          for path in "${required[@]}"; do
            if [[ -f "${path}" ]]; then
              present=$((present + 1))
            else
              missing+=("${path}")
            fi
          done
          if [[ "${present}" -eq 0 ]]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "The v6 design surface is not on this revision; the contract workflow is dormant." \
              >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          if [[ "${present}" -ne "${#required[@]}" ]]; then
            printf 'partial v6 design surface; missing: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          echo "enabled=true" >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        if: steps.design.outputs.enabled == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate the frozen target-closed v6 design
        if: steps.design.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          files=(
            tests/test_deform360_fresh_object_session_v6_protocol.py
          )
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m pytest -q -p no:cacheprovider \
            tests/test_deform360_fresh_object_session_v6_protocol.py \
            tests/test_pull_request_workflow_integrity.py
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path(
              "protocols/locks/"
              "deform360_official_hub_fresh_object_session_v6.json"
          )
          policy = json.loads(path.read_text(encoding="utf-8"))
          declared = policy.pop("policy_id")
          canonical = json.dumps(
              policy,
              sort_keys=True,
              separators=(",", ":"),
              allow_nan=False,
          ).encode("utf-8")
          observed = hashlib.sha256(canonical).hexdigest()
          if observed != declared:
              raise SystemExit("fresh object-session v6 policy identity changed")
          PY
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"
