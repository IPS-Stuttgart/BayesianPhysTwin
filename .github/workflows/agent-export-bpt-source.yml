name: Agent BPT source export

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  export:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/bootstrap-bpt-quality-repair-20260727'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply candidate and build source snapshot
        run: |
          set -euo pipefail
          python .github/agent_bpt_quality_repair.py
          python .github/agent_bpt_strict_quality_repair.py
          mkdir -p /tmp/bpt-source
          git archive --format=tar HEAD | tar -xf - -C /tmp/bpt-source
          cp -a src tests /tmp/bpt-source/
          rm -f /tmp/bpt-source/.github/agent_bpt_quality_repair.py
          rm -f /tmp/bpt-source/.github/agent_bpt_strict_quality_repair.py
          rm -f /tmp/bpt-source/.github/workflows/agent-bpt-quality-repair.yml
          rm -f /tmp/bpt-source/.github/workflows/agent-export-bpt-source.yml
          tar -C /tmp -czf bpt-source.tar.gz bpt-source

      - name: Upload source snapshot
        uses: actions/upload-artifact@v7
        with:
          name: bpt-source-patched
          path: bpt-source.tar.gz
          if-no-files-found: error
          retention-days: 1
