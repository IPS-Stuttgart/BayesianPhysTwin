name: Publish geometric v4 coverage once

on:
  push:
    branches:
      - agent/materialize-deform360-joint-sparse-geometric-v4
    paths:
      - .github/workflows/_publish-geometric-v4-coverage-once.yml

permissions:
  contents: write

concurrency:
  group: publish-geometric-v4-coverage-once
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.ref == 'refs/heads/agent/materialize-deform360-joint-sparse-geometric-v4'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/materialize-deform360-joint-sparse-geometric-v4
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Publish tested coverage suite
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = \
            "agent/materialize-deform360-joint-sparse-geometric-v4"
          cat > "$RUNNER_TEMP/geometric-test.gz.b64" <<'PAYLOAD'
          
          
          
          
          hDAcUhIxVJnCEJOI49z0XEnQou0Ug/1i7b1NMBz2VaRdQieuJcDgrk8T0TDeIR2tcncG1oX2EbWzlaE+umeevXPzFkAjvzWE1OUICwSkOrR2FT1Jcl5EeqKIZW9k312l6T3tPUVLb8aTzPpR3YSLcDwsm+hGdZ0cnyitAyCr6yhO4EtMLzrpdSz/Deuqjj7hXAAA
          PAYLOAD
          base64 --decode "$RUNNER_TEMP/geometric-test.gz.b64" \
            | gzip --decompress \
            > tests/test_deform360_joint_sparse_geometric_v4_coverage.py
          test "$(sha256sum tests/test_deform360_joint_sparse_geometric_v4_coverage.py | cut -d' ' -f1)" = \
            "39748ea606efe417c2510a9cdfabc76a49b4c32725c3f645050fd419c8e714c7"

          python -m pip install -e ".[dev]"
          python -m ruff format \
            tests/test_deform360_joint_sparse_geometric_v4_coverage.py
          python -m ruff check --fix \
            tests/test_deform360_joint_sparse_geometric_v4_coverage.py
          python -m ruff check \
            tests/test_deform360_joint_sparse_geometric_v4_coverage.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_deform360_joint_sparse_geometric_v4.py \
            tests/test_deform360_joint_sparse_geometric_v4_coverage.py
          coverage erase
          coverage run --branch -m pytest -q -p no:cacheprovider \
            tests/test_deform360_joint_sparse_geometric_v4.py \
            tests/test_deform360_joint_sparse_geometric_v4_coverage.py
          coverage json -o "$RUNNER_TEMP/geometric-coverage.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path(os.environ["RUNNER_TEMP"])
              .joinpath("geometric-coverage.json")
              .read_text(encoding="utf-8")
          )
          modules = [
              path
              for path in report["files"]
              if "src/bayesian_phystwin/deform360_joint_sparse_geometric_" in path
          ]
          if len(modules) != 6:
              raise SystemExit(f"unexpected geometric module roster: {modules}")
          for path in modules:
              summary = report["files"][path]["summary"]
              line_fraction = summary["covered_lines"] / summary["num_statements"]
              branch_fraction = summary["covered_branches"] / summary["num_branches"]
              if line_fraction < 0.90 or branch_fraction < 0.80:
                  raise SystemExit(
                      f"coverage floor failed for {path}: "
                      f"lines={line_fraction:.3f}, branches={branch_fraction:.3f}"
                  )
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_deform360_joint_sparse_geometric_v4_coverage.py
          git commit -m "Cover Deform360 geometric v4 source materialization"
          git push origin HEAD:agent/materialize-deform360-joint-sparse-geometric-v4
