name: Temporary formatter for PR 95

on:
  push:
    branches:
      - agent/prospective-belief-hardening
    paths:
      - .github/workflows/temporary-format-pr95.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/prospective-belief-hardening
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: |
          python -m ruff format \
            tests/test_phystwin_online_belief_v2.py \
            tests/test_causal4d_belief_provider_v2.py \
            tests/test_phystwin_online_belief_v2_stress.py
          python -m ruff check \
            tests/test_phystwin_online_belief_v2.py \
            tests/test_causal4d_belief_provider_v2.py \
            tests/test_phystwin_online_belief_v2_stress.py
          rm .github/workflows/temporary-format-pr95.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/test_phystwin_online_belief_v2.py \
            tests/test_causal4d_belief_provider_v2.py \
            tests/test_phystwin_online_belief_v2_stress.py \
            .github/workflows/temporary-format-pr95.yml
          git commit -m "Format prospective belief regressions"
          git push origin HEAD:agent/prospective-belief-hardening
