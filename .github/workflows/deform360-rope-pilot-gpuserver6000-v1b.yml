# workflow-lifecycle: one-shot
# workflow-owner: IPS-Stuttgart maintainers
name: Deform360 rope pilot gpuserver6000 v2

on:
  push:
    branches:
      - science/deform360-rope-pilot-v1
    paths:
      - .github/workflows/deform360-rope-pilot-gpuserver6000-v1b.yml
      - protocols/deform360_same_object_rope_pilot_v2.json
      - scripts/science/prepare_deform360_same_object_rope_pilot_v2.py
      - triggers/deform360_rope_pilot_gpuserver6000_v1b.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deform360-rope-pilot-gpuserver6000-v2-${{ github.ref }}
  cancel-in-progress: true

env:
  PROTOCOL: protocols/deform360_same_object_rope_pilot_v2.json
  SELECTOR: scripts/science/prepare_deform360_same_object_rope_pilot_v2.py
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  contracts:
    name: Timestamp-clustered rope-pilot contracts v2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Validate amended selector and protocol
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python3 -m py_compile "${SELECTOR}"
          python3 "${SELECTOR}" --self-test
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(
              Path(os.environ["PROTOCOL"]).read_text(encoding="utf-8")
          )
          assert value["schema_version"] == 2
          assert value["runner_id"] == "gpuserver6000"
          assert value["object_ids"] == [
              "001-rope",
              "002-rope-silk",
              "003-cable",
              "081-stripe-rope",
          ]
          eligibility = value["eligibility"]
          assert eligibility["maximum_interstream_capture_gap"] == 250000
          assert eligibility["minimum_camera_pairs_per_episode"] == 12
          assert eligibility["minimum_tactile_pairs_per_episode"] == 2
          amendment = value["amendment"]
          assert amendment["based_on_run_id"] == 33325025964
          assert amendment["target_outcomes_used"] is False
          assert value["information_boundary"]["target_future_opened"] is False
          PY
          test -z "$(git status --porcelain --untracked-files=all)"

  prepare:
    name: Timestamp-clustered source-target roster / gpuserver6000
    needs: contracts
    runs-on: [self-hosted, gpuserver6000]
    timeout-minutes: 30
    steps:
      - name: Admit actual assigned runner before checkout
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_NAME} os=${RUNNER_OS} arch=${RUNNER_ARCH}"
          test "${RUNNER_OS}" = "Linux"
          test "${RUNNER_ARCH}" = "X64"

      - name: Check out exact candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Resolve dependency-free Python
        shell: bash
        run: |
          set -euo pipefail
          base_python=""
          for candidate in \
            /usr/bin/python3.12 \
            /usr/local/bin/python3.12 \
            /usr/bin/python3 \
            /usr/local/bin/python3
          do
            if [[ -x "${candidate}" ]]; then
              base_python="${candidate}"
              break
            fi
          done
          if [[ -z "${base_python}" ]]; then
            base_python="$(command -v python3 || true)"
          fi
          test -n "${base_python}"
          echo "BASE_PYTHON=${base_python}" >> "${GITHUB_ENV}"

      - name: Build timestamp-clustered target-blind roster
        id: roster
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          "${BASE_PYTHON}" -m py_compile "${SELECTOR}"
          "${BASE_PYTHON}" "${SELECTOR}" --self-test

          output_root="${RUNNER_TEMP}/deform360-rope-pilot-v2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "${output_root}"
          mkdir -p -- "${output_root}"
          export OUTPUT_ROOT="${output_root}"
          echo "OUTPUT_ROOT=${output_root}" >> "${GITHUB_ENV}"

          {
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "revision=${GITHUB_SHA}"
            echo "source_inventory_run_id=33325025964"
            "${BASE_PYTHON}" --version
            uname -a
            if command -v nvidia-smi >/dev/null 2>&1; then
              nvidia-smi \
                --query-gpu=name,uuid,driver_version,memory.total \
                --format=csv,noheader
            fi
          } | tee "${OUTPUT_ROOT}/environment.txt"

          "${BASE_PYTHON}" "${SELECTOR}" \
            --protocol "${PROTOCOL}" \
            --revision "${GITHUB_SHA}" \
            --output "${OUTPUT_ROOT}" \
            | tee "${OUTPUT_ROOT}/preparation.log"

          "${BASE_PYTHON}" - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["OUTPUT_ROOT"])
          result = json.loads(
              (root / "result.json").read_text(encoding="utf-8")
          )
          summary = result["summary"]
          with Path(os.environ["GITHUB_OUTPUT"]).open(
              "a",
              encoding="utf-8",
          ) as stream:
              for key, value in (
                  ("decision", summary["decision"]),
                  ("accessible", summary["accessible_object_count"]),
                  ("episodes", summary["episode_count"]),
                  ("visual", summary["visual_pairable_object_count"]),
                  (
                      "visuotactile",
                      summary["visuotactile_pairable_object_count"],
                  ),
                  (
                      "different_action",
                      summary["different_action_selected_pair_count"],
                  ),
                  (
                      "action_sequences",
                      summary["action_sequence_resolved_object_count"],
                  ),
                  ("result_id", result["result_id"]),
              ):
                  stream.write(f"{key}={value}\n")
          PY

      - name: Publish result summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "### Deform360 timestamp-clustered rope/cable roster v2" \
            >> "${GITHUB_STEP_SUMMARY}"
          echo >> "${GITHUB_STEP_SUMMARY}"
          if [[ -f "${OUTPUT_ROOT:-}/report.md" ]]; then
            cat "${OUTPUT_ROOT}/report.md" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "No target-blind result was produced." \
              >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload target-blind roster
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d360-rope-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_ROOT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Enforce four-object visuotactile readiness
        shell: bash
        env:
          ACCESSIBLE: ${{ steps.roster.outputs.accessible }}
          EPISODES: ${{ steps.roster.outputs.episodes }}
          VISUAL: ${{ steps.roster.outputs.visual }}
          VISUOTACTILE: ${{ steps.roster.outputs.visuotactile }}
        run: |
          set -euo pipefail
          test "${ACCESSIBLE}" -ge 4
          test "${EPISODES}" -ge 8
          test "${VISUAL}" -ge 4
          test "${VISUOTACTILE}" -ge 4
