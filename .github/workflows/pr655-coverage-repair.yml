name: PR 655 coverage repair

on:
  push:
    branches:
      - feature/newton-mpm-backend-v1

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/newton-mpm-backend-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Register and cover Newton backend validation branches
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          manifest = Path(".github/quality/test-suites.json")
          manifest_text = manifest.read_text(encoding="utf-8")
          old_manifest = (
              '      "tests/test_matphys_backend_v1.py",\n'
              '      "tests/test_phystwin_alltracker_cues.py",'
          )
          new_manifest = (
              '      "tests/test_matphys_backend_v1.py",\n'
              '      "tests/test_newton_mpm_backend_v1.py",\n'
              '      "tests/test_phystwin_alltracker_cues.py",'
          )
          if manifest_text.count(old_manifest) != 1:
              raise RuntimeError("stable-core Newton insertion point changed")
          manifest.write_text(
              manifest_text.replace(old_manifest, new_manifest, 1),
              encoding="utf-8",
          )

          tests = Path("tests/test_newton_mpm_backend_v1.py")
          test_text = tests.read_text(encoding="utf-8")
          old_import = (
              "    materialize_newton_mpm_backend,\n"
              "    validate_newton_mpm_backend,\n"
              ")"
          )
          new_import = (
              "    materialize_newton_mpm_backend,\n"
              "    validate_newton_mpm_backend,\n"
              "    validate_newton_mpm_runtime_manifest,\n"
              ")"
          )
          if test_text.count(old_import) != 1:
              raise RuntimeError("Newton runtime validator import point changed")
          if "def test_runtime_manifest_validation_edge_branches" in test_text:
              raise RuntimeError("coverage tests already present")
          test_text = test_text.replace(old_import, new_import, 1)
          addition = r'''
          def test_runtime_manifest_validation_edge_branches(tmp_path: Path) -> None:
              raw_path = _raw_archive(tmp_path / "raw.npz")
              runtime_path = _runtime_manifest(tmp_path / "runtime.json", raw_path)
              runtime = json.loads(runtime_path.read_text(encoding="utf-8"))

              # Direct validation without a raw path exercises the optional custody branch.
              assert validate_newton_mpm_runtime_manifest(runtime)["runtime_id"] == runtime[
                  "runtime_id"
              ]

              for key, replacement, message in (
                  ("frame_count", 0, "frame_count must be a positive integer"),
                  (
                      "time_step_s",
                      True,
                      "time_step_s must be a finite positive number",
                  ),
                  (
                      "time_step_s",
                      float("inf"),
                      "time_step_s must be a finite positive number",
                  ),
                  ("simulation", None, "simulation must be a JSON object"),
                  (
                      "information_boundary",
                      None,
                      "information_boundary must be a JSON object",
                  ),
              ):
                  payload = json.loads(json.dumps(runtime))
                  payload[key] = replacement
                  with pytest.raises(ValueError, match=message):
                      validate_newton_mpm_runtime_manifest(payload)

              for replacement in (
                  [0.3, 0.05],
                  [0.3, True, 0.05],
                  [0.3, float("nan"), 0.05],
              ):
                  payload = json.loads(json.dumps(runtime))
                  payload["simulation"]["beam_extents_m"] = replacement
                  with pytest.raises(
                      ValueError,
                      match="beam_extents_m must contain three finite numbers",
                  ):
                      validate_newton_mpm_runtime_manifest(payload)


          def test_bundle_rejects_non_object_nested_records(tmp_path: Path) -> None:
              raw_path = _raw_archive(tmp_path / "raw.npz")
              runtime_path = _runtime_manifest(tmp_path / "runtime.json", raw_path)

              for case, message in (
                  ("inputs", "inputs must be a JSON object"),
                  ("raw_rollout", "raw_rollout must be a JSON object"),
                  ("mapping", "mapping must be a JSON object"),
              ):
                  output = tmp_path / case
                  materialize_newton_mpm_backend(
                      raw_rollout_path=raw_path,
                      runtime_manifest_path=runtime_path,
                      output_dir=output,
                  )
                  artifact_path = output / ARTIFACT_FILENAME
                  artifact = json.loads(artifact_path.read_text(encoding="utf-8"))
                  if case == "inputs":
                      artifact["inputs"] = None
                  elif case == "raw_rollout":
                      artifact["inputs"]["raw_rollout"] = None
                  else:
                      artifact["mapping"] = None
                  artifact_path.write_text(json.dumps(artifact), encoding="utf-8")
                  with pytest.raises(ValueError, match=message):
                      validate_newton_mpm_backend(output)


          def test_physical_archive_frame_count_and_missing_file_branches(
              tmp_path: Path,
          ) -> None:
              raw_path = _raw_archive(tmp_path / "raw.npz")
              runtime_path = _runtime_manifest(tmp_path / "runtime.json", raw_path)
              output = tmp_path / "output"
              materialize_newton_mpm_backend(
                  raw_rollout_path=raw_path,
                  runtime_manifest_path=runtime_path,
                  output_dir=output,
              )
              physical_path = output / PHYSICAL_ARCHIVE_FILENAME
              physical = load_physical_rollout_archive(
                  physical_path,
                  expected_frame_count=76,
              )
              assert physical["prediction_m"].shape[0] == 76

              with pytest.raises(ValueError, match="must be an ordinary file"):
                  load_physical_rollout_archive(tmp_path / "missing.npz")
          '''
          tests.write_text(
              test_text.rstrip() + "\n\n\n" + addition.strip() + "\n",
              encoding="utf-8",
          )
          PY

          python -m pip install --disable-pip-version-check -e ".[dev,graph]"
          python -m pip install --disable-pip-version-check "coverage==7.13.3"
          python -m ruff format tests/test_newton_mpm_backend_v1.py
          python -m ruff check tests/test_newton_mpm_backend_v1.py
          python tools/quality/test_suite_manifest.py validate
          python -m pytest -q tests/test_newton_mpm_backend_v1.py

          python -m coverage erase
          python -m coverage run --branch --source=bayesian_phystwin \
            -m pytest -q tests/test_newton_mpm_backend_v1.py
          python -m coverage json -o newton-coverage.json
          python - <<'PY'
          import json

          payload = json.loads(open("newton-coverage.json", encoding="utf-8").read())
          for path in (
              "src/bayesian_phystwin/newton_mpm_backend_v1.py",
              "src/bayesian_phystwin/physical_rollout_v1.py",
          ):
              summary = payload["files"][path]["summary"]
              total = summary["num_branches"]
              covered = summary["covered_branches"]
              percentage = 100.0 if total == 0 else 100.0 * covered / total
              print(f"{path}: branch coverage {percentage:.2f}%")
              if percentage < 80.0:
                  raise SystemExit(f"{path} branch coverage remains below 80%")
          PY

          git rm .github/workflows/pr655-coverage-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/quality/test-suites.json tests/test_newton_mpm_backend_v1.py
          git commit -m "Cover Newton backend validation branches"
          git push origin HEAD:feature/newton-mpm-backend-v1
