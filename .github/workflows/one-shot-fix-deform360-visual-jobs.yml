name: One-shot fix Deform360 calibration visual jobs

on:
  push:
    branches:
      - agent/deform360-calibration-visual-jobs-v1
    paths:
      - ".github/workflows/one-shot-fix-deform360-visual-jobs.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-fix-deform360-calibration-visual-jobs
  cancel-in-progress: false

jobs:
  fix:
    name: Format and validate exact visual-job head
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Validate exact trigger boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "766bc41f613bf7523a0d8d6192715694b7391330"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/one-shot-fix-deform360-visual-jobs.yml"
          test -z "$(git status --porcelain=v1)"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install exact validation environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1" \
            "build==1.3.0"
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Apply deterministic lint repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          product = Path(
              "src/bayesian_phystwin/deform360_calibration_visual_jobs.py"
          )
          text = product.read_text(encoding="utf-8")
          anchor = "    genuine_boolean,\n"
          if text.count(anchor) != 1:
              raise SystemExit("unused-import anchor changed")
          product.write_text(text.replace(anchor, ""), encoding="utf-8")

          tests = Path("tests/test_deform360_calibration_visual_jobs.py")
          text = tests.read_text(encoding="utf-8")
          anchor = '.encode("utf-8")'
          if text.count(anchor) != 1:
              raise SystemExit("redundant-encoding anchor changed")
          tests.write_text(text.replace(anchor, ".encode()"), encoding="utf-8")
          PY
          python -m ruff format \
            scripts/science/build_deform360_calibration_visual_jobs.py \
            src/bayesian_phystwin/deform360_calibration_visual_jobs.py \
            tests/conftest.py \
            tests/test_deform360_calibration_visual_jobs.py

      - name: Validate focused source and contracts
        shell: bash
        run: |
          set -euo pipefail
          files=(
            scripts/science/build_deform360_calibration_visual_jobs.py
            src/bayesian_phystwin/deform360_calibration_visual_jobs.py
            tests/conftest.py
            tests/test_deform360_calibration_visual_jobs.py
          )
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy \
            scripts/science/build_deform360_calibration_visual_jobs.py \
            src/bayesian_phystwin/deform360_calibration_visual_jobs.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_deform360_calibration_visual_jobs.py \
            tests/test_deform360_calibration_observability_batch.py \
            tests/test_deform360_calibration_source_run_record.py \
            tests/test_deform360_visual_provider_lock.py \
            tests/test_deform360_bias_aware_prospective_staging.py
          python -m py_compile "${files[@]}"

      - name: Remove one-shot transport, commit, and push
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-fix-deform360-visual-jobs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Repair Deform360 calibration visual-job contracts"
          git push origin HEAD:agent/deform360-calibration-visual-jobs-v1
