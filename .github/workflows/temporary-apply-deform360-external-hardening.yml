name: Temporary apply Deform360 external hardening

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temporary-apply-deform360-external-hardening.yml"

permissions:
  contents: write

concurrency:
  group: temporary-deform360-hardening-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    name: Apply reviewed hardening patch
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/deform360-normalized-evidence-external-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Decode the content-addressed hardening patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/scripts
          cat > "${{ RUNNER_TEMP }}/patch.b64" <<'PAYLOAD'

PAYLOAD
          base64 --decode "${{ RUNNER_TEMP }}/patch.b64" | gzip --decompress > .github/scripts/patch_deform360_external_v1.py
          python -m py_compile .github/scripts/patch_deform360_external_v1.py
          sha256sum .github/scripts/patch_deform360_external_v1.py

      - name: Install the focused validation environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,graph]"
          python -m pip check

      - name: Apply and validate the hardening patch
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/patch_deform360_external_v1.py
          python -m pytest -q tests/test_deform360_normalized_evidence_external.py tests/test_endpoint_model_average.py
          git diff --check

      - name: Publish ordinary reviewable source only
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/patch_deform360_external_v1.py
          git rm .github/workflows/temporary-apply-deform360-external-hardening.yml
          git add .github/workflows/deform360-normalized-evidence-external.yml docs/deform360_normalized_evidence_external_v1.md protocols/deform360_normalized_evidence_external_v1.json scripts/science/run_deform360_normalized_evidence_external.py tests/test_deform360_normalized_evidence_external.py
          git diff --cached --check
          test -z "$(git status --porcelain=v1 --untracked-files=all | grep patch_deform360_external_v1.py || true)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Harden leak-safe Deform360 cohort boundary"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
