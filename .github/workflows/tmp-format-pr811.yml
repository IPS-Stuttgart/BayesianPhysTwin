name: Temporary PR 811 formatter

on:
  push:
    branches:
      - science/deform360-gpuserver4090-real-v1
    paths:
      - .github/workflows/tmp-format-pr811.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          check-latest: false

      - name: Format focused sources
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ruff==0.16.5
          python -m ruff format \
            experiments/deform360_real_v1 \
            tests/test_deform360_real_v1.py
          git diff --check

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/deform360_real_v1 tests/test_deform360_real_v1.py
          git commit -m "Format Deform360 evaluator"
          git push origin "HEAD:${GITHUB_REF}"
