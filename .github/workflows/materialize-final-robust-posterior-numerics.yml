name: Materialize final robust posterior numerics

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: materialize-final-robust-posterior-numerics
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.head_ref == 'agent/stage-final-robust-posterior-numerics'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply the reviewed patch and remove staging files
        shell: bash
        env:
          EXPECTED_BASE: 9dcf5e276c00d08a48c4b582f76fba699f474a84
          EXPECTED_PATCH_SHA256: f802ff54a1d98f111dcc6d109174323fd3b128fee786228c40fb89a23827a73a
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${EXPECTED_BASE}"

          base64 --decode \
            .github/staging/final-robust-posterior-numerics.patch.gz.b64 \
            | gzip -dc > /tmp/final-robust-posterior-numerics.patch
          echo "${EXPECTED_PATCH_SHA256}  /tmp/final-robust-posterior-numerics.patch" \
            | sha256sum --check --strict

          git apply --check /tmp/final-robust-posterior-numerics.patch
          git apply /tmp/final-robust-posterior-numerics.patch
          rm -f \
            .github/workflows/materialize-final-robust-posterior-numerics.yml \
            .github/staging/final-robust-posterior-numerics.patch.gz.b64
          rmdir .github/staging 2>/dev/null || true

          git diff --check
          python -m compileall -q \
            src/bayesian_phystwin/_gauge_aware_solver.py \
            src/bayesian_phystwin/bias_aware_belief.py \
            tests/test_gauge_aware_belief.py \
            tests/test_prior_aware_and_linearization.py

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fail closed on final robust posterior numerics"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
