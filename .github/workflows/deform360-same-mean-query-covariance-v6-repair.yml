# workflow-lifecycle: temporary scientific execution
# workflow-owner: IPS-Stuttgart maintainers
name: Repair and launch Deform360 same-mean query covariance v6

on:
  push:
    branches:
      - science/deform360-same-mean-query-covariance-v6
    paths:
      - .github/requests/deform360-same-mean-query-covariance-v6-repair-v2.json

permissions:
  contents: write

concurrency:
  group: deform360-same-mean-query-covariance-v6-repair
  cancel-in-progress: false

jobs:
  repair-and-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact repair request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Authorize one add-only repair request
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.forced }}" = false
          test "${{ github.event.before }}" != 0000000000000000000000000000000000000000
          mapfile -t changed < <(git diff --name-status "${{ github.event.before }}" "$GITHUB_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = $'A\t.github/requests/deform360-same-mean-query-covariance-v6-repair-v2.json'
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          request = json.loads(
              Path(
                  ".github/requests/deform360-same-mean-query-covariance-v6-repair-v2.json"
              ).read_text()
          )
          parent = subprocess.check_output(
              ["git", "rev-parse", "HEAD^"], text=True
          ).strip()
          expected = {
              "schema": "deform360-same-mean-query-covariance-repair-v2",
              "target_branch": "science/deform360-same-mean-query-covariance-v6",
              "failed_run_id": 33497676295,
              "repair": "ruff-fix-imports-and-launch",
              "expected_source_revision": parent,
          }
          if request != expected:
              raise SystemExit("repair request differs from its frozen parent-bound schema")
          PY

      - name: Apply exact Ruff import repair and validate
        shell: bash
        run: |
          set -euo pipefail
          script=scripts/science/run_deform360_same_mean_query_covariance_v6.py
          python -m pip install numpy==1.26.4 ruff==0.14.14
          python -m ruff check --fix "$script"
          python -m ruff check "$script"
          python -m ruff format --check "$script"
          python "$script" --self-test
          python - <<'PY'
          from pathlib import Path

          text = Path(
              "scripts/science/run_deform360_same_mean_query_covariance_v6.py"
          ).read_text()
          if "from typing import Any, Iterable, Sequence" in text:
              raise SystemExit("deprecated typing import remains")
          if "from collections.abc import Iterable, Sequence" not in text:
              raise SystemExit("collections.abc repair is absent")
          if "from typing import Any" not in text:
              raise SystemExit("Any import was not preserved")
          PY

      - name: Commit repair and retire this launcher
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/deform360-same-mean-query-covariance-v6-repair.yml \
            .github/requests/deform360-same-mean-query-covariance-v6-repair.json \
            .github/requests/deform360-same-mean-query-covariance-v6-repair-v2.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/science/run_deform360_same_mean_query_covariance_v6.py \
            .github/workflows/deform360-same-mean-query-covariance-v6-repair.yml \
            .github/requests/deform360-same-mean-query-covariance-v6-repair.json \
            .github/requests/deform360-same-mean-query-covariance-v6-repair-v2.json
          git commit -m "Fix same-mean covariance contract gate"
          git push origin HEAD:science/deform360-same-mean-query-covariance-v6
          echo "source_revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Add source-bound experiment request
        shell: bash
        env:
          SOURCE_REVISION: ${{ steps.repair.outputs.source_revision }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REVISION"
          test ! -e .github/requests/deform360-same-mean-query-covariance-v6.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          request = {
              "schema": "deform360-same-mean-query-covariance-request-v6",
              "mode": "audit-and-evaluate-if-ready",
              "runner_label": "gpuserver4090",
              "prior_confirmation_run_id": 33335779766,
              "prior_confirmation_artifact_id": 9738998271,
              "mean_method_revision": "25ba91c021124569c4dcf84c66eda5ec088868e0",
              "fold_count": 5,
              "maximum_queries": 12,
              "same_mean_required": True,
              "marginal_preserving_dependence_controls_required": True,
              "paper_claim_authorized": False,
              "expected_source_revision": os.environ["SOURCE_REVISION"],
          }
          Path(
              ".github/requests/deform360-same-mean-query-covariance-v6.json"
          ).write_text(json.dumps(request, indent=2) + "\n")
          PY
          git add .github/requests/deform360-same-mean-query-covariance-v6.json
          git commit -m "Launch corrected same-mean Deform360 query covariance audit"
          git push origin HEAD:science/deform360-same-mean-query-covariance-v6
