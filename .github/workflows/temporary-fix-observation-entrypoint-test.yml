name: Temporary observation entrypoint test correction

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temporary-fix-observation-entrypoint-test.yml

permissions:
  contents: write

concurrency:
  group: temporary-observation-entrypoint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  correct-test:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/observation-contract-conformance'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          clean: true

      - name: Verify exact reviewed head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"

      - name: Seal module argv and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_observation_contract_bundle.py')
          text = path.read_text(encoding='utf-8')
          import_old = 'import runpy\n'
          import_new = 'import runpy\nimport sys\n'
          function_old = 'def test_module_entrypoint_reports_manifest(capsys) -> None:\n    with pytest.raises(SystemExit) as raised:\n'
          function_new = 'def test_module_entrypoint_reports_manifest(\n    capsys,\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    monkeypatch.setattr(sys, "argv", ["observation-contract-bundle"])\n    with pytest.raises(SystemExit) as raised:\n'
          for old, new in ((import_old, import_new), (function_old, function_new)):
              if text.count(old) != 1:
                  raise SystemExit(f'expected test target was not present exactly once: {old!r}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/temporary-fix-observation-entrypoint-test.yml').unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_observation_contract_bundle.py \
            .github/workflows/temporary-fix-observation-entrypoint-test.yml
          git diff --cached --check
          git commit -m 'Seal observation-contract module entrypoint arguments'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
