name: Temporary observation entrypoint test correction

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temporary-fix-observation-entrypoint-test.yml

permissions:
  contents: write

concurrency:
  group: temporary-observation-entrypoint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  correct-test:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/observation-contract-conformance'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          clean: true

      - name: Verify exact reviewed head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"

      - name: Seal module argv and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_observation_contract_bundle.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'import runpy\n': 'import runpy\nimport sys\n',
              '''def test_module_entrypoint_reports_manifest(capsys) -> None:
                  with pytest.raises(SystemExit) as raised:
              ''': '''def test_module_entrypoint_reports_manifest(
                  capsys,
                  monkeypatch: pytest.MonkeyPatch,
              ) -> None:
                  monkeypatch.setattr(sys, "argv", ["observation-contract-bundle"])
                  with pytest.raises(SystemExit) as raised:
              ''',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected test target was not present exactly once: {old!r}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/temporary-fix-observation-entrypoint-test.yml').unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_observation_contract_bundle.py \
            .github/workflows/temporary-fix-observation-entrypoint-test.yml
          git diff --cached --check
          git commit -m 'Seal observation-contract module entrypoint arguments'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
