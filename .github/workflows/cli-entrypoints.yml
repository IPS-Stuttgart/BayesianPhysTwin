name: One-shot Deform360 source staging

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cli-entrypoints.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-deform360-source-staging
  cancel-in-progress: false

jobs:
  stage:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the experiment branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/deform360-group-tempered-experiment
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Reconstruct and verify the exact source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import json
          import zlib
          from pathlib import Path

          expected_parts = {
              "tools/deform360_group_tempered_payload_00.txt": "b3333c8a42f6287347f2eb1c7a15d151385bac25e6572635f830c975ac2317a9",
              "tools/deform360_group_tempered_payload_01.txt": "0e2093cc1f4d60fa67e28a16afa1c70c2133b677fbd40f14e40b98486dd38f78",
          }
          encoded = []
          for name, expected in expected_parts.items():
              path = Path(name)
              raw = path.read_bytes()
              actual = hashlib.sha256(raw).hexdigest()
              if actual != expected:
                  raise SystemExit(
                      f"payload digest mismatch for {name}: {actual} != {expected}"
                  )
              encoded.append(raw.decode("ascii").strip())
          source = zlib.decompress(base64.b85decode("".join(encoded)))
          source_sha = hashlib.sha256(source).hexdigest()
          expected_source = "09fe0236978114b910a529c54cf98a2e112d2ec3384094fb46976091f003ee9f"
          if source_sha != expected_source:
              raise SystemExit(
                  f"source digest mismatch: {source_sha} != {expected_source}"
              )
          destination = Path(
              "scripts/science/run_deform360_group_tempered_experiment.py"
          )
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_bytes(source)

          protocol = json.loads(
              Path(
                  "protocols/deform360_group_tempered_experiment_v1.json"
              ).read_text(encoding="utf-8")
          )
          protocol_sha = hashlib.sha256(
              json.dumps(
                  protocol,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              ).encode("utf-8")
          ).hexdigest()
          expected_protocol = (
              "666146d54e67b9e61eda91d3585fd925e2a47638546b17eddf27f1f8465b39aa"
          )
          if protocol_sha != expected_protocol:
              raise SystemExit(
                  f"protocol digest mismatch: {protocol_sha} != {expected_protocol}"
              )
          print(f"reconstructed {destination}: {source_sha}")
          print(f"locked protocol: {protocol_sha}")
          PY

      - name: Install and validate the candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,graph]"
          python -m pip check
          python -m ruff format \
            scripts/science/run_deform360_group_tempered_experiment.py \
            tests/test_deform360_group_tempered_experiment.py
          python -m ruff check \
            scripts/science/run_deform360_group_tempered_experiment.py \
            tests/test_deform360_group_tempered_experiment.py
          python -m ruff format --check \
            scripts/science/run_deform360_group_tempered_experiment.py \
            tests/test_deform360_group_tempered_experiment.py
          python -m pytest -q \
            tests/test_deform360_public_evaluation.py \
            tests/test_deform360_group_tempered_experiment.py
          python -m py_compile \
            scripts/science/run_deform360_group_tempered_experiment.py
          git diff --check

      - name: Publish only the clean product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            tools/deform360_group_tempered_payload_00.txt \
            tools/deform360_group_tempered_payload_01.txt
          git add \
            scripts/science/run_deform360_group_tempered_experiment.py \
            tests/test_deform360_group_tempered_experiment.py
          git diff --cached --check
          git commit -m "Implement object-held-out Deform360 experiment"
          git push origin HEAD:agent/deform360-group-tempered-experiment
