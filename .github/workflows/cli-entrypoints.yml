name: CLI entrypoint contract

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "README.md"
      - "docs/command_line.md"
      - "docs/experiment_index.md"
      - "src/bayesian_phystwin/cli/_command_catalog.py"
      - "src/bayesian_phystwin/cli/_command_dispatch.py"
      - "src/bayesian_phystwin/cli/command_registry.py"
      - "src/bayesian_phystwin/cli/main.py"
      - "tests/test_cli_main.py"
      - "tests/test_command_registry.py"
      - ".github/workflows/cli-entrypoints.yml"
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "README.md"
      - "docs/command_line.md"
      - "docs/experiment_index.md"
      - "src/bayesian_phystwin/cli/_command_catalog.py"
      - "src/bayesian_phystwin/cli/_command_dispatch.py"
      - "src/bayesian_phystwin/cli/command_registry.py"
      - "src/bayesian_phystwin/cli/main.py"
      - "tests/test_cli_main.py"
      - "tests/test_command_registry.py"
      - ".github/workflows/cli-entrypoints.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-entrypoints-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  contract:
    name: CLI contract / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Run focused command tests
        run: >-
          python -m pytest -q
          tests/test_cli_main.py
          tests/test_command_registry.py
      - name: Lint the command surface
        if: matrix.python-version == '3.12'
        run: >-
          python -m ruff check
          src/bayesian_phystwin/cli/_command_catalog.py
          src/bayesian_phystwin/cli/_command_dispatch.py
          src/bayesian_phystwin/cli/_command_inventory.py
          src/bayesian_phystwin/cli/command_registry.py
          src/bayesian_phystwin/cli/experiments.py
          src/bayesian_phystwin/cli/main.py
          tests/test_cli_main.py
          tests/test_command_registry.py
      - name: Type-check the command surface
        if: matrix.python-version == '3.12'
        run: >-
          python -m mypy
          src/bayesian_phystwin/cli/_command_catalog.py
          src/bayesian_phystwin/cli/_command_dispatch.py
          src/bayesian_phystwin/cli/_command_inventory.py
          src/bayesian_phystwin/cli/command_registry.py
          src/bayesian_phystwin/cli/experiments.py
          src/bayesian_phystwin/cli/main.py

  installed-artifacts:
    name: Installed ${{ matrix.kind }} command surface
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        kind: [wheel, sdist]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Install one distribution in isolation
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/bpt-cli-smoke"
          python_bin="$RUNNER_TEMP/bpt-cli-smoke/bin/python"
          "$python_bin" -m pip install --upgrade pip
          if [[ "${{ matrix.kind }}" == "wheel" ]]; then
            artifact=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          else
            artifact=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          fi
          test -n "$artifact"
          "$python_bin" -m pip install "$artifact"
          "$python_bin" -m pip check
      - name: Exercise the installed registry
        shell: bash
        run: |
          bin="$RUNNER_TEMP/bpt-cli-smoke/bin"
          "$bin/bpt" --help
          "$bin/bpt" provider manifest --help
          "$bin/bpt" observation validate --help
          "$bin/bpt" evidence summarize --help
          "$bin/bpt" run manifest --help
          "$bin/bpt" commands list --status stable --json
          "$bin/bpt" commands describe bpt-phystwin-refit --json
          "$bin/bpt" commands migrate bpt-phystwin-refit
          "$bin/bpt" experiment list >/dev/null
          "$bin/bpt" diagnostic describe audit-phystwin-calibration
          "$bin/bpt" archive describe evaluate-phystwin-state-injection
          if "$bin/bpt" experiment run bpt-phystwin-refit >/dev/null 2>&1; then
            echo "removed executable name is still accepted as a runner alias" >&2
            exit 1
          fi
          if compgen -G "$bin/bpt-*" >/dev/null; then
            echo "legacy bpt-* executables were installed" >&2
            find "$bin" -maxdepth 1 -type f -name 'bpt-*' -print >&2
            exit 1
          fi
          "$bin/python" - <<'PY'
          from importlib.metadata import distribution

          scripts = {
              entry.name: entry.value
              for entry in distribution("bayesian-phystwin").entry_points
              if entry.group == "console_scripts"
          }
          expected = {"bpt": "bayesian_phystwin.cli.main:main"}
          if scripts != expected:
              raise SystemExit(f"unexpected console scripts: {scripts}")
          PY
