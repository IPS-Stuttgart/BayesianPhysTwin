name: Temporary redundant domain overlap removal

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/domain-harm-risk-redundant-check-removal.yml
      - src/bayesian_phystwin/guard_harm_risk_domains.py
      - tests/test_guard_harm_risk_domains.py

permissions:
  contents: write
  pull-requests: read

jobs:
  repair-and-remove:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Remove logically implied check and obsolete test construction
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          module = Path("src/bayesian_phystwin/guard_harm_risk_domains.py")
          text = module.read_text(encoding="utf-8")
          block = '''        threshold_overlap = threshold_selection_groups & certification_groups
                  if threshold_overlap:
                      raise ValueError(
                          "threshold-selection and certification groups must be globally "
                          f"disjoint: {sorted(threshold_overlap)}"
                      )
          '''
          if text.count(block) != 1:
              raise SystemExit("redundant module block was not found exactly once")
          module.write_text(text.replace(block, ""), encoding="utf-8")

          tests = Path("tests/test_guard_harm_risk_domains.py")
          text = tests.read_text(encoding="utf-8")
          text = text.replace(
              "def test_composite_rejects_cross_domain_duplicate_and_threshold_leakage() -> None:",
              "def test_composite_rejects_cross_domain_duplicate() -> None:",
              1,
          )
          block = '''
              certificates = dict(certificate.domain_certificates)
              leak = certificates["oscillatory"].group_ids[0]
              for domain in certificate.supported_domains:
                  certificates[domain] = _recertify(
                      certificate.domain_guard_certificate,
                      domain,
                      certificates[domain],
                      threshold_selection_group_ids=(leak,),
                  )
              with pytest.raises(ValueError, match="globally disjoint"):
                  DomainGuardHarmRiskCertificateV1(
                      domain_guard_certificate=certificate.domain_guard_certificate,
                      domain_certificates=certificates,
                      family_confidence_level=0.95,
                  )
          '''
          if text.count(block) != 1:
              raise SystemExit("obsolete threshold-leak test block was not found exactly once")
          tests.write_text(text.replace(block, "\n"), encoding="utf-8")
          PY
          python -m pip install "ruff==0.16.2"
          python -m ruff format \
            src/bayesian_phystwin/guard_harm_risk_domains.py \
            tests/test_guard_harm_risk_domains.py
          python -m ruff format --check \
            src/bayesian_phystwin/guard_harm_risk_domains.py \
            tests/test_guard_harm_risk_domains.py
          rm .github/workflows/domain-harm-risk-redundant-check-removal.yml
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayesian_phystwin/guard_harm_risk_domains.py \
            tests/test_guard_harm_risk_domains.py \
            .github/workflows/domain-harm-risk-redundant-check-removal.yml
          git diff --cached --check
          git commit -m "Remove logically implied domain overlap check"
          git push origin "HEAD:${HEAD_BRANCH}"
