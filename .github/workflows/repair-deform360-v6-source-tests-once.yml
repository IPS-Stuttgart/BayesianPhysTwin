name: Repair Deform360 v6 source tests once

on:
  push:
    branches:
      - agent/deform360-fresh-object-session-v6-source-gate
    paths:
      - ".github/workflows/repair-deform360-v6-source-tests-once.yml"

permissions:
  contents: write

concurrency:
  group: repair-deform360-v6-source-tests-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/deform360-fresh-object-session-v6-source-gate
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Apply the two reviewed corrections and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = \
            "refs/heads/agent/deform360-fresh-object-session-v6-source-gate"
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_deform360_fresh_object_session_source_v6.py")
          text = path.read_text(encoding="utf-8")
          old_import = "from typing import Any, Mapping\n"
          new_import = (
              "from collections.abc import Mapping\n"
              "from typing import Any\n"
          )
          old_match = 'match="binds another policy"'
          new_match = 'match="identity changed|binds another policy"'
          if text.count(old_import) != 1:
              raise SystemExit("typing import correction is not unique")
          if text.count(old_match) != 1:
              raise SystemExit("error-order assertion correction is not unique")
          text = text.replace(old_import, new_import)
          text = text.replace(old_match, new_match)
          path.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/repair-deform360-v6-source-tests-once.yml
          grep -Fq 'from collections.abc import Mapping' \
            tests/test_deform360_fresh_object_session_source_v6.py
          grep -Fq 'match="identity changed|binds another policy"' \
            tests/test_deform360_fresh_object_session_source_v6.py
          test "$(git status --short | wc -l)" -eq 2

      - name: Commit the reviewed repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/test_deform360_fresh_object_session_source_v6.py \
            .github/workflows/repair-deform360-v6-source-tests-once.yml
          git commit -m "Fix Deform360 v6 source test expectations"
          git push origin HEAD:agent/deform360-fresh-object-session-v6-source-gate
