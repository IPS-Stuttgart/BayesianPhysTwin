name: Diagnose Deform360 joint-sparse geometric v4

on:
  push:
    branches:
      - agent/materialize-deform360-joint-sparse-geometric-v4
    paths:
      - .github/workflows/_diagnose-deform360-joint-sparse-geometric-v4.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: diagnose-deform360-joint-sparse-geometric-v4
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Capture MyPy and focused pytest diagnostics
        id: diagnostics
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          output="${RUNNER_TEMP}/geometric-v4-diagnostics.txt"
          : > "${output}"
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "=== MYPY ==="
            python -m mypy \
              src/bayesian_phystwin/deform360_joint_sparse_geometric_common_v4.py \
              src/bayesian_phystwin/deform360_joint_sparse_geometric_source_v4.py \
              src/bayesian_phystwin/deform360_joint_sparse_geometric_npz_v4.py \
              src/bayesian_phystwin/deform360_joint_sparse_geometric_candidates_v4.py \
              src/bayesian_phystwin/deform360_joint_sparse_geometric_batch_v4.py \
              src/bayesian_phystwin/deform360_joint_sparse_geometric_materializer_v4.py
            mypy_status=$?
            echo "MYPY_EXIT=${mypy_status}"
            echo "=== PYTEST ==="
            python -m pytest -q -p no:cacheprovider \
              tests/test_deform360_joint_sparse_geometric_v4.py \
              tests/test_deform360_joint_sparse_geometric_v4_workflow.py \
              tests/test_deform360_joint_sparse_observability_v4.py \
              tests/test_deform360_joint_sparse_observability_v4_cli.py \
              tests/test_pull_request_workflow_integrity.py
            pytest_status=$?
            echo "PYTEST_EXIT=${pytest_status}"
            echo "=== RUFF ==="
            python -m ruff check \
              src/bayesian_phystwin/deform360_joint_sparse_geometric_common_v4.py \
              src/bayesian_phystwin/deform360_joint_sparse_geometric_source_v4.py \
              src/bayesian_phystwin/deform360_joint_sparse_geometric_npz_v4.py \
              src/bayesian_phystwin/deform360_joint_sparse_geometric_candidates_v4.py \
              src/bayesian_phystwin/deform360_joint_sparse_geometric_batch_v4.py \
              src/bayesian_phystwin/deform360_joint_sparse_geometric_materializer_v4.py \
              scripts/science/materialize_deform360_joint_sparse_geometric_v4.py \
              tests/test_deform360_joint_sparse_geometric_v4.py \
              tests/test_deform360_joint_sparse_geometric_v4_workflow.py
            ruff_status=$?
            echo "RUFF_EXIT=${ruff_status}"
            echo "=== FORMAT ==="
            python -m ruff format --check \
              src/bayesian_phystwin/deform360_joint_sparse_geometric_common_v4.py \
              src/bayesian_phystwin/deform360_joint_sparse_geometric_source_v4.py \
              src/bayesian_phystwin/deform360_joint_sparse_geometric_npz_v4.py \
              src/bayesian_phystwin/deform360_joint_sparse_geometric_candidates_v4.py \
              src/bayesian_phystwin/deform360_joint_sparse_geometric_batch_v4.py \
              src/bayesian_phystwin/deform360_joint_sparse_geometric_materializer_v4.py \
              scripts/science/materialize_deform360_joint_sparse_geometric_v4.py \
              tests/test_deform360_joint_sparse_geometric_v4.py \
              tests/test_deform360_joint_sparse_geometric_v4_workflow.py
            format_status=$?
            echo "FORMAT_EXIT=${format_status}"
          } 2>&1 | tee "${output}"
          echo "DIAGNOSTIC_PATH=${output}" >> "${GITHUB_ENV}"
          echo "mypy_status=${mypy_status}" >> "${GITHUB_OUTPUT}"
          echo "pytest_status=${pytest_status}" >> "${GITHUB_OUTPUT}"
          echo "ruff_status=${ruff_status}" >> "${GITHUB_OUTPUT}"
          echo "format_status=${format_status}" >> "${GITHUB_OUTPUT}"
          test "${mypy_status:-1}" -eq 0 \
            -a "${pytest_status:-1}" -eq 0 \
            -a "${ruff_status:-1}" -eq 0 \
            -a "${format_status:-1}" -eq 0
      - name: Upload bounded diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deform360-joint-sparse-geometric-v4-diagnostics-${{ github.run_id }}
          path: ${{ env.DIAGNOSTIC_PATH }}
          if-no-files-found: error
          retention-days: 7
      - name: Publish bounded diagnostic excerpt to PR 375
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MYPY_STATUS: ${{ steps.diagnostics.outputs.mypy_status }}
          PYTEST_STATUS: ${{ steps.diagnostics.outputs.pytest_status }}
          RUFF_STATUS: ${{ steps.diagnostics.outputs.ruff_status }}
          FORMAT_STATUS: ${{ steps.diagnostics.outputs.format_status }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          path = Path(os.environ["DIAGNOSTIC_PATH"])
          text = path.read_text(encoding="utf-8", errors="replace")
          encoded = text.encode("utf-8")
          if len(encoded) > 45_000:
              text = encoded[:45_000].decode("utf-8", errors="replace")
              text += "\n... diagnostic excerpt truncated ...\n"
          body = (
              "## Temporary geometric v4 contract diagnostics\n\n"
              f"- head: `{os.environ['GITHUB_SHA']}`\n"
              f"- MyPy exit: `{os.environ.get('MYPY_STATUS', 'unknown')}`\n"
              f"- pytest exit: `{os.environ.get('PYTEST_STATUS', 'unknown')}`\n"
              f"- Ruff exit: `{os.environ.get('RUFF_STATUS', 'unknown')}`\n"
              f"- format exit: `{os.environ.get('FORMAT_STATUS', 'unknown')}`\n\n"
              "```text\n"
              + text.replace("```", "` ` `")
              + "\n```\n"
          )
          request = urllib.request.Request(
              "https://api.github.com/repos/IPS-Stuttgart/BayesianPhysTwin/issues/375/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "bayesian-phystwin-geometric-v4-diagnostics",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              if response.status != 201:
                  raise SystemExit(f"diagnostic comment returned HTTP {response.status}")
          PY
      - name: Enforce diagnostic result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.diagnostics.outcome }}" = "success"
