name: Fix residual-history test and coverage gates once

on:
  push:
    branches:
      - agent/deform360-covariance-residual-history-dry-run-v1

permissions:
  contents: write

concurrency:
  group: fix-residual-history-edge-test-lint-once
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/deform360-covariance-residual-history-dry-run-v1
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply and validate the exact CI repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python - <<'PY'
          import json
          from pathlib import Path

          test_path = Path(
              "tests/test_deform360_covariance_residual_history_contract_edges_v1.py"
          )
          text = test_path.read_text(encoding="utf-8")
          old = '        _integer_vector([], name="indices")\n'
          new = (
              '        _integer_vector(\n'
              '            np.array([], dtype=np.int64), name="indices"\n'
              '        )\n'
          )
          if text.count(old) == 1 and new not in text:
              text = text.replace(old, new)
          elif text.count(old) != 0 or text.count(new) != 1:
              raise SystemExit("unexpected empty integer-vector assertion state")
          test_path.write_text(text, encoding="utf-8")

          manifest_path = Path(".github/quality/test-suites.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          suite = manifest["suites"]["stable-core-coverage"]
          additions = [
              "tests/test_deform360_covariance_residual_history_contract_edges_v1.py",
              "tests/test_deform360_covariance_residual_history_real_camera_roster_v1.py",
              "tests/test_deform360_covariance_residual_history_v1.py",
          ]
          present = [entry in suite for entry in additions]
          if not any(present):
              anchor = "tests/test_deform360_contact_anchor.py"
              if suite.count(anchor) != 1:
                  raise SystemExit("stable-core insertion anchor changed")
              index = suite.index(anchor) + 1
              suite[index:index] = additions
          elif not all(present):
              raise SystemExit("partial residual-history suite registration")
          if any(suite.count(entry) != 1 for entry in additions):
              raise SystemExit("residual-history suite registration is not unique")
          manifest_path.write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          python -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1"
          python -m pip install -e ".[dev,graph]"
          python -m pip check
          test_file=tests/test_deform360_covariance_residual_history_contract_edges_v1.py
          python -m ruff format "${test_file}"
          python -m ruff check "${test_file}"
          python -m ruff format --check "${test_file}"
          python tools/quality/test_suite_manifest.py validate --json
          python -m pytest -q -p no:cacheprovider \
            tests/test_deform360_covariance_residual_history_contract_edges_v1.py \
            tests/test_deform360_covariance_residual_history_real_camera_roster_v1.py \
            tests/test_deform360_covariance_residual_history_v1.py \
            tests/test_test_suite_manifest.py
          python tools/quality/test_suite_manifest.py list stable-core-coverage \
            > "${RUNNER_TEMP}/stable-core-tests.txt"
          for test_path in \
            tests/test_deform360_covariance_residual_history_contract_edges_v1.py \
            tests/test_deform360_covariance_residual_history_real_camera_roster_v1.py \
            tests/test_deform360_covariance_residual_history_v1.py
          do
            grep -Fx "${test_path}" "${RUNNER_TEMP}/stable-core-tests.txt"
          done

      - name: Publish the validated repair and remove this helper
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          helper=.github/workflows/fix-residual-history-edge-test-lint-once.yml
          manifest=.github/quality/test-suites.json
          test_file=tests/test_deform360_covariance_residual_history_contract_edges_v1.py
          rm -- "${helper}"
          git diff --check
          export HELPER="${helper}" MANIFEST="${manifest}" TEST_FILE="${test_file}"
          python - <<'PY'
          import os
          import subprocess

          allowed = {
              os.environ["HELPER"],
              os.environ["MANIFEST"],
              os.environ["TEST_FILE"],
          }
          output = subprocess.check_output(
              ["git", "status", "--porcelain=v1"],
              text=True,
          )
          changed = {line[3:] for line in output.splitlines() if line.strip()}
          if changed != allowed:
              raise SystemExit(f"unexpected repair paths: {sorted(changed)}")
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- "${helper}" "${manifest}" "${test_file}"
          git commit -m "Fix residual-history test and coverage gates"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" push \
            origin HEAD:refs/heads/agent/deform360-covariance-residual-history-dry-run-v1
