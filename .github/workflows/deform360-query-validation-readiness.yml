# workflow-lifecycle: temporary
# workflow-owner: IPS-Stuttgart maintainers
name: Deform360 query-validation readiness

on:
  push:
    branches:
      - science/deform360-query-validation-readiness-v1
    paths:
      - .github/requests/deform360-query-validation-readiness-retry-v1.json

permissions:
  contents: read

concurrency:
  group: deform360-query-validation-readiness-${{ github.ref }}
  cancel-in-progress: false

env:
  DATA_ROOT: /mnt/seagate10tb/florianpfaff/datasets/deform360
  PROTOCOL: protocols/deform360_query_validation_readiness_v1.json
  REQUEST: .github/requests/deform360-query-validation-readiness-retry-v1.json
  HISTORICAL_COMMIT: 00550574fe56330062140d6042693d5a34088103
  HISTORICAL_PATH: protocols/locks/deform360_covariance_only_target_v1_exclusion.json
  HISTORICAL_FILE_SHA256: f9db0fa72305b68f6d4c6e85c4a6b4a22fb77bb01a4e2b13792c5954bb228b06
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  contracts:
    name: Hosted readiness contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate the one-file trigger
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = \
            refs/heads/science/deform360-query-validation-readiness-v1
          test "$PUSH_FORCED" = false
          test "$BEFORE_SHA" != 0000000000000000000000000000000000000000
          mapfile -t changed < <(git diff --name-status "$BEFORE_SHA" "$GITHUB_SHA")
          printf 'Changed files:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = $'A\t'"$REQUEST"
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          path = Path(os.environ["REQUEST"])
          request = json.loads(path.read_text(encoding="utf-8"))
          parent = subprocess.check_output(
              ["git", "rev-parse", f"{os.environ['GITHUB_SHA']}^"],
              text=True,
          ).strip()
          expected = {
              "schema": "deform360-query-validation-readiness-request-v1",
              "request_id": "deform360-query-validation-readiness-2026-08-30-retry-1",
              "dataset_root": "/mnt/seagate10tb/florianpfaff/datasets/deform360",
              "runner_label": "gpuserver4090",
              "mode": "target-blind-readiness",
              "authorize_selected_metadata_json": True,
              "authorize_target_payload": False,
              "authorize_model_scoring": False,
              "expected_source_revision": parent,
          }
          if request != expected:
              raise SystemExit(
                  "request differs from the exact one-shot authorization"
              )
          PY
      - name: Test and lint readiness implementation
        run: |
          python -m pip install pytest ruff
          python -m pytest -q \
            tests/test_deform360_query_validation_readiness.py
          python -m ruff check \
            scripts/science/audit_deform360_query_validation_readiness.py \
            tests/test_deform360_query_validation_readiness.py
          python -m ruff format --check \
            scripts/science/audit_deform360_query_validation_readiness.py \
            tests/test_deform360_query_validation_readiness.py
          python -m json.tool "$PROTOCOL" >/dev/null

  readiness:
    name: Target-blind metadata design / gpuserver4090
    needs: contracts
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare isolated scratch and verify mounted root
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DATA_ROOT"
          test -r "$DATA_ROOT"
          scratch="$RUNNER_TEMP/deform360-query-readiness-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$scratch"
          mkdir -p "$scratch"
          echo "SCRATCH=$scratch" >> "$GITHUB_ENV"
          {
            echo "runner_name=$RUNNER_NAME"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "required_runner_label=gpuserver4090"
            echo "dataset_root=$(readlink -f "$DATA_ROOT")"
            echo "revision=$GITHUB_SHA"
            hostname
            python3 --version
          } | tee "$scratch/environment.txt"
          nvidia-smi --query-gpu=name,uuid,driver_version,memory.total \
            --format=csv,noheader \
            | tee "$scratch/gpus.csv"
      - name: Rebuild the names-only inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/science/build_deform360_metadata_inventory.py \
            --data-root "$DATA_ROOT" \
            --repository . \
            --protocol protocols/deform360_metadata_preflight_v1.json \
            --output "$SCRATCH/names-only-inventory.json" \
            | tee "$SCRATCH/inventory.log"
      - name: Materialize and verify the historical hash-only exclusion
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 \
            https://github.com/IPS-Stuttgart/BayesianPhysTwin.git \
            "$HISTORICAL_COMMIT"
          git show "$HISTORICAL_COMMIT:$HISTORICAL_PATH" \
            > "$SCRATCH/historical-exclusion.json"
          printf '%s  %s\n' \
            "$HISTORICAL_FILE_SHA256" \
            "$SCRATCH/historical-exclusion.json" \
            | sha256sum --check --strict
      - name: Select a deterministic development metadata design
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/science/audit_deform360_query_validation_readiness.py \
            --data-root "$DATA_ROOT" \
            --protocol "$PROTOCOL" \
            --inventory "$SCRATCH/names-only-inventory.json" \
            --historical-exclusion "$SCRATCH/historical-exclusion.json" \
            --output-dir "$SCRATCH/result" \
            | tee "$SCRATCH/readiness.log"
      - name: Verify no target-bearing payload was accessed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(
              (Path(os.environ["SCRATCH"]) / "result/readiness.json").read_text(
                  encoding="utf-8"
              )
          )
          boundary = result["information_boundary"]
          for key in (
              "camera_media_decoded",
              "robot_or_tactile_arrays_opened",
              "geometry_or_track_annotations_opened",
              "target_future_opened",
              "score_bearing_outcomes_opened",
          ):
              if boundary[key]:
                  raise SystemExit(f"forbidden access recorded: {key}")
          decision = result["decision"]
          if decision["fresh_confirmation_authorized"]:
              raise SystemExit("fresh confirmation must remain unauthorized")
          if decision["target_payload_access_authorized"]:
              raise SystemExit("target payload access must remain unauthorized")
          if decision["model_scoring_authorized"]:
              raise SystemExit("model scoring must remain unauthorized")
          PY
          git diff --exit-code
          git status --porcelain=v1 --untracked-files=no \
            | tee "$SCRATCH/git-status.txt"
          test ! -s "$SCRATCH/git-status.txt"
      - name: Publish readiness summary
        if: always()
        shell: bash
        run: |
          if test -f "$SCRATCH/result/report.md"; then
            cat "$SCRATCH/result/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## No readiness result produced" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload target-blind readiness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: deform360-query-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.SCRATCH }}/environment.txt
            ${{ env.SCRATCH }}/gpus.csv
            ${{ env.SCRATCH }}/inventory.log
            ${{ env.SCRATCH }}/names-only-inventory.json
            ${{ env.SCRATCH }}/readiness.log
            ${{ env.SCRATCH }}/result/readiness.json
            ${{ env.SCRATCH }}/result/report.md
            ${{ env.SCRATCH }}/git-status.txt
          if-no-files-found: warn
          retention-days: 90
      - name: Remove selected metadata copies and scratch
        if: always()
        shell: bash
        run: |
          if test -n "${SCRATCH:-}"; then rm -rf "$SCRATCH"; fi
