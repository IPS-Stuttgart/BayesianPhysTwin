name: Apply threshold-native evidence implementation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: agent-threshold-native-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  implement:
    if: github.head_ref == 'agent/tie-preserving-threshold-risk'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/tie-preserving-threshold-risk
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Apply implementation
        run: |
          python tools/agent_apply_threshold_risk.py
          rm tools/agent_apply_threshold_risk.py
          rm .github/workflows/agent-apply-threshold-risk.yml
      - name: Format and validate focused changes
        run: |
          python -m ruff format \
            src/bayesian_phystwin/decisive_evidence.py \
            tests/test_decisive_evidence.py
          python -m ruff check \
            src/bayesian_phystwin/decisive_evidence.py \
            tests/test_decisive_evidence.py
          python -m ruff format --check \
            src/bayesian_phystwin/decisive_evidence.py \
            tests/test_decisive_evidence.py
          python -m mypy src/bayesian_phystwin/decisive_evidence.py
          python -m pytest -q tests/test_decisive_evidence.py
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add tie-preserving threshold risk coverage"
          git push origin HEAD:agent/tie-preserving-threshold-risk
