name: Format query-anchor once

on:
  push:
    branches: [agent/query-anchor-sufficiency-v1]
    paths:
      - .github/workflows/format-query-anchor-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Format changed Python and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "ruff==0.16.1"
          files=(
            scripts/science/run_query_anchor_sufficiency_study.py
            src/bayesian_phystwin/query_anchor_sufficiency.py
            tests/test_information_mass_invariants.py
            tests/test_query_anchor_sufficiency.py
          )
          python -m ruff check --fix "${files[@]}"
          python -m ruff format "${files[@]}"
          git rm .github/workflows/format-query-anchor-once.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply current Ruff formatting to query-anchor contracts"
          git push origin HEAD:agent/query-anchor-sufficiency-v1
