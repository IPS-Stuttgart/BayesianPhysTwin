name: Controlled Prob4D-to-BPT decisive study

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/prob4d-bpt-controlled-decisive.yml"
      - "protocols/prob4d_bpt_controlled_decisive_v1.json"
      - "scripts/science/prob4d_bpt_controlled_decisive_core_v1.py"
      - "scripts/science/run_prob4d_bpt_controlled_decisive_v1.py"
      - "tests/test_prob4d_bpt_controlled_decisive_v1.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prob4d-bpt-controlled-decisive-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BPT_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
  PROB4D_SOURCE_REVISION: aa8ffc6541011d044561e09870569a14ab3f586f
  PROTOCOL_SHA256: 921da8a6f14f9430b3f4861d68326d904f61b922e3aedd2b35882ea97bc63111
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  decisive-study:
    name: Fresh controlled groups on workstation2
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 360
    env:
      PROB4D_READ_TOKEN: ${{ secrets.PROB4D_READ_TOKEN }}
    steps:
      - name: Check out exact BayesianPhysTwin head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BPT_SOURCE_REVISION }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve exact Prob4D source
        id: prob4d-source
        shell: bash
        env:
          TOKEN: ${{ env.PROB4D_READ_TOKEN }}
        run: |
          set -euo pipefail
          destination="${RUNNER_TEMP}/prob4d-controlled-decisive-source"
          rm -rf "${destination}"

          candidates=(
            "${RUNNER_WORKSPACE}/Prob4D/Prob4D"
            "${RUNNER_WORKSPACE}/prob4d/Prob4D"
            "${RUNNER_WORKSPACE}/prob4d/prob4d"
            "${HOME}/Prob4D"
            "${HOME}/src/Prob4D"
          )
          source=""
          for candidate in "${candidates[@]}"; do
            if [[ -d "${candidate}/.git" ]] && \
              git -C "${candidate}" cat-file -e \
                "${PROB4D_SOURCE_REVISION}^{commit}" 2>/dev/null; then
              source="${candidate}"
              break
            fi
          done

          resolved=false
          if [[ -n "${source}" ]]; then
            git clone --no-hardlinks --quiet "${source}" "${destination}"
            resolved=true
          fi

          if [[ "${resolved}" != true && -n "${TOKEN}" ]]; then
            basic="$(printf 'x-access-token:%s' "${TOKEN}" | base64 -w0)"
            if git -c \
              http.https://github.com/.extraheader="AUTHORIZATION: basic ${basic}" \
              clone --filter=blob:none --no-checkout --quiet \
              https://github.com/IPS-Stuttgart/Prob4D.git "${destination}"; then
              resolved=true
            else
              rm -rf "${destination}"
            fi
          fi

          if [[ "${resolved}" != true ]]; then
            if git clone --filter=blob:none --no-checkout --quiet \
              git@github.com:IPS-Stuttgart/Prob4D.git "${destination}"; then
              resolved=true
            else
              rm -rf "${destination}"
            fi
          fi

          if [[ "${resolved}" != true ]] || ! git -C "${destination}" cat-file -e \
            "${PROB4D_SOURCE_REVISION}^{commit}" 2>/dev/null; then
            echo "::error title=Exact Prob4D source unavailable::" \
              "Runner lacks ${PROB4D_SOURCE_REVISION}; registered credentials failed."
            exit 1
          fi

          git -C "${destination}" checkout --quiet --detach \
            "${PROB4D_SOURCE_REVISION}"
          test "$(git -C "${destination}" rev-parse HEAD)" = \
            "${PROB4D_SOURCE_REVISION}"
          test -z "$(git -C "${destination}" status --porcelain=v1)"
          echo "path=${destination}" >> "${GITHUB_OUTPUT}"

      - name: Resolve isolated evidence paths
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/prob4d-bpt-controlled-decisive-"
          root+="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "${root}"
          mkdir -p "${root}/evidence"
          echo "EVIDENCE_ROOT=${root}/evidence" >> "${GITHUB_ENV}"

      - name: Record execution environment
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "bpt_revision=${BPT_SOURCE_REVISION}"
            echo "prob4d_revision=${PROB4D_SOURCE_REVISION}"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            uname -a
            lscpu
            free -b
            nvidia-smi
            python -VV
          } > "${EVIDENCE_ROOT}/environment.txt" 2>&1

      - name: Install exact producer and consumer
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e "${{ steps.prob4d-source.outputs.path }}"
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m pip freeze --all > "${EVIDENCE_ROOT}/pip-freeze.txt"
          python - <<'PY'
          from importlib.metadata import version
          print("prob4d=" + version("prob4d"))
          print("bayesian-phystwin=" + version("bayesian-phystwin"))
          PY

      - name: Verify frozen protocol before target execution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path("protocols/prob4d_bpt_controlled_decisive_v1.json")
          protocol = json.loads(path.read_text(encoding="utf-8"))
          actual = hashlib.sha256(
              json.dumps(
                  protocol,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              ).encode("utf-8")
          ).hexdigest()
          if actual != os.environ["PROTOCOL_SHA256"]:
              raise SystemExit(
                  "protocol changed: "
                  f"expected {os.environ['PROTOCOL_SHA256']}, received {actual}"
              )
          pins = protocol["repository_pins"]
          if pins["bayesian_phystwin_base"] != \
              "b2da5df5eddd5437d444b60b11130262d115e264":
              raise SystemExit("BayesianPhysTwin protocol base changed")
          if pins["prob4d"] != os.environ["PROB4D_SOURCE_REVISION"]:
              raise SystemExit("Prob4D protocol pin changed")
          print(f"locked protocol={actual}")
          PY
          python -m ruff check \
            scripts/science/prob4d_bpt_controlled_decisive_core_v1.py \
            scripts/science/run_prob4d_bpt_controlled_decisive_v1.py \
            tests/test_prob4d_bpt_controlled_decisive_v1.py
          python -m ruff format --check \
            scripts/science/prob4d_bpt_controlled_decisive_core_v1.py \
            scripts/science/run_prob4d_bpt_controlled_decisive_v1.py \
            tests/test_prob4d_bpt_controlled_decisive_v1.py
          python -m pytest -q \
            tests/test_prob4d_bpt_controlled_decisive_v1.py

      - name: Execute all fresh controlled groups
        id: experiment
        shell: bash
        run: |
          set +e
          python scripts/science/run_prob4d_bpt_controlled_decisive_v1.py \
            --protocol protocols/prob4d_bpt_controlled_decisive_v1.json \
            --output-dir "${EVIDENCE_ROOT}/result" \
            --repository-revision "${BPT_SOURCE_REVISION}" \
            --prob4d-revision "${PROB4D_SOURCE_REVISION}" \
            --force \
            2>&1 | tee "${EVIDENCE_ROOT}/console.log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "${status}" -ne 0 && "${status}" -ne 3 ]]; then
            exit "${status}"
          fi
          echo "decision_exit_code=${status}" >> "${GITHUB_OUTPUT}"

      - name: Independently verify result and decision
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "${EVIDENCE_ROOT}/result"
            sha256sum --check SHA256SUMS
          )
          python - <<'PY'
          import csv
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["EVIDENCE_ROOT"]) / "result"
          protocol = json.loads((root / "protocol.json").read_text())
          report = json.loads((root / "report.json").read_text())
          if report["protocol_sha256"] != os.environ["PROTOCOL_SHA256"]:
              raise SystemExit("result protocol identity changed")
          if report["repository_revision"] != os.environ["BPT_SOURCE_REVISION"]:
              raise SystemExit("result BayesianPhysTwin revision changed")
          if report["prob4d_revision"] != os.environ["PROB4D_SOURCE_REVISION"]:
              raise SystemExit("result Prob4D revision changed")

          with (root / "trials.csv").open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))
          expected = (
              len(protocol["methods"])
              * len(protocol["scenarios"])
              * protocol["target"]["groups_per_scenario"]
          )
          if len(rows) != expected:
              raise SystemExit(
                  f"target trial row count changed: expected {expected}, got {len(rows)}"
              )

          primary = report["aggregate"][protocol["primary_method"]]
          marginal = report["aggregate"]["P1_marginal_gauge_persistent"]
          limits = protocol["acceptance_criteria"]
          worst_regression = max(
              0.0,
              max(
                  -float(value["deployed_improvement_fraction"])
                  for value in primary["by_scenario"].values()
              ),
          )
          recomputed = {
              "mean_improvement_at_least_registered": (
                  primary["deployed_improvement_fraction"]
                  >= limits["mean_improvement_fraction_at_least"]
              ),
              "paired_upper_bound_below_zero": (
                  primary["paired_deployed_minus_baseline_95_m"][1] < 0.0
              ),
              "harmful_accepted_rate_at_most_registered": (
                  primary["harmful_accepted_rate"]
                  <= limits["harmful_accepted_rate_at_most"]
              ),
              "worst_scenario_regression_at_most_registered": (
                  worst_regression
                  <= limits["worst_scenario_regression_fraction_at_most"]
              ),
              "all_rejections_exact_fallback": (
                  primary["all_rejections_exact_fallback"] is True
              ),
              "explicit_persistent_noninferior_to_marginal": (
                  primary["deployed_mean_rmse_m"]
                  <= (
                      1.0
                      + limits["explicit_vs_marginal_noninferiority_fraction"]
                  )
                  * marginal["deployed_mean_rmse_m"]
              ),
          }
          if recomputed != report["decision"]["criteria"]:
              raise SystemExit("registered decision criteria do not recompute")
          if report["decision"]["overall_passed"] != all(recomputed.values()):
              raise SystemExit("overall decision does not match registered criteria")
          expected_exit = 0 if all(recomputed.values()) else 3
          actual_exit = int("${{ steps.experiment.outputs.decision_exit_code }}")
          if actual_exit != expected_exit:
              raise SystemExit(
                  f"decision exit changed: expected {expected_exit}, got {actual_exit}"
              )
          print(json.dumps(report["decision"], indent=2, sort_keys=True))
          PY
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"

      - name: Publish scientific summary
        if: always()
        shell: bash
        run: |
          if [[ -f "${EVIDENCE_ROOT}/result/summary.md" ]]; then
            cat "${EVIDENCE_ROOT}/result/summary.md" >> "${GITHUB_STEP_SUMMARY}"
          fi
          {
            echo
            echo "Decision exit code: ${{ steps.experiment.outputs.decision_exit_code }}"
            echo
            echo "Controlled evidence only; a pass advances to a fresh physical cohort."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prob4d-bpt-controlled-decisive-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_ROOT }}
          if-no-files-found: error
          retention-days: 90
