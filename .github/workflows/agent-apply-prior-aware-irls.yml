name: Apply prior-aware IRLS fail-closed patch

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/fail-closed-prior-aware-irls

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/fail-closed-prior-aware-irls
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply fail-closed convergence guard and regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          guard = '''    if not fixed_point_converged:
              diagnostics.update(
                  {
                      "iterations": iteration_count,
                      "mixture_fixed_point_converged": False,
                      "mixture_solution_delta": solution_delta,
                      "mixture_stationarity_norm": stationarity_norm,
                      "condition_number": condition_number,
                  }
              )
              return {fallback}(
                  batch,
                  "mixture-fixed-point-not-converged",
                  diagnostics,
                  prior_covariance=full_prior,
              )

          '''
          needle = '''    try:
              reduced_covariance = _spd_covariance(normal)
          '''
          sources = {
              Path("src/bayesian_phystwin/prior_aware_gauge_belief.py"): "_fallback_result",
              Path("src/bayesian_phystwin/sparse_prior_aware_gauge_belief.py"): "_sparse_fallback_result",
          }
          for path, fallback in sources.items():
              text = path.read_text(encoding="utf-8")
              if text.count(needle) != 1:
                  raise SystemExit(f"unexpected covariance solve anchor in {path}")
              text = text.replace(needle, guard.format(fallback=fallback) + needle)
              path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_sparse_prior_aware_gauge_belief.py")
          test_name = "test_prior_aware_solvers_fail_closed_on_unconverged_mixture"
          test_text = test_path.read_text(encoding="utf-8")
          if test_name in test_text:
              raise SystemExit("regression test already exists")
          test_text += '''


def test_prior_aware_solvers_fail_closed_on_unconverged_mixture() -> None:
    dense_batch, sparse_batch, sparse_design = _fixture()
    config = _config(maximum_iterations=1, convergence_tolerance=1.0e-15)

    dense = update_prior_aware_gauge_belief(dense_batch, config=config)
    sparse = update_sparse_prior_aware_gauge_belief(
        sparse_batch,
        sparse_design,
        config=config,
    )

    assert not dense.inference_admissible
    assert not sparse.inference_admissible
    assert dense.reason == sparse.reason == "mixture-fixed-point-not-converged"
    assert dense.diagnostics["iterations"] == 1
    assert sparse.diagnostics["iterations"] == 1
    assert dense.diagnostics["mixture_fixed_point_converged"] is False
    assert sparse.diagnostics["mixture_fixed_point_converged"] is False
    _assert_result_parity(dense, sparse)
'''
          test_path.write_text(test_text, encoding="utf-8")

          Path(".github/workflows/agent-apply-prior-aware-irls.yml").unlink()
          PY

      - name: Install development environment
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir -e ".[dev]"
          python -m pip check

      - name: Format and verify focused surfaces
        run: |
          set -euo pipefail
          files=(
            src/bayesian_phystwin/prior_aware_gauge_belief.py
            src/bayesian_phystwin/sparse_prior_aware_gauge_belief.py
            tests/test_sparse_prior_aware_gauge_belief.py
          )
          python -m ruff format -- "${files[@]}"
          python -m ruff check -- "${files[@]}"
          python -m ruff format --check --diff "${files[@]}"
          python -m mypy --python-version 3.12 \
            src/bayesian_phystwin/prior_aware_gauge_belief.py \
            src/bayesian_phystwin/sparse_prior_aware_gauge_belief.py
          python -m pytest -q \
            tests/test_sparse_prior_aware_gauge_belief.py \
            tests/test_prior_aware_and_linearization.py \
            tests/test_prior_aware_likelihood_conformance.py \
            tests/test_tree_sparse_explicit_gauge_prob4d.py
          python -m compileall -q src/bayesian_phystwin tests

      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayesian_phystwin/prior_aware_gauge_belief.py \
            src/bayesian_phystwin/sparse_prior_aware_gauge_belief.py \
            tests/test_sparse_prior_aware_gauge_belief.py \
            .github/workflows/agent-apply-prior-aware-irls.yml
          git commit -m "Fail closed on non-converged prior-aware IRLS"
          git push origin HEAD:agent/fail-closed-prior-aware-irls
