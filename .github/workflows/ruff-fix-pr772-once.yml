# workflow-lifecycle: temporary
# workflow-owner: IPS-Stuttgart maintainers
# workflow-issue: #772
# workflow-expiry: 2026-08-26
name: Ruff fix PR 772 once

on:
  push:
    branches:
      - chore/freeze-causal4d-provider-v1-surface

permissions:
  contents: write

concurrency:
  group: ruff-fix-pr772-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/freeze-causal4d-provider-v1-surface
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.1.0
        with:
          python-version: '3.12'
      - name: Apply exact Ruff canonicalization
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'ruff==0.16.4'
          python -m ruff check --fix tests/test_causal4d_provider_v1_no_growth.py
          python -m ruff check tests/test_causal4d_provider_v1_no_growth.py
          git diff --check
      - name: Commit test-only formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_causal4d_provider_v1_no_growth.py
          if git diff --cached --quiet; then
            echo "No Ruff changes needed"
            exit 0
          fi
          git commit -m "Apply Ruff canonical import formatting"
          git push origin HEAD:chore/freeze-causal4d-provider-v1-surface
