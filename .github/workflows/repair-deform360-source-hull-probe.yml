name: Repair Deform360 source-hull provenance contract

on:
  pull_request:
    branches:
      - agent/deform360-metadata-preflight
    paths:
      - ".github/workflows/repair-deform360-source-hull-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-deform360-source-hull-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Separate Git revisions from SHA-256 content identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path("scripts/science/probe_deform360_source_hulls.py")
          source_lines = source_path.read_text(encoding="utf-8").splitlines()
          inventory_index = source_lines.index(
              '    source_inventory = config.get("source_inventory")'
          )
          start = source_lines.index("    for field in (", inventory_index)
          end = source_lines.index("    return payload", start)
          replacement = [
              "    for field in (",
              '        "content_inventory_sha256",',
              '        "inventory_sha256",',
              '        "workflow_artifact_sha256",',
              "    ):",
              "        identity = source_inventory.get(field)",
              "        _require(",
              "            isinstance(identity, str)",
              "            and len(identity) == 64",
              '            and all(character in "0123456789abcdef" for character in identity),',
              '            f"source inventory {field} is invalid",',
              "        )",
              '    for field in ("product_head_sha", "evaluated_merge_sha"):',
              "        identity = source_inventory.get(field)",
              "        _require(",
              "            isinstance(identity, str)",
              "            and len(identity) == 40",
              '            and all(character in "0123456789abcdef" for character in identity),',
              '            f"source inventory {field} is invalid",',
              "        )",
          ]
          source_lines[start:end] = replacement
          source_path.write_text(
              "\n".join(source_lines) + "\n",
              encoding="utf-8",
          )

          test_path = Path("tests/test_probe_deform360_source_hulls.py")
          tests = test_path.read_text(encoding="utf-8")
          changes = {
              '"product_head_sha": "3" * 64': '"product_head_sha": "3" * 40',
              '"evaluated_merge_sha": "4" * 64': (
                  '"evaluated_merge_sha": "4" * 40'
              ),
          }
          for old, new in changes.items():
              if tests.count(old) != 1:
                  raise RuntimeError(f"unexpected synthetic identity fixture: {old}")
              tests = tests.replace(old, new)
          marker = "def test_repository_protocol_is_valid()"
          if marker not in tests:
              tests += r'''


def test_repository_protocol_is_valid() -> None:
    protocol = (
        Path(__file__).resolve().parents[1]
        / "protocols"
        / "deform360_source_hull_contract_probe_v1.json"
    )

    payload = load_probe_protocol(protocol)

    inventory = payload["config"]["source_inventory"]
    assert len(inventory["product_head_sha"]) == 40
    assert len(inventory["evaluated_merge_sha"]) == 40


@pytest.mark.parametrize(
    ("field", "replacement"),
    (
        ("product_head_sha", "a" * 64),
        ("evaluated_merge_sha", "b" * 64),
        ("workflow_artifact_sha256", "c" * 40),
    ),
)
def test_protocol_rejects_wrong_identity_family(
    tmp_path: Path,
    field: str,
    replacement: str,
) -> None:
    _root, protocol = _fixture(tmp_path)
    payload = json.loads(protocol.read_text(encoding="utf-8"))
    payload["config"]["source_inventory"][field] = replacement
    payload["config_sha256"] = (
        __import__("hashlib")
        .sha256(_canonical_bytes(payload["config"]))
        .hexdigest()
    )
    protocol.write_text(
        json.dumps(payload, indent=2, sort_keys=True) + "\n",
        encoding="utf-8",
    )

    with pytest.raises(ValueError, match=field):
        load_probe_protocol(protocol)
'''
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate and publish the repair
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff check --fix \
            scripts/science/probe_deform360_source_hulls.py \
            tests/test_probe_deform360_source_hulls.py
          python -m ruff format \
            scripts/science/probe_deform360_source_hulls.py \
            tests/test_probe_deform360_source_hulls.py
          python -m ruff check \
            scripts/science/probe_deform360_source_hulls.py \
            tests/test_probe_deform360_source_hulls.py
          python -m ruff format --check \
            scripts/science/probe_deform360_source_hulls.py \
            tests/test_probe_deform360_source_hulls.py
          python -m pytest -q tests/test_probe_deform360_source_hulls.py
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/science/probe_deform360_source_hulls.py \
            tests/test_probe_deform360_source_hulls.py
          git commit -m "Validate Deform360 inventory Git revisions correctly"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
