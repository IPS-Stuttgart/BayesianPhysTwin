name: Repair Deform360 source-hull provenance contract

on:
  push:
    branches:
      - agent/deform360-source-hull-contract-probe
    paths:
      - ".github/workflows/repair-deform360-source-hull-probe.yml"

permissions:
  contents: write

concurrency:
  group: repair-deform360-source-hull-probe
  cancel-in-progress: false

jobs:
  repair:
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 20
    steps:
      - name: Check out mutable probe branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/deform360-source-hull-contract-probe
          fetch-depth: 0

      - name: Correct identity families and bind the final inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          source_path = Path("scripts/science/probe_deform360_source_hulls.py")
          source_lines = source_path.read_text(encoding="utf-8").splitlines()
          inventory_index = source_lines.index(
              '    source_inventory = config.get("source_inventory")'
          )
          start = source_lines.index("    for field in (", inventory_index)
          end = source_lines.index("    return payload", start)
          replacement = [
              "    identity_lengths = {",
              '        "content_inventory_sha256": 64,',
              '        "inventory_sha256": 64,',
              '        "product_head_sha": 40,',
              '        "evaluated_merge_sha": 40,',
              '        "workflow_artifact_sha256": 64,',
              "    }",
              "    for field, expected_length in identity_lengths.items():",
              "        identity = source_inventory.get(field)",
              "        _require(",
              "            isinstance(identity, str)",
              "            and len(identity) == expected_length",
              '            and all(character in "0123456789abcdef" for character in identity),',
              '            f"source inventory {field} is invalid",',
              "        )",
          ]
          source_lines[start:end] = replacement
          source_path.write_text(
              "\n".join(source_lines) + "\n",
              encoding="utf-8",
          )

          test_path = Path("tests/test_probe_deform360_source_hulls.py")
          tests = test_path.read_text(encoding="utf-8")
          fixture_changes = {
              '"product_head_sha": "3" * 64': '"product_head_sha": "3" * 40',
              '"evaluated_merge_sha": "4" * 64': (
                  '"evaluated_merge_sha": "4" * 40'
              ),
          }
          for old, new in fixture_changes.items():
              if old in tests:
                  tests = tests.replace(old, new)
          if "def test_repository_protocol_is_valid()" not in tests:
              tests += r'''


def test_repository_protocol_is_valid() -> None:
    protocol = (
        Path(__file__).resolve().parents[1]
        / "protocols"
        / "deform360_source_hull_contract_probe_v1.json"
    )

    payload = load_probe_protocol(protocol)

    inventory = payload["config"]["source_inventory"]
    assert len(inventory["product_head_sha"]) == 40
    assert len(inventory["evaluated_merge_sha"]) == 40


@pytest.mark.parametrize(
    ("field", "replacement"),
    (
        ("product_head_sha", "a" * 64),
        ("evaluated_merge_sha", "b" * 64),
        ("workflow_artifact_sha256", "c" * 40),
    ),
)
def test_protocol_rejects_wrong_identity_family(
    tmp_path: Path,
    field: str,
    replacement: str,
) -> None:
    _root, protocol = _fixture(tmp_path)
    payload = json.loads(protocol.read_text(encoding="utf-8"))
    payload["config"]["source_inventory"][field] = replacement
    payload["config_sha256"] = (
        __import__("hashlib")
        .sha256(_canonical_bytes(payload["config"]))
        .hexdigest()
    )
    protocol.write_text(
        json.dumps(payload, indent=2, sort_keys=True) + "\n",
        encoding="utf-8",
    )

    with pytest.raises(ValueError, match=field):
        load_probe_protocol(protocol)
'''
          test_path.write_text(tests, encoding="utf-8")

          protocol_path = Path(
              "protocols/deform360_source_hull_contract_probe_v1.json"
          )
          payload = json.loads(protocol_path.read_text(encoding="utf-8"))
          inventory = payload["config"]["source_inventory"]
          inventory.update(
              {
                  "content_inventory_sha256": (
                      "0089c45afb323e6d2e4312dd71d6e5a2cb359c056f007b5aeb09da33e03b7974"
                  ),
                  "inventory_sha256": (
                      "2b34d3b0df71f85218e76f384b7ac4f381e2ed941eab3189b6ccb01c688d174b"
                  ),
                  "product_head_sha": (
                      "26d8bf5b0d4592e2cd0d9f2611d5814b30c904fb"
                  ),
                  "evaluated_merge_sha": (
                      "6d67e52582d20693f1ca7a46fb2f6c6ac9c53c9d"
                  ),
                  "workflow_artifact_id": 8891878436,
                  "workflow_artifact_sha256": (
                      "69dc3d8628e98fb9d5112a8dfb456abc58de0111475f67f20ca2efbe9ddba904"
                  ),
              }
          )
          payload["config_sha256"] = hashlib.sha256(
              json.dumps(
                  payload["config"],
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              ).encode("utf-8")
          ).hexdigest()
          protocol_path.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Validate and publish the clean repair
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff check --fix \
            scripts/science/probe_deform360_source_hulls.py \
            tests/test_probe_deform360_source_hulls.py
          python -m ruff format \
            scripts/science/probe_deform360_source_hulls.py \
            tests/test_probe_deform360_source_hulls.py
          python -m ruff check \
            scripts/science/probe_deform360_source_hulls.py \
            tests/test_probe_deform360_source_hulls.py
          python -m ruff format --check \
            scripts/science/probe_deform360_source_hulls.py \
            tests/test_probe_deform360_source_hulls.py
          python -m pytest -q tests/test_probe_deform360_source_hulls.py
          git diff --check

          rm .github/workflows/repair-deform360-source-hull-probe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/science/probe_deform360_source_hulls.py \
            tests/test_probe_deform360_source_hulls.py \
            protocols/deform360_source_hull_contract_probe_v1.json \
            .github/workflows/repair-deform360-source-hull-probe.yml
          git commit -m "Fix source-inventory identity validation"
          git push origin HEAD:agent/deform360-source-hull-contract-probe
