name: Temporary full-22 protocol identity repair v2

on:
  push:
    branches:
      - agent/portable-full22-anchor-reproduction
    paths:
      - .github/workflows/temporary-fix-full22-protocol-identity-v2.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temporary-fix-full22-protocol-identity-v2.yml

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 15
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/portable-full22-anchor-reproduction
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply portable protocol identity repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          SEMANTIC_ID = "0d3e4eaaec1587a717ff551e6a8cc7f0d6f4ac5484e85628a328893513aa26b6"
          LEGACY_ID = "ee11310a84b92ff2158018a13ef09989e641e7c0ea84733fe8a6abf267093c65"
          SOURCE_REVISION = "e393bb6ff61d44815afd8d09dfc5334cb55d5524"

          selected = [
              "double_lift_cloth_1", "double_lift_cloth_3", "double_lift_sloth",
              "double_lift_zebra", "double_stretch_sloth", "double_stretch_zebra",
              "rope_double_hand", "single_clift_cloth_1", "single_clift_cloth_3",
              "single_lift_cloth", "single_lift_cloth_1", "single_lift_cloth_3",
              "single_lift_cloth_4", "single_lift_dinosor", "single_lift_rope",
              "single_lift_sloth", "single_lift_zebra", "single_push_rope",
              "single_push_rope_1", "single_push_rope_4", "single_push_sloth",
              "weird_package",
          ]
          development_protocol = [
              "single_lift_sloth", "double_lift_sloth", "double_stretch_sloth"
          ]
          development_cohort = [
              "double_lift_sloth", "double_stretch_sloth", "single_lift_sloth"
          ]
          confirmation = [case for case in selected if case not in development_cohort]
          normalized_specification = {
              "method": "robust Bayesian random-walk endpoint anchoring",
              "protocol": {
                  "fit_fraction": 0.75,
                  "process_std_candidates_m": [0.0, 0.0005, 0.001, 0.0025, 0.005],
                  "observation_std_candidates_m": [0.001, 0.0025, 0.005],
                  "initial_std_m": 0.01,
                  "inlier_prior": 0.95,
                  "outlier_variance_multiplier": 100.0,
                  "interpolation_neighbors": 4,
                  "maximum_residual_m": 0.01,
                  "minimum_validation_improvement": 0.0,
                  "bootstrap_samples": 10000,
                  "bootstrap_block_length": 5,
                  "bootstrap_seed": 20260710,
                  "development_cases": development_protocol,
              },
              "data_manifest": {"selected_cases": selected},
              "cohorts": {
                  "development": development_cohort,
                  "confirmation": confirmation,
              },
              "status": "exploratory extension after the deterministic confirmation",
          }
          protocol_lock = {
              "schema": "bayesian-phystwin-source-protocol-semantic-lock",
              "schema_version": 1,
              "source_revision": SOURCE_REVISION,
              "semantic_protocol_identity_sha256": SEMANTIC_ID,
              "legacy_path_bound_protocol_id": LEGACY_ID,
              "normalized_specification": normalized_specification,
          }
          protocol_path = Path("reproductions/full22_anchor_v1/source_protocol_semantic.json")
          protocol_path.write_text(
              json.dumps(protocol_lock, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one occurrence in {path}: {count}\n{old}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          script = Path("reproductions/full22_anchor_v1/reproduce.py")
          replace_once(
              script,
              f'''EXPECTED_PATH = CAPSULE_DIR / "expected_metrics.json"
          EXPECTED_SOURCE_REVISION = "{SOURCE_REVISION}"
          EXPECTED_PROTOCOL_ID = (
              "{LEGACY_ID}"
          )
          ''',
              f'''EXPECTED_PATH = CAPSULE_DIR / "expected_metrics.json"
          SOURCE_PROTOCOL_PATH = CAPSULE_DIR / "source_protocol_semantic.json"
          EXPECTED_SOURCE_REVISION = "{SOURCE_REVISION}"
          EXPECTED_SOURCE_PROTOCOL_SEMANTIC_ID = (
              "{SEMANTIC_ID}"
          )
          LEGACY_PATH_BOUND_SOURCE_PROTOCOL_ID = (
              "{LEGACY_ID}"
          )
          ''',
          )
          text = script.read_text(encoding="utf-8").replace(
              "EXPECTED_PROTOCOL_ID", "EXPECTED_SOURCE_PROTOCOL_SEMANTIC_ID"
          )
          script.write_text(text, encoding="utf-8")

          old_verify = '''def verify_confirmation_summary(summary: Mapping[str, Any]) -> None:
              protocol_id = summary.get("protocol_id")
              if protocol_id != EXPECTED_SOURCE_PROTOCOL_SEMANTIC_ID:
                  raise ValueError(
                      "Bayesian anchor protocol ID changed: "
                      f"expected {EXPECTED_SOURCE_PROTOCOL_SEMANTIC_ID}, received {protocol_id}"
                  )
              case_results = summary.get("case_results")
              if not isinstance(case_results, Mapping) or len(case_results) != 22:
                  raise ValueError("Bayesian anchor confirmation must contain all 22 cases")
          '''
          new_verify = '''def _expected_source_protocol_lock() -> dict[str, Any]:
              payload = json.loads(SOURCE_PROTOCOL_PATH.read_text(encoding="utf-8"))
              if payload.get("schema") != "bayesian-phystwin-source-protocol-semantic-lock":
                  raise ValueError("source protocol lock schema changed")
              if payload.get("schema_version") != 1:
                  raise ValueError("source protocol lock version changed")
              if payload.get("source_revision") != EXPECTED_SOURCE_REVISION:
                  raise ValueError("source protocol lock revision changed")
              if payload.get("semantic_protocol_identity_sha256") != (
                  EXPECTED_SOURCE_PROTOCOL_SEMANTIC_ID
              ):
                  raise ValueError("source protocol semantic identity changed")
              if payload.get("legacy_path_bound_protocol_id") != (
                  LEGACY_PATH_BOUND_SOURCE_PROTOCOL_ID
              ):
                  raise ValueError("legacy path-bound source protocol ID changed")
              specification = payload.get("normalized_specification")
              if not isinstance(specification, Mapping):
                  raise ValueError("source protocol lock has no normalized specification")
              if _canonical_sha256(specification) != EXPECTED_SOURCE_PROTOCOL_SEMANTIC_ID:
                  raise ValueError("source protocol lock content does not match its identity")
              return payload


          def source_protocol_identity(locked_protocol: Mapping[str, Any]) -> dict[str, Any]:
              if locked_protocol.get("schema_version") != 1:
                  raise ValueError("source locked protocol version changed")
              raw_protocol_id = _manifest_hex(
                  locked_protocol.get("protocol_id"),
                  name="source locked protocol ID",
                  length=64,
              )
              specification = locked_protocol.get("specification")
              if not isinstance(specification, Mapping):
                  raise ValueError("source locked protocol has no specification")
              canonical_specification = json.loads(
                  json.dumps(
                      specification,
                      sort_keys=True,
                      separators=(",", ":"),
                      allow_nan=False,
                  )
              )
              if _canonical_sha256(canonical_specification) != raw_protocol_id:
                  raise ValueError("source raw protocol ID does not bind its specification")
              data_manifest = canonical_specification.get("data_manifest")
              if not isinstance(data_manifest, Mapping):
                  raise ValueError("source protocol has no data-manifest specification")
              manifest_path = _manifest_text(
                  data_manifest.get("path"), name="source protocol data-manifest path"
              )
              manifest_basename = Path(manifest_path).name
              if manifest_basename != "evaluation_subset_manifest.json":
                  raise ValueError("source protocol used an unexpected data-manifest filename")
              normalized_data_manifest = dict(data_manifest)
              normalized_data_manifest.pop("path")
              canonical_specification["data_manifest"] = normalized_data_manifest
              expected = _expected_source_protocol_lock()
              if canonical_specification != expected["normalized_specification"]:
                  raise ValueError("source protocol semantic specification changed")
              semantic_id = _canonical_sha256(canonical_specification)
              if semantic_id != EXPECTED_SOURCE_PROTOCOL_SEMANTIC_ID:
                  raise ValueError("source protocol semantic identity changed")
              return {
                  "schema": "bayesian-phystwin-source-protocol-execution-identity",
                  "schema_version": 1,
                  "source_revision": EXPECTED_SOURCE_REVISION,
                  "raw_path_bound_protocol_id": raw_protocol_id,
                  "semantic_protocol_identity_sha256": semantic_id,
                  "legacy_path_bound_protocol_id": LEGACY_PATH_BOUND_SOURCE_PROTOCOL_ID,
                  "data_manifest_path": manifest_path,
                  "data_manifest_basename": manifest_basename,
                  "normalized_specification": canonical_specification,
              }


          def verify_confirmation_summary(
              summary: Mapping[str, Any], locked_protocol: Mapping[str, Any]
          ) -> dict[str, Any]:
              identity = source_protocol_identity(locked_protocol)
              if summary.get("protocol_id") != identity["raw_path_bound_protocol_id"]:
                  raise ValueError(
                      "confirmation summary protocol ID does not match the source lock"
                  )
              case_results = summary.get("case_results")
              if not isinstance(case_results, Mapping) or len(case_results) != 22:
                  raise ValueError("Bayesian anchor confirmation must contain all 22 cases")
              return identity
          '''
          replace_once(script, old_verify, new_verify)
          replace_once(
              script,
              '''        "data_identity=input/data_identity.json",
                  "--input",
                  "method_lock=method_lock.json",
          ''',
              '''        "data_identity=input/data_identity.json",
                  "--input",
                  "source_protocol_lock=reproduction_capsule/source_protocol_semantic.json",
                  "--input",
                  "source_protocol_identity=input/source_protocol_identity.json",
                  "--input",
                  "method_lock=method_lock.json",
          ''',
          )
          replace_once(
              script,
              '''        "confirmation_summary=run/bayesian_anchor_confirmation_summary.json",
                  "--output-artifact",
                  "full22_comparison=full22_comparison.json",
          ''',
              '''        "confirmation_summary=run/bayesian_anchor_confirmation_summary.json",
                  "--output-artifact",
                  "source_protocol_execution_lock=run/locked_protocol.json",
                  "--output-artifact",
                  "full22_comparison=full22_comparison.json",
          ''',
          )
          replace_once(
              script,
              '''    if expected.get("source_protocol_id") != EXPECTED_SOURCE_PROTOCOL_SEMANTIC_ID:
                  raise ValueError("expected metrics protocol ID changed")
          ''',
              '''    if expected.get("source_protocol_semantic_identity_sha256") != (
                  EXPECTED_SOURCE_PROTOCOL_SEMANTIC_ID
              ):
                  raise ValueError("expected metrics source protocol identity changed")
              if expected.get("legacy_path_bound_source_protocol_id") != (
                  LEGACY_PATH_BOUND_SOURCE_PROTOCOL_ID
              ):
                  raise ValueError("expected metrics legacy source protocol ID changed")
              _expected_source_protocol_lock()
          ''',
          )
          replace_once(
              script,
              '''    shutil.copy2(EXPECTED_PATH, capsule_copy / "expected_metrics.json")
          ''',
              '''    shutil.copy2(EXPECTED_PATH, capsule_copy / "expected_metrics.json")
              shutil.copy2(
                  SOURCE_PROTOCOL_PATH, capsule_copy / "source_protocol_semantic.json"
              )
          ''',
          )
          replace_once(
              script,
              '''    summary = json.loads(summary_path.read_text(encoding="utf-8"))
              verify_confirmation_summary(summary)
              _run(compare_command, cwd=source_checkout, env=source_env)
          ''',
              '''    summary = json.loads(summary_path.read_text(encoding="utf-8"))
              locked_protocol = json.loads(
                  (run_dir / "locked_protocol.json").read_text(encoding="utf-8")
              )
              protocol_identity = verify_confirmation_summary(summary, locked_protocol)
              _json_write(input_dir / "source_protocol_identity.json", protocol_identity)
              _run(compare_command, cwd=source_checkout, env=source_env)
          ''',
          )
          replace_once(
              script,
              '            "protocol_id": EXPECTED_SOURCE_PROTOCOL_SEMANTIC_ID,\n',
              '''            "protocol_id": EXPECTED_SOURCE_PROTOCOL_SEMANTIC_ID,
                  "raw_source_protocol_id": protocol_identity[
                      "raw_path_bound_protocol_id"
                  ],
                  "legacy_path_bound_source_protocol_id": (
                      LEGACY_PATH_BOUND_SOURCE_PROTOCOL_ID
                  ),
          ''',
          )
          replace_once(
              script,
              '''            "schema_version": 2,
                  "workers": args.workers,
          ''',
              '''            "schema_version": 3,
                  "workers": args.workers,
                  "source_protocol_semantic_identity_sha256": (
                      EXPECTED_SOURCE_PROTOCOL_SEMANTIC_ID
                  ),
                  "source_protocol_raw_id": protocol_identity[
                      "raw_path_bound_protocol_id"
                  ],
          ''',
          )

          expected_path = Path("reproductions/full22_anchor_v1/expected_metrics.json")
          expected = json.loads(expected_path.read_text(encoding="utf-8"))
          if expected.pop("source_protocol_id", None) != LEGACY_ID:
              raise SystemExit("unexpected historical protocol ID in expected metrics")
          expected["schema_version"] = 3
          expected["source_protocol_semantic_identity_sha256"] = SEMANTIC_ID
          expected["legacy_path_bound_source_protocol_id"] = LEGACY_ID
          expected_path.write_text(
              json.dumps(expected, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          tests = Path("tests/test_full22_reproduction_capsule.py")
          replace_once(
              tests,
              'EXPECTED_PATH = SCRIPT_PATH.with_name("expected_metrics.json")\n',
              '''EXPECTED_PATH = SCRIPT_PATH.with_name("expected_metrics.json")
          SOURCE_PROTOCOL_PATH = SCRIPT_PATH.with_name("source_protocol_semantic.json")
          ''',
          )
          replace_once(
              tests,
              '''def test_confirmation_summary_requires_protocol_and_complete_cohort() -> None:
              capsule = _load_capsule()
              summary = {
                  "protocol_id": capsule.EXPECTED_PROTOCOL_ID,
                  "case_results": {f"case-{index:02d}": {} for index in range(22)},
              }
              capsule.verify_confirmation_summary(summary)

              summary["protocol_id"] = "changed"
              with pytest.raises(ValueError, match="protocol ID changed"):
                  capsule.verify_confirmation_summary(summary)
          ''',
              '''def _locked_source_protocol(capsule: ModuleType, manifest_path: str) -> dict[str, Any]:
              expected = json.loads(SOURCE_PROTOCOL_PATH.read_text(encoding="utf-8"))
              specification = json.loads(
                  json.dumps(expected["normalized_specification"], sort_keys=True)
              )
              specification["data_manifest"]["path"] = manifest_path
              return {
                  "schema_version": 1,
                  "protocol_id": capsule._canonical_sha256(specification),
                  "specification": specification,
              }


          def test_confirmation_summary_uses_portable_protocol_identity() -> None:
              capsule = _load_capsule()
              first_lock = _locked_source_protocol(
                  capsule, "/first/cache/evaluation_subset_manifest.json"
              )
              summary = {
                  "protocol_id": first_lock["protocol_id"],
                  "case_results": {f"case-{index:02d}": {} for index in range(22)},
              }
              first_identity = capsule.verify_confirmation_summary(summary, first_lock)
              assert (
                  first_identity["semantic_protocol_identity_sha256"]
                  == capsule.EXPECTED_SOURCE_PROTOCOL_SEMANTIC_ID
              )
              second_lock = _locked_source_protocol(
                  capsule, "/second/cache/evaluation_subset_manifest.json"
              )
              second_summary = {**summary, "protocol_id": second_lock["protocol_id"]}
              second_identity = capsule.verify_confirmation_summary(
                  second_summary, second_lock
              )
              assert first_lock["protocol_id"] != second_lock["protocol_id"]
              assert (
                  first_identity["semantic_protocol_identity_sha256"]
                  == second_identity["semantic_protocol_identity_sha256"]
              )
              changed = json.loads(json.dumps(first_lock))
              changed["specification"]["method"] = "changed"
              changed["protocol_id"] = capsule._canonical_sha256(
                  changed["specification"]
              )
              changed_summary = {**summary, "protocol_id": changed["protocol_id"]}
              with pytest.raises(ValueError, match="semantic specification changed"):
                  capsule.verify_confirmation_summary(changed_summary, changed)
              mismatched_summary = {**summary, "protocol_id": "0" * 64}
              with pytest.raises(ValueError, match="does not match the source lock"):
                  capsule.verify_confirmation_summary(mismatched_summary, first_lock)
          ''',
          )
          test_text = tests.read_text(encoding="utf-8").replace(
              "capsule.EXPECTED_PROTOCOL_ID in command",
              "capsule.EXPECTED_SOURCE_PROTOCOL_SEMANTIC_ID in command",
          )
          marker = '    assert "data_identity=input/data_identity.json" in command\n'
          if test_text.count(marker) != 1:
              raise SystemExit("unexpected manifest-command test marker")
          test_text = test_text.replace(
              marker,
              marker
              + '    assert "source_protocol_lock=reproduction_capsule/source_protocol_semantic.json" in command\n'
              + '    assert "source_protocol_identity=input/source_protocol_identity.json" in command\n',
          )
          tests.write_text(test_text, encoding="utf-8")

          readme = Path("reproductions/full22_anchor_v1/README.md")
          replace_once(
              readme,
              f'''- Bayesian-anchor protocol ID:
            `{LEGACY_ID}`
          ''',
              f'''- Portable Bayesian-anchor protocol semantic identity:
            `{SEMANTIC_ID}`
          - Historical path-bound Bayesian-anchor protocol ID:
            `{LEGACY_ID}`
          ''',
          )
          replace_once(
              readme,
              '''The source checkout must be clean and at the exact recorded revision. The data
          identity binds the two public archive sources, the ordered 22-case cohort, and
          ''',
              '''The source checkout must be clean and at the exact recorded revision. The
          frozen source's raw protocol ID includes the absolute data-manifest path, so the
          capsule records that raw ID as execution provenance but admits runs through the
          committed path-normalized specification in `source_protocol_semantic.json`.
          Only the absolute path is removed; the method, hyperparameters, ordered cohort,
          development/confirmation split, and status remain bound by the portable semantic
          identity. The data identity binds the two public archive sources, the ordered
          22-case cohort, and
          ''',
          )
          lanes = Path("reproductions/full22_anchor_v1/EXECUTION_LANES.md")
          replace_once(
              lanes,
              f'''Both lanes use the exact frozen source revision
          `{SOURCE_REVISION}`, require the portable public-data
          identity''',
              f'''Both lanes use the exact frozen source revision
          `{SOURCE_REVISION}`, require the path-normalized source
          protocol semantic identity `{SEMANTIC_ID}`, require the portable public-data
          identity''',
          )
          report = Path("docs/phystwin_sota_22_v1.md")
          replace_once(
              report,
              f'- Bayesian anchor: `{LEGACY_ID}`\n',
              f'- Bayesian anchor, portable semantic identity: `{SEMANTIC_ID}`\n'
              f'- Bayesian anchor, historical path-bound ID: `{LEGACY_ID}`\n',
          )

          for workflow in (
              Path(".github/workflows/temporary-fix-full22-protocol-identity.yml"),
              Path(".github/workflows/temporary-fix-full22-protocol-identity-v2.yml"),
          ):
              workflow.unlink(missing_ok=True)
          PY

      - name: Validate repair
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff format \
            reproductions/full22_anchor_v1/reproduce.py \
            tests/test_full22_reproduction_capsule.py
          python -m ruff check \
            reproductions/full22_anchor_v1/reproduce.py \
            tests/test_full22_reproduction_capsule.py
          python -m ruff format --check \
            reproductions/full22_anchor_v1/reproduce.py \
            tests/test_full22_reproduction_capsule.py
          python -m pytest -q tests/test_full22_reproduction_capsule.py
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          payload = json.loads(
              Path("reproductions/full22_anchor_v1/source_protocol_semantic.json").read_text()
          )
          identity = hashlib.sha256(
              json.dumps(
                  payload["normalized_specification"],
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              ).encode()
          ).hexdigest()
          assert identity == payload["semantic_protocol_identity_sha256"]
          assert identity == "0d3e4eaaec1587a717ff551e6a8cc7f0d6f4ac5484e85628a328893513aa26b6"
          PY

      - name: Commit and publish repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Normalize full-22 source protocol identity"
          git push origin HEAD:agent/portable-full22-anchor-reproduction
