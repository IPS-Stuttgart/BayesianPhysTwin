name: Finalize irreversible core contract arrays

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/_one_shot_irreversible_core_arrays.yml"
      - "scripts/_one_shot_apply_irreversible_core_arrays.py"
      - "src/bayesian_phystwin/_canonical_contracts.py"
      - "src/bayesian_phystwin/observation_belief.py"
      - "src/bayesian_phystwin/physical_linearization.py"
      - "tests/test_canonical_contracts.py"
      - "tests/test_observation_belief.py"
      - "tests/test_prior_aware_and_linearization.py"
      - "CHANGELOG.md"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: irreversible-core-arrays-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  finalize:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref ==
        'agent/irreversible-core-contract-arrays-v1-final2'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply the reviewed patch and remove one-shot machinery
        run: |
          set -euo pipefail
          python scripts/_one_shot_apply_irreversible_core_arrays.py
          test ! -e scripts/_one_shot_apply_irreversible_core_arrays.py
          test ! -e .github/workflows/_one_shot_irreversible_core_arrays.yml

      - name: Install validation environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,graph]"
          python -m pip check

      - name: Format and lint the final source tree
        run: |
          set -euo pipefail
          files=(
            src/bayesian_phystwin/_canonical_contracts.py
            src/bayesian_phystwin/observation_belief.py
            src/bayesian_phystwin/physical_linearization.py
            tests/test_canonical_contracts.py
            tests/test_observation_belief.py
            tests/test_prior_aware_and_linearization.py
          )
          python -m ruff check --fix "${files[@]}"
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"

      - name: Run focused typing and contract tests
        run: |
          set -euo pipefail
          python -m mypy \
            src/bayesian_phystwin/_canonical_contracts.py \
            src/bayesian_phystwin/observation_belief.py \
            src/bayesian_phystwin/physical_linearization.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_canonical_contracts.py \
            tests/test_observation_belief.py \
            tests/test_prior_aware_and_linearization.py
          git diff --check

      - name: Publish one clean implementation commit
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/_one_shot_irreversible_core_arrays.yml \
            scripts/_one_shot_apply_irreversible_core_arrays.py \
            src/bayesian_phystwin/_canonical_contracts.py \
            src/bayesian_phystwin/observation_belief.py \
            src/bayesian_phystwin/physical_linearization.py \
            tests/test_canonical_contracts.py \
            tests/test_observation_belief.py \
            tests/test_prior_aware_and_linearization.py \
            CHANGELOG.md
          git commit -m "Make core contract arrays irreversibly immutable"
          git push origin "HEAD:${HEAD_BRANCH}"
