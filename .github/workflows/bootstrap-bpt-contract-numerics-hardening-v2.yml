name: Bootstrap BPT contract and numerical hardening v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  publish-product-branch:
    if: github.head_ref == 'agent/bootstrap-bpt-contract-numerics-hardening-20260727'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PRODUCT_BRANCH: agent/harden-bpt-contract-numerics
      DIAGNOSTIC_BRANCH: agent/bootstrap-bpt-contract-numerics-diagnostic
    steps:
      - name: Check out current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply the corrected reviewed product patch
        shell: bash
        run: |
          set -uo pipefail
          git fetch origin "${GITHUB_HEAD_REF}:refs/remotes/origin/${GITHUB_HEAD_REF}"
          git switch -c "${PRODUCT_BRANCH}" main
          set +e
          python - <<'PY' > /tmp/bpt-patch-output.txt 2>&1
          import base64
          import gzip
          import os
          import re
          import subprocess

          workflow = subprocess.check_output(
              [
                  "git",
                  "show",
                  f"origin/{os.environ['GITHUB_HEAD_REF']}:"
                  ".github/workflows/bootstrap-bpt-contract-numerics-hardening.yml",
              ],
              text=True,
          )
          match = re.search(r'payload = "([A-Za-z0-9+/=]+)"', workflow)
          if match is None:
              raise SystemExit("embedded patch payload was not found")
          source = gzip.decompress(base64.b64decode(match.group(1))).decode("utf-8")
          stale = '''    scheduled, and manual three-repository runs instead of producing a green skip.
    External-fork pull requests still run the producer-neutral consumer fixture and
    explicitly report that the secret-backed producer gate was unavailable and no
    current-Prob4D evidence was admitted.'''
          current = '''  scheduled, and manual three-repository runs instead of producing a green skip.
  External-fork pull requests still run the producer-neutral consumer fixture and
  explicitly report that the secret-backed producer gate was unavailable and no
  current-Prob4D evidence was admitted.'''
          if stale not in source:
              raise SystemExit("stale changelog replacement was not found in patch source")
          source = source.replace(stale, current, 1)
          exec(compile(source, "bpt-contract-numerics-patch.py", "exec"))
          PY
          patch_status=$?
          set -e
          if [[ ${patch_status} -ne 0 ]]; then
            cat /tmp/bpt-patch-output.txt
            git reset --hard main
            git switch -C "${DIAGNOSTIC_BRANCH}" main
            cp /tmp/bpt-patch-output.txt patch-diagnostic.txt
            git config user.name "OpenAI"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add patch-diagnostic.txt
            git commit -m "Record BPT patch diagnostic"
            git push --force origin "HEAD:refs/heads/${DIAGNOSTIC_BRANCH}"
            exit "${patch_status}"
          fi
          cat /tmp/bpt-patch-output.txt

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Format and lint the intended files
        shell: bash
        run: |
          files=(
            src/bayesian_phystwin/observation_belief.py
            src/bayesian_phystwin/grouped_likelihood.py
            src/bayesian_phystwin/phystwin_bayesian_anchor.py
            src/bayesian_phystwin/contracts/fixed_anchor.py
            tests/test_observation_belief.py
            tests/test_grouped_likelihood.py
            tests/test_causal4d_provider_v1.py
            tests/test_phystwin_bayesian_anchor.py
          )
          python -m ruff check --fix -- "${files[@]}"
          python -m ruff format -- "${files[@]}"
          python -m ruff check -- "${files[@]}"

      - name: Run focused contract and numerical tests
        run: |
          python -m pytest -q \
            tests/test_observation_belief.py \
            tests/test_observation_belief_gauge_adapter.py \
            tests/test_grouped_likelihood.py \
            tests/test_phystwin_bayesian_anchor.py \
            tests/test_causal4d_provider_v1.py \
            tests/test_prob4d_joint_contract_fixture.py

      - name: Commit and run the exact quality ratchet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            CHANGELOG.md \
            docs/causal4d_belief_provider_v1.md \
            docs/observation_belief_contract.md \
            src/bayesian_phystwin/contracts/fixed_anchor.py \
            src/bayesian_phystwin/grouped_likelihood.py \
            src/bayesian_phystwin/observation_belief.py \
            src/bayesian_phystwin/phystwin_bayesian_anchor.py \
            tests/test_causal4d_provider_v1.py \
            tests/test_grouped_likelihood.py \
            tests/test_observation_belief.py \
            tests/test_phystwin_bayesian_anchor.py
          git diff --cached --check
          git commit -m "Harden immutable observation and covariance semantics"
          python tools/quality/changed_python_quality.py --base HEAD^ --head HEAD

      - name: Publish the clean product branch
        shell: bash
        run: |
          set -euo pipefail
          git push --force-with-lease origin "HEAD:refs/heads/${PRODUCT_BRANCH}"
          {
            echo "### Published product branch"
            echo
            echo "\`${PRODUCT_BRANCH}\`"
            echo
            echo "Commit: \`$(git rev-parse HEAD)\`"
          } >> "${GITHUB_STEP_SUMMARY}"
