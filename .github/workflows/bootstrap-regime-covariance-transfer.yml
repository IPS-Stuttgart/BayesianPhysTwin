name: Bootstrap regime covariance transfer

on:
  push:
    branches:
      - agent/regime-covariance-recursive-prob4d

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/regime-covariance-recursive-prob4d
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Materialize large files
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          mapping = {
              Path("src/bayesian_phystwin/regime_covariance_calibration.py"):
                  Path(".bootstrap-regime-covariance/regime"),
              Path("tests/test_source_competence_regime_covariance_calibration.py"):
                  Path(".bootstrap-regime-covariance/regime_test"),
          }
          for target, parts_dir in mapping.items():
              encoded = "".join(
                  part.read_text(encoding="utf-8")
                  for part in sorted(parts_dir.glob("*.part"))
              )
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(encoded, validate=True))
          PY
      - name: Replace bootstrap with materialized files
        run: |
          rm -rf .bootstrap-regime-covariance
          rm .github/workflows/bootstrap-regime-covariance-transfer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize regime covariance transfer"
          git push origin HEAD:agent/regime-covariance-recursive-prob4d
