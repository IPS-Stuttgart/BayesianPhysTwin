name: Temporary format persistent visual-bias solver

on:
  push:
    branches:
      - agent/persistent-prob4d-visual-bias-solver
    paths:
      - ".github/workflows/temporary-format-persistent-visual-bias.yml"
      - "src/bayesian_phystwin/persistent_prob4d_visual_bias.py"
      - "tests/test_persistent_prob4d_visual_bias.py"

permissions:
  contents: write

concurrency:
  group: temporary-format-persistent-visual-bias
  cancel-in-progress: true

jobs:
  format:
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 10
    steps:
      - name: Check out formatter branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/persistent-prob4d-visual-bias-solver
          persist-credentials: true
          clean: true

      - name: Provision Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Format and publish exact source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "ruff==0.16.1"
          python -m ruff format \
            src/bayesian_phystwin/persistent_prob4d_visual_bias.py \
            tests/test_persistent_prob4d_visual_bias.py
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayesian_phystwin/persistent_prob4d_visual_bias.py \
            tests/test_persistent_prob4d_visual_bias.py
          git commit -m "Format persistent Prob4D visual-bias solver"
          git push origin HEAD:agent/persistent-prob4d-visual-bias-solver
