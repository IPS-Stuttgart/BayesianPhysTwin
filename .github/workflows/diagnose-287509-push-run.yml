name: Diagnose 287509 protected-main run

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-287509-push-run.yml"

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'diagnostic/track-287509-push-run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report exact push runs and paginated self-hosted queue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 287509dbebba39bc08badf3bde93e43d7f138e22
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          target = os.environ["TARGET_SHA"]
          api = f"https://api.github.com/repos/{repository}/actions"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "BayesianPhysTwin-read-only-run-diagnostic",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(url: str):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def jobs(run_id: int):
              return get(f"{api}/runs/{run_id}/jobs?per_page=100").get("jobs", [])

          query = urllib.parse.urlencode(
              {"head_sha": target, "event": "push", "per_page": 100}
          )
          runs = get(f"{api}/runs?{query}").get("workflow_runs", [])
          print(f"target_sha={target}")
          print(f"push_run_count={len(runs)}")
          for run in runs:
              run_id = int(run["id"])
              print(
                  "RUN "
                  f"id={run_id} name={run.get('name')!r} "
                  f"status={run.get('status')} conclusion={run.get('conclusion')} "
                  f"attempt={run.get('run_attempt')} url={run.get('html_url')}"
              )
              for job in jobs(run_id):
                  print(
                      "JOB "
                      f"run_id={run_id} id={job.get('id')} name={job.get('name')!r} "
                      f"status={job.get('status')} conclusion={job.get('conclusion')} "
                      f"runner_name={job.get('runner_name')!r} labels={job.get('labels')!r}"
                  )
          if not runs:
              raise SystemExit(3)

          found = []
          active_runs = 0
          for status in ("in_progress", "queued"):
              for page in range(1, 11):
                  status_query = urllib.parse.urlencode(
                      {"status": status, "per_page": 100, "page": page}
                  )
                  active = get(f"{api}/runs?{status_query}").get("workflow_runs", [])
                  if not active:
                      break
                  active_runs += len(active)
                  for run in active:
                      run_id = int(run["id"])
                      for job in jobs(run_id):
                          labels = job.get("labels") or []
                          runner_name = job.get("runner_name") or ""
                          if "self-hosted" not in labels and runner_name != "workstation2":
                              continue
                          item = (
                              status,
                              run_id,
                              run.get("name"),
                              run.get("head_sha"),
                              run.get("event"),
                              job.get("id"),
                              job.get("name"),
                              job.get("status"),
                              runner_name,
                              tuple(labels),
                              run.get("html_url"),
                          )
                          if item not in found:
                              found.append(item)
          print(f"active_runs_scanned={active_runs}")
          print(f"self_hosted_jobs_found={len(found)}")
          for item in found:
              (
                  requested_status,
                  run_id,
                  run_name,
                  head_sha,
                  event,
                  job_id,
                  job_name,
                  job_status,
                  runner_name,
                  labels,
                  url,
              ) = item
              print(
                  "SELF_HOSTED "
                  f"requested_status={requested_status} run_id={run_id} "
                  f"run_name={run_name!r} head_sha={head_sha} event={event} "
                  f"job_id={job_id} job_name={job_name!r} "
                  f"job_status={job_status} runner_name={runner_name!r} "
                  f"labels={list(labels)!r} url={url}"
              )
          PY

# Read-only refresh: scan all active-run pages without touching repository or data.
