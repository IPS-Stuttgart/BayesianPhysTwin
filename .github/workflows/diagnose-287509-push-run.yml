name: Diagnose 287509 protected-main run

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-287509-push-run.yml"

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'diagnostic/track-287509-push-run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report exact push runs, queue, and runner state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 287509dbebba39bc08badf3bde93e43d7f138e22
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          target = os.environ["TARGET_SHA"]
          api = f"https://api.github.com/repos/{repository}/actions"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "BayesianPhysTwin-read-only-run-diagnostic",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(url: str):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def jobs(run_id: int):
              return get(f"{api}/runs/{run_id}/jobs?per_page=100").get("jobs", [])

          query = urllib.parse.urlencode(
              {"head_sha": target, "event": "push", "per_page": 100}
          )
          runs = get(f"{api}/runs?{query}").get("workflow_runs", [])
          print(f"target_sha={target}")
          print(f"push_run_count={len(runs)}")
          for run in runs:
              run_id = int(run["id"])
              print(
                  "RUN "
                  f"id={run_id} name={run.get('name')!r} "
                  f"status={run.get('status')} conclusion={run.get('conclusion')} "
                  f"attempt={run.get('run_attempt')} url={run.get('html_url')}"
              )
              for job in jobs(run_id):
                  print(
                      "JOB "
                      f"run_id={run_id} id={job.get('id')} name={job.get('name')!r} "
                      f"status={job.get('status')} conclusion={job.get('conclusion')} "
                      f"runner_name={job.get('runner_name')!r} labels={job.get('labels')!r}"
                  )
          if not runs:
              raise SystemExit(3)

          seen_runs = set()
          print("SELF_HOSTED_QUEUE_BEGIN")
          for status in ("in_progress", "queued"):
              status_query = urllib.parse.urlencode({"status": status, "per_page": 30})
              active = get(f"{api}/runs?{status_query}").get("workflow_runs", [])
              for run in active:
                  run_id = int(run["id"])
                  if run_id in seen_runs:
                      continue
                  seen_runs.add(run_id)
                  for job in jobs(run_id):
                      labels = job.get("labels") or []
                      runner_name = job.get("runner_name") or ""
                      if "self-hosted" not in labels and runner_name != "workstation2":
                          continue
                      print(
                          "SELF_HOSTED "
                          f"run_id={run_id} run_name={run.get('name')!r} "
                          f"head_sha={run.get('head_sha')} event={run.get('event')} "
                          f"job_id={job.get('id')} job_name={job.get('name')!r} "
                          f"status={job.get('status')} conclusion={job.get('conclusion')} "
                          f"runner_name={runner_name!r} labels={labels!r} "
                          f"url={run.get('html_url')}"
                      )
          print("SELF_HOSTED_QUEUE_END")

          print("RUNNER_STATE_BEGIN")
          try:
              runner_payload = get(f"{api}/runners?per_page=100")
          except urllib.error.HTTPError as exc:
              print(f"RUNNER_STATE_UNAVAILABLE http_status={exc.code}")
          else:
              print(f"runner_count={runner_payload.get('total_count')}")
              for runner in runner_payload.get("runners", []):
                  labels = [label.get("name") for label in runner.get("labels", [])]
                  print(
                      "RUNNER "
                      f"name={runner.get('name')!r} status={runner.get('status')!r} "
                      f"busy={runner.get('busy')!r} labels={labels!r}"
                  )
          print("RUNNER_STATE_END")
          PY

# Read-only refresh: inspect runner availability without touching repository or data.
