name: Diagnose 287509 protected-main run

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-287509-push-run.yml"

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'diagnostic/track-287509-push-run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report exact push runs and jobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 287509dbebba39bc08badf3bde93e43d7f138e22
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          target = os.environ["TARGET_SHA"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "BayesianPhysTwin-read-only-run-diagnostic",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(url: str):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          query = urllib.parse.urlencode(
              {"head_sha": target, "event": "push", "per_page": 100}
          )
          runs = get(
              f"https://api.github.com/repos/{repository}/actions/runs?{query}"
          ).get("workflow_runs", [])
          print(f"target_sha={target}")
          print(f"push_run_count={len(runs)}")
          for run in runs:
              run_id = int(run["id"])
              print(
                  "RUN "
                  f"id={run_id} name={run.get('name')!r} "
                  f"status={run.get('status')} conclusion={run.get('conclusion')} "
                  f"attempt={run.get('run_attempt')} url={run.get('html_url')}"
              )
              jobs = get(
                  f"https://api.github.com/repos/{repository}/actions/runs/"
                  f"{run_id}/jobs?per_page=100"
              ).get("jobs", [])
              for job in jobs:
                  print(
                      "JOB "
                      f"run_id={run_id} id={job.get('id')} name={job.get('name')!r} "
                      f"status={job.get('status')} conclusion={job.get('conclusion')} "
                      f"runner_name={job.get('runner_name')!r}"
                  )
          if not runs:
              raise SystemExit(3)
          PY
