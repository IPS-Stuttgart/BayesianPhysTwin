name: Temporary repair for PR 94

on:
  push:
    branches:
      - agent/canonical-crossrepo-identity

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/canonical-crossrepo-identity
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Repair credential policy and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path(
              ".github/workflows/three-repository-golden-path.yml"
          )
          text = workflow_path.read_text(encoding="utf-8")
          text = text.replace(
              "PROB4D_CHECKOUT_REPOSITORY: FlorianPfaff/Prob4D",
              "PROB4D_CHECKOUT_REPOSITORY: IPS-Stuttgart/Prob4D",
          )
          start_marker = (
              "      - name: Report unavailable Prob4D credential for external forks\n"
          )
          end_marker = "      - name: Check out Bayesian-PhysTwin\n"
          if text.count(start_marker) != 1:
              raise SystemExit("unexpected credential-policy start marker")
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          token_expression = "$" + "{{ env.PROB4D_READ_TOKEN }}"
          status_expression = "$" + "{{ steps.prob4d-access.outputs.status }}"
          replacement = '''      - name: Probe Prob4D repository access
                id: prob4d-access
                shell: bash
                env:
                  TOKEN: __TOKEN_EXPRESSION__
                run: |
                  if [[ -z "${TOKEN}" ]]; then
                    status="missing"
                  else
                    http_status="$(
                      curl --silent --show-error \\
                        --output /dev/null \\
                        --write-out '%{http_code}' \\
                        --header "Authorization: Bearer ${TOKEN}" \\
                        --header "Accept: application/vnd.github+json" \\
                        --header "X-GitHub-Api-Version: 2022-11-28" \\
                        https://api.github.com/repos/IPS-Stuttgart/Prob4D \\
                        || true
                    )"
                    case "${http_status}" in
                      200) status="available" ;;
                      401|403|404) status="inaccessible-${http_status}" ;;
                      *) status="transport-${http_status:-unknown}" ;;
                    esac
                  fi
                  if [[ "${status}" == "available" ]]; then
                    echo "available=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "available=false" >> "$GITHUB_OUTPUT"
                    echo "status=${status}" >> "$GITHUB_OUTPUT"
                  fi

              - name: Record unavailable credentialed gate on continuous events
                if: >-
                  steps.prob4d-access.outputs.available != 'true' &&
                  (github.event_name == 'pull_request' || github.event_name == 'push')
                shell: bash
                run: |
                  echo "::warning title=Credentialed three-repository gate unavailable::" \\
                    "PROB4D_READ_TOKEN is missing or cannot read IPS-Stuttgart/Prob4D."
                  {
                    echo "### Credentialed three-repository gate unavailable"
                    echo
                    echo "Status: `__STATUS_EXPRESSION__`"
                    echo
                    echo "The always-executed BayesianPhysTwin + Causal4D consumer fixture"
                    echo "passed separately, but no current-Prob4D execution is admitted."
                    echo "Scheduled, manual, and repository-dispatch validation remains fail-closed."
                  } >> "$GITHUB_STEP_SUMMARY"

              - name: Reject unavailable credentialed gate on explicit validation events
                if: >-
                  steps.prob4d-access.outputs.available != 'true' &&
                  github.event_name != 'pull_request' &&
                  github.event_name != 'push'
                shell: bash
                run: |
                  echo "::error title=Three-repository gate unavailable::" \\
                    "PROB4D_READ_TOKEN must read IPS-Stuttgart/Prob4D for scheduled, manual, and repository-dispatch validation."
                  exit 1

          '''
          replacement = replacement.replace(
              "__TOKEN_EXPRESSION__", token_expression
          ).replace("__STATUS_EXPRESSION__", status_expression)
          text = text[:start] + replacement + text[end:]
          condition = "if: env.PROB4D_READ_TOKEN != ''"
          count = text.count(condition)
          if count != 5:
              raise SystemExit(f"expected 5 checkout conditions, found {count}")
          text = text.replace(
              condition,
              "if: steps.prob4d-access.outputs.available == 'true'",
          )
          workflow_path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_three_repository_workflow.py")
          test_text = test_path.read_text(encoding="utf-8")
          test_text = test_text.replace(
              'assert "PROB4D_CHECKOUT_REPOSITORY: FlorianPfaff/Prob4D" in text',
              'assert "PROB4D_CHECKOUT_REPOSITORY: IPS-Stuttgart/Prob4D" in text',
          )
          addition = '''

          def test_three_repository_workflow_probes_repository_access() -> None:
              text = WORKFLOW.read_text(encoding="utf-8")

              assert "id: prob4d-access" in text
              assert "https://api.github.com/repos/IPS-Stuttgart/Prob4D" in text
              assert "github.event_name != 'pull_request'" in text
              assert "github.event_name != 'push'" in text
              assert "Scheduled, manual, and repository-dispatch validation remains fail-closed" in text
          '''
          if "def test_three_repository_workflow_probes_repository_access" not in test_text:
              test_text = test_text.rstrip() + addition + "\n"
          test_path.write_text(test_text, encoding="utf-8")
          PY
          python -m pip install --disable-pip-version-check ruff==0.16.1
          python -m ruff check --fix \
            integration_tests/test_three_repository_project_identity.py \
            tests/test_three_repository_workflow.py
          python -m ruff format \
            integration_tests/test_three_repository_project_identity.py \
            tests/test_three_repository_workflow.py
          git diff --check
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet -- \
            .github/workflows/three-repository-golden-path.yml \
            integration_tests/test_three_repository_project_identity.py \
            tests/test_three_repository_workflow.py; then
            echo "No repair changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/three-repository-golden-path.yml \
            integration_tests/test_three_repository_project_identity.py \
            tests/test_three_repository_workflow.py
          git commit -m "Harden transferred-repository compatibility gate"
          git push origin HEAD:agent/canonical-crossrepo-identity
