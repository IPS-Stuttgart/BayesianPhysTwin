name: One-shot apply Deform360 result-identity repair

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/patches/deform360_calibration_result_identity.patch"
      - ".github/workflows/_one_shot_apply_deform360_result_identity.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-deform360-result-identity-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/deform360-calibration-result-identity'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install validation environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev,graph]"
          python -m pip check

      - name: Apply and validate the exact repair
        shell: bash
        run: |
          set -euo pipefail
          patch=.github/patches/deform360_calibration_result_identity.patch
          files=(
            scripts/science/inventory_deform360_calibration_prepared_source.py
            src/bayesian_phystwin/deform360_calibration_visual_execution_admission.py
            tests/test_deform360_calibration_prepared_inventory.py
            tests/test_deform360_calibration_visual_execution_admission.py
          )

          git apply --check "${patch}"
          git apply "${patch}"

          python -m ruff check --fix "${files[@]}"
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy \
            scripts/science/inventory_deform360_calibration_prepared_source.py \
            src/bayesian_phystwin/deform360_calibration_visual_execution_admission.py

          python -m pytest -q -p no:cacheprovider \
            tests/test_deform360_calibration_prepared_inventory.py \
            tests/test_deform360_calibration_visual_execution_admission.py \
            tests/test_deform360_calibration_visual_execution_admission_edges.py \
            tests/test_deform360_calibration_visual_production_plan.py \
            tests/test_deform360_calibration_retained_source_workflow.py \
            tests/test_deform360_calibration_prepared_inventory_authoritative_run.py

          python -m py_compile \
            scripts/science/inventory_deform360_calibration_prepared_source.py \
            src/bayesian_phystwin/deform360_calibration_visual_execution_admission.py \
            tests/test_deform360_calibration_prepared_inventory.py \
            tests/test_deform360_calibration_visual_execution_admission.py

          rm -f \
            .github/patches/deform360_calibration_result_identity.patch \
            .github/workflows/_one_shot_apply_deform360_result_identity.yml
          git diff --check

      - name: Commit and publish reviewed source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bind Deform360 result file and semantic identities"
          git push origin HEAD:fix/deform360-calibration-result-identity
