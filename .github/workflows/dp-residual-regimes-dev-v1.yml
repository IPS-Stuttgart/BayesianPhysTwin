# workflow-lifecycle: permanent
# workflow-owner: IPS-Stuttgart maintainers
name: DP residual regimes development v1

on:
  pull_request:
    paths:
      - '.github/workflows/dp-residual-regimes-dev-v1.yml'
      - 'experiments/dp_residual_regimes_dev_v1/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dp-residual-regimes-dev-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  experiment:
    if: github.repository == 'IPS-Stuttgart/BayesianPhysTwin' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 25
    env:
      SOURCE_ROOT: /home/github-runner/.cache/workflows/deform-dlo45-time-budget-recovery-v3/runs/33361441865-1
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/scripts/remote:${{ github.workspace }}
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prepare isolated CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/dp-env-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          py="$RUNNER_TEMP/dp-env-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/bin/python"
          "$py" -m pip install 'numpy==2.2.6' 'scipy==1.15.3' 'scikit-learn==1.8.0' 'pytest==8.4.2'
          echo "PY=$py" >> "$GITHUB_ENV"
          output="$RUNNER_TEMP/dp-residual-regimes-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$output"
          echo "OUTPUT=$output" >> "$GITHUB_ENV"
      - name: Inspect already-opened source caches only
        shell: bash
        run: |
          set -euo pipefail
          "$PY" - <<'PY'
          import json, os
          from pathlib import Path
          import numpy as np
          root = Path(os.environ['SOURCE_ROOT'])
          for dlo in ('dlo4', 'dlo5'):
              directory = root / (dlo + '-source')
              print('SOURCE_DIRECTORY', directory, flush=True)
              for name in ('source_result.json', 'source_manifest.json', 'method_seal.json', 'prediction_seal.json', 'source_predictions.npz'):
                  p = directory / name
                  print(name, p.exists(), p.stat().st_size if p.exists() else None, flush=True)
              result = json.loads((directory / 'source_result.json').read_text())
              print('SOURCE_METADATA', json.dumps({k: result.get(k) for k in ('source_manifest', 'prediction_seal', 'source_test_opened', 'target_eval_read')}, sort_keys=True), flush=True)
              with np.load(directory / 'source_predictions.npz', allow_pickle=False) as z:
                  print('SOURCE_ARRAYS', {k: list(z[k].shape) for k in ('names', 'physical', 'candidate')}, flush=True)
                  print('SOURCE_NAMES', z['names'].tolist(), flush=True)
          PY
      - name: Test and execute development experiment
        shell: bash
        run: |
          set -euo pipefail
          if test -f experiments/dp_residual_regimes_dev_v1/run.py; then
            "$PY" -m pytest -q experiments/dp_residual_regimes_dev_v1/test_model.py
            "$PY" -m experiments.dp_residual_regimes_dev_v1.run --source-root "$SOURCE_ROOT" --output "$OUTPUT" | tee "$OUTPUT/run.log"
            cat "$OUTPUT/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Source-cache inventory only. No DP experiment executed in this revision.' | tee "$OUTPUT/inventory-only.txt"
          fi
      - name: Retain development evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dp-residual-regimes-dev-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT }}
          if-no-files-found: warn
          retention-days: 90
