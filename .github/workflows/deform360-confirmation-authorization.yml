name: Deform360 confirmation authorization contracts

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deform360-confirmation-authorization.yml"
      - "docs/deform360_confirmation_opening_authorization_v1.md"
      - "scripts/science/seal_deform360_calibration_with_observability.py"
      - "src/bayesian_phystwin/deform360_calibration_observability_binding.py"
      - "tests/test_deform360_calibration_observability_binding.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deform360-confirmation-authorization-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  contracts:
    name: Confirmation authorization / Python ${{ matrix.python-version }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install exact source and quality tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1"
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Check focused source quality
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/bayesian_phystwin/deform360_calibration_observability_binding.py
            scripts/science/seal_deform360_calibration_with_observability.py
            tests/test_deform360_calibration_observability_binding.py
          )
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy \
            src/bayesian_phystwin/deform360_calibration_observability_binding.py \
            scripts/science/seal_deform360_calibration_with_observability.py

      - name: Run focused and adjacent contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -p no:cacheprovider \
            tests/test_deform360_calibration_observability_binding.py \
            tests/test_deform360_calibration_observability_report.py \
            tests/test_deform360_calibration_execution.py \
            tests/test_deform360_calibration_source_run_record.py
          python -m py_compile \
            src/bayesian_phystwin/deform360_calibration_observability_binding.py \
            scripts/science/seal_deform360_calibration_with_observability.py \
            tests/test_deform360_calibration_observability_binding.py

      - name: Verify exact read-only repository state
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"

  tree-identity:
    name: Temporary exact branch tree identity
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Print exact tree identity
        shell: bash
        run: |
          set -euo pipefail
          printf 'BRANCH_TREE_SHA=%s\n' "$(git rev-parse 'HEAD^{tree}')"
