name: Relocate recursive-corruption v2 once

on:
  push:
    branches:
      - science/recursive-corruption-v2-matched-guards

permissions:
  contents: write

jobs:
  relocate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: science/recursive-corruption-v2-matched-guards
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Move the evidence instrument outside the stable wheel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/bayesian_phystwin_experiments
          git mv \
            src/bayesian_phystwin/recursive_corruption_benchmark_v2.py \
            src/bayesian_phystwin_experiments/recursive_corruption_benchmark_v2.py
          python - <<'PY'
          from pathlib import Path

          old = "bayesian_phystwin.recursive_corruption_benchmark_v2"
          new = "bayesian_phystwin_experiments.recursive_corruption_benchmark_v2"
          paths = [
              Path("tests/test_recursive_corruption_benchmark_v2.py"),
              Path("scripts/science/run_recursive_corruption_v2.py"),
              Path("scripts/science/analyze_recursive_corruption_v2.py"),
              Path("docs/recursive_corruption_benchmark_v2.md"),
          ]
          for path in paths:
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected import/invocation not found in {path}")
              path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          python -m pip install -e ".[dev]"
          python -m ruff format \
            src/bayesian_phystwin_experiments/recursive_corruption_benchmark_v2.py \
            tests/test_recursive_corruption_benchmark_v2.py \
            scripts/science/run_recursive_corruption_v2.py \
            scripts/science/analyze_recursive_corruption_v2.py
          python -m ruff check \
            src/bayesian_phystwin_experiments/recursive_corruption_benchmark_v2.py \
            tests/test_recursive_corruption_benchmark_v2.py \
            scripts/science/run_recursive_corruption_v2.py \
            scripts/science/analyze_recursive_corruption_v2.py
          PYTHONPATH=src python -m pytest -q tests/test_recursive_corruption_benchmark_v2.py
          rm .github/workflows/relocate-recursive-corruption-v2-once.yml
          git diff --check
      - name: Commit relocation and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests scripts docs \
            .github/workflows/relocate-recursive-corruption-v2-once.yml
          git commit -m "Keep recursive-corruption v2 outside the stable wheel"
          git push origin HEAD:science/recursive-corruption-v2-matched-guards
