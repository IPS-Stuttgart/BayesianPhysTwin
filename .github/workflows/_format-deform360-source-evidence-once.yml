name: Format Deform360 source evidence once

on:
  push:
    branches:
      - agent/deform360-joint-sparse-source-evidence-v5
    paths:
      - .github/workflows/_format-deform360-source-evidence-once.yml

permissions:
  contents: write

concurrency:
  group: format-deform360-source-evidence-once
  cancel-in-progress: false

jobs:
  format:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.ref == 'refs/heads/agent/deform360-joint-sparse-source-evidence-v5'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/deform360-joint-sparse-source-evidence-v5
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply Ruff formatting and publish
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = \
            "agent/deform360-joint-sparse-source-evidence-v5"
          python -m pip install --disable-pip-version-check "ruff==0.16.2"
          files=(
            src/bayesian_phystwin/deform360_joint_sparse_source_evidence_v5.py
            tests/test_deform360_joint_sparse_source_evidence_v5.py
          )
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          git rm .github/workflows/_format-deform360-source-evidence-once.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "Format Deform360 source evidence contracts"
          git push origin HEAD:agent/deform360-joint-sparse-source-evidence-v5
