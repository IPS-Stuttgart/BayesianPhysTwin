name: Diagnose 41386 v6 source run

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-41386-v6-source-run.yml"

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'diagnostic/track-41386-v6-source-run'
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 5
    steps:
      - name: Print bounded error context from source job
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: "93874930177"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import io
          import os
          import urllib.error
          import urllib.request
          import zipfile

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          repository = os.environ["GITHUB_REPOSITORY"]
          job_id = os.environ["JOB_ID"]
          api_request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/actions/jobs/{job_id}/logs",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "User-Agent": "BayesianPhysTwin-bounded-log-diagnostic",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          opener = urllib.request.build_opener(NoRedirect())
          try:
              opener.open(api_request, timeout=30)
          except urllib.error.HTTPError as error:
              if error.code not in {301, 302, 303, 307, 308}:
                  raise
              location = error.headers.get("Location")
          else:
              raise SystemExit("job log endpoint did not return a signed redirect")
          if not location:
              raise SystemExit("job log redirect omitted its signed location")
          signed_request = urllib.request.Request(
              location,
              headers={"User-Agent": "BayesianPhysTwin-bounded-log-diagnostic"},
          )
          with urllib.request.urlopen(signed_request, timeout=60) as response:
              payload = response.read()

          streams: list[tuple[str, str]] = []
          try:
              with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                  for name in sorted(archive.namelist()):
                      if name.endswith("/"):
                          continue
                      streams.append(
                          (name, archive.read(name).decode("utf-8", errors="replace"))
                      )
          except zipfile.BadZipFile:
              streams.append(("job.log", payload.decode("utf-8", errors="replace")))

          text = "\n".join(
              f"===== {name} =====\n{content}" for name, content in streams
          )
          lines = text.splitlines()
          terms = (
              "error",
              "failed",
              "failure",
              "traceback",
              "valueerror",
              "systemexit",
              "no such file",
              "not found",
              "changed",
              "stage=",
              "repair",
              "selector",
              "receipt",
              "source execution",
              "process completed",
          )
          matches = [
              line for line in lines if any(term in line.lower() for term in terms)
          ]
          print(f"job_id={job_id}")
          print(f"log_bytes={len(payload)}")
          print(f"log_lines={len(lines)}")
          print("MATCHED_CONTEXT_BEGIN")
          for line in matches[-250:]:
              print(line)
          print("MATCHED_CONTEXT_END")
          print("TAIL_BEGIN")
          for line in lines[-250:]:
              print(line)
          print("TAIL_END")
          PY
