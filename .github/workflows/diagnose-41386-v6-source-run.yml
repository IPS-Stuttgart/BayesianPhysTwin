name: Diagnose 41386 v6 source run

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-41386-v6-source-run.yml"

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'diagnostic/track-41386-v6-source-run'
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 5
    steps:
      - name: Report exact protected-main push runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 41386b3c6a8709f05460a23182dd9cffa3e3aff0
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          target = os.environ["TARGET_SHA"]
          api = f"https://api.github.com/repos/{repository}/actions"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "User-Agent": "BayesianPhysTwin-read-only-run-diagnostic",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(url: str):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def jobs(run_id: int):
              return get(f"{api}/runs/{run_id}/jobs?per_page=100").get("jobs", [])

          query = urllib.parse.urlencode(
              {"head_sha": target, "event": "push", "per_page": 100}
          )
          runs = get(f"{api}/runs?{query}").get("workflow_runs", [])
          print(f"target_sha={target}")
          print(f"push_run_count={len(runs)}")
          for run in runs:
              run_id = int(run["id"])
              print(
                  "RUN "
                  f"id={run_id} name={run.get('name')!r} "
                  f"status={run.get('status')} conclusion={run.get('conclusion')} "
                  f"attempt={run.get('run_attempt')} url={run.get('html_url')}"
              )
              for job in jobs(run_id):
                  print(
                      "JOB "
                      f"run_id={run_id} id={job.get('id')} name={job.get('name')!r} "
                      f"status={job.get('status')} conclusion={job.get('conclusion')} "
                      f"runner_name={job.get('runner_name')!r} labels={job.get('labels')!r}"
                  )
          if not runs:
              raise SystemExit(3)
          PY
