# workflow-lifecycle: permanent
# workflow-owner: IPS-Stuttgart maintainers
name: Tracking cloth branch repair

on:
  push:
    branches: [science/tracking-cloth-evaluation-v1]

permissions:
  contents: write

concurrency:
  group: tracking-cloth-branch-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'IPS-Stuttgart/BayesianPhysTwin'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: science/tracking-cloth-evaluation-v1
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Harden, format, test, and commit
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r experiments/tracking_cloth_deformation_v1/requirements.txt pytest 'ruff==0.16.5'
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/tracking-cloth-evaluation.yml')
          text = path.read_text()
          old = "    if: github.event_name == 'workflow_dispatch' && github.repository == 'IPS-Stuttgart/BayesianPhysTwin'\n"
          new = (
              "    if: >-\n"
              "      github.event_name == 'workflow_dispatch' &&\n"
              "      github.ref == 'refs/heads/main' &&\n"
              "      github.repository == 'IPS-Stuttgart/BayesianPhysTwin'\n"
          )
          if old not in text:
              raise SystemExit('Expected evaluation guard not found; refusing an ambiguous edit')
          path.write_text(text.replace(old, new, 1))
          PY
          python -m ruff check --fix experiments/tracking_cloth_deformation_v1 tests/test_tracking_cloth_deformation_v1.py
          python -m ruff format experiments/tracking_cloth_deformation_v1 tests/test_tracking_cloth_deformation_v1.py
          python -m pytest -q tests/test_tracking_cloth_deformation_v1.py
          rm .github/workflows/_tracking-cloth-branch-repair.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden and format tracking cloth evaluation'
          python tools/quality/check_workflow_policy.py --base origin/main --head "$(git rev-parse HEAD)"
          git push origin HEAD:science/tracking-cloth-evaluation-v1
