# workflow-lifecycle: permanent
# workflow-owner: IPS-Stuttgart maintainers
name: Tracking cloth branch repair

on:
  push:
    branches: [science/tracking-cloth-evaluation-v1]

permissions:
  contents: write

concurrency:
  group: tracking-cloth-branch-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'IPS-Stuttgart/BayesianPhysTwin'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: science/tracking-cloth-evaluation-v1
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Format, test, and commit Python only
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r experiments/tracking_cloth_deformation_v1/requirements.txt pytest 'ruff==0.16.5'
          python -m ruff check --fix experiments/tracking_cloth_deformation_v1 tests/test_tracking_cloth_deformation_v1.py
          python -m ruff format experiments/tracking_cloth_deformation_v1 tests/test_tracking_cloth_deformation_v1.py
          python -m pytest -q tests/test_tracking_cloth_deformation_v1.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/tracking_cloth_deformation_v1 tests/test_tracking_cloth_deformation_v1.py
          if git diff --cached --quiet; then
            echo 'No Python changes required.'
            exit 0
          fi
          git commit -m 'Format tracking cloth evaluation'
          git push origin HEAD:science/tracking-cloth-evaluation-v1
