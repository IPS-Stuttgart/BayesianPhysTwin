name: Diagnose PR 11 mypy

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/reproducibility-cli-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Capture mypy result
        shell: bash
        run: |
          set +e
          python -m mypy --show-error-context --show-error-codes --pretty \
            src/bayesian_phystwin/run_manifest.py \
            src/bayesian_phystwin/cli/main.py \
            src/bayesian_phystwin/cli/run_manifest.py \
            > mypy-output.txt 2>&1
          status=$?
          printf 'mypy_status=%s\n' "$status" > status.txt
          cat status.txt
          cat mypy-output.txt
          exit 0
      - uses: actions/upload-artifact@v7
        with:
          name: pr11-mypy-diagnostics
          path: |
            status.txt
            mypy-output.txt
          retention-days: 2
