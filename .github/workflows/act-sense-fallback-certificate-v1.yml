name: Act-sense-fallback certificate v1

on:
  pull_request:
    paths:
      - ".github/workflows/act-sense-fallback-certificate-v1.yml"
      - "src/bayesian_phystwin/act_sense_fallback_certificate_v1.py"
      - "tests/test_act_sense_fallback_certificate_v1.py"
      - "docs/act_sense_fallback_certificate_v1.md"
      - "experiments/act_sense_fallback_occluded_rope_v1/**"
      - "CHANGELOG.d/act-sense-fallback-certificate-v1.md"
  push:
    branches: [main]
    paths:
      - "src/bayesian_phystwin/act_sense_fallback_certificate_v1.py"
      - "tests/test_act_sense_fallback_certificate_v1.py"
      - "experiments/act_sense_fallback_occluded_rope_v1/**"

permissions:
  contents: read

jobs:
  focused:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install focused test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Validate implementation and controlled result
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check \
            src/bayesian_phystwin/act_sense_fallback_certificate_v1.py \
            tests/test_act_sense_fallback_certificate_v1.py \
            experiments/act_sense_fallback_occluded_rope_v1/run.py
          python -m ruff format --check \
            src/bayesian_phystwin/act_sense_fallback_certificate_v1.py \
            tests/test_act_sense_fallback_certificate_v1.py \
            experiments/act_sense_fallback_occluded_rope_v1/run.py
          python -m pytest -q tests/test_act_sense_fallback_certificate_v1.py
          python -m experiments.act_sense_fallback_occluded_rope_v1.run --check
