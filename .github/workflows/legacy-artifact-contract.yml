name: Export V2 coverage repair

on:
  pull_request:
    branches: [main]
    paths:
      - "src/bayesian_phystwin/causal4d_artifacts_v2.py"
      - "tests/test_causal4d_artifacts_v2.py"
      - ".github/workflows/legacy-artifact-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-v2-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/hash-lock-released-visual-inputs-v2')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development and coverage tools
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "coverage==7.13.3"
      - name: Format and validate defensive V2 suite
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format tests/test_causal4d_artifacts_v2.py
          python -m ruff check \
            src/bayesian_phystwin/causal4d_artifacts_v2.py \
            tests/test_causal4d_artifacts_v2.py
          python -m pytest -q tests/test_causal4d_artifacts_v2.py
          python -m coverage erase
          python -m coverage run --branch \
            --source=bayesian_phystwin.causal4d_artifacts_v2 \
            -m pytest -q tests/test_causal4d_artifacts_v2.py
          python -m coverage report --show-missing | tee v2-coverage.txt
      - name: Prepare permanent workflow files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          tests_path = Path('.github/workflows/tests.yml')
          tests = tests_path.read_text(encoding='utf-8')
          anchor = '            tests/test_legacy_artifacts.py \\\n'
          addition = anchor + '            tests/test_causal4d_artifacts_v2.py \\\n'
          if tests.count(anchor) != 3:
              raise RuntimeError(
                  f'expected three test-matrix anchors, found {tests.count(anchor)}'
              )
          tests_path.write_text(tests.replace(anchor, addition), encoding='utf-8')

          permanent = subprocess.run(
              ['git', 'show', 'HEAD^^:.github/workflows/legacy-artifact-contract.yml'],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          path_anchor = '      - "tests/test_legacy_artifacts.py"\n'
          path_addition = (
              path_anchor + '      - "tests/test_causal4d_artifacts_v2.py"\n'
          )
          if permanent.count(path_anchor) != 2:
              raise RuntimeError('expected two permanent path anchors')
          permanent = permanent.replace(path_anchor, path_addition)
          command_anchor = '          tests/test_legacy_artifacts.py\n'
          command_addition = (
              command_anchor + '          tests/test_causal4d_artifacts_v2.py\n'
          )
          if permanent.count(command_anchor) != 2:
              raise RuntimeError('expected two quality command anchors')
          permanent = permanent.replace(command_anchor, command_addition)
          pytest_anchor = (
              '        run: python -m pytest -q tests/test_legacy_artifacts.py\n'
          )
          pytest_addition = (
              '        run: >-\n'
              '          python -m pytest -q\n'
              '          tests/test_legacy_artifacts.py\n'
              '          tests/test_causal4d_artifacts_v2.py\n'
          )
          if permanent.count(pytest_anchor) != 1:
              raise RuntimeError('expected permanent pytest anchor')
          Path('.github/workflows/legacy-artifact-contract.yml').write_text(
              permanent.replace(pytest_anchor, pytest_addition),
              encoding='utf-8',
          )
          PY
          git diff --check
      - name: Upload exact cleaned files
        uses: actions/upload-artifact@v7
        with:
          name: released-visual-inputs-v2-coverage-repair
          path: |
            .github/workflows/tests.yml
            .github/workflows/legacy-artifact-contract.yml
            tests/test_causal4d_artifacts_v2.py
            v2-coverage.txt
          if-no-files-found: error
          retention-days: 3
