name: Format DEFORM adapter controls temporary

on:
  push:
    branches:
      - science/deform-dlo45-adapter-controls-v1
    paths:
      - .github/requests/format-deform-adapter-controls-temp.json

permissions:
  contents: write

concurrency:
  group: format-deform-adapter-controls-temp
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: science/deform-dlo45-adapter-controls-v1
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply pinned Ruff formatting and commit only formatting changes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "ruff==0.16.5"
          files=(
            experiments/deform_dlo45_adapter_controls_v1/evaluate.py
            tests/test_deform_dlo45_adapter_controls_v1.py
          )
          python -m ruff check "${files[@]}"
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          git diff --check
          test -n "$(git status --porcelain -- "${files[@]}")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "Format DEFORM adapter-control evaluator"
          git push origin HEAD:science/deform-dlo45-adapter-controls-v1
