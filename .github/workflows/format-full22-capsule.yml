name: Format full-22 reproduction capsule

on:
  push:
    branches: [agent/full22-reproduction-capsule]
    paths:
      - ".github/workflows/format-full22-capsule.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/full22-reproduction-capsule
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Apply the repository formatter
        run: |
          python -m pip install -e ".[dev]"
          python -m ruff check --fix \
            reproductions/full22_anchor_v1/reproduce.py \
            tests/test_full22_reproduction_capsule.py
          python -m ruff format \
            reproductions/full22_anchor_v1/reproduce.py \
            tests/test_full22_reproduction_capsule.py
          rm .github/workflows/format-full22-capsule.yml
      - name: Commit the formatted product files and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            reproductions/full22_anchor_v1/reproduce.py \
            tests/test_full22_reproduction_capsule.py \
            .github/workflows/format-full22-capsule.yml
          git diff --cached --check
          git commit -m "Format full-22 reproduction capsule"
          git push origin HEAD:agent/full22-reproduction-capsule
