# workflow-lifecycle: temporary scientific queue maintenance
# workflow-owner: IPS-Stuttgart maintainers
name: Cancel redundant same-mean covariance audit

on:
  push:
    branches:
      - science/deform360-dependence-query-v6-bound-carrier-recovery-v1
    paths:
      - .github/requests/cancel-redundant-same-mean-audit-v1.json

permissions:
  actions: write
  contents: write

jobs:
  cancel-and-retire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Authorize one add-only cancellation request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          test "${PUSH_FORCED}" = false
          test "${BEFORE_SHA}" != 0000000000000000000000000000000000000000
          mapfile -t changed < <(git diff --name-status "${BEFORE_SHA}" "${GITHUB_SHA}")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = \
            $'A\t.github/requests/cancel-redundant-same-mean-audit-v1.json'
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          request = json.loads(
              Path(
                  ".github/requests/cancel-redundant-same-mean-audit-v1.json"
              ).read_text(encoding="utf-8")
          )
          parent = subprocess.check_output(
              ["git", "rev-parse", "HEAD^"], text=True
          ).strip()
          expected = {
              "schema": "bayesian-phystwin/cancel-redundant-workflow-run-v1",
              "run_id": 33498020749,
              "reason": "superseded-by-decision-level-bound-carrier-recovery-run-33528032875",
              "expected_source_revision": parent,
          }
          if request != expected:
              raise SystemExit("cancellation request differs from its source-bound schema")
          PY
      - name: Cancel only the explicitly superseded queued run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/33498020749"
          status="$({
            curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}"
          } | python -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
          case "${status}" in
            queued|pending|in_progress|waiting|requested)
              curl --fail --silent --show-error \
                --request POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${api}/cancel" >/dev/null
              ;;
            completed)
              echo "superseded run is already terminal"
              ;;
            *)
              echo "unexpected run status: ${status}" >&2
              exit 1
              ;;
          esac
      - name: Retire cancellation control plane
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/requests/cancel-redundant-same-mean-audit-v1.json \
            .github/workflows/cancel-redundant-same-mean-audit-v1.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m "Retire redundant-audit cancellation control plane"
          git push origin HEAD:science/deform360-dependence-query-v6-bound-carrier-recovery-v1
