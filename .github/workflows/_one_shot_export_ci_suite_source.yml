name: Export source for CI suite refactor

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/_one_shot_export_ci_suite_source.yml"

permissions:
  contents: read

concurrency:
  group: export-ci-suite-source-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  export:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/centralize-ci-test-suites'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Archive exact source tree
        run: |
          set -euo pipefail
          tar --exclude=.git -czf "$RUNNER_TEMP/bayesian-phystwin-source.tgz" .
          sha256sum "$RUNNER_TEMP/bayesian-phystwin-source.tgz" \
            > "$RUNNER_TEMP/bayesian-phystwin-source.tgz.sha256"

      - name: Upload source archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: ci-suite-source-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/bayesian-phystwin-source.tgz
            ${{ runner.temp }}/bayesian-phystwin-source.tgz.sha256
          if-no-files-found: error
          retention-days: 2
