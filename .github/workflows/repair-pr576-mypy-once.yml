name: Repair PR 576 MyPy issues once

on:
  push:
    branches:
      - agent/registered-residual-history-single-path-v1
    paths:
      - .github/workflows/repair-pr576-mypy-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v7
        with:
          ref: agent/registered-residual-history-single-path-v1
          fetch-depth: 0

      - name: Apply narrow typing repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/bayesian_phystwin/deform360_registered_residual_history_v1.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "    bins = np.empty(future_count, dtype=np.int64)\n": (
                  "    bins: np.ndarray = np.empty(future_count, dtype=np.int64)\n"
              ),
              "    indices = np.arange(future_count, dtype=np.int64)\n": (
                  "    indices: np.ndarray = np.arange(future_count, dtype=np.int64)\n"
              ),
              "        for name, value in digests.items():\n"
              "            object.__setattr__(self, name, value)\n": (
                  "        for digest_name, digest_value in digests.items():\n"
                  "            object.__setattr__(self, digest_name, digest_value)\n"
              ),
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one occurrence of {old!r}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify formatting, lint, and typing
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m ruff format --check src/bayesian_phystwin/deform360_registered_residual_history_v1.py
          python -m ruff check src/bayesian_phystwin/deform360_registered_residual_history_v1.py
          python -m mypy src/bayesian_phystwin/deform360_registered_residual_history_v1.py

      - name: Commit repair and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-pr576-mypy-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bayesian_phystwin/deform360_registered_residual_history_v1.py .github/workflows/repair-pr576-mypy-once.yml
          git commit -m 'Fix residual-history typing'
          git push origin HEAD:agent/registered-residual-history-single-path-v1
