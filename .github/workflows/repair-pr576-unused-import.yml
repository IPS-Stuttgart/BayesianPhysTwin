name: Repair PR 576 unused import

on:
  push:
    branches:
      - agent/registered-residual-history-single-path-v1
    paths:
      - .github/workflows/repair-pr576-unused-import.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/registered-residual-history-single-path-v1
          fetch-depth: 0

      - name: Remove unused import and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/bayesian_phystwin/deform360_registered_residual_history_v1.py")
          text = path.read_text(encoding="utf-8")
          old = "from collections.abc import Mapping, Sequence\n"
          new = "from collections.abc import Mapping\n"
          if text.count(old) != 1:
              raise SystemExit("expected exactly one Mapping, Sequence import")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          rm .github/workflows/repair-pr576-unused-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bayesian_phystwin/deform360_registered_residual_history_v1.py .github/workflows/repair-pr576-unused-import.yml
          git commit -m "Remove unused residual-history import"
          git push origin HEAD:agent/registered-residual-history-single-path-v1
