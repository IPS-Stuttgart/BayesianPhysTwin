name: DEFORM trajectory-conformal active sensing

on:
  pull_request:
    paths:
      - ".github/workflows/deform-dlo45-conformal-active-sensing-v1.yml"
      - "experiments/deform_dlo45_conformal_active_sensing_v1/**"
      - "tests/test_deform_dlo45_conformal_active_sensing_v1.py"
  push:
    branches:
      - science/deform-dlo45-conformal-active-sensing-v1
    paths:
      - ".github/workflows/deform-dlo45-conformal-active-sensing-v1.yml"
      - "experiments/deform_dlo45_conformal_active_sensing_v1/**"
      - "tests/test_deform_dlo45_conformal_active_sensing_v1.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: conformal-active-sensing-v1-${{ github.ref }}
  cancel-in-progress: true

env:
  PARENT_ARTIFACT_ID: "9839951506"
  PARENT_ARTIFACT_SHA256: >-
    31ddbb20dc084514afb6b021ec4f6b0bdff72e22124c4734fb18b1952b347889
  EXPERIMENT: experiments/deform_dlo45_conformal_active_sensing_v1
  PYTHONHASHSEED: "0"

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install focused runtime
        run: python -m pip install "numpy==2.2.6" "pytest==8.4.1"

      - name: Download and authenticate immutable parent artifact
        id: parent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            "/repos/IPS-Stuttgart/BayesianPhysTwin/actions/artifacts/${PARENT_ARTIFACT_ID}/zip" \
            > parent.zip
          echo "${PARENT_ARTIFACT_SHA256}  parent.zip" | sha256sum --check --strict
          mkdir parent-artifact
          unzip -q parent.zip -d parent-artifact
          parent_dir=$(find parent-artifact -type f -name result.json \
            ! -path '*/core/*' -printf '%h\n' | sort -u | head -n 1)
          test -n "$parent_dir"
          test -f "$parent_dir/core/result.json"
          test -f "$parent_dir/core/calibration_cases.jsonl"
          test -f "$parent_dir/core/source_test_cases.jsonl"
          echo "dir=$parent_dir" >> "$GITHUB_OUTPUT"

      - name: Run focused tests including exact artifact replay
        env:
          DEFORM_DLO45_V3_PARENT_DIR: ${{ steps.parent.outputs.dir }}
        run: |
          python -m pytest -q \
            tests/test_deform_dlo45_conformal_active_sensing_v1.py

      - name: Regenerate and compare retained result
        env:
          PARENT_DIR: ${{ steps.parent.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf generated
          python -m experiments.deform_dlo45_conformal_active_sensing_v1.analyze \
            --parent-dir "$PARENT_DIR" \
            --protocol "$EXPERIMENT/protocol.json" \
            --output-dir generated
          cmp generated/compact_result.json "$EXPERIMENT/compact_result.json"
          cat generated/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Validate bounded result semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("generated/result.json").read_text())
          point = result["primary_result"]
          assert result["contract"] == (
              "deform-dlo45-conformal-active-sensing-v1"
          )
          assert result["primary_selection"]["selected_regret_budget"] == 0.3
          assert point["nonfallback_count"] == 251
          assert point["harmful_nonfallback_count"] == 0
          assert point["envelope_exceed_trajectory_count"] == 3
          assert point["regret_budget_exceed_trajectory_count"] == 2
          assert point["empirical_simultaneous_trajectory_coverage"] == 0.8125
          assert point["state_ambiguous_fraction_when_acting"] < 1.0
          assert "retrospective" in result["status"]
          assert "unseen-object" in result["claim_boundary"]
          PY

      - name: Upload full replay evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: deform-dlo45-conformal-active-sensing-v1-${{ github.sha }}
          path: |
            generated/**
            experiments/deform_dlo45_conformal_active_sensing_v1/**
          if-no-files-found: error
          retention-days: 90
