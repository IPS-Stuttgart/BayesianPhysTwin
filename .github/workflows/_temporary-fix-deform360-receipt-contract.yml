name: Temporary exact Deform360 receipt contract repair

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - '.github/workflows/_temporary-fix-deform360-receipt-contract.yml'
      - '.github/workflows/deform360-official-hub-calibration-source-reusable.yml'

permissions:
  contents: write

jobs:
  repair-and-validate:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact same-repository PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify exact reviewed head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git branch --show-current)" = "${GITHUB_HEAD_REF}"

      - name: Join the unchanged non-sensitive receipt sentence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(
              '.github/workflows/'
              'deform360-official-hub-calibration-source-reusable.yml'
          )
          text = path.read_text(encoding='utf-8')
          old = '''                  (
                      "This receipt contains no local paths, object identities, "
                      "or target outcomes."
                  ),
'''
          new = '''                  (
                      "This receipt contains no local paths, object identities, or target outcomes."
                  ),
'''
          if text.count(old) != 1:
              raise SystemExit(
                  f'exact completion-receipt sentence occurred {text.count(old)} times'
              )
          updated = text.replace(old, new)
          if updated.count(
              'local paths, object identities, or target outcomes'
          ) != 1:
              raise SystemExit('joined non-sensitive receipt phrase is not unique')
          path.write_text(updated, encoding='utf-8')
          PY

          expected='.github/workflows/deform360-official-hub-calibration-source-reusable.yml'
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "${expected}"
          git diff --check

      - name: Validate the repaired workflow contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pytest -q \
            tests/test_deform360_calibration_source_direct_workflow.py \
            tests/test_deform360_calibration_source_workflow.py \
            tests/test_deform360_official_hub_calibration_source.py
          python - <<'PY'
          from pathlib import Path

          path = Path(
              '.github/workflows/'
              'deform360-official-hub-calibration-source-reusable.yml'
          )
          text = path.read_text(encoding='utf-8')
          completion = text.index(
              '- name: Publish non-sensitive completion receipt'
          )
          upload = text.index('- name: Publish compact calibration-source evidence')
          block = text[completion:upload]
          phrase = 'local paths, object identities, or target outcomes'
          assert phrase in block
          assert 'DATA_ROOT' not in block
          assert 'PROCESSED_ROOT' not in block
          assert 'hashlib' not in block
          assert block.count('/issues/148/comments') == 1
          PY
          git diff --check

      - name: Commit only the validated workflow repair
        shell: bash
        run: |
          set -euo pipefail
          path='.github/workflows/deform360-official-hub-calibration-source-reusable.yml'
          git add -- "${path}"
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = "${path}"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Expected receipt contract repair is empty.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Repair Deform360 completion receipt contract'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
