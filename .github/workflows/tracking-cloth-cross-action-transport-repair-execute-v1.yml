# workflow-lifecycle: one-shot
# workflow-owner: IPS-Stuttgart maintainers
name: Repair and execute Tracking Cloth cross-action transport v1

on:
  push:
    branches:
      - research/tracking-cloth-cross-action-transport-source-v1
    paths:
      - ".github/requests/tracking-cloth-cross-action-transport-repair-execute-v1.json"

permissions:
  contents: write

concurrency:
  group: tracking-cloth-cross-action-transport-repair-execute-v1
  cancel-in-progress: false

jobs:
  repair:
    name: Canonicalize source and validate contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      patched_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Check out exact repair request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply deterministic compatibility repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          run_path = Path(
              "experiments/tracking_cloth_cross_action_transport_v1/run.py"
          )
          text = run_path.read_text(encoding="utf-8")
          old = '''    gauge_signatures = np.zeros((material_signatures.shape[0], 3), dtype=np.float64)
              residual = diagnostic_query - diagnostic_mean
              cause_signatures = {
                  "material_contrast": material_signatures,
                  "rigid_pairwise_gauge": gauge_signatures,
              }
          '''
          new = '''    residual = diagnostic_query - diagnostic_mean
              cause_signatures = {"material_contrast": material_signatures}
          '''
          if old not in text:
              raise SystemExit("expected gauge-signature source block not found")
          text = text.replace(old, new)
          text = text.replace(
              '''        target_maps[interactions[target_index]] = np.hstack(
                      (target_centered, np.zeros((target_centered.shape[0], 3)))
                  )
          ''',
              '''        target_maps[interactions[target_index]] = target_centered
          ''',
          )
          text = text.replace(
              "    source_design = np.hstack((material_signatures, gauge_signatures))\n",
              "    source_design = material_signatures\n",
          )
          text = text.replace(
              '''        candidate_designs[candidate] = np.hstack(
                      (centered, np.zeros((centered.shape[0], 3)))
                  )
          ''',
              "        candidate_designs[candidate] = centered\n",
          )
          text = text.replace("len(materials) + 3", "len(materials)")
          text = text.replace(
              "int(adequacy.nullity)",
              "int(adequacy.coefficient_nullspace.shape[1])",
          )
          marker = "def _case_value(case: object, *names: str) -> object | None:\n"
          helper = '''def _construct(factory: object, **kwargs: object) -> object:
              """Call one repository revision while tolerating optional-argument drift."""

              signature = inspect.signature(factory)
              if any(
                  parameter.kind is inspect.Parameter.VAR_KEYWORD
                  for parameter in signature.parameters.values()
              ):
                  return factory(**kwargs)  # type: ignore[operator]
              accepted = {
                  name: value
                  for name, value in kwargs.items()
                  if name in signature.parameters
              }
              return factory(**accepted)  # type: ignore[operator]


          '''
          if helper not in text:
              if marker not in text:
                  raise SystemExit("constructor helper insertion marker not found")
              text = text.replace(marker, helper + marker)
          text = text.replace(
              "    adequacy = InterventionalCauseFamilyAdequacyV1(\n",
              "    adequacy = _construct(\n        InterventionalCauseFamilyAdequacyV1,\n",
          )
          text = text.replace(
              "    quotient = InterventionalTransportQuotientV1(\n",
              "    quotient = _construct(\n        InterventionalTransportQuotientV1,\n",
          )
          text = text.replace(
              "            design = TargetDirectedInterventionDesignV1(\n",
              "            design = _construct(\n                TargetDirectedInterventionDesignV1,\n",
          )
          run_path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_tracking_cloth_cross_action_transport_v1.py")
          tests = test_path.read_text(encoding="utf-8")
          tests = tests.replace(
              "assert adequacy.nullity >= 4",
              "assert adequacy.coefficient_nullspace.shape[1] >= 1",
          )
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Install development package
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Format, lint, test, and compile repaired source
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format \
            experiments/tracking_cloth_cross_action_transport_v1 \
            tests/test_tracking_cloth_cross_action_transport_v1.py
          python -m ruff check --fix \
            experiments/tracking_cloth_cross_action_transport_v1 \
            tests/test_tracking_cloth_cross_action_transport_v1.py
          python -m ruff format --check \
            experiments/tracking_cloth_cross_action_transport_v1 \
            tests/test_tracking_cloth_cross_action_transport_v1.py
          python -m ruff check \
            experiments/tracking_cloth_cross_action_transport_v1 \
            tests/test_tracking_cloth_cross_action_transport_v1.py
          python -m pytest -q tests/test_tracking_cloth_cross_action_transport_v1.py
          python -m compileall -q \
            experiments/tracking_cloth_cross_action_transport_v1

      - name: Commit validated repaired source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            experiments/tracking_cloth_cross_action_transport_v1 \
            tests/test_tracking_cloth_cross_action_transport_v1.py
          git diff --cached --check
          if git diff --cached --quiet; then
            sha=$(git rev-parse HEAD)
          else
            git commit -m "Harden real-cloth transport certificate"
            sha=$(git rev-parse HEAD)
            git push origin HEAD:research/tracking-cloth-cross-action-transport-source-v1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  source-target:
    name: Execute sealed real-data source-target gate
    needs: repair
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 120
    env:
      DATASET_ROOT: /home/github-runner/.cache/datasets/tracking-cloth-deformation-v1-zenodo-14644526
      RUN_DIR: ${{ github.workspace }}/.run/tracking-cloth-cross-action-transport-source-v1
      RESULT_DIR: results/science/tracking_cloth_cross_action_transport_v1/source-target-20260902-v1
    steps:
      - name: Check out exact validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.repair.outputs.patched_sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Validate exact source and dataset mount
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.repair.outputs.patched_sha }}"
          test -d "$DATASET_ROOT"
          test -r "$DATASET_ROOT"
          test "$(find "$DATASET_ROOT" -type f -name '*.csv' | wc -l)" -ge 120
          python3 --version

      - name: Create isolated runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUN_DIR"
          mkdir -p "$RUN_DIR"
          python3 -m venv --system-site-packages "$RUN_DIR/venv"
          "$RUN_DIR/venv/bin/python" -m pip install --no-deps -e .
          "$RUN_DIR/venv/bin/python" -m pip check

      - name: Seal predictions before target coordinates are parsed
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src${PYTHONPATH:+:$PYTHONPATH}"
          "$RUN_DIR/venv/bin/python" -m \
            experiments.tracking_cloth_cross_action_transport_v1.run \
            --stage seal \
            --dataset-root "$DATASET_ROOT" \
            --protocol experiments/tracking_cloth_cross_action_transport_v1/protocol.json \
            --work-dir "$RUN_DIR/sealed"
          python3 - <<'PY'
          import json
          from pathlib import Path

          seal = json.loads(
              Path(".run/tracking-cloth-cross-action-transport-source-v1/sealed/seal.json").read_text(
                  encoding="utf-8"
              )
          )
          assert seal["numeric_access"] == {
              "repetition_1_cases": 12,
              "repetition_2_diagnostic_cases": 4,
              "repetition_2_held_target_cases": 0,
              "repetition_3_cases": 0,
          }
          assert seal["target_outcomes_used_to_select_or_fit"] is False
          PY

      - name: Verify seal and score eight held-action trajectories once
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src${PYTHONPATH:+:$PYTHONPATH}"
          mkdir -p "$RUN_DIR/scored"
          "$RUN_DIR/venv/bin/python" -m \
            experiments.tracking_cloth_cross_action_transport_v1.run \
            --stage score \
            --dataset-root "$DATASET_ROOT" \
            --protocol experiments/tracking_cloth_cross_action_transport_v1/protocol.json \
            --work-dir "$RUN_DIR/sealed" \
            --output "$RUN_DIR/scored/result.json" \
            --report "$RUN_DIR/scored/report.md"
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path(".run/tracking-cloth-cross-action-transport-source-v1/scored/result.json").read_text(
                  encoding="utf-8"
              )
          )
          assert result["numeric_access"]["repetition_2_held_target_cases_after_seal"] == 8
          assert result["numeric_access"]["repetition_3_cases"] == 0
          assert result["rep3_confirmation_authorized"] is False
          PY

      - name: Publish compact evidence and retire both one-shot pathways
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RESULT_DIR"
          cp "$RUN_DIR/scored/result.json" "$RESULT_DIR/result.json"
          cp "$RUN_DIR/scored/report.md" "$RESULT_DIR/report.md"
          cp "$RUN_DIR/sealed/seal.json" "$RESULT_DIR/prediction_seal.json"
          cp experiments/tracking_cloth_cross_action_transport_v1/protocol.json \
            "$RESULT_DIR/protocol.json"
          cp experiments/tracking_cloth_cross_action_transport_v1/run.py \
            "$RESULT_DIR/run.py"
          cp .github/workflows/tracking-cloth-cross-action-transport-repair-execute-v1.yml \
            "$RESULT_DIR/executed_workflow.yml"
          rm -f \
            .github/workflows/tracking-cloth-cross-action-transport-source-v1.yml \
            .github/workflows/tracking-cloth-cross-action-transport-repair-execute-v1.yml \
            .github/requests/tracking-cloth-cross-action-transport-source-v1.json \
            .github/requests/tracking-cloth-cross-action-transport-repair-execute-v1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Record sealed Tracking Cloth transport result"
          git push origin HEAD:research/tracking-cloth-cross-action-transport-source-v1

      - name: Upload full seal, arrays, and result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tracking-cloth-cross-action-transport-repaired-${{ needs.repair.outputs.patched_sha }}
          path: .run/tracking-cloth-cross-action-transport-source-v1
          if-no-files-found: warn
          retention-days: 30
