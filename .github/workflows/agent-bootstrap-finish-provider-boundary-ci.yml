name: Bootstrap finish provider-boundary CI

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/bootstrap-finish-provider-boundary-ci-20260728'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Update clean product branch from main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main agent/complete-causal4d-provider-boundary
          git switch -C agent/complete-causal4d-provider-boundary \
            origin/agent/complete-causal4d-provider-boundary

          product_head=$(git rev-parse HEAD)
          merge_base=$(git merge-base "$product_head" origin/main)
          git show "$product_head:CHANGELOG.md" > /tmp/changelog.product
          git show "$merge_base:CHANGELOG.md" > /tmp/changelog.base
          git show "origin/main:CHANGELOG.md" > /tmp/changelog.main

          if ! git merge --no-edit --no-ff origin/main; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if [[ "${#conflicts[@]}" -ne 1 || "${conflicts[0]}" != "CHANGELOG.md" ]]; then
              printf 'Unexpected merge conflicts:\n%s\n' "${conflicts[*]}"
              exit 1
            fi
            git merge-file --union -p \
              /tmp/changelog.product \
              /tmp/changelog.base \
              /tmp/changelog.main > CHANGELOG.md || true
            if grep -Eq '^(<<<<<<<|=======|>>>>>>>)' CHANGELOG.md; then
              echo "CHANGELOG union still contains conflict markers"
              exit 1
            fi
            git add CHANGELOG.md
            git commit --no-edit
          fi

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,graph,vision]"
          python -m pip install "coverage==7.13.3"

      - name: Repair import ordering and coverage matrix
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check --fix \
            src/bayesian_phystwin/causal4d_provider_v1.py \
            tests/test_causal4d_provider_v1.py
          python -m ruff format \
            src/bayesian_phystwin/causal4d_provider_v1.py \
            tests/test_causal4d_provider_v1.py

          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/tests.yml')
          text = path.read_text(encoding='utf-8')

          repeated = (
              '            tests/test_causal4d_graph_provider_v1.py \\\n'
              '            tests/test_causal4d_provider_v1.py \\\n'
              '            tests/test_gauge_aware_belief.py \\\n'
          )
          repeated_replacement = (
              '            tests/test_causal4d_graph_provider_v1.py \\\n'
              '            tests/test_causal4d_provider_v1.py \\\n'
              '            tests/test_causal4d_public_provider_v1.py \\\n'
              '            tests/test_legacy_artifacts.py \\\n'
              '            tests/test_gauge_aware_belief.py \\\n'
          )
          if text.count(repeated) != 2:
              raise RuntimeError('expected stable-coverage and core-contract anchors')
          text = text.replace(repeated, repeated_replacement)

          stable_files = (
              '            src/bayesian_phystwin/_gauge_aware_solver.py\n'
              '            src/bayesian_phystwin/causal4d_provider_v1.py\n'
              '            src/bayesian_phystwin/cli/main.py\n'
          )
          stable_files_replacement = (
              '            src/bayesian_phystwin/_gauge_aware_solver.py\n'
              '            src/bayesian_phystwin/causal4d_artifacts_v1.py\n'
              '            src/bayesian_phystwin/causal4d_provider_v1.py\n'
              '            src/bayesian_phystwin/causal4d_public_provider_v1.py\n'
              '            src/bayesian_phystwin/cli/main.py\n'
          )
          if text.count(stable_files) != 1:
              raise RuntimeError('expected stable-file anchor')
          text = text.replace(stable_files, stable_files_replacement)

          provider = (
              '            tests/test_causal4d_graph_provider_v1.py \\\n'
              '            tests/test_causal4d_graph_provider_parity.py \\\n'
              '            tests/test_causal4d_provider_v1.py \\\n'
              '            tests/test_gauge_aware_belief.py \\\n'
          )
          provider_replacement = (
              '            tests/test_causal4d_graph_provider_v1.py \\\n'
              '            tests/test_causal4d_graph_provider_parity.py \\\n'
              '            tests/test_causal4d_provider_v1.py \\\n'
              '            tests/test_causal4d_public_provider_v1.py \\\n'
              '            tests/test_legacy_artifacts.py \\\n'
              '            tests/test_gauge_aware_belief.py \\\n'
          )
          if text.count(provider) != 1:
              raise RuntimeError('expected provider-contract anchor')
          text = text.replace(provider, provider_replacement)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git add \
            .github/workflows/tests.yml \
            src/bayesian_phystwin/causal4d_provider_v1.py \
            tests/test_causal4d_provider_v1.py
          if ! git diff --cached --quiet; then
            git commit -m "Finish provider-boundary quality and coverage gates"
          fi

      - name: Run changed-file quality ratchet
        shell: bash
        run: |
          set -euo pipefail
          base=$(git merge-base origin/main HEAD)
          python tools/quality/changed_python_quality.py --base "$base" --head HEAD

      - name: Run stable-core coverage ratchet
        shell: bash
        run: |
          set -euo pipefail
          python -m coverage erase
          python -m coverage run --branch --source=bayesian_phystwin -m pytest -q \
            tests/test_causal4d_graph_provider_v1.py \
            tests/test_causal4d_provider_v1.py \
            tests/test_causal4d_public_provider_v1.py \
            tests/test_legacy_artifacts.py \
            tests/test_gauge_aware_belief.py \
            tests/test_observation_belief.py \
            tests/test_observation_belief_gauge_adapter.py \
            tests/test_prior_aware_and_linearization.py \
            tests/test_prior_aware_likelihood_conformance.py \
            tests/test_prob4d_causal_lineage.py \
            tests/test_prob4d_joint_contract_fixture.py \
            tests/test_cli_main.py \
            tests/test_run_manifest.py \
            tests/test_run_manifest_v2.py \
            tests/test_run_manifest_cli.py \
            tests/test_phystwin_profile.py \
            tests/test_information_mass_invariants.py \
            tests/test_quality_invariants.py
          python -m coverage json -o package-coverage.json
          stable_files=(
            src/bayesian_phystwin/_gauge_aware_contracts.py
            src/bayesian_phystwin/_gauge_aware_solver.py
            src/bayesian_phystwin/causal4d_artifacts_v1.py
            src/bayesian_phystwin/causal4d_provider_v1.py
            src/bayesian_phystwin/causal4d_public_provider_v1.py
            src/bayesian_phystwin/cli/main.py
            src/bayesian_phystwin/cli/run_manifest.py
            src/bayesian_phystwin/gauge_aware_belief.py
            src/bayesian_phystwin/observation_belief.py
            src/bayesian_phystwin/observation_belief_gauge_adapter.py
            src/bayesian_phystwin/phystwin_profile.py
            src/bayesian_phystwin/prob4d_causal_lineage.py
            src/bayesian_phystwin/prob4d_observation_contract.py
            src/bayesian_phystwin/repository_provenance.py
            src/bayesian_phystwin/run_manifest.py
            src/bayesian_phystwin/run_manifest_v2.py
          )
          stable_include=$(IFS=,; echo "${stable_files[*]}")
          python -m coverage json --include="$stable_include" -o stable-core-coverage.json
          python tools/quality/check_coverage_floors.py \
            stable-core-coverage.json \
            .github/quality/stable-core-coverage-floors.json \
            --changed-coverage-json package-coverage.json \
            --base "$(git merge-base origin/main HEAD)" \
            --head HEAD

      - name: Run complete suite
        run: python -m pytest -q

      - name: Publish repaired product branch
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/agent-bootstrap-finish-provider-boundary-ci.yml
          git status --short
          git push --force-with-lease \
            origin HEAD:refs/heads/agent/complete-causal4d-provider-boundary
