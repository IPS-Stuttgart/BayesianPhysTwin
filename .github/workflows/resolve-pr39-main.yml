name: Resolve PR 39 against current main

# Second push intentionally triggers the already-present branch workflow.
on:
  push:
    branches: [agent/audit-student-t-mixture-v2]
    paths:
      - ".github/workflows/resolve-pr39-main.yml"

permissions:
  contents: write

concurrency:
  group: resolve-pr39-main
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/audit-student-t-mixture-v2
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Merge current main and keep its quality ratchet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [[ $merge_status -ne 0 ]]; then
            git checkout --theirs .github/workflows/tests.yml
          fi
          git add .github/workflows/tests.yml
          unresolved="$(git diff --name-only --diff-filter=U)"
          if [[ -n "$unresolved" ]]; then
            echo "Unresolved merge conflicts:" >&2
            echo "$unresolved" >&2
            exit 1
          fi
          git commit -m "Merge current main into likelihood conformance branch"
      - name: Validate likelihood conformance after merge
        shell: bash
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q \
            src/bayesian_phystwin/_prior_aware_gauge_math.py \
            src/bayesian_phystwin/prior_aware_gauge_belief.py \
            tests/test_prior_aware_likelihood_conformance.py
          python -m pytest -q \
            tests/test_prior_aware_likelihood_conformance.py \
            tests/test_prior_aware_and_linearization.py \
            tests/test_gauge_aware_belief.py
          python -m ruff check \
            src/bayesian_phystwin/_prior_aware_gauge_math.py \
            src/bayesian_phystwin/prior_aware_gauge_belief.py \
            tests/test_prior_aware_likelihood_conformance.py
          python -m ruff format --check \
            src/bayesian_phystwin/_prior_aware_gauge_math.py \
            src/bayesian_phystwin/prior_aware_gauge_belief.py \
            tests/test_prior_aware_likelihood_conformance.py
          python -m mypy --python-version 3.12 \
            src/bayesian_phystwin/_prior_aware_gauge_math.py \
            src/bayesian_phystwin/prior_aware_gauge_belief.py
          git diff --check
      - name: Remove resolver and publish branch
        shell: bash
        run: |
          rm .github/workflows/resolve-pr39-main.yml
          git add -A
          git commit -m "Remove one-shot likelihood conflict resolver"
          git push origin HEAD:agent/audit-student-t-mixture-v2
