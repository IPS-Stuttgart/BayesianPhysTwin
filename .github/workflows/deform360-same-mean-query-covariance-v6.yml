# workflow-lifecycle: temporary scientific execution
# workflow-owner: IPS-Stuttgart maintainers
name: Deform360 same-mean query covariance v6

on:
  push:
    branches:
      - science/deform360-same-mean-query-covariance-v6
    paths:
      - .github/requests/deform360-same-mean-query-covariance-v6.json

permissions:
  actions: read
  contents: read

concurrency:
  group: deform360-same-mean-query-covariance-v6
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Authorize one add-only request
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.forced }}" = false
          test "${{ github.event.before }}" != 0000000000000000000000000000000000000000
          mapfile -t changed < <(git diff --name-status "${{ github.event.before }}" "$GITHUB_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = $'A\t.github/requests/deform360-same-mean-query-covariance-v6.json'
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          request = json.loads(
              Path('.github/requests/deform360-same-mean-query-covariance-v6.json').read_text()
          )
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          expected = {
              'schema': 'deform360-same-mean-query-covariance-request-v6',
              'mode': 'audit-and-evaluate-if-ready',
              'runner_label': 'gpuserver4090',
              'prior_confirmation_run_id': 33335779766,
              'prior_confirmation_artifact_id': 9738998271,
              'mean_method_revision': '25ba91c021124569c4dcf84c66eda5ec088868e0',
              'fold_count': 5,
              'maximum_queries': 12,
              'same_mean_required': True,
              'marginal_preserving_dependence_controls_required': True,
              'paper_claim_authorized': False,
              'expected_source_revision': parent,
          }
          if request != expected:
              raise SystemExit('request differs from frozen v6 schema or trigger parent')
          PY

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install frozen runtime
        run: python -m pip install numpy==1.26.4 ruff==0.14.14
      - name: Validate same-mean covariance implementation
        run: |
          python -m ruff check scripts/science/run_deform360_same_mean_query_covariance_v6.py
          python -m ruff format --check scripts/science/run_deform360_same_mean_query_covariance_v6.py
          python scripts/science/run_deform360_same_mean_query_covariance_v6.py --self-test

  real-output-audit:
    needs: [authorize, contracts]
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 120
    env:
      OUT: /home/github-runner/.cache/workflows/deform360-same-mean-query-covariance-v6/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install isolated numerical runtime
        run: python -m pip install numpy==1.26.4
      - name: Create fresh custody root
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$OUT"
          mkdir -p "$OUT/prior-artifact" "$OUT/result"
          chmod 700 "$OUT"
      - name: Download immutable 92-object confirmation artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/IPS-Stuttgart/BayesianPhysTwin/actions/artifacts/9738998271/zip" \
            --output "$OUT/prior-artifact.zip"
          unzip -q "$OUT/prior-artifact.zip" -d "$OUT/prior-artifact"
      - name: Audit retained sufficient statistics and evaluate when uniquely ready
        shell: bash
        run: |
          set -euo pipefail
          python scripts/science/run_deform360_same_mean_query_covariance_v6.py \
            --root "$OUT/prior-artifact" \
            --root /home/github-runner/.cache/workflows \
            --output-root "$OUT/result" \
            --fold-count 5 \
            --maximum-queries 12
      - name: Verify information and same-mean boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ['OUT']) / 'result'
          audit = json.loads((root / 'audit.json').read_text())
          result = json.loads((root / 'result.json').read_text())
          assert audit['information_boundary']['mounted_dataset_numeric_payload_opened'] is False
          assert audit['information_boundary']['retained_target_values_read_during_audit'] is False
          assert result['paper_claim_authorized'] is False
          if result['status'] == 'completed':
              assert result['same_mean_contract']['mean_changed_between_arms'] is False
              assert result['same_mean_contract']['only_covariance_changes'] is True
          PY
      - name: Upload compact audit and any cross-fitted result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: deform360-same-mean-query-covariance-v6-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.OUT }}/result/audit.json
            ${{ env.OUT }}/result/result.json
            .github/requests/deform360-same-mean-query-covariance-v6.json
          retention-days: 90
      - name: Retain private originals
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -d "$OUT"; then chmod -R go-rwx "$OUT"; fi
