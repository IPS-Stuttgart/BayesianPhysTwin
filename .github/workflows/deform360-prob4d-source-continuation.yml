name: Deform360 Prob4D source-gate continuation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deform360-prob4d-source-continuation.yml"
      - ".github/workflows/launch-deform360-prob4d-source-continuation-once.yml"
      - "scripts/science/continue_deform360_prob4d_source_gate.py"
      - "scripts/science/materialize_deform360_prob4d_calibration_samples.py"
      - "scripts/science/fit_deform360_prob4d_source_calibration.py"
      - "scripts/science/evaluate_deform360_prob4d_source_gate.py"
      - "protocols/locks/deform360_official_hub_prob4d_source_gate_v1.json"
      - "tests/test_deform360_prob4d_source_continuation.py"
  workflow_call:
    inputs:
      execute_authorized:
        description: Continue the sole frozen source gate from its sealed batch.
        required: true
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: deform360-prob4d-source-continuation-v1
  cancel-in-progress: false

env:
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  AUTHORIZED_RUNNER_NAME: workstation2
  PRODUCTION_RESULT_ID: 146f885351b2af0134b8b3d3c28a76deaa899749b1b1306e0d7061807ae95f89
  PRODUCTION_ADMISSION_ID: 715ab8479bad4d97eba766cdba1a161f1f6e83e3fd597bb09a2bf8ab8dc91e15
  PRODUCTION_REVISION: c4e68bf54aa4f039a1bed04cd4f2cdcc3eedfe4c
  PROB4D_REVISION: 25d90ef7f78ba4307f4555cb636d666004e1bf66
  MOTIONCRAFTER_REVISION: 9cb4e9679f5f34e249945544052464ef46324bc2
  PROCESSING_REVISION: d8522a4403b766aeb387510c04e89032a56fdf35
  SOURCE_GATE_LOCK_ID: cc96d2cc03a5039479621acc7769690ef9bf8c15c00d418a0f14d3303ce3ebfb
  SOURCE_METRIC_BATCH_REVISION: ded8910becbbffe958dfd18c84ad91069e7087a4
  SOURCE_METRIC_BATCH_RESULT_ID: f246394c84fd643b6ec8961dbcb2101a73c34e46d5eaf43961f28429aeb197eb
  SOURCE_METRIC_BATCH_RUN_ID: "31297018948"
  SOURCE_METRIC_BATCH_ARTIFACT_ID: "9033414269"
  VISUAL_PRODUCTION_ROOT: /mnt/lexar4tb/datasets/deform360/results/bayesian-phystwin/calibration-visual-production/715ab8479bad4d97eba766cdba1a161f1f6e83e3fd597bb09a2bf8ab8dc91e15/c4e68bf54aa4f039a1bed04cd4f2cdcc3eedfe4c
  SOURCE_OUTPUT_ROOT: /mnt/lexar4tb/datasets/deform360/results/bayesian-phystwin/deform360-prob4d-source-gate-v1
  SOURCE_METRIC_BATCH_ROOT: /mnt/lexar4tb/datasets/deform360/results/bayesian-phystwin/deform360-prob4d-source-gate-v1/146f885351b2af0134b8b3d3c28a76deaa899749b1b1306e0d7061807ae95f89/ded8910becbbffe958dfd18c84ad91069e7087a4/metric-batch
  ISSUE_NUMBER: "148"

jobs:
  contracts:
    name: Source-continuation contracts / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate continuation code and workflow contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1"
          python -m pip install -e ".[dev]"
          files=(
            scripts/science/continue_deform360_prob4d_source_gate.py
            tests/test_deform360_prob4d_source_continuation.py
          )
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy scripts/science/continue_deform360_prob4d_source_gate.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_deform360_prob4d_source_continuation.py
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in (
              Path(".github/workflows/deform360-prob4d-source-continuation.yml"),
              Path(
                  ".github/workflows/"
                  "launch-deform360-prob4d-source-continuation-once.yml"
              ),
          ):
              document = yaml.safe_load(path.read_text(encoding="utf-8"))
              if not isinstance(document, dict):
                  raise SystemExit(f"invalid workflow: {path}")
          PY
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"

  continuation:
    name: Continue ten-object source gate / workstation2
    needs: contracts
    if: >-
      inputs.execute_authorized == true &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin'
    runs-on: self-hosted
    timeout-minutes: 720
    permissions:
      actions: read
      contents: read
    outputs:
      gate_passed: ${{ steps.decision.outputs.gate_passed }}
      confirmation_access_authorized: ${{ steps.decision.outputs.confirmation_access_authorized }}
      source_gate_result_id: ${{ steps.decision.outputs.source_gate_result_id }}
      source_gate_status: ${{ steps.decision.outputs.source_gate_status }}
      continuation_result_id: ${{ steps.decision.outputs.continuation_result_id }}
      supported_stream_count: ${{ steps.decision.outputs.supported_stream_count }}
      support_negative_stream_count: ${{ steps.decision.outputs.support_negative_stream_count }}
    steps:
      - name: Bind the reviewed one-shot caller and sole source runner
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME}" = "${AUTHORIZED_RUNNER_NAME}"
          test "${{ github.workflow_ref }}" = \
            "IPS-Stuttgart/BayesianPhysTwin/.github/workflows/launch-deform360-prob4d-source-continuation-once.yml@refs/heads/main"
          test "${{ inputs.execute_authorized }}" = "true"

      - name: Check out exact reviewed main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Check out exact frozen Prob4D source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FlorianPfaff/Prob4D
          ref: ${{ env.PROB4D_REVISION }}
          path: _prob4d
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install one isolated CPU calibration runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime="${RUNNER_TEMP}/deform360-source-continuation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "${runtime}"
          python -m venv --copies "${runtime}"
          echo "${runtime}/bin" >> "${GITHUB_PATH}"
          echo "SOURCE_RUNTIME=${runtime}" >> "${GITHUB_ENV}"
          runtime_python="${runtime}/bin/python"
          "${runtime_python}" -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1" \
            "numpy==2.2.6"
          "${runtime_python}" -m pip install --no-deps --no-build-isolation .
          "${runtime_python}" -m pip check

      - name: Initialize no-overwrite continuation and compact roots
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/deform360-source-continuation-work-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          source="${SOURCE_OUTPUT_ROOT}/${PRODUCTION_RESULT_ID}/${GITHUB_SHA}"
          test ! -e "${work}"
          test ! -e "${source}"
          test "$(realpath -e "${SOURCE_METRIC_BATCH_ROOT}")" = \
            "${SOURCE_METRIC_BATCH_ROOT}"
          test "$(realpath -e "${VISUAL_PRODUCTION_ROOT}")" = \
            "${VISUAL_PRODUCTION_ROOT}"
          mkdir -p "${work}/compact" "${source}"
          {
            echo "SOURCE_WORK_ROOT=${work}"
            echo "COMPACT_ROOT=${work}/compact"
            echo "SOURCE_RUN_ROOT=${source}"
            echo "METRIC_PLAN_ROOT=${source}/metric-plan"
            echo "SAMPLE_ROOT=${source}/source-calibration-samples"
            echo "CALIBRATION_ROOT=${source}/source-calibration"
            echo "SOURCE_GATE_ROOT=${source}/source-gate"
            echo "PROB4D_CHECKOUT=${GITHUB_WORKSPACE}/_prob4d"
          } >> "${GITHUB_ENV}"

      - name: Verify source batch and derive the supported-stream plan
        id: plan
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          (cd "${SOURCE_METRIC_BATCH_ROOT}" && \
            sha256sum --check SHA256SUMS >/dev/null)
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git -C "${PROB4D_CHECKOUT}" rev-parse HEAD)" = \
            "${PROB4D_REVISION}"
          test -z "$(git -C "${PROB4D_CHECKOUT}" status --porcelain=v1)"
          python scripts/science/continue_deform360_prob4d_source_gate.py build \
            --metric-batch-root "${SOURCE_METRIC_BATCH_ROOT}" \
            --production-result "${VISUAL_PRODUCTION_ROOT}/visual-production-result.json" \
            --production-root "${VISUAL_PRODUCTION_ROOT}" \
            --prediction-root "${VISUAL_PRODUCTION_ROOT}" \
            --selection protocols/locks/deform360_official_hub_visuotactile_v1_selection.json \
            --visual-provider-spec protocols/locks/deform360_official_hub_visuotactile_v1_visual_provider_spec.json \
            --metric-prior-policy protocols/locks/deform360_official_hub_prob4d_robot_metric_gauge_v1.json \
            --source-gate-lock protocols/locks/deform360_official_hub_prob4d_source_gate_v1.json \
            --processing-revision "${PROCESSING_REVISION}" \
            --expected-metric-batch-result-id "${SOURCE_METRIC_BATCH_RESULT_ID}" \
            --expected-metric-batch-implementation-revision "${SOURCE_METRIC_BATCH_REVISION}" \
            --implementation-revision "${GITHUB_SHA}" \
            --output-dir "${METRIC_PLAN_ROOT}" \
            > "${SOURCE_WORK_ROOT}/plan.stdout" \
            2> "${SOURCE_WORK_ROOT}/plan.stderr"

      - name: Materialize correlation-aware public calibration samples
        id: samples
        if: steps.plan.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python scripts/science/materialize_deform360_prob4d_calibration_samples.py \
            --plan "${METRIC_PLAN_ROOT}/metric-prefix-plan.json" \
            --production-result "${VISUAL_PRODUCTION_ROOT}/visual-production-result.json" \
            --production-root "${VISUAL_PRODUCTION_ROOT}" \
            --prediction-root "${VISUAL_PRODUCTION_ROOT}" \
            --metric-root "${SOURCE_METRIC_BATCH_ROOT}/metrics" \
            --selection protocols/locks/deform360_official_hub_visuotactile_v1_selection.json \
            --visual-provider-spec protocols/locks/deform360_official_hub_visuotactile_v1_visual_provider_spec.json \
            --metric-prior-policy protocols/locks/deform360_official_hub_prob4d_robot_metric_gauge_v1.json \
            --prob4d-checkout "${PROB4D_CHECKOUT}" \
            --prob4d-revision "${PROB4D_REVISION}" \
            --processing-revision "${PROCESSING_REVISION}" \
            --output-dir "${SAMPLE_ROOT}" \
            > "${SOURCE_WORK_ROOT}/samples.stdout" \
            2> "${SOURCE_WORK_ROOT}/samples.stderr"

      - name: Fit source-only object-balanced Prob4D calibration
        id: calibration
        if: steps.samples.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python scripts/science/fit_deform360_prob4d_source_calibration.py fit \
            --samples "${SAMPLE_ROOT}/samples.json" \
            --selection protocols/locks/deform360_official_hub_visuotactile_v1_selection.json \
            --visual-provider-spec protocols/locks/deform360_official_hub_visuotactile_v1_visual_provider_spec.json \
            --metric-prior-policy protocols/locks/deform360_official_hub_prob4d_robot_metric_gauge_v1.json \
            --prediction-root "${VISUAL_PRODUCTION_ROOT}" \
            --prob4d-checkout "${PROB4D_CHECKOUT}" \
            --output-dir "${CALIBRATION_ROOT}" \
            > "${SOURCE_WORK_ROOT}/calibration.stdout" \
            2> "${SOURCE_WORK_ROOT}/calibration.stderr"

      - name: Evaluate the unchanged frozen public source gate
        id: gate
        if: steps.calibration.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python scripts/science/evaluate_deform360_prob4d_source_gate.py \
            --samples "${SAMPLE_ROOT}/samples.json" \
            --selection protocols/locks/deform360_official_hub_visuotactile_v1_selection.json \
            --visual-provider-spec protocols/locks/deform360_official_hub_visuotactile_v1_visual_provider_spec.json \
            --metric-prior-policy protocols/locks/deform360_official_hub_prob4d_robot_metric_gauge_v1.json \
            --prediction-root "${VISUAL_PRODUCTION_ROOT}" \
            --source-calibration-root "${CALIBRATION_ROOT}" \
            --source-calibration-result "${CALIBRATION_ROOT}/source-calibration-result.json" \
            --gate-lock protocols/locks/deform360_official_hub_prob4d_source_gate_v1.json \
            --implementation-revision "${GITHUB_SHA}" \
            --output-dir "${SOURCE_GATE_ROOT}" \
            > "${SOURCE_WORK_ROOT}/source-gate.stdout" \
            2> "${SOURCE_WORK_ROOT}/source-gate.stderr"

      - name: Collect compact source evidence before enforcement
        if: always()
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          SAMPLE_OUTCOME: ${{ steps.samples.outcome }}
          CALIBRATION_OUTCOME: ${{ steps.calibration.outcome }}
          SOURCE_GATE_OUTCOME: ${{ steps.gate.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${COMPACT_ROOT}/metric-plan" \
            "${COMPACT_ROOT}/source-metric-batch" \
            "${COMPACT_ROOT}/samples" \
            "${COMPACT_ROOT}/source-calibration" \
            "${COMPACT_ROOT}/source-gate"
          if [[ -d "${METRIC_PLAN_ROOT}" ]]; then
            cp -a "${METRIC_PLAN_ROOT}/." "${COMPACT_ROOT}/metric-plan/"
          fi
          cp "${SOURCE_METRIC_BATCH_ROOT}/metric-batch-result.json" \
            "${COMPACT_ROOT}/source-metric-batch/"
          sha256sum "${SOURCE_METRIC_BATCH_ROOT}/SHA256SUMS" \
            > "${COMPACT_ROOT}/source-metric-batch/source-SHA256SUMS.digest"
          if [[ -f "${SAMPLE_ROOT}/samples.json" ]]; then
            cp "${SAMPLE_ROOT}/samples.json" "${COMPACT_ROOT}/samples/"
          fi
          if [[ -f "${SAMPLE_ROOT}/samples.npz" ]]; then
            sha256sum "${SAMPLE_ROOT}/samples.npz" \
              > "${COMPACT_ROOT}/samples/numeric-payload.digest"
          fi
          if [[ -d "${CALIBRATION_ROOT}" ]]; then
            cp -a "${CALIBRATION_ROOT}/." "${COMPACT_ROOT}/source-calibration/"
          fi
          if [[ -d "${SOURCE_GATE_ROOT}" ]]; then
            cp -a "${SOURCE_GATE_ROOT}/." "${COMPACT_ROOT}/source-gate/"
          fi
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          work = Path(os.environ["SOURCE_WORK_ROOT"])
          compact = Path(os.environ["COMPACT_ROOT"])
          gate_path = Path(os.environ["SOURCE_GATE_ROOT"]) / "source-gate-result.json"
          gate = json.loads(gate_path.read_text()) if gate_path.is_file() else None
          stage_outcomes = {
              "metric_plan": os.environ["PLAN_OUTCOME"],
              "samples": os.environ["SAMPLE_OUTCOME"],
              "calibration": os.environ["CALIBRATION_OUTCOME"],
              "source_gate": os.environ["SOURCE_GATE_OUTCOME"],
          }
          stderr_sha256 = {}
          for name in ("plan", "samples", "calibration", "source-gate"):
              path = work / f"{name}.stderr"
              payload = path.read_bytes() if path.is_file() else b""
              stderr_sha256[name] = hashlib.sha256(payload).hexdigest()
          receipt = {
              "schema": (
                  "bayesian-phystwin.deform360-prob4d-source-continuation-pipeline"
              ),
              "schema_version": 1,
              "implementation_revision": os.environ["GITHUB_SHA"],
              "source_metric_batch_revision": os.environ[
                  "SOURCE_METRIC_BATCH_REVISION"
              ],
              "source_metric_batch_result_id": os.environ[
                  "SOURCE_METRIC_BATCH_RESULT_ID"
              ],
              "visual_production_result_id": os.environ["PRODUCTION_RESULT_ID"],
              "stage_outcomes": stage_outcomes,
              "stderr_sha256": stderr_sha256,
              "source_gate_result_id": None if gate is None else gate["result_id"],
              "source_gate_passed": None if gate is None else gate["gate_passed"],
              "confirmation_access_authorized": (
                  None if gate is None else gate["confirmation_access_authorized"]
              ),
              "information_boundary": {
                  "public_released_measurements_used": True,
                  "new_measurements_required": False,
                  "human_approval_required": False,
                  "confirmation_payloads_opened": False,
                  "target_outcomes_used": False,
                  "future_frames_used": False,
                  "replacement_allowed": False,
              },
          }
          (compact / "pipeline-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          (
            cd "${COMPACT_ROOT}"
            find . -type f ! -path './SHA256SUMS' -printf '%P\0' \
              | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum --check SHA256SUMS >/dev/null
          )

      - name: Upload compact continuation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deform360-prob4d-source-continuation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deform360-source-continuation-work-${{ github.run_id }}-${{ github.run_attempt }}/compact
          if-no-files-found: error
          retention-days: 90

      - name: Validate the decisive source result
        id: decision
        if: always()
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          SAMPLE_OUTCOME: ${{ steps.samples.outcome }}
          CALIBRATION_OUTCOME: ${{ steps.calibration.outcome }}
          SOURCE_GATE_OUTCOME: ${{ steps.gate.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "gate_passed=unknown"
            echo "confirmation_access_authorized=false"
            echo "source_gate_result_id=none"
            echo "source_gate_status=technical-failure"
            echo "continuation_result_id=none"
            echo "supported_stream_count=unknown"
            echo "support_negative_stream_count=unknown"
          } >> "${GITHUB_OUTPUT}"
          test "${PLAN_OUTCOME}" = "success"
          test "${SAMPLE_OUTCOME}" = "success"
          test "${CALIBRATION_OUTCOME}" = "success"
          test "${SOURCE_GATE_OUTCOME}" = "success"
          python scripts/science/continue_deform360_prob4d_source_gate.py \
            validate "${METRIC_PLAN_ROOT}" >/dev/null
          (cd "${CALIBRATION_ROOT}" && sha256sum --check SHA256SUMS >/dev/null)
          (cd "${COMPACT_ROOT}" && sha256sum --check SHA256SUMS >/dev/null)
          python - <<'PY'
          import importlib.util
          import json
          import os
          import sys
          from pathlib import Path

          script = Path("scripts/science/evaluate_deform360_prob4d_source_gate.py")
          spec = importlib.util.spec_from_file_location("source_gate_validator", script)
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load source gate validator")
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          result = module.validate_source_gate_result(Path(os.environ["SOURCE_GATE_ROOT"]))
          continuation = json.loads(
              (
                  Path(os.environ["METRIC_PLAN_ROOT"])
                  / "continuation-receipt.json"
              ).read_text()
          )
          if not (
              result["gate_lock_id"] == os.environ["SOURCE_GATE_LOCK_ID"]
              and result["implementation_revision"] == os.environ["GITHUB_SHA"]
              and result["confirmation_access_authorized"]
              is result["gate_passed"]
              and result["information_boundary"]["confirmation_payloads_opened"]
              is False
              and result["information_boundary"]["target_outcomes_used"] is False
              and result["information_boundary"]["future_frames_used"] is False
              and result["information_boundary"]["replacement_allowed"] is False
          ):
              raise SystemExit("source-gate decision or information boundary changed")
          batch = json.loads(
              (
                  Path(os.environ["SOURCE_METRIC_BATCH_ROOT"])
                  / "metric-batch-result.json"
              ).read_text()
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as out:
              out.write(f"gate_passed={str(result['gate_passed']).lower()}\n")
              out.write(
                  "confirmation_access_authorized="
                  f"{str(result['confirmation_access_authorized']).lower()}\n"
              )
              out.write(f"source_gate_result_id={result['result_id']}\n")
              out.write(f"source_gate_status={result['status']}\n")
              out.write(f"continuation_result_id={continuation['result_id']}\n")
              out.write(
                  f"supported_stream_count={batch['supported_stream_count']}\n"
              )
              out.write(
                  "support_negative_stream_count="
                  f"{batch['support_negative_stream_count']}\n"
              )
          PY

      - name: Remove isolated runtime and auxiliary checkout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${SOURCE_RUNTIME:-}" "${GITHUB_WORKSPACE}/_prob4d" \
            "${SOURCE_WORK_ROOT:-}"

  receipt:
    name: Publish bounded source decision
    needs: continuation
    if: >-
      always() &&
      inputs.execute_authorized == true &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Post the retained source decision to issue 148
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ needs.continuation.result }}
          GATE_PASSED: ${{ needs.continuation.outputs.gate_passed }}
          AUTHORIZED: ${{ needs.continuation.outputs.confirmation_access_authorized }}
          RESULT_ID: ${{ needs.continuation.outputs.source_gate_result_id }}
          GATE_STATUS: ${{ needs.continuation.outputs.source_gate_status }}
          CONTINUATION_ID: ${{ needs.continuation.outputs.continuation_result_id }}
          SUPPORTED_STREAMS: ${{ needs.continuation.outputs.supported_stream_count }}
          SUPPORT_NEGATIVES: ${{ needs.continuation.outputs.support_negative_stream_count }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body=$(cat <<EOF
          ## Deform360 Prob4D source continuation: \`${JOB_RESULT}\`

          - workflow run: [\`${GITHUB_RUN_ID}\`](${run_url})
          - exact continuation revision: \`${GITHUB_SHA}\`
          - sealed source metric-batch run: \`${SOURCE_METRIC_BATCH_RUN_ID}\`
          - sealed source metric-batch result: \`${SOURCE_METRIC_BATCH_RESULT_ID}\`
          - retained supported streams: \`${SUPPORTED_STREAMS:-unknown}\`
