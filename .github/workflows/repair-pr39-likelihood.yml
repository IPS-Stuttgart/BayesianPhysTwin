name: Repair PR 39 likelihood publication

on:
  push:
    branches: [agent/audit-student-t-mixture-v2]
    paths:
      - ".github/workflows/repair-pr39-likelihood.yml"

permissions:
  contents: write

concurrency:
  group: repair-pr39-likelihood
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/audit-student-t-mixture-v2
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Reconstruct the checksum-locked patch from its clean base
        shell: bash
        run: |
          set -euo pipefail
          cat .agent/likelihood-fix.part* > "$RUNNER_TEMP/likelihood-fix.patch.b64"
          base64 --decode "$RUNNER_TEMP/likelihood-fix.patch.b64" \
            > "$RUNNER_TEMP/likelihood-fix.patch.gz"
          echo "d8f9aad653af030b3f49dc7ac5b2eb8fae288250553de9d4bcb90f353ba0d786  $RUNNER_TEMP/likelihood-fix.patch.gz" \
            | sha256sum --check --strict
          gzip --decompress --stdout "$RUNNER_TEMP/likelihood-fix.patch.gz" \
            > "$RUNNER_TEMP/likelihood-fix.patch"
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          base = "9b59747b4e49f1de5c1e6452e5deb9a5b4317787"
          patch = Path("/home/runner/work/_temp/likelihood-fix.patch")
          if not patch.exists():
              candidates = list(Path("/home/runner/work/_temp").glob("likelihood-fix.patch"))
              if not candidates:
                  raise SystemExit("decoded patch not found")
              patch = candidates[0]
          text = patch.read_text(encoding="utf-8")
          paths = set()
          for marker in ("---", "+++"):
              for value in re.findall(rf"^{marker} (?:a|b)/(.*)$", text, re.MULTILINE):
                  if value != "/dev/null":
                      paths.add(value)
          if not paths:
              raise SystemExit("no patch paths discovered")
          for relative in sorted(paths):
              destination = Path(relative)
              probe = subprocess.run(
                  ["git", "cat-file", "-e", f"{base}:{relative}"],
                  check=False,
              )
              if probe.returncode == 0:
                  data = subprocess.check_output(["git", "show", f"{base}:{relative}"])
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(data)
              elif destination.exists():
                  destination.unlink()
          PY
          git apply --check "$RUNNER_TEMP/likelihood-fix.patch"
          git apply "$RUNNER_TEMP/likelihood-fix.patch"
          git diff --check
          rm -rf .agent .github/workflows/agent-apply-likelihood-fix.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Conform grouped Student-t mixture inference"
      - name: Merge current main and preserve the quality ratchet
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [[ $merge_status -ne 0 ]]; then
            git checkout --theirs .github/workflows/tests.yml
          fi
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/tests.yml")
          text = path.read_text(encoding="utf-8")

          def insert_after(anchor: str, addition: str) -> None:
              global text
              if addition in text:
                  return
              if anchor not in text:
                  raise SystemExit(f"CI anchor not found: {anchor!r}")
              text = text.replace(anchor, anchor + addition, 1)

          insert_after(
              "          src/bayesian_phystwin/run_manifest_v2.py\n",
              "          src/bayesian_phystwin/_prior_aware_gauge_math.py\n"
              "          src/bayesian_phystwin/prior_aware_gauge_belief.py\n",
          )
          first = text.find("          src/bayesian_phystwin/run_manifest_v2.py\n")
          second = text.find("          src/bayesian_phystwin/run_manifest_v2.py\n", first + 1)
          if second >= 0 and "src/bayesian_phystwin/_prior_aware_gauge_math.py" not in text[second:second + 500]:
              anchor = "          src/bayesian_phystwin/run_manifest_v2.py\n"
              addition = (
                  "          src/bayesian_phystwin/_prior_aware_gauge_math.py\n"
                  "          src/bayesian_phystwin/prior_aware_gauge_belief.py\n"
              )
              text = text[:second] + text[second:].replace(anchor, anchor + addition, 1)
          insert_after(
              "            tests/test_observation_belief_gauge_adapter.py \\\n",
              "            tests/test_prior_aware_and_linearization.py \\\n"
              "            tests/test_prior_aware_likelihood_conformance.py \\\n",
          )
          path.write_text(text, encoding="utf-8")
          PY
          git add .github/workflows/tests.yml
          unresolved="$(git diff --name-only --diff-filter=U)"
          if [[ -n "$unresolved" ]]; then
            echo "Unresolved merge conflicts:" >&2
            echo "$unresolved" >&2
            exit 1
          fi
      - name: Validate completed likelihood implementation
        shell: bash
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q \
            src/bayesian_phystwin/_gauge_aware_solver.py \
            src/bayesian_phystwin/_prior_aware_gauge_math.py \
            src/bayesian_phystwin/prior_aware_gauge_belief.py \
            tests/test_prior_aware_likelihood_conformance.py
          python -m pytest -q \
            tests/test_prior_aware_likelihood_conformance.py \
            tests/test_prior_aware_and_linearization.py \
            tests/test_gauge_aware_belief.py
          python -m ruff check \
            src/bayesian_phystwin/_gauge_aware_solver.py \
            src/bayesian_phystwin/_prior_aware_gauge_math.py \
            src/bayesian_phystwin/prior_aware_gauge_belief.py \
            tests/test_gauge_aware_belief.py \
            tests/test_prior_aware_likelihood_conformance.py
          python -m ruff format --check \
            src/bayesian_phystwin/_gauge_aware_solver.py \
            src/bayesian_phystwin/_prior_aware_gauge_math.py \
            src/bayesian_phystwin/prior_aware_gauge_belief.py \
            tests/test_prior_aware_likelihood_conformance.py
          python -m mypy --python-version 3.12 \
            src/bayesian_phystwin/_prior_aware_gauge_math.py \
            src/bayesian_phystwin/prior_aware_gauge_belief.py
          git diff --check
      - name: Commit reconciled branch
        shell: bash
        run: |
          rm .github/workflows/repair-pr39-likelihood.yml
          git add -A
          git commit -m "Reconcile likelihood conformance with current main"
          git push origin HEAD:agent/audit-student-t-mixture-v2
