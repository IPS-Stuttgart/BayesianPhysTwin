# workflow-lifecycle: one-shot
# workflow-owner: IPS-Stuttgart maintainers
name: Deform360 source visual-hull v2 contract

on:
  push:
    branches:
      - science/deform360-icra-source-response-v1
    paths:
      - ".github/requests/deform360-source-visual-hull-v2-contract.json"

permissions:
  contents: read

env:
  REQUEST_PATH: .github/requests/deform360-source-visual-hull-v2-contract.json
  PROTOCOL_PATH: experiments/deform360_source_visual_hull_v2/protocol.json
  BASE_IMPLEMENTATION_PATH: scripts/science/audit_deform360_source_visual_hull_v1.py
  IMPLEMENTATION_PATH: scripts/science/audit_deform360_source_visual_hull_v2.py
  BASE_TEST_PATH: tests/test_deform360_source_visual_hull_v1.py
  TEST_PATH: tests/test_deform360_source_visual_hull_v2.py
  NUMPY_VERSION: "1.26.4"
  H5PY_VERSION: "3.12.1"

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          check-latest: false
      - name: Authorize the add-only contract request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = refs/heads/science/deform360-icra-source-response-v1
          test "${PUSH_FORCED}" = false
          test "${BEFORE_SHA}" != 0000000000000000000000000000000000000000
          mapfile -t changed < <(git diff --name-status "${BEFORE_SHA}" "${GITHUB_SHA}")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = $'A\t'"${REQUEST_PATH}"
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          request = json.loads(Path(os.environ["REQUEST_PATH"]).read_text())
          expected = {
              "schema": "deform360-source-visual-hull-v2-contract-request-v1",
              "request_id": "deform360-source-visual-hull-v2-contract-20260902-v1",
              "protocol_path": os.environ["PROTOCOL_PATH"],
              "base_implementation_path": os.environ["BASE_IMPLEMENTATION_PATH"],
              "implementation_path": os.environ["IMPLEMENTATION_PATH"],
              "base_test_path": os.environ["BASE_TEST_PATH"],
              "test_path": os.environ["TEST_PATH"],
              "numpy_version": os.environ["NUMPY_VERSION"],
              "h5py_version": os.environ["H5PY_VERSION"],
              "source_data_access_authorized": False,
              "target_directory_listing_authorized": False,
              "target_numeric_access_authorized": False,
              "target_scoring_authorized": False,
              "paper_claim_authorized": False,
          }
          if set(request) != set(expected) | {"expected_source_revision"}:
              raise SystemExit("contract request keys changed")
          for key, value in expected.items():
              if request.get(key) != value:
                  raise SystemExit(f"contract request field {key!r} changed")
          parent = subprocess.check_output(
              ["git", "rev-parse", f"{os.environ['GITHUB_SHA']}^"], text=True
          ).strip()
          if request["expected_source_revision"] != parent:
              raise SystemExit("contract request does not bind exact source parent")
          PY
      - name: Validate protocol, implementation, and deterministic geometry tests
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy==${NUMPY_VERSION}" "h5py==${H5PY_VERSION}" pytest
          python -m json.tool "${PROTOCOL_PATH}" >/dev/null
          python -m py_compile "${BASE_IMPLEMENTATION_PATH}" "${IMPLEMENTATION_PATH}"
          python -m pytest -q "${BASE_TEST_PATH}" "${TEST_PATH}"
