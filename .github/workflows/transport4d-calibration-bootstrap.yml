name: Materialize Transport4D Deform360 calibration stage

on:
  push:
    branches: [research/transport4d-tiered-public-v1]
    paths:
      - ".github/workflows/transport4d-calibration-bootstrap.yml"
      - ".github/transport4d_calibration_bootstrap.py"
      - ".github/transport4d_calibration_bundle/**"
      - ".github/transport4d_calibration_bundle_b64/**"

permissions:
  contents: write

concurrency:
  group: transport4d-calibration-bootstrap
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact staging revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Materialize reviewed calibration files
        run: python .github/transport4d_calibration_bootstrap.py

      - name: Apply reviewed lint-only repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/science/run_transport4d_deform360_calibration_v1.py")
          text = path.read_text(encoding="utf-8")
          old = '    active_threshold = float(protocol["forecast"]["active_threshold"])\n'
          if text.count(old) != 1:
              raise SystemExit("unexpected Transport4D calibration source around lint repair")
          path.write_text(text.replace(old, ""), encoding="utf-8")
          PY

      - name: Install focused validation tools
        run: python -m pip install numpy==1.26.4 pytest ruff==0.14.14

      - name: Canonicalize and validate calibration stage
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check --fix \
            scripts/science/run_transport4d_deform360_calibration_v1.py \
            tests/test_transport4d_deform360_calibration_v1.py
          python -m ruff format \
            scripts/science/run_transport4d_deform360_calibration_v1.py \
            tests/test_transport4d_deform360_calibration_v1.py
          python -m ruff check \
            scripts/science/run_transport4d_deform360_calibration_v1.py \
            tests/test_transport4d_deform360_calibration_v1.py
          python -m ruff format --check \
            scripts/science/run_transport4d_deform360_calibration_v1.py \
            tests/test_transport4d_deform360_calibration_v1.py
          python -m py_compile \
            scripts/science/run_transport4d_deform360_calibration_v1.py \
            tests/test_transport4d_deform360_calibration_v1.py
          python -m pytest -q tests/test_transport4d_deform360_calibration_v1.py
          python -m json.tool protocols/transport4d_deform360_calibration_v1.json >/dev/null
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path("protocols/transport4d_deform360_calibration_v1.json")
          value = json.loads(path.read_text())
          supplied = value.pop("protocol_id")
          encoded = json.dumps(
              value, sort_keys=True, separators=(",", ":"), allow_nan=False
          ).encode()
          assert hashlib.sha256(encoded).hexdigest() == supplied
          assert supplied == (
              "46e2316fe28b80b31284d6f2192b1caf1e4ea5b3f71c451347c90a65ddbf5224"
          )
          assert value["information_boundary"]["confirmation_numeric_payloads_may_open"] is False
          assert value["calibration"]["supported_confirmation_object_count"] == 33
          PY

      - name: Replace bootstrap with reviewed calibration stage
        shell: bash
        run: |
          set -euo pipefail
          rm -rf \
            .github/transport4d_calibration_bootstrap.py \
            .github/transport4d_calibration_bundle \
            .github/transport4d_calibration_bundle_b64 \
            .github/workflows/transport4d-calibration-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add frozen Transport4D Deform360 calibration stage"
          git push origin HEAD:research/transport4d-tiered-public-v1
