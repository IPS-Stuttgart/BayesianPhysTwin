name: Apply full-22 model-average diagnostic evaluator

on:
  push:
    branches:
      - agent/full22-endpoint-model-average-diagnostic
    paths:
      - ".github/workflows/apply-full22-model-average-script.yml"
      - ".github/patches/full22-model-average/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-full22-model-average-script
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref_name == 'agent/full22-endpoint-model-average-diagnostic'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/full22-endpoint-model-average-diagnostic
          fetch-depth: 0

      - name: Reassemble and verify evaluator archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .github/patches/full22-model-average -maxdepth 1 -type f -name 'part-*' | wc -l)" -eq 3
          cat .github/patches/full22-model-average/part-* \
            > "${RUNNER_TEMP}/full22-science-script.tgz.b64"
          echo "1b8496045e7cd097687b0c0101871b4565ae0e8ea8cb8c2094d078a2d8057e1b  ${RUNNER_TEMP}/full22-science-script.tgz.b64" \
            | sha256sum --check --strict
          base64 --decode "${RUNNER_TEMP}/full22-science-script.tgz.b64" \
            > "${RUNNER_TEMP}/full22-science-script.tgz"
          echo "a7dc75671ee1c60d0037f5627ac60bd1aed19ea965ebf6e956751ccd8af8948f  ${RUNNER_TEMP}/full22-science-script.tgz" \
            | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/full22-science-script.tgz"
          test -f scripts/science/run_full22_endpoint_model_average_diagnostic.py

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate evaluator and helpers
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev,graph]"
          python -m ruff check --fix \
            scripts/science/run_full22_endpoint_model_average_diagnostic.py \
            tests/test_full22_endpoint_model_average_diagnostic.py
          python -m ruff format \
            scripts/science/run_full22_endpoint_model_average_diagnostic.py \
            tests/test_full22_endpoint_model_average_diagnostic.py
          python -m ruff check \
            scripts/science/run_full22_endpoint_model_average_diagnostic.py \
            tests/test_full22_endpoint_model_average_diagnostic.py
          python -m ruff format --check \
            scripts/science/run_full22_endpoint_model_average_diagnostic.py \
            tests/test_full22_endpoint_model_average_diagnostic.py
          python -m pytest -q \
            tests/test_full22_endpoint_model_average_diagnostic.py \
            tests/test_endpoint_model_average.py
          python -m pip check
          git diff --check

      - name: Publish evaluator implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/science/run_full22_endpoint_model_average_diagnostic.py \
            tests/test_full22_endpoint_model_average_diagnostic.py
          test -n "$(git diff --cached --name-only)"
          git commit -m "Add locked full-22 model-average diagnostic"
          git push origin HEAD:agent/full22-endpoint-model-average-diagnostic
