name: Full-22 endpoint model-average hosted reference

on:
  pull_request:
    branches:
      - agent/prospective-belief-hardening
    paths:
      - ".github/workflows/full22-model-average-hosted-reference.yml"
      - "protocols/full22_endpoint_model_average_diagnostic_v1.json"
      - "scripts/science/run_full22_endpoint_model_average_diagnostic.py"
      - "tests/test_full22_endpoint_model_average_diagnostic.py"
      - "src/bayesian_phystwin/endpoint_model_average.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full22-model-average-hosted-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  diagnostic:
    name: Hosted independent-runtime reference
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out BayesianPhysTwin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Resolve isolated paths
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/bpt-full22-model-average-hosted-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${root}/data" "${root}/evidence"
          echo "DATA_ROOT=${root}/data" >> "${GITHUB_ENV}"
          echo "OUTPUT_ROOT=${root}/evidence" >> "${GITHUB_ENV}"

      - name: Record independent runtime
        shell: bash
        run: |
          {
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "revision=${GITHUB_SHA}"
            uname -a
            lscpu
          } | tee "${OUTPUT_ROOT}/runner.txt"

      - name: Install locked evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,data,graph]"
          python -m pip check
          python -m pip freeze --all > "${OUTPUT_ROOT}/pip-freeze.txt"

      - name: Verify code and protocol before target evaluation
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check \
            scripts/science/run_full22_endpoint_model_average_diagnostic.py \
            tests/test_full22_endpoint_model_average_diagnostic.py
          python -m ruff format --check \
            scripts/science/run_full22_endpoint_model_average_diagnostic.py \
            tests/test_full22_endpoint_model_average_diagnostic.py
          python -m pytest -q \
            tests/test_full22_endpoint_model_average_diagnostic.py \
            tests/test_endpoint_model_average.py
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          payload = json.loads(
              Path(
                  "protocols/full22_endpoint_model_average_diagnostic_v1.json"
              ).read_text(encoding="utf-8")
          )
          actual = hashlib.sha256(
              json.dumps(
                  payload,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              ).encode("utf-8")
          ).hexdigest()
          expected = "8c4021f082b03ef761bc97300eeac11b6f3f92a2bdc52c1941020f6c1f340217"
          if actual != expected:
              raise SystemExit(
                  f"protocol digest changed: expected {expected}, received {actual}"
              )
          print(f"locked protocol: {actual}")
          PY

      - name: Execute the full 22-case reference
        shell: bash
        run: |
          set -euo pipefail
          python scripts/science/run_full22_endpoint_model_average_diagnostic.py \
            "${DATA_ROOT}" \
            "${OUTPUT_ROOT}/result" \
            --protocol \
              protocols/full22_endpoint_model_average_diagnostic_v1.json \
            --workers 2 \
            --repository-revision "${GITHUB_SHA}" \
            --force \
            | tee "${OUTPUT_ROOT}/diagnostic-console.json"
          cp "${DATA_ROOT}/trajectory_evaluation_manifest.json" \
            "${OUTPUT_ROOT}/result/data_manifest.json"

      - name: Verify compact evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["OUTPUT_ROOT"])
          result = root / "result"
          manifest = json.loads(
              (result / "artifact_manifest.json").read_text(encoding="utf-8")
          )
          actual = hashlib.sha256((result / "summary.json").read_bytes()).hexdigest()
          if actual != manifest["summary_sha256"]:
              raise SystemExit("summary digest disagrees with artifact manifest")
          summary = json.loads(
              (result / "summary.json").read_text(encoding="utf-8")
          )
          confirmation = summary["aggregate"]["confirmation_19"]
          readout = {
              "schema": "bayesian-phystwin-full22-hosted-reference-readout",
              "schema_version": 1,
              "repository_revision": summary["repository_revision"],
              "protocol_sha256": summary["protocol_sha256"],
              "confirmation_case_count": confirmation["case_count"],
              "anchor_acceptance_fraction": confirmation[
                  "anchor_acceptance_fraction"
              ],
              "point": confirmation["point"],
              "predictive_calibration": confirmation["predictive_calibration"],
              "claim_boundary": summary["claim_boundary"],
          }
          (root / "scientific-readout.json").write_text(
              json.dumps(readout, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(readout, indent=2, sort_keys=True))
          PY
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"

      - name: Upload independent-runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bpt-full22-model-average-hosted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bpt-full22-model-average-hosted-${{ github.run_id }}-${{ github.run_attempt }}/evidence
          if-no-files-found: error
          retention-days: 30
