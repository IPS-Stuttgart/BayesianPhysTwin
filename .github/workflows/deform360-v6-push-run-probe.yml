name: Deform360 v6 protected push-run probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deform360-v6-push-run-probe.yml"

permissions:
  actions: read
  contents: read

jobs:
  probe:
    name: Locate protected-main source-prediction runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report exact protected push-run lineage
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ["REPOSITORY"]
          wanted = {
              "934885c411d4b2158d80a8f0e5a9cde4ad2a382d",
              "a004edbf5389714d033488ddc9fd54e131ec5b98",
          }
          query = urllib.parse.urlencode(
              {
                  "branch": "main",
                  "event": "push",
                  "per_page": 30,
              }
          )
          url = (
              f"https://api.github.com/repos/{repository}/actions/workflows/"
              f"331433104/runs?{query}"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)

          rows = [
              {
                  "id": run["id"],
                  "run_number": run["run_number"],
                  "status": run["status"],
                  "conclusion": run["conclusion"],
                  "head_sha": run["head_sha"],
                  "created_at": run["created_at"],
                  "updated_at": run["updated_at"],
                  "html_url": run["html_url"],
              }
              for run in payload.get("workflow_runs", [])
              if run.get("head_sha") in wanted
          ]
          rows.sort(key=lambda row: row["created_at"])
          print("DEFORM360_V6_PROTECTED_PUSH_RUNS=" + json.dumps(rows, sort_keys=True))
          observed = {row["head_sha"] for row in rows}
          if observed != wanted:
              raise SystemExit(
                  "protected push-run lineage incomplete: "
                  f"observed={sorted(observed)} wanted={sorted(wanted)}"
              )
          PY
