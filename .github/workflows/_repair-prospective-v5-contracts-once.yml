name: Repair prospective v5 contracts once

on:
  push:
    branches:
      - agent/deform360-joint-sparse-prospective-v5-design
    paths:
      - .github/workflows/_repair-prospective-v5-contracts-once.yml

permissions:
  contents: write

concurrency:
  group: repair-prospective-v5-contracts-once
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.ref == 'refs/heads/agent/deform360-joint-sparse-prospective-v5-design'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/deform360-joint-sparse-prospective-v5-design
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Repair content address and documentation contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          policy_path = Path(
              "protocols/locks/deform360_official_hub_joint_sparse_prospective_v5.json"
          )
          policy = json.loads(policy_path.read_text(encoding="utf-8"))
          identity = {key: value for key, value in policy.items() if key != "policy_id"}
          canonical = json.dumps(
              identity,
              sort_keys=True,
              separators=(",", ":"),
              allow_nan=False,
          ).encode("utf-8")
          policy_id = hashlib.sha256(canonical).hexdigest()
          expected = "b3fd0ad6f8673b3a383d87b2e0af2f7ff2f29e503553291c9af15d985ab12ac3"
          if policy_id != expected:
              raise SystemExit(
                  f"prospective-v5 content changed unexpectedly: {policy_id} != {expected}"
              )
          policy["policy_id"] = policy_id
          policy_path.write_text(
              json.dumps(policy, indent=2, sort_keys=True, allow_nan=False) + "\n",
              encoding="utf-8",
          )

          document_path = Path("docs/deform360_joint_sparse_prospective_v5.md")
          document = document_path.read_text(encoding="utf-8")
          old = (
              "That is the wrong unit for a multi-view Bayesian model: a camera can\n"
              "be only partially informative while the object-level collection of cameras,"
          )
          new = (
              "That is the wrong unit for a multi-view Bayesian model. A camera can\n"
              "be only partially informative while the object-level collection of cameras,"
          )
          if document.count(old) != 1:
              raise SystemExit("prospective-v5 documentation source phrase changed")
          document = document.replace(old, new, 1)
          if "A camera can be only partially informative" not in document:
              raise SystemExit("prospective-v5 documentation contract still missing")
          document_path.write_text(document, encoding="utf-8")
          PY

          git rm .github/workflows/_repair-prospective-v5-contracts-once.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            protocols/locks/deform360_official_hub_joint_sparse_prospective_v5.json \
            docs/deform360_joint_sparse_prospective_v5.md
          git commit -m "Fix prospective Deform360 v5 contracts"
          git push origin HEAD:agent/deform360-joint-sparse-prospective-v5-design
