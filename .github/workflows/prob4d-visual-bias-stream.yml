name: Prob4D recursive visual-bias stream consumer

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/prob4d-visual-bias-stream.yml"
      - "src/bayesian_phystwin/persistent_prob4d_visual_bias.py"

permissions:
  contents: write

concurrency:
  group: prob4d-visual-bias-stream-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-typing-fix:
    name: Publish strict ndarray annotations
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          clean: true

      - name: Provision Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply, format, and publish exact typing fixes
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/persistent-typing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "${root}"
          python -m venv "${root}/venv"
          "${root}/venv/bin/python" -m pip install \
            "pip==25.2" \
            "ruff==0.16.1"
          "${root}/venv/bin/python" - <<'PY'
          from pathlib import Path

          path = Path("src/bayesian_phystwin/persistent_prob4d_visual_bias.py")
          text = path.read_text(encoding="utf-8")

          provider_old = "    provider_design = np.zeros(\n"
          provider_new = "    provider_design: np.ndarray = np.zeros(\n"
          if text.count(provider_old) != 1:
              raise SystemExit("expected exactly one provider_design declaration")
          text = text.replace(provider_old, provider_new, 1)

          offset_old = "    if physical_offset is None:\n        offset = np.zeros(\n"
          offset_new = (
              "    offset: np.ndarray\n"
              "    if physical_offset is None:\n"
              "        offset = np.zeros(\n"
          )
          if text.count(offset_old) != 1:
              raise SystemExit("expected exactly one physical_offset branch")
          text = text.replace(offset_old, offset_new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          "${root}/venv/bin/python" -m ruff format \
            src/bayesian_phystwin/persistent_prob4d_visual_bias.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bayesian_phystwin/persistent_prob4d_visual_bias.py
          git commit -m "Add strict ndarray annotations"
          git push origin HEAD:agent/persistent-prob4d-visual-bias-solver
