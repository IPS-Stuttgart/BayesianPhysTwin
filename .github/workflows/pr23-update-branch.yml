name: PR 23 update branch

on:
  push:
    branches: ["agent/paper-evidence-bindings-v1"]

permissions:
  contents: write

concurrency:
  group: pr23-update-branch
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/paper-evidence-bindings-v1
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Merge current main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Validate paper evidence after merge
        run: |
          python -m ruff check \
            src/bayesian_phystwin/paper_evidence_v1.py \
            src/bayesian_phystwin/cli/run_manifest.py \
            tests/test_paper_evidence_v1.py \
            tests/test_paper_evidence_hardening.py \
            tests/test_paper_evidence_cli.py
          python -m mypy --python-version 3.12 \
            src/bayesian_phystwin/paper_evidence_v1.py \
            src/bayesian_phystwin/cli/run_manifest.py
          python -m pytest -q \
            tests/test_run_manifest_v2.py \
            tests/test_run_manifest_cli.py \
            tests/test_paper_evidence_v1.py \
            tests/test_paper_evidence_hardening.py \
            tests/test_paper_evidence_cli.py
      - name: Remove temporary workflow and push merge
        shell: bash
        run: |
          rm .github/workflows/pr23-update-branch.yml
          git add -A
          git commit --amend --no-edit
          git push origin HEAD:agent/paper-evidence-bindings-v1
