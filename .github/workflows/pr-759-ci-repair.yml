# workflow-lifecycle: permanent
# workflow-owner: IPS-Stuttgart maintainers
name: PR 759 CI repair

on:
  push:
    branches:
      - route-workstation2-runner
    paths:
      - ".github/workflows/pr-759-ci-repair.yml"

permissions:
  contents: write

concurrency:
  group: pr-759-ci-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply lifecycle and immutable-action repairs and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          paths = [
              ".github/workflows/cloth-sim2real-prob4d-covariance-evidence-v1.yml",
              ".github/workflows/deform360-calibration-visual-production.yml",
              ".github/workflows/deform360-joint-sparse-observability-v4.yml",
              ".github/workflows/deform360-prob4d-source-gate.yml",
              ".github/workflows/deform360-provider-failure-census-v1.yml",
              ".github/workflows/deform360-robot-metric-prefix-smoke.yml",
              ".github/workflows/deform360-runner-local-science.yml",
              ".github/workflows/deform360-v6-source-prediction-evidence-dual-runtime.yml",
              ".github/workflows/deform360-v6-source-prediction-evidence.yml",
          ]
          pins = {
              "actions/checkout@v7": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1",
              "actions/setup-python@v7": "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0",
              "actions/download-artifact@v8": "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0",
              "actions/upload-artifact@v7": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0",
          }
          header = (
              "# workflow-lifecycle: permanent\n"
              "# workflow-owner: IPS-Stuttgart maintainers\n"
          )

          for raw_path in paths:
              path = Path(raw_path)
              text = path.read_text(encoding="utf-8")
              if text.startswith("# workflow-lifecycle:"):
                  raise SystemExit(f"unexpected pre-classified target: {raw_path}")
              text = header + text
              for old, new in pins.items():
                  text = re.sub(
                      rf"(?m)^(\s*uses:\s*){re.escape(old)}(?:\s*#.*)?$",
                      lambda match, replacement=new: match.group(1) + replacement,
                      text,
                  )
              for old in pins:
                  if re.search(rf"(?m)^\s*uses:\s*{re.escape(old)}(?:\s|$)", text):
                      raise SystemExit(f"unpinned action remains in {raw_path}: {old}")
              path.write_text(text, encoding="utf-8")

          Path(".github/workflows/pr-759-ci-repair.yml").unlink()
          PY
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden workstation2 workflow routing CI"
          git push origin "HEAD:${GITHUB_REF_NAME}"
