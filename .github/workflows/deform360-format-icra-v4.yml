# workflow-lifecycle: temporary-one-shot
# workflow-owner: IPS-Stuttgart maintainers
name: Format Deform360 ICRA source v4

on:
  push:
    branches: [science/deform360-gpuserver4090-real-eval-v1]
    paths:
      - ".github/requests/deform360-format-icra-v4.json"

permissions:
  contents: write

concurrency:
  group: deform360-format-icra-v4
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out writable head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply deterministic source formatting
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            ruff==0.14.14 \
            autopep8==2.3.2 \
            numpy==1.26.4 \
            pytest
          files=(
            scripts/science/audit_deform360_icra_carriers_v2.py
            scripts/science/inspect_deform360_robot_tactile_alignment_v2.py
            scripts/science/run_deform360_action_conditioned_tactile_v2.py
            scripts/science/run_deform360_action_kernel_v3.py
            scripts/science/run_deform360_gpuserver4090_real_evaluation_v1.py
            scripts/science/run_deform360_reserved_confirmation_v4.py
            tests/test_deform360_gpuserver4090_real_evaluation_v1.py
          )
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "scripts/science/run_deform360_action_conditioned_tactile_v2.py"
          )
          source = path.read_text(encoding="utf-8")
          old = '''    except (OSError, ValueError):
        flat = np.fromfile(path, dtype=np.float32)
        if flat.size == 0 or flat.size % frame_size:
            raise EvaluationError(f"unsupported tactile carrier: {path}")
'''
          new = '''    except (OSError, ValueError) as error:
        flat = np.fromfile(path, dtype=np.float32)
        if flat.size == 0 or flat.size % frame_size:
            raise EvaluationError(
                f"unsupported tactile carrier: {path}"
            ) from error
'''
          if old not in source:
              raise SystemExit("expected tactile exception block was not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          python -m autopep8 \
            --in-place \
            --aggressive \
            --aggressive \
            --max-line-length 88 \
            scripts/science/run_deform360_action_conditioned_tactile_v2.py
          python -m ruff check --fix --unsafe-fixes "${files[@]}"
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m compileall -q \
            scripts/science \
            tests/test_deform360_gpuserver4090_real_evaluation_v1.py
          python -m pytest -q \
            tests/test_deform360_gpuserver4090_real_evaluation_v1.py
          git diff --check

      - name: Remove one-shot launcher and publish formatting commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/deform360-format-icra-v4.yml \
            .github/requests/deform360-format-icra-v4.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting change was required."
            exit 0
          fi
          git commit -m "Format Deform360 action-conditioned evaluation source"
          git push origin "HEAD:${GITHUB_REF_NAME}"
