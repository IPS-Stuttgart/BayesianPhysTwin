name: Format prospective belief files once

on:
  push:
    branches:
      - agent/prospective-belief-hardening
    paths:
      - .github/workflows/format-prospective-once.yml

permissions:
  contents: write

jobs:
  format:
    name: Apply pinned Ruff formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install the CI formatter
        run: python -m pip install --disable-pip-version-check --no-deps 'ruff==0.16.1'
      - name: Format only quality-ratchet failures
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/bayesian_phystwin/causal4d_belief_provider_v2.py
            src/bayesian_phystwin/endpoint_model_average.py
            src/bayesian_phystwin/parameter_posterior.py
            src/bayesian_phystwin/prospective_prob4d_update.py
            src/bayesian_phystwin/structured_reliability.py
            tests/test_endpoint_model_average.py
            tests/test_parameter_posterior.py
            tests/test_structured_reliability.py
          )
          python -m ruff format -- "${files[@]}"
          python -m ruff format --check -- "${files[@]}"
          git diff --check
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/bayesian_phystwin/causal4d_belief_provider_v2.py
            src/bayesian_phystwin/endpoint_model_average.py
            src/bayesian_phystwin/parameter_posterior.py
            src/bayesian_phystwin/prospective_prob4d_update.py
            src/bayesian_phystwin/structured_reliability.py
            tests/test_endpoint_model_average.py
            tests/test_parameter_posterior.py
            tests/test_structured_reliability.py
          )
          if git diff --quiet -- "${files[@]}"; then
            echo 'No formatter change was required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${files[@]}"
          git commit -m 'Format prospective belief implementation'
          git push origin "HEAD:${GITHUB_REF_NAME}"
