name: Repair tree-separator shadow parity

on:
  push:
    branches: [agent/tree-separator-shadow-parity-v1]

permissions:
  contents: write

concurrency:
  group: repair-tree-separator-shadow-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.ref == 'refs/heads/agent/tree-separator-shadow-parity-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/tree-separator-shadow-parity-v1
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply verified reviewed payload
        shell: bash
        env:
          PAYLOAD_SHA256: 6a82d7de5cdda1f96f5b57b8c2914e75a647ad22dbf1c0f1cf1185f1c5fe4be8
        run: |
          set -euo pipefail
          encoded=.bootstrap/tree-separator-shadow-parity-v1.b64
          payload="$RUNNER_TEMP/tree-separator-shadow-parity.tgz"
          base64 -d "$encoded" > "$payload"
          printf '%s  %s\n' "$PAYLOAD_SHA256" "$payload" | sha256sum --check --strict
          test ! -e src/bayesian_phystwin/tree_separator_gaussian_parity.py
          test ! -e tests/test_tree_separator_gaussian_parity.py
          test ! -e docs/tree_separator_gaussian_parity.md
          tar -xzf "$payload"
          rm \
            "$encoded" \
            .github/workflows/repair-tree-separator-shadow-parity.yml
          python -m compileall -q \
            src/bayesian_phystwin/tree_separator_gaussian_parity.py \
            tests/test_tree_separator_gaussian_parity.py
      - name: Validate focused parity boundary
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff check \
            src/bayesian_phystwin/tree_separator_gaussian_parity.py \
            tests/test_tree_separator_gaussian_parity.py
          python -m ruff format --check \
            src/bayesian_phystwin/tree_separator_gaussian_parity.py \
            tests/test_tree_separator_gaussian_parity.py
          python -m pytest -q \
            tests/test_tree_separator_gaussian_parity.py \
            tests/test_structured_point_covariance_tree_separator_gaussian.py \
            tests/test_structured_point_covariance_tree_block_coverage_edges.py \
            tests/test_structured_point_covariance_tree_block_operator.py \
            tests/test_tree_block_sparse_gauge_belief.py \
            tests/test_structured_point_covariance_causal4d_tree_block_provider.py \
            tests/test_portable_contracts_tree_block_strict_admission.py
          git diff --check
      - name: Publish reviewed change and remove repair inputs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayesian_phystwin/tree_separator_gaussian_parity.py \
            tests/test_tree_separator_gaussian_parity.py \
            docs/tree_separator_gaussian_parity.md \
            .bootstrap/tree-separator-shadow-parity-v1.b64 \
            .github/workflows/repair-tree-separator-shadow-parity.yml
          git diff --cached --check
          git commit -m "Add tree-separator shadow parity"
          git push origin HEAD:agent/tree-separator-shadow-parity-v1
