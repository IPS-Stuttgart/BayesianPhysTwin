name: Apply Deform360 Stage-0 hardening

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-deform360-stage0-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 20
    steps:
      - name: Check out trusted PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Apply and validate exact patch
        shell: bash
        run: |
          set -euo pipefail
          test -f .staging/stage0-hardening.patch
          git apply --check .staging/stage0-hardening.patch
          git apply .staging/stage0-hardening.patch
          rm .staging/stage0-hardening.patch
          rmdir .staging 2>/dev/null || true

          environment="${RUNNER_TEMP}/bpt-stage0-hardening-venv"
          rm -rf "${environment}"
          python3 -m venv "${environment}"
          source "${environment}/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m ruff format \
            scripts/science/build_deform360_hub_selection.py \
            tests/test_deform360_hub_selection.py
          python -m ruff check \
            scripts/science/build_deform360_hub_selection.py \
            tests/test_deform360_hub_selection.py
          python -m pytest -q \
            tests/test_deform360_contact_anchor.py \
            tests/test_deform360_hub_selection.py
          python -m compileall -q \
            scripts/science/build_deform360_hub_selection.py
          git diff --check

      - name: Publish hardened product files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/science/build_deform360_hub_selection.py \
            tests/test_deform360_hub_selection.py \
            docs/deform360_official_hub_visuotactile_v1.md \
            .staging
          git commit -m "Harden exact Deform360 Stage-0 selection locking"
          git push origin "HEAD:${{ github.head_ref }}"
