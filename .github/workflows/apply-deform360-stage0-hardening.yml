name: Apply Deform360 Stage-0 hardening

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-deform360-stage0-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 10
    steps:
      - name: Check out trusted PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Apply exact source patch
        shell: bash
        run: |
          set -euo pipefail
          test -f .staging/stage0-hardening.patch
          git apply --check .staging/stage0-hardening.patch
          git apply .staging/stage0-hardening.patch
          rm .staging/stage0-hardening.patch
          rmdir .staging 2>/dev/null || true
          python3 - <<'PY'
          from pathlib import Path

          for name in (
              "scripts/science/build_deform360_hub_selection.py",
              "tests/test_deform360_hub_selection.py",
              "docs/deform360_official_hub_visuotactile_v1.md",
          ):
              path = Path(name)
              path.write_text(
                  path.read_text(encoding="utf-8").rstrip() + "\n",
                  encoding="utf-8",
              )
          PY
          git diff --check

      - name: Publish hardened product files
        shell: bash
        run: |
          set -euo pipefail
          # Self-hosted workspaces persist .git metadata across jobs. Disable any
          # runner-local hooks so publication depends only on this workflow.
          git config --local core.hooksPath /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-deform360-stage0-hardening.yml
          git add -A -- \
            scripts/science/build_deform360_hub_selection.py \
            tests/test_deform360_hub_selection.py \
            docs/deform360_official_hub_visuotactile_v1.md \
            .staging \
            .github/workflows/apply-deform360-stage0-hardening.yml
          git diff --cached --check
          git -c core.hooksPath=/dev/null commit \
            -m "Harden exact Deform360 Stage-0 selection locking"
          git -c core.hooksPath=/dev/null push \
            origin "HEAD:${{ github.head_ref }}"
