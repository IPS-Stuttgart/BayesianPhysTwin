name: Query-aware anchor planning contracts

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/query-aware-anchor-planning.yml"
      - "src/bayesian_phystwin/query_aware_anchor_planning.py"
      - "src/bayesian_phystwin/query_anchor_sufficiency.py"
      - "tests/test_query_aware_anchor_planning.py"
      - "tests/test_query_anchor_sufficiency.py"
      - "scripts/science/run_query_anchor_sufficiency_study.py"
      - "docs/query_aware_anchor_planning.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: query-aware-anchor-planning-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  contracts:
    name: Query covariance, sufficiency, cost, dependence, and immutability
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 30
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true

      - name: Resolve isolated validation paths
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/query-aware-anchor-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "${root}"
          mkdir -p "${root}"
          {
            echo "QUERY_ANCHOR_RUN_ROOT=${root}"
            echo "QUERY_ANCHOR_VENV=${root}/venv"
          } >> "${GITHUB_ENV}"

      - name: Provision Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Create isolated validation environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "${QUERY_ANCHOR_VENV}"
          echo "${QUERY_ANCHOR_VENV}/bin" >> "${GITHUB_PATH}"
          "${QUERY_ANCHOR_VENV}/bin/python" -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1"
          "${QUERY_ANCHOR_VENV}/bin/python" -m pip install -e ".[dev]"
          "${QUERY_ANCHOR_VENV}/bin/python" -m pip check

      - name: Record exact environment
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "revision=$(git rev-parse HEAD)"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            python --version
            python -m pip --version
            python -m pip freeze --all
          } | tee "${QUERY_ANCHOR_RUN_ROOT}/environment.txt"

      - name: Check focused source quality
        run: |
          python -m ruff check \
            src/bayesian_phystwin/query_aware_anchor_planning.py \
            src/bayesian_phystwin/query_anchor_sufficiency.py \
            scripts/science/run_query_anchor_sufficiency_study.py \
            tests/test_query_aware_anchor_planning.py \
            tests/test_query_anchor_sufficiency.py
          python -m ruff format --check \
            src/bayesian_phystwin/query_aware_anchor_planning.py \
            src/bayesian_phystwin/query_anchor_sufficiency.py \
            scripts/science/run_query_anchor_sufficiency_study.py \
            tests/test_query_aware_anchor_planning.py \
            tests/test_query_anchor_sufficiency.py
          python -m mypy \
            src/bayesian_phystwin/query_aware_anchor_planning.py \
            src/bayesian_phystwin/query_anchor_sufficiency.py

      - name: Run focused and adjacent contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -p no:cacheprovider \
            tests/test_query_aware_anchor_planning.py \
            tests/test_query_anchor_sufficiency.py \
            tests/test_observability_diagnostics.py \
            tests/test_information_mass_invariants.py \
            tests/test_nuisance_information_row_permutation.py \
            | tee "${QUERY_ANCHOR_RUN_ROOT}/pytest.txt"
          python -m py_compile \
            src/bayesian_phystwin/query_aware_anchor_planning.py \
            src/bayesian_phystwin/query_anchor_sufficiency.py \
            scripts/science/run_query_anchor_sufficiency_study.py \
            tests/test_query_aware_anchor_planning.py \
            tests/test_query_anchor_sufficiency.py

      - name: Run controlled support--precision study
        shell: bash
        run: |
          set -euo pipefail
          python scripts/science/run_query_anchor_sufficiency_study.py \
            --output-dir "${QUERY_ANCHOR_RUN_ROOT}/controlled-study"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          path = (
              Path(os.environ["QUERY_ANCHOR_RUN_ROOT"])
              / "controlled-study"
              / "summary.json"
          )
          result = json.loads(path.read_text(encoding="utf-8"))
          result_sha256 = result.pop("result_sha256")
          canonical = json.dumps(
              result,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=True,
              allow_nan=False,
          ).encode("utf-8")
          if result_sha256 != hashlib.sha256(canonical).hexdigest():
              raise SystemExit("controlled study result identity changed")
          if not result["all_directional_checks_passed"]:
              raise SystemExit("controlled anchor-sufficiency checks failed")
          PY

      - name: Verify clean repository state
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"

      - name: Upload compact validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: query-aware-anchor-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.QUERY_ANCHOR_RUN_ROOT }}/environment.txt
            ${{ env.QUERY_ANCHOR_RUN_ROOT }}/pytest.txt
            ${{ env.QUERY_ANCHOR_RUN_ROOT }}/controlled-study/summary.json
            ${{ env.QUERY_ANCHOR_RUN_ROOT }}/controlled-study/curve.csv
            ${{ env.QUERY_ANCHOR_RUN_ROOT }}/controlled-study/report.md
          if-no-files-found: warn
          retention-days: 30
