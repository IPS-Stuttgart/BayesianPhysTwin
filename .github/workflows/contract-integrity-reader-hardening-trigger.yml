name: Trigger contract-integrity reader hardening

on:
  pull_request:
    branches:
      - main
    paths:
      - .contract-integrity-reader-hardening-trigger
      - .github/workflows/contract-integrity-reader-hardening.yml
      - .github/workflows/contract-integrity-reader-hardening-trigger.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: trigger-contract-integrity-reader-hardening
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/fix-contract-integrity'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/fix-contract-integrity
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Extract, apply, and verify the hardening patch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path(
              ".github/workflows/contract-integrity-reader-hardening.yml"
          )
          lines = workflow.read_text(encoding="utf-8").splitlines()
          starts = [
              index
              for index, line in enumerate(lines)
              if line.strip() == "python - <<'PY'"
          ]
          if len(starts) != 1:
              raise SystemExit("embedded hardening script start is not unique")
          start = starts[0]
          ends = [
              index
              for index in range(start + 1, len(lines))
              if lines[index].strip() == "PY"
          ]
          if len(ends) != 1:
              raise SystemExit("embedded hardening script end is not unique")
          script = dedent("\n".join(lines[start + 1 : ends[0]]))
          exec(compile(script, str(workflow), "exec"), {"__name__": "__main__"})
          PY

          python -m pip install -e ".[dev]"
          python -m ruff format \
            src/bayesian_phystwin/_canonical_contracts.py \
            tests/test_portable_contracts_integrity.py
          python -m ruff check \
            src/bayesian_phystwin/_canonical_contracts.py \
            src/bayesian_phystwin/physical_linearization.py \
            tests/test_portable_contracts_integrity.py
          python -m ruff format --check \
            src/bayesian_phystwin/_canonical_contracts.py \
            src/bayesian_phystwin/physical_linearization.py \
            tests/test_portable_contracts_integrity.py
          python -m mypy \
            src/bayesian_phystwin/_canonical_contracts.py \
            src/bayesian_phystwin/physical_linearization.py
          python -m pytest -q tests/test_portable_contracts_integrity.py

      - name: Commit verified source changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayesian_phystwin/_canonical_contracts.py \
            tests/test_portable_contracts_integrity.py
          git diff --cached --check
          git commit -m "Guard inherited frozen-container read operations"
          git push origin HEAD:agent/fix-contract-integrity
