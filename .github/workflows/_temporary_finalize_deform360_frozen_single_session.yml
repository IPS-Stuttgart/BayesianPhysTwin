name: Temporary finalize frozen single-session Deform360 production

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/patches/apply_deform360_visual_production_hardening.py"
      - ".github/workflows/_temporary_finalize_deform360_frozen_single_session.yml"

permissions:
  contents: write

concurrency:
  group: temporary-finalize-deform360-frozen-single-session-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/deform360-frozen-single-session-production'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install validation environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev,graph]"
          python -m pip install "build>=1.2"
          python -m pip check

      - name: Apply exact source transformation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(
              ".github/patches/apply_deform360_visual_production_hardening.py"
          )
          source = path.read_text(encoding="utf-8")
          old_prior = (
              "from dataclasses import dataclass\n'''\n"
              "        '''import argparse"
          )
          new_prior = (
              "from dataclasses import dataclass\n"
              "from pathlib import Path, PurePosixPath\n"
              "from typing import Any, cast\n'''\n"
              "        '''import argparse"
          )
          old_replacement = (
              "from dataclasses import asdict, dataclass\n'''\n"
              "    )"
          )
          new_replacement = (
              "from dataclasses import asdict, dataclass\n"
              "from pathlib import Path, PurePosixPath\n"
              "from typing import Any, cast\n'''\n"
              "    )"
          )
          for old, new, label in (
              (old_prior, new_prior, "prior import anchor"),
              (old_replacement, new_replacement, "replacement import anchor"),
          ):
              if source.count(old) != 1:
                  raise SystemExit(f"transformer {label} changed")
              source = source.replace(old, new)
          path.write_text(source, encoding="utf-8")
          PY
          python .github/patches/apply_deform360_visual_production_hardening.py
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/science/execute_deform360_calibration_visual_production.py")
          source = path.read_text(encoding="utf-8")
          old = "except (FileExistsError, OSError, ValueError) as error:"
          new = "except (FileExistsError, OSError, RuntimeError, ValueError) as error:"
          if source.count(old) != 1:
              raise SystemExit("visual-production CLI exception anchor changed")
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY

      - name: Validate exact hardened source
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/bayesian_phystwin/deform360_calibration_visual_production.py
            scripts/science/execute_deform360_calibration_visual_production.py
            tests/test_deform360_calibration_visual_production.py
            tests/test_deform360_calibration_visual_production_workflow.py
          )
          python -m ruff check --fix "${files[@]}"
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy \
            src/bayesian_phystwin/deform360_calibration_visual_production.py \
            scripts/science/execute_deform360_calibration_visual_production.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_deform360_calibration_visual_production.py \
            tests/test_deform360_calibration_visual_production_workflow.py \
            tests/test_deform360_calibration_visual_execution_admission.py \
            tests/test_deform360_calibration_visual_execution_admission_edges.py \
            tests/test_deform360_calibration_retained_source_workflow.py
          python -m py_compile \
            src/bayesian_phystwin/deform360_calibration_visual_production.py \
            scripts/science/execute_deform360_calibration_visual_production.py \
            tests/test_deform360_calibration_visual_production.py \
            tests/test_deform360_calibration_visual_production_workflow.py
          rm -rf build dist ./*.egg-info src/*.egg-info
          python -m build --sdist
          archive="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "${archive}"
          listing="$(tar -tzf "${archive}")"
          grep -Fq '/docs/deform360_calibration_visual_production.md' <<<"${listing}"
          grep -Fq '/scripts/science/execute_deform360_calibration_visual_production.py' <<<"${listing}"
          grep -Fq '/src/bayesian_phystwin/deform360_calibration_visual_production.py' <<<"${listing}"
          rm -rf build dist ./*.egg-info src/*.egg-info
          git diff --check

      - name: Publish validated blobs and receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          paths = (
              ".github/workflows/deform360-calibration-visual-production.yml",
              "docs/deform360_calibration_visual_production.md",
              "scripts/science/execute_deform360_calibration_visual_production.py",
              "tests/test_deform360_calibration_visual_production.py",
              "tests/test_deform360_calibration_visual_production_workflow.py",
          )
          blobs: dict[str, str] = {}
          for path in paths:
              data = base64.b64encode(Path(path).read_bytes()).decode("ascii")
              request = urllib.request.Request(
                  f"{os.environ['GITHUB_API_URL']}/repos/{repository}/git/blobs",
                  data=json.dumps({"content": data, "encoding": "base64"}).encode(),
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  blobs[path] = json.load(response)["sha"]
          receipt = {
              "schema": "bayesian-phystwin.temporary-frozen-single-session-finalization",
              "schema_version": 1,
              "base_head_sha": os.environ["GITHUB_SHA"],
              "pull_request_head_sha": os.environ["GITHUB_SHA"],
              "blobs": blobs,
              "delete_paths": [
                  ".github/patches/apply_deform360_visual_production_hardening.py",
                  ".github/workflows/_temporary_finalize_deform360_frozen_single_session.yml",
              ],
          }
          Path("finalization-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload finalization receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: deform360-frozen-single-session-finalization
          path: finalization-receipt.json
          if-no-files-found: error
          retention-days: 1
