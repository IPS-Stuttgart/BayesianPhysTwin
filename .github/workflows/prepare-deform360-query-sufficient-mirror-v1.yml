name: Prepare Deform360 query-sufficient exact-bound mirror v1

on:
  push:
    branches:
      - science/deform360-query-sufficient-dependence-v1
    paths:
      - .github/requests/prepare-deform360-query-sufficient-mirror-v1.json

permissions:
  contents: write

concurrency:
  group: prepare-deform360-query-sufficient-mirror-v1
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out mirror preparation request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Add exact-bound mirror mode and self-remove
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-status HEAD^ HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = $'A\t.github/requests/prepare-deform360-query-sufficient-mirror-v1.json'
          python -m pip install --disable-pip-version-check numpy==1.26.4 pytest ruff==0.14.14
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path


          def replace_once(text: str, old: str, new: str, *, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)


          runner_path = Path(
              "scripts/science/run_deform360_query_sufficient_dependence_v1.py"
          )
          runner = runner_path.read_text(encoding="utf-8")
          runner = replace_once(
              runner,
              '''    if Path(str(protocol.get("dataset_root"))) != data_root:\n        raise ValueError("dataset root changed")\n''',
              '''    allowed_roots = {Path(str(protocol.get("dataset_root")))}\n    mirror_roots = protocol.get("exact_bound_mirror_roots", [])\n    if not isinstance(mirror_roots, list) or not all(\n        isinstance(value, str) for value in mirror_roots\n    ):\n        raise ValueError("exact-bound mirror roots are invalid")\n    allowed_roots.update(Path(value) for value in mirror_roots)\n    if data_root not in allowed_roots:\n        raise ValueError("dataset root is not an authorized exact-bound carrier root")\n''',
              label="authorized mirror roots",
          )
          runner = replace_once(
              runner,
              '''    reference_protocol = v6.read_json(reference_protocol_path)\n    parent_result = v6.read_json(parent_result_path)\n    parent_protocol = v6.read_json(parent_protocol_path)\n    v6.validate_protocol(\n        reference_protocol,\n        parent_control_root=parent_control_root,\n        parent_protocol_path=parent_protocol_path,\n        data_root=data_root,\n    )\n''',
              '''    reference_protocol = v6.read_json(reference_protocol_path)\n    validation_protocol = json.loads(json.dumps(reference_protocol))\n    validation_protocol["dataset_root"] = str(data_root)\n    parent_result = v6.read_json(parent_result_path)\n    parent_protocol = v6.read_json(parent_protocol_path)\n    v6.validate_protocol(\n        validation_protocol,\n        parent_control_root=parent_control_root,\n        parent_protocol_path=parent_protocol_path,\n        data_root=data_root,\n    )\n''',
              label="runtime-only reference root",
          )
          runner = replace_once(
              runner,
              '''        "information_boundary": {\n            "retrospective_target_reuse": True,\n''',
              '''        "information_boundary": {\n            "official_dataset_root": str(protocol["dataset_root"]),\n            "operational_dataset_root": str(data_root),\n            "exact_bound_mirror_used": (\n                str(data_root) != str(protocol["dataset_root"])\n            ),\n            "retrospective_target_reuse": True,\n''',
              label="mirror provenance",
          )
          runner_path.write_text(runner, encoding="utf-8")

          protocol_path = Path("protocols/deform360_query_sufficient_dependence_v1.json")
          protocol = json.loads(protocol_path.read_text(encoding="utf-8"))
          protocol["exact_bound_mirror_roots"] = [
              "/mnt/lexar4tb/datasets/deform360"
          ]
          protocol_path.write_text(
              json.dumps(protocol, indent=2, sort_keys=True, allow_nan=False) + "\n",
              encoding="utf-8",
          )

          documentation = Path("docs/deform360_query_sufficient_dependence_v1.md")
          text = documentation.read_text(encoding="utf-8")
          addition = '''\n## Exact-bound mirror execution\n\nThe verified official snapshot remains the normative source. Because\n`gpuserver4090` is occupied by the separately authorized PoseIt archive hash, a\nsecond workflow may use `/mnt/lexar4tb/datasets/deform360` on `gpuserver6000`\nonly as an operational carrier mirror. The mirror path is not accepted on name\nor directory layout alone. Every selected robot, tactile, and median numeric\ncarrier and every bound action must reproduce the immutable 92-object parent\nreceipts; any absent or changed bound carrier stops the run. Extra files, caches,\nand episodes are inventoried but never selected or numerically opened. The\nmirror workflow cancels the still-queued official-root execution before the\nnumerical job is admitted, preventing duplicate evaluation.\n'''
          if "## Exact-bound mirror execution" in text:
              raise SystemExit("mirror documentation already exists")
          documentation.write_text(text.rstrip() + "\n" + addition, encoding="utf-8")

          source_workflow_path = Path(
              ".github/workflows/deform360-query-sufficient-dependence-v1.yml"
          )
          mirror_workflow_path = Path(
              ".github/workflows/deform360-query-sufficient-dependence-mirror-v1.yml"
          )
          workflow = source_workflow_path.read_text(encoding="utf-8")
          replacements = (
              (
                  "name: Deform360 query-sufficient dependence v1",
                  "name: Deform360 query-sufficient dependence exact-bound mirror v1",
              ),
              (
                  ".github/requests/deform360-query-sufficient-dependence-v1.json",
                  ".github/requests/deform360-query-sufficient-dependence-mirror-v1.json",
              ),
              ("  actions: read\n", "  actions: write\n"),
              (
                  "  group: deform360-query-sufficient-dependence-v1\n",
                  "  group: deform360-query-sufficient-dependence-mirror-v1\n",
              ),
              (
                  "  DATASET_ROOT: /mnt/seagate10tb/florianpfaff/datasets/deform360\n",
                  "  DATASET_ROOT: /mnt/lexar4tb/datasets/deform360\n",
              ),
              (
                  '"schema": "bayesian-phystwin/deform360-query-sufficient-dependence-request-v1"',
                  '"schema": "bayesian-phystwin/deform360-query-sufficient-dependence-mirror-request-v1"',
              ),
              (
                  '"request_id": "deform360-query-sufficient-dependence-v1-20260903"',
                  '"request_id": "deform360-query-sufficient-dependence-mirror-v1-20260903"',
              ),
              ("gpuserver4090", "gpuserver6000"),
              (
                  "/mnt/seagate10tb/florianpfaff/datasets/deform360",
                  "/mnt/lexar4tb/datasets/deform360",
              ),
              (
                  "name: deform360-query-sufficient-dependence-v1-${{ github.run_id }}-${{ github.run_attempt }}",
                  "name: deform360-query-sufficient-dependence-mirror-v1-${{ github.run_id }}-${{ github.run_attempt }}",
              ),
          )
          for old, new in replacements:
              if old not in workflow:
                  raise SystemExit(f"mirror workflow replacement not found: {old}")
              workflow = workflow.replace(old, new)

          old_header = '''  evaluate:\n    needs: [contracts, authorize]\n    if: >-\n      always() && needs.contracts.result == 'success' &&\n      needs.authorize.result == 'success'\n'''
          new_header = '''  cancel_superseded_4090:\n    needs: [contracts, authorize]\n    if: >-\n      always() && needs.contracts.result == 'success' &&\n      needs.authorize.result == 'success'\n    runs-on: ubuntu-latest\n    timeout-minutes: 5\n    steps:\n      - name: Cancel superseded queued official-root run\n        shell: bash\n        env:\n          GH_TOKEN: ${{ github.token }}\n          SUPERSEDED_RUN_ID: "33751179795"\n        run: |\n          set -euo pipefail\n          status=$(\n            curl --fail --silent --show-error \\\n              -H "Authorization: Bearer ${GH_TOKEN}" \\\n              -H "Accept: application/vnd.github+json" \\\n              -H "X-GitHub-Api-Version: 2022-11-28" \\\n              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${SUPERSEDED_RUN_ID}" \\\n              | python -c 'import json,sys; print(json.load(sys.stdin)["status"])'\n          )\n          case "${status}" in\n            queued|in_progress|waiting|pending|requested)\n              curl --fail --silent --show-error --request POST \\\n                -H "Authorization: Bearer ${GH_TOKEN}" \\\n                -H "Accept: application/vnd.github+json" \\\n                -H "X-GitHub-Api-Version: 2022-11-28" \\\n                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${SUPERSEDED_RUN_ID}/cancel"\n              ;;\n            completed)\n              ;;\n            *)\n              echo "unexpected superseded run status: ${status}" >&2\n              exit 1\n              ;;\n          esac\n\n  evaluate:\n    needs: [contracts, authorize, cancel_superseded_4090]\n    if: >-\n      always() && needs.contracts.result == 'success' &&\n      needs.authorize.result == 'success' &&\n      needs.cancel_superseded_4090.result == 'success'\n'''
          workflow = replace_once(
              workflow,
              old_header,
              new_header,
              label="mirror cancellation gate",
          )
          mirror_workflow_path.write_text(workflow, encoding="utf-8")
          PY
          python -m ruff format \
            scripts/science/run_deform360_query_sufficient_dependence_v1.py \
            tests/test_deform360_query_sufficient_dependence_v1.py
          python -m ruff check \
            scripts/science/run_deform360_query_sufficient_dependence_v1.py \
            tests/test_deform360_query_sufficient_dependence_v1.py
          python -m ruff format --check \
            scripts/science/run_deform360_query_sufficient_dependence_v1.py \
            tests/test_deform360_query_sufficient_dependence_v1.py
          python -m pytest -q tests/test_deform360_query_sufficient_dependence_v1.py
          python -m json.tool protocols/deform360_query_sufficient_dependence_v1.json >/dev/null
          grep -F 'gpuserver6000' .github/workflows/deform360-query-sufficient-dependence-mirror-v1.yml
          grep -F '/mnt/lexar4tb/datasets/deform360' .github/workflows/deform360-query-sufficient-dependence-mirror-v1.yml
          grep -F '33751179795/cancel' .github/workflows/deform360-query-sufficient-dependence-mirror-v1.yml
          git rm \
            .github/workflows/prepare-deform360-query-sufficient-mirror-v1.yml \
            .github/requests/prepare-deform360-query-sufficient-mirror-v1.json
          git add \
            scripts/science/run_deform360_query_sufficient_dependence_v1.py \
            tests/test_deform360_query_sufficient_dependence_v1.py \
            protocols/deform360_query_sufficient_dependence_v1.json \
            docs/deform360_query_sufficient_dependence_v1.md \
            .github/workflows/deform360-query-sufficient-dependence-mirror-v1.yml
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Add exact-bound gpuserver6000 mirror execution"
          git push origin "HEAD:${GITHUB_REF_NAME}"
