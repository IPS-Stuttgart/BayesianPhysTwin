name: One-shot finalize PR 138

on:
  push:
    branches:
      - agent/deform360-visual-provider-locks

permissions:
  contents: write

concurrency:
  group: one-shot-finalize-pr138
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event.head_commit.message != 'Finalize visual-provider lock integration'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/deform360-visual-provider-locks
          fetch-depth: 0

      - name: Bind the visual calibration lock to the finite-group design
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          DESIGN_ID = "697261131ae83a08a0ce437c7b837f32ab4870c6c0cc4256784373b3ce19f1c8"
          DESIGN_PATH = (
              "protocols/amendments/"
              "deform360_official_hub_visuotactile_v1_calibration_separation.json"
          )

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected one replacement in {path}, found {count}: {old!r}"
                  )
              file_path.write_text(text.replace(old, new), encoding="utf-8")

          visual_path = "src/bayesian_phystwin/deform360_visual_provider_lock.py"
          replace_once(
              visual_path,
              'DEFORM360_MOTIONCRAFTER_REPOSITORY = "TencentARC/MotionCrafter"\n\n',
              'DEFORM360_MOTIONCRAFTER_REPOSITORY = "TencentARC/MotionCrafter"\n'
              'DEFORM360_FINITE_GROUP_CALIBRATION_DESIGN_ID = (\n'
              f'    "{DESIGN_ID}"\n'
              ')\n'
              'DEFORM360_FINITE_GROUP_CALIBRATION_GROUP_COUNT = 10\n'
              'DEFORM360_FINITE_GROUP_CONFORMAL_RANK = 10\n\n',
          )
          replace_once(
              visual_path,
              '    "calibration-only-visual-contact-guard-interval-lock-v1"\n',
              '    "calibration-only-visual-contact-guard-interval-finite-group-lock-v1"\n',
          )
          replace_once(
              visual_path,
              '        "interval_calibration_id",\n'
              '        "calibration_group_count",\n',
              '        "interval_calibration_id",\n'
              '        "calibration_design_id",\n'
              '        "calibration_group_count",\n',
          )
          replace_once(
              visual_path,
              '    interval_calibration_id: str\n'
              '    calibration_group_count: int\n',
              '    interval_calibration_id: str\n'
              '    calibration_design_id: str\n'
              '    calibration_group_count: int\n',
          )
          replace_once(
              visual_path,
              '        interval_calibration_id = _sha256(\n'
              '            self.interval_calibration_id,\n'
              '            name="interval_calibration_id",\n'
              '        )\n'
              '        calibration_group_count = genuine_integer(\n',
              '        interval_calibration_id = _sha256(\n'
              '            self.interval_calibration_id,\n'
              '            name="interval_calibration_id",\n'
              '        )\n'
              '        calibration_design_id = _sha256(\n'
              '            self.calibration_design_id,\n'
              '            name="calibration_design_id",\n'
              '        )\n'
              '        if (\n'
              '            calibration_design_id\n'
              '            != DEFORM360_FINITE_GROUP_CALIBRATION_DESIGN_ID\n'
              '        ):\n'
              '            raise ValueError(\n'
              '                "calibration_design_id changed the registered "\n'
              '                "finite-group design"\n'
              '            )\n'
              '        calibration_group_count = genuine_integer(\n',
          )
          replace_once(
              visual_path,
              '        if calibration_group_count != len(calibration_object_ids):\n'
              '            raise ValueError(\n'
              '                "calibration_group_count must equal the number of calibration objects"\n'
              '            )\n'
              '        conformal_rank = genuine_integer(\n',
              '        if calibration_group_count != len(calibration_object_ids):\n'
              '            raise ValueError(\n'
              '                "calibration_group_count must equal the number of calibration objects"\n'
              '            )\n'
              '        if (\n'
              '            calibration_group_count\n'
              '            != DEFORM360_FINITE_GROUP_CALIBRATION_GROUP_COUNT\n'
              '        ):\n'
              '            raise ValueError(\n'
              '                "calibration_group_count must equal the registered "\n'
              '                "finite-group design count"\n'
              '            )\n'
              '        conformal_rank = genuine_integer(\n',
          )
          replace_once(
              visual_path,
              '        if conformal_rank > calibration_group_count:\n'
              '            raise ValueError("conformal_rank exceeds calibration_group_count")\n',
              '        if conformal_rank != DEFORM360_FINITE_GROUP_CONFORMAL_RANK:\n'
              '            raise ValueError(\n'
              '                "conformal_rank must equal the registered finite-group "\n'
              '                "design rank"\n'
              '            )\n',
          )
          replace_once(
              visual_path,
              '        object.__setattr__(\n'
              '            self,\n'
              '            "interval_calibration_id",\n'
              '            interval_calibration_id,\n'
              '        )\n'
              '        object.__setattr__(\n'
              '            self,\n'
              '            "calibration_group_count",\n',
              '        object.__setattr__(\n'
              '            self,\n'
              '            "interval_calibration_id",\n'
              '            interval_calibration_id,\n'
              '        )\n'
              '        object.__setattr__(\n'
              '            self,\n'
              '            "calibration_design_id",\n'
              '            calibration_design_id,\n'
              '        )\n'
              '        object.__setattr__(\n'
              '            self,\n'
              '            "calibration_group_count",\n',
          )
          replace_once(
              visual_path,
              '            "interval_calibration_id": self.interval_calibration_id,\n'
              '            "calibration_group_count": self.calibration_group_count,\n',
              '            "interval_calibration_id": self.interval_calibration_id,\n'
              '            "calibration_design_id": self.calibration_design_id,\n'
              '            "calibration_group_count": self.calibration_group_count,\n',
          )
          replace_once(
              visual_path,
              '            interval_calibration_id=cast(str, value["interval_calibration_id"]),\n'
              '            calibration_group_count=cast(int, value["calibration_group_count"]),\n',
              '            interval_calibration_id=cast(str, value["interval_calibration_id"]),\n'
              '            calibration_design_id=cast(str, value["calibration_design_id"]),\n'
              '            calibration_group_count=cast(int, value["calibration_group_count"]),\n',
          )

          test_path = "tests/test_deform360_visual_provider_lock.py"
          replace_once(
              test_path,
              '    DEFORM360_VISUAL_PROVIDER_AMENDMENT_ID,\n'
              '    DEFORM360_VISUOTACTILE_PROTOCOL_ID,\n',
              '    DEFORM360_FINITE_GROUP_CALIBRATION_DESIGN_ID,\n'
              '    DEFORM360_FINITE_GROUP_CALIBRATION_GROUP_COUNT,\n'
              '    DEFORM360_FINITE_GROUP_CONFORMAL_RANK,\n'
              '    DEFORM360_VISUAL_PROVIDER_AMENDMENT_ID,\n'
              '    DEFORM360_VISUOTACTILE_PROTOCOL_ID,\n',
          )
          replace_once(
              test_path,
              '        "interval_calibration_id": "f" * 64,\n'
              '        "calibration_group_count": 10,\n',
              '        "interval_calibration_id": "f" * 64,\n'
              '        "calibration_design_id": (\n'
              '            DEFORM360_FINITE_GROUP_CALIBRATION_DESIGN_ID\n'
              '        ),\n'
              '        "calibration_group_count": 10,\n',
          )
          replace_once(
              test_path,
              '    assert loaded.calibration_group_count == 10\n'
              '    assert loaded.conformal_rank == 10\n',
              '    assert (\n'
              '        loaded.calibration_design_id\n'
              '        == DEFORM360_FINITE_GROUP_CALIBRATION_DESIGN_ID\n'
              '    )\n'
              '    assert (\n'
              '        loaded.calibration_group_count\n'
              '        == DEFORM360_FINITE_GROUP_CALIBRATION_GROUP_COUNT\n'
              '    )\n'
              '    assert loaded.conformal_rank == DEFORM360_FINITE_GROUP_CONFORMAL_RANK\n',
          )
          replace_once(
              test_path,
              '        ({"conformal_rank": 11}, "exceeds"),\n',
              '        ({"conformal_rank": 11}, "registered finite-group"),\n'
              '        ({"calibration_design_id": "9" * 64}, "finite-group design"),\n',
          )
          replace_once(
              test_path,
              '        {"interval_calibration_id": int("6" * 64)},\n'
              '        {"calibration_group_count": True},\n',
              '        {"interval_calibration_id": int("6" * 64)},\n'
              '        {"calibration_design_id": int("7" * 64)},\n'
              '        {"calibration_group_count": True},\n',
          )
          replace_once(
              test_path,
              '    assert amendment["calibration_lock"]["schema_version"] == 1\n'
              '    assert amendment["status"] == "locked-before-selected-calibration-payload-access"\n',
              '    assert amendment["calibration_lock"]["schema_version"] == 1\n'
              '    design = amendment["finite_group_calibration_design"]\n'
              '    assert design["artifact_id"] == DEFORM360_FINITE_GROUP_CALIBRATION_DESIGN_ID\n'
              '    assert design["must_be_bound_by_calibration_lock"] is True\n'
              '    design_record = json.loads(\n'
              '        (Path(__file__).resolve().parents[1] / design["path"]).read_text(\n'
              '            encoding="utf-8"\n'
              '        )\n'
              '    )\n'
              '    assert design_record["artifact_id"] == design["artifact_id"]\n'
              '    assert amendment["status"] == "locked-before-selected-calibration-payload-access"\n',
          )

          amendment_path = Path(
              "protocols/amendments/"
              "deform360_official_hub_visuotactile_v1_visual_provider_lock.json"
          )
          amendment = json.loads(amendment_path.read_text(encoding="utf-8"))
          amendment["finite_group_calibration_design"] = {
              "artifact_id": DESIGN_ID,
              "calibration_group_count": 10,
              "conformal_rank": 10,
              "must_be_bound_by_calibration_lock": True,
              "nominal_coverage": 0.9,
              "path": DESIGN_PATH,
              "policy_selection_uses_calibration_outcomes": False,
          }
          required = amendment["calibration_lock"]["required_bindings"]
          binding = "exact finite-group calibration-design artifact ID"
          if binding not in required:
              required.insert(2, binding)
          stage = amendment["stage_order"]
          freeze_step = (
              "freeze the deployed predictor, score, guard, grouping rule, and "
              "endpoint set from external or source-only evidence before "
              "interval-calibration scores are inspected"
          )
          if freeze_step not in stage:
              stage.insert(2, freeze_step)
          amendment_path.write_text(
              json.dumps(amendment, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          docs_path = Path("docs/deform360_visual_provider_lock_v1.md")
          docs = docs_path.read_text(encoding="utf-8")
          section = """

          ## Finite-group calibration binding

          The Stage-1 calibration lock must bind the exact content identity of
          `deform360_official_hub_visuotactile_v1_calibration_separation.json`.
          That design fixes the physical object as the statistical unit, pools all
          ten calibration objects for the primary nominal-90% interval, records
          conformal rank 10, and forbids a nominal-95% or five-object-stratum
          nominal-90% split-conformal claim.

          The deployed predictor, score, guard, grouping rule, and endpoint set
          must be fixed from external or source-only evidence before interval
          scores are inspected. Calibration outcomes cannot also select the policy
          under this split-conformal contract. CV+ or jackknife+ would require a
          separately versioned design.
          """.strip("\n")
          if "## Finite-group calibration binding" not in docs:
              docs_path.write_text(docs.rstrip() + "\n\n" + section + "\n", encoding="utf-8")

          workflow_path = ".github/workflows/deform360-visual-provider-lock.yml"
          replace_once(
              workflow_path,
              '      - "protocols/amendments/deform360_official_hub_visuotactile_v1_visual_provider_lock.json"\n'
              '      - "docs/deform360_visual_provider_lock_v1.md"\n',
              '      - "protocols/amendments/deform360_official_hub_visuotactile_v1_visual_provider_lock.json"\n'
              '      - "protocols/amendments/deform360_official_hub_visuotactile_v1_calibration_separation.json"\n'
              '      - "docs/deform360_visual_provider_lock_v1.md"\n'
              '      - "docs/finite_group_calibration_design.md"\n',
          )
          replace_once(
              workflow_path,
              '      - "src/bayesian_phystwin/_canonical_contracts.py"\n',
              '      - "src/bayesian_phystwin/_canonical_contracts.py"\n'
              '      - "src/bayesian_phystwin/calibration.py"\n',
          )
          replace_once(
              workflow_path,
              '      - "tests/test_canonical_contracts.py"\n',
              '      - "tests/test_calibration.py"\n'
              '      - "tests/test_canonical_contracts.py"\n',
          )
          for command in ("check", "format --check"):
              replace_once(
                  workflow_path,
                  f'          python -m ruff {command} \\\n'
                  '            src/bayesian_phystwin/_canonical_contracts.py \\\n',
                  f'          python -m ruff {command} \\\n'
                  '            src/bayesian_phystwin/_canonical_contracts.py \\\n'
                  '            src/bayesian_phystwin/calibration.py \\\n',
              )
          replace_once(
              workflow_path,
              '            tests/test_canonical_contracts.py \\\n'
              '            tests/test_claim_bearing_identifier_types.py \\\n',
              '            tests/test_calibration.py \\\n'
              '            tests/test_canonical_contracts.py \\\n'
              '            tests/test_claim_bearing_identifier_types.py \\\n',
          )
          # The Ruff and formatting command blocks have identical test anchors.
          workflow = Path(workflow_path).read_text(encoding="utf-8")
          anchor = (
              '            tests/test_canonical_contracts.py \\\n'
              '            tests/test_claim_bearing_identifier_types.py \\\n'
          )
          desired = (
              '            tests/test_calibration.py \\\n'
              + anchor
          )
          remaining = workflow.count(anchor)
          if remaining != 2:
              raise SystemExit(
                  f"expected two remaining Ruff test anchors, found {remaining}"
              )
          workflow = workflow.replace(anchor, desired)
          Path(workflow_path).write_text(workflow, encoding="utf-8")

          tests_workflow_path = ".github/workflows/tests.yml"
          tests_workflow = Path(tests_workflow_path).read_text(encoding="utf-8")
          marker = (
              '            tests/test_gauge_aware_belief.py \\\n'
              '            tests/test_deform360_contact_anchor.py \\\n'
          )
          addition = (
              '            tests/test_gauge_aware_belief.py \\\n'
              '            tests/test_canonical_contracts.py \\\n'
              '            tests/test_claim_bearing_identifier_types.py \\\n'
              '            tests/test_deform360_contact_anchor.py \\\n'
              '            tests/test_deform360_visual_provider_lock.py \\\n'
          )
          count = tests_workflow.count(marker)
          if count != 2:
              raise SystemExit(f"expected two core-suite markers, found {count}")
          Path(tests_workflow_path).write_text(
              tests_workflow.replace(marker, addition),
              encoding="utf-8",
          )

          manifest = """include LICENSE
          include CITATION.cff
          include CHANGELOG.md
          include SUPPORT.md
          include THIRD_PARTY_NOTICES.md
          include docs/deform360_visual_provider_lock_v1.md
          include docs/finite_group_calibration_design.md
          include protocols/amendments/deform360_official_hub_visuotactile_v1_visual_provider_lock.json
          include protocols/amendments/deform360_official_hub_visuotactile_v1_calibration_separation.json
          """
          Path("MANIFEST.in").write_text(manifest, encoding="utf-8")

          replace_once(
              "README.md",
              '- [Causal4D provider v1](docs/causal4d_provider_v1.md): supported provider\n',
              '- [Deform360 visual-provider locks](docs/deform360_visual_provider_lock_v1.md):\n'
              '  target-blind producer identity before calibration data and calibration-derived\n'
              '  method locks before confirmation data.\n'
              '- [Finite-group calibration design](docs/finite_group_calibration_design.md):\n'
              '  independent-object rank limits, information order, and fail-closed planning.\n'
              '- [Causal4D provider v1](docs/causal4d_provider_v1.md): supported provider\n',
          )

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          added_anchor = (
              '  before any camera, tactile, robot, or geometry payload access.\n\n'
              '### Changed\n'
          )
          added_text = (
              '  before any camera, tactile, robot, or geometry payload access.\n'
              '- Target-blind Deform360 visual-provider and Stage-1 calibration locks that\n'
              '  bind the exact Prob4D/MotionCrafter producer before calibration payload access\n'
              '  and calibration-derived visual, contact, guard, interval, and finite-group\n'
              '  design artifacts before confirmation payload access.\n'
              '- Decimal-exact finite-group split-conformal planning that rejects impossible\n'
              '  coverage and adaptive reuse of calibration outcomes before target access.\n\n'
              '### Changed\n'
          )
          if changelog.count(added_anchor) != 1:
              raise SystemExit("CHANGELOG Added anchor changed")
          changelog = changelog.replace(added_anchor, added_text)
          changed_anchor = (
              '### Changed\n\n'
              '- Stable pseudo-measurement, robust-mixture, and binary-calibration inputs now\n'
          )
          changed_text = (
              '### Changed\n\n'
              '- Claim-bearing hexadecimal identifiers now require literal lowercase strings;\n'
              '  integers, bytes, and custom string subclasses are rejected instead of being\n'
              '  admitted through lossy `str(value)` coercion. Deform360 source artifacts also\n'
              '  require canonical relative POSIX paths, and a supplied contact-bias basis must\n'
              '  contain at least one parameter.\n'
              '- Stable pseudo-measurement, robust-mixture, and binary-calibration inputs now\n'
          )
          if changelog.count(changed_anchor) != 1:
              raise SystemExit("CHANGELOG Changed anchor changed")
          changelog_path.write_text(
              changelog.replace(changed_anchor, changed_text),
              encoding="utf-8",
          )

          init_path = "src/bayesian_phystwin/__init__.py"
          replace_once(
              init_path,
              'from .calibration import BinaryCalibrationMetrics, binary_calibration_metrics\n',
              'from .calibration import (\n'
              '    BinaryCalibrationMetrics,\n'
              '    FiniteGroupCalibrationDesign,\n'
              '    binary_calibration_metrics,\n'
              '    finite_group_conformal_rank,\n'
              '    maximum_finite_group_coverage,\n'
              '    minimum_groups_for_finite_conformal,\n'
              '    plan_finite_group_calibration,\n'
              ')\n',
          )
          contact_import = (
              'from .deform360_contact_anchor import (\n'
              '    DEFORM360_CONTACT_ANCHOR_SCHEMA,\n'
              '    DEFORM360_CONTACT_ANCHOR_SEMANTICS,\n'
              '    DEFORM360_CONTACT_ANCHOR_UNITS,\n'
              '    DEFORM360_CONTACT_ANCHOR_VERSION,\n'
              '    DEFORM360_SOURCE_REPOSITORY,\n'
              '    DEFORM360_TACTILE_SOURCE_UNITS,\n'
              '    Deform360ContactAnchorV1,\n'
              '    attach_deform360_contact_anchor,\n'
              ')\n'
          )
          visual_import = contact_import + (
              'from .deform360_visual_provider_lock import (\n'
              '    DEFORM360_FINITE_GROUP_CALIBRATION_DESIGN_ID,\n'
              '    DEFORM360_FINITE_GROUP_CALIBRATION_GROUP_COUNT,\n'
              '    DEFORM360_FINITE_GROUP_CONFORMAL_RANK,\n'
              '    DEFORM360_MOTIONCRAFTER_REPOSITORY,\n'
              '    DEFORM360_PROB4D_REPOSITORY,\n'
              '    DEFORM360_VISUAL_CALIBRATION_LOCK_SCHEMA,\n'
              '    DEFORM360_VISUAL_CALIBRATION_LOCK_SEMANTICS,\n'
              '    DEFORM360_VISUAL_CALIBRATION_LOCK_VERSION,\n'
              '    DEFORM360_VISUAL_PROVIDER_AMENDMENT_ID,\n'
              '    DEFORM360_VISUAL_PROVIDER_LOCK_SCHEMA,\n'
              '    DEFORM360_VISUAL_PROVIDER_LOCK_SEMANTICS,\n'
              '    DEFORM360_VISUAL_PROVIDER_LOCK_VERSION,\n'
              '    DEFORM360_VISUOTACTILE_PROTOCOL_ID,\n'
              '    Deform360VisualCalibrationLockV1,\n'
              '    Deform360VisualProviderLockV1,\n'
              '    load_deform360_visual_calibration_lock,\n'
              '    load_deform360_visual_provider_lock,\n'
              '    save_deform360_visual_calibration_lock,\n'
              '    save_deform360_visual_provider_lock,\n'
              ')\n'
          )
          replace_once(init_path, contact_import, visual_import)
          replace_once(
              init_path,
              '    "DEFORM360_SOURCE_REPOSITORY",\n'
              '    "DEFORM360_TACTILE_SOURCE_UNITS",\n'
              '    "BinaryCalibrationMetrics",\n',
              '    "DEFORM360_SOURCE_REPOSITORY",\n'
              '    "DEFORM360_FINITE_GROUP_CALIBRATION_DESIGN_ID",\n'
              '    "DEFORM360_FINITE_GROUP_CALIBRATION_GROUP_COUNT",\n'
              '    "DEFORM360_FINITE_GROUP_CONFORMAL_RANK",\n'
              '    "DEFORM360_MOTIONCRAFTER_REPOSITORY",\n'
              '    "DEFORM360_PROB4D_REPOSITORY",\n'
              '    "DEFORM360_TACTILE_SOURCE_UNITS",\n'
              '    "DEFORM360_VISUAL_CALIBRATION_LOCK_SCHEMA",\n'
              '    "DEFORM360_VISUAL_CALIBRATION_LOCK_SEMANTICS",\n'
              '    "DEFORM360_VISUAL_CALIBRATION_LOCK_VERSION",\n'
              '    "DEFORM360_VISUAL_PROVIDER_AMENDMENT_ID",\n'
              '    "DEFORM360_VISUAL_PROVIDER_LOCK_SCHEMA",\n'
              '    "DEFORM360_VISUAL_PROVIDER_LOCK_SEMANTICS",\n'
              '    "DEFORM360_VISUAL_PROVIDER_LOCK_VERSION",\n'
              '    "DEFORM360_VISUOTACTILE_PROTOCOL_ID",\n'
              '    "BinaryCalibrationMetrics",\n'
              '    "FiniteGroupCalibrationDesign",\n',
          )
          replace_once(
              init_path,
              '    "Deform360ContactAnchorV1",\n'
              '    "ConformalScore",\n',
              '    "Deform360ContactAnchorV1",\n'
              '    "Deform360VisualCalibrationLockV1",\n'
              '    "Deform360VisualProviderLockV1",\n'
              '    "ConformalScore",\n',
          )
          replace_once(
              init_path,
              '    "binary_calibration_metrics",\n'
              '    "build_claim_bearing_gauge_aware_batch_from_artifacts",\n',
              '    "binary_calibration_metrics",\n'
              '    "finite_group_conformal_rank",\n'
              '    "build_claim_bearing_gauge_aware_batch_from_artifacts",\n',
          )
          replace_once(
              init_path,
              '    "is_prob4d_causal_observation_belief",\n'
              '    "load_observation_belief",\n',
              '    "is_prob4d_causal_observation_belief",\n'
              '    "load_deform360_visual_calibration_lock",\n'
              '    "load_deform360_visual_provider_lock",\n'
              '    "load_observation_belief",\n',
          )
          replace_once(
              init_path,
              '    "markov_log_evidence_batch",\n'
              '    "material_identity_candidate_lineage",\n',
              '    "markov_log_evidence_batch",\n'
              '    "maximum_finite_group_coverage",\n'
              '    "material_identity_candidate_lineage",\n'
              '    "minimum_groups_for_finite_conformal",\n',
          )
          replace_once(
              init_path,
              '    "predict_model_averaged_endpoint",\n'
