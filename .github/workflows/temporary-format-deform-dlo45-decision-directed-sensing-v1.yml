name: Temporary format DEFORM decision-directed sensing pilot

on:
  push:
    branches:
      - science/deform-dlo45-decision-directed-sensing-v1
    paths:
      - ".github/workflows/temporary-format-deform-dlo45-decision-directed-sensing-v1.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: science/deform-dlo45-decision-directed-sensing-v1
          fetch-depth: 0
      - name: Apply the repository formatter
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "ruff==0.16.5"
          python -m ruff check --fix \
            experiments/deform_dlo45_decision_directed_sensing_v1/evaluate.py \
            tests/test_deform_dlo45_decision_directed_sensing_v1.py
          python -m ruff format \
            experiments/deform_dlo45_decision_directed_sensing_v1/evaluate.py \
            tests/test_deform_dlo45_decision_directed_sensing_v1.py
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -ge 1
          for path in "${changed[@]}"; do
            case "$path" in
              experiments/deform_dlo45_decision_directed_sensing_v1/evaluate.py|tests/test_deform_dlo45_decision_directed_sensing_v1.py) ;;
              *) echo "unexpected formatter change: $path" >&2; exit 1 ;;
            esac
          done
          python -m ruff check \
            experiments/deform_dlo45_decision_directed_sensing_v1/evaluate.py \
            tests/test_deform_dlo45_decision_directed_sensing_v1.py
          python -m ruff format --check \
            experiments/deform_dlo45_decision_directed_sensing_v1/evaluate.py \
            tests/test_deform_dlo45_decision_directed_sensing_v1.py
          git diff --check
      - name: Commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            experiments/deform_dlo45_decision_directed_sensing_v1/evaluate.py \
            tests/test_deform_dlo45_decision_directed_sensing_v1.py
          git commit -m "Format DEFORM decision-directed sensing pilot"
          git push origin HEAD:science/deform-dlo45-decision-directed-sensing-v1
