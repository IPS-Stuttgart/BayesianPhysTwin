name: Stage Deform360 joint-sparse geometric v4 once

on:
  push:
    branches:
      - agent/materialize-deform360-joint-sparse-geometric-v4
    paths:
      - .github/workflows/_stage-deform360-joint-sparse-geometric-v4-once.yml

permissions:
  contents: write

concurrency:
  group: stage-deform360-joint-sparse-geometric-v4-once
  cancel-in-progress: false

jobs:
  stage:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.ref == 'refs/heads/agent/materialize-deform360-joint-sparse-geometric-v4'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/materialize-deform360-joint-sparse-geometric-v4
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Materialize reviewed source and remove the staging helper
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = \
            "agent/materialize-deform360-joint-sparse-geometric-v4"
          mkdir -p scripts/science
          cat > "${RUNNER_TEMP}/materializer.py.gz.b64" <<'B64'

B64
          base64 --decode "${RUNNER_TEMP}/materializer.py.gz.b64" \
            | gzip --decompress \
            > scripts/science/materialize_deform360_joint_sparse_geometric_v4.py
          test "$(sha256sum scripts/science/materialize_deform360_joint_sparse_geometric_v4.py | cut -d' ' -f1)" = \
            "4ac4d3050c0941a5bf412284d785080ac2a351badc03c3b0f5625a63c45c6a50"
          chmod 0755 scripts/science/materialize_deform360_joint_sparse_geometric_v4.py
          python3 -m py_compile \
            scripts/science/materialize_deform360_joint_sparse_geometric_v4.py
          rm -rf scripts/science/__pycache__

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_stage-deform360-joint-sparse-geometric-v4-once.yml
          git add \
            scripts/science/materialize_deform360_joint_sparse_geometric_v4.py \
            protocols/locks/deform360_official_hub_joint_sparse_geometric_materializer_v4.json
          git diff --check
          git commit -m "Add Deform360 joint-sparse geometric materializer v4"
          git push origin HEAD:agent/materialize-deform360-joint-sparse-geometric-v4
