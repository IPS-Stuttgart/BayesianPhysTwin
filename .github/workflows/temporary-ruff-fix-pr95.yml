name: Temporary Ruff import fix for PR 95

on:
  push:
    branches:
      - agent/prospective-belief-hardening
    paths:
      - .github/workflows/temporary-ruff-fix-pr95.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/prospective-belief-hardening
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: |
          python -m ruff check --fix tests/test_prospective_prob4d_update.py
          python -m ruff format tests/test_prospective_prob4d_update.py
          python -m ruff check tests/test_prospective_prob4d_update.py
          rm .github/workflows/temporary-ruff-fix-pr95.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_prospective_prob4d_update.py .github/workflows/temporary-ruff-fix-pr95.yml
          git commit -m "Organize prospective update test imports"
          git push origin HEAD:agent/prospective-belief-hardening
