name: Register recursive-corruption v2 coverage once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/register-recursive-corruption-v2-coverage-once.yml'

permissions:
  contents: write

jobs:
  register:
    if: github.head_ref == 'science/recursive-corruption-v2-matched-guards'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: science/recursive-corruption-v2-matched-guards
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Add focused v2 tests to the central coverage suite
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('.github/quality/test-suites.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          suite = data['suites']['stable-core-coverage']
          entry = 'tests/test_recursive_corruption_benchmark_v2.py'
          if entry not in suite:
              anchor = 'tests/test_recursive_corruption_benchmark.py'
              index = suite.index(anchor) + 1
              suite.insert(index, entry)
          path.write_text(
              json.dumps(data, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          PY
          python tools/quality/test_suite_manifest.py validate
          git diff --check
      - name: Commit registration and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/register-recursive-corruption-v2-coverage-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Register recursive-corruption v2 coverage tests'
          git push origin HEAD:science/recursive-corruption-v2-matched-guards
