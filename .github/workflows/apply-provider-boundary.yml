name: Apply typed Causal4D provider boundary

on:
  push:
    branches: [agent/complete-causal4d-provider-boundary]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[provider-boundary-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/complete-causal4d-provider-boundary
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply provider-boundary transformation
        run: |
          cat .github/provider-boundary-patch/payload00 \
              .github/provider-boundary-patch/payload01 \
            | base64 --decode | gzip --decompress > /tmp/apply-provider-boundary.py
          set +e
          python /tmp/apply-provider-boundary.py > /tmp/provider-boundary.log 2>&1
          status=$?
          set -e
          cat /tmp/provider-boundary.log
          test "$status" -eq 0
          rm -rf .github/provider-boundary-patch
          rm .github/workflows/apply-provider-boundary.yml
      - name: Upload migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-boundary-diagnostics
          path: /tmp/provider-boundary.log
      - name: Format and validate focused changes
        run: |
          python -m pip install -e '.[dev,graph]'
          python -m ruff format \
            src/bayesian_phystwin/causal4d_provider_v1.py \
            tests/test_causal4d_provider_v1.py \
            tests/test_causal4d_provider_semantics_v1.py
          python -m ruff check \
            src/bayesian_phystwin/causal4d_provider_v1.py \
            tests/test_causal4d_provider_v1.py \
            tests/test_causal4d_provider_semantics_v1.py
          python -m pytest -q \
            tests/test_causal4d_provider_v1.py \
            tests/test_causal4d_provider_semantics_v1.py
          git diff --check
      - name: Commit provider boundary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete typed Causal4D provider boundary [provider-boundary-applied]'
          git push origin HEAD:agent/complete-causal4d-provider-boundary
