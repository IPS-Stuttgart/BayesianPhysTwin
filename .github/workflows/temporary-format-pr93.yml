name: Temporary formatter for PR 93

on:
  push:
    branches:
      - agent/canonical-repository-identities
    paths:
      - .github/workflows/temporary-format-pr93.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/canonical-repository-identities
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: |
          python -m ruff format tests/test_repository_identity_and_typing.py
          python -m ruff check tests/test_repository_identity_and_typing.py
          rm .github/workflows/temporary-format-pr93.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_repository_identity_and_typing.py .github/workflows/temporary-format-pr93.yml
          git commit -m "Format repository identity regressions"
          git push origin HEAD:agent/canonical-repository-identities
