name: Temporary domain harm-risk threshold-leak test repair

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/domain-harm-risk-threshold-leak-test-fix.yml
      - tests/test_guard_harm_risk_domains.py

permissions:
  contents: write
  pull-requests: read

jobs:
  repair-and-remove:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Repair threshold-leak construction and remove this workflow
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_guard_harm_risk_domains.py")
          text = path.read_text(encoding="utf-8")
          old = (
              '    certificates = dict(certificate.domain_certificates)\n'
              '    leak = certificates["oscillatory"].group_ids[0]\n'
              '    certificates["dynamic"] = _recertify(\n'
              '        certificate.domain_guard_certificate,\n'
              '        "dynamic",\n'
              '        certificates["dynamic"],\n'
              '        threshold_selection_group_ids=(leak,),\n'
              '    )\n'
              '    with pytest.raises(ValueError, match="globally disjoint"):\n'
          )
          new = (
              '    certificates = dict(certificate.domain_certificates)\n'
              '    leak = certificates["oscillatory"].group_ids[0]\n'
              '    for domain in certificate.supported_domains:\n'
              '        certificates[domain] = _recertify(\n'
              '            certificate.domain_guard_certificate,\n'
              '            domain,\n'
              '            certificates[domain],\n'
              '            threshold_selection_group_ids=(leak,),\n'
              '        )\n'
              '    with pytest.raises(ValueError, match="globally disjoint"):\n'
          )
          if text.count(old) != 1:
              raise SystemExit("threshold-leak test marker was not found exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          python -m pip install "ruff==0.16.2"
          python -m ruff format tests/test_guard_harm_risk_domains.py
          python -m ruff format --check tests/test_guard_harm_risk_domains.py
          rm .github/workflows/domain-harm-risk-threshold-leak-test-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/test_guard_harm_risk_domains.py \
            .github/workflows/domain-harm-risk-threshold-leak-test-fix.yml
          git diff --cached --check
          git commit -m "Exercise global threshold leakage after roster validation"
          git push origin "HEAD:${HEAD_BRANCH}"
