name: Apply provider-owned information caps

on:
  push:
    branches:
      - agent/provider-owned-information-caps

permissions:
  contents: write

concurrency:
  group: agent-provider-owned-information-caps
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/provider-owned-information-caps
          fetch-depth: 0
      - name: Apply deterministic source transformations
        run: python .github/agent-patches/apply_provider_owned_caps.py
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Format and validate
        run: |
          python -m ruff format \
            src/bayesian_phystwin/_gauge_aware_contracts.py \
            src/bayesian_phystwin/_gauge_aware_solver.py \
            src/bayesian_phystwin/_prior_aware_gauge_math.py \
            src/bayesian_phystwin/gauge_aware_belief.py \
            src/bayesian_phystwin/observation_belief_gauge_adapter.py \
            src/bayesian_phystwin/prior_aware_gauge_belief.py \
            tests/test_information_mass_invariants.py \
            tests/test_observation_belief_gauge_adapter.py
          python -m ruff check \
            src/bayesian_phystwin/_gauge_aware_contracts.py \
            src/bayesian_phystwin/_gauge_aware_solver.py \
            src/bayesian_phystwin/_prior_aware_gauge_math.py \
            src/bayesian_phystwin/gauge_aware_belief.py \
            src/bayesian_phystwin/observation_belief_gauge_adapter.py \
            src/bayesian_phystwin/prior_aware_gauge_belief.py \
            tests/test_information_mass_invariants.py \
            tests/test_observation_belief_gauge_adapter.py
          python -m mypy \
            src/bayesian_phystwin/_gauge_aware_contracts.py \
            src/bayesian_phystwin/_gauge_aware_solver.py \
            src/bayesian_phystwin/_prior_aware_gauge_math.py \
            src/bayesian_phystwin/gauge_aware_belief.py \
            src/bayesian_phystwin/observation_belief_gauge_adapter.py \
            src/bayesian_phystwin/prior_aware_gauge_belief.py
          python -m pytest -q \
            tests/test_information_mass_invariants.py \
            tests/test_observation_belief_gauge_adapter.py \
            tests/test_gauge_aware_belief.py \
            tests/test_prior_aware_and_linearization.py \
            tests/test_prior_aware_likelihood_conformance.py
          git diff --check
      - name: Commit applied patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Respect provider-owned information caps"
          git push origin HEAD:agent/provider-owned-information-caps
