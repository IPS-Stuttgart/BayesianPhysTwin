name: Launch reviewed Deform360 Prob4D source continuation once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/launch-deform360-prob4d-source-continuation-once.yml"

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: launch-deform360-prob4d-source-continuation-v1
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/deform360-prob4d-source-continuation.yml
    with:
      execute_authorized: true

