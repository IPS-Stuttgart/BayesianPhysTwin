# workflow-lifecycle: temporary
# workflow-owner: IPS-Stuttgart maintainers
name: Materialize interventional cause estimation v1

on:
  push:
    branches:
      - research/interventional-cause-estimation-v1
    paths:
      - .github/agent-payloads/interventional-cause-estimation-v1.part*.b64
      - .github/workflows/materialize-interventional-cause-estimation-v1.yml

permissions:
  contents: write

concurrency:
  group: materialize-interventional-cause-estimation-v1
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.ref == 'refs/heads/research/interventional-cause-estimation-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact chunk commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Reconstruct and extract bounded payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = \
            "refs/heads/research/interventional-cause-estimation-v1"

          chunks=(
            .github/agent-payloads/interventional-cause-estimation-v1.part00.b64
            .github/agent-payloads/interventional-cause-estimation-v1.part01.b64
            .github/agent-payloads/interventional-cause-estimation-v1.part02.b64
            .github/agent-payloads/interventional-cause-estimation-v1.part03.b64
            .github/agent-payloads/interventional-cause-estimation-v1.part04.b64
            .github/agent-payloads/interventional-cause-estimation-v1.part05.b64
            .github/agent-payloads/interventional-cause-estimation-v1.part06.b64
          )
          for chunk in "${chunks[@]}"; do
            test -f "$chunk"
            echo "chunk=$chunk bytes=$(wc -c < "$chunk") sha256=$(sha256sum "$chunk" | cut -d' ' -f1)"
          done

          payload="$RUNNER_TEMP/interventional-cause-estimation-v1.tgz"
          cat "${chunks[@]}" | tr -d '\r\n' | base64 --decode > "$payload"
          actual_payload_sha="$(sha256sum "$payload" | cut -d' ' -f1)"
          echo "payload_bytes=$(wc -c < "$payload")"
          echo "payload_sha256=$actual_payload_sha"
          echo "payload_members_begin"
          tar -tzf "$payload"
          echo "payload_members_end"
          test "$actual_payload_sha" = \
            dbd571abd146231b3fa6d2e2c4b4be40907ca875ec6eecc52a0c016a425b53c5

          destination="$RUNNER_TEMP/why-twin-v2"
          rm -rf "$destination"
          mkdir -p "$destination"
          PAYLOAD="$payload" DESTINATION="$destination" python - <<'PY'
          import os
          import tarfile
          from pathlib import Path

          expected = {
              "docs/interventional_cause_estimation_v1.md",
              "scripts/science/run_interventional_cause_estimation_design_v1.py",
              "src/bayesian_phystwin_experiments/interventional_cause_estimation_v1.py",
              "tests/test_interventional_cause_estimation_controlled_v1.py",
              "tests/test_interventional_cause_estimation_v1.py",
          }
          payload = Path(os.environ["PAYLOAD"])
          destination = Path(os.environ["DESTINATION"]).resolve()
          with tarfile.open(payload, "r:gz") as archive:
              members = archive.getmembers()
              names = {member.name for member in members}
              if names != expected:
                  raise SystemExit(f"payload roster changed: {sorted(names)}")
              for member in members:
                  if not member.isfile():
                      raise SystemExit(f"non-regular payload member: {member.name}")
                  target = (destination / member.name).resolve()
                  if not target.is_relative_to(destination):
                      raise SystemExit(f"payload escapes destination: {member.name}")
              archive.extractall(destination, filter="data")
          PY

          while IFS= read -r relative; do
            install -D -m 0644 "$destination/$relative" "$relative"
          done <<'EOF'
          docs/interventional_cause_estimation_v1.md
          scripts/science/run_interventional_cause_estimation_design_v1.py
          src/bayesian_phystwin_experiments/interventional_cause_estimation_v1.py
          tests/test_interventional_cause_estimation_controlled_v1.py
          tests/test_interventional_cause_estimation_v1.py
          EOF

      - name: Validate scientific product
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pip check
          files=(
            src/bayesian_phystwin_experiments/interventional_cause_estimation_v1.py
            scripts/science/run_interventional_cause_estimation_design_v1.py
            tests/test_interventional_cause_estimation_v1.py
            tests/test_interventional_cause_estimation_controlled_v1.py
          )
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          PYTHONPATH=src python -m pytest -q -p no:cacheprovider \
            tests/test_interventional_cause_identifiability_v1.py \
            tests/test_interventional_cause_attribution_controlled_v1.py \
            tests/test_interventional_cause_estimation_v1.py \
            tests/test_interventional_cause_estimation_controlled_v1.py
          python -m compileall -q \
            src/bayesian_phystwin_experiments/interventional_cause_estimation_v1.py \
            scripts/science/run_interventional_cause_estimation_design_v1.py

      - name: Publish clean product commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/agent-payloads/interventional-cause-estimation-v1.tgz \
            .github/agent-payloads/interventional-cause-estimation-v1.part*.b64 \
            .github/workflows/materialize-interventional-cause-estimation-v1.yml
          rmdir .github/agent-payloads 2>/dev/null || true
          git add --all
          python - <<'PY'
          import subprocess

          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only"], text=True
              ).splitlines()
          )
          expected = {
              ".github/agent-payloads/interventional-cause-estimation-v1.tgz",
              ".github/agent-payloads/interventional-cause-estimation-v1.part00.b64",
              ".github/agent-payloads/interventional-cause-estimation-v1.part01.b64",
              ".github/agent-payloads/interventional-cause-estimation-v1.part02.b64",
              ".github/agent-payloads/interventional-cause-estimation-v1.part03.b64",
              ".github/agent-payloads/interventional-cause-estimation-v1.part04.b64",
              ".github/agent-payloads/interventional-cause-estimation-v1.part05.b64",
              ".github/agent-payloads/interventional-cause-estimation-v1.part06.b64",
              ".github/workflows/materialize-interventional-cause-estimation-v1.yml",
              "docs/interventional_cause_estimation_v1.md",
              "scripts/science/run_interventional_cause_estimation_design_v1.py",
              "src/bayesian_phystwin_experiments/interventional_cause_estimation_v1.py",
              "tests/test_interventional_cause_estimation_controlled_v1.py",
              "tests/test_interventional_cause_estimation_v1.py",
          }
          if changed != expected:
              raise SystemExit(
                  f"unexpected product diff: missing={sorted(expected-changed)}, "
                  f"extra={sorted(changed-expected)}"
              )
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Add quantitative interventional cause estimation'
          git push origin \
            HEAD:research/interventional-cause-estimation-v1
