name: Apply tree-separator shadow parity

on:
  push:
    branches: [agent/tree-separator-shadow-parity-v1]

permissions:
  contents: write

concurrency:
  group: apply-tree-separator-shadow-parity-${{ github.ref }}
  cancel-in-progress: true

