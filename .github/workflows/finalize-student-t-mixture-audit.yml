name: Finalize Student-t mixture audit

on:
  push:
    branches: [agent/finalize-student-t-mixture-audit]
    paths:
      - ".github/workflows/finalize-student-t-mixture-audit.yml"

permissions:
  contents: write

concurrency:
  group: finalize-student-t-mixture-audit
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/finalize-student-t-mixture-audit
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Apply fail-closed convergence and covariance diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path


          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected one match in {path}, found {count}: {old[:80]!r}"
                  )
              file_path.write_text(text.replace(old, new), encoding="utf-8")


          solver = "src/bayesian_phystwin/prior_aware_gauge_belief.py"
          replace_once(
              solver,
              '''        if (
                      solution_delta <= cfg.convergence_tolerance * solution_scale
                      and stationarity_norm
                      <= cfg.convergence_tolerance * stationarity_scale
                  ):
                      fixed_point_converged = True
                      break

              condition_number = float(np.linalg.cond(normal))
          ''',
              '''        if (
                      solution_delta <= cfg.convergence_tolerance * solution_scale
                      and stationarity_norm
                      <= cfg.convergence_tolerance * stationarity_scale
                  ):
                      fixed_point_converged = True
                      break

              if not fixed_point_converged:
                  diagnostics.update(
                      {
                          "iterations": iteration_count,
                          "mixture_fixed_point_converged": False,
                          "mixture_solution_delta": solution_delta,
                          "mixture_stationarity_norm": stationarity_norm,
                          "condition_number": condition_number,
                      }
                  )
                  return _fallback_result(
                      batch,
                      "mixture-fixed-point-not-converged",
                      diagnostics,
                      prior_covariance=full_prior,
                  )

              condition_number = float(np.linalg.cond(normal))
          ''',
          )
          replace_once(
              solver,
              '''    covariance = _full_covariance(
                  state_prior, state_mapping, reduced_covariance, nuisance_count
              )
              query_update = np.einsum(
          ''',
              '''    covariance = _full_covariance(
                  state_prior, state_mapping, reduced_covariance, nuisance_count
              )
              covariance_symmetry_error = float(
                  np.max(np.abs(covariance - covariance.T), initial=0.0)
              )
              covariance_eigenvalues = np.linalg.eigvalsh(covariance)
              covariance_minimum_eigenvalue = float(np.min(covariance_eigenvalues))
              query_update = np.einsum(
          ''',
          )
          replace_once(
              solver,
              '''            "condition_number": condition_number,
                          "maximum_query_state_update_m": maximum_update,
          ''',
              '''            "condition_number": condition_number,
                          "posterior_covariance_symmetry_error": (
                              covariance_symmetry_error
                          ),
                          "posterior_covariance_minimum_eigenvalue": (
                              covariance_minimum_eigenvalue
                          ),
                          "posterior_covariance_positive_definite": bool(
                              covariance_minimum_eigenvalue > 0.0
                          ),
                          "maximum_query_state_update_m": maximum_update,
          ''',
          )

          tests = "tests/test_prior_aware_likelihood_conformance.py"
          replace_once(
              tests,
              '''import math

              import numpy as np
          ''',
              '''import math
              from dataclasses import replace

              import numpy as np
          ''',
          )
          test_path = Path(tests)
          test_text = test_path.read_text(encoding="utf-8")
          addition = r'''


def test_nonconverged_mixture_fixed_point_falls_back() -> None:
    result = update_prior_aware_gauge_belief(
        _batch(np.asarray([0.1])),
        config=replace(
            _config(),
            maximum_iterations=1,
            convergence_tolerance=1e-16,
        ),
    )

    assert not result.inference_admissible
    assert result.reason == "mixture-fixed-point-not-converged"
    assert not result.diagnostics["mixture_fixed_point_converged"]
    assert result.diagnostics["iterations"] == 1
    assert result.posterior_covariance[0, 0] == pytest.approx(0.04)


def test_posterior_covariance_diagnostics_match_returned_matrix() -> None:
    result = update_prior_aware_gauge_belief(
        _batch(np.asarray([0.1])),
        config=_config(),
    )

    assert result.inference_admissible
    covariance = result.posterior_covariance
    symmetry_error = float(
        np.max(np.abs(covariance - covariance.T), initial=0.0)
    )
    minimum_eigenvalue = float(np.min(np.linalg.eigvalsh(covariance)))
    assert result.diagnostics[
        "posterior_covariance_symmetry_error"
    ] == pytest.approx(symmetry_error, abs=1e-18)
    assert result.diagnostics[
        "posterior_covariance_minimum_eigenvalue"
    ] == pytest.approx(minimum_eigenvalue, rel=1e-13)
    assert result.diagnostics["posterior_covariance_positive_definite"]
'''
          marker = "def test_nonconverged_mixture_fixed_point_falls_back() -> None:"
          if marker in test_text:
              raise SystemExit("convergence hardening tests already present")
          test_path.write_text(test_text.rstrip() + addition + "\n", encoding="utf-8")

          likelihood_doc = "docs/likelihood_conformance.md"
          replace_once(
              likelihood_doc,
              '''`grouped_student_t_mixture_likelihood` and
              `update_prior_aware_gauge_belief` use one latent nominal/outlier state per
              declared correlation group. For active row `i`, let
          ''',
              '''`update_prior_aware_gauge_belief` uses one latent nominal/outlier state per
              declared correlation group. For active row `i`, let
          ''',
          )
          replace_once(
              likelihood_doc,
              '''input matrices are component covariances rather than raw Student-t scale
              matrices.

              The posterior nominal responsibility is
          ''',
              '''input matrices are component covariances rather than raw Student-t scale
              matrices.

              The neutral artifact scorer `grouped_student_t_mixture_likelihood` is a
              separate diagnostic: it evaluates the full structured covariance, including
              retained low-rank cross-row factors. The prior-aware solver conditions on the
              local covariance while representing those factors as explicit nuisance
              variables. Both use the same covariance-parameterized nominal/outlier
              component convention, but their objectives are not asserted to be numerically
              identical without an explicit marginalization proof.

              The posterior nominal responsibility is
          ''',
          )
          replace_once(
              likelihood_doc,
              '''responsibilities and Student-t precisions vary with the residual.

              The working covariance is formed from a symmetric Cholesky factor and
          ''',
              '''responsibilities and Student-t precisions vary with the residual. If the
              parameter step and score stationarity conditions do not both converge within
              `maximum_iterations`, inference fails closed to the exact prior rather than
              returning a partially converged candidate.

              The working covariance is formed from a symmetric Cholesky factor and
          ''',
          )
          replace_once(
              likelihood_doc,
              '''`np.linalg.inv(normal)`. Prospective coverage evaluation remains required
              before treating this covariance as calibrated uncertainty.
          ''',
              '''`np.linalg.inv(normal)`. Solver diagnostics record the returned covariance's
              symmetry error, minimum eigenvalue, and positive-definiteness decision.
              Prospective coverage evaluation remains required before treating this
              covariance as calibrated uncertainty.
          ''',
          )

          observation_doc = "docs/observation_belief_contract.md"
          replace_once(
              observation_doc,
              '''prior nominal probability never does. Association support is reported as a
              separate diagnostic. The prior-aware solver is checked against this density in
              [the likelihood conformance suite](likelihood_conformance.md). The strict
              minimax solver intentionally retains a different rowwise Student-t power
              objective and reports that distinction in its diagnostics.
          ''',
              '''prior nominal probability never does. Association support is reported as a
              separate diagnostic. The artifact scorer evaluates the full structured
              covariance. The prior-aware solver instead conditions on local covariance and
              represents retained low-rank factors as explicit nuisance variables; its own
              conditional objective is checked in
              [the likelihood conformance suite](likelihood_conformance.md). The strict
              minimax solver intentionally retains a different rowwise Student-t power
              objective and reports that distinction in its diagnostics.
          ''',
          )

          prior_doc = "docs/prior_aware_guarded_update.md"
          replace_once(
              prior_doc,
              '''returned covariance is a working Gauss-Newton/IRLS covariance rather than the
              exact mixture Hessian and still requires prospective coverage evaluation. See
              [the executable likelihood audit](likelihood_conformance.md) for the equations,
              strict-solver distinction, and conformance tests.
          ''',
              '''returned covariance is a working Gauss-Newton/IRLS covariance rather than the
              exact mixture Hessian and still requires prospective coverage evaluation. Both
              the parameter step and score stationarity residual must converge; exhausting
              the iteration budget returns the exact fallback. Diagnostics report covariance
              symmetry, its minimum eigenvalue, and positive definiteness. See
              [the executable likelihood audit](likelihood_conformance.md) for the equations,
              strict-solver distinction, and conformance tests.
          ''',
          )
          PY
      - name: Install validation dependencies
        run: python -m pip install -e ".[dev,graph,vision]"
      - name: Validate focused numerical contract
        run: |
          python -m ruff check \
            src/bayesian_phystwin/_prior_aware_gauge_math.py \
            src/bayesian_phystwin/prior_aware_gauge_belief.py \
            tests/test_prior_aware_likelihood_conformance.py
          python -m ruff format --check \
            src/bayesian_phystwin/_prior_aware_gauge_math.py \
            src/bayesian_phystwin/prior_aware_gauge_belief.py \
            tests/test_prior_aware_likelihood_conformance.py
          python -m mypy --python-version 3.12 \
            src/bayesian_phystwin/_prior_aware_gauge_math.py \
            src/bayesian_phystwin/prior_aware_gauge_belief.py
          python -m pytest -q \
            tests/test_prior_aware_likelihood_conformance.py \
            tests/test_prior_aware_and_linearization.py \
            tests/test_gauge_aware_belief.py \
            tests/test_observation_belief_gauge_adapter.py
      - name: Run complete repository suite
        run: python -m pytest -q
      - name: Publish validated follow-up
        shell: bash
        run: |
          git diff --check
          rm .github/workflows/finalize-student-t-mixture-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fail closed on unconverged mixture inference"
          git push origin HEAD:agent/finalize-student-t-mixture-audit
