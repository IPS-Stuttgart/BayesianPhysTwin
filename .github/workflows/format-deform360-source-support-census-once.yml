name: Format Deform360 source-support census once

on:
  push:
    branches:
      - agent/deform360-source-support-failure-census-v1
    paths:
      - ".github/workflows/format-deform360-source-support-census-once.yml"

permissions:
  contents: write

concurrency:
  group: format-deform360-source-support-census-once
  cancel-in-progress: false

jobs:
  format:
    if: github.repository == 'IPS-Stuttgart/BayesianPhysTwin'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/deform360-source-support-failure-census-v1
          fetch-depth: 0
          persist-credentials: true
          clean: true
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply the repository formatter and publish only its diff
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = \
            "refs/heads/agent/deform360-source-support-failure-census-v1"
          python -m pip install "ruff==0.16.2"
          files=(
            scripts/science/materialize_deform360_source_support_failure_evidence_v1.py
            src/bayesian_phystwin/deform360_source_support_failure_evidence_v1.py
            tests/test_deform360_source_support_failure_evidence_v1.py
          )
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          git diff --check
          changed="$(git diff --name-only)"
          if [[ -z "${changed}" ]]; then
            echo "No formatting changes remain."
            exit 0
          fi
          expected=$(printf '%s\n' "${files[@]}" | sort)
          actual=$(printf '%s\n' "${changed}" | sort)
          test "${actual}" = "${expected}" || {
            echo "Formatter touched an unexpected file set:" >&2
            printf '%s\n' "${changed}" >&2
            exit 2
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "Apply Ruff formatting to Deform360 source-support census"
          git push origin HEAD:agent/deform360-source-support-failure-census-v1
