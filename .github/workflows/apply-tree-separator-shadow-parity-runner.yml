name: Run tree-separator shadow parity bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: run-tree-separator-shadow-parity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.head_ref == 'agent/tree-separator-shadow-parity-v1' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/tree-separator-shadow-parity-v1
          fetch-depth: 0
          persist-credentials: true
      - name: Recover and verify reviewed payload
        shell: bash
        env:
          PAYLOAD_SHA256: d4ede3d3d5bd248848a61d1789ae74794b7270ad981c553cad79757f14bdcb39
        run: |
          set -euo pipefail
          source=.github/workflows/apply-tree-separator-shadow-parity.yml
          encoded="$RUNNER_TEMP/tree-separator-shadow-parity.b64"
          payload="$RUNNER_TEMP/tree-separator-shadow-parity.tgz"
          awk '
            /^H4sI/ { capture = 1 }
            capture && /^PAYLOAD$/ { exit }
            capture { print }
          ' "$source" > "$encoded"
          test -s "$encoded"
          base64 -d "$encoded" > "$payload"
          printf '%s  %s\n' "$PAYLOAD_SHA256" "$payload" | sha256sum --check --strict
          test ! -e src/bayesian_phystwin/tree_separator_gaussian_parity.py
          test ! -e tests/test_tree_separator_gaussian_parity.py
          test ! -e docs/tree_separator_gaussian_parity.md
          tar -xzf "$payload"
          rm \
            .github/workflows/apply-tree-separator-shadow-parity.yml \
            .github/workflows/apply-tree-separator-shadow-parity-runner.yml
          python -m compileall -q \
            src/bayesian_phystwin/tree_separator_gaussian_parity.py \
            tests/test_tree_separator_gaussian_parity.py
      - name: Validate focused parity boundary
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff check \
            src/bayesian_phystwin/tree_separator_gaussian_parity.py \
            tests/test_tree_separator_gaussian_parity.py
          python -m ruff format --check \
            src/bayesian_phystwin/tree_separator_gaussian_parity.py \
            tests/test_tree_separator_gaussian_parity.py
          python -m pytest -q \
            tests/test_tree_separator_gaussian_parity.py \
            tests/test_structured_point_covariance_tree_separator_gaussian.py \
            tests/test_structured_point_covariance_tree_block_coverage_edges.py \
            tests/test_structured_point_covariance_tree_block_operator.py \
            tests/test_tree_block_sparse_gauge_belief.py \
            tests/test_structured_point_covariance_causal4d_tree_block_provider.py \
            tests/test_portable_contracts_tree_block_strict_admission.py
          git diff --check
      - name: Publish reviewed change and remove bootstrap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayesian_phystwin/tree_separator_gaussian_parity.py \
            tests/test_tree_separator_gaussian_parity.py \
            docs/tree_separator_gaussian_parity.md \
            .github/workflows/apply-tree-separator-shadow-parity.yml \
            .github/workflows/apply-tree-separator-shadow-parity-runner.yml
          git diff --cached --check
          git commit -m "Add tree-separator shadow parity"
          git push origin HEAD:agent/tree-separator-shadow-parity-v1
