name: Temporary fix covariance-only strict typing

on:
  push:
    branches:
      - agent/full22-covariance-only-hybrid-v1
    paths:
      - ".github/workflows/temporary-fix-covariance-mypy.yml"
      - "scripts/science/run_full22_covariance_only_hybrid_v1.py"
      - "src/bayesian_phystwin/covariance_only_hybrid_analysis.py"

permissions:
  contents: write

concurrency:
  group: temporary-fix-covariance-mypy
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/full22-covariance-only-hybrid-v1
          fetch-depth: 1
          persist-credentials: true
          clean: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Apply fail-closed type narrowing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, *, name: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{name}: expected one match, found {count}")
              return text.replace(old, new, 1)

          analysis_path = Path(
              "src/bayesian_phystwin/covariance_only_hybrid_analysis.py"
          )
          analysis = analysis_path.read_text(encoding="utf-8")
          analysis = replace_once(
              analysis,
              "    output_nll = np.empty(len(scales), dtype=np.float64)\n"
              "    output_coverage = np.empty(len(scales), dtype=np.float64)\n"
              "    output_width = np.empty(len(scales), dtype=np.float64)\n",
              "    output_nll: np.ndarray = np.empty(len(scales), dtype=np.float64)\n"
              "    output_coverage: np.ndarray = np.empty(\n"
              "        len(scales), dtype=np.float64\n"
              "    )\n"
              "    output_width: np.ndarray = np.empty(len(scales), dtype=np.float64)\n",
              name="score output arrays",
          )
          analysis = replace_once(
              analysis,
              "        training = np.ones(len(cases), dtype=bool)\n",
              "        training: np.ndarray = np.ones(len(cases), dtype=bool)\n",
              name="outer-fold training mask",
          )
          analysis = replace_once(
              analysis,
              "    output = np.empty((len(folds), len(HORIZONS)), dtype=np.float64)\n",
              "    output: np.ndarray = np.empty(\n"
              "        (len(folds), len(HORIZONS)), dtype=np.float64\n"
              "    )\n",
              name="selected metric array",
          )
          analysis_path.write_text(analysis, encoding="utf-8")

          runner_path = Path(
              "scripts/science/run_full22_covariance_only_hybrid_v1.py"
          )
          runner = runner_path.read_text(encoding="utf-8")
          runner = replace_once(
              runner,
              "                float(row[\"mean_nll_difference\"]),\n"
              "                float(row[\"simultaneous_interval_lower\"]),\n"
              "                float(row[\"simultaneous_interval_upper\"]),\n",
              "                _finite(\n"
              "                    row.get(\"mean_nll_difference\"),\n"
              "                    name=\"mean_nll_difference\",\n"
              "                ),\n"
              "                _finite(\n"
              "                    row.get(\"simultaneous_interval_lower\"),\n"
              "                    name=\"simultaneous_interval_lower\",\n"
              "                ),\n"
              "                _finite(\n"
              "                    row.get(\"simultaneous_interval_upper\"),\n"
              "                    name=\"simultaneous_interval_upper\",\n"
              "                ),\n",
              name="comparison numeric fields",
          )
          runner = replace_once(
              runner,
              "                float(coverage[\"reference_marginal_coverage\"]),\n"
              "                float(coverage[\"hybrid_marginal_coverage\"]),\n",
              "                _finite(\n"
              "                    coverage.get(\"reference_marginal_coverage\"),\n"
              "                    name=\"reference_marginal_coverage\",\n"
              "                ),\n"
              "                _finite(\n"
              "                    coverage.get(\"hybrid_marginal_coverage\"),\n"
              "                    name=\"hybrid_marginal_coverage\",\n"
              "                ),\n",
              name="coverage numeric fields",
          )
          runner = replace_once(
              runner,
              "    scales = tuple(float(value) for value in calibration[\"covariance_scales\"])\n",
              "    scales = tuple(\n"
              "        _finite(value, name=f\"covariance_scales[{index}]\", positive=True)\n"
              "        for index, value in enumerate(\n"
              "            _sequence(\n"
              "                calibration.get(\"covariance_scales\"),\n"
              "                name=\"covariance_scales\",\n"
              "            )\n"
              "        )\n"
              "    )\n",
              name="covariance scale parsing",
          )
          runner = replace_once(
              runner,
              "    shape = (len(case_ids), len(HORIZONS))\n"
              "    reference_nll = np.empty(shape, dtype=np.float64)\n"
              "    reference_coverage = np.empty(shape, dtype=np.float64)\n"
              "    reference_width = np.empty(shape, dtype=np.float64)\n"
              "    grid_shape = (len(case_ids), len(DONORS), len(HORIZONS), len(scales))\n"
              "    nll_grid = np.empty(grid_shape, dtype=np.float64)\n"
              "    coverage_grid = np.empty(grid_shape, dtype=np.float64)\n"
              "    width_grid = np.empty(grid_shape, dtype=np.float64)\n",
              "    cohort = _mapping(protocol[\"cohort\"], name=\"cohort\")\n"
              "    fit_fraction = _finite(\n"
              "        cohort.get(\"fit_fraction\"), name=\"fit_fraction\"\n"
              "    )\n"
              "    if not 0.0 < fit_fraction < 1.0:\n"
              "        raise ValueError(\"fit_fraction must lie strictly inside (0, 1)\")\n"
              "    shape = (len(case_ids), len(HORIZONS))\n"
              "    reference_nll: np.ndarray = np.empty(shape, dtype=np.float64)\n"
              "    reference_coverage: np.ndarray = np.empty(shape, dtype=np.float64)\n"
              "    reference_width: np.ndarray = np.empty(shape, dtype=np.float64)\n"
              "    grid_shape = (len(case_ids), len(DONORS), len(HORIZONS), len(scales))\n"
              "    nll_grid: np.ndarray = np.empty(grid_shape, dtype=np.float64)\n"
              "    coverage_grid: np.ndarray = np.empty(\n"
              "        grid_shape, dtype=np.float64\n"
              "    )\n"
              "    width_grid: np.ndarray = np.empty(grid_shape, dtype=np.float64)\n",
              name="analysis arrays and fit fraction",
          )
          runner = replace_once(
              runner,
              "        fit_end, train_end, frame_count = _split_for_case(\n"
              "            data_root / case_id,\n"
              "            float(_mapping(protocol[\"cohort\"], name=\"cohort\")[\"fit_fraction\"]),\n"
              "        )\n",
              "        fit_end, train_end, frame_count = _split_for_case(\n"
              "            data_root / case_id,\n"
              "            fit_fraction,\n"
              "        )\n",
              name="fit fraction use",
          )
          runner = replace_once(
              runner,
              "    inference = _mapping(protocol[\"inference\"], name=\"inference\")\n"
              "    primary_arm = \"crossfit_selected_scaled_covariance\"\n",
              "    inference = _mapping(protocol[\"inference\"], name=\"inference\")\n"
              "    bootstrap_replicates = _integer(\n"
              "        inference.get(\"bootstrap_replicates\"),\n"
              "        name=\"bootstrap_replicates\",\n"
              "        minimum=1000,\n"
              "    )\n"
              "    bootstrap_seed = _integer(\n"
              "        inference.get(\"bootstrap_seed\"), name=\"bootstrap_seed\"\n"
              "    )\n"
              "    bootstrap_confidence = _finite(\n"
              "        inference.get(\"confidence\"), name=\"confidence\"\n"
              "    )\n"
              "    if not 0.5 < bootstrap_confidence < 1.0:\n"
              "        raise ValueError(\"confidence must lie strictly inside (0.5, 1)\")\n"
              "    primary_arm = \"crossfit_selected_scaled_covariance\"\n",
              name="bootstrap configuration parsing",
          )
          runner = replace_once(
              runner,
              "        replicates=int(inference[\"bootstrap_replicates\"]),\n"
              "        seed=int(inference[\"bootstrap_seed\"]),\n"
              "        confidence=float(inference[\"confidence\"]),\n",
              "        replicates=bootstrap_replicates,\n"
              "        seed=bootstrap_seed,\n"
              "        confidence=bootstrap_confidence,\n",
              name="primary bootstrap configuration",
          )
          runner = replace_once(
              runner,
              "        replicates=int(inference[\"bootstrap_replicates\"]),\n"
              "        seed=int(inference[\"bootstrap_seed\"]) + 1000,\n"
              "        confidence=float(inference[\"confidence\"]),\n",
              "        replicates=bootstrap_replicates,\n"
              "        seed=bootstrap_seed + 1000,\n"
              "        confidence=bootstrap_confidence,\n",
              name="diagnostic bootstrap configuration",
          )
          runner_path.write_text(runner, encoding="utf-8")
          PY

          python -m pip install -e ".[dev]"
          files=(
            scripts/science/run_full22_covariance_only_hybrid_v1.py
            src/bayesian_phystwin/covariance_only_hybrid_analysis.py
          )
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m mypy \
            src/bayesian_phystwin/covariance_only_hybrid.py \
            src/bayesian_phystwin/covariance_only_hybrid_analysis.py \
            scripts/science/run_full22_covariance_only_hybrid_v1.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_covariance_only_hybrid.py \
            tests/test_full22_covariance_only_hybrid_v1.py

          rm .github/workflows/temporary-fix-covariance-mypy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/science/run_full22_covariance_only_hybrid_v1.py \
            src/bayesian_phystwin/covariance_only_hybrid_analysis.py \
            .github/workflows/temporary-fix-covariance-mypy.yml
          git commit -m "Fix strict typing for covariance-only analysis"
          git push origin HEAD:agent/full22-covariance-only-hybrid-v1