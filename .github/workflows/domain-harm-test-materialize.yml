name: Temporary domain harm-risk test materializer

on:
  push:
    branches:
      - agent/domain-harm-risk-certificate-v1

permissions:
  contents: write

jobs:
  materialize-and-remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/domain-harm-risk-certificate-v1
          persist-credentials: true
      - name: Materialize reviewed tests and remove staging files
        run: |
          set -euo pipefail
          base64 --decode \
            .github/domain-harm-test-parts/test.py.gz.b64 \
            | gzip --decompress \
            > tests/test_guard_harm_risk_domains.py
          echo \
            "c1f2846383db3b4e2ab869631c41db9e9acdd3d0cc73bce3bc93cd47c2d2bcc8  tests/test_guard_harm_risk_domains.py" \
            | sha256sum --check
          rm -rf .github/domain-harm-test-parts
          rm .github/workflows/domain-harm-test-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/test_guard_harm_risk_domains.py \
            .github/domain-harm-test-parts \
            .github/workflows/domain-harm-test-materialize.yml
          git diff --cached --check
          git commit -m "Add adversarial domain harm-risk tests"
          git push origin HEAD:agent/domain-harm-risk-certificate-v1
