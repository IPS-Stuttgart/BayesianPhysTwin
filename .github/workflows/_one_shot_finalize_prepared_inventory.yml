name: One-shot finalize prepared-source inventory

# Temporary same-repository formatter and validator; removes itself before push.
on:
  push:
    branches:
      - agent/deform360-prepared-source-inventory-v1
    paths:
      - ".github/workflows/_one_shot_finalize_prepared_inventory.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-finalize-prepared-source-inventory
  cancel-in-progress: false

jobs:
  finalize:
    if: github.repository == 'IPS-Stuttgart/BayesianPhysTwin'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HEAD_BRANCH: agent/deform360-prepared-source-inventory-v1
    steps:
      - name: Check out exact triggering revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Require exact parent and unchanged remote head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "29f95975bdf32e03a890bb2c48ce7407731e91b5"
          remote_sha="$(git ls-remote origin "refs/heads/${HEAD_BRANCH}" | cut -f1)"
          test "${remote_sha}" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1)"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install exact validation environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1"
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Pin the empirical NumPy runtime and format exact files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/deform360-calibration-prepared-inventory.yml")
          text = path.read_text(encoding="utf-8")
          old = '''          "${site}/bin/python" -m pip install \\
            "pip==25.2" \\
            "setuptools==80.9.0" \\
            "wheel==0.45.1"
          "${site}/bin/python" -m pip install --no-deps .
          echo "INVENTORY_PYTHON=${site}/bin/python" >> "${GITHUB_ENV}"
          '''
          new = '''          "${site}/bin/python" -m pip install \\
            "pip==25.2" \\
            "setuptools==80.9.0" \\
            "wheel==0.45.1" \\
            "numpy==2.2.6"
          "${site}/bin/python" -m pip install --no-deps .
          "${site}/bin/python" -m pip check
          echo "INVENTORY_PYTHON=${site}/bin/python" >> "${GITHUB_ENV}"
          '''
          if text.count(old) != 1:
              raise SystemExit("inventory runtime anchor changed")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          python -m ruff format \
            scripts/science/inventory_deform360_calibration_prepared_source.py \
            tests/test_deform360_calibration_prepared_inventory.py

      - name: Validate focused and adjacent contracts
        shell: bash
        run: |
          set -euo pipefail
          files=(
            scripts/science/inventory_deform360_calibration_prepared_source.py
            tests/test_deform360_calibration_prepared_inventory.py
          )
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy \
            scripts/science/inventory_deform360_calibration_prepared_source.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_deform360_calibration_prepared_inventory.py \
            tests/test_deform360_calibration_source_run_record.py \
            tests/test_deform360_calibration_observability_case_builder.py \
            tests/test_deform360_calibration_observability_batch.py
          python -m py_compile "${files[@]}"
          python -m bayesian_phystwin.cli.command_docs --check
          git diff --check

      - name: Remove temporary workflow and commit with lease
        shell: bash
        run: |
          set -euo pipefail
          rm -- .github/workflows/_one_shot_finalize_prepared_inventory.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Finalize prepared-source inventory contracts'
          git fetch origin "${HEAD_BRANCH}"
          test "$(git rev-parse FETCH_HEAD)" = "${GITHUB_SHA}"
          git push --force-with-lease="refs/heads/${HEAD_BRANCH}:${GITHUB_SHA}" \
            origin "HEAD:${HEAD_BRANCH}"