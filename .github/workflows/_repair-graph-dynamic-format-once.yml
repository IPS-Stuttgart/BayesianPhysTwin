name: Repair graph dynamic formatting once

on:
  push:
    branches:
      - agent/graph-dynamic-discrepancy-v1
    paths:
      - .github/workflows/_repair-graph-dynamic-format-once.yml

permissions:
  contents: write

concurrency:
  group: repair-graph-dynamic-format-once
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.ref == 'refs/heads/agent/graph-dynamic-discrepancy-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/graph-dynamic-discrepancy-v1
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Format changed Python sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "agent/graph-dynamic-discrepancy-v1"
          python -m pip install "ruff==0.16.2"
          files=(
            src/bayesian_phystwin/_graph_dynamic_discrepancy_common.py
            src/bayesian_phystwin/_graph_dynamic_discrepancy_contract.py
            src/bayesian_phystwin/_graph_dynamic_discrepancy_forecast.py
            src/bayesian_phystwin/_graph_dynamic_discrepancy_observation.py
            tests/test_horizon_conditioned_discrepancy_graph_modal.py
            tests/test_horizon_conditioned_discrepancy_graph_modal_contracts.py
            tests/test_horizon_conditioned_discrepancy_graph_modal_regressions.py
          )
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "Format graph dynamic discrepancy sources"
          git push origin HEAD:agent/graph-dynamic-discrepancy-v1
