name: Deform360 calibration prepared-source inventory

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deform360-calibration-prepared-inventory.yml"
      - "MANIFEST.in"
      - "docs/deform360_calibration_prepared_inventory.md"
      - "docs/experiment_index.md"
      - "scripts/science/inventory_deform360_calibration_prepared_source.py"
      - "tests/test_deform360_calibration_prepared_inventory.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deform360-calibration-prepared-inventory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  contracts:
    name: Prepared-source inventory contracts / Python ${{ matrix.python-version }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install exact source and quality tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1"
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Check source quality
        shell: bash
        run: |
          set -euo pipefail
          files=(
            scripts/science/inventory_deform360_calibration_prepared_source.py
            tests/test_deform360_calibration_prepared_inventory.py
          )
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy \
            scripts/science/inventory_deform360_calibration_prepared_source.py

      - name: Run focused and adjacent contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -p no:cacheprovider \
            tests/test_deform360_calibration_prepared_inventory.py \
            tests/test_deform360_calibration_source_run_record.py \
            tests/test_deform360_calibration_observability_case_builder.py \
            tests/test_deform360_calibration_observability_batch.py
          python -m py_compile \
            scripts/science/inventory_deform360_calibration_prepared_source.py \
            tests/test_deform360_calibration_prepared_inventory.py

      - name: Verify exact read-only repository state
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"

  inventory:
    name: Inventory successful retained calibration source / workstation2
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin'
    needs: contracts
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 90
    env:
      SOURCE_RUN_ID: "31236230283"
      SOURCE_ARTIFACT_NAME: deform360-official-calibration-source-31236230283-1
      PROCESSED_ROOT: >-
        ${{ vars.DEFORM360_OFFICIAL_HUB_CALIBRATION_PROCESSED_ROOT ||
        '/mnt/lexar4tb/datasets/deform360_official_hub_visuotactile_v1/calibration-processed' }}
    steps:
      - name: Publish pre-checkout calibration-only beacon
        shell: bash
        run: |
          set -euo pipefail
          echo "Direct prepared-source inventory started"
          echo "source_run_id=${SOURCE_RUN_ID}"
          echo "confirmation_payloads_opened=false"
          echo "target_outcomes_used=false"

      - name: Check out exact reviewed default-branch revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Verify trusted repository state before retained-data access
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GITHUB_REF}" = "refs/heads/main"
          test -z "$(git status --porcelain=v1)"
          test -d "${PROCESSED_ROOT}/aligned"

      - name: Download exact successful compact source evidence
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.SOURCE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/deform360-prepared-source-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Install exact inventory source in an isolated environment
        shell: bash
        run: |
          set -euo pipefail
          site="${RUNNER_TEMP}/deform360-prepared-inventory-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 -m venv "${site}"
          "${site}/bin/python" -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1" \
            "numpy==2.2.6"
          "${site}/bin/python" -m pip install --no-deps .
          "${site}/bin/python" -m pip check
          echo "INVENTORY_PYTHON=${site}/bin/python" >> "${GITHUB_ENV}"
          echo "INVENTORY_SITE=${site}" >> "${GITHUB_ENV}"

      - name: Validate and inventory retained calibration bytes
        id: inventory
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/deform360-prepared-source-evidence"
          output_root="${RUNNER_TEMP}/deform360-prepared-inventory-output-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p -- "${output_root}"
          output="${output_root}/prepared-source-inventory.json"
          "${INVENTORY_PYTHON}" \
            scripts/science/inventory_deform360_calibration_prepared_source.py \
            --source-protocol \
              protocols/deform360_official_hub_calibration_source_v1.json \
            --stage0-protocol \
              protocols/deform360_official_hub_visuotactile_v1.json \
            --selection-lock \
              protocols/locks/deform360_official_hub_visuotactile_v1_selection.json \
            --visual-provider-lock \
              protocols/locks/deform360_official_hub_visuotactile_v1_visual_provider/visual-provider-lock.json \
            --plan "${evidence}/calibration-source-plan.json" \
            --download-manifest "${evidence}/calibration-download-manifest.json" \
            --result "${evidence}/calibration-source-result.json" \
            --run-record "${evidence}/execution-manifest.json" \
            --processed-root "${PROCESSED_ROOT}/aligned" \
            --implementation-revision "${GITHUB_SHA}" \
            --output "${output}" \
            | tee "${output_root}/inventory-console.json"
          sha256sum "${output}" > "${output_root}/SHA256SUMS"
          echo "output_root=${output_root}" >> "${GITHUB_OUTPUT}"

      - name: Upload compact prepared-source inventory
        uses: actions/upload-artifact@v7
        with:
          name: deform360-calibration-prepared-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.inventory.outputs.output_root }}/prepared-source-inventory.json
            ${{ steps.inventory.outputs.output_root }}/inventory-console.json
            ${{ steps.inventory.outputs.output_root }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

      - name: Verify confirmation boundary and clean up isolated environment
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"
          if [[ -n "${INVENTORY_SITE:-}" ]]; then
            rm -rf -- "${INVENTORY_SITE}"
          fi
          echo "confirmation_payloads_opened=false"
          echo "target_outcomes_used=false"
