name: Deform360 calibration payload materialization

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deform360-calibration-payload-materialization.yml"
      - "scripts/science/materialize_deform360_calibration_payloads.py"
      - "scripts/science/run_deform360_calibration_materialization.sh"
      - "src/bayesian_phystwin/deform360_calibration_payload_plan.py"
      - "src/bayesian_phystwin/deform360_calibration_payload_runtime.py"
      - "tests/test_deform360_calibration_payload_materialization.py"
      - "docs/deform360_calibration_payload_materialization.md"
      - "protocols/deform360_official_hub_visuotactile_v1.json"
      - "protocols/locks/deform360_official_hub_visuotactile_v1_selection.json"
      - "protocols/locks/deform360_official_hub_visuotactile_v1_visual_provider/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/deform360-calibration-payload-materialization.yml"
      - "scripts/science/materialize_deform360_calibration_payloads.py"
      - "scripts/science/run_deform360_calibration_materialization.sh"
      - "src/bayesian_phystwin/deform360_calibration_payload_plan.py"
      - "src/bayesian_phystwin/deform360_calibration_payload_runtime.py"
      - "tests/test_deform360_calibration_payload_materialization.py"
      - "docs/deform360_calibration_payload_materialization.md"
      - "protocols/deform360_official_hub_visuotactile_v1.json"
      - "protocols/locks/deform360_official_hub_visuotactile_v1_selection.json"
      - "protocols/locks/deform360_official_hub_visuotactile_v1_visual_provider/**"
  workflow_dispatch:
    inputs:
      data_root:
        description: Persistent selected-calibration dataset root on workstation2
        required: false
        type: string
      workers:
        description: Parallel exact-file downloads
        required: false
        default: "4"
        type: string

permissions:
  contents: read

concurrency:
  group: deform360-calibration-payloads-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BPT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  DEFORM360_PROCESSING_REVISION: d8522a4403b766aeb387510c04e89032a56fdf35
  INPUT_DATA_ROOT: ${{ inputs.data_root }}
  INPUT_WORKERS: ${{ inputs.workers }}
  VAR_DATA_ROOT: ${{ vars.DEFORM360_CALIBRATION_ROOT }}
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  contracts:
    name: Exact selected-episode contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BPT_SOURCE_SHA }}
          persist-credentials: false
          clean: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install and validate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]" "huggingface_hub>=0.24"
          files=(
            scripts/science/materialize_deform360_calibration_payloads.py
            src/bayesian_phystwin/deform360_calibration_payload_plan.py
            src/bayesian_phystwin/deform360_calibration_payload_runtime.py
            tests/test_deform360_calibration_payload_materialization.py
          )
          python -m ruff check "${files[@]}"
          python -m ruff format --check --diff "${files[@]}"
          python -m pytest -q \
            tests/test_deform360_calibration_payload_materialization.py \
            tests/test_deform360_calibration_execution.py \
            tests/test_deform360_visual_provider_lock.py \
            tests/test_pull_request_workflow_integrity.py
          bash -n scripts/science/run_deform360_calibration_materialization.sh
          git diff --check

  trusted_contracts:
    name: Trusted-branch quality mirror / workstation2
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 60
    steps:
      - name: Check out exact same-repository pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BPT_SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 0
          clean: true

      - name: Prepare isolated quality environment
        shell: bash
        run: |
          set -euo pipefail
          python_bin="$(command -v python3.12 || command -v python3)"
          site="${RUNNER_TEMP}/deform360-quality-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "${site}"
          mkdir -p "${site}"
          "${python_bin}" -m pip install \
            --break-system-packages \
            --target "${site}" \
            ".[dev]" \
            "huggingface_hub>=0.24" \
            "numpy>=1.23,<1.28"
          {
            echo "PYTHON_BIN=${python_bin}"
            echo "PYTHONPATH=${site}"
          } >> "${GITHUB_ENV}"

      - name: Run quality ratchet and focused tests
        shell: bash
        run: |
          set -euo pipefail
          "${PYTHON_BIN}" tools/quality/changed_python_quality.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${BPT_SOURCE_SHA}"
          "${PYTHON_BIN}" -m pytest -q \
            tests/test_deform360_calibration_payload_materialization.py \
            tests/test_deform360_calibration_execution.py \
            tests/test_deform360_visual_provider_lock.py \
            tests/test_pull_request_workflow_integrity.py \
            tests/test_release_metadata.py
          bash -n scripts/science/run_deform360_calibration_materialization.sh
          git diff --check

  materialize:
    name: Open only locked calibration prefixes / workstation2
    if: github.event_name != 'pull_request'
    needs: contracts
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 360
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Check out exact BayesianPhysTwin source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BPT_SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 0
          clean: true

      - name: Check out exact official Deform360 processing source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lhy0807/deform360
          ref: ${{ env.DEFORM360_PROCESSING_REVISION }}
          path: _deform360
          persist-credentials: false
          fetch-depth: 1
          clean: true

      - name: Keep parent checkout clean and materialize
        shell: bash
        run: |
          set -euo pipefail
          printf '/_deform360/\n' >> .git/info/exclude
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          bash scripts/science/run_deform360_calibration_materialization.sh

      - name: Upload compact calibration-access evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deform360-calibration-payloads-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.DEFORM360_EVIDENCE_ROOT }}/materialization.json
            ${{ env.DEFORM360_EVIDENCE_ROOT }}/console.log
            ${{ env.DEFORM360_EVIDENCE_ROOT }}/storage-selection.txt
            ${{ env.DEFORM360_EVIDENCE_ROOT }}/environment.txt
            ${{ env.DEFORM360_EVIDENCE_ROOT }}/SHA256SUMS
          if-no-files-found: warn
          retention-days: 90
