name: Stage Deform360 group-tempered source

on:
  push:
    branches:
      - agent/deform360-group-tempered-experiment
    paths:
      - ".github/workflows/stage-deform360-group-tempered.yml"
      - "tools/deform360_group_tempered_payload_*.txt"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/stage-deform360-group-tempered.yml"
      - "tools/deform360_group_tempered_payload_*.txt"

permissions:
  contents: write

concurrency:
  group: stage-deform360-group-tempered-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/deform360-group-tempered-experiment
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Reconstruct and verify the exact source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import zlib
          from pathlib import Path

          parts = sorted(Path("tools").glob("deform360_group_tempered_payload_*.txt"))
          if not parts:
              raise SystemExit("no Deform360 group-tempered payload fragments found")
          encoded = "".join(path.read_text(encoding="ascii").strip() for path in parts)
          source = zlib.decompress(base64.b85decode(encoded))
          source_sha = hashlib.sha256(source).hexdigest()
          expected_source = "fe21bedb9946c6d5989672d78d2b7452df7904e80734eb836aaa033f480f04f5"
          if source_sha != expected_source:
              raise SystemExit(
                  f"source digest mismatch: {source_sha} != {expected_source}; "
                  f"fragments={[path.name for path in parts]}"
              )
          destination = Path(
              "scripts/science/run_deform360_group_tempered_experiment.py"
          )
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_bytes(source)
          Path("staged-source-sha256.txt").write_text(
              f"{source_sha}  {destination.as_posix()}\n",
              encoding="utf-8",
          )
          print(
              f"reconstructed {destination} from {len(parts)} fragments: "
              f"{source_sha}"
          )
          PY
          rm tools/deform360_group_tempered_payload_*.txt

      - name: Install and validate the candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,graph]" "ruff==0.16.1"
          python -m pip check
          python -m ruff format \
            scripts/science/run_deform360_group_tempered_experiment.py \
            tests/test_deform360_group_tempered_experiment.py
          python -m ruff check \
            scripts/science/run_deform360_group_tempered_experiment.py \
            tests/test_deform360_group_tempered_experiment.py
          python -m ruff format --check \
            scripts/science/run_deform360_group_tempered_experiment.py \
            tests/test_deform360_group_tempered_experiment.py
          python -m pytest -q \
            tests/test_deform360_public_evaluation.py \
            tests/test_deform360_group_tempered_experiment.py
          python -m py_compile \
            scripts/science/run_deform360_group_tempered_experiment.py
          git diff --check
          rm staged-source-sha256.txt

      - name: Publish the clean product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/science/run_deform360_group_tempered_experiment.py \
            tests/test_deform360_group_tempered_experiment.py \
            tools/deform360_group_tempered_payload_00.txt \
            tools/deform360_group_tempered_payload_01.txt
          git diff --cached --check
          git commit -m "Implement group-held-out Deform360 experiment"
          git push origin HEAD:agent/deform360-group-tempered-experiment
