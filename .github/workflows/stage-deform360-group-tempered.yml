name: Stage Deform360 group-tempered source

on:
  push:
    branches:
      - agent/deform360-group-tempered-experiment
    paths:
      - ".github/workflows/stage-deform360-group-tempered.yml"
      - "tools/deform360_group_tempered_payload_*.txt"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/stage-deform360-group-tempered.yml"
      - "tools/deform360_group_tempered_payload_*.txt"

permissions:
  contents: write

concurrency:
  group: stage-deform360-group-tempered
  cancel-in-progress: false

jobs:
  stage:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/deform360-group-tempered-experiment
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Reconstruct and verify the exact source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import zlib
          from pathlib import Path

          expected_parts = {
              "tools/deform360_group_tempered_payload_00.txt": "b3c1b1f386c4c1d971bd27f2152515df36f5db976db66f8d25a59bd7861df5d7",
              "tools/deform360_group_tempered_payload_01.txt": "285d2230233d611ed05a245ac1b860a1bc8b4f7f225774e579c796c6a4a0e15c",
              "tools/deform360_group_tempered_payload_02.txt": "762ba9738a043e60ad37954a03788312c3d5cdb2565436218cfd5d2c199581ef",
              "tools/deform360_group_tempered_payload_03.txt": "05475cb2afea23d03337ae73c00388a5495245f24a851ffc43e4d5ce0d64aa49",
              "tools/deform360_group_tempered_payload_04.txt": "6c24f68d20d69a826bdb567cc5286236ad42efa632980eae3093361e7580fab6",
          }
          encoded = []
          for name, expected in expected_parts.items():
              path = Path(name)
              raw = path.read_bytes()
              actual = hashlib.sha256(raw).hexdigest()
              if actual != expected:
                  raise SystemExit(
                      f"payload digest mismatch for {name}: {actual} != {expected}"
                  )
              encoded.append(raw.decode("ascii").strip())
          source = zlib.decompress(base64.b85decode("".join(encoded)))
          source_sha = hashlib.sha256(source).hexdigest()
          expected_source = "fe21bedb9946c6d5989672d78d2b7452df7904e80734eb836aaa033f480f04f5"
          if source_sha != expected_source:
              raise SystemExit(
                  f"source digest mismatch: {source_sha} != {expected_source}"
              )
          destination = Path(
              "scripts/science/run_deform360_group_tempered_experiment.py"
          )
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_bytes(source)
          print(f"reconstructed {destination}: {source_sha}")
          PY
          rm tools/deform360_group_tempered_payload_*.txt

      - name: Install and validate the candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,graph]"
          python -m pip check
          python -m ruff format \
            scripts/science/run_deform360_group_tempered_experiment.py \
            tests/test_deform360_group_tempered_experiment.py
          python -m ruff check \
            scripts/science/run_deform360_group_tempered_experiment.py \
            tests/test_deform360_group_tempered_experiment.py
          python -m ruff format --check \
            scripts/science/run_deform360_group_tempered_experiment.py \
            tests/test_deform360_group_tempered_experiment.py
          python -m pytest -q \
            tests/test_deform360_public_evaluation.py \
            tests/test_deform360_group_tempered_experiment.py
          python -m py_compile \
            scripts/science/run_deform360_group_tempered_experiment.py
          git diff --check

      - name: Publish the clean product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/science/run_deform360_group_tempered_experiment.py \
            tests/test_deform360_group_tempered_experiment.py \
            tools/deform360_group_tempered_payload_00.txt \
            tools/deform360_group_tempered_payload_01.txt \
            tools/deform360_group_tempered_payload_02.txt \
            tools/deform360_group_tempered_payload_03.txt \
            tools/deform360_group_tempered_payload_04.txt
          git diff --cached --check
          git commit -m "Implement group-held-out Deform360 experiment"
          git push origin HEAD:agent/deform360-group-tempered-experiment
