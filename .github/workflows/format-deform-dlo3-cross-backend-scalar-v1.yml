# workflow-lifecycle: temporary-one-shot
# workflow-owner: IPS-Stuttgart maintainers
name: Format DLO3 cross-backend scalar v1

on:
  push:
    branches: [science/deform-dlo3-cross-backend-scalar-v1]
    paths:
      - .github/workflows/format-deform-dlo3-cross-backend-scalar-v1.yml

permissions:
  contents: write

concurrency:
  group: format-deform-dlo3-cross-backend-scalar-v1
  cancel-in-progress: false

jobs:
  format:
    if: github.repository == 'IPS-Stuttgart/BayesianPhysTwin'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out formatting branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: science/deform-dlo3-cross-backend-scalar-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Apply exact Ruff formatting and safe fixes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install ruff==0.16.5
          files=(
            scripts/remote/run_deform_dlo3_cross_backend_scalar_v1.py
            src/bayesian_phystwin_experiments/deform_dlo_cross_backend_scalar_v1.py
            tests/test_deform_dlo3_cross_backend_scalar_v1.py
          )
          ruff check --fix "${files[@]}"
          ruff format "${files[@]}"
          ruff check "${files[@]}"
          ruff format --check "${files[@]}"

      - name: Remove this one-shot workflow and publish formatting commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/format-deform-dlo3-cross-backend-scalar-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/remote/run_deform_dlo3_cross_backend_scalar_v1.py \
            src/bayesian_phystwin_experiments/deform_dlo_cross_backend_scalar_v1.py \
            tests/test_deform_dlo3_cross_backend_scalar_v1.py \
            .github/workflows/format-deform-dlo3-cross-backend-scalar-v1.yml
          git diff --cached --check
          git commit -m 'Apply Ruff formatting to scalar transfer'
          git push origin HEAD:science/deform-dlo3-cross-backend-scalar-v1
