      - name: Install development tools
        run: python -m pip install -e ".[dev]"

      - name: Format and validate the focused patch
        run: |
          python -m ruff format \
            src/bayesian_phystwin/drift_bias.py \
            tests/test_drift_bias.py
          python -m ruff check \
            src/bayesian_phystwin/drift_bias.py \
            tests/test_drift_bias.py
          python -m pytest -q -W error \
            tests/test_drift_bias.py \
            tests/test_phystwin_bias_diagnostic.py \
            tests/test_synthetic_benchmark.py

      - name: Commit the validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayesian_phystwin/drift_bias.py \
            tests/test_drift_bias.py \
            CHANGELOG.md
          git diff --cached --check
          git commit -m "Harden random-walk bias contracts"
          git push origin HEAD:${{ github.ref_name }}
