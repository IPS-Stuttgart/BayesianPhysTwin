name: Diagnose BPT contract patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'agent/bootstrap-bpt-contract-numerics-hardening-20260727'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRODUCT_BRANCH: agent/harden-bpt-contract-numerics
      DIAGNOSTIC_BRANCH: agent/bootstrap-bpt-contract-numerics-diagnostic
    steps:
      - name: Check out current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate and publish the clean product branch
        shell: bash
        run: |
          set -uo pipefail
          git fetch origin "${GITHUB_HEAD_REF}:refs/remotes/origin/${GITHUB_HEAD_REF}"
          set +e
          (
            set -euo pipefail
            echo '== apply exact patch plus typing repair =='
            python - <<'PY'
          import os
          import re
          import subprocess
          import textwrap

          workflow = subprocess.check_output(
              [
                  'git',
                  'show',
                  f"origin/{os.environ['GITHUB_HEAD_REF']}:"
                  '.github/workflows/bootstrap-bpt-contract-numerics-hardening-v2.yml',
              ],
              text=True,
          )
          match = re.search(
              r"python - <<'PY' > /tmp/bpt-patch-output.txt 2>&1\n"
              r"(?P<body>.*?)\n          PY",
              workflow,
              re.DOTALL,
          )
          if match is None:
              raise SystemExit('v2 patch body was not found')
          source = textwrap.dedent(match.group('body'))
          needle = 'exec(compile(source, "bpt-contract-numerics-patch.py", "exec"))'
          typefix = ''
          if needle not in source:
              raise SystemExit('v2 patch execution point was not found')
          source = source.replace(
              needle,
              "source += base64.b64decode(" + repr(typefix) + ").decode('utf-8')\n" + needle,
              1,
          )
          exec(compile(source, 'v2-product-patch.py', 'exec'))
          PY
            echo '== install =='
            python -m pip install -e ".[dev]"
            files=(
              src/bayesian_phystwin/observation_belief.py
              src/bayesian_phystwin/grouped_likelihood.py
              src/bayesian_phystwin/phystwin_bayesian_anchor.py
              src/bayesian_phystwin/contracts/fixed_anchor.py
              tests/test_observation_belief.py
              tests/test_grouped_likelihood.py
              tests/test_causal4d_provider_v1.py
              tests/test_phystwin_bayesian_anchor.py
            )
            echo '== format and lint =='
            python -m ruff check --fix -- "${files[@]}"
            python -m ruff format -- "${files[@]}"
            python -m ruff check -- "${files[@]}"
            echo '== focused tests =='
            python -m pytest -q \
              tests/test_observation_belief.py \
              tests/test_observation_belief_gauge_adapter.py \
              tests/test_grouped_likelihood.py \
              tests/test_phystwin_bayesian_anchor.py \
              tests/test_causal4d_provider_v1.py \
              tests/test_prob4d_joint_contract_fixture.py
            echo '== commit =='
            git config user.name "OpenAI"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              CHANGELOG.md \
              docs/causal4d_belief_provider_v1.md \
              docs/observation_belief_contract.md \
              src/bayesian_phystwin/contracts/fixed_anchor.py \
              src/bayesian_phystwin/grouped_likelihood.py \
              src/bayesian_phystwin/observation_belief.py \
              src/bayesian_phystwin/phystwin_bayesian_anchor.py \
              tests/test_causal4d_provider_v1.py \
              tests/test_grouped_likelihood.py \
              tests/test_observation_belief.py \
              tests/test_phystwin_bayesian_anchor.py
            git diff --cached --check
            git commit -m "Harden immutable observation and covariance semantics"
            echo '== exact quality ratchet =='
            python tools/quality/changed_python_quality.py --base HEAD^ --head HEAD
          ) > /tmp/diagnostic-body.txt 2>&1
          diagnostic_status=$?
          set -e
          if [[ ${diagnostic_status} -eq 0 ]]; then
            cat /tmp/diagnostic-body.txt
            git push --force-with-lease origin "HEAD:refs/heads/${PRODUCT_BRANCH}"
            {
              echo "### Published product branch"
              echo
              echo "\`${PRODUCT_BRANCH}\`"
              echo
              echo "Commit: \`$(git rev-parse HEAD)\`"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          {
            echo "exit_status=${diagnostic_status}"
            cat /tmp/diagnostic-body.txt
          } > /tmp/patch-diagnostic.txt
          cat /tmp/patch-diagnostic.txt
          git reset --hard main
          git switch -C "${DIAGNOSTIC_BRANCH}" main
          cp /tmp/patch-diagnostic.txt patch-diagnostic.txt
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patch-diagnostic.txt
          git commit -m "Record BPT quality diagnostic"
          git push --force origin "HEAD:refs/heads/${DIAGNOSTIC_BRANCH}"
