name: Recover and materialize Deform360 V2 source

on:
  push:
    branches:
      - agent/deform360-group-evaluation-v2
    paths:
      - ".github/workflows/materialize-deform360-v2-recovered.yml"
      - ".github/scripts/recover_deform360_v2_source.py"

permissions:
  contents: write

concurrency:
  group: recover-materialize-deform360-v2
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/deform360-group-evaluation-v2
          fetch-depth: 0
          persist-credentials: true
          clean: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Recover the exact declared product members
        run: |
          set -euo pipefail
          python .github/scripts/recover_deform360_v2_source.py \
            "${RUNNER_TEMP}/deform360-v2-source"
      - name: Install focused validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,graph]"
          python -m pip check
      - name: Copy and validate only ordinary product source
        run: |
          set -euo pipefail
          source_root="${RUNNER_TEMP}/deform360-v2-source"
          files=(
            ".github/workflows/deform360-group-evaluation.yml"
            ".github/workflows/deform360-public-evaluation.yml"
            "docs/deform360_group_evaluation_v2.md"
            "scripts/science/prepare_deform360_archive_manifest.py"
            "scripts/science/prepare_deform360_name_inventory.py"
            "scripts/science/prepare_deform360_public_protocol.py"
            "scripts/science/run_deform360_group_evaluation.py"
            "tests/test_deform360_archive_manifest.py"
            "tests/test_deform360_group_evaluation.py"
            "tests/test_deform360_name_inventory.py"
            "tests/test_deform360_preflight_workflow.py"
            "tests/test_deform360_public_protocol.py"
          )
          for path in "${files[@]}"; do
            test -f "${source_root}/${path}"
            mkdir -p "$(dirname "${path}")"
            cp -a "${source_root}/${path}" "${path}"
          done
          python -m py_compile \
            scripts/science/prepare_deform360_archive_manifest.py \
            scripts/science/prepare_deform360_name_inventory.py \
            scripts/science/prepare_deform360_public_protocol.py \
            scripts/science/run_deform360_group_evaluation.py
          python -m ruff check \
            scripts/science/prepare_deform360_archive_manifest.py \
            scripts/science/prepare_deform360_name_inventory.py \
            scripts/science/prepare_deform360_public_protocol.py \
            scripts/science/run_deform360_group_evaluation.py \
            tests/test_deform360_archive_manifest.py \
            tests/test_deform360_group_evaluation.py \
            tests/test_deform360_name_inventory.py \
            tests/test_deform360_preflight_workflow.py \
            tests/test_deform360_public_protocol.py
          python -m ruff format --check \
            scripts/science/prepare_deform360_archive_manifest.py \
            scripts/science/prepare_deform360_name_inventory.py \
            scripts/science/prepare_deform360_public_protocol.py \
            scripts/science/run_deform360_group_evaluation.py \
            tests/test_deform360_archive_manifest.py \
            tests/test_deform360_group_evaluation.py \
            tests/test_deform360_name_inventory.py \
            tests/test_deform360_preflight_workflow.py \
            tests/test_deform360_public_protocol.py
          python -m pytest -q \
            tests/test_deform360_archive_manifest.py \
            tests/test_deform360_group_evaluation.py \
            tests/test_deform360_name_inventory.py \
            tests/test_deform360_preflight_workflow.py \
            tests/test_deform360_public_protocol.py \
            tests/test_endpoint_model_average.py \
            tests/test_group_conformal.py
          git diff --check
      - name: Remove all staging machinery and publish reviewable source
        run: |
          set -euo pipefail
          rm -f \
            .github/scripts/recover_deform360_v2_source.py \
            .github/workflows/materialize-deform360-v2.yml \
            .github/workflows/materialize-deform360-v2-recovered.yml \
            .github/workflows/temporary-export-deform360-v2-bundle.yml \
            tools/deform360-v2-bundle-00.b64 \
            tools/deform360-v2-bundle-01.b64 \
            tools/deform360-v2-bundle-02.b64
          git add -A -- \
            .github/scripts/recover_deform360_v2_source.py \
            .github/workflows \
            tools/deform360-v2-bundle-00.b64 \
            tools/deform360-v2-bundle-01.b64 \
            tools/deform360-v2-bundle-02.b64 \
            docs/deform360_group_evaluation_v2.md \
            scripts/science/prepare_deform360_archive_manifest.py \
            scripts/science/prepare_deform360_name_inventory.py \
            scripts/science/prepare_deform360_public_protocol.py \
            scripts/science/run_deform360_group_evaluation.py \
            tests/test_deform360_archive_manifest.py \
            tests/test_deform360_group_evaluation.py \
            tests/test_deform360_name_inventory.py \
            tests/test_deform360_preflight_workflow.py \
            tests/test_deform360_public_protocol.py
          git diff --cached --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Harden staged Deform360 group evaluation"
          git push origin HEAD:agent/deform360-group-evaluation-v2
