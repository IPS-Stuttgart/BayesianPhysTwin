name: Repair Deform360 joint-sparse v4 typing once

on:
  push:
    branches:
      - agent/deform360-joint-sparse-observability-v4
    paths:
      - .github/workflows/_repair-deform360-joint-sparse-v4-mypy-once.yml

permissions:
  contents: write

concurrency:
  group: repair-deform360-joint-sparse-v4-mypy-once
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.ref == 'refs/heads/agent/deform360-joint-sparse-observability-v4'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/deform360-joint-sparse-observability-v4
          fetch-depth: 0
          persist-credentials: true
          clean: true
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Merge main, repair typing, remove helper, and publish
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "IPS-Stuttgart/BayesianPhysTwin"
          test "$(git branch --show-current)" = \
            "agent/deform360-joint-sparse-observability-v4"
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

          python - <<'PY'
          from pathlib import Path

          core = Path(
              'src/bayesian_phystwin/'
              'deform360_joint_sparse_observability_v4.py'
          )
          text = core.read_text(encoding='utf-8')
          old = '        else:\n            numerical = (\n'
          new = '        else:\n            technical_numerical = (\n'
          if text.count(old) != 1:
              raise SystemExit('unexpected technical numerical tuple occurrence')
          text = text.replace(old, new)
          old = 'all(value is None for value in numerical)'
          new = 'all(value is None for value in technical_numerical)'
          if text.count(old) != 1:
              raise SystemExit('unexpected technical numerical use occurrence')
          text = text.replace(old, new)
          old = '    result = np.zeros(len(raw), dtype=np.float64)\n'
          new = '    result: np.ndarray = np.zeros(len(raw), dtype=np.float64)\n'
          if text.count(old) != 1:
              raise SystemExit('unexpected row-weight result occurrence')
          text = text.replace(old, new)
          old = '    all_rows = np.ones(len(batch.factor_ids), dtype=np.bool_)\n'
          new = (
              '    all_rows: np.ndarray = np.ones(\n'
              '        len(batch.factor_ids), dtype=np.bool_\n'
              '    )\n'
          )
          if text.count(old) != 1:
              raise SystemExit('unexpected all-row mask occurrence')
          text = text.replace(old, new)
          core.write_text(text, encoding='utf-8')

          cli = Path(
              'scripts/science/'
              'evaluate_deform360_joint_sparse_observability_v4.py'
          )
          text = cli.read_text(encoding='utf-8')
          old = '    batch = Deform360JointSparseFactorBatchV4(**descriptor, **arrays)\n'
          new = (
              '    batch = Deform360JointSparseFactorBatchV4(\n'
              '        **descriptor, **arrays\n'
              '    )  # type: ignore[arg-type]\n'
          )
          if text.count(old) != 1:
              raise SystemExit('unexpected dynamic batch constructor occurrence')
          cli.write_text(text.replace(old, new), encoding='utf-8')
          PY

          python -m pip install -e ".[dev]"
          files=(
            src/bayesian_phystwin/deform360_joint_sparse_observability_v4.py
            scripts/science/evaluate_deform360_joint_sparse_observability_v4.py
          )
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m mypy "${files[@]}"
          git rm .github/workflows/_repair-deform360-joint-sparse-v4-mypy-once.yml
          git diff --check
          git add "${files[@]}"
          git commit -m "Repair Deform360 joint-sparse v4 typing"
          git push origin HEAD:agent/deform360-joint-sparse-observability-v4
