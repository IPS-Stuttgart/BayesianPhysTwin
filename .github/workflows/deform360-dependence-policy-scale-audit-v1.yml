# workflow-lifecycle: permanent
# workflow-owner: IPS-Stuttgart maintainers
name: Deform360 dependence policy-scale audit v1

on:
  push:
    branches:
      - science/deform360-dependence-policy-scale-audit-v1
    paths:
      - .github/requests/deform360-dependence-policy-scale-audit-v1.json

permissions:
  actions: read
  contents: read

concurrency:
  group: deform360-dependence-policy-scale-audit-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  DATASET_ROOT: /mnt/seagate10tb/florianpfaff/datasets/deform360
  RECOVERY_REVISION: 6b9ee8adbe89b8b536cb0d7ddde93e23db2214f2
  RECOVERY_RUNNER_PATH: recovery/scripts/science/run_deform360_dependence_query_v6_bound_carrier_recovery_v1.py
  RECOVERY_RUNNER_BLOB: 0955ad7ce0c176e7538bd5b91cc36e3444564be5
  V6_REVISION: 395fb5aa2dbf6ed135f5b78676e97170b28b4aa8
  V6_RUNNER_PATH: v6-control/scripts/science/run_deform360_dependence_query_v6.py
  V6_RUNNER_BLOB: b5c2b219f083d3f3af578a840194829bacd56e3e
  V6_PROTOCOL_PATH: v6-control/protocols/deform360_dependence_query_v6.json
  PARENT_CONTROL_REVISION: e409527b8499a225bde8bd7f8c532a30e96548c6
  PARENT_PROTOCOL_PATH: parent-control/protocols/deform360_untouched_confirmation_v5.json
  FROZEN_REVISION: 25ba91c021124569c4dcf84c66eda5ec088868e0
  PARENT_ARTIFACT_ID: "9738998271"
  PARENT_ARTIFACT_SHA256: e98f9e2687f568d0d0fcabec9ce0393a7e1b34ca3019acb1e14fdf894885a948
  PARENT_RESULT_SHA256: 0ad16b15c94d81b8c14221a271eb1f647d689a530284570becdfeca87e0d8ec7
  PARENT_READINESS_SHA256: 58841144ae5105080ecb991cc73e9021214fc8676f9e55948ef3511fb12a2f8e
  REFERENCE_ARTIFACT_ID: "9811194776"
  REFERENCE_ARTIFACT_SHA256: 8b3bad2bc0620228ebe32027028b1666ea7772a1850f0ab45d525e30e4ced82a
  REFERENCE_RESULT_SHA256: c73659af65c2b87923f7bd668f9717afab03e449a5b3abd3a5b597ec60898fd1
  AUDIT_RUNNER_PATH: control/scripts/science/run_deform360_dependence_policy_scale_audit_v1.py
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate focused audit implementation
        run: |
          set -euo pipefail
          python -m pip install numpy==1.26.4 ruff==0.14.14
          python scripts/science/run_deform360_dependence_policy_scale_audit_v1.py --self-test
          python -m py_compile scripts/science/run_deform360_dependence_policy_scale_audit_v1.py
          python -m ruff check scripts/science/run_deform360_dependence_policy_scale_audit_v1.py
          python -m ruff format --check scripts/science/run_deform360_dependence_policy_scale_audit_v1.py
          python -m json.tool \
            .github/requests/deform360-dependence-policy-scale-audit-v1.json \
            >/dev/null

  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      request_path: ${{ steps.request.outputs.request_path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: request
        name: Authorize one add-only retrospective audit request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = \
            refs/heads/science/deform360-dependence-policy-scale-audit-v1
          test "${PUSH_FORCED}" = false
          test "${BEFORE_SHA}" != 0000000000000000000000000000000000000000
          mapfile -t changed < <(git diff --name-status "${BEFORE_SHA}" "${GITHUB_SHA}")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = \
            $'A\t.github/requests/deform360-dependence-policy-scale-audit-v1.json'
          REQUEST=.github/requests/deform360-dependence-policy-scale-audit-v1.json
          REQUEST_PATH="${REQUEST}" python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          path = Path(os.environ["REQUEST_PATH"])
          value = json.loads(path.read_text(encoding="utf-8"))
          parent = subprocess.check_output(
              ["git", "rev-parse", "HEAD^"], text=True
          ).strip()
          expected = {
              "schema": "bayesian-phystwin/deform360-dependence-policy-scale-audit-request-v1",
              "request_id": "deform360-dependence-policy-scale-audit-20260903-v1",
              "purpose": (
                  "Rerun the exact bound-carrier same-mean dependence study and "
                  "separate probability-scale value from target-risk-ranking value "
                  "using source-rate and label-blind equal-coverage policies."
              ),
              "runner_labels": [
                  "self-hosted", "Linux", "X64", "gpuserver4090"
              ],
              "dataset_root": "/mnt/seagate10tb/florianpfaff/datasets/deform360",
              "reference_workflow_run_id": 33528032875,
              "reference_artifact_id": 9811194776,
              "retrospective_target_reuse": True,
              "target_labels_may_select_policy": False,
              "new_measurements_collected": False,
              "paper_claim_authorized": False,
              "expected_source_revision": parent,
          }
          if value != expected:
              raise SystemExit("audit request differs from its frozen schema")
          PY
          echo "request_path=${REQUEST}" >> "${GITHUB_OUTPUT}"

  evaluate:
    needs: [contracts, authorize]
    if: >-
      always() && needs.contracts.result == 'success' &&
      needs.authorize.result == 'success'
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 240
    env:
      REQUEST_PATH: ${{ needs.authorize.outputs.request_path }}
    steps:
      - name: Check out audit control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          persist-credentials: false
          clean: true

      - name: Check out exact bound-carrier recovery
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RECOVERY_REVISION }}
          path: recovery
          persist-credentials: false
          clean: true

      - name: Check out exact v6 analysis
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.V6_REVISION }}
          path: v6-control
          persist-credentials: false
          clean: true

      - name: Check out exact parent confirmation control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PARENT_CONTROL_REVISION }}
          path: parent-control
          persist-credentials: false
          clean: true

      - name: Check out exact frozen v3 point method
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.FROZEN_REVISION }}
          path: frozen
          persist-credentials: false
          clean: true

      - name: Recover pinned parent and reference artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf parent-evidence reference-evidence parent-evidence.zip reference-evidence.zip
          mkdir -p parent-evidence reference-evidence
          curl --fail --location --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PARENT_ARTIFACT_ID}/zip" \
            --output parent-evidence.zip
          curl --fail --location --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${REFERENCE_ARTIFACT_ID}/zip" \
            --output reference-evidence.zip
          printf '%s  %s\n' "${PARENT_ARTIFACT_SHA256}" parent-evidence.zip \
            | sha256sum --check --strict
          printf '%s  %s\n' "${REFERENCE_ARTIFACT_SHA256}" reference-evidence.zip \
            | sha256sum --check --strict
          unzip -q parent-evidence.zip -d parent-evidence
          unzip -q reference-evidence.zip -d reference-evidence
          printf '%s  %s\n' "${PARENT_RESULT_SHA256}" parent-evidence/result.json \
            | sha256sum --check --strict
          printf '%s  %s\n' "${PARENT_READINESS_SHA256}" \
            parent-evidence/bound-readiness.json | sha256sum --check --strict
          printf '%s  %s\n' "${REFERENCE_RESULT_SHA256}" \
            reference-evidence/result.json | sha256sum --check --strict

      - name: Prepare isolated numerical runtime and evidence root
        shell: bash
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP}/deform360-policy-scale-audit-venv-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          output="${RUNNER_TEMP}/deform360-policy-scale-audit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "${venv}" "${output}"
          python3 -m venv "${venv}"
          "${venv}/bin/python" -m pip install --disable-pip-version-check numpy==1.26.4
          mkdir -p -- "${output}"
          {
            echo "PYTHON_BIN=${venv}/bin/python"
            echo "VENV_ROOT=${venv}"
            echo "OUTPUT_ROOT=${output}"
          } >> "${GITHUB_ENV}"

      - name: Validate exact lineage and runtime
        shell: bash
        run: |
          set -euo pipefail
          test -d "${DATASET_ROOT}"
          test "$(readlink -f -- "${DATASET_ROOT}")" = "${DATASET_ROOT}"
          test "$(git -C recovery rev-parse HEAD)" = "${RECOVERY_REVISION}"
          test "$(git -C v6-control rev-parse HEAD)" = "${V6_REVISION}"
          test "$(git -C parent-control rev-parse HEAD)" = \
            "${PARENT_CONTROL_REVISION}"
          test "$(git -C frozen rev-parse HEAD)" = "${FROZEN_REVISION}"
          test "$(git -C recovery hash-object \
            scripts/science/run_deform360_dependence_query_v6_bound_carrier_recovery_v1.py)" = \
            "${RECOVERY_RUNNER_BLOB}"
          test "$(git -C v6-control hash-object \
            scripts/science/run_deform360_dependence_query_v6.py)" = \
            "${V6_RUNNER_BLOB}"
          "${PYTHON_BIN}" -m py_compile \
            "${AUDIT_RUNNER_PATH}" \
            "${RECOVERY_RUNNER_PATH}" \
            "${V6_RUNNER_PATH}"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "audit_revision=${GITHUB_SHA}"
            echo "recovery_revision=${RECOVERY_REVISION}"
            echo "v6_revision=${V6_REVISION}"
            echo "parent_control_revision=${PARENT_CONTROL_REVISION}"
            echo "frozen_revision=${FROZEN_REVISION}"
            echo "runner_name=${RUNNER_NAME}"
            echo "dataset_root=${DATASET_ROOT}"
            sha256sum \
              "${AUDIT_RUNNER_PATH}" \
              "${RECOVERY_RUNNER_PATH}" \
              "${V6_RUNNER_PATH}" \
              "${V6_PROTOCOL_PATH}" \
              parent-evidence/result.json \
              parent-evidence/bound-readiness.json \
              reference-evidence/result.json \
              parent-evidence.zip \
              reference-evidence.zip
            "${PYTHON_BIN}" --version
            "${PYTHON_BIN}" -c 'import numpy; print("numpy=" + numpy.__version__)'
            uname -a
          } | tee "${OUTPUT_ROOT}/environment.txt"
          cp "control/${REQUEST_PATH}" "${OUTPUT_ROOT}/request.json"

      - name: Run dependence policy-scale audit
        shell: bash
        run: |
          set -euo pipefail
          "${PYTHON_BIN}" "${AUDIT_RUNNER_PATH}" \
            --recovery-runner "${RECOVERY_RUNNER_PATH}" \
            --base-runner "${V6_RUNNER_PATH}" \
            --protocol "${V6_PROTOCOL_PATH}" \
            --parent-protocol "${PARENT_PROTOCOL_PATH}" \
            --parent-result parent-evidence/result.json \
            --readiness-json parent-evidence/bound-readiness.json \
            --data-root "${DATASET_ROOT}" \
            --parent-control-root parent-control \
            --frozen-root frozen \
            --reference-result reference-evidence/result.json \
            --output-json "${OUTPUT_ROOT}/result.json" \
            --output-report "${OUTPUT_ROOT}/report.md" \
            --output-csv "${OUTPUT_ROOT}/object-policy-results.csv" \
            --bootstrap-repetitions 20000 \
            --seed 260903 \
            | tee "${OUTPUT_ROOT}/console.log"
          cat "${OUTPUT_ROOT}/report.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Enforce audit completeness and claim boundary
        shell: bash
        run: |
          set -euo pipefail
          "${PYTHON_BIN}" - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["OUTPUT_ROOT"])
          result = json.loads((root / "result.json").read_text(encoding="utf-8"))
          if result["schema"] != (
              "bayesian-phystwin/deform360-dependence-policy-scale-audit-v1"
          ):
              raise SystemExit("unexpected policy-scale audit schema")
          if result["status"] != "complete" or result["object_count"] != 92:
              raise SystemExit("policy-scale audit is incomplete")
          failed = [name for name, passed in result["gates"].items() if not passed]
          if failed:
              raise SystemExit(f"policy-scale audit gate failures: {failed}")
          if result["decision"]["paper_claim_authorized"] is not False:
              raise SystemExit("audit self-authorized a paper claim")
          if result["decision"]["deployment_claim_authorized"] is not False:
              raise SystemExit("audit self-authorized a deployment claim")
          unsigned = dict(result)
          supplied = unsigned.pop("result_sha256")
          encoded = json.dumps(
              unsigned,
              sort_keys=True,
              separators=(",", ":"),
              allow_nan=False,
          ).encode("utf-8")
          if hashlib.sha256(encoded).hexdigest() != supplied:
              raise SystemExit("policy-scale audit digest is invalid")
          PY
          sha256sum "${OUTPUT_ROOT}"/* > "${OUTPUT_ROOT}/sha256sums.txt"
          for root in control recovery v6-control parent-control frozen; do
            git -C "${root}" diff --exit-code
            test -z "$(git -C "${root}" status --porcelain --untracked-files=all)"
          done

      - name: Upload complete policy-scale audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: deform360-dependence-policy-scale-audit-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_ROOT }}
          if-no-files-found: warn
          retention-days: 90

      - name: Remove isolated runtime
        if: always()
        shell: bash
        run: rm -rf -- "${VENV_ROOT:-}"
