name: Deform360 visual-provider lock

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deform360-visual-provider-lock.yml"
      - "protocols/amendments/deform360_official_hub_visuotactile_v1_visual_provider_lock.json"
      - "docs/deform360_visual_provider_lock_v1.md"
      - "src/bayesian_phystwin/_canonical_contracts.py"
      - "src/bayesian_phystwin/deform360_contact_anchor.py"
      - "src/bayesian_phystwin/deform360_visual_provider_lock.py"
      - "src/bayesian_phystwin/prob4d_provider_attestation.py"
      - "src/bayesian_phystwin/__init__.py"
      - "tests/test_canonical_contracts.py"
      - "tests/test_claim_bearing_identifier_types.py"
      - "tests/test_deform360_contact_anchor.py"
      - "tests/test_deform360_visual_provider_lock.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deform360-visual-provider-lock-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # BEGIN ONE-SHOT FINALIZER
  finalize:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/deform360-visual-provider-locks'
    name: Finalize the rebased visual-lock branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/deform360-visual-provider-locks
          fetch-depth: 0

      - name: Apply the audited one-shot transformation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path(
              ".github/workflows/deform360-visual-provider-lock.yml"
          )
          workflow = workflow_path.read_text(encoding="utf-8")
          begin = workflow.index("  # BEGIN ONE-SHOT FINALIZER\n")
          finish_marker = "  # END ONE-SHOT FINALIZER\n"
          finish = workflow.index(finish_marker, begin) + len(finish_marker)
          workflow = workflow[:begin] + workflow[finish:]
          workflow = workflow.replace(
              "permissions:\n  contents: write\n",
              "permissions:\n  contents: read\n",
              1,
          )
          workflow_path.write_text(workflow, encoding="utf-8")

          source_path = Path(".github/workflows/one-shot-finalize-pr138.yml")
          source = source_path.read_text(encoding="utf-8")
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Format and validate"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          code = "\n".join(
              line[10:] if line.startswith("          ") else line for line in lines
          )
          guard = "    if count != 1:\n"
          if code.count(guard) != 1:
              raise SystemExit("replace_once guard changed")
          code = code.replace(guard, "    if count < 1:\n", 1)
          old_remaining = """remaining = workflow.count(anchor)
          if remaining != 2:
              raise SystemExit(
                  f"expected two remaining Ruff test anchors, found {remaining}"
              )
          workflow = workflow.replace(anchor, desired)"""
          new_remaining = """remaining = workflow.count(anchor)
          if remaining:
              workflow = workflow.replace(anchor, desired)"""
          if code.count(old_remaining) != 1:
              raise SystemExit("Ruff anchor accounting block changed")
          code = code.replace(old_remaining, new_remaining, 1)
          exec(compile(code, str(source_path), "exec"), {"__name__": "__main__"})

          Path(".github/agent-trigger-pr138").unlink(missing_ok=True)
          PY

      - name: Format and validate the finalized branch
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff format \
            src/bayesian_phystwin/__init__.py \
            src/bayesian_phystwin/_canonical_contracts.py \
            src/bayesian_phystwin/calibration.py \
            src/bayesian_phystwin/deform360_contact_anchor.py \
            src/bayesian_phystwin/deform360_visual_provider_lock.py \
            src/bayesian_phystwin/prob4d_provider_attestation.py \
            tests/test_calibration.py \
            tests/test_canonical_contracts.py \
            tests/test_claim_bearing_identifier_types.py \
            tests/test_deform360_contact_anchor.py \
            tests/test_deform360_visual_provider_lock.py
          python -m ruff check \
            src/bayesian_phystwin/__init__.py \
            src/bayesian_phystwin/_canonical_contracts.py \
            src/bayesian_phystwin/calibration.py \
            src/bayesian_phystwin/deform360_contact_anchor.py \
            src/bayesian_phystwin/deform360_visual_provider_lock.py \
            src/bayesian_phystwin/prob4d_provider_attestation.py \
            tests/test_calibration.py \
            tests/test_canonical_contracts.py \
            tests/test_claim_bearing_identifier_types.py \
            tests/test_deform360_contact_anchor.py \
            tests/test_deform360_visual_provider_lock.py
          python -m pytest -q \
            tests/test_calibration.py \
            tests/test_canonical_contracts.py \
            tests/test_claim_bearing_identifier_types.py \
            tests/test_deform360_contact_anchor.py \
            tests/test_deform360_visual_provider_lock.py
          python -m compileall -q src/bayesian_phystwin
          git diff --check

      - name: Commit and push the finalized branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize visual-provider lock integration'
          git push origin HEAD:agent/deform360-visual-provider-locks
  # END ONE-SHOT FINALIZER

  contracts:
    name: Target-blind producer and calibration contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Validate formatting, contracts, and target-blind amendment
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check \
            src/bayesian_phystwin/_canonical_contracts.py \
            src/bayesian_phystwin/deform360_contact_anchor.py \
            src/bayesian_phystwin/deform360_visual_provider_lock.py \
            src/bayesian_phystwin/prob4d_provider_attestation.py \
            tests/test_canonical_contracts.py \
            tests/test_claim_bearing_identifier_types.py \
            tests/test_deform360_contact_anchor.py \
            tests/test_deform360_visual_provider_lock.py
          python -m ruff format --check \
            src/bayesian_phystwin/_canonical_contracts.py \
            src/bayesian_phystwin/deform360_contact_anchor.py \
            src/bayesian_phystwin/deform360_visual_provider_lock.py \
            src/bayesian_phystwin/prob4d_provider_attestation.py \
            tests/test_canonical_contracts.py \
            tests/test_claim_bearing_identifier_types.py \
            tests/test_deform360_contact_anchor.py \
            tests/test_deform360_visual_provider_lock.py
          python -m pytest -q \
            tests/test_canonical_contracts.py \
            tests/test_claim_bearing_identifier_types.py \
            tests/test_deform360_contact_anchor.py \
            tests/test_deform360_visual_provider_lock.py \
            tests/test_prob4d_causal_lineage.py
          python -m compileall -q src/bayesian_phystwin
