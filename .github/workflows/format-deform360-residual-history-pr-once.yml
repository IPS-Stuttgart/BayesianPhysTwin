name: Format Deform360 residual-history PR once

on:
  push:
    branches: [agent/deform360-covariance-residual-history-dry-run-v1]

permissions:
  contents: write

concurrency:
  group: format-deform360-residual-history-pr-once
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  format:
    if: github.ref == 'refs/heads/agent/deform360-covariance-residual-history-dry-run-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/deform360-covariance-residual-history-dry-run-v1
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply the repository formatter
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python -m pip install "ruff==0.16.2"
          files=(
            scripts/science/run_deform360_covariance_residual_history_dry_run_v1.py
            src/bayesian_phystwin/_deform360_covariance_residual_history_adapter_v1.py
            src/bayesian_phystwin/_deform360_covariance_residual_history_common_v1.py
            src/bayesian_phystwin/_deform360_covariance_residual_history_decision_v1.py
            src/bayesian_phystwin/deform360_covariance_residual_history_v1.py
            tests/test_deform360_covariance_residual_history_real_camera_roster_v1.py
            tests/test_deform360_covariance_residual_history_v1.py
          )
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"

      - name: Commit formatter output and remove execution helpers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          helpers=(
            .github/workflows/format-deform360-residual-history-pr-once.yml
            .github/workflows/format-deform360-residual-history-pr524-once.yml
          )
          rm -f -- "${helpers[@]}"
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- \
            "${helpers[@]}" \
            scripts/science/run_deform360_covariance_residual_history_dry_run_v1.py \
            src/bayesian_phystwin/_deform360_covariance_residual_history_adapter_v1.py \
            src/bayesian_phystwin/_deform360_covariance_residual_history_common_v1.py \
            src/bayesian_phystwin/_deform360_covariance_residual_history_decision_v1.py \
            src/bayesian_phystwin/deform360_covariance_residual_history_v1.py \
            tests/test_deform360_covariance_residual_history_real_camera_roster_v1.py \
            tests/test_deform360_covariance_residual_history_v1.py
          git commit -m "Apply canonical residual-history formatting"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" push \
            origin HEAD:refs/heads/agent/deform360-covariance-residual-history-dry-run-v1
