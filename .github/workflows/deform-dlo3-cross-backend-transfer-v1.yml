# workflow-lifecycle: temporary-one-shot
# workflow-owner: IPS-Stuttgart maintainers
name: DLO3 no-refit cross-backend transfer v1

on:
  push:
    branches:
      - science/deform-dlo3-cross-backend-transfer-v1
    paths:
      - .github/requests/deform-dlo3-cross-backend-transfer-v1.json

permissions:
  actions: read
  contents: write

concurrency:
  group: deform-dlo3-cross-backend-transfer-v1
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  FROZEN_IMPLEMENTATION_REVISION: d8c144ddeff2b75a1fa600d44e9991444e98646c
  BLOCKING_RUN_ID: "33361441865"
  PROTOCOL: protocols/deform_dlo3_cross_backend_transfer_v1.json
  REQUEST_PATH: .github/requests/deform-dlo3-cross-backend-transfer-v1.json
  FROZEN_PYTHON: /home/florianpfaff/source-only/deform-bayesian-v1/venv/bin/python
  RUN_ROOT: /home/github-runner/.cache/workflows/deform-dlo3-cross-backend-transfer-v1
  PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/scripts/remote:${{ github.workspace }}

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate the frozen evaluator and runner
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e . pytest ruff
          python -m pytest -q tests/test_deform_dlo3_cross_backend_transfer_v1.py
          python -m ruff check \
            src/bayesian_phystwin_experiments/deform_dlo_cross_backend_transfer_v1.py \
            scripts/remote/run_deform_dlo3_cross_backend_transfer_v1.py \
            tests/test_deform_dlo3_cross_backend_transfer_v1.py
          python -m ruff format --check \
            src/bayesian_phystwin_experiments/deform_dlo_cross_backend_transfer_v1.py \
            scripts/remote/run_deform_dlo3_cross_backend_transfer_v1.py \
            tests/test_deform_dlo3_cross_backend_transfer_v1.py

  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    outputs:
      blocking_conclusion: ${{ steps.blocker.outputs.conclusion }}
      blocking_head_sha: ${{ steps.blocker.outputs.head_sha }}
    steps:
      - name: Check out exact requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Authorize exactly one add-only execution request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/science/deform-dlo3-cross-backend-transfer-v1
          test "$PUSH_FORCED" = false
          test "$BEFORE_SHA" != 0000000000000000000000000000000000000000
          mapfile -t changed < <(git diff --name-status "$BEFORE_SHA" "$GITHUB_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = $'A\t.github/requests/deform-dlo3-cross-backend-transfer-v1.json'
          FROZEN_IMPLEMENTATION_REVISION="$FROZEN_IMPLEMENTATION_REVISION" \
          REQUEST_PATH="$REQUEST_PATH" \
          GITHUB_SHA="$GITHUB_SHA" \
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          request = json.loads(Path(os.environ["REQUEST_PATH"]).read_text(encoding="utf-8"))
          expected = {
              "schema": "deform-dlo3-cross-backend-transfer-request-v1",
              "request_id": "deform-dlo3-cross-backend-transfer-20260901-v1",
              "mode": "run",
              "runner_label": "gpuserver4090",
              "blocking_run_id": 33361441865,
              "require_blocking_run_terminal": True,
              "frozen_implementation_revision": os.environ["FROZEN_IMPLEMENTATION_REVISION"],
              "protocol": "protocols/deform_dlo3_cross_backend_transfer_v1.json",
              "source_panel": "DEFORM-DLO3/train/source_test",
              "source_outcomes_previously_opened": True,
              "pyelastica_refit": False,
              "deform_refit": False,
              "target_side_selection": False,
              "dlo3_official_evaluation_read": False,
              "dlo4_or_dlo5_read": False,
              "held_v8_access": False,
              "paper_claim_authorized": False,
          }
          if request != expected:
              missing = sorted(set(expected) - set(request))
              extra = sorted(set(request) - set(expected))
              wrong = {
                  key: (request.get(key), value)
                  for key, value in expected.items()
                  if request.get(key) != value
              }
              raise SystemExit(
                  f"execution request differs: missing={missing} extra={extra} wrong={wrong}"
              )

          trigger_parent = subprocess.check_output(
              ["git", "rev-parse", f"{os.environ['GITHUB_SHA']}^"], text=True
          ).strip()
          subprocess.run(
              [
                  "git",
                  "merge-base",
                  "--is-ancestor",
                  os.environ["FROZEN_IMPLEMENTATION_REVISION"],
                  trigger_parent,
              ],
              check=True,
          )
          changed_after_freeze = subprocess.check_output(
              [
                  "git",
                  "diff",
                  "--name-only",
                  os.environ["FROZEN_IMPLEMENTATION_REVISION"],
                  trigger_parent,
              ],
              text=True,
          ).splitlines()
          permitted = {".github/workflows/deform-dlo3-cross-backend-transfer-v1.yml"}
          if set(changed_after_freeze) != permitted:
              raise SystemExit(
                  f"scientific implementation changed after validation: {changed_after_freeze}"
              )
          PY

      - name: Wait only on the protected workflow, never on its runner
        id: blocker
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 20700 ))
          while true; do
            record="$(curl -fsSL \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$BLOCKING_RUN_ID")"
            status="$(python -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$record")"
            conclusion="$(python -c 'import json,sys; print(json.load(sys.stdin).get("conclusion") or "")' <<<"$record")"
            head_sha="$(python -c 'import json,sys; print(json.load(sys.stdin)["head_sha"])' <<<"$record")"
            printf '{"blocking_run_id":%s,"status":"%s","conclusion":"%s","head_sha":"%s","observed_at":"%s"}\n' \
              "$BLOCKING_RUN_ID" "$status" "$conclusion" "$head_sha" "$(date -u +%FT%TZ)"
            if test "$status" = completed; then
              echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
              echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
              break
            fi
            if test "$(date +%s)" -ge "$deadline"; then
              echo "Protected run did not become terminal inside the hosted admission window" >&2
              exit 75
            fi
            sleep 300
          done

  run:
    needs: [contracts, authorize]
    if: always() && needs.contracts.result == 'success' && needs.authorize.result == 'success'
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 60
    env:
      BLOCKING_CONCLUSION: ${{ needs.authorize.outputs.blocking_conclusion }}
      BLOCKING_HEAD_SHA: ${{ needs.authorize.outputs.blocking_head_sha }}
      OUTPUT_ROOT: /home/github-runner/.cache/workflows/deform-dlo3-cross-backend-transfer-v1/runs/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out exact authorized revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact runtime, artifacts, and one-shot custody
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test -x "$FROZEN_PYTHON"
          test ! -e "$OUTPUT_ROOT"
          mkdir -p "$RUN_ROOT/runs" "$RUN_ROOT/claims"
          request_sha="$($FROZEN_PYTHON -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest())' "$REQUEST_PATH")"
          claim="$RUN_ROOT/claims/$request_sha"
          mkdir "$claim"
          printf '%s\n' "$GITHUB_SHA" > "$claim/github_sha"
          mkdir -p "$OUTPUT_ROOT"
          if pgrep -fa 'experiments\.deform_dlo45_frozen_v1\.run' > "$OUTPUT_ROOT/concurrent-processes.txt"; then
            cat "$OUTPUT_ROOT/concurrent-processes.txt" >&2
            echo "Protected DLO4/DLO5 process still exists despite terminal Actions status" >&2
            exit 76
          fi
          "$FROZEN_PYTHON" scripts/remote/run_deform_dlo3_cross_backend_transfer_v1.py \
            --protocol "$PROTOCOL" \
            --output-root "$OUTPUT_ROOT/preflight" \
            --mode preflight
          rm -rf "$OUTPUT_ROOT/preflight"

      - name: Execute the frozen no-refit transfer diagnostic
        shell: bash
        run: |
          set -euo pipefail
          "$FROZEN_PYTHON" scripts/remote/run_deform_dlo3_cross_backend_transfer_v1.py \
            --protocol "$PROTOCOL" \
            --output-root "$OUTPUT_ROOT/evidence" \
            --mode run \
            2>&1 | tee "$OUTPUT_ROOT/execution.log"

      - name: Materialize reviewable evidence in the branch
        shell: bash
        run: |
          set -euo pipefail
          destination=results/sota/deform_dlo3_cross_backend_transfer_v1
          test ! -e "$destination"
          mkdir -p "$destination"
          cp "$OUTPUT_ROOT/evidence/preflight.json" "$destination/"
          cp "$OUTPUT_ROOT/evidence/method_seal.json" "$destination/"
          cp "$OUTPUT_ROOT/evidence/result.json" "$destination/"
          cp "$OUTPUT_ROOT/evidence/trajectory-results.csv" "$destination/"
          cp "$OUTPUT_ROOT/evidence/report.md" "$destination/"
          BLOCKING_CONCLUSION="$BLOCKING_CONCLUSION" \
          BLOCKING_HEAD_SHA="$BLOCKING_HEAD_SHA" \
          GITHUB_RUN_ID="$GITHUB_RUN_ID" \
          GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
          GITHUB_SHA="$GITHUB_SHA" \
          "$FROZEN_PYTHON" - <<'PY' > "$destination/execution.json"
          import json
          import os

          print(json.dumps({
              "schema_version": 1,
              "contract": "deform-dlo3-cross-backend-transfer-execution-v1",
              "github_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "github_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "source_revision": os.environ["GITHUB_SHA"],
              "blocking_run_id": 33361441865,
              "blocking_run_head_sha": os.environ["BLOCKING_HEAD_SHA"],
              "blocking_run_conclusion": os.environ["BLOCKING_CONCLUSION"],
              "blocking_run_terminal_before_dispatch": True,
              "dlo3_official_evaluation_read": False,
              "dlo4_or_dlo5_read": False,
              "paper_claim_authorized": False,
          }, indent=2, sort_keys=True))
          PY
          find "$destination" -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > "$destination/SHA256SUMS"

      - name: Upload retained execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: deform-dlo3-cross-backend-transfer-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.OUTPUT_ROOT }}
            ${{ env.PROTOCOL }}
            ${{ env.REQUEST_PATH }}
          retention-days: 90
          if-no-files-found: warn

      - name: Publish the bounded result to the PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/sota/deform_dlo3_cross_backend_transfer_v1
          git diff --cached --check
          git commit -m 'Record DLO3 no-refit cross-backend transfer result'
          git push origin HEAD:science/deform-dlo3-cross-backend-transfer-v1

      - name: Preserve private custody and remove temporary trust
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -z "${OUTPUT_ROOT:-}" || chmod -R u+rwX,go-rwx "$OUTPUT_ROOT" || true
