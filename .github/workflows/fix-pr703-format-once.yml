name: Fix PR 703 formatting once

on:
  push:
    branches:
      - agent/guarded-provenance-handoff-v2

permissions:
  contents: write

concurrency:
  group: fix-pr703-format-once
  cancel-in-progress: false

jobs:
  fix:
    if: github.repository == 'IPS-Stuttgart/BayesianPhysTwin'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/guarded-provenance-handoff-v2
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Format and validate the bounded change
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          files=(
            src/bayesian_phystwin/guarded_belief_selection_v2.py
            src/bayesian_phystwin/provider_runtime_identity_v1.py
            src/bayesian_phystwin/tree_block_sparse_prob4d.py
            tests/test_portable_contracts_guarded_belief_selection_v2.py
            tests/test_portable_contracts_provider_runtime_identity_v1.py
            tests/test_portable_contracts_guarded_provenance_edges_v2.py
          )
          python -m ruff check --fix "${files[@]}"
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m pytest -q -p no:cacheprovider \
            tests/test_portable_contracts_guarded_belief_selection_v2.py \
            tests/test_portable_contracts_provider_runtime_identity_v1.py \
            tests/test_portable_contracts_guarded_provenance_edges_v2.py
          git diff --check

      - name: Commit repair and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-pr703-format-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Format and cover guarded provenance handoff'
          git push origin HEAD:agent/guarded-provenance-handoff-v2
