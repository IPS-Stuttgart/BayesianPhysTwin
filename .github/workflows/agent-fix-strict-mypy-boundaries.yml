name: Fix strict mypy boundaries

on:
  pull_request:
    branches: ["agent/threshold-risk-run-base"]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: agent-strict-mypy-boundaries
  cancel-in-progress: true

jobs:
  implement:
    if: github.head_ref == 'agent/tie-preserving-threshold-risk-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/tie-preserving-threshold-risk-v2
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Apply typed-boundary repair
        run: |
          python tools/agent_fix_strict_mypy_boundaries.py
          rm tools/agent_fix_strict_mypy_boundaries.py
          rm .github/workflows/agent-fix-strict-mypy-boundaries.yml
      - name: Format and lint repaired modules
        run: |
          python -m ruff format \
            src/bayesian_phystwin/cli/main.py \
            src/bayesian_phystwin/repository_provenance.py \
            src/bayesian_phystwin/run_manifest.py \
            src/bayesian_phystwin/run_manifest_v2.py
          python -m ruff check \
            src/bayesian_phystwin/cli/main.py \
            src/bayesian_phystwin/repository_provenance.py \
            src/bayesian_phystwin/run_manifest.py \
            src/bayesian_phystwin/run_manifest_v2.py
          python -m ruff format --check \
            src/bayesian_phystwin/cli/main.py \
            src/bayesian_phystwin/repository_provenance.py \
            src/bayesian_phystwin/run_manifest.py \
            src/bayesian_phystwin/run_manifest_v2.py
      - name: Run strict mature-interface typing gate
        run: |
          python -m mypy --strict \
            src/bayesian_phystwin/run_manifest.py \
            src/bayesian_phystwin/repository_provenance.py \
            src/bayesian_phystwin/run_manifest_v2.py \
            src/bayesian_phystwin/cli/main.py \
            src/bayesian_phystwin/cli/run_manifest.py \
            src/bayesian_phystwin/gauge_aware_belief.py
      - name: Run focused behavior tests
        run: |
          python -m pytest -q \
            tests/test_cli_main.py \
            tests/test_run_manifest.py \
            tests/test_run_manifest_v2.py \
            tests/test_run_manifest_cli.py \
            tests/test_decisive_evidence.py
      - name: Commit repaired boundaries
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair strict typing at mature interfaces"
          git push origin HEAD:agent/tie-preserving-threshold-risk-v2
