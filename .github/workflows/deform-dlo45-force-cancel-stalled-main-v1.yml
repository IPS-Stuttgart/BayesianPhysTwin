# workflow-lifecycle: temporary-one-shot
# workflow-owner: IPS-Stuttgart maintainers
name: Force-cancel stalled duplicate DLO4/DLO5 run

on:
  push:
    branches:
      - science/deform-dlo45-runner-label-recovery-v4
    paths:
      - triggers/deform-dlo45-force-cancel-stalled-main-v1.txt

permissions:
  actions: write
  contents: read

concurrency:
  group: deform-dlo45-force-cancel-stalled-main-v1
  cancel-in-progress: false

jobs:
  force-cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact cleanup request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Require one add-only force-cancel trigger
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/science/deform-dlo45-runner-label-recovery-v4
          test "$PUSH_FORCED" = false
          mapfile -t changed < <(git diff --name-status "$BEFORE_SHA" "$GITHUB_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = $'A\ttriggers/deform-dlo45-force-cancel-stalled-main-v1.txt'

      - name: Prove active custody and force-cancel only the stalled duplicate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIVE_RUN_ID: "33361441865"
          STALLED_RUN_ID: "33414972339"
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"

          active_run="$(gh api "repos/$repo/actions/runs/$ACTIVE_RUN_ID" --jq '[.status, (.conclusion // "")] | @tsv')"
          test "$active_run" = $'in_progress\t'
          active_source="$(gh api "repos/$repo/actions/runs/$ACTIVE_RUN_ID/jobs" \
            --jq '.jobs[] | select(.name == "source") | [.status, .runner_id, .runner_name] | @tsv')"
          active_status="${active_source%%$'\t'*}"
          active_rest="${active_source#*$'\t'}"
          active_runner_id="${active_rest%%$'\t'*}"
          active_runner_name="${active_rest#*$'\t'}"
          test "$active_status" = in_progress
          test "$active_runner_id" -gt 0
          test -n "$active_runner_name"

          stalled_run="$(gh api "repos/$repo/actions/runs/$STALLED_RUN_ID" --jq '[.status, (.conclusion // "")] | @tsv')"
          test "$stalled_run" = $'queued\t'
          stalled_source="$(gh api "repos/$repo/actions/runs/$STALLED_RUN_ID/jobs" \
            --jq '.jobs[] | select(.name == "source") | [.status, .runner_id, (.steps | length)] | @tsv')"
          test "$stalled_source" = $'queued\t0\t0'

          gh api --method POST "repos/$repo/actions/runs/$STALLED_RUN_ID/force-cancel"
          for attempt in $(seq 1 60); do
            status="$(gh api "repos/$repo/actions/runs/$STALLED_RUN_ID" --jq .status)"
            conclusion="$(gh api "repos/$repo/actions/runs/$STALLED_RUN_ID" --jq '.conclusion // ""')"
            echo "attempt=$attempt status=$status conclusion=$conclusion"
            if [[ "$status" = completed && "$conclusion" = cancelled ]]; then
              break
            fi
            sleep 2
          done
          test "$(gh api "repos/$repo/actions/runs/$STALLED_RUN_ID" --jq .status)" = completed
          test "$(gh api "repos/$repo/actions/runs/$STALLED_RUN_ID" --jq .conclusion)" = cancelled

          test "$(gh api "repos/$repo/actions/runs/$ACTIVE_RUN_ID" --jq .status)" = in_progress
          test "$(gh api "repos/$repo/actions/runs/$ACTIVE_RUN_ID/jobs" \
            --jq '.jobs[] | select(.name == "source") | .status')" = in_progress

      - name: Record cleanup boundary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Stalled DLO duplicate force-cancelled

          - Active frozen recovery preserved: `33361441865`
          - Stalled main-branch duplicate force-cancelled: `33414972339`
          - Active source job remained assigned and in progress
          - Scientific protocol changed: `false`
          - Target access caused by cleanup: `false`
          EOF
