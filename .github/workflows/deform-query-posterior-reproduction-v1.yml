# workflow-lifecycle: experimental
# workflow-owner: IPS-Stuttgart maintainers
name: Reproduce DEFORM posterior query test from real recordings

on:
  push:
    branches: [science/deform-query-posterior-reproduction-20260907]
    paths: [.github/requests/deform-query-posterior-reproduction-v1.json]

permissions:
  contents: read
  actions: read

concurrency:
  group: deform-query-posterior-reproduction-20260907
  cancel-in-progress: false

env:
  CAPSULE: experiments/deform_conditional_query_posterior_v1
  REQUEST: .github/requests/deform-query-posterior-reproduction-v1.json
  DATASET_ROOT: /mnt/seagate10tb/florianpfaff/datasets/deform/data_set
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  reproduce:
    name: Frozen raw-data rerun and numerical reproduction check
    runs-on: [self-hosted, gpuserver4090]
    timeout-minutes: 60
    steps:
      - name: Check out exact request commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Verify request-only change and unchanged scientific source
        env:
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          req = json.loads(Path(os.environ['REQUEST']).read_text())
          before = os.environ['BEFORE']
          changed = subprocess.check_output(['git', 'diff', '--name-only', before, os.environ['GITHUB_SHA']], text=True).splitlines()
          assert changed == [os.environ['REQUEST']], changed
          assert req['expected_base_revision'] == before
          assert req['status'] == 'authorized'
          assert req['runner_labels'] == ['self-hosted', 'gpuserver4090']
          assert req['dataset_root'] == os.environ['DATASET_ROOT']
          assert req['official_eval_access'] is False
          assert req['fresh_confirmation'] is False
          assert req['retuning'] is False
          assert req['historical_run_id'] == 33985128557
          for name, expected in req['git_blobs'].items():
              actual = subprocess.check_output(['git', 'hash-object', name], text=True).strip()
              assert actual == expected, (name, actual, expected)
          root = Path(os.environ['DATASET_ROOT'])
          for dlo in ('DLO4', 'DLO5'):
              assert len(list((root/dlo/'train').glob('*.pkl'))) == 56
          PY
          base="$RUNNER_TEMP/deform-query-reproduction-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$base"
          echo "REPRODUCTION_OUTPUT=$base" >> "$GITHUB_ENV"
          echo "REPRODUCTION_PYTHON=$base/venv/bin/python" >> "$GITHUB_ENV"
          python -m venv "$base/venv"
          "$base/venv/bin/python" -m pip install 'numpy==2.2.6' 'scipy==1.15.3' 'pytest==8.4.2'
          "$base/venv/bin/python" -m pip freeze > "$base/runtime.txt"
      - name: Retrieve pinned historical artifact for comparison only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9974939619/zip" \
            -o "$REPRODUCTION_OUTPUT/historical.zip"
          printf '%s  %s\n' e7e182e009ac234fb611afb6ca03eb1006ee65da2688ec2a084105667fa4e591 "$REPRODUCTION_OUTPUT/historical.zip" | sha256sum --check --strict
      - name: Run original numerical and information-exclusion tests
        shell: bash
        run: |
          set -euo pipefail
          "$REPRODUCTION_PYTHON" -m pytest -q -p no:cacheprovider "$CAPSULE/test_run.py" 2>&1 | tee "$REPRODUCTION_OUTPUT/tests.log"
      - name: Refit and rescore from real source recordings without retuning the protocol
        shell: bash
        run: |
          set -euo pipefail
          "$REPRODUCTION_PYTHON" "$CAPSULE/run.py" \
            --dataset-root "$DATASET_ROOT" \
            --output "$REPRODUCTION_OUTPUT/evidence" \
            --revision "$GITHUB_SHA" 2>&1 | tee "$REPRODUCTION_OUTPUT/run.log"
          cat "$REPRODUCTION_OUTPUT/evidence/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify raw-data result, input hashes, prediction seals and independent score aggregation
        shell: bash
        run: |
          set -euo pipefail
          "$REPRODUCTION_PYTHON" experiments/deform_query_reproduction_v1/verify.py \
            --output "$REPRODUCTION_OUTPUT/evidence" \
            --historical-archive "$REPRODUCTION_OUTPUT/historical.zip" \
            2>&1 | tee "$REPRODUCTION_OUTPUT/verification.log"
          cat "$REPRODUCTION_OUTPUT/evidence/REPRODUCTION.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload all outcomes including negative or failed evidence
        if: always() && env.REPRODUCTION_OUTPUT != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: deform-query-posterior-reproduction-${{ github.run_id }}
          path: |
            ${{ env.REPRODUCTION_OUTPUT }}/evidence/
            ${{ env.REPRODUCTION_OUTPUT }}/runtime.txt
            ${{ env.REPRODUCTION_OUTPUT }}/*.log
            experiments/deform_conditional_query_posterior_v1/run.py
            experiments/deform_conditional_query_posterior_v1/test_run.py
            experiments/deform_query_reproduction_v1/
            .github/requests/deform-query-posterior-reproduction-v1.json
          if-no-files-found: warn
          retention-days: 90
      - name: Remove only this job's isolated virtual environment
        if: always() && env.REPRODUCTION_OUTPUT != ''
        shell: bash
        run: rm -rf -- "$REPRODUCTION_OUTPUT/venv"
