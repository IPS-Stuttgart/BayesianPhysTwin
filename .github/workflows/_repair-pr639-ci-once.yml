name: Repair PR 639 RunManifestV2 CI once

on:
  push:
    branches:
      - agent/run-manifest-v2-hardening
    paths:
      - ".github/workflows/_repair-pr639-ci-once.yml"

permissions:
  contents: write

concurrency:
  group: repair-pr639-ci-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/run-manifest-v2-hardening
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply the focused source and coverage repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/bayesian_phystwin/run_manifest_v2.py")
          source = source_path.read_text(encoding="utf-8")
          replacements = {
              "        return content_id(self.scientific_descriptor())\n":
                  "        return cast(str, content_id(self.scientific_descriptor()))\n",
              "        return content_id(self.descriptor())\n":
                  "        return cast(str, content_id(self.descriptor()))\n",
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f"unexpected source occurrence count for: {old!r}")
              source = source.replace(old, new)
          source_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/test_run_manifest_v2_hardening.py")
          tests = test_path.read_text(encoding="utf-8")
          import_old = "from dataclasses import FrozenInstanceError\n"
          import_new = "from dataclasses import FrozenInstanceError, replace\n"
          if import_new not in tests:
              if tests.count(import_old) != 1:
                  raise SystemExit("unexpected dataclasses import")
              tests = tests.replace(import_old, import_new)

          marker = "def test_loader_rejects_nonobject_and_field_roster_changes"
          if marker in tests:
              raise SystemExit("focused PR 639 coverage tests already exist")

          tests = tests.rstrip() + r'''


          def test_loader_rejects_nonobject_and_field_roster_changes(
              tmp_path: Path,
          ) -> None:
              path = tmp_path / "run-manifest-v2.json"
              path.write_text("[]\n", encoding="utf-8")

              with pytest.raises(
                  ContractValidationError,
                  match="run manifest must be a JSON object",
              ):
                  load_run_manifest_v2(path)

              payload = _json_payload(_manifest())
              payload.pop("notes")
              path.write_text(json.dumps(payload), encoding="utf-8")

              with pytest.raises(
                  ContractValidationError,
                  match="run manifest fields changed",
              ):
                  load_run_manifest_v2(path)


          def test_manifest_mapping_normalizers_reject_nonstring_keys() -> None:
              with pytest.raises(
                  ContractValidationError,
                  match="package_versions keys must be strings",
              ):
                  replace(_manifest(), package_versions={1: "0.4.0"})

              with pytest.raises(
                  ContractValidationError,
                  match="metadata keys must be strings",
              ):
                  replace(_manifest(), metadata={1: "value"})


          def test_repository_state_rejects_invalid_identity_and_dirty_markers() -> None:
              with pytest.raises(ContractValidationError, match="role is invalid"):
                  replace(_repository(), role="observer")

              with pytest.raises(
                  ContractValidationError,
                  match="tree_sha256 must be a lowercase SHA-256 digest",
              ):
                  replace(_repository(), tree_sha256="x" * 64)

              with pytest.raises(
                  ContractValidationError,
                  match="commit_sha must be a string or null",
              ):
                  replace(_repository(), commit_sha=123)

              assert replace(_repository(), commit_sha=None).commit_sha is None

              with pytest.raises(
                  ContractValidationError,
                  match="dirty must be a boolean",
              ):
                  replace(_repository(), dirty=1)

              with pytest.raises(
                  ContractValidationError,
                  match="dirty repository describe must end with '-dirty'",
              ):
                  replace(_repository(), dirty=True, describe="v0.4.0")

              with pytest.raises(
                  ContractValidationError,
                  match="clean repository describe must not end with '-dirty'",
              ):
                  replace(_repository(), dirty=False, describe="v0.4.0-dirty")


          def test_artifact_record_rejects_invalid_path_and_kind() -> None:
              artifact = _manifest().inputs[0]

              with pytest.raises(
                  ContractValidationError,
                  match="artifact.path must not contain repeated separators",
              ):
                  replace(artifact, path="inputs//observation.npz")

              with pytest.raises(
                  ContractValidationError,
                  match="artifact.kind is invalid",
              ):
                  replace(artifact, kind="archive")


          @pytest.mark.parametrize(
              ("field", "value", "message"),
              [
                  ("schema", "example.unsupported", "unsupported run-manifest schema"),
                  (
                      "schema_version",
                      3,
                      "unsupported run-manifest schema_version",
                  ),
              ],
          )
          def test_loader_rejects_schema_dispatch_changes(
              tmp_path: Path,
              field: str,
              value: object,
              message: str,
          ) -> None:
              payload = _json_payload(_manifest())
              payload[field] = value
              _rewrite_identity(payload)
              path = tmp_path / f"{field}.json"
              path.write_text(json.dumps(payload), encoding="utf-8")

              with pytest.raises(ContractValidationError, match=message):
                  load_run_manifest_v2(path)
          '''
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Install validation dependencies
        run: python -m pip install -e ".[dev]"

      - name: Format and validate focused changes
        run: |
          python -m ruff check --fix -- \
            src/bayesian_phystwin/run_manifest_v2.py \
            tests/test_run_manifest_v2_hardening.py
          python -m ruff format -- \
            src/bayesian_phystwin/run_manifest_v2.py \
            tests/test_run_manifest_v2_hardening.py
          python -m ruff check -- \
            src/bayesian_phystwin/run_manifest_v2.py \
            tests/test_run_manifest_v2_hardening.py
          python -m ruff format --check -- \
            src/bayesian_phystwin/run_manifest_v2.py \
            tests/test_run_manifest_v2_hardening.py
          python -m pytest -q \
            tests/test_run_manifest_v2.py \
            tests/test_run_manifest_v2_hardening.py \
            tests/test_run_manifest_cli.py \
            tests/test_claim_bundle_v1.py
          python -m mypy \
            src/bayesian_phystwin/run_manifest.py \
            src/bayesian_phystwin/repository_provenance.py \
            src/bayesian_phystwin/run_manifest_v2.py \
            src/bayesian_phystwin/claim_bundle_v1.py \
            src/bayesian_phystwin/evidence_decision_v1.py \
            src/bayesian_phystwin/physical_query_v1.py \
            src/bayesian_phystwin/cli/main.py \
            src/bayesian_phystwin/cli/run_manifest.py \
            src/bayesian_phystwin/gauge_aware_belief.py \
            src/bayesian_phystwin/v1/__init__.py \
            src/bayesian_phystwin/causal4d_provider_v1.py \
            src/bayesian_phystwin/prob4d_causal_lineage.py

      - name: Commit and push repair
        run: |
          set -euo pipefail
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add \
            src/bayesian_phystwin/run_manifest_v2.py \
            tests/test_run_manifest_v2_hardening.py
          git diff --cached --check
          git commit -m "Fix RunManifestV2 hardening CI"
          git push origin HEAD:agent/run-manifest-v2-hardening
