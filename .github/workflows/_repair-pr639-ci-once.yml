name: Repair PR 639 RunManifestV2 CI once

on:
  push:
    branches:
      - agent/run-manifest-v2-hardening
    paths:
      - ".github/workflows/_repair-pr639-ci-once.yml"

permissions:
  contents: write

concurrency:
  group: repair-pr639-ci-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/run-manifest-v2-hardening
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply typing and stable-suite repairs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source_path = Path("src/bayesian_phystwin/run_manifest_v2.py")
          source = source_path.read_text(encoding="utf-8")
          replacements = {
              "        return content_id(self.scientific_descriptor())\n":
                  "        return cast(str, content_id(self.scientific_descriptor()))\n",
              "        return content_id(self.descriptor())\n":
                  "        return cast(str, content_id(self.descriptor()))\n",
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f"unexpected source occurrence count for: {old!r}")
              source = source.replace(old, new)
          source_path.write_text(source, encoding="utf-8")

          suite_path = Path(".github/quality/test-suites.json")
          payload = json.loads(suite_path.read_text(encoding="utf-8"))
          suites = payload["suites"]
          hardening_test = "tests/test_run_manifest_v2_hardening.py"
          anchor = "tests/test_run_manifest_v2.py"
          for suite_name in ("stable-core-coverage", "core-contracts"):
              entries = suites[suite_name]
              if hardening_test not in entries:
                  entries.insert(entries.index(anchor) + 1, hardening_test)
          suite_path.write_text(
              json.dumps(payload, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Install validation dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate focused contracts, typing, and coverage
        run: |
          set -euo pipefail
          python -m ruff check -- \
            src/bayesian_phystwin/run_manifest_v2.py \
            tests/test_run_manifest_v2_hardening.py
          python -m ruff format --check -- \
            src/bayesian_phystwin/run_manifest_v2.py \
            tests/test_run_manifest_v2_hardening.py
          python tools/quality/test_suite_manifest.py list stable-core-coverage >/dev/null
          python tools/quality/test_suite_manifest.py list core-contracts >/dev/null
          python -m pytest -q \
            tests/test_run_manifest_v2.py \
            tests/test_run_manifest_v2_hardening.py \
            tests/test_run_manifest_cli.py \
            tests/test_claim_bundle_v1.py
          python -m coverage erase
          python -m coverage run --branch --source=bayesian_phystwin \
            -m pytest -q \
            tests/test_run_manifest_v2.py \
            tests/test_run_manifest_v2_hardening.py
          python -m coverage json -o run-manifest-v2-coverage.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("run-manifest-v2-coverage.json").read_text(encoding="utf-8")
          )
          matches = [
              (path, record)
              for path, record in payload["files"].items()
              if path.endswith("bayesian_phystwin/run_manifest_v2.py")
          ]
          if len(matches) != 1:
              raise SystemExit(f"unexpected coverage file matches: {matches!r}")
          path, record = matches[0]
          summary = record["summary"]
          line_percent = float(summary["percent_covered"])
          branch_total = int(summary["num_branches"])
          branch_covered = int(summary["covered_branches"])
          branch_percent = (
              100.0
              if branch_total == 0
              else 100.0 * branch_covered / branch_total
          )
          print(
              f"{path}: lines={line_percent:.2f}% "
              f"branches={branch_percent:.2f}%"
          )
          if line_percent < 90.0 or branch_percent < 80.0:
              raise SystemExit("focused RunManifestV2 coverage is below the ratchet")
          PY
          python -m mypy \
            src/bayesian_phystwin/run_manifest.py \
            src/bayesian_phystwin/repository_provenance.py \
            src/bayesian_phystwin/run_manifest_v2.py \
            src/bayesian_phystwin/claim_bundle_v1.py \
            src/bayesian_phystwin/evidence_decision_v1.py \
            src/bayesian_phystwin/physical_query_v1.py \
            src/bayesian_phystwin/cli/main.py \
            src/bayesian_phystwin/cli/run_manifest.py \
            src/bayesian_phystwin/gauge_aware_belief.py \
            src/bayesian_phystwin/v1/__init__.py \
            src/bayesian_phystwin/causal4d_provider_v1.py \
            src/bayesian_phystwin/prob4d_causal_lineage.py

      - name: Commit and push repair
        run: |
          set -euo pipefail
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add \
            src/bayesian_phystwin/run_manifest_v2.py \
            .github/quality/test-suites.json
          git diff --cached --check
          git commit -m "Fix RunManifestV2 hardening CI"
          git push origin HEAD:agent/run-manifest-v2-hardening
