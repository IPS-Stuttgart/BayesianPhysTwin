name: Repair PR 639 RunManifestV2 CI once

on:
  push:
    branches:
      - agent/run-manifest-v2-hardening
    paths:
      - ".github/workflows/_repair-pr639-ci-once.yml"

permissions:
  contents: write

concurrency:
  group: repair-pr639-ci-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/run-manifest-v2-hardening
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Merge current main
        run: |
          set -euo pipefail
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Apply and commit the focused repair
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          source_path = Path("src/bayesian_phystwin/run_manifest_v2.py")
          source = source_path.read_text(encoding="utf-8")
          replacements = (
              (
                  "        return content_id(self.scientific_descriptor())\n",
                  "        return cast(str, content_id(self.scientific_descriptor()))\n",
              ),
              (
                  "        return content_id(self.descriptor())\n",
                  "        return cast(str, content_id(self.descriptor()))\n",
              ),
          )
          for old, new in replacements:
              old_count = source.count(old)
              new_count = source.count(new)
              if old_count == 1 and new_count == 0:
                  source = source.replace(old, new)
              elif old_count == 0 and new_count == 1:
                  pass
              else:
                  raise SystemExit(
                      "unexpected RunManifestV2 return form: "
                      f"old={old_count}, new={new_count}"
                  )
          source_path.write_text(source, encoding="utf-8")

          suite_path = Path(".github/quality/test-suites.json")
          payload = json.loads(suite_path.read_text(encoding="utf-8"))
          suites = payload["suites"]
          hardening_test = "tests/test_run_manifest_v2_hardening.py"
          anchor = "tests/test_run_manifest_v2.py"
          for suite_name in ("stable-core-coverage", "core-contracts"):
              entries = suites[suite_name]
              if hardening_test not in entries:
                  entries.insert(entries.index(anchor) + 1, hardening_test)
          suite_path.write_text(
              json.dumps(payload, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          git add \
            src/bayesian_phystwin/run_manifest_v2.py \
            .github/quality/test-suites.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Fix RunManifestV2 hardening CI"
          fi

      - name: Install validation dependencies
        run: |
          python -m pip install -e ".[dev,graph]"
          python -m pip install "coverage==7.13.3"

      - name: Validate focused contracts and strict typing
        run: |
          set -euo pipefail
          python -m ruff check -- \
            src/bayesian_phystwin/run_manifest_v2.py \
            tests/test_run_manifest_v2_hardening.py
          python -m ruff format --check -- \
            src/bayesian_phystwin/run_manifest_v2.py \
            tests/test_run_manifest_v2_hardening.py
          python tools/quality/test_suite_manifest.py list stable-core-coverage >/dev/null
          python tools/quality/test_suite_manifest.py list core-contracts >/dev/null
          python -m pytest -q \
            tests/test_run_manifest_v2.py \
            tests/test_run_manifest_v2_hardening.py \
            tests/test_run_manifest_cli.py \
            tests/test_claim_bundle_v1.py
          python -m mypy \
            src/bayesian_phystwin/run_manifest.py \
            src/bayesian_phystwin/repository_provenance.py \
            src/bayesian_phystwin/run_manifest_v2.py \
            src/bayesian_phystwin/claim_bundle_v1.py \
            src/bayesian_phystwin/evidence_decision_v1.py \
            src/bayesian_phystwin/physical_query_v1.py \
            src/bayesian_phystwin/cli/main.py \
            src/bayesian_phystwin/cli/run_manifest.py \
            src/bayesian_phystwin/gauge_aware_belief.py \
            src/bayesian_phystwin/v1/__init__.py \
            src/bayesian_phystwin/causal4d_provider_v1.py \
            src/bayesian_phystwin/prob4d_causal_lineage.py

      - name: Run the repository stable-core coverage ratchet
        shell: bash
        run: |
          set -euo pipefail
          export QUALITY_BASE_SHA="$(git merge-base origin/main HEAD)"
          export QUALITY_HEAD_SHA="$(git rev-parse HEAD)"

          python tools/quality/test_suite_manifest.py list stable-core-coverage \
            > "$RUNNER_TEMP/stable-core-tests.txt"
          mapfile -t stable_tests < "$RUNNER_TEMP/stable-core-tests.txt"
          test "${#stable_tests[@]}" -gt 0
          python -m coverage run --branch --source=bayesian_phystwin \
            -m pytest -q "${stable_tests[@]}"

          python -m coverage json -o package-coverage.json

          stable_files=(
            src/bayesian_phystwin/_gauge_aware_contracts.py
            src/bayesian_phystwin/_gauge_aware_solver.py
            src/bayesian_phystwin/calibration.py
            src/bayesian_phystwin/causal4d_provider_v1.py
            src/bayesian_phystwin/cli/main.py
            src/bayesian_phystwin/cli/run_manifest.py
            src/bayesian_phystwin/gauge_aware_belief.py
            src/bayesian_phystwin/deform360_contact_anchor.py
            src/bayesian_phystwin/observation_belief.py
            src/bayesian_phystwin/observation_belief_gauge_adapter.py
            src/bayesian_phystwin/phystwin_profile.py
            src/bayesian_phystwin/prob4d_causal_lineage.py
            src/bayesian_phystwin/prob4d_observation_contract.py
            src/bayesian_phystwin/pseudo_measurements.py
            src/bayesian_phystwin/repository_provenance.py
            src/bayesian_phystwin/robust_likelihood.py
            src/bayesian_phystwin/run_manifest.py
            src/bayesian_phystwin/run_manifest_v2.py
          )
          stable_include=$(IFS=,; echo "${stable_files[*]}")
          python -m coverage json \
            --include="${stable_include}" \
            -o stable-core-coverage.json
          python -m coverage report \
            --include="${stable_include}" \
            --show-missing

          python tools/quality/check_coverage_floors.py \
            stable-core-coverage.json \
            .github/quality/stable-core-coverage-floors.json \
            --changed-coverage-json package-coverage.json \
            --base "${QUALITY_BASE_SHA}" \
            --head "${QUALITY_HEAD_SHA}"

      - name: Push the validated repair
        run: |
          set -euo pipefail
          git push origin HEAD:agent/run-manifest-v2-hardening
