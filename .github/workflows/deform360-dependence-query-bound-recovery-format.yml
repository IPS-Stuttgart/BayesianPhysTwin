# workflow-lifecycle: temporary scientific maintenance
# workflow-owner: IPS-Stuttgart maintainers
name: Format Deform360 bound-carrier recovery

on:
  push:
    branches:
      - science/deform360-dependence-query-v6-bound-carrier-recovery-v1
    paths:
      - .github/requests/deform360-dependence-query-bound-recovery-format.json

permissions:
  contents: write

concurrency:
  group: deform360-dependence-query-bound-recovery-format
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Authorize one add-only formatter request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          test "${PUSH_FORCED}" = false
          test "${BEFORE_SHA}" != 0000000000000000000000000000000000000000
          mapfile -t changed < <(git diff --name-status "${BEFORE_SHA}" "${GITHUB_SHA}")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = \
            $'A\t.github/requests/deform360-dependence-query-bound-recovery-format.json'
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          request = json.loads(
              Path(
                  ".github/requests/deform360-dependence-query-bound-recovery-format.json"
              ).read_text(encoding="utf-8")
          )
          parent = subprocess.check_output(
              ["git", "rev-parse", "HEAD^"], text=True
          ).strip()
          expected = {
              "schema": "bayesian-phystwin/deform360-dependence-query-bound-recovery-format-v1",
              "target": "scripts/science/run_deform360_dependence_query_v6_bound_carrier_recovery_v1.py",
              "ruff_version": "0.14.14",
              "expected_source_revision": parent,
          }
          if request != expected:
              raise SystemExit("formatter request differs from its source-bound schema")
          PY
      - name: Apply exact formatter and validate recovery contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install numpy==1.26.4 pytest ruff==0.14.14
          target=scripts/science/run_deform360_dependence_query_v6_bound_carrier_recovery_v1.py
          python -m ruff format "$target"
          python -m ruff check "$target"
          python -m py_compile "$target"
          python "$target" --self-test
      - name: Commit formatted recovery and retire formatter
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/requests/deform360-dependence-query-bound-recovery-format.json \
            .github/requests/deform360-dependence-query-v6-bound-carrier-recovery-v1.json \
            .github/workflows/deform360-dependence-query-bound-recovery-format.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git diff --cached --quiet && {
            echo "formatter produced no commit" >&2
            exit 1
          }
          git commit -m "Format bound-carrier dependence-query recovery"
          git push origin HEAD:science/deform360-dependence-query-v6-bound-carrier-recovery-v1
