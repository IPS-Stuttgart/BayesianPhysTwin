name: Finalize fail-closed probability contracts

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: finalize-fail-closed-probability-cue-contracts
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.ref == 'agent/fail-closed-probability-cue-contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/fail-closed-probability-cue-contracts
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify and apply staged patch
        shell: bash
        run: |
          set -euo pipefail
          payload=.github/patches/fail-closed-contracts.patch.gz.b64
          patch_file="$RUNNER_TEMP/fail-closed-contracts.patch"
          base64 --decode "$payload" | gzip --decompress > "$patch_file"
          echo 'c2f685e8685cb86621954347ee0b95f3e6210d6f90a721c3bc74a5b671176219  '"$patch_file" | sha256sum --check --strict
          git merge-base --is-ancestor ae5a59283c1cd03093e69a392b9e5eaae7ebd1ca HEAD
          git apply --check \
            --exclude=.github/workflows/tests.yml \
            --exclude=CHANGELOG.md \
            "$patch_file"
          git apply \
            --exclude=.github/workflows/tests.yml \
            --exclude=CHANGELOG.md \
            "$patch_file"

          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/tests.yml')
          text = workflow.read_text(encoding='utf-8')
          test_anchor = '            tests/test_grouped_likelihood.py \\\n'
          test_block = (
              test_anchor
              + '            tests/test_calibration.py \\\n'
              + '            tests/test_pseudo_measurements.py \\\n'
              + '            tests/test_robust_likelihood.py \\\n'
          )
          if '            tests/test_calibration.py \\\n' not in text:
              if text.count(test_anchor) != 2:
                  raise SystemExit('unexpected grouped-likelihood test anchors')
              text = text.replace(test_anchor, test_block)

          stable_insertions = (
              (
                  '            src/bayesian_phystwin/_gauge_aware_solver.py\n',
                  '            src/bayesian_phystwin/calibration.py\n',
              ),
              (
                  '            src/bayesian_phystwin/prob4d_observation_contract.py\n',
                  '            src/bayesian_phystwin/pseudo_measurements.py\n',
              ),
              (
                  '            src/bayesian_phystwin/repository_provenance.py\n',
                  '            src/bayesian_phystwin/robust_likelihood.py\n',
              ),
          )
          for anchor, addition in stable_insertions:
              if addition not in text:
                  if text.count(anchor) != 1:
                      raise SystemExit(f'unexpected stable-file anchor: {anchor!r}')
                  text = text.replace(anchor, anchor + addition)
          workflow.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          entry = (
              '- Stable pseudo-measurement, robust-mixture, and binary-calibration '
              'inputs now\n'
              '  reject nonnumeric, non-finite, and out-of-domain measurements, '
              'cues, labels,\n'
              '  and probabilities instead of clipping or truth-value coercing '
              'them.\n'
              '  Reliability and likelihood results also defensively own immutable '
              'arrays.\n'
          )
          if entry not in text:
              anchor = '### Changed\n\n'
              if text.count(anchor) != 1:
                  raise SystemExit('unexpected changelog Changed heading')
              text = text.replace(anchor, anchor + entry, 1)
          changelog.write_text(text, encoding='utf-8')
          PY

          rm -f "$payload" .github/workflows/finalize-fail-closed-contracts.yml
          rmdir .github/patches 2>/dev/null || true
          test ! -e "$payload"
          test ! -e .github/workflows/finalize-fail-closed-contracts.yml
          git diff --check

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Validate changed contracts
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/bayesian_phystwin/calibration.py
            src/bayesian_phystwin/pseudo_measurements.py
            src/bayesian_phystwin/robust_likelihood.py
            tests/test_calibration.py
            tests/test_pseudo_measurements.py
            tests/test_robust_likelihood.py
          )
          python -m ruff check --fix -- "${files[@]}"
          python -m ruff format -- "${files[@]}"
          python -m ruff check -- "${files[@]}"
          python -m ruff format --check -- "${files[@]}"
          python -m mypy \
            src/bayesian_phystwin/calibration.py \
            src/bayesian_phystwin/pseudo_measurements.py \
            src/bayesian_phystwin/robust_likelihood.py
          python -m pytest -q -W error \
            tests/test_calibration.py \
            tests/test_pseudo_measurements.py \
            tests/test_robust_likelihood.py
          python -m compileall -q \
            src/bayesian_phystwin/calibration.py \
            src/bayesian_phystwin/pseudo_measurements.py \
            src/bayesian_phystwin/robust_likelihood.py
          git diff --check

      - name: Publish ordinary source commit
        shell: bash
        env:
          BRANCH: agent/fail-closed-probability-cue-contracts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit --no-verify -m 'Fail closed on malformed probability and cue inputs'
          git push origin "HEAD:${BRANCH}"
