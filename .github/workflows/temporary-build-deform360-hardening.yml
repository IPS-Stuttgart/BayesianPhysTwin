name: One-shot build Deform360 hardening

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/temporary-build-deform360-hardening.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-build-deform360-hardening
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 45
    steps:
      - name: Check out the clean hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/deform360-provenance-cadence-hardening-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Import the exact completed experiment source and patch payload
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin agent/deform360-normalized-evidence-external-v1
          source_revision=d7d5e37c4f6059a57e5e7594ac2fafc02e1eda16
          for path in \
            .github/workflows/deform360-normalized-evidence-external.yml \
            docs/deform360_normalized_evidence_external_v1.md \
            protocols/deform360_normalized_evidence_external_v1.json \
            scripts/science/run_deform360_normalized_evidence_external.py \
            tests/test_deform360_normalized_evidence_external.py
          do
            mkdir -p "$(dirname "${path}")"
            git show "${source_revision}:${path}" > "${path}"
          done
          git show \
            origin/agent/deform360-normalized-evidence-external-v1:tools/pr120_hardening_payload_00.txt \
            > /tmp/pr120_hardening_payload_00.txt
          git show \
            origin/agent/deform360-normalized-evidence-external-v1:tools/pr120_hardening_payload_01.txt \
            > /tmp/pr120_hardening_payload_01.txt

      - name: Reconstruct and apply the content-addressed hardening patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import zlib
          from pathlib import Path

          fragments = (
              (
                  Path("/tmp/pr120_hardening_payload_00.txt"),
                  "1e52f9beab41ed40b5f4458e5d2c438ae1a2a9302167d6a3314b4686b4285263",
              ),
              (
                  Path("/tmp/pr120_hardening_payload_01.txt"),
                  "9dd96ca534bdd811814b72c736fa0e1092f446f6f0701888131e1ef26a40bfef",
              ),
          )
          encoded = []
          for path, expected in fragments:
              raw = path.read_bytes()
              actual = hashlib.sha256(raw).hexdigest()
              if actual != expected:
                  raise SystemExit(
                      f"fragment digest mismatch for {path}: {actual} != {expected}"
                  )
              encoded.append(raw.decode("ascii").strip())
          patch = zlib.decompress(base64.b85decode("".join(encoded)))
          expected_patch = (
              "84740cb685c5db27f09f142ced0140df45ff28d40638ffdaedb862d4cea0be07"
          )
          actual_patch = hashlib.sha256(patch).hexdigest()
          if actual_patch != expected_patch:
              raise SystemExit(
                  f"patch digest mismatch: {actual_patch} != {expected_patch}"
              )
          destination = Path("/tmp/harden_pr120.py")
          destination.write_bytes(patch)
          print(f"reconstructed {destination}: {actual_patch}")
          PY
          python - <<'PY'
          import hashlib
          from pathlib import Path

          path = Path("/tmp/harden_pr120.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          label = '        label="result structure identity",'
          try:
              label_index = lines.index(label)
          except ValueError as error:
              raise SystemExit("result-identity patch label is missing") from error
          selection_needle = (
              '        \'\'\'        "selection_sha256": '
              'seal["selection_sha256"],'
          )
          selection_matches = [
              index
              for index in range(max(0, label_index - 20), label_index)
              if lines[index] == selection_needle
          ]
          if len(selection_matches) != 2:
              raise SystemExit(
                  "generator amendment expected two selection lines, "
                  f"found {len(selection_matches)}"
              )
          protocol_triple = (
              '        \'\'\'        "protocol_file_sha256": '
              'seal["protocol_file_sha256"],'
          )
          selection_plain = (
              '        "selection_sha256": seal["selection_sha256"],'
          )
          for index in reversed(selection_matches):
              lines[index] = protocol_triple
              lines.insert(index + 1, selection_plain)

          label_index = lines.index(label)
          protocol_matches = [
              index
              for index in range(max(0, label_index - 30), label_index)
              if lines[index] == protocol_triple
          ]
          if len(protocol_matches) != 2:
              raise SystemExit(
                  "generator amendment expected two protocol lines, "
                  f"found {len(protocol_matches)}"
              )
          schema_line = '        \'\'\'        "schema": RESULT_SCHEMA,'
          schema_version_line = '        "schema_version": 1,'
          protocol_id_line = (
              '        "protocol_id": protocol["protocol_id"],'
          )
          protocol_plain = (
              '        "protocol_file_sha256": '
              'seal["protocol_file_sha256"],'
          )
          for index in reversed(protocol_matches):
              lines[index] = schema_line
              lines.insert(index + 1, schema_version_line)
              lines.insert(index + 2, protocol_id_line)
              lines.insert(index + 3, protocol_plain)

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          actual = hashlib.sha256(path.read_bytes()).hexdigest()
          expected = "4c445c717d45d04879df3a4c303f44202a56faaaa17fdb920fcd6ca1f3fd0aef"
          if actual != expected:
              raise SystemExit(f"amended generator digest mismatch: {actual} != {expected}")
          print(f"amended {path}: {actual}")
          PY
          PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/pycache" \
            python -m py_compile /tmp/harden_pr120.py
          python /tmp/harden_pr120.py

      - name: Install the focused development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,graph]"
          python -m pip check

      - name: Format, lint, and test the hardened experiment
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format \
            scripts/science/run_deform360_normalized_evidence_external.py \
            tests/test_deform360_normalized_evidence_external.py
          python -m ruff check \
            scripts/science/run_deform360_normalized_evidence_external.py \
            tests/test_deform360_normalized_evidence_external.py
          python -m pytest -q \
            tests/test_deform360_normalized_evidence_external.py \
            tests/test_endpoint_model_average.py
          PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/pycache" \
            python -m py_compile \
              scripts/science/run_deform360_normalized_evidence_external.py

      - name: Remove the one-shot transport
        run: rm -f .github/workflows/temporary-build-deform360-hardening.yml

      - name: Commit the ordinary reviewable source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden Deform360 provenance and cadence contracts"
          git push origin HEAD:agent/deform360-provenance-cadence-hardening-v1
