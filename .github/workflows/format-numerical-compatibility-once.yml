name: Format numerical compatibility once

on:
  push:
    branches:
      - agent/numerical-compatibility-profile-v1-current

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply authoritative formatting and focused validation
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m ruff format \
            src/bayesian_phystwin/numerical_compatibility_v1.py \
            tests/test_runtime_provenance_numerical_compatibility_v1.py
          python -m ruff check \
            src/bayesian_phystwin/numerical_compatibility_v1.py \
            tests/test_runtime_provenance_numerical_compatibility_v1.py
          python -m mypy src/bayesian_phystwin/numerical_compatibility_v1.py
          python -m pytest -q \
            tests/test_runtime_provenance_numerical_compatibility_v1.py \
            tests/test_runtime_provenance_numerical_environment_v1.py
          git diff --check

      - name: Publish the clean head
        run: |
          set -euo pipefail
          rm .github/workflows/format-numerical-compatibility-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Apply authoritative numerical compatibility formatting'
          git push origin "HEAD:${GITHUB_REF_NAME}"
