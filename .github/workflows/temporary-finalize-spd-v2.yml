name: Temporary finalize prospective SPD v2

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temporary-finalize-spd-v2.yml"
      - "scripts/ci/temporary_patch_spd_v2.py"

permissions:
  contents: write

concurrency:
  group: temporary-finalize-spd-v2-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 60
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Apply deterministic reviewed patch
        run: python3 scripts/ci/temporary_patch_spd_v2.py

      - name: Create isolated validation environment
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/bpt-spd-v2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "${root}"
          python3 -m venv "${root}"
          echo "${root}/bin" >> "${GITHUB_PATH}"
          echo "VALIDATION_ROOT=${root}" >> "${GITHUB_ENV}"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade "pip==25.2" "setuptools==80.9.0" "wheel==0.45.1"
          python -m pip install ".[dev]" "coverage==7.13.3"
          python -m pip check

      - name: Canonically format and validate source
        run: |
          python -m ruff format \
            src/bayesian_phystwin/spd_system.py \
            src/bayesian_phystwin/bias_aware_belief_v2.py \
            tests/test_spd_system.py \
            tests/test_spd_system_adversarial.py \
            tests/test_bias_aware_belief_v2.py \
            tests/test_bias_aware_belief_v2_adversarial.py \
            tests/test_bias_aware_belief_v2_amendment.py \
            tests/test_calibration.py
          python -m ruff check \
            src/bayesian_phystwin/spd_system.py \
            src/bayesian_phystwin/bias_aware_belief_v2.py \
            tests/test_spd_system.py \
            tests/test_spd_system_adversarial.py \
            tests/test_bias_aware_belief_v2.py \
            tests/test_bias_aware_belief_v2_adversarial.py \
            tests/test_bias_aware_belief_v2_amendment.py \
            tests/test_calibration.py
          python -m ruff format --check \
            src/bayesian_phystwin/spd_system.py \
            src/bayesian_phystwin/bias_aware_belief_v2.py \
            tests/test_spd_system.py \
            tests/test_spd_system_adversarial.py \
            tests/test_bias_aware_belief_v2.py \
            tests/test_bias_aware_belief_v2_adversarial.py \
            tests/test_bias_aware_belief_v2_amendment.py \
            tests/test_calibration.py
          python -m mypy \
            src/bayesian_phystwin/spd_system.py \
            src/bayesian_phystwin/bias_aware_belief_v2.py
          python -m compileall -q src tests
          git diff --check

      - name: Run focused and stable-lane coverage contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -p no:cacheprovider \
            tests/test_spd_system.py \
            tests/test_spd_system_adversarial.py \
            tests/test_bias_aware_belief_v2.py \
            tests/test_bias_aware_belief_v2_adversarial.py \
            tests/test_bias_aware_belief_v2_amendment.py
          python -m coverage erase
          python -m coverage run --branch --source=bayesian_phystwin \
            -m pytest -q -p no:cacheprovider tests/test_calibration.py
          python -m coverage json -o "${VALIDATION_ROOT}/coverage.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path(os.environ["VALIDATION_ROOT"], "coverage.json").read_text()
          )
          required = (
              "src/bayesian_phystwin/spd_system.py",
              "src/bayesian_phystwin/bias_aware_belief_v2.py",
          )
          for path in required:
              summary = report["files"][path]["summary"]
              if summary["missing_lines"] or summary["missing_branches"]:
                  raise SystemExit(f"incomplete branch coverage for {path}: {summary}")
          PY

      - name: Commit only permanent product changes
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test "$(git ls-remote origin "refs/heads/${HEAD_BRANCH}" | cut -f1)" = "${SOURCE_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            CHANGELOG.md \
            src/bayesian_phystwin/spd_system.py \
            src/bayesian_phystwin/bias_aware_belief_v2.py \
            tests/test_spd_system.py \
            tests/test_spd_system_adversarial.py \
            tests/test_bias_aware_belief_v2.py \
            tests/test_bias_aware_belief_v2_adversarial.py \
            tests/test_bias_aware_belief_v2_amendment.py \
            tests/test_calibration.py
          git diff --cached --check
          git commit -m "Finalize prospective SPD bias-aware belief v2"
          git push origin "HEAD:${HEAD_BRANCH}"

      - name: Remove isolated validation environment
        if: always()
        shell: bash
        run: rm -rf -- "${VALIDATION_ROOT:-/nonexistent}"
