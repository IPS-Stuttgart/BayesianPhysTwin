name: One-shot exact Ruff source commit

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  ruff:
    name: Commit exact Ruff-corrected source
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the repository test environment and exact Ruff
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "ruff==0.16.2"
          python -m ruff --version

      - name: Apply and verify the exact source checks
        shell: bash
        run: |
          files=(
            src/bayesian_phystwin/numerical_environment_v1.py
            tests/test_runtime_provenance_numerical_environment_v1_1.py
            tests/test_runtime_provenance_numerical_environment_v1_2.py
            tests/test_runtime_provenance_numerical_environment_v1_3.py
            tests/test_runtime_provenance_numerical_environment_v1_4.py
            tests/test_runtime_provenance_numerical_environment_v1_5.py
          )
          python -m ruff check --fix "${files[@]}"
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          pytest -q tests/test_runtime_provenance_numerical_environment_v1_*.py
          python -m py_compile "${files[@]}"

      - name: Commit the verified source and remove this workflow
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git rm .github/workflows/one-shot-ruff-numerical-environment.yml
          git add \
            src/bayesian_phystwin/numerical_environment_v1.py \
            tests/test_runtime_provenance_numerical_environment_v1_1.py \
            tests/test_runtime_provenance_numerical_environment_v1_2.py \
            tests/test_runtime_provenance_numerical_environment_v1_3.py \
            tests/test_runtime_provenance_numerical_environment_v1_4.py \
            tests/test_runtime_provenance_numerical_environment_v1_5.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply exact Ruff 0.16.2 source fixes"
          git push origin "HEAD:${HEAD_BRANCH}"
