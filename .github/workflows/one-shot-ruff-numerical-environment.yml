name: One-shot exact Ruff source artifact

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/numerical-environment-profile-v1

permissions:
  contents: read

jobs:
  ruff:
    name: Generate exact Ruff-corrected source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the repository source-check environment
        run: |
          python -m pip install -e ".[dev]"
          python -m ruff --version | tee ruff-version.txt

      - name: Apply Ruff lint fixes and formatting
        shell: bash
        run: |
          set +e
          files=(
            src/bayesian_phystwin/numerical_environment_v1.py
            tests/test_runtime_provenance_numerical_environment_v1_1.py
            tests/test_runtime_provenance_numerical_environment_v1_2.py
            tests/test_runtime_provenance_numerical_environment_v1_3.py
            tests/test_runtime_provenance_numerical_environment_v1_4.py
            tests/test_runtime_provenance_numerical_environment_v1_5.py
          )
          python -m ruff check --fix --output-format=concise "${files[@]}" \
            > ruff-fix.log 2>&1
          fix_status=$?
          python -m ruff format "${files[@]}" > ruff-format.log 2>&1
          format_status=$?
          python -m ruff check --output-format=concise "${files[@]}" \
            > ruff-check-after.log 2>&1
          check_status=$?
          python -m ruff format --check --diff "${files[@]}" \
            > ruff-format-after.log 2>&1
          format_check_status=$?
          {
            echo "fix_status=${fix_status}"
            echo "format_status=${format_status}"
            echo "check_status=${check_status}"
            echo "format_check_status=${format_check_status}"
          } | tee ruff-status.txt

      - name: Upload exact corrected files and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: exact-ruff-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            src/bayesian_phystwin/numerical_environment_v1.py
            tests/test_runtime_provenance_numerical_environment_v1_1.py
            tests/test_runtime_provenance_numerical_environment_v1_2.py
            tests/test_runtime_provenance_numerical_environment_v1_3.py
            tests/test_runtime_provenance_numerical_environment_v1_4.py
            tests/test_runtime_provenance_numerical_environment_v1_5.py
            ruff-version.txt
            ruff-fix.log
            ruff-format.log
            ruff-check-after.log
            ruff-format-after.log
            ruff-status.txt
          if-no-files-found: error
          retention-days: 1
