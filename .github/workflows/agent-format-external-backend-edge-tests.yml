name: Format external backend edge tests

on:
  push:
    branches:
      - agent/external-physics-backends

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install formatter
        run: python -m pip install "ruff>=0.6"
      - name: Apply repository formatting
        run: >-
          python -m ruff format
          tests/test_portable_contracts_external_physics_edge_cases.py
      - name: Commit formatted file
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_portable_contracts_external_physics_edge_cases.py
          if git diff --cached --quiet; then
            echo "File is already formatted."
            exit 0
          fi
          git commit -m "Format external backend edge tests"
          git push origin "HEAD:${GITHUB_REF_NAME}"
