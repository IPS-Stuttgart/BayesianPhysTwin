name: Agent fix PR 160 formatting

on:
  push:
    branches:
      - agent/deform360-calibration-payload-materialization
    paths:
      - .github/workflows/agent-fix-pr160-format.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/deform360-calibration-payload-materialization
          fetch-depth: 0
          persist-credentials: true
          clean: true
      - name: Format the exact failing files
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'ruff==0.16.1'
          files=(
            src/bayesian_phystwin/deform360_calibration_payload_plan.py
            src/bayesian_phystwin/deform360_calibration_payload_runtime.py
            tests/test_deform360_calibration_payload_materialization.py
          )
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          git diff --check
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${files[@]}"
          git commit -m 'Format Deform360 materialization source'
          git push origin HEAD:agent/deform360-calibration-payload-materialization
