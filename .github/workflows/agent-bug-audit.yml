name: Agent significant-bug audit

on:
  push:
    branches:
      - agent/audit-significant-bugs-20260809
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-significant-bug-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Python ${{ matrix.python-version }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip check
      - name: Compile source and scripts
        run: python -m compileall -q src scripts tools
      - name: Lint
        run: python -m ruff check src tests scripts tools
      - name: Formatting
        run: python -m ruff format --check src tests scripts tools
      - name: Full unit and integration test suite
        env:
          PYTHONHASHSEED: "937451"
        run: python -m pytest -q --disable-warnings --maxfail=20

  deep-audit:
    name: Deep package audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install all non-PyRecEst extras and audit tools
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e '.[dev,data,graph,vision]'
          python -m pip install hypothesis pytest-timeout pip-audit
          python -m pip check
      - name: Type check
        run: python -m mypy src/bayesian_phystwin
      - name: Run tests in importlib mode
        env:
          PYTHONHASHSEED: "271828"
        run: python -m pytest -q --import-mode=importlib --disable-warnings --maxfail=20
      - name: Build and inspect distributions
        run: |
          python -m build
          python - <<'PY'
          import pathlib
          import tarfile
          import zipfile

          dist = pathlib.Path('dist')
          wheels = list(dist.glob('*.whl'))
          sdists = list(dist.glob('*.tar.gz'))
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists
          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              assert any(name.endswith('bayesian_phystwin/__init__.py') for name in names)
              assert any(name.endswith('bayesian_phystwin/py.typed') for name in names)
          with tarfile.open(sdists[0], 'r:gz') as archive:
              names = archive.getnames()
              assert any(name.endswith('/pyproject.toml') for name in names)
              assert any(name.endswith('/tests/test_source_competence_simulation_based_calibration.py') for name in names)
          PY
      - name: Audit declared dependencies
        run: python -m pip_audit --strict
      - name: Package exact audited checkout
        if: always()
        run: |
          git status --short > agent-audit-git-status.txt
          git rev-parse HEAD > agent-audit-head.txt
          tar --exclude=.git --exclude=dist --exclude='*.egg-info' -czf agent-audited-checkout.tar.gz .
      - name: Upload audited checkout
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-audited-checkout
          path: |
            agent-audited-checkout.tar.gz
            agent-audit-git-status.txt
            agent-audit-head.txt
          if-no-files-found: error
          retention-days: 3
