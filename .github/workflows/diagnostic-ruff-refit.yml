name: Diagnostic Ruff refit diff

on:
  push:
    branches:
      - agent/fail-closed-phystwin-refit-inputs

permissions:
  contents: read

jobs:
  ruff-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install exact Ruff
        run: python -m pip install "ruff==0.16.2"
      - name: Print Ruff fixes without modifying the branch
        run: |
          python -m ruff check --fix --diff -- \
            src/bayesian_phystwin/phystwin_refit.py \
            src/bayesian_phystwin/phystwin_prior_evaluation.py \
            tests/test_phystwin_refit_input_contracts.py
          python -m ruff format --diff -- \
            src/bayesian_phystwin/phystwin_refit.py \
            src/bayesian_phystwin/phystwin_prior_evaluation.py \
            tests/test_phystwin_refit_input_contracts.py
