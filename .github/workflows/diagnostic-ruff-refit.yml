name: Apply Ruff refit fixes

on:
  push:
    branches:
      - agent/fail-closed-phystwin-refit-inputs

permissions:
  contents: write

jobs:
  ruff-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/fail-closed-phystwin-refit-inputs
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install exact Ruff
        run: python -m pip install "ruff==0.16.2"
      - name: Apply exact Ruff fixes
        run: |
          python -m ruff check --fix -- \
            src/bayesian_phystwin/phystwin_refit.py \
            src/bayesian_phystwin/phystwin_prior_evaluation.py \
            tests/test_phystwin_refit_input_contracts.py
          python -m ruff format -- \
            src/bayesian_phystwin/phystwin_refit.py \
            src/bayesian_phystwin/phystwin_prior_evaluation.py \
            tests/test_phystwin_refit_input_contracts.py
          rm .github/workflows/diagnostic-ruff-refit.yml
      - name: Commit fixes and remove diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayesian_phystwin/phystwin_refit.py \
            src/bayesian_phystwin/phystwin_prior_evaluation.py \
            tests/test_phystwin_refit_input_contracts.py \
            .github/workflows/diagnostic-ruff-refit.yml
          git commit -m "Apply Ruff fixes to refit hardening"
          git push origin HEAD:agent/fail-closed-phystwin-refit-inputs
