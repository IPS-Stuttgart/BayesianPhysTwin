# workflow-lifecycle: temporary
# workflow-owner: IPS-Stuttgart maintainers
name: Cancel redundant DLO45 run 33414972339

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cancel-redundant-dlo45-run-33414972339.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel superseded queued DLO45 workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: "33414972339"
        shell: bash
        run: |
          set -euo pipefail
          state="$(curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID")"
          status="$(python -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$state")"
          conclusion="$(python -c 'import json,sys; print(json.load(sys.stdin).get("conclusion"))' <<<"$state")"
          echo "run=$TARGET_RUN_ID status=$status conclusion=$conclusion"
          if [[ "$status" == "completed" ]]; then
            echo "Run is already terminal; nothing to cancel."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID/cancel"
          echo "Cancellation requested for superseded run $TARGET_RUN_ID."
