name: Temporary formatter for PR 120

on:
  push:
    branches:
      - agent/deform360-normalized-evidence-external-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/deform360-normalized-evidence-external-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Format exact PR files
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'ruff>=0.6'
          python -m ruff format \
            scripts/science/run_deform360_normalized_evidence_external.py \
            tests/test_deform360_normalized_evidence_external.py
          python -m ruff check \
            scripts/science/run_deform360_normalized_evidence_external.py \
            tests/test_deform360_normalized_evidence_external.py

      - name: Commit formatter-only changes
        shell: bash
        run: |
          set -euo pipefail
          git add \
            scripts/science/run_deform360_normalized_evidence_external.py \
            tests/test_deform360_normalized_evidence_external.py
          if git diff --cached --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Format external Deform360 evaluator'
          git push origin HEAD:agent/deform360-normalized-evidence-external-v1
