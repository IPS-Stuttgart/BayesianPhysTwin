# workflow-lifecycle: permanent
# workflow-owner: IPS-Stuttgart maintainers
name: Active decision-identifying probes

on:
  push:
    paths:
      - "src/bayesian_phystwin/active_decision_probe_v1.py"
      - "src/bayesian_phystwin/outcome_certified_decision_probe_v1.py"
      - "tests/test_active_decision_probe_v1.py"
      - "tests/test_outcome_certified_decision_probe_v1.py"
      - "docs/active_decision_probe_v1.md"
      - "experiments/active_decision_probe_v1/**"
      - ".github/workflows/active-decision-probe-v1.yml"
  pull_request:
    paths:
      - "src/bayesian_phystwin/active_decision_probe_v1.py"
      - "src/bayesian_phystwin/outcome_certified_decision_probe_v1.py"
      - "tests/test_active_decision_probe_v1.py"
      - "tests/test_outcome_certified_decision_probe_v1.py"
      - "docs/active_decision_probe_v1.md"
      - "experiments/active_decision_probe_v1/**"
      - ".github/workflows/active-decision-probe-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: active-decision-probe-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install and verify
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1"
          python -m pip install -e ".[dev]"
          python -m pip check

          files=(
            src/bayesian_phystwin/active_decision_probe_v1.py
            src/bayesian_phystwin/outcome_certified_decision_probe_v1.py
            tests/test_active_decision_probe_v1.py
            tests/test_outcome_certified_decision_probe_v1.py
            experiments/active_decision_probe_v1/run_controlled.py
          )
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy \
            src/bayesian_phystwin/active_decision_probe_v1.py \
            src/bayesian_phystwin/outcome_certified_decision_probe_v1.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_active_decision_probe_v1.py \
            tests/test_outcome_certified_decision_probe_v1.py \
            tests/test_query_quotient_belief_v1.py
          python -m experiments.active_decision_probe_v1.run_controlled \
            --check \
            experiments/active_decision_probe_v1/controlled_result.json

          git diff --exit-code
          test -z "$(git status --porcelain=v1)"
