name: PR 20 repair

on:
  push:
    branches: ["agent/selective-risk-evaluation"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/selective-risk-evaluation
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Apply focused repair and remove diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("src/bayesian_phystwin/selective_risk.py")
          text = source.read_text(encoding="utf-8")
          replacements = (
              (
                  "    array = np.asarray(values, dtype=float)\n",
                  "    array: np.ndarray = np.asarray(values, dtype=float)\n",
              ),
              (
                  "    result = np.asarray(array, dtype=bool).copy()\n",
                  "    result: np.ndarray = np.asarray(array, dtype=bool).copy()\n",
              ),
              (
                  "    replicate_values = {name: np.empty(repeats, dtype=float) for name in metric_names}\n",
                  "    replicate_values: dict[str, np.ndarray] = {\n"
                  "        name: np.empty(repeats, dtype=float) for name in metric_names\n"
                  "    }\n",
              ),
          )
          for old, new in replacements:
              count = text.count(old)
              if count == 1:
                  text = text.replace(old, new)
              elif new not in text:
                  raise RuntimeError(f"Expected exactly one repair target, found {count}: {old!r}")
          source.write_text(text, encoding="utf-8")

          for path in (
              Path(".github/workflows/pr20-format-diagnostic.yml"),
              Path(".github/workflows/pr20-mypy-diagnostic.yml"),
          ):
              path.unlink(missing_ok=True)

          matrix_expression = "${" + "{ matrix.python-version }}"
          workflow = f'''name: Selective guard risk

          on:
            push:
              branches: [main]
              paths:
                - "src/bayesian_phystwin/selective_risk.py"
                - "tests/test_selective_risk.py"
                - "docs/selective_guard_evaluation.md"
                - ".github/workflows/selective-risk.yml"
            pull_request:
              branches: [main]
              paths:
                - "src/bayesian_phystwin/selective_risk.py"
                - "tests/test_selective_risk.py"
                - "docs/selective_guard_evaluation.md"
                - ".github/workflows/selective-risk.yml"
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            quality:
              name: Selective-risk quality
              runs-on: ubuntu-latest
              timeout-minutes: 15
              steps:
                - uses: actions/checkout@v7
                - uses: actions/setup-python@v6
                  with:
                    python-version: "3.12"
                    cache: pip
                    cache-dependency-path: pyproject.toml
                - name: Install development tools
                  run: python -m pip install -e ".[dev]"
                - name: Run Ruff
                  run: >-
                    python -m ruff check
                    src/bayesian_phystwin/selective_risk.py
                    tests/test_selective_risk.py
                - name: Check formatting
                  run: >-
                    python -m ruff format --check
                    src/bayesian_phystwin/selective_risk.py
                    tests/test_selective_risk.py
                - name: Type-check selective-risk contracts
                  run: >-
                    python -m mypy --python-version 3.12
                    src/bayesian_phystwin/selective_risk.py

            test:
              name: Selective-risk tests / Python {matrix_expression}
              runs-on: ubuntu-latest
              timeout-minutes: 15
              strategy:
                fail-fast: false
                matrix:
                  python-version: ["3.10", "3.12", "3.14"]
              steps:
                - uses: actions/checkout@v7
                - uses: actions/setup-python@v6
                  with:
                    python-version: {matrix_expression}
                    cache: pip
                    cache-dependency-path: pyproject.toml
                - name: Install NumPy-only package and tests
                  run: python -m pip install -e ".[dev]"
                - name: Run selective-risk tests
                  run: python -m pytest -q tests/test_selective_risk.py
          '''
          workflow = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in workflow.splitlines()
          ) + "\n"
          Path(".github/workflows/selective-risk.yml").write_text(
              workflow,
              encoding="utf-8",
          )
          PY
      - name: Format and validate focused files
        run: |
          python -m ruff format \
            src/bayesian_phystwin/selective_risk.py \
            tests/test_selective_risk.py
          python -m ruff check \
            src/bayesian_phystwin/selective_risk.py \
            tests/test_selective_risk.py
          python -m ruff format --check \
            src/bayesian_phystwin/selective_risk.py \
            tests/test_selective_risk.py
          python -m mypy --python-version 3.12 \
            src/bayesian_phystwin/selective_risk.py
          python -m pytest -q tests/test_selective_risk.py
      - name: Run repository test suite
        run: python -m pytest -q
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repair changes required"
            exit 0
          fi
          git commit -m "Fix selective-risk checks and remove diagnostics"
          git push origin HEAD:agent/selective-risk-evaluation
