name: PR 20 repair

on:
  push:
    branches: ["agent/selective-risk-evaluation"]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pr20-focused-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/selective-risk-evaluation
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Apply focused type repair and remove temporary workflows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("src/bayesian_phystwin/selective_risk.py")
          text = source.read_text(encoding="utf-8")
          replacements = (
              (
                  "    array = np.asarray(values, dtype=float)\n",
                  "    array: np.ndarray = np.asarray(values, dtype=float)\n",
              ),
              (
                  "    result = np.asarray(array, dtype=bool).copy()\n",
                  "    result: np.ndarray = np.asarray(array, dtype=bool).copy()\n",
              ),
              (
                  "    replicate_values = {name: np.empty(repeats, dtype=float) for name in metric_names}\n",
                  "    replicate_values: dict[str, np.ndarray] = {\n"
                  "        name: np.empty(repeats, dtype=float) for name in metric_names\n"
                  "    }\n",
              ),
          )
          for old, new in replacements:
              count = text.count(old)
              if count == 1:
                  text = text.replace(old, new)
              elif new not in text:
                  raise RuntimeError(
                      f"Expected exactly one repair target, found {count}: {old!r}"
                  )
          source.write_text(text, encoding="utf-8")

          for path in (
              Path(".github/workflows/pr20-format-diagnostic.yml"),
              Path(".github/workflows/pr20-mypy-diagnostic.yml"),
              Path(".github/workflows/pr20-repair.yml"),
          ):
              path.unlink(missing_ok=True)
          PY
      - name: Format and validate focused files
        run: |
          python -m ruff format \
            src/bayesian_phystwin/selective_risk.py \
            tests/test_selective_risk.py
          python -m ruff check \
            src/bayesian_phystwin/selective_risk.py \
            tests/test_selective_risk.py
          python -m ruff format --check \
            src/bayesian_phystwin/selective_risk.py \
            tests/test_selective_risk.py
          python -m mypy --python-version 3.12 \
            src/bayesian_phystwin/selective_risk.py
          python -m pytest -q tests/test_selective_risk.py
      - name: Commit focused repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repair changes required"
            exit 0
          fi
          git commit -m "Fix selective-risk type checks and remove repair workflow"
          git push origin HEAD:agent/selective-risk-evaluation
