# workflow-lifecycle: temporary
# workflow-owner: IPS-Stuttgart maintainers
name: Align self-collision dataset contract once

on:
  push:
    branches:
      - science/tracking-cloth-self-collision-selective-twin-v1
    paths:
      - ".github/workflows/align-self-collision-dataset-contract-once.yml"

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: science/tracking-cloth-self-collision-selective-twin-v1
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Align filenames, static rod, and synthetic fixtures; then self-remove
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          data = Path(
              "experiments/tracking_cloth_self_collision_selective_twin_v1/data.py"
          )
          text = data.read_text()
          old = '''SELF_NAME = re.compile(
              r"^(cotton|denim|polyester|wool)_a2_"
              r"(four_corners_normal|four_corners_parallel|two_corners_normal)_"
              r"rep([123])\\.csv$",
              re.IGNORECASE,
          )'''
          new = '''SELF_NAME = re.compile(
              r"^(cotton|denim|polyester|wool)_a2_"
              r"(four|two)(?:_corners)?_(normal|parallel)_"
              r"rep([123])\\.csv$",
              re.IGNORECASE,
          )'''
          if old not in text:
              raise SystemExit("filename-regex source block changed")
          text = text.replace(old, new)
          old = '''            material, interaction, repetition = match.groups()
                      cases.append(
                          Case(
                              path=path,
                              material=material.lower(),
                              interaction=interaction.lower(),
                              repetition=int(repetition),
                          )
                      )'''
          new = '''            material, number, position, repetition = match.groups()
                      interaction = f"{number.lower()}_corners_{position.lower()}"
                      cases.append(
                          Case(
                              path=path,
                              material=material.lower(),
                              interaction=interaction,
                              repetition=int(repetition),
                          )
                      )'''
          if old not in text:
              raise SystemExit("filename mapping source block changed")
          data.write_text(text.replace(old, new))

          model = Path(
              "experiments/tracking_cloth_self_collision_selective_twin_v1/model.py"
          )
          text = model.read_text()
          start = text.index("def rod_forecast(")
          end = text.index("\ndef _closest_on_segments", start)
          replacement = '''def rod_forecast(inputs: InputView, protocol: dict[str, Any]) -> np.ndarray:
              """Hold the recorded static rod pose fixed after the causal prefix.

              The dataset's self-collision protocol uses a static metallic rod.  A
              robust prefix median suppresses sub-millimetre marker jitter without
              accessing any future rod coordinate.
              """

              del protocol
              rod = inputs.rod_prefix.copy()
              reference = np.median(rod, axis=0)
              output = np.empty((len(inputs.times), 2, 3), dtype=float)
              output[: inputs.cutoff + 1] = rod
              output[inputs.cutoff + 1 :] = reference
              return output

          '''
          model.write_text(text[:start] + replacement + text[end + 1 :])

          test = Path("tests/test_tracking_cloth_self_collision_selective_twin_v1.py")
          text = test.read_text()
          text = text.replace(
              "positions = np.concatenate([cloth, rod], axis=0)",
              "positions = np.concatenate([rod, cloth], axis=0)",
          )
          text = text.replace(
              '"cotton_a2_four_corners_normal_rep3.csv"',
              '"cotton_A2_four_normal_rep3.csv"',
          )
          text = text.replace(
              '"cotton_a2_four_corners_normal_rep1.csv"',
              '"cotton_A2_four_normal_rep1.csv"',
          )
          test.write_text(text)
          PY
          python -m pip install ruff==0.16.5
          python -m ruff format \
            experiments/tracking_cloth_self_collision_selective_twin_v1/data.py \
            experiments/tracking_cloth_self_collision_selective_twin_v1/model.py \
            tests/test_tracking_cloth_self_collision_selective_twin_v1.py
          python -m ruff check \
            experiments/tracking_cloth_self_collision_selective_twin_v1/data.py \
            experiments/tracking_cloth_self_collision_selective_twin_v1/model.py \
            tests/test_tracking_cloth_self_collision_selective_twin_v1.py
          rm .github/workflows/align-self-collision-dataset-contract-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            experiments/tracking_cloth_self_collision_selective_twin_v1/data.py \
            experiments/tracking_cloth_self_collision_selective_twin_v1/model.py \
            tests/test_tracking_cloth_self_collision_selective_twin_v1.py \
            .github/workflows/align-self-collision-dataset-contract-once.yml
          git commit -m "Align self-collision experiment with publisher data contract"
          git push origin HEAD:science/tracking-cloth-self-collision-selective-twin-v1
