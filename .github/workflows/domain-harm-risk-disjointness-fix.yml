name: Temporary domain harm-risk disjointness repair

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/domain-harm-risk-disjointness-fix.yml
      - src/bayesian_phystwin/guard_harm_risk_domains.py
      - tests/test_guard_harm_risk_domains.py

permissions:
  contents: write
  pull-requests: read

jobs:
  repair-and-remove:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Enforce all declared evidence boundaries and remove this workflow
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          module = Path("src/bayesian_phystwin/guard_harm_risk_domains.py")
          text = module.read_text(encoding="utf-8")

          marker = (
              '            if certificate.metric != guard.metric:\n'
              '                raise ValueError("domain harm certificate metric changed")\n'
          )
          replacement = marker + (
              '            if (\n'
              '                certificate.certification_partition_id\n'
              '                == guard.calibration_partition_id\n'
              '            ):\n'
              '                raise ValueError(\n'
              '                    "calibration and certification partitions must be distinct"\n'
              '                )\n'
          )
          if text.count(marker) != 1:
              raise SystemExit("metric boundary marker was not found exactly once")
          text = text.replace(marker, replacement)

          marker = (
              '                    "threshold_source_artifact_id",\n'
              '                    "certification_partition_id",\n'
          )
          replacement = marker + '                    "threshold_selection_group_ids",\n'
          if text.count(marker) != 1:
              raise SystemExit("shared-field marker was not found exactly once")
          text = text.replace(marker, replacement)

          marker = (
              "        threshold_overlap = "
              "threshold_selection_groups & certification_groups\n"
          )
          replacement = (
              "        calibration_threshold_overlap = (\n"
              "            calibration_groups & threshold_selection_groups\n"
              "        )\n"
              "        if calibration_threshold_overlap:\n"
              "            raise ValueError(\n"
              "                \"calibration and threshold-selection groups must be globally \"\n"
              "                f\"disjoint: {sorted(calibration_threshold_overlap)}\"\n"
              "            )\n"
          ) + marker
          if text.count(marker) != 1:
              raise SystemExit("threshold-overlap marker was not found exactly once")
          module.write_text(text.replace(marker, replacement), encoding="utf-8")

          tests = Path("tests/test_guard_harm_risk_domains.py")
          text = tests.read_text(encoding="utf-8")
          test_name = "test_composite_rejects_all_cross_pool_reuse"
          if f"def {test_name}" in text:
              raise SystemExit("cross-pool test already exists")
          addition = dedent(
              '''

              def test_composite_rejects_all_cross_pool_reuse() -> None:
                  certificate = _certificate()
                  certificates = dict(certificate.domain_certificates)
                  for domain in certificate.supported_domains:
                      certificates[domain] = _recertify(
                          certificate.domain_guard_certificate,
                          domain,
                          certificates[domain],
                          threshold_selection_group_ids=("calibration-dynamic-0",),
                      )
                  with pytest.raises(
                      ValueError,
                      match="calibration and threshold-selection",
                  ):
                      DomainGuardHarmRiskCertificateV1(
                          domain_guard_certificate=(
                              certificate.domain_guard_certificate
                          ),
                          domain_certificates=certificates,
                          family_confidence_level=0.95,
                      )

                  certificates = dict(certificate.domain_certificates)
                  for domain in certificate.supported_domains:
                      certificates[domain] = _recertify(
                          certificate.domain_guard_certificate,
                          domain,
                          certificates[domain],
                          certification_partition_id=CALIBRATION_PARTITION_ID,
                      )
                  with pytest.raises(ValueError, match="partitions must be distinct"):
                      DomainGuardHarmRiskCertificateV1(
                          domain_guard_certificate=(
                              certificate.domain_guard_certificate
                          ),
                          domain_certificates=certificates,
                          family_confidence_level=0.95,
                      )


              def test_composite_rejects_threshold_selection_roster_drift() -> None:
                  certificate = _certificate()
                  certificates = dict(certificate.domain_certificates)
                  certificates["oscillatory"] = _recertify(
                      certificate.domain_guard_certificate,
                      "oscillatory",
                      certificates["oscillatory"],
                      threshold_selection_group_ids=("threshold-selection-2",),
                  )

                  with pytest.raises(
                      ValueError,
                      match="threshold_selection_group_ids",
                  ):
                      DomainGuardHarmRiskCertificateV1(
                          domain_guard_certificate=(
                              certificate.domain_guard_certificate
                          ),
                          domain_certificates=certificates,
                          family_confidence_level=0.95,
                      )
              '''
          )
          tests.write_text(text.rstrip() + "\n\n" + addition.lstrip(), encoding="utf-8")
          PY
          python -m pip install "ruff==0.16.2"
          python -m ruff format \
            src/bayesian_phystwin/guard_harm_risk_domains.py \
            tests/test_guard_harm_risk_domains.py
          python -m ruff format --check \
            src/bayesian_phystwin/guard_harm_risk_domains.py \
            tests/test_guard_harm_risk_domains.py
          rm .github/workflows/domain-harm-risk-disjointness-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayesian_phystwin/guard_harm_risk_domains.py \
            tests/test_guard_harm_risk_domains.py \
            .github/workflows/domain-harm-risk-disjointness-fix.yml
          git diff --cached --check
          git commit -m "Enforce complete domain harm-risk evidence separation"
          git push origin "HEAD:${HEAD_BRANCH}"
