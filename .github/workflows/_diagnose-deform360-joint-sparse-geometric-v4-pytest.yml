name: Diagnose Deform360 geometric v4 pytest

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/_diagnose-deform360-joint-sparse-geometric-v4-pytest.yml

permissions:
  contents: read

concurrency:
  group: diagnose-deform360-joint-sparse-geometric-v4-pytest
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact reviewed head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development environment
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Run focused tests and retain complete diagnostics
        id: pytest
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          output="geometric-v4-pytest-diagnostics.txt"
          python -m pytest -vv --tb=long -p no:cacheprovider \
            tests/test_deform360_joint_sparse_geometric_v4.py \
            tests/test_deform360_joint_sparse_geometric_v4_workflow.py \
            tests/test_deform360_joint_sparse_observability_v4.py \
            tests/test_deform360_joint_sparse_observability_v4_cli.py \
            tests/test_pull_request_workflow_integrity.py \
            2>&1 | tee "${output}"
          status="${PIPESTATUS[0]}"
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          exit "${status}"
      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: geometric-v4-pytest-diagnostics-${{ github.run_id }}
          path: geometric-v4-pytest-diagnostics.txt
          if-no-files-found: error
          retention-days: 7
      - name: Enforce pytest result
        if: always()
        run: test "${{ steps.pytest.outputs.exit_code }}" = "0"
