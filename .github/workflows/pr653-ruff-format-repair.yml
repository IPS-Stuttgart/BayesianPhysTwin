name: PR 653 Ruff format repair

on:
  push:
    branches:
      - feature/full-covariance-dynamic-endpoint-v3

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/full-covariance-dynamic-endpoint-v3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Apply repository Ruff formatter and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "ruff==0.16.3"
          python -m ruff format \
            src/bayesian_phystwin/_dynamic_endpoint_contract.py \
            src/bayesian_phystwin/_full_covariance_dynamic_endpoint_v3.py \
            tests/test_horizon_conditioned_discrepancy_full_covariance_v3_adversarial.py \
            tests/test_horizon_conditioned_discrepancy_full_covariance_v3_prediction.py
          git rm .github/workflows/pr653-ruff-format-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bayesian_phystwin/_dynamic_endpoint_contract.py \
            src/bayesian_phystwin/_full_covariance_dynamic_endpoint_v3.py \
            tests/test_horizon_conditioned_discrepancy_full_covariance_v3_adversarial.py \
            tests/test_horizon_conditioned_discrepancy_full_covariance_v3_prediction.py
          git commit -m "Apply Ruff formatting to full-covariance v3"
          git push origin HEAD:feature/full-covariance-dynamic-endpoint-v3
