name: Finalize residual-history test and coverage gates once

on:
  push:
    branches:
      - agent/deform360-covariance-residual-history-dry-run-v1

permissions:
  contents: write

concurrency:
  group: finalize-residual-history-gates-once
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/deform360-covariance-residual-history-dry-run-v1
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Apply exact test and coverage ownership fixes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python - <<'PY'
          from pathlib import Path

          test_path = Path(
              "tests/test_deform360_covariance_residual_history_contract_edges_v1.py"
          )
          test_text = test_path.read_text(encoding="utf-8")
          old = '        _integer_vector([], name="indices")\n'
          new = (
              '        _integer_vector(\n'
              '            np.array([], dtype=np.int64), name="indices"\n'
              '        )\n'
          )
          old_count = test_text.count(old)
          new_count = test_text.count(new)
          if old_count == 1 and new_count == 0:
              test_text = test_text.replace(old, new)
          elif old_count != 0 or new_count != 1:
              raise SystemExit("unexpected empty integer-vector test state")
          test_path.write_text(test_text, encoding="utf-8")

          manifest_path = Path(".github/quality/test-suites.json")
          manifest_text = manifest_path.read_text(encoding="utf-8")
          anchor = '      "tests/test_deform360_contact_anchor.py",\n'
          additions = (
              '      "tests/test_deform360_covariance_residual_history_contract_edges_v1.py",\n'
              '      "tests/test_deform360_covariance_residual_history_real_camera_roster_v1.py",\n'
              '      "tests/test_deform360_covariance_residual_history_v1.py",\n'
          )
          if manifest_text.count(anchor) != 2:
              raise SystemExit("expected the contact-anchor entry in exactly two suites")
          present = tuple(manifest_text.count(item) for item in additions)
          if present == (0, 0, 0):
              first = manifest_text.index(anchor) + len(anchor)
              manifest_text = manifest_text[:first] + additions + manifest_text[first:]
          elif present != (1, 1, 1):
              raise SystemExit(f"invalid residual-history suite state: {present}")
          manifest_path.write_text(manifest_text, encoding="utf-8")
          PY

      - name: Validate focused fixes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1"
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m ruff check \
            tests/test_deform360_covariance_residual_history_contract_edges_v1.py
          python -m ruff format --check \
            tests/test_deform360_covariance_residual_history_contract_edges_v1.py
          python tools/quality/test_suite_manifest.py validate --json
          python -m pytest -q \
            tests/test_deform360_covariance_residual_history_contract_edges_v1.py \
            tests/test_deform360_covariance_residual_history_real_camera_roster_v1.py \
            tests/test_deform360_covariance_residual_history_v1.py

      - name: Publish exact fixes when needed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          manifest=.github/quality/test-suites.json
          test_file=tests/test_deform360_covariance_residual_history_contract_edges_v1.py
          git diff --check
          unexpected="$(git status --short | awk '{print $2}' | grep -Ev "^(${manifest}|${test_file})$" || true)"
          test -z "${unexpected}"
          if git diff --quiet -- "${manifest}" "${test_file}"; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- "${manifest}" "${test_file}"
          git commit -m "Fix residual-history test and coverage gates"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" push \
            origin HEAD:refs/heads/agent/deform360-covariance-residual-history-dry-run-v1
