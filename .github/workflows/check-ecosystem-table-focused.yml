name: Check ecosystem compatibility table focused

on:
  pull_request:
    branches:
      - agent/ecosystem-compatibility-table-v1
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  focused:
    if: >-
      github.event.pull_request.head.ref ==
      'agent/check-ecosystem-table-focused'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact target branch
        uses: actions/checkout@v7
        with:
          ref: agent/ecosystem-compatibility-table-v1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install focused validation environment
        run: python -m pip install -e ".[dev]" coverage

      - name: Validate typing, tests, and focused coverage
        shell: bash
        run: |
          set -euo pipefail
          python -m mypy src/bayesian_phystwin/ecosystem_compatibility_v1.py
          coverage run --branch -m pytest -q \
            tests/test_ecosystem_compatibility_v1.py
          coverage report -m \
            --include=src/bayesian_phystwin/ecosystem_compatibility_v1.py
