name: Temporary prepare PR 260 formatted source

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]
    paths:
      - ".github/workflows/_temporary_prepare_pr260_formatted_source.yml"
      - ".github/workflows/tests.yml"
      - "src/bayesian_phystwin/deform360_calibration_visual_production_plan.py"
      - "scripts/science/build_deform360_calibration_visual_production_plan.py"
      - "tests/test_deform360_calibration_visual_production_plan.py"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: temporary-prepare-pr260-formatted-source
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'IPS-Stuttgart/BayesianPhysTwin' &&
      github.event.pull_request.number == 260 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref ==
        'feat/deform360-calibration-visual-production-plan-v1' &&
      github.event.pull_request.user.login == 'FlorianPfaff'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install exact quality environment
        run: |
          python -m pip install -e ".[dev,graph]"
          python -m pip install "coverage==7.13.3"
          python -m pip check

      - name: Format product source and register focused coverage
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/bayesian_phystwin/deform360_calibration_visual_production_plan.py
            scripts/science/build_deform360_calibration_visual_production_plan.py
            tests/test_deform360_calibration_visual_production_plan.py
          )
          python -m ruff check --fix "${files[@]}"
          python -m ruff format "${files[@]}"
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/tests.yml")
          source = path.read_text(encoding="utf-8")
          entry = "            tests/test_deform360_calibration_visual_production_plan.py \\\n"
          if entry not in source:
              anchor = "            tests/test_deform360_visual_provider_lock.py \\\n"
              if source.count(anchor) != 1:
                  raise SystemExit("stable-core coverage anchor changed")
              source = source.replace(anchor, anchor + entry)
          path.write_text(source, encoding="utf-8")
          PY
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          git diff --check

      - name: Run focused contracts and measure new-module coverage
        shell: bash
        run: |
          set -euo pipefail
          python -m coverage run --branch \
            --source=bayesian_phystwin.deform360_calibration_visual_production_plan \
            -m pytest -q \
              tests/test_deform360_calibration_visual_production_plan.py \
              tests/test_deform360_calibration_observability_batch.py \
              tests/test_deform360_calibration_observability_case_builder.py \
              tests/test_deform360_calibration_source_run_record.py \
              tests/test_deform360_visual_provider_lock.py
          python -m coverage report --show-missing
          python -m coverage json -o pr260-module-coverage.json
          python -W error::SyntaxWarning -m py_compile \
            src/bayesian_phystwin/deform360_calibration_visual_production_plan.py \
            scripts/science/build_deform360_calibration_visual_production_plan.py \
            tests/test_deform360_calibration_visual_production_plan.py

      - name: Stage exact formatted source artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact="${RUNNER_TEMP}/pr260-formatted-source"
          mkdir -p \
            "${artifact}/.github/workflows" \
            "${artifact}/src/bayesian_phystwin" \
            "${artifact}/scripts/science" \
            "${artifact}/tests"
          cp .github/workflows/tests.yml "${artifact}/.github/workflows/tests.yml"
          cp src/bayesian_phystwin/deform360_calibration_visual_production_plan.py \
            "${artifact}/src/bayesian_phystwin/deform360_calibration_visual_production_plan.py"
          cp scripts/science/build_deform360_calibration_visual_production_plan.py \
            "${artifact}/scripts/science/build_deform360_calibration_visual_production_plan.py"
          cp tests/test_deform360_calibration_visual_production_plan.py \
            "${artifact}/tests/test_deform360_calibration_visual_production_plan.py"
          cp pr260-module-coverage.json "${artifact}/pr260-module-coverage.json"
          (
            cd "${artifact}"
            sha256sum \
              .github/workflows/tests.yml \
              src/bayesian_phystwin/deform360_calibration_visual_production_plan.py \
              scripts/science/build_deform360_calibration_visual_production_plan.py \
              tests/test_deform360_calibration_visual_production_plan.py \
              pr260-module-coverage.json \
              > SHA256SUMS
          )
          printf 'source_head=%s\n' \
            "${{ github.event.pull_request.head.sha }}" > "${artifact}/SOURCE"

      - name: Upload formatted source artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pr260-formatted-source
          path: ${{ runner.temp }}/pr260-formatted-source
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
