# workflow-lifecycle: experimental
# workflow-owner: IPS-Stuttgart maintainers
name: DEFORM GP residual source-only pilot v1
on:
  push:
    branches: [science/deform-gp-residual-pilot-v1]
    paths: [.github/requests/deform-gp-residual-pilot-v1.json]
permissions:
  contents: read
concurrency:
  group: deform-gp-residual-pilot-v1
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: [self-hosted, gpuserver6000]
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.10'
      - name: Source-only GP comparison
        shell: bash
        run: |
          set -euo pipefail
          export GP_OUTPUT="$RUNNER_TEMP/deform-gp-pilot-$GITHUB_RUN_ID"
          mkdir -p "$GP_OUTPUT"
          echo "GP_OUTPUT=$GP_OUTPUT" >> "$GITHUB_ENV"
          python - <<'PY'
          import json
          from pathlib import Path
          request=json.loads(Path('.github/requests/deform-gp-residual-pilot-v1.json').read_text())
          assert request['official_eval_read'] is False
          assert request['new_data_collection'] is False
          assert request['dataset_mutation'] is False
          print('REQUEST', json.dumps(request, sort_keys=True))
          PY
          bash experiments/deform_gp_residual_pilot_v1/run.sh "$GP_OUTPUT"
      - name: Retain pilot evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: deform-gp-residual-pilot-v1-${{ github.run_id }}
          path: ${{ env.GP_OUTPUT }}/
          if-no-files-found: warn
          retention-days: 90
