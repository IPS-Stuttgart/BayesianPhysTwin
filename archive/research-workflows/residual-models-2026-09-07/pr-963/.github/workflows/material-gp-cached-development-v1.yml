# workflow-lifecycle: experimental
# workflow-owner: IPS-Stuttgart maintainers
name: Material GP cached development v1
on:
  push:
    branches: [experiment/material-gp-development-20260907]
    paths: [.github/workflows/material-gp-cached-development-v1.yml]
permissions:
  contents: read
concurrency:
  group: material-gp-cached-development-v1
  cancel-in-progress: false
jobs:
  cached-development:
    runs-on: [self-hosted, gpuserver6000]
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    env:
      OPENBLAS_NUM_THREADS: '4'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      RESULT_ROOT: /home/github-runner/.cache/workflows/material-gp-cached-development-v1/runs/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.10'
      - name: Set up isolated CPU GP dependencies and test original algebra
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RESULT_ROOT"
          python -m venv "$RESULT_ROOT/venv"
          "$RESULT_ROOT/venv/bin/python" -m pip install numpy==1.24.3 scipy==1.15.3 pytest==8.3.5
          test "$(git rev-parse HEAD:scripts/experiments/material_gp_development_v1.py)" = 9b9399c236c40f4902735c312e452d3fc8eca022
          "$RESULT_ROOT/venv/bin/python" -m pytest -q tests/test_material_gp_development_v1.py 2>&1 | tee "$RESULT_ROOT/tests.log"
      - name: Verify original fit and validation cache without replay or source-test access
        shell: bash
        run: |
          set -euo pipefail
          "$RESULT_ROOT/venv/bin/python" scripts/experiments/material_gp_import_cache_v1.py \
            --cache-root /home/github-runner/.cache/bpt-gp-residual-pilot-v1 \
            --output-root "$RESULT_ROOT/data" 2>&1 | tee "$RESULT_ROOT/import.log"
      - name: Cancel only this experiment's superseded queued replay
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          base = 'https://api.github.com/repos/IPS-Stuttgart/BayesianPhysTwin/actions/runs/34052887563'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          request = urllib.request.Request(base, headers=headers)
          with urllib.request.urlopen(request) as response:
              record = json.load(response)
          assert record['head_branch'] == 'experiment/material-gp-development-20260907'
          assert record['head_sha'] == '5cbf21a5478c11305b62e4b50015d8af45b88b93'
          if record['status'] == 'queued':
              request = urllib.request.Request(base + '/cancel', headers=headers, data=b'', method='POST')
              with urllib.request.urlopen(request) as response:
                  print('Cancelled own superseded queued replay', response.status)
          else:
              print('No cancellation: original replay status is', record['status'])
          PY
      - name: Run unchanged matched material GP comparison
        shell: bash
        run: |
          set -euo pipefail
          "$RESULT_ROOT/venv/bin/python" scripts/experiments/material_gp_development_v1.py \
            --data "$RESULT_ROOT/data/development.npz" --output-root "$RESULT_ROOT/comparison" \
            2>&1 | tee "$RESULT_ROOT/comparison.log"
      - name: Retain verification, means, uncertainty and complete candidate bank
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: material-gp-cached-development-${{ github.run_id }}
          path: |
            ${{ env.RESULT_ROOT }}/*.log
            ${{ env.RESULT_ROOT }}/data/*.json
            ${{ env.RESULT_ROOT }}/comparison/
          if-no-files-found: error
          retention-days: 30
