# workflow-lifecycle: permanent
# workflow-owner: IPS-Stuttgart maintainers
name: DP residual source screen v1

on:
  pull_request:
    paths:
      - ".github/workflows/dp-residual-source-screen-v1.yml"
      - "experiments/dp_residual_source_screen_v1/**"
      - "tests/test_dp_residual_source_screen_v1.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: dp-residual-source-screen-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      SOURCE_ARTIFACT_ID: "9787311310"
      SOURCE_ARTIFACT_SHA256: "fdb35f680e4cf685303f841b8974c16eb9301ad52cbdc8f5af0d87a9dfc358ee"
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true

      - name: Set up matching Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install pinned experiment dependencies
        run: |
          set -euo pipefail
          python -m pip install -e . \
            "numpy==2.3.5" "scipy==1.17.0" "scikit-learn==1.8.0" \
            "pytest==8.4.2" "ruff==0.14.14"
          python -m pip check

      - name: Check information boundaries and numerical identities
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_dp_residual_source_screen_v1.py

      - name: Download only the immutable training-source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dp-source"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/IPS-Stuttgart/BayesianPhysTwin/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            > "$RUNNER_TEMP/dp-source.zip"
          echo "${SOURCE_ARTIFACT_SHA256}  $RUNNER_TEMP/dp-source.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/dp-source.zip" -d "$RUNNER_TEMP/dp-source"

      - name: Reproduce grouped five-fold source-only comparison
        run: |
          set -euo pipefail
          python -m experiments.dp_residual_source_screen_v1.run \
            --source-dir "$RUNNER_TEMP/dp-source" \
            --output "$RUNNER_TEMP/dp-screen" --folds 5
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "dp-screen" / "summary.json"
          result = json.loads(path.read_text())
          assert result["protocol"]["official_evaluation_read"] is False
          assert result["protocol"]["is_native_deform_hybrid"] is False
          assert len(result["records"]) == 10
          for values in result["methods"].values():
              assert values["trajectory_count"] == 112
          print("VERIFIED_SOURCE_SCREEN", json.dumps(result["dp_contrasts"], sort_keys=True))
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a") as handle:
              handle.write("## Source-only DP residual screen\n\n")
              handle.write("Normalized errors are percentages of endpoint span, not millimetres.\n\n")
              handle.write("| Model | Normalized RMSE | Normalized L1 |\n|---|---:|---:|\n")
              for name, values in result["methods"].items():
                  handle.write(f"| {name} | {values['nrmse_percent_span']:.6f} | {values['nl1_percent_span']:.6f} |\n")
              handle.write("\n" + result["claim_boundary"] + "\n")
          PY

      - name: Retain formatter diagnostics without modifying executed source
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/dp-screen"
          python -m ruff format --diff \
            experiments/dp_residual_source_screen_v1/run.py \
            tests/test_dp_residual_source_screen_v1.py \
            > "$RUNNER_TEMP/dp-screen/formatting.patch" || true
          python -m ruff check \
            experiments/dp_residual_source_screen_v1/run.py \
            tests/test_dp_residual_source_screen_v1.py \
            > "$RUNNER_TEMP/dp-screen/lint.txt" || true

      - name: Upload source-only evidence and prediction seals
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: dp-residual-source-screen-v1-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/dp-screen
            experiments/dp_residual_source_screen_v1/run.py
            tests/test_dp_residual_source_screen_v1.py
          if-no-files-found: error
          retention-days: 90
