# workflow-lifecycle: one-shot
# workflow-owner: IPS-Stuttgart maintainers
name: Generate support-robust phase diagram v1c

on:
  push:
    branches: [science/exact-support-robust-phase-diagram-v1]
    paths:
      - ".github/requests/generate-support-robust-phase-diagram-v1c.json"

permissions:
  contents: write

concurrency:
  group: generate-support-robust-phase-diagram-v1c
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 2
          clean: true
      - name: Authorize one add-only recovery request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          test "${PUSH_FORCED}" = false
          mapfile -t changed < <(git diff --name-status "${BEFORE_SHA}" "${GITHUB_SHA}")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = $'A\t.github/requests/generate-support-robust-phase-diagram-v1c.json'
          python - <<'PY'
          import json
          from pathlib import Path

          request = json.loads(Path(
              ".github/requests/generate-support-robust-phase-diagram-v1c.json"
          ).read_text(encoding="utf-8"))
          expected = {
              "schema": "bayesian-phystwin/generate-support-robust-phase-diagram-request-v1",
              "request_id": "generate-support-robust-phase-diagram-v1c-20260902",
              "supersedes_failed_launcher": "generate-support-robust-phase-diagram-v1b",
              "failure_scope": "commit-pathspec-only",
              "scientific_change_from_v1b": False,
              "maximum_support_miss_probability": 0.25,
              "regret_tolerance": 0.25,
              "epsilon_grid_used": False,
              "paper_claim_authorized": False,
          }
          if request != expected:
              raise SystemExit("phase-diagram recovery request changed")
          PY
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install focused dependencies
        run: python -m pip install numpy==1.26.4 pytest ruff==0.14.14
      - name: Reproduce exact scientific checks and result
        env:
          PYTHONPATH: src:.
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format \
            src/bayesian_phystwin/support_robust_phase_diagram_v1.py \
            experiments/support_robust_phase_diagram_v1/run.py \
            tests/test_support_robust_phase_diagram_v1.py
          python -m ruff check \
            src/bayesian_phystwin/support_robust_phase_diagram_v1.py \
            experiments/support_robust_phase_diagram_v1/run.py \
            tests/test_support_robust_phase_diagram_v1.py
          python -m pytest -q \
            tests/test_deform_dlo_act_sense_fallback_certificate_v1.py \
            tests/test_support_robust_act_sense_fallback_certificate_v1.py \
            tests/test_support_robust_act_sense_fallback_mechanism_v1.py \
            tests/test_support_robust_phase_diagram_v1.py
          python -m experiments.support_robust_phase_diagram_v1.run --write
          python -m experiments.support_robust_phase_diagram_v1.run --check
          python -m py_compile \
            src/bayesian_phystwin/support_robust_phase_diagram_v1.py \
            experiments/support_robust_phase_diagram_v1/run.py
          git diff --check
      - name: Retire all phase generators and commit exact evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archive/github-actions/retired-one-shot-v1
          cp .github/workflows/generate-support-robust-phase-diagram-v1c.yml \
            archive/github-actions/retired-one-shot-v1/generate-support-robust-phase-diagram-v1.yml
          rm -f \
            .github/workflows/generate-support-robust-phase-diagram-v1.yml \
            .github/workflows/generate-support-robust-phase-diagram-v1b.yml \
            .github/workflows/generate-support-robust-phase-diagram-v1c.yml \
            .github/requests/generate-support-robust-phase-diagram-v1b.json \
            .github/requests/generate-support-robust-phase-diagram-v1c.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Record exact support-robust Act-Sense-Fallback phases'
          git push origin HEAD:science/exact-support-robust-phase-diagram-v1
