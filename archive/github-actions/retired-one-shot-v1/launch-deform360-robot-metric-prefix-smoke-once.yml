name: Launch reviewed Deform360 public robot metric-prefix smoke once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/launch-deform360-robot-metric-prefix-smoke-once.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: launch-deform360-robot-metric-prefix-smoke-once
  cancel-in-progress: false

jobs:
  execute:
    name: Execute frozen public calibration-source smoke
    uses: ./.github/workflows/deform360-robot-metric-prefix-smoke.yml
    with:
      execute_authorized: true
    secrets: inherit

